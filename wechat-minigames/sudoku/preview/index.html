<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>逻辑谜题 · 本地 Canvas 预览（不是微信真机）</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; min-height: 100%;
      background: #0c0a18;
      color: #eee;
      font-family: "PingFang SC", "Noto Sans CJK SC", "Noto Sans SC", sans-serif;
    }
    .banner {
      position: sticky; top: 0; z-index: 3;
      background: #7a3b00; color: #fff8e8;
      padding: 8px 14px; font-size: 13px; line-height: 1.5; text-align: center;
    }
    .stage { display: flex; flex-direction: column; align-items: center; padding: 16px 12px 32px; }
    #phone {
      width: min(390px, 100%);
      height: min(844px, calc(100vh - 180px));
      min-height: 560px;
      background: #000;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(0,0,0,.55);
      position: relative;
    }
    #game { width: 100%; height: 100%; display: block; touch-action: none; }
    .note {
      max-width: 520px; margin: 18px auto 0;
      font-size: 13px; line-height: 1.7; color: #b9b6c9;
    }
    .note code { color: #ffd54f; }
  </style>
</head>
<body>
  <div class="banner">这是本地 Canvas 预览适配器，用来看「逻辑谜题」（数独、数岛搭桥、围圈数谜）的布局和玩法。浏览器跑通不代表已在微信开发者工具或真机验证。</div>
  <div class="stage">
    <div id="phone"><canvas id="game" width="390" height="844"></canvas></div>
  </div>
  <p class="note">
    把 <code>wechat-minigames/sudoku</code> 整个目录导入微信开发者工具（编译类型选小游戏）。
    <code>project.config.json</code> 里的 <code>touristappid</code> 只是游客占位，请换成你自己的 AppID 后再提审。本页不会登录或上传微信。
  </p>
  <script src="/src/sudoku-app.js"></script>
  <script src="/src/levels-data.js"></script>
  <script src="/src/app.js"></script>
  <script src="/preview/platform-preview.js"></script>
  <script src="/preview/boot.js"></script>
</body>
</html>
