<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{display:flex;justify-content:center;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.wrap{width:100%;max-width:480px;height:100%;padding:12px;display:flex;flex-direction:column;align-items:center;gap:10px}

.stagebox{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}

.overlay{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;z-index:20;padding:24px;text-align:center}

.rowbtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:100%}
#tutStep{font-size:12px;opacity:.7}
#toast{position:fixed;left:50%;top:16%;transform:translate(-50%,-10px);background:rgba(10,8,30,.88);color:#fff;font-weight:800;padding:10px 18px;border-radius:999px;z-index:999;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;font-size:15px;box-shadow:0 0 18px rgba(255,61,154,.5);white-space:nowrap}

.hidden{display:none!important}

.tray{width:100%;display:flex;gap:6px}
.tray .pc{flex:1;min-height:56px;padding:2px!important;font-size:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.tray .pc small{font-size:11px;font-weight:900;margin-top:2px}
.tray .pc.on{outline:3px solid #fff;outline-offset:-3px}
.tray #runBtn{flex:1.4;font-size:18px;min-height:56px}
.hint2{font-size:12px;color:#fff;font-weight:700;text-align:center;min-height:16px;text-shadow:0 1px 2px rgba(0,0,0,.4)}
</style>
<!-- GAME UI BEGIN -->
<style>
:root{--page:#eee1c7;--surface:#fff7e7;--soft:#e5d1ab;--ink:#302d23;--muted:#70654d;--accent:#3f5b43;--on-accent:#ffffff;--line:#bea77a;--stage:#654e31;--page:#f0803c;--surface:#fff7e6;--soft:#fce3c0;--ink:#4a2a12;--muted:#7f5b3a;--accent:#246f39;--on-accent:#ffffff;--line:#f1a54f;--b-bg1:#ffcf6b;--b-bg2:#f0803c;--b-btn:#3fc163;--b-btn-hi:#82d79a;--b-edge:#22863d;--b-glow:#ffe08a;--b-glow-rgb:255,224,138;--b-pedge-rgb:241,165,79;--b-btn-ink:#124620;--b-btn-tsh:0 1px 0 rgba(255,255,255,.45);--b-coin-ink:#124620;--b-coin-tsh:none;--b-key-ink:#246f39;--b-title:#1d7234}

.game-ui :is(.iconbtn,.iconBtn,.icobtn,.ibtn,.tbtn,.hbtn,.ib,.iconBtn,.pause){min-width:44px;min-height:44px;flex-shrink:0;border-radius:12px;background:var(--soft);color:var(--ink);border:1px solid var(--line);box-shadow:none;font-size:17px}

.game-ui .ui-panel{width:min(100%,380px);max-height:100%;overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:18px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:24px;padding:30px 24px;box-shadow:0 8px 0 var(--soft),0 20px 48px #15253618;text-align:center;margin:auto}

.game-ui body>.wrap>canvas:not(#fx){background-color:var(--stage);box-shadow:0 0 0 1px var(--line),0 6px 0 var(--soft);border-radius:18px;flex-shrink:0}

.game-ui #hud{gap:6px;background:var(--surface);color:var(--ink)}
.game-ui #hud :is(.left,.t,.s,.grp,.pill){color:var(--ink)}
.game-ui #hud .pill{background:var(--surface);border-color:var(--line)}
.game-ui body canvas:is(#cv,#game,#board){background-color:var(--stage)}
.game-ui :is(button.dbtn,button.cbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.game-ui :is(button.lvl,button.lvlbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line);border-radius:12px;min-height:54px}

.game-ui .ui-panel .ui-assist-note{color:var(--accent);font-weight:700}

@media(max-width:360px){.game-ui body>.wrap{padding:10px;gap:10px}.game-ui .ui-panel{padding:22px 18px;gap:13px}.game-ui .ui-panel h1{font-size:26px}.game-ui .ui-emblem{width:70px;height:70px;font-size:38px}.game-ui :is(.topbar,#topbar){gap:5px;padding:8px}.game-ui :is(.iconbtn,.icobtn,.ibtn,.tbtn,.ib){min-width:44px;min-height:44px}}
@media(max-height:650px){.game-ui .ui-panel{padding:18px;gap:12px}.game-ui .ui-emblem{width:60px;height:60px;font-size:32px}.game-ui .ui-panel h1{font-size:25px}.game-ui .ui-panel :is(p,.howto,.sub,.rule){font-size:13px}}

/* 2026-10-20 热修：开局/结算遮罩铺满整屏，主按钮固定在面板底部，避免被画布尺寸裁切（#10） */
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv):has(>.ui-panel){position:fixed;inset:0;z-index:1000;border-radius:0;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}

 LEVELS.forEach((lv,i)=>{const b=document.createElement('button');b.className='lvl';const open=i===0||(save.stars[i-1]||0)>0||(save.stars[i]||0)>0;b.disabled=!open;b.innerHTML=(open?i+1:'🔒')+'<small>'+(open?starStr(save.stars[i]||0):'')+'</small>';b.onclick=()=>{tone(660,.08,'triangle');startLevel(i);};g.appendChild(b);});show('lvlScr',true);}
function startLevel(i){li=i;L=LEVELS[i];placed=[];sel=null;ball=null;tries=0;hintN=0;result=null;state='edit';['lvlScr','overScr','pauseOv','startScr'].forEach(k=>show(k,false));fit();renderTray();hud();if(L.tip)toast(L.tip,2600);}
function invLeft(k){return(L.inv[k]||0)-placed.filter(p=>p.k===k).length;}
function renderTray(){const t=$('tray');t.innerHTML='';for(const k in PIECES){if(!L.inv[k])continue;const b=document.createElement('button');b.className='pc ghost'+(sel===k?' on':'');b.innerHTML=PIECES[k].a+'<small>×'+invLeft(k)+'</small>';b.setAttribute('aria-label',PIECES[k].n);b.onclick=()=>{if(state!=='edit')return;sel=sel===k?null:k;tone(600,.05,'triangle');renderTray();};t.appendChild(b);}
 const r=document.createElement('button');r.className='btn';r.id='runBtn';r.textContent=state==='run'?'⏹ 停止':'▶ 发射';r.onclick=()=>{state==='run'?stopRun():run();};t.appendChild(r);}
function hud(){$('lvT').textContent=li+1;$('score').textContent=save.stars.reduce((a,b)=>a+(b||0),0);$('tryT').textContent='尝试 '+tries;}
// ---------- 物理 ----------
function segs(){const out=[];for(const w of L.w)out.push({a:w,r:3,e:.35,f:.9992});
 for(const p of placed){if(p.k==='plank'||p.k==='spring'){const len=p.k==='plank'?PL:SPL,c=Math.cos(p.ang),s=Math.sin(p.ang);out.push({a:[p.x-c*len/2,p.y-s*len/2,p.x+c*len/2,p.y+s*len/2],r:4,e:p.k==='spring'?1.05:.3,spring:p.k==='spring',f:.9995,pc:p});}}
 // 奖杯
 const [gx,gy]=L.g;out.push({a:[gx-22,gy-18,gx-18,gy+12],r:3,e:.2,f:.98},{a:[gx+22,gy-18,gx+18,gy+12],r:3,e:.2,f:.98},{a:[gx-18,gy+12,gx+18,gy+12],r:3,e:.1,f:.9});
 return out;}
function circles(){const out=[];for(const p of L.p||[])out.push({x:p[0],y:p[1],r:p[2],e:.5});for(const p of placed)if(p.k==='bumper')out.push({x:p.x,y:p.y,r:14,e:1.25,bump:1,pc:p});return out;}
function simInit(){const s=L.s;return{x:s[0],y:s[1],vx:s[2]||0,vy:0,dead:0,win:0,t:0,inCup:0,portCd:0};}
function stepBall(b,dt,S,Cs,fans,ev){b.vy+=G*dt;
 for(const f of fans){const c=Math.cos(f.ang),s=Math.sin(f.ang);const dx=b.x-f.x,dy=b.y-f.y;const al=dx*c+dy*s,pp=Math.abs(-dx*s+dy*c);if(al>0&&al<150&&pp<26){const k=1100*(1-al/180);b.vx+=c*k*dt;b.vy+=s*k*dt;}}
 b.x+=b.vx*dt;b.y+=b.vy*dt;
 for(const sg of S){const [x1,y1,x2,y2]=sg.a;const dx=x2-x1,dy=y2-y1,l2=dx*dx+dy*dy||1;let t=((b.x-x1)*dx+(b.y-y1)*dy)/l2;t=t<0?0:t>1?1:t;const px=x1+dx*t,py=y1+dy*t;let nx=b.x-px,ny=b.y-py;const d=Math.hypot(nx,ny);const m=BR+sg.r;
  if(d<m&&d>0){nx/=d;ny/=d;b.x=px+nx*m;b.y=py+ny*m;const vn=b.vx*nx+b.vy*ny;if(vn<0){const tx=-ny,ty=nx;const vt=(b.vx*tx+b.vy*ty)*sg.f;let nvn=-vn*sg.e;if(sg.spring)nvn=Math.max(nvn,430);b.vx=tx*vt+nx*nvn;b.vy=ty*vt+ny*nvn;if(ev&&-vn>120)ev(sg.spring?'spring':'hit',-vn);}}}
 for(const c of Cs){const dx=b.x-c.x,dy=b.y-c.y,d=Math.hypot(dx,dy),m=BR+c.r;if(d<m&&d>0){const nx=dx/d,ny=dy/d;b.x=c.x+nx*m;b.y=c.y+ny*m;const vn=b.vx*nx+b.vy*ny;if(vn<0){b.vx-=(1+c.e)*vn*nx;b.vy-=(1+c.e)*vn*ny;if(c.bump){const sp=Math.hypot(b.vx,b.vy);if(sp<380){b.vx=b.vx/sp*380;b.vy=b.vy/sp*380;}}if(ev)ev(c.bump?'bump':'peg',-vn);}}}
 for(const k of L.k||[]){const [x1,y1,x2,y2]=k;const dx=x2-x1,dy=y2-y1,l2=dx*dx+dy*dy||1;let t=((b.x-x1)*dx+(b.y-y1)*dy)/l2;t=t<0?0:t>1?1:t;if(Math.hypot(b.x-(x1+dx*t),b.y-(y1+dy*t))<BR+4){b.dead='spike';}}
 if(L.pt&&b.portCd<=0){const [ax,ay,bx,by]=Array.isArray(L.pt[0])?L.pt[0]:L.pt;if(Math.hypot(b.x-ax,b.y-ay)<20){b.x=bx;b.y=by;b.portCd=.5;if(ev)ev('port');}else if(Math.hypot(b.x-bx,b.y-by)<20){b.x=ax;b.y=ay;b.portCd=.5;if(ev)ev('port');}}
 b.portCd-=dt;
 const sp=Math.hypot(b.vx,b.vy);if(sp>900){b.vx*=900/sp;b.vy*=900/sp;}
 const [gx,gy]=L.g;if(Math.abs(b.x-gx)<18&&b.y>gy-14&&b.y<gy+12){b.inCup+=dt;if(b.inCup>.25)b.win=1;}else b.inCup=0;
 if(b.x<-30||b.x>W+30||b.y>H+30)b.dead='out';b.t+=dt;if(b.t>14)b.dead='time';}
function simulate(pl,rec){const keep=placed;placed=pl;const S=segs(),Cs=circles(),fans=pl.filter(p=>p.k==='fan');const b=simInit();const got=new Set();let md=1e9;
 for(let i=0;i<14*240&&!b.dead&&!b.win;i++){stepBall(b,1/240,S,Cs,fans);md=Math.min(md,Math.hypot(b.x-L.g[0],b.y-L.g[1]));if(rec&&i%6===0)rec.push([Math.round(b.x),Math.round(b.y)]);(L.st||[]).forEach((s,j)=>{if(Math.hypot(b.x-s[0],b.y-s[1])<BR+10)got.add(j);});}placed=keep;return{win:b.win,stars:got.size,dead:b.dead,t:b.t,md};}
// ---------- 运行 ----------
let runS=null;
function run(){if(state!=='edit')return;state='run';sel=null;tries++;hud();ball=simInit();got=[];trail=[];runS={S:segs(),Cs:circles(),fans:placed.filter(p=>p.k==='fan')};renderTray();tone(520,.1,'triangle',.08,780);}
function stopRun(){state='edit';ball=null;renderTray();}
function ev(k,v){if(k==='spring')tone(300,.12,'sine',.08,700);else if(k==='bump')tone(700,.06,'square',.06,1100);else if(k==='port')tone(1300,.15,'sine',.06,400);else tone(200+Math.min(v,600)*.6,.03,'triangle',Math.min(.08,v/4000));}
function runStep(dt){const n=Math.round(dt*240);for(let i=0;i<n;i++){stepBall(ball,1/240,runS.S,runS.Cs,runS.fans,ev);(L.st||[]).forEach((s,j)=>{if(!got.includes(j)&&Math.hypot(ball.x-s[0],ball.y-s[1])<BR+10){got.push(j);tone(990+got.length*200,.1,'triangle',.08);if(FX)FX.burst(sparks,s[0],s[1],'#ffe066',14);}});if(ball.dead||ball.win)break;}
 trail.push([ball.x,ball.y]);if(trail.length>40)trail.shift();
 if(ball.win){state='done';const st=1+got.length>3?3:Math.max(1,got.length);const stars=Math.min(3,got.length===(L.st||[]).length?3:got.length>=1?2:1);win(stars);}
 else if(ball.dead){if(ball.dead==='spike'&&FX)FX.burst(sparks,ball.x,ball.y,'#ff3d6e',20);noise(.2,.12,1200);toast(ball.dead==='spike'?'弹珠被尖刺扎破了！':ball.dead==='time'?'弹珠卡住了':'弹珠掉出去了');state='edit';ball=null;renderTray();}}
function win(stars){if(stars>(save.stars[li]||0)){save.stars[li]=stars;Store.set('save',save);}hud();if(FX)FX.burst(sparks,L.g[0],L.g[1],'#ffcf33',40);
 tone(523,.12,'triangle');tone(659,.12,'triangle',.1,0,.12);tone(784,.25,'triangle',.1,0,.24);
 setTimeout(()=>{$('overH').textContent='🏆 第 '+(li+1)+' 关完成！';$('finalScore').textContent=starStr(stars);$('overText').textContent='收集星星 '+got.length+' / '+(L.st||[]).length+' · 尝试 '+tries+' 次'+(stars<3?' · 收集全部星星可得三星':'');$('nextBtn').classList.toggle('hidden',li>=LEVELS.length-1);show('overScr',true);},FAST?0:700);}
// ---------- 输入 ----------
function pieceAt(x,y){for(let i=placed.length-1;i>=0;i--){const p=placed[i];if(Math.hypot(p.x-x,p.y-y)<(p.k==='plank'?30:22))return p;}return null;}
cv.addEventListener('pointerdown',e=>{e.preventDefault();if(state!=='edit')return;const q=posOf(e,cv,W,H);const p=pieceAt(q.x,q.y);
 if(p){drag={p,ox:p.x-q.x,oy:p.y-q.y,sx:q.x,sy:q.y,moved:false};cv.setPointerCapture&&cv.setPointerCapture(e.pointerId);return;}
 if(sel&&invLeft(sel)>0){placed.push({k:sel,x:Math.round(q.x),y:Math.round(q.y),ang:sel==='fan'?-Math.PI/2:0});tone(500,.05,'square',.06,800);if(invLeft(sel)<=0)sel=null;renderTray();}
 else if(!sel)toast('先在下方选择一个零件');});
cv.addEventListener('pointermove',e=>{if(!drag)return;const q=posOf(e,cv,W,H);if(Math.hypot(q.x-drag.sx,q.y-drag.sy)>6)drag.moved=true;if(drag.moved){drag.p.x=Math.round(clamp(q.x+drag.ox,8,W-8));drag.p.y=Math.round(clamp(q.y+drag.oy,8,H-8));}});
cv.addEventListener('pointerup',e=>{if(!drag)return;const d=drag;drag=null;if(!d.moved){if(d.p.k==='bumper'){placed.splice(placed.indexOf(d.p),1);toast('已收回弹力球');renderTray();}else{d.p.ang+=Math.PI/8;tone(700,.04,'triangle',.05);}}
 else{const q=posOf(e,cv,W,H);if(q.y>H-12){placed.splice(placed.indexOf(d.p),1);renderTray();toast('已收回零件');}}});
cv.addEventListener('pointercancel',()=>{drag=null;});
// ---------- 绘制 ----------
let bgC=null,bgKey=-1;
function drawStatic(g){if(FX)FX.stage(g,W,H,'#ffd9a8','#ff9e7a');else{g.fillStyle='#ffc796';g.fillRect(0,0,W,H);}
 g.strokeStyle='rgba(255,255,255,.25)';g.lineWidth=1;for(let x=0;x<W;x+=30){g.beginPath();g.moveTo(x,0);g.lineTo(x,H);g.stroke();}for(let y=0;y<H;y+=30){g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke();}
 for(const w of L.w){g.lineCap='round';g.strokeStyle='rgba(0,0,0,.25)';g.lineWidth=10;g.beginPath();g.moveTo(w[0],w[1]+3);g.lineTo(w[2],w[3]+3);g.stroke();g.strokeStyle='#5b3a8a';g.lineWidth=8;g.beginPath();g.moveTo(w[0],w[1]);g.lineTo(w[2],w[3]);g.stroke();g.strokeStyle='#9b7ad8';g.lineWidth=3;g.beginPath();g.moveTo(w[0],w[1]-1.5);g.lineTo(w[2],w[3]-1.5);g.stroke();}
 for(const p of L.p||[]){if(FX)FX.orb(g,p[0],p[1],p[2],'#8a6fd1');else{g.fillStyle='#8a6fd1';g.beginPath();g.arc(p[0],p[1],p[2],0,7);g.fill();}}
 for(const k of L.k||[]){const [x1,y1,x2,y2]=k;const len=Math.hypot(x2-x1,y2-y1),n=Math.max(2,Math.round(len/10));const nx=-(y2-y1)/len,ny=(x2-x1)/len;g.fillStyle='#c0392b';for(let i=0;i<n;i++){const t0=i/n,t1=(i+1)/n,tm=(t0+t1)/2;g.beginPath();g.moveTo(x1+(x2-x1)*t0,y1+(y2-y1)*t0);g.lineTo(x1+(x2-x1)*tm-nx*9,y1+(y2-y1)*tm-ny*9);g.lineTo(x1+(x2-x1)*tm+nx*9,y1+(y2-y1)*tm+ny*9);g.closePath();g.fill();g.beginPath();g.moveTo(x1+(x2-x1)*t0,y1+(y2-y1)*t0);g.lineTo(x1+(x2-x1)*t1,y1+(y2-y1)*t1);g.lineTo(x1+(x2-x1)*tm+nx*9,y1+(y2-y1)*tm+ny*9);g.fill();}}
 const [gx,gy]=L.g;g.fillStyle='#ffcf33';g.strokeStyle='#a86a00';g.lineWidth=3;g.beginPath();g.moveTo(gx-24,gy-18);g.lineTo(gx-18,gy+14);g.lineTo(gx+18,gy+14);g.lineTo(gx+24,gy-18);g.stroke();
 g.fillStyle='rgba(255,207,51,.35)';g.fillRect(gx-18,gy-14,36,27);txt(g,'🏆',gx,gy+26,14);
 const s=L.s;g.fillStyle='#3d2a6b';rr(g,s[0]-16,s[1]-24,32,16,6);g.fill();txt(g,'▼',s[0],s[1]-16,10,'#ffe066');}
function draw(dt){if(!L){if(FX)FX.stage(ctx,W,H,'#ffd9a8','#ff9e7a');else{ctx.fillStyle='#ffc796';ctx.fillRect(0,0,W,H);}txt(ctx,'🔮',W/2,H/2,80);return;}
 if(bgKey!==li||!bgC){const d=FX?Math.max(1,Math.min(2.5,devicePixelRatio||1)):1;bgC=document.createElement('canvas');bgC.width=W*d;bgC.height=H*d;const g=bgC.getContext('2d');g.scale(d,d);drawStatic(g);bgKey=li;}
 ctx.drawImage(bgC,0,0,W,H);
 if(L.pt){const [ax,ay,bx,by]=Array.isArray(L.pt[0])?L.pt[0]:L.pt;const r=12+Math.sin(performance.now()/200)*2;for(const [x,y,c] of [[ax,ay,'#4fc3f7'],[bx,by,'#ff6bd6']]){if(FX)FX.glow(ctx,c,16);ctx.strokeStyle=c;ctx.lineWidth=4;ctx.beginPath();ctx.ellipse(x,y,r,r*1.2,0,0,7);ctx.stroke();if(FX)FX.noGlow(ctx);}}
 (L.st||[]).forEach((s,j)=>{if(got.includes(j)&&state!=='edit')return;const bob=Math.sin(performance.now()/300+j)*2;txt(ctx,'⭐',s[0],s[1]+bob,20);});
 for(const p of placed){const D=PIECES[p.k];ctx.save();ctx.translate(p.x,p.y);
  if(p.k==='plank'||p.k==='spring'){ctx.rotate(p.ang);const len=p.k==='plank'?PL:SPL;if(FX)FX.tile(ctx,-len/2,-5,len,10,p.k==='plank'?'#c98b4f':'#22c98a',4);else{ctx.fillStyle=D.c;ctx.fillRect(-len/2,-5,len,10);}if(p.k==='spring'){ctx.strokeStyle='#0b5d3f';ctx.lineWidth=1.5;for(let i=-20;i<=20;i+=8){ctx.beginPath();ctx.moveTo(i,-3);ctx.lineTo(i+4,3);ctx.stroke();}}}
  else if(p.k==='bumper'){if(FX)FX.orb(ctx,0,0,14,'#ff3d6e');else{ctx.fillStyle=D.c;ctx.beginPath();ctx.arc(0,0,14,0,7);ctx.fill();}}
  else if(p.k==='fan'){ctx.rotate(p.ang);ctx.fillStyle='rgba(127,227,255,.18)';ctx.beginPath();ctx.moveTo(8,-22);ctx.lineTo(150,-28);ctx.lineTo(150,28);ctx.lineTo(8,22);ctx.fill();
   const ph=performance.now()/90;ctx.strokeStyle='rgba(255,255,255,.6)';ctx.lineWidth=2;for(let i=0;i<4;i++){const d=((ph*8+i*36)%140)+12;ctx.beginPath();ctx.moveTo(d,-10);ctx.lineTo(d+10,-10);ctx.moveTo(d+5,8);ctx.lineTo(d+15,8);ctx.stroke();}
   if(FX)FX.tile(ctx,-12,-14,20,28,'#4a90c2',6);else{ctx.fillStyle='#4a90c2';ctx.fillRect(-12,-14,20,28);}}
  ctx.restore();}
 if(state==='edit'&&!ball){const s=L.s;ctx.globalAlpha=.6;if(FX)FX.orb(ctx,s[0],s[1],BR,'#e8eefc');ctx.globalAlpha=1;}
 if(ball){ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=3;ctx.beginPath();trail.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.stroke();if(FX){FX.shadow(ctx,ball.x+3,ball.y+BR,BR*.8,3);FX.orb(ctx,ball.x,ball.y,BR,'#e8eefc');}else{ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ball.x,ball.y,BR,0,7);ctx.fill();}}
 if(hintShow){for(const p of hintShow){ctx.save();ctx.globalAlpha=.45+.2*Math.sin(performance.now()/200);ctx.translate(p.x,p.y);ctx.strokeStyle='#fff';ctx.setLineDash([4,4]);ctx.lineWidth=2;if(p.k==='bumper'){ctx.beginPath();ctx.arc(0,0,14,0,7);ctx.stroke();}else{ctx.rotate(p.ang);const len=p.k==='plank'?PL:p.k==='spring'?SPL:28;ctx.strokeRect(-len/2,-5,len,10);}ctx.restore();}ctx.setLineDash([]);ctx.globalAlpha=1;}
 if(FX)FX.drawBurst(ctx,sparks);
 if(state==='edit'&&li===0&&!placed.length)otxt(ctx,'① 选下方 🪵 木板  ② 点击这里放置',W/2,250,13,'#fff');}
let hintShow=null;
$('hintBtn').onclick=()=>{if(!L||!L.sol)return;hintN=Math.min(L.sol.length,hintN+1);hintShow=L.sol.slice(0,hintN).map(([k,x,y,a])=>({k,x,y,ang:a*Math.PI/8}));toast('💡 虚线位置是参考摆法（'+hintN+'/'+L.sol.length+'）');};
$('resetBtn').onclick=()=>{if(state!=='edit')return;placed=[];hintShow=null;renderTray();tone(300,.08,'triangle');};
function pause(){if(state==='edit'||state==='run'){pstate=state;state='pause';show('pauseOv',true);}}let pstate='edit';
$('pauseBtn').onclick=pause;$('resumeBtn').onclick=()=>{show('pauseOv',false);state=pstate;last=performance.now();};$('menuBtn').onclick=()=>{show('pauseOv',false);openLevels();};
$('nextBtn').onclick=()=>{hintShow=null;startLevel(li+1);};$('againBtn').onclick=()=>{show('overScr',false);state='edit';ball=null;renderTray();};$('menu2Btn').onclick=openLevels;
function showTut(done){tutorial([
 ['🎯 目标','点 ▶ 发射，弹珠从 ▼ 处落下。让它最终停进 🏆 奖杯就过关；碰到 ⭐ 会收集，全部收集得三星。'],
 ['🧩 摆零件','先点下方的零件，再点画面放置。<b>点一下已放好的零件</b>可旋转 22.5°，<b>拖动</b>可移动，拖到最底部收回。'],
 ['🔧 零件特性','🪵 木板：普通斜面；🟩 弹簧：强力弹起；🔴 弹力球：加速反弹；🌬️ 风扇：持续吹动弹珠（点击旋转方向）。'],
 ['⚠ 机关','尖刺会扎破弹珠；两个传送门之间可以瞬移。卡关了就点 💡 看参考摆法，🧹 清空重来。']],done);}
$('howBtn').onclick=()=>{show('lvlScr',false);showTut(openLevels);};
$('startBtn').onclick=()=>{audio();show('startScr',false);if(!save.tut){showTut(()=>{save.tut=1;Store.set('save',save);startLevel(0);});}else openLevels();};
$('bestLine').textContent=save.stars.length?'已获得 ★'+save.stars.reduce((a,b)=>a+(b||0),0):'';
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
let last=performance.now(),FAST=false;
function frame(t){const dt=Math.min(.04,(t-last)/1000);last=t;if(state==='run'&&ball)runStep(dt);draw(dt);requestAnimationFrame(frame);}
fit();requestAnimationFrame(frame);
window.__mr={LEVELS,simulate,startLevel,setL:i=>{L=LEVELS[i];li=i;},get s(){return{state,li,placed:placed.length,tries}},place:(k,x,y,a)=>placed.push({k,x,y,ang:a*Math.PI/8}),run,setFast:v=>FAST=v};
</script>
