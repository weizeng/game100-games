<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>海马竞速</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
  html,body{width:100%;height:100%;background:#04141a;overflow:hidden;font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:#e0f7fa}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #stage{position:relative;width:100%;max-width:480px;height:100%;max-height:850px;background:linear-gradient(180deg,#06333b 0%,#042228 55%,#010d10 100%);overflow:hidden;box-shadow:0 0 40px rgba(0,131,143,.45)}
  .hud{position:absolute;top:8px;left:10px;right:10px;display:flex;justify-content:space-between;z-index:5;font-size:15px;text-shadow:0 2px 4px #000}
  .hud .pill{background:rgba(0,60,70,.8);border:1px solid rgba(130,220,230,.4);border-radius:20px;padding:5px 12px;font-weight:bold}
  .iconbtn{position:absolute;width:46px;height:46px;border-radius:50%;background:rgba(0,60,70,.85);border:1px solid rgba(130,220,230,.45);color:#e0f7fa;font-size:22px;display:flex;align-items:center;justify-content:center;z-index:6;cursor:pointer}
  #pauseBtn{top:52px;right:10px}
  #muteBtn{top:52px;right:64px}
  #laneWrap{position:absolute;top:100px;left:14px;right:14px}
  .lane{position:relative;height:86px;margin-bottom:10px;border-radius:14px;background:rgba(0,40,48,.55);border:1px solid rgba(120,200,210,.25);overflow:hidden}
  .lane .tag{position:absolute;left:8px;top:6px;font-size:12px;color:#b2ebf2;z-index:2}
  .racer{position:absolute;top:50%;font-size:44px;transform:translate(-50%,-50%);transition:left .18s ease-out;z-index:1}
  .finishline{position:absolute;right:26px;top:0;bottom:0;width:8px;background:repeating-linear-gradient(0deg,#fff 0 6px,#222 6px 12px);opacity:.85}
  #rhythmWrap{position:absolute;left:14px;right:14px;top:306px;z-index:5}
  #rhythmWrap .lbl{font-size:13px;color:#b2ebf2;margin-bottom:4px;text-shadow:0 1px 3px #000}
  #rhythmTrack{position:relative;height:22px;border-radius:11px;background:rgba(0,40,48,.7);border:1px solid rgba(120,200,210,.3);overflow:hidden}
  #rhythmSweet{position:absolute;top:0;bottom:0;background:rgba(105,240,174,.35);border-left:2px solid #69f0ae;border-right:2px solid #69f0ae}
  #rhythmCur{position:absolute;top:2px;bottom:2px;width:6px;border-radius:3px;background:#ffd54f;left:50%}
  #tip{position:absolute;left:14px;right:14px;top:352px;text-align:center;font-size:14px;color:#9fd8de;z-index:5}
  #btnRow{position:absolute;left:14px;right:14px;bottom:18px;display:flex;gap:14px;z-index:5}
  .ctl{flex:1;height:96px;font-size:44px;border-radius:22px;border:3px solid rgba(130,220,230,.5);background:linear-gradient(180deg,#0a5c66,#04444c);color:#e0f7fa;cursor:pointer;box-shadow:0 5px 0 #02262b,0 8px 18px rgba(0,0,0,.5);touch-action:none}
  .ctl:active,.ctl.hit{transform:translateY(4px);box-shadow:0 1px 0 #02262b}
  .ctl.bad{background:linear-gradient(180deg,#8c1d1d,#5c1212);border-color:#ef9a9a;animation:shake .3s}
  @keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  #stun{position:absolute;left:0;right:0;top:400px;text-align:center;font-size:18px;font-weight:bold;color:#ff8a80;z-index:5;text-shadow:0 2px 4px #000}
  .overlay{position:absolute;inset:0;background:rgba(2,12,15,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;text-align:center;padding:24px}
  .overlay h1{font-size:36px;margin-bottom:10px;text-shadow:0 0 18px rgba(80,200,210,.8)}
  .overlay p{font-size:15px;line-height:2;color:#b2ebf2;margin-bottom:12px;max-width:340px}
  .bigbtn{min-width:200px;min-height:56px;font-size:21px;font-weight:bold;border:none;border-radius:16px;background:linear-gradient(180deg,#00acc1,#006064);color:#fff;cursor:pointer;margin-top:8px;box-shadow:0 4px 0 #01373c,0 6px 16px rgba(0,0,0,.5)}
  .bigbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #01373c}
  .hidden{display:none!important}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <div class="hud">
    <div class="pill">⏱ <span id="time">0.0</span>s</div>
    <div class="pill">📏 <span id="dist">0</span>/100m</div>
    <div class="pill">🏆 <span id="hs">—</span></div>
  </div>
  <div id="muteBtn" class="iconbtn">🔊</div>
  <div id="pauseBtn" class="iconbtn">⏸</div>
  <div id="laneWrap">
    <div class="lane" id="laneP"><span class="tag">你 🐴</span><div class="racer" id="rP" style="left:40px">🐴</div><div class="finishline"></div></div>
    <div class="lane" id="laneA"><span class="tag">AI 🤖</span><div class="racer" id="rA" style="left:40px">🐴</div><div class="finishline"></div></div>
  </div>
  <div id="rhythmWrap">
    <div class="lbl">节奏条：点击间隔落在绿色区间越稳越快</div>
    <div id="rhythmTrack"><div id="rhythmSweet"></div><div id="rhythmCur"></div></div>
  </div>
  <div id="tip">严格交替点击 ◀ ▶ 驱动海马！同键连点会减速</div>
  <div id="stun"></div>
  <div id="btnRow">
    <button class="ctl" id="btnL">◀</button>
    <button class="ctl" id="btnR">▶</button>
  </div>
  <div id="startOv" class="overlay">
    <h1>🏁 海马竞速</h1>
    <p>左右两个大按钮必须<b>严格交替</b>点击<br>才能驱动你的海马前进！<br>同键连点会被减速罚停。<br>点击节奏越稳、速度越快。<br>与 AI 海马竞速 100 米，拼最快成绩！</p>
    <button class="bigbtn" id="startBtn">开 始</button>
  </div>
  <div id="pauseOv" class="overlay hidden">
    <h1>⏸ 已暂停</h1>
    <button class="bigbtn" id="resumeBtn">继 续</button>
    <button class="bigbtn" id="restartBtn1">重 来</button>
  </div>
  <div id="endOv" class="overlay hidden">
    <h1 id="endTitle">🏁</h1>
    <p id="endText"></p>
    <button class="bigbtn" id="restartBtn2">再来一局</button>
  </div>
</div></div>
<script>
'use strict';
var muted=localStorage.getItem('g100_mute')==='1';
var AC=null;
function ac(){ if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}} if(AC&&AC.state==='suspended')AC.resume(); return AC; }
function tone(f,d,type,vol,slide){ if(muted)return; var a=ac(); if(!a)return;
  var o=a.createOscillator(),g=a.createGain(); o.type=type||'sine';
  o.frequency.setValueAtTime(f,a.currentTime);
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,a.currentTime+d);
  g.gain.setValueAtTime(vol||0.15,a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+d);
  o.connect(g);g.connect(a.destination); o.start();o.stop(a.currentTime+d+0.02); }
var SFX={
  tap:function(){tone(500,0.07,'square',0.1,650);},
  bad:function(){tone(150,0.22,'sawtooth',0.13,80); if(navigator.vibrate)navigator.vibrate(50);},
  win:function(){var n=[523,659,784,1047]; for(var i=0;i<n.length;i++)(function(i){setTimeout(function(){tone(n[i],0.18,'triangle',0.15);},i*120);})(i);},
  lose:function(){tone(300,0.25,'triangle',0.13,150);setTimeout(function(){tone(200,0.3,'triangle',0.12,100);},180);},
  click:function(){tone(660,0.06,'sine',0.1);}
};
var state='menu', pDist=0, aDist=0, elapsed=0, next='L', lastTapT=0, lastGap=0.25, stunT=0, speed=0;
var rP=document.getElementById('rP'), rA=document.getElementById('rA');
var sweetEl=document.getElementById('rhythmSweet'), curEl=document.getElementById('rhythmCur');
var stunEl=document.getElementById('stun');
var best=parseFloat(localStorage.getItem('g100_seahorse_hs')||'0')||0;
function fmtBest(){ document.getElementById('hs').textContent=best>0?best.toFixed(1)+'s':'—'; }
fmtBest();
var FINISH=100, TRACKPX=0;
function trackPx(){ var l=document.getElementById('laneP'); TRACKPX=l.clientWidth-26-40; }
window.addEventListener('resize',trackPx); trackPx();
function posX(d){ return 40+(d/FINISH)*TRACKPX; }
function updHUD(){ document.getElementById('time').textContent=elapsed.toFixed(1);
  document.getElementById('dist').textContent=Math.min(100,Math.floor(pDist)); }
function tap(which,btn){
  if(state!=='play')return;
  btn.classList.remove('hit'); void btn.offsetWidth; btn.classList.add('hit');
  var now=performance.now();
  if(which===next){
    var gap=lastTapT?(now-lastTapT)/1000:0.25;
    lastTapT=now;
    // 节奏判定：理想间隔 0.22~0.45s，越稳加成越高
    var steadiness=Math.max(0,1-Math.abs(gap-0.32)/0.32);
    var boost=0.6+0.8*steadiness; // 0.6~1.4
    pDist+=1.1*boost;
    speed=pDist;
    lastGap=gap;
    SFX.tap();
    next=(which==='L')?'R':'L';
    stunEl.textContent='';
  }else{
    // 同键连点：减速罚停
    stunT=0.7; pDist=Math.max(0,pDist-0.6);
    SFX.bad();
    btn.classList.remove('bad'); void btn.offsetWidth; btn.classList.add('bad');
    stunEl.textContent='⚠ 同键连点！减速中…';
  }
  updHUD();
}
var btnL=document.getElementById('btnL'), btnR=document.getElementById('btnR');
btnL.addEventListener('pointerdown',function(e){e.preventDefault();tap('L',btnL);});
btnR.addEventListener('pointerdown',function(e){e.preventDefault();tap('R',btnR);});
function end(win){
  if(state!=='play')return; state='end';
  if(win){SFX.win(); if(navigator.vibrate)navigator.vibrate([40,40,80]);} else SFX.lose();
  var nhs=false;
  if(win&&(best===0||elapsed<best)){best=elapsed;localStorage.setItem('g100_seahorse_hs',String(best));nhs=true;fmtBest();}
  document.getElementById('endTitle').textContent=win?'🏆 你赢了！':'🤖 AI 先到了';
  document.getElementById('endText').innerHTML='用时：<b>'+elapsed.toFixed(1)+'s</b>'+(nhs?' 🎉新纪录！':'')+
    '<br>'+(win?'AI 用时：约'+aTime().toFixed(1)+'s':'AI 先冲线')+'<br>最好成绩：'+(best>0?best.toFixed(1)+'s':'—');
  document.getElementById('endOv').classList.remove('hidden');
}
var AI_SPEED=2.6; // 米/秒 基准（约38秒跑完）
function aTime(){ return FINISH/AI_SPEED; }
function reset(){
  pDist=0;aDist=0;elapsed=0;next='L';lastTapT=0;lastGap=0.25;stunT=0;
  rP.style.left='40px'; rA.style.left='40px'; stunEl.textContent='';
  updHUD();
  document.getElementById('startOv').classList.add('hidden');
  document.getElementById('endOv').classList.add('hidden');
  document.getElementById('pauseOv').classList.add('hidden');
  state='play';
}
document.getElementById('startBtn').onclick=function(){SFX.click();trackPx();reset();};
document.getElementById('restartBtn1').onclick=function(){SFX.click();reset();};
document.getElementById('restartBtn2').onclick=function(){SFX.click();reset();};
document.getElementById('pauseBtn').onclick=function(){
  if(state==='play'){state='pause';document.getElementById('pauseOv').classList.remove('hidden');}};
document.getElementById('resumeBtn').onclick=function(){
  if(state==='pause'){state='play';document.getElementById('pauseOv').classList.add('hidden');SFX.click();}};
function setMuteBtn(){document.getElementById('muteBtn').textContent=muted?'🔇':'🔊';}
document.getElementById('muteBtn').onclick=function(){muted=!muted;localStorage.setItem('g100_mute',muted?'1':'0');setMuteBtn();if(!muted)SFX.click();};
setMuteBtn();
// 节奏条刻度：显示 0~0.7s 区间，甜蜜区 0.22~0.45s
(function(){ var s=0.22/0.7*100, e=0.45/0.7*100;
  sweetEl.style.left=s+'%'; sweetEl.style.width=(e-s)+'%'; })();
function loop(ts){
  requestAnimationFrame(loop);
  if(state!=='play')return;
  // 用 performance 差值驱动，暂停时 loop.p 停留在暂停前，恢复后 dt 被钳制
  if(!loop.p)loop.p=ts;
  var real=Math.min(0.05,(ts-loop.p)/1000); loop.p=ts;
  if(stunT>0)stunT-=real;
  elapsed+=real;
  // AI 以抖动速度前进
  aDist+=AI_SPEED*real*(0.92+Math.random()*0.16);
  rP.style.left=posX(Math.min(pDist,FINISH))+'px';
  rA.style.left=posX(Math.min(aDist,FINISH))+'px';
  // 节奏条游标
  var g=Math.min(0.7,lastGap);
  curEl.style.left=(g/0.7*100)+'%';
  curEl.style.background=(lastGap>=0.22&&lastGap<=0.45)?'#69f0ae':'#ffd54f';
  updHUD();
  if(pDist>=FINISH)end(true);
  else if(aDist>=FINISH)end(false);
}
requestAnimationFrame(loop);
updHUD();
</script>
</body>
</html>
