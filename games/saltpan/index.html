<style>

body{display:flex;justify-content:center;touch-action:manipulation;-webkit-user-select:none;user-select:none}

.overlay.hidden{display:none}
.formula{display:inline-block;border:1px dashed currentColor;border-radius:8px;padding:6px 10px;font-size:14px;margin:4px 0}
</style>

<style>

    orb: function (ctx, x, y, r, color) {

      ctx.drawImage(sprite('o' + color + r, r * 2, r * 2, pad, s, function (g) { orbArt(g, r, color, pad); }), x - r - pad, y - r - pad, r * 2 + pad * 2, r * 2 + pad * 2);
    },
    // Soft elliptical contact shadow under any sprite (emoji, characters, pieces).
    shadow: function (ctx, x, y, rx, ry, a) {
      ctx.save(); ctx.fillStyle = 'rgba(0,0,0,' + (a == null ? .28 : a) + ')'; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, 7); ctx.fill(); ctx.restore();
    },
    // Lit stage background: vertical gradient plus a vignette. Cached per size/colours.
    stage: function (ctx, w, h, top, bottom) {
      var s = scaleOf(ctx);
      ctx.drawImage(sprite('s' + w + 'x' + h + top + bottom, w, h, 0, s, function (g) {
        var lg = g.createLinearGradient(0, 0, 0, h); lg.addColorStop(0, top); lg.addColorStop(1, bottom); g.fillStyle = lg; g.fillRect(0, 0, w, h);
        var v = g.createRadialGradient(w / 2, h * .35, Math.min(w, h) * .2, w / 2, h / 2, Math.max(w, h) * .75);
        v.addColorStop(0, 'rgba(255,255,255,' + (skin === 'b' ? .10 : .07) + ')'); v.addColorStop(1, 'rgba(0,0,0,.35)'); g.fillStyle = v; g.fillRect(0, 0, w, h);
      }), 0, 0, w, h);
    },
    // Glow is shadowBlur: cheap for a handful of shapes, never use it on every tile.
    glow: function (ctx, color, blur) { ctx.shadowColor = color; ctx.shadowBlur = blur; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0; },
    noGlow: function (ctx) { ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; },
    // Crisp rendering on high-DPI phones without changing game coordinates.
    // Only safe where input code converts with getBoundingClientRect + logical W/H, not cv.width.
    hidpi: function (cv, ctx, w, h) {
      var d = Math.max(1, Math.min(2.5, window.devicePixelRatio || 1));
      cv.width = Math.round(w * d); cv.height = Math.round(h * d); // intrinsic ratio stays w:h, so CSS sizing is unchanged
      ctx.setTransform(d, 0, 0, d, 0, 0); return d;
    },
    // Lightweight particle bursts (pooled array, no allocations per frame beyond the burst).
    burst: function (list, x, y, color, n) {
      for (var i = 0; i < (n || 12); i++) { var a = Math.random() * 6.283, v = 1 + Math.random() * 2.6; list.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 1, life: 1, c: color, r: 1.5 + Math.random() * 2.5 }); }
    },
    drawBurst: function (ctx, list) {
      for (var i = list.length - 1; i >= 0; i--) {
        var p = list[i]; p.x += p.vx; p.y += p.vy; p.vy += .12; p.life -= .035;
        if (p.life <= 0) { list.splice(i, 1); continue; }
        ctx.globalAlpha = p.life; ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (skin === 'b' ? 1.2 : 1), 0, 7); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
  };
  window.GameUI.fx = fx;
}());

</script>
<!-- GAME UI END -->
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <span class="title">🧂 盐湖晒盐</span>
    <span>得分 <b id="score">0</b> · 最佳 <b id="best">0</b></span>
    <span class="tools"><button class="iconbtn" id="muteBtn" aria-label="切换音效">🔊</button><button class="iconbtn" id="pauseBtn" aria-label="暂停游戏">⏸</button></span>
  </div>
  <canvas id="cv"></canvas>
  <div class="ctlrow">
    <button class="dbtn" id="brineBtn">💧 引水<br><small>5m³卤水</small></button>
    <button class="dbtn" id="freshBtn">🚰 兑水<br><small>4m³淡水</small></button>
    <button class="dbtn" id="expandBtn">🏗️ 扩场<br><small>+100㎡</small></button>
    <button class="dbtn" id="harvestBtn">🧂 收盐<br><small>收结晶</small></button>
    <button class="dbtn" id="nextBtn">🌙 下一天<br><small>结算蒸发</small></button>
  </div>
  <p class="apline">体力 <b id="ap">3</b>/3 · 引水/兑水/扩场/收盐各耗 1 点体力</p>
  <p class="hint">浓度≥36% 析出结晶；在 36%～60% 收盐品质最好，晒过头杂质多</p>
</div>
<div class="overlay" id="startScr"><h1>🧂 盐湖晒盐</h1><p id="startText"></p><button class="btn" id="startBtn">开始游戏</button></div>
<div class="overlay hidden" id="pauseOv"><h1>⏸ 已暂停</h1><button class="btn" id="resumeBtn">继续</button><button class="btn ghost" id="quitBtn">重新开始</button></div>
<div class="overlay hidden" id="overScr"><h1 id="overTitle">实验总结</h1><div class="score" id="finalScore">0</div><p id="overText"></p><button class="btn" id="againBtn">再来一局</button></div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const W=360,H=540;                       // 逻辑坐标：所有玩法/命中判定都用它
const cv=$('cv'),ctx=cv.getContext('2d');
const UI=window.GameUI||{pick:(a)=>a,storageGet:k=>localStorage.getItem(k),storageSet:(k,v)=>localStorage.setItem(k,v)};
const FX=UI.fx&&UI.fx.on?UI.fx:null;     // 共用皮肤的画布立体工具；没有时走平面画法
if(FX)FX.hidpi(cv,ctx,W,H);else{cv.width=W;cv.height=H;}
// ---------------- 天气（10 天） ----------------
// t:气温℃, w:风速m/s, r:降雨mm；第 7 天固定暴雨 Boss 天
const WXBASE=[
 {t:28,w:3,r:0},{t:30,w:4,r:0},{t:32,w:5,r:0},{t:29,w:2,r:0},{t:33,w:6,r:0},
 {t:31,w:3,r:0,fc:'rain'},{t:26,w:8,r:60,boss:true},{t:34,w:7,r:0},{t:35,w:5,r:0},{t:33,w:4,r:0}];
const ORDER=4000, QMIN=80;               // 订单：4 吨，平均品质 ≥80
const HS='g100_saltpan_hs',PG='g100_saltpan_prog',MU='g100_saltpan_mute';
let best=+UI.storageGet(HS)||0;$('best').textContent=best;
// ---------------- 状态 ----------------
let state='menu',day,ap,area,Wt,S,C,cost,harv,qSum,qN,wx,last=0;
let msg='',msgT=0,spark=[];
function show(id,on){$(id).classList.toggle('hidden',!on);}
function toast(t){msg=t;msgT=2.4;}
function conc(){return Wt>0?S/Wt:0;}
// ---- 音效：WebAudio 合成，无外部资源；遵守静音开关 ----
let muted=UI.storageGet(MU)==='1',ac=null;$('muteBtn').textContent=muted?'🔇':'🔊';
function beep(f,d,type,vol){if(muted)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(vol||.15,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d);}catch(e){}}
$('muteBtn').addEventListener('click',()=>{muted=!muted;UI.storageSet(MU,muted?'1':'0');$('muteBtn').textContent=muted?'🔇':'🔊';});
// ---- 流程 ----
function start(){
 day=1;ap=3;area=300;Wt=0;S=0;C=0;cost=0;harv=0;qSum=0;qN=0;spark=[];
 wx=WXBASE.map((b,i)=>({t:b.t+Math.round(Math.random()*4-2),w:Math.max(1,b.w+Math.round(Math.random()*2-1)),r:i===6?60:b.r,boss:!!b.boss,fc:b.fc}));
 UI.storageSet(PG,1);
 $('startText').innerHTML=
  `你是盐场主，10 天内完成 <b>4 吨</b>食盐订单，平均品质 ≥80 分。<br>`+
  `每天 3 点体力：💧引水（5m³卤水，250kg盐/m³）🚰兑淡水 🏗️扩场 🧂收盐。<br>`+
  `浓度 ≥<b>36%</b> 开始析晶；在 36%～60% 收盐品质最高，晒过头（水太浅）杂质多。<br>`+
  `⚠️ 第 7 天有暴雨 Boss：提前看天气预报，暴雨前务必收盐！<br>`+
  `<span class="formula">蒸发量＝k·面积·(T−5℃)·风速系数</span><br>`+
  `<span class="formula">析晶量＝总盐 − 0.36 × 水量（NaCl 20℃溶解度≈36g/100g水）</span>`;
 show('startScr',true);show('overScr',false);state='menu';last=performance.now();}
function begin(){show('startScr',false);state='play';last=performance.now();applyMorning();beep(660,.12);}
function applyMorning(){ // 每天清晨：蒸发 / 降雨 / 结晶结算
 const w=wx[day-1];
 const E=0.6*Math.max(0,w.t-5)*(0.4+w.w/10);   // 蒸发强度 mm/天
 if(w.r>0){Wt+=w.r*area;                         // 降雨补水（mm×㎡＝kg）
   if(C>0){const dis=C*0.4;C-=dis;S+=dis;toast('⛈️ 暴雨！部分结晶被雨水溶解了');}
   else toast(`⛈️ 降雨 ${w.r}mm，卤水被稀释了`);
 }else{Wt=Math.max(0,Wt-E*area);
   if(E*area>0)toast(`☀️ 蒸发 ${(E).toFixed(1)}mm（${Math.round(E*area/100)/10}t水）`);}
 if(Wt>0&&conc()>=0.36){const ex=S-0.36*Wt;C+=ex;S=0.36*Wt;
   toast(`🧂 析出结晶 ${Math.round(ex)}kg！`);beep(990,.1);
   if(FX)for(let i=0;i<10;i++)FX.burst(spark,60+Math.random()*240,300+Math.random()*120,'#ffffff',1);}
 ap=3;$('ap').textContent=ap;
 UI.storageSet(PG,Math.max(+UI.storageGet(PG)||1,day));}
function quality(){const c=conc();let q=c<=0.60?100:Math.max(40,100-(c-0.60)*120);
 const depth=Wt/area;if(depth<8)q-=20;return Math.max(30,Math.round(q));} // 水深<8mm 晒过头
function useAP(){if(ap<=0){toast('体力用完了，点「下一天」吧');beep(160,.15,'square');return false;}ap--;$('ap').textContent=ap;return true;}
$('brineBtn').addEventListener('click',()=>{if(state!=='play')return;if(!useAP())return;
 Wt+=5000;S+=1250;cost+=80;toast('💧 引入 5m³ 卤水（含盐 1250kg）');beep(440,.1);});
$('freshBtn').addEventListener('click',()=>{if(state!=='play')return;if(!useAP())return;
 Wt+=4000;cost+=10;toast('🚰 兑入 4m³ 淡水，浓度下降');beep(520,.1);});
$('expandBtn').addEventListener('click',()=>{if(state!=='play')return;
 if(area>=800){toast('晒场已达上限 800㎡');return;}if(!useAP())return;
 area+=100;cost+=200;toast('🏗️ 晒场＋100㎡，蒸发更快了');beep(600,.12,'triangle');});
$('harvestBtn').addEventListener('click',()=>{if(state!=='play')return;
 if(C<1){toast('还没有结晶可收（浓度≥36%才会析晶）');beep(160,.15,'square');return;}
 if(!useAP())return;
 const q=quality(),amt=C;harv+=amt;qSum+=q*amt;qN+=amt;cost+=20;C=0;
 toast(`🧂 收盐 ${Math.round(amt)}kg，品质 ${q} 分`);beep(880,.12);setTimeout(()=>beep(1174,.15),120);
 if(FX)for(let i=0;i<14;i++)FX.burst(spark,60+Math.random()*240,300+Math.random()*120,'#ffd34d',1);});
$('nextBtn').addEventListener('click',()=>{if(state!=='play')return;
 if(day>=10){finish();return;}
 day++;applyMorning();beep(700,.1);});
function avgQ(){return qN>0?qSum/qN:0;}
function finish(){state='over';
 const q=avgQ(),done=harv>=ORDER&&q>=QMIN;
 const sc=Math.max(0,Math.round(harv/10+q*10-cost+(done?500:0)));
 if(sc>best){best=sc;UI.storageSet(HS,best);}$('best').textContent=best;$('score').textContent=sc;
 $('overTitle').textContent=done?'🏆 订单完成！':'📋 实验结束';
 $('finalScore').textContent=sc;
 $('overText').innerHTML=
  `${done?'恭喜！10 天交出合格食盐。':'订单未达标，再接再厉。'}<br>`+
  `🧂 总产量 <b>${(harv/1000).toFixed(2)} 吨</b>（订单 4.0 吨）<br>`+
  `✨ 平均品质 <b>${q.toFixed(1)}</b> 分（要求 ≥80）<br>`+
  `💰 总成本 ${cost}（引水80/次·兑水10/次·扩场200/次·收盐20/次）<br>`+
  `<span class="formula">蒸发量＝k·A·(T−T₀)·风速系数</span><br>`+
  `<span class="formula">析晶量＝总盐 − 0.36×水量</span><br>`+
  `<b>知识点</b>：NaCl 20℃溶解度约 36g/100g水；浓度刚超饱和时收盐最纯，`+
  `水分蒸干后 MgCl₂ 等杂质也会析出——所以"晒过头"品质差；`+
  `暴雨前抢收，是因为雨水会溶解已析出的结晶。<br>`+
  `最佳 ${best}`;
 show('overScr',true);beep(880,.15);setTimeout(()=>beep(1174,.25),160);}
$('startBtn').addEventListener('click',begin);
$('againBtn').addEventListener('click',()=>{show('overScr',false);start();});
$('pauseBtn').addEventListener('click',()=>state==='play'?pause():resume());
function pause(){if(state!=='play')return;state='pause';show('pauseOv',true);}
function resume(){if(state!=='pause')return;state='play';last=performance.now();show('pauseOv',false);}
$('resumeBtn').addEventListener('click',resume);
$('quitBtn').addEventListener('click',()=>{show('pauseOv',false);start();});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
// ---- 渲染 ----
function draw(){
 const w=wx[day-1]||wx[0];
 if(FX)FX.stage(ctx,W,H,'#0e3a5c','#04121f');else{ctx.fillStyle='#06182b';ctx.fillRect(0,0,W,H);}
 // 天空 / 天气
 ctx.fillStyle='#ffe9a8';ctx.font='16px sans-serif';ctx.textAlign='left';ctx.textBaseline='top';
 const wicon=w.r>0?'⛈️':(w.t>=33?'☀️':'🌤️');
 ctx.fillText(`${wicon} 第 ${day}/10 天  ${w.t}℃  风${w.w}m/s${w.r>0?'  雨'+w.r+'mm':''}`,12,10);
 if(w.boss){ctx.fillStyle='#ff5252';ctx.font='bold 14px sans-serif';ctx.textAlign='center';ctx.fillText('👹 暴雨 Boss 天！未收的结晶会被溶解',W/2,34);ctx.textAlign='left';}
 if(day===6){ctx.fillStyle='#ffb74d';ctx.font='bold 13px sans-serif';ctx.textAlign='center';ctx.fillText('⚠️ 明日暴雨预警：今天务必收盐！',W/2,34);ctx.textAlign='left';}
 // 盐田：按面积画格子
 const cols=6,rows=4,cw=52,ch=40,ox=24,oy=64;
 const depth=Math.min(1,Wt/area/120),c=conc();
 for(let r=0;r<rows;r++)for(let col=0;col<cols;col++){
  const x=ox+col*cw,y=oy+r*ch;
  const active=(r*cols+col)<Math.round(area/800*24);
  if(!active){ctx.fillStyle='rgba(255,255,255,.06)';ctx.fillRect(x+2,y+2,cw-4,ch-4);continue;}
  // 卤水底色：浓度越高越偏橙
  const hue=200-c*120;
  if(FX)FX.tile(ctx,x+2,y+2,cw-4,ch-4,`hsl(${Math.max(20,hue)},60%,${30+depth*20}%)`,6);
  else{ctx.fillStyle=`hsl(${Math.max(20,hue)},60%,40%)`;ctx.fillRect(x+2,y+2,cw-4,ch-4);}
  // 结晶闪点
  const cr=Math.min(1,C/area/8);
  if(cr>0.02){ctx.fillStyle=`rgba(255,255,255,${0.3+cr*0.7})`;
   for(let k=0;k<cr*8;k++){const px=x+6+((k*37+r*13+col*7)%(cw-12)),py=y+6+((k*53+r*29)%(ch-12));ctx.fillRect(px,py,3,3);}}
 }
 if(FX)FX.drawBurst(ctx,spark);
 // 数据面板
 ctx.textAlign='left';ctx.font='13px sans-serif';
 const q=quality();
 ctx.fillStyle='#fff';
 ctx.fillText(`🧪 浓度 ${(c*100).toFixed(1)}%${c>=0.36?'（已饱和✓）':''}`,12,252);
 ctx.fillStyle=c>=0.36&&c<=0.60?'#7CFC00':'#ffb74d';
 ctx.fillText(`💧 水量 ${(Wt/1000).toFixed(1)}t（含盐 ${(S/1000).toFixed(2)}t）`,12,272);
 ctx.fillStyle='#fff';
 ctx.fillText(`🧂 待收结晶 ${(C/1000).toFixed(2)}t · 收盐品质约 ${C>0?q:0} 分`,12,292);
 ctx.fillText(`🏗️ 晒场 ${area}㎡ · 📦 订单 ${(harv/1000).toFixed(2)}/${(ORDER/1000).toFixed(1)}t`,12,312);
 ctx.fillText(`✨ 平均品质 ${avgQ().toFixed(1)}（目标≥${QMIN}）· 💰成本 ${cost}`,12,332);
 // 公式条
 ctx.fillStyle='#9fb6cc';ctx.font='12px sans-serif';
 ctx.fillText('蒸发＝k·A·(T−5)·风速系数 ｜ 析晶＝总盐−0.36×水量',12,356);
 // 结晶条件提示
 if(C<=0&&Wt>0&&c<0.36){ctx.fillStyle='#ffd34d';ctx.fillText('💡 还差 '+Math.round((0.36-c)*Wt)+'kg 蒸发量才饱和',12,376);}
 if(msgT>0){ctx.font='bold 14px sans-serif';const tw=ctx.measureText(msg).width+24;
  ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(W/2-tw/2,400,tw,32);
  ctx.fillStyle='#ffe9a8';ctx.textAlign='center';ctx.fillText(msg,W/2,408);ctx.textAlign='left';}
 if(state==='menu'){ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(0,0,W,H);}
}
function frame(t){const dt=Math.min(.05,(t-last)/1000);last=t;
 msgT-=dt;draw();requestAnimationFrame(frame);}
start();draw();requestAnimationFrame(frame);
</script>
</body></html>
