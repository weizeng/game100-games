<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>符文施法</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:linear-gradient(160deg,#1a1440 0%,#0d0a24 55%,#060512 100%);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;display:flex;justify-content:center;min-height:100vh;touch-action:manipulation;-webkit-user-select:none;user-select:none;overflow-x:hidden}
.wrap{width:100%;max-width:480px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:10px}
.topbar{width:100%;display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:9px 12px;font-size:14px}
.topbar .title{font-weight:700;font-size:16px}
.topbar .stat{color:#d6d2f5;font-size:12px}
.topbar .stat b{color:#fff;font-size:14px}
.tbtn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:#fff;font-size:17px;min-width:42px;height:42px;border-radius:11px;cursor:pointer;transition:transform .08s}
.tbtn:active{transform:scale(.9)}
.screen{width:100%;display:none;flex-direction:column;align-items:center;gap:10px}
.screen.on{display:flex}
.card{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:20px;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.card h1{font-size:26px;margin-bottom:8px;background:linear-gradient(90deg,#b39ddb,#7c9eff);-webkit-background-clip:text;background-clip:text;color:transparent}
.card h2{font-size:22px;margin-bottom:8px}
.card p{color:#e4e1f7;font-size:14px;line-height:1.9;margin-bottom:12px;text-align:left}
.card p b{color:#9fa8da}
.bigbtn{background:linear-gradient(135deg,#5c6bc0,#9fa8da);border:none;color:#0d1030;font-size:18px;font-weight:700;padding:14px 44px;border-radius:999px;cursor:pointer;box-shadow:0 6px 18px rgba(92,107,192,.5);transition:transform .1s;min-height:48px}
.bigbtn:active{transform:scale(.93)}
.best{color:#ffd76a;font-size:14px;margin-top:8px}
#cvwrap{width:100%;display:flex;justify-content:center}
#cv{border-radius:14px;background:rgba(255,255,255,.03);touch-action:none;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.hint{color:#d6d2f5;font-size:13px;text-align:center;line-height:1.7;min-height:40px}
.hint b{color:#9fa8da}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:40;backdrop-filter:blur(4px)}
.ov.on{display:flex}
.pausecard{background:#141031;border:1px solid rgba(159,168,218,.35);border-radius:18px;padding:28px 32px;text-align:center;display:flex;flex-direction:column;gap:12px;max-width:86vw}
.pausecard h2{font-size:20px}
.ghostbtn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#fff;font-size:14px;padding:10px 22px;border-radius:999px;cursor:pointer;min-height:44px}
.ghostbtn:active{transform:scale(.93)}
#toast{position:fixed;top:38%;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.82);border:1px solid rgba(159,168,218,.4);color:#fff;font-size:16px;font-weight:700;padding:12px 26px;border-radius:999px;z-index:70;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;max-width:92vw}
.float{position:fixed;pointer-events:none;z-index:60;font-weight:800;font-size:22px;animation:floatup 1.1s ease-out forwards;text-shadow:0 2px 6px rgba(0,0,0,.6)}
@keyframes floatup{0%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-52px)}}
</style>
</head>
<body>
<div id="toast"></div>
<div class="wrap">
  <div class="topbar">
    <span class="title">✨ 符文施法</span>
    <span class="stat">第<b id="wave">1</b>波 · ❤️<b id="hp">3</b> · ⭐<b id="score">0</b></span>
    <span><button class="tbtn" id="sndBtn" aria-label="静音开关">🔊</button><button class="tbtn" id="pauseBtn" aria-label="暂停">⏸</button></span>
  </div>
  <div class="screen on" id="s-start">
    <div class="card">
      <h1>✨ 符文施法</h1>
      <p>怪物从四周逼近，唯一的武器是你的指尖魔法！<br>
      🔮 中央出现<b>符文虚线</b>（三角形/圆形/Z形/闪电形/正方形…随机出）<br>
      ✍️ 手指<b>按住虚线描摹</b>，一笔描完后松开<br>
      🎯 描摹精度 ≥ <b>70%</b> → 魔法爆发，消灭<b>最近</b>的怪物（+100分+精度奖励）<br>
      ❌ 描错或超时（15秒）→ 所有怪物<b>向前逼近一步</b><br>
      💔 怪物碰到你扣 1 血，共 <b>3 血</b>；波次越高怪物越多越快！</p>
      <button class="bigbtn" id="startBtn">开始施法</button>
      <div class="best">🏅 最高分：<b id="best0">0</b></div>
    </div>
  </div>
  <div class="screen" id="s-game">
    <div id="cvwrap"><canvas id="cv" width="360" height="520"></canvas></div>
    <div class="hint" id="hint">✍️ 沿虚线描摹符文，松开释放魔法！</div>
  </div>
  <div class="screen" id="s-end">
    <div class="card">
      <h2 id="endTitle">💀 游戏结束</h2>
      <p id="endDesc" style="text-align:center"></p>
      <div class="best">🏅 最高分：<b id="best1">0</b></div>
      <button class="bigbtn" id="againBtn">再来一局</button>
    </div>
  </div>
</div>
<div class="ov" id="pauseov"><div class="pausecard"><h2>⏸ 中场休息</h2><button class="bigbtn" id="resumeBtn">继续</button><button class="ghostbtn" id="quitBtn">重开一局</button></div></div>
<script>
'use strict';
const $=id=>document.getElementById(id);
/* ===== 音效 ===== */
let AC=null;
let soundOn=localStorage.getItem('g100_mute')!=='1';
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return null;}}if(AC&&AC.state==='suspended'){AC.resume();}return AC;}
function tone(f,d,type,v,when){if(!soundOn)return;const a=ac();if(!a)return;try{const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.value=f;const t=a.currentTime+(when||0);g.gain.setValueAtTime(v||0.12,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.03);}catch(e){}}
function sweep(f0,f1,d,type,v){if(!soundOn)return;const a=ac();if(!a)return;try{const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';const t=a.currentTime;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+d);g.gain.setValueAtTime(v||0.1,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.03);}catch(e){}}
const sClick=()=>tone(640,0.07,'square',0.07);
const sStart=()=>sweep(300,600,0.15,'sine',0.1);
const sZap=()=>{sweep(1400,200,0.22,'sawtooth',0.12);tone(2093,0.18,'sine',0.1,0.05);};
const sFail=()=>{tone(220,0.2,'sawtooth',0.12);tone(160,0.25,'sawtooth',0.1,0.08);};
const sHit=()=>{tone(110,0.35,'sawtooth',0.16);sweep(500,90,0.3,'sawtooth',0.1);};
const sWave=()=>{[523,659,784,1047].forEach((f,i)=>tone(f,0.14,'triangle',0.12,i*0.09));};
const sWin=()=>{[523,659,784,1047,1319].forEach((f,i)=>tone(f,0.16,'triangle',0.12,i*0.11));};
/* ===== 工具 ===== */
function toast(msg){const t=$('toast');t.textContent=msg;t.style.opacity='1';clearTimeout(t._tm);t._tm=setTimeout(()=>{t.style.opacity='0';},1300);}
function floatTxt(txt,color){const d=document.createElement('div');d.className='float';d.textContent=txt;d.style.color=color||'#9fa8da';d.style.left='50%';d.style.top='30%';document.body.appendChild(d);setTimeout(()=>d.remove(),1150);}
function buzz(ms){try{if(navigator.vibrate)navigator.vibrate(ms);}catch(e){}}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));$(id).classList.add('on');}
/* ===== 常量/状态 ===== */
const HSKEY='g100_spelldraw_hs';
const cv=$('cv'),ctx=cv.getContext('2d');
const PX=180,PY=452;               // 玩家位置
const RBX=70,RBY=90,RBW=220,RBH=220; // 符文框
const RUNE_TIME=15;
const EMOJIS=['👾','🧌','👹','👺'];
let running=false,paused=false;
let wave=1,hp=3,score=0,kills=0;
let monsters=[],parts=[],beam=null,flash=0,shake=0;
let spawnQueue=0,spawnT=0;
let invuln=0;
let trace=[],tracing=false,traceT=0,runeTime=RUNE_TIME;
let rune=null,lastRuneDef=null;
function best(){return parseInt(localStorage.getItem(HSKEY)||'0',10);}
function saveBest(){if(score>best())localStorage.setItem(HSKEY,String(score));}
function refreshBest(){$('best0').textContent=best();$('best1').textContent=best();}
function refreshHud(){$('wave').textContent=wave;$('hp').textContent=hp;$('score').textContent=score;}
function setHint(t){$('hint').innerHTML=t;}
/* ===== 符文模板（归一化坐标） ===== */
function circlePts(){const p=[];for(let i=0;i<=48;i++){const a=i/48*2*Math.PI;p.push([0.5+0.42*Math.cos(a),0.5+0.42*Math.sin(a)]);}return p;}
const RUNES=[
  {name:'三角符文',closed:true, pts:[[0.5,0.06],[0.08,0.92],[0.92,0.92],[0.5,0.06]]},
  {name:'圆环符文',closed:true, pts:circlePts()},
  {name:'Z字闪符',closed:false,pts:[[0.1,0.08],[0.9,0.08],[0.1,0.92],[0.9,0.92]]},
  {name:'雷霆符文',closed:false,pts:[[0.62,0.05],[0.28,0.5],[0.5,0.5],[0.36,0.95],[0.74,0.44],[0.5,0.44],[0.62,0.05]]},
  {name:'方阵符文',closed:true, pts:[[0.12,0.12],[0.88,0.12],[0.88,0.88],[0.12,0.88],[0.12,0.12]]},
  {name:'V字疾符',closed:false,pts:[[0.08,0.1],[0.5,0.9],[0.92,0.1]]}
];
function toCanvas(pts){return pts.map(p=>[RBX+p[0]*RBW,RBY+p[1]*RBH]);}
function newRune(){rune=toCanvas(pickRune());trace=[];tracing=false;runeTime=RUNE_TIME;}
function pickRune(){const r=RUNES[Math.floor(Math.random()*RUNES.length)];lastRuneDef=r;return r.pts;}
/* ===== 轨迹比对 ===== */
function pathLen(pts){let L=0;for(let i=1;i<pts.length;i++)L+=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);return L;}
function resample(pts,n){
  if(pts.length<2)return pts.slice();
  const L=pathLen(pts),step=L/(n-1),out=[pts[0].slice()];
  let acc=0,i=1;
  while(out.length<n-1&&i<pts.length){
    const d=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);
    if(acc+d>=step){
      const t=(step-acc)/d;
      const nx=pts[i-1][0]+(pts[i][0]-pts[i-1][0])*t,ny=pts[i-1][1]+(pts[i][1]-pts[i-1][1])*t;
      out.push([nx,ny]);pts[i-1]=[nx,ny];acc=0;
    }else{acc+=d;i++;}
  }
  out.push(pts[pts.length-1].slice());
  return out;
}
function evaluateTrace(){
  if(trace.length<10||traceT<0.2)return{ok:false,acc:0,reason:'太短'};
  const T=resample(trace.map(p=>p.slice()),64);
  // 模板正反两个方向取优
  const R0=resample(rune.map(p=>p.slice()),64);
  const R1=R0.slice().reverse();
  let d0=0,d1=0;
  for(let i=0;i<64;i++){d0+=Math.hypot(T[i][0]-R0[i][0],T[i][1]-R0[i][1]);d1+=Math.hypot(T[i][0]-R1[i][0],T[i][1]-R1[i][1]);}
  const mean=Math.min(d0,d1)/64;
  const tLen=pathLen(rune),trLen=pathLen(trace);
  if(trLen<tLen*0.55)return{ok:false,acc:0,reason:'轨迹太短'};
  const acc=Math.max(0,Math.min(1,1-mean/(RBW*0.16)));
  return{ok:acc>=0.70,acc:acc,reason:acc<0.70?'精度'+Math.round(acc*100)+'%':'OK'};
}
/* ===== 回合 ===== */
function startGame(){
  running=true;paused=false;wave=1;hp=3;score=0;kills=0;
  monsters=[];parts=[];beam=null;flash=0;shake=0;invuln=0;
  $('pauseov').classList.remove('on');
  showScreen('s-game');refreshHud();refreshBest();
  startWave();sStart();
}
function startWave(){
  spawnQueue=wave+2;spawnT=0;
  newRune();
  refreshHud();
  setHint('🌊 第 <b>'+wave+'</b> 波：'+spawnQueue+' 只怪物逼近！描摹 <b>'+lastRuneDef.name+'</b> 释放魔法！');
  toast('第 '+wave+' 波来袭！');
}
function waveSpeed(){return 34+wave*9;}
function spawnMonster(){
  const side=Math.floor(Math.random()*3);
  let x,y;
  if(side===0){x=20+Math.random()*320;y=-30;}
  else if(side===1){x=-30;y=40+Math.random()*300;}
  else{x=390;y=40+Math.random()*300;}
  monsters.push({x:x,y:y,e:EMOJIS[Math.floor(Math.random()*EMOJIS.length)],hp:1,wob:Math.random()*6.28});
}
function nearestMonster(){
  let bi=-1,bd=1e9;
  monsters.forEach((m,i)=>{const d=Math.hypot(m.x-PX,m.y-PY);if(d<bd){bd=d;bi=i;}});
  return bi;
}
function killMonster(i,acc){
  const m=monsters[i];monsters.splice(i,1);
  const gain=100+Math.round(acc*100);
  score+=gain;kills++;
  beam={x1:PX,y1:PY-20,x2:m.x,y2:m.y,t:0.25};
  for(let j=0;j<26;j++)parts.push({x:m.x,y:m.y,vx:(Math.random()-0.5)*6,vy:(Math.random()-0.5)*6-1,life:1,c:['#9fa8da','#7c9eff','#fff','#b39ddb','#ffd54f'][j%5],r:2+Math.random()*3});
  sZap();buzz(50);floatTxt('+'+gain,'#ffd54f');
  setHint('✨ <b>魔法命中！</b>'+m.e+' 被消灭，精度 '+Math.round(acc*100)+'%');
  refreshHud();
  newRune();
}
function monsterStep(){
  monsters.forEach(m=>{
    const d=Math.hypot(PX-m.x,PY-m.y)||1;
    m.x+=(PX-m.x)/d*36;m.y+=(PY-m.y)/d*36;
  });
  shake=0.4;sFail();buzz(120);
  setHint('❌ <b>施法失败！</b>怪物向前逼近了一步！');
}
function playerHit(){
  hp--;invuln=1.2;flash=0.6;shake=0.7;
  sHit();buzz([120,60,120]);
  floatTxt('-1 ❤️','#ef9a9a');
  refreshHud();
  if(hp<=0)endGame();
  else setHint('💔 怪物咬了你一口！还剩 <b>'+hp+'</b> 血，快描摹符文反击！');
}
function endGame(){
  running=false;paused=false;
  $('pauseov').classList.remove('on');
  const nb=score>best();
  saveBest();refreshBest();
  $('endTitle').textContent='💀 法力耗尽…';
  $('endDesc').innerHTML='顶到第 <b>'+wave+'</b> 波 · 消灭 <b>'+kills+'</b> 只怪物<br>最终得分 <b style="color:#ffd54f;font-size:22px">'+score+'</b>';
  showScreen('s-end');
  if(nb)sWin();else tone(220,0.4,'sine',0.1);
}
/* ===== 输入（描摹） ===== */
function cvPos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height};}
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();
  if(!running||paused)return;
  tracing=true;trace=[];traceT=0;
  const p=cvPos(e);trace.push([p.x,p.y]);
  try{cv.setPointerCapture(e.pointerId);}catch(err){}
  sStart();
});
cv.addEventListener('pointermove',e=>{
  if(!tracing||!running||paused)return;
  const p=cvPos(e);
  const last=trace[trace.length-1];
  if(Math.hypot(p.x-last[0],p.y-last[1])>2)trace.push([p.x,p.y]);
});
function endTrace(){
  if(!tracing)return;
  tracing=false;
  if(!running||paused){trace=[];return;}
  const r=evaluateTrace();
  if(r.ok){
    const i=nearestMonster();
    if(i>=0)killMonster(i,r.acc);
    else{newRune();setHint('✨ 魔法释放，但场上已无怪物，换个符文继续！');}
  }else{
    monsterStep();
    newRune();
  }
  trace=[];
}
cv.addEventListener('pointerup',endTrace);
cv.addEventListener('pointercancel',()=>{tracing=false;trace=[];});
/* ===== 绘制 ===== */
function drawRuneBox(){
  ctx.fillStyle='rgba(92,107,192,.08)';
  ctx.fillRect(RBX-8,RBY-8,RBW+16,RBH+16);
  ctx.strokeStyle='rgba(159,168,218,.35)';ctx.lineWidth=2;
  ctx.strokeRect(RBX-8,RBY-8,RBW+16,RBH+16);
  // 模板虚线
  ctx.save();ctx.setLineDash([9,7]);
  ctx.strokeStyle='#e8eaf6';ctx.lineWidth=5;ctx.lineCap='round';ctx.lineJoin='round';
  ctx.shadowColor='#7c9eff';ctx.shadowBlur=12;
  ctx.beginPath();
  rune.forEach((p,i)=>{if(i===0)ctx.moveTo(p[0],p[1]);else ctx.lineTo(p[0],p[1]);});
  ctx.stroke();ctx.restore();
  // 起笔点
  const s=rune[0];
  ctx.fillStyle='#ffd54f';
  ctx.beginPath();ctx.arc(s[0],s[1],8+Math.sin(performance.now()/250)*2,0,7);ctx.fill();
  // 玩家描摹轨迹
  if(trace.length>1){
    ctx.strokeStyle='#7c9eff';ctx.lineWidth=7;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.shadowColor='#448aff';ctx.shadowBlur=14;
    ctx.beginPath();
    trace.forEach((p,i)=>{if(i===0)ctx.moveTo(p[0],p[1]);else ctx.lineTo(p[0],p[1]);});
    ctx.stroke();ctx.shadowBlur=0;
  }
  // 倒计时
  ctx.fillStyle=runeTime<5?'#ef9a9a':'#d6d2f5';ctx.font='13px sans-serif';ctx.textAlign='center';
  ctx.fillText('⏳ '+runeTime.toFixed(0)+'s',RBX+RBW/2,RBY+RBH+28);
}
function draw(dt){
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*12*shake,0);
  // 背景星点
  ctx.fillStyle='rgba(255,255,255,.25)';
  for(let i=0;i<30;i++){
    const sx=(i*97)%360,sy=(i*61)%520;
    ctx.globalAlpha=0.15+0.15*Math.sin(performance.now()/800+i);
    ctx.fillRect(sx,sy,2,2);
  }
  ctx.globalAlpha=1;
  // 玩家
  if(invuln>0&&Math.floor(performance.now()/120)%2===0){/* 闪烁 */ }
  else{
    ctx.font='44px serif';ctx.textAlign='center';
    ctx.fillText('🧙',PX,PY+16);
  }
  // 魔法阵
  ctx.strokeStyle='rgba(124,158,255,.4)';ctx.lineWidth=2;
  ctx.beginPath();ctx.ellipse(PX,PY+26,44,12,0,0,7);ctx.stroke();
  // 怪物
  const now=performance.now()/1000;
  monsters.forEach(m=>{
    ctx.font='34px serif';ctx.textAlign='center';
    ctx.fillText(m.e,m.x,m.y+Math.sin(now*4+m.wob)*4);
    ctx.fillStyle='rgba(239,154,154,.7)';ctx.font='12px sans-serif';
    ctx.fillText('⚠',m.x,m.y-26);
  });
  // 魔法光束
  if(beam){
    ctx.strokeStyle='rgba(255,213,79,'+Math.max(0,beam.t*4)+')';
    ctx.lineWidth=8;ctx.lineCap='round';
    ctx.shadowColor='#ffd54f';ctx.shadowBlur=18;
    ctx.beginPath();ctx.moveTo(beam.x1,beam.y1);ctx.lineTo(beam.x2,beam.y2);ctx.stroke();
    ctx.shadowBlur=0;
  }
  // 符文框
  drawRuneBox();
  ctx.restore();
  // 粒子
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.12;p.life-=dt*1.2;
    if(p.life<=0){parts.splice(i,1);continue;}
    ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();ctx.globalAlpha=1;
  }
  // 受击红闪
  if(flash>0){ctx.fillStyle='rgba(239,83,80,'+flash*0.3+')';ctx.fillRect(0,0,cv.width,cv.height);}
}
/* ===== 主循环 ===== */
let lastT=0;
function loop(t){
  requestAnimationFrame(loop);
  const dt=Math.min(0.05,(t-lastT)/1000||0);lastT=t;
  if(!running||paused){if(!running)return;draw(0);return;}
  if(invuln>0)invuln-=dt;
  if(flash>0)flash-=dt;
  if(shake>0)shake-=dt;
  if(tracing)traceT+=dt;
  // 生成
  if(spawnQueue>0){
    spawnT-=dt;
    if(spawnT<=0){spawnMonster();spawnQueue--;spawnT=1.3;}
  }
  // 移动
  const sp=waveSpeed()*dt;
  monsters.forEach(m=>{
    const d=Math.hypot(PX-m.x,PY-m.y)||1;
    m.x+=(PX-m.x)/d*sp;m.y+=(PY-m.y)/d*sp;
  });
  // 接触判定
  for(let i=monsters.length-1;i>=0;i--){
    if(Math.hypot(monsters[i].x-PX,monsters[i].y-PY)<40&&invuln<=0){
      monsters.splice(i,1);playerHit();break;
    }
  }
  // 符文超时
  if(!tracing){
    runeTime-=dt;
    if(runeTime<=0){monsterStep();newRune();setHint('⏳ <b>超时了！</b>怪物逼近一步，换个新符文！');}
  }
  // 波次过关
  if(spawnQueue===0&&monsters.length===0&&running){
    score+=wave*50;sWave();floatTxt('第'+wave+'波守住了! +'+wave*50,'#9fa8da');
    wave++;startWave();refreshHud();
  }
  if(beam){beam.t-=dt;if(beam.t<=0)beam=null;}
  draw(dt);
}
requestAnimationFrame(loop);
/* ===== 暂停/静音 ===== */
$('pauseBtn').addEventListener('click',()=>{if(!running||paused)return;paused=true;$('pauseov').classList.add('on');sClick();});
$('resumeBtn').addEventListener('click',()=>{paused=false;$('pauseov').classList.remove('on');sClick();});
$('quitBtn').addEventListener('click',()=>{sClick();running=false;paused=false;$('pauseov').classList.remove('on');showScreen('s-start');refreshBest();});
function refreshSnd(){$('sndBtn').textContent=soundOn?'🔊':'🔇';}
$('sndBtn').addEventListener('click',()=>{soundOn=!soundOn;localStorage.setItem('g100_mute',soundOn?'0':'1');refreshSnd();if(soundOn)sClick();});
$('startBtn').addEventListener('click',startGame);
$('againBtn').addEventListener('click',startGame);
refreshSnd();refreshBest();
</script>
