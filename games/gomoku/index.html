<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>五子棋</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#121212;color:#f0f0f0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;display:flex;justify-content:center;min-height:100vh;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.wrap{width:100%;max-width:480px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:10px}
.topbar{width:100%;display:flex;justify-content:space-between;align-items:center;font-size:17px}
.topbar b{color:#795548;font-size:22px}
canvas{background:#1e1e1e;border-radius:12px;touch-action:none;width:100%;height:auto}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.82);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;z-index:20;padding:24px;text-align:center}
.overlay.hidden{display:none}
.overlay h1{font-size:30px}
.overlay p{color:#bbb;font-size:15px;line-height:1.7}
.btn{background:#795548;border:none;color:#fff;font-size:19px;font-weight:700;padding:13px 52px;border-radius:14px;cursor:pointer}
.btn:active{transform:scale(.95)}
.hint{color:#888;font-size:13px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
<div class="topbar"><span>⚫ 五子棋</span><span id="state">轮到你走</span></div>
<canvas id="cv" width="450" height="450"></canvas>
<div class="hint">你执黑先手，点击棋盘交叉点落子</div>
</div>
<div class="overlay" id="startScr"><h1>⚫ 五子棋</h1><p>15×15 棋盘人机对战。<br>你执黑先手，点击交叉点落子，<br>先连成五子者获胜！</p><button class="btn" id="startBtn">开始游戏</button></div>
<div class="overlay hidden" id="overScr"><h1 id="overTitle">游戏结束</h1><p id="overText"></p><button class="btn" id="restartBtn">重新开始</button></div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');
const SZ=15,M=25,W=450,GAP=(W-2*M)/(SZ-1);
let grid,over=false,playerTurn=true;
function inb(x,y){return x>=0&&x<SZ&&y>=0&&y<SZ;}
function showOver(title,text){$('overTitle').textContent=title;$('overText').textContent=text;$('overScr').classList.remove('hidden');}
function startGame(){
  grid=Array.from({length:SZ},()=>Array(SZ).fill(0));
  over=false;playerTurn=true;
  $('state').textContent='轮到你走';
  draw();
}
function draw(){
  ctx.fillStyle='#3a2f25';ctx.fillRect(0,0,W,W);
  ctx.strokeStyle='#8d7b68';ctx.lineWidth=1;
  for(let i=0;i<SZ;i++){
    const p=M+i*GAP;
    ctx.beginPath();ctx.moveTo(M,p);ctx.lineTo(W-M,p);ctx.stroke();
    ctx.beginPath();ctx.moveTo(p,M);ctx.lineTo(p,W-M);ctx.stroke();
  }
  ctx.fillStyle='#8d7b68';
  [3,7,11].forEach(x=>{[3,7,11].forEach(y=>{
    ctx.beginPath();ctx.arc(M+x*GAP,M+y*GAP,4,0,7);ctx.fill();
  });});
  for(let y=0;y<SZ;y++)for(let x=0;x<SZ;x++){
    const v=grid[y][x];if(!v)continue;
    ctx.beginPath();ctx.arc(M+x*GAP,M+y*GAP,GAP*0.42,0,7);
    ctx.fillStyle=v===1?'#141414':'#f2f2f2';ctx.fill();
    if(v===1){ctx.strokeStyle='#444';ctx.lineWidth=1;ctx.stroke();}
  }
}
function checkWin(x,y,color){
  const dirs=[[1,0],[0,1],[1,1],[1,-1]];
  for(const d of dirs){
    let n=1;
    let nx=x+d[0],ny=y+d[1];
    while(inb(nx,ny)&&grid[ny][nx]===color){n++;nx+=d[0];ny+=d[1];}
    nx=x-d[0];ny=y-d[1];
    while(inb(nx,ny)&&grid[ny][nx]===color){n++;nx-=d[0];ny-=d[1];}
    if(n>=5)return true;
  }
  return false;
}
function shapeScore(n,open){
  if(n>=5)return 100000;
  if(n===4)return open===2?10000:800;
  if(n===3)return open===2?500:60;
  if(n===2)return open===2?40:8;
  return open===2?4:1;
}
function scorePos(x,y,color){
  const dirs=[[1,0],[0,1],[1,1],[1,-1]];
  let total=0;
  for(const d of dirs){
    let cnt1=0,end1,nx=x+d[0],ny=y+d[1];
    while(inb(nx,ny)&&grid[ny][nx]===color){cnt1++;nx+=d[0];ny+=d[1];}
    end1=inb(nx,ny)&&grid[ny][nx]===0;
    let cnt2=0,end2;nx=x-d[0];ny=y-d[1];
    while(inb(nx,ny)&&grid[ny][nx]===color){cnt2++;nx-=d[0];ny-=d[1];}
    end2=inb(nx,ny)&&grid[ny][nx]===0;
    const n=1+cnt1+cnt2,open=(end1?1:0)+(end2?1:0);
    total+=shapeScore(n,open);
  }
  return total;
}
function aiMove(){
  if(over)return;
  let best=[],bestS=-1;
  for(let y=0;y<SZ;y++)for(let x=0;x<SZ;x++){
    if(grid[y][x])continue;
    grid[y][x]=2;const s1=scorePos(x,y,2);grid[y][x]=0;
    grid[y][x]=1;const s2=scorePos(x,y,1);grid[y][x]=0;
    const s=Math.max(s1,s2*0.92);
    if(s>bestS){bestS=s;best=[[x,y]];}
    else if(s===bestS){best.push([x,y]);}
  }
  if(best.length===0){showOver('🤝 和棋','棋盘已下满，双方握手言和。');return;}
  const p=best[Math.floor(Math.random()*best.length)];
  place(p[0],p[1],2);
}
function place(x,y,color){
  if(over)return;
  grid[y][x]=color;
  draw();
  if(checkWin(x,y,color)){
    over=true;
    if(color===1)showOver('🏆 你赢了！','五子连珠，恭喜获胜！');
    else showOver('😅 你输了','电脑先连成五子，再接再厉！');
    return;
  }
  let full=true;
  for(let yy=0;yy<SZ&&full;yy++)for(let xx=0;xx<SZ;xx++)if(!grid[yy][xx]){full=false;break;}
  if(full){over=true;showOver('🤝 和棋','棋盘已下满，双方握手言和。');return;}
  if(color===1){
    playerTurn=false;
    $('state').textContent='电脑思考中…';
    setTimeout(aiMove,300);
  }else{
    playerTurn=true;
    $('state').textContent='轮到你走';
  }
}
function toGame(e,c){
  const r=c.getBoundingClientRect();
  const t=e.touches?e.touches[0]:e;
  return {x:(t.clientX-r.left)*c.width/r.width,y:(t.clientY-r.top)*c.height/r.height};
}
cv.addEventListener('pointerdown',e=>{
  if(over||!playerTurn)return;
  e.preventDefault();
  const p=toGame(e,cv);
  const ix=Math.round((p.x-M)/GAP),iy=Math.round((p.y-M)/GAP);
  if(ix<0||ix>=SZ||iy<0||iy>=SZ)return;
  if(Math.abs(p.x-(M+ix*GAP))>GAP/2||Math.abs(p.y-(M+iy*GAP))>GAP/2)return;
  if(grid[iy][ix])return;
  place(ix,iy,1);
});
$('startBtn').addEventListener('click',()=>{$('startScr').classList.add('hidden');startGame();});
$('restartBtn').addEventListener('click',()=>{$('overScr').classList.add('hidden');startGame();});
startGame();
</script>
</body>
</html>
