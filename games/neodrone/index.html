<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

<style>

const R=(a,b)=>a+Math.random()*(b-a);
function spawnRing(){const seq=L.seq&&Math.random()<.5&&!rings.some(r=>r.seq);const top=boss?170:70;
 const mk=(x,y,n)=>({x,y,hole:L.hole+save.up.mag*2,out:L.hole+12,life:L.life,age:0,vx:Math.random()<L.mv?R(-50,50):0,vy:Math.random()<L.mv?R(-30,30):0,sh:Math.random()<L.sh,gold:!!boss||Math.random()<.08,seq:n||0});
 if(seq){seqN=1;for(let k=1;k<=3;k++)rings.push(mk(R(50,W-50),R(top,H-90),k));rings.filter(r=>r.seq).forEach(r=>{r.life+=2.5;r.gold=false;});}
 else rings.push(mk(R(50,W-50),R(top,H-90)));}
function hurt(){if(inv>0)return;hp--;inv=1.3;combo=0;flash=.3;noise(.2,.15,500);if(FX)FX.burst(sparks,d.x,d.y,'#ff4d6e',16);hud();if(hp<=0)end(false);}
function pass(r){const dist=Math.hypot(d.x-r.x,d.y-r.y);r.done=1;combo++;const pf=dist<r.hole*.45;if(pf)perfect++;chips+=pf?2:1;
 waves.push({x:r.x,y:r.y,r:r.hole*.6,c:pf?'#ffe066':'#4fc3f7',a:1});
 pops.push({x:r.x,y:r.y-14,s:pf?(combo>1?'完美 ×'+combo:'完美 +2💠'):'+1💠',c:pf?'#ffe066':'#7df9ff',a:1});
 if(r.seq){if(r.seq!==seqN){combo=0;toast('❌ 顺序错了！编号环需按 1→2→3');rings=rings.filter(q=>!q.seq);tone(200,.2,'square',.05);return;}seqN++;if(seqN>3){got+=2;chips+=3;toast('✨ 编号连穿 +3');}}
 if(boss){if(r.gold){boss.hp--;if(FX)FX.burst(sparks,boss.x,boss.y,'#ffe066',20);tone(900,.15,'square',.06,300);if(boss.hp<=0){boss.dead=1;end(true);return;}}}
 else{got++;if(r.gold){time+=3;toast('⏱ +3 秒');}}
 if(FX)FX.burst(sparks,r.x,r.y,pf?'#ffe066':'#4fc3f7',pf?16:8);tone(660+Math.min(combo,8)*60,.08,'sine',.05);hud();if(!boss&&got>=L.need)end(true);}
function tick(dt){if(state!=='play')return;t+=dt;time-=dt;if(inv>0)inv-=dt;if(flash>0)flash-=dt;if(time<=0){time=0;hud();end(false);return;}
 const k=1-Math.pow(.0005,dt);let mx=(d.tx-d.x)*k,my=(d.ty-d.y)*k;const cap=(230+save.up.spd*30)*dt,m=Math.hypot(mx,my);if(m>cap){mx*=cap/m;my*=cap/m;}d.x+=mx;d.y+=my;d.x=clamp(d.x,14,W-14);d.y=clamp(d.y,boss?140:30,H-20);
 spT-=dt;const want=boss?2:(L.seq?3:2);if(spT<=0&&rings.filter(r=>!r.seq).length<want){spawnRing();spT=R(.5,1.1);}
 for(const r of rings){r.age+=dt;r.x+=r.vx*dt;r.y+=r.vy*dt;if(r.x<40||r.x>W-40)r.vx*=-1;if(r.y<70||r.y>H-60)r.vy*=-1;if(r.sh){r.hole=Math.max(10,(L.hole+save.up.mag*2)*(1-r.age/r.life*.6));r.out=r.hole+12;}
  if(!r.done&&Math.hypot(d.x-r.x,d.y-r.y)<r.hole)pass(r);if(state!=='play')return;}
 const lost=rings.filter(r=>!r.done&&r.age>r.life);if(lost.length){combo=0;if(lost.some(r=>r.seq))rings=rings.filter(q=>!q.seq);}
 rings=rings.filter(r=>!r.done&&r.age<=r.life);
 obT-=dt;if(L.obs&&obT<=0){const w=R(50,110);obs.push({x:R(w/2,W-w/2),y:-20,w,h:R(16,26),vy:R(110,170)*(1+li*.03)});obT=R(1.6,2.8)/L.obs;}
 for(const o of obs){o.y+=o.vy*dt;if(Math.abs(d.x-o.x)<o.w/2+8&&Math.abs(d.y-o.y)<o.h/2+8)hurt();}obs=obs.filter(o=>o.y<H+30);
 for(const m of mines){const a=Math.atan2(d.y-m.y,d.x-m.x);m.vx+=(Math.cos(a)*55-m.vx)*dt*.8;m.vy+=(Math.sin(a)*55-m.vy)*dt*.8;m.x+=m.vx*dt;m.y+=m.vy*dt;
  if(Math.hypot(d.x-m.x,d.y-m.y)<20){hurt();m.x=R(30,W-30);m.y=-20;m.vx=m.vy=0;}}
 if(boss){boss.x+=boss.vx*dt;if(boss.x<60||boss.x>W-60)boss.vx*=-1;boss.fire-=dt;const p2=L.boss.phase2&&boss.hp<=boss.max/2;
  if(boss.fire<=0){const n=L.boss.spread+(p2?2:0),a0=Math.atan2(d.y-boss.y,d.x-boss.x);for(let k=0;k<n;k++){const a=a0+(k-(n-1)/2)*.28;bul.push({x:boss.x,y:boss.y+20,vx:Math.cos(a)*150,vy:Math.sin(a)*150});}boss.fire=L.boss.fire*(p2?.75:1);tone(300,.08,'square',.03,150);}
  if(p2&&!boss.p2){boss.p2=1;boss.vx*=1.6;if(!FAST)toast('⚠ 核心过载：弹幕加强！');}}
 for(const b of bul){b.x+=b.vx*dt;b.y+=b.vy*dt;if(Math.hypot(d.x-b.x,d.y-b.y)<11){b.dead=1;hurt();}}bul=bul.filter(b=>!b.dead&&b.y<H+10&&b.y>-10&&b.x>-10&&b.x<W+10);
 if(Math.hypot(d.x-m.x,d.y-m.y)<cap+.1){}
 if(Math.random()<.6)trail.push({x:d.x,y:d.y,r:6,a:.55});
 waves=waves.filter(w=>{w.r+=dt*110;w.a-=dt*2.4;return w.a>0;});
 pops=pops.filter(p=>{p.y-=dt*32;p.a-=dt*1.5;return p.a>0;});
 trail=trail.filter(tr=>{tr.r=Math.max(1,tr.r-dt*10);tr.a-=dt*2.2;return tr.a>0;});
 if(Math.floor(t*4)!==Math.floor((t-dt)*4))hud();}
function end(ok){if(state!=='play')return;state='over';let st=0;const tl=Math.ceil(time);
 if(ok){st=1+(hp>=3?1:0)+(tl>=L.time*.3?1:0);if(st>(save.stars[li]||0))save.stars[li]=st;tone(523,.12,'triangle');tone(784,.3,'triangle',.1,0,.15);}else tone(220,.5,'sawtooth',.08,70);
 save.chips+=chips;legacyBest(got*10+perfect*5+(ok?tl*5:0));Store.set('save',save);
 const go=()=>{$('overH').textContent=ok?(L.boss?'👾 守门核心被击毁！':'🏁 航线完成'):(hp<=0?'💥 无人机坠毁':'⌛ 电量耗尽');$('finalScore').textContent=ok?starStr(st):(boss?'核心剩 '+boss.hp:got+' / '+L.need);
  $('overText').textContent=(ok?'剩余 '+tl+' 秒 · 生命 '+hp+'（满血且剩 30% 时间得三星）':'提示：从光环正中穿过得完美，金环 +3 秒')+' · 获得 💠'+chips;$('nextBtn').classList.toggle('hidden',!ok||li>=LV.length-1);show('overScr',true);};FAST?go():setTimeout(go,600);}
// 输入：拖动，无人机停在手指上方
let held=false;const aim=e=>{const p=posOf(e,cv,W,H);d.tx=p.x;d.ty=p.y-46;};
cv.addEventListener('pointerdown',e=>{e.preventDefault();audio();held=true;aim(e);});cv.addEventListener('pointermove',e=>{if(held||e.pointerType==='mouse')aim(e);});addEventListener('pointerup',()=>held=false);
addEventListener('keydown',e=>{const m={ArrowLeft:[-30,0],ArrowRight:[30,0],ArrowUp:[0,-30],ArrowDown:[0,30]}[e.key];if(m){d.tx=clamp(d.tx+m[0],14,W-14);d.ty=clamp(d.ty+m[1],30,H-20);}});
// 绘制
let stars=[];for(let i=0;i<60;i++)stars.push([Math.random()*W,Math.random()*H,Math.random()*2+.5]);
function draw(dt){if(FX)FX.stage(ctx,W,H,['#2b1f6b','#173a6b','#4a1d5c'][Math.floor(li/5)%3],'#070418');else{ctx.fillStyle='#070418';ctx.fillRect(0,0,W,H);}
 for(const s of stars){s[1]=(s[1]+s[2]*20*dt)%H;ctx.fillStyle='rgba(200,230,255,.5)';ctx.fillRect(s[0],s[1],s[2],s[2]);}
 if(!L){txt(ctx,'🛸',W/2,H/2,80);return;}
 for(const r of rings){const fade=r.age>r.life-1?.4+.6*Math.abs(Math.sin(r.age*12)):1;ctx.globalAlpha=fade;const col=r.seq?'#2ee6a0':r.gold?'#ffc531':r.sh?'#ff6bd6':'#4fc3f7';
  if(FX)FX.glow(ctx,col,18);ctx.strokeStyle=col;ctx.lineWidth=10;ctx.beginPath();ctx.arc(r.x,r.y,r.hole+5,0,7);ctx.stroke();if(FX)FX.noGlow(ctx);
  ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(r.x,r.y,r.hole+5,-1.6,-1.6+6.283*(1-r.age/r.life));ctx.stroke();
  if(r.seq)otxt(ctx,''+r.seq,r.x,r.y,18,r.seq===seqN?'#fff':'#9fe');else if(r.gold&&boss)txt(ctx,'⚡',r.x,r.y,16);ctx.globalAlpha=1;}
 for(const o of obs){if(FX)FX.tile(ctx,o.x-o.w/2,o.y-o.h/2,o.w,o.h,'#ff4d6e',6);else{ctx.fillStyle='#ff4d6e';ctx.fillRect(o.x-o.w/2,o.y-o.h/2,o.w,o.h);}}
 for(const m of mines){if(FX)FX.orb(ctx,m.x,m.y,12,'#ff7043');txt(ctx,'✷',m.x,m.y,14,'#fff');}
 if(boss&&!boss.dead){if(FX)FX.shadow(ctx,boss.x,boss.y+36,44,8);if(FX)FX.tile(ctx,boss.x-40,boss.y-26,80,52,boss.p2?'#ff4d6e':'#7c4dff',16);txt(ctx,'👁️',boss.x,boss.y,30);
  ctx.fillStyle='rgba(0,0,0,.4)';rr(ctx,boss.x-40,boss.y+32,80,8,4);ctx.fill();ctx.fillStyle='#ffe066';rr(ctx,boss.x-40,boss.y+32,80*boss.hp/boss.max,8,4);ctx.fill();}
 for(const b of bul){ctx.fillStyle='#ff8aa8';if(FX)FX.glow(ctx,'#ff3d6e',8);ctx.beginPath();ctx.arc(b.x,b.y,5,0,7);ctx.fill();if(FX)FX.noGlow(ctx);}
 // 无人机
 for(const tr of trail){ctx.save();ctx.globalAlpha=tr.a;ctx.fillStyle='#35f1ff';ctx.beginPath();ctx.arc(tr.x,tr.y,tr.r,0,7);ctx.fill();ctx.restore();}
 if(FX)FX.shadow(ctx,d.x,d.y+26,18,5);ctx.globalAlpha=inv>0&&Math.sin(performance.now()/50)>0?.4:1;
 if(FX)FX.orb(ctx,d.x,d.y,13,'#35f1ff');else{ctx.fillStyle='#35f1ff';ctx.beginPath();ctx.arc(d.x,d.y,13,0,7);ctx.fill();}
 const sp=performance.now()/40;for(const [ox,oy] of [[-16,-10],[16,-10],[-16,10],[16,10]]){ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(d.x+ox-7*Math.cos(sp),d.y+oy-2*Math.sin(sp));ctx.lineTo(d.x+ox+7*Math.cos(sp),d.y+oy+2*Math.sin(sp));ctx.stroke();}ctx.globalAlpha=1;
 for(const w of waves){ctx.save();ctx.globalAlpha=Math.max(0,w.a);ctx.strokeStyle=w.c;ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(w.x,w.y,w.r,0,7);ctx.stroke();ctx.restore();}
 for(const p of pops){ctx.save();ctx.globalAlpha=Math.max(0,p.a);otxt(ctx,p.s,p.x,p.y,13,p.c);ctx.restore();}
 if(FX)FX.drawBurst(ctx,sparks);if(flash>0){ctx.fillStyle='rgba(255,0,60,'+flash+')';ctx.fillRect(0,0,W,H);}
 if(combo>=3)otxt(ctx,'连穿 ×'+combo,W/2,24,16,'#ffe066');
 if(li===0&&t<4&&state==='play')otxt(ctx,'按住屏幕拖动，从光环正中穿过',W/2,H-30,14,'#ffe066');}
// 菜单
function openLevels(){state='menu';['overScr','pauseOv'].forEach(i=>show(i,false));const g=$('lvgrid');g.innerHTML='';$('lvlInfo').textContent='★'+save.stars.reduce((a,b)=>a+(b||0),0)+' / 45 · 💠'+save.chips+' · 最佳 '+legacyBest();
 LV.forEach((s,i)=>{const b=document.createElement('button');b.className='lvl';const open=i===0||(save.stars[i-1]||0)>0||(save.stars[i]||0)>0;b.disabled=!open;b.innerHTML=(open?(s.boss?'👾':i+1):'🔒')+'<small>'+(open?starStr(save.stars[i]||0):'')+'</small>';b.onclick=()=>{tone(660,.08,'triangle');startLevel(i);};g.appendChild(b);});
 const sh=$('shop');sh.innerHTML='';for(const u of UPS){const lv=save.up[u.k],cost=u.c*(lv+1);const b=document.createElement('button');b.className='ghost';b.disabled=lv>=u.max||save.chips<cost;b.innerHTML=u.n+' '+lv+'<br><small>'+(lv>=u.max?'已满级':u.d+' 💠'+cost)+'</small>';b.onclick=()=>{save.chips-=cost;save.up[u.k]++;Store.set('save',save);tone(880,.1,'triangle');openLevels();};sh.appendChild(b);}
 show('lvlScr',true);}
function showTut(done){tutorial([['🛸 驾驶','按住屏幕拖动，无人机会飞到手指上方（不挡视线）。'],['⭕ 光环','从光环中间穿过计数；越靠中心越完美，💠 越多。外圈白线是剩余时间。'],['⚠ 危险','红色落石、追踪水雷 ✷ 会撞掉生命；🟢 编号环必须按 1→2→3 顺序穿；🟡 金环 +3 秒。'],['👾 守门核心','首领关穿过 ⚡ 金环给核心造成伤害，同时躲开它的扇形弹幕。']],done);}
$('howBtn').onclick=()=>{show('lvlScr',false);showTut(openLevels);};
$('startBtn').onclick=()=>{audio();show('startScr',false);if(!save.tut){showTut(()=>{save.tut=1;Store.set('save',save);startLevel(0);});}else openLevels();};
$('bestLine').textContent='最佳 '+legacyBest();
function pause(){if(state==='play'){state='pause';show('pauseOv',true);}}
$('pauseBtn').onclick=pause;$('resumeBtn').onclick=()=>{show('pauseOv',false);state='play';last=performance.now();};$('restartBtn').onclick=()=>startLevel(li);$('menuBtn').onclick=openLevels;
$('nextBtn').onclick=()=>startLevel(li+1);$('againBtn').onclick=()=>startLevel(li);$('menu2Btn').onclick=openLevels;
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
$('spdBtn').onclick=()=>{spdMul=spdMul===1?2:1;$('spdBtn').textContent=spdMul+'×';};
let last=performance.now();function frame(tm){const dt=Math.min(.04,(tm-last)/1000);last=tm;for(let k=0;k<spdMul;k++)tick(dt);draw(dt*spdMul);requestAnimationFrame(frame);}
fit();requestAnimationFrame(frame);
window.__nd={LV,startLevel,tick,setFast:v=>FAST=v,get s(){return{state,li,got,hp,time,boss:boss&&boss.hp,d}},rings:()=>rings,obs:()=>obs.concat(mines,bul),save:()=>save};
</script>
