<style>
/* 游戏自身样式只管布局与玩法元素；颜色/面板/按钮外观交给共用皮肤（sync 时注入）。 */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{display:flex;justify-content:center;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.wrap{width:100%;max-width:480px;height:100%;padding:12px;display:flex;flex-direction:column;align-items:center;gap:10px}
.topbar{width:100%;display:flex;justify-content:space-between;align-items:center}
.topbar .tools{display:flex;gap:8px}
.topbar .tools .iconbtn{min-width:44px;min-height:44px}
#cv{width:100%;max-height:calc(100svh - 170px);aspect-ratio:360/540;object-fit:contain;touch-action:none;border-radius:16px}
.hint{font-size:13px;text-align:center}
.overlay{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;z-index:20;padding:24px;text-align:center}
.overlay.hidden{display:none}
</style>
<!-- GAME UI BEGIN -->
<style>

/* Shared presentation only; mechanics and state remain inside each standalone game. */

.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv,.screen):has(>.ui-panel){padding:20px;overflow-y:auto;overscroll-behavior:contain}

.game-ui .ui-panel{width:min(100%,380px);max-height:100%;overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:18px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:24px;padding:30px 24px;box-shadow:0 8px 0 var(--soft),0 20px 48px #15253618;text-align:center;margin:auto}

.game-ui body>.wrap>canvas:not(#fx){background-color:var(--stage);box-shadow:0 0 0 1px var(--line),0 6px 0 var(--soft);border-radius:18px;flex-shrink:0}

.game-ui body canvas:is(#cv,#game,#board){background-color:var(--stage)}
.game-ui :is(button.dbtn,button.cbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line)}

.game-ui #hud :is(.left,.right,.hudl,.hbtns){gap:5px;flex-wrap:wrap}

@media(max-height:650px){.game-ui .ui-panel{padding:18px;gap:12px}.game-ui .ui-emblem{width:60px;height:60px;font-size:32px}.game-ui .ui-panel h1{font-size:25px}.game-ui .ui-panel :is(p,.howto,.sub,.rule){font-size:13px}}

/* 2026-10-20 热修：开局/结算遮罩铺满整屏，主按钮固定在面板底部，避免被画布尺寸裁切（#10） */

      ctx.drawImage(sprite('s' + w + 'x' + h + top + bottom, w, h, 0, s, function (g) {
        var lg = g.createLinearGradient(0, 0, 0, h); lg.addColorStop(0, top); lg.addColorStop(1, bottom); g.fillStyle = lg; g.fillRect(0, 0, w, h);
        var v = g.createRadialGradient(w / 2, h * .35, Math.min(w, h) * .2, w / 2, h / 2, Math.max(w, h) * .75);
        v.addColorStop(0, 'rgba(255,255,255,' + (skin === 'b' ? .10 : .07) + ')'); v.addColorStop(1, 'rgba(0,0,0,.35)'); g.fillStyle = v; g.fillRect(0, 0, w, h);
      }), 0, 0, w, h);
    },
    // Glow is shadowBlur: cheap for a handful of shapes, never use it on every tile.
    glow: function (ctx, color, blur) { ctx.shadowColor = color; ctx.shadowBlur = blur; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0; },
    noGlow: function (ctx) { ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; },
    // Crisp rendering on high-DPI phones without changing game coordinates.
    // Only safe where input code converts with getBoundingClientRect + logical W/H, not cv.width.
    hidpi: function (cv, ctx, w, h) {
      var d = Math.max(1, Math.min(2.5, window.devicePixelRatio || 1));
      cv.width = Math.round(w * d); cv.height = Math.round(h * d); // intrinsic ratio stays w:h, so CSS sizing is unchanged
      ctx.setTransform(d, 0, 0, d, 0, 0); return d;
    },
    // Lightweight particle bursts (pooled array, no allocations per frame beyond the burst).
    burst: function (list, x, y, color, n) {
      for (var i = 0; i < (n || 12); i++) { var a = Math.random() * 6.283, v = 1 + Math.random() * 2.6; list.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 1, life: 1, c: color, r: 1.5 + Math.random() * 2.5 }); }
    },
    drawBurst: function (ctx, list) {
      for (var i = list.length - 1; i >= 0; i--) {
        var p = list[i]; p.x += p.vx; p.y += p.vy; p.vy += .12; p.life -= .035;
        if (p.life <= 0) { list.splice(i, 1); continue; }
        ctx.globalAlpha = p.life; ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (skin === 'b' ? 1.2 : 1), 0, 7); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
  };
  window.GameUI.fx = fx;
}());

</script>
<!-- GAME UI END -->
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <span class="title">🍣 寿司传送带</span>
    <span>得分 <b id="score">0</b> · 最佳 <b id="best">0</b></span>
    <span class="tools"><button class="iconbtn" id="muteBtn" aria-label="切换音效">🔊</button><button class="iconbtn" id="pauseBtn" aria-label="暂停游戏">⏸</button></span>
  </div>
  <canvas id="cv"></canvas>
  <p class="hint">点传送带上的寿司装盘 · 🌶️芥末别碰 · ✨金色大奖+50</p>
</div>
<div class="overlay" id="startScr"><h1>🍣 寿司传送带</h1><p>点传送带上的寿司，按顶部订单装盘：装对 +10，连击越高加成越多。<br>点错品种 −10；订单超时作废并扣 1 颗星，3 星扣完结束。<br>共 12 关：5 关起有🌶️芥末陷阱，8 关起✨金枪鱼大奖 +50，12 关 60 秒大胃王冲刺！<br>策略：先做快超时的简单单保连击，复杂单分高但风险大。</p><button class="btn" id="startBtn">开始游戏</button></div>
<div class="overlay hidden" id="pauseOv"><h1>⏸ 已暂停</h1><button class="btn" id="resumeBtn">继续</button><button class="btn ghost" id="quitBtn">重新开始</button></div>
<div class="overlay hidden" id="overScr"><h1>游戏结束</h1><div class="score" id="finalScore">0</div><p id="overText"></p><button class="btn" id="againBtn">再来一局</button></div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const W=360,H=540;                       // 逻辑坐标：所有玩法/命中判定都用它
const cv=$('cv'),ctx=cv.getContext('2d');
const UI=window.GameUI||{pick:(a)=>a,storageGet:k=>localStorage.getItem(k),storageSet:(k,v)=>localStorage.setItem(k,v)};
const FX=UI.fx&&UI.fx.on?UI.fx:null;     // 共用皮肤的画布立体工具；没有时走平面画法
if(FX)FX.hidpi(cv,ctx,W,H);else{cv.width=W;cv.height=H;}

// ---- 寿司品种 ----
const KINDS={
  salmon:{icon:'🍣',name:'三文鱼'},
  shrimp:{icon:'🍤',name:'虾'},
  tamago:{icon:'🥚',name:'玉子'},
  tuna:{icon:'🐟',name:'金枪鱼'},
  cucumber:{icon:'🥒',name:'黄瓜卷'},
};
const KKEYS=Object.keys(KINDS);
const BELT_Y=330, BELT_TOP=250, BELT_BOT=410;

// ---- 状态 ----
let state='menu',score=0,stars=3,level=1,doneInLevel=0,combo=0,maxCombo=0;
let belt=[],orders=[],sparks=[],floaters=[];
let spawnT=0,jackT=8,blitzT=0,last=0,beltOff=0,banner='',bannerT=0,flashRed=0,overReason='';
let best=+UI.storageGet('g100_sushigo_hs')||0;$('best').textContent=best;

// ---- 成长：寿司师傅称号 ----
let prog={titles:['见习学徒'],maxLv:0};
try{const p=JSON.parse(UI.storageGet('g100_sushigo_prog'));if(p&&Array.isArray(p.titles)&&p.titles.length)prog=p;}catch(e){}
const TITLE_UP=[[3,'板前助手'],[6,'寿司职人'],[9,'寿司大师'],[12,'寿司之神']];
function curTitle(){return prog.titles[prog.titles.length-1];}
function checkTitle(){
  for(const pair of TITLE_UP){
    if(level>=pair[0]&&prog.titles.indexOf(pair[1])<0){
      prog.titles.push(pair[1]);UI.storageSet('g100_sushigo_prog',JSON.stringify(prog));
      banner='称号解锁：'+pair[1]+'！';bannerT=2;beep(880,.15,'square');
    }
  }
  if(level>prog.maxLv){prog.maxLv=level;UI.storageSet('g100_sushigo_prog',JSON.stringify(prog));}
}

// ---- 音效：WebAudio 合成，无外部资源；遵守静音开关 ----
let muted=UI.storageGet('g100_sushigo_mute')==='1',ac=null;$('muteBtn').textContent=muted?'🔇':'🔊';
function beep(f,d,type){if(muted)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(.15,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d);}catch(e){}}
function jingle(fs){fs.forEach((f,i)=>setTimeout(()=>beep(f,.12),i*90));}
$('muteBtn').addEventListener('click',()=>{muted=!muted;UI.storageSet('g100_sushigo_mute',muted?'1':'0');$('muteBtn').textContent=muted?'🔇':'🔊';});

// ---- 输入：pointer 事件 + 按画布显示尺寸换算到逻辑坐标 ----
function posOf(e){const r=cv.getBoundingClientRect();const t=(e.touches&&e.touches.length)?e.touches[0]:(e.changedTouches&&e.changedTouches.length)?e.changedTouches[0]:e;return{x:(t.clientX-r.left)*W/r.width,y:(t.clientY-r.top)*H/r.height};}
cv.addEventListener('pointerdown',e=>{e.preventDefault();const p=posOf(e);tap(p.x,p.y);});

// ---- 订单 ----
function maxOrders(){return level>=3?2:1;}
function orderTime(lv){return lv===12?15:Math.max(12,26-lv*1.2);}
function makeOrder(lv){
  const nItems=lv<=2?(Math.random()<.5?1:2):(lv<=6?(Math.random()<.5?2:3):2+Math.floor(Math.random()*3));
  const items={};let total=0;
  for(let i=0;i<nItems;i++){
    const k=KKEYS[Math.floor(Math.random()*KKEYS.length)];
    const c=1+(lv>=5&&Math.random()<.4?1:0);       // 高关订单可能要 2 份同种
    items[k]=(items[k]||0)+c;total+=c;
  }
  return {items,total,time:orderTime(lv),t:0};
}
function fillOrders(){while(orders.length<maxOrders())orders.push(makeOrder(level));}

// ---- 传送带生成 ----
function beltSpeed(){return level===12?210:60+level*15;}
function spawnInterval(){return level===12?.7:Math.max(.8,1.7-level*.07);}
function spawnItem(){
  const need=[];
  for(const o of orders)for(const k in o.items)if(o.items[k]>0&&need.indexOf(k)<0)need.push(k);
  let kind;
  if(need.length&&Math.random()<.68)kind=need[Math.floor(Math.random()*need.length)];
  else kind=KKEYS[Math.floor(Math.random()*KKEYS.length)];
  belt.push({x:W+30,y:BELT_Y+(Math.random()*36-18),kind,r:24});
  if(level>=5&&Math.random()<.12){                  // 芥末寿司陷阱
    const disguise=KKEYS[Math.floor(Math.random()*KKEYS.length)];
    belt.push({x:W+80,y:BELT_Y+(Math.random()*36-18),kind:'wasabi',look:disguise,r:24});
  }
}

// ---- 点击判定 ----
function addFloater(txt,x,y,color){floaters.push({txt,x,y,color:color||'#ffffff',t:0});}
function burstAt(x,y,color,n){if(FX)FX.burst(sparks,x,y,color,n||14);}
function serveTap(b,i){
  if(b.kind==='wasabi'){
    belt.splice(i,1);score=Math.max(0,score-25);combo=0;flashRed=.5;
    for(const o of orders)o.t=Math.min(o.time,o.t+3);   // 扣时：所有订单倒计时 −3s
    beep(140,.3,'sawtooth');burstAt(b.x,b.y,'#7CFC00',10);
    addFloater('🌶️芥末！−25',b.x,b.y-8,'#7CFC00');return;
  }
  if(b.kind==='jackpot'){
    belt.splice(i,1);score+=50;combo++;maxCombo=Math.max(maxCombo,combo);
    jingle([1046,1318,1568]);burstAt(b.x,b.y,'#ffd700',22);
    addFloater('✨金枪鱼大奖 +50',b.x,b.y-8,'#ffd700');
    $('score').textContent=score;return;
  }
  let tgt=null;
  for(const o of orders){
    if(o.items[b.kind]>0&&(!tgt||(o.time-o.t)<(tgt.time-tgt.t)))tgt=o;
  }
  if(tgt){
    belt.splice(i,1);tgt.items[b.kind]--;combo++;maxCombo=Math.max(maxCombo,combo);
    const pts=10+Math.min(20,combo*2);score+=pts;
    beep(660+Math.min(400,combo*20),.08);burstAt(b.x,b.y,'#7CFC00',12);
    addFloater('+'+pts,b.x,b.y-8,'#b6ff9e');
    if(Object.keys(tgt.items).every(k=>tgt.items[k]<=0))completeOrder(tgt);
  }else{
    score=Math.max(0,score-10);combo=0;flashRed=.4;
    beep(180,.2,'sawtooth');burstAt(b.x,b.y,'#ff6b6b',8);
    addFloater('点错 −10',b.x,b.y-8,'#ff9e9e');
  }
  $('score').textContent=score;
}
function tap(x,y){
  if(state!=='play')return;
  for(let i=belt.length-1;i>=0;i--){
    const b=belt[i];
    if(Math.hypot(b.x-x,b.y-y)<=b.r+10){serveTap(b,i);return;}
  }
}
function completeOrder(o){
  const idx=orders.indexOf(o);if(idx>=0)orders.splice(idx,1);
  const bonus=15*o.total+Math.ceil(Math.max(0,o.time-o.t))*2;
  score+=bonus;doneInLevel++;
  jingle([523,659,784]);
  addFloater('订单完成 +'+bonus,W/2,150,'#ffe27a');
  $('score').textContent=score;
  if(level<12&&doneInLevel>=4+level)nextLevel();
  fillOrders();
}
function nextLevel(){
  level++;doneInLevel=0;combo=0;checkTitle();
  if(level===12){
    orders=[];belt=[];blitzT=60;
    banner='第12关：大胃王！60秒无限冲分！';bannerT=2.5;jingle([392,523,659,784]);
  }else{
    banner='第'+level+'关';bannerT=1.5;jingle([659,784]);
  }
  fillOrders();
}

// ---- 流程 ----
function show(id,on){$(id).classList.toggle('hidden',!on);}
function start(){
  score=0;stars=3;level=1;doneInLevel=0;combo=0;maxCombo=0;
  belt=[];sparks=[];floaters=[];spawnT=.5;jackT=8;blitzT=0;
  orders=[];fillOrders();
  banner='';bannerT=0;flashRed=0;overReason='';
  $('score').textContent=0;show('startScr',false);show('overScr',false);show('pauseOv',false);
  state='play';last=performance.now();beep(660,.12);
}
function pause(){if(state!=='play')return;state='pause';show('pauseOv',true);}
function resume(){if(state!=='pause')return;state='play';last=performance.now();show('pauseOv',false);}
function over(){
  state='over';
  if(score>best){best=score;UI.storageSet('g100_sushigo_hs',best);$('best').textContent=best;}
  if(level>prog.maxLv){prog.maxLv=level;UI.storageSet('g100_sushigo_prog',JSON.stringify(prog));}
  $('finalScore').textContent=score;
  $('overText').textContent=(overReason==='time'?'大胃王冲刺结束！':'星星扣完了…')+
    ' 第'+level+'关 · 称号「'+curTitle()+'」 · 最高连击'+maxCombo+' · 最佳'+best;
  show('overScr',true);beep(220,.4,'triangle');
}
$('startBtn').addEventListener('click',start);$('againBtn').addEventListener('click',start);
$('pauseBtn').addEventListener('click',()=>state==='play'?pause():resume());$('resumeBtn').addEventListener('click',resume);
$('quitBtn').addEventListener('click',()=>{show('pauseOv',false);start();});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});

// ---- 循环 ----
function update(dt){
  if(bannerT>0)bannerT-=dt;
  if(flashRed>0)flashRed-=dt;
  beltOff=(beltOff+beltSpeed()*dt)%48;
  for(let i=floaters.length-1;i>=0;i--){const f=floaters[i];f.t+=dt;f.y-=34*dt;if(f.t>1)floaters.splice(i,1);}
  const blitz=level===12;
  if(blitz){blitzT-=dt;if(blitzT<=0){overReason='time';return over();}}
  spawnT-=dt;
  if(spawnT<=0){spawnT=spawnInterval();spawnItem();}
  if(level>=8){jackT-=dt;if(jackT<=0){jackT=7+Math.random()*4;belt.push({x:W+30,y:BELT_Y+(Math.random()*36-18),kind:'jackpot',r:24,life:4});}}
  const sp=beltSpeed();
  for(let i=belt.length-1;i>=0;i--){
    const b=belt[i];b.x-=sp*dt;
    if(b.kind==='jackpot'){b.life-=dt;if(b.life<=0){belt.splice(i,1);continue;}}
    if(b.x<-40)belt.splice(i,1);
  }
  for(let i=orders.length-1;i>=0;i--){
    const o=orders[i];o.t+=dt;
    if(o.t>=o.time){
      orders.splice(i,1);
      if(!blitz){                                  // 第12关超时只作废、不扣星
        stars--;combo=0;flashRed=.6;beep(160,.3,'sawtooth');
        addFloater('超时！−1⭐',W/2,150,'#ffb3b3');
        if(stars<=0){overReason='stars';return over();}
      }
      orders.push(makeOrder(level));
    }
  }
}
function roundRectPath(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function drawSushi(b){
  if(FX)FX.shadow(ctx,b.x,b.y+b.r*.9,b.r*.85,5);
  if(b.kind==='jackpot'){
    if(FX)FX.glow(ctx,'#ffd700',14);
    ctx.fillStyle='#fff3c4';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill();
    if(FX)FX.noGlow(ctx);
    if(!(b.life<1.5&&Math.floor(b.life*6)%2===0)){
      ctx.font='24px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🐟',b.x,b.y);
    }
    ctx.font='13px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('⭐',b.x+b.r*.55,b.y-b.r*.55);
  }else if(b.kind==='wasabi'){
    if(FX)FX.glow(ctx,'#7CFC00',8);
    ctx.fillStyle='#f4f7f4';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill();
    if(FX)FX.noGlow(ctx);
    ctx.font='24px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(KINDS[b.look].icon,b.x,b.y);
    ctx.font='13px sans-serif';ctx.fillText('🌶️',b.x+b.r*.55,b.y+b.r*.55);  // 细心才能发现的小标记
  }else{
    ctx.fillStyle='#f8fbf8';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill();
    ctx.strokeStyle='#d8e2d8';ctx.lineWidth=2;ctx.stroke();
    ctx.font='25px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(KINDS[b.kind].icon,b.x,b.y+1);
  }
}
function drawOrderCard(o,idx,x,y,w){
  const h=108;
  if(FX)FX.tile(ctx,x,y,w,h,'#fdf6e3',10);
  else{ctx.fillStyle='#fdf6e3';ctx.fillRect(x,y,w,h);}
  ctx.textAlign='left';ctx.textBaseline='top';
  ctx.fillStyle='#5a3d1e';ctx.font='bold 14px sans-serif';
  ctx.fillText('📋 订单'+(idx+1),x+10,y+8);
  // 倒计时条
  const rem=Math.max(0,1-o.t/o.time);
  ctx.fillStyle='#e5d9c3';ctx.fillRect(x+10,y+30,w-20,8);
  ctx.fillStyle=rem<.3?'#ff5252':'#66bb6a';ctx.fillRect(x+10,y+30,(w-20)*rem,8);
  // 品项
  let ix=x+12,iy=y+46;
  for(const k in o.items){
    if(o.items[k]<=0)continue;
    ctx.font='22px sans-serif';ctx.fillText(KINDS[k].icon,ix,iy);
    ctx.fillStyle='#5a3d1e';ctx.font='bold 13px sans-serif';
    ctx.fillText('×'+o.items[k],ix+26,iy+6);
    ix+=62;if(ix>x+w-60){ix=x+12;iy+=34;}
  }
}
function draw(){
  if(FX)FX.stage(ctx,W,H,'#16423c','#061a18');     // 深色厨房
  else{ctx.fillStyle='#0a2422';ctx.fillRect(0,0,W,H);}
  if(flashRed>0){ctx.fillStyle='rgba(255,40,40,'+(flashRed*.35)+')';ctx.fillRect(0,0,W,H);}

  // 顶部订单牌
  const cw=168;
  for(let i=0;i<orders.length;i++)drawOrderCard(orders[i],i,i===0?6:W-cw-6,8,cw);

  // 状态行
  ctx.textAlign='left';ctx.textBaseline='top';ctx.font='15px sans-serif';
  ctx.fillStyle='#ffe9b8';
  ctx.fillText('⭐'.repeat(Math.max(0,stars)),10,126);
  ctx.textAlign='center';
  ctx.fillText('第'+level+'关'+(level===12?' 大胃王':'')+' · '+curTitle(),W/2,126);
  ctx.textAlign='right';
  ctx.fillStyle=combo>=5?'#ffd34d':'#cfe3df';
  ctx.fillText(combo>1?('连击×'+combo):'',W-10,126);

  // 传送带
  if(FX)FX.tile(ctx,6,BELT_TOP,W-12,BELT_BOT-BELT_TOP,'#4a3f35',14);
  else{ctx.fillStyle='#4a3f35';ctx.fillRect(6,BELT_TOP,W-12,BELT_BOT-BELT_TOP);}
  ctx.save();
  ctx.beginPath();roundRectPath(6,BELT_TOP,W-12,BELT_BOT-BELT_TOP,14);ctx.clip();
  ctx.strokeStyle='#6b5d4f';ctx.lineWidth=3;
  for(let x=-48+beltOff;x<W+48;x+=48){
    ctx.beginPath();ctx.moveTo(x,BELT_TOP+8);ctx.lineTo(x,BELT_BOT-8);ctx.stroke();
  }
  ctx.fillStyle='rgba(255,255,255,.06)';ctx.fillRect(6,BELT_TOP,W-12,26);
  for(const b of belt)drawSushi(b);
  ctx.restore();

  // 底部信息
  ctx.textAlign='center';ctx.textBaseline='top';ctx.font='14px sans-serif';ctx.fillStyle='#cfe3df';
  if(level===12){
    ctx.fillStyle='#ffd34d';ctx.font='bold 18px sans-serif';
    ctx.fillText('⏱ 剩余 '+Math.ceil(blitzT)+' 秒 · 纯冲分！',W/2,440);
  }else{
    ctx.fillText('本关完成 '+doneInLevel+' / '+(4+level)+' 单',W/2,442);
    ctx.font='13px sans-serif';ctx.fillStyle='#9dbfba';
    const locked=TITLE_UP.filter(p=>level<p[0])[0];
    ctx.fillText(locked?('下一称号：'+locked[1]+'（第'+locked[0]+'关）'):'已是最高称号「寿司之神」',W/2,466);
  }
  if(FX)FX.drawBurst(ctx,sparks);
  // 飘字
  for(const f of floaters){
    ctx.globalAlpha=Math.max(0,1-f.t);
    ctx.font='bold 15px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillStyle='#10231f';ctx.fillText(f.txt,f.x+1,f.y+1);
    ctx.fillStyle=f.color;ctx.fillText(f.txt,f.x,f.y);
    ctx.globalAlpha=1;
  }
  // 关卡横幅
  if(bannerT>0){
    ctx.font='bold 30px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillStyle='#10231f';ctx.fillText(banner,W/2+2,H/2+2);
    ctx.fillStyle='#ffe27a';ctx.fillText(banner,W/2,H/2);
  }
}
function frame(t){const dt=Math.min(.05,(t-last)/1000);last=t;if(state==='play')update(dt);draw();requestAnimationFrame(frame);}
draw();requestAnimationFrame(frame);
</script>
</body></html>
