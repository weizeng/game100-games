<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>倒水排序</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{display:flex;justify-content:center;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.wrap{width:100%;max-width:480px;height:100%;padding:10px;display:flex;flex-direction:column;align-items:center;gap:8px}
.topbar{width:100%;display:flex;justify-content:space-between;align-items:center;flex-wrap:nowrap!important;gap:6px}
.topbar .stat{font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.topbar .tools{display:flex;gap:6px}
.topbar .tools .iconbtn{min-width:44px;min-height:44px}
.stagebox{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
#cv{touch-action:none;display:block;border-radius:16px;max-width:100%;max-height:100%}
.hint{font-size:12px;text-align:center;min-height:16px;font-weight:700}
.overlay{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;z-index:20;padding:20px;text-align:center}
.overlay.hidden{display:none!important}
.lvgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:100%;max-width:360px;max-height:50vh;overflow:auto}
.lvgrid .lvl{min-height:54px;min-width:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:16px;padding:4px!important;line-height:1.1}
.lvgrid .lvl small{font-size:10px;margin-top:2px}
.rowbtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:100%}
#tutStep{font-size:12px;opacity:.7}
#toast{position:fixed;left:50%;top:16%;transform:translate(-50%,-10px);background:rgba(10,8,30,.88);color:#fff;font-weight:800;padding:10px 18px;border-radius:999px;z-index:999;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;font-size:15px;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
.shop{display:flex;flex-direction:column;gap:8px;width:100%;max-width:320px}
.shop .row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;border-radius:12px;background:rgba(255,255,255,.12)}
</style>
<!-- GAME UI BEGIN -->
<style>
:root{--page:#e7edf4;--surface:#ffffff;--soft:#dce5ef;--ink:#243952;--muted:#5b6d83;--accent:#275e9b;--on-accent:#ffffff;--line:#bacbdd;--stage:#172d48;--page:#dbe5f6;--surface:#ffffff;--soft:#f5f8fc;--ink:#17243d;--muted:#526482;--accent:#255fd0;--on-accent:#ffffff;--line:#b7cae6;--b-bg1:#eef3fc;--b-bg2:#dbe5f6;--b-btn:#2b6ef2;--b-btn-hi:#5e91f5;--b-edge:#184bb8;--b-glow:#c7ddff;--b-glow-rgb:199,221,255;--b-pedge-rgb:183,202,230;--b-btn-rgb:43,110,242;--b-bg2-rgb:219,229,246;--b-surf-rgb:255,255,255;--b-btn-ink:#ffffff;--b-btn-tsh:0 1px 2px rgba(0,0,0,.22);--b-coin-ink:#01040a;--b-coin-tsh:none;--b-key-ink:#17243d;--b-title:#17243d;--b-hint-ink:#17243d}
/* Shared presentation only; mechanics and state remain inside each standalone game. */
html.game-ui{background:var(--page);color:var(--ink);color-scheme:light;font-family:"HarmonyOS Sans SC","MiSans","OPPOSans","PingFang SC","Microsoft YaHei UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}

.game-ui body>.wrap{padding:14px 14px max(14px,env(safe-area-inset-bottom));gap:10px;max-width:500px}
.game-ui #app{background:var(--page);color:var(--ink)}
.game-ui :is(.topbar,#topbar){gap:8px;flex-wrap:wrap;min-height:54px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:8px 12px;box-shadow:0 4px 12px rgba(0,0,0,.06);font-size:13px}

.game-ui .scorebar{padding:6px 10px;gap:8px;flex-wrap:wrap}
.game-ui :is(.iconbtn,.iconBtn,.icobtn,.ibtn,.tbtn,.hbtn,.ib,.pause){min-width:44px;min-height:44px;flex-shrink:0;border-radius:12px;background:var(--soft);color:var(--ink);border:1px solid var(--line);box-shadow:none;font-size:16px}
.game-ui button{font-family:inherit;cursor:pointer;touch-action:manipulation}
.game-ui button:focus-visible,.game-ui [tabindex]:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
.game-ui :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn){background:var(--accent);color:var(--on-accent);border:1px solid transparent;border-radius:14px;min-height:48px;padding:12px 26px;font-size:16px;font-weight:800;letter-spacing:.2px;box-shadow:0 3px 0 var(--line);text-shadow:none;max-width:100%}

.game-ui :is(.pill,.hudbox,.hud .p){background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:999px;box-shadow:none;font-variant-numeric:tabular-nums}
.game-ui :is(.dbtn,.cbtn,.gbtn,.holdbtn,.firebtn,.bombbtn,.jumpbtn,.pumpbtn,.nbtn){border-radius:12px;box-shadow:0 2px 0 var(--line);min-height:44px}
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv,.screen):has(>.ui-panel){padding:16px;overflow-y:auto;overscroll-behavior:contain}
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv):has(>.ui-panel){background:var(--page);justify-content:safe center;align-items:center}
.game-ui .ui-panel{width:min(100%,372px);max-height:100%;overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:14px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:26px;padding:26px 22px;box-shadow:0 20px 44px rgba(15,25,40,.16);text-align:center;margin:auto}

.game-ui .screen>canvas.game{box-shadow:0 0 0 1px var(--line),0 12px 28px rgba(0,0,0,.14)}
.game-ui #hud{gap:6px;background:var(--surface);color:var(--ink)}
.game-ui #hud :is(.left,.t,.s,.grp,.pill){color:var(--ink)}
.game-ui #hud .pill{background:var(--surface);border-color:var(--line)}
.game-ui body canvas:is(#cv,#game,#board){background-color:var(--stage)}
.game-ui :is(button.dbtn,button.cbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.game-ui :is(button.lvl,button.lvlbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line);border-radius:12px;min-height:50px}
.game-ui :is(button.lvl,button.lvlbtn) :is(.nc,.sz,small){color:var(--muted)}
.game-ui .ui-panel button.lvl{margin:0;min-width:44px;box-shadow:none;padding:6px}
.game-ui #hud :is(.left,.right,.hudl,.hbtns){gap:5px;flex-wrap:wrap}
.game-ui #hud :is(.left,.hudl){min-width:0;flex-shrink:1}
.game-ui #hud :is(.pill,.left){font-size:12px}
.game-ui button:disabled{cursor:default;opacity:.42;box-shadow:none}
.game-ui .ui-panel .ui-assist-note{color:var(--accent);font-weight:700}
@media(min-width:700px){.game-ui body>.wrap{padding-top:24px}.game-ui .ui-panel{padding:32px 28px}}
@media(max-width:360px){.game-ui body>.wrap{padding:8px 10px;gap:8px}.game-ui .ui-panel{padding:20px 16px;gap:11px}.game-ui .ui-panel h1{font-size:24px}.game-ui .ui-emblem{width:68px;height:68px;font-size:36px;border-radius:20px}.game-ui :is(.topbar,#topbar){gap:5px;padding:6px 10px}.game-ui :is(.iconbtn,.icobtn,.ibtn,.tbtn,.ib){min-width:44px;min-height:44px}}

/* 开局/结算遮罩铺满整屏，主按钮固定在面板底部，避免被画布尺寸裁切 */
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv):has(>.ui-panel){position:fixed;inset:0;z-index:1000;border-radius:0;padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom))}

.game-ui .ui-panel :is(#startBtn,#btnStart,.startbtn,#bStart,#restartBtn,#btnRestart,#againBtn,#btnAgain,#retryBtn,#btnRetry,#playBtn,#btnPlay){position:sticky;bottom:0;z-index:3;flex-shrink:0}
.game-ui .ui-panel :not(.card,.panel,.pausecard,.ovcard,.ui-mode):has(>:is(#startBtn,#btnStart,.startbtn,#bStart,#restartBtn,#btnRestart,#againBtn,#btnAgain,#retryBtn,#btnRetry,#playBtn,#btnPlay)){position:sticky;bottom:0;z-index:3;flex-shrink:0;background:var(--surface);box-shadow:0 -10px 10px -6px var(--surface)}

<div id="toast"></div>
<script>
'use strict';

const $=id=>document.getElementById(id);
const W=360,H=540;
const cv=$('cv'),ctx=cv.getContext('2d');
const UI=window.GameUI||{pick:a=>a,storageGet:k=>localStorage.getItem(k),storageSet:(k,v)=>localStorage.setItem(k,v)};
const FX=UI.fx&&UI.fx.on?UI.fx:null;
if(FX)FX.hidpi(cv,ctx,W,H);else{cv.width=W;cv.height=H;}
const PK='g100_watersort_prog', MK='g100_watersort_mute';
const COLORS=['#FF5C8A','#FFB21E','#3FC163','#5B8CFF','#C77DFF','#FF7A59','#2DD4BF','#F472B6','#A3E635'];
const TOTAL=40;
let muted=UI.storageGet(MK)==='1',ac=null;
$('muteBtn').textContent=muted?'🔇':'🔊';
function beep(f,d,type){if(muted)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(.12,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d);}catch(e){}}
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('on'),1200);}
function show(id,on){$(id).classList.toggle('hidden',!on);}
function loadProg(){try{return JSON.parse(UI.storageGet(PK)||'{}')}catch(e){return{}}}
function saveProg(p){UI.storageSet(PK,JSON.stringify(p));}
let prog=loadProg();
if(!prog.stars)prog.stars={}; if(prog.coins==null)prog.coins=0; if(prog.unlock==null)prog.unlock=1;
if(prog.undoLv==null)prog.undoLv=0; if(prog.extraLv==null)prog.extraLv=0; if(!prog.seenTut)prog.seenTut=0;
$('muteBtn').onclick=()=>{muted=!muted;UI.storageSet(MK,muted?'1':'0');$('muteBtn').textContent=muted?'🔇':'🔊';};

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function levelSpec(n){
  // n:1..TOTAL
  const colors=Math.min(9,3+Math.floor((n-1)/4));
  const empties=n<8?2:n<20?2:3;
  const tubes=colors+empties;
  const scramble=8+n*2;
  const boss=n%5===0;
  return{colors,empties,tubes,scramble,boss,blind:boss||n>=12&&n%7===0, freeze:boss||n>=10&&n%6===0, freezeSteps:boss?3:2, par:Math.max(12,scramble)};
}

function genLevel(n){
  const sp=levelSpec(n); const rnd=mulberry32(n*9973+17);
  const tubes=[];
  for(let c=0;c<sp.colors;c++) tubes.push({layers:[c,c,c,c],blind:false,freeze:0,sealed:true});
  for(let e=0;e<sp.empties;e++) tubes.push({layers:[],blind:false,freeze:0,sealed:false});
  // reverse scramble — pour PARTIAL same-color tops so tubes mix (full-stack pours only permute sealed tubes)
  let moves=0,guard=0;
  while(moves<sp.scramble && guard++<8000){
    const src=Math.floor(rnd()*tubes.length), dst=Math.floor(rnd()*tubes.length);
    if(src===dst) continue;
    const A=tubes[src],B=tubes[dst];
    if(!A.layers.length||B.layers.length>=4) continue;
    const col=A.layers[A.layers.length-1];
    let k=0; while(A.layers.length-k>0 && A.layers[A.layers.length-1-k]===col) k++;
    const space=4-B.layers.length; let take=Math.min(k,space);
    if(take<=0) continue;
    take=1+Math.floor(rnd()*take); // 1..take — break monochrome stacks
    for(let i=0;i<take;i++){B.layers.push(A.layers.pop());}
    moves++;
  }
  for(const t of tubes){ t.sealed=t.layers.length===4 && t.layers.every(x=>x===t.layers[0]); }
  // ensure playable (not already solved)
  if(tubes.every(t=>!t.layers.length||t.sealed)){
    for(let extra=0;extra<40;extra++){
      const src=Math.floor(rnd()*tubes.length), dst=Math.floor(rnd()*tubes.length);
      if(src===dst) continue;
      const A=tubes[src],B=tubes[dst];
      if(!A.layers.length||B.layers.length>=4) continue;
      const col=A.layers[A.layers.length-1];
      let k=0; while(A.layers.length-k>0 && A.layers[A.layers.length-1-k]===col) k++;
      const space=4-B.layers.length; let take=Math.min(k,space);
      if(take<=0) continue;
      take=1+Math.floor(rnd()*take);
      for(let i=0;i<take;i++){B.layers.push(A.layers.pop());}
    }
    for(const t of tubes){ t.sealed=t.layers.length===4 && t.layers.every(x=>x===t.layers[0]); }
  }
  if(sp.blind){
    const cands=tubes.map((t,i)=>i).filter(i=>tubes[i].layers.length>=2 && !tubes[i].sealed);
    if(cands.length){ tubes[cands[Math.floor(rnd()*cands.length)]].blind=true; }
  }
  if(sp.freeze){
    const cands=tubes.map((t,i)=>i).filter(i=>tubes[i].layers.length && !tubes[i].sealed);
    if(cands.length){ tubes[cands[Math.floor(rnd()*cands.length)]].freeze=sp.freezeSteps; }
  }
  return{tubes,sp,moves:0,history:[]};
}

let state='menu', lvl=1, game=null, sel=-1, anim=null, last=0, sparks=[], waves=[], fast=1;
const LABS=[{a:'#72cbff',b:'#3b62ef',n:'🧪蔚蓝工坊'},{a:'#34d399',b:'#065f46',n:'🌿翡翠药室'},{a:'#c084fc',b:'#4c1d95',n:'🔮紫晶密室'},{a:'#fb923c',b:'#7c2d12',n:'🌋熔岩炼炉'}];
function addWave(x,y,c){waves.push({x,y,r:8,life:1,c});}
if($('spdBtn'))$('spdBtn').onclick=()=>{fast=fast===1?2:1;$('spdBtn').textContent=fast+'×';};
let extraTubes=0; // temporary empty from shop use this level

function canPour(A,B){
  if(!A||!B||A===B) return 0;
  if(A.freeze>0) return 0;
  if(!A.layers.length||B.layers.length>=4||A.sealed) return 0;
  const col=A.layers[A.layers.length-1];
  if(B.layers.length && B.layers[B.layers.length-1]!==col) return 0;
  let k=0; while(A.layers.length-k>0 && A.layers[A.layers.length-1-k]===col) k++;
  return Math.min(k,4-B.layers.length);
}

function pour(si,di){
  const A=game.tubes[si],B=game.tubes[di];
  const n=canPour(A,B); if(!n) return false;
  const snap=game.tubes.map(t=>({layers:t.layers.slice(),blind:t.blind,freeze:t.freeze,sealed:t.sealed}));
  game.history.push(snap);
  if(game.history.length>40) game.history.shift();
  const col=A.layers[A.layers.length-1];
  anim={from:si,to:di,col,n,t:0,dur:.28};
  for(let i=0;i<n;i++){B.layers.push(A.layers.pop());}
  game.moves++;
  for(const t of game.tubes){
    if(t.freeze>0) t.freeze--;
    t.sealed=t.layers.length===4 && t.layers.every(x=>x===t.layers[0]);
  }
  beep(520+col*40,.08);
  sel=-1;
  return true;
}

function undo(){
  if(!game||!game.history.length){toast('没有可撤销');return;}
  const cost=prog.undoLv>0?0:1;
  // free undos per level based on upgrade: undoLv gives free undos
  if(game._undosUsed==null) game._undosUsed=0;
  const free=prog.undoLv;
  if(game._undosUsed>=free){
    if(prog.coins<5){toast('金币不足（撤销需5币）');return;}
    prog.coins-=5; saveProg(prog);
  }
  game._undosUsed++;
  const snap=game.history.pop();
  game.tubes=snap; game.moves=Math.max(0,game.moves-1); sel=-1; anim=null;
  beep(300,.1,'triangle'); toast('已撤销'); updateStat();
}

function addTempTube(){
  if(!game) return;
  if(game._extraUsed){toast('本关已用过临时空管');return;}
  const free=prog.extraLv;
  if(!free){
    if(prog.coins<15){toast('需15币或先升级');return;}
    prog.coins-=15; saveProg(prog);
  }
  game.tubes.push({layers:[],blind:false,freeze:0,sealed:false});
  game._extraUsed=true; beep(880,.12); toast('+1 临时空管'); layoutTubes();
}

function won(){return game.tubes.every(t=>!t.layers.length||t.sealed);}

function starsFor(){
  const par=game.sp.par;
  if(game.moves<=par) return 3;
  if(game.moves<=par+Math.ceil(par*.4)) return 2;
  return 1;
}

function updateStat(){
  const s=prog.stars[lvl]||0;
  $('statLine').textContent=`关 ${lvl} · 步 ${game?game.moves:0} · 币 ${prog.coins}`;
  $('hint').textContent=game&&game.sp.boss?'⚠ Boss 关：冰冻/盲管加持 · 点试管倒水':'点选试管 → 再点目标倒水 · 撤销/空管见下方';
}

function layoutTubes(){
  // compute positions
  if(!game) return;
  const n=game.tubes.length;
  const cols=n<=6?n:Math.ceil(n/2);
  const rows=Math.ceil(n/cols);
  const tw=Math.min(48, (W-20)/cols-8);
  const th=tw*2.6;
  game._layout={tw,th,cols,rows};
  game.tubes.forEach((t,i)=>{
    const r=Math.floor(i/cols), c=i%cols;
    const rowN=Math.min(cols, n-r*cols);
    const x0=(W-rowN*(tw+8)+8)/2;
    t.x=x0+c*(tw+8)+tw/2;
    t.y=H*0.18+r*(th+28)+th/2;
    t.w=tw; t.h=th;
  });
}

function startLevel(n){
  lvl=n; game=genLevel(n); sel=-1; anim=null; sparks=[];
  if(prog.extraLv>=2){ /* passive: start with +1 empty already in gen via empties - skip */ }
  layoutTubes(); state='play'; last=performance.now();
  show('startScr',false);show('lvlScr',false);show('shopScr',false);show('tutScr',false);show('pauseOv',false);show('overScr',false);
  updateStat(); beep(660,.1);
}

function finishWin(){
  state='over';
  const st=starsFor();
  const prev=prog.stars[lvl]|0;
  if(st>prev){ prog.stars[lvl]=st; }
  const gain=10+st*5+(game.sp.boss?20:0);
  prog.coins+=gain;
  if(lvl>=prog.unlock && lvl<TOTAL) prog.unlock=lvl+1;
  saveProg(prog);
  $('overH').textContent=game.sp.boss?'Boss 通关！':'过关！';
  $('finalScore').textContent='★'.repeat(st)+'☆'.repeat(3-st);
  $('overText').textContent=`用了 ${game.moves} 步（目标 ${game.sp.par}）· +${gain} 币 · 总币 ${prog.coins}`;
  show('overScr',true); beep(880,.15); setTimeout(()=>beep(1100,.2),120);
}

function failSoft(){ /* no fail state — player can undo */ }

function hitTube(p){
  if(!game||state!=='play'||anim) return;
  for(let i=0;i<game.tubes.length;i++){
    const t=game.tubes[i];
    if(Math.abs(p.x-t.x)<Math.max(t.w*.85,28) && p.y>t.y-t.h/2-16 && p.y<t.y+t.h/2+24){
      if(sel<0){ if(!t.layers.length||t.sealed){beep(200,.05);return;} sel=i; beep(440,.05); return; }
      if(sel===i){ sel=-1; return; }
      if(pour(sel,i)){ /* ok */ }
      else { beep(160,.08,'sawtooth'); sel=i; }
      return;
    }
  }
  // bottom buttons zones
  if(p.y>H-50){
    if(p.x<W/2) undo(); else addTempTube();
  } else sel=-1;
}

function posOf(e){const r=cv.getBoundingClientRect();const t=(e.touches&&e.touches[0])||(e.changedTouches&&e.changedTouches[0])||e;return{x:(t.clientX-r.left)*W/r.width,y:(t.clientY-r.top)*H/r.height};}
cv.addEventListener('pointerdown',e=>{e.preventDefault();if(state!=='play')return;hitTube(posOf(e));});

function drawTube(t,i){
  const {x,y,w,h}=t;
  const lift=(sel===i)?-12:0;
  const yy=y+lift;
  // glass
  ctx.save();
  if(FX) FX.shadow(ctx,x,yy+h/2+6,w*.45,6);
  ctx.strokeStyle=(sel>=0&&sel!==i&&game&&canPour(game.tubes[sel],t))?'#ffd34d':'rgba(255,255,255,.85)'; ctx.lineWidth=(sel>=0&&sel!==i&&game&&canPour(game.tubes[sel],t))?3.5:3;
  ctx.fillStyle='rgba(255,255,255,.12)';
  roundRect(x-w/2,yy-h/2,w,h,w*.2); ctx.fill(); ctx.stroke();
  // layers bottom-up
  const layerH=h*0.2; const base=yy+h/2-6;
  const showBlind=t.blind && !t.sealed;
  for(let L=0;L<t.layers.length;L++){
    const col=COLORS[t.layers[L]%COLORS.length];
    const ly=base-(L+1)*layerH;
    if(showBlind && L<t.layers.length-1){ ctx.fillStyle='rgba(40,40,60,.55)'; }
    else {
      if(FX){ FX.glow(ctx,col,8); ctx.fillStyle=col; ctx.fillRect(x-w/2+4,ly,w-8,layerH-1); FX.noGlow(ctx); }
      else { ctx.fillStyle=col; ctx.fillRect(x-w/2+4,ly,w-8,layerH-1); }
    }
  }
  if(t.sealed){ ctx.fillStyle='#FFD700'; ctx.font=`${Math.floor(w*.35)}px sans-serif`; ctx.textAlign='center'; ctx.textBaseline='bottom'; ctx.fillText('✓',x,yy-h/2-2); }
  if(t.freeze>0){ ctx.fillStyle='#A5F3FC'; ctx.font=`bold ${Math.floor(w*.28)}px sans-serif`; ctx.textAlign='center'; ctx.textBaseline='top'; ctx.fillText('❄'+t.freeze,x,yy+h/2+2); }
  if(t.blind){ ctx.fillStyle='#94A3B8'; ctx.font=`${Math.floor(w*.28)}px sans-serif`; ctx.textAlign='center'; ctx.textBaseline='bottom'; ctx.fillText('?',x,yy-h/2-2); }
  ctx.restore();
}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function draw(){
  const lab=LABS[Math.min(3,((lvl-1)/10)|0)];
  if(FX) FX.stage(ctx,W,H,lab.a,lab.b); else { ctx.fillStyle=lab.b; ctx.fillRect(0,0,W,H); }
  if(!game){ ctx.fillStyle='#fff'; ctx.font='18px sans-serif'; ctx.textAlign='center'; ctx.fillText('选择关卡开始',W/2,H/2); return; }
  // title boss
  ctx.fillStyle='rgba(255,255,255,.85)'; ctx.font='bold 12px sans-serif'; ctx.textAlign='left'; ctx.fillText(lab.n,16,22);
  if(game.sp.boss){ ctx.fillStyle='#FFE08A'; ctx.font='bold 14px sans-serif'; ctx.textAlign='center'; ctx.fillText('👑 Boss 关',W/2,22); }
  for(let i=0;i<game.tubes.length;i++) drawTube(game.tubes[i],i);
  // bottom action bar
  ctx.fillStyle='rgba(0,0,0,.25)'; roundRect(16,H-48,W/2-24,36,12); ctx.fill();
  roundRect(W/2+8,H-48,W/2-24,36,12); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='bold 14px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('↩ 撤销',W/4,H-30); ctx.fillText('＋ 空管',W*3/4,H-30);
  for(const w of waves){ctx.save();ctx.globalAlpha=Math.max(0,w.life);ctx.strokeStyle=w.c;ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(w.x,w.y,w.r,0,Math.PI*2);ctx.stroke();ctx.restore();}
  if(FX) FX.drawBurst(ctx,sparks);
}

function update(dt){
  for(let i=waves.length-1;i>=0;i--){waves[i].r+=110*dt;waves[i].life-=dt*2.4;if(waves[i].life<=0)waves.splice(i,1);}
  if(anim){ anim.t+=dt*fast; if(anim.t>=anim.dur){ addWave(W/2,H/2,'#ffd34d'); anim=null; if(won()) finishWin(); } }
}

function frame(t){ const dt=Math.min(.05,(t-last)/1000); last=t; if(state==='play') update(dt); draw(); requestAnimationFrame(frame); }
draw(); requestAnimationFrame(frame);

function tutorial(pages,done){ let i=0; function render(){ $('tutH').textContent=pages[i][0]; $('tutP').innerHTML=pages[i][1]; $('tutStep').textContent=(i+1)+' / '+pages.length; $('tutNext').textContent=i<pages.length-1?'下一步':'开始挑战'; }
  show('tutScr',true); render();
  $('tutNext').onclick=()=>{ if(i<pages.length-1){i++;render();} else {show('tutScr',false);done();} };
  $('tutSkip').onclick=()=>{show('tutScr',false);done();};
}

function openLevels(){
  show('startScr',false); show('shopScr',false); show('overScr',false); show('pauseOv',false); show('lvlScr',true);
  const stars=Object.values(prog.stars).reduce((a,b)=>a+b,0);
  $('lvlInfo').textContent=`解锁至第 ${prog.unlock} 关 · 总星 ${stars} · 金币 ${prog.coins}`;
  const g=$('lvgrid'); g.innerHTML='';
  for(let i=1;i<=TOTAL;i++){
    const b=document.createElement('button'); b.className='btn lvl';
    const locked=i>prog.unlock; const st=prog.stars[i]|0; const boss=i%5===0;
    b.innerHTML=locked?'🔒':`${boss?'👑':''}${i}<small>${'★'.repeat(st)}${'☆'.repeat(3-st)}</small>`;
    b.disabled=locked; if(!locked) b.onclick=()=>enterLevel(i);
    g.appendChild(b);
  }
}

function enterLevel(n){
  const go=()=>startLevel(n);
  if(!prog.seenTut){ prog.seenTut=1; saveProg(prog);
    tutorial([
      ['倒水排序','点一支有水的试管选中，再点另一支把顶层同色液体倒过去。'],
      ['规则','只能倒在空管或顶色相同的管子上；每管最多 4 层，集齐同色自动封管。'],
      ['特殊关','盲管只显示顶层；冰冻管前几步倒不出去。底部可撤销、加临时空管。'],
      ['目标','全部封管即过关。步数越少星级越高；每 5 关是 Boss。']
    ], go);
  } else go();
}

function openShop(){
  show('lvlScr',false); show('shopScr',true);
  $('coinLine').textContent='金币：'+prog.coins;
  const items=[
    {k:'undoLv',name:'撤销次数',desc:'每关免费撤销 +1（当前 '+prog.undoLv+'）',cost:20+prog.undoLv*15,max:5},
    {k:'extraLv',name:'空管升级',desc:'商店空管折扣/强化（Lv '+prog.extraLv+'）',cost:25+prog.extraLv*20,max:3},
  ];
  const box=$('shopList'); box.innerHTML='';
  for(const it of items){
    const row=document.createElement('div'); row.className='row';
    const left=document.createElement('div'); left.innerHTML=`<b>${it.name}</b><br><small>${it.desc}</small>`;
    const btn=document.createElement('button'); btn.className='btn'; btn.textContent=prog[it.k]>=it.max?'已满级':`${it.cost}币`;
    btn.disabled=prog[it.k]>=it.max||prog.coins<it.cost;
    btn.onclick=()=>{ if(prog.coins<it.cost||prog[it.k]>=it.max)return; prog.coins-=it.cost; prog[it.k]++; saveProg(prog); beep(900,.1); openShop(); };
    row.appendChild(left); row.appendChild(btn); box.appendChild(row);
  }
}

$('startBtn').onclick=()=>openLevels();
$('backStart').onclick=()=>{show('lvlScr',false);show('startScr',true);};
$('shopBtn').onclick=openShop; $('shopBack').onclick=()=>openLevels();
$('pauseBtn').onclick=()=>{ if(state==='play'){ state='pause'; show('pauseOv',true);} else if(state==='pause'){ state='play'; last=performance.now(); show('pauseOv',false);} };
$('resumeBtn').onclick=()=>{ state='play'; last=performance.now(); show('pauseOv',false); };
$('menuBtn').onclick=()=>{ show('pauseOv',false); state='menu'; openLevels(); };
$('againBtn').onclick=()=>startLevel(lvl);
$('nextBtn').onclick=()=>{ if(lvl<TOTAL) startLevel(lvl+1); else openLevels(); };
$('menu2Btn').onclick=()=>{ show('overScr',false); openLevels(); };
document.addEventListener('visibilitychange',()=>{ if(document.hidden && state==='play'){ state='pause'; show('pauseOv',true);} });
$('bestLine').textContent='进度：解锁 '+prog.unlock+' / '+TOTAL+' · 币 '+prog.coins;

</script>
</body></html>
