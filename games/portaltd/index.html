<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

<style>
:root{--page:#10182f;--surface:#1a2742;--soft:#243754;--ink:#eff7ff;--muted:#adc3da;--accent:#8dded6;--on-accent:#102b36;--line:#38506b;--stage:#111e36;--page:#070b1a;--surface:#141c38;--soft:#242c46;--ink:#eef3ff;--muted:#9ba9cf;--accent:#22c4ed;--on-accent:#084559;--line:#4b66bd;--b-bg1:#131a3a;--b-bg2:#070b1a;--b-btn:#22c4ed;--b-btn-hi:#53d1f1;--b-edge:#0e7da1;--b-glow:#6ecbff;--b-glow-rgb:110,203,255;--b-pedge-rgb:75,102,189;--b-btn-rgb:34,196,237;--b-bg2-rgb:7,11,26;--b-surf-rgb:20,28,56;--b-btn-ink:#084559;--b-btn-tsh:0 1px 0 rgba(255,255,255,.35);--b-coin-ink:#084559;--b-coin-tsh:none;--b-key-ink:#eef3ff;--b-title:#ffffff;--b-hint-ink:#f1f5ff}

<body>
<div class="wrap">

<div id="toast"></div>
<script>
const PK='g100_portaltd_prog',HK='g100_portaltd_hs',MK='g100_portaltd_mute';
const TOTAL=16;
'use strict';
const $=id=>document.getElementById(id);
const W=360,H=540;
const cv=$('cv'),ctx=cv.getContext('2d');
const UI=window.GameUI||{pick:a=>a,storageGet:k=>localStorage.getItem(k),storageSet:(k,v)=>localStorage.setItem(k,v)};

if(FX)FX.hidpi(cv,ctx,W,H);else{cv.width=W;cv.height=H;}
function show(id,on){$(id).classList.toggle('hidden',!on);}
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('on'),1400);}
function posOf(e){const r=cv.getBoundingClientRect();const t=(e.touches&&e.touches[0])||(e.changedTouches&&e.changedTouches[0])||e;return{x:(t.clientX-r.left)*W/r.width,y:(t.clientY-r.top)*H/r.height};}

$('muteBtn').onclick=()=>{muted=!muted;UI.storageSet(MK,muted?'1':'0');$('muteBtn').textContent=muted?'🔇':'🔊';};
function loadProg(){try{return JSON.parse(UI.storageGet(PK)||'{}');}catch(e){return{};}}
function saveProg(p){UI.storageSet(PK,JSON.stringify(p));}
let prog=loadProg();
if(!prog.stars)prog.stars={};if(prog.coins==null)prog.coins=0;if(prog.unlock==null)prog.unlock=1;if(!prog.seenTut)prog.seenTut=0;
let best=+UI.storageGet(HK)||0;$('best').textContent=best;if($('bestLine'))$('bestLine').textContent='解锁 '+prog.unlock+'/'+TOTAL+' · 币 '+prog.coins;
let state='menu',lvl=1,score=0,sparks=[],last=performance.now(),boss=false,diff=1;
let hits=[],pointer={down:false,x:0,y:0};
function addHit(x,y,w,h,fn){hits.push({x,y,w,h,fn});}
function inHit(p){for(let i=hits.length-1;i>=0;i--){const h=hits[i];if(p.x>=h.x&&p.x<=h.x+h.w&&p.y>=h.y&&p.y<=h.y+h.h){h.fn(p);return true;}}return false;}
function tile(x,y,w,h,col,rad){if(FX)FX.tile(ctx,x,y,w,h,col,rad==null?8:rad);else{ctx.fillStyle=col;ctx.fillRect(x,y,w,h);}}
function orb(x,y,r,col){if(FX)FX.orb(ctx,x,y,r,col);else{ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();}}
function stage(a,b){if(FX)FX.stage(ctx,W,H,a,b);else{ctx.fillStyle=b;ctx.fillRect(0,0,W,H);}}
function label(t,x,y,col,size,align){ctx.fillStyle=col||'#fff';ctx.font='bold '+(size||13)+'px sans-serif';ctx.textAlign=align||'left';ctx.textBaseline='middle';ctx.fillText(t,x,y);}
function btn(x,y,w,h,text,col,fn){tile(x,y,w,h,col||'#ffcf33',12);label(text,x+w/2,y+h/2,'#3a2200',13,'center');addHit(x,y,w,h,fn);}
cv.addEventListener('pointerdown',e=>{if(state!=='play')return;e.preventDefault();cv.setPointerCapture&&cv.setPointerCapture(e.pointerId);const p=posOf(e);pointer.down=true;pointer.x=p.x;pointer.y=p.y;if(typeof onDown==='function')onDown(p,e);else inHit(p);});

['pointerup','pointercancel'].forEach(ev=>cv.addEventListener(ev,e=>{if(!pointer.down)return;pointer.down=false;const p=posOf(e);if(typeof onUp==='function')onUp(p,e);}));

const TUT=[["布防","点空地建造炮塔，炮塔会自动攻击附近怪物。"],["传送门","点彩色门可开关或旋转，同色怪物会走更长的弯路。"],["资源","击败怪物获得金币，用于建塔或升级门户。"],["首领","每 5 关的首领会尝试走错门，需提前打开对应颜色的门。"]];
const SHOP=[
  {k:'towLv',name:'炮台图纸',max:3,cost(){return 30+(prog.towLv|0)*25;},desc(){return '炮塔伤害提高';}},
  {k:'porLv',name:'门控核心',max:2,cost(){return 40+(prog.porLv|0)*30;},desc(){return '开局多一扇传送门';}},
  {k:'goldLv',name:'军饷',max:2,cost(){return 30+(prog.goldLv|0)*25;},desc(){return '开局金币更多';}}
];
const REALMS=[
  {name:'星际裂隙',bg1:'#0b1028',bg2:'#040712',slot:'#334155'},
  {name:'翠绿回廊',bg1:'#0d3b32',bg2:'#041411',slot:'#27594e'},
  {name:'炽炎虚空',bg1:'#3b1128',bg2:'#14040e',slot:'#592542'}
];
function realmTheme(){return REALMS[Math.min(2,Math.floor((lvl-1)/5))];}
let gold=0,lives=5,t=0,spawnI=0,enemies=[],towers=[],portals=[],slots=[],goal=0,killed=0,wave=[],sel=null,beams=[],spd=1;
const COLS={R:'#fda4af',B:'#7dd3fc',Y:'#ffd34d'};
function beginPlay(hint){score=0;sparks=[];show('lvlScr',false);show('shopScr',false);show('overScr',false);show('pauseOv',false);show('startScr',false);state='play';last=performance.now();beep(660,.1);$('score').textContent=0;$('hint').textContent=hint;}
function pathPts(usePortal,col,openMap){
  const main=[{x:40,y:40},{x:40,y:200},{x:180,y:200},{x:180,y:360},{x:320,y:360},{x:320,y:500}];
  const bend=[{x:40,y:40},{x:40,y:200},{x:40,y:360},{x:180,y:360},{x:180,y:200},{x:320,y:200},{x:320,y:360},{x:320,y:500}];
  if(usePortal&&openMap[col])return bend;
  return main;
}
function startLevel(n){
  lvl=n|0;boss=lvl%5===0;
  gold=60+(prog.goldLv|0)*25+Math.max(0,8-lvl)*2;lives=4+(lvl<=2?1:0);
  t=0;spawnI=0;enemies=[];towers=[];beams=[];sel=null;killed=0;
  slots=[{x:90,y:120},{x:130,y:250},{x:230,y:250},{x:250,y:430},{x:90,y:430},{x:230,y:120}];
  portals=[{c:'R',on:1,x:40,y:200},{c:'B',on:1,x:180,y:360}];
  if((prog.porLv|0)>=1||lvl>=4)portals.push({c:'Y',on:lvl>=4?1:0,x:180,y:200});
  const nEn=8+lvl+(boss?4:0);
  wave=[];const cols=['R','B','Y'];
  for(let i=0;i<nEn;i++){
    const c=cols[i% (lvl>=4?3:2)];
    const hp=8+lvl*2+(boss&&i===nEn-1?28:0);
    const spd=28+lvl*2+(boss&&i===nEn-1?8:0);
    wave.push({c,hp,max:hp,spd,boss:boss&&i===nEn-1,t:i*(1.05-Math.min(0.4,lvl*0.02))});
  }
  goal=nEn;diff=lvl*10+nEn*3+(boss?28:0);
  beginPlay(boss?'首领会错门，提前打开它的颜色门':'建塔并开关传送门，别让怪物摸到终点');
}
function openMap(){const o={};for(const p of portals)o[p.c]=p.on;return o;}
function spawn(){
  while(spawnI<wave.length&&t>=wave[spawnI].t){
    const w=wave[spawnI++];
    const path=pathPts(true,w.c,openMap());
    enemies.push({...w,x:path[0].x,y:path[0].y,pi:0,path,burn:0});
  }
}
function retarget(e){
  const path=pathPts(true,e.c,openMap());
  e.path=path;
  if(e.pi>=path.length)e.pi=path.length-1;
}
function build(slot){
  const ex=towers.find(t=>t.x===slot.x&&t.y===slot.y);
  if(ex){
    if((ex.lv||1)>=3){toast('已达最高 Lv3');return;}
    const upCost=50;if(gold<upCost){toast('升级需 '+upCost+' 金币');return;}
    gold-=upCost;ex.lv=(ex.lv||1)+1;ex.dps=Math.round(ex.dps*1.5);ex.r+=10;
    if(FX)FX.burst(sparks,ex.x,ex.y,'#38bdf8',12);beep(860,.08);toast('炮塔升至 Lv'+ex.lv);return;
  }
  const cost=40;if(gold<cost){toast('金币不足');return;}
  gold-=cost;towers.push({x:slot.x,y:slot.y,lv:1,r:70+(prog.towLv|0)*8,dps:7+(prog.towLv|0)*3+Math.floor(lvl/4),cd:0});
  if(FX)FX.burst(sparks,slot.x,slot.y,'#38bdf8',8);beep(700,.07);
}
function onDown(p){
  for(const por of portals){if(Math.hypot(p.x-por.x,p.y-por.y)<22){por.on=por.on?0:1;enemies.forEach(retarget);beep(500,.06);return;}}
  for(const s of slots){if(Math.hypot(p.x-s.x,p.y-s.y)<24){build(s);return;}}
}
function update(dt){
  t+=dt;spawn();
  for(const tw of towers){
    tw.cd-=dt;
    if(tw.cd<=0){
      let best=null,bd=tw.r;
      for(const e of enemies){const d=Math.hypot(e.x-tw.x,e.y-tw.y);if(d<bd){bd=d;best=e;}}
      if(best){best.hp-=tw.dps;tw.cd=0.45/(1+((tw.lv||1)-1)*0.15);beams.push({x1:tw.x,y1:tw.y,x2:best.x,y2:best.y,t:1});if(FX)FX.burst(sparks,best.x,best.y,'#ffd34d',4);}
    }
  }
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];
    if(e.hp<=0){gold+=8+(e.boss?20:0);killed++;score+=10+(e.boss?40:0);$('score').textContent=score;if(FX)FX.burst(sparks,e.x,e.y,COLS[e.c],14);enemies.splice(i,1);beep(880,.06);continue;}
    const path=e.path;const tgt=path[Math.min(e.pi+1,path.length-1)];
    const dx=tgt.x-e.x,dy=tgt.y-e.y,len=Math.hypot(dx,dy)||1;
    const step=e.spd*dt*(e.boss&&!openMap()[e.c]?1.25:1);
    if(len<=step+1){e.x=tgt.x;e.y=tgt.y;e.pi++;if(e.pi>=path.length-1){lives--;enemies.splice(i,1);beep(160,.15,'sawtooth');if(lives<=0)lose('基地被突破');continue;}}
    else{e.x+=dx/len*step;e.y+=dy/len*step;}
  }
  if(spawnI>=wave.length&&!enemies.length){if(lives>0)win();else lose('基地被突破');}
}
function draw(){
  const rm=realmTheme();
  hits=[];stage(rm.bg1,rm.bg2);
  if(state!=='play'&&state!=='pause')return;
  const show=pathPts(true,'R',{R:1,B:1,Y:1});
  const mainP=pathPts(false,'R',{});
  ctx.strokeStyle='rgba(255,255,255,.18)';ctx.lineWidth=16;ctx.lineCap='round';ctx.beginPath();
  show.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke();
  ctx.save();ctx.strokeStyle='rgba(255,110,130,.28)';ctx.lineWidth=4;ctx.setLineDash([6,6]);ctx.beginPath();
  mainP.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke();ctx.restore();
  label('🌀',40,40,'#fff',16,'center');label('🏰',320,500,'#fff',16,'center');
  for(const s of slots){
    const used=towers.some(t=>t.x===s.x&&t.y===s.y);
    tile(s.x-16,s.y-16,32,32,used?'#64748b':rm.slot,8);
  }
  for(const tw of towers){
    ctx.strokeStyle='rgba(56,189,248,.18)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(tw.x,tw.y,tw.r,0,7);ctx.stroke();
    if(FX&&FX.glow){FX.glow(ctx,'#00e5ff',10);orb(tw.x,tw.y,14,'#38bdf8');FX.noGlow(ctx);}else orb(tw.x,tw.y,14,'#38bdf8');
    if((tw.lv||1)>1)label('★'.repeat(tw.lv-1),tw.x,tw.y,'#ffe066',9,'center');
  }
  for(let i=beams.length-1;i>=0;i--){const b=beams[i];b.t-=0.09;if(b.t<=0){beams.splice(i,1);continue;}ctx.save();ctx.globalAlpha=b.t;ctx.strokeStyle='#7dd3fc';ctx.lineWidth=3*b.t;ctx.beginPath();ctx.moveTo(b.x1,b.y1);ctx.lineTo(b.x2,b.y2);ctx.stroke();ctx.restore();}
  for(const p of portals){
    ctx.strokeStyle=p.on?COLS[p.c]:'rgba(148,163,184,.3)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,p.y,19+Math.sin(t*5)*1.5,0,7);ctx.stroke();
    orb(p.x,p.y,16,p.on?COLS[p.c]:'#475569');
    label(p.on?'开':'关',p.x,p.y,'#0b0620',10,'center');
  }
  for(const e of enemies){
    orb(e.x,e.y,e.boss?16:10,COLS[e.c]);
    if(e.boss)label('👑',e.x,e.y,'#fff',11,'center');
    tile(e.x-12,e.y-20,24,4,'#1e293b',2);tile(e.x-12,e.y-20,24*(e.hp/e.max),4,'#86efac',2);
  }
  label((boss?'👑 ':'')+'关'+lvl+' '+rm.name+' · 命'+lives+' · 金'+gold+' · '+killed+'/'+goal,12,20,'#fff',12,'left');
  label('点空位建塔40 · 点塔升级50 · 点门开关',12,H-22,'#94a3b8',11,'left');
  if(FX&&FX.drawBurst)FX.drawBurst(ctx,sparks);
}
function win(){if(state!=='play')return;finishWin(lives>=3?3:lives>=2?2:1,40+lvl*3+(boss?30:0)+lives*8+killed,'门缝守住了！');}
function lose(msg){if(state!=='play')return;finishLose(msg||'防线失守');}
window.__T={go(n){prog.seenTut=1;saveProg(prog);startLevel(n|0||1);},win(){if(state!=='play')startLevel(lvl||1);win();},lose(){if(state!=='play')startLevel(lvl||1);lose('测试失败');},buildAt(i){if(slots[i])build(slots[i]);},toggle(i){if(portals[i]){portals[i].on=portals[i].on?0:1;enemies.forEach(retarget);}},state(){return{state,lvl,score,boss,diff,gold,lives,killed,goal,nEn:wave.length,nTw:towers.length};}};

function finishWin(stars,gain,title){state='over';const prev=prog.stars[lvl]|0;if(stars>prev)prog.stars[lvl]=stars;prog.coins+=gain;if(lvl>=prog.unlock&&lvl<TOTAL)prog.unlock=lvl+1;saveProg(prog);if(score>best){best=score;UI.storageSet(HK,best);$('best').textContent=best;}$('overH').textContent=title||'过关！';$('finalScore').textContent='★'.repeat(stars)+'☆'.repeat(Math.max(0,3-stars));$('overText').textContent='第 '+lvl+' 关 · +'+gain+'币 · 得分 '+score;show('overScr',true);beep(880,.22);}
function finishLose(msg){state='over';$('overH').textContent='失败';$('finalScore').textContent='💀';$('overText').textContent=(msg||'')+' · 得分 '+score;show('overScr',true);beep(160,.35,'triangle');}
function tutorial(steps,done){let i=0;show('tutScr',true);const paint=()=>{$('tutH').textContent=steps[i][0];$('tutP').textContent=steps[i][1];$('tutStep').textContent=(i+1)+'/'+steps.length;};paint();$('tutNext').onclick=()=>{i++;if(i>=steps.length){show('tutScr',false);done();}else paint();};$('tutSkip').onclick=()=>{show('tutScr',false);done();};}
function openLevels(){state='menu';show('startScr',false);show('shopScr',false);show('overScr',false);show('pauseOv',false);show('tutScr',false);show('lvlScr',true);$('lvlInfo').textContent='解锁 '+prog.unlock+'/'+TOTAL+' · 币 '+prog.coins;const g=$('lvgrid');g.innerHTML='';for(let i=1;i<=TOTAL;i++){const b=document.createElement('button');b.className='btn lvl';const locked=i>prog.unlock;const st=prog.stars[i]|0;b.innerHTML=locked?'🔒':((i%5===0?'👑':'')+i+'<small>'+'★'.repeat(st)+'</small>');b.disabled=locked;if(!locked)b.onclick=()=>enter(i);g.appendChild(b);}}
function enter(n){const go=()=>startLevel(n);if(!prog.seenTut){prog.seenTut=1;saveProg(prog);tutorial(TUT,go);}else go();}
function openShop(){show('lvlScr',false);show('shopScr',true);$('coinLine').textContent='金币：'+prog.coins;const box=$('shopList');box.innerHTML='';for(const it of SHOP){if(prog[it.k]==null)prog[it.k]=0;const row=document.createElement('div');row.className='row';row.innerHTML='<div><b>'+it.name+'</b><br><small>'+it.desc()+'</small></div>';const b=document.createElement('button');b.className='btn';const maxed=prog[it.k]>=it.max;const cost=it.cost();b.textContent=maxed?'满级':cost+'币';b.disabled=maxed||prog.coins<cost;b.onclick=()=>{prog.coins-=cost;prog[it.k]++;saveProg(prog);beep(900,.1);openShop();};row.appendChild(b);box.appendChild(row);}}
$('startBtn').onclick=openLevels;$('backStart').onclick=()=>{show('lvlScr',false);show('startScr',true);};
$('spdBtn').onclick=()=>{spd=spd===1?2:1;$('spdBtn').textContent=spd+'×';toast('波次速度 '+spd+'×');};
$('shopBtn').onclick=openShop;$('shopBack').onclick=openLevels;
$('pauseBtn').onclick=()=>{if(state==='play'){state='pause';show('pauseOv',true);}else if(state==='pause'){state='play';last=performance.now();show('pauseOv',false);}};
$('resumeBtn').onclick=()=>{state='play';last=performance.now();show('pauseOv',false);};
$('menuBtn').onclick=()=>{show('pauseOv',false);state='menu';openLevels();};
$('againBtn').onclick=()=>startLevel(lvl);
$('nextBtn').onclick=()=>{if(lvl<TOTAL)startLevel(lvl+1);else openLevels();};
$('menu2Btn').onclick=()=>{show('overScr',false);openLevels();};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play'){state='pause';show('pauseOv',true);}});
requestAnimationFrame(function frame(t){const dt=Math.min(.05,(t-last)/1000);last=t;if(state==='play'&&typeof update==='function'){for(let i=0;i<spd;i++){update(dt);if(state!=='play')break;}}if(typeof draw==='function')draw();requestAnimationFrame(frame);});

</script>
