<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>王格争霸</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{display:flex;justify-content:center;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.wrap{width:100%;max-width:480px;height:100%;padding:10px;display:flex;flex-direction:column;align-items:center;gap:8px}
.topbar{width:100%;display:flex;justify-content:space-between;align-items:center;flex-wrap:nowrap!important;gap:6px}
.topbar .stat{font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.topbar .tools{display:flex;gap:6px}
.topbar .tools .iconbtn{min-width:44px;min-height:44px}
.stagebox{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
#cv{touch-action:none;display:block;border-radius:16px;max-width:100%;max-height:100%}
.hint{font-size:12px;text-align:center;min-height:16px;font-weight:700}
.overlay{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;z-index:20;padding:20px;text-align:center}
.overlay.hidden{display:none!important}
.lvgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:100%;max-width:360px;max-height:50vh;overflow:auto}
.lvgrid .lvl{min-height:54px;min-width:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:16px;padding:4px!important;line-height:1.1}
.lvgrid .lvl small{font-size:10px;margin-top:2px}
.rowbtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:100%}
#tutStep{font-size:12px;opacity:.7}
#toast{position:fixed;left:50%;top:16%;transform:translate(-50%,-10px);background:rgba(10,8,30,.88);color:#fff;font-weight:800;padding:10px 18px;border-radius:999px;z-index:999;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;font-size:15px;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
.shop{display:flex;flex-direction:column;gap:8px;width:100%;max-width:320px}
.shop .row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;border-radius:12px;background:rgba(255,255,255,.12)}
</style>
<!-- GAME UI BEGIN -->
<style>
:root{--page:#e7edf4;--surface:#ffffff;--soft:#dce5ef;--ink:#243952;--muted:#5b6d83;--accent:#275e9b;--on-accent:#ffffff;--line:#bacbdd;--stage:#172d48;--page:#dbe5f6;--surface:#ffffff;--soft:#f5f8fc;--ink:#17243d;--muted:#526482;--accent:#255fd0;--on-accent:#ffffff;--line:#b7cae6;--b-bg1:#eef3fc;--b-bg2:#dbe5f6;--b-btn:#2b6ef2;--b-btn-hi:#5e91f5;--b-edge:#184bb8;--b-glow:#c7ddff;--b-glow-rgb:199,221,255;--b-pedge-rgb:183,202,230;--b-btn-rgb:43,110,242;--b-bg2-rgb:219,229,246;--b-surf-rgb:255,255,255;--b-btn-ink:#ffffff;--b-btn-tsh:0 1px 2px rgba(0,0,0,.22);--b-coin-ink:#01040a;--b-coin-tsh:none;--b-key-ink:#17243d;--b-title:#17243d;--b-hint-ink:#17243d}
/* Shared presentation only; mechanics and state remain inside each standalone game. */
html.game-ui{background:var(--page);color:var(--ink);color-scheme:light;font-family:"HarmonyOS Sans SC","MiSans","OPPOSans","PingFang SC","Microsoft YaHei UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}

.game-ui body>.wrap{padding:14px 14px max(14px,env(safe-area-inset-bottom));gap:10px;max-width:500px}
.game-ui #app{background:var(--page);color:var(--ink)}
.game-ui :is(.topbar,#topbar){gap:8px;flex-wrap:wrap;min-height:54px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:8px 12px;box-shadow:0 4px 12px rgba(0,0,0,.06);font-size:13px}
.game-ui :is(.title,.tb-title,#topbar .t,.topbar .t){color:var(--ink);font-size:16px;font-weight:800;letter-spacing:-.2px}

.game-ui :is(.stat,.topbar .s,.topbar .stat,.scorebar,.stats,.tip,.hint,.hintline,.hsline,.best,.hiscore){color:var(--muted);line-height:1.6}

.game-ui .scorebar{padding:6px 10px;gap:8px;flex-wrap:wrap}
.game-ui :is(.iconbtn,.iconBtn,.icobtn,.ibtn,.tbtn,.hbtn,.ib,.pause){min-width:44px;min-height:44px;flex-shrink:0;border-radius:12px;background:var(--soft);color:var(--ink);border:1px solid var(--line);box-shadow:none;font-size:16px}
.game-ui button{font-family:inherit;cursor:pointer;touch-action:manipulation}
.game-ui button:focus-visible,.game-ui [tabindex]:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
.game-ui :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn){background:var(--accent);color:var(--on-accent);border:1px solid transparent;border-radius:14px;min-height:48px;padding:12px 26px;font-size:16px;font-weight:800;letter-spacing:.2px;box-shadow:0 3px 0 var(--line);text-shadow:none;max-width:100%}

.game-ui :is(.pill,.hudbox,.hud .p){background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:999px;box-shadow:none;font-variant-numeric:tabular-nums}
.game-ui :is(.dbtn,.cbtn,.gbtn,.holdbtn,.firebtn,.bombbtn,.jumpbtn,.pumpbtn,.nbtn){border-radius:12px;box-shadow:0 2px 0 var(--line);min-height:44px}
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv,.screen):has(>.ui-panel){padding:16px;overflow-y:auto;overscroll-behavior:contain}
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv):has(>.ui-panel){background:var(--page);justify-content:safe center;align-items:center}
.game-ui .ui-panel{width:min(100%,372px);max-height:100%;overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:14px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:26px;padding:26px 22px;box-shadow:0 20px 44px rgba(15,25,40,.16);text-align:center;margin:auto}

.game-ui .ui-panel :is(h1,h2,.gamename,.gametitle){font-size:27px;line-height:1.25;font-weight:850;color:var(--ink);background:none;-webkit-text-fill-color:currentColor;text-shadow:none;letter-spacing:-.4px;margin:0}
.game-ui .ui-panel :is(p,.howto,.sub,.rule){font-size:13.5px;line-height:1.7;color:var(--muted);background:none;border:0;box-shadow:none;padding:0;margin:0;max-width:30em;text-align:center;white-space:normal}

.game-ui .screen>canvas.game{box-shadow:0 0 0 1px var(--line),0 12px 28px rgba(0,0,0,.14)}
.game-ui #hud{gap:6px;background:var(--surface);color:var(--ink)}
.game-ui #hud :is(.left,.t,.s,.grp,.pill){color:var(--ink)}
.game-ui #hud .pill{background:var(--surface);border-color:var(--line)}
.game-ui body canvas:is(#cv,#game,#board){background-color:var(--stage)}
.game-ui :is(button.dbtn,button.cbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.game-ui :is(button.lvl,button.lvlbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line);border-radius:12px;min-height:50px}
.game-ui :is(button.lvl,button.lvlbtn) :is(.nc,.sz,small){color:var(--muted)}
.game-ui .ui-panel button.lvl{margin:0;min-width:44px;box-shadow:none;padding:6px}
.game-ui #hud :is(.left,.right,.hudl,.hbtns){gap:5px;flex-wrap:wrap}
.game-ui #hud :is(.left,.hudl){min-width:0;flex-shrink:1}
.game-ui #hud :is(.pill,.left){font-size:12px}
.game-ui button:disabled{cursor:default;opacity:.42;box-shadow:none}
.game-ui .ui-panel .ui-assist-note{color:var(--accent);font-weight:700}
@media(min-width:700px){.game-ui body>.wrap{padding-top:24px}.game-ui .ui-panel{padding:32px 28px}}
@media(max-width:360px){.game-ui body>.wrap{padding:8px 10px;gap:8px}.game-ui .ui-panel{padding:20px 16px;gap:11px}.game-ui .ui-panel h1{font-size:24px}.game-ui .ui-emblem{width:68px;height:68px;font-size:36px;border-radius:20px}.game-ui :is(.topbar,#topbar){gap:5px;padding:6px 10px}.game-ui :is(.iconbtn,.icobtn,.ibtn,.tbtn,.ib){min-width:44px;min-height:44px}}

/* 开局/结算遮罩铺满整屏，主按钮固定在面板底部，避免被画布尺寸裁切 */
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv):has(>.ui-panel){position:fixed;inset:0;z-index:1000;border-radius:0;padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom))}

.game-ui .ui-panel :is(#startBtn,#btnStart,.startbtn,#bStart,#restartBtn,#btnRestart,#againBtn,#btnAgain,#retryBtn,#btnRetry,#playBtn,#btnPlay){position:sticky;bottom:0;z-index:3;flex-shrink:0}
.game-ui .ui-panel :not(.card,.panel,.pausecard,.ovcard,.ui-mode):has(>:is(#startBtn,#btnStart,.startbtn,#bStart,#restartBtn,#btnRestart,#againBtn,#btnAgain,#retryBtn,#btnRetry,#playBtn,#btnPlay)){position:sticky;bottom:0;z-index:3;flex-shrink:0;background:var(--surface);box-shadow:0 -10px 10px -6px var(--surface)}

<script>
'use strict';
const $=id=>document.getElementById(id);
const W=360,H=540;
const cv=$('cv'),ctx=cv.getContext('2d');
const UI=window.GameUI||{pick:a=>a,storageGet:k=>localStorage.getItem(k),storageSet:(k,v)=>localStorage.setItem(k,v)};
const FX=UI.fx&&UI.fx.on?UI.fx:null;
if(FX)FX.hidpi(cv,ctx,W,H);else{cv.width=W;cv.height=H;}
function show(id,on){$(id).classList.toggle('hidden',!on);}
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('on'),1200);}
function posOf(e){const r=cv.getBoundingClientRect();const t=(e.touches&&e.touches[0])||(e.changedTouches&&e.changedTouches[0])||e;return{x:(t.clientX-r.left)*W/r.width,y:(t.clientY-r.top)*H/r.height};}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};}
const PK='g100_kinggrid_prog',HK='g100_kinggrid_hs',MK='g100_kinggrid_mute';
let muted=UI.storageGet(MK)==='1',ac=null;$('muteBtn').textContent=muted?'🔇':'🔊';
function beep(f,d,type){if(muted)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(.12,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d);}catch(e){}}
$('muteBtn').onclick=()=>{muted=!muted;UI.storageSet(MK,muted?'1':'0');$('muteBtn').textContent=muted?'🔇':'🔊';};
function loadProg(){try{return JSON.parse(UI.storageGet(PK)||'{}');}catch(e){return{};}}
function saveProg(p){UI.storageSet(PK,JSON.stringify(p));}
let prog=loadProg();
if(!prog.stars)prog.stars={};if(prog.coins==null)prog.coins=0;if(prog.unlock==null)prog.unlock=1;
if(!prog.seenTut)prog.seenTut=0;
let best=+UI.storageGet(HK)||0;$('best').textContent=best;$('bestLine').textContent='解锁 '+prog.unlock+'/15 · 币 '+prog.coins;
const TOTAL=15;
let state='menu',lvl=1,score=0,sparks=[],last=performance.now(),boss=false;
const TUT=[["落牌","点手牌，再点棋盘空格落下。"],["年波","落牌后敌军来袭，单位自动防守。"],["相邻","同类建筑相邻可加成。"],["Boss","末年挑战敌王；胜可掠夺。"]];
const SHOP=[{k:'handLv',name:'手牌加一',max:2,cost(){return 50+(prog.handLv|0)*40;},desc(){return '手牌上限提升';}},{k:'wallLv',name:'城墙加固',max:3,cost(){return 45+(prog.wallLv|0)*30;},desc(){return '开局城防提升';}},{k:'stoneLv',name:'王座投石',max:2,cost(){return 55+(prog.stoneLv|0)*35;},desc(){return '投石次数提升';}}];


const CARDS=[
  {id:'s',n:'矛兵',t:'u',atk:8,hp:20,c:'#5ad0ff'},
  {id:'a',n:'弓塔',t:'b',atk:6,hp:30,c:'#ffcf33'},
  {id:'k',n:'骑士',t:'u',atk:14,hp:35,c:'#ff6b9d'},
  {id:'f',n:'农场',t:'b',atk:0,hp:25,c:'#7dff9a',gold:3},
  {id:'w',n:'城墙',t:'b',atk:0,hp:50,c:'#aab'},
  {id:'m',n:'法术轰',t:'s',atk:25,hp:0,c:'#b26bff'},
  {id:'c',n:'投石车',t:'u',atk:18,hp:28,c:'#ff9f2e'},
  {id:'h',n:'医院',t:'b',atk:0,hp:20,c:'#ff8ac6',heal:8},
];
const GS=3;let grid=[],hand=[],year=0,throne=100,wave=[],sel=-1,stones=0,yearMax=7;
function startLevel(n){lvl=n|0;boss=false;score=0;sparks=[];year=0;yearMax=6+(lvl>10?1:0);throne=100+(prog.wallLv|0)*15;grid=Array(GS*GS).fill(null);hand=[];stones=1+(prog.stoneLv|0);sel=-1;refill();show('lvlScr',false);show('shopScr',false);show('overScr',false);show('pauseOv',false);show('startScr',false);state='play';last=performance.now();beep(660,.1);$('score').textContent=0;$('hint').textContent='年 '+(year+1)+'/'+yearMax+' · 点牌落格';}
function refill(){const n=3+(prog.handLv|0);const pool=CARDS.slice(0,Math.min(CARDS.length,4+((lvl-1)/3|0)));hand=[];for(let i=0;i<n;i++)hand.push({...pool[Math.random()*pool.length|0]});}
function cellAt(p){const ox=(W-GS*70)/2,oy=70;const x=((p.x-ox)/70)|0,y=((p.y-oy)/70)|0;if(x<0||y<0||x>=GS||y>=GS)return -1;return y*GS+x;}
function playCard(ci,gi){if(ci<0||gi<0||grid[gi])return false;const card=hand[ci];if(card.t==='s'){wave.forEach(e=>e.hp-=card.atk);score+=card.atk;hand.splice(ci,1);sel=-1;beep(880,.1);resolveYear();return true;}grid[gi]={...card,hp:card.hp};hand.splice(ci,1);sel=-1;beep(700,.06);resolveYear();return true;}
function resolveYear(){year++;const n=3+year+((lvl-1)/2|0)+(year>=yearMax?8:0);wave=[];for(let i=0;i<n;i++)wave.push({x:40+Math.random()*(W-80),y:-20-i*18,hp:12+lvl*2+year*3,spd:40+lvl});boss=year>=yearMax;$('hint').textContent=(boss?'👑敌王年 ':'年 ')+year+'/'+yearMax;toast(boss?'敌王来袭！':'敌军来袭');}
function update(dt){if(!wave.length&&year>0&&year<yearMax&&hand.length===0){refill();return;}
  // auto defend
  for(const e of wave){e.y+=e.spd*dt;for(const g of grid){if(!g||g.atk<=0)continue;if(Math.random()<dt*1.2){e.hp-=g.atk*(0.3+dt);score+=1;}}}
  wave=wave.filter(e=>{if(e.hp<=0){score+=5;return false;}if(e.y>H-80){throne-=8+lvl;beep(180,.05,'triangle');return false;}return true;});
  $('score').textContent=score|0;
  if(throne<=0)lose('王座陷落');
  else if(wave.length===0&&year>=yearMax)win();
  else if(wave.length===0&&year>0&&year<yearMax&&hand.length===0)refill();
}
function win(){if(state!=='play')return;const stars=throne>70?3:throne>40?2:1;const gain=40+stars*18+(boss?80:0)+Math.floor(score/10);finishWin(stars,gain,'王国屹立！');}
function lose(msg){if(state!=='play')return;finishLose(msg);}
cv.addEventListener('pointerdown',e=>{if(state!=='play')return;e.preventDefault();const p=posOf(e);if(p.y>H-100){const tw=W/Math.max(1,hand.length);sel=Math.max(0,Math.min(hand.length-1,((p.x/tw)|0)));beep(600,.04);return;}
  if(stones>0&&p.y<60){stones--;wave.forEach(e=>e.hp-=20);toast('王座投石！');beep(990,.1);return;}
  if(sel>=0){const gi=cellAt(p);if(gi>=0)playCard(sel,gi);}});
function draw(){if(FX)FX.stage(ctx,W,H,'#c4b5fd','#6d28d9');else{ctx.fillStyle='#6d28d9';ctx.fillRect(0,0,W,H);}if(state!=='play'&&state!=='pause')return;
  ctx.fillStyle='#fff';ctx.font='bold 13px sans-serif';ctx.textAlign='left';ctx.fillText('王座'+(throne|0)+' 年'+year+'/'+yearMax+(stones?' 🪨'+stones:''),10,22);
  const ox=(W-GS*70)/2,oy=70;for(let i=0;i<9;i++){const x=ox+(i%GS)*70,y=oy+((i/GS)|0)*70;ctx.fillStyle='rgba(255,255,255,.12)';ctx.fillRect(x+2,y+2,66,66);const g=grid[i];if(g){if(FX)FX.tile(ctx,x+8,y+8,54,54,g.c);else{ctx.fillStyle=g.c;ctx.fillRect(x+8,y+8,54,54);}ctx.fillStyle='#111';ctx.font='11px sans-serif';ctx.textAlign='center';ctx.fillText(g.n,x+35,y+38);}}
  for(const e of wave){if(FX)FX.orb(ctx,e.x,e.y,9,'#ff3d6e');else{ctx.fillStyle='#ff3d6e';ctx.beginPath();ctx.arc(e.x,e.y,9,0,7);ctx.fill();}}
  const tw=W/Math.max(1,hand.length);hand.forEach((c,i)=>{const x=tw*i+4,y=H-88;ctx.fillStyle=i===sel?'rgba(255,230,100,.35)':'rgba(255,255,255,.15)';ctx.fillRect(x,y,tw-8,78);ctx.fillStyle=c.c;ctx.fillRect(x+8,y+8,tw-24,40);ctx.fillStyle='#fff';ctx.font='12px sans-serif';ctx.textAlign='center';ctx.fillText(c.n,x+(tw-8)/2,y+64);});
  if(FX&&FX.drawBurst)FX.drawBurst(ctx,sparks);}
window.__T={go(n){prog.seenTut=1;saveProg(prog);startLevel(n|0||1);},win(){if(state!=='play')startLevel(lvl||1);year=yearMax;wave=[];throne=Math.max(throne,50);win();},lose(){if(state!=='play')startLevel(lvl||1);lose('测试失败');},state(){return{state,lvl,score,boss,year,throne}}};


function finishWin(stars,gain,title){if(state!=='play'&&state!=='over'){/*allow*/}state='over';const prev=prog.stars[lvl]|0;if(stars>prev)prog.stars[lvl]=stars;prog.coins+=gain;if(lvl>=prog.unlock&&lvl<TOTAL)prog.unlock=lvl+1;saveProg(prog);if(score>best){best=score;UI.storageSet(HK,best);$('best').textContent=best;}$('overH').textContent=title||'王国屹立！';$('finalScore').textContent='★'.repeat(stars);$('overText').textContent='关卡 '+lvl+' · +'+gain+'币';show('overScr',true);beep(880,.2);}
function finishLose(msg){state='over';$('overH').textContent='失败';$('finalScore').textContent='💀';$('overText').textContent=(msg||'')+' · 得分 '+score;show('overScr',true);beep(160,.35,'triangle');}
function tutorial(steps,done){let i=0;show('tutScr',true);const paint=()=>{$('tutH').textContent=steps[i][0];$('tutP').textContent=steps[i][1];$('tutStep').textContent=(i+1)+'/'+steps.length;};paint();$('tutNext').onclick=()=>{i++;if(i>=steps.length){show('tutScr',false);done();}else paint();};$('tutSkip').onclick=()=>{show('tutScr',false);done();};}
function openLevels(){state='menu';show('startScr',false);show('shopScr',false);show('overScr',false);show('pauseOv',false);show('tutScr',false);show('lvlScr',true);$('lvlInfo').textContent='解锁 '+prog.unlock+'/'+TOTAL+' · 币 '+prog.coins;const g=$('lvgrid');g.innerHTML='';for(let i=1;i<=TOTAL;i++){const b=document.createElement('button');b.className='btn lvl';const locked=i>prog.unlock;const st=prog.stars[i]|0;b.innerHTML=locked?'🔒':(i%5===0?'👑':'')+i+'<small>'+'★'.repeat(st)+'</small>';b.disabled=locked;if(!locked)b.onclick=()=>enter(i);g.appendChild(b);}}
function enter(n){const go=()=>startLevel(n);if(!prog.seenTut){prog.seenTut=1;saveProg(prog);tutorial(TUT,go);}else go();}
function openShop(){show('lvlScr',false);show('shopScr',true);$('coinLine').textContent='金币：'+prog.coins;const box=$('shopList');box.innerHTML='';for(const it of SHOP){if(prog[it.k]==null)prog[it.k]=0;const row=document.createElement('div');row.className='row';row.innerHTML='<div><b>'+it.name+'</b><br><small>'+it.desc()+'</small></div>';const btn=document.createElement('button');btn.className='btn';const maxed=prog[it.k]>=it.max;const cost=it.cost();btn.textContent=maxed?'满':cost+'币';btn.disabled=maxed||prog.coins<cost;btn.onclick=()=>{prog.coins-=cost;prog[it.k]++;saveProg(prog);beep(900,.1);openShop();};row.appendChild(btn);box.appendChild(row);}}
$('startBtn').onclick=openLevels;$('backStart').onclick=()=>{show('lvlScr',false);show('startScr',true);};
$('shopBtn').onclick=openShop;$('shopBack').onclick=openLevels;
$('pauseBtn').onclick=()=>{if(state==='play'){state='pause';show('pauseOv',true);}else if(state==='pause'){state='play';last=performance.now();show('pauseOv',false);}};
$('resumeBtn').onclick=()=>{state='play';last=performance.now();show('pauseOv',false);};
$('menuBtn').onclick=()=>{show('pauseOv',false);state='menu';openLevels();};
$('againBtn').onclick=()=>startLevel(lvl);
$('nextBtn').onclick=()=>{if(lvl<TOTAL)startLevel(lvl+1);else openLevels();};
$('menu2Btn').onclick=()=>{show('overScr',false);openLevels();};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play'){state='pause';show('pauseOv',true);}});
requestAnimationFrame(function frame(t){const dt=Math.min(.05,(t-last)/1000);last=t;if(state==='play'&&typeof update==='function')update(dt);if(typeof draw==='function')draw();requestAnimationFrame(frame);});

</script>
</body></html>
