<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>奶茶摇摇</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:linear-gradient(160deg,#1c2612 0%,#0e120a 55%,#070805 100%);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;display:flex;justify-content:center;min-height:100vh;touch-action:manipulation;-webkit-user-select:none;user-select:none;overflow-x:hidden}
.wrap{width:100%;max-width:480px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:10px;position:relative;z-index:1}
.topbar{width:100%;display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:9px 12px;font-size:14px}
.topbar .title{font-weight:700;font-size:16px}
.topbar .stat{color:#dcebc9;font-size:12px}
.topbar .stat b{color:#fff;font-size:14px}
.tbtn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:#fff;font-size:17px;min-width:42px;height:42px;border-radius:11px;cursor:pointer;transition:transform .08s}
.tbtn:active{transform:scale(.9)}
.screen{width:100%;display:none;flex-direction:column;align-items:center;gap:10px}
.screen.on{display:flex}
.card{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:20px;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.card h1{font-size:26px;margin-bottom:8px;background:linear-gradient(90deg,#dcedc8,#7cb342);-webkit-background-clip:text;background-clip:text;color:transparent}
.card h2{font-size:22px;margin-bottom:8px}
.card p{color:#e2ecd4;font-size:14px;line-height:1.9;margin-bottom:12px;text-align:left}
.card p b{color:#ffd54f}
.bigbtn{background:linear-gradient(135deg,#7cb342,#dcedc8);border:none;color:#14200a;font-size:18px;font-weight:700;padding:14px 44px;border-radius:999px;cursor:pointer;box-shadow:0 6px 18px rgba(124,179,66,.45);transition:transform .1s;min-height:48px}
.bigbtn:active{transform:scale(.93)}
.ghostbtn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#fff;font-size:14px;padding:10px 22px;border-radius:999px;cursor:pointer;min-height:44px}
.ghostbtn:active{transform:scale(.93)}
.best{color:#ffd76a;font-size:14px;margin-top:8px}
.ticket{width:100%;background:linear-gradient(180deg,#fffbe8,#f7ecc8);color:#5d4037;border-radius:12px;padding:12px 16px;text-align:center;box-shadow:0 6px 16px rgba(0,0,0,.45);position:relative}
.ticket:before,.ticket:after{content:"";position:absolute;left:0;right:0;height:8px;background:radial-gradient(circle at 8px 0,transparent 6px,#fffbe8 6px);background-size:16px 8px}
.ticket:before{top:-8px;transform:rotate(180deg)}
.ticket:after{bottom:-8px}
.ticket .tno{font-size:12px;color:#8d6e63;letter-spacing:2px}
.ticket .tname{font-size:24px;font-weight:800;color:#4e342e;margin:4px 0}
.ticket .tsub{font-size:13px;color:#8d6e63}
.ticket .tphase{margin-top:6px;font-size:14px;font-weight:700;color:#558b2f}
#pickPane,#shakePane{width:100%;display:flex;flex-direction:column;align-items:center;gap:10px}
.trow{display:flex;gap:12px;justify-content:center;width:100%}
.tbtn2{flex:1;max-width:130px;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.14);border-radius:14px;color:#fff;font-size:30px;padding:10px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:84px;transition:all .12s}
.tbtn2 span{font-size:13px}
.tbtn2.sel{border-color:#aed581;background:rgba(174,213,129,.18);box-shadow:0 0 14px rgba(174,213,129,.5);transform:scale(1.04)}
.tbtn2:active{transform:scale(.94)}
#cvwrap{width:100%;display:flex;justify-content:center}
#cv{border-radius:14px;background:rgba(255,255,255,.03);touch-action:none;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.bar{width:100%;height:30px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:999px;position:relative;overflow:hidden}
.barfill{height:100%;width:0%;background:linear-gradient(90deg,#7cb342,#dcedc8);border-radius:999px;transition:width .08s}
.barlabel{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;text-shadow:0 1px 3px #000}
.srow{display:flex;gap:10px;width:100%;justify-content:center}
#steadyBtn{font-size:16px;padding:12px 34px}
.hint{color:#c6d8ae;font-size:13px;text-align:center;line-height:1.7}
.hint b{color:#ffd54f}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:40;backdrop-filter:blur(4px)}
.ov.on{display:flex}
.pausecard{background:#141b0e;border:1px solid rgba(174,213,129,.3);border-radius:18px;padding:28px 32px;text-align:center;display:flex;flex-direction:column;gap:12px;max-width:86vw}
.pausecard h2{font-size:20px}
#toast{position:fixed;top:38%;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.82);border:1px solid rgba(174,213,129,.4);color:#fff;font-size:16px;font-weight:700;padding:12px 26px;border-radius:999px;z-index:70;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;max-width:92vw}
.float{position:fixed;pointer-events:none;z-index:60;font-weight:800;font-size:20px;animation:floatup 1.1s ease-out forwards;text-shadow:0 2px 6px rgba(0,0,0,.6)}
@keyframes floatup{0%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-52px)}}
</style>
</head>
<body>
<div id="toast"></div>
<div class="wrap">
  <div class="topbar">
    <span class="title">🧋 奶茶摇摇</span>
    <span class="stat">⏱<b id="time">120</b>s · 🧾<b id="cups">0</b> · ⭐<b id="score">0</b></span>
    <span><button class="tbtn" id="sndBtn" aria-label="静音开关">🔊</button><button class="tbtn" id="pauseBtn" aria-label="暂停">⏸</button></span>
  </div>
  <div class="screen on" id="s-start">
    <div class="card">
      <h1>🧋 奶茶摇摇</h1>
      <p>嘉年华奶茶摊开张！看订单做奶茶：<br>
      ① <b>选配料</b>：点中订单里的配料（⚫珍珠 🥥椰果 🍮布丁），多放了要扣分！<br>
      ② <b>摇一摇</b>：在杯子上<b>左右快速滑动</b>，摇匀度冲到 100%<br>
      ③ <b>别洒了</b>：摇得越猛杯子越斜，倾斜条<b>超过红线会洒出来</b>，点「🧋扶稳」回正<br>
      ⏱ 限时 <b>120 秒</b>，连续出杯不洒有连击加成！</p>
      <button class="bigbtn" id="startBtn">开摊营业</button>
      <div class="best">🏅 最高分：<b id="best0">0</b></div>
    </div>
  </div>
  <div class="screen" id="s-game">
    <div class="ticket">
      <div class="tno">— 订单 <b id="ordNo">1</b> —</div>
      <div class="tname" id="ordName">珍珠奶茶</div>
      <div class="tsub" id="ordSub">半糖 · 去冰</div>
      <div class="tphase" id="phaseTag">① 选配料</div>
    </div>
    <div id="pickPane">
      <div class="trow" id="trow">
        <button class="tbtn2" data-t="pearl">⚫<span>珍珠</span></button>
        <button class="tbtn2" data-t="coconut">🥥<span>椰果</span></button>
        <button class="tbtn2" data-t="pudding">🍮<span>布丁</span></button>
      </div>
      <button class="bigbtn" id="shakeBtn">摇一摇 →</button>
      <div class="hint">👆 点选订单里的配料，再点「摇一摇」</div>
    </div>
    <div id="shakePane" style="display:none">
      <div id="cvwrap"><canvas id="cv" width="360" height="340"></canvas></div>
      <div class="bar"><div class="barfill" id="progFill"></div><span class="barlabel">摇匀度 <b id="progTxt">0</b>%</span></div>
      <div class="srow"><button class="bigbtn" id="steadyBtn">🧋 扶稳</button></div>
      <div class="hint">👈👉 在杯子上<b>左右快速滑动</b>摇匀 · 右侧倾斜条<b>超红线会洒！</b></div>
    </div>
  </div>
  <div class="screen" id="s-end">
    <div class="card">
      <h2 id="endTitle">🏆 打烊啦！</h2>
      <p id="endDesc" style="text-align:center"></p>
      <div class="best">🏅 最高分：<b id="best1">0</b></div>
      <button class="bigbtn" id="againBtn">再开一局</button>
    </div>
  </div>
</div>
<div class="ov" id="pauseov"><div class="pausecard"><h2>⏸ 暂停休息</h2><button class="bigbtn" id="resumeBtn">继续营业</button><button class="ghostbtn" id="quitBtn">重开一局</button></div></div>
<script>
'use strict';
const $=id=>document.getElementById(id);
/* ===== 音效 ===== */
let AC=null;
let soundOn=localStorage.getItem('g100_sound')!=='0';
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return null;}}if(AC&&AC.state==='suspended'){AC.resume();}return AC;}
function tone(f,d,type,v,when){if(!soundOn)return;const a=ac();if(!a)return;try{const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.value=f;const t=a.currentTime+(when||0);g.gain.setValueAtTime(v||0.12,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.03);}catch(e){}}
const sClick=()=>tone(640,0.07,'square',0.07);
const sOk=()=>tone(780,0.1,'sine',0.12);
const sErr=()=>{tone(170,0.16,'sawtooth',0.13);tone(120,0.2,'sawtooth',0.11,0.06);};
const sShake=()=>tone(260+Math.random()*240,0.05,'triangle',0.045);
const sSpill=()=>{tone(430,0.14,'sawtooth',0.12);tone(290,0.14,'sawtooth',0.12,0.1);tone(150,0.24,'sawtooth',0.12,0.2);};
const sDone=()=>{[523,659,784,1047].forEach((f,i)=>tone(f,0.13,'sine',0.12,i*0.09));};
const sWin=()=>{[523,659,784,1047,1319].forEach((f,i)=>tone(f,0.16,'triangle',0.12,i*0.11));};
/* ===== 工具 ===== */
function toast(msg){const t=$('toast');t.textContent=msg;t.style.opacity='1';clearTimeout(t._tm);t._tm=setTimeout(()=>{t.style.opacity='0';},1300);}
function floatTxt(txt,color){const d=document.createElement('div');d.className='float';d.textContent=txt;d.style.color=color||'#ffd54f';d.style.left='50%';d.style.top='30%';document.body.appendChild(d);setTimeout(()=>d.remove(),1150);}
function buzz(ms){try{if(navigator.vibrate)navigator.vibrate(ms);}catch(e){}}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));$(id).classList.add('on');}
/* ===== 数据 ===== */
const TOPPINGS=[
  {id:'pearl',name:'珍珠',icon:'⚫'},
  {id:'coconut',name:'椰果',icon:'🥥'},
  {id:'pudding',name:'布丁',icon:'🍮'}
];
const SUGARS=['全糖','半糖','三分糖','无糖'];
const ICES=['正常冰','少冰','去冰','热饮'];
const HSKEY='g100_bubbletea_hs';
/* ===== 状态 ===== */
let running=false,paused=false,phase='pick';
let timeLeft=120,score=0,cups=0,combo=0,ordNo=0;
let order=null,selected=new Set();
let progress=0,tilt=0,tiltDir=1,lastX=null,lastShakeSnd=0,busy=false,pendingNext=false;
let parts=[];
const cv=$('cv'),ctx=cv.getContext('2d');
function best(){return parseInt(localStorage.getItem(HSKEY)||'0',10);}
function saveBest(){if(score>best())localStorage.setItem(HSKEY,String(score));}
function refreshBest(){$('best0').textContent=best();$('best1').textContent=best();}
function refreshHud(){$('time').textContent=Math.ceil(timeLeft);$('cups').textContent=cups;$('score').textContent=score;}
/* ===== 订单 ===== */
function genOrder(){
  const n=1+Math.floor(Math.random()*3);
  const pool=TOPPINGS.slice();
  const req=[];
  for(let i=0;i<n;i++){req.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);}
  order={req:req,sugar:SUGARS[Math.floor(Math.random()*SUGARS.length)],ice:ICES[Math.floor(Math.random()*ICES.length)]};
  ordNo++;
  $('ordNo').textContent=ordNo;
  $('ordName').textContent=req.map(t=>t.name).join('')+'奶茶';
  $('ordSub').textContent=order.sugar+' · '+order.ice;
}
function setPhase(p){
  phase=p;
  $('phaseTag').textContent=p==='pick'?'① 选配料':'② 摇一摇，别洒！';
  $('pickPane').style.display=p==='pick'?'flex':'none';
  $('shakePane').style.display=p==='shake'?'flex':'none';
  if(p==='pick'){document.querySelectorAll('.tbtn2').forEach(b=>b.classList.remove('sel'));}
  if(p==='shake'){progress=0;tilt=0;tiltDir=1;updateProg();}
}
function updateProg(){$('progFill').style.width=progress+'%';$('progTxt').textContent=Math.floor(progress);}
/* ===== 流程 ===== */
function startGame(){
  running=true;paused=false;phase='pick';busy=false;pendingNext=false;
  timeLeft=120;score=0;cups=0;combo=0;ordNo=0;selected=new Set();parts=[];
  $('pauseov').classList.remove('on');
  showScreen('s-game');setPhase('pick');genOrder();refreshHud();refreshBest();
  sOk();
}
function endGame(){
  running=false;paused=false;
  $('pauseov').classList.remove('on');
  saveBest();refreshBest();
  const b=best();
  $('endTitle').textContent=score>=800?'🏆 奶茶大师！':score>=400?'👍 熟练店员！':'🧋 继续努力！';
  $('endDesc').innerHTML='本局得分 <b style="color:#ffd54f;font-size:22px">'+score+'</b><br>共出杯 <b>'+cups+'</b> 杯';
  showScreen('s-end');
  if(score>=b&&score>0)sWin();else tone(220,0.4,'sine',0.1);
}
/* ===== 选料 ===== */
document.querySelectorAll('.tbtn2').forEach(btn=>{
  btn.addEventListener('pointerdown',e=>{
    e.preventDefault();
    if(!running||paused||phase!=='pick')return;
    const tid=btn.getAttribute('data-t');
    const inOrder=order.req.some(t=>t.id===tid);
    if(selected.has(tid)){selected.delete(tid);btn.classList.remove('sel');sClick();return;}
    if(!inOrder){
      score=Math.max(0,score-10);refreshHud();
      sErr();buzz(80);toast('⚠️ 客人没点这个！-10');floatTxt('-10','#ef9a9a');
      return;
    }
    selected.add(tid);btn.classList.add('sel');sClick();
  });
});
$('shakeBtn').addEventListener('click',()=>{
  if(!running||paused||phase!=='pick')return;
  const missing=order.req.filter(t=>!selected.has(t.id));
  if(missing.length){sErr();toast('还差：'+missing.map(t=>t.icon+t.name).join('、'));return;}
  sOk();setPhase('shake');toast('👈👉 左右快滑摇匀！');
});
/* ===== 摇匀 ===== */
function cvPos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height};}
cv.addEventListener('pointerdown',e=>{e.preventDefault();if(phase==='shake'&&running&&!paused){const p=cvPos(e);lastX=p.x;}});
cv.addEventListener('pointermove',e=>{
  if(phase!=='shake'||!running||paused||busy||lastX===null)return;
  e.preventDefault();
  const p=cvPos(e),dx=p.x-lastX;lastX=p.x;
  const sp=Math.abs(dx);
  if(sp<2)return;
  progress=Math.min(100,progress+sp*0.12);
  tilt=Math.min(120,tilt+sp*0.10);
  tiltDir=dx>=0?1:-1;
  const now=performance.now();
  if(now-lastShakeSnd>110&&sp>8){lastShakeSnd=now;sShake();}
  updateProg();
  if(tilt>=85)spill();
  else if(progress>=100)completeCup();
});
window.addEventListener('pointerup',()=>{lastX=null;});
function spill(){
  score=Math.max(0,score-50);combo=0;
  progress=Math.max(0,progress-30);tilt=35;updateProg();refreshHud();
  sSpill();buzz(150);toast('💦 洒出来了！-50');floatTxt('-50','#ef9a9a');
  for(let i=0;i<14;i++){parts.push({x:140+(Math.random()-0.5)*90,y:120+Math.random()*40,vx:(Math.random()-0.5)*3,vy:Math.random()*2+1,life:1,c:'#d7a86e',r:3+Math.random()*3});}
}
function completeCup(){
  busy=true;
  const award=100+combo*20;
  score+=award;cups++;combo++;
  sDone();floatTxt('+'+award,'#aed581');
  for(let i=0;i<22;i++){parts.push({x:140+(Math.random()-0.5)*120,y:180+(Math.random()-0.5)*120,vx:(Math.random()-0.5)*4,vy:(Math.random()-0.5)*4-1,life:1,c:['#aed581','#ffd54f','#fff','#7cb342'][i%4],r:2+Math.random()*3});}
  buzz(40);refreshHud();
  selected=new Set();
  setTimeout(()=>{busy=false;if(running&&!paused){doNext();}else if(running&&paused){pendingNext=true;}},650);
}
function doNext(){pendingNext=false;genOrder();setPhase('pick');toast('✅ 出杯！下一单');}
$('steadyBtn').addEventListener('click',()=>{
  if(!running||paused||phase!=='shake')return;
  tilt=Math.max(0,tilt-45);sClick();toast('🧋 扶稳了！');
});
/* ===== 杯子绘制 ===== */
function drawCup(dt){
  ctx.clearRect(0,0,cv.width,cv.height);
  // 倾斜条
  const bx=306,by=60,bw=26,bh=220;
  ctx.fillStyle='rgba(255,255,255,.08)';
  ctx.beginPath();ctx.roundRect(bx,by,bw,bh,8);ctx.fill();
  const th=Math.min(100,tilt)/100*bh;
  ctx.fillStyle=tilt>=70?'#ef5350':'#ffb74d';
  ctx.beginPath();ctx.roundRect(bx,by+bh-th,bw,th,8);ctx.fill();
  const ry=by+bh-0.85*bh;
  ctx.strokeStyle='#ef5350';ctx.lineWidth=3;ctx.setLineDash([6,4]);
  ctx.beginPath();ctx.moveTo(bx-8,ry);ctx.lineTo(bx+bw+8,ry);ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle='#cfd8c9';ctx.font='12px sans-serif';ctx.textAlign='center';
  ctx.fillText('倾斜',bx+bw/2,by+bh+18);
  // 杯子
  const cx=150,cy=200;
  const ang=(Math.min(100,tilt)/100)*0.55*tiltDir+Math.sin(performance.now()/300)*0.02*Math.min(100,tilt)/40;
  ctx.save();ctx.translate(cx,cy);ctx.rotate(ang);
  // 杯身路径（用于裁剪）
  ctx.beginPath();ctx.moveTo(-58,-75);ctx.lineTo(58,-75);ctx.lineTo(44,75);ctx.lineTo(-44,75);ctx.closePath();
  ctx.save();ctx.clip();
  // 奶茶（按摇匀度上涨）
  const teaH=40+progress*0.7;
  ctx.fillStyle='#c8955c';ctx.fillRect(-60,75-teaH,120,teaH);
  ctx.fillStyle='#d7a86e';ctx.fillRect(-60,75-teaH,120,10);
  // 配料点点
  ctx.fillStyle='rgba(62,39,35,.85)';
  order.req.forEach((t,ti)=>{
    for(let i=0;i<6;i++){
      const px=-40+((ti*41+i*29)%80),py=75-10-((i*31+ti*19)%Math.max(18,teaH-20));
      ctx.beginPath();ctx.arc(px,py,5,0,7);ctx.fill();
    }
  });
  ctx.restore();
  // 杯壁描边+高光
  ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=3;ctx.stroke();
  const grad=ctx.createLinearGradient(-55,0,55,0);
  grad.addColorStop(0,'rgba(255,255,255,.14)');grad.addColorStop(0.5,'rgba(255,255,255,.03)');grad.addColorStop(1,'rgba(255,255,255,.12)');
  ctx.fillStyle=grad;ctx.fill();
  // 杯盖+吸管
  ctx.fillStyle='rgba(255,255,255,.28)';ctx.fillRect(-62,-84,124,10);
  ctx.strokeStyle='#ef9a9a';ctx.lineWidth=9;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(18,-80);ctx.lineTo(34,-130);ctx.stroke();
  ctx.restore();
  // 洒出粒子
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.12;p.life-=dt*0.9;
    if(p.life<=0){parts.splice(i,1);continue;}
    ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();ctx.globalAlpha=1;
  }
}
/* ===== 主循环 ===== */
let lastT=0;
function loop(t){
  requestAnimationFrame(loop);
  const dt=Math.min(0.05,(t-lastT)/1000||0);lastT=t;
  if(!running||paused)return;
  timeLeft-=dt;
  if(timeLeft<=0){timeLeft=0;refreshHud();endGame();return;}
  tilt=Math.max(0,tilt-dt*30);
  refreshHud();
  if(phase==='shake')drawCup(dt);
}
requestAnimationFrame(loop);
/* ===== 暂停/静音 ===== */
$('pauseBtn').addEventListener('click',()=>{
  if(!running)return;
  if(paused)return;
  paused=true;$('pauseov').classList.add('on');sClick();
});
$('resumeBtn').addEventListener('click',()=>{paused=false;$('pauseov').classList.remove('on');sClick();if(pendingNext&&running)doNext();});
$('quitBtn').addEventListener('click',()=>{sClick();showScreen('s-start');refreshBest();running=false;paused=false;$('pauseov').classList.remove('on');});
function refreshSnd(){$('sndBtn').textContent=soundOn?'🔊':'🔇';}
$('sndBtn').addEventListener('click',()=>{soundOn=!soundOn;localStorage.setItem('g100_sound',soundOn?'1':'0');refreshSnd();if(soundOn)sClick();});
$('startBtn').addEventListener('click',startGame);
$('againBtn').addEventListener('click',startGame);
refreshSnd();refreshBest();
</script>
</body>
