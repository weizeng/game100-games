<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>茶馆小二</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:linear-gradient(160deg,#1e2a1a 0%,#101418 55%,#080a08 100%);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;display:flex;justify-content:center;min-height:100vh;touch-action:manipulation;-webkit-user-select:none;user-select:none;overflow-x:hidden}
.wrap{width:100%;max-width:480px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:10px;position:relative;z-index:1}
.topbar{width:100%;display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:9px 12px;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.topbar .title{font-weight:700;font-size:16px}
.topbar .stat{color:#cfe8c9;font-size:12px}
.topbar .stat b{color:#fff;font-size:14px}
.tbtn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:#fff;font-size:17px;min-width:42px;height:42px;border-radius:11px;cursor:pointer;transition:transform .08s}
.tbtn:active{transform:scale(.9)}
.screen{width:100%;display:none;flex-direction:column;align-items:center;gap:10px}
.screen.on{display:flex}
.card{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:20px;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.card h1{font-size:26px;margin-bottom:8px;background:linear-gradient(90deg,#a5d6a7,#66bb6a);-webkit-background-clip:text;background-clip:text;color:transparent}
.card h2{font-size:22px;margin-bottom:8px}
.card p{color:#d7e8d2;font-size:14px;line-height:1.8;margin-bottom:12px}
.bigbtn{background:linear-gradient(135deg,#43a047,#a5d6a7);border:none;color:#0c240e;font-size:18px;font-weight:700;padding:14px 46px;border-radius:999px;cursor:pointer;box-shadow:0 6px 18px rgba(165,214,167,.45);transition:transform .1s;min-height:48px}
.bigbtn:active{transform:scale(.93)}
.ghostbtn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#fff;font-size:14px;padding:10px 22px;border-radius:999px;cursor:pointer;min-height:44px}
.ghostbtn:active{transform:scale(.93)}
.best{color:#ffd76a;font-size:14px;margin-top:8px}
#cvwrap{width:100%;display:flex;justify-content:center}
#cv{border-radius:14px;background:rgba(255,255,255,.03);touch-action:none;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.hint{color:#b9cfb4;font-size:13px;text-align:center;line-height:1.7}
.hint b{color:#ffd54f}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
.float{position:fixed;pointer-events:none;z-index:60;font-weight:700;font-size:18px;animation:floatup 1.1s ease-out forwards;text-shadow:0 2px 6px rgba(0,0,0,.6)}
@keyframes floatup{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-46px)}}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:40;backdrop-filter:blur(4px)}
.ov.on{display:flex}
.pausecard{background:#131a12;border:1px solid rgba(165,214,167,.3);border-radius:18px;padding:28px 32px;text-align:center;display:flex;flex-direction:column;gap:12px;max-width:86vw}
.pausecard h2{font-size:20px}
.pausecard p{color:#d7e8d2;font-size:14px;line-height:1.8;white-space:pre-line}
#toast{position:fixed;top:38%;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);border:1px solid rgba(165,214,167,.4);color:#fff;font-size:17px;font-weight:700;padding:12px 26px;border-radius:999px;z-index:70;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
</style>
<!-- GAME UI BEGIN -->
<style>
:root{--page:#f2dfd5;--surface:#fff6ed;--soft:#e9caba;--ink:#542f29;--muted:#8b5d50;--accent:#a64a32;--on-accent:#ffffff;--line:#cfa693;--stage:#452b26}
/* Shared presentation only; mechanics and state remain inside each standalone game. */
html.game-ui{background:var(--page);color:var(--ink);color-scheme:light;font-family:"Bahnschrift","Microsoft YaHei UI","PingFang SC",sans-serif}
html.game-ui[data-theme="space"],html.game-ui[data-theme="arcade"]{color-scheme:dark}
.game-ui body{background:var(--page);color:var(--ink);font-family:inherit;overscroll-behavior:none}
.game-ui body>.wrap{padding:20px 16px max(20px,env(safe-area-inset-bottom));gap:14px;max-width:500px}
.game-ui #app{background:var(--page);color:var(--ink)}
.game-ui :is(.topbar,#topbar){gap:8px;flex-wrap:wrap;min-height:58px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:10px 12px;box-shadow:0 3px 0 var(--soft);font-size:13px}
.game-ui :is(.title,.tb-title,.tb-title,#topbar .t,.topbar .t){color:var(--ink);font-size:16px;font-weight:750;letter-spacing:0}
.game-ui :is(.topbar,.hud,#hud,#topbar) :is(b,.v){color:var(--accent);font-variant-numeric:tabular-nums}
.game-ui :is(.stat,.topbar .s,.topbar .stat,.scorebar,.stats,.tip,.hint,.hintline,.hsline,.best,.hiscore){color:var(--muted);line-height:1.7}
.game-ui :is(.hint,.hintline,.tip){font-size:12px;max-width:40em;text-wrap:pretty}
.game-ui .scorebar{padding:6px 10px;gap:8px;flex-wrap:wrap}
.game-ui :is(.iconbtn,.iconBtn,.icobtn,.ibtn,.tbtn,.hbtn,.ib,.iconBtn,.pause){min-width:44px;min-height:44px;flex-shrink:0;border-radius:12px;background:var(--soft);color:var(--ink);border:1px solid var(--line);box-shadow:none;font-size:17px}
.game-ui button{font-family:inherit;cursor:pointer;touch-action:manipulation}
.game-ui button:focus-visible,.game-ui [tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.game-ui :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn){background:var(--accent);color:var(--on-accent);border:1px solid transparent;border-radius:13px;min-height:50px;padding:13px 28px;font-size:16px;font-weight:750;letter-spacing:0;box-shadow:0 4px 0 var(--line);text-shadow:none;max-width:100%}
.game-ui :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn):active{box-shadow:none;transform:translateY(2px)}
.game-ui :is(.ghost,.ghostbtn,.btn2,.abtn,.toolbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line);box-shadow:none;border-radius:12px;min-height:44px}
.game-ui :is(.rowbtns,.btnrow,.ctlrow){gap:10px;flex-wrap:wrap;justify-content:center}
.game-ui :is(.pill,.hudbox,.hud .p){background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:none;font-variant-numeric:tabular-nums}
.game-ui :is(.dbtn,.cbtn,.gbtn,.holdbtn,.firebtn,.bombbtn,.jumpbtn,.pumpbtn,.nbtn){border-radius:12px;box-shadow:0 3px 0 var(--line);min-height:44px}
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv,.screen):has(>.ui-panel){padding:20px;overflow-y:auto;overscroll-behavior:contain}
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv):has(>.ui-panel){background:var(--page);backdrop-filter:none;justify-content:safe center;align-items:center}
.game-ui .ui-panel{width:min(100%,380px);max-height:100%;overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:18px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:24px;padding:30px 24px;box-shadow:0 8px 0 var(--soft),0 20px 48px #15253618;text-align:center;margin:auto}
.game-ui .ui-panel :is(.card,.panel,.pausecard,.ovcard){display:contents}
.game-ui .ui-panel :is(h1,h2,.gamename,.gametitle){font-size:30px;line-height:1.25;font-weight:800;color:var(--ink);background:none;-webkit-text-fill-color:currentColor;text-shadow:none;letter-spacing:-.6px;margin:0}
.game-ui .ui-panel :is(p,.howto,.sub,.rule){font-size:14px;line-height:1.85;color:var(--muted);background:none;border:0;box-shadow:none;padding:0;margin:0;max-width:32em;text-align:left;white-space:normal}
.game-ui .ui-panel :is(.bigemoji,.bigemoji,.ic,.big):not(.bigscore){animation:none;filter:none;text-shadow:none}
.game-ui .ui-emblem{width:90px;height:90px;display:grid;place-items:center;border:1px solid var(--line);border-radius:28px;background:var(--soft);font-size:48px;line-height:1;flex-shrink:0;position:relative}
.game-ui[data-theme="wood"] .ui-emblem{border-radius:50%;box-shadow:inset 0 0 0 5px var(--surface),inset 0 0 0 6px var(--line)}
.game-ui[data-theme="wood"] .ui-panel h1{font-family:"STKaiti","KaiTi","Microsoft YaHei",serif;letter-spacing:2px}
.game-ui[data-theme="ice"] .ui-emblem{border-radius:26px 8px 26px 8px}
.game-ui[data-theme="space"] .ui-emblem{background:radial-gradient(circle at center,var(--soft) 42%,transparent 43%),var(--surface);border-radius:50%;outline:1px solid var(--line);outline-offset:7px;margin:7px}
.game-ui[data-theme="kitchen"] .ui-emblem{border-radius:22px;border-bottom:5px solid var(--line)}
.game-ui .ui-panel :is(.score,.bigscore,.bigScore,.scorebig){color:var(--accent);font-size:48px;font-weight:800;font-variant-numeric:tabular-nums}
.game-ui .ui-panel :is(.best,.hsline,.hiscore,.endstats,.endstats b){color:var(--muted);font-size:13px;line-height:1.8}
.game-ui .ui-mode{display:grid;grid-template-columns:1fr 1fr;gap:5px;background:var(--soft);padding:5px;border:1px solid var(--line);border-radius:14px;width:100%}
.game-ui .ui-mode button{min-height:44px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-size:14px;font-weight:700;box-shadow:none}
.game-ui .ui-mode button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 2px 5px #1525361a}
.game-ui .ui-panel .ui-mode-note{font-size:12px;line-height:1.6;text-align:center;color:var(--muted)}
.game-ui .ui-mode-status{display:block;padding:5px 10px;color:var(--accent);font-size:11px;font-weight:700;line-height:1.5;text-align:center;border:1px solid var(--line);border-radius:8px;background:var(--surface);margin:4px auto;max-width:100%;pointer-events:none}
.game-ui body>.wrap>canvas:not(#fx){background-color:var(--stage);box-shadow:0 0 0 1px var(--line),0 6px 0 var(--soft);border-radius:18px;flex-shrink:0}
.game-ui .screen>canvas.game{box-shadow:0 0 0 1px var(--line),0 6px 0 var(--soft)}
.game-ui #hud{gap:6px;background:var(--surface);color:var(--ink)}
.game-ui #hud :is(.left,.t,.s,.grp,.pill){color:var(--ink)}
.game-ui #hud .pill{background:var(--surface);border-color:var(--line)}
.game-ui body canvas:is(#cv,#game,#board){background-color:var(--stage)}
.game-ui :is(button.dbtn,button.cbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.game-ui :is(button.lvl,button.lvlbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line);border-radius:12px;min-height:54px}
.game-ui :is(button.lvl,button.lvlbtn) :is(.nc,.sz,small){color:var(--muted)}
.game-ui .ui-panel button.lvl{margin:0;min-width:44px;box-shadow:none;padding:8px}
.game-ui #hud :is(.left,.right,.hudl,.hbtns){gap:5px;flex-wrap:wrap}
.game-ui #hud :is(.left,.hudl){min-width:0;flex-shrink:1}
.game-ui #hud :is(.pill,.left){font-size:12px}
.game-ui button:disabled{cursor:default;opacity:.45;box-shadow:none}
.game-ui .ui-panel .ui-assist-note{color:var(--accent);font-weight:700}
@media(min-width:700px){.game-ui body>.wrap{padding-top:32px}.game-ui .ui-panel{padding:36px 30px}}
@media(max-width:360px){.game-ui body>.wrap{padding:10px;gap:10px}.game-ui .ui-panel{padding:22px 18px;gap:13px}.game-ui .ui-panel h1{font-size:26px}.game-ui .ui-emblem{width:70px;height:70px;font-size:38px}.game-ui :is(.topbar,#topbar){gap:5px;padding:8px}.game-ui :is(.iconbtn,.icobtn,.ibtn,.tbtn,.ib){min-width:40px;min-height:44px}}
@media(max-height:650px){.game-ui .ui-panel{padding:18px;gap:12px}.game-ui .ui-emblem{width:60px;height:60px;font-size:32px}.game-ui .ui-panel h1{font-size:25px}.game-ui .ui-panel :is(p,.howto,.sub,.rule){font-size:13px}}
@media(prefers-reduced-motion:reduce){.game-ui *, .game-ui *::before,.game-ui *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

html[data-game="teahouse"] #cvwrap{max-width:100%;min-width:0}html[data-game="teahouse"] #cv{max-width:100%;height:auto}html[data-game="teahouse"] .ctlrow{max-width:100%;flex-wrap:wrap}html[data-game="teahouse"] .abtn{font-size:13px;padding:8px 12px}

</style>
<script>
// Installed before the original game script; embedded so downloaded ZIPs remain offline capable.
(function () {
  'use strict';
  var config = {"id":"teahouse","name":"茶馆小二","theme":"kitchen","icon":"🍵","challenge":"客人耐心缩至原来的 75%，先服务快离席的客人"};
  var mode = 'classic';
  try { mode = sessionStorage.getItem('game100-mode-' + config.id) || mode; } catch (_) {}
  var expert = mode === 'expert';
  var used = { hint: 0, undo: 0 };
  var limits = { hint: 1, undo: 3 };
  function storageKey(key) { return expert && !/sound|mute/i.test(key) ? 'expert:' + key : key; }
  window.GameUI = {
    expert: expert,
    pick: function (classic, advanced) { return expert ? advanced : classic; },
    storageGet: function (key) { return localStorage.getItem(storageKey(key)); },
    storageSet: function (key, value) { localStorage.setItem(storageKey(key), value); },
    storageRemove: function (key) { localStorage.removeItem(storageKey(key)); }
  };
  var root = document.documentElement;
  root.classList.add('game-ui');
  root.dataset.theme = config.theme;
  root.dataset.game = config.id;
  root.dataset.mode = mode;
  var gesture = new WeakMap();
  function labelButtons(scope) {
    scope.querySelectorAll('button').forEach(function (button) {
      if (button.getAttribute('aria-label')) return;
      var id = button.id.toLowerCase(), text = button.textContent.trim();
      var name = /mute|sound|snd/.test(id) ? '切换音效' : /pause/.test(id) ? '暂停游戏' : /hint/.test(id) && !/close|ok/.test(id) ? '查看提示' : '';
      if (!name && /^[⏸🔊🔇💡Ⅱ]+$/u.test(text)) name = { '⏸': '暂停游戏', '🔊': '切换音效', '🔇': '切换音效', '💡': '查看提示' }[text];
      if (name) button.setAttribute('aria-label', name);
    });
  }
  function decorate(container) {
    if (container.querySelector(':scope > .ui-panel') || !container.querySelector('h1,h2,.gamename')) return;
    if (container.matches('.screen') && container.querySelector('canvas:not(#fx)')) return;
    var panel = document.createElement('div');
    panel.className = 'ui-panel';
    while (container.firstChild) panel.appendChild(container.firstChild);
    container.appendChild(panel);
    var heading = panel.querySelector('h1,h2,.gamename');
    var start = /start|menu|ready/i.test(container.id) || !!panel.querySelector('#startBtn,#btnStart,.startbtn');
    if (start) {
      var headings = panel.querySelectorAll('h1,h2,.gamename');
      if (headings.length > 1 && !/[A-Za-z0-9\u4e00-\u9fff]/.test(heading.textContent)) { heading.remove(); heading = headings[1]; }
      var oldIcon = panel.querySelector('.bigemoji,.ic');
      if (oldIcon) oldIcon.remove();
      var emblem = document.createElement('div');
      emblem.className = 'ui-emblem'; emblem.textContent = config.icon; emblem.setAttribute('aria-hidden', 'true');
      panel.insertBefore(emblem, panel.firstChild);
      heading.textContent = config.name;
      var switcher = document.createElement('div'); switcher.className = 'ui-mode'; switcher.setAttribute('role', 'group'); switcher.setAttribute('aria-label', '选择玩法模式');
      [['classic','经典模式'],['expert','进阶挑战']].forEach(function (item) {
        var b = document.createElement('button'); b.type = 'button'; b.textContent = item[1]; b.dataset.mode = item[0]; b.setAttribute('aria-pressed', String(mode === item[0]));
        b.addEventListener('click', function () {
          if (mode === item[0]) return;
          try { sessionStorage.setItem('game100-mode-' + config.id, item[0]); location.reload(); }
          catch (_) { b.textContent = '浏览器未允许保存模式'; }
        });
        switcher.appendChild(b);
      });
      var primary = panel.querySelector('#startBtn,#btnStart,.startbtn,button');
      var anchor = primary;
      while (anchor && anchor.parentNode !== panel && !anchor.parentNode.matches('.card,.panel,.pausecard,.ovcard')) anchor = anchor.parentNode;
      var target = anchor ? anchor.parentNode : panel;
      target.insertBefore(switcher, anchor || null);
      var note = document.createElement('p'); note.className = 'ui-mode-note';
      note.textContent = expert ? config.challenge + '。进阶纪录单独保存。' : '按原规则轻松开局，也可切换进阶挑战。';
      target.insertBefore(note, anchor || null);
    }
    labelButtons(panel);
  }
  function notify(text) {
    var el = document.getElementById('ui-assist-toast');
    if (!el) { el = document.createElement('div'); el.id = 'ui-assist-toast'; el.className = 'ui-mode-status'; el.setAttribute('role', 'status'); el.style.cssText = 'position:fixed;bottom:18px;left:16px;right:16px;z-index:200;padding:14px'; document.body.appendChild(el); }
    el.textContent = text; el.hidden = false;
    clearTimeout(notify.timer); notify.timer = setTimeout(function () { el.hidden = true; }, 2000);
  }
  function assistEvent(event) {
    if (!expert) return;
    var b = event.target.closest('button'); if (!b || b.closest('.ui-mode')) return;
    var kind = /^(hintBtn|hintTopBtn|btnHint)$/i.test(b.id) ? 'hint' : /^(undoBtn|undoTopBtn|btnUndo)$/i.test(b.id) || /悔一步|撤销/.test(b.textContent) ? 'undo' : '';
    if (!kind) return;
    var prev = gesture.get(b), blocked;
    if (event.type === 'click' && prev && performance.now() - prev.at < 1000) blocked = prev.blocked;
    else { blocked = used[kind] >= limits[kind]; if (!blocked) used[kind]++; gesture.set(b, { at: performance.now(), blocked: blocked }); }
    if (blocked) { event.preventDefault(); event.stopImmediatePropagation(); notify(kind === 'hint' ? '本次挑战的 1 次提示已用完' : '本次挑战的 3 次撤销已用完'); }
  }
  document.addEventListener('pointerdown', assistEvent, true);
  document.addEventListener('click', assistEvent, true);
  document.addEventListener('click', function (event) {
    var b = event.target.closest('button');
    if (b && /^(startBtn|btnStart|restartBtn|againBtn|retryBtn|btnAgain|btnRestart|playAgain)$/i.test(b.id)) used = { hint: 0, undo: 0 };
  }, true);
  document.addEventListener('DOMContentLoaded', function () {
    var selector = '.overlay,.ov,#ov,#overlay,#pauseOv,.screen';
    document.querySelectorAll(selector).forEach(function (container) {
      decorate(container);
      // Only dynamic overlay children are observed; animated scores never trigger this work.
      new MutationObserver(function () { decorate(container); }).observe(container, { childList: true });
    });
    labelButtons(document);
  });
}());

</script>
<!-- GAME UI END -->
</head>
<body>
<canvas id="fx"></canvas>
<div id="toast"></div>
<div class="wrap">
  <div class="topbar">
    <span class="title">🍵 茶馆小二</span>
    <span class="stat">第<b id="day">1</b>/3天 · ⏱<b id="time">75</b>s · 🪙<b id="coins">0</b> · ⭐<b id="rep">100</b></span>
    <span><button class="tbtn" id="sndBtn">🔊</button><button class="tbtn" id="pauseBtn">⏸</button></span>
  </div>
  <div class="screen on" id="s-start">
    <div class="card">
      <h1>🍵 茶馆小二</h1>
      <p>客人陆续进店点茶：<b style="color:#a5d6a7">绿</b> / <b style="color:#ef9a9a">红</b> / <b style="color:#ffcc80">乌龙</b>。<br><b>先点茶壶，再点客人</b>，把对的茶送上桌。<br>客人喝完会留下茶钱，<b>点铜钱收银</b>。<br>耐心耗尽客人会离席，声望 -10；<br>声望归零茶馆倒闭！共经营 3 天，一天比一天忙。</p>
      <button class="bigbtn" id="startBtn">开张大吉</button>
      <div class="best">🏅 最高分：<b id="best0">0</b></div>
    </div>
  </div>
  <div class="screen" id="s-game">
    <div id="cvwrap"><canvas id="cv" width="360" height="500"></canvas></div>
    <div class="hint">👆 先点茶壶再点客人上茶 · 上错茶客人会生气<br>💰 记得点铜钱收银 · 耐心条见底客人就走了</div>
  </div>
  <div class="screen" id="s-end">
    <div class="card">
      <h2 id="endTitle">🏆 江湖名茶馆！</h2>
      <p id="endDesc"></p>
      <div class="best">🏅 最高分：<b id="best1">0</b></div>
      <button class="bigbtn" id="againBtn">再开一天</button>
    </div>
  </div>
</div>
<div class="ov" id="pauseov"><div class="pausecard"><h2>⏸ 打烊休息</h2><button class="bigbtn" id="resumeBtn">继续营业</button><button class="ghostbtn" id="quitBtn">重新开张</button></div></div>
<div class="ov" id="dayov"><div class="pausecard"><h2 id="dayTitle">🌙 第一天结束</h2><p id="dayDesc"></p><button class="bigbtn" id="nextDayBtn">第二天开张</button></div></div>
<script>
/* GAMEPLAY UPGRADE */
'use strict';
const $=id=>document.getElementById(id);
/* ===== 音效 ===== */
let AC=null;
let soundOn=GameUI.storageGet('g100_sound')!=='0';
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f,d,type,v,delay){if(!soundOn)return;const c=ac();if(!c)return;const t=c.currentTime+(delay||0);const o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.15,t+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+0.05);}
const SFX={
  click(){tone(520,0.06,'square',0.07);},
  pour(){tone(300,0.12,'sine',0.12);tone(420,0.14,'sine',0.12,0.1);},
  coin(){tone(1320,0.08,'square',0.09);tone(1760,0.12,'square',0.09,0.07);},
  bad(){tone(220,0.2,'sawtooth',0.13);tone(150,0.25,'sawtooth',0.11,0.1);},
  win(){[523,659,784,1047].forEach((f,i)=>tone(f,0.16,'triangle',0.16,i*0.12));}
};
function vib(ms){try{if(navigator.vibrate)navigator.vibrate(ms);}catch(e){}}
function updateSndBtn(){$('sndBtn').textContent=soundOn?'🔊':'🔇';}
/* ===== 飘字 & 粒子 ===== */
function floatText(x,y,txt,color){const d=document.createElement('div');d.className='float';d.textContent=txt;d.style.left=x+'px';d.style.top=y+'px';d.style.color=color||'#ffd54f';document.body.appendChild(d);setTimeout(()=>d.remove(),1150);}
const fx=$('fx'),fctx=fx.getContext('2d');let parts=[];
function fxResize(){fx.width=innerWidth;fx.height=innerHeight;}
addEventListener('resize',fxResize);fxResize();
function burst(x,y,color,n){for(let i=0;i<(n||20);i++){const a=Math.random()*Math.PI*2,sp=60+Math.random()*160;parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-40,life:0.9+Math.random()*0.5,t:0,color:color||'#a5d6a7',r:2+Math.random()*3});}}
(function fxLoop(){let last=performance.now();function fr(now){const dt=Math.min(0.05,(now-last)/1000);last=now;fctx.clearRect(0,0,fx.width,fx.height);parts=parts.filter(p=>p.t<p.life);for(const p of parts){p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=160*dt;const k=1-p.t/p.life;fctx.globalAlpha=k;fctx.fillStyle=p.color;fctx.beginPath();fctx.arc(p.x,p.y,p.r*k+0.5,0,7);fctx.fill();}fctx.globalAlpha=1;requestAnimationFrame(fr);}requestAnimationFrame(fr);})();
let toastT=null;
function toast(msg){const t=$('toast');t.textContent=msg;t.style.opacity=1;clearTimeout(toastT);toastT=setTimeout(()=>t.style.opacity=0,1400);}
/* ===== 茶馆 ===== */
const TEA=[{n:'绿',c:'#7cb342'},{n:'红',c:'#e57373'},{n:'乌',c:'#ffb74d'}];
const FACES=['🧑','👩','🧓','👴','👱','🧔','👵','🧑‍🦰'];
const TABLES=[{x:92,y:150},{x:268,y:150},{x:92,y:300},{x:268,y:300}];
const DAYS=[
  {len:75,spawn:6.5,patience:50,price:10},
  {len:85,spawn:5.0,patience:42,price:12},
  {len:95,spawn:3.8,patience:35,price:14}
];
const POTS=[{x:70,w:96},{x:180,w:96},{x:290,w:96}];
const cv=$('cv'),ctx=cv.getContext('2d');
let day,dayT,spawnT,customers,selPot,coins,rep,served,lost;
let playing=false,paused=false,over=false,dayEnd=false,lastT=0;
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));$(id).classList.add('on');}
function getBest(){return parseInt(GameUI.storageGet('g100_teahouse_hs')||'0',10);}
function setBest(v){if(v>getBest())GameUI.storageSet('g100_teahouse_hs',String(v));}
function refreshBest(){$('best0').textContent=getBest();$('best1').textContent=getBest();}
function updateHud(){$('day').textContent=day;$('time').textContent=Math.ceil(dayT);$('coins').textContent=coins;$('rep').textContent=rep;}
function newGame(){
  day=1;coins=0;rep=100;served=0;lost=0;
  startDay();
}
function startDay(){
  const D=DAYS[day-1];
  dayT=D.len;spawnT=1.2;customers=[];selPot=-1;dayEnd=false;over=false;
  updateHud();
  toast('第 '+day+' 天开张！');
}
function spawn(){
  const free=TABLES.map((t,i)=>i).filter(i=>!customers.some(c=>c.table===i));
  if(!free.length)return;
  const ti=free[Math.floor(Math.random()*free.length)],D=DAYS[day-1];
  customers.push({
    table:ti,tea:Math.floor(Math.random()*3),
    face:FACES[Math.floor(Math.random()*FACES.length)],
    patience:D.patience*GameUI.pick(1,.75),maxP:D.patience*GameUI.pick(1,.75),
    state:'wait',drinkT:0,leaveT:0,coinT:0,born:performance.now()
  });
  SFX.click();
}
function serve(c){
  if(selPot<0){toast('先点一只茶壶！');return;}
  const r=cv.getBoundingClientRect(),t=TABLES[c.table];
  if(selPot===c.tea){
    c.state='drink';c.drinkT=3;SFX.pour();
    burst(r.left+t.x,r.top+t.y-60,TEA[c.tea].c,16);
    floatText(r.left+t.x-16,r.top+t.y-110,'上茶喽~',TEA[c.tea].c);
  }else{
    c.patience=Math.max(1,c.patience*0.5);
    SFX.bad();vib(40);
    floatText(r.left+t.x-30,r.top+t.y-110,'上错茶了！','#ef9a9a');
  }
  selPot=-1;
}
function collect(c){
  const D=DAYS[day-1],t=TABLES[c.table],r=cv.getBoundingClientRect();
  const tip=Math.round(D.price*0.5*(c.patience/c.maxP));
  const gain=D.price+tip;
  coins+=gain;served++;SFX.coin();vib(15);
  burst(r.left+t.x,r.top+t.y-20,'#ffd54f',18);
  floatText(r.left+t.x-14,r.top+t.y-60,'+'+gain,'#ffd54f');
  c.state='leave';c.leaveT=0.6;
  updateHud();
}
function angryLeave(c){
  const t=TABLES[c.table],r=cv.getBoundingClientRect();
  rep-=10;lost++;SFX.bad();vib([70,40,70]);
  floatText(r.left+t.x-40,r.top+t.y-110,'😠 走了！声望-10','#ef9a9a');
  c.state='leave';c.leaveT=0.6;
  updateHud();
  if(rep<=0)gameOver();
}
function endDay(){
  dayEnd=true;
  customers.forEach(c=>{if(c.state==='wait'||c.state==='drink'||c.state==='pay')c.state='leave',c.leaveT=0.8;});
  SFX.win();
  const D=DAYS[day-1];
  setTimeout(()=>{
    $('dayTitle').textContent='🌙 第'+day+'天打烊';
    $('dayDesc').textContent='招待 '+served+' 位客人 · '+lost+' 位离席\n茶钱累计 '+coins+' 文 · 声望 '+rep;
    $('nextDayBtn').textContent=day>=3?'查看结算':'第 '+(day+1)+' 天开张';
    $('dayov').classList.add('on');
  },900);
}
function victory(){
  over=true;setBest(coins);refreshBest();SFX.win();
  $('endTitle').textContent='🏆 江湖名茶馆！';
  $('endDesc').innerHTML='三天经营结束，宾客盈门！<br>共招待 <b>'+served+'</b> 位客人，茶钱 <b style="color:#ffd54f">'+coins+'</b> 文，声望 '+rep;
  show('s-end');
}
function gameOver(){
  over=true;setBest(coins);refreshBest();
  $('dayov').classList.remove('on');
  $('endTitle').textContent='💸 茶馆倒闭了';
  $('endDesc').innerHTML='声望归零，客人都跑光了……<br>坚持到第 <b>'+day+'</b> 天，茶钱 <b style="color:#ffd54f">'+coins+'</b> 文';
  show('s-end');
}
/* ===== 主循环 ===== */
function frame(now){
  requestAnimationFrame(frame);
  if(!playing)return;
  const dt=Math.min(0.05,(now-lastT)/1000||0);lastT=now;
  if(paused||over||dayEnd)return;
  const D=DAYS[day-1];
  dayT-=dt;
  spawnT-=dt;
  if(spawnT<=0){spawn();spawnT=D.spawn*(0.85+Math.random()*0.3);}
  for(const c of customers){
    if(c.state==='wait'){
      c.patience-=dt;
      if(c.patience<=0){c.patience=0;angryLeave(c);}
    }else if(c.state==='drink'){
      c.drinkT-=dt;
      if(c.drinkT<=0){c.state='pay';c.coinT=0;}
    }else if(c.state==='leave'){
      c.leaveT-=dt;
    }
  }
  customers=customers.filter(c=>!(c.state==='leave'&&c.leaveT<=0));
  if(dayT<=0){dayT=0;endDay();}
  updateHud();
  draw(now);
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function draw(now){
  ctx.clearRect(0,0,360,500);
  // 地板纹
  ctx.fillStyle='rgba(165,214,167,.05)';
  for(let y=20;y<380;y+=44)ctx.fillRect(0,y,360,2);
  // 桌子 & 客人
  TABLES.forEach((t,ti)=>{
    ctx.fillStyle='#4a3428';rr(t.x-58,t.y-34,116,68,14);ctx.fill();
    ctx.fillStyle='#6d4c41';rr(t.x-52,t.y-28,104,56,11);ctx.fill();
    const c=customers.find(k=>k.table===ti);
    if(c){
      const fade=c.state==='leave'?Math.max(0,c.leaveT/0.6):1;
      const pop=Math.min(1,(now-c.born)/300),es=0.6+0.4*(1-Math.pow(1-pop,3));
      ctx.globalAlpha=fade;
      ctx.font=(40*es)+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(c.face,t.x,t.y-64);
      if(c.state==='wait'||c.state==='drink'){
        // 点单气泡
        ctx.beginPath();ctx.arc(t.x+44,t.y-96,19,0,7);ctx.fillStyle=TEA[c.tea].c;ctx.fill();
        ctx.fillStyle='#1a1a1a';ctx.font='bold 17px sans-serif';ctx.fillText(TEA[c.tea].n,t.x+44,t.y-96);
        if(c.state==='wait'){
          const w=64,k=c.patience/c.maxP;
          ctx.fillStyle='rgba(0,0,0,.5)';rr(t.x-32,t.y-128,w,8,4);ctx.fill();
          ctx.fillStyle=k>0.5?'#8dd08a':k>0.25?'#ffb74d':'#e57373';rr(t.x-32,t.y-128,w*k,8,4);ctx.fill();
        }else{
          ctx.font='15px sans-serif';ctx.fillStyle='#d7e8d2';ctx.fillText('品茶中…',t.x,t.y-118);
        }
      }else if(c.state==='pay'){
        ctx.font='30px sans-serif';
        const bob=Math.sin(now/240)*4;
        ctx.fillText('💰',t.x,t.y+bob);
        ctx.font='12px sans-serif';ctx.fillStyle='#ffd54f';ctx.fillText('点我收银',t.x,t.y+34);
      }
      ctx.globalAlpha=1;
    }
  });
  // 茶壶
  ctx.textAlign='center';ctx.textBaseline='middle';
  POTS.forEach((p,i)=>{
    const sel=i===selPot;
    ctx.fillStyle=sel?'rgba(165,214,167,.30)':'rgba(255,255,255,.06)';
    rr(p.x-p.w/2,408,p.w,72,14);ctx.fill();
    ctx.strokeStyle=sel?'#a5d6a7':TEA[i].c;ctx.lineWidth=sel?3:2;
    rr(p.x-p.w/2,408,p.w,72,14);ctx.stroke();
    ctx.font='30px sans-serif';ctx.fillText('🫖',p.x,436);
    ctx.beginPath();ctx.arc(p.x+26,428,13,0,7);ctx.fillStyle=TEA[i].c;ctx.fill();
    ctx.fillStyle='#10210f';ctx.font='bold 14px sans-serif';ctx.fillText(TEA[i].n,p.x+26,428);
    ctx.fillStyle='rgba(255,255,255,.75)';ctx.font='12px sans-serif';
    ctx.fillText(['绿茶','红茶','乌龙'][i],p.x,466);
  });
}
/* ===== 输入 ===== */
function evPos(e){const r=cv.getBoundingClientRect();return [(e.clientX-r.left)*360/r.width,(e.clientY-r.top)*360/r.height];}
cv.addEventListener('pointerdown',e=>{
  if(!playing||paused||over||dayEnd||!$('s-game').classList.contains('on'))return;
  const p=evPos(e);
  for(let i=0;i<3;i++){
    const q=POTS[i];
    if(p[0]>q.x-q.w/2&&p[0]<q.x+q.w/2&&p[1]>408&&p[1]<480){
      selPot=(selPot===i?-1:i);SFX.click();return;
    }
  }
  for(const c of customers){
    const t=TABLES[c.table];
    if(Math.hypot(p[0]-t.x,p[1]-(t.y-64))<52){
      if(c.state==='wait'){serve(c);return;}
      if(c.state==='pay'){collect(c);return;}
    }
    if(c.state==='pay'&&Math.hypot(p[0]-t.x,p[1]-t.y)<52){collect(c);return;}
  }
});
/* ===== 暂停 / 静音 ===== */
function doPause(v){paused=v;lastT=performance.now();if(v)$('pauseov').classList.add('on');else $('pauseov').classList.remove('on');}
$('pauseBtn').addEventListener('click',()=>{if($('s-game').classList.contains('on')&&playing&&!over&&!dayEnd)doPause(true);});
$('resumeBtn').addEventListener('click',()=>{doPause(false);SFX.click();});
$('quitBtn').addEventListener('click',()=>{doPause(false);newGame();toast('重新开张');});
$('nextDayBtn').addEventListener('click',()=>{
  $('dayov').classList.remove('on');SFX.click();
  if(day>=3){victory();}else{day++;startDay();}
});
$('sndBtn').addEventListener('click',()=>{soundOn=!soundOn;GameUI.storageSet('g100_sound',soundOn?'1':'0');updateSndBtn();if(soundOn)SFX.click();});
/* ===== 流程 ===== */
$('startBtn').addEventListener('click',()=>{ac();SFX.click();playing=true;newGame();show('s-game');lastT=performance.now();requestAnimationFrame(frame);});
$('againBtn').addEventListener('click',()=>{SFX.click();playing=true;paused=false;newGame();show('s-game');lastT=performance.now();requestAnimationFrame(frame);});
updateSndBtn();refreshBest();
</script>
</body>
