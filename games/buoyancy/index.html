<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>浮力实验</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#0a0e1a;font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:#fff;user-select:none;-webkit-user-select:none;touch-action:none}
#cv{position:fixed;inset:0;display:block}
#hud{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:8px;padding:10px 12px;z-index:5;pointer-events:none}
.pill{background:rgba(10,14,26,.7);border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap}
.pill b{color:#FFD54F}
.spacer{flex:1}
.iconBtn{pointer-events:auto;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(10,14,26,.7);color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer}
#panel{position:fixed;left:10px;right:10px;bottom:10px;z-index:6;background:rgba(10,14,26,.88);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:10px 14px}
.ctl{margin:4px 0}
.ctl label{display:flex;justify-content:space-between;font-size:13px;color:#c5cae9;margin-bottom:0}
.ctl label b{color:#FFD54F}
input[type=range]{width:100%;height:44px;-webkit-appearance:none;appearance:none;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:#2a3350}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#29B6F6;margin-top:-11px;box-shadow:0 0 8px rgba(41,182,246,.8)}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:#2a3350}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border:none;border-radius:50%;background:#29B6F6}
.rowBtns{display:flex;gap:10px;margin-top:6px}
.actBtn{flex:1;min-height:48px;border:none;border-radius:12px;font-size:16px;font-weight:bold;color:#fff;background:linear-gradient(135deg,#29B6F6,#0066AA);cursor:pointer}
.actBtn:active{transform:scale(.96)}
.actBtn.ghost{background:rgba(255,255,255,.12)}
.actBtn:disabled{opacity:.45}
#readout{font-size:13px;color:#c5cae9;line-height:1.6;margin-top:6px;min-height:20px}
#readout b{color:#FFD54F}
.overlay{position:fixed;inset:0;background:rgba(3,5,12,.9);display:flex;align-items:center;justify-content:center;z-index:20;padding:24px}
.card{background:linear-gradient(160deg,#141a2e,#0a0e1a);border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:26px 24px;max-width:370px;width:100%;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.6);max-height:88vh;overflow-y:auto}
.card h1{font-size:26px;margin-bottom:6px}
.card h2{font-size:17px;color:#29B6F6;margin:12px 0 6px}
.card p{font-size:14px;color:#c5cae9;line-height:1.7;margin:8px 0;text-align:left}
.card p.c{text-align:center}
.formula{background:rgba(41,182,246,.1);border:1px dashed rgba(41,182,246,.5);border-radius:10px;padding:10px;font-size:15px;color:#FFD54F;margin:10px 0;font-family:monospace;word-break:break-all}
.bigBtn{display:inline-block;margin-top:14px;padding:14px 52px;font-size:18px;border:none;border-radius:999px;background:linear-gradient(135deg,#29B6F6,#0066AA);color:#fff;cursor:pointer;min-height:52px}
.bigBtn:active{transform:scale(.96)}
.score{font-size:44px;font-weight:bold;color:#FFEB3B;margin:6px 0}
.hidden{display:none!important}
.optBtn{display:block;width:100%;min-height:48px;margin:8px 0;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;font-size:16px;cursor:pointer}
.optBtn:active{transform:scale(.97)}
.optBtn.right{border-color:#66BB6A;background:rgba(102,187,106,.25)}
.optBtn.wrong{border-color:#FF5252;background:rgba(255,82,82,.25)}
.optBtn:disabled{opacity:.8}
.segRow{display:flex;gap:8px;margin:6px 0}
.segBtn{flex:1;min-height:44px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.07);color:#fff;font-size:13px;cursor:pointer}
.segBtn.sel{border-color:#29B6F6;background:rgba(41,182,246,.25);color:#29B6F6;font-weight:bold}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud">
  <div class="pill" id="roundPill">第 <b>1</b>/5 轮</div>
  <div class="pill">得分 <b id="scorePill">0</b></div>
  <div class="spacer"></div>
  <button class="iconBtn" id="muteBtn" title="静音">🔊</button>
  <button class="iconBtn" id="pauseBtn" title="暂停">⏸</button>
</div>
<div id="panel">
  <div id="readout"></div>
  <div class="rowBtns"><button class="actBtn" id="dropBtn" disabled>放入液体 🌊</button></div>
</div>

<div class="overlay" id="startOv">
  <div class="card">
    <h1>🌊 浮力实验</h1>
    <p class="c" style="color:#29B6F6">🔬 初中物理 · 力学实验</p>
    <p>每轮随机一种液体和一个物体。先预测物体的沉浮（答对 +60 分），再按「放入液体」看动画验证：漂浮时吃水深度比 = ρ物/ρ液，沉底时浮力小于重力。</p>
    <h2>📏 本实验公式</h2>
    <div class="formula">F浮 = ρ液gV排</div>
    <button class="bigBtn" id="startBtn">开始实验</button>
  </div>
</div>
<div class="overlay hidden" id="pauseOv">
  <div class="card">
    <h1>⏸ 已暂停</h1>
    <p class="c">实验已暂停，数据保留</p>
    <button class="bigBtn" id="resumeBtn">继续实验</button>
  </div>
</div>
<div class="overlay hidden" id="quizOv">
  <div class="card">
    <h1 id="quizTitle">🤔 预测一下</h1>
    <p class="c" id="quizQ"></p>
    <div id="quizOpts"></div>
  </div>
</div>
<div class="overlay hidden" id="endOv">
  <div class="card">
    <h1>🎓 实验完成</h1>
    <div class="score" id="finalScore">0</div>
    <p class="c" id="bestLine">历史最高：0</p>
    <h2>📝 实验结论</h2>
    <p id="conclusion"></p>
    <div class="formula" id="endFormula"></div>
    <button class="bigBtn" id="retryBtn">再做一次</button>
  </div>
</div>

<script>
'use strict';
/* ============ 基础框架（勿改） ============ */
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var W=0,H=0,DPR=1,PANEL_H=0;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;H=window.innerHeight;
  cv.width=Math.floor(W*DPR);cv.height=Math.floor(H*DPR);
  cv.style.width=W+'px';cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  PANEL_H=document.getElementById('panel').offsetHeight||150;
  if(window.onResize)window.onResize();
}
window.addEventListener('resize',resize);
var AC=null,muted=localStorage.getItem('g100_mute')==='1';
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended'){AC.resume();}return AC;}
function tone(f,d,type,v,delay){if(muted)return;try{var c=ac();if(!c)return;var t=c.currentTime+(delay||0);var o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.15,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+0.05);}catch(e){}}
function sClick(){tone(600,0.06,'square',0.08);}
function sGood(){tone(660,0.1,'sine',0.15);tone(880,0.15,'sine',0.15,0.1);}
function sBad(){tone(220,0.2,'sawtooth',0.12);tone(160,0.25,'sawtooth',0.12,0.12);}
function sWin(){var n=[523,659,784,1047];for(var i=0;i<n.length;i++){tone(n[i],0.15,'sine',0.15,i*0.12);}}
function sTick(){tone(440,0.05,'square',0.06);}
function sSplash(){tone(300,0.12,'sine',0.12);tone(180,0.18,'sine',0.1,0.06);tone(420,0.1,'triangle',0.08,0.02);}
function buzz(ms){try{if(navigator.vibrate){navigator.vibrate(ms||30);}}catch(e){}}
var floats=[];
function floatText(x,y,txt,color){floats.push({x:x,y:y,txt:txt,color:color||'#FFD54F',life:1});}
function drawFloats(dt){ctx.textAlign='center';for(var i=floats.length-1;i>=0;i--){var f=floats[i];f.life-=dt*0.7;f.y-=34*dt;if(f.life<=0){floats.splice(i,1);continue;}ctx.globalAlpha=Math.max(0,Math.min(1,f.life));ctx.fillStyle=f.color;ctx.font='bold 17px sans-serif';ctx.fillText(f.txt,f.x,f.y);ctx.globalAlpha=1;}}
var HSKEY='g100_buoyancy_hs';
function getBest(){return parseInt(localStorage.getItem(HSKEY)||'0',10)||0;}
function setBest(v){if(v>getBest()){localStorage.setItem(HSKEY,String(v));}}
function $(id){return document.getElementById(id);}
function show(id){$(id).classList.remove('hidden');}
function hide(id){$(id).classList.add('hidden');}
function setMuteBtn(){$('muteBtn').textContent=muted?'🔇':'🔊';}
$('muteBtn').addEventListener('click',function(){muted=!muted;localStorage.setItem('g100_mute',muted?'1':'0');setMuteBtn();if(!muted){sClick();}});
setMuteBtn();
/* ============ 游戏状态（按需改） ============ */
var state='start',paused=false,round=1,score=0,lastT=0;
function updHUD(){$('roundPill').innerHTML='第 <b>'+round+'</b>/5 轮';$('scorePill').textContent=score;}
function addScore(n,x,y){score+=n;updHUD();if(x!==undefined){floatText(x,y,'+'+n,n>=50?'#66BB6A':'#FFD54F');}}
$('pauseBtn').addEventListener('click',function(){if(state!=='play')return;sClick();paused=true;show('pauseOv');});
$('resumeBtn').addEventListener('click',function(){sClick();paused=false;hide('pauseOv');lastT=performance.now();});
$('startBtn').addEventListener('click',function(){sClick();hide('startOv');startGame();});
$('retryBtn').addEventListener('click',function(){sClick();hide('endOv');startGame();});
function startGame(){round=1;score=0;updHUD();state='play';paused=false;if(window.onStart)window.onStart();}
var quizCb=null;
function askQuiz(title,question,options,cb){
  $('quizTitle').textContent=title;$('quizQ').textContent=question;
  var box=$('quizOpts');box.innerHTML='';quizCb=cb;
  options.forEach(function(op,i){
    var b=document.createElement('button');b.className='optBtn';b.textContent=op;
    b.addEventListener('click',function(){cb(i,b);});
    box.appendChild(b);
  });
  show('quizOv');
}
function markQuiz(chosen,correct){
  var btns=$('quizOpts').children;
  for(var i=0;i<btns.length;i++){btns[i].disabled=true;if(i===correct){btns[i].classList.add('right');}}
  if(chosen!==correct&&btns[chosen]){btns[chosen].classList.add('wrong');}
  setTimeout(function(){hide('quizOv');if(window.onQuizDone){window.onQuizDone(chosen===correct);}},900);
}
function endGame(conclusion,formula){
  state='end';setBest(score);sWin();
  $('finalScore').textContent=score+' / 300';
  $('bestLine').textContent='历史最高：'+getBest();
  $('conclusion').textContent=conclusion;
  $('endFormula').textContent=formula;
  show('endOv');
}
function loop(t){
  requestAnimationFrame(loop);
  var dt=Math.min(0.05,(t-lastT)/1000||0);lastT=t;
  if(state!=='play'||paused)return;
  ctx.clearRect(0,0,W,H);
  if(window.onFrame){window.onFrame(dt);}
  drawFloats(dt);
}
resize();updHUD();requestAnimationFrame(function(t){lastT=t;requestAnimationFrame(loop);});
/* ============ 浮力实验游戏逻辑 ============ */
var liquids=[
  {n:'水',d:1.0,c:'#29B6F6'},
  {n:'盐水',d:1.2,c:'#26C6DA'},
  {n:'油',d:0.8,c:'#F9A825'}
];
var objs=[
  {n:'木块',d:0.6,c:'#A1887F',shape:'rect'},
  {n:'冰块',d:0.9,c:'#B3E5FC',shape:'rect'},
  {n:'空心球',d:0.3,c:'#CE93D8',shape:'circle'},
  {n:'铁块',d:7.8,c:'#78909C',shape:'rect'}
];
var liq=null,obj=null,correct=0,phase='predict';
var oy=0,vy=0,ty=0,parts=[],ripple=0,bobT=0,waitT=0,geom={};
var CONCLUSION='实验结论：阿基米德原理 F浮=ρ液gV排——浮力等于排开液体的重量；ρ物<ρ液漂浮，ρ物>ρ液下沉。钢铁巨轮能浮，因为空心结构平均密度小。';
var FORMULA='F浮 = ρ液gV排';
function computeGeom(){
  var tw=Math.min(W-36,320),tx=(W-tw)/2;
  var top=92,bot=H-PANEL_H-18;
  var surf=top+(bot-top)*0.26;
  geom={tw:tw,tx:tx,top:top,bot:bot,surf:surf,cx:W/2};
}
window.onResize=function(){computeGeom();};
function objSize(){return obj&&obj.shape==='circle'?64:60;}
function updReadout(extra){
  var h='液体：<b>'+liq.n+'</b> ρ液=<b>'+liq.d+'</b>×10³kg/m³ ｜ 物体：<b>'+obj.n+'</b> ρ物=<b>'+obj.d+'</b>×10³kg/m³';
  if(extra)h+='<br>'+extra;
  $('readout').innerHTML=h;
}
function setupRound(){
  liq=liquids[Math.floor(Math.random()*liquids.length)];
  obj=objs[Math.floor(Math.random()*objs.length)];
  correct=(obj.d<liq.d)?0:2; /* 本游戏不出现 ρ物=ρ液 */
  phase='predict';oy=geom.surf-300;vy=0;parts=[];ripple=0;bobT=0;waitT=0;
  $('dropBtn').disabled=true;
  updReadout();
  askQuiz('🤔 预测一下','把「'+obj.n+'」(ρ='+obj.d+')放入「'+liq.n+'」(ρ='+liq.d+')中，物体会？',
    ['漂浮在水面','悬浮在水中','沉到水底'],function(chosen){markQuiz(chosen,correct);});
}
window.onQuizDone=function(ok){
  var sc=ok?60:20;
  addScore(sc,geom.cx,110);
  if(ok){sGood();buzz(50);floatText(geom.cx,145,'✓ 预测正确','#66BB6A');}
  else{sBad();buzz([60,40,60]);floatText(geom.cx,145,'✗ +20 参与分','#FF8A65');}
  phase='ready';$('dropBtn').disabled=false;
};
window.onStart=function(){setupRound();};
$('dropBtn').addEventListener('click',function(){
  if(state!=='play'||phase!=='ready')return;
  sClick();$('dropBtn').disabled=true;
  phase='fall';oy=geom.surf-300;vy=0;
});
function splash(){
  sSplash();ripple=1;
  for(var i=0;i<26;i++){
    parts.push({x:geom.cx+(Math.random()-0.5)*70,y:geom.surf-2,
      vx:(Math.random()-0.5)*320,vy:-60-Math.random()*220,life:0.7+Math.random()*0.4,r:2+Math.random()*3});
  }
}
function drawTank(t){
  var g=geom;
  /* 液体 */
  ctx.fillStyle=liq.c+'99';
  ctx.fillRect(g.tx+4,g.surf,g.tw-8,g.bot-g.surf);
  /* 液面波纹 */
  ctx.strokeStyle=liq.c;ctx.lineWidth=3;ctx.beginPath();
  for(var x=g.tx+4;x<=g.tx+g.tw-4;x+=8){
    var y=g.surf+Math.sin(x*0.08+t*6)*(2+ripple*9)+Math.sin(x*0.21-t*9)*ripple*5;
    if(x===g.tx+4){ctx.moveTo(x,y);}else{ctx.lineTo(x,y);}
  }
  ctx.stroke();
  /* 玻璃 */
  ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=3;
  ctx.beginPath();
  if(ctx.roundRect){ctx.roundRect(g.tx,g.top,g.tw,g.bot-g.top,10);}else{ctx.rect(g.tx,g.top,g.tw,g.bot-g.top);}
  ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.65)';ctx.font='12px sans-serif';ctx.textAlign='left';
  ctx.fillText(liq.n+'  ρ='+liq.d+'×10³kg/m³',g.tx+10,g.surf+20);
}
function drawObj(y){
  var cx=geom.cx,s=objSize();
  if(obj.shape==='circle'){
    var r=s/2;
    ctx.fillStyle=obj.c;ctx.globalAlpha=0.9;
    ctx.beginPath();ctx.arc(cx,y,r,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
    ctx.fillStyle='rgba(10,14,26,.55)';
    ctx.beginPath();ctx.arc(cx,y,r*0.55,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(cx,y,r,0,Math.PI*2);ctx.stroke();
  }else{
    var w=s,h=s*0.85;
    ctx.fillStyle=obj.c;
    ctx.beginPath();
    if(ctx.roundRect){ctx.roundRect(cx-w/2,y-h/2,w,h,6);}else{ctx.rect(cx-w/2,y-h/2,w,h);}
    ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=2;ctx.stroke();
    if(obj.n==='冰块'){
      ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.moveTo(cx-w/2+8,y-h/2+8);ctx.lineTo(cx+w/2-14,y+h/2-8);ctx.stroke();
    }
  }
  ctx.fillStyle='#0a0e1a';ctx.font='bold 13px sans-serif';ctx.textAlign='center';
  ctx.fillText(obj.n,cx,y+5);
  ctx.fillStyle='rgba(255,255,255,.8)';ctx.font='11px sans-serif';
  ctx.fillText('ρ='+obj.d,cx,y+(obj.shape==='circle'?objSize()/2+14:objSize()*0.85/2+14));
}
function drawParts(dt){
  for(var i=parts.length-1;i>=0;i--){
    var p=parts[i];
    p.vy+=900*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;
    if(p.life<=0||p.y>geom.bot){parts.splice(i,1);continue;}
    ctx.globalAlpha=Math.min(1,p.life*1.6);
    ctx.fillStyle=liq.c;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
  }
}
window.onFrame=function(dt){
  var t=performance.now()/1000;
  ripple=Math.max(0,ripple-dt*0.7);
  if(phase==='fall'){
    vy+=2400*dt;oy+=vy*dt;
    if(oy>=geom.surf){
      oy=geom.surf;splash();
      phase='settle';
      var oh=objSize();
      if(obj.d<liq.d){
        var r=obj.d/liq.d;
        ty=geom.surf-oh*(1-r)+oh/2; /* 吃水深度比=ρ物/ρ液 */
      }else{
        ty=geom.bot-12-oh/2;
      }
    }
  }else if(phase==='settle'){
    oy+=(ty-oy)*Math.min(1,2.6*dt);
    ripple=Math.max(ripple,0.25);
    if(Math.abs(oy-ty)<2){
      phase='done';waitT=0;
      var oh2=objSize(),extra;
      if(obj.d<liq.d){
        var pct=Math.round(obj.d/liq.d*100);
        extra='F浮 = ρ液gV排 <b>=</b> G = ρ物gV（二力平衡）｜ 吃水 <b>'+pct+'%</b>（V排/V = ρ物/ρ液）→ 漂浮';
      }else{
        extra='F浮 = ρ液gV <b>&lt;</b> G = ρ物gV → 沉底';
      }
      updReadout(extra);
      floatText(geom.cx,geom.surf-40,obj.d<liq.d?'🛟 漂浮':'⚓ 沉底','#FFD54F');
    }
  }else if(phase==='done'){
    waitT+=dt;bobT+=dt;
    if(waitT>2.0){
      round++;
      if(round>5){endGame(CONCLUSION,FORMULA);}else{updHUD();setupRound();}
    }
  }
  drawTank(t);
  var bob=(phase==='done'&&obj.d<liq.d)?Math.sin(bobT*4)*5:0;
  drawObj(oy+bob);
  drawParts(dt);
};
</script>
</body>
</html>
