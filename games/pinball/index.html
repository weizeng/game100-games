<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>弹珠台</title>
<style>
/* ART T1-1: shrink the board on short screens so 360x640 needs no scrolling */
html.game-ui #cv{max-width:min(400px,calc((100vh - 210px)*.72));max-width:min(400px,calc((100svh - 210px)*.72));margin-left:auto;margin-right:auto}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#121212;color:#f0f0f0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;display:flex;justify-content:center;min-height:100vh;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.wrap{width:100%;max-width:480px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:10px}
.topbar{width:100%;display:flex;justify-content:space-between;align-items:center;font-size:16px}
.topbar b{color:#E91E63;font-size:22px}
.balls{color:#E91E63;letter-spacing:2px}
canvas{background:#16161f;border-radius:12px;touch-action:none;width:100%;height:auto;max-width:400px}
.ctrl{width:100%;max-width:400px;display:flex;gap:10px}
.fbtn{flex:1;padding:20px 0;font-size:19px;font-weight:700;border:none;border-radius:14px;background:#2a2a2a;color:#fff;touch-action:none}
.fbtn.on{background:#E91E63}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;z-index:20;padding:24px;text-align:center}
.overlay.hidden{display:none}
.overlay h1{font-size:30px}
.overlay p{color:#bbb;font-size:15px;line-height:1.8}
.btn{background:#E91E63;border:none;color:#fff;font-size:19px;font-weight:700;padding:13px 52px;border-radius:14px;cursor:pointer}
.btn:active{transform:scale(.95)}
.hint{color:#888;font-size:13px;text-align:center}
</style>
<!-- GAME UI BEGIN -->
<style>
:root{--page:#172638;--surface:#22374c;--soft:#2e4760;--ink:#f0f6fc;--muted:#b1c6d9;--accent:#f0bc74;--on-accent:#342717;--line:#45637c;--stage:#142438;--page:#0b0620;--surface:#211040;--soft:#33234f;--ink:#fff3fb;--muted:#d4b6dd;--accent:#ff3d9a;--on-accent:#0b0620;--line:#ff3d9a;--b-bg1:#3a0d5e;--b-bg2:#0b0620;--b-btn:#ff3d9a;--b-btn-hi:#ff81bd;--b-edge:#a3124f;--b-glow:#00e5ff;--b-glow-rgb:0,229,255;--b-pedge-rgb:255,61,154;--b-btn-ink:#510927;--b-btn-tsh:0 1px 0 rgba(255,255,255,.45);--b-coin-ink:#510927;--b-coin-tsh:none;--b-key-ink:#00e5ff;--b-title:#ffffff}
/* Shared presentation only; mechanics and state remain inside each standalone game. */
html.game-ui{background:var(--page);color:var(--ink);color-scheme:light;font-family:"Bahnschrift","Microsoft YaHei UI","PingFang SC",sans-serif}
html.game-ui:is([data-theme="space"],[data-theme="arcade"],[data-theme="lab"],[data-theme="ocean"],[data-theme="magic"]){color-scheme:dark}
.game-ui body{background:var(--page);color:var(--ink);font-family:inherit;overscroll-behavior:none}
.game-ui body>.wrap{padding:20px 16px max(20px,env(safe-area-inset-bottom));gap:14px;max-width:500px}
.game-ui #app{background:var(--page);color:var(--ink)}
.game-ui :is(.topbar,#topbar){gap:8px;flex-wrap:wrap;min-height:58px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:10px 12px;box-shadow:0 3px 0 var(--soft);font-size:13px}
.game-ui :is(.title,.tb-title,.tb-title,#topbar .t,.topbar .t){color:var(--ink);font-size:16px;font-weight:750;letter-spacing:0}
.game-ui :is(.topbar,.hud,#hud,#topbar) :is(b,.v){color:var(--accent);font-variant-numeric:tabular-nums}
.game-ui :is(.stat,.topbar .s,.topbar .stat,.scorebar,.stats,.tip,.hint,.hintline,.hsline,.best,.hiscore){color:var(--muted);line-height:1.7}
.game-ui :is(.hint,.hintline,.tip){font-size:12px;max-width:40em;text-wrap:pretty}
.game-ui .scorebar{padding:6px 10px;gap:8px;flex-wrap:wrap}
.game-ui :is(.iconbtn,.iconBtn,.icobtn,.ibtn,.tbtn,.hbtn,.ib,.iconBtn,.pause){min-width:44px;min-height:44px;flex-shrink:0;border-radius:12px;background:var(--soft);color:var(--ink);border:1px solid var(--line);box-shadow:none;font-size:17px}
.game-ui button{font-family:inherit;cursor:pointer;touch-action:manipulation}
.game-ui button:focus-visible,.game-ui [tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.game-ui :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn){background:var(--accent);color:var(--on-accent);border:1px solid transparent;border-radius:13px;min-height:50px;padding:13px 28px;font-size:16px;font-weight:750;letter-spacing:0;box-shadow:0 4px 0 var(--line);text-shadow:none;max-width:100%}
.game-ui :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn):active{box-shadow:none;transform:translateY(2px)}
.game-ui :is(.ghost,.ghostbtn,.btn2,.abtn,.toolbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line);box-shadow:none;border-radius:12px;min-height:44px}
.game-ui :is(.rowbtns,.btnrow,.ctlrow){gap:10px;flex-wrap:wrap;justify-content:center}
.game-ui :is(.pill,.hudbox,.hud .p){background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:none;font-variant-numeric:tabular-nums}
.game-ui :is(.dbtn,.cbtn,.gbtn,.holdbtn,.firebtn,.bombbtn,.jumpbtn,.pumpbtn,.nbtn){border-radius:12px;box-shadow:0 3px 0 var(--line);min-height:44px}
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv,.screen):has(>.ui-panel){padding:20px;overflow-y:auto;overscroll-behavior:contain}
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv):has(>.ui-panel){background:var(--page);backdrop-filter:none;justify-content:safe center;align-items:center}
.game-ui .ui-panel{width:min(100%,380px);max-height:100%;overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:18px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:24px;padding:30px 24px;box-shadow:0 8px 0 var(--soft),0 20px 48px #15253618;text-align:center;margin:auto}
.game-ui .ui-panel :is(.card,.panel,.pausecard,.ovcard){display:contents}
.game-ui .ui-panel :is(h1,h2,.gamename,.gametitle){font-size:30px;line-height:1.25;font-weight:800;color:var(--ink);background:none;-webkit-text-fill-color:currentColor;text-shadow:none;letter-spacing:-.6px;margin:0}
.game-ui .ui-panel :is(p,.howto,.sub,.rule){font-size:14px;line-height:1.85;color:var(--muted);background:none;border:0;box-shadow:none;padding:0;margin:0;max-width:32em;text-align:left;white-space:normal}
.game-ui .ui-panel :is(.bigemoji,.bigemoji,.ic,.big):not(.bigscore){animation:none;filter:none;text-shadow:none}
.game-ui .ui-emblem{width:90px;height:90px;display:grid;place-items:center;border:1px solid var(--line);border-radius:28px;background:var(--soft);font-size:48px;line-height:1;flex-shrink:0;position:relative}
.game-ui[data-theme="wood"] .ui-emblem{border-radius:50%;box-shadow:inset 0 0 0 5px var(--surface),inset 0 0 0 6px var(--line)}
.game-ui[data-theme="wood"] .ui-panel h1{font-family:"STKaiti","KaiTi","Microsoft YaHei",serif;letter-spacing:2px}
.game-ui[data-theme="ice"] .ui-emblem{border-radius:26px 8px 26px 8px}
.game-ui[data-theme="space"] .ui-emblem{background:radial-gradient(circle at center,var(--soft) 42%,transparent 43%),var(--surface);border-radius:50%;outline:1px solid var(--line);outline-offset:7px;margin:7px}
.game-ui[data-theme="kitchen"] .ui-emblem{border-radius:22px;border-bottom:5px solid var(--line)}
.game-ui .ui-panel :is(.score,.bigscore,.bigScore,.scorebig){color:var(--accent);font-size:48px;font-weight:800;font-variant-numeric:tabular-nums}
.game-ui .ui-panel :is(.best,.hsline,.hiscore,.endstats,.endstats b){color:var(--muted);font-size:13px;line-height:1.8}
.game-ui .ui-mode{display:grid;grid-template-columns:1fr 1fr;gap:5px;background:var(--soft);padding:5px;border:1px solid var(--line);border-radius:14px;width:100%}
.game-ui .ui-mode button{min-height:44px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-size:14px;font-weight:700;box-shadow:none}
.game-ui .ui-mode button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 2px 5px #1525361a}
.game-ui .ui-panel .ui-mode-note{font-size:12px;line-height:1.6;text-align:center;color:var(--muted)}
.game-ui .ui-mode-status{display:block;padding:5px 10px;color:var(--accent);font-size:11px;font-weight:700;line-height:1.5;text-align:center;border:1px solid var(--line);border-radius:8px;background:var(--surface);margin:4px auto;max-width:100%;pointer-events:none}
.game-ui body>.wrap>canvas:not(#fx){background-color:var(--stage);box-shadow:0 0 0 1px var(--line),0 6px 0 var(--soft);border-radius:18px;flex-shrink:0}
.game-ui .screen>canvas.game{box-shadow:0 0 0 1px var(--line),0 6px 0 var(--soft)}
.game-ui #hud{gap:6px;background:var(--surface);color:var(--ink)}
.game-ui #hud :is(.left,.t,.s,.grp,.pill){color:var(--ink)}
.game-ui #hud .pill{background:var(--surface);border-color:var(--line)}
.game-ui body canvas:is(#cv,#game,#board){background-color:var(--stage)}
.game-ui :is(button.dbtn,button.cbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.game-ui :is(button.lvl,button.lvlbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line);border-radius:12px;min-height:54px}
.game-ui :is(button.lvl,button.lvlbtn) :is(.nc,.sz,small){color:var(--muted)}
.game-ui .ui-panel button.lvl{margin:0;min-width:44px;box-shadow:none;padding:8px}
.game-ui #hud :is(.left,.right,.hudl,.hbtns){gap:5px;flex-wrap:wrap}
.game-ui #hud :is(.left,.hudl){min-width:0;flex-shrink:1}
.game-ui #hud :is(.pill,.left){font-size:12px}
.game-ui button:disabled{cursor:default;opacity:.45;box-shadow:none}
.game-ui .ui-panel .ui-assist-note{color:var(--accent);font-weight:700}
@media(min-width:700px){.game-ui body>.wrap{padding-top:32px}.game-ui .ui-panel{padding:36px 30px}}
@media(max-width:360px){.game-ui body>.wrap{padding:10px;gap:10px}.game-ui .ui-panel{padding:22px 18px;gap:13px}.game-ui .ui-panel h1{font-size:26px}.game-ui .ui-emblem{width:70px;height:70px;font-size:38px}.game-ui :is(.topbar,#topbar){gap:5px;padding:8px}.game-ui :is(.iconbtn,.icobtn,.ibtn,.tbtn,.ib){min-width:40px;min-height:44px}}
@media(max-height:650px){.game-ui .ui-panel{padding:18px;gap:12px}.game-ui .ui-emblem{width:60px;height:60px;font-size:32px}.game-ui .ui-panel h1{font-size:25px}.game-ui .ui-panel :is(p,.howto,.sub,.rule){font-size:13px}}
@media(prefers-reduced-motion:reduce){.game-ui *, .game-ui *::before,.game-ui *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
/* 2026-10-20 热修：开局/结算遮罩铺满整屏，主按钮固定在面板底部，避免被画布尺寸裁切（#10） */
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv):has(>.ui-panel){position:fixed;inset:0;z-index:1000;border-radius:0;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
.game-ui .ui-panel{touch-action:pan-y}
.game-ui .ui-panel :is(#startBtn,#btnStart,.startbtn,#bStart,#restartBtn,#btnRestart,#againBtn,#btnAgain,#retryBtn,#btnRetry,#playBtn,#btnPlay){position:sticky;bottom:0;z-index:3;flex-shrink:0}
.game-ui .ui-panel :not(.card,.panel,.pausecard,.ovcard,.ui-mode):has(>:is(#startBtn,#btnStart,.startbtn,#bStart,#restartBtn,#btnRestart,#againBtn,#btnAgain,#retryBtn,#btnRetry,#playBtn,#btnPlay)){position:sticky;bottom:0;z-index:3;flex-shrink:0;background:var(--surface);box-shadow:0 -10px 10px -6px var(--surface)}


/* ===== Direction B · 霓虹糖果 Pop Arcade ===== saturated gradients, chunky bevels with a hard bottom edge, sticker panels, neon on dark themes */
html.game-ui[data-skin="b"]{--fb:"HarmonyOS Sans SC","MiSans","OPPOSans","vivo Sans","Noto Sans SC","Noto Sans CJK SC","PingFang SC","Microsoft YaHei UI",system-ui,sans-serif;--bounce:cubic-bezier(.34,1.56,.64,1);--bg:radial-gradient(circle at 12% 18%,rgba(255,255,255,.28) 0 38px,transparent 40px),radial-gradient(circle at 88% 30%,rgba(255,255,255,.16) 0 64px,transparent 66px),radial-gradient(circle at 20% 82%,rgba(255,255,255,.14) 0 52px,transparent 54px),radial-gradient(rgba(255,255,255,.16) 1.5px,transparent 2.2px) 0 0/22px 22px,linear-gradient(165deg,var(--b-bg1),var(--b-bg2));font-family:var(--fb)}
html.game-ui[data-skin="b"],html.game-ui[data-skin="b"] body,html.game-ui[data-skin="b"] #app,html.game-ui[data-skin="b"] :is(.overlay,.ov,#ov,#overlay,#pauseOv):has(>.ui-panel){background:var(--bg);background-color:var(--b-bg2)}

      }), 0, 0, w, h);
    },
    // Glow is shadowBlur: cheap for a handful of shapes, never use it on every tile.
    glow: function (ctx, color, blur) { ctx.shadowColor = color; ctx.shadowBlur = blur; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0; },
    noGlow: function (ctx) { ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; },
    // Crisp rendering on high-DPI phones without changing game coordinates.
    // Only safe where input code converts with getBoundingClientRect + logical W/H, not cv.width.
    hidpi: function (cv, ctx, w, h) {
      var d = Math.max(1, Math.min(2.5, window.devicePixelRatio || 1));
      cv.width = Math.round(w * d); cv.height = Math.round(h * d); // intrinsic ratio stays w:h, so CSS sizing is unchanged
      ctx.setTransform(d, 0, 0, d, 0, 0); return d;
    },
    // Lightweight particle bursts (pooled array, no allocations per frame beyond the burst).
    burst: function (list, x, y, color, n) {
      for (var i = 0; i < (n || 12); i++) { var a = Math.random() * 6.283, v = 1 + Math.random() * 2.6; list.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 1, life: 1, c: color, r: 1.5 + Math.random() * 2.5 }); }
    },
    drawBurst: function (ctx, list) {
      for (var i = list.length - 1; i >= 0; i--) {
        var p = list[i]; p.x += p.vx; p.y += p.vy; p.vy += .12; p.life -= .035;
        if (p.life <= 0) { list.splice(i, 1); continue; }
        ctx.globalAlpha = p.life; ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (skin === 'b' ? 1.2 : 1), 0, 7); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
  };
  window.GameUI.fx = fx;
}());

</script>
<!-- GAME UI END -->
</head>
<body>
<div class="wrap">
<div class="topbar"><span>🎰 弹珠台</span><span>得分 <b id="score">0</b></span><span class="balls" id="balls">●●●</span></div>
<canvas id="cv" width="400" height="560"></canvas>
<div class="ctrl">
<button class="fbtn" id="leftBtn">◀ 左挡板</button>
<button class="fbtn" id="rightBtn">右挡板 ▶</button>
</div>
<p class="hint">左右按钮（或点按屏幕左右半边）控制挡板<br>别让小球从底部漏掉，共 3 颗球</p>
</div>
<div class="overlay" id="startScr"><h1>🎰 弹珠台</h1><p>按住左侧/右侧按钮（或触摸屏幕左右半边）<br>抬起对应挡板把球弹回去<br>撞中圆形目标 +100 分，挡板击球也有分<br>球漏出底部失去一颗，共 3 颗球<br>分数越高球速越快</p><button class="btn" id="startBtn">开始游戏</button></div>
<div class="overlay hidden" id="overScr"><h1 id="overTitle">游戏结束</h1><p id="overText"></p><button class="btn" id="restartBtn">再来一局</button></div>
<script>
/* GAMEPLAY UPGRADE */
'use strict';
const $=id=>document.getElementById(id);
function vibrate(ms){try{if(window.NativeBridge&&window.NativeBridge.vibrate)window.NativeBridge.vibrate(ms);}catch(e){}}
function setHUD(){$('score').textContent=score;$('balls').textContent='●'.repeat(Math.max(0,balls));}

const cv=$('cv'),ctx=cv.getContext('2d');
const W=400,H=560,L=20,R=380,TOP=20;
const BALL_R=10;

const FL={px:150,py:512,len:78,rest:1.1,active:-0.55,ang:1.1};   // 左挡板（静止角 1.1：两挡板尖端留出约 30px 漏球口，原 0.55 时两板交叉，球永远漏不掉）
const FR={px:250,py:512,len:78,rest:Math.PI-1.1,active:Math.PI+0.55,ang:Math.PI-1.1}; // 右挡板
const GUIDES=[{x1:L,y1:440,x2:150,y2:512},{x1:R,y1:440,x2:250,y2:512}]; // 两侧斜导板
const KICKERS=[{x1:L,y1:280,x2:58,y2:318},{x1:R,y1:280,x2:342,y2:318}]; // 两侧弹射器
const BUMPERS=[
  {x:200,y:150,r:28,flash:0},
  {x:118,y:238,r:24,flash:0},
  {x:282,y:238,r:24,flash:0}
];

let ball,score,balls,raf,state,leftDown,rightDown;

function level(){return 1+((score/800)|0);}
function gravity(){return 0.22+0.025*(level()-1);}
function reset(){
  score=0;balls=GameUI.pick(3,2);leftDown=false;rightDown=false;
  BUMPERS.forEach(b=>b.flash=0);
  FL.ang=FL.rest;FR.ang=FR.rest;
  ball=null;setHUD();
}
function launch(){
  ball={x:200,y:80,vx:(Math.random()*4-2),vy:1};
}
function addScore(n){score+=n;setHUD();}
function segClosest(px,py,s){
  const dx=s.x2-s.x1,dy=s.y2-s.y1;
  const len2=dx*dx+dy*dy||1;
  let t=((px-s.x1)*dx+(py-s.y1)*dy)/len2;
  t=Math.max(0,Math.min(1,t));
  return {x:s.x1+dx*t,y:s.y1+dy*t};
}
function collideSeg(s,rest,boost){
  const c=segClosest(ball.x,ball.y,s);
  const dx=ball.x-c.x,dy=ball.y-c.y;
  const d=Math.hypot(dx,dy);
  if(d<BALL_R&&d>0.001){
    const nx=dx/d,ny=dy/d;
    ball.x=c.x+nx*BALL_R;ball.y=c.y+ny*BALL_R;
    const vn=ball.vx*nx+ball.vy*ny;
    if(vn<0){
      ball.vx-=2*vn*nx;ball.vy-=2*vn*ny;
      ball.vx*=rest;ball.vy*=rest;
      if(boost){ball.vx+=-ny*boost;ball.vy+=nx*boost;}
    }
    return true;
  }
  return false;
}
function flipperSeg(f){
  return {x1:f.px,y1:f.py,x2:f.px+Math.cos(f.ang)*f.len,y2:f.py+Math.sin(f.ang)*f.len};
}
function update(){
  // 挡板角度
  const rateL=leftDown?0.5:0.18,rateR=rightDown?0.5:0.18;
  const tL=leftDown?FL.active:FL.rest,tR=rightDown?FR.active:FR.rest;
  const dL=tL-FL.ang,dR=tR-FR.ang;
  FL.ang+=Math.max(-rateL,Math.min(rateL,dL));
  FR.ang+=Math.max(-rateR,Math.min(rateR,dR));

  ball.vy+=gravity();
  // 限速
  const sp=Math.hypot(ball.vx,ball.vy),max=13+level()*0.4;
  if(sp>max){ball.vx*=max/sp;ball.vy*=max/sp;}
  ball.x+=ball.vx;ball.y+=ball.vy;

  // 墙
  if(ball.x<L+BALL_R){ball.x=L+BALL_R;ball.vx=Math.abs(ball.vx)*0.95;}
  if(ball.x>R-BALL_R){ball.x=R-BALL_R;ball.vx=-Math.abs(ball.vx)*0.95;}
  if(ball.y<TOP+BALL_R){ball.y=TOP+BALL_R;ball.vy=Math.abs(ball.vy)*0.95;}
  // 斜导板与弹射器
  GUIDES.forEach(s=>collideSeg(s,0.9,0));
  KICKERS.forEach(s=>{if(collideSeg(s,1.15,2.5)){addScore(50);vibrate(20);}});
  // 挡板碰撞
  const fL=flipperSeg(FL),fR=flipperSeg(FR);
  if(collideSeg(fL,1.0,leftDown?5:0)){addScore(10);if(leftDown)vibrate(25);}
  if(collideSeg(fR,1.0,rightDown?5:0)){addScore(10);if(rightDown)vibrate(25);}
  // 圆形加分目标
  for(const b of BUMPERS){
    const dx=ball.x-b.x,dy=ball.y-b.y,d=Math.hypot(dx,dy);
    if(d<b.r+BALL_R&&d>0.001){
      const nx=dx/d,ny=dy/d;
      ball.x=b.x+nx*(b.r+BALL_R);ball.y=b.y+ny*(b.r+BALL_R);
      const vn=ball.vx*nx+ball.vy*ny;
      if(vn<0){
        const kick=7*(1+0.06*(level()-1));
        ball.vx-=2*vn*nx;ball.vy-=2*vn*ny;
        ball.vx+=nx*kick;ball.vy+=ny*kick;
      }
      b.flash=10;addScore(100);vibrate(30);
    }
    if(b.flash>0)b.flash--;
  }
  // 漏球
  if(ball.y-BALL_R>H){
    balls--;setHUD();vibrate(100);
    if(balls<=0){gameOver();}
    else launch();
  }
}
function draw(){
  if(FX)return drawFx();
  ctx.clearRect(0,0,W,H);
  // 台面边框
  ctx.strokeStyle='#E91E63';ctx.lineWidth=4;
  ctx.beginPath();ctx.moveTo(L,440);ctx.lineTo(L,TOP);ctx.lineTo(R,TOP);ctx.lineTo(R,440);ctx.stroke();
  // 斜导板
  ctx.strokeStyle='#888';ctx.lineWidth=6;ctx.lineCap='round';
  GUIDES.forEach(s=>{ctx.beginPath();ctx.moveTo(s.x1,s.y1);ctx.lineTo(s.x2,s.y2);ctx.stroke();});
  // 弹射器
  ctx.strokeStyle='#00BCD4';
  KICKERS.forEach(s=>{ctx.beginPath();ctx.moveTo(s.x1,s.y1);ctx.lineTo(s.x2,s.y2);ctx.stroke();});
  // 圆形目标
  BUMPERS.forEach(b=>{
    ctx.fillStyle=b.flash>0?'#fff':'#E91E63';
    ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=b.flash>0?'#E91E63':'#fff';
    ctx.font='bold 15px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('+100',b.x,b.y);
  });
  // 挡板
  [[FL,leftDown],[FR,rightDown]].forEach(pair=>{
    const f=pair[0],s=flipperSeg(f);
    ctx.strokeStyle=pair[1]?'#ff5c8a':'#E91E63';ctx.lineWidth=12;
    ctx.beginPath();ctx.moveTo(s.x1,s.y1);ctx.lineTo(s.x2,s.y2);ctx.stroke();
    ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(s.x1,s.y1,6,0,Math.PI*2);ctx.fill();
  });
  // 球
  if(ball){
    const g=ctx.createRadialGradient(ball.x-3,ball.y-3,2,ball.x,ball.y,BALL_R);
    g.addColorStop(0,'#fff');g.addColorStop(1,'#E91E63');
    ctx.fillStyle=g;
    ctx.beginPath();ctx.arc(ball.x,ball.y,BALL_R,0,Math.PI*2);ctx.fill();
  }
  // 底部漏球区提示
  ctx.fillStyle='#333';ctx.font='13px sans-serif';ctx.textAlign='center';
  ctx.fillText('▼ 漏球区 ▼',200,H-8);
}
/* ART T1-1: candy-depth renderer (GameUI.fx); the flat draw() below stays as the no-FX fallback */
const FX=window.GameUI&&GameUI.fx&&GameUI.fx.on?GameUI.fx:null,sparks=[];let tableLayer=null;
if(FX)FX.hidpi(cv,ctx,W,H);
function fxRail(g,x1,y1,x2,y2,w,c1,c2){g.lineCap='round';g.strokeStyle='rgba(0,0,0,.45)';g.lineWidth=w+4;g.beginPath();g.moveTo(x1+2,y1+3);g.lineTo(x2+2,y2+3);g.stroke();
  g.strokeStyle=c2;g.lineWidth=w;g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();g.strokeStyle=c1;g.lineWidth=Math.max(1.5,w*.35);g.beginPath();g.moveTo(x1,y1-w*.18);g.lineTo(x2,y2-w*.18);g.stroke();}
function fxTable(){
  const d=Math.max(1,Math.min(2.5,window.devicePixelRatio||1)),c=document.createElement('canvas');c.width=W*d;c.height=H*d;const g=c.getContext('2d');g.scale(d,d);
  const bg=g.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#3a1170');bg.addColorStop(.6,'#22105a');bg.addColorStop(1,'#0b0522');g.fillStyle=bg;g.fillRect(0,0,W,H);
  const sp=g.createRadialGradient(200,190,20,200,220,300);sp.addColorStop(0,'rgba(255,140,220,.22)');sp.addColorStop(1,'rgba(0,0,0,.35)');g.fillStyle=sp;g.fillRect(0,0,W,H);
  g.strokeStyle='rgba(255,255,255,.06)';g.lineWidth=1;for(let i=-H;i<W;i+=28){g.beginPath();g.moveTo(i,0);g.lineTo(i+H*.6,H);g.stroke();}
  // 圆形目标的底座光圈
  BUMPERS.forEach(b=>{const rg=g.createRadialGradient(b.x,b.y,b.r,b.x,b.y,b.r+18);rg.addColorStop(0,'rgba(255,61,154,.45)');rg.addColorStop(1,'rgba(255,61,154,0)');g.fillStyle=rg;g.beginPath();g.arc(b.x,b.y,b.r+18,0,7);g.fill();});
  // 箭头灯
  g.fillStyle='rgba(255,225,77,.35)';[[200,330],[200,352],[200,374]].forEach(p=>{g.beginPath();g.moveTo(p[0]-10,p[1]);g.lineTo(p[0],p[1]-9);g.lineTo(p[0]+10,p[1]);g.lineTo(p[0],p[1]-4);g.closePath();g.fill();});
  // 台面边框（立体导轨）
  fxRail(g,L,440,L,TOP,8,'#ffc2e0','#e91e63');fxRail(g,L,TOP,R,TOP,8,'#ffc2e0','#e91e63');fxRail(g,R,TOP,R,440,8,'#ffc2e0','#e91e63');
  GUIDES.forEach(s=>fxRail(g,s.x1,s.y1,s.x2,s.y2,8,'#ffffff','#9aa3c7'));
  g.fillStyle='rgba(255,255,255,.55)';g.font='800 13px sans-serif';g.textAlign='center';g.fillText('▼ 漏球区 ▼',200,H-8);
  return c;
}
function drawFx(){
  if(!tableLayer)tableLayer=fxTable();
  ctx.drawImage(tableLayer,0,0,W,H);
  FX.glow(ctx,'#00e5ff',12);ctx.lineCap='round';
  KICKERS.forEach(s=>{ctx.strokeStyle='#7af5ff';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(s.x1,s.y1);ctx.lineTo(s.x2,s.y2);ctx.stroke();});FX.noGlow(ctx);
  KICKERS.forEach(s=>{ctx.strokeStyle='#ffffff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(s.x1,s.y1-1);ctx.lineTo(s.x2,s.y2-1);ctx.stroke();});
  BUMPERS.forEach(b=>{
    if(b.flash===9)FX.burst(sparks,b.x,b.y,'#ffd34d',12);
    if(b.flash>0)FX.glow(ctx,'#ffe14d',22);
    FX.orb(ctx,b.x,b.y,b.r,b.flash>0?'#ffd23f':'#ff3d9a');FX.noGlow(ctx);
    ctx.strokeStyle='rgba(255,255,255,.75)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(b.x,b.y,b.r-5,0,7);ctx.stroke();
    ctx.font='900 14px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';ctx.lineWidth=4;
    ctx.strokeStyle=b.flash>0?'#7b4a00':'#5a0a30';ctx.strokeText('+100',b.x,b.y+1);ctx.fillStyle='#fff';ctx.fillText('+100',b.x,b.y+1);
  });
  ctx.textBaseline='alphabetic';
  [[FL,leftDown],[FR,rightDown]].forEach(pair=>{
    const f=pair[0],s=flipperSeg(f);ctx.lineCap='round';
    ctx.strokeStyle='rgba(0,0,0,.45)';ctx.lineWidth=15;ctx.beginPath();ctx.moveTo(s.x1+2,s.y1+4);ctx.lineTo(s.x2+2,s.y2+4);ctx.stroke();
    if(pair[1])FX.glow(ctx,'#ff3d9a',14);
    ctx.strokeStyle=pair[1]?'#ff6fb5':'#e91e63';ctx.lineWidth=14;ctx.beginPath();ctx.moveTo(s.x1,s.y1);ctx.lineTo(s.x2,s.y2);ctx.stroke();FX.noGlow(ctx);
    ctx.strokeStyle='rgba(255,255,255,.6)';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(s.x1,s.y1-3);ctx.lineTo(s.x1+(s.x2-s.x1)*.85,s.y1+(s.y2-s.y1)*.85-3);ctx.stroke();
    FX.orb(ctx,s.x1,s.y1,7,'#ffe14d');
  });
  FX.drawBurst(ctx,sparks);
  if(ball){FX.orb(ctx,ball.x,ball.y,BALL_R,'#dfe6ff');}
}
function loop(){
  if(state!=='play')return;
  update();
  draw();
  raf=requestAnimationFrame(loop);
}
function gameOver(){
  if(state!=='play')return;
  state='over';
  cancelAnimationFrame(raf);
  $('overTitle').textContent='游戏结束';
  $('overText').textContent='最终得分 '+score+' 分';
  $('overScr').classList.remove('hidden');
}
function startGame(){
  cancelAnimationFrame(raf);
  $('overScr').classList.add('hidden');
  $('startScr').classList.add('hidden');
  reset();
  state='play';
  launch();
  loop();
}
function bindBtn(el,set){
  const on=e=>{e.preventDefault();set(true);el.classList.add('on');};
  const off=e=>{e.preventDefault();set(false);el.classList.remove('on');};
  el.addEventListener('touchstart',on,{passive:false});
  el.addEventListener('touchend',off);el.addEventListener('touchcancel',off);
  el.addEventListener('mousedown',on);el.addEventListener('mouseup',off);el.addEventListener('mouseleave',off);
}
bindBtn($('leftBtn'),v=>leftDown=v);
bindBtn($('rightBtn'),v=>rightDown=v);
// 点按画布左右半屏也可控制
function halfTouch(e){
  const r=cv.getBoundingClientRect();
  const t=e.touches?e.touches[0]:e;
  const x=(t.clientX-r.left)/r.width*W;
  return x<W/2?'left':'right';
}
cv.addEventListener('touchstart',e=>{
  e.preventDefault();
  for(const t of e.changedTouches){
    const r=cv.getBoundingClientRect();
    const x=(t.clientX-r.left)/r.width*W;
    if(x<W/2){leftDown=true;$('leftBtn').classList.add('on');}
    else{rightDown=true;$('rightBtn').classList.add('on');}
  }
},{passive:false});
function halfOff(e){
  leftDown=false;rightDown=false;
  $('leftBtn').classList.remove('on');$('rightBtn').classList.remove('on');
}
cv.addEventListener('touchend',halfOff);
cv.addEventListener('touchcancel',halfOff);
cv.addEventListener('mousedown',e=>{
  const side=halfTouch(e);
  if(side==='left'){leftDown=true;}else{rightDown=true;}
});
cv.addEventListener('mouseup',()=>{leftDown=false;rightDown=false;});
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'||e.key==='z'||e.key==='Z')leftDown=true;
  if(e.key==='ArrowRight'||e.key==='m'||e.key==='M')rightDown=true;
});
document.addEventListener('keyup',e=>{
  if(e.key==='ArrowLeft'||e.key==='z'||e.key==='Z')leftDown=false;
  if(e.key==='ArrowRight'||e.key==='m'||e.key==='M')rightDown=false;
});
$('startBtn').addEventListener('click',startGame);
$('restartBtn').addEventListener('click',startGame);
reset();draw();
</script>
</body>
</html>
