<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{display:flex;justify-content:center;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.wrap{width:100%;max-width:480px;height:100%;padding:10px;display:flex;flex-direction:column;align-items:center;gap:8px}
.topbar{width:100%;display:flex;justify-content:space-between;align-items:center;flex-wrap:nowrap!important;gap:6px}

.topbar .tools .iconbtn{min-width:44px;min-height:44px}

.hint{font-size:12px;text-align:center;min-height:16px;font-weight:700}

.overlay.hidden{display:none!important}
.lvgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:100%;max-width:360px;max-height:50vh;overflow:auto}
.lvgrid .lvl{min-height:54px;min-width:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:16px;padding:4px!important;line-height:1.1}

.rowbtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:100%}
#tutStep{font-size:12px;opacity:.7}

#toast.on{opacity:1;transform:translate(-50%,0)}
.shop{display:flex;flex-direction:column;gap:8px;width:100%;max-width:320px}
.shop .row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;border-radius:12px;background:rgba(255,255,255,.12)}
.ctrlbar{width:100%;display:flex;gap:10px}
.ctrlbar .btn{flex:1;min-height:52px;font-size:18px}
</style>
<!-- GAME UI BEGIN -->
<style>
:root{--page:#e7edf4;--surface:#ffffff;--soft:#dce5ef;--ink:#243952;--muted:#5b6d83;--accent:#275e9b;--on-accent:#ffffff;--line:#bacbdd;--stage:#172d48;--page:#dbe5f6;--surface:#ffffff;--soft:#f5f8fc;--ink:#17243d;--muted:#526482;--accent:#255fd0;--on-accent:#ffffff;--line:#b7cae6;--b-bg1:#eef3fc;--b-bg2:#dbe5f6;--b-btn:#2b6ef2;--b-btn-hi:#5e91f5;--b-edge:#184bb8;--b-glow:#c7ddff;--b-glow-rgb:199,221,255;--b-pedge-rgb:183,202,230;--b-btn-rgb:43,110,242;--b-bg2-rgb:219,229,246;--b-surf-rgb:255,255,255;--b-btn-ink:#ffffff;--b-btn-tsh:0 1px 2px rgba(0,0,0,.22);--b-coin-ink:#01040a;--b-coin-tsh:none;--b-key-ink:#17243d;--b-title:#17243d;--b-hint-ink:#17243d}

.game-ui #hud{gap:6px;background:var(--surface);color:var(--ink)}

.game-ui :is(button.dbtn,button.cbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line)}

.game-ui .ui-panel button.lvl{margin:0;min-width:44px;box-shadow:none;padding:6px}
.game-ui #hud :is(.left,.right,.hudl,.hbtns){gap:5px;flex-wrap:wrap}
.game-ui #hud :is(.left,.hudl){min-width:0;flex-shrink:1}

@media(min-width:700px){.game-ui body>.wrap{padding-top:24px}.game-ui .ui-panel{padding:32px 28px}}
@media(max-width:360px){.game-ui body>.wrap{padding:8px 10px;gap:8px}.game-ui .ui-panel{padding:20px 16px;gap:11px}.game-ui .ui-panel h1{font-size:24px}.game-ui .ui-emblem{width:68px;height:68px;font-size:36px;border-radius:20px}.game-ui :is(.topbar,#topbar){gap:5px;padding:6px 10px}.game-ui :is(.iconbtn,.icobtn,.ibtn,.tbtn,.ib){min-width:44px;min-height:44px}}

<div id="toast"></div>
<script>
'use strict';

const $=id=>document.getElementById(id);
const W=360,H=540;
const cv=$('cv'),ctx=cv.getContext('2d');
const UI=window.GameUI||{pick:a=>a,storageGet:k=>localStorage.getItem(k),storageSet:(k,v)=>localStorage.setItem(k,v)};
const FX=UI.fx&&UI.fx.on?UI.fx:null;
if(FX)FX.hidpi(cv,ctx,W,H);else{cv.width=W;cv.height=H;}
function show(id,on){$(id).classList.toggle('hidden',!on);}
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('on'),1200);}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function posOf(e){const r=cv.getBoundingClientRect();const t=(e.touches&&e.touches[0])||(e.changedTouches&&e.changedTouches[0])||e;return{x:(t.clientX-r.left)*W/r.width,y:(t.clientY-r.top)*H/r.height};}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function tutorial(pages,done){let i=0;function render(){$('tutH').textContent=pages[i][0];$('tutP').innerHTML=pages[i][1];$('tutStep').textContent=(i+1)+' / '+pages.length;$('tutNext').textContent=i<pages.length-1?'下一步':'开始挑战';}
  show('tutScr',true);render();
  $('tutNext').onclick=()=>{if(i<pages.length-1){i++;render();}else{show('tutScr',false);done();}};
  $('tutSkip').onclick=()=>{show('tutScr',false);done();};
}

const PK='g100_screwpop_prog', MK='g100_screwpop_mute';
const COLS=['#FF5C8A','#FFB21E','#5B8CFF','#3FC163','#C77DFF'];
let muted=UI.storageGet(MK)==='1',ac=null; $('muteBtn').textContent=muted?'🔇':'🔊';
function beep(f,d,type){if(muted)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(.12,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d);}catch(e){}}
$('muteBtn').onclick=()=>{muted=!muted;UI.storageSet(MK,muted?'1':'0');$('muteBtn').textContent=muted?'🔇':'🔊';};
function loadProg(){try{return JSON.parse(UI.storageGet(PK)||'{}')}catch(e){return{}}}
function saveProg(p){UI.storageSet(PK,JSON.stringify(p));}
let prog=loadProg(); if(!prog.stars)prog.stars={}; if(prog.coins==null)prog.coins=0; if(prog.unlock==null)prog.unlock=1; if(prog.hintLv==null)prog.hintLv=0; if(prog.wildLv==null)prog.wildLv=0; if(!prog.seenTut)prog.seenTut=0;
const TOTAL=40; $('bestLine').textContent='解锁 '+prog.unlock+'/'+TOTAL+' · 币 '+prog.coins;

let state='menu', lvl=1, plates=[], screws=[], bins=[], wildLeft=0, hintGlow=-1, falling=[], last=0, sparks=[], boss=false;

function genLevel(n){
  const rnd=mulberry32(n*4243+9);
  const nCol=Math.min(5,2+Math.floor((n-1)/6));
  const nPlate=Math.min(8,3+Math.floor(n/4));
  boss=n%5===0;
  plates=[]; screws=[];
  // create plates as polygons with screw anchors
  for(let i=0;i<nPlate;i++){
    const cx=60+rnd()*240, cy=80+rnd()*280, w=50+rnd()*40, h=36+rnd()*30, rot=rnd()*0.5;
    const col=Math.floor(rnd()*nCol);
    const verts=[[-w/2,-h/2],[w/2,-h/2],[w/2,h/2],[-w/2,h/2]].map(([x,y])=>{
      const xr=x*Math.cos(rot)-y*Math.sin(rot), yr=x*Math.sin(rot)+y*Math.cos(rot); return [cx+xr,cy+yr];
    });
    const ns=2+Math.floor(rnd()*2)+(boss?1:0);
    const sc=[];
    for(let s=0;s<ns;s++){
      const t=s/(ns-1||1); const vx=verts[0][0]*(1-t)+verts[1][0]*t; const vy=verts[0][1]*(1-t)+verts[2][1]*t;
      // place near edges
      const px=cx+(rnd()-0.5)*w*0.8, py=cy+(rnd()-0.5)*h*0.8;
      const locked=boss && s===0 && i>0;
      const sid=screws.length;
      screws.push({x:px,y:py,col:Math.floor(rnd()*nCol), plate:i, gone:false, locked, r:14});
      sc.push(sid);
    }
    plates.push({verts, col, screws:sc, gone:false, fallY:0});
  }
  // unlock dependency: locked screw unlocks when plate 0 gone — simplify: locked until any lower-index plate gone
  bins=Array.from({length:nCol},(_,c)=>({col:c, stack:[]}));
  wildLeft = (prog.wildLv>0?1:0) + (boss?0:0);
  return {nCol};
}

function startLevel(n){
  lvl=n; genLevel(n); falling=[]; hintGlow=-1; state='play'; last=performance.now();
  show('startScr',false);show('lvlScr',false);show('shopScr',false);show('tutScr',false);show('pauseOv',false);show('overScr',false);
  $('statLine').textContent=`关 ${n} · 螺丝 ${screws.filter(s=>!s.gone).length}`;
  $('hint').textContent=boss?'👑 Boss：有锁头螺丝，先拆挡路铁片':'点螺丝拧下，放进同色盒（满3收起）';
  beep(660,.1);
}

function freeBinsFor(col){
  // prefer matching bin with space; wild bin is bins special - use wildLeft as virtual
  let b=bins.find(x=>x.col===col && x.stack.length<3);
  return b;
}
function checkDead(){
  const remain=screws.filter(s=>!s.gone && !s.locked);
  if(!remain.length) return false;
  return remain.every(s=>!freeBinsFor(s.col) && wildLeft<=0);
}
function tryScrew(s){
  if(s.gone||s.locked) { if(s.locked) toast('先拆挡路铁片'); return; }
  let b=freeBinsFor(s.col);
  if(!b && wildLeft>0){ // use wild: put into any bin with space creating wild slot — simplify: force into first with space marking as wild accept
    b=bins.find(x=>x.stack.length<3); if(b){ wildLeft--; toast('万能盒'); }
  }
  if(!b){ beep(160,.1,'sawtooth'); toast('盒子满了'); if(checkDead()) lose(); return; }
  s.gone=true; b.stack.push(s.col); beep(480,.08);
  if(b.stack.length>=3){ b.stack=[]; prog.coins+=1; beep(880,.1); if(FX)FX.burst(sparks,40+b.col*60,H-40,COLS[b.col],10); }
  // update plates
  for(const p of plates){ if(p.gone) continue; if(p.screws.every(id=>screws[id].gone)){ p.gone=true; p.fallY=0; falling.push(p); beep(300,.12,'triangle');
    // unlock screws that depended on this plate
    for(const sc of screws){ if(sc.locked && sc.plate>plates.indexOf(p)) sc.locked=false; }
    // simpler: unlock all locked on higher plates when any plate falls
    screws.forEach(sc=>{ if(sc.locked) sc.locked=false; });
  }}
  $('statLine').textContent=`关 ${lvl} · 螺丝 ${screws.filter(s=>!s.gone).length}`;
  if(plates.every(p=>p.gone) && screws.every(s=>s.gone)) win();
  else if(checkDead()) lose();
}
function win(){ state='over'; const st=boss?3:2; const prev=prog.stars[lvl]|0; if(st>prev)prog.stars[lvl]=st;
  const gain=14+st*6+(boss?20:0); prog.coins+=gain; if(lvl>=prog.unlock&&lvl<TOTAL)prog.unlock=lvl+1; saveProg(prog);
  $('overH').textContent=boss?'Boss 面板清空！':'全部拆完！'; $('finalScore').textContent='★'.repeat(st)+'☆'.repeat(3-st);
  $('overText').textContent=`+${gain} 币 · 总币 ${prog.coins}`; show('overScr',true); beep(900,.2); }
function lose(){ state='over'; $('overH').textContent='卡死了'; $('finalScore').textContent='关 '+lvl;
  $('overText').textContent='盒子满且无处可放，再试一次'; show('overScr',true); $('nextBtn').style.display='none'; beep(160,.3,'sawtooth'); }

function hint(){
  if(prog.hintLv<=0 && prog.coins<8){toast('需8币或升级提示');return;}
  if(prog.hintLv<=0){prog.coins-=8;saveProg(prog);}
  const cand=screws.find(s=>!s.gone&&!s.locked&&freeBinsFor(s.col));
  if(!cand){toast('没有安全螺丝');return;}
  hintGlow=screws.indexOf(cand); toast('看高亮螺丝'); beep(1000,.08); setTimeout(()=>hintGlow=-1,1500);
}

cv.addEventListener('pointerdown',e=>{
  e.preventDefault(); if(state!=='play')return; const p=posOf(e);
  // hint button zone
  if(p.y>H-50 && p.x>W/2){ hint(); return; }
  // hit screws — large hot zone 44px
  let best=null,bd=1e9;
  for(const s of screws){ if(s.gone)continue; const d=Math.hypot(p.x-s.x,p.y-s.y); if(d<22 && d<bd){bd=d;best=s;} }
  if(best) tryScrew(best);
});

function update(dt){ for(const p of falling){ p.fallY+=dt*400; } falling=falling.filter(p=>p.fallY<600); }
function draw(){
  if(FX) FX.stage(ctx,W,H,'#72cbff','#3b62ef'); else {ctx.fillStyle='#3b62ef';ctx.fillRect(0,0,W,H);}
  // board
  ctx.fillStyle='rgba(255,255,255,.15)'; roundRect(20,40,W-40,H-120,12); ctx.fill();
  for(const p of plates){
    if(p.gone && !falling.includes(p)) continue;
    const dy=p.gone?p.fallY:0; ctx.save(); ctx.translate(0,dy); ctx.globalAlpha=p.gone?Math.max(0,1-dy/400):1;
    ctx.beginPath(); p.verts.forEach((v,i)=>i?ctx.lineTo(v[0],v[1]):ctx.moveTo(v[0],v[1])); ctx.closePath();
    const c=COLS[p.col%COLS.length]; if(FX){ctx.fillStyle=c;ctx.fill();ctx.strokeStyle='rgba(0,0,0,.25)';ctx.lineWidth=2;ctx.stroke();}
    else {ctx.fillStyle=c;ctx.fill();}
    ctx.restore();
  }
  for(let i=0;i<screws.length;i++){ const s=screws[i]; if(s.gone)continue;
    const hot=22; // visual smaller but hot larger
    if(FX) FX.orb(ctx,s.x,s.y,10,COLS[s.col]); else {ctx.fillStyle=COLS[s.col];ctx.beginPath();ctx.arc(s.x,s.y,10,0,7);ctx.fill();}
    ctx.strokeStyle='#333'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(s.x,s.y,10,0,7); ctx.stroke();
    // cross
    ctx.beginPath(); ctx.moveTo(s.x-5,s.y); ctx.lineTo(s.x+5,s.y); ctx.moveTo(s.x,s.y-5); ctx.lineTo(s.x,s.y+5); ctx.stroke();
    if(s.locked){ ctx.font='12px sans-serif'; ctx.textAlign='center'; ctx.fillText('🔒',s.x,s.y-14); }
    if(i===hintGlow){ ctx.strokeStyle='#FFE08A'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(s.x,s.y,18,0,7); ctx.stroke(); }
  }
  // bins
  bins.forEach((b,i)=>{ const x=30+i*64, y=H-70; ctx.fillStyle='rgba(0,0,0,.25)'; roundRect(x,y,56,48,8); ctx.fill();
    ctx.strokeStyle=COLS[b.col]; ctx.lineWidth=3; roundRect(x,y,56,48,8); ctx.stroke();
    b.stack.forEach((c,j)=>{ if(FX)FX.orb(ctx,x+28,y+38-j*12,8,COLS[c]); else{ctx.fillStyle=COLS[c];ctx.beginPath();ctx.arc(x+28,y+38-j*12,8,0,7);ctx.fill();} });
  });
  // hint btn
  ctx.fillStyle='rgba(0,0,0,.3)'; roundRect(W/2+10,H-48,W/2-26,36,12); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='bold 14px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('💡 提示', W*3/4, H-30);
  if(wildLeft>0){ ctx.fillText('万能×'+wildLeft, 60, H-30); }
  if(FX) FX.drawBurst(ctx,sparks);
}
function frame(t){const dt=Math.min(.05,(t-last)/1000);last=t;if(state==='play')update(dt);draw();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

function openLevels(){ show('startScr',false);show('shopScr',false);show('overScr',false);show('lvlScr',true); $('nextBtn').style.display='';
  $('lvlInfo').textContent=`解锁 ${prog.unlock}/${TOTAL} · 币 ${prog.coins}`;
  const g=$('lvgrid'); g.innerHTML='';
  for(let i=1;i<=TOTAL;i++){ const b=document.createElement('button'); b.className='btn lvl'; const locked=i>prog.unlock;
    b.innerHTML=locked?'🔒':`${i%5===0?'👑':''}${i}<small>${'★'.repeat(prog.stars[i]|0)}</small>`; b.disabled=locked;
    if(!locked)b.onclick=()=>enter(i); g.appendChild(b); }
}
function enter(n){ const go=()=>startLevel(n); if(!prog.seenTut){prog.seenTut=1;saveProg(prog); tutorial([['拆螺丝','点彩色螺丝拧下，放进底部同色收集盒。'],['规则','每盒满 3 颗同色会收起；铁片上螺丝全拆光后整片掉落。'],['小心','拧错顺序盒子会堵死。锁头螺丝要先拆挡路片；💡可高亮安全螺丝。']],go);} else go(); }
function openShop(){ show('lvlScr',false);show('shopScr',true); $('coinLine').textContent='金币：'+prog.coins;
  const items=[{k:'hintLv',name:'免费提示',desc:'每关免费提示 Lv'+prog.hintLv,cost:20+prog.hintLv*15,max:3},{k:'wildLv',name:'万能盒',desc:'每关自带万能空位 '+(prog.wildLv?'有':'无'),cost:40,max:1}];
  const box=$('shopList'); box.innerHTML='';
  for(const it of items){ const row=document.createElement('div'); row.className='row'; row.innerHTML=`<div><b>${it.name}</b><br><small>${it.desc}</small></div>`;
    const btn=document.createElement('button'); btn.className='btn'; btn.textContent=prog[it.k]>=it.max?'满级':it.cost+'币';
    btn.disabled=prog[it.k]>=it.max||prog.coins<it.cost;
    btn.onclick=()=>{prog.coins-=it.cost;prog[it.k]++;saveProg(prog);beep(900,.1);openShop();}; row.appendChild(btn); box.appendChild(row); }
}
$('startBtn').onclick=openLevels; $('backStart').onclick=()=>{show('lvlScr',false);show('startScr',true);};
$('shopBtn').onclick=openShop; $('shopBack').onclick=openLevels;
$('pauseBtn').onclick=()=>{if(state==='play'){state='pause';show('pauseOv',true);}else if(state==='pause'){state='play';last=performance.now();show('pauseOv',false);}};
$('resumeBtn').onclick=()=>{state='play';last=performance.now();show('pauseOv',false);};
$('menuBtn').onclick=()=>{show('pauseOv',false);state='menu';openLevels();};
$('againBtn').onclick=()=>startLevel(lvl);
$('nextBtn').onclick=()=>{if(lvl<TOTAL)startLevel(lvl+1);else openLevels();};
$('menu2Btn').onclick=()=>{show('overScr',false);openLevels();};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play'){state='pause';show('pauseOv',true);}});

</script>
