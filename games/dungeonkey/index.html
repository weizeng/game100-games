<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>地牢钥匙</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:linear-gradient(160deg,#241a12 0%,#14100b 55%,#080605 100%);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;display:flex;justify-content:center;min-height:100vh;touch-action:manipulation;-webkit-user-select:none;user-select:none;overflow-x:hidden}
.wrap{width:100%;max-width:480px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:10px}
.topbar{width:100%;display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:9px 12px;font-size:14px}
.topbar .title{font-weight:700;font-size:16px}
.topbar .stat{color:#f3e4c8;font-size:12px}
.topbar .stat b{color:#fff;font-size:14px}
.tbtn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:#fff;font-size:17px;min-width:42px;height:42px;border-radius:11px;cursor:pointer;transition:transform .08s}
.tbtn:active{transform:scale(.9)}
.screen{width:100%;display:none;flex-direction:column;align-items:center;gap:10px}
.screen.on{display:flex}
.card{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:20px;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.card h1{font-size:26px;margin-bottom:8px;background:linear-gradient(90deg,#d7ccc8,#ffab91);-webkit-background-clip:text;background-clip:text;color:transparent}
.card h2{font-size:22px;margin-bottom:8px}
.card p{color:#f0e6d2;font-size:14px;line-height:1.9;margin-bottom:12px;text-align:left}
.card p b{color:#ffcc80}
.bigbtn{background:linear-gradient(135deg,#8d6e63,#d7ccc8);border:none;color:#2b1c12;font-size:18px;font-weight:700;padding:14px 44px;border-radius:999px;cursor:pointer;box-shadow:0 6px 18px rgba(141,110,99,.5);transition:transform .1s;min-height:48px}
.bigbtn:active{transform:scale(.93)}
.ghostbtn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#fff;font-size:14px;padding:10px 22px;border-radius:999px;cursor:pointer;min-height:44px}
.ghostbtn:active{transform:scale(.93)}
.best{color:#ffcc80;font-size:14px;margin-top:8px}
#cvwrap{width:100%;display:flex;justify-content:center}
#cv{border-radius:14px;background:rgba(255,255,255,.03);touch-action:none;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.hint{color:#e8d9bd;font-size:13px;text-align:center;line-height:1.7;min-height:44px}
.hint b{color:#ffcc80}
.chips{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;font-size:13px;color:#f0e6d2}
.chip{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:6px 8px;font-family:monospace;letter-spacing:2px}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.abtn{background:linear-gradient(135deg,#6d4c41,#a1887f);border:none;color:#fff;font-size:17px;font-weight:700;min-width:110px;min-height:52px;padding:12px 20px;border-radius:14px;cursor:pointer;box-shadow:0 4px 14px rgba(109,76,65,.5);transition:transform .08s}
.abtn:active{transform:scale(.93)}
.abtn.warn{background:linear-gradient(135deg,#5c6bc0,#9fa8da);box-shadow:0 4px 14px rgba(92,107,192,.5)}
.tbarwrap{width:100%;height:8px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden;display:none}
#tbar{height:100%;width:100%;background:linear-gradient(90deg,#ff8a65,#ffd54f);border-radius:99px;transition:width .2s linear}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:40;backdrop-filter:blur(4px)}
.ov.on{display:flex}
.pausecard{background:#241a12;border:1px solid rgba(255,204,128,.35);border-radius:18px;padding:28px 32px;text-align:center;display:flex;flex-direction:column;gap:12px;max-width:86vw;max-height:82vh;overflow:auto}
.pausecard h2{font-size:20px}
.pausecard p{font-size:14px;line-height:2;color:#f0e6d2;text-align:left}
.pausecard p b{color:#ffcc80}
#toast{position:fixed;top:38%;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.82);border:1px solid rgba(255,204,128,.4);color:#fff;font-size:16px;font-weight:700;padding:12px 26px;border-radius:999px;z-index:70;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;max-width:92vw}
.float{position:fixed;pointer-events:none;z-index:60;font-weight:800;font-size:22px;animation:floatup 1.1s ease-out forwards;text-shadow:0 2px 6px rgba(0,0,0,.6)}
@keyframes floatup{0%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-52px)}}
</style>
</head>
<body>
<div id="toast"></div>
<div class="wrap">
  <div class="topbar">
    <span class="title">🗝️ 地牢钥匙</span>
    <span class="stat">第<b id="level">1</b>/8关 · 🔑<b id="keys">3</b> · ⭐<b id="score">0</b></span>
    <span><button class="tbtn" id="sndBtn" aria-label="静音开关">🔊</button><button class="tbtn" id="pauseBtn" aria-label="暂停">⏸</button></span>
  </div>
  <div class="screen on" id="s-start">
    <div class="card">
      <h1>🗝️ 地牢钥匙</h1>
      <p>你被困在地牢深处，出口的锁需要配对钥匙！<br>
      🔄 <b>旋转</b>：点"旋转钥匙"把钥匙转动一格<br>
      🔍 <b>对齐</b>：钥匙齿形（内圈蓝齿）要与锁芯缺口（外圈紫槽）<b>完全重合</b><br>
      🔓 <b>开锁</b>：觉得对齐了就点"开锁"<br>
      ❌ 开锁失败 → 钥匙断裂，失去一把钥匙（共 <b>3</b> 把）<br>
      🕰️ 后 4 关<b>限时</b>，超时也断一把钥匙<br>
      🏆 通关 8 关逃出地牢！得分 = 过关分 + 时间奖励</p>
      <button class="bigbtn" id="startBtn">潜入地牢</button>
      <div class="best">🏅 最高分：<b id="best0">0</b></div>
    </div>
  </div>
  <div class="screen" id="s-game">
    <div class="tbarwrap" id="tbarwrap"><div id="tbar"></div></div>
    <div id="cvwrap"><canvas id="cv" width="360" height="400"></canvas></div>
    <div class="chips">
      <span class="chip" id="lockChips" title="锁芯缺口"></span>
      <span class="chip" id="keyChips" title="钥匙齿形"></span>
    </div>
    <div class="btnrow">
      <button class="abtn" id="rotBtn">🔄 旋转钥匙</button>
      <button class="abtn warn" id="unlockBtn">🔓 开锁</button>
      <button class="abtn" id="hintBtn" style="background:linear-gradient(135deg,#7b6d3f,#c0a93f)">💡 提示</button>
    </div>
    <div class="hint" id="hint">🔍 把内圈钥匙齿转到与外圈紫槽重合的位置</div>
  </div>
  <div class="screen" id="s-end">
    <div class="card">
      <h2 id="endTitle">🏰 游戏结束</h2>
      <p id="endDesc" style="text-align:center"></p>
      <div class="best">🏅 最高分：<b id="best1">0</b></div>
      <button class="bigbtn" id="againBtn">再闯一次</button>
    </div>
  </div>
</div>
<div class="ov" id="pauseov"><div class="pausecard"><h2>⏸ 中场休息</h2><button class="bigbtn" id="resumeBtn">继续</button><button class="ghostbtn" id="quitBtn">重开一局</button></div></div>
<div class="ov" id="hintov"><div class="pausecard"><h2>💡 开锁思路</h2><p id="hintBody"></p><button class="bigbtn" id="hintClose">明白了</button></div></div>
<script>
'use strict';
const $=id=>document.getElementById(id);
/* ===== 音效 ===== */
let AC=null;
let soundOn=localStorage.getItem('g100_mute')!=='1';
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return null;}}if(AC&&AC.state==='suspended'){AC.resume();}return AC;}
function tone(f,d,type,v,when){if(!soundOn)return;const a=ac();if(!a)return;try{const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.value=f;const t=a.currentTime+(when||0);g.gain.setValueAtTime(v||0.12,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.03);}catch(e){}}
function sweep(f0,f1,d,type,v){if(!soundOn)return;const a=ac();if(!a)return;try{const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';const t=a.currentTime;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+d);g.gain.setValueAtTime(v||0.1,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.03);}catch(e){}}
const sClick=()=>tone(640,0.07,'square',0.07);
const sRot=()=>{sweep(300,520,0.12,'triangle',0.1);};
const sOpen=()=>{[392,523,659,784].forEach((f,i)=>tone(f,0.14,'triangle',0.12,i*0.09));};
const sBreak=()=>{tone(180,0.25,'sawtooth',0.14);tone(120,0.3,'sawtooth',0.12,0.1);sweep(900,120,0.25,'sawtooth',0.08,0.05);};
const sWin=()=>{[523,659,784,1047,1319,1568].forEach((f,i)=>tone(f,0.16,'triangle',0.12,i*0.11));};
const sTick=()=>tone(980,0.05,'square',0.05);
/* ===== 工具 ===== */
function toast(msg){const t=$('toast');t.textContent=msg;t.style.opacity='1';clearTimeout(t._tm);t._tm=setTimeout(()=>{t.style.opacity='0';},1400);}
function floatTxt(txt,color){const d=document.createElement('div');d.className='float';d.textContent=txt;d.style.color=color||'#ffcc80';d.style.left='50%';d.style.top='26%';document.body.appendChild(d);setTimeout(()=>d.remove(),1150);}
function buzz(ms){try{if(navigator.vibrate)navigator.vibrate(ms);}catch(e){}}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));$(id).classList.add('on');}
/* ===== 常量/状态 ===== */
const HSKEY='g100_dungeonkey_hs';
const LEVELS=[{n:3,t:0},{n:3,t:0},{n:4,t:0},{n:4,t:0},{n:5,t:30},{n:5,t:25},{n:6,t:20},{n:6,t:15}];
const cv=$('cv'),ctx=cv.getContext('2d');
const CX=180,CY=190,RO=140,RI=100;
let running=false,paused=false;
let level=0,keys=3,score=0,firstTry=true;
let N=3,lock=[],keyBase=[],rot=0,target=0,angle=0;
let timeLeft=0,timeMax=0,shake=0,unlockAnim=0,parts=[];
let lastTickSec=0;
function best(){return parseInt(localStorage.getItem(HSKEY)||'0',10);}
function saveBest(){if(score>best())localStorage.setItem(HSKEY,String(score));}
function refreshBest(){$('best0').textContent=best();$('best1').textContent=best();}
function refreshHud(){$('level').textContent=Math.min(8,level+1);$('keys').textContent=keys;$('score').textContent=score;}
function rotArr(a,k){k=((k%N)+N)%N;return a.slice(k).concat(a.slice(0,k));}
function patStr(a){return a.map(v=>v?'▓':'░').join('');}
function refreshChips(){$('lockChips').textContent='锁:'+patStr(lock);$('keyChips').textContent='钥:'+patStr(rotArr(keyBase,rot));}
function setHint(t){$('hint').innerHTML=t;}
function levelHint(){
  const teeth=lock.filter(Boolean).length;
  return '💡 <b>本关思路</b>：锁芯有 <b>'+teeth+'</b> 个缺口（紫槽），钥匙也有 <b>'+teeth+'</b> 颗齿。<br>先盯住锁芯上最长的连续缺口段，再旋转钥匙、把钥匙上最长的连续齿转到那一段，剩下的位置多半自然对上；错位开锁会断钥匙，对准后再点"开锁"。<br>'+(timeMax>0?'⏳ 本关限时 <b>'+timeMax+'</b> 秒，先观察、后旋转，别在时间上犹豫。':'🐢 本关不限时，先数清楚缺口再动手。');
}
/* ===== 关卡 ===== */
function startGame(){
  running=true;paused=false;level=0;keys=3;score=0;
  $('pauseov').classList.remove('on');$('hintov').classList.remove('on');
  showScreen('s-game');refreshHud();refreshBest();
  newLevel();sClick();
}
function newLevel(){
  const cfg=LEVELS[level];N=cfg.n;
  // 生成锁芯图案：1..N-1 个缺口
  const teethN=1+Math.floor(Math.random()*(N-1));
  const idx=[];for(let i=0;i<N;i++)idx.push(i);
  for(let i=N-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const tmp=idx[i];idx[i]=idx[j];idx[j]=tmp;}
  lock=new Array(N).fill(0);
  for(let i=0;i<teethN;i++)lock[idx[i]]=1;
  // 钥匙图案 = 锁芯图案错位
  const off=1+Math.floor(Math.random()*(N-1));
  keyBase=rotArr(lock,off);
  rot=0;target=0;angle=0;firstTry=true;shake=0;unlockAnim=0;parts=[];
  timeMax=cfg.t;timeLeft=cfg.t;lastTickSec=cfg.t;
  $('tbarwrap').style.display=cfg.t>0?'block':'none';
  refreshHud();refreshChips();
  setHint('🔍 第 <b>'+(level+1)+'</b> 关：<b>'+N+'</b> 格锁芯'+(cfg.t>0?'，限时 <b>'+cfg.t+'</b> 秒':'，不限时')+'。转钥匙、点"开锁"！');
}
function curKey(){return rotArr(keyBase,rot);}
function aligned(){const k=curKey();for(let i=0;i<N;i++)if(k[i]!==lock[i])return false;return true;}
function doRotate(){
  if(!running||paused||unlockAnim>0)return;
  rot=(rot+1)%N;target=rot;
  refreshChips();sRot();
  setHint('🔄 钥匙转到第 <b>'+(rot+1)+'</b> 档'+(aligned()?'——<b>齿形与锁芯重合了！点"开锁"</b>':''));
}
function doUnlock(){
  if(!running||paused||unlockAnim>0)return;
  if(aligned()){
    unlockAnim=0.001;
    const bonus=(timeMax>0?Math.ceil(timeLeft)*5:0)+(firstTry?50:0);
    const gain=100+bonus;
    score+=gain;
    sOpen();buzz(60);floatTxt('+'+gain,'#ffcc80');
    setHint('🔓 <b>咔哒——锁开了！</b>+'+gain+(firstTry?'（一击命中+50）':'')+(timeMax>0&&timeLeft>0?'（剩余时间+'+Math.ceil(timeLeft)*5+'）':''));
    for(let i=0;i<40;i++){parts.push({x:CX+(Math.random()-0.5)*160,y:CY+(Math.random()-0.5)*160,vx:(Math.random()-0.5)*5,vy:(Math.random()-0.5)*5-2,life:1,c:['#ffcc80','#ffd54f','#fff','#ffab91','#8d6e63'][i%5],r:2+Math.random()*3});}
    refreshHud();
  }else{
    failKey('齿形没对上，钥匙<b>断裂</b>了！');
  }
}
function failKey(reason){
  keys--;firstTry=false;
  shake=0.6;sBreak();buzz(150);floatTxt('💥 钥匙断了', '#ef9a9a');
  refreshHud();
  if(keys<=0){endGame(false);return;}
  setHint('❌ '+reason+' 还剩 <b>'+keys+'</b> 把钥匙，本关重新配一把…');
  toast('钥匙断裂！还剩 '+keys+' 把');
  // 本关重来：重新错位
  setTimeout(()=>{if(!running)return;const off=1+Math.floor(Math.random()*(N-1));keyBase=rotArr(lock,off);rot=0;target=0;firstTry=true;shake=0;refreshChips();setHint('🔧 新钥匙已就位：<b>'+N+'</b> 格锁芯，转钥匙再开！');},900);
}
function endGame(win){
  running=false;paused=false;
  $('pauseov').classList.remove('on');$('hintov').classList.remove('on');
  const nb=score>best();
  saveBest();refreshBest();
  $('endTitle').textContent=win?'🏆 逃出地牢！':'🔒 钥匙用完了…';
  $('endDesc').innerHTML=win?'8 关全通！地牢大门为你敞开。<br>最终得分 <b style="color:#ffcc80;font-size:22px">'+score+'</b>'
    :'闯到第 <b>'+(level+1)+'</b> 关<br>本局得分 <b style="color:#ffcc80;font-size:22px">'+score+'</b><br>别灰心，记住缺口位置再出手！';
  showScreen('s-end');
  if(win||nb)sWin();else tone(220,0.4,'sine',0.1);
}
/* ===== 绘制 ===== */
function slotAngle(i){return -Math.PI/2+i*2*Math.PI/N;}
function draw(dt){
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.save();
  if(shake>0){ctx.translate((Math.random()-0.5)*14*shake,(Math.random()-0.5)*10*shake);}
  // 锁体
  ctx.fillStyle='rgba(141,110,99,.25)';
  ctx.beginPath();ctx.arc(CX,CY,RO+22,0,7);ctx.fill();
  ctx.strokeStyle='#8d6e63';ctx.lineWidth=4;ctx.stroke();
  ctx.font='20px serif';ctx.textAlign='center';
  ctx.fillText('🔒',CX,34);
  // 锁芯缺口（外圈）
  for(let i=0;i<N;i++){
    const a0=slotAngle(i)-Math.PI/N*0.82,a1=slotAngle(i)+Math.PI/N*0.82;
    ctx.beginPath();ctx.arc(CX,CY,RO,a0,a1);
    if(lock[i]){ctx.strokeStyle='#ce93d8';ctx.lineWidth=16;ctx.stroke();
      ctx.strokeStyle='rgba(206,147,216,.35)';ctx.lineWidth=22;ctx.stroke();}
    else{ctx.strokeStyle='#5d4037';ctx.lineWidth=16;ctx.stroke();}
  }
  // 钥匙圈（内圈，随旋转动画）
  ctx.save();ctx.translate(CX,CY);ctx.rotate(angle);
  ctx.strokeStyle='#8d6e63';ctx.lineWidth=8;
  ctx.beginPath();ctx.arc(0,0,RI-18,0,7);ctx.stroke();
  for(let i=0;i<N;i++){
    const a=slotAngle(i);
    if(keyBase[i]){
      ctx.save();ctx.rotate(a);
      ctx.fillStyle='#90caf9';
      ctx.shadowColor='#64b5f6';ctx.shadowBlur=10;
      ctx.fillRect(-9,-RI-6,18,26);
      ctx.shadowBlur=0;ctx.restore();
      ctx.fillStyle='#e3f2fd';ctx.beginPath();ctx.arc(Math.cos(a)*(RI+4),Math.sin(a)*(RI+4),5,0,7);ctx.fill();
    }else{
      ctx.fillStyle='rgba(255,255,255,.18)';
      ctx.beginPath();ctx.arc(Math.cos(a)*RI,Math.sin(a)*RI,6,0,7);ctx.fill();
    }
  }
  ctx.restore();
  // 中心
  ctx.fillStyle='#d7ccc8';ctx.beginPath();ctx.arc(CX,CY,20,0,7);ctx.fill();
  ctx.fillStyle='#4e342e';ctx.font='16px serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('🗝',CX,CY+1);ctx.textBaseline='alphabetic';
  // 钥匙圈标签
  ctx.fillStyle='#90caf9';ctx.font='13px sans-serif';
  ctx.fillText('内圈=钥匙齿（蓝）',CX,CY+RO+36);
  ctx.fillStyle='#ce93d8';
  ctx.fillText('外圈=锁芯缺口（紫）',CX,CY+RO+54);
  // 开锁动画闪光
  if(unlockAnim>0){
    const p=Math.min(1,unlockAnim);
    ctx.strokeStyle='rgba(255,213,79,'+(1-p)+')';ctx.lineWidth=6;
    ctx.beginPath();ctx.arc(CX,CY,RO+22+p*60,0,7);ctx.stroke();
  }
  ctx.restore();
  // 粒子
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.12;p.life-=dt*1.1;
    if(p.life<=0){parts.splice(i,1);continue;}
    ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();ctx.globalAlpha=1;
  }
}
/* ===== 主循环 ===== */
let lastT=0;
function loop(t){
  requestAnimationFrame(loop);
  const dt=Math.min(0.05,(t-lastT)/1000||0);lastT=t;
  if(!running||paused){if(!running)return;draw(0);return;}
  // 旋转缓动
  const targetAngle=rot*2*Math.PI/N;
  let diff=targetAngle-angle;
  while(diff>Math.PI)diff-=2*Math.PI;while(diff<-Math.PI)diff+=2*Math.PI;
  angle+=diff*Math.min(1,dt*10);
  if(shake>0)shake-=dt;
  // 限时
  if(timeMax>0&&unlockAnim<=0){
    timeLeft-=dt;
    const sec=Math.ceil(timeLeft);
    if(sec!==lastTickSec){lastTickSec=sec;if(sec<=5&&sec>0)sTick();}
    $('tbar').style.width=Math.max(0,timeLeft/timeMax*100)+'%';
    if(timeLeft<=0){failKey('时间到！');}
  }
  // 开锁过场
  if(unlockAnim>0){
    unlockAnim+=dt;
    if(unlockAnim>=0.9){
      unlockAnim=0;level++;
      if(level>=8){endGame(true);return;}
      newLevel();
    }
  }
  draw(dt);
}
requestAnimationFrame(loop);
/* ===== 输入 ===== */
$('rotBtn').addEventListener('click',doRotate);
$('unlockBtn').addEventListener('click',doUnlock);
$('hintBtn').addEventListener('click',()=>{$('hintBody').innerHTML=levelHint();$('hintov').classList.add('on');sClick();});
$('hintClose').addEventListener('click',()=>{$('hintov').classList.remove('on');sClick();});
/* ===== 暂停/静音 ===== */
$('pauseBtn').addEventListener('click',()=>{if(!running||paused)return;paused=true;$('pauseov').classList.add('on');sClick();});
$('resumeBtn').addEventListener('click',()=>{paused=false;$('pauseov').classList.remove('on');sClick();});
$('quitBtn').addEventListener('click',()=>{sClick();running=false;paused=false;$('pauseov').classList.remove('on');showScreen('s-start');refreshBest();});
function refreshSnd(){$('sndBtn').textContent=soundOn?'🔊':'🔇';}
$('sndBtn').addEventListener('click',()=>{soundOn=!soundOn;localStorage.setItem('g100_mute',soundOn?'0':'1');refreshSnd();if(soundOn)sClick();});
$('startBtn').addEventListener('click',startGame);
$('againBtn').addEventListener('click',startGame);
refreshSnd();refreshBest();
</script>
</body>
</html>
