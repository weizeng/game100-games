<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{display:flex;justify-content:center;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.wrap{width:100%;max-width:480px;height:100%;padding:12px;display:flex;flex-direction:column;align-items:center;gap:10px}
.topbar{width:100%;display:flex;justify-content:space-between;align-items:center;flex-wrap:nowrap!important}
.topbar .stat{display:flex;gap:8px;align-items:center;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:13px}
.topbar .tools{display:flex;gap:6px}
.topbar .tools .iconbtn{min-width:44px;min-height:44px;padding:0 6px}
.stagebox{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
#cv{touch-action:none;display:block}
.overlay{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;z-index:20;padding:24px;text-align:center}
.overlay.hidden{display:none!important}
.lvgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:100%}
.lvgrid .lvl{min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:17px;padding:4px!important;line-height:1.1}
.lvgrid .lvl small{font-size:10px;letter-spacing:-1px;margin-top:2px}
.rowbtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:100%}
#tutStep{font-size:12px;opacity:.7}
#toast{position:fixed;left:50%;top:16%;transform:translate(-50%,-10px);background:rgba(10,8,30,.88);color:#fff;font-weight:800;padding:10px 18px;border-radius:999px;z-index:999;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;font-size:15px;box-shadow:0 0 18px rgba(255,61,154,.5);white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
.hidden{display:none!important}

.pad{width:100%;display:grid;grid-template-columns:1fr 1fr 1.1fr 1.3fr;gap:6px}.pad button{min-height:56px;font-size:22px!important;padding:0!important;touch-action:none}
</style>
<!-- GAME UI BEGIN -->
<style>
:root{--page:#172638;--surface:#22374c;--soft:#2e4760;--ink:#f0f6fc;--muted:#b1c6d9;--accent:#f0bc74;--on-accent:#342717;--line:#45637c;--stage:#142438;--page:#0b0620;--surface:#211040;--soft:#33234f;--ink:#fff3fb;--muted:#d4b6dd;--accent:#ff3d9a;--on-accent:#0b0620;--line:#ff3d9a;--b-bg1:#3a0d5e;--b-bg2:#0b0620;--b-btn:#ff3d9a;--b-btn-hi:#ff81bd;--b-edge:#a3124f;--b-glow:#00e5ff;--b-glow-rgb:0,229,255;--b-pedge-rgb:255,61,154;--b-btn-ink:#510927;--b-btn-tsh:0 1px 0 rgba(255,255,255,.45);--b-coin-ink:#510927;--b-coin-tsh:none;--b-key-ink:#00e5ff;--b-title:#ffffff}
/* Shared presentation only; mechanics and state remain inside each standalone game. */

.game-ui body>.wrap{padding:20px 16px max(20px,env(safe-area-inset-bottom));gap:14px;max-width:500px}
.game-ui #app{background:var(--page);color:var(--ink)}
.game-ui :is(.topbar,#topbar){gap:8px;flex-wrap:wrap;min-height:58px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:10px 12px;box-shadow:0 3px 0 var(--soft);font-size:13px}
.game-ui :is(.title,.tb-title,.tb-title,#topbar .t,.topbar .t){color:var(--ink);font-size:16px;font-weight:750;letter-spacing:0}

.game-ui :is(.stat,.topbar .s,.topbar .stat,.scorebar,.stats,.tip,.hint,.hintline,.hsline,.best,.hiscore){color:var(--muted);line-height:1.7}
.game-ui :is(.hint,.hintline,.tip){font-size:12px;max-width:40em;text-wrap:pretty}
.game-ui .scorebar{padding:6px 10px;gap:8px;flex-wrap:wrap}
.game-ui :is(.iconbtn,.iconBtn,.icobtn,.ibtn,.tbtn,.hbtn,.ib,.iconBtn,.pause){min-width:44px;min-height:44px;flex-shrink:0;border-radius:12px;background:var(--soft);color:var(--ink);border:1px solid var(--line);box-shadow:none;font-size:17px}
.game-ui button{font-family:inherit;cursor:pointer;touch-action:manipulation}
.game-ui button:focus-visible,.game-ui [tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.game-ui :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn){background:var(--accent);color:var(--on-accent);border:1px solid transparent;border-radius:13px;min-height:50px;padding:13px 28px;font-size:16px;font-weight:750;letter-spacing:0;box-shadow:0 4px 0 var(--line);text-shadow:none;max-width:100%}

.game-ui :is(.ghost,.ghostbtn,.btn2,.abtn,.toolbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line);box-shadow:none;border-radius:12px;min-height:44px}
.game-ui :is(.rowbtns,.btnrow,.ctlrow){gap:10px;flex-wrap:wrap;justify-content:center}
.game-ui :is(.pill,.hudbox,.hud .p){background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:none;font-variant-numeric:tabular-nums}
.game-ui :is(.dbtn,.cbtn,.gbtn,.holdbtn,.firebtn,.bombbtn,.jumpbtn,.pumpbtn,.nbtn){border-radius:12px;box-shadow:0 3px 0 var(--line);min-height:44px}
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv,.screen):has(>.ui-panel){padding:20px;overflow-y:auto;overscroll-behavior:contain}
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv):has(>.ui-panel){background:var(--page);backdrop-filter:none;justify-content:safe center;align-items:center}
.game-ui .ui-panel{width:min(100%,380px);max-height:100%;overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:18px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:24px;padding:30px 24px;box-shadow:0 8px 0 var(--soft),0 20px 48px #15253618;text-align:center;margin:auto}
.game-ui .ui-panel :is(.card,.panel,.pausecard,.ovcard){display:contents}
.game-ui .ui-panel :is(h1,h2,.gamename,.gametitle){font-size:30px;line-height:1.25;font-weight:800;color:var(--ink);background:none;-webkit-text-fill-color:currentColor;text-shadow:none;letter-spacing:-.6px;margin:0}

.game-ui .ui-emblem{width:90px;height:90px;display:grid;place-items:center;border:1px solid var(--line);border-radius:28px;background:var(--soft);font-size:48px;line-height:1;flex-shrink:0;position:relative}
.game-ui[data-theme="wood"] .ui-emblem{border-radius:50%;box-shadow:inset 0 0 0 5px var(--surface),inset 0 0 0 6px var(--line)}

.game-ui .ui-mode-status{display:block;padding:5px 10px;color:var(--accent);font-size:11px;font-weight:700;line-height:1.5;text-align:center;border:1px solid var(--line);border-radius:8px;background:var(--surface);margin:4px auto;max-width:100%;pointer-events:none}
.game-ui body>.wrap>canvas:not(#fx){background-color:var(--stage);box-shadow:0 0 0 1px var(--line),0 6px 0 var(--soft);border-radius:18px;flex-shrink:0}
.game-ui .screen>canvas.game{box-shadow:0 0 0 1px var(--line),0 6px 0 var(--soft)}
.game-ui #hud{gap:6px;background:var(--surface);color:var(--ink)}
.game-ui #hud :is(.left,.t,.s,.grp,.pill){color:var(--ink)}
.game-ui #hud .pill{background:var(--surface);border-color:var(--line)}
.game-ui body canvas:is(#cv,#game,#board){background-color:var(--stage)}
.game-ui :is(button.dbtn,button.cbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.game-ui :is(button.lvl,button.lvlbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line);border-radius:12px;min-height:54px}
.game-ui :is(button.lvl,button.lvlbtn) :is(.nc,.sz,small){color:var(--muted)}
.game-ui .ui-panel button.lvl{margin:0;min-width:44px;box-shadow:none;padding:8px}
.game-ui #hud :is(.left,.right,.hudl,.hbtns){gap:5px;flex-wrap:wrap}
.game-ui #hud :is(.left,.hudl){min-width:0;flex-shrink:1}
.game-ui #hud :is(.pill,.left){font-size:12px}
.game-ui button:disabled{cursor:default;opacity:.45;box-shadow:none}
.game-ui .ui-panel .ui-assist-note{color:var(--accent);font-weight:700}
@media(min-width:700px){.game-ui body>.wrap{padding-top:32px}.game-ui .ui-panel{padding:36px 30px}}
@media(max-width:360px){.game-ui body>.wrap{padding:10px;gap:10px}.game-ui .ui-panel{padding:22px 18px;gap:13px}.game-ui .ui-panel h1{font-size:26px}.game-ui .ui-emblem{width:70px;height:70px;font-size:38px}.game-ui :is(.topbar,#topbar){gap:5px;padding:8px}.game-ui :is(.iconbtn,.icobtn,.ibtn,.tbtn,.ib){min-width:44px;min-height:44px}}
@media(max-height:650px){.game-ui .ui-panel{padding:18px;gap:12px}.game-ui .ui-emblem{width:60px;height:60px;font-size:32px}.game-ui .ui-panel h1{font-size:25px}.game-ui .ui-panel :is(p,.howto,.sub,.rule){font-size:13px}}

/* 2026-10-20 热修：开局/结算遮罩铺满整屏，主按钮固定在面板底部，避免被画布尺寸裁切（#10） */
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv):has(>.ui-panel){position:fixed;inset:0;z-index:1000;border-radius:0;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}

.game-ui .ui-panel :is(#startBtn,#btnStart,.startbtn,#bStart,#restartBtn,#btnRestart,#againBtn,#btnAgain,#retryBtn,#btnRetry,#playBtn,#btnPlay){position:sticky;bottom:0;z-index:3;flex-shrink:0}
.game-ui .ui-panel :not(.card,.panel,.pausecard,.ovcard,.ui-mode):has(>:is(#startBtn,#btnStart,.startbtn,#bStart,#restartBtn,#btnRestart,#againBtn,#btnAgain,#retryBtn,#btnRetry,#playBtn,#btnPlay)){position:sticky;bottom:0;z-index:3;flex-shrink:0;background:var(--surface);box-shadow:0 -10px 10px -6px var(--surface)}

 let gy=11,x=0;const ground=(x0,x1,g)=>{for(let xx=x0;xx<x1&&xx<mw;xx++)for(let y=g;y<MH;y++)map[y][xx]='#';};
 if(LV[i].boss){ground(0,mw,11);for(let y=0;y<MH;y++){map[y][0]='#';map[y][mw-1]='#';}for(let y=2;y<11;y++){map[y][22]='.';}

 if(!keys.j&&P.vy<-250&&!P.spr)P.vy=-250;if(P.vy>=0)P.spr=0; // 短按小跳

 const cx=Math.floor((P.x+P.w/2)/T),fy=Math.floor((P.y+P.h-2)/T);if(tile(cx,fy)==='^'&&P.y+P.h>fy*T+12)hurt();
 // 实体
 for(const e of ents){if(e.dead)continue;if((e.k==='walker'||e.k==='spiky'||e.k==='flyer')&&!e.on){if(e.x<camX+W+40)e.on=1;else continue;}
  if(e.k==='walker'||e.k==='spiky'){const b={x:e.x,y:e.y,w:24,h:22,vx:e.vx,vy:e.vy||0};b.vy=Math.min(900,b.vy+GR*dt);if(moveX(b,e.vx*dt))e.vx*=-1;moveY(b,b.vy*dt);
    const ax=Math.floor((b.x+(e.vx>0?b.w+2:-2))/T),ay=Math.floor((b.y+b.h+4)/T);if(b.on&&!solid(tile(ax,ay)))e.vx*=-1;e.x=b.x;e.y=b.y;e.vy=b.vy;if(e.y>MH*T)e.dead=1;
    if(ov(P,b)){if(e.k==='walker'&&P.vy>0&&P.y+P.h-b.y<14){e.dead=1;P.vy=-420;coinsGot+=0;tone(300,.1,'square',.05,120);float(e.x,e.y,'踩扁！','#fff');if(FX)FX.burst(sparks,e.x+12,e.y+10,'#ff4d8d',10);}else if(P.dashT>0&&e.k==='walker'){e.dead=1;}else hurt();}}
  else if(e.k==='flyer'){e.ph+=dt*2;e.x+=Math.cos(e.ph*.5)*30*dt;e.y=e.y0+Math.sin(e.ph)*40;const b={x:e.x-12,y:e.y-10,w:24,h:20};if(ov(P,b)){if(P.vy>0&&P.y+P.h-b.y<14){e.dead=1;P.vy=-420;tone(300,.1,'square',.05,120);}else hurt();}}
  else if(e.k==='coin'){if(Math.abs(P.x+10-e.x)<16&&Math.abs(P.y+13-e.y)<20){e.dead=1;coinsGot++;tone(988,.05,'square',.03);tone(1319,.1,'square',.03,0,.05);hud();}}
  else if(e.k==='spring'){if(Math.abs(P.x+10-e.x)<18&&P.y+P.h>=e.y-6&&P.y+P.h<=e.y+4&&P.vy>=0){P.vy=-JV*1.45;P.jumps=1;P.spr=1;tone(400,.2,'sine',.05,1200);e.sq=.2;}}
  else if(e.k==='check'){if(!e.got&&Math.abs(P.x-e.x)<20){e.got=1;cp={x:e.x,y:e.y-10};tone(660,.1,'triangle');tone(880,.15,'triangle',.08,0,.1);toast('🚩 存档点');}}
  else if(e.k==='flag'){if(P.x+P.w>e.x){end(true);return;}}
  else if(e.k==='fire'){e.x+=e.vx*dt;e.y+=e.vy*dt;e.vy+=600*dt;if(e.y>MH*T)e.dead=1;if(Math.abs(P.x+10-e.x)<14&&Math.abs(P.y+13-e.y)<16){e.dead=1;hurt();}}
  else if(e.k==='wave'){e.x+=e.vx*dt;e.life-=dt;if(e.life<=0)e.dead=1;if(P.on&&Math.abs(P.x+10-e.x)<14&&P.y+P.h>=e.y-4){e.dead=1;hurt();}}}
 if(boss)bossTick(dt);
 ents=ents.filter(e=>!e.dead||e.k==='check');
 camX=clamp(P.x-W*.38,0,Math.max(0,mw*T-W));
 for(const f of floats){f.y-=30*dt;f.l-=dt;}floats=floats.filter(f=>f.l>0);if(Math.floor(t*4)!==Math.floor((t-dt)*4))hud();}
const ov=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function bossTick(dt){const b=boss;if(b.dead)return;b.tm-=dt;if(b.inv>0)b.inv-=dt;const ph2=b.hp<=b.max/2;
 if(b.st==='walk'){b.vx=Math.sign(P.x-b.x)*(45+li*2);if(b.tm<=0){b.st=Math.random()<.5?'charge':'jump';b.tm=b.st==='charge'?.9:0;if(b.st==='jump'){b.vy=-700;b.ground=false;}b.cdir=Math.sign(P.x-b.x)||1;}}
 else if(b.st==='charge'){if(b.tm>0){b.vx=0;}else b.vx=b.cdir*(250+li*3);}
 else if(b.st==='dizzy'){b.vx=0;if(b.tm<=0){b.st='walk';b.tm=ph2?1.4:2.2;}}
 b.vy=Math.min(900,(b.vy||0)+GR*dt);const box={x:b.x,y:b.y,w:b.w,h:b.h,vx:b.vx,vy:b.vy};const hitW=moveX(box,b.vx*dt);moveY(box,b.vy*dt);b.x=box.x;b.y=box.y;b.vy=box.vy;
 if(b.st==='charge'&&hitW){b.st='dizzy';b.tm=2.2;noise(.3,.15,300);if(FX)FX.burst(sparks,b.x+b.w/2,b.y,'#ffe066',14);}
 if(b.st==='jump'&&box.on){b.st='walk';b.tm=ph2?1.2:2;for(const s of [-1,1])ents.push({k:'wave',x:b.x+b.w/2,y:b.y+b.h,vx:s*220,life:1.6});noise(.25,.12,200);if(b.fire)for(let k=0;k<3;k++)ents.push({k:'fire',x:b.x+b.w/2,y:b.y,vx:(k-1)*120,vy:-400});}
 if(ov(P,b)&&P.vy>0&&P.y+P.h-b.y<20&&b.st!=='dizzy'){P.vy=-460;P.y=b.y-P.h-1;tone(400,.06,'square',.03);}
 else if(ov(P,b)&&b.inv<=0){if(P.vy>0&&P.y+P.h-b.y<20&&b.st==='dizzy'){b.hp--;b.inv=.8;P.vy=-520;b.st='walk';b.tm=1;tone(200,.2,'square',.07,80);if(FX)FX.burst(sparks,b.x+b.w/2,b.y,'#ff4d8d',18);float(b.x,b.y-10,'💥 -1','#fff');if(b.hp<=0){b.dead=1;setTimeout(()=>end(true),FAST?0:600);if(FAST)end(true);}}
  else if(b.st!=='dizzy')hurt();}}
function end(ok){if(state!=='play')return;state='over';const tl=Math.ceil(time);let st=0;const cr=coinsTotal?coinsGot/coinsTotal:1;
 if(ok){st=1+(deaths===0?1:0)+(cr>=.6||L.boss?1:0);if(st>(save.stars[li]||0))save.stars[li]=st;tone(523,.12,'triangle');tone(659,.12,'triangle',.1,0,.12);tone(784,.3,'triangle',.1,0,.24);}else tone(220,.5,'sawtooth',.08,70);
 save.coins+=coinsGot;const sc=coinsGot*10+(ok?tl*5:0);save.best[li]=Math.max(save.best[li]||0,sc);legacyBest(save.best.reduce((a,b)=>a+(b||0),0));Store.set('save',save);
 const unlock=ok&&li===4&&st?'🎉 解锁二段跳！':ok&&li===9?'🎉 解锁冲刺 💨！':'';
 const go=()=>{$('overH').textContent=ok?(L.boss?'👾 击败霓虹巨像！':'🏁 第 '+(li+1)+' 关通过'):(time<=0?'⌛ 时间到':'💀 生命耗尽');$('finalScore').textContent=ok?starStr(st):'第 '+(li+1)+' 关';
  $('overText').textContent=(ok?'金币 '+coinsGot+'/'+coinsTotal+' · 死亡 '+deaths+' 次（无伤 + 60% 金币三星）':'提示：短按跳得低，长按跳得高')+(unlock?' · '+unlock:'');$('nextBtn').classList.toggle('hidden',!ok||li>=LV.length-1);show('overScr',true);};FAST?go():setTimeout(go,700);}
// ---------- 输入 ----------
function hold(id,k,fn){const e=$(id);e.addEventListener('pointerdown',ev=>{ev.preventDefault();audio();keys[k]=1;if(fn)fn();});for(const n of ['pointerup','pointerleave','pointercancel'])e.addEventListener(n,()=>keys[k]=0);}
hold('bL','l');hold('bR','r');hold('bJ','j',jump);hold('bD','d');
addEventListener('keydown',e=>{if(e.repeat)return;if(e.key==='ArrowLeft'||e.key==='a')keys.l=1;if(e.key==='ArrowRight'||e.key==='d')keys.r=1;if(e.key==='ArrowUp'||e.key===' '||e.key==='w'){keys.j=1;jump();}if(e.key==='Shift')keys.d=1;});
addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.l=0;if(e.key==='ArrowRight'||e.key==='d')keys.r=0;if(e.key==='ArrowUp'||e.key===' '||e.key==='w')keys.j=0;});
// ---------- 绘制 ----------
function draw(){const th=THEME[L?L.th:0];if(FX)FX.stage(ctx,W,H,th[0],th[1]);else{ctx.fillStyle=th[1];ctx.fillRect(0,0,W,H);}
 if(!L){txt(ctx,'🏃',W/2,H/2,80);return;}
 // 远景
 ctx.fillStyle='rgba(255,255,255,.12)';for(let k=0;k<8;k++){const bx=((k*140-camX*.3)%(W+140)+W+140)%(W+140)-70;ctx.fillRect(bx,170-(k%3)*40,60,260);}
 ctx.save();ctx.translate(-Math.round(camX),0);const x0=Math.floor(camX/T),x1=x0+Math.ceil(W/T)+1;
 for(let y=0;y<MH;y++)for(let x=x0;x<=x1;x++){const c=tile(x,y);if(c==='.'||x>=mw)continue;const px=x*T,py=y*T;
  if(c==='#'){const top=y===0||tile(x,y-1)!=='#';if(FX)FX.tile(ctx,px,py,T,T,top?th[3]:th[2],top?6:3);else{ctx.fillStyle=th[2];ctx.fillRect(px,py,T,T);}}
  else if(c==='?'){if(FX)FX.tile(ctx,px,py,T,T,'#ffc531',6);txt(ctx,'?',px+15,py+16,18,'#7a4a00');}else if(c==='X'){if(FX)FX.tile(ctx,px,py,T,T,'#9a8a7a',6);}
  else if(c==='B'){if(FX)FX.tile(ctx,px,py,T,T,'#c0703a',4);ctx.strokeStyle='rgba(0,0,0,.25)';ctx.strokeRect(px+2,py+T/2,T-4,0);}
  else if(c==='^'){ctx.fillStyle='#e8ecff';for(let k=0;k<3;k++){ctx.beginPath();ctx.moveTo(px+k*10,py+T);ctx.lineTo(px+k*10+5,py+8);ctx.lineTo(px+k*10+10,py+T);ctx.fill();}}}
 for(const p of plats){if(FX)FX.tile(ctx,p.x,p.y,p.w,14,'#2ee6a0',7);else{ctx.fillStyle='#2ee6a0';ctx.fillRect(p.x,p.y,p.w,14);}}
 for(const e of ents){if(e.x<camX-40||e.x>camX+W+40)continue;
  if(e.k==='coin'){if(FX)FX.orb(ctx,e.x,e.y,8,'#ffc531');else{ctx.fillStyle='#ffc531';ctx.beginPath();ctx.arc(e.x,e.y,8,0,7);ctx.fill();}}
  else if(e.k==='walker'){if(FX)FX.shadow(ctx,e.x+12,e.y+23,12,3);txt(ctx,'👾',e.x+12,e.y+11,24);}
  else if(e.k==='spiky'){txt(ctx,'🦔',e.x+12,e.y+11,24);}
  else if(e.k==='flyer'){txt(ctx,'🦇',e.x,e.y,24);}
  else if(e.k==='spring'){if(FX)FX.tile(ctx,e.x-14,e.y-12,28,12,'#ff4d8d',4);txt(ctx,'⇧',e.x,e.y-6,12,'#fff');}
  else if(e.k==='check'){ctx.fillStyle='#fff';ctx.fillRect(e.x,e.y-60,3,60);ctx.fillStyle=e.got?'#2ee6a0':'#aaa';ctx.beginPath();ctx.moveTo(e.x+3,e.y-60);ctx.lineTo(e.x+28,e.y-50);ctx.lineTo(e.x+3,e.y-40);ctx.fill();}
  else if(e.k==='flag'){ctx.fillStyle='#fff';ctx.fillRect(e.x,e.y-120,4,120);txt(ctx,'🏁',e.x+18,e.y-108,28);}
  else if(e.k==='fire'){if(FX)FX.orb(ctx,e.x,e.y,8,'#ff6b3d');}
  else if(e.k==='wave'){ctx.fillStyle='rgba(255,224,102,.85)';ctx.beginPath();ctx.moveTo(e.x-12,e.y);ctx.quadraticCurveTo(e.x,e.y-26,e.x+12,e.y);ctx.fill();}}
 if(boss&&!boss.dead){const b=boss;if(FX)FX.shadow(ctx,b.x+b.w/2,b.y+b.h,30,6);ctx.globalAlpha=b.inv>0&&Math.sin(t*40)>0?.5:1;if(FX)FX.tile(ctx,b.x,b.y,b.w,b.h,b.st==='charge'?'#ff4d6e':b.st==='dizzy'?'#9aa':'#7c4dff',14);txt(ctx,b.st==='dizzy'?'😵':'😠',b.x+b.w/2,b.y+24,30);if(b.st==='charge'&&b.tm>0)otxt(ctx,'❗',b.x+b.w/2,b.y-14,18,'#fff');ctx.globalAlpha=1;}
 // 玩家
 ctx.globalAlpha=P.inv>0&&Math.sin(t*30)>0?.4:1;if(FX)FX.shadow(ctx,P.x+10,P.y+P.h+1,10,3);if(P.dashT>0&&FX)FX.glow(ctx,'#4fc3f7',20);if(FX)FX.tile(ctx,P.x,P.y+6,P.w,P.h-6,'#ff4d8d',7);else{ctx.fillStyle='#ff4d8d';ctx.fillRect(P.x,P.y,P.w,P.h);}if(FX)FX.noGlow(ctx);
 ctx.save();ctx.translate(P.x+10,P.y+6);ctx.scale(P.face,1);txt(ctx,'🏃',0,2,26);ctx.restore();ctx.globalAlpha=1;
 if(FX)FX.drawBurst(ctx,sparks);for(const f of floats){ctx.globalAlpha=clamp(f.l,0,1);otxt(ctx,f.s,f.x,f.y,13,f.c);}ctx.globalAlpha=1;ctx.restore();
 if(boss&&!boss.dead){ctx.fillStyle='rgba(0,0,0,.35)';rr(ctx,60,10,W-120,14,7);ctx.fill();ctx.fillStyle='#ff4d6e';rr(ctx,60,10,(W-120)*boss.hp/boss.max,14,7);ctx.fill();txt(ctx,'霓虹巨像',W/2,17,10,'#fff');}
 else{const fl=ents.find(e=>e.k==='flag');if(fl){ctx.fillStyle='rgba(0,0,0,.3)';rr(ctx,60,10,W-120,8,4);ctx.fill();ctx.fillStyle='#ffe066';rr(ctx,60,10,(W-120)*clamp(P.x/fl.x,0,1),8,4);ctx.fill();}}
 if(li===0&&t<5&&state==='play')otxt(ctx,'▶ 前进，⤒ 跳跃（长按跳更高）',W/2,44,14,'#fff');}
