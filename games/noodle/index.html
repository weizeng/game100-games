<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>拉面王</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#0d0b1a;color:#f5efe6;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;user-select:none;-webkit-user-select:none}
#wrap{max-width:480px;height:100%;margin:0 auto;display:flex;flex-direction:column;position:relative;background:radial-gradient(120% 90% at 50% 0%,#241a10 0%,#0d0b1a 70%)}
#hud{display:flex;align-items:center;gap:6px;padding:10px 12px;font-size:14px;z-index:5}
#hud .pill{background:#2b2117;border:1px solid #6b5233;border-radius:999px;padding:6px 10px;white-space:nowrap}
#hud .grow{flex:1}
.btn{min-width:44px;min-height:44px;border-radius:12px;border:1px solid #6b5233;background:#332916;color:#f5efe6;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.btn:active{transform:scale(.94)}
#tWrap{padding:2px 16px 8px;z-index:5}
#tbar{position:relative;height:26px;background:#1c1535;border:1px solid #6b5233;border-radius:999px;overflow:hidden}
#tfill{position:absolute;top:0;bottom:0;left:0;width:0;background:linear-gradient(90deg,#ffd166,#ff9f1c)}
#tline{position:absolute;top:-2px;bottom:-2px;width:4px;background:#ff3b30;border-radius:2px;box-shadow:0 0 10px #ff3b30}
#tLabel{display:flex;justify-content:space-between;font-size:12px;color:#c9a86a;padding:4px 4px 0}
#stage{position:relative;flex:1;touch-action:none;overflow:hidden;cursor:pointer}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#roundTag{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:rgba(30,22,12,.8);border:1px solid #e8a13c;border-radius:999px;padding:8px 16px;font-size:16px;z-index:3;pointer-events:none;white-space:nowrap}
#tip{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);font-size:14px;color:#ffd9a0;background:rgba(30,22,12,.65);padding:6px 14px;border-radius:999px;z-index:3;pointer-events:none;white-space:nowrap}
#float{position:absolute;inset:0;pointer-events:none;z-index:4;overflow:hidden}
.flo{position:absolute;font-weight:700;font-size:22px;animation:rise 1.1s ease-out forwards;text-shadow:0 2px 8px rgba(0,0,0,.7);white-space:nowrap}
.flo.good{color:#ffd166}.flo.best{color:#7dff9a}.flo.bad{color:#ff6b6b}
@keyframes rise{0%{opacity:0;transform:translateY(10px) scale(.7)}20%{opacity:1;transform:translateY(0) scale(1.15)}100%{opacity:0;transform:translateY(-70px) scale(1)}}
#ov{position:absolute;inset:0;background:rgba(10,7,24,.92);display:flex;align-items:center;justify-content:center;z-index:20;padding:24px}
#ov.hidden{display:none}
.card{background:#241b10;border:1px solid #6b5233;border-radius:20px;padding:28px 24px;max-width:380px;width:100%;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.card h1{font-size:32px;margin-bottom:8px}
.card h2{font-size:24px;margin-bottom:12px}
.card p{font-size:15px;line-height:1.8;color:#e8cf9f;margin-bottom:8px}
.card .big{font-size:44px;font-weight:800;color:#ffd166;margin:10px 0}
.card .row{display:flex;gap:10px;justify-content:center;margin-top:16px}
.bigbtn{min-width:120px;min-height:52px;border-radius:14px;border:none;background:linear-gradient(180deg,#f0b429,#c77f1a);color:#3a2408;font-size:18px;font-weight:700;cursor:pointer}
.bigbtn:active{transform:scale(.95)}
.ghostbtn{min-width:120px;min-height:52px;border-radius:14px;border:1px solid #e8a13c;background:transparent;color:#e8cf9f;font-size:16px;cursor:pointer}
</style>
<!-- GAME UI BEGIN -->
<style>
:root{--page:#f2dfd5;--surface:#fff6ed;--soft:#e9caba;--ink:#542f29;--muted:#8b5d50;--accent:#a64a32;--on-accent:#ffffff;--line:#cfa693;--stage:#452b26}
/* Shared presentation only; mechanics and state remain inside each standalone game. */
html.game-ui{background:var(--page);color:var(--ink);color-scheme:light;font-family:"Bahnschrift","Microsoft YaHei UI","PingFang SC",sans-serif}
html.game-ui[data-theme="space"],html.game-ui[data-theme="arcade"]{color-scheme:dark}
.game-ui body{background:var(--page);color:var(--ink);font-family:inherit;overscroll-behavior:none}
.game-ui body>.wrap{padding:20px 16px max(20px,env(safe-area-inset-bottom));gap:14px;max-width:500px}
.game-ui #app{background:var(--page);color:var(--ink)}
.game-ui :is(.topbar,#topbar){gap:8px;flex-wrap:wrap;min-height:58px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:10px 12px;box-shadow:0 3px 0 var(--soft);font-size:13px}
.game-ui :is(.title,.tb-title,.tb-title,#topbar .t,.topbar .t){color:var(--ink);font-size:16px;font-weight:750;letter-spacing:0}
.game-ui :is(.topbar,.hud,#hud,#topbar) :is(b,.v){color:var(--accent);font-variant-numeric:tabular-nums}
.game-ui :is(.stat,.topbar .s,.topbar .stat,.scorebar,.stats,.tip,.hint,.hintline,.hsline,.best,.hiscore){color:var(--muted);line-height:1.7}
.game-ui :is(.hint,.hintline,.tip){font-size:12px;max-width:40em;text-wrap:pretty}
.game-ui .scorebar{padding:6px 10px;gap:8px;flex-wrap:wrap}
.game-ui :is(.iconbtn,.iconBtn,.icobtn,.ibtn,.tbtn,.hbtn,.ib,.iconBtn,.pause){min-width:44px;min-height:44px;flex-shrink:0;border-radius:12px;background:var(--soft);color:var(--ink);border:1px solid var(--line);box-shadow:none;font-size:17px}
.game-ui button{font-family:inherit;cursor:pointer;touch-action:manipulation}
.game-ui button:focus-visible,.game-ui [tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.game-ui :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn){background:var(--accent);color:var(--on-accent);border:1px solid transparent;border-radius:13px;min-height:50px;padding:13px 28px;font-size:16px;font-weight:750;letter-spacing:0;box-shadow:0 4px 0 var(--line);text-shadow:none;max-width:100%}
.game-ui :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn):active{box-shadow:none;transform:translateY(2px)}
.game-ui :is(.ghost,.ghostbtn,.btn2,.abtn,.toolbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line);box-shadow:none;border-radius:12px;min-height:44px}
.game-ui :is(.rowbtns,.btnrow,.ctlrow){gap:10px;flex-wrap:wrap;justify-content:center}
.game-ui :is(.pill,.hudbox,.hud .p){background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:none;font-variant-numeric:tabular-nums}
.game-ui :is(.dbtn,.cbtn,.gbtn,.holdbtn,.firebtn,.bombbtn,.jumpbtn,.pumpbtn,.nbtn){border-radius:12px;box-shadow:0 3px 0 var(--line);min-height:44px}
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv,.screen):has(>.ui-panel){padding:20px;overflow-y:auto;overscroll-behavior:contain}
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv):has(>.ui-panel){background:var(--page);backdrop-filter:none;justify-content:safe center;align-items:center}
.game-ui .ui-panel{width:min(100%,380px);max-height:100%;overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:18px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:24px;padding:30px 24px;box-shadow:0 8px 0 var(--soft),0 20px 48px #15253618;text-align:center;margin:auto}
.game-ui .ui-panel :is(.card,.panel,.pausecard,.ovcard){display:contents}
.game-ui .ui-panel :is(h1,h2,.gamename,.gametitle){font-size:30px;line-height:1.25;font-weight:800;color:var(--ink);background:none;-webkit-text-fill-color:currentColor;text-shadow:none;letter-spacing:-.6px;margin:0}
.game-ui .ui-panel :is(p,.howto,.sub,.rule){font-size:14px;line-height:1.85;color:var(--muted);background:none;border:0;box-shadow:none;padding:0;margin:0;max-width:32em;text-align:left;white-space:normal}
.game-ui .ui-panel :is(.bigemoji,.bigemoji,.ic,.big):not(.bigscore){animation:none;filter:none;text-shadow:none}
.game-ui .ui-emblem{width:90px;height:90px;display:grid;place-items:center;border:1px solid var(--line);border-radius:28px;background:var(--soft);font-size:48px;line-height:1;flex-shrink:0;position:relative}
.game-ui[data-theme="wood"] .ui-emblem{border-radius:50%;box-shadow:inset 0 0 0 5px var(--surface),inset 0 0 0 6px var(--line)}
.game-ui[data-theme="wood"] .ui-panel h1{font-family:"STKaiti","KaiTi","Microsoft YaHei",serif;letter-spacing:2px}
.game-ui[data-theme="ice"] .ui-emblem{border-radius:26px 8px 26px 8px}
.game-ui[data-theme="space"] .ui-emblem{background:radial-gradient(circle at center,var(--soft) 42%,transparent 43%),var(--surface);border-radius:50%;outline:1px solid var(--line);outline-offset:7px;margin:7px}
.game-ui[data-theme="kitchen"] .ui-emblem{border-radius:22px;border-bottom:5px solid var(--line)}
.game-ui .ui-panel :is(.score,.bigscore,.bigScore,.scorebig){color:var(--accent);font-size:48px;font-weight:800;font-variant-numeric:tabular-nums}
.game-ui .ui-panel :is(.best,.hsline,.hiscore,.endstats,.endstats b){color:var(--muted);font-size:13px;line-height:1.8}
.game-ui .ui-mode{display:grid;grid-template-columns:1fr 1fr;gap:5px;background:var(--soft);padding:5px;border:1px solid var(--line);border-radius:14px;width:100%}
.game-ui .ui-mode button{min-height:44px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-size:14px;font-weight:700;box-shadow:none}
.game-ui .ui-mode button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 2px 5px #1525361a}
.game-ui .ui-panel .ui-mode-note{font-size:12px;line-height:1.6;text-align:center;color:var(--muted)}
.game-ui .ui-mode-status{display:block;padding:5px 10px;color:var(--accent);font-size:11px;font-weight:700;line-height:1.5;text-align:center;border:1px solid var(--line);border-radius:8px;background:var(--surface);margin:4px auto;max-width:100%;pointer-events:none}
.game-ui body>.wrap>canvas:not(#fx){background-color:var(--stage);box-shadow:0 0 0 1px var(--line),0 6px 0 var(--soft);border-radius:18px;flex-shrink:0}
.game-ui .screen>canvas.game{box-shadow:0 0 0 1px var(--line),0 6px 0 var(--soft)}
.game-ui #hud{gap:6px;background:var(--surface);color:var(--ink)}
.game-ui #hud :is(.left,.t,.s,.grp,.pill){color:var(--ink)}
.game-ui #hud .pill{background:var(--surface);border-color:var(--line)}
.game-ui body canvas:is(#cv,#game,#board){background-color:var(--stage)}
.game-ui :is(button.dbtn,button.cbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.game-ui :is(button.lvl,button.lvlbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line);border-radius:12px;min-height:54px}
.game-ui :is(button.lvl,button.lvlbtn) :is(.nc,.sz,small){color:var(--muted)}
.game-ui .ui-panel button.lvl{margin:0;min-width:44px;box-shadow:none;padding:8px}
.game-ui #hud :is(.left,.right,.hudl,.hbtns){gap:5px;flex-wrap:wrap}
.game-ui #hud :is(.left,.hudl){min-width:0;flex-shrink:1}
.game-ui #hud :is(.pill,.left){font-size:12px}
.game-ui button:disabled{cursor:default;opacity:.45;box-shadow:none}
.game-ui .ui-panel .ui-assist-note{color:var(--accent);font-weight:700}
@media(min-width:700px){.game-ui body>.wrap{padding-top:32px}.game-ui .ui-panel{padding:36px 30px}}
@media(max-width:360px){.game-ui body>.wrap{padding:10px;gap:10px}.game-ui .ui-panel{padding:22px 18px;gap:13px}.game-ui .ui-panel h1{font-size:26px}.game-ui .ui-emblem{width:70px;height:70px;font-size:38px}.game-ui :is(.topbar,#topbar){gap:5px;padding:8px}.game-ui :is(.iconbtn,.icobtn,.ibtn,.tbtn,.ib){min-width:40px;min-height:44px}}
@media(max-height:650px){.game-ui .ui-panel{padding:18px;gap:12px}.game-ui .ui-emblem{width:60px;height:60px;font-size:32px}.game-ui .ui-panel h1{font-size:25px}.game-ui .ui-panel :is(p,.howto,.sub,.rule){font-size:13px}}
@media(prefers-reduced-motion:reduce){.game-ui *, .game-ui *::before,.game-ui *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
/* 2026-10-20 热修：开局/结算遮罩铺满整屏，主按钮固定在面板底部，避免被画布尺寸裁切（#10） */
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv):has(>.ui-panel){position:fixed;inset:0;z-index:1000;border-radius:0;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
.game-ui .ui-panel{touch-action:pan-y}
.game-ui .ui-panel :is(#startBtn,#btnStart,.startbtn,#bStart,#restartBtn,#btnRestart,#againBtn,#btnAgain,#retryBtn,#btnRetry,#playBtn,#btnPlay){position:sticky;bottom:0;z-index:3;flex-shrink:0}
.game-ui .ui-panel :not(.card,.panel,.pausecard,.ovcard,.ui-mode):has(>:is(#startBtn,#btnStart,.startbtn,#bStart,#restartBtn,#btnRestart,#againBtn,#btnAgain,#retryBtn,#btnRetry,#playBtn,#btnPlay)){position:sticky;bottom:0;z-index:3;flex-shrink:0;background:var(--surface);box-shadow:0 -10px 10px -6px var(--surface)}

html[data-game="noodle"] #wrap{background:var(--page)}html[data-game="noodle"] #hud{background:var(--surface);color:var(--ink);border-bottom:1px solid var(--line)}html[data-game="noodle"] #hud .btn{padding:0;min-width:44px;min-height:44px;background:var(--soft);color:var(--ink);border:1px solid var(--line);font-size:18px}html[data-game="noodle"] :is(#barLabel,#tip){color:var(--muted)}html[data-game="noodle"] :is(#holdpad,#serveBtn){background:var(--surface);color:var(--accent);border-color:var(--line);box-shadow:0 4px 0 var(--soft)}
html[data-game="noodle"] #dishTag,html[data-game="noodle"] #tip{color:#f9ece2}html[data-game="noodle"] #barLabel{color:var(--muted)}html[data-game="noodle"] #hud .pill{background:var(--surface);color:var(--ink);border-color:var(--line)}

</style>
<script>
// Installed before the original game script; embedded so downloaded ZIPs remain offline capable.
(function () {
  'use strict';
  var config = {"id":"noodle","name":"拉面王","theme":"kitchen","icon":"🍜","challenge":"断裂容错从 3 次收紧到 2 次，接近红线需及时松手"};
  var mode = 'classic';
  try { mode = sessionStorage.getItem('game100-mode-' + config.id) || mode; } catch (_) {}
  var expert = mode === 'expert';
  var used = { hint: 0, undo: 0 };
  var limits = { hint: 1, undo: 3 };
  function storageKey(key) { return expert && !/sound|mute/i.test(key) ? 'expert:' + key : key; }
  window.GameUI = {
    expert: expert,
    pick: function (classic, advanced) { return expert ? advanced : classic; },
    storageGet: function (key) { return localStorage.getItem(storageKey(key)); },
    storageSet: function (key, value) { localStorage.setItem(storageKey(key), value); },
    storageRemove: function (key) { localStorage.removeItem(storageKey(key)); }
  };
  var root = document.documentElement;
  root.classList.add('game-ui');
  root.dataset.theme = config.theme;
  root.dataset.game = config.id;
  root.dataset.mode = mode;
  var gesture = new WeakMap();
  function labelButtons(scope) {
    scope.querySelectorAll('button').forEach(function (button) {
      if (button.getAttribute('aria-label')) return;
      var id = button.id.toLowerCase(), text = button.textContent.trim();
      var name = /mute|sound|snd/.test(id) ? '切换音效' : /pause/.test(id) ? '暂停游戏' : /hint/.test(id) && !/close|ok/.test(id) ? '查看提示' : '';
      if (!name && /^[⏸🔊🔇💡Ⅱ]+$/u.test(text)) name = { '⏸': '暂停游戏', '🔊': '切换音效', '🔇': '切换音效', '💡': '查看提示' }[text];
      if (name) button.setAttribute('aria-label', name);
    });
  }
  function decorate(container) {
    if (container.querySelector(':scope > .ui-panel') || !container.querySelector('h1,h2,.gamename')) return;
    if (container.matches('.screen') && container.querySelector('canvas:not(#fx)')) return;
    var panel = document.createElement('div');
    panel.className = 'ui-panel';
    while (container.firstChild) panel.appendChild(container.firstChild);
    container.appendChild(panel);
    var heading = panel.querySelector('h1,h2,.gamename');
    var start = /start|menu|ready/i.test(container.id) || !!panel.querySelector('#startBtn,#btnStart,.startbtn');
    if (start) {
      var headings = panel.querySelectorAll('h1,h2,.gamename');
      if (headings.length > 1 && !/[A-Za-z0-9\u4e00-\u9fff]/.test(heading.textContent)) { heading.remove(); heading = headings[1]; }
      var oldIcon = panel.querySelector('.bigemoji,.ic');
      if (oldIcon) oldIcon.remove();
      var emblem = document.createElement('div');
      emblem.className = 'ui-emblem'; emblem.textContent = config.icon; emblem.setAttribute('aria-hidden', 'true');
      panel.insertBefore(emblem, panel.firstChild);
      heading.textContent = config.name;
      var switcher = document.createElement('div'); switcher.className = 'ui-mode'; switcher.setAttribute('role', 'group'); switcher.setAttribute('aria-label', '选择玩法模式');
      [['classic','经典模式'],['expert','进阶挑战']].forEach(function (item) {
        var b = document.createElement('button'); b.type = 'button'; b.textContent = item[1]; b.dataset.mode = item[0]; b.setAttribute('aria-pressed', String(mode === item[0]));
        b.addEventListener('click', function () {
          if (mode === item[0]) return;
          try { sessionStorage.setItem('game100-mode-' + config.id, item[0]); location.reload(); }
          catch (_) { b.textContent = '浏览器未允许保存模式'; }
        });
        switcher.appendChild(b);
      });
      var primary = panel.querySelector('#startBtn,#btnStart,.startbtn,button');
      var anchor = primary;
      while (anchor && anchor.parentNode !== panel && !anchor.parentNode.matches('.card,.panel,.pausecard,.ovcard')) anchor = anchor.parentNode;
      var target = anchor ? anchor.parentNode : panel;
      target.insertBefore(switcher, anchor || null);
      var note = document.createElement('p'); note.className = 'ui-mode-note';
      note.textContent = expert ? config.challenge + '。进阶纪录单独保存。' : '按原规则轻松开局，也可切换进阶挑战。';
      target.insertBefore(note, anchor || null);
    }
    labelButtons(panel);
  }
  function notify(text) {
    var el = document.getElementById('ui-assist-toast');
    if (!el) { el = document.createElement('div'); el.id = 'ui-assist-toast'; el.className = 'ui-mode-status'; el.setAttribute('role', 'status'); el.style.cssText = 'position:fixed;bottom:18px;left:16px;right:16px;z-index:200;padding:14px'; document.body.appendChild(el); }
    el.textContent = text; el.hidden = false;
    clearTimeout(notify.timer); notify.timer = setTimeout(function () { el.hidden = true; }, 2000);
  }
  function assistEvent(event) {
    if (!expert) return;
    var b = event.target.closest('button'); if (!b || b.closest('.ui-mode')) return;
    var kind = /^(hintBtn|hintTopBtn|btnHint)$/i.test(b.id) ? 'hint' : /^(undoBtn|undoTopBtn|btnUndo)$/i.test(b.id) || /悔一步|撤销/.test(b.textContent) ? 'undo' : '';
    if (!kind) return;
    var prev = gesture.get(b), blocked;
    if (event.type === 'click' && prev && performance.now() - prev.at < 1000) blocked = prev.blocked;
    else { blocked = used[kind] >= limits[kind]; if (!blocked) used[kind]++; gesture.set(b, { at: performance.now(), blocked: blocked }); }
    if (blocked) { event.preventDefault(); event.stopImmediatePropagation(); notify(kind === 'hint' ? '本次挑战的 1 次提示已用完' : '本次挑战的 3 次撤销已用完'); }
  }
  document.addEventListener('pointerdown', assistEvent, true);
  document.addEventListener('click', assistEvent, true);
  document.addEventListener('click', function (event) {
    var b = event.target.closest('button');
    if (b && /^(startBtn|btnStart|restartBtn|againBtn|retryBtn|btnAgain|btnRestart|playAgain)$/i.test(b.id)) used = { hint: 0, undo: 0 };
  }, true);
  document.addEventListener('DOMContentLoaded', function () {
    var selector = '.overlay,.ov,#ov,#overlay,#pauseOv,.screen';
    document.querySelectorAll(selector).forEach(function (container) {
      decorate(container);
      // Only dynamic overlay children are observed; animated scores never trigger this work.
      new MutationObserver(function () { decorate(container); }).observe(container, { childList: true });
    });
    labelButtons(document);
  });
}());

</script>
<!-- GAME UI END -->
</head>
<body>
<div id="wrap">
  <div id="hud">
    <span class="pill">🍜 <b id="score">0</b>分</span>
    <span class="pill">👑 <b id="high">0</b></span>
    <span class="pill">第 <b id="round">1</b>/10 轮</span>
    <span class="pill">💔 <b id="brk">0</b>/3</span>
    <span class="grow"></span>
    <button class="btn" id="muteBtn" aria-label="静音">🔊</button>
    <button class="btn" id="pauseBtn" aria-label="暂停">⏸</button>
  </div>
  <div id="tWrap">
    <div id="tbar"><div id="tfill"></div><div id="tline"></div></div>
    <div id="tLabel"><span>😌 松弛</span><span>🔴 断裂线</span><span>💪 越接近分越高</span></div>
  </div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="roundTag">🍜 按住屏幕，向外拉面！</div>
    <div id="tip">在红色断裂线前松手，越接近分越高</div>
    <div id="float"></div>
  </div>
  <div id="ov"><div class="card" id="ovCard"></div></div>
</div>
<script>
/* GAMEPLAY UPGRADE */
'use strict';
(function(){
  function $(id){return document.getElementById(id);}
  var cv=$('cv'),ctx=cv.getContext('2d');
  var ID='noodle',HS_KEY='g100_'+ID+'_hs',MUTE_KEY='g100_mute';
  var high=parseInt(GameUI.storageGet(HS_KEY)||'0',10);
  if(!(high>=0)){high=0;}
  var muted=GameUI.storageGet(MUTE_KEY)==='1';

  var G={state:'start',score:0,breaks:0,round:1,tension:0,dispT:0,
         pulling:false,line:92,rate:38,t:0,broken:0,breakT:0,w:0,h:0};
  var parts=[];

  /* ---------- 音频 ---------- */
  var AC=null,stretchOsc=null,stretchGain=null;
  function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return null;}}if(AC&&AC.state==='suspended'){AC.resume();}return AC;}
  function tone(f,dur,type,vol,when){
    if(muted)return;var c=ac();if(!c)return;
    var t0=c.currentTime+(when||0);
    var o=c.createOscillator(),g=c.createGain();
    o.type=type||'sine';o.frequency.setValueAtTime(f,t0);
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(vol||0.2,t0+0.015);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g);g.connect(c.destination);
    o.start(t0);o.stop(t0+dur+0.05);
  }
  function sClick(){tone(520,0.08,'square',0.12);}
  function sDing(q){var f=500+q*400;tone(f,0.15,'sine',0.22);tone(f*1.5,0.2,'sine',0.18,0.08);}
  function sSnap(){tone(220,0.08,'square',0.25);tone(90,0.25,'sawtooth',0.25,0.05);tone(60,0.3,'sawtooth',0.2,0.12);}
  function sWin(){var n=[523,659,784,1046,1318];for(var i=0;i<n.length;i++){tone(n[i],0.18,'triangle',0.2,i*0.12);}}
  function stretchStart(){
    if(muted)return;var c=ac();if(!c)return;
    stretchStop();
    stretchOsc=c.createOscillator();stretchGain=c.createGain();
    stretchOsc.type='sawtooth';stretchOsc.frequency.setValueAtTime(80,c.currentTime);
    stretchGain.gain.setValueAtTime(0.05,c.currentTime);
    stretchOsc.connect(stretchGain);stretchGain.connect(c.destination);
    stretchOsc.start();
  }
  function stretchSet(t){if(stretchOsc&&AC){stretchOsc.frequency.setTargetAtTime(80+t*3.2,AC.currentTime,0.03);}}
  function stretchStop(){if(stretchOsc){try{stretchOsc.stop();}catch(e){}stretchOsc=null;stretchGain=null;}}
  function vib(p){try{if(navigator.vibrate){navigator.vibrate(p);}}catch(e){}}

  /* ---------- UI ---------- */
  function setMute(m){muted=m;GameUI.storageSet(MUTE_KEY,m?'1':'0');$('muteBtn').textContent=m?'🔇':'🔊';}
  $('muteBtn').textContent=muted?'🔇':'🔊';
  $('muteBtn').addEventListener('click',function(){setMute(!muted);if(!muted){sClick();}});
  function updHud(){$('score').textContent=G.score;$('high').textContent=high;$('round').textContent=Math.min(G.round,10);$('brk').textContent=G.breaks;}
  function floatText(txt,cls){
    var d=document.createElement('div');d.className='flo '+cls;d.textContent=txt;
    var st=$('stage').getBoundingClientRect();
    d.style.left=(st.width/2-70)+'px';d.style.top=(st.height*0.25)+'px';
    $('float').appendChild(d);setTimeout(function(){d.remove();},1150);
  }
  function showOv(html){$('ovCard').innerHTML=html;$('ov').classList.remove('hidden');}
  function hideOv(){$('ov').classList.add('hidden');}

  function startScreen(){
    G.state='start';
    showOv('<h1>🍜 拉面王</h1><p>两只手抻一根面，<b style="color:#ffd166">按住屏幕</b>向外拉，拉力条飞涨！<br>在<b style="color:#ff6b6b">红色断裂线前松手</b>：越接近线分越高（10~100分）。<br>拉过红线 = 面条断裂 💔 本轮 0 分！<br>共 10 轮，断 3 次提前结束。抻面讲究火候～</p><div class="row"><button class="bigbtn" id="startBtn">开抻！</button></div>');
    $('startBtn').addEventListener('click',function(){sClick();startGame();});
  }
  function endScreen(reason){
    G.state='over';stretchStop();
    if(G.score>high){high=G.score;GameUI.storageSet(HS_KEY,String(high));}
    updHud();sWin();vib([80,60,80]);
    showOv('<h2>🍜 收面啦！</h2><p>'+(reason==='break'?'面断了 3 次，手劲还得练～':'10 轮抻完，师傅好手艺！')+'</p>'+
      '<div class="big">'+G.score+' 分</div>'+
      '<p>断裂 '+G.breaks+' 次 ｜ 最高 '+high+' 分</p>'+
      '<div class="row"><button class="bigbtn" id="againBtn">再来一碗</button></div>');
    $('againBtn').addEventListener('click',function(){sClick();startGame();});
  }

  /* ---------- 流程 ---------- */
  function startGame(){
    hideOv();
    G.state='ready';G.score=0;G.breaks=0;G.round=1;
    G.tension=0;G.dispT=0;G.pulling=false;G.broken=0;parts=[];
    updHud();setupRound();
  }
  function setupRound(){
    if(G.state==='over'){return;}
    G.line=88+Math.random()*8;
    G.rate=36+(G.round-1)*3.5;
    G.tension=0;G.dispT=0;G.pulling=false;G.broken=0;G.breakT=0;
    G.state='ready';
    $('tline').style.left='calc('+G.line.toFixed(1)+'% - 2px)';
    $('tfill').style.width='0%';
    $('roundTag').textContent='🍜 第 '+G.round+'/10 轮：按住拉面！';
    $('tip').textContent='在红色断裂线前松手，越接近分越高';
  }
  function beginPull(){
    if(G.state!=='ready'){return;}
    ac();G.state='pulling';G.pulling=true;G.tension=0;
    stretchStart();
    $('roundTag').textContent='💪 抻着呢…看准松手！';
  }
  function releasePull(){
    if(G.state!=='pulling'){return;}
    G.pulling=false;stretchStop();G.state='result';
    var t=G.tension,line=G.line;
    var prox=Math.max(0,Math.min(1,(t-(line-38))/38));
    var sc=10+Math.round(90*prox);
    G.score+=sc;
    if(prox>0.85){floatText('神之手感！+'+sc,'best');}
    else if(prox>0.5){floatText('漂亮！+'+sc,'good');}
    else{floatText('+'+sc,'good');}
    sDing(prox);vib(25);
    if(prox>0.7){burst();}
    updHud();
    (function tick(){setTimeout(function(){
      if(G.state==='paused'){tick();return;}
      if(G.state!=='result'){return;}
      G.round++;
      if(G.round>10){endScreen('done');}else{setupRound();}
    },900);})();
  }
  function doBreak(){
    G.pulling=false;stretchStop();G.state='result';
    G.breaks++;G.broken=1;G.breakT=0;
    floatText('啪！断了 💔','bad');
    sSnap();vib([70,40,70]);
    for(var i=0;i<18;i++){
      parts.push({x:G.w/2+(Math.random()-0.5)*80,y:G.h*0.42,
        vx:(Math.random()-0.5)*260,vy:-40-Math.random()*160,
        r:2+Math.random()*3,t:0,life:0.9,c:'#f5e6c8'});
    }
    updHud();
    (function tick(){setTimeout(function(){
      if(G.state==='paused'){tick();return;}
      if(G.state!=='result'){return;}
      if(G.breaks>=GameUI.pick(3,2)){endScreen('break');return;}
      G.round++;
      if(G.round>10){endScreen('done');}else{setupRound();}
    },1100);})();
  }
  function burst(){
    for(var i=0;i<12;i++){
      parts.push({x:G.w/2+(Math.random()-0.5)*120,y:G.h*0.42,
        vx:(Math.random()-0.5)*140,vy:-60-Math.random()*120,
        r:2+Math.random()*3,t:0,life:0.7,c:['#ffd166','#fff','#ffb347'][i%3]});
    }
  }

  /* ---------- 暂停 ---------- */
  var prevState='ready';
  function togglePause(){
    if(G.state==='start'||G.state==='over'){return;}
    if(G.state==='paused'){
      G.state=prevState;hideOv();sClick();$('pauseBtn').textContent='⏸';
    }else{
      if(G.pulling){G.pulling=false;stretchStop();G.tension=0;G.state='ready';$('tfill').style.width='0%';}
      prevState=(G.state==='pulling')?'ready':G.state;
      G.state='paused';$('pauseBtn').textContent='▶';
      showOv('<h2>⏸ 已暂停</h2><p>面还醒着，回来继续抻～</p><div class="row"><button class="bigbtn" id="resumeBtn">继续</button><button class="ghostbtn" id="quitBtn">重开</button></div>');
      $('resumeBtn').addEventListener('click',togglePause);
      $('quitBtn').addEventListener('click',function(){sClick();$('pauseBtn').textContent='⏸';startGame();});
    }
  }
  $('pauseBtn').addEventListener('click',function(){togglePause();});

  /* ---------- 输入 ---------- */
  var stage=$('stage');
  stage.addEventListener('pointerdown',function(e){e.preventDefault();beginPull();});
  window.addEventListener('pointerup',function(){releasePull();});
  window.addEventListener('pointercancel',function(){
    if(G.state==='pulling'){G.pulling=false;stretchStop();G.tension=0;G.state='ready';$('tfill').style.width='0%';}
  });
  document.addEventListener('contextmenu',function(e){e.preventDefault();});

  /* ---------- 主循环 ---------- */
  function resize(){
    var st=stage.getBoundingClientRect();
    var dpr=Math.min(2,window.devicePixelRatio||1);
    cv.width=st.width*dpr;cv.height=st.height*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    G.w=st.width;G.h=st.height;
  }
  window.addEventListener('resize',resize);

  var last=0;
  function loop(ts){
    requestAnimationFrame(loop);
    if(!last){last=ts;}
    var dt=Math.min(0.05,(ts-last)/1000);last=ts;
    if(G.state==='paused'||G.state==='start'||G.state==='over'){return;}
    G.t+=dt;
    if(G.pulling){
      G.tension+=G.rate*dt;
      stretchSet(G.tension);
      if(G.tension>=G.line){G.tension=G.line;doBreak();return;}
      $('tfill').style.width=G.tension+'%';
      var f=$('tfill');
      if(G.tension>G.line-15){f.style.background='linear-gradient(90deg,#ff9f1c,#ff3b30)';}
      else{f.style.background='linear-gradient(90deg,#ffd166,#ff9f1c)';}
    }
    var target=G.pulling?G.tension:0;
    var k=G.pulling?Math.min(1,dt*14):Math.min(1,dt*7);
    G.dispT+=(target-G.dispT)*k;
    if(G.broken){G.breakT+=dt;}
    for(var i=parts.length-1;i>=0;i--){var p=parts[i];p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=500*dt;if(p.t>p.life){parts.splice(i,1);}}
    draw();
  }

  function draw(){
    var w=G.w,h=G.h;if(!w){return;}
    ctx.clearRect(0,0,w,h);
    var cx=w/2,noodleY=h*0.42;
    var maxExt=Math.min(w*0.3,140),baseHalf=Math.min(w*0.16,80);
    var ext=(G.dispT/100)*maxExt;
    var lx=cx-baseHalf-ext,rx=cx+baseHalf+ext;
    var handY=noodleY-6;
    var wob=Math.sin(G.t*6)*Math.max(0,10-G.dispT*0.12);

    ctx.font='54px serif';ctx.textAlign='center';ctx.textBaseline='middle';
    var grip=G.pulling?Math.sin(G.t*30)*2:0;
    ctx.fillText('🤚',lx,handY+grip);
    ctx.fillText('🖐',rx,handY-grip);

    ctx.lineCap='round';
    if(G.broken&&G.breakT<0.9){
      var bt=G.breakT/0.9,drop=bt*bt*120;
      ctx.strokeStyle='#f5e6c8';ctx.lineWidth=7;
      ctx.beginPath();ctx.moveTo(lx,handY);
      ctx.quadraticCurveTo((lx+cx)/2,noodleY+30+drop,cx-14,noodleY+44+drop);
      ctx.stroke();
      ctx.beginPath();ctx.moveTo(rx,handY);
      ctx.quadraticCurveTo((rx+cx)/2,noodleY+30+drop,cx+14,noodleY+44+drop);
      ctx.stroke();
    }else if(!G.broken){
      var sag=34*(1-G.dispT/130);
      var grad=ctx.createLinearGradient(lx,0,rx,0);
      grad.addColorStop(0,'#f5e6c8');grad.addColorStop(0.5,'#ffe9b8');grad.addColorStop(1,'#f5e6c8');
      ctx.strokeStyle=grad;ctx.lineWidth=5+G.dispT*0.03;
      ctx.beginPath();ctx.moveTo(lx,handY);
      ctx.quadraticCurveTo(cx,noodleY+sag+wob,rx,handY);
      ctx.stroke();
      if(G.pulling&&G.dispT>G.line-18){
        ctx.strokeStyle='rgba(255,59,48,'+(0.4+0.4*Math.sin(G.t*14)).toFixed(3)+')';
        ctx.lineWidth=9;
        ctx.beginPath();ctx.moveTo(lx,handY);
        ctx.quadraticCurveTo(cx,noodleY+sag+wob,rx,handY);
        ctx.stroke();
      }
    }
    for(var i=0;i<parts.length;i++){var p=parts[i];var a=1-p.t/p.life;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);
      ctx.fillStyle=p.c;ctx.globalAlpha=Math.max(0,a);ctx.fill();ctx.globalAlpha=1;}
    if(G.state==='pulling'){
      ctx.font='16px serif';ctx.textAlign='center';
      ctx.fillText('😬',cx-30+Math.sin(G.t*10)*4,noodleY-44);
    }
  }

  resize();updHud();startScreen();
  setTimeout(resize,100);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
