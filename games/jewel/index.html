<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>消消乐</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:linear-gradient(160deg,#1a0f24 0%,#2c1440 55%,#160a20 100%);color:#f3eef7;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;display:flex;justify-content:center;min-height:100vh;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.wrap{width:100%;max-width:480px;padding:12px 14px 22px;display:flex;flex-direction:column;align-items:center;gap:10px}
.topbar{width:100%;display:flex;justify-content:space-between;align-items:center}
.title{font-size:19px;font-weight:800}
.tbtns{display:flex;gap:8px}
.iconbtn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:#fff;font-size:18px;width:42px;height:42px;border-radius:12px;cursor:pointer}
.iconbtn:active{transform:scale(.94)}
.stats{width:100%;display:flex;justify-content:space-around;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:10px 6px;box-shadow:0 4px 14px rgba(0,0,0,.25);font-size:14px;color:#cdb9d8}
.stats b{color:#fff;font-size:18px;margin-left:4px}
.stats b.hot{color:#ff5252;animation:blink .5s infinite alternate}
@keyframes blink{from{opacity:1}to{opacity:.45}}
canvas{width:100%;height:auto;border-radius:16px;touch-action:none;box-shadow:0 8px 26px rgba(0,0,0,.45);background:#1d1029}
.hint{color:#9d86ad;font-size:13px;text-align:center;line-height:1.7}
#hintbar{min-height:20px;font-size:13px;color:#ffd54f;text-align:center}
.overlay{position:fixed;inset:0;background:rgba(10,4,16,.88);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;z-index:30;padding:28px;text-align:center}
.overlay.hidden{display:none}
.overlay h1{font-size:32px}
.overlay h2{font-size:24px}
.overlay p{color:#c9b3d6;font-size:15px;line-height:1.9}
.overlay .btn{border:none;border-radius:14px;padding:13px 44px;min-width:200px;font-size:18px;font-weight:800;color:#fff;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.overlay .btn:active{transform:scale(.96)}
.overlay .btn.primary{background:linear-gradient(135deg,#ab47bc,#7b1fa2)}
.overlay .btn.ghost{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.16);font-size:16px;padding:11px 40px}
.statline{display:flex;gap:18px;color:#e6d5ee;font-size:15px}
.statline b{color:#ffd54f;font-size:22px}
#comboTag{position:fixed;left:50%;top:34%;transform:translate(-50%,-50%) scale(.6);font-size:44px;font-weight:900;color:#ffd54f;text-shadow:0 3px 18px rgba(255,213,79,.6);opacity:0;pointer-events:none;z-index:40;transition:opacity .18s,transform .18s}
#comboTag.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
</style>
<!-- GAME UI BEGIN -->
<style>
:root{--page:#f5e4eb;--surface:#fff8fc;--soft:#edd5e2;--ink:#4e2e49;--muted:#806079;--accent:#a33d70;--on-accent:#ffffff;--line:#d9b4ca;--stage:#33223d}
/* Shared presentation only; mechanics and state remain inside each standalone game. */
html.game-ui{background:var(--page);color:var(--ink);color-scheme:light;font-family:"Bahnschrift","Microsoft YaHei UI","PingFang SC",sans-serif}
html.game-ui[data-theme="space"],html.game-ui[data-theme="arcade"]{color-scheme:dark}
.game-ui body{background:var(--page);color:var(--ink);font-family:inherit;overscroll-behavior:none}
.game-ui body>.wrap{padding:20px 16px max(20px,env(safe-area-inset-bottom));gap:14px;max-width:500px}
.game-ui #app{background:var(--page);color:var(--ink)}
.game-ui :is(.topbar,#topbar){gap:8px;flex-wrap:wrap;min-height:58px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:10px 12px;box-shadow:0 3px 0 var(--soft);font-size:13px}
.game-ui :is(.title,.tb-title,.tb-title,#topbar .t,.topbar .t){color:var(--ink);font-size:16px;font-weight:750;letter-spacing:0}
.game-ui :is(.topbar,.hud,#hud,#topbar) :is(b,.v){color:var(--accent);font-variant-numeric:tabular-nums}
.game-ui :is(.stat,.topbar .s,.topbar .stat,.scorebar,.stats,.tip,.hint,.hintline,.hsline,.best,.hiscore){color:var(--muted);line-height:1.7}
.game-ui :is(.hint,.hintline,.tip){font-size:12px;max-width:40em;text-wrap:pretty}
.game-ui .scorebar{padding:6px 10px;gap:8px;flex-wrap:wrap}
.game-ui :is(.iconbtn,.iconBtn,.icobtn,.ibtn,.tbtn,.hbtn,.ib,.iconBtn,.pause){min-width:44px;min-height:44px;flex-shrink:0;border-radius:12px;background:var(--soft);color:var(--ink);border:1px solid var(--line);box-shadow:none;font-size:17px}
.game-ui button{font-family:inherit;cursor:pointer;touch-action:manipulation}
.game-ui button:focus-visible,.game-ui [tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.game-ui :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn){background:var(--accent);color:var(--on-accent);border:1px solid transparent;border-radius:13px;min-height:50px;padding:13px 28px;font-size:16px;font-weight:750;letter-spacing:0;box-shadow:0 4px 0 var(--line);text-shadow:none;max-width:100%}
.game-ui :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn):active{box-shadow:none;transform:translateY(2px)}
.game-ui :is(.ghost,.ghostbtn,.btn2,.abtn,.toolbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line);box-shadow:none;border-radius:12px;min-height:44px}
.game-ui :is(.rowbtns,.btnrow,.ctlrow){gap:10px;flex-wrap:wrap;justify-content:center}
.game-ui :is(.pill,.hudbox,.hud .p){background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:none;font-variant-numeric:tabular-nums}
.game-ui :is(.dbtn,.cbtn,.gbtn,.holdbtn,.firebtn,.bombbtn,.jumpbtn,.pumpbtn,.nbtn){border-radius:12px;box-shadow:0 3px 0 var(--line);min-height:44px}
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv,.screen):has(>.ui-panel){padding:20px;overflow-y:auto;overscroll-behavior:contain}
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv):has(>.ui-panel){background:var(--page);backdrop-filter:none;justify-content:safe center;align-items:center}
.game-ui .ui-panel{width:min(100%,380px);max-height:100%;overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:18px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:24px;padding:30px 24px;box-shadow:0 8px 0 var(--soft),0 20px 48px #15253618;text-align:center;margin:auto}
.game-ui .ui-panel :is(.card,.panel,.pausecard,.ovcard){display:contents}
.game-ui .ui-panel :is(h1,h2,.gamename,.gametitle){font-size:30px;line-height:1.25;font-weight:800;color:var(--ink);background:none;-webkit-text-fill-color:currentColor;text-shadow:none;letter-spacing:-.6px;margin:0}
.game-ui .ui-panel :is(p,.howto,.sub,.rule){font-size:14px;line-height:1.85;color:var(--muted);background:none;border:0;box-shadow:none;padding:0;margin:0;max-width:32em;text-align:left;white-space:normal}
.game-ui .ui-panel :is(.bigemoji,.bigemoji,.ic,.big):not(.bigscore){animation:none;filter:none;text-shadow:none}
.game-ui .ui-emblem{width:90px;height:90px;display:grid;place-items:center;border:1px solid var(--line);border-radius:28px;background:var(--soft);font-size:48px;line-height:1;flex-shrink:0;position:relative}
.game-ui[data-theme="wood"] .ui-emblem{border-radius:50%;box-shadow:inset 0 0 0 5px var(--surface),inset 0 0 0 6px var(--line)}
.game-ui[data-theme="wood"] .ui-panel h1{font-family:"STKaiti","KaiTi","Microsoft YaHei",serif;letter-spacing:2px}
.game-ui[data-theme="ice"] .ui-emblem{border-radius:26px 8px 26px 8px}
.game-ui[data-theme="space"] .ui-emblem{background:radial-gradient(circle at center,var(--soft) 42%,transparent 43%),var(--surface);border-radius:50%;outline:1px solid var(--line);outline-offset:7px;margin:7px}
.game-ui[data-theme="kitchen"] .ui-emblem{border-radius:22px;border-bottom:5px solid var(--line)}
.game-ui .ui-panel :is(.score,.bigscore,.bigScore,.scorebig){color:var(--accent);font-size:48px;font-weight:800;font-variant-numeric:tabular-nums}
.game-ui .ui-panel :is(.best,.hsline,.hiscore,.endstats,.endstats b){color:var(--muted);font-size:13px;line-height:1.8}
.game-ui .ui-mode{display:grid;grid-template-columns:1fr 1fr;gap:5px;background:var(--soft);padding:5px;border:1px solid var(--line);border-radius:14px;width:100%}
.game-ui .ui-mode button{min-height:44px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-size:14px;font-weight:700;box-shadow:none}
.game-ui .ui-mode button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 2px 5px #1525361a}
.game-ui .ui-panel .ui-mode-note{font-size:12px;line-height:1.6;text-align:center;color:var(--muted)}
.game-ui .ui-mode-status{display:block;padding:5px 10px;color:var(--accent);font-size:11px;font-weight:700;line-height:1.5;text-align:center;border:1px solid var(--line);border-radius:8px;background:var(--surface);margin:4px auto;max-width:100%;pointer-events:none}
.game-ui body>.wrap>canvas:not(#fx){background-color:var(--stage);box-shadow:0 0 0 1px var(--line),0 6px 0 var(--soft);border-radius:18px;flex-shrink:0}
.game-ui .screen>canvas.game{box-shadow:0 0 0 1px var(--line),0 6px 0 var(--soft)}
.game-ui #hud{gap:6px;background:var(--surface);color:var(--ink)}
.game-ui #hud :is(.left,.t,.s,.grp,.pill){color:var(--ink)}
.game-ui #hud .pill{background:var(--surface);border-color:var(--line)}
.game-ui body canvas:is(#cv,#game,#board){background-color:var(--stage)}
.game-ui :is(button.dbtn,button.cbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.game-ui :is(button.lvl,button.lvlbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line);border-radius:12px;min-height:54px}
.game-ui :is(button.lvl,button.lvlbtn) :is(.nc,.sz,small){color:var(--muted)}
.game-ui .ui-panel button.lvl{margin:0;min-width:44px;box-shadow:none;padding:8px}
.game-ui #hud :is(.left,.right,.hudl,.hbtns){gap:5px;flex-wrap:wrap}
.game-ui #hud :is(.left,.hudl){min-width:0;flex-shrink:1}
.game-ui #hud :is(.pill,.left){font-size:12px}
.game-ui button:disabled{cursor:default;opacity:.45;box-shadow:none}
.game-ui .ui-panel .ui-assist-note{color:var(--accent);font-weight:700}
@media(min-width:700px){.game-ui body>.wrap{padding-top:32px}.game-ui .ui-panel{padding:36px 30px}}
@media(max-width:360px){.game-ui body>.wrap{padding:10px;gap:10px}.game-ui .ui-panel{padding:22px 18px;gap:13px}.game-ui .ui-panel h1{font-size:26px}.game-ui .ui-emblem{width:70px;height:70px;font-size:38px}.game-ui :is(.topbar,#topbar){gap:5px;padding:8px}.game-ui :is(.iconbtn,.icobtn,.ibtn,.tbtn,.ib){min-width:40px;min-height:44px}}
@media(max-height:650px){.game-ui .ui-panel{padding:18px;gap:12px}.game-ui .ui-emblem{width:60px;height:60px;font-size:32px}.game-ui .ui-panel h1{font-size:25px}.game-ui .ui-panel :is(p,.howto,.sub,.rule){font-size:13px}}
@media(prefers-reduced-motion:reduce){.game-ui *, .game-ui *::before,.game-ui *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
/* 2026-10-20 热修：开局/结算遮罩铺满整屏，主按钮固定在面板底部，避免被画布尺寸裁切（#10） */
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv):has(>.ui-panel){position:fixed;inset:0;z-index:1000;border-radius:0;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
.game-ui .ui-panel{touch-action:pan-y}
.game-ui .ui-panel :is(#startBtn,#btnStart,.startbtn,#bStart,#restartBtn,#btnRestart,#againBtn,#btnAgain,#retryBtn,#btnRetry,#playBtn,#btnPlay){position:sticky;bottom:0;z-index:3;flex-shrink:0}
.game-ui .ui-panel :not(.card,.panel,.pausecard,.ovcard,.ui-mode):has(>:is(#startBtn,#btnStart,.startbtn,#bStart,#restartBtn,#btnRestart,#againBtn,#btnAgain,#retryBtn,#btnRetry,#playBtn,#btnPlay)){position:sticky;bottom:0;z-index:3;flex-shrink:0;background:var(--surface);box-shadow:0 -10px 10px -6px var(--surface)}

html[data-game="jewel"] #board{border:1px solid var(--line);box-shadow:0 5px 0 var(--soft)}html[data-game="jewel"] .stats{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px}html[data-game="jewel"] .stats b{color:var(--accent)}

</style>
<script>
// Installed before the original game script; embedded so downloaded ZIPs remain offline capable.
(function () {
  'use strict';
  var config = {"id":"jewel","name":"消消乐","theme":"candy","icon":"💎","challenge":"挑战限时缩至 45 秒，利用 4 连与爆炸形成连锁"};
  var mode = 'classic';
  try { mode = sessionStorage.getItem('game100-mode-' + config.id) || mode; } catch (_) {}
  var expert = mode === 'expert';
  var used = { hint: 0, undo: 0 };
  var limits = { hint: 1, undo: 3 };
  function storageKey(key) { return expert && !/sound|mute/i.test(key) ? 'expert:' + key : key; }
  window.GameUI = {
    expert: expert,
    pick: function (classic, advanced) { return expert ? advanced : classic; },
    storageGet: function (key) { return localStorage.getItem(storageKey(key)); },
    storageSet: function (key, value) { localStorage.setItem(storageKey(key), value); },
    storageRemove: function (key) { localStorage.removeItem(storageKey(key)); }
  };
  var root = document.documentElement;
  root.classList.add('game-ui');
  root.dataset.theme = config.theme;
  root.dataset.game = config.id;
  root.dataset.mode = mode;
  var gesture = new WeakMap();
  function labelButtons(scope) {
    scope.querySelectorAll('button').forEach(function (button) {
      if (button.getAttribute('aria-label')) return;
      var id = button.id.toLowerCase(), text = button.textContent.trim();
      var name = /mute|sound|snd/.test(id) ? '切换音效' : /pause/.test(id) ? '暂停游戏' : /hint/.test(id) && !/close|ok/.test(id) ? '查看提示' : '';
      if (!name && /^[⏸🔊🔇💡Ⅱ]+$/u.test(text)) name = { '⏸': '暂停游戏', '🔊': '切换音效', '🔇': '切换音效', '💡': '查看提示' }[text];
      if (name) button.setAttribute('aria-label', name);
    });
  }
  function decorate(container) {
    if (container.querySelector(':scope > .ui-panel') || !container.querySelector('h1,h2,.gamename')) return;
    if (container.matches('.screen') && container.querySelector('canvas:not(#fx)')) return;
    var panel = document.createElement('div');
    panel.className = 'ui-panel';
    while (container.firstChild) panel.appendChild(container.firstChild);
    container.appendChild(panel);
    var heading = panel.querySelector('h1,h2,.gamename');
    var start = /start|menu|ready/i.test(container.id) || !!panel.querySelector('#startBtn,#btnStart,.startbtn');
    if (start) {
      var headings = panel.querySelectorAll('h1,h2,.gamename');
      if (headings.length > 1 && !/[A-Za-z0-9\u4e00-\u9fff]/.test(heading.textContent)) { heading.remove(); heading = headings[1]; }
      var oldIcon = panel.querySelector('.bigemoji,.ic');
      if (oldIcon) oldIcon.remove();
      var emblem = document.createElement('div');
      emblem.className = 'ui-emblem'; emblem.textContent = config.icon; emblem.setAttribute('aria-hidden', 'true');
      panel.insertBefore(emblem, panel.firstChild);
      heading.textContent = config.name;
      var switcher = document.createElement('div'); switcher.className = 'ui-mode'; switcher.setAttribute('role', 'group'); switcher.setAttribute('aria-label', '选择玩法模式');
      [['classic','经典模式'],['expert','进阶挑战']].forEach(function (item) {
        var b = document.createElement('button'); b.type = 'button'; b.textContent = item[1]; b.dataset.mode = item[0]; b.setAttribute('aria-pressed', String(mode === item[0]));
        b.addEventListener('click', function () {
          if (mode === item[0]) return;
          try { sessionStorage.setItem('game100-mode-' + config.id, item[0]); location.reload(); }
          catch (_) { b.textContent = '浏览器未允许保存模式'; }
        });
        switcher.appendChild(b);
      });
      var primary = panel.querySelector('#startBtn,#btnStart,.startbtn,button');
      var anchor = primary;
      while (anchor && anchor.parentNode !== panel && !anchor.parentNode.matches('.card,.panel,.pausecard,.ovcard')) anchor = anchor.parentNode;
      var target = anchor ? anchor.parentNode : panel;
      target.insertBefore(switcher, anchor || null);
      var note = document.createElement('p'); note.className = 'ui-mode-note';
      note.textContent = expert ? config.challenge + '。进阶纪录单独保存。' : '按原规则轻松开局，也可切换进阶挑战。';
      target.insertBefore(note, anchor || null);
    }
    labelButtons(panel);
  }
  function notify(text) {
    var el = document.getElementById('ui-assist-toast');
    if (!el) { el = document.createElement('div'); el.id = 'ui-assist-toast'; el.className = 'ui-mode-status'; el.setAttribute('role', 'status'); el.style.cssText = 'position:fixed;bottom:18px;left:16px;right:16px;z-index:200;padding:14px'; document.body.appendChild(el); }
    el.textContent = text; el.hidden = false;
    clearTimeout(notify.timer); notify.timer = setTimeout(function () { el.hidden = true; }, 2000);
  }
  function assistEvent(event) {
    if (!expert) return;
    var b = event.target.closest('button'); if (!b || b.closest('.ui-mode')) return;
    var kind = /^(hintBtn|hintTopBtn|btnHint)$/i.test(b.id) ? 'hint' : /^(undoBtn|undoTopBtn|btnUndo)$/i.test(b.id) || /悔一步|撤销/.test(b.textContent) ? 'undo' : '';
    if (!kind) return;
    var prev = gesture.get(b), blocked;
    if (event.type === 'click' && prev && performance.now() - prev.at < 1000) blocked = prev.blocked;
    else { blocked = used[kind] >= limits[kind]; if (!blocked) used[kind]++; gesture.set(b, { at: performance.now(), blocked: blocked }); }
    if (blocked) { event.preventDefault(); event.stopImmediatePropagation(); notify(kind === 'hint' ? '本次挑战的 1 次提示已用完' : '本次挑战的 3 次撤销已用完'); }
  }
  document.addEventListener('pointerdown', assistEvent, true);
  document.addEventListener('click', assistEvent, true);
  document.addEventListener('click', function (event) {
    var b = event.target.closest('button');
    if (b && /^(startBtn|btnStart|restartBtn|againBtn|retryBtn|btnAgain|btnRestart|playAgain)$/i.test(b.id)) used = { hint: 0, undo: 0 };
  }, true);
  document.addEventListener('DOMContentLoaded', function () {
    var selector = '.overlay,.ov,#ov,#overlay,#pauseOv,.screen';
    document.querySelectorAll(selector).forEach(function (container) {
      decorate(container);
      // Only dynamic overlay children are observed; animated scores never trigger this work.
      new MutationObserver(function () { decorate(container); }).observe(container, { childList: true });
    });
    labelButtons(document);
  });
}());

</script>
<!-- GAME UI END -->
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="title">💎 消消乐</div>
    <div class="tbtns">
      <button class="iconbtn" id="muteBtn">🔊</button>
      <button class="iconbtn" id="hintBtn" title="提示">💡</button>
      <button class="iconbtn" id="pauseBtn">⏸</button>
    </div>
  </div>
  <div class="stats">
    <span>得分<b id="score">0</b></span>
    <span>⏱ <b id="time">60</b>s</span>
    <span>最高<b id="best">0</b></span>
  </div>
  <canvas id="cv" width="480" height="480"></canvas>
  <div id="hintbar"></div>
  <p class="hint">滑动宝石交换位置，3 个连成一线即消除<br>4 连整行/列、5 连或 T/L 型大爆炸 · 60 秒挑战</p>
</div>
<div id="comboTag"></div>

<div class="overlay" id="startScr">
  <h1>💎 消消乐</h1>
  <p>三消连击，爽快消除<br><br>👉 滑动相邻宝石交换位置<br>✨ 3 连消除，4 连整行/列清屏<br>💥 5 连或 T/L 型触发大爆炸<br>🔥 连续消除触发连击加成<br>⏱ 限时 60 秒，冲击最高分！</p>
  <button class="btn primary" id="startBtn">开始游戏</button>
</div>

<div class="overlay hidden" id="pauseScr">
  <h2>⏸ 已暂停</h2>
  <p>宝石们原地待命</p>
  <button class="btn primary" id="resumeBtn">继续</button>
  <button class="btn ghost" id="pauseRetryBtn">重新开始</button>
</div>

<div class="overlay hidden" id="overScr">
  <h1>⏱ 时间到！</h1>
  <div class="statline"><span>得分 <b id="oScore">0</b></span><span>最高 <b id="oBest">0</b></span></div>
  <p id="oNew" style="color:#ffd54f;font-weight:700"></p>
  <button class="btn primary" id="retryBtn">再来一局</button>
</div>

<script>
/* GAMEPLAY UPGRADE */
'use strict';
/* ============ 工具 ============ */
const $=id=>document.getElementById(id);
function lsGet(k,d){try{const v=GameUI.storageGet(k);return v==null?d:JSON.parse(v);}catch(e){return d;}}
function lsSet(k,v){try{GameUI.storageSet(k,JSON.stringify(v));}catch(e){}}
function buzz(ms){try{if(window.NativeBridge&&window.NativeBridge.vibrate)window.NativeBridge.vibrate(ms||50);}catch(e){}}
const easeInOut=t=>t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const easeOutCubic=t=>1-Math.pow(1-t,3);

/* ============ 音效 ============ */
const Snd={
  ctx:null,
  get muted(){return lsGet('jewel_mute',false);},
  set muted(v){lsSet('jewel_mute',v);},
  ensure(){
    if(!this.ctx){try{this.ctx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
    if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();
  },
  tone(f,dur,type,vol,delay,slideTo){
    if(this.muted)return;this.ensure();if(!this.ctx)return;
    const t=this.ctx.currentTime+(delay||0);
    const o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.type=type||'sine';o.frequency.setValueAtTime(f,t);
    if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,t+dur);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol||0.16,t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);g.connect(this.ctx.destination);
    o.start(t);o.stop(t+dur+0.05);
  },
  swap(){this.tone(500,0.07,'triangle',0.1,0,700);},
  deny(){this.tone(180,0.12,'square',0.08);},
  clear(combo){const b=440+combo*90;this.tone(b,0.12,'sine',0.14,0,b*1.5);this.tone(b*1.5,0.1,'sine',0.08,0.05);},
  special(){const self=this;[660,880,1174,1568].forEach((f,i)=>self.tone(f,0.14,'triangle',0.12,i*0.06));},
  tick(){this.tone(880,0.05,'square',0.06);},
  over(){const self=this;[523,392,330,262].forEach((f,i)=>self.tone(f,0.25,'triangle',0.13,i*0.16));},
  click(){this.tone(660,0.06,'square',0.08);}
};

/* ============ 棋盘 ============ */
const N=8,SZ=480,CELL=SZ/N,NT=6;
const cv=$('cv'),g=cv.getContext('2d');
const GCOLS=[['#ff8a80','#e53935'],['#ffcc80','#fb8c00'],['#fff59d','#f9a825'],['#a5d6a7','#43a047'],['#90caf9','#1e88e5'],['#ce93d8','#8e24aa']];
let board=[];
let busy=false,playing=false,paused=false,over=false;
let score=0,remain=GameUI.pick(60,45),best=lsGet('jewel_best',0);
let tweens=[],parts=[],floats=[],flashes=[];
let raf=0,lastT=0,lastTickSec=60;
let sel=null,hintMove=null,lastActT=0;
let gid=0;

function cellXY(x,y){return [(x+0.5)*CELL,(y+0.5)*CELL];}
function mkGem(t,x,y){
  const p=cellXY(x,y);
  return {t:t,px:p[0],py:p[1],sc:1,alpha:1,id:gid++,x:x,y:y};
}
function genBoard(){
  let guard=0;
  do{
    board=[];
    for(let y=0;y<N;y++){board.push([]);
      for(let x=0;x<N;x++){
        let t;
        do{t=(Math.random()*NT)|0;}
        while((x>=2&&board[y][x-1].t===t&&board[y][x-2].t===t)||
              (y>=2&&board[y-1][x].t===t&&board[y-2][x].t===t));
        board[y][x]=mkGem(t,x,y);
      }
    }
    guard++;
  }while((findMatches()||!findMove())&&guard<300);
}
function matchAt(x,y){
  const t=board[y][x].t;let c=1;
  for(let i=x-1;i>=0&&board[y][i].t===t;i--)c++;
  for(let i=x+1;i<N&&board[y][i].t===t;i++)c++;
  if(c>=3)return true;c=1;
  for(let i=y-1;i>=0&&board[i][x].t===t;i--)c++;
  for(let i=y+1;i<N&&board[i][x].t===t;i++)c++;
  return c>=3;
}
function findMatches(){
  const runs=[];
  for(let y=0;y<N;y++){let x=0;
    while(x<N){const t=board[y][x].t;let x2=x;while(x2<N&&board[y][x2].t===t)x2++;
      if(x2-x>=3){const cells=[];for(let i=x;i<x2;i++)cells.push([i,y]);runs.push({dir:'h',fixed:y,cells:cells,len:x2-x});}
      x=x2;}}
  for(let x=0;x<N;x++){let y=0;
    while(y<N){const t=board[y][x].t;let y2=y;while(y2<N&&board[y2][x].t===t)y2++;
      if(y2-y>=3){const cells=[];for(let i=y;i<y2;i++)cells.push([x,i]);runs.push({dir:'v',fixed:x,cells:cells,len:y2-y});}
      y=y2;}}
  if(!runs.length)return null;
  const clear=new Set(),specials=[],consumed=new Set();
  const hMap={},vMap={};
  runs.forEach(r=>r.cells.forEach(c=>{if(r.dir==='h')hMap[c[0]+','+c[1]]=r;else vMap[c[0]+','+c[1]]=r;}));
  for(const k in hMap)if(vMap[k]){
    const xy=k.split(','),x=+xy[0],y=+xy[1];
    specials.push({kind:'bomb',x:x,y:y});
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
      const nx=x+dx,ny=y+dy;
      if(nx>=0&&ny>=0&&nx<N&&ny<N)clear.add(nx+','+ny);
    }
    hMap[k].cells.forEach(c=>clear.add(c[0]+','+c[1]));
    vMap[k].cells.forEach(c=>clear.add(c[0]+','+c[1]));
    consumed.add(hMap[k]);consumed.add(vMap[k]);
  }
  runs.forEach(r=>{
    if(consumed.has(r))return;
    if(r.len>=5){
      const mid=r.cells[r.len>>1];
      specials.push({kind:'cross',x:mid[0],y:mid[1]});
      for(let i=0;i<N;i++){clear.add(i+','+mid[1]);clear.add(mid[0]+','+i);}
    }else if(r.len===4){
      specials.push({kind:'line',dir:r.dir,fixed:r.fixed});
      for(let i=0;i<N;i++)clear.add(r.dir==='h'?(i+','+r.fixed):(r.fixed+','+i));
    }else r.cells.forEach(c=>clear.add(c[0]+','+c[1]));
  });
  const list=[];clear.forEach(k=>{const xy=k.split(',');list.push([+xy[0],+xy[1]]);});
  return {clear:list,specials:specials};
}
function findMove(){
  const dirs=[[1,0],[0,1]];
  for(let y=0;y<N;y++)for(let x=0;x<N;x++)for(let di=0;di<2;di++){
    const nx=x+dirs[di][0],ny=y+dirs[di][1];
    if(nx>=N||ny>=N)continue;
    const a=board[y][x];board[y][x]=board[ny][nx];board[ny][nx]=a;
    const ok=matchAt(x,y)||matchAt(nx,ny);
    board[ny][nx]=board[y][x];board[y][x]=a;
    if(ok)return {ax:x,ay:y,bx:nx,by:ny};
  }
  return null;
}

/* ============ 补间 ============ */
function tween(gem,tx,ty,dur,ease,delay,onDone,scaleTo){
  tweens.push({gem:gem,fx:gem.px,fy:gem.py,tx:tx,ty:ty,t:-(delay||0),dur:dur,ease:ease||easeInOut,onDone:onDone,scaleTo:scaleTo});
}
function swapGems(A,B,dur,cb){
  const ax=A.px,ay=A.py,bx=B.px,by=B.py;
  let n=0;
  const done=function(){
    n++;
    if(n===2){
      const t1=board[A.y][A.x];board[A.y][A.x]=board[B.y][B.x];board[B.y][B.x]=t1;
      const tx=A.x;A.x=B.x;B.x=tx;const ty=A.y;A.y=B.y;B.y=ty;
      if(cb)cb();
    }
  };
  tween(A,bx,by,dur,easeInOut,0,done);
  tween(B,ax,ay,dur,easeInOut,0,done);
}

/* ============ 消除流程 ============ */
function playerSwap(ax,ay,bx,by){
  if(busy||over||paused||!playing)return;
  busy=true;sel=null;hintMove=null;lastActT=performance.now();
  Snd.swap();
  const A=board[ay][ax],B=board[by][bx];
  swapGems(A,B,0.16,function(){
    const res=findMatches();
    if(!res){
      Snd.deny();
      swapGems(A,B,0.18,function(){busy=false;});
    }else resolveLoop(1);
  });
}
function resolveLoop(combo){
  const res=findMatches();
  if(!res){
    busy=false;
    if(!findMove()){
      reshuffle();
      floats.push({x:SZ/2,y:SZ/2,txt:'洗牌！',life:1.2,max:1.2,c:'#ffd54f'});
    }
    return;
  }
  let pts=res.clear.length*10*combo;
  res.specials.forEach(s=>{pts+=s.kind==='bomb'?120:(s.kind==='cross'?200:60);});
  score+=pts;$('score').textContent=score;
  res.specials.forEach(s=>flashes.push({kind:s.kind,x:s.x,y:s.y,fixed:s.fixed,dir:s.dir,t:0}));
  let sx=0,sy=0;
  res.clear.forEach(c=>{sx+=c[0];sy+=c[1];});
  const n=res.clear.length||1;
  floats.push({x:(sx/n+0.5)*CELL,y:(sy/n+0.5)*CELL,txt:'+'+pts,life:0.9,max:0.9,c:'#ffd54f'});
  if(combo>=2){
    const tag=$('comboTag');
    tag.textContent='连击 x'+combo+'!';
    tag.classList.add('show');
    setTimeout(function(){tag.classList.remove('show');},700);
  }
  if(res.specials.length){Snd.special();buzz(60);}else{Snd.clear(combo);buzz(30);}
  res.clear.forEach(c=>{
    const gem=board[c[1]][c[0]];
    const col=GCOLS[gem.t][1];
    for(let i=0;i<4;i++)parts.push({x:gem.px,y:gem.py,vx:(Math.random()-0.5)*260,vy:(Math.random()-0.5)*260-60,life:0.55,max:0.55,c:col,s:2+Math.random()*3,grav:300});
  });
  const clearedGems=res.clear.map(c=>board[c[1]][c[0]]);
  let doneN=0;
  clearedGems.forEach(function(gem){
    tween(gem,gem.px,gem.py,0.22,easeInOut,0,function(){
      doneN++;
      if(doneN===clearedGems.length)collapse(combo);
    },0);
  });
}
function collapse(combo){
  const jobs=[];
  for(let x=0;x<N;x++){
    let w=N-1;
    for(let y=N-1;y>=0;y--){
      const gem=board[y][x];
      if(gem&&gem.sc>0.01){
        if(w!==y){
          board[w][x]=gem;board[y][x]=null;gem.x=x;gem.y=w;
          const p=cellXY(x,w);
          jobs.push({gem:gem,tx:p[0],ty:p[1],delay:(N-1-w)*0.03});
        }
        w--;
      }else{
        board[y][x]=null;
      }
    }
    for(let y=w;y>=0;y--){
      const gem=mkGem((Math.random()*NT)|0,x,y);
      const p=cellXY(x,y);
      gem.py=p[1]-(w-y+1)*CELL-CELL*0.5;
      board[y][x]=gem;
      jobs.push({gem:gem,tx:p[0],ty:p[1],delay:0.02*(w-y)});
    }
  }
  if(!jobs.length){resolveLoop(combo+1);return;}
  let n=0;
  jobs.forEach(function(j){
    tween(j.gem,j.tx,j.ty,0.32,easeOutCubic,j.delay,function(){
      n++;
      if(n===jobs.length)resolveLoop(combo+1);
    });
  });
}
function reshuffle(){
  const types=[];
  for(let y=0;y<N;y++)for(let x=0;x<N;x++)types.push(board[y][x].t);
  let guard=0;
  do{
    for(let i=types.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;const t=types[i];types[i]=types[j];types[j]=t;}
    let k=0;
    for(let y=0;y<N;y++)for(let x=0;x<N;x++){
      const gem=board[y][x];gem.t=types[k++];
      const p=cellXY(x,y);gem.px=p[0];gem.py=p[1];gem.sc=1;
    }
    guard++;
  }while((findMatches()||!findMove())&&guard<200);
}

/* ============ 主循环 ============ */
function loop(t){
  raf=requestAnimationFrame(loop);
  const dt=Math.min(0.05,(t-lastT)/1000);lastT=t;
  if(playing&&!paused&&!over){
    remain-=dt;
    const s=Math.max(0,Math.ceil(remain));
    if(s!==lastTickSec){lastTickSec=s;$('time').textContent=s;
      if(s<=10)$('time').classList.add('hot');else $('time').classList.remove('hot');
      if(s<=10&&s>0)Snd.tick();}
    if(remain<=0)gameOver();
    if(!busy&&performance.now()-lastActT>7000&&!hintMove)hintMove=findMove();
  }
  for(let i=tweens.length-1;i>=0;i--){
    const tw=tweens[i];tw.t+=dt;
    if(tw.t<0)continue;
    const f=Math.min(1,tw.t/tw.dur),e=tw.ease(f);
    tw.gem.px=tw.fx+(tw.tx-tw.fx)*e;
    tw.gem.py=tw.fy+(tw.ty-tw.fy)*e;
    if(tw.scaleTo!==undefined)tw.gem.sc=1+(tw.scaleTo-1)*e;
    if(f>=1){tweens.splice(i,1);if(tw.onDone)tw.onDone();}
  }
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];p.life-=dt;
    if(p.life<=0){parts.splice(i,1);continue;}
    p.vy+=(p.grav||0)*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
  }
  for(let i=floats.length-1;i>=0;i--){const f=floats[i];f.life-=dt;f.y-=40*dt;if(f.life<=0)floats.splice(i,1);}
  for(let i=flashes.length-1;i>=0;i--){flashes[i].t+=dt;if(flashes[i].t>0.4)flashes.splice(i,1);}
  render();
}
function stopLoop(){if(raf)cancelAnimationFrame(raf);raf=0;}
function startLoop(){stopLoop();lastT=performance.now();raf=requestAnimationFrame(loop);}
function gameOver(){
  over=true;playing=false;stopLoop();
  Snd.over();buzz(100);
  const isNew=score>best;
  if(isNew){best=score;lsSet('jewel_best',best);}
  $('oScore').textContent=score;$('oBest').textContent=best;
  $('oNew').textContent=isNew?'🏆 新纪录！':'';
  $('overScr').classList.remove('hidden');
}
function newGame(){
  stopLoop();
  genBoard();
  busy=false;over=false;paused=false;
  score=0;remain=GameUI.pick(60,45);lastTickSec=60;
  tweens=[];parts=[];floats=[];flashes=[];
  sel=null;hintMove=null;lastActT=performance.now();
  $('score').textContent='0';$('time').textContent='60';
  $('time').classList.remove('hot');
  $('best').textContent=best;
  ['startScr','pauseScr','overScr'].forEach(id=>$(id).classList.add('hidden'));
  playing=true;
  startLoop();
}

/* ============ 绘制 ============ */
function gemPath(t,s){
  g.beginPath();
  if(t===0){g.arc(0,0,s*0.42,0,Math.PI*2);}
  else if(t===1){g.moveTo(0,-s*0.46);g.lineTo(s*0.36,0);g.lineTo(0,s*0.46);g.lineTo(-s*0.36,0);g.closePath();}
  else if(t===2){g.moveTo(0,-s*0.46);g.lineTo(s*0.42,s*0.34);g.lineTo(-s*0.42,s*0.34);g.closePath();}
  else if(t===3){for(let i=0;i<6;i++){const a=Math.PI/3*i-Math.PI/6;const px=Math.cos(a)*s*0.44,py=Math.sin(a)*s*0.44;if(i)g.lineTo(px,py);else g.moveTo(px,py);}g.closePath();}
  else if(t===4){for(let i=0;i<10;i++){const r=i%2?s*0.2:s*0.46;const a=-Math.PI/2+i*Math.PI/5;const px=Math.cos(a)*r,py=Math.sin(a)*r;if(i)g.lineTo(px,py);else g.moveTo(px,py);}g.closePath();}
  else{const r=s*0.42,cr=s*0.14;g.moveTo(-r+cr,-r);g.arcTo(r,-r,r,r,cr);g.arcTo(r,r,-r,r,cr);g.arcTo(-r,r,-r,-r,cr);g.arcTo(-r,-r,r,-r,cr);g.closePath();}
}
function drawGem(gem){
  const s=CELL*0.86*gem.sc;
  if(s<1||gem.alpha<=0)return;
  g.save();
  g.globalAlpha=gem.alpha;
  g.translate(gem.px,gem.py);
  const lite=GCOLS[gem.t][0],base=GCOLS[gem.t][1];
  const gr=g.createRadialGradient(-s*0.25,-s*0.3,s*0.08,0,0,s*0.55);
  gr.addColorStop(0,lite);gr.addColorStop(1,base);
  gemPath(gem.t,s);
  g.fillStyle=gr;g.fill();
  g.strokeStyle='rgba(255,255,255,0.25)';g.lineWidth=1.5;g.stroke();
  g.fillStyle='rgba(255,255,255,0.55)';
  g.beginPath();g.ellipse(-s*0.16,-s*0.2,s*0.1,s*0.06,-0.6,0,Math.PI*2);g.fill();
  g.restore();
}
function render(){
  g.clearRect(0,0,SZ,SZ);
  g.fillStyle='#1d1029';
  g.beginPath();
  if(g.roundRect)g.roundRect(0,0,SZ,SZ,16);else g.rect(0,0,SZ,SZ);
  g.fill();
  g.save();
  g.beginPath();
  if(g.roundRect)g.roundRect(0,0,SZ,SZ,16);else g.rect(0,0,SZ,SZ);
  g.clip();
  for(let y=0;y<N;y++)for(let x=0;x<N;x++)
    if((x+y)%2===0){g.fillStyle='rgba(255,255,255,0.03)';g.fillRect(x*CELL,y*CELL,CELL,CELL);}
  for(let fi=0;fi<flashes.length;fi++){
    const f=flashes[fi],a=1-f.t/0.4;
    g.fillStyle='rgba(255,255,255,'+(0.55*a)+')';
    if(f.kind==='line'){
      if(f.dir==='h')g.fillRect(0,f.fixed*CELL,SZ,CELL);
      else g.fillRect(f.fixed*CELL,0,CELL,SZ);
    }else if(f.kind==='cross'){
      g.fillRect(0,f.y*CELL,SZ,CELL);g.fillRect(f.x*CELL,0,CELL,SZ);
    }else{
      g.fillRect((f.x-1)*CELL,(f.y-1)*CELL,CELL*3,CELL*3);
    }
  }
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const gem=board[y]&&board[y][x];
    if(gem)drawGem(gem);
  }
  if(sel){
    const gem=board[sel.y]&&board[sel.y][sel.x];
    if(gem){g.strokeStyle='#fff';g.lineWidth=3;g.setLineDash([8,6]);
      g.beginPath();g.arc(gem.px,gem.py,CELL*0.44,0,Math.PI*2);g.stroke();g.setLineDash([]);}
  }
  if(hintMove&&!busy){
    const a=0.4+0.3*Math.sin(performance.now()/180);
    g.strokeStyle='rgba(255,213,79,'+a+')';g.lineWidth=3;
    const pts=[[hintMove.ax,hintMove.ay],[hintMove.bx,hintMove.by]];
    for(let i=0;i<2;i++){
      const p=cellXY(pts[i][0],pts[i][1]);
      g.beginPath();g.arc(p[0],p[1],CELL*0.44,0,Math.PI*2);g.stroke();
    }
  }
  for(let i=0;i<parts.length;i++){
    const p=parts[i];
    g.globalAlpha=Math.max(0,p.life/p.max);
    g.fillStyle=p.c;
    g.beginPath();g.arc(p.x,p.y,p.s,0,Math.PI*2);g.fill();
  }
  g.globalAlpha=1;
  g.textAlign='center';
  for(let i=0;i<floats.length;i++){
    const f=floats[i];
    g.globalAlpha=Math.max(0,f.life/f.max);
    g.fillStyle=f.c;g.font='bold 26px sans-serif';
    g.strokeStyle='rgba(0,0,0,0.6)';g.lineWidth=4;g.strokeText(f.txt,f.x,f.y);
    g.fillText(f.txt,f.x,f.y);
  }
  g.globalAlpha=1;
  g.restore();
}

/* ============ 输入 ============ */
let lastTouch=0,dragStart=null;
function evtCell(e){
  const r=cv.getBoundingClientRect();
  const px=(e.clientX-r.left)/r.width*SZ,py=(e.clientY-r.top)/r.height*SZ;
  const x=(px/CELL)|0,y=(py/CELL)|0;
  if(x<0||y<0||x>=N||y>=N)return null;
  return {x:x,y:y,px:px,py:py};
}
function onDown(e){
  if(!playing||paused||over||busy)return;
  const c=evtCell(e);if(!c)return;
  dragStart={c:c};
}
function onMove(e){
  if(!dragStart||busy||!playing||paused||over)return;
  const c=evtCell(e);if(!c)return;
  const ox=(dragStart.c.x+0.5)*CELL,oy=(dragStart.c.y+0.5)*CELL;
  const sx=c.px-ox,sy=c.py-oy;
  if(Math.abs(sx)>CELL*0.45||Math.abs(sy)>CELL*0.45){
    let nx=dragStart.c.x,ny=dragStart.c.y;
    if(Math.abs(sx)>Math.abs(sy))nx+=sx>0?1:-1;else ny+=sy>0?1:-1;
    const sx0=dragStart.c.x,sy0=dragStart.c.y;
    dragStart=null;
    if(nx>=0&&ny>=0&&nx<N&&ny<N)playerSwap(sx0,sy0,nx,ny);
  }
}
function onUp(e){
  if(!dragStart)return;
  dragStart=null;
  if(!playing||paused||over||busy)return;
  const c=evtCell(e);if(!c)return;
  if(sel&&Math.abs(sel.x-c.x)+Math.abs(sel.y-c.y)===1){
    const s=sel;sel=null;
    playerSwap(s.x,s.y,c.x,c.y);
  }else{
    sel=(sel&&sel.x===c.x&&sel.y===c.y)?null:{x:c.x,y:c.y};
    Snd.click();
  }
  lastActT=performance.now();hintMove=null;
}
cv.addEventListener('touchstart',function(e){e.preventDefault();lastTouch=Date.now();Snd.ensure();onDown(e.touches[0]);},{passive:false});
cv.addEventListener('touchmove',function(e){e.preventDefault();onMove(e.touches[0]);},{passive:false});
cv.addEventListener('touchend',function(e){e.preventDefault();onUp(e.changedTouches[0]);},{passive:false});
cv.addEventListener('mousedown',function(e){if(Date.now()-lastTouch<600)return;Snd.ensure();onDown(e);});
cv.addEventListener('mousemove',function(e){if(Date.now()-lastTouch<600)return;onMove(e);});
cv.addEventListener('mouseup',function(e){if(Date.now()-lastTouch<600)return;onUp(e);});

/* ============ 界面 ============ */
$('startBtn').addEventListener('click',function(){Snd.ensure();Snd.click();buzz(30);newGame();});
$('retryBtn').addEventListener('click',function(){Snd.click();buzz(30);newGame();});
$('pauseBtn').addEventListener('click',function(){
  if(!playing||paused||over)return;
  Snd.click();paused=true;stopLoop();$('pauseScr').classList.remove('hidden');
});
$('resumeBtn').addEventListener('click',function(){
  Snd.click();$('pauseScr').classList.add('hidden');paused=false;lastActT=performance.now();startLoop();
});
$('pauseRetryBtn').addEventListener('click',function(){Snd.click();$('pauseScr').classList.add('hidden');newGame();});
function refreshMute(){$('muteBtn').textContent=Snd.muted?'🔇':'🔊';}
$('muteBtn').addEventListener('click',function(){Snd.ensure();Snd.muted=!Snd.muted;refreshMute();if(!Snd.muted)Snd.click();});
/* ---------- 提示：复用 findMove 找一个合法交换并高亮 ---------- */
$('hintBtn').addEventListener('click',function(){
  if(busy)return;
  Snd.ensure();Snd.click();
  const mv=findMove();
  if(!mv){$('hintbar').textContent='💡 暂无可用走法，稍后再试';return;}
  hintMove=mv;lastActT=performance.now();
  const a=board[mv.ay][mv.ax];board[mv.ay][mv.ax]=board[mv.by][mv.bx];board[mv.by][mv.bx]=a;
  const res=findMatches();
  board[mv.by][mv.bx]=board[mv.ay][mv.ax];board[mv.ay][mv.ax]=a;
  const n=res?res.clear.length:0;
  $('hintbar').textContent='💡 提示：交换两颗高亮宝石，可消除 '+n+' 颗！';
  clearTimeout($('hintbar')._t);
  $('hintbar')._t=setTimeout(function(){$('hintbar').textContent='';},3000);
});
refreshMute();
$('best').textContent=best;
document.addEventListener('visibilitychange',function(){if(document.hidden&&playing&&!paused&&!over)$('pauseBtn').click();});
genBoard();
render();
</script>
