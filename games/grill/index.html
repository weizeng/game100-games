<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>烧烤王</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;overflow:hidden;background:#0d0d1a;color:#f5f5f5;font-family:"PingFang SC","Microsoft YaHei",sans-serif;touch-action:manipulation}
#app{max-width:480px;height:100%;margin:0 auto;display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% -10%,#2a1a2e 0%,#0d0d1a 60%)}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:rgba(0,0,0,.45);border-bottom:2px solid #c0392b}
.hinfo{text-align:center}
.hinfo .lab{font-size:11px;color:#aaa}
.hinfo .val{font-size:20px;font-weight:700;color:#ffb347}
.hbtn{width:44px;height:44px;font-size:22px;background:#222;border:1px solid #555;border-radius:10px;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
.hbtn:active{transform:scale(.92)}
#timerwrap{height:10px;background:#1a1a2e;margin:8px 12px 0;border-radius:5px;overflow:hidden}
#timerbar{height:100%;width:100%;background:linear-gradient(90deg,#e74c3c,#f39c12);border-radius:5px;transition:width .2s linear}
#skewers{flex:1;overflow:hidden;display:flex;flex-direction:column;gap:10px;padding:12px;justify-content:center}
.sk{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.05);border:2px solid #444;border-radius:14px;padding:10px;cursor:pointer;transition:border-color .2s,box-shadow .2s,transform .1s;position:relative;overflow:hidden}
.sk:active{transform:scale(.98)}
.sk .em{font-size:44px;flex-shrink:0;filter:drop-shadow(0 0 6px rgba(255,120,40,.6))}
.sk .bars{flex:1;display:flex;flex-direction:column;gap:8px}
.side{display:flex;align-items:center;gap:6px}
.sidelabel{font-size:12px;color:#bbb;width:34px;flex-shrink:0}
.sidelabel.hot{color:#ff9f43;font-weight:700}
.bar{flex:1;height:22px;background:linear-gradient(to right,#2c2c44 0%,#2c2c44 54%,rgba(46,204,113,.45) 55%,rgba(46,204,113,.45) 80%,#2c2c44 81%,#2c2c44 94%,rgba(231,76,60,.65) 95%,rgba(231,76,60,.65) 100%);border-radius:11px;position:relative;overflow:hidden;border:1px solid #555}
.fill{position:absolute;left:0;top:0;bottom:0;width:0%;background:linear-gradient(90deg,#f1c40f,#e67e22,#c0392b);border-radius:11px;transition:width .08s linear}
.fill.frozen{background:linear-gradient(90deg,#7f8c8d,#95a5a6);opacity:.75}
.pct{font-size:12px;color:#ddd;width:38px;text-align:right;flex-shrink:0;font-variant-numeric:tabular-nums}
.badge{font-size:13px;font-weight:700;color:#2ecc71;min-width:64px;text-align:center;flex-shrink:0}
.sk.ready{border-color:#2ecc71;box-shadow:0 0 14px rgba(46,204,113,.55);animation:glow 1s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 8px rgba(46,204,113,.4)}50%{box-shadow:0 0 18px rgba(46,204,113,.8)}}
.sk.burnt{border-color:#e74c3c;background:rgba(120,20,20,.35)}
.sk.burnt .em{filter:grayscale(1) brightness(.6)}
.sk .burntag{font-size:30px}
#controls{padding:10px 12px 16px;display:flex;flex-direction:column;gap:8px;background:rgba(0,0,0,.45);border-top:2px solid #c0392b}
#serveBtn{height:58px;font-size:22px;font-weight:800;border:none;border-radius:14px;background:linear-gradient(180deg,#e67e22,#c0392b);color:#fff;cursor:pointer;box-shadow:0 4px 0 #7b241c}
#serveBtn:active{transform:translateY(3px);box-shadow:0 1px 0 #7b241c}
#serveBtn.shake{animation:shk .3s}
@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#burnrow{display:flex;justify-content:center;gap:6px;font-size:16px;color:#e74c3c}
.overlay{position:fixed;inset:0;background:rgba(5,5,15,.92);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.overlay.hidden{display:none}
.panel{background:#1a1a2e;border:2px solid #c0392b;border-radius:18px;padding:26px 22px;max-width:400px;width:100%;text-align:center;box-shadow:0 0 30px rgba(192,57,43,.35)}
.panel h1{font-size:34px;margin-bottom:6px}
.panel h2{font-size:24px;margin-bottom:10px;color:#ffb347}
.panel p{font-size:14px;color:#ccc;line-height:1.8;margin-bottom:14px;text-align:left}
.panel .big{font-size:44px;font-weight:800;color:#f1c40f;margin:8px 0}
.bigbtn{display:block;width:100%;height:54px;margin-top:10px;font-size:20px;font-weight:800;border:none;border-radius:14px;background:linear-gradient(180deg,#e67e22,#c0392b);color:#fff;cursor:pointer;box-shadow:0 4px 0 #7b241c}
.bigbtn:active{transform:translateY(3px);box-shadow:none}
.float{position:fixed;font-size:26px;font-weight:800;pointer-events:none;z-index:60;animation:floatUp 1s ease-out forwards}
@keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-70px) scale(1.3)}}
.spark{position:fixed;font-size:18px;pointer-events:none;z-index:60;animation:sparkFly .9s ease-out forwards}
@keyframes sparkFly{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.4)}}
.tips{font-size:12px;color:#888;margin-top:10px;line-height:1.7}
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="hbtn" id="muteBtn" aria-label="静音">🔊</button>
    <div class="hinfo"><div class="lab">得分</div><div class="val" id="score">0</div></div>
    <div class="hinfo"><div class="lab">⏱剩余</div><div class="val" id="time">60</div></div>
    <div class="hinfo"><div class="lab">🏆最高</div><div class="val" id="best">0</div></div>
    <button class="hbtn" id="pauseBtn" aria-label="暂停">⏸</button>
  </header>
  <div id="timerwrap"><div id="timerbar"></div></div>
  <div id="skewers"></div>
  <div id="controls">
    <button id="serveBtn">🍽️ 出串！</button>
    <div id="burnrow">烤焦：<span id="burns">💀 0 / 3</span></div>
  </div>
</div>

<div class="overlay" id="startOv">
  <div class="panel">
    <h1>🍢 烧烤王</h1>
    <p>🔥 4 根烤串同时在烤架上，每根有两面，熟度条上涨速度各不相同！<br>
    👆 <b>点击烤串 = 翻面</b>：当前面熟度冻结，换另一面继续涨。<br>
    ✅ 两面熟度都落在<b style="color:#2ecc71">绿色完美区</b>时，按「出串」得分 +100！<br>
    ⚠️ 任一面超过<b style="color:#e74c3c">红色焦线</b>就烤焦了，3 次烤焦提前结束。<br>
    ⏱ 60 秒内比总分，翻面要快、眼要准！</p>
    <button class="bigbtn" id="startBtn">开始烧烤！</button>
    <div class="tips">熟度条背景：绿色=完美区，红色=焦线</div>
  </div>
</div>

<div class="overlay hidden" id="pauseOv">
  <div class="panel">
    <h2>⏸ 已暂停</h2>
    <p style="text-align:center">烤架已熄火，串还热着～</p>
    <button class="bigbtn" id="resumeBtn">继续烤！</button>
  </div>
</div>

<div class="overlay hidden" id="endOv">
  <div class="panel">
    <h2 id="endTitle">⏰ 时间到！</h2>
    <div class="big" id="finalScore">0</div>
    <p style="text-align:center">🏆 历史最高：<b id="finalBest">0</b></p>
    <button class="bigbtn" id="retryBtn">再来一局！</button>
  </div>
</div>

<script>
'use strict';
var $=function(id){return document.getElementById(id);};
var PERFECT_LO=55,PERFECT_HI=80,BURN_LINE=95,GAME_TIME=60,MAX_BURN=3;
var skewers=[],score=0,burnt=0,timeLeft=GAME_TIME,running=false,paused=false,lastTs=0;
var muted=localStorage.getItem('g100_mute')==='1';
var audioCtx=null;
var HS_KEY='g100_grill_hs';
var best=parseInt(localStorage.getItem(HS_KEY)||'0',10)||0;

function ac(){
  if(!audioCtx){try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return null;}}
  if(audioCtx&&audioCtx.state==='suspended'){audioCtx.resume();}
  return audioCtx;
}
function tone(f,d,type,delay,slideTo){
  if(muted)return;
  var c=ac();if(!c)return;
  var t=c.currentTime+(delay||0);
  var o=c.createOscillator(),g=c.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(slideTo){o.frequency.exponentialRampToValueAtTime(slideTo,t+d);}
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(0.25,t+0.015);
  g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(c.destination);
  o.start(t);o.stop(t+d+0.05);
}
function sfx(n){
  if(muted)return;
  if(n==='flip'){tone(520,0.06,'square');}
  else if(n==='serve'){tone(880,0.12,'sine');tone(1320,0.18,'sine',0.1);}
  else if(n==='burn'){tone(220,0.4,'sawtooth',0,70);}
  else if(n==='empty'){tone(300,0.12,'triangle');}
  else if(n==='click'){tone(660,0.05,'sine');}
  else if(n==='win'){var f=[523,659,784,1047];for(var i=0;i<f.length;i++){tone(f[i],0.22,'sine',i*0.14);}}
  else if(n==='tick'){tone(1000,0.05,'sine');}
}
function vibrate(p){try{if(navigator.vibrate){navigator.vibrate(p);}}catch(e){}}
function setMute(m){
  muted=m;
  localStorage.setItem('g100_mute',m?'1':'0');
  $('muteBtn').textContent=m?'🔇':'🔊';
}

function rnd(a,b){return a+Math.random()*(b-a);}
function newSkewer(i){
  skewers[i]={don:[0,0],rate:[rnd(5,11),rnd(5,11)],act:0,state:'cook',respawnAt:0};
}
function buildCards(){
  var wrap=$('skewers');wrap.innerHTML='';
  for(var i=0;i<4;i++){
    (function(i){
      var d=document.createElement('div');
      d.className='sk';d.id='sk'+i;
      d.innerHTML='<div class="em">🍢</div><div class="bars">'+
        '<div class="side"><span class="sidelabel" id="lab'+i+'a">正面</span><div class="bar"><div class="fill" id="fill'+i+'a"></div></div><span class="pct" id="pct'+i+'a">0%</span></div>'+
        '<div class="side"><span class="sidelabel" id="lab'+i+'b">反面</span><div class="bar"><div class="fill" id="fill'+i+'b"></div></div><span class="pct" id="pct'+i+'b">0%</span></div>'+
        '</div><div class="badge" id="badge'+i+'"></div>';
      d.addEventListener('pointerdown',function(e){e.preventDefault();flip(i);});
      wrap.appendChild(d);
    })(i);
  }
}
function flip(i){
  if(!running||paused)return;
  var s=skewers[i];
  if(s.state!=='cook'&&s.state!=='ready')return;
  s.act=1-s.act;
  sfx('flip');vibrate(12);
  var el=$('sk'+i);el.style.transform='scale(.95)';
  setTimeout(function(){el.style.transform='';},110);
}
function floatText(txt,x,y,color){
  var s=document.createElement('div');
  s.className='float';s.textContent=txt;
  s.style.left=x+'px';s.style.top=y+'px';s.style.color=color||'#f1c40f';
  document.body.appendChild(s);
  setTimeout(function(){s.remove();},1000);
}
function sparks(x,y){
  var icons=['✨','🔥','💥'];
  for(var i=0;i<8;i++){
    var s=document.createElement('div');
    s.className='spark';s.textContent=icons[i%3];
    s.style.left=x+'px';s.style.top=y+'px';
    s.style.setProperty('--dx',rnd(-70,70)+'px');
    s.style.setProperty('--dy',rnd(-80,-10)+'px');
    document.body.appendChild(s);
    (function(el){setTimeout(function(){el.remove();},900);})(s);
  }
}
function serve(){
  if(!running||paused)return;
  var ready=[];
  for(var i=0;i<4;i++){if(skewers[i].state==='ready'){ready.push(i);}}
  if(ready.length===0){
    sfx('empty');
    var b=$('serveBtn');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');
    return;
  }
  sfx('serve');vibrate(30);
  for(var j=0;j<ready.length;j++){
    (function(i){
      score+=100;
      var r=$('sk'+i).getBoundingClientRect();
      floatText('+100',r.left+r.width/2-20,r.top+10,'#f1c40f');
      sparks(r.left+r.width/2,r.top+r.height/2);
      var em=$('sk'+i).querySelector('.em');
      em.style.transition='transform .3s ease';em.style.transform='scale(1.6) rotate(20deg)';em.style.opacity='0';
      setTimeout(function(){newSkewer(i);renderSkewer(i);em.style.transition='';em.style.transform='';em.style.opacity='';},350);
      skewers[i].state='wait';
    })(ready[j]);
  }
  $('score').textContent=score;
}
function burnSkewer(i){
  var s=skewers[i];
  s.state='burnt';burnt++;
  sfx('burn');vibrate([90,40,90]);
  $('burns').textContent='💀 '+burnt+' / '+MAX_BURN;
  var el=$('sk'+i);
  el.classList.add('burnt');
  $('badge'+i).innerHTML='<span class="burntag">💀</span>';
  $('lab'+i+'a').textContent='糊了';$('lab'+i+'b').textContent='糊了';
  var r=el.getBoundingClientRect();
  floatText('烤焦了！',r.left+r.width/2-40,r.top+10,'#e74c3c');
  if(burnt>=MAX_BURN){endGame('💀 烤焦 3 次，收摊了！');return;}
  setTimeout(function(){
    if(!running)return;
    newSkewer(i);renderSkewer(i);
  },1000);
}
function renderSkewer(i){
  var s=skewers[i],el=$('sk'+i);
  el.classList.remove('ready','burnt');
  var sides=['a','b'];
  for(var k=0;k<2;k++){
    var f=$('fill'+i+sides[k]);
    f.style.width=Math.min(100,s.don[k])+'%';
    f.className='fill'+(k!==s.act?' frozen':'');
    $('pct'+i+sides[k]).textContent=Math.round(s.don[k])+'%';
    var lab=$('lab'+i+sides[k]);
    lab.textContent=k===0?'正面':'反面';
    lab.className='sidelabel'+(k===s.act?' hot':'');
  }
  var bd=$('badge'+i);
  if(s.state==='ready'){el.classList.add('ready');bd.textContent='✅出串！';}
  else if(s.state==='cook'){bd.textContent=s.act===0?'🔥烤正面':'🔥烤反面';}
  else{bd.textContent='';}
}
function update(dt){
  timeLeft-=dt;
  if(timeLeft<=10&&timeLeft>0){
    var t=Math.ceil(timeLeft);
    if(t!==update._lastTick){update._lastTick=t;if(t<=5)sfx('tick');}
  }
  if(timeLeft<=0){timeLeft=0;endGame('⏰ 时间到！');return;}
  $('time').textContent=Math.ceil(timeLeft);
  $('timerbar').style.width=(timeLeft/GAME_TIME*100)+'%';
  var needRender=false;
  for(var i=0;i<4;i++){
    var s=skewers[i];
    if(s.state!=='cook'&&s.state!=='ready')continue;
    s.don[s.act]+=s.rate[s.act]*dt;
    if(s.don[s.act]>BURN_LINE){burnSkewer(i);continue;}
    var inA=s.don[0]>=PERFECT_LO&&s.don[0]<=PERFECT_HI;
    var inB=s.don[1]>=PERFECT_LO&&s.don[1]<=PERFECT_HI;
    var was=s.state;
    s.state=(inA&&inB)?'ready':'cook';
    if(was!==s.state){renderSkewer(i);if(s.state==='ready'){sfx('click');}}
    var sides=['a','b'];
    for(var k=0;k<2;k++){
      $('fill'+i+sides[k]).style.width=Math.min(100,s.don[k])+'%';
      $('pct'+i+sides[k]).textContent=Math.round(s.don[k])+'%';
    }
  }
}
function loop(ts){
  if(!running)return;
  if(!paused&&lastTs>0){
    var dt=(ts-lastTs)/1000;
    if(dt>0.25)dt=0.25;
    update(dt);
    if(!running)return;
  }
  lastTs=ts;
  requestAnimationFrame(loop);
}
function startGame(){
  score=0;burnt=0;timeLeft=GAME_TIME;paused=false;update._lastTick=-1;
  for(var i=0;i<4;i++){newSkewer(i);}
  buildCards();
  for(var j=0;j<4;j++){renderSkewer(j);}
  $('score').textContent='0';
  $('time').textContent=GAME_TIME;
  $('timerbar').style.width='100%';
  $('burns').textContent='💀 0 / '+MAX_BURN;
  $('startOv').classList.add('hidden');
  $('endOv').classList.add('hidden');
  $('pauseOv').classList.add('hidden');
  running=true;lastTs=0;
  ac();
  requestAnimationFrame(loop);
}
function endGame(title){
  if(!running)return;
  running=false;paused=false;
  if(score>best){best=score;localStorage.setItem(HS_KEY,String(best));}
  $('best').textContent=best;
  $('endTitle').textContent=title;
  $('finalScore').textContent=score;
  $('finalBest').textContent=best;
  sfx('win');vibrate([60,40,60]);
  $('endOv').classList.remove('hidden');
}
$('startBtn').addEventListener('click',function(){sfx('click');startGame();});
$('retryBtn').addEventListener('click',function(){sfx('click');startGame();});
$('serveBtn').addEventListener('click',function(){serve();});
$('pauseBtn').addEventListener('click',function(){
  if(!running||paused)return;
  paused=true;sfx('click');
  $('pauseOv').classList.remove('hidden');
});
$('resumeBtn').addEventListener('click',function(){
  paused=false;sfx('click');
  $('pauseOv').classList.add('hidden');
  lastTs=0;
});
$('muteBtn').addEventListener('click',function(){setMute(!muted);if(!muted)sfx('click');});
setMute(muted);
$('best').textContent=best;
buildCards();
</script>
</body>
</html>
