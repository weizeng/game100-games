<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>数独</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:linear-gradient(160deg,#1a1b3a 0%,#12132a 60%,#0d0e20 100%);color:#eef;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;display:flex;justify-content:center;min-height:100vh;touch-action:manipulation;-webkit-user-select:none;user-select:none;overflow-x:hidden}
.wrap{width:100%;max-width:480px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:10px;position:relative;z-index:1}
.topbar{width:100%;display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:9px 12px;font-size:15px;box-shadow:0 4px 14px rgba(0,0,0,.35);backdrop-filter:blur(6px)}
.topbar .title{font-weight:700;font-size:16px}
.topbar .stat{color:#aab;font-size:13px}
.topbar .stat b{color:#fff;font-size:15px}
.tbtn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:#fff;font-size:17px;width:38px;height:38px;border-radius:11px;cursor:pointer;transition:transform .08s}
.tbtn:active{transform:scale(.9)}
#board{width:100%;aspect-ratio:1;display:grid;grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(9,1fr);background:#23234a;border-radius:12px;overflow:hidden;box-shadow:0 8px 26px rgba(0,0,0,.5),0 0 0 3px #3F51B5;padding:0;touch-action:none}
.cell{display:flex;align-items:center;justify-content:center;font-size:clamp(17px,5.4vw,25px);font-weight:600;color:#8ab4ff;cursor:pointer;border-right:1px solid rgba(255,255,255,.07);border-bottom:1px solid rgba(255,255,255,.07);transition:background .12s,transform .1s;position:relative}
.cell.given{color:#fff;font-weight:800}
.cell.peer{background:rgba(63,81,181,.16)}
.cell.same{background:rgba(63,81,181,.42);color:#fff}
.cell.sel{background:rgba(63,81,181,.65)!important;color:#fff;box-shadow:inset 0 0 0 2px #9fb2ff}
.cell.wrong{color:#ff6b6b!important}
.cell.br{border-right:2px solid rgba(160,170,255,.35)}
.cell.bb{border-bottom:2px solid rgba(160,170,255,.35)}
.cell:nth-child(9n){border-right:none}
.cell:nth-child(n+73){border-bottom:none}
.cell.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.cell.pop{animation:pop .22s}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.cell.hinted{animation:hintflash 1s}
#hintToast{position:fixed;top:70px;left:50%;transform:translateX(-50%);max-width:88vw;background:rgba(20,22,34,.96);border:1px solid rgba(255,215,106,.55);color:#ffe9a8;font-size:13px;line-height:1.7;padding:10px 16px;border-radius:12px;z-index:90;display:none;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.5)}
#hintToast.show{display:block;animation:toastin .25s}
@keyframes toastin{from{opacity:0;transform:translate(-50%,-8px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes hintflash{0%,100%{background:rgba(76,175,80,.1)}50%{background:rgba(76,175,80,.55)}}
.tools{width:100%;display:flex;gap:10px}
.toolbtn{flex:1;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:#dfe3ff;font-size:14px;font-weight:600;padding:10px 0;border-radius:12px;cursor:pointer;transition:transform .08s}
.toolbtn:active{transform:scale(.96)}
.toolbtn:disabled{opacity:.35}
#pad{width:100%;display:grid;grid-template-columns:repeat(9,1fr);gap:5px}
.nbtn{background:linear-gradient(180deg,#3F51B5,#303f9f);border:none;color:#fff;font-size:clamp(16px,5vw,22px);font-weight:700;padding:11px 0;border-radius:10px;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.35);transition:transform .08s}
.nbtn:active{transform:scale(.92)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:40}
.overlay{position:fixed;inset:0;background:rgba(8,9,22,.9);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;z-index:50;padding:28px;text-align:center;backdrop-filter:blur(4px)}
.overlay.hidden{display:none}
.overlay h1{font-size:32px}
.overlay p{color:#aab4d8;font-size:15px;line-height:1.8;max-width:340px}
.btn{background:linear-gradient(180deg,#5c6bc0,#3F51B5);border:none;color:#fff;font-size:18px;font-weight:700;padding:13px 46px;border-radius:14px;cursor:pointer;box-shadow:0 6px 18px rgba(63,81,181,.45);transition:transform .08s}
.btn:active{transform:scale(.95)}
.btn.ghost{background:rgba(255,255,255,.1);box-shadow:none}
.drow{display:flex;gap:10px}
.dbtn{background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.15);color:#dfe3ff;font-size:16px;font-weight:700;padding:12px 22px;border-radius:13px;cursor:pointer;transition:transform .08s}
.dbtn:active{transform:scale(.94)}
.dbtn.on{border-color:#5c6bc0;background:rgba(63,81,181,.35);color:#fff}
.best{color:#8f9bd0;font-size:13px}
.float-txt{position:fixed;z-index:60;pointer-events:none;font-weight:800;font-size:20px;animation:floatup 1s ease-out forwards}
@keyframes floatup{0%{opacity:0;transform:translateY(8px) scale(.8)}20%{opacity:1}100%{opacity:0;transform:translateY(-46px) scale(1.1)}}
</style>
<!-- GAME UI BEGIN -->
<style>
:root{--page:#e7edf4;--surface:#ffffff;--soft:#dce5ef;--ink:#243952;--muted:#5b6d83;--accent:#275e9b;--on-accent:#ffffff;--line:#bacbdd;--stage:#172d48;--page:#3b62ef;--surface:#ffffff;--soft:#e6f0ff;--ink:#1d2d5a;--muted:#5a6b93;--accent:#885f10;--on-accent:#ffffff;--line:#9cc2ff;--b-bg1:#72cbff;--b-bg2:#3b62ef;--b-btn:#ffb21e;--b-btn-hi:#ffcd6d;--b-edge:#d97a00;--b-glow:#bfe6ff;--b-glow-rgb:191,230,255;--b-pedge-rgb:156,194,255;--b-btn-ink:#714000;--b-btn-tsh:0 1px 0 rgba(255,255,255,.45);--b-coin-ink:#714000;--b-coin-tsh:none;--b-key-ink:#885f10;--b-title:#9c5800}
/* Shared presentation only; mechanics and state remain inside each standalone game. */
html.game-ui{background:var(--page);color:var(--ink);color-scheme:light;font-family:"Bahnschrift","Microsoft YaHei UI","PingFang SC",sans-serif}
html.game-ui:is([data-theme="space"],[data-theme="arcade"],[data-theme="lab"],[data-theme="ocean"],[data-theme="magic"]){color-scheme:dark}
.game-ui body{background:var(--page);color:var(--ink);font-family:inherit;overscroll-behavior:none}
.game-ui body>.wrap{padding:20px 16px max(20px,env(safe-area-inset-bottom));gap:14px;max-width:500px}
.game-ui #app{background:var(--page);color:var(--ink)}
.game-ui :is(.topbar,#topbar){gap:8px;flex-wrap:wrap;min-height:58px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:10px 12px;box-shadow:0 3px 0 var(--soft);font-size:13px}
.game-ui :is(.title,.tb-title,.tb-title,#topbar .t,.topbar .t){color:var(--ink);font-size:16px;font-weight:750;letter-spacing:0}
.game-ui :is(.topbar,.hud,#hud,#topbar) :is(b,.v){color:var(--accent);font-variant-numeric:tabular-nums}
.game-ui :is(.stat,.topbar .s,.topbar .stat,.scorebar,.stats,.tip,.hint,.hintline,.hsline,.best,.hiscore){color:var(--muted);line-height:1.7}
.game-ui :is(.hint,.hintline,.tip){font-size:12px;max-width:40em;text-wrap:pretty}
.game-ui .scorebar{padding:6px 10px;gap:8px;flex-wrap:wrap}
.game-ui :is(.iconbtn,.iconBtn,.icobtn,.ibtn,.tbtn,.hbtn,.ib,.iconBtn,.pause){min-width:44px;min-height:44px;flex-shrink:0;border-radius:12px;background:var(--soft);color:var(--ink);border:1px solid var(--line);box-shadow:none;font-size:17px}
.game-ui button{font-family:inherit;cursor:pointer;touch-action:manipulation}
.game-ui button:focus-visible,.game-ui [tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.game-ui :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn){background:var(--accent);color:var(--on-accent);border:1px solid transparent;border-radius:13px;min-height:50px;padding:13px 28px;font-size:16px;font-weight:750;letter-spacing:0;box-shadow:0 4px 0 var(--line);text-shadow:none;max-width:100%}
.game-ui :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn):active{box-shadow:none;transform:translateY(2px)}
.game-ui :is(.ghost,.ghostbtn,.btn2,.abtn,.toolbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line);box-shadow:none;border-radius:12px;min-height:44px}
.game-ui :is(.rowbtns,.btnrow,.ctlrow){gap:10px;flex-wrap:wrap;justify-content:center}
.game-ui :is(.pill,.hudbox,.hud .p){background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:none;font-variant-numeric:tabular-nums}
.game-ui :is(.dbtn,.cbtn,.gbtn,.holdbtn,.firebtn,.bombbtn,.jumpbtn,.pumpbtn,.nbtn){border-radius:12px;box-shadow:0 3px 0 var(--line);min-height:44px}
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv,.screen):has(>.ui-panel){padding:20px;overflow-y:auto;overscroll-behavior:contain}
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv):has(>.ui-panel){background:var(--page);backdrop-filter:none;justify-content:safe center;align-items:center}
.game-ui .ui-panel{width:min(100%,380px);max-height:100%;overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:18px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:24px;padding:30px 24px;box-shadow:0 8px 0 var(--soft),0 20px 48px #15253618;text-align:center;margin:auto}
.game-ui .ui-panel :is(.card,.panel,.pausecard,.ovcard){display:contents}
.game-ui .ui-panel :is(h1,h2,.gamename,.gametitle){font-size:30px;line-height:1.25;font-weight:800;color:var(--ink);background:none;-webkit-text-fill-color:currentColor;text-shadow:none;letter-spacing:-.6px;margin:0}
.game-ui .ui-panel :is(p,.howto,.sub,.rule){font-size:14px;line-height:1.85;color:var(--muted);background:none;border:0;box-shadow:none;padding:0;margin:0;max-width:32em;text-align:left;white-space:normal}
.game-ui .ui-panel :is(.bigemoji,.bigemoji,.ic,.big):not(.bigscore){animation:none;filter:none;text-shadow:none}
.game-ui .ui-emblem{width:90px;height:90px;display:grid;place-items:center;border:1px solid var(--line);border-radius:28px;background:var(--soft);font-size:48px;line-height:1;flex-shrink:0;position:relative}
.game-ui[data-theme="wood"] .ui-emblem{border-radius:50%;box-shadow:inset 0 0 0 5px var(--surface),inset 0 0 0 6px var(--line)}
.game-ui[data-theme="wood"] .ui-panel h1{font-family:"STKaiti","KaiTi","Microsoft YaHei",serif;letter-spacing:2px}
.game-ui[data-theme="ice"] .ui-emblem{border-radius:26px 8px 26px 8px}
.game-ui[data-theme="space"] .ui-emblem{background:radial-gradient(circle at center,var(--soft) 42%,transparent 43%),var(--surface);border-radius:50%;outline:1px solid var(--line);outline-offset:7px;margin:7px}
.game-ui[data-theme="kitchen"] .ui-emblem{border-radius:22px;border-bottom:5px solid var(--line)}
.game-ui .ui-panel :is(.score,.bigscore,.bigScore,.scorebig){color:var(--accent);font-size:48px;font-weight:800;font-variant-numeric:tabular-nums}
.game-ui .ui-panel :is(.best,.hsline,.hiscore,.endstats,.endstats b){color:var(--muted);font-size:13px;line-height:1.8}
.game-ui .ui-mode{display:grid;grid-template-columns:1fr 1fr;gap:5px;background:var(--soft);padding:5px;border:1px solid var(--line);border-radius:14px;width:100%}
.game-ui .ui-mode button{min-height:44px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-size:14px;font-weight:700;box-shadow:none}
.game-ui .ui-mode button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 2px 5px #1525361a}
.game-ui .ui-panel .ui-mode-note{font-size:12px;line-height:1.6;text-align:center;color:var(--muted)}
.game-ui .ui-mode-status{display:block;padding:5px 10px;color:var(--accent);font-size:11px;font-weight:700;line-height:1.5;text-align:center;border:1px solid var(--line);border-radius:8px;background:var(--surface);margin:4px auto;max-width:100%;pointer-events:none}
.game-ui body>.wrap>canvas:not(#fx){background-color:var(--stage);box-shadow:0 0 0 1px var(--line),0 6px 0 var(--soft);border-radius:18px;flex-shrink:0}
.game-ui .screen>canvas.game{box-shadow:0 0 0 1px var(--line),0 6px 0 var(--soft)}
.game-ui #hud{gap:6px;background:var(--surface);color:var(--ink)}
.game-ui #hud :is(.left,.t,.s,.grp,.pill){color:var(--ink)}
.game-ui #hud .pill{background:var(--surface);border-color:var(--line)}
.game-ui body canvas:is(#cv,#game,#board){background-color:var(--stage)}
.game-ui :is(button.dbtn,button.cbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.game-ui :is(button.lvl,button.lvlbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line);border-radius:12px;min-height:54px}
.game-ui :is(button.lvl,button.lvlbtn) :is(.nc,.sz,small){color:var(--muted)}
.game-ui .ui-panel button.lvl{margin:0;min-width:44px;box-shadow:none;padding:8px}
.game-ui #hud :is(.left,.right,.hudl,.hbtns){gap:5px;flex-wrap:wrap}
.game-ui #hud :is(.left,.hudl){min-width:0;flex-shrink:1}
.game-ui #hud :is(.pill,.left){font-size:12px}
.game-ui button:disabled{cursor:default;opacity:.45;box-shadow:none}
.game-ui .ui-panel .ui-assist-note{color:var(--accent);font-weight:700}
@media(min-width:700px){.game-ui body>.wrap{padding-top:32px}.game-ui .ui-panel{padding:36px 30px}}
@media(max-width:360px){.game-ui body>.wrap{padding:10px;gap:10px}.game-ui .ui-panel{padding:22px 18px;gap:13px}.game-ui .ui-panel h1{font-size:26px}.game-ui .ui-emblem{width:70px;height:70px;font-size:38px}.game-ui :is(.topbar,#topbar){gap:5px;padding:8px}.game-ui :is(.iconbtn,.icobtn,.ibtn,.tbtn,.ib){min-width:40px;min-height:44px}}
@media(max-height:650px){.game-ui .ui-panel{padding:18px;gap:12px}.game-ui .ui-emblem{width:60px;height:60px;font-size:32px}.game-ui .ui-panel h1{font-size:25px}.game-ui .ui-panel :is(p,.howto,.sub,.rule){font-size:13px}}
@media(prefers-reduced-motion:reduce){.game-ui *, .game-ui *::before,.game-ui *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
/* 2026-10-20 热修：开局/结算遮罩铺满整屏，主按钮固定在面板底部，避免被画布尺寸裁切（#10） */
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv):has(>.ui-panel){position:fixed;inset:0;z-index:1000;border-radius:0;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
.game-ui .ui-panel{touch-action:pan-y}
.game-ui .ui-panel :is(#startBtn,#btnStart,.startbtn,#bStart,#restartBtn,#btnRestart,#againBtn,#btnAgain,#retryBtn,#btnRetry,#playBtn,#btnPlay){position:sticky;bottom:0;z-index:3;flex-shrink:0}
.game-ui .ui-panel :not(.card,.panel,.pausecard,.ovcard,.ui-mode):has(>:is(#startBtn,#btnStart,.startbtn,#bStart,#restartBtn,#btnRestart,#againBtn,#btnAgain,#retryBtn,#btnRetry,#playBtn,#btnPlay)){position:sticky;bottom:0;z-index:3;flex-shrink:0;background:var(--surface);box-shadow:0 -10px 10px -6px var(--surface)}

html[data-game="sudoku"] #board{background:var(--surface);box-shadow:0 0 0 2px var(--accent),0 6px 0 var(--soft);border-radius:8px}html[data-game="sudoku"] .cell{color:#2b6bb1;border-color:#dde4ec}html[data-game="sudoku"] .cell.given{color:#293f57}html[data-game="sudoku"] .cell.peer{background:#edf3f9}html[data-game="sudoku"] .cell.same{background:#d5e6f5;color:#204c79}html[data-game="sudoku"] .cell.sel{background:#b5d3ec!important;color:#163a5b;box-shadow:inset 0 0 0 2px #32669a}html[data-game="sudoku"] .cell.br{border-right:2px solid #9db5ce}html[data-game="sudoku"] .cell.bb{border-bottom:2px solid #9db5ce}html[data-game="sudoku"] .nbtn{background:var(--surface);color:var(--accent);border:1px solid var(--line);box-shadow:0 3px 0 var(--soft)}html[data-game="sudoku"] .drow{gap:6px}html[data-game="sudoku"] .dbtn{padding:10px 15px;color:var(--ink);background:var(--soft);border-color:var(--line)}html[data-game="sudoku"] .dbtn.on{border-color:var(--accent);background:#d2e3f5}
html[data-game="sudoku"] .topbar .stat{color:var(--muted)}html[data-game="sudoku"] #board .cell.bb{border-radius:0;padding:0;box-shadow:none;min-height:0}

/* ===== Direction B · 霓虹糖果 Pop Arcade ===== saturated gradients, chunky bevels with a hard bottom edge, sticker panels, neon on dark themes */
html.game-ui[data-skin="b"]{--fb:"HarmonyOS Sans SC","MiSans","OPPOSans","vivo Sans","Noto Sans SC","Noto Sans CJK SC","PingFang SC","Microsoft YaHei UI",system-ui,sans-serif;--bounce:cubic-bezier(.34,1.56,.64,1);--bg:radial-gradient(circle at 12% 18%,rgba(255,255,255,.28) 0 38px,transparent 40px),radial-gradient(circle at 88% 30%,rgba(255,255,255,.16) 0 64px,transparent 66px),radial-gradient(circle at 20% 82%,rgba(255,255,255,.14) 0 52px,transparent 54px),radial-gradient(rgba(255,255,255,.16) 1.5px,transparent 2.2px) 0 0/22px 22px,linear-gradient(165deg,var(--b-bg1),var(--b-bg2));font-family:var(--fb)}
html.game-ui[data-skin="b"],html.game-ui[data-skin="b"] body,html.game-ui[data-skin="b"] #app,html.game-ui[data-skin="b"] :is(.overlay,.ov,#ov,#overlay,#pauseOv):has(>.ui-panel){background:var(--bg);background-color:var(--b-bg2)}
html.game-ui[data-skin="b"] body{min-height:100vh;font-family:var(--fb)}
html.game-ui[data-skin="b"] :is(.hint,.hintline,.tip){color:rgba(255,255,255,.94);text-shadow:0 1px 2px rgba(0,0,0,.35)}
/* Sticker panel: white rim + hard coloured bottom edge + drop */
html.game-ui[data-skin="b"] .ui-panel{background:linear-gradient(180deg,var(--surface),var(--soft));border:4px solid #fff;border-radius:32px;box-shadow:0 9px 0 var(--line),0 9px 0 4px rgba(0,0,0,.08),0 26px 40px rgba(0,0,0,.28);animation:uiB-in .5s var(--bounce) both}
html.game-ui[data-skin="b"] .ui-panel :is(h1,h2,.gamename,.gametitle){font-size:34px;font-weight:900;color:var(--b-title);letter-spacing:0;text-shadow:0 3px 0 var(--line),0 6px 10px rgba(0,0,0,.15)}
html.game-ui[data-skin="b"] .ui-emblem{width:100px;height:100px;border:4px solid #fff;border-radius:50%;background:radial-gradient(circle at 32% 26%,#fff 0 12%,var(--b-glow) 13%,var(--line) 70%,var(--b-edge) 100%);box-shadow:0 7px 0 var(--b-edge),0 16px 24px rgba(0,0,0,.25);font-size:54px;animation:uiB-wobble 2.6s ease-in-out infinite}
html.game-ui[data-skin="b"] .ui-emblem::before,html.game-ui[data-skin="b"] .ui-emblem::after{content:"✦";position:absolute;color:#fff;font-size:20px;text-shadow:0 0 8px var(--b-glow);animation:uiB-twinkle 1.8s ease-in-out infinite}
html.game-ui[data-skin="b"] .ui-emblem::before{top:-10px;right:-14px}
html.game-ui[data-skin="b"] .ui-emblem::after{bottom:4px;left:-18px;font-size:14px;animation-delay:.9s}
html.game-ui[data-skin="b"] .ui-panel :is(.score,.bigscore,.bigScore,.scorebig,#finalScore){font-size:56px;font-weight:900;color:var(--b-btn);-webkit-text-fill-color:currentColor;text-shadow:0 4px 0 var(--b-edge),0 0 2px var(--b-edge),0 10px 16px rgba(0,0,0,.25)}
html.game-ui[data-skin="b"] .ui-panel :is(h1,.gamename)~h2{font-size:19px;text-shadow:0 2px 0 var(--line)}
/* Chunky bevelled button: highlight lip, darker bottom slab, presses down onto the slab */

      rr(g, 0, 0, w, h, r); g.fillStyle = shade(color, -.42); g.fill();
      var bev = g.createLinearGradient(0, 0, w, h); bev.addColorStop(0, shade(color, .55)); bev.addColorStop(.5, color); bev.addColorStop(1, shade(color, -.3));
      rr(g, 1, 1, w - 2, h - 2, r * .9); g.fillStyle = bev; g.fill();

      g.shadowColor = 'rgba(0,0,0,.32)'; g.shadowBlur = Math.max(2, w * .18); g.shadowOffsetY = Math.max(1, h * .08);
      var body = g.createLinearGradient(0, 0, 0, h); body.addColorStop(0, shade(color, .28)); body.addColorStop(.55, color); body.addColorStop(1, shade(color, -.22));

      rr(g, w * .08, h * .06, w * .84, h * .42, r * .7); g.fillStyle = gloss; g.fill();

    }
  }
  function orbArt(g, r, color, pad) {
    var cx = r, cy = r;
    g.fillStyle = 'rgba(0,0,0,' + (skin === 'b' ? .34 : .26) + ')'; g.beginPath(); g.ellipse(cx + r * .12, cy + r * .78, r * .82, r * .32, 0, 0, 7); g.fill();
    var body = g.createRadialGradient(cx - r * .38, cy - r * .42, r * .08, cx, cy, r);
    body.addColorStop(0, shade(color, .75)); body.addColorStop(.28, shade(color, .18)); body.addColorStop(.75, color); body.addColorStop(1, shade(color, -.45));

      g.strokeStyle = shade(color, -.55); g.lineWidth = Math.max(1, r * .08); g.beginPath(); g.arc(cx, cy, r - g.lineWidth / 2, 0, 7); g.stroke();

    tile: function (ctx, x, y, w, h, color, r) {

    glow: function (ctx, color, blur) { ctx.shadowColor = color; ctx.shadowBlur = blur; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0; },

    burst: function (list, x, y, color, n) {

    },
    drawBurst: function (ctx, list) {

        var p = list[i]; p.x += p.vx; p.y += p.vy; p.vy += .12; p.life -= .035;

<body>

</div>

<script>
/* GAMEPLAY UPGRADE */
'use strict';
var $=function(id){return document.getElementById(id);};
function lsGet(k){try{return GameUI.storageGet(k);}catch(e){return null;}}
function lsSet(k,v){try{GameUI.storageSet(k,v);}catch(e){}}
function vib(ms){try{window.NativeBridge&&window.NativeBridge.vibrate(ms);}catch(e){}}

/* ===== 音效 ===== */
var AC=null, muted=lsGet('g100_mute')==='1';
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended'){AC.resume();}return AC;}
function tone(f,dur,type,vol,delay){
  if(muted)return;var c=ac();if(!c)return;
  var t=c.currentTime+(delay||0);
  var o=c.createOscillator(),g=c.createGain();
  o.type=type||'sine';o.frequency.value=f;
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol||0.18,t+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(c.destination);
  o.start(t);o.stop(t+dur+0.05);
}
function sfx(n){
  if(muted)return;
  if(n==='click')tone(620,0.07,'triangle',0.12);
  else if(n==='sel')tone(440,0.06,'triangle',0.1);
  else if(n==='good'){tone(660,0.1,'sine',0.16);tone(880,0.14,'sine',0.16,0.09);}
  else if(n==='bad')tone(160,0.25,'sawtooth',0.14);
  else if(n==='hint'){tone(520,0.1,'sine',0.14);tone(780,0.16,'sine',0.14,0.1);}
  else if(n==='win'){var ns=[523,659,784,1047,1319];for(var i=0;i<ns.length;i++)tone(ns[i],0.22,'triangle',0.16,i*0.12);}
  else if(n==='lose'){var ms=[400,300,220,150];for(var j=0;j<ms.length;j++)tone(ms[j],0.25,'sawtooth',0.12,j*0.16);}
}
function updMute(){$('muteBtn').textContent=muted?'🔇':'🔊';}
$('muteBtn').addEventListener('click',function(){muted=!muted;lsSet('g100_mute',muted?'1':'0');updMute();sfx('click');});
updMute();

/* ===== 数独生成/求解 ===== */
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=(Math.random()*(i+1))|0;var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function cands(g,i){
  var r=(i/9)|0,c=i%9,used={},k,dr,dc;
  for(k=0;k<9;k++){used[g[r*9+k]]=1;used[g[k*9+c]]=1;}
  var br=r-(r%3),bc=c-(c%3);
  for(dr=0;dr<3;dr++)for(dc=0;dc<3;dc++)used[g[(br+dr)*9+bc+dc]]=1;
  var out=[];
  for(var v=1;v<=9;v++)if(!used[v])out.push(v);
  return out;
}
function genFull(){
  var g=new Array(81).fill(0);
  (function fill(){
    var best=-1,bc=null,i,c;
    for(i=0;i<81;i++){
      if(g[i])continue;
      c=cands(g,i);
      if(!c.length)return false;
      if(!bc||c.length<bc.length){best=i;bc=c;if(c.length===1)break;}
    }
    if(best===-1)return true;
    shuffle(bc);
    for(var k=0;k<bc.length;k++){g[best]=bc[k];if(fill())return true;g[best]=0;}
    return false;
  })();
  return g;
}
function solveCount(g,cap){
  var best=-1,bc=null,i,c;
  for(i=0;i<81;i++){
    if(g[i])continue;
    c=cands(g,i);
    if(!c.length)return 0;
    if(!bc||c.length<bc.length){best=i;bc=c;if(c.length===1)break;}
  }
  if(best===-1)return 1;
  var n=0;
  for(var k=0;k<bc.length;k++){g[best]=bc[k];n+=solveCount(g,cap);g[best]=0;if(n>=cap)return n;}
  return n;
}
function dig(full,holes){
  var g=full.slice(),order=shuffle(Array.from({length:81},function(_,i){return i;})),removed=0;
  for(var k=0;k<order.length&&removed<holes;k++){
    var i=order[k],bak=g[i];g[i]=0;
    if(solveCount(g.slice(),2)>=1)removed++;else g[i]=bak;
  }
  return g;
}

/* ===== 游戏状态 ===== */
var DIFF={easy:{n:'简单',holes:35},mid:{n:'中等',holes:45},hard:{n:'困难',holes:52}};
var diff='mid',solution=[],grid=[],fixed=[],wrongF=[],sel=-1;
var errors=0,hints=3,playing=false,paused=false,over=false;
var startTs=0,elapsed=0,timerRaf=null,fxRaf=null,particles=[];
var cells=[];

function fmtT(s){var m=(s/60)|0,ss=s%60;return (m<10?'0':'')+m+':'+(ss<10?'0':'')+ss;}
function bestKey(){return 'sudoku_best_'+diff;}
function showBest(){
  var b=lsGet(bestKey());
  $('bestLine').textContent=b?('🏆 最快通关('+DIFF[diff].n+')：'+fmtT(+b)):('🏆 '+DIFF[diff].n+'：暂无通关记录');
}

function buildBoard(){
  var b=$('board');b.innerHTML='';cells=[];
  for(var i=0;i<81;i++){
    var d=document.createElement('div');
    d.className='cell';
    var r=(i/9)|0,c=i%9;
    if(c===2||c===5)d.classList.add('br');
    if(r===2||r===5)d.classList.add('bb');
    (function(idx){
      d.addEventListener('pointerdown',function(e){e.preventDefault();onCell(idx);});
    })(i);
    b.appendChild(d);cells.push(d);
  }
}
function buildPad(){
  var p=$('pad');p.innerHTML='';
  for(var n=1;n<=9;n++){
    (function(v){
      var b=document.createElement('button');
      b.className='nbtn';b.textContent=v;
      b.addEventListener('pointerdown',function(e){e.preventDefault();inputNum(v);});
      p.appendChild(b);
    })(n);
  }
}

function newGame(){
  $('overScr').classList.add('hidden');$('pauseScr').classList.add('hidden');$('startScr').classList.add('hidden');
  cancelFx();
  solution=genFull();
  var puzzle=dig(solution,DIFF[diff].holes);
  grid=puzzle.slice();fixed=puzzle.map(function(v){return v!==0;});
  wrongF=new Array(81).fill(false);
  sel=-1;errors=0;hints=3;playing=true;paused=false;over=false;
  $('errs').textContent='0/3';
  $('timer').textContent='00:00';
  startTs=performance.now();elapsed=0;
  render();startTimer();
}

function render(){
  var sv=sel>=0?grid[sel]:0;
  var sr=sel>=0?(sel/9)|0:-1, sc=sel>=0?sel%9:-1;
  var sbr=sr-(sr%3), sbc=sc-(sc%3);
  for(var i=0;i<81;i++){
    var d=cells[i],r=(i/9)|0,c=i%9;
    d.textContent=grid[i]===0?'':grid[i];
    d.classList.toggle('given',fixed[i]);
    d.classList.toggle('wrong',!!wrongF[i]);
    d.classList.toggle('sel',i===sel);
    var peer=sel>=0&&(r===sr||c===sc||(r>=sbr&&r<sbr+3&&c>=sbc&&c<sbc+3))&&i!==sel;
    d.classList.toggle('peer',peer);
    d.classList.toggle('same',sv!==0&&grid[i]===sv&&i!==sel);
  }
}
function onCell(i){
  if(!playing||paused||over)return;
  sfx('sel');vib(20);
  sel=(sel===i)?-1:i;
  render();
}
function inputNum(v){
  if(!playing||paused||over||sel<0||fixed[sel])return;
  if(grid[sel]===v)return;
  sfx('click');
  if(v===solution[sel]){
    grid[sel]=v;wrongF[sel]=false;
    cells[sel].classList.remove('pop');void cells[sel].offsetWidth;cells[sel].classList.add('pop');
    sfx('good');vib(30);
    render();
    checkWin();
  }else{
    grid[sel]=v;wrongF[sel]=true;
    errors++;$('errs').textContent=errors+'/3';
    var d=cells[sel];d.classList.remove('shake');void d.offsetWidth;d.classList.add('shake');
    sfx('bad');vib(80);
    shakeScreen();
    render();
    if(errors>=3)gameOver(false);
  }
}
function erase(){
  if(!playing||paused||over||sel<0||fixed[sel])return;
  if(grid[sel]!==0){grid[sel]=0;wrongF[sel]=false;sfx('click');render();}
}
var hintToastTimer=null;
function showHintToast(html,ms){
  var t=$('hintToast');
  if(!t){t=document.createElement('div');t.id='hintToast';document.body.appendChild(t);}
  t.innerHTML=html;t.classList.add('show');
  if(hintToastTimer)clearTimeout(hintToastTimer);
  hintToastTimer=setTimeout(function(){t.classList.remove('show');},ms||4500);
}
function unitCells(u){
  var out=[],r,c,dr,dc;
  if(u<9){for(c=0;c<9;c++)out.push(u*9+c);}
  else if(u<18){var cc=u-9;for(r=0;r<9;r++)out.push(r*9+cc);}
  else{var b=u-18,br=((b/3)|0)*3,bc=(b%3)*3;for(dr=0;dr<3;dr++)for(dc=0;dc<3;dc++)out.push((br+dr)*9+bc+dc);}
  return out;
}
function unitName(u){
  if(u<9)return '第'+(u+1)+'行';
  if(u<18)return '第'+(u-9+1)+'列';
  return '第'+(u-18+1)+'宫';
}
function useHint(){
  if(!playing||paused||over)return;
  var empt=[],i;
  for(i=0;i<81;i++)if(!fixed[i]&&grid[i]!==solution[i])empt.push(i);
  if(!empt.length){showHintToast('棋盘已经填满了 🎉');return;}
  var best=-1,val=0,reason='',k,cc;
  for(k=0;k<empt.length;k++){
    i=empt[k];cc=cands(grid,i);
    if(cc.length===1){best=i;val=cc[0];break;}
  }
  if(best>=0){
    var r0=(best/9)|0,c0=best%9,b0=((r0/3)|0)*3+((c0/3)|0);
    reason='第'+(r0+1)+'行、第'+(c0+1)+'列、第'+(b0+1)+'宫里，数字 1–9 只剩下 <b>'+val+'</b> 能放进这一格';
  }else{
    var u,j,d,idx,places,j2,vv;
    outer:
    for(u=0;u<27;u++){
      var cellsU=unitCells(u),present={};
      for(j=0;j<9;j++){vv=grid[cellsU[j]];if(vv)present[vv]=1;}
      for(d=1;d<=9;d++){
        if(present[d])continue;
        places=[];
        for(j2=0;j2<9;j2++){idx=cellsU[j2];if(grid[idx]===0&&cands(grid,idx).indexOf(d)>=0)places.push(idx);}
        if(places.length===1){best=places[0];val=d;reason=unitName(u)+'里数字 <b>'+d+'</b> 只能放在这一格';break outer;}
      }
    }
  }
  var rr,cc2,dd;
  if(best>=0){
    rr=(best/9)|0;cc2=best%9;
    grid[best]=val;wrongF[best]=false;sel=best;
    dd=cells[best];dd.classList.remove('hinted');void dd.offsetWidth;dd.classList.add('hinted');
    showHintToast('💡 '+reason+'<br>→ 第'+(rr+1)+'行第'+(cc2+1)+'列填入 <b>'+val+'</b>');
  }else{
    var ri=(Math.random()*empt.length)|0,idx2=empt[ri];
    rr=(idx2/9)|0;cc2=idx2%9;val=solution[idx2];
    grid[idx2]=val;wrongF[idx2]=false;sel=idx2;
    dd=cells[idx2];dd.classList.remove('hinted');void dd.offsetWidth;dd.classList.add('hinted');
    showHintToast('💡 这一格用基础排除法暂时看不出<br>→ 按完整解法，第'+(rr+1)+'行第'+(cc2+1)+'列填入 <b>'+val+'</b>');
  }
  sfx('hint');vib(40);
  render();
  checkWin();
}
function checkWin(){
  for(var i=0;i<81;i++)if(grid[i]!==solution[i])return;
  gameOver(true);
}
function gameOver(win){
  playing=false;over=true;stopTimer();
  var secs=Math.round(elapsed/1000);
  if(win){
    sfx('win');vib(120);
    confetti();
    var b=lsGet(bestKey()),nb=!b||secs<+b;
    if(nb)lsSet(bestKey(),String(secs));
    $('overTitle').textContent='🎉 通关！';
    $('overText').innerHTML='难度：'+DIFF[diff].n+'<br>用时：<b style="color:#fff">'+fmtT(secs)+'</b>'+(nb?'　<span style="color:#ffd54f">🏆 新纪录！</span>':'');
    var nb2=lsGet(bestKey());
    $('overBest').textContent='🏆 最快通关：'+fmtT(+nb2);
  }else{
    sfx('lose');
    $('overTitle').textContent='💥 挑战失败';
    $('overText').innerHTML='错误达到 3 次，再接再厉！';
    $('overBest').textContent='';
  }
  setTimeout(function(){$('overScr').classList.remove('hidden');},win?1200:600);
}

/* ===== 计时 ===== */
function startTimer(){
  stopTimer();var last=-1;
  function tick(t){
    if(!playing||paused)return;
    elapsed=t-startTs;
    var s=(elapsed/1000)|0;
    if(s!==last){last=s;$('timer').textContent=fmtT(s);}
    timerRaf=requestAnimationFrame(tick);
  }
  timerRaf=requestAnimationFrame(tick);
}
function stopTimer(){if(timerRaf){cancelAnimationFrame(timerRaf);timerRaf=null;}}

/* ===== 粒子/特效 ===== */
var fx=$('fx'),fctx=fx.getContext('2d');
function sizeFx(){fx.width=innerWidth;fx.height=innerHeight;}
addEventListener('resize',sizeFx);sizeFx();
function cancelFx(){if(fxRaf){cancelAnimationFrame(fxRaf);fxRaf=null;}particles=[];fctx.clearRect(0,0,fx.width,fx.height);}
function fxLoop(){
  fctx.clearRect(0,0,fx.width,fx.height);
  particles=particles.filter(function(p){return p.life>0;});
  for(var i=0;i<particles.length;i++){
    var p=particles[i];
    p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.life--;p.rot+=p.vr;
    fctx.save();fctx.translate(p.x,p.y);fctx.rotate(p.rot);
    fctx.globalAlpha=Math.max(0,p.life/p.max);
    fctx.fillStyle=p.color;fctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.62);
    fctx.restore();
  }
  if(particles.length)fxRaf=requestAnimationFrame(fxLoop);
  else{fxRaf=null;fctx.clearRect(0,0,fx.width,fx.height);}
}
function confetti(){
  cancelFx();
  var colors=['#5c6bc0','#ff6b6b','#ffd54f','#69f0ae','#40c4ff','#ea80fc'];
  for(var i=0;i<140;i++){
    particles.push({x:Math.random()*fx.width,y:-20-Math.random()*fx.height*0.3,
      vx:(Math.random()-0.5)*3,vy:2+Math.random()*3.5,g:0.06,
      s:6+Math.random()*7,rot:Math.random()*6.28,vr:(Math.random()-0.5)*0.3,
      color:colors[(Math.random()*colors.length)|0],life:170+Math.random()*60,max:230});
  }
  if(fxRaf)cancelAnimationFrame(fxRaf);
  fxRaf=requestAnimationFrame(fxLoop);
}
var shakeT=null;
function shakeScreen(){
  if(shakeT)return;
  var n=0;shakeT=setInterval(function(){
    document.body.style.transform='translate('+(Math.random()*8-4)+'px,'+(Math.random()*8-4)+'px)';
    if(++n>5){clearInterval(shakeT);shakeT=null;document.body.style.transform='';}
  },40);
}

/* ===== 暂停 ===== */
function pauseGame(){
  if(!playing||paused||over)return;
  paused=true;stopTimer();
  $('pauseScr').classList.remove('hidden');
  sfx('click');
}
function resumeGame(){
  if(!paused)return;
  paused=false;$('pauseScr').classList.add('hidden');
  startTs=performance.now()-elapsed;startTimer();
  sfx('click');
}

/* ===== 事件 ===== */
$('pauseBtn').addEventListener('click',pauseGame);
$('resumeBtn').addEventListener('click',resumeGame);
$('pqBtn').addEventListener('click',function(){sfx('click');newGame();});
$('againBtn').addEventListener('click',function(){sfx('click');newGame();});
$('diffBtn').addEventListener('click',function(){sfx('click');$('overScr').classList.add('hidden');showBest();$('startScr').classList.remove('hidden');});
$('hintTopBtn').addEventListener('click',useHint);
$('eraseBtn').addEventListener('click',erase);
$('startBtn').addEventListener('click',function(){ac();sfx('click');newGame();});
var dbs=document.querySelectorAll('#diffRow .dbtn');
for(var di=0;di<dbs.length;di++)(function(b){
  b.addEventListener('click',function(){
    for(var k=0;k<dbs.length;k++)dbs[k].classList.remove('on');
    b.classList.add('on');diff=b.getAttribute('data-d');sfx('sel');showBest();
  });
})(dbs[di]);
document.addEventListener('keydown',function(e){
  if(e.key>='1'&&e.key<='9')inputNum(+e.key);
  else if(e.key==='Backspace'||e.key==='Delete')erase();
});
showBest();buildBoard();buildPad();
</script>
