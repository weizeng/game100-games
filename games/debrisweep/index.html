<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>太空清道夫</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0b1020;overflow:hidden;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#e8eefc}
body{display:flex;justify-content:center;align-items:center}
#wrap{position:relative;width:min(100vw,480px);aspect-ratio:2/3;max-height:100vh;background:#0b1020;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:8px 10px;background:linear-gradient(rgba(4,8,20,.85),rgba(4,8,20,0));z-index:5}
#hud .info{display:flex;gap:10px;font-size:15px;font-weight:700;text-shadow:0 1px 3px #000}
#hud .btns{display:flex;gap:8px}
button{border:none;border-radius:12px;background:rgba(46,125,111,.9);color:#fff;font-weight:700;cursor:pointer}
.iconbtn{min-width:44px;min-height:44px;font-size:20px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25)}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;background:rgba(4,8,20,.88);z-index:10;text-align:center;padding:24px}
.overlay h1{font-size:34px;letter-spacing:2px}
.overlay p{font-size:15px;line-height:1.7;color:#aeb9d4;max-width:340px}
.bigbtn{font-size:20px;padding:14px 56px;border-radius:16px;background:linear-gradient(180deg,#35a088,#23755f);box-shadow:0 4px 18px rgba(53,160,136,.5)}
#endScore{font-size:26px;font-weight:800}
#newRec{display:none;font-size:16px;color:#ffd54a;font-weight:800;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
#flash{position:absolute;inset:0;background:radial-gradient(circle,rgba(255,40,40,.55),rgba(255,0,0,.15));opacity:0;pointer-events:none;z-index:8;transition:opacity .35s}
</style>
<!-- GAME UI BEGIN -->
<style>
:root{--page:#10182f;--surface:#1a2742;--soft:#243754;--ink:#eff7ff;--muted:#adc3da;--accent:#8dded6;--on-accent:#102b36;--line:#38506b;--stage:#111e36}
/* Shared presentation only; mechanics and state remain inside each standalone game. */
html.game-ui{background:var(--page);color:var(--ink);color-scheme:light;font-family:"Bahnschrift","Microsoft YaHei UI","PingFang SC",sans-serif}
html.game-ui[data-theme="space"],html.game-ui[data-theme="arcade"]{color-scheme:dark}
.game-ui body{background:var(--page);color:var(--ink);font-family:inherit;overscroll-behavior:none}
.game-ui body>.wrap{padding:20px 16px max(20px,env(safe-area-inset-bottom));gap:14px;max-width:500px}
.game-ui #app{background:var(--page);color:var(--ink)}
.game-ui :is(.topbar,#topbar){gap:8px;flex-wrap:wrap;min-height:58px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:10px 12px;box-shadow:0 3px 0 var(--soft);font-size:13px}
.game-ui :is(.title,.tb-title,.tb-title,#topbar .t,.topbar .t){color:var(--ink);font-size:16px;font-weight:750;letter-spacing:0}
.game-ui :is(.topbar,.hud,#hud,#topbar) :is(b,.v){color:var(--accent);font-variant-numeric:tabular-nums}
.game-ui :is(.stat,.topbar .s,.topbar .stat,.scorebar,.stats,.tip,.hint,.hintline,.hsline,.best,.hiscore){color:var(--muted);line-height:1.7}
.game-ui :is(.hint,.hintline,.tip){font-size:12px;max-width:40em;text-wrap:pretty}
.game-ui .scorebar{padding:6px 10px;gap:8px;flex-wrap:wrap}
.game-ui :is(.iconbtn,.iconBtn,.icobtn,.ibtn,.tbtn,.hbtn,.ib,.iconBtn,.pause){min-width:44px;min-height:44px;flex-shrink:0;border-radius:12px;background:var(--soft);color:var(--ink);border:1px solid var(--line);box-shadow:none;font-size:17px}
.game-ui button{font-family:inherit;cursor:pointer;touch-action:manipulation}
.game-ui button:focus-visible,.game-ui [tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.game-ui :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn){background:var(--accent);color:var(--on-accent);border:1px solid transparent;border-radius:13px;min-height:50px;padding:13px 28px;font-size:16px;font-weight:750;letter-spacing:0;box-shadow:0 4px 0 var(--line);text-shadow:none;max-width:100%}
.game-ui :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn):active{box-shadow:none;transform:translateY(2px)}
.game-ui :is(.ghost,.ghostbtn,.btn2,.abtn,.toolbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line);box-shadow:none;border-radius:12px;min-height:44px}
.game-ui :is(.rowbtns,.btnrow,.ctlrow){gap:10px;flex-wrap:wrap;justify-content:center}
.game-ui :is(.pill,.hudbox,.hud .p){background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:none;font-variant-numeric:tabular-nums}
.game-ui :is(.dbtn,.cbtn,.gbtn,.holdbtn,.firebtn,.bombbtn,.jumpbtn,.pumpbtn,.nbtn){border-radius:12px;box-shadow:0 3px 0 var(--line);min-height:44px}
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv,.screen):has(>.ui-panel){padding:20px;overflow-y:auto;overscroll-behavior:contain}
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv):has(>.ui-panel){background:var(--page);backdrop-filter:none;justify-content:safe center;align-items:center}
.game-ui .ui-panel{width:min(100%,380px);max-height:100%;overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:18px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:24px;padding:30px 24px;box-shadow:0 8px 0 var(--soft),0 20px 48px #15253618;text-align:center;margin:auto}
.game-ui .ui-panel :is(.card,.panel,.pausecard,.ovcard){display:contents}
.game-ui .ui-panel :is(h1,h2,.gamename,.gametitle){font-size:30px;line-height:1.25;font-weight:800;color:var(--ink);background:none;-webkit-text-fill-color:currentColor;text-shadow:none;letter-spacing:-.6px;margin:0}
.game-ui .ui-panel :is(p,.howto,.sub,.rule){font-size:14px;line-height:1.85;color:var(--muted);background:none;border:0;box-shadow:none;padding:0;margin:0;max-width:32em;text-align:left;white-space:normal}
.game-ui .ui-panel :is(.bigemoji,.bigemoji,.ic,.big):not(.bigscore){animation:none;filter:none;text-shadow:none}
.game-ui .ui-emblem{width:90px;height:90px;display:grid;place-items:center;border:1px solid var(--line);border-radius:28px;background:var(--soft);font-size:48px;line-height:1;flex-shrink:0;position:relative}
.game-ui[data-theme="wood"] .ui-emblem{border-radius:50%;box-shadow:inset 0 0 0 5px var(--surface),inset 0 0 0 6px var(--line)}
.game-ui[data-theme="wood"] .ui-panel h1{font-family:"STKaiti","KaiTi","Microsoft YaHei",serif;letter-spacing:2px}
.game-ui[data-theme="ice"] .ui-emblem{border-radius:26px 8px 26px 8px}
.game-ui[data-theme="space"] .ui-emblem{background:radial-gradient(circle at center,var(--soft) 42%,transparent 43%),var(--surface);border-radius:50%;outline:1px solid var(--line);outline-offset:7px;margin:7px}
.game-ui[data-theme="kitchen"] .ui-emblem{border-radius:22px;border-bottom:5px solid var(--line)}
.game-ui .ui-panel :is(.score,.bigscore,.bigScore,.scorebig){color:var(--accent);font-size:48px;font-weight:800;font-variant-numeric:tabular-nums}
.game-ui .ui-panel :is(.best,.hsline,.hiscore,.endstats,.endstats b){color:var(--muted);font-size:13px;line-height:1.8}
.game-ui .ui-mode{display:grid;grid-template-columns:1fr 1fr;gap:5px;background:var(--soft);padding:5px;border:1px solid var(--line);border-radius:14px;width:100%}
.game-ui .ui-mode button{min-height:44px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-size:14px;font-weight:700;box-shadow:none}
.game-ui .ui-mode button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 2px 5px #1525361a}
.game-ui .ui-panel .ui-mode-note{font-size:12px;line-height:1.6;text-align:center;color:var(--muted)}
.game-ui .ui-mode-status{display:block;padding:5px 10px;color:var(--accent);font-size:11px;font-weight:700;line-height:1.5;text-align:center;border:1px solid var(--line);border-radius:8px;background:var(--surface);margin:4px auto;max-width:100%;pointer-events:none}
.game-ui body>.wrap>canvas:not(#fx){background-color:var(--stage);box-shadow:0 0 0 1px var(--line),0 6px 0 var(--soft);border-radius:18px;flex-shrink:0}
.game-ui .screen>canvas.game{box-shadow:0 0 0 1px var(--line),0 6px 0 var(--soft)}
.game-ui #hud{gap:6px;background:var(--surface);color:var(--ink)}
.game-ui #hud :is(.left,.t,.s,.grp,.pill){color:var(--ink)}
.game-ui #hud .pill{background:var(--surface);border-color:var(--line)}
.game-ui body canvas:is(#cv,#game,#board){background-color:var(--stage)}
.game-ui :is(button.dbtn,button.cbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.game-ui :is(button.lvl,button.lvlbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line);border-radius:12px;min-height:54px}
.game-ui :is(button.lvl,button.lvlbtn) :is(.nc,.sz,small){color:var(--muted)}
.game-ui .ui-panel button.lvl{margin:0;min-width:44px;box-shadow:none;padding:8px}
.game-ui #hud :is(.left,.right,.hudl,.hbtns){gap:5px;flex-wrap:wrap}
.game-ui #hud :is(.left,.hudl){min-width:0;flex-shrink:1}
.game-ui #hud :is(.pill,.left){font-size:12px}
.game-ui button:disabled{cursor:default;opacity:.45;box-shadow:none}
.game-ui .ui-panel .ui-assist-note{color:var(--accent);font-weight:700}
@media(min-width:700px){.game-ui body>.wrap{padding-top:32px}.game-ui .ui-panel{padding:36px 30px}}
@media(max-width:360px){.game-ui body>.wrap{padding:10px;gap:10px}.game-ui .ui-panel{padding:22px 18px;gap:13px}.game-ui .ui-panel h1{font-size:26px}.game-ui .ui-emblem{width:70px;height:70px;font-size:38px}.game-ui :is(.topbar,#topbar){gap:5px;padding:8px}.game-ui :is(.iconbtn,.icobtn,.ibtn,.tbtn,.ib){min-width:40px;min-height:44px}}
@media(max-height:650px){.game-ui .ui-panel{padding:18px;gap:12px}.game-ui .ui-emblem{width:60px;height:60px;font-size:32px}.game-ui .ui-panel h1{font-size:25px}.game-ui .ui-panel :is(p,.howto,.sub,.rule){font-size:13px}}
@media(prefers-reduced-motion:reduce){.game-ui *, .game-ui *::before,.game-ui *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}


</style>
<script>
// Installed before the original game script; embedded so downloaded ZIPs remain offline capable.
(function () {
  'use strict';
  var config = {"id":"debrisweep","name":"太空清道夫","theme":"space","icon":"🧹","challenge":"牵引圈缩至 66，清垃圾时更要避开炸弹"};
  var mode = 'classic';
  try { mode = sessionStorage.getItem('game100-mode-' + config.id) || mode; } catch (_) {}
  var expert = mode === 'expert';
  var used = { hint: 0, undo: 0 };
  var limits = { hint: 1, undo: 3 };
  function storageKey(key) { return expert && !/sound|mute/i.test(key) ? 'expert:' + key : key; }
  window.GameUI = {
    expert: expert,
    pick: function (classic, advanced) { return expert ? advanced : classic; },
    storageGet: function (key) { return localStorage.getItem(storageKey(key)); },
    storageSet: function (key, value) { localStorage.setItem(storageKey(key), value); },
    storageRemove: function (key) { localStorage.removeItem(storageKey(key)); }
  };
  var root = document.documentElement;
  root.classList.add('game-ui');
  root.dataset.theme = config.theme;
  root.dataset.game = config.id;
  root.dataset.mode = mode;
  var gesture = new WeakMap();
  function labelButtons(scope) {
    scope.querySelectorAll('button').forEach(function (button) {
      if (button.getAttribute('aria-label')) return;
      var id = button.id.toLowerCase(), text = button.textContent.trim();
      var name = /mute|sound|snd/.test(id) ? '切换音效' : /pause/.test(id) ? '暂停游戏' : /hint/.test(id) && !/close|ok/.test(id) ? '查看提示' : '';
      if (!name && /^[⏸🔊🔇💡Ⅱ]+$/u.test(text)) name = { '⏸': '暂停游戏', '🔊': '切换音效', '🔇': '切换音效', '💡': '查看提示' }[text];
      if (name) button.setAttribute('aria-label', name);
    });
  }
  function decorate(container) {
    if (container.querySelector(':scope > .ui-panel') || !container.querySelector('h1,h2,.gamename')) return;
    if (container.matches('.screen') && container.querySelector('canvas:not(#fx)')) return;
    var panel = document.createElement('div');
    panel.className = 'ui-panel';
    while (container.firstChild) panel.appendChild(container.firstChild);
    container.appendChild(panel);
    var heading = panel.querySelector('h1,h2,.gamename');
    var start = /start|menu|ready/i.test(container.id) || !!panel.querySelector('#startBtn,#btnStart,.startbtn');
    if (start) {
      var headings = panel.querySelectorAll('h1,h2,.gamename');
      if (headings.length > 1 && !/[A-Za-z0-9\u4e00-\u9fff]/.test(heading.textContent)) { heading.remove(); heading = headings[1]; }
      var oldIcon = panel.querySelector('.bigemoji,.ic');
      if (oldIcon) oldIcon.remove();
      var emblem = document.createElement('div');
      emblem.className = 'ui-emblem'; emblem.textContent = config.icon; emblem.setAttribute('aria-hidden', 'true');
      panel.insertBefore(emblem, panel.firstChild);
      heading.textContent = config.name;
      var switcher = document.createElement('div'); switcher.className = 'ui-mode'; switcher.setAttribute('role', 'group'); switcher.setAttribute('aria-label', '选择玩法模式');
      [['classic','经典模式'],['expert','进阶挑战']].forEach(function (item) {
        var b = document.createElement('button'); b.type = 'button'; b.textContent = item[1]; b.dataset.mode = item[0]; b.setAttribute('aria-pressed', String(mode === item[0]));
        b.addEventListener('click', function () {
          if (mode === item[0]) return;
          try { sessionStorage.setItem('game100-mode-' + config.id, item[0]); location.reload(); }
          catch (_) { b.textContent = '浏览器未允许保存模式'; }
        });
        switcher.appendChild(b);
      });
      var primary = panel.querySelector('#startBtn,#btnStart,.startbtn,button');
      var anchor = primary;
      while (anchor && anchor.parentNode !== panel && !anchor.parentNode.matches('.card,.panel,.pausecard,.ovcard')) anchor = anchor.parentNode;
      var target = anchor ? anchor.parentNode : panel;
      target.insertBefore(switcher, anchor || null);
      var note = document.createElement('p'); note.className = 'ui-mode-note';
      note.textContent = expert ? config.challenge + '。进阶纪录单独保存。' : '按原规则轻松开局，也可切换进阶挑战。';
      target.insertBefore(note, anchor || null);
    }
    labelButtons(panel);
  }
  function notify(text) {
    var el = document.getElementById('ui-assist-toast');
    if (!el) { el = document.createElement('div'); el.id = 'ui-assist-toast'; el.className = 'ui-mode-status'; el.setAttribute('role', 'status'); el.style.cssText = 'position:fixed;bottom:18px;left:16px;right:16px;z-index:200;padding:14px'; document.body.appendChild(el); }
    el.textContent = text; el.hidden = false;
    clearTimeout(notify.timer); notify.timer = setTimeout(function () { el.hidden = true; }, 2000);
  }
  function assistEvent(event) {
    if (!expert) return;
    var b = event.target.closest('button'); if (!b || b.closest('.ui-mode')) return;
    var kind = /^(hintBtn|hintTopBtn|btnHint)$/i.test(b.id) ? 'hint' : /^(undoBtn|undoTopBtn|btnUndo)$/i.test(b.id) || /悔一步|撤销/.test(b.textContent) ? 'undo' : '';
    if (!kind) return;
    var prev = gesture.get(b), blocked;
    if (event.type === 'click' && prev && performance.now() - prev.at < 1000) blocked = prev.blocked;
    else { blocked = used[kind] >= limits[kind]; if (!blocked) used[kind]++; gesture.set(b, { at: performance.now(), blocked: blocked }); }
    if (blocked) { event.preventDefault(); event.stopImmediatePropagation(); notify(kind === 'hint' ? '本次挑战的 1 次提示已用完' : '本次挑战的 3 次撤销已用完'); }
  }
  document.addEventListener('pointerdown', assistEvent, true);
  document.addEventListener('click', assistEvent, true);
  document.addEventListener('click', function (event) {
    var b = event.target.closest('button');
    if (b && /^(startBtn|btnStart|restartBtn|againBtn|retryBtn|btnAgain|btnRestart|playAgain)$/i.test(b.id)) used = { hint: 0, undo: 0 };
  }, true);
  document.addEventListener('DOMContentLoaded', function () {
    var selector = '.overlay,.ov,#ov,#overlay,#pauseOv,.screen';
    document.querySelectorAll(selector).forEach(function (container) {
      decorate(container);
      // Only dynamic overlay children are observed; animated scores never trigger this work.
      new MutationObserver(function () { decorate(container); }).observe(container, { childList: true });
    });
    labelButtons(document);
  });
}());

</script>
<!-- GAME UI END -->
</head>
<body>
<div id="wrap">
<canvas id="cv" width="480" height="720"></canvas>
<div id="hud">
<div class="info"><span id="score">⭐0</span><span id="time">⏱90</span><span id="lives">❤️❤️❤️</span></div>
<div class="btns"><button class="iconbtn" id="muteBtn" aria-label="静音">🔊</button><button class="iconbtn" id="pauseBtn" aria-label="暂停">⏸</button></div>
</div>
<div id="flash"></div>
<div class="overlay" id="startOv">
<h1>🧹 太空清道夫</h1>
<p>手指按住屏幕拖拽，在指尖生成牵引光束圈<br>🔩⚙️📡 垃圾被吸住后飞向飞船回收 <b>+10分</b><br>💣 <b>炸弹也会被吸过来！</b>别让它撞上飞船<br>⏱ 限时90秒，垃圾越掉越快，飞船只有3条命</p>
<button class="bigbtn" id="startBtn">开始清扫</button>
</div>
<div class="overlay" id="pauseOv" style="display:none">
<h1>⏸ 已暂停</h1>
<button class="bigbtn" id="resumeBtn">继续</button>
</div>
<div class="overlay" id="endOv" style="display:none">
<h1 id="endTitle">🏁 清扫结束</h1>
<div id="newRec">🎉 新纪录！</div>
<div id="endScore">得分 0</div>
<div id="endBest" style="color:#8fa0c2">历史最高 0</div>
<button class="bigbtn" id="retryBtn">再来一局</button>
</div>
</div>
<script>
/* GAMEPLAY UPGRADE */'use strict';
var W=480,H=720,SHIP={x:240,y:648},BEAM_R=GameUI.pick(90,66),GAME_LEN=90;
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var scoreEl=document.getElementById('score'),timeEl=document.getElementById('time'),livesEl=document.getElementById('lives');
var flashEl=document.getElementById('flash');
var DEBRIS=['🔩','⚙️','📡'];
var state='start',score=0,lives=3,elapsed=0,timeLeft=GAME_LEN,spawnT=0.8;
var entities=[],particles=[],floaters=[],stars=[];
var pointer={active:false,x:240,y:400};
var shakeT=0,breath=0,rafId=0,lastT=0;
var HS_KEY='g100_debrisweep_hs',MUTE_KEY='g100_mute';
var high=0,muted=false;
try{high=parseInt(GameUI.storageGet(HS_KEY)||'0',10)||0;}catch(e){}
try{muted=GameUI.storageGet(MUTE_KEY)==='1';}catch(e){}
var actx=null;
function ac(){if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(actx&&actx.state==='suspended'){actx.resume();}return actx;}
function tone(f,dur,type,vol,delay,slide){if(muted)return;var a=ac();if(!a)return;var t0=a.currentTime+(delay||0);var o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t0);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t0+dur);g.gain.setValueAtTime(vol||0.15,t0);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);o.connect(g);g.connect(a.destination);o.start(t0);o.stop(t0+dur+0.02);}
function noiseHit(dur,vol){if(muted)return;var a=ac();if(!a)return;var n=Math.floor(a.sampleRate*dur),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);for(var i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);var s=a.createBufferSource();s.buffer=buf;var f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=700;var g=a.createGain();g.gain.value=vol;tone(120,dur,'square',vol*0.7,0,40);s.connect(f);f.connect(g);g.connect(a.destination);s.start();}
function sndClick(){tone(620,0.06,'triangle',0.12);}
function sndPickup(){tone(880,0.08,'sine',0.14);tone(1318,0.1,'sine',0.12,0.07);}
function sndBoom(){noiseHit(0.35,0.3);}
function sndEnd(){tone(523,0.14,'triangle',0.16);tone(659,0.14,'triangle',0.16,0.14);tone(784,0.22,'triangle',0.18,0.28);}
function buzz(ms){try{if(navigator.vibrate)navigator.vibrate(ms);}catch(e){}}
for(var i=0;i<110;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.6+0.4,tw:Math.random()*6.28});
function setMute(m){muted=m;try{GameUI.storageSet(MUTE_KEY,m?'1':'0');}catch(e){}document.getElementById('muteBtn').textContent=m?'🔇':'🔊';}
document.getElementById('muteBtn').textContent=muted?'🔇':'🔊';
document.getElementById('muteBtn').onclick=function(){sndClick();setMute(!muted);};
function updateHud(){scoreEl.textContent='⭐'+score;timeEl.textContent='⏱'+Math.ceil(timeLeft);var h='';for(var k=0;k<lives;k++)h+='❤️';for(var j=0;j<3-lives;j++)h+='🤍';livesEl.textContent=h;}
function spawn(){var isBomb=Math.random()<0.15;entities.push({kind:isBomb?'b':'d',emoji:isBomb?'💣':DEBRIS[(Math.random()*DEBRIS.length)|0],x:24+Math.random()*(W-48),y:-30,vx:(Math.random()*2-1)*45,vy:70+Math.random()*75,rot:Math.random()*6.28,vr:(Math.random()*2-1)*2.2,state:'fall'});}
function burst(x,y,text,n){for(var k=0;k<n;k++){var a=Math.random()*6.28,s=60+Math.random()*160;particles.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-40,life:0.7,max:0.7,text:text||'✨',size:14+Math.random()*12});}}
function floater(x,y,text,color){floaters.push({x:x,y:y,text:text,color:color||'#ffd54a',life:1.1});}
function flashRed(){flashEl.style.transition='none';flashEl.style.opacity='1';void flashEl.offsetWidth;flashEl.style.transition='opacity .35s';flashEl.style.opacity='0';}
function resolve(e){if(e.kind==='d'){score+=10;sndPickup();burst(SHIP.x,SHIP.y-30,'✨',10);floater(SHIP.x,SHIP.y-70,'+10','#7CFFB2');}else{lives--;sndBoom();buzz(80);shakeT=14;flashRed();burst(e.x,e.y,'💥',16);floater(e.x,e.y-24,'-1 ❤️','#ff6b6b');if(lives<=0){gameOver('💥 飞船被炸毁了');}}}
function gameOver(title){if(state!=='playing')return;state='over';cancelAnimationFrame(rafId);sndEnd();var nr=false;if(score>high){high=score;nr=true;try{GameUI.storageSet(HS_KEY,String(high));}catch(e){}}document.getElementById('endTitle').textContent=title;document.getElementById('newRec').style.display=nr?'block':'none';document.getElementById('endScore').textContent='得分 '+score;document.getElementById('endBest').textContent='历史最高 '+high;document.getElementById('endOv').style.display='flex';}
function reset(){score=0;lives=3;elapsed=0;timeLeft=GAME_LEN;spawnT=0.8;entities=[];particles=[];floaters=[];pointer.active=false;shakeT=0;updateHud();}
function startGame(){ac();sndClick();reset();state='playing';document.getElementById('startOv').style.display='none';document.getElementById('endOv').style.display='none';document.getElementById('pauseOv').style.display='none';lastT=performance.now();rafId=requestAnimationFrame(loop);}
function pauseGame(){if(state!=='playing')return;state='paused';cancelAnimationFrame(rafId);sndClick();document.getElementById('pauseOv').style.display='flex';}
function resumeGame(){if(state!=='paused')return;sndClick();state='playing';document.getElementById('pauseOv').style.display='none';lastT=performance.now();rafId=requestAnimationFrame(loop);}
document.getElementById('startBtn').onclick=startGame;
document.getElementById('retryBtn').onclick=startGame;
document.getElementById('resumeBtn').onclick=resumeGame;
document.getElementById('pauseBtn').onclick=function(){if(state==='playing')pauseGame();else if(state==='paused')resumeGame();};
cv.addEventListener('pointerdown',function(e){e.preventDefault();var r=cv.getBoundingClientRect();pointer.x=(e.clientX-r.left)/r.width*W;pointer.y=(e.clientY-r.top)/r.height*H;pointer.active=true;ac();});
cv.addEventListener('pointermove',function(e){if(!pointer.active)return;var r=cv.getBoundingClientRect();pointer.x=(e.clientX-r.left)/r.width*W;pointer.y=(e.clientY-r.top)/r.height*H;});
function endPointer(){pointer.active=false;}
cv.addEventListener('pointerup',endPointer);cv.addEventListener('pointercancel',endPointer);cv.addEventListener('pointerleave',endPointer);
function loop(now){if(state!=='playing')return;rafId=requestAnimationFrame(loop);var dt=Math.min((now-lastT)/1000,0.05);lastT=now;update(dt);draw();}
function update(dt){elapsed+=dt;breath+=dt;timeLeft-=dt;if(timeLeft<=0){timeLeft=0;updateHud();gameOver('🏁 清扫结束');return;}spawnT-=dt;var iv=1.1-0.55*Math.min(1,elapsed/GAME_LEN);if(spawnT<=0){spawn();spawnT=iv;}var i,e,dx,dy,d;
for(i=0;i<entities.length;i++){e=entities[i];
if(e.state==='fall'){e.x+=e.vx*dt;e.y+=e.vy*dt;e.rot+=e.vr*dt;if(pointer.active){dx=e.x-pointer.x;dy=e.y-pointer.y;if(dx*dx+dy*dy<BEAM_R*BEAM_R)e.state='suck';}if(e.y>H+30)e.dead=true;}
else{dx=SHIP.x-e.x;dy=SHIP.y-e.y;d=Math.sqrt(dx*dx+dy*dy)||1;var sp=430;e.x+=dx/d*sp*dt;e.y+=dy/d*sp*dt;e.rot+=e.vr*dt*2;if(d<40){resolve(e);e.dead=true;if(state!=='playing')return;}}}
entities=entities.filter(function(e){return !e.dead;});
for(i=particles.length-1;i>=0;i--){var p=particles[i];p.life-=dt;if(p.life<=0){particles.splice(i,1);continue;}p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=160*dt;}
for(i=floaters.length-1;i>=0;i--){var f=floaters[i];f.life-=dt;f.y-=34*dt;if(f.life<=0)floaters.splice(i,1);}
if(shakeT>0)shakeT=Math.max(0,shakeT-dt*30);
updateHud();}
function draw(){ctx.save();ctx.clearRect(0,0,W,H);ctx.fillStyle='#0b1020';ctx.fillRect(0,0,W,H);
if(shakeT>0)ctx.translate((Math.random()*2-1)*shakeT,(Math.random()*2-1)*shakeT);
var t=breath;
for(var s=0;s<stars.length;s++){var st=stars[s];var a=0.35+0.3*Math.sin(t*2+st.tw);ctx.globalAlpha=Math.max(0.08,a);ctx.fillStyle='#cfe0ff';ctx.beginPath();ctx.arc(st.x,st.y,st.r,0,6.283);ctx.fill();}
ctx.globalAlpha=1;
var anySuck=false,i;
for(i=0;i<entities.length;i++)if(entities[i].state==='suck'){anySuck=true;break;}
if(pointer.active){var br=BEAM_R+Math.sin(t*6)*6;
if(anySuck){var g=ctx.createLinearGradient(pointer.x,pointer.y,SHIP.x,SHIP.y);g.addColorStop(0,'rgba(124,255,178,.28)');g.addColorStop(1,'rgba(124,255,178,.02)');ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(pointer.x-br*0.7,pointer.y);ctx.lineTo(SHIP.x-26,SHIP.y-20);ctx.lineTo(SHIP.x+26,SHIP.y-20);ctx.lineTo(pointer.x+br*0.7,pointer.y);ctx.closePath();ctx.fill();}
ctx.save();ctx.shadowColor='#7cffb2';ctx.shadowBlur=18;ctx.strokeStyle='rgba(124,255,178,.85)';ctx.lineWidth=3;ctx.setLineDash([14,10]);ctx.lineDashOffset=-t*40;ctx.beginPath();ctx.arc(pointer.x,pointer.y,br,0,6.283);ctx.stroke();ctx.restore();ctx.setLineDash([]);
ctx.save();ctx.globalAlpha=0.5;ctx.fillStyle='#7cffb2';ctx.beginPath();ctx.arc(pointer.x,pointer.y,6+Math.sin(t*6)*2,0,6.283);ctx.fill();ctx.restore();}
ctx.save();ctx.shadowColor='#35a088';ctx.shadowBlur=22;ctx.font='56px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🛸',SHIP.x,SHIP.y);ctx.restore();
for(i=0;i<entities.length;i++){var e=entities[i];ctx.save();ctx.translate(e.x,e.y);
if(e.kind==='b'){ctx.strokeStyle='rgba(255,80,80,.8)';ctx.lineWidth=2.5;ctx.setLineDash([6,5]);ctx.lineDashOffset=-t*24;ctx.beginPath();ctx.arc(0,0,24+Math.sin(t*8)*3,0,6.283);ctx.stroke();ctx.setLineDash([]);}
if(e.state==='suck'){ctx.shadowColor=e.kind==='b'?'#ff5050':'#7cffb2';ctx.shadowBlur=16;}
ctx.rotate(e.rot);ctx.font='30px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(e.emoji,0,0);ctx.restore();}
for(i=0;i<particles.length;i++){var p=particles[i];ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.font=p.size+'px serif';ctx.textAlign='center';ctx.fillText(p.text,p.x,p.y);}
ctx.globalAlpha=1;ctx.font='bold 20px sans-serif';ctx.textAlign='center';
for(i=0;i<floaters.length;i++){var f2=floaters[i];ctx.globalAlpha=Math.min(1,f2.life*2);ctx.fillStyle=f2.color;ctx.fillText(f2.text,f2.x,f2.y);}
ctx.globalAlpha=1;ctx.restore();}
updateHud();
</script>
</body>
