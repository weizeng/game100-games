<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>镜像涂鸦</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#12061a;font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;color:#f3d9ff;touch-action:none;user-select:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column}
#cv{display:block;border-radius:10px;box-shadow:0 0 40px #e040fb55;touch-action:none}
.hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:10px 14px;z-index:5;pointer-events:none}
.hud .info{font-size:15px;font-weight:700;text-shadow:0 0 8px #e040fb}
.hud .btns{pointer-events:auto;display:flex;gap:10px}
.cbtn{width:44px;height:44px;border-radius:50%;border:2px solid #e040fb;background:#e040fb22;color:#e040fb;font-size:20px;display:flex;align-items:center;justify-content:center}
.ctl{position:fixed;bottom:12px;left:0;right:0;z-index:5;display:flex;justify-content:center;gap:12px;padding:0 10px}
.pbtn{min-width:76px;min-height:56px;padding:8px 14px;border-radius:14px;border:2px solid #e040fb;background:#e040fb1e;color:#f3d9ff;font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:6px;touch-action:manipulation}
.pbtn:active{background:#e040fb55}
.overlay{position:fixed;inset:0;background:rgba(18,6,26,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;text-align:center;padding:24px}
.overlay h1{font-size:32px;color:#e040fb;text-shadow:0 0 18px #e040fb;margin-bottom:12px}
.overlay p{font-size:15px;line-height:1.8;color:#e6c4f2;max-width:430px;margin-bottom:6px}
.bigbtn{margin-top:14px;min-width:180px;min-height:52px;font-size:19px;font-weight:800;color:#22032e;background:linear-gradient(180deg,#f48ffb,#e040fb);border:none;border-radius:12px;cursor:pointer;box-shadow:0 0 24px #e040fb88}
.bigbtn:active{transform:scale(.96)}
.hidden{display:none!important}
</style>
<!-- GAME UI BEGIN -->
<style>
:root{--page:#f5e4eb;--surface:#fff8fc;--soft:#edd5e2;--ink:#4e2e49;--muted:#806079;--accent:#a33d70;--on-accent:#ffffff;--line:#d9b4ca;--stage:#33223d;--page:#8d58ff;--surface:#fff4fb;--soft:#ffdff0;--ink:#5a1f55;--muted:#91517f;--accent:#7d6619;--on-accent:#ffffff;--line:#ff9fd0;--b-bg1:#ff8ac6;--b-bg2:#8d58ff;--b-btn:#ffcf33;--b-btn-hi:#ffe07a;--b-edge:#e08600;--b-glow:#ffd6f0;--b-glow-rgb:255,214,240;--b-pedge-rgb:255,159,208;--b-btn-ink:#7b4a00;--b-btn-tsh:0 1px 0 rgba(255,255,255,.45);--b-coin-ink:#7b4a00;--b-coin-tsh:none;--b-key-ink:#7d6619;--b-title:#8f5600}
/* Shared presentation only; mechanics and state remain inside each standalone game. */
html.game-ui{background:var(--page);color:var(--ink);color-scheme:light;font-family:"Bahnschrift","Microsoft YaHei UI","PingFang SC",sans-serif}
html.game-ui:is([data-theme="space"],[data-theme="arcade"],[data-theme="lab"],[data-theme="ocean"],[data-theme="magic"]){color-scheme:dark}
.game-ui body{background:var(--page);color:var(--ink);font-family:inherit;overscroll-behavior:none}
.game-ui body>.wrap{padding:20px 16px max(20px,env(safe-area-inset-bottom));gap:14px;max-width:500px}
.game-ui #app{background:var(--page);color:var(--ink)}
.game-ui :is(.topbar,#topbar){gap:8px;flex-wrap:wrap;min-height:58px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:10px 12px;box-shadow:0 3px 0 var(--soft);font-size:13px}
.game-ui :is(.title,.tb-title,.tb-title,#topbar .t,.topbar .t){color:var(--ink);font-size:16px;font-weight:750;letter-spacing:0}
.game-ui :is(.topbar,.hud,#hud,#topbar) :is(b,.v){color:var(--accent);font-variant-numeric:tabular-nums}
.game-ui :is(.stat,.topbar .s,.topbar .stat,.scorebar,.stats,.tip,.hint,.hintline,.hsline,.best,.hiscore){color:var(--muted);line-height:1.7}
.game-ui :is(.hint,.hintline,.tip){font-size:12px;max-width:40em;text-wrap:pretty}
.game-ui .scorebar{padding:6px 10px;gap:8px;flex-wrap:wrap}
.game-ui :is(.iconbtn,.iconBtn,.icobtn,.ibtn,.tbtn,.hbtn,.ib,.iconBtn,.pause){min-width:44px;min-height:44px;flex-shrink:0;border-radius:12px;background:var(--soft);color:var(--ink);border:1px solid var(--line);box-shadow:none;font-size:17px}
.game-ui button{font-family:inherit;cursor:pointer;touch-action:manipulation}
.game-ui button:focus-visible,.game-ui [tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.game-ui :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn){background:var(--accent);color:var(--on-accent);border:1px solid transparent;border-radius:13px;min-height:50px;padding:13px 28px;font-size:16px;font-weight:750;letter-spacing:0;box-shadow:0 4px 0 var(--line);text-shadow:none;max-width:100%}
.game-ui :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn):active{box-shadow:none;transform:translateY(2px)}
.game-ui :is(.ghost,.ghostbtn,.btn2,.abtn,.toolbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line);box-shadow:none;border-radius:12px;min-height:44px}
.game-ui :is(.rowbtns,.btnrow,.ctlrow){gap:10px;flex-wrap:wrap;justify-content:center}
.game-ui :is(.pill,.hudbox,.hud .p){background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:none;font-variant-numeric:tabular-nums}
.game-ui :is(.dbtn,.cbtn,.gbtn,.holdbtn,.firebtn,.bombbtn,.jumpbtn,.pumpbtn,.nbtn){border-radius:12px;box-shadow:0 3px 0 var(--line);min-height:44px}
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv,.screen):has(>.ui-panel){padding:20px;overflow-y:auto;overscroll-behavior:contain}
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv):has(>.ui-panel){background:var(--page);backdrop-filter:none;justify-content:safe center;align-items:center}
.game-ui .ui-panel{width:min(100%,380px);max-height:100%;overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:18px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:24px;padding:30px 24px;box-shadow:0 8px 0 var(--soft),0 20px 48px #15253618;text-align:center;margin:auto}
.game-ui .ui-panel :is(.card,.panel,.pausecard,.ovcard){display:contents}
.game-ui .ui-panel :is(h1,h2,.gamename,.gametitle){font-size:30px;line-height:1.25;font-weight:800;color:var(--ink);background:none;-webkit-text-fill-color:currentColor;text-shadow:none;letter-spacing:-.6px;margin:0}
.game-ui .ui-panel :is(p,.howto,.sub,.rule){font-size:14px;line-height:1.85;color:var(--muted);background:none;border:0;box-shadow:none;padding:0;margin:0;max-width:32em;text-align:left;white-space:normal}
.game-ui .ui-panel :is(.bigemoji,.bigemoji,.ic,.big):not(.bigscore){animation:none;filter:none;text-shadow:none}
.game-ui .ui-emblem{width:90px;height:90px;display:grid;place-items:center;border:1px solid var(--line);border-radius:28px;background:var(--soft);font-size:48px;line-height:1;flex-shrink:0;position:relative}
.game-ui[data-theme="wood"] .ui-emblem{border-radius:50%;box-shadow:inset 0 0 0 5px var(--surface),inset 0 0 0 6px var(--line)}
.game-ui[data-theme="wood"] .ui-panel h1{font-family:"STKaiti","KaiTi","Microsoft YaHei",serif;letter-spacing:2px}
.game-ui[data-theme="ice"] .ui-emblem{border-radius:26px 8px 26px 8px}
.game-ui[data-theme="space"] .ui-emblem{background:radial-gradient(circle at center,var(--soft) 42%,transparent 43%),var(--surface);border-radius:50%;outline:1px solid var(--line);outline-offset:7px;margin:7px}
.game-ui[data-theme="kitchen"] .ui-emblem{border-radius:22px;border-bottom:5px solid var(--line)}
.game-ui .ui-panel :is(.score,.bigscore,.bigScore,.scorebig){color:var(--accent);font-size:48px;font-weight:800;font-variant-numeric:tabular-nums}
.game-ui .ui-panel :is(.best,.hsline,.hiscore,.endstats,.endstats b){color:var(--muted);font-size:13px;line-height:1.8}
.game-ui .ui-mode{display:grid;grid-template-columns:1fr 1fr;gap:5px;background:var(--soft);padding:5px;border:1px solid var(--line);border-radius:14px;width:100%}
.game-ui .ui-mode button{min-height:44px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-size:14px;font-weight:700;box-shadow:none}
.game-ui .ui-mode button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 2px 5px #1525361a}
.game-ui .ui-panel .ui-mode-note{font-size:12px;line-height:1.6;text-align:center;color:var(--muted)}
.game-ui .ui-mode-status{display:block;padding:5px 10px;color:var(--accent);font-size:11px;font-weight:700;line-height:1.5;text-align:center;border:1px solid var(--line);border-radius:8px;background:var(--surface);margin:4px auto;max-width:100%;pointer-events:none}
.game-ui body>.wrap>canvas:not(#fx){background-color:var(--stage);box-shadow:0 0 0 1px var(--line),0 6px 0 var(--soft);border-radius:18px;flex-shrink:0}
.game-ui .screen>canvas.game{box-shadow:0 0 0 1px var(--line),0 6px 0 var(--soft)}
.game-ui #hud{gap:6px;background:var(--surface);color:var(--ink)}
.game-ui #hud :is(.left,.t,.s,.grp,.pill){color:var(--ink)}
.game-ui #hud .pill{background:var(--surface);border-color:var(--line)}
.game-ui body canvas:is(#cv,#game,#board){background-color:var(--stage)}
.game-ui :is(button.dbtn,button.cbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.game-ui :is(button.lvl,button.lvlbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line);border-radius:12px;min-height:54px}
.game-ui :is(button.lvl,button.lvlbtn) :is(.nc,.sz,small){color:var(--muted)}
.game-ui .ui-panel button.lvl{margin:0;min-width:44px;box-shadow:none;padding:8px}
.game-ui #hud :is(.left,.right,.hudl,.hbtns){gap:5px;flex-wrap:wrap}
.game-ui #hud :is(.left,.hudl){min-width:0;flex-shrink:1}
.game-ui #hud :is(.pill,.left){font-size:12px}
.game-ui button:disabled{cursor:default;opacity:.45;box-shadow:none}
.game-ui .ui-panel .ui-assist-note{color:var(--accent);font-weight:700}
@media(min-width:700px){.game-ui body>.wrap{padding-top:32px}.game-ui .ui-panel{padding:36px 30px}}
@media(max-width:360px){.game-ui body>.wrap{padding:10px;gap:10px}.game-ui .ui-panel{padding:22px 18px;gap:13px}.game-ui .ui-panel h1{font-size:26px}.game-ui .ui-emblem{width:70px;height:70px;font-size:38px}.game-ui :is(.topbar,#topbar){gap:5px;padding:8px}.game-ui :is(.iconbtn,.icobtn,.ibtn,.tbtn,.ib){min-width:40px;min-height:44px}}
@media(max-height:650px){.game-ui .ui-panel{padding:18px;gap:12px}.game-ui .ui-emblem{width:60px;height:60px;font-size:32px}.game-ui .ui-panel h1{font-size:25px}.game-ui .ui-panel :is(p,.howto,.sub,.rule){font-size:13px}}
@media(prefers-reduced-motion:reduce){.game-ui *, .game-ui *::before,.game-ui *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
/* 2026-10-20 热修：开局/结算遮罩铺满整屏，主按钮固定在面板底部，避免被画布尺寸裁切（#10） */
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv):has(>.ui-panel){position:fixed;inset:0;z-index:1000;border-radius:0;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
.game-ui .ui-panel{touch-action:pan-y}
.game-ui .ui-panel :is(#startBtn,#btnStart,.startbtn,#bStart,#restartBtn,#btnRestart,#againBtn,#btnAgain,#retryBtn,#btnRetry,#playBtn,#btnPlay){position:sticky;bottom:0;z-index:3;flex-shrink:0}
.game-ui .ui-panel :not(.card,.panel,.pausecard,.ovcard,.ui-mode):has(>:is(#startBtn,#btnStart,.startbtn,#bStart,#restartBtn,#btnRestart,#againBtn,#btnAgain,#retryBtn,#btnRetry,#playBtn,#btnPlay)){position:sticky;bottom:0;z-index:3;flex-shrink:0;background:var(--surface);box-shadow:0 -10px 10px -6px var(--surface)}


/* ===== Direction B · 霓虹糖果 Pop Arcade ===== saturated gradients, chunky bevels with a hard bottom edge, sticker panels, neon on dark themes */
html.game-ui[data-skin="b"]{--fb:"HarmonyOS Sans SC","MiSans","OPPOSans","vivo Sans","Noto Sans SC","Noto Sans CJK SC","PingFang SC","Microsoft YaHei UI",system-ui,sans-serif;--bounce:cubic-bezier(.34,1.56,.64,1);--bg:radial-gradient(circle at 12% 18%,rgba(255,255,255,.28) 0 38px,transparent 40px),radial-gradient(circle at 88% 30%,rgba(255,255,255,.16) 0 64px,transparent 66px),radial-gradient(circle at 20% 82%,rgba(255,255,255,.14) 0 52px,transparent 54px),radial-gradient(rgba(255,255,255,.16) 1.5px,transparent 2.2px) 0 0/22px 22px,linear-gradient(165deg,var(--b-bg1),var(--b-bg2));font-family:var(--fb)}
html.game-ui[data-skin="b"],html.game-ui[data-skin="b"] body,html.game-ui[data-skin="b"] #app,html.game-ui[data-skin="b"] :is(.overlay,.ov,#ov,#overlay,#pauseOv):has(>.ui-panel){background:var(--bg);background-color:var(--b-bg2)}

html.game-ui[data-skin="b"] .ui-panel :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn,button.actBtn):not(.ghost):not(#\#){min-height:56px;padding:14px 34px;font-size:19px;letter-spacing:1px}

    },
    // Glow is shadowBlur: cheap for a handful of shapes, never use it on every tile.
    glow: function (ctx, color, blur) { ctx.shadowColor = color; ctx.shadowBlur = blur; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0; },
    noGlow: function (ctx) { ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; },
    // Crisp rendering on high-DPI phones without changing game coordinates.
    // Only safe where input code converts with getBoundingClientRect + logical W/H, not cv.width.
    hidpi: function (cv, ctx, w, h) {
      var d = Math.max(1, Math.min(2.5, window.devicePixelRatio || 1));
      cv.width = Math.round(w * d); cv.height = Math.round(h * d); // intrinsic ratio stays w:h, so CSS sizing is unchanged
      ctx.setTransform(d, 0, 0, d, 0, 0); return d;
    },
    // Lightweight particle bursts (pooled array, no allocations per frame beyond the burst).
    burst: function (list, x, y, color, n) {
      for (var i = 0; i < (n || 12); i++) { var a = Math.random() * 6.283, v = 1 + Math.random() * 2.6; list.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 1, life: 1, c: color, r: 1.5 + Math.random() * 2.5 }); }
    },
    drawBurst: function (ctx, list) {
      for (var i = list.length - 1; i >= 0; i--) {
        var p = list[i]; p.x += p.vx; p.y += p.vy; p.vy += .12; p.life -= .035;
        if (p.life <= 0) { list.splice(i, 1); continue; }
        ctx.globalAlpha = p.life; ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (skin === 'b' ? 1.2 : 1), 0, 7); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
  };
  window.GameUI.fx = fx;
}());

</script>
<!-- GAME UI END -->
</head>
<body>
<div class="hud">
  <div class="info"><span id="round">第1/3轮</span> ⏱<span id="time">60</span> 分<span id="score">0</span></div>
  <div class="btns"><div class="cbtn" id="muteBtn">🔊</div><div class="cbtn" id="pauseBtn">⏸</div></div>
</div>
<div id="wrap"><canvas id="cv" width="600" height="860"></canvas></div>
<div class="ctl">
  <div class="pbtn" id="bClear">🧹 清除</div>
  <div class="pbtn" id="bColor">🎨 <span id="cDot" style="color:#ff6d9d">●</span></div>
  <div class="pbtn" id="bDone">✅ 完成</div>
</div>
<div class="overlay" id="startOv">
  <h1>🎨 镜像涂鸦</h1>
  <p>在 <b>左半屏</b> 手指作画，<b>右半屏</b> 实时生成对称霓虹镜像！<br>每轮给出目标图案（🦋 蝴蝶 / 💗 心形 / ❄️ 雪花），<br><b>60 秒</b> 内在左半屏临摹，结束按像素相似度打分<br>三轮总分即你的艺术分 🎭<br>小技巧：只画左半边，对称交给魔法 ✨</p>
  <button class="bigbtn" id="startBtn">开 始 作 画</button>
</div>
<div class="overlay hidden" id="pauseOv">
  <h1>⏸ 已暂停</h1>
  <button class="bigbtn" id="resumeBtn">继 续</button>
  <button class="bigbtn" id="restartBtn1" style="background:linear-gradient(180deg,#9db8ff,#5f7cff)">重 来</button>
</div>
<div class="overlay hidden" id="endOv">
  <h1 id="endTitle">🎨 展览结束！</h1>
  <p id="endText"></p><p id="hsText"></p>
  <button class="bigbtn" id="restartBtn2">再画一次</button>
</div>
<script>
'use strict';
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const W=600,H=860,HSK='g100_neonmirror_hs',MKEY='g100_mute';
const DRAW_Y=170,DRAW_H=560,HALF=300; // 画区：左半作画，右半镜像
let muted=localStorage.getItem(MKEY)==='1';
const $=id=>document.getElementById(id);
function fit(){const availH=innerHeight-70;const s=Math.min(innerWidth/W,Math.max(200,availH)/H)*0.98;cv.style.width=W*s+'px';cv.style.height=H*s+'px';}
addEventListener('resize',fit);fit();
let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function beep(f0,f1,dur,type,vol){if(muted)return;const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f0,a.currentTime);if(f1)o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),a.currentTime+dur);g.gain.setValueAtTime(vol||0.1,a.currentTime);g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+dur);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+dur);}
const SFX={
 draw(){beep(600,900,0.05,'sine',0.04);},
 clear(){beep(800,200,0.2,'sine',0.1);},
 done(){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,f,0.15,'triangle',0.12),i*100));if(navigator.vibrate)navigator.vibrate(50);},
 tick(){beep(1000,1400,0.08,'sine',0.08);},
 click(){beep(700,900,0.06,'square',0.08);},
 over(){[659,784,1046,1318].forEach((f,i)=>setTimeout(()=>beep(f,f,0.2,'triangle',0.12),i*140));}
};
$('muteBtn').textContent=muted?'🔇':'🔊';
$('muteBtn').onclick=()=>{muted=!muted;localStorage.setItem(MKEY,muted?'1':'0');$('muteBtn').textContent=muted?'🔇':'🔊';if(!muted)SFX.click();};
const ROUNDS=[{name:'蝴蝶',icon:'🦋'},{name:'心形',icon:'💗'},{name:'雪花',icon:'❄️'}];
const COLORS=['#ff6d9d','#18ffff','#b4ff5c'];
let G=null;
function newGame(){G={over:false,paused:false,round:0,time:60,total:0,scores:[],color:0,drawing:false,last:null,
 uc:document.createElement('canvas'),ul:document.createElement('canvas'),parts:[],floats:[]};
 G.uc.width=HALF;G.uc.height=DRAW_H;
 G.ul.width=HALF;G.ul.height=DRAW_H;
 nextRound(true);}
function nextRound(first){
 if(!first){G.round++;}
 if(G.round>=3){endGame();return;}
 G.time=60;G.lock=false;
 G.uc.getContext('2d').clearRect(0,0,HALF,DRAW_H);
 G.ul.getContext('2d').clearRect(0,0,HALF,DRAW_H);
 $('round').textContent='第'+(G.round+1)+'/3轮 '+ROUNDS[G.round].icon+ROUNDS[G.round].name;
}
/* ---- 目标图案（对称，画在小画布上） ---- */
function drawTarget(kind,c,w,h){
 c.clearRect(0,0,w,h);c.strokeStyle='#fff';c.fillStyle='#fff';c.lineWidth=w*0.07;c.lineCap='round';
 const cx=w/2,cy=h/2;
 if(kind===0){ // 蝴蝶
  c.beginPath();c.ellipse(cx-w*0.24,cy-h*0.12,w*0.22,h*0.2,-0.4,0,7);c.stroke();
  c.beginPath();c.ellipse(cx+w*0.24,cy-h*0.12,w*0.22,h*0.2,0.4,0,7);c.stroke();
  c.beginPath();c.ellipse(cx-w*0.18,cy+h*0.16,w*0.15,h*0.13,-0.3,0,7);c.stroke();
  c.beginPath();c.ellipse(cx+w*0.18,cy+h*0.16,w*0.15,h*0.13,0.3,0,7);c.stroke();
  c.lineWidth=w*0.05;c.beginPath();c.moveTo(cx,cy-h*0.28);c.lineTo(cx,cy+h*0.3);c.stroke();
 }else if(kind===1){ // 心形
  c.beginPath();c.moveTo(cx,cy+h*0.32);
  c.bezierCurveTo(cx-w*0.55,cy-h*0.05,cx-w*0.32,cy-h*0.38,cx,cy-h*0.1);
  c.bezierCurveTo(cx+w*0.32,cy-h*0.38,cx+w*0.55,cy-h*0.05,cx,cy+h*0.32);c.stroke();
 }else{ // 雪花
  for(let i=0;i<6;i++){const a=i*Math.PI/3;
   c.beginPath();c.moveTo(cx,cy);c.lineTo(cx+Math.sin(a)*w*0.38,cy-Math.cos(a)*h*0.38);c.stroke();}
  c.beginPath();c.arc(cx,cy,w*0.06,0,7);c.stroke();
 }
}
/* ---- 相似度 ---- */
function similarity(){
 const sw=75,sh=140;
 const uc2=document.createElement('canvas');uc2.width=sw;uc2.height=sh;
 uc2.getContext('2d').drawImage(G.uc,0,0,sw,sh);
 const tc=document.createElement('canvas');tc.width=sw;tc.height=sh;
 const tctx=tc.getContext('2d');
 drawTarget(G.round,tctx,sw,sh);
 const ud=uc2.getContext('2d').getImageData(0,0,sw,sh).data;
 const td=tctx.getImageData(0,0,sw,sh).data;
 const N=sw*sh,tMask=new Uint8Array(N),uMask=new Uint8Array(N);
 let tN=0;
 for(let i=0;i<N;i++){if(td[i*4+3]>40){tMask[i]=1;tN++;}if(ud[i*4+3]>40)uMask[i]=1;}
 if(tN===0)return 0;
 // 膨胀目标 2px 容差
 const dMask=new Uint8Array(N);
 for(let y=0;y<sh;y++)for(let x=0;x<sw;x++){const i=y*sw+x;if(!tMask[i])continue;
  for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){const nx=x+dx,ny=y+dy;
   if(nx>=0&&nx<sw&&ny>=0&&ny<sh)dMask[ny*sw+nx]=1;}}
 let hit=0,uN=0,fp=0;
 for(let i=0;i<N;i++)if(uMask[i]){uN++;if(dMask[i])hit++;else fp++;}
 if(uN===0)return 0;
 const cov=hit/tN,pen=fp/uN;
 return Math.max(0,Math.min(1,cov*1.25-pen*0.55));
}
function finishRound(auto){
 if(G.lock)return;G.lock=true;
 const s=Math.round(similarity()*100);
 G.scores.push(s);G.total+=s;
 SFX.done();
 floatTxt(W/2,DRAW_Y+DRAW_H/2,(auto?'时间到 ':'')+ROUNDS[G.round].icon+' 相似度 '+s+'分',s>=70?'#00e676':s>=40?'#ffd54a':'#ff5252');
 burst(W/2,DRAW_Y+DRAW_H/2,'#e040fb',20);
 setTimeout(()=>{if(!G.over)nextRound(false);},1600);
}
function burst(x,y,c,n){for(let i=0;i<n;i++)G.parts.push({x,y,vx:(Math.random()-0.5)*7,vy:(Math.random()-0.5)*7,life:35+Math.random()*20,c});}
function floatTxt(x,y,txt,c){G.floats.push({x,y,txt,c,life:95});}
function update(){
 if(!G||G.over||G.paused)return;
 if(G.lock)return;
 G.time-=1/60;
 if(G.time<=0){G.time=0;finishRound(true);return;}
 for(const p of G.parts){p.x+=p.vx;p.y+=p.vy;p.life--;}
 G.parts=G.parts.filter(p=>p.life>0);
 for(const f of G.floats){f.y-=0.8;f.life--;}
 G.floats=G.floats.filter(f=>f.life>0);
 $('time').textContent=Math.ceil(G.time);$('score').textContent=G.total;
}
/* ---- 作画输入 ---- */
function pos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};}
function strokeSeg(x0,y0,x1,y1){
 const col=COLORS[G.color];
 const uctx=G.uc.getContext('2d'),lctx=G.ul.getContext('2d');
 // 左半屏（作画区，存入离屏）
 lctx.strokeStyle=col;lctx.lineWidth=7;lctx.lineCap='round';
 lctx.shadowColor=col;lctx.shadowBlur=12;
 lctx.beginPath();lctx.moveTo(x0,y0-DRAW_Y);lctx.lineTo(x1,y1-DRAW_Y);lctx.stroke();lctx.shadowBlur=0;
 // 右半屏镜像（离屏采样）
 uctx.strokeStyle='#fff';uctx.lineWidth=7;uctx.lineCap='round';
 uctx.beginPath();uctx.moveTo(W-x0-HALF,y0-DRAW_Y);uctx.lineTo(W-x1-HALF,y1-DRAW_Y);uctx.stroke();
 SFX.draw();
}
cv.addEventListener('pointerdown',e=>{if(!G||G.over||G.paused)return;const p=pos(e);
 if(p.x<HALF&&p.y>DRAW_Y&&p.y<DRAW_Y+DRAW_H){G.drawing=true;G.last=p;strokeSeg(p.x,p.y,p.x,p.y);}});
cv.addEventListener('pointermove',e=>{if(!G||!G.drawing||G.paused)return;const p=pos(e);
 if(p.x<HALF&&p.y>DRAW_Y&&p.y<DRAW_Y+DRAW_H){strokeSeg(G.last.x,G.last.y,p.x,p.y);G.last=p;}});
addEventListener('pointerup',()=>{if(G)G.drawing=false;});
addEventListener('pointercancel',()=>{if(G)G.drawing=false;});
function tap(el,fn){el.addEventListener('touchstart',e=>{e.preventDefault();fn();},{passive:false});el.addEventListener('click',e=>{e.preventDefault();fn();});}
tap($('bClear'),()=>{if(!G||G.over||G.paused)return;G.uc.getContext('2d').clearRect(0,0,HALF,DRAW_H);G.ul.getContext('2d').clearRect(0,0,HALF,DRAW_H);SFX.clear();});
tap($('bColor'),()=>{if(!G)return;G.color=(G.color+1)%COLORS.length;$('cDot').style.color=COLORS[G.color];SFX.click();});
tap($('bDone'),()=>{if(!G||G.over||G.paused)return;G.drawing=false;finishRound(false);});
function endGame(){G.over=true;SFX.over();
 const hs=Math.max(G.total,+(localStorage.getItem(HSK)||0));localStorage.setItem(HSK,hs);
 $('endText').innerHTML='🦋 '+G.scores[0]+' ｜ 💗 '+G.scores[1]+' ｜ ❄️ '+G.scores[2]+'<br>总分 <b style="color:#ffd54a">'+G.total+'</b> / 300';
 $('hsText').innerHTML='🏅 最高分 <b style="color:#e040fb">'+hs+'</b>';
 setTimeout(()=>$('endOv').classList.remove('hidden'),1700);}
/* ---- 渲染 ---- */
const tcPrev=document.createElement('canvas');tcPrev.width=90;tcPrev.height=120;
function draw(){
 ctx.fillStyle='#12061a';ctx.fillRect(0,0,W,H);
 // 顶部目标预览
 ctx.fillStyle='#1d0b28';ctx.fillRect(0,0,W,160);
 ctx.font='bold 20px sans-serif';ctx.textAlign='left';ctx.fillStyle='#f3d9ff';
 ctx.fillText('目标：',16,36);
 if(G){drawTarget(G.round,tcPrev.getContext('2d'),90,120);
  ctx.drawImage(tcPrev,80,20);
  ctx.font='22px sans-serif';ctx.fillText(ROUNDS[G.round].icon+' '+ROUNDS[G.round].name,190,80);
  ctx.font='15px sans-serif';ctx.fillStyle='#bfa8cc';
  ctx.fillText('在左半屏临摹，右半屏自动镜像',190,112);
  // 进度条
  ctx.fillStyle='#2c1440';ctx.fillRect(190,124,380,10);
  ctx.fillStyle='#e040fb';ctx.fillRect(190,124,380*Math.max(0,G.time/60),10);
 }
 // 画区背景
 ctx.fillStyle='#0a0512';ctx.fillRect(0,DRAW_Y,W,DRAW_H);
 // 中线
 ctx.strokeStyle='#e040fb';ctx.lineWidth=3;ctx.shadowColor='#e040fb';ctx.shadowBlur=10;
 ctx.beginPath();ctx.moveTo(HALF,DRAW_Y);ctx.lineTo(HALF,DRAW_Y+DRAW_H);ctx.stroke();ctx.shadowBlur=0;
 ctx.font='16px sans-serif';ctx.textAlign='center';ctx.fillStyle='#8f7aa3';
 ctx.fillText('✏️ 在这画',HALF/2,DRAW_Y+26);
 ctx.fillText('✨ 镜像',HALF+HALF/2,DRAW_Y+26);
 if(G){
  // 左右半屏合成（作画 + 镜像）
  ctx.drawImage(G.ul,0,DRAW_Y);
  ctx.drawImage(G.uc,HALF,DRAW_Y);
  for(const p of G.parts){ctx.globalAlpha=Math.min(1,p.life/30);ctx.fillStyle=p.c;ctx.fillRect(p.x-2,p.y-2,5,5);}ctx.globalAlpha=1;
  ctx.font='bold 26px sans-serif';
  for(const f of G.floats){ctx.globalAlpha=Math.min(1,f.life/50);ctx.fillStyle=f.c;ctx.shadowColor=f.c;ctx.shadowBlur=10;ctx.fillText(f.txt,f.x,f.y);ctx.shadowBlur=0;}ctx.globalAlpha=1;
 }
 // 底部说明
 ctx.font='14px sans-serif';ctx.fillStyle='#6b5578';ctx.textAlign='center';
 ctx.fillText('右半屏由左半屏实时镜像生成',W/2,H-16);
}
function loop(){update();draw();requestAnimationFrame(loop);}
$('startBtn').onclick=()=>{ac();SFX.click();$('startOv').classList.add('hidden');newGame();loop();};
$('pauseBtn').onclick=()=>{if(!G||G.over)return;G.paused=true;$('pauseOv').classList.remove('hidden');SFX.click();};
$('resumeBtn').onclick=()=>{G.paused=false;$('pauseOv').classList.add('hidden');SFX.click();};
$('restartBtn1').onclick=()=>{$('pauseOv').classList.add('hidden');newGame();SFX.click();};
$('restartBtn2').onclick=()=>{$('endOv').classList.add('hidden');newGame();SFX.click();};
draw();
</script>
</body>
</html>
