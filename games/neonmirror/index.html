<style>

html,body{height:100%;overflow:hidden}

.hidden{display:none!important}

.pad{width:100%;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.pad button{min-height:50px;font-size:14px!important;padding:2px!important}

<style>

  $('overText').textContent='相似度 '+sim+'%（过关 '+Math.round(L.pass)+'% · 三星 '+Math.round(L.pass+16)+'%）· 最佳 '+save.best[li]+'%';$('nextBtn').classList.toggle('hidden',!ok||li>=LV.length-1);show('overScr',true);};FAST?go():setTimeout(go,700);}
// ---- 绘制 ----
const COLS=['#ff4d8d','#4fc3f7','#2ee6a0','#ffc531','#b65cff'];
function line(lines,op,col,lw,dash){ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.lineCap=ctx.lineJoin='round';if(dash)ctx.setLineDash(dash);for(const l of lines){ctx.beginPath();let pen=false;for(const p of l){if(!p){pen=false;continue;}const q=op(p);const x=CX+q[0]*RS,y=CY+q[1]*RS;if(!pen){ctx.moveTo(x,y);pen=true;}else ctx.lineTo(x,y);}ctx.stroke();}ctx.setLineDash([]);}
function draw(){if(FX)FX.stage(ctx,W,H,'#3a1d6b','#120726');else{ctx.fillStyle='#120726';ctx.fillRect(0,0,W,H);}
 {const g=ctx.createRadialGradient(CX,CY-40,20,CX,CY,RS*1.4);g.addColorStop(0,'#3a2160');g.addColorStop(1,'#160a2a');ctx.fillStyle=g;rr(ctx,CX-RS-8,CY-RS-8,RS*2+16,RS*2+16,18);ctx.fill();ctx.strokeStyle='rgba(255,255,255,.18)';ctx.lineWidth=2;ctx.stroke();}
 if(!L){txt(ctx,'🎨',W/2,H/2,80);return;}
 // 对称辅助线
 ctx.strokeStyle='rgba(255,255,255,.12)';ctx.lineWidth=1;ctx.setLineDash([4,6]);const axes=L.sym==='mx'?[Math.PI/2]:L.sym==='m4'?[0,Math.PI/2]:[0,Math.PI/3,2*Math.PI/3];for(const a of axes){ctx.beginPath();ctx.moveTo(CX-Math.cos(a)*RS,CY-Math.sin(a)*RS);ctx.lineTo(CX+Math.cos(a)*RS,CY+Math.sin(a)*RS);ctx.stroke();}ctx.setLineDash([]);
 const showT=L.guide||hintT>0||prevT>0;if(showT)line(L.lines,p=>p,prevT>0?'rgba(255,224,102,.85)':'rgba(255,255,255,.28)',prevT>0?6:9,prevT>0?null:[2,8]);
 if(prevT>0){otxt(ctx,'记住图案！'+Math.ceil(prevT),CX,24,16,'#ffe066');}
 if(FX)FX.glow(ctx,COLS[li%5],12);ops.forEach((op,k)=>line(strokes,op,k===0?'#fff':COLS[(li+k)%5],5));if(FX)FX.noGlow(ctx);
 if(eraser){const x=CX+eraser.x*RS,y=CY+eraser.y*RS;ctx.fillStyle='rgba(20,0,30,.55)';ctx.beginPath();ctx.arc(x,y,eraser.r*RS,0,7);ctx.fill();txt(ctx,eraser.stun>0?'😵':'👾',x,y,30);}
 if(FX)FX.drawBurst(ctx,sparks);
 // 预览小图
 if(!L.guide&&prevT<=0){ctx.save();ctx.translate(W-40,30);ctx.scale(.13,.13);ctx.translate(-CX,-CY);line(L.lines,p=>p,'rgba(255,224,102,.7)',30);ctx.restore();}
 if(li===0&&!strokes.length&&state==='play')otxt(ctx,'沿着虚线在左半边画，右边自动镜像',CX,H-12,13,'#ffe066');}

function openLevels(){state='menu';['overScr','pauseOv'].forEach(i=>show(i,false));const g=$('lvgrid');g.innerHTML='';$('lvlInfo').textContent='★'+save.stars.reduce((a,b)=>a+(b||0),0)+' / 45 · 总分 '+legacyBest();
 LV.forEach((s,i)=>{const b=document.createElement('button');b.className='lvl';const open=i===0||(save.stars[i-1]||0)>0||(save.stars[i]||0)>0;b.disabled=!open;b.innerHTML=(open?(s.boss?'👾':i+1):'🔒')+'<small>'+(open?starStr(save.stars[i]||0):'')+'</small>';b.onclick=()=>{tone(660,.08,'triangle');startLevel(i);};g.appendChild(b);});show('lvlScr',true);}
function showTut(done){tutorial([['🎨 镜像作画','你画的每一笔都会按对称规则复制：左右、四向或六向雪花。'],['🎯 临摹目标','前 4 幅有虚线描红；之后只在开头展示 3 秒，右上角有缩略图，👁 提示可再看 2 秒。'],['🖋 墨水与时间','墨水有限，乱画会降低相似度；↶ 撤销可退回墨水。按 ✔ 完成提交。'],['👾 墨灵','首领关墨灵会吃掉你的线条，点击它能击晕 2 秒。']],done);}
$('howBtn').onclick=()=>{show('lvlScr',false);showTut(openLevels);};
$('startBtn').onclick=()=>{audio();show('startScr',false);if(!save.tut){showTut(()=>{save.tut=1;Store.set('save',save);startLevel(0);});}else openLevels();};

$('nextBtn').onclick=()=>startLevel(li+1);$('againBtn').onclick=()=>startLevel(li);$('menu2Btn').onclick=openLevels;
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});

fit();requestAnimationFrame(frame);
