<style>

const LV=[['心形','heart','mx'],['蝴蝶','butterfly','mx'],['菱形宝石','diamond','m4'],['五角星','star','mx'],['👾 墨灵·皇冠','crown','mx'],['四瓣花','flower','m4'],['雪花','snow','r6'],['猫咪','cat','mx'],['火箭','rocket','mx'],['👾 墨灵·冰晶','snow2','r6'],['灯笼窗','lantern','m4'],['圣诞树','tree','mx'],['六芒星','hexa','r6'],['假面舞会','mask','mx'],['👾 墨灵·曼陀罗','mandala','r6']].map(([n,s,sym],i)=>({n,s,sym,boss:(i+1)%5===0,pass:Math.round(55+i*1.5),time:Math.round(45-i*1.1),inkK:2.3-i*.05,guide:i<4,preview:i<4?0:3.2-i*.08}));
const SYMN={mx:'左右对称',m4:'四向对称',r6:'六向雪花'};
function symOps(sym){if(sym==='mx')return[p=>p,p=>[-p[0],p[1]]];if(sym==='m4')return[p=>p,p=>[-p[0],p[1]],p=>[p[0],-p[1]],p=>[-p[0],-p[1]]];const o=[];for(let k=0;k<6;k++){const a=k/6*6.2832,c=Math.cos(a),s=Math.sin(a);o.push(p=>[p[0]*c-p[1]*s,p[0]*s+p[1]*c],p=>[-p[0]*c-p[1]*s,-p[0]*s+p[1]*c]);}return o;}
// ---- 掩膜与评分 ----
const M=100;const mk=()=>{const c=document.createElement('canvas');c.width=c.height=M;return c.getContext('2d',{willReadFrequently:true});};
const mT=mk(),mTd=mk(),mU=mk(),mUd=mk();
function paint(g,lines,lw,ops){g.clearRect(0,0,M,M);g.strokeStyle='#000';g.lineCap=g.lineJoin='round';g.lineWidth=lw;for(const op of ops)for(const l of lines){g.beginPath();let pen=false;for(const p of l){if(!p){pen=false;continue;}const q=op(p);const x=(q[0]+1)/2*M,y=(q[1]+1)/2*M;if(!pen){g.moveTo(x,y);pen=true;}else g.lineTo(x,y);}g.stroke();}}
const alpha=g=>g.getImageData(0,0,M,M).data;
let TA=null,TDA=null,tCount=0,tLen=0;
function prepTarget(){const base=SHAPES[L.s]();const lines=[];for(const op of ops)for(const l of base)lines.push(l.map(op));L.lines=lines;paint(mT,lines,4,[p=>p]);paint(mTd,lines,8,[p=>p]);TA=alpha(mT);TDA=alpha(mTd);tCount=0;for(let i=3;i<TA.length;i+=4)if(TA[i]>40)tCount++;
 tLen=0;for(const l of lines)for(let i=1;i<l.length;i++)tLen+=Math.hypot(l[i][0]-l[i-1][0],l[i][1]-l[i-1][1]);}
function score(){if(!strokes.length)return 0;paint(mU,strokes,4,ops);paint(mUd,strokes,8,ops);const U=alpha(mU),UD=alpha(mUd);let rec=0,uc=0,prec=0;
 for(let i=3;i<U.length;i+=4){if(TA[i]>40&&UD[i]>40)rec++;if(U[i]>40){uc++;if(TDA[i]>40)prec++;}}if(!uc)return 0;const R=rec/tCount,P=prec/uc;return R+P?Math.round(200*R*P/(R+P)):0;}
// ---- 状态 ----
let save=Store.get('save',{stars:[],best:[],tut:0});
let state='menu',li=0,L=null,ops=null,strokes=[],cur=null,ink=0,inkMax=1,time=0,t=0,sim=0,simT=0,hints=2,hintT=0,prevT=0,eraser=null,FAST=false,sparks=[];
function startLevel(i){li=i;L=LV[i];ops=symOps(L.sym);prepTarget();strokes=[];cur=null;inkMax=tCount/4/(M/2)/ops.length*L.inkK+.4;ink=inkMax;time=L.time;t=0;sim=0;simT=0;hints=L.guide?0:2;hintT=0;prevT=L.preview;
 eraser=L.boss?{x:0,y:0,vx:.35,vy:.27,r:(L.sym==='r6'?.08:.12)+li*.002,stun:0}:null;state='play';['lvlScr','overScr','pauseOv','startScr'].forEach(k=>show(k,false));fit();hud();if(!FAST)toast(SYMN[L.sym]+' · '+Math.round(L.pass)+'% 过关'+(L.boss?' · 点墨灵击晕':''),2200);}
function hud(){$('lvT').textContent=li+1;$('inkT').textContent=Math.max(0,Math.round(ink/inkMax*100));$('timeT').textContent=Math.ceil(Math.max(0,time));$('simT').textContent=sim;$('bHint').textContent='👁 提示 '+(L&&L.guide?'∞':hints);}
const toN=p=>[(p.x-CX)/RS,(p.y-CY)/RS];
function begin(p){if(state!=='play'||ink<=0||prevT>0)return;const n=toN(p);if(eraser&&Math.hypot(n[0]-eraser.x,n[1]-eraser.y)<eraser.r+.06){eraser.stun=2.2;tone(900,.12,'square',.05);if(FX)FX.burst(sparks,p.x,p.y,'#b65cff',12);return;}
 if(Math.abs(n[0])>1.05||Math.abs(n[1])>1.05)return;cur=[n];strokes.push(cur);tone(500+Math.random()*200,.04,'sine',.02);}
function move(p){if(!cur||state!=='play')return;const n=toN(p);n[0]=clamp(n[0],-1,1);n[1]=clamp(n[1],-1,1);const l=cur[cur.length-1];if(!l){cur.push(n);return;}const d=Math.hypot(n[0]-l[0],n[1]-l[1]);if(d<.012)return;if(d>ink){cur=null;toast('🖋 墨水用完了');return;}ink-=d;cur.push(n);if(Math.floor(ink/inkMax*20)!==Math.floor((ink+d)/inkMax*20))hud();}
function endStroke(){if(cur&&cur.length<2)strokes.pop();cur=null;sim=score();hud();}
function undo(){if(state!=='play'||!strokes.length)return;const s=strokes.pop();for(let i=1;i<s.length;i++)if(s[i]&&s[i-1])ink+=Math.hypot(s[i][0]-s[i-1][0],s[i][1]-s[i-1][1]);ink=Math.min(ink,inkMax);sim=score();hud();tone(300,.06,'triangle',.04);}
function clearAll(){if(state!=='play')return;while(strokes.length)undo();}
cv.addEventListener('pointerdown',e=>{e.preventDefault();audio();begin(posOf(e,cv,W,H));});cv.addEventListener('pointermove',e=>move(posOf(e,cv,W,H)));addEventListener('pointerup',endStroke);
$('bUndo').onclick=undo;$('bClear').onclick=clearAll;$('bHint').onclick=()=>{if(state!=='play'||L.guide)return;if(hints<=0){toast('提示用完了');return;}hints--;hintT=2;hud();};$('bDone').onclick=()=>{if(state==='play')finish();};
function tick(dt){if(state!=='play')return;t+=dt;if(prevT>0){prevT-=dt;return;}time-=dt;if(hintT>0)hintT-=dt;
 if(eraser){if(eraser.stun>0)eraser.stun-=dt;else{const sp=1+li*.04;eraser.x+=eraser.vx*dt*sp;eraser.y+=eraser.vy*dt*sp;if(Math.abs(eraser.x)>.85)eraser.vx*=-1;if(Math.abs(eraser.y)>.85)eraser.vy*=-1;
   eraser.eat=(eraser.eat||0)+dt*(6+li*.3);outer:for(const s of strokes)for(let i=0;i<s.length&&eraser.eat>=1;i++){const p=s[i];if(!p)continue;for(const op of ops){const q=op(p);if(Math.hypot(q[0]-eraser.x,q[1]-eraser.y)<eraser.r){s[i]=null;eraser.eat--;break;}}}eraser.eat=Math.min(eraser.eat,2);}}
 simT-=dt;if(simT<=0){simT=.4;sim=score();hud();}if(time<=0){time=0;finish();}if(Math.floor(t*4)!==Math.floor((t-dt)*4))hud();}
function finish(){if(state!=='play')return;cur=null;sim=score();state='over';const ok=sim>=L.pass;let st=0;
 if(ok){st=1+(sim>=L.pass+9?1:0)+(sim>=L.pass+16?1:0);if(st>(save.stars[li]||0))save.stars[li]=st;tone(523,.12,'triangle');tone(784,.3,'triangle',.1,0,.15);}else tone(220,.5,'sawtooth',.08,70);
 save.best[li]=Math.max(save.best[li]||0,sim);legacyBest(save.best.reduce((a,b)=>a+(b||0),0));Store.set('save',save);hud();
 const go=()=>{$('overH').textContent=ok?(L.boss?'👾 墨灵被驱散！':'🎨 「'+L.n+'」完成'):'😵 不够像';$('finalScore').textContent=ok?starStr(st):sim+'%';
  $('overText').textContent='相似度 '+sim+'%（过关 '+Math.round(L.pass)+'% · 三星 '+Math.round(L.pass+16)+'%）· 最佳 '+save.best[li]+'%';$('nextBtn').classList.toggle('hidden',!ok||li>=LV.length-1);show('overScr',true);};FAST?go():setTimeout(go,700);}
// ---- 绘制 ----
const COLS=['#ff4d8d','#4fc3f7','#2ee6a0','#ffc531','#b65cff'];
function line(lines,op,col,lw,dash){ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.lineCap=ctx.lineJoin='round';if(dash)ctx.setLineDash(dash);for(const l of lines){ctx.beginPath();let pen=false;for(const p of l){if(!p){pen=false;continue;}const q=op(p);const x=CX+q[0]*RS,y=CY+q[1]*RS;if(!pen){ctx.moveTo(x,y);pen=true;}else ctx.lineTo(x,y);}ctx.stroke();}ctx.setLineDash([]);}
function draw(){if(FX)FX.stage(ctx,W,H,'#3a1d6b','#120726');else{ctx.fillStyle='#120726';ctx.fillRect(0,0,W,H);}
 {const g=ctx.createRadialGradient(CX,CY-40,20,CX,CY,RS*1.4);g.addColorStop(0,'#3a2160');g.addColorStop(1,'#160a2a');ctx.fillStyle=g;rr(ctx,CX-RS-8,CY-RS-8,RS*2+16,RS*2+16,18);ctx.fill();ctx.strokeStyle='rgba(255,255,255,.18)';ctx.lineWidth=2;ctx.stroke();}
 if(!L){txt(ctx,'🎨',W/2,H/2,80);return;}
 // 对称辅助线
 ctx.strokeStyle='rgba(255,255,255,.12)';ctx.lineWidth=1;ctx.setLineDash([4,6]);const axes=L.sym==='mx'?[Math.PI/2]:L.sym==='m4'?[0,Math.PI/2]:[0,Math.PI/3,2*Math.PI/3];for(const a of axes){ctx.beginPath();ctx.moveTo(CX-Math.cos(a)*RS,CY-Math.sin(a)*RS);ctx.lineTo(CX+Math.cos(a)*RS,CY+Math.sin(a)*RS);ctx.stroke();}ctx.setLineDash([]);
 const showT=L.guide||hintT>0||prevT>0;if(showT)line(L.lines,p=>p,prevT>0?'rgba(255,224,102,.85)':'rgba(255,255,255,.28)',prevT>0?6:9,prevT>0?null:[2,8]);
 if(prevT>0){otxt(ctx,'记住图案！'+Math.ceil(prevT),CX,24,16,'#ffe066');}
 if(FX)FX.glow(ctx,COLS[li%5],12);ops.forEach((op,k)=>line(strokes,op,k===0?'#fff':COLS[(li+k)%5],5));if(FX)FX.noGlow(ctx);
 if(eraser){const x=CX+eraser.x*RS,y=CY+eraser.y*RS;ctx.fillStyle='rgba(20,0,30,.55)';ctx.beginPath();ctx.arc(x,y,eraser.r*RS,0,7);ctx.fill();txt(ctx,eraser.stun>0?'😵':'👾',x,y,30);}
 if(FX)FX.drawBurst(ctx,sparks);
 // 预览小图
 if(!L.guide&&prevT<=0){ctx.save();ctx.translate(W-40,30);ctx.scale(.13,.13);ctx.translate(-CX,-CY);line(L.lines,p=>p,'rgba(255,224,102,.7)',30);ctx.restore();}
 if(li===0&&!strokes.length&&state==='play')otxt(ctx,'沿着虚线在左半边画，右边自动镜像',CX,H-12,13,'#ffe066');}
// ---- 菜单 ----
function openLevels(){state='menu';['overScr','pauseOv'].forEach(i=>show(i,false));const g=$('lvgrid');g.innerHTML='';$('lvlInfo').textContent='★'+save.stars.reduce((a,b)=>a+(b||0),0)+' / 45 · 总分 '+legacyBest();
 LV.forEach((s,i)=>{const b=document.createElement('button');b.className='lvl';const open=i===0||(save.stars[i-1]||0)>0||(save.stars[i]||0)>0;b.disabled=!open;b.innerHTML=(open?(s.boss?'👾':i+1):'🔒')+'<small>'+(open?starStr(save.stars[i]||0):'')+'</small>';b.onclick=()=>{tone(660,.08,'triangle');startLevel(i);};g.appendChild(b);});show('lvlScr',true);}
function showTut(done){tutorial([['🎨 镜像作画','你画的每一笔都会按对称规则复制：左右、四向或六向雪花。'],['🎯 临摹目标','前 4 幅有虚线描红；之后只在开头展示 3 秒，右上角有缩略图，👁 提示可再看 2 秒。'],['🖋 墨水与时间','墨水有限，乱画会降低相似度；↶ 撤销可退回墨水。按 ✔ 完成提交。'],['👾 墨灵','首领关墨灵会吃掉你的线条，点击它能击晕 2 秒。']],done);}
$('howBtn').onclick=()=>{show('lvlScr',false);showTut(openLevels);};
$('startBtn').onclick=()=>{audio();show('startScr',false);if(!save.tut){showTut(()=>{save.tut=1;Store.set('save',save);startLevel(0);});}else openLevels();};
$('bestLine').textContent='总分 '+legacyBest();
function pause(){if(state==='play'){state='pause';cur=null;show('pauseOv',true);}}
$('pauseBtn').onclick=pause;$('resumeBtn').onclick=()=>{show('pauseOv',false);state='play';last=performance.now();};$('restartBtn').onclick=()=>startLevel(li);$('menuBtn').onclick=openLevels;
$('nextBtn').onclick=()=>startLevel(li+1);$('againBtn').onclick=()=>startLevel(li);$('menu2Btn').onclick=openLevels;
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
let last=performance.now();function frame(tm){const dt=Math.min(.05,(tm-last)/1000);last=tm;tick(dt);draw();requestAnimationFrame(frame);}
fit();requestAnimationFrame(frame);
window.__mr={LV,startLevel,tick,begin,move,endStroke,finish,setFast:v=>FAST=v,toPx:n=>({x:CX+n[0]*RS,y:CY+n[1]*RS}),get s(){return{state,li,sim,ink,inkMax,time,prevT,eraser,lines:L&&L.lines,sym:L&&L.sym}}};
</script>
