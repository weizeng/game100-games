<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}

.shop{display:flex;flex-direction:column;gap:8px;width:100%;max-width:320px}

<!-- GAME UI BEGIN -->
<style>

<body>
<div class="wrap">

    </span>
  </div>

</div>
<div class="overlay" id="startScr"><h1>🍳 料理冲刺</h1><p>看着小票，依次点击切配、灶台、装盘、出餐。<br>20 关客流攀升，每 5 关双客潮 Boss。<br>成长加速灶台、加预备槽、提高小费。</p><p id="bestLine"></p><button class="btn" id="startBtn">开始游戏</button></div>
<div class="overlay hidden" id="lvlScr"><h2>选择关卡</h2><p id="lvlInfo"></p><div class="lvgrid" id="lvgrid"></div><div class="rowbtns"><button class="btn ghost" id="shopBtn">成长商店</button><button class="btn ghost" id="backStart">返回</button></div></div>
<div class="overlay hidden" id="shopScr"><h2>成长商店</h2><p id="coinLine"></p><div class="shop" id="shopList"></div><button class="btn" id="shopBack">返回选关</button></div>
<div class="overlay hidden" id="tutScr"><h2 id="tutH"></h2><p id="tutP"></p><span id="tutStep"></span><div class="rowbtns"><button class="btn ghost" id="tutSkip">跳过</button><button class="btn" id="tutNext">下一步</button></div></div>
<div class="overlay hidden" id="pauseOv"><h2>⏸ 已暂停</h2><div class="rowbtns"><button class="btn" id="resumeBtn">继续</button><button class="btn ghost" id="menuBtn">选关</button></div></div>
<div class="overlay hidden" id="overScr"><h2 id="overH">过关！</h2><div class="score" id="finalScore">★★★</div><p id="overText"></p><div class="rowbtns"><button class="btn" id="nextBtn">下一关</button><button class="btn ghost" id="againBtn">再玩一次</button><button class="btn ghost" id="menu2Btn">选关</button></div></div>
<div id="toast"></div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const W=360,H=540;
const cv=$('cv'),ctx=cv.getContext('2d');
const UI=window.GameUI||{pick:a=>a,storageGet:k=>localStorage.getItem(k),storageSet:(k,v)=>localStorage.setItem(k,v)};
const FX=UI.fx&&UI.fx.on?UI.fx:null;
if(FX)FX.hidpi(cv,ctx,W,H);else{cv.width=W;cv.height=H;}
function show(id,on){$(id).classList.toggle('hidden',!on);}
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('on'),1200);}
function posOf(e){const r=cv.getBoundingClientRect();const t=(e.touches&&e.touches[0])||(e.changedTouches&&e.changedTouches[0])||e;return{x:(t.clientX-r.left)*W/r.width,y:(t.clientY-r.top)*H/r.height};}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};}

const PK='g100_cookrush_prog', HK='g100_cookrush_hs', MK='g100_cookrush_mute';
let muted=UI.storageGet(MK)==='1',ac=null;$('muteBtn').textContent=muted?'🔇':'🔊';
function beep(f,d,type){if(muted)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(.12,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d);}catch(e){}}
$('muteBtn').onclick=()=>{muted=!muted;UI.storageSet(MK,muted?'1':'0');$('muteBtn').textContent=muted?'🔇':'🔊';};
function loadProg(){try{return JSON.parse(UI.storageGet(PK)||'{}');}catch(e){return{};}}
function saveProg(p){UI.storageSet(PK,JSON.stringify(p));}
let prog=loadProg();
if(!prog.stars)prog.stars={};if(prog.coins==null)prog.coins=0;if(prog.unlock==null)prog.unlock=1;
if(prog.stoveLv==null)prog.stoveLv=0;if(prog.slotLv==null)prog.slotLv=0;if(prog.tipLv==null)prog.tipLv=0;if(!prog.seenTut)prog.seenTut=0;
let best=+UI.storageGet(HK)||0;$('best').textContent=best;$('bestLine').textContent='解锁 '+prog.unlock+'/20 · 币 '+prog.coins+' · 星 '+Object.values(prog.stars).reduce((a,b)=>a+(b|0),0);

const TOTAL=20;
const DISHES=[
  {id:'salad',name:'沙拉',icon:'🥗',steps:['chop','plate','serve'],cook:0},
  {id:'soup',name:'汤',icon:'🍲',steps:['chop','cook','plate','serve'],cook:1.6},
  {id:'stir',name:'炒饭',icon:'🍛',steps:['chop','cook','plate','serve'],cook:2.0},
  {id:'steak',name:'牛排',icon:'🥩',steps:['chop','cook','plate','serve'],cook:2.6},
  {id:'cake',name:'蛋糕',icon:'🍰',steps:['chop','cook','plate','serve'],cook:2.2},
  {id:'ramen',name:'拉面',icon:'🍜',steps:['chop','cook','plate','serve'],cook:2.4}
];
const STEP_LABEL={chop:'切配',cook:'灶台',plate:'装盘',serve:'出餐'};
const STATIONS=[
  {id:'chop',label:'🔪 切配',x:20,y:300,w:150,h:70,col:'#FFB21E'},
  {id:'cook',label:'🔥 灶台',x:190,y:300,w:150,h:70,col:'#FF5C8A'},
  {id:'plate',label:'🍽️ 装盘',x:20,y:390,w:150,h:70,col:'#5B8CFF'},
  {id:'serve',label:'🔔 出餐',x:190,y:390,w:150,h:70,col:'#3FC163'}
];

function tutorial(pages,done){let i=0;function render(){$('tutH').textContent=pages[i][0];$('tutP').innerHTML=pages[i][1];$('tutStep').textContent=(i+1)+' / '+pages.length;$('tutNext').textContent=i<pages.length-1?'下一步':'开始挑战';}
  show('tutScr',true);render();
  $('tutNext').onclick=()=>{if(i<pages.length-1){i++;render();}else{show('tutScr',false);done();}};
  $('tutSkip').onclick=()=>{show('tutScr',false);done();};
}

let state='menu',lvl=1,score=0,tickets=[],hand=null,slots=[],stoveQ=[],served=0,goal=5,fails=0,spawnT=0,boss=false,timeLeft=0,sparks=[],last=0,combo=0,starsEarned=0;

function maxSlots(){return 1+prog.slotLv;}
function stoveSpeed(){return 1+prog.stoveLv*0.35;}
function tipMul(){return 1+prog.tipLv*0.25;}

function makeTicket(n,rnd){
  const pool=DISHES.slice(0,Math.min(DISHES.length,2+Math.floor(n/3)));
  const d=pool[(rnd()*pool.length)|0];
  const special=n>=8&&rnd()<0.25;
  const patience=Math.max(12,22-n*0.4)-(special?3:0)+(boss?-4:0);
  return{dish:d,step:0,pat:patience,patMax:patience,special,done:false,fail:false,hold:null};
}
function startLevel(n){
  lvl=n;boss=n%5===0;score=Math.max(score,0);served=0;fails=0;combo=0;hand=null;stoveQ=[];tickets=[];slots=[];
  goal=boss?8:Math.min(12,4+Math.floor(n*0.6));
  spawnT=0.4;timeLeft=boss?60:0;starsEarned=0;
  // prefill one easy ticket
  const rnd=mulberry32(n*4243);
  tickets.push(makeTicket(n,rnd));
  state='play';last=performance.now();
  show('startScr',false);show('lvlScr',false);show('shopScr',false);show('tutScr',false);show('pauseOv',false);show('overScr',false);
  $('hint').textContent=boss?'👑 双客潮 Boss：同时更多订单，限时完成目标':'点工位按步骤做菜 · 耐心耗尽会失败';
  $('score').textContent=score;beep(660,.08);
}

function win(){
  if(state!=='play')return;state='over';
  const stars=fails===0?3:(fails<=2?2:1);
  const prev=prog.stars[lvl]|0;if(stars>prev)prog.stars[lvl]=stars;
  const gain=Math.floor((25+stars*12+(boss?40:0)+combo*2)*tipMul());
  prog.coins+=gain;score+=gain;starsEarned=stars;
  if(lvl>=prog.unlock&&lvl<TOTAL)prog.unlock=lvl+1;
  if(score>best){best=score;UI.storageSet(HK,String(best));$('best').textContent=best;}
  saveProg(prog);$('score').textContent=score;
  $('overH').textContent=boss?'客潮顶住了！':'厨房过关！';
  $('finalScore').textContent='★'.repeat(stars)+'☆'.repeat(3-stars);
  $('overText').textContent=`出餐 ${served}/${goal} · +${gain} 币 · 总币 ${prog.coins}`;
  $('nextBtn').style.display='';show('overScr',true);
  beep(900,.15);if(FX)for(let i=0;i<14;i++)FX.burst(sparks,W/2,200,'#FFB21E',4);
}
function lose(msg){
  if(state!=='play')return;state='over';
  $('overH').textContent=msg||'客人不悦离席';
  $('finalScore').textContent='关 '+lvl;
  $('overText').textContent=`出餐 ${served}/${goal} · 失败 ${fails}`;
  $('nextBtn').style.display='none';show('overScr',true);beep(180,.35,'sawtooth');
}

function nextStepOf(t){return t.dish.steps[t.step]||null;}
function findTicketNeeding(stationId){
  // prefer special / lowest patience
  let best=null;
  for(const t of tickets){
    if(t.done||t.fail)continue;
    if(nextStepOf(t)!==stationId)continue;
    if(stationId==='cook'&&t.hold&&t.hold.cooking)continue;
    if(!best||t.pat<best.pat||(t.special&&!best.special))best=t;
  }
  return best;
}

function tapStation(id){
  if(state!=='play')return;
  if(id==='chop'){
    const t=findTicketNeeding('chop');
    if(!t){toast('没有需要切配的单');beep(200,.06,'square');return;}
    if(slots.length>=maxSlots()&&!hand){toast('预备槽已满');beep(200,.06,'square');return;}
    t.step++;beep(500,.05);toast(t.dish.icon+' 切好了');
    const item={ticket:t,stage:'chopped'};
    if(!hand)hand=item;else slots.push(item);
    if(FX)FX.burst(sparks,95,335,'#FFB21E',6);
    return;
  }
  if(id==='cook'){
    // put chopped into stove, or pick finished from stove
    const finished=stoveQ.find(s=>s.ready);
    if(finished){
      stoveQ=stoveQ.filter(s=>s!==finished);
      finished.ticket.step=finished.ticket.dish.steps.indexOf('cook')+1;
      hand={ticket:finished.ticket,stage:'cooked'};
      toast(finished.ticket.dish.icon+' 出锅！');beep(720,.08);
      return;
    }
    // start cooking from hand or matching ticket
    let item=null;
    if(hand&&hand.stage==='chopped'&&nextStepOf(hand.ticket)==='cook'){item=hand;hand=null;}
    else{
      const t=findTicketNeeding('cook');
      if(t&&t.step===t.dish.steps.indexOf('chop')+1){/* already chopped via step */}
      // auto: if ticket needs cook and was chopped (step points to cook)
      if(t&&nextStepOf(t)==='cook'){
        // consume from slots
        const si=slots.findIndex(s=>s.ticket===t);
        if(si>=0){item=slots.splice(si,1)[0];}
        else if(hand&&hand.ticket===t){item=hand;hand=null;}
        else{// allow direct cook if steps started
          t.step=t.dish.steps.indexOf('cook'); // ensure
          item={ticket:t,stage:'chopped'};
          if(t.dish.steps[0]==='chop'&&t.step===0){toast('先切配');return;}
        }
      }
    }
    if(!item){
      // try: chop-needed dishes that somehow... 
      const t=tickets.find(t=>!t.done&&!t.fail&&nextStepOf(t)==='cook');
      if(t){item={ticket:t,stage:'chopped'};}
    }
    if(!item){toast('没有可炒的食材');beep(200,.06,'square');return;}
    if(stoveQ.length>=1+prog.stoveLv){toast('灶台忙碌');if(!hand)hand=item;else slots.push(item);beep(200,.06,'square');return;}
    const cookTime=(item.ticket.dish.cook||2)/stoveSpeed();
    stoveQ.push({ticket:item.ticket,left:cookTime,ready:false});
    item.ticket.hold={cooking:true};beep(400,.06);toast('下锅…');
    return;
  }
  if(id==='plate'){
    // need cooked hand or salad after chop
    let item=hand;
    if(item&&(item.stage==='cooked'||(item.stage==='chopped'&&nextStepOf(item.ticket)==='plate'))){
      hand=null;item.ticket.step=item.ticket.dish.steps.indexOf('plate')+1;
      hand={ticket:item.ticket,stage:'plated'};toast('装盘完成');beep(600,.06);
      if(FX)FX.burst(sparks,95,425,'#5B8CFF',6);return;
    }
    // from slots
    const si=slots.findIndex(s=>s.stage==='cooked'||(s.stage==='chopped'&&nextStepOf(s.ticket)==='plate'));
    if(si>=0){item=slots.splice(si,1)[0];item.ticket.step=item.ticket.dish.steps.indexOf('plate')+1;hand={ticket:item.ticket,stage:'plated'};toast('装盘完成');beep(600,.06);return;}
    // finished stove auto
    const fin=stoveQ.find(s=>s.ready);
    if(fin){stoveQ=stoveQ.filter(s=>s!==fin);fin.ticket.step=fin.ticket.dish.steps.indexOf('cook')+1;
      if(nextStepOf(fin.ticket)==='plate'){fin.ticket.step++;hand={ticket:fin.ticket,stage:'plated'};toast('装盘完成');beep(600,.06);return;}
      hand={ticket:fin.ticket,stage:'cooked'};toast('请装盘');return;
    }
    // salad shortcut: ticket needing plate after chop
    const t=tickets.find(t=>!t.done&&nextStepOf(t)==='plate');
    if(t){t.step++;hand={ticket:t,stage:'plated'};toast('装盘完成');beep(600,.06);return;}
    toast('没有可装盘的菜');beep(200,.06,'square');return;
  }
  if(id==='serve'){
    let item=hand;
    if(!(item&&item.stage==='plated')){
      const si=slots.findIndex(s=>s.stage==='plated');
      if(si>=0)item=slots.splice(si,1)[0];
      else{const t=tickets.find(t=>!t.done&&nextStepOf(t)==='serve');if(t){t.step++;item={ticket:t,stage:'plated'};}}
    }else hand=null;
    if(!item||item.stage!=='plated'){toast('请先装盘');beep(200,.06,'square');return;}
    const t=item.ticket;t.done=true;t.step=t.dish.steps.length;served++;combo++;
    const tip=Math.floor((8+Math.floor(t.pat/t.patMax*6)+(t.special?8:0)+Math.min(10,combo))*tipMul());
    score+=tip;prog.coins+=Math.floor(tip/2);$('score').textContent=score;
    toast(t.dish.icon+' 上菜 +'+tip);beep(880,.1);
    if(FX)FX.burst(sparks,265,425,'#3FC163',10);
    tickets=tickets.filter(x=>x!==t);
    if(served>=goal)win();
    return;
  }
}

cv.addEventListener('pointerdown',e=>{
  e.preventDefault();if(state!=='play')return;
  const p=posOf(e);
  for(const s of STATIONS){
    if(p.x>=s.x&&p.x<=s.x+s.w&&p.y>=s.y&&p.y<=s.y+s.h){tapStation(s.id);return;}
  }
});

function update(dt){
  if(state!=='play')return;
  if(boss){timeLeft-=dt;if(timeLeft<=0){if(served>=goal)win();else lose('⏰ 客潮超时');return;}}
  // stove
  for(const s of stoveQ){
    if(s.ready)continue;s.left-=dt;
    if(s.left<=0){s.ready=true;s.ticket.hold=null;beep(750,.08);toast(s.ticket.dish.icon+' 熟了！');}
  }
  // patience
  for(const t of tickets){
    if(t.done||t.fail)continue;t.pat-=dt;
    if(t.pat<=0){t.fail=true;fails++;combo=0;beep(160,.2,'sawtooth');toast(t.dish.name+' 等不及了');}
  }
  tickets=tickets.filter(t=>!t.fail&&!t.done);
  if(fails>=3){lose('差评太多');return;}
  // spawn
  const maxT=boss?4:Math.min(3,1+Math.floor(lvl/5));
  spawnT-=dt;
  if(spawnT<=0&&tickets.length<maxT&&served+tickets.length<goal){
    const rnd=mulberry32((lvl*100+served+tickets.length)*13+Date.now()%97);
    tickets.push(makeTicket(lvl,rnd));
    if(boss){tickets.push(makeTicket(lvl,mulberry32(Date.now())));if(tickets.length>maxT)tickets.length=maxT;}
    spawnT=Math.max(2.2,5.5-lvl*0.15)-(boss?1.2:0);
  }
}

function draw(){
  if(FX)FX.stage(ctx,W,H,'#ffcf6b','#f0803c');else{ctx.fillStyle='#f0803c';ctx.fillRect(0,0,W,H);}
  // ticket rail
  ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(10,10,W-20,120);
  ctx.fillStyle='#fff';ctx.font='bold 13px sans-serif';ctx.textAlign='left';
  ctx.fillText((boss?'👑 ':'')+'出餐 '+served+'/'+goal+(boss?(' · ⏱'+Math.ceil(timeLeft)+'s'):'')+' · 失误 '+fails+'/3',16,28);
  tickets.forEach((t,i)=>{
    const x=16+i*110,y=40;
    ctx.fillStyle=t.special?'#FFE08A':'#fff7e6';
    if(FX)FX.tile(ctx,x,y,100,80,t.special?'#FFE08A':'#fff7e6',8);else{ctx.fillRect(x,y,100,80);}
    ctx.fillStyle='#4a2a12';ctx.font='20px sans-serif';ctx.textAlign='center';ctx.fillText(t.dish.icon,x+50,y+28);
    ctx.font='bold 11px sans-serif';ctx.fillText(t.dish.name+(t.special?'★':''),x+50,y+46);
    const step=STEP_LABEL[nextStepOf(t)]||'完成';
    ctx.fillText('→ '+step,x+50,y+62);
    // patience bar
    ctx.fillStyle='#ddd';ctx.fillRect(x+8,y+70,84,6);
    ctx.fillStyle=t.pat/t.patMax>0.4?'#3FC163':(t.pat/t.patMax>0.2?'#FFB21E':'#FF5C8A');
    ctx.fillRect(x+8,y+70,84*(t.pat/t.patMax),6);
  });
  // hand / slots
  ctx.fillStyle='rgba(0,0,0,.2)';ctx.fillRect(10,140,W-20,70);
  ctx.fillStyle='#fff';ctx.font='bold 12px sans-serif';ctx.textAlign='left';ctx.fillText('手持 / 预备槽 ×'+maxSlots(),16,158);
  function drawItem(it,x,y){
    if(!it)return;ctx.font='28px sans-serif';ctx.textAlign='center';ctx.fillText(it.ticket.dish.icon,x,y);
    ctx.font='10px sans-serif';ctx.fillStyle='#fff';ctx.fillText(it.stage,x,y+16);
  }
  if(hand)drawItem(hand,50,185);else{ctx.fillStyle='rgba(255,255,255,.3)';ctx.font='12px sans-serif';ctx.textAlign='center';ctx.fillText('空',50,185);}
  slots.forEach((s,i)=>drawItem(s,120+i*70,185));
  // stove queue
  ctx.fillStyle='#fff';ctx.font='bold 12px sans-serif';ctx.textAlign='left';ctx.fillText('灶台',16,230);
  stoveQ.forEach((s,i)=>{
    const x=60+i*90,y=210;
    if(FX)FX.tile(ctx,x,y,80,50,s.ready?'#3FC163':'#FF5C8A',8);else{ctx.fillStyle=s.ready?'#3FC163':'#FF5C8A';ctx.fillRect(x,y,80,50);}
    ctx.fillStyle='#fff';ctx.font='22px sans-serif';ctx.textAlign='center';ctx.fillText(s.ticket.dish.icon,x+40,y+28);
    ctx.font='10px sans-serif';ctx.fillText(s.ready?'好了!点灶台':s.left.toFixed(1)+'s',x+40,y+44);
  });
  // stations
  for(const s of STATIONS){
    if(FX)FX.tile(ctx,s.x,s.y,s.w,s.h,s.col,12);else{ctx.fillStyle=s.col;ctx.fillRect(s.x,s.y,s.w,s.h);}
    ctx.fillStyle='#1a1020';ctx.font='bold 18px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(s.label,s.x+s.w/2,s.y+s.h/2);
  }
  ctx.textBaseline='alphabetic';
  if(FX)FX.drawBurst(ctx,sparks);
}
function frame(t){const dt=Math.min(.05,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

function openLevels(){
  show('startScr',false);show('shopScr',false);show('overScr',false);show('lvlScr',true);
  $('lvlInfo').textContent=`解锁 ${prog.unlock}/${TOTAL} · 币 ${prog.coins}`;
  const g=$('lvgrid');g.innerHTML='';
  for(let i=1;i<=TOTAL;i++){const b=document.createElement('button');b.className='btn lvl';const locked=i>prog.unlock;const st=prog.stars[i]|0;
    b.innerHTML=locked?'🔒':`${i%5===0?'👑':''}${i}<small>${'★'.repeat(st)}</small>`;b.disabled=locked;
    if(!locked)b.onclick=()=>enter(i);g.appendChild(b);}
}
function enter(n){const go=()=>startLevel(n);if(!prog.seenTut){prog.seenTut=1;saveProg(prog);tutorial([['料理冲刺','看小票步骤，依次点：切配→灶台→装盘→出餐。'],['耐心','黄色耐心条耗尽客人会离开；连击提高小费。'],['Boss','每 5 关双客潮：同时更多订单，限时完成目标出餐数。']],go);}else go();}
function openShop(){show('lvlScr',false);show('shopScr',true);$('coinLine').textContent='金币：'+prog.coins;
  const items=[
    {k:'stoveLv',name:'快速灶台',desc:'烹饪加速 ('+prog.stoveLv+'/3)',cost:25+prog.stoveLv*20,max:3},
    {k:'slotLv',name:'预备槽',desc:'额外槽位 ('+prog.slotLv+'/2)',cost:30+prog.slotLv*25,max:2},
    {k:'tipLv',name:'小费加成',desc:'小费 ×'+(1+prog.tipLv*0.25).toFixed(2),cost:20+prog.tipLv*15,max:3}
  ];
  const box=$('shopList');box.innerHTML='';
  for(const it of items){const row=document.createElement('div');row.className='row';row.innerHTML=`<div><b>${it.name}</b><br><small>${it.desc}</small></div>`;
    const btn=document.createElement('button');btn.className='btn';const maxed=prog[it.k]>=it.max;
    btn.textContent=maxed?'满':it.cost+'币';btn.disabled=maxed||prog.coins<it.cost;
    btn.onclick=()=>{prog.coins-=it.cost;prog[it.k]++;saveProg(prog);beep(900,.1);openShop();};row.appendChild(btn);box.appendChild(row);}
}
$('startBtn').onclick=openLevels;$('backStart').onclick=()=>{show('lvlScr',false);show('startScr',true);};
$('shopBtn').onclick=openShop;$('shopBack').onclick=openLevels;
$('pauseBtn').onclick=()=>{if(state==='play'){state='pause';show('pauseOv',true);}else if(state==='pause'){state='play';last=performance.now();show('pauseOv',false);}};
$('resumeBtn').onclick=()=>{state='play';last=performance.now();show('pauseOv',false);};
$('menuBtn').onclick=()=>{show('pauseOv',false);state='menu';openLevels();};
$('againBtn').onclick=()=>startLevel(lvl);
$('nextBtn').onclick=()=>{if(lvl<TOTAL)startLevel(lvl+1);else openLevels();};
$('menu2Btn').onclick=()=>{show('overScr',false);openLevels();};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play'){state='pause';show('pauseOv',true);}});

window.__T={
  go(n){prog.seenTut=1;saveProg(prog);startLevel(n|0||1);},
  win(){if(state!=='play')startLevel(lvl||1);served=goal;win();},
  lose(){if(state!=='play')startLevel(lvl||1);lose('测试失败');},
  state(){return{state,lvl,served,goal,fails,tickets:tickets.length,hand:!!hand,stove:stoveQ.length,boss,score,unlock:prog.unlock};}
};
