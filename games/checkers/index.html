<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>西洋跳棋</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#121212;color:#f0f0f0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;display:flex;justify-content:center;min-height:100vh;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.wrap{width:100%;max-width:480px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:10px}
.topbar{width:100%;display:flex;justify-content:space-between;align-items:center}
.hud{display:flex;gap:14px;align-items:center;font-size:15px}
.hud b{font-size:20px}
.hud .me b{color:#EF9A9A}.hud .ai b{color:#B0BEC5}
.iconbtn{background:#1f1f1f;border:1px solid #333;color:#fff;font-size:17px;width:40px;height:40px;border-radius:10px;cursor:pointer;transition:transform .08s}
.iconbtn:active{transform:scale(.9)}
#board{background:linear-gradient(135deg,#3E2723,#1f130f);border-radius:12px;touch-action:none;width:100%;max-width:440px;height:auto;box-shadow:0 6px 24px rgba(0,0,0,.5);cursor:pointer}
.tip{font-size:13px;color:#888;min-height:18px;text-align:center}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.87);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;z-index:20;padding:24px;text-align:center}
.hidden{display:none!important}
.overlay h1{font-size:32px}
.overlay p{color:#bbb;font-size:15px;line-height:1.9;max-width:380px}
.btn{background:linear-gradient(135deg,#EF5350,#B71C1C);border:none;color:#fff;font-size:19px;font-weight:700;padding:13px 52px;border-radius:14px;cursor:pointer;transition:transform .08s;box-shadow:0 4px 16px rgba(239,83,80,.35)}
.btn:active{transform:scale(.94)}
.big{font-size:44px}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="hud">
      <span class="me">🔴 你 <b id="meCount">12</b></span>
      <span class="ai">⚫ 电脑 <b id="aiCount">12</b></span>
    </div>
    <div>
      <button class="iconbtn" id="pauseBtn">⏸</button>
      <button class="iconbtn" id="sndBtn">🔊</button>
    </div>
  </div>
  <canvas id="board" width="440" height="440"></canvas>
  <div class="tip" id="tip">你是红方先行 · 有跳吃必须跳吃</div>
</div>

<div class="overlay" id="startOv">
  <div class="big">🔴</div>
  <h1>西洋跳棋</h1>
  <p>8×8 人机对战，你是红方。<br>点选棋子再点绿点走棋；<br>有跳吃必须跳吃，可连跳；<br>到底线加冕成王，可双向走。<br>吃光对方或困死对方获胜！</p>
  <button class="btn" id="startBtn">开始对弈</button>
</div>
<div class="overlay hidden" id="pauseOv">
  <h1>⏸ 已暂停</h1>
  <button class="btn" id="resumeBtn">继续</button>
</div>
<div class="overlay hidden" id="endOv">
  <div class="big" id="endEmoji">🏆</div>
  <h1 id="endTitle">你赢了！</h1>
  <p id="endScore"></p>
  <p style="color:#888;font-size:13px" id="endHs"></p>
  <button class="btn" id="againBtn">再来一局</button>
</div>

<script>
'use strict';
// ============ 音效 ============
let AC=null, soundOn=true;
function tone(f,d,type,v,slide){ if(!soundOn)return; try{
  AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'square'; o.frequency.value=f;
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),AC.currentTime+d);
  g.gain.setValueAtTime(v||0.06,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+d);
  o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d);
}catch(e){} }
const sfx={
  click(){tone(650,0.06);},
  move(){tone(380,0.08,'triangle',0.08);},
  jump(){tone(700,0.1,'square',0.07,300);},
  king(){[523,659,784].forEach((f,i)=>setTimeout(()=>tone(f,0.15,'triangle',0.08),i*100));},
  bad(){tone(150,0.15,'sawtooth',0.08,-60);},
  win(){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,0.22,'triangle',0.09),i*130));},
  lose(){[400,300,220].forEach((f,i)=>setTimeout(()=>tone(f,0.25,'sawtooth',0.08,-40),i*150));}
};
// ============ 最高分 ============
const HSKEY='g100_checkers_hs';
function getHS(){try{return +(localStorage.getItem(HSKEY)||0);}catch(e){return 0;}}
function setHS(v){try{localStorage.setItem(HSKEY,v);}catch(e){}}
// ============ 核心逻辑 ============
// 0空 1红兵 2黑兵 3红王 4黑王；红(1)向上(row-)，黑(2)向下(row+)
function newBoard(){
  const b=new Array(64).fill(0);
  for(let r=0;r<3;r++)for(let c=0;c<8;c++)if((r+c)%2===1)b[r*8+c]=2;
  for(let r=5;r<8;r++)for(let c=0;c<8;c++)if((r+c)%2===1)b[r*8+c]=1;
  return b;
}
function owner(v){return v===0?0:(v===1||v===3?1:2);}
function isKing(v){return v===3||v===4;}
function dirsFor(v){
  if(v===3||v===4)return[[-1,-1],[-1,1],[1,-1],[1,1]];
  return owner(v)===1?[[-1,-1],[-1,1]]:[[1,-1],[1,1]];
}
// 生成某棋子的全部走法；move={from,steps:[{r,c,cap}],caps,kingTo}
function pieceMoves(b,r,c){
  const v=b[r*8+c],p=owner(v),moves=[];
  // 先找跳吃（DFS连跳）
  const seqs=[];
  (function dfs(br,bc,steps,captured,kinged){
    const bv=b[br*8+bc];
    let any=false;
    for(const [dr,dc] of dirsFor(bv)){
      const mr=br+dr,mc=bc+dc,nr=br+2*dr,nc=bc+2*dc;
      if(nr<0||nr>7||nc<0||nc>7)continue;
      const mid=b[mr*8+mc];
      if(mid!==0&&owner(mid)===3-p&&!captured.has(mr*8+mc)&&b[nr*8+nc]===0){
        any=true;
        const nc2=new Set(captured);nc2.add(mr*8+mc);
        const promo=!isKing(bv)&&((p===1&&nr===0)||(p===2&&nr===7));
        // 加冕后本回合停止（简化）
        if(promo)seqs.push({steps:[...steps,{r:nr,c:nc,cap:[mr,mc]}],kingTo:true});
        else dfs(nr,nc,[...steps,{r:nr,c:nc,cap:[mr,mc]}],nc2,false);
      }
    }
    if(!any&&steps.length)seqs.push({steps,kingTo:false});
  })(r,c,[],new Set(),false);
  for(const s of seqs)moves.push({from:[r,c],steps:s.steps,caps:s.steps.length,kingTo:s.kingTo,capture:true});
  if(moves.length)return moves;
  // 普通走法
  for(const [dr,dc] of dirsFor(v)){
    const nr=r+dr,nc=c+dc;
    if(nr<0||nr>7||nc<0||nc>7||b[nr*8+nc]!==0)continue;
    const kingTo=!isKing(v)&&((p===1&&nr===0)||(p===2&&nr===7));
    moves.push({from:[r,c],steps:[{r:nr,c:nc,cap:null}],caps:0,kingTo,capture:false});
  }
  return moves;
}
function allMoves(b,p){
  let caps=[];
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){
    if(owner(b[r*8+c])!==p)continue;
    const ms=pieceMoves(b,r,c);
    for(const m of ms)if(m.capture)caps.push(m);
  }
  if(caps.length)return caps; // 强制跳吃
  const ms=[];
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){
    if(owner(b[r*8+c])!==p)continue;
    ms.push(...pieceMoves(b,r,c));
  }
  return ms;
}
function applyMove(b,mv){
  const [fr,fc]=mv.from;
  let v=b[fr*8+fc];b[fr*8+fc]=0;
  for(const s of mv.steps)if(s.cap)b[s.cap[0]*8+s.cap[1]]=0;
  const last=mv.steps[mv.steps.length-1];
  if(mv.kingTo)v=v<3?v+2:v;
  b[last.r*8+last.c]=v;
  return mv.caps;
}
function countSide(b,p){let n=0;for(const v of b)if(owner(v)===p)n++;return n;}
// AI：优先跳吃多子 > 加冕 > 前进，30%随机留破绽
function aiChoose(b,p,rng){
  rng=rng||Math.random;
  const moves=allMoves(b,p);
  if(!moves.length)return null;
  if(rng()<0.3)return moves[(rng()*moves.length)|0];
  let best=null,bs=-1e9;
  for(const m of moves){
    const last=m.steps[m.steps.length-1];
    let s=m.caps*10+(m.kingTo?6:0);
    s+=(p===2?last.r:(7-last.r))*0.6; // 向前
    const cv2=b[m.from[0]*8+m.from[1]];
    if(isKing(cv2))s+=2;
    s-=m.caps*0; // 占位
    s+=rng()*3;
    if(s>bs){bs=s;best=m;}
  }
  return best;
}
if(typeof window!=='undefined')window.__CHECKERS__={newBoard,allMoves,applyMove,aiChoose,owner,countSide};
// ============ 游戏状态 ============
const cv=document.getElementById('board'),ctx=cv.getContext('2d');
const CELL=55;
let board=newBoard(),turn=1,over=false,paused=false,started=false;
let sel=null,selMoves=[],floaters=[],particles=[];

function startGame(){
  board=newBoard();turn=1;over=false;paused=false;started=true;
  sel=null;selMoves=[];floaters=[];particles=[];
  document.getElementById('startOv').classList.add('hidden');
  document.getElementById('endOv').classList.add('hidden');
  document.getElementById('pauseOv').classList.add('hidden');
  updateHUD();setTip('你是红方先行 · 有跳吃必须跳吃');draw();sfx.click();
}
function setTip(t){document.getElementById('tip').textContent=t;}
function updateHUD(){
  document.getElementById('meCount').textContent=countSide(board,1);
  document.getElementById('aiCount').textContent=countSide(board,2);
}
function cellFromEvent(e){
  const rect=cv.getBoundingClientRect();
  const x=(e.touches?e.touches[0].clientX:e.clientX)-rect.left;
  const y=(e.touches?e.touches[0].clientY:e.clientY)-rect.top;
  const c=Math.floor(x/rect.width*8),r=Math.floor(y/rect.height*8);
  return (r>=0&&r<8&&c>=0&&c<8)?{r,c}:null;
}
function myMoves(){return allMoves(board,1);}
function humanTap(r,c){
  if(over||paused||!started||turn!==1)return;
  // 点目标
  if(sel){
    const mv=selMoves.find(m=>{const l=m.steps[m.steps.length-1];return l.r===r&&l.c===c;});
    if(mv){doHumanMove(mv);return;}
  }
  // 点自己棋子
  if(owner(board[r*8+c])===1){
    const moves=myMoves().filter(m=>m.from[0]===r&&m.from[1]===c);
    if(moves.length){sel={r,c};selMoves=moves;sfx.click();draw();return;}
    else{sfx.bad();setTip('这颗棋子没有可走的位置');return;}
  }
  sel=null;selMoves=[];draw();
}
function doHumanMove(mv){
  const caps=applyMove(board,mv);
  sel=null;selMoves=[];
  const last=mv.steps[mv.steps.length-1];
  floaters.push({x:(last.c+0.5)*CELL,y:(last.r+0.5)*CELL-8,txt:caps?('跳吃 '+caps+' 子!'):'',life:caps?1:0});
  if(caps)sfx.jump();else sfx.move();
  if(mv.kingTo){sfx.king();floaters.push({x:(last.c+0.5)*CELL,y:(last.r+0.5)*CELL-28,txt:'加冕成王! 👑',life:1});}
  for(let i=0;i<8;i++)particles.push({x:(last.c+0.5)*CELL,y:(last.r+0.5)*CELL,vx:(Math.random()-0.5)*3,vy:(Math.random()-0.5)*3-1,life:1,color:'#EF9A9A'});
  turn=2;updateHUD();draw();
  if(checkEnd(1))return;
  const nm=allMoves(board,2);
  if(!nm.length){finishGame(1,'电脑无棋可走');return;}
  setTip('电脑思考中…');
  setTimeout(()=>{if(over||paused)return;aiTurn();},600+Math.random()*400);
}
function aiTurn(){
  const mv=aiChoose(board,2);
  if(!mv){finishGame(1,'电脑无棋可走');return;}
  const caps=applyMove(board,mv);
  const last=mv.steps[mv.steps.length-1];
  if(caps){sfx.jump();floaters.push({x:(last.c+0.5)*CELL,y:(last.r+0.5)*CELL-8,txt:'电脑跳吃 '+caps+' 子',life:1});}
  else sfx.move();
  if(mv.kingTo)sfx.king();
  turn=1;updateHUD();draw();
  if(checkEnd(2))return;
  const nm=allMoves(board,1);
  if(!nm.length){finishGame(2,'你无棋可走');return;}
  const mustCap=nm.some(m=>m.capture);
  setTip(mustCap?'必须跳吃！点选红子再点绿点':'轮到你走棋');
}
// mover刚走完，检查对方是否还有子/还有棋
function checkEnd(mover){
  const other=3-mover;
  if(countSide(board,other)===0){finishGame(mover,'吃光对方棋子');return true;}
  if(allMoves(board,other).length===0){finishGame(mover,'对方无棋可走');return true;}
  return false;
}
function finishGame(winner,reason){
  over=true;sel=null;selMoves=[];
  updateHUD();draw();
  const hs=getHS();
  let score=countSide(board,winner)*10;
  if(winner===1){sfx.win();score+=50;if(score>hs)setHS(score);}
  else sfx.lose();
  setTimeout(()=>{
    document.getElementById('endEmoji').textContent=winner===1?'🏆':'🤖';
    document.getElementById('endTitle').textContent=winner===1?'你赢了！':'电脑获胜';
    document.getElementById('endScore').textContent=reason+' · 剩余 '+countSide(board,1)+' : '+countSide(board,2)+'（你 : 电脑）';
    document.getElementById('endHs').textContent='历史最高分：'+getHS();
    document.getElementById('endOv').classList.remove('hidden');
  },700);
}
// ============ 绘制 ============
function drawPiece(x,y,r,v,selected){
  const red=owner(v)===1;
  const g=ctx.createRadialGradient(x-r*0.3,y-r*0.3,r*0.2,x,y,r);
  if(red){g.addColorStop(0,'#ff8a80');g.addColorStop(1,'#c62828');}
  else{g.addColorStop(0,'#78909c');g.addColorStop(1,'#1a2229');}
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
  ctx.strokeStyle=selected?'#69F0AE':'rgba(0,0,0,.4)';ctx.lineWidth=selected?4:2;
  ctx.beginPath();ctx.arc(x,y,r-2,0,7);ctx.stroke();
  if(v===3||v===4){
    ctx.fillStyle='#FFD54F';ctx.font='bold '+(r)+'px sans-serif';
    ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('♛',x,y+1);
  }
}
function draw(){
  ctx.clearRect(0,0,440,440);
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){
    ctx.fillStyle=(r+c)%2?'#4E342E':'#8D6E63';
    ctx.fillRect(c*CELL+1,r*CELL+1,CELL-2,CELL-2);
  }
  // 选中棋子高亮
  if(sel){
    ctx.strokeStyle='#69F0AE';ctx.lineWidth=4;
    ctx.strokeRect(sel.c*CELL+3,sel.r*CELL+3,CELL-6,CELL-6);
    const t=Date.now()/400;
    for(const m of selMoves){
      const l=m.steps[m.steps.length-1];
      const x=(l.c+0.5)*CELL,y=(l.r+0.5)*CELL;
      ctx.fillStyle=m.capture?'rgba(255,82,82,'+(0.6+0.3*Math.sin(t))+')':'rgba(105,240,174,'+(0.6+0.3*Math.sin(t))+')';
      ctx.beginPath();ctx.arc(x,y,10,0,7);ctx.fill();
      // 连跳路径
      if(m.steps.length>1){
        ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=3;ctx.setLineDash([6,4]);
        ctx.beginPath();ctx.moveTo((m.from[1]+0.5)*CELL,(m.from[0]+0.5)*CELL);
        for(const s of m.steps)ctx.lineTo((s.c+0.5)*CELL,(s.r+0.5)*CELL);
        ctx.stroke();ctx.setLineDash([]);
      }
    }
  }
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){
    const v=board[r*8+c];if(!v)continue;
    drawPiece((c+0.5)*CELL,(r+0.5)*CELL,20,v,sel&&sel.r===r&&sel.c===c);
  }
  for(const p of particles){
    ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color;
    ctx.fillRect(p.x-2,p.y-2,4,4);
  }
  ctx.globalAlpha=1;
  ctx.textAlign='center';ctx.font='bold 16px sans-serif';
  for(const f of floaters){
    if(f.life<=0)continue;
    ctx.globalAlpha=Math.max(0,f.life);ctx.fillStyle='#FFD54F';ctx.fillText(f.txt,f.x,f.y);
  }
  ctx.globalAlpha=1;
}
function loop(){
  if(started&&!paused&&!over){
    for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=0.06;p.life-=0.03;}
    particles=particles.filter(p=>p.life>0);
    for(const f of floaters){f.y-=0.7;f.life-=0.02;}
    floaters=floaters.filter(f=>f.life>0);
    draw();
  }
  requestAnimationFrame(loop);
}
function onTap(e){
  if(e.cancelable)e.preventDefault();
  if(!started||paused||over)return;
  const pos=cellFromEvent(e);if(!pos)return;
  humanTap(pos.r,pos.c);
}
cv.addEventListener('touchstart',onTap,{passive:false});
cv.addEventListener('mousedown',onTap);
document.getElementById('startBtn').addEventListener('click',startGame);
document.getElementById('againBtn').addEventListener('click',startGame);
document.getElementById('pauseBtn').addEventListener('click',()=>{
  if(!started||over)return;paused=true;
  document.getElementById('pauseOv').classList.remove('hidden');sfx.click();
});
document.getElementById('resumeBtn').addEventListener('click',()=>{
  paused=false;document.getElementById('pauseOv').classList.add('hidden');sfx.click();
});
document.getElementById('sndBtn').addEventListener('click',function(){
  soundOn=!soundOn;this.textContent=soundOn?'🔊':'🔇';if(soundOn)sfx.click();
});
draw();loop();
</script>
</body>
</html>
