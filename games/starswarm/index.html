<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{display:flex;justify-content:center;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.wrap{width:100%;max-width:480px;height:100%;padding:12px;display:flex;flex-direction:column;align-items:center;gap:10px}

.stagebox{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}

.overlay.hidden{display:none}
.lvgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:100%}
.lvgrid .lvl{min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:17px;padding:4px!important;line-height:1.1}

#tutStep{font-size:12px;opacity:.7}

.choices{display:flex;flex-direction:column;gap:10px;width:100%}
.choices .btn,.choices .ghost{width:100%;min-height:62px;text-align:left;padding:8px 14px!important;font-size:16px;display:flex;align-items:center;gap:10px}
.choices .ic{font-size:28px}
.choices small{display:block;font-size:11px;opacity:.85;font-weight:700}
.shopl{display:flex;flex-direction:column;gap:8px;width:100%}
.shopl .ghost{min-height:48px;text-align:left;padding:6px 12px!important;font-size:14px}
.slots{width:100%;display:flex;gap:4px;justify-content:center;font-size:16px;min-height:22px;color:#fff;font-weight:800}
.slots span{background:rgba(0,0,0,.35);border-radius:8px;padding:0 4px}
.slots span sub{font-size:9px}
</style>
<!-- GAME UI BEGIN -->
<style>
:root{--page:#10182f;--surface:#1a2742;--soft:#243754;--ink:#eff7ff;--muted:#adc3da;--accent:#8dded6;--on-accent:#102b36;--line:#38506b;--stage:#111e36;--page:#05051a;--surface:#1a1446;--soft:#2c2755;--ink:#f2f0ff;--muted:#b6b0e6;--accent:#00d9ff;--on-accent:#0b0620;--line:#7a5cff;--b-bg1:#2a1166;--b-bg2:#05051a;--b-btn:#00d9ff;--b-btn-hi:#59e6ff;--b-edge:#0077b8;--b-glow:#7a5cff;--b-glow-rgb:122,92,255;--b-pedge-rgb:122,92,255;--b-btn-ink:#004165;--b-btn-tsh:0 1px 0 rgba(255,255,255,.45);--b-coin-ink:#004165;--b-coin-tsh:none;--b-key-ink:#876cff;--b-title:#ffffff}
/* Shared presentation only; mechanics and state remain inside each standalone game. */

.game-ui body>.wrap{padding:20px 16px max(20px,env(safe-area-inset-bottom));gap:14px;max-width:500px}
.game-ui #app{background:var(--page);color:var(--ink)}
.game-ui :is(.topbar,#topbar){gap:8px;flex-wrap:wrap;min-height:58px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:10px 12px;box-shadow:0 3px 0 var(--soft);font-size:13px}
.game-ui :is(.title,.tb-title,.tb-title,#topbar .t,.topbar .t){color:var(--ink);font-size:16px;font-weight:750;letter-spacing:0}

.game-ui :is(.stat,.topbar .s,.topbar .stat,.scorebar,.stats,.tip,.hint,.hintline,.hsline,.best,.hiscore){color:var(--muted);line-height:1.7}
.game-ui :is(.hint,.hintline,.tip){font-size:12px;max-width:40em;text-wrap:pretty}
.game-ui .scorebar{padding:6px 10px;gap:8px;flex-wrap:wrap}
.game-ui :is(.iconbtn,.iconBtn,.icobtn,.ibtn,.tbtn,.hbtn,.ib,.iconBtn,.pause){min-width:44px;min-height:44px;flex-shrink:0;border-radius:12px;background:var(--soft);color:var(--ink);border:1px solid var(--line);box-shadow:none;font-size:17px}
.game-ui button{font-family:inherit;cursor:pointer;touch-action:manipulation}

.game-ui :is(.ghost,.ghostbtn,.btn2,.abtn,.toolbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line);box-shadow:none;border-radius:12px;min-height:44px}
.game-ui :is(.rowbtns,.btnrow,.ctlrow){gap:10px;flex-wrap:wrap;justify-content:center}
.game-ui :is(.pill,.hudbox,.hud .p){background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:none;font-variant-numeric:tabular-nums}
.game-ui :is(.dbtn,.cbtn,.gbtn,.holdbtn,.firebtn,.bombbtn,.jumpbtn,.pumpbtn,.nbtn){border-radius:12px;box-shadow:0 3px 0 var(--line);min-height:44px}
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv,.screen):has(>.ui-panel){padding:20px;overflow-y:auto;overscroll-behavior:contain}
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv):has(>.ui-panel){background:var(--page);backdrop-filter:none;justify-content:safe center;align-items:center}
.game-ui .ui-panel{width:min(100%,380px);max-height:100%;overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:18px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:24px;padding:30px 24px;box-shadow:0 8px 0 var(--soft),0 20px 48px #15253618;text-align:center;margin:auto}
.game-ui .ui-panel :is(.card,.panel,.pausecard,.ovcard){display:contents}
.game-ui .ui-panel :is(h1,h2,.gamename,.gametitle){font-size:30px;line-height:1.25;font-weight:800;color:var(--ink);background:none;-webkit-text-fill-color:currentColor;text-shadow:none;letter-spacing:-.6px;margin:0}

.game-ui body>.wrap>canvas:not(#fx){background-color:var(--stage);box-shadow:0 0 0 1px var(--line),0 6px 0 var(--soft);border-radius:18px;flex-shrink:0}
.game-ui .screen>canvas.game{box-shadow:0 0 0 1px var(--line),0 6px 0 var(--soft)}
.game-ui #hud{gap:6px;background:var(--surface);color:var(--ink)}
.game-ui #hud :is(.left,.t,.s,.grp,.pill){color:var(--ink)}
.game-ui #hud .pill{background:var(--surface);border-color:var(--line)}
.game-ui body canvas:is(#cv,#game,#board){background-color:var(--stage)}
.game-ui :is(button.dbtn,button.cbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.game-ui :is(button.lvl,button.lvlbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line);border-radius:12px;min-height:54px}
.game-ui :is(button.lvl,button.lvlbtn) :is(.nc,.sz,small){color:var(--muted)}
.game-ui .ui-panel button.lvl{margin:0;min-width:44px;box-shadow:none;padding:8px}
.game-ui #hud :is(.left,.right,.hudl,.hbtns){gap:5px;flex-wrap:wrap}
.game-ui #hud :is(.left,.hudl){min-width:0;flex-shrink:1}
.game-ui #hud :is(.pill,.left){font-size:12px}
.game-ui button:disabled{cursor:default;opacity:.45;box-shadow:none}
.game-ui .ui-panel .ui-assist-note{color:var(--accent);font-weight:700}
@media(min-width:700px){.game-ui body>.wrap{padding-top:32px}.game-ui .ui-panel{padding:36px 30px}}
@media(max-width:360px){.game-ui body>.wrap{padding:10px;gap:10px}.game-ui .ui-panel{padding:22px 18px;gap:13px}.game-ui .ui-panel h1{font-size:26px}.game-ui .ui-emblem{width:70px;height:70px;font-size:38px}.game-ui :is(.topbar,#topbar){gap:5px;padding:8px}.game-ui :is(.iconbtn,.icobtn,.ibtn,.tbtn,.ib){min-width:44px;min-height:44px}}
@media(max-height:650px){.game-ui .ui-panel{padding:18px;gap:12px}.game-ui .ui-emblem{width:60px;height:60px;font-size:32px}.game-ui .ui-panel h1{font-size:25px}.game-ui .ui-panel :is(p,.howto,.sub,.rule){font-size:13px}}

/* 2026-10-20 热修：开局/结算遮罩铺满整屏，主按钮固定在面板底部，避免被画布尺寸裁切（#10） */
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv):has(>.ui-panel){position:fixed;inset:0;z-index:1000;border-radius:0;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
.game-ui .ui-panel{touch-action:pan-y}
.game-ui .ui-panel :is(#startBtn,#btnStart,.startbtn,#bStart,#restartBtn,#btnRestart,#againBtn,#btnAgain,#retryBtn,#btnRetry,#playBtn,#btnPlay){position:sticky;bottom:0;z-index:3;flex-shrink:0}
.game-ui .ui-panel :not(.card,.panel,.pausecard,.ovcard,.ui-mode):has(>:is(#startBtn,#btnStart,.startbtn,#bStart,#restartBtn,#btnRestart,#againBtn,#btnAgain,#retryBtn,#btnRetry,#playBtn,#btnPlay)){position:sticky;bottom:0;z-index:3;flex-shrink:0;background:var(--surface);box-shadow:0 -10px 10px -6px var(--surface)}


/* ===== Direction B · 霓虹糖果 Pop Arcade ===== saturated gradients, chunky bevels with a hard bottom edge, sticker panels, neon on dark themes */

      var pad = Math.ceil(r * .5) + 2, s = scaleOf(ctx);
      ctx.drawImage(sprite('o' + color + r, r * 2, r * 2, pad, s, function (g) { orbArt(g, r, color, pad); }), x - r - pad, y - r - pad, r * 2 + pad * 2, r * 2 + pad * 2);
    },
    // Soft elliptical contact shadow under any sprite (emoji, characters, pieces).
    shadow: function (ctx, x, y, rx, ry, a) {
      ctx.save(); ctx.fillStyle = 'rgba(0,0,0,' + (a == null ? .28 : a) + ')'; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, 7); ctx.fill(); ctx.restore();
    },
    // Lit stage background: vertical gradient plus a vignette. Cached per size/colours.
    stage: function (ctx, w, h, top, bottom) {
      var s = scaleOf(ctx);
      ctx.drawImage(sprite('s' + w + 'x' + h + top + bottom, w, h, 0, s, function (g) {
        var lg = g.createLinearGradient(0, 0, 0, h); lg.addColorStop(0, top); lg.addColorStop(1, bottom); g.fillStyle = lg; g.fillRect(0, 0, w, h);
        var v = g.createRadialGradient(w / 2, h * .35, Math.min(w, h) * .2, w / 2, h / 2, Math.max(w, h) * .75);
        v.addColorStop(0, 'rgba(255,255,255,' + (skin === 'b' ? .10 : .07) + ')'); v.addColorStop(1, 'rgba(0,0,0,.35)'); g.fillStyle = v; g.fillRect(0, 0, w, h);
      }), 0, 0, w, h);
    },
    // Glow is shadowBlur: cheap for a handful of shapes, never use it on every tile.
    glow: function (ctx, color, blur) { ctx.shadowColor = color; ctx.shadowBlur = blur; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0; },
    noGlow: function (ctx) { ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; },
    // Crisp rendering on high-DPI phones without changing game coordinates.
    // Only safe where input code converts with getBoundingClientRect + logical W/H, not cv.width.
    hidpi: function (cv, ctx, w, h) {
      var d = Math.max(1, Math.min(2.5, window.devicePixelRatio || 1));

    },
    // Lightweight particle bursts (pooled array, no allocations per frame beyond the burst).
    burst: function (list, x, y, color, n) {
      for (var i = 0; i < (n || 12); i++) { var a = Math.random() * 6.283, v = 1 + Math.random() * 2.6; list.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 1, life: 1, c: color, r: 1.5 + Math.random() * 2.5 }); }
    },
    drawBurst: function (ctx, list) {
      for (var i = list.length - 1; i >= 0; i--) {
        var p = list[i]; p.x += p.vx; p.y += p.vy; p.vy += .12; p.life -= .035;
        if (p.life <= 0) { list.splice(i, 1); continue; }
        ctx.globalAlpha = p.life; ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (skin === 'b' ? 1.2 : 1), 0, 7); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
  };
  window.GameUI.fx = fx;
}());

<script>
'use strict';

const $=id=>document.getElementById(id);

function setMute(m){muted=m;UI.storageSet(GID+'-mute',m?'1':'0');document.querySelectorAll('.muteBtn').forEach(b=>b.textContent=m?'🔇':'🔊');}
document.addEventListener('DOMContentLoaded',()=>{document.querySelectorAll('.muteBtn').forEach(b=>{b.textContent=muted?'🔇':'🔊';b.addEventListener('click',()=>setMute(!muted));});});
function show(id,on){const e=$(id);if(e)e.classList.toggle('hidden',!on);}
function toast(t,ms){let e=$('toast');if(!e){e=document.createElement('div');e.id='toast';document.body.appendChild(e);}e.textContent=t;e.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove('on'),ms||1600);}
function fitCanvas(cv,box,W,H){const r=box.getBoundingClientRect();const s=Math.max(.1,Math.min(r.width/W,r.height/H));cv.style.width=Math.floor(W*s)+'px';cv.style.height=Math.floor(H*s)+'px';}
function posOf(e,cv,W,H){const r=cv.getBoundingClientRect();const t=(e.touches&&e.touches.length)?e.touches[0]:(e.changedTouches&&e.changedTouches.length)?e.changedTouches[0]:e;return{x:(t.clientX-r.left)*W/r.width,y:(t.clientY-r.top)*H/r.height};}
function rr(c,x,y,w,h,r){c.beginPath();if(c.roundRect)c.roundRect(x,y,w,h,r);else c.rect(x,y,w,h);}
function txt(c,s,x,y,size,color,align,weight,base){c.font=(weight||800)+' '+size+'px "HarmonyOS Sans SC","MiSans","Noto Sans SC","PingFang SC",system-ui,sans-serif';c.fillStyle=color||'#fff';c.textAlign=align||'center';c.textBaseline=base||'middle';c.fillText(s,x,y);}
function otxt(c,s,x,y,size,color,align,weight){c.lineWidth=Math.max(2,size/5);c.strokeStyle='rgba(0,0,0,.7)';c.lineJoin='round';c.font=(weight||900)+' '+size+'px "HarmonyOS Sans SC","MiSans","Noto Sans SC","PingFang SC",system-ui,sans-serif';c.textAlign=align||'center';c.textBaseline='middle';c.strokeText(s,x,y);c.fillStyle=color||'#fff';c.fillText(s,x,y);}
function mkRng(seed){let s=seed>>>0||1;return()=>{s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function starStr(n,max){max=max||3;return '★'.repeat(n)+'☆'.repeat(Math.max(0,max-n));}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
// 新手引导：pages=[[标题,说明],...]，看完后回调
function tutorial(pages,done){let i=0;const ov=$('tutScr');function render(){$('tutH').textContent=pages[i][0];$('tutP').innerHTML=pages[i][1];$('tutStep').textContent=(i+1)+' / '+pages.length;$('tutNext').textContent=i<pages.length-1?'下一步':'开始挑战';}
  $('tutNext').onclick=()=>{tone(700,.06,'triangle');if(i<pages.length-1){i++;render();}else{show('tutScr',false);done&&done();}};
  $('tutSkip').onclick=()=>{show('tutScr',false);done&&done();};render();show('tutScr',true);}

const W=360,H=560;const cv=$('cv'),ctx=cv.getContext('2d');
if(FX)FX.hidpi(cv,ctx,W,H);else{cv.width=W;cv.height=H;}
const fit=()=>fitCanvas(cv,$('box'),W,H);addEventListener('resize',fit);
const STAGES=[{n:'灰烬星环',bg:['#1a1240','#05031a'],grid:'#4f3cff',mul:1,pool:['bug','fast']},{n:'赤焰星云',bg:['#3a0d1f','#12030a'],grid:'#ff3d6e',mul:1.35,pool:['bug','fast','tank']},{n:'翡翠深空',bg:['#0b3326','#02110b'],grid:'#2ee6a0',mul:1.75,pool:['bug','fast','tank','shoot']},{n:'雷暴虚域',bg:['#10284a','#020a18'],grid:'#4fc3f7',mul:2.0,pool:['bug','fast','tank','shoot','boom']},{n:'终焉黑洞',bg:['#2a0a3a','#08000f'],grid:'#d36bff',mul:2.45,pool:['bug','fast','tank','shoot','boom','split']}];
const FOE={bug:{hp:10,sp:52,dmg:6,r:9,c:'#ff5c8a',xp:1},fast:{hp:6,sp:95,dmg:4,r:7,c:'#ffd23f',xp:1},tank:{hp:55,sp:34,dmg:12,r:14,c:'#9aa8c4',xp:4},shoot:{hp:16,sp:45,dmg:5,r:10,c:'#2ee6a0',xp:2,shoot:1},boom:{hp:14,sp:70,dmg:20,r:10,c:'#ff7a45',xp:2,boom:1},split:{hp:30,sp:48,dmg:8,r:12,c:'#c77dff',xp:3,split:1},mini:{hp:5,sp:80,dmg:4,r:6,c:'#c77dff',xp:1}};
const WEAP={
 blaster:{n:'能量弹',a:'🔫',d:'向最近的敌人连续射击',evo:'rate',en:'风暴连射'},
 orbit:{n:'环绕刃',a:'🌀',d:'绕身旋转的能量刃',evo:'area',en:'星环风暴'},
 chain:{n:'闪电链',a:'⚡',d:'劈中敌人并连锁跳跃',evo:'power',en:'雷神之怒'},
 nova:{n:'冲击波',a:'💫',d:'周期性向四周释放冲击',evo:'armor',en:'超新星'},
 missile:{n:'追踪导弹',a:'🚀',d:'自动追踪并爆炸',evo:'magnet',en:'蜂群导弹'},
 lance:{n:'穿透激光',a:'🔆',d:'贯穿一条直线的激光',evo:'speed',en:'歼星光矛'},
};
const PASS={power:{n:'聚能核心',a:'💪',d:'伤害 +15%'},rate:{n:'超频芯片',a:'⏩',d:'攻击频率 +12%'},speed:{n:'推进器',a:'👟',d:'移动速度 +10%'},hp:{n:'纳米装甲',a:'❤️',d:'最大生命 +20'},magnet:{n:'引力磁场',a:'🧲',d:'拾取范围 +30%'},armor:{n:'偏导护盾',a:'🛡️',d:'受到伤害 -1'},regen:{n:'修复虫群',a:'💚',d:'每秒回复 0.4 生命'},area:{n:'扩散透镜',a:'⭕',d:'范围 +12%'}};
const META=[['mpow','💪 永久伤害','+5% 伤害',[60,120,220,360,520]],['mhp','❤️ 永久生命','+15 最大生命',[50,100,180,300,450]],['mspd','👟 永久移速','+5% 移速',[60,140,260]],['mmag','🧲 永久拾取','+20% 拾取范围',[40,90,160]],['mrev','✨ 复活','死亡后复活一次（每级 1 次）',[300,800]],['mgold','🪙 贪婪','金币 +20%',[80,180,320]]];
let save=Store.get('save',{coins:0,stage:0,best:[],meta:{},tut:0});
const ml=k=>save.meta[k]||0;
let state='menu',stg=0,pl,foes=[],bul=[],ebul=[],gems=[],fxs=[],sparks=[],t=0,kills=0,coins=0,spawnAcc=0,bossNext=120,joy=null,camx=0,camy=0,lvQ=0,rerolls=2,bossOn=null,last=0,shake=0;
function newRun(s){stg=s;pl={x:0,y:0,hp:100+15*ml('mhp'),max:100+15*ml('mhp'),lv:1,xp:0,nx:5,w:{blaster:1},p:{},iframe:0,face:0,rev:ml('mrev'),regenAcc:0,cd:{}};
 foes=[];bul=[];ebul=[];gems=[];fxs=[];sparks=[];t=0;kills=0;coins=0;spawnAcc=0;bossNext=120;lvQ=0;rerolls=2;bossOn=null;state='play';hideAll();fit();hud();toast(STAGES[s].n+' · 坚持 8 分钟！');last=performance.now();}
function hideAll(){['startScr','menuScr','lvScr','pauseOv','overScr','tutScr'].forEach(i=>show(i,false));}
const P=k=>pl.p[k]||0;
const dmgMul=()=>(1+.15*P('power'))*(1+.05*ml('mpow'));const rateMul=()=>1/(1+.12*P('rate'));const areaMul=()=>1+.12*P('area');
const spd=()=>130*(1+.1*P('speed'))*(1+.05*ml('mspd'));const magR=()=>60*(1+.3*P('magnet'))*(1+.2*ml('mmag'));
function evolved(k){return pl.w[k]>=5&&P(WEAP[k].evo)>=1;}
function hud(){const s=Math.floor(t);$('timeT').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');$('lvT').textContent=pl.lv;$('killT').textContent=kills;$('score').textContent=coins;
 $('slots').innerHTML=Object.keys(pl.w).map(k=>'<span>'+WEAP[k].a+'<sub>'+(evolved(k)?'★':pl.w[k])+'</sub></span>').join('')+Object.keys(pl.p).map(k=>'<span>'+PASS[k].a+'<sub>'+pl.p[k]+'</sub></span>').join('');}
// ---------- 生成 ----------
function spawn(type,boss){const S=STAGES[stg];const a=Math.random()*6.283,d=Math.max(W,H)*.62;const D=boss?null:FOE[type];const m=S.mul*(1+t/140)*UI.pick(1,1.25);
 if(boss){const lvl=Math.round(t/120);const hp=900*S.mul*lvl*(1+lvl*.35);const b={boss:1,x:pl.x+Math.cos(a)*d*.7,y:pl.y+Math.sin(a)*d*.7,hp,max:hp,sp:46,dmg:22*S.mul,r:30,c:['#ff3d6e','#ffb21e','#2ee6a0','#4fc3f7','#d36bff'][stg],xp:40,ab:3,phase:0,n:['虫母','炎魔','巨像','雷鲸','虚空之主'][stg]};foes.push(b);bossOn=b;toast('⚠ 首领 '+b.n+' 出现！',2200);tone(90,.8,'sawtooth',.12,45);return;}
 foes.push({t:type,x:pl.x+Math.cos(a)*d,y:pl.y+Math.sin(a)*d,hp:D.hp*m,max:D.hp*m,sp:D.sp*(1+t/1200),dmg:D.dmg*Math.sqrt(m),r:D.r,c:D.c,xp:D.xp,D,cd:1+Math.random()*2,hit:0});}
function spawnTick(dt){const S=STAGES[stg];const rate=(1.1+t/40)*(stg*.1+1);spawnAcc+=rate*dt;const cap=260;
 while(spawnAcc>=1){spawnAcc--;if(foes.length>=cap)break;const pool=S.pool.filter((k,i)=>t>i*35||i<2);spawn(pool[Math.floor(Math.random()*pool.length)]);}
 if(t>=bossNext&&!bossOn){bossNext+=120;spawn(null,true);}
 // 精英：每 45 秒一只，掉宝箱
 if(Math.floor(t/45)!==Math.floor((t-dt)/45)&&t>10){spawn('tank');const e=foes[foes.length-1];e.hp*=6;e.max*=6;e.r=19;e.elite=1;e.c='#ffcf33';}}
// ---------- 武器 ----------
function nearest(x,y,maxd){let b=null,bd=(maxd||9999)**2;for(const f of foes){const d=(f.x-x)**2+(f.y-y)**2;if(d<bd){bd=d;b=f;}}return b;}
function hurt(f,d,kx,ky){if(f.dead)return;f.hp-=d;f.hit=1;if(kx!=null&&!f.boss){f.x+=kx;f.y+=ky;}if(Math.random()<.25)fxs.push({x:f.x,y:f.y-f.r,s:Math.round(d),life:.6,c:'#fff'});if(f.hp<=0)killF(f);}
function killF(f){f.dead=1;kills++;if(f.boss){bossOn=null;for(let i=0;i<20;i++)gems.push({x:f.x+(Math.random()-.5)*80,y:f.y+(Math.random()-.5)*80,v:5});gems.push({x:f.x,y:f.y,chest:1});coins+=Math.round(60*(1+.2*ml('mgold')));noise(.8,.3,400);shake=.5;}
 else{gems.push({x:f.x,y:f.y,v:f.xp});if(f.elite)gems.push({x:f.x+10,y:f.y,chest:1});if(Math.random()<.04)gems.push({x:f.x,y:f.y,coin:1});if(Math.random()<.004)gems.push({x:f.x,y:f.y,heal:1});if(Math.random()<.003)gems.push({x:f.x,y:f.y,mag:1});}
 if(FX&&Math.random()<.5)FX.burst(sparks,f.x-camx,f.y-camy,f.c,f.boss?40:5);
 if(f.D&&f.D.boom){for(const o of foes)if(!o.dead&&(o.x-f.x)**2+(o.y-f.y)**2<50*50)hurt(o,15);if((pl.x-f.x)**2+(pl.y-f.y)**2<50*50)hurtP(f.dmg);fxs.push({ring:1,x:f.x,y:f.y,R:50,life:1,c:'#ff7a45'});}
 if(f.D&&f.D.split){for(let k=0;k<2;k++){const D=FOE.mini;foes.push({t:'mini',x:f.x+(k?8:-8),y:f.y,hp:D.hp*STAGES[stg].mul,max:D.hp*STAGES[stg].mul,sp:D.sp,dmg:D.dmg,r:D.r,c:D.c,xp:D.xp,D,cd:9,hit:0});}}
 if(Math.random()<.3)tone(500+Math.random()*300,.03,'triangle',.02);}
function fireWeapons(dt){const W_=pl.w;const dm=dmgMul(),rm=rateMul(),am=areaMul();
 for(const k in W_){const L=W_[k],ev=evolved(k);pl.cd[k]=(pl.cd[k]||0)-dt;
  if(k==='orbit'){const n=1+L+(ev?3:0),R=(52+L*6)*am*(ev?1.4:1);pl.orbA=(pl.orbA||0)+dt*(3+L*.4);for(let i=0;i<n;i++){const a=pl.orbA+i*6.283/n;const x=pl.x+Math.cos(a)*R,y=pl.y+Math.sin(a)*R;for(const f of foes){if(f.dead)continue;if((f.x-x)**2+(f.y-y)**2<(f.r+9)**2){f.ocd=(f.ocd||0)-dt;if(f.ocd<=0){f.ocd=.35;hurt(f,(7+L*3)*dm*(ev?1.6:1),Math.cos(a)*6,Math.sin(a)*6);}}}}continue;}
  if(pl.cd[k]>0)continue;

 if(joy&&joy.on){ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(joy.sx,joy.sy,44,0,7);ctx.stroke();ctx.fillStyle='rgba(255,255,255,.35)';ctx.beginPath();ctx.arc(joy.x,joy.y,18,0,7);ctx.fill();}
 if(t<6&&state==='play')otxt(ctx,'按住屏幕拖动移动 · 武器自动开火',W/2,H-24,13,'#ffe066');
 if(t>=420&&t<480)otxt(ctx,'坚持到 8:00！',W/2,48,14,'#ffe066');}
// ---------- 流程 ----------
function pause(){if(state==='play'){state='pause';$('pauseP').innerHTML=Object.keys(pl.w).map(k=>WEAP[k].a+WEAP[k].n+' Lv'+pl.w[k]).join(' · ');show('pauseOv',true);}}
$('pauseBtn').onclick=pause;$('resumeBtn').onclick=()=>{show('pauseOv',false);state='play';last=performance.now();};$('quitBtn').onclick=()=>{show('pauseOv',false);state='play';pl.rev=0;pl.iframe=0;hurtP(99999);};
$('againBtn').onclick=openMenu;
function showTut(done){tutorial([
 ['🕹 操作','按住屏幕任意位置并拖动 = 虚拟摇杆。所有武器都会<b>自动</b>攻击，你只需要走位躲开敌人。'],
 ['💎 升级','击败敌人掉落经验晶石（靠近自动吸取）。升级时三选一：新武器 / 武器升级 / 被动强化。最多 5 武器 + 5 被动。'],
 ['🌟 进化','武器升到 Lv5，同时拥有对应的被动（升级卡上会提示），就会进化成强力形态。精英（👑）和首领会掉 🎁 宝箱。'],
 ['⏱ 目标','每个星域坚持 8 分钟，每 2 分钟出现首领。金币可在星图购买永久强化，通关解锁下一个星域。']],done);}
$('howBtn').onclick=()=>{show('menuScr',false);showTut(openMenu);};
$('startBtn').onclick=()=>{audio();show('startScr',false);if(!save.tut){showTut(()=>{save.tut=1;Store.set('save',save);newRun(0);});}else openMenu();};
$('bestLine').textContent=save.coins||save.stage?'已解锁 '+(Math.min(5,save.stage+1))+' 个星域 · 🪙 '+save.coins:'';
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
function frame(ts){const dt=Math.min(.05,(ts-last)/1000);last=ts;if(state==='play')update(dt);draw(dt);requestAnimationFrame(frame);}
fit();requestAnimationFrame(frame);
window.__ss={gems:()=>gems,get s(){return{state,t:Math.round(t),lv:pl&&pl.lv,hp:pl&&Math.round(pl.hp),kills,foes:foes.length,w:pl&&JSON.stringify(pl.w)}},newRun,tick:(n,dt)=>{for(let i=0;i<n&&state==='play';i++)update(dt||1/30);},pl:()=>pl,foes:()=>foes,pickLv:()=>{const b=document.querySelector('#lvC button');if(b)b.click();},joy:(dx,dy)=>{joy=dx==null?null:{on:1,sx:0,sy:0,x:dx,y:dy};}};
</script>
