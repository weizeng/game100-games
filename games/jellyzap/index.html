<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>电鳗伏击</title>
<style>
/* ART T2-4 */
html.game-ui #muteBtn,html.game-ui #pauseBtn,html.game-ui #soundBtn,html.game-ui #sndBtn,html.game-ui #snd,html.game-ui .muteBtn,html.game-ui .iconbtn,html.game-ui .iconBtn,html.game-ui .icobtn,html.game-ui .ibtn,html.game-ui #pausebtn,html.game-ui #mutebtn,html.game-ui #btnMute,html.game-ui #btnPause,html.game-ui .tbtn,html.game-ui #soundBtn{min-width:44px;min-height:44px}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#050a24;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;color:#e8eaf6}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:10px 12px;z-index:5;pointer-events:none}
.hud .btn{pointer-events:auto}
.btn{width:44px;height:44px;font-size:22px;background:rgba(26,35,126,.6);border:2px solid #7986cb;border-radius:12px;cursor:pointer;color:#fff;display:flex;align-items:center;justify-content:center}
.scoreBox{text-align:center;font-size:15px;font-weight:bold;color:#c5cae9;text-shadow:0 0 8px #3949ab}
.chgWrap{position:fixed;left:12px;right:12px;bottom:16px;z-index:5;pointer-events:none}
.chgBar{height:18px;background:rgba(0,0,0,.55);border:2px solid #7986cb;border-radius:10px;overflow:hidden}
.chgFill{height:100%;width:0%;background:linear-gradient(90deg,#3949ab,#ffee58,#ffea00);border-radius:7px}
.chgLabel{font-size:13px;color:#c5cae9;margin-top:3px;text-align:center;text-shadow:0 1px 2px #000}
.overlay{position:fixed;inset:0;background:rgba(5,10,36,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;padding:24px;text-align:center}
.overlay h1{font-size:42px;margin-bottom:6px;color:#ffee58;text-shadow:0 0 18px #3949ab}
.overlay h2{font-size:20px;margin-bottom:14px;color:#c5cae9}
.overlay p{font-size:15px;line-height:1.8;color:#9fa8da;margin-bottom:18px;max-width:340px}
.bigBtn{min-width:180px;min-height:52px;font-size:20px;font-weight:bold;background:linear-gradient(180deg,#3949ab,#1a237e);color:#fff;border:3px solid #7986cb;border-radius:16px;cursor:pointer;box-shadow:0 0 20px rgba(57,73,171,.7);padding:12px 28px}
.bigBtn:active{transform:scale(.95)}
.hidden{display:none!important}
.hsLine{font-size:14px;color:#ffd54f;margin-top:12px}
</style>
<!-- GAME UI BEGIN -->
<style>
:root{--page:#08202e;--surface:#0f3042;--soft:#164058;--ink:#e8fbff;--muted:#9cc4cf;--accent:#4fd8e8;--on-accent:#04222c;--line:#24576e;--stage:#061824;--page:#03121f;--surface:#0c2a40;--soft:#1f3b4f;--ink:#e8fbff;--muted:#a6cfd8;--accent:#2ee6d6;--on-accent:#0b0620;--line:#2ee6d6;--b-bg1:#0b4a6e;--b-bg2:#03121f;--b-btn:#2ee6d6;--b-btn-hi:#77efe4;--b-edge:#0c8a8a;--b-glow:#7af5ff;--b-glow-rgb:122,245,255;--b-pedge-rgb:46,230,214;--b-btn-ink:#074c4c;--b-btn-tsh:0 1px 0 rgba(255,255,255,.45);--b-coin-ink:#074c4c;--b-coin-tsh:none;--b-key-ink:#7af5ff;--b-title:#ffffff}
/* Shared presentation only; mechanics and state remain inside each standalone game. */
html.game-ui{background:var(--page);color:var(--ink);color-scheme:light;font-family:"Bahnschrift","Microsoft YaHei UI","PingFang SC",sans-serif}
html.game-ui:is([data-theme="space"],[data-theme="arcade"],[data-theme="lab"],[data-theme="ocean"],[data-theme="magic"]){color-scheme:dark}
.game-ui body{background:var(--page);color:var(--ink);font-family:inherit;overscroll-behavior:none}
.game-ui body>.wrap{padding:20px 16px max(20px,env(safe-area-inset-bottom));gap:14px;max-width:500px}
.game-ui #app{background:var(--page);color:var(--ink)}
.game-ui :is(.topbar,#topbar){gap:8px;flex-wrap:wrap;min-height:58px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:10px 12px;box-shadow:0 3px 0 var(--soft);font-size:13px}
.game-ui :is(.title,.tb-title,.tb-title,#topbar .t,.topbar .t){color:var(--ink);font-size:16px;font-weight:750;letter-spacing:0}
.game-ui :is(.topbar,.hud,#hud,#topbar) :is(b,.v){color:var(--accent);font-variant-numeric:tabular-nums}
.game-ui :is(.stat,.topbar .s,.topbar .stat,.scorebar,.stats,.tip,.hint,.hintline,.hsline,.best,.hiscore){color:var(--muted);line-height:1.7}
.game-ui :is(.hint,.hintline,.tip){font-size:12px;max-width:40em;text-wrap:pretty}
.game-ui .scorebar{padding:6px 10px;gap:8px;flex-wrap:wrap}
.game-ui :is(.iconbtn,.iconBtn,.icobtn,.ibtn,.tbtn,.hbtn,.ib,.iconBtn,.pause){min-width:44px;min-height:44px;flex-shrink:0;border-radius:12px;background:var(--soft);color:var(--ink);border:1px solid var(--line);box-shadow:none;font-size:17px}
.game-ui button{font-family:inherit;cursor:pointer;touch-action:manipulation}
.game-ui button:focus-visible,.game-ui [tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.game-ui :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn){background:var(--accent);color:var(--on-accent);border:1px solid transparent;border-radius:13px;min-height:50px;padding:13px 28px;font-size:16px;font-weight:750;letter-spacing:0;box-shadow:0 4px 0 var(--line);text-shadow:none;max-width:100%}
.game-ui :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn):active{box-shadow:none;transform:translateY(2px)}
.game-ui :is(.ghost,.ghostbtn,.btn2,.abtn,.toolbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line);box-shadow:none;border-radius:12px;min-height:44px}
.game-ui :is(.rowbtns,.btnrow,.ctlrow){gap:10px;flex-wrap:wrap;justify-content:center}
.game-ui :is(.pill,.hudbox,.hud .p){background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:none;font-variant-numeric:tabular-nums}
.game-ui :is(.dbtn,.cbtn,.gbtn,.holdbtn,.firebtn,.bombbtn,.jumpbtn,.pumpbtn,.nbtn){border-radius:12px;box-shadow:0 3px 0 var(--line);min-height:44px}
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv,.screen):has(>.ui-panel){padding:20px;overflow-y:auto;overscroll-behavior:contain}
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv):has(>.ui-panel){background:var(--page);backdrop-filter:none;justify-content:safe center;align-items:center}
.game-ui .ui-panel{width:min(100%,380px);max-height:100%;overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:18px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:24px;padding:30px 24px;box-shadow:0 8px 0 var(--soft),0 20px 48px #15253618;text-align:center;margin:auto}
.game-ui .ui-panel :is(.card,.panel,.pausecard,.ovcard){display:contents}
.game-ui .ui-panel :is(h1,h2,.gamename,.gametitle){font-size:30px;line-height:1.25;font-weight:800;color:var(--ink);background:none;-webkit-text-fill-color:currentColor;text-shadow:none;letter-spacing:-.6px;margin:0}
.game-ui .ui-panel :is(p,.howto,.sub,.rule){font-size:14px;line-height:1.85;color:var(--muted);background:none;border:0;box-shadow:none;padding:0;margin:0;max-width:32em;text-align:left;white-space:normal}
.game-ui .ui-panel :is(.bigemoji,.bigemoji,.ic,.big):not(.bigscore){animation:none;filter:none;text-shadow:none}
.game-ui .ui-emblem{width:90px;height:90px;display:grid;place-items:center;border:1px solid var(--line);border-radius:28px;background:var(--soft);font-size:48px;line-height:1;flex-shrink:0;position:relative}
.game-ui[data-theme="wood"] .ui-emblem{border-radius:50%;box-shadow:inset 0 0 0 5px var(--surface),inset 0 0 0 6px var(--line)}
.game-ui[data-theme="wood"] .ui-panel h1{font-family:"STKaiti","KaiTi","Microsoft YaHei",serif;letter-spacing:2px}
.game-ui[data-theme="ice"] .ui-emblem{border-radius:26px 8px 26px 8px}
.game-ui[data-theme="space"] .ui-emblem{background:radial-gradient(circle at center,var(--soft) 42%,transparent 43%),var(--surface);border-radius:50%;outline:1px solid var(--line);outline-offset:7px;margin:7px}
.game-ui[data-theme="kitchen"] .ui-emblem{border-radius:22px;border-bottom:5px solid var(--line)}
.game-ui .ui-panel :is(.score,.bigscore,.bigScore,.scorebig){color:var(--accent);font-size:48px;font-weight:800;font-variant-numeric:tabular-nums}
.game-ui .ui-panel :is(.best,.hsline,.hiscore,.endstats,.endstats b){color:var(--muted);font-size:13px;line-height:1.8}
.game-ui .ui-mode{display:grid;grid-template-columns:1fr 1fr;gap:5px;background:var(--soft);padding:5px;border:1px solid var(--line);border-radius:14px;width:100%}
.game-ui .ui-mode button{min-height:44px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-size:14px;font-weight:700;box-shadow:none}
.game-ui .ui-mode button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 2px 5px #1525361a}
.game-ui .ui-panel .ui-mode-note{font-size:12px;line-height:1.6;text-align:center;color:var(--muted)}
.game-ui .ui-mode-status{display:block;padding:5px 10px;color:var(--accent);font-size:11px;font-weight:700;line-height:1.5;text-align:center;border:1px solid var(--line);border-radius:8px;background:var(--surface);margin:4px auto;max-width:100%;pointer-events:none}
.game-ui body>.wrap>canvas:not(#fx){background-color:var(--stage);box-shadow:0 0 0 1px var(--line),0 6px 0 var(--soft);border-radius:18px;flex-shrink:0}
.game-ui .screen>canvas.game{box-shadow:0 0 0 1px var(--line),0 6px 0 var(--soft)}
.game-ui #hud{gap:6px;background:var(--surface);color:var(--ink)}
.game-ui #hud :is(.left,.t,.s,.grp,.pill){color:var(--ink)}
.game-ui #hud .pill{background:var(--surface);border-color:var(--line)}
.game-ui body canvas:is(#cv,#game,#board){background-color:var(--stage)}
.game-ui :is(button.dbtn,button.cbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.game-ui :is(button.lvl,button.lvlbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line);border-radius:12px;min-height:54px}
.game-ui :is(button.lvl,button.lvlbtn) :is(.nc,.sz,small){color:var(--muted)}
.game-ui .ui-panel button.lvl{margin:0;min-width:44px;box-shadow:none;padding:8px}
.game-ui #hud :is(.left,.right,.hudl,.hbtns){gap:5px;flex-wrap:wrap}
.game-ui #hud :is(.left,.hudl){min-width:0;flex-shrink:1}
.game-ui #hud :is(.pill,.left){font-size:12px}
.game-ui button:disabled{cursor:default;opacity:.45;box-shadow:none}
.game-ui .ui-panel .ui-assist-note{color:var(--accent);font-weight:700}
@media(min-width:700px){.game-ui body>.wrap{padding-top:32px}.game-ui .ui-panel{padding:36px 30px}}
@media(max-width:360px){.game-ui body>.wrap{padding:10px;gap:10px}.game-ui .ui-panel{padding:22px 18px;gap:13px}.game-ui .ui-panel h1{font-size:26px}.game-ui .ui-emblem{width:70px;height:70px;font-size:38px}.game-ui :is(.topbar,#topbar){gap:5px;padding:8px}.game-ui :is(.iconbtn,.icobtn,.ibtn,.tbtn,.ib){min-width:40px;min-height:44px}}
@media(max-height:650px){.game-ui .ui-panel{padding:18px;gap:12px}.game-ui .ui-emblem{width:60px;height:60px;font-size:32px}.game-ui .ui-panel h1{font-size:25px}.game-ui .ui-panel :is(p,.howto,.sub,.rule){font-size:13px}}
@media(prefers-reduced-motion:reduce){.game-ui *, .game-ui *::before,.game-ui *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
/* 2026-10-20 热修：开局/结算遮罩铺满整屏，主按钮固定在面板底部，避免被画布尺寸裁切（#10） */
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv):has(>.ui-panel){position:fixed;inset:0;z-index:1000;border-radius:0;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
.game-ui .ui-panel{touch-action:pan-y}
.game-ui .ui-panel :is(#startBtn,#btnStart,.startbtn,#bStart,#restartBtn,#btnRestart,#againBtn,#btnAgain,#retryBtn,#btnRetry,#playBtn,#btnPlay){position:sticky;bottom:0;z-index:3;flex-shrink:0}
.game-ui .ui-panel :not(.card,.panel,.pausecard,.ovcard,.ui-mode):has(>:is(#startBtn,#btnStart,.startbtn,#bStart,#restartBtn,#btnRestart,#againBtn,#btnAgain,#retryBtn,#btnRetry,#playBtn,#btnPlay)){position:sticky;bottom:0;z-index:3;flex-shrink:0;background:var(--surface);box-shadow:0 -10px 10px -6px var(--surface)}


/* ===== Direction B · 霓虹糖果 Pop Arcade ===== saturated gradients, chunky bevels with a hard bottom edge, sticker panels, neon on dark themes */
html.game-ui[data-skin="b"]{--fb:"HarmonyOS Sans SC","MiSans","OPPOSans","vivo Sans","Noto Sans SC","Noto Sans CJK SC","PingFang SC","Microsoft YaHei UI",system-ui,sans-serif;--bounce:cubic-bezier(.34,1.56,.64,1);--bg:radial-gradient(circle at 12% 18%,rgba(255,255,255,.28) 0 38px,transparent 40px),radial-gradient(circle at 88% 30%,rgba(255,255,255,.16) 0 64px,transparent 66px),radial-gradient(circle at 20% 82%,rgba(255,255,255,.14) 0 52px,transparent 54px),radial-gradient(rgba(255,255,255,.16) 1.5px,transparent 2.2px) 0 0/22px 22px,linear-gradient(165deg,var(--b-bg1),var(--b-bg2));font-family:var(--fb)}
html.game-ui[data-skin="b"],html.game-ui[data-skin="b"] body,html.game-ui[data-skin="b"] #app,html.game-ui[data-skin="b"] :is(.overlay,.ov,#ov,#overlay,#pauseOv):has(>.ui-panel){background:var(--bg);background-color:var(--b-bg2)}
html.game-ui[data-skin="b"] body{min-height:100vh;font-family:var(--fb)}
html.game-ui[data-skin="b"] :is(.hint,.hintline,.tip){color:rgba(255,255,255,.94);text-shadow:0 1px 2px rgba(0,0,0,.35)}

html.game-ui[data-skin="b"] .ui-panel{background:linear-gradient(180deg,var(--surface),var(--soft));border:4px solid #fff;border-radius:32px;box-shadow:0 9px 0 var(--line),0 9px 0 4px rgba(0,0,0,.08),0 26px 40px rgba(0,0,0,.28);animation:uiB-in .5s var(--bounce) both}
html.game-ui[data-skin="b"] .ui-panel :is(h1,h2,.gamename,.gametitle){font-size:34px;font-weight:900;color:var(--b-title);letter-spacing:0;text-shadow:0 3px 0 var(--line),0 6px 10px rgba(0,0,0,.15)}
html.game-ui[data-skin="b"] .ui-emblem{width:100px;height:100px;border:4px solid #fff;border-radius:50%;background:radial-gradient(circle at 32% 26%,#fff 0 12%,var(--b-glow) 13%,var(--line) 70%,var(--b-edge) 100%);box-shadow:0 7px 0 var(--b-edge),0 16px 24px rgba(0,0,0,.25);font-size:54px;animation:uiB-wobble 2.6s ease-in-out infinite}

html.game-ui[data-skin="b"] .ui-emblem::before{top:-10px;right:-14px}
html.game-ui[data-skin="b"] .ui-emblem::after{bottom:4px;left:-18px;font-size:14px;animation-delay:.9s}
html.game-ui[data-skin="b"] .ui-panel :is(.score,.bigscore,.bigScore,.scorebig,#finalScore){font-size:56px;font-weight:900;color:var(--b-btn);-webkit-text-fill-color:currentColor;text-shadow:0 4px 0 var(--b-edge),0 0 2px var(--b-edge),0 10px 16px rgba(0,0,0,.25)}
html.game-ui[data-skin="b"] .ui-panel :is(h1,.gamename)~h2{font-size:19px;text-shadow:0 2px 0 var(--line)}
/* Chunky bevelled button: highlight lip, darker bottom slab, presses down onto the slab */
html.game-ui[data-skin="b"] :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn,button.actBtn):not(.ghost){position:relative}
html.game-ui[data-skin="b"] :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn,button.actBtn):not(.ghost):not(#\#){overflow:hidden;border:0;border-radius:20px;font-weight:900;color:var(--b-btn-ink);background:linear-gradient(180deg,var(--b-btn-hi),var(--b-btn) 52%);text-shadow:var(--b-btn-tsh);box-shadow:inset 0 3px 0 rgba(255,255,255,.55),inset 0 -5px 0 rgba(0,0,0,.14),0 6px 0 var(--b-edge),0 12px 18px rgba(0,0,0,.25);transition:transform .08s,box-shadow .08s}
html.game-ui[data-skin="b"] :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn,button.actBtn):not(.ghost):not(#\#)::before{content:"";position:absolute;left:12px;top:6px;width:22px;height:9px;border-radius:9px;background:rgba(255,255,255,.75);transform:rotate(-12deg);pointer-events:none}
html.game-ui[data-skin="b"] :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn,button.actBtn):not(.ghost):not(#\#):active{transform:translateY(5px);box-shadow:inset 0 3px 0 rgba(255,255,255,.4),inset 0 -2px 0 rgba(0,0,0,.14),0 1px 0 var(--b-edge),0 4px 8px rgba(0,0,0,.2)}
html.game-ui[data-skin="b"] .ui-panel :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn,button.actBtn):not(.ghost):not(#\#){min-height:56px;padding:14px 34px;font-size:19px;letter-spacing:1px}

html.game-ui[data-skin="b"] :is(.ghost,.ghostbtn,.btn2,.abtn,.toolbtn,.iconbtn,.iconBtn,.icobtn,.ibtn,.tbtn,.hbtn,.ib,.pause,.dbtn,.cbtn,.nbtn,.lvl,.lvlbtn){border:0;border-radius:16px;background:linear-gradient(180deg,#fff,var(--soft));color:var(--b-key-ink);font-weight:900;box-shadow:inset 0 -3px 0 rgba(0,0,0,.06),0 5px 0 var(--line),0 8px 12px rgba(0,0,0,.18);transition:transform .08s,box-shadow .08s}
html.game-ui[data-skin="b"] :is(.ghost,.ghostbtn,.btn2,.abtn,.toolbtn,.iconbtn,.iconBtn,.icobtn,.ibtn,.tbtn,.hbtn,.ib,.pause,.dbtn,.cbtn,.nbtn,.lvl,.lvlbtn):active{transform:translateY(4px);box-shadow:0 1px 0 var(--line),0 2px 4px rgba(0,0,0,.15)}

html.game-ui[data-skin="b"] body canvas:is(#cv,#game,#board):not(#fx),html.game-ui[data-skin="b"] body>.wrap>canvas:not(#fx),html.game-ui[data-skin="b"] .stage{border-radius:24px;outline:5px solid #fff;outline-offset:0;box-shadow:0 10px 0 5px var(--line),0 24px 36px rgba(0,0,0,.32)}

      }), 0, 0, w, h);
    },
    // Glow is shadowBlur: cheap for a handful of shapes, never use it on every tile.
    glow: function (ctx, color, blur) { ctx.shadowColor = color; ctx.shadowBlur = blur; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0; },
    noGlow: function (ctx) { ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; },
    // Crisp rendering on high-DPI phones without changing game coordinates.
    // Only safe where input code converts with getBoundingClientRect + logical W/H, not cv.width.
    hidpi: function (cv, ctx, w, h) {
      var d = Math.max(1, Math.min(2.5, window.devicePixelRatio || 1));
      cv.width = Math.round(w * d); cv.height = Math.round(h * d); // intrinsic ratio stays w:h, so CSS sizing is unchanged
      ctx.setTransform(d, 0, 0, d, 0, 0); return d;
    },
    // Lightweight particle bursts (pooled array, no allocations per frame beyond the burst).
    burst: function (list, x, y, color, n) {
      for (var i = 0; i < (n || 12); i++) { var a = Math.random() * 6.283, v = 1 + Math.random() * 2.6; list.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 1, life: 1, c: color, r: 1.5 + Math.random() * 2.5 }); }
    },
    drawBurst: function (ctx, list) {
      for (var i = list.length - 1; i >= 0; i--) {
        var p = list[i]; p.x += p.vx; p.y += p.vy; p.vy += .12; p.life -= .035;
        if (p.life <= 0) { list.splice(i, 1); continue; }
        ctx.globalAlpha = p.life; ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (skin === 'b' ? 1.2 : 1), 0, 7); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
  };
  window.GameUI.fx = fx;
}());

</script>
<!-- GAME UI END -->
</head>
<body>
<canvas id="cv"></canvas>
<div class="hud">
  <button class="btn" id="pauseBtn">⏸</button>
  <div class="scoreBox">⚡ <span id="score">0</span> 分<br><span style="font-size:11px;font-weight:normal">最高 <span id="hs">0</span></span></div>
  <button class="btn" id="muteBtn">🔊</button>
</div>
<div class="chgWrap"><div class="chgBar"><div class="chgFill" id="chgFill"></div></div><div class="chgLabel" id="chgLabel">按住屏幕蓄电，松手放电 ⚡</div></div>
<div class="overlay" id="startOv">
  <h1>⚡</h1><h2>电鳗伏击</h2>
  <p>你是守在海底的电鳗！<b>按住屏幕蓄电</b>（0~100%），<b>松手释放范围电击</b>。<br>🐟小鱼10分 · 🐠中鱼25分 · 🐡大鱼50分<br>🦈鲨鱼电不死！被电到会<b>暴怒加速冲来</b>——再电它一次把它吓跑，碰到你就完了！</p>
  <button class="bigBtn" id="startBtn">开始伏击</button>
  <div class="hsLine">最高分：<span id="hsStart">0</span></div>
</div>
<div class="overlay hidden" id="pauseOv">
  <h1>⏸</h1><h2>已暂停</h2>
  <button class="bigBtn" id="resumeBtn">继续</button>
</div>
<div class="overlay hidden" id="endOv">
  <h1>🦈</h1><h2>被鲨鱼咬到了！</h2>
  <p id="endDesc"></p>
  <button class="bigBtn" id="retryBtn">再来一次</button>
  <div class="hsLine">最高分：<span id="hsEnd">0</span></div>
</div>
<script>
'use strict';
/* ART T2-4 */var FX=window.GameUI&&GameUI.fx&&GameUI.fx.on?GameUI.fx:null;

// ===== 电鳗伏击：蓄电释放 =====
var cv=document.getElementById('cv'),ctx=cv.getContext('2d'),W=0,H=0,DPR=1;
var EX=0,EY=0; // 电鳗位置
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=window.innerWidth;H=window.innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);EX=W/2;EY=H*0.78;}
window.addEventListener('resize',resize);resize();

// ===== 音效 =====
var AC=null,muted=localStorage.getItem('g100_mute')==='1',chgOsc=null,chgGain=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,vol,slide){if(muted)return;var c=ac();if(!c)return;try{var o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,c.currentTime);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f+slide),c.currentTime+d);g.gain.setValueAtTime(vol||.15,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d);}catch(e){}}
function sndClick(){tone(650,.07,'square',.09);}
function sndCatch(v){tone(700+v*3,.1,'triangle',.16);setTimeout(function(){tone(1050+v*4,.12,'triangle',.13);},60);}
function sndFail(){tone(160,.7,'sawtooth',.22,-100);}
function sndShark(){tone(90,.5,'sawtooth',.2,60);}
function sndFlee(){tone(300,.2,'square',.12,500);}
function zapNoise(){if(muted)return;var c=ac();if(!c)return;try{var len=c.sampleRate*.35,buf=c.createBuffer(1,len,c.sampleRate),d=buf.getChannelData(0);for(var i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2);var s=c.createBufferSource(),g=c.createGain(),f=c.createBiquadFilter();f.type='highpass';f.frequency.value=1200;s.buffer=buf;g.gain.value=.3;s.connect(f);f.connect(g);g.connect(c.destination);s.start();}catch(e){}}
function chgStart(){if(muted)return;var c=ac();if(!c)return;try{chgOsc=c.createOscillator();chgGain=c.createGain();chgOsc.type='sawtooth';chgOsc.frequency.value=80;chgGain.gain.value=.05;chgOsc.connect(chgGain);chgGain.connect(c.destination);chgOsc.start();}catch(e){}}
function chgTick(p){if(chgOsc)try{chgOsc.frequency.value=80+p*4;}catch(e){}}
function chgStop(){if(chgOsc)try{chgOsc.stop();}catch(e){}chgOsc=null;}
function updateMuteBtn(){document.getElementById('muteBtn').textContent=muted?'🔇':'🔊';}
updateMuteBtn();

// ===== 状态 =====
var HSKEY='g100_jellyzap_hs',hs=parseInt(localStorage.getItem(HSKEY)||'0',10)||0;
var state='start',score=0,charge=0,charging=false,cool=0,elapsed=0;
var fishes=[],sharks=[],waves=[],parts=[],floats=[],plankton=[];
var fishT=0,sharkT=8,lastT=0;
var FISH=[{e:'🐟',v:10,r:18,sp:[70,120]},{e:'🐠',v:25,r:24,sp:[50,90]},{e:'🐡',v:50,r:30,sp:[35,60]}];

function startGame(){score=0;charge=0;charging=false;cool=0;elapsed=0;fishes=[];sharks=[];waves=[];parts=[];floats=[];fishT=0;sharkT=8;state='play';hideAll();lastT=performance.now();sndClick();}
function hideAll(){['startOv','pauseOv','endOv'].forEach(function(id){document.getElementById(id).classList.add('hidden');});}
function showEnd(){
  state='end';sndFail();chgStop();
  if(score>hs){hs=score;localStorage.setItem(HSKEY,String(hs));}
  document.getElementById('endDesc').textContent='存活 '+Math.round(elapsed)+' 秒 · 捕鱼得分 '+score;
  document.getElementById('hsEnd').textContent=hs;
  document.getElementById('endOv').classList.remove('hidden');
}
function burst(x,y,n,col){for(var i=0;i<n;i++){var a=Math.random()*Math.PI*2,s=60+Math.random()*180;parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.5+Math.random()*.4,t:0,col:col,r:2+Math.random()*3});}}
function floatText(x,y,txt,col){floats.push({x:x,y:y,txt:txt,t:0,col:col||'#fff'});}
function vibrate(p){try{if(navigator.vibrate)navigator.vibrate(p);}catch(e){}}

// ===== 输入：按住蓄电，松手放电 =====
cv.addEventListener('pointerdown',function(e){ac();if(state!=='play'||cool>0)return;charging=true;charge=0;chgStart();});
window.addEventListener('pointerup',function(){if(state==='play'&&charging)release();});
cv.addEventListener('pointercancel',function(){if(charging){charging=false;charge=0;chgStop();}});
function release(){
  charging=false;chgStop();
  if(charge<5)return;
  cool=.45;zapNoise();vibrate(60);
  var rad=70+charge*2.6; // 满电约330
  waves.push({r:20,max:rad,t:0});
  burst(EX,EY,Math.round(10+charge*.3),'#ffee58');
  // 鱼
  var gained=0;
  for(var i=fishes.length-1;i>=0;i--){var f=fishes[i],d=Math.hypot(f.x-EX,f.y-EY);
    if(d<rad+f.r){fishes.splice(i,1);gained+=f.v;burst(f.x,f.y,12,'#ffee58');floatText(f.x,f.y,'+'+f.v,'#ffee58');}
  }
  if(gained>0){score+=gained;sndCatch(charge);}
  // 鲨鱼：巡游中被电→暴怒；暴怒中被电→吓跑
  for(var j=sharks.length-1;j>=0;j--){var s=sharks[j],ds=Math.hypot(s.x-EX,s.y-EY);
    if(ds<rad+s.r){
      if(s.mode==='cruise'){s.mode='rage';sndShark();vibrate([80,40,80]);floatText(s.x,s.y,'🦈暴怒！','#ef5350');burst(s.x,s.y,14,'#ef5350');}
      else if(s.mode==='rage'){sharks.splice(j,1);score+=100;sndFlee();burst(s.x,s.y,20,'#ffee58');floatText(s.x,s.y,'吓跑了 +100','#ffee58');}
    }
  }
  charge=0;updateHUD();
}
document.getElementById('pauseBtn').addEventListener('click',function(){if(state==='play'){state='pause';charging=false;charge=0;chgStop();document.getElementById('pauseOv').classList.remove('hidden');sndClick();}});
document.getElementById('resumeBtn').addEventListener('click',function(){document.getElementById('pauseOv').classList.add('hidden');state='play';lastT=performance.now();sndClick();});
document.getElementById('startBtn').addEventListener('click',startGame);
document.getElementById('retryBtn').addEventListener('click',startGame);
document.getElementById('muteBtn').addEventListener('click',function(){muted=!muted;localStorage.setItem('g100_mute',muted?'1':'0');updateMuteBtn();if(!muted)sndClick();});

function spawnFish(){
  var k=Math.random(),fi=k<.55?0:k<.85?1:2,cfg=FISH[fi];
  var dir=Math.random()<.5?-1:1;
  fishes.push({e:cfg.e,v:cfg.v,r:cfg.r,x:dir<0?W+40:-40,y:40+Math.random()*(EY-160),
    vx:dir*(cfg.sp[0]+Math.random()*(cfg.sp[1]-cfg.sp[0])+elapsed*.4),ph:Math.random()*6});
}
function spawnShark(){
  var dir=Math.random()<.5?-1:1;
  sharks.push({x:dir<0?W+60:-60,y:80+Math.random()*(EY-200),r:36,vx:dir*(45+Math.random()*20),mode:'cruise'});
}
function updateHUD(){
  document.getElementById('score').textContent=score;
  document.getElementById('hs').textContent=hs;
  document.getElementById('chgFill').style.width=charge+'%';
  var lbl=document.getElementById('chgLabel');
  if(charging)lbl.textContent='⚡ 蓄电中 '+Math.round(charge)+'% …松手放电！';
  else if(cool>0)lbl.textContent='⚡ 放电冷却中…';
  else lbl.textContent='按住屏幕蓄电，松手放电 ⚡';
}

function step(dt){
  elapsed+=dt;cool=Math.max(0,cool-dt);
  if(charging){charge=Math.min(100,charge+dt*55);chgTick(charge);updateHUD();}
  // 鱼群刷新
  fishT-=dt;if(fishT<=0){spawnFish();if(Math.random()<.4+elapsed*.002)spawnFish();fishT=Math.max(.4,1.4-elapsed*.008);}
  // 鲨鱼频率递增
  sharkT-=dt;if(sharkT<=0){spawnShark();sharkT=Math.max(5,16-elapsed*.05);}
  // 鱼
  for(var i=fishes.length-1;i>=0;i--){var f=fishes[i];f.x+=f.vx*dt;f.y+=Math.sin((f.ph+=dt*3))*30*dt;
    if(f.x<-60||f.x>W+60)fishes.splice(i,1);}
  // 鲨鱼
  for(var j=sharks.length-1;j>=0;j--){var s=sharks[j];
    if(s.mode==='cruise'){
      var dx=EX-s.x,dy=EY-s.y,d=Math.hypot(dx,dy)||1;
      s.x+=dx/d*55*dt;s.y+=dy/d*55*dt;
    }else if(s.mode==='rage'){
      var rx=EX-s.x,ry=EY-s.y,rd=Math.hypot(rx,ry)||1;
      s.x+=rx/rd*260*dt;s.y+=ry/rd*260*dt;
    }
    var dd=Math.hypot(s.x-EX,s.y-EY);
    if(dd<55){showEnd();return;}
    if(s.x<-120||s.x>W+120||s.y<-120||s.y>H+120)sharks.splice(j,1);
  }
  // 电波扩散
  for(var wv=waves.length-1;wv>=0;wv--){var w=waves[wv];w.t+=dt*4;w.r+=(w.max-w.r)*Math.min(1,dt*6);if(w.t>1.2)waves.splice(wv,1);}
  // 浮游生物
  if(Math.random()<dt*6)plankton.push({x:Math.random()*W,y:H+8,r:1+Math.random()*2.5,vy:15+Math.random()*25});
  for(var p=plankton.length-1;p>=0;p--){plankton[p].y-=plankton[p].vy*dt;if(plankton[p].y<-10)plankton.splice(p,1);}
  // 粒子/飘字
  for(var q=parts.length-1;q>=0;q--){var pt=parts[q];pt.t+=dt;if(pt.t>pt.life){parts.splice(q,1);continue;}pt.x+=pt.vx*dt;pt.y+=pt.vy*dt;pt.vx*=.96;pt.vy*=.96;}
  for(var f2=floats.length-1;f2>=0;f2--){var fl=floats[f2];fl.t+=dt;fl.y-=38*dt;if(fl.t>1.1)floats.splice(f2,1);}
}

/* ART T2-4 */var jzBg=null,jzBgKey='';
function ensureJzBg(){var k=W+'x'+H;if(jzBg&&jzBgKey===k)return jzBg;jzBgKey=k;var c=document.createElement('canvas');c.width=W;c.height=H;var g=c.getContext('2d');if(FX)FX.stage(g,W,H,'#0a1030','#02040f');else{g.fillStyle='#02040f';g.fillRect(0,0,W,H);}jzBg=c;return jzBg;}
function draw(){
  ctx.drawImage(ensureJzBg(),0,0);
  ctx.fillStyle='rgba(159,168,218,.6)';
  plankton.forEach(function(p){if(FX)FX.orb(ctx,p.x|0,p.y|0,Math.max(1,p.r|0),'#9fa8da');else{ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();}});
  // 海底
  if(FX)FX.tile(ctx,0,(EY+46)|0,W|0,Math.max(4,(H-EY)|0),'#0d1440',0);else{ctx.fillStyle='#0d1440';ctx.fillRect(0,EY+46,W,H-EY);}
  ctx.fillStyle='rgba(121,134,203,.25)';ctx.fillRect(0,EY+46,W,3);
  // 鱼
  fishes.forEach(function(f){ctx.font=(f.r*2)+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.save();ctx.translate(f.x,f.y);if(f.vx>0)ctx.scale(-1,1);ctx.fillText(f.e,0,0);ctx.restore();});
  // 鲨鱼（暴怒红色描边）
  sharks.forEach(function(s){ctx.font='64px serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.save();ctx.translate(s.x,s.y);
    var a=Math.atan2(EY-s.y,EX-s.x);ctx.rotate(s.vx>0&&s.mode==='cruise'?Math.PI:0);
    if(s.mode==='rage'){ctx.shadowColor='#ef5350';ctx.shadowBlur=20;}
    ctx.fillText('🦈',0,0);ctx.restore();ctx.shadowBlur=0;
    if(s.mode==='rage'){ctx.font='18px serif';ctx.fillText('💢',s.x,s.y-44);}});
  // 蓄电圈
  if(charging){var rr=70+charge*2.6;
    ctx.strokeStyle='rgba(255,238,88,'+(.4+charge/200)+')';ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(EX,EY,rr,0,7);ctx.stroke();
    ctx.strokeStyle='rgba(255,238,88,.9)';ctx.lineWidth=5;
    ctx.beginPath();ctx.arc(EX,EY,54,-Math.PI/2,-Math.PI/2+charge/100*Math.PI*2);ctx.stroke();}
  // 电波
  waves.forEach(function(w){ctx.globalAlpha=1-w.t/1.2;
    ctx.strokeStyle='#ffee58';ctx.lineWidth=6;ctx.beginPath();ctx.arc(EX,EY,w.r,0,7);ctx.stroke();
    ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(EX,EY,w.r*.85,0,7);ctx.stroke();});
  ctx.globalAlpha=1;
  // 电鳗（缓动摆动）
  var sw=Math.sin(performance.now()/250)*6;
  ctx.save();ctx.translate(EX,EY+sw*.4);ctx.rotate(sw/120);
  ctx.font='64px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🐍',0,0);
  if(charging){ctx.shadowColor='#ffee58';ctx.shadowBlur=10+charge*.3;ctx.fillText('⚡',0,-44);ctx.shadowBlur=0;}
  ctx.restore();
  // 粒子
  parts.forEach(function(q){ctx.globalAlpha=1-q.t/q.life;ctx.fillStyle=q.col;ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,7);ctx.fill();});
  ctx.globalAlpha=1;
  ctx.font='bold 18px sans-serif';
  floats.forEach(function(fl){ctx.globalAlpha=1-fl.t/1.1;ctx.fillStyle=fl.col;ctx.textAlign='center';ctx.fillText(fl.txt,fl.x,fl.y);});
  ctx.globalAlpha=1;
  ctx.font='bold 14px sans-serif';ctx.textAlign='left';ctx.fillStyle='#9fa8da';
  ctx.fillText(Math.round(elapsed)+'s',12,H-14);
}

function loop(t){
  requestAnimationFrame(loop);
  if(state!=='play')return;
  var dt=Math.min(.05,(t-lastT)/1000||.016);lastT=t;
  step(dt);draw();
}
document.getElementById('hsStart').textContent=hs;
document.getElementById('hs').textContent=hs;
updateHUD();draw();requestAnimationFrame(loop);
</script>
</body>
</html>
