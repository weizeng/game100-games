<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>雪人兄弟</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#121212;color:#f0f0f0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;display:flex;justify-content:center;min-height:100vh;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.wrap{width:100%;max-width:480px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:10px}
.topbar{width:100%;display:flex;justify-content:space-between;align-items:center}
.hud{display:flex;gap:12px;align-items:center;font-size:14px}
.hud b{color:#80DEEA;font-size:20px}
.lives{font-size:15px}
.iconbtn{background:#1f1f1f;border:1px solid #333;color:#fff;font-size:17px;width:40px;height:40px;border-radius:10px;cursor:pointer;transition:transform .08s}
.iconbtn:active{transform:scale(.9)}
#cv{background:linear-gradient(#0d1b2a,#132a3d);border-radius:12px;touch-action:none;width:100%;max-width:440px;height:auto;box-shadow:0 6px 24px rgba(0,0,0,.5)}
.controls{display:flex;gap:14px;align-items:center;justify-content:center;width:100%}
.cbtn{width:68px;height:68px;border-radius:16px;background:#1f1f1f;border:1px solid #444;color:#fff;font-size:24px;cursor:pointer;transition:transform .08s;touch-action:none}
.cbtn:active{transform:scale(.9);background:#333}
.actbtn{width:80px;height:80px;border-radius:50%;border:none;font-size:32px;cursor:pointer;transition:transform .08s;touch-action:none}
.actbtn:active{transform:scale(.9)}
#sprayBtn{background:linear-gradient(135deg,#4DD0E1,#0277BD);box-shadow:0 4px 18px rgba(77,208,225,.4)}
#jumpBtn{background:linear-gradient(135deg,#90A4AE,#455A64);box-shadow:0 4px 18px rgba(144,164,174,.4)}
.tip{font-size:12px;color:#888;text-align:center}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.87);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;z-index:20;padding:24px;text-align:center}
.hidden{display:none!important}
.overlay h1{font-size:32px}
.overlay p{color:#bbb;font-size:15px;line-height:1.9;max-width:380px}
.btn{background:linear-gradient(135deg,#26C6DA,#0277BD);border:none;color:#fff;font-size:19px;font-weight:700;padding:13px 52px;border-radius:14px;cursor:pointer;transition:transform .08s;box-shadow:0 4px 16px rgba(38,198,218,.35)}
.btn:active{transform:scale(.94)}
.big{font-size:44px}
</style>
<!-- GAME UI BEGIN -->
<style>
:root{--page:#daedf5;--surface:#f7fdff;--soft:#c3dfe9;--ink:#214453;--muted:#527685;--accent:#236681;--on-accent:#ffffff;--line:#9fc8d9;--stage:#122e44}
/* Shared presentation only; mechanics and state remain inside each standalone game. */
html.game-ui{background:var(--page);color:var(--ink);color-scheme:light;font-family:"Bahnschrift","Microsoft YaHei UI","PingFang SC",sans-serif}
html.game-ui[data-theme="space"],html.game-ui[data-theme="arcade"]{color-scheme:dark}
.game-ui body{background:var(--page);color:var(--ink);font-family:inherit;overscroll-behavior:none}
.game-ui body>.wrap{padding:20px 16px max(20px,env(safe-area-inset-bottom));gap:14px;max-width:500px}
.game-ui #app{background:var(--page);color:var(--ink)}
.game-ui :is(.topbar,#topbar){gap:8px;flex-wrap:wrap;min-height:58px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:10px 12px;box-shadow:0 3px 0 var(--soft);font-size:13px}
.game-ui :is(.title,.tb-title,.tb-title,#topbar .t,.topbar .t){color:var(--ink);font-size:16px;font-weight:750;letter-spacing:0}
.game-ui :is(.topbar,.hud,#hud,#topbar) :is(b,.v){color:var(--accent);font-variant-numeric:tabular-nums}
.game-ui :is(.stat,.topbar .s,.topbar .stat,.scorebar,.stats,.tip,.hint,.hintline,.hsline,.best,.hiscore){color:var(--muted);line-height:1.7}
.game-ui :is(.hint,.hintline,.tip){font-size:12px;max-width:40em;text-wrap:pretty}
.game-ui .scorebar{padding:6px 10px;gap:8px;flex-wrap:wrap}
.game-ui :is(.iconbtn,.iconBtn,.icobtn,.ibtn,.tbtn,.hbtn,.ib,.iconBtn,.pause){min-width:44px;min-height:44px;flex-shrink:0;border-radius:12px;background:var(--soft);color:var(--ink);border:1px solid var(--line);box-shadow:none;font-size:17px}
.game-ui button{font-family:inherit;cursor:pointer;touch-action:manipulation}
.game-ui button:focus-visible,.game-ui [tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.game-ui :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn){background:var(--accent);color:var(--on-accent);border:1px solid transparent;border-radius:13px;min-height:50px;padding:13px 28px;font-size:16px;font-weight:750;letter-spacing:0;box-shadow:0 4px 0 var(--line);text-shadow:none;max-width:100%}
.game-ui :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn):active{box-shadow:none;transform:translateY(2px)}
.game-ui :is(.ghost,.ghostbtn,.btn2,.abtn,.toolbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line);box-shadow:none;border-radius:12px;min-height:44px}
.game-ui :is(.rowbtns,.btnrow,.ctlrow){gap:10px;flex-wrap:wrap;justify-content:center}
.game-ui :is(.pill,.hudbox,.hud .p){background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:none;font-variant-numeric:tabular-nums}
.game-ui :is(.dbtn,.cbtn,.gbtn,.holdbtn,.firebtn,.bombbtn,.jumpbtn,.pumpbtn,.nbtn){border-radius:12px;box-shadow:0 3px 0 var(--line);min-height:44px}
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv,.screen):has(>.ui-panel){padding:20px;overflow-y:auto;overscroll-behavior:contain}
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv):has(>.ui-panel){background:var(--page);backdrop-filter:none;justify-content:safe center;align-items:center}
.game-ui .ui-panel{width:min(100%,380px);max-height:100%;overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:18px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:24px;padding:30px 24px;box-shadow:0 8px 0 var(--soft),0 20px 48px #15253618;text-align:center;margin:auto}
.game-ui .ui-panel :is(.card,.panel,.pausecard,.ovcard){display:contents}
.game-ui .ui-panel :is(h1,h2,.gamename,.gametitle){font-size:30px;line-height:1.25;font-weight:800;color:var(--ink);background:none;-webkit-text-fill-color:currentColor;text-shadow:none;letter-spacing:-.6px;margin:0}
.game-ui .ui-panel :is(p,.howto,.sub,.rule){font-size:14px;line-height:1.85;color:var(--muted);background:none;border:0;box-shadow:none;padding:0;margin:0;max-width:32em;text-align:left;white-space:normal}
.game-ui .ui-panel :is(.bigemoji,.bigemoji,.ic,.big):not(.bigscore){animation:none;filter:none;text-shadow:none}
.game-ui .ui-emblem{width:90px;height:90px;display:grid;place-items:center;border:1px solid var(--line);border-radius:28px;background:var(--soft);font-size:48px;line-height:1;flex-shrink:0;position:relative}
.game-ui[data-theme="wood"] .ui-emblem{border-radius:50%;box-shadow:inset 0 0 0 5px var(--surface),inset 0 0 0 6px var(--line)}
.game-ui[data-theme="wood"] .ui-panel h1{font-family:"STKaiti","KaiTi","Microsoft YaHei",serif;letter-spacing:2px}
.game-ui[data-theme="ice"] .ui-emblem{border-radius:26px 8px 26px 8px}
.game-ui[data-theme="space"] .ui-emblem{background:radial-gradient(circle at center,var(--soft) 42%,transparent 43%),var(--surface);border-radius:50%;outline:1px solid var(--line);outline-offset:7px;margin:7px}
.game-ui[data-theme="kitchen"] .ui-emblem{border-radius:22px;border-bottom:5px solid var(--line)}
.game-ui .ui-panel :is(.score,.bigscore,.bigScore,.scorebig){color:var(--accent);font-size:48px;font-weight:800;font-variant-numeric:tabular-nums}
.game-ui .ui-panel :is(.best,.hsline,.hiscore,.endstats,.endstats b){color:var(--muted);font-size:13px;line-height:1.8}
.game-ui .ui-mode{display:grid;grid-template-columns:1fr 1fr;gap:5px;background:var(--soft);padding:5px;border:1px solid var(--line);border-radius:14px;width:100%}
.game-ui .ui-mode button{min-height:44px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-size:14px;font-weight:700;box-shadow:none}
.game-ui .ui-mode button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 2px 5px #1525361a}
.game-ui .ui-panel .ui-mode-note{font-size:12px;line-height:1.6;text-align:center;color:var(--muted)}
.game-ui .ui-mode-status{display:block;padding:5px 10px;color:var(--accent);font-size:11px;font-weight:700;line-height:1.5;text-align:center;border:1px solid var(--line);border-radius:8px;background:var(--surface);margin:4px auto;max-width:100%;pointer-events:none}
.game-ui body>.wrap>canvas:not(#fx){background-color:var(--stage);box-shadow:0 0 0 1px var(--line),0 6px 0 var(--soft);border-radius:18px;flex-shrink:0}
.game-ui .screen>canvas.game{box-shadow:0 0 0 1px var(--line),0 6px 0 var(--soft)}
.game-ui #hud{gap:6px;background:var(--surface);color:var(--ink)}
.game-ui #hud :is(.left,.t,.s,.grp,.pill){color:var(--ink)}
.game-ui #hud .pill{background:var(--surface);border-color:var(--line)}
.game-ui body canvas:is(#cv,#game,#board){background-color:var(--stage)}
.game-ui :is(button.dbtn,button.cbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.game-ui :is(button.lvl,button.lvlbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line);border-radius:12px;min-height:54px}
.game-ui :is(button.lvl,button.lvlbtn) :is(.nc,.sz,small){color:var(--muted)}
.game-ui .ui-panel button.lvl{margin:0;min-width:44px;box-shadow:none;padding:8px}
.game-ui #hud :is(.left,.right,.hudl,.hbtns){gap:5px;flex-wrap:wrap}
.game-ui #hud :is(.left,.hudl){min-width:0;flex-shrink:1}
.game-ui #hud :is(.pill,.left){font-size:12px}
.game-ui button:disabled{cursor:default;opacity:.45;box-shadow:none}
.game-ui .ui-panel .ui-assist-note{color:var(--accent);font-weight:700}
@media(min-width:700px){.game-ui body>.wrap{padding-top:32px}.game-ui .ui-panel{padding:36px 30px}}
@media(max-width:360px){.game-ui body>.wrap{padding:10px;gap:10px}.game-ui .ui-panel{padding:22px 18px;gap:13px}.game-ui .ui-panel h1{font-size:26px}.game-ui .ui-emblem{width:70px;height:70px;font-size:38px}.game-ui :is(.topbar,#topbar){gap:5px;padding:8px}.game-ui :is(.iconbtn,.icobtn,.ibtn,.tbtn,.ib){min-width:40px;min-height:44px}}
@media(max-height:650px){.game-ui .ui-panel{padding:18px;gap:12px}.game-ui .ui-emblem{width:60px;height:60px;font-size:32px}.game-ui .ui-panel h1{font-size:25px}.game-ui .ui-panel :is(p,.howto,.sub,.rule){font-size:13px}}
@media(prefers-reduced-motion:reduce){.game-ui *, .game-ui *::before,.game-ui *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
/* 2026-10-20 热修：开局/结算遮罩铺满整屏，主按钮固定在面板底部，避免被画布尺寸裁切（#10） */
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv):has(>.ui-panel){position:fixed;inset:0;z-index:1000;border-radius:0;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
.game-ui .ui-panel{touch-action:pan-y}
.game-ui .ui-panel :is(#startBtn,#btnStart,.startbtn,#bStart,#restartBtn,#btnRestart,#againBtn,#btnAgain,#retryBtn,#btnRetry,#playBtn,#btnPlay){position:sticky;bottom:0;z-index:3;flex-shrink:0}
.game-ui .ui-panel :not(.card,.panel,.pausecard,.ovcard,.ui-mode):has(>:is(#startBtn,#btnStart,.startbtn,#bStart,#restartBtn,#btnRestart,#againBtn,#btnAgain,#retryBtn,#btnRetry,#playBtn,#btnPlay)){position:sticky;bottom:0;z-index:3;flex-shrink:0;background:var(--surface);box-shadow:0 -10px 10px -6px var(--surface)}


</style>
<script>
// Installed before the original game script; embedded so downloaded ZIPs remain offline capable.
(function () {
  'use strict';
  var config = {"id":"snowbros","name":"雪人兄弟","theme":"ice","icon":"⛄","challenge":"仅有 2 条命，善用雪球连锁清怪"};
  var mode = 'classic';
  try { mode = sessionStorage.getItem('game100-mode-' + config.id) || mode; } catch (_) {}
  var expert = mode === 'expert';
  var used = { hint: 0, undo: 0 };
  var limits = { hint: 1, undo: 3 };
  function storageKey(key) { return expert && !/sound|mute/i.test(key) ? 'expert:' + key : key; }
  window.GameUI = {
    expert: expert,
    pick: function (classic, advanced) { return expert ? advanced : classic; },
    storageGet: function (key) { return localStorage.getItem(storageKey(key)); },
    storageSet: function (key, value) { localStorage.setItem(storageKey(key), value); },
    storageRemove: function (key) { localStorage.removeItem(storageKey(key)); }
  };
  var root = document.documentElement;
  root.classList.add('game-ui');
  root.dataset.theme = config.theme;
  root.dataset.game = config.id;
  root.dataset.mode = mode;
  var gesture = new WeakMap();
  function labelButtons(scope) {
    scope.querySelectorAll('button').forEach(function (button) {
      if (button.getAttribute('aria-label')) return;
      var id = button.id.toLowerCase(), text = button.textContent.trim();
      var name = /mute|sound|snd/.test(id) ? '切换音效' : /pause/.test(id) ? '暂停游戏' : /hint/.test(id) && !/close|ok/.test(id) ? '查看提示' : '';
      if (!name && /^[⏸🔊🔇💡Ⅱ]+$/u.test(text)) name = { '⏸': '暂停游戏', '🔊': '切换音效', '🔇': '切换音效', '💡': '查看提示' }[text];
      if (name) button.setAttribute('aria-label', name);
    });
  }
  function decorate(container) {
    if (container.querySelector(':scope > .ui-panel') || !container.querySelector('h1,h2,.gamename')) return;
    if (container.matches('.screen') && container.querySelector('canvas:not(#fx)')) return;
    var panel = document.createElement('div');
    panel.className = 'ui-panel';
    while (container.firstChild) panel.appendChild(container.firstChild);
    container.appendChild(panel);
    var heading = panel.querySelector('h1,h2,.gamename');
    var start = /start|menu|ready/i.test(container.id) || !!panel.querySelector('#startBtn,#btnStart,.startbtn');
    if (start) {
      var headings = panel.querySelectorAll('h1,h2,.gamename');
      if (headings.length > 1 && !/[A-Za-z0-9\u4e00-\u9fff]/.test(heading.textContent)) { heading.remove(); heading = headings[1]; }
      var oldIcon = panel.querySelector('.bigemoji,.ic');
      if (oldIcon) oldIcon.remove();
      var emblem = document.createElement('div');
      emblem.className = 'ui-emblem'; emblem.textContent = config.icon; emblem.setAttribute('aria-hidden', 'true');
      panel.insertBefore(emblem, panel.firstChild);
      heading.textContent = config.name;
      var switcher = document.createElement('div'); switcher.className = 'ui-mode'; switcher.setAttribute('role', 'group'); switcher.setAttribute('aria-label', '选择玩法模式');
      [['classic','经典模式'],['expert','进阶挑战']].forEach(function (item) {
        var b = document.createElement('button'); b.type = 'button'; b.textContent = item[1]; b.dataset.mode = item[0]; b.setAttribute('aria-pressed', String(mode === item[0]));
        b.addEventListener('click', function () {
          if (mode === item[0]) return;
          try { sessionStorage.setItem('game100-mode-' + config.id, item[0]); location.reload(); }
          catch (_) { b.textContent = '浏览器未允许保存模式'; }
        });
        switcher.appendChild(b);
      });
      var primary = panel.querySelector('#startBtn,#btnStart,.startbtn,button');
      var anchor = primary;
      while (anchor && anchor.parentNode !== panel && !anchor.parentNode.matches('.card,.panel,.pausecard,.ovcard')) anchor = anchor.parentNode;
      var target = anchor ? anchor.parentNode : panel;
      target.insertBefore(switcher, anchor || null);
      var note = document.createElement('p'); note.className = 'ui-mode-note';
      note.textContent = expert ? config.challenge + '。进阶纪录单独保存。' : '按原规则轻松开局，也可切换进阶挑战。';
      target.insertBefore(note, anchor || null);
    }
    labelButtons(panel);
  }
  function notify(text) {
    var el = document.getElementById('ui-assist-toast');
    if (!el) { el = document.createElement('div'); el.id = 'ui-assist-toast'; el.className = 'ui-mode-status'; el.setAttribute('role', 'status'); el.style.cssText = 'position:fixed;bottom:18px;left:16px;right:16px;z-index:200;padding:14px'; document.body.appendChild(el); }
    el.textContent = text; el.hidden = false;
    clearTimeout(notify.timer); notify.timer = setTimeout(function () { el.hidden = true; }, 2000);
  }
  function assistEvent(event) {
    if (!expert) return;
    var b = event.target.closest('button'); if (!b || b.closest('.ui-mode')) return;
    var kind = /^(hintBtn|hintTopBtn|btnHint)$/i.test(b.id) ? 'hint' : /^(undoBtn|undoTopBtn|btnUndo)$/i.test(b.id) || /悔一步|撤销/.test(b.textContent) ? 'undo' : '';
    if (!kind) return;
    var prev = gesture.get(b), blocked;
    if (event.type === 'click' && prev && performance.now() - prev.at < 1000) blocked = prev.blocked;
    else { blocked = used[kind] >= limits[kind]; if (!blocked) used[kind]++; gesture.set(b, { at: performance.now(), blocked: blocked }); }
    if (blocked) { event.preventDefault(); event.stopImmediatePropagation(); notify(kind === 'hint' ? '本次挑战的 1 次提示已用完' : '本次挑战的 3 次撤销已用完'); }
  }
  document.addEventListener('pointerdown', assistEvent, true);
  document.addEventListener('click', assistEvent, true);
  document.addEventListener('click', function (event) {
    var b = event.target.closest('button');
    if (b && /^(startBtn|btnStart|restartBtn|againBtn|retryBtn|btnAgain|btnRestart|playAgain)$/i.test(b.id)) used = { hint: 0, undo: 0 };
  }, true);
  document.addEventListener('DOMContentLoaded', function () {
    var selector = '.overlay,.ov,#ov,#overlay,#pauseOv,.screen';
    document.querySelectorAll(selector).forEach(function (container) {
      decorate(container);
      // Only dynamic overlay children are observed; animated scores never trigger this work.
      new MutationObserver(function () { decorate(container); }).observe(container, { childList: true });
    });
    labelButtons(document);
  });
}());

</script>
<!-- GAME UI END -->
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="hud">得分 <b id="score">0</b> <span class="lives" id="lives">❤❤❤</span> <span id="level">第1关</span></div>
    <div>
      <button class="iconbtn" id="pauseBtn">⏸</button>
      <button class="iconbtn" id="sndBtn">🔊</button>
    </div>
  </div>
  <canvas id="cv" width="400" height="440"></canvas>
  <div class="controls">
    <button class="cbtn" id="leftBtn">◀</button>
    <button class="cbtn" id="rightBtn">▶</button>
    <button class="actbtn" id="sprayBtn">❄</button>
    <button class="actbtn" id="jumpBtn">⤴</button>
  </div>
  <div class="tip">◀ ▶ 移动 · ❄ 喷雪（多喷几次堆成雪球）<br>撞雪球把它推滚，碾过怪物连击加分 · ⤴ 跳跃</div>
</div>

<div class="overlay" id="startOv">
  <div class="big">⛄</div>
  <h1>雪人兄弟</h1>
  <p>对着怪物按 ❄ 喷雪，喷满 5 次<br>怪物变成大雪球！走过去一撞，<br>雪球滚起来碾过沿途所有怪物，<br>连击越高分越高。偶尔掉落道具：<br>🔵 加大雪量 · 🟡 加速移动。<br>5 关，3 条命，别被怪物碰到！</p>
  <button class="btn" id="startBtn">开始游戏</button>
</div>
<div class="overlay hidden" id="pauseOv">
  <h1>⏸ 已暂停</h1>
  <button class="btn" id="resumeBtn">继续</button>
</div>
<div class="overlay hidden" id="endOv">
  <div class="big" id="endEmoji">⛄</div>
  <h1 id="endTitle">游戏结束</h1>
  <p id="endScore"></p>
  <p style="color:#888;font-size:13px" id="endHs"></p>
  <button class="btn" id="againBtn">重新开始</button>
</div>

<script>
/* GAMEPLAY UPGRADE */
'use strict';
// ============ 音效 ============
let AC=null, soundOn=true;
function tone(f,d,type,v,slide){ if(!soundOn)return; try{
  AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'square'; o.frequency.value=f;
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),AC.currentTime+d);
  g.gain.setValueAtTime(v||0.05,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+d);
  o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d);
}catch(e){} }
const sfx={
  click(){tone(650,0.06);},
  spray(){tone(1200,0.08,'sine',0.05,400);},
  snowball(){tone(500,0.2,'triangle',0.08,300);},
  roll(){tone(200,0.15,'triangle',0.05);},
  crush(){tone(350,0.2,'square',0.08,-200);},
  item(){tone(880,0.15,'sine',0.08,400);},
  jump(){tone(300,0.12,'square',0.06,400);},
  hit(){tone(140,0.3,'sawtooth',0.1,-60);},
  win(){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,0.2,'triangle',0.08),i*120));},
  lose(){[400,300,200,150].forEach((f,i)=>setTimeout(()=>tone(f,0.25,'sawtooth',0.08,-40),i*160));}
};
const HSKEY='g100_snowbros_hs';
function getHS(){try{return +(GameUI.storageGet(HSKEY)||0);}catch(e){return 0;}}
function setHS(v){try{GameUI.storageSet(HSKEY,v);}catch(e){}}
// ============ 关卡 ============
const W=400,H=440,GRAV=0.5;
function buildLevel(lv){
  // 平台
  const plats=[
    {x0:0,x1:W,y:400},{x0:40,x1:220,y:310},{x0:180,x1:360,y:310},
    {x0:0,x1:180,y:220},{x0:220,x1:400,y:220},{x0:80,x1:320,y:130}
  ];
  const n=Math.min(2+lv,6);
  const monsters=[];
  const spots=[[60,360],[340,360],[120,270],[280,270],[90,180],[310,180],[200,90]];
  for(let i=0;i<n;i++){
    const s=spots[i%spots.length];
    monsters.push({x:s[0],y:s[1],vx:(Math.random()<0.5?-1:1)*(0.6+lv*0.15),vy:0,
      snow:0,ball:false,alive:true,dir:1,plat:-1,rollVx:0,chain:0});
  }
  return {plats,monsters,items:[],shots:[]};
}
// ============ 游戏状态 ============
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let started=false,over=false,paused=false;
let L,player,keys={};
let score=0,lives=GameUI.pick(3,2),level=1,chain=0;
let particles=[],floaters=[],invuln=0,sprayCd=0;
let snowPow=1,speedPow=1,powT=0;

function startGame(){
  score=0;lives=GameUI.pick(3,2);level=1;snowPow=1;speedPow=1;
  document.getElementById('startOv').classList.add('hidden');
  document.getElementById('endOv').classList.add('hidden');
  document.getElementById('pauseOv').classList.add('hidden');
  started=true;over=false;paused=false;
  loadLevel(1);updateHUD();sfx.click();
}
function loadLevel(lv){
  L=buildLevel(lv);
  player={x:200,y:360,vx:0,vy:0,face:1,grounded:false,alive:true};
  particles=[];floaters=[];invuln=0;chain=0;powT=0;snowPow=1;speedPow=1;
  document.getElementById('level').textContent='第'+lv+'关 / 5';
}
function updateHUD(){
  document.getElementById('score').textContent=score;
  document.getElementById('lives').textContent='❤'.repeat(Math.max(0,lives))+'🖤'.repeat(Math.max(0,3-lives));
}
function addScore(n,x,y){score+=n;floaters.push({x,y,txt:'+'+n,life:1});updateHUD();}
function groundY(x,y){
  // 返回脚下最近平台y（脚在平台上时）
  let best=null;
  for(const p of L.plats){
    if(x>=p.x0-6&&x<=p.x1+6&&y<=p.y&&p.y-y<40)best=best===null?p.y:Math.min(best,p.y);
  }
  return best;
}
function hitPlayer(){
  if(invuln>0||!player.alive||over)return;
  lives--;updateHUD();sfx.hit();player.alive=false;
  for(let i=0;i<14;i++)particles.push({x:player.x,y:player.y,vx:(Math.random()-0.5)*4,vy:(Math.random()-0.5)*4-2,life:1,color:'#B3E5FC'});
  if(lives<=0){gameOver(false);return;}
  setTimeout(()=>{if(over)return;
    player={x:200,y:360,vx:0,vy:0,face:1,grounded:false,alive:true};invuln=2;
  },1100);
}
function gameOver(win){
  over=true;
  if(score>getHS())setHS(score);
  if(win)sfx.win();else sfx.lose();
  setTimeout(()=>{
    document.getElementById('endEmoji').textContent=win?'🏆':'⛄';
    document.getElementById('endTitle').textContent=win?'全部通关！':'游戏结束';
    document.getElementById('endScore').textContent='得分 '+score+' · 到达第 '+level+' 关';
    document.getElementById('endHs').textContent='历史最高分：'+getHS();
    document.getElementById('endOv').classList.remove('hidden');
  },600);
}
// ============ 更新 ============
function step(){
  const dt=1;
  if(powT>0){powT-=dt/60;if(powT<=0){snowPow=1;speedPow=1;}}
  // --- 玩家 ---
  if(player.alive){
    const sp=2.6*speedPow;
    if(keys.left){player.x-=sp*dt;player.face=-1;}
    if(keys.right){player.x+=sp*dt;player.face=1;}
    player.x=Math.max(14,Math.min(W-14,player.x));
    if(keys.jump&&player.grounded){player.vy=-10.5;player.grounded=false;sfx.jump();keys.jump=false;}
    player.vy+=GRAV*dt;player.y+=player.vy*dt;
    const gy=groundY(player.x,player.y+14);
    if(gy!==null&&player.vy>=0&&player.y+14>=gy-4){
      player.y=gy-14;player.vy=0;player.grounded=true;
    }else player.grounded=false;
    if(player.y>H+30)hitPlayer();
    if(invuln>0)invuln-=dt/60;
    // 喷雪
    sprayCd-=dt/60;
    if(keys.spray&&sprayCd<=0){
      sprayCd=0.22;sfx.spray();
      L.shots.push({x:player.x+player.face*16,y:player.y,vx:player.face*7,life:40,dir:player.face});
      for(let i=0;i<3;i++)particles.push({x:player.x+player.face*16,y:player.y,vx:player.face*(2+Math.random()*2),vy:(Math.random()-0.5)*2,life:0.5,color:'#E1F5FE'});
    }
  }
  // --- 雪花子弹 ---
  for(const s of L.shots){
    s.x+=s.vx*dt;s.life-=dt;
    for(const m of L.monsters){
      if(!m.alive||m.ball)continue;
      if(Math.hypot(s.x-m.x,s.y-m.y)<20){
        m.snow+=snowPow;s.life=0;sfx.spray();
        for(let i=0;i<4;i++)particles.push({x:m.x,y:m.y,vx:(Math.random()-0.5)*3,vy:-Math.random()*2,life:0.6,color:'#fff'});
        if(m.snow>=5){
          m.ball=true;m.rollVx=0;sfx.snowball();
          floaters.push({x:m.x,y:m.y-20,txt:'雪球!',life:1});
        }
        break;
      }
    }
  }
  L.shots=L.shots.filter(s=>s.life>0&&s.x>0&&s.x<W);
  // --- 怪物 ---
  for(const m of L.monsters){
    if(!m.alive)continue;
    if(m.ball){
      // 雪球：被推则滚动
      if(m.rollVx===0){
        // 玩家撞击推动
        if(player.alive&&Math.hypot(player.x-m.x,player.y-m.y)<30){
          m.rollVx=player.x<m.x?4.5:-4.5;
          m.chain=0; // 本次滚动重新计连击
          sfx.roll();
        }
        // 重力贴平台
        const gy=groundY(m.x,m.y+14);
        if(gy!==null&&m.y+14<gy-2){m.y+=3;}
      }else{
        m.x+=m.rollVx*dt;
        // 碾压怪物（连击按本次滚动累计）
        for(const o of L.monsters){
          if(o===m||!o.alive||o.ball)continue;
          if(Math.hypot(o.x-m.x,o.y-m.y)<28){
            o.alive=false;m.chain++;
            const pts=100*m.chain;
            addScore(pts,o.x,o.y-10);sfx.crush();
            floaters.push({x:o.x,y:o.y-26,txt:m.chain>1?('连击x'+m.chain+' +'+pts):('+'+pts),life:1.2});
            for(let i=0;i<10;i++)particles.push({x:o.x,y:o.y,vx:(Math.random()-0.5)*4,vy:(Math.random()-0.5)*4-2,life:0.8,color:'#fff'});
            // 掉道具
            if(Math.random()<0.35)L.items.push({x:o.x,y:o.y,vy:-3,kind:Math.random()<0.5?'snow':'speed',life:600});
          }
        }
        // 撞墙碎裂
        if(m.x<16||m.x>W-16){
          m.alive=false;sfx.crush();
          for(let i=0;i<12;i++)particles.push({x:m.x,y:m.y,vx:(Math.random()-0.5)*5,vy:(Math.random()-0.5)*5-2,life:0.8,color:'#fff'});
          addScore(50,m.x,m.y-10);
        }
        // 平台边缘掉落继续滚
        const gy=groundY(m.x,m.y+16);
        if(gy===null||m.y+16<gy-6)m.y+=4*dt;
      }
    }else{
      // 普通怪物：平台上左右走
      m.x+=m.vx*dt;
      const gy=groundY(m.x,m.y+14);
      if(gy!==null){m.y=gy-14;}
      else{m.vx*=-1;m.x+=m.vx*2*dt;}
      if(m.x<16||m.x>W-16)m.vx*=-1;
      // 随机转向
      if(Math.random()<0.005)m.vx*=-1;
      // 碰玩家
      if(player.alive&&invuln<=0&&Math.hypot(player.x-m.x,player.y-m.y)<24)hitPlayer();
      // 雪球撞到普通怪（玩家推的雪球在上面已处理）
    }
  }
  L.monsters=L.monsters.filter(m=>m.alive);
  // --- 道具 ---
  for(const it of L.items){
    it.vy+=0.3*dt;it.y+=it.vy*dt;
    const gy=groundY(it.x,it.y+8);
    if(gy!==null&&it.y+8>=gy){it.y=gy-8;it.vy=0;}
    it.life-=dt;
    if(player.alive&&Math.hypot(player.x-it.x,player.y-it.y)<26){
      it.life=0;sfx.item();
      if(it.kind==='snow'){snowPow=2;powT=20;floaters.push({x:it.x,y:it.y-16,txt:'雪量加大!',life:1.2});}
      else{speedPow=1.5;powT=20;floaters.push({x:it.x,y:it.y-16,txt:'加速!',life:1.2});}
    }
  }
  L.items=L.items.filter(i=>i.life>0);
  // --- 过关 ---
  if(!L.monsters.length&&!over){
    score+=300;updateHUD();sfx.win();
    if(level>=5){gameOver(true);return;}
    level++;
    floaters.push({x:200,y:200,txt:'第'+level+'关 +300',life:2});
    player.alive=false;
    setTimeout(()=>{if(!over)loadLevel(level);},1200);
  }
  // 粒子
  for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=0.06;p.life-=0.04;}
  particles=particles.filter(p=>p.life>0);
  for(const f of floaters){f.y-=0.6;f.life-=0.025;}
  floaters=floaters.filter(f=>f.life>0);
  if(score>getHS())setHS(score);
}
// ============ 绘制 ============
function draw(){
  ctx.clearRect(0,0,W,H);
  // 雪花背景
  ctx.fillStyle='rgba(255,255,255,.3)';
  const tt=Date.now()/50;
  for(let i=0;i<24;i++){
    const sx=(i*67)%W,sy=(i*97+tt*(1+i%3))%H;
    ctx.fillRect(sx,sy,2,2);
  }
  // 平台（冰）
  for(const p of L?L.plats:[]){
    const g=ctx.createLinearGradient(0,p.y-8,0,p.y+6);
    g.addColorStop(0,'#B3E5FC');g.addColorStop(1,'#4FC3F7');
    ctx.fillStyle=g;
    ctx.beginPath();
    if(ctx.roundRect)ctx.roundRect(p.x0,p.y-8,p.x1-p.x0,14,6);else ctx.rect(p.x0,p.y-8,p.x1-p.x0,14);
    ctx.fill();
  }
  if(!L)return;
  // 道具
  for(const it of L.items){
    ctx.font='20px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(it.kind==='snow'?'🔵':'🟡',it.x,it.y);
  }
  // 雪花子弹
  for(const s of L.shots){
    ctx.fillStyle='#E1F5FE';ctx.beginPath();ctx.arc(s.x,s.y,5,0,7);ctx.fill();
    ctx.fillStyle='#fff';ctx.font='10px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('❄',s.x,s.y);
  }
  // 怪物
  for(const m of L.monsters){
    ctx.textAlign='center';ctx.textBaseline='middle';
    if(m.ball){
      const roll=m.rollVx!==0?(Date.now()/60)%6.28:0;
      ctx.save();ctx.translate(m.x,m.y);ctx.rotate(roll);
      ctx.font='34px sans-serif';ctx.fillText('⛄',0,0);ctx.restore();
    }else{
      // 雪覆盖度
      const cov=Math.min(1,m.snow/5);
      ctx.font='26px sans-serif';
      ctx.fillText('👺',m.x,m.y);
      if(cov>0){
        ctx.fillStyle='rgba(255,255,255,'+(cov*0.85)+')';
        ctx.beginPath();ctx.arc(m.x,m.y-4,13*cov+4,0,7);ctx.fill();
      }
      // 雪量条
      ctx.fillStyle='rgba(0,0,0,.4)';ctx.fillRect(m.x-14,m.y-24,28,5);
      ctx.fillStyle='#4DD0E1';ctx.fillRect(m.x-14,m.y-24,28*cov,5);
    }
  }
  // 玩家
  if(player.alive){
    if(!(invuln>0&&((Date.now()/150)|0)%2===0)){
      ctx.save();ctx.translate(player.x,player.y);ctx.scale(player.face,1);
      ctx.font='28px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText('⛄',0,0);ctx.restore();
      if(snowPow>1){ctx.fillStyle='#4DD0E1';ctx.font='12px sans-serif';ctx.textAlign='center';ctx.fillText('❄x2',player.x,player.y-24);}
    }
  }
  // 粒子
  for(const p of particles){
    ctx.globalAlpha=Math.max(0,Math.min(1,p.life));ctx.fillStyle=p.color;
    ctx.fillRect(p.x-2,p.y-2,4,4);
  }
  ctx.globalAlpha=1;
  // 飘字
  ctx.font='bold 14px sans-serif';ctx.textAlign='center';
  for(const f of floaters){
    ctx.globalAlpha=Math.max(0,Math.min(1,f.life));ctx.fillStyle='#FFD54F';
    ctx.fillText(f.txt,f.x,f.y);
  }
  ctx.globalAlpha=1;
}
function loop(){
  if(started&&!paused&&!over)step();
  draw();
  requestAnimationFrame(loop);
}
// ============ 输入 ============
function bindHold(el,down,up){
  const on=e=>{if(e.cancelable)e.preventDefault();down();};
  const off=e=>{if(e.cancelable)e.preventDefault();if(up)up();};
  el.addEventListener('touchstart',on,{passive:false});
  el.addEventListener('touchend',off,{passive:false});
  el.addEventListener('touchcancel',off,{passive:false});
  el.addEventListener('mousedown',on);
  el.addEventListener('mouseup',off);
  el.addEventListener('mouseleave',off);
}
bindHold(document.getElementById('leftBtn'),()=>{keys.left=true;},()=>{keys.left=false;});
bindHold(document.getElementById('rightBtn'),()=>{keys.right=true;},()=>{keys.right=false;});
bindHold(document.getElementById('sprayBtn'),()=>{keys.spray=true;},()=>{keys.spray=false;});
bindHold(document.getElementById('jumpBtn'),()=>{keys.jump=true;},()=>{keys.jump=false;});
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'||e.key==='a')keys.left=true;
  if(e.key==='ArrowRight'||e.key==='d')keys.right=true;
  if(e.key===' '||e.key==='j')keys.spray=true;
  if(e.key==='ArrowUp'||e.key==='w'||e.key==='k'){e.preventDefault();keys.jump=true;}
});
document.addEventListener('keyup',e=>{
  if(e.key==='ArrowLeft'||e.key==='a')keys.left=false;
  if(e.key==='ArrowRight'||e.key==='d')keys.right=false;
  if(e.key===' '||e.key==='j')keys.spray=false;
  if(e.key==='ArrowUp'||e.key==='w'||e.key==='k')keys.jump=false;
});
document.getElementById('startBtn').addEventListener('click',startGame);
document.getElementById('againBtn').addEventListener('click',startGame);
document.getElementById('pauseBtn').addEventListener('click',()=>{
  if(!started||over)return;paused=true;
  document.getElementById('pauseOv').classList.remove('hidden');sfx.click();
});
document.getElementById('resumeBtn').addEventListener('click',()=>{
  paused=false;document.getElementById('pauseOv').classList.add('hidden');sfx.click();
});
document.getElementById('sndBtn').addEventListener('click',function(){
  soundOn=!soundOn;this.textContent=soundOn?'🔊':'🔇';if(soundOn)sfx.click();
});
requestAnimationFrame(loop);
</script>
