<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>悬浮术</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:linear-gradient(165deg,#0b3d36 0%,#073028 45%,#041a17 100%);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;display:flex;justify-content:center;min-height:100vh;touch-action:manipulation;-webkit-user-select:none;user-select:none;overflow-x:hidden}
.wrap{width:100%;max-width:480px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:10px;position:relative;z-index:1}
.topbar{width:100%;display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:9px 12px;font-size:14px}
.topbar .title{font-weight:700;font-size:16px}
.topbar .stat{color:#c9e8dd;font-size:12px}
.topbar .stat b{color:#fff;font-size:14px}
.tbtn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:#fff;font-size:17px;min-width:42px;height:42px;border-radius:11px;cursor:pointer;transition:transform .08s}
.tbtn:active{transform:scale(.9)}
.screen{width:100%;display:none;flex-direction:column;align-items:center;gap:10px}
.screen.on{display:flex}
.card{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:20px;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.card h1{font-size:26px;margin-bottom:8px;background:linear-gradient(90deg,#a7ffeb,#4db6ac);-webkit-background-clip:text;background-clip:text;color:transparent}
.card h2{font-size:22px;margin-bottom:8px}
.card p{color:#d9efe8;font-size:14px;line-height:1.9;margin-bottom:12px;text-align:left}
.card p b{color:#80cbc4}
.bigbtn{background:linear-gradient(135deg,#26a69a,#80cbc4);border:none;color:#00332d;font-size:18px;font-weight:700;padding:14px 44px;border-radius:999px;cursor:pointer;box-shadow:0 6px 18px rgba(38,166,154,.45);transition:transform .1s;min-height:48px}
.bigbtn:active{transform:scale(.93)}
.best{color:#ffd76a;font-size:14px;margin-top:8px}
#cvwrap{width:100%;display:flex;justify-content:center}
#cv{border-radius:14px;background:rgba(255,255,255,.03);touch-action:none;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.hint{color:#c9e8dd;font-size:13px;text-align:center;line-height:1.7}
.hint b{color:#80cbc4}
#gustban{position:absolute;top:86px;left:50%;transform:translateX(-50%);background:rgba(0,60,52,.9);border:1px solid #4db6ac;color:#a7ffeb;font-size:16px;font-weight:700;padding:8px 22px;border-radius:999px;display:none;z-index:20;pointer-events:none;animation:shake .4s infinite}
@keyframes shake{0%,100%{transform:translateX(-50%)}25%{transform:translateX(calc(-50% - 3px))}75%{transform:translateX(calc(-50% + 3px))}}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:40;backdrop-filter:blur(4px)}
.ov.on{display:flex}
.pausecard{background:#0b2b26;border:1px solid rgba(128,203,196,.3);border-radius:18px;padding:28px 32px;text-align:center;display:flex;flex-direction:column;gap:12px;max-width:86vw}
.pausecard h2{font-size:20px}
.ghostbtn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#fff;font-size:14px;padding:10px 22px;border-radius:999px;cursor:pointer;min-height:44px}
.ghostbtn:active{transform:scale(.93)}
#toast{position:fixed;top:38%;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.82);border:1px solid rgba(128,203,196,.4);color:#fff;font-size:16px;font-weight:700;padding:12px 26px;border-radius:999px;z-index:70;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;max-width:92vw}
.float{position:fixed;pointer-events:none;z-index:60;font-weight:800;font-size:22px;animation:floatup 1.1s ease-out forwards;text-shadow:0 2px 6px rgba(0,0,0,.6)}
@keyframes floatup{0%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-52px)}}
</style>
</head>
<body>
<div id="toast"></div>
<div class="wrap">
  <div class="topbar">
    <span class="title">🪶 悬浮术</span>
    <span class="stat">❤️<b id="lives">3</b> · ⭐<b id="score">0</b> · ⭕<b id="passed">0</b></span>
    <span><button class="tbtn" id="sndBtn" aria-label="静音开关">🔊</button><button class="tbtn" id="pauseBtn" aria-label="暂停">⏸</button></span>
  </div>
  <div class="screen on" id="s-start">
    <div class="card">
      <h1>🪶 悬浮术</h1>
      <p>你是一名魔法学徒，正在练习让羽毛悬浮穿过光环！<br>
      👆 <b>按住屏幕</b>：羽毛向上飘<br>
      🍃 <b>松开手指</b>：羽毛缓缓下落<br>
      ⭕ 穿过<b>光环中心</b> <b>+10</b>，正中靶心 <b>+20</b>（"完美"）<br>
      💥 撞到光环边缘或飞出上下边界 → 失去 1 次机会，共 <b>3 次</b><br>
      💨 小心<b>阵风</b>！屏幕提示"阵风！"时羽毛会被吹偏</p>
      <button class="bigbtn" id="startBtn">开始练习</button>
      <div class="best">🏅 最高分：<b id="best0">0</b></div>
    </div>
  </div>
  <div class="screen" id="s-game">
    <div style="position:relative;width:100%;display:flex;justify-content:center">
      <div id="cvwrap"><canvas id="cv" width="360" height="520"></canvas></div>
      <div id="gustban">💨 阵风！</div>
    </div>
    <div class="hint">👆 按住上升 · 🍃 松开下落 · ⭕ 穿过光环中心</div>
  </div>
  <div class="screen" id="s-end">
    <div class="card">
      <h2 id="endTitle">🪶 练习结束</h2>
      <p id="endDesc" style="text-align:center"></p>
      <div class="best">🏅 最高分：<b id="best1">0</b></div>
      <button class="bigbtn" id="againBtn">再来一局</button>
    </div>
  </div>
</div>
<div class="ov" id="pauseov"><div class="pausecard"><h2>⏸ 中场休息</h2><button class="bigbtn" id="resumeBtn">继续</button><button class="ghostbtn" id="quitBtn">重开一局</button></div></div>
<script>
'use strict';
const $=id=>document.getElementById(id);
/* ===== 音效 ===== */
let AC=null;
let soundOn=localStorage.getItem('g100_mute')!=='1';
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return null;}}if(AC&&AC.state==='suspended'){AC.resume();}return AC;}
function tone(f,d,type,v,when){if(!soundOn)return;const a=ac();if(!a)return;try{const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.value=f;const t=a.currentTime+(when||0);g.gain.setValueAtTime(v||0.12,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.03);}catch(e){}}
function sweep(f0,f1,d,type,v){if(!soundOn)return;const a=ac();if(!a)return;try{const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';const t=a.currentTime;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+d);g.gain.setValueAtTime(v||0.1,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.03);}catch(e){}}
const sClick=()=>tone(640,0.07,'square',0.07);
const sScore=()=>{[880,1175].forEach((f,i)=>tone(f,0.12,'sine',0.13,i*0.07));};
const sPerfect=()=>{[659,880,1175,1568].forEach((f,i)=>tone(f,0.14,'triangle',0.13,i*0.08));};
const sHit=()=>{tone(220,0.2,'sawtooth',0.13);tone(140,0.3,'sawtooth',0.11,0.09);};
const sGust=()=>sweep(180,720,0.6,'triangle',0.09);
const sOver=()=>{[392,330,262,196].forEach((f,i)=>tone(f,0.2,'sine',0.12,i*0.14));};
/* ===== 工具 ===== */
function toast(msg){const t=$('toast');t.textContent=msg;t.style.opacity='1';clearTimeout(t._tm);t._tm=setTimeout(()=>{t.style.opacity='0';},1300);}
function floatTxt(txt,color){const d=document.createElement('div');d.className='float';d.textContent=txt;d.style.color=color||'#80cbc4';d.style.left='50%';d.style.top='30%';document.body.appendChild(d);setTimeout(()=>d.remove(),1150);}
function buzz(ms){try{if(navigator.vibrate)navigator.vibrate(ms);}catch(e){}}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));$(id).classList.add('on');}
/* ===== 状态 ===== */
const HSKEY='g100_levitate_hs';
const cv=$('cv'),ctx=cv.getContext('2d');
const W=360,H=520,FX=92;
let running=false,paused=false,holding=false;
let fy=260,vy=0,lives=3,score=0,passed=0,rings=[],parts=[];
let ringT=0,gustT=0,gustOn=0,gustPow=0,invuln=0,speed=150,time=0;
function best(){return parseInt(localStorage.getItem(HSKEY)||'0',10);}
function saveBest(){if(score>best())localStorage.setItem(HSKEY,String(score));}
function refreshBest(){$('best0').textContent=best();$('best1').textContent=best();}
function refreshHud(){$('lives').textContent=lives;$('score').textContent=score;$('passed').textContent=passed;}
function newRing(){
  const y=80+Math.random()*(H-160);
  rings.push({x:W+50,y:y,r:40,hole:18,passed:false});
}
function resetFeather(){
  fy=H/2;vy=0;invuln=1.2;
}
function loseLife(why){
  if(invuln>0)return;
  lives--;invuln=1.2;
  sHit();buzz(140);
  floatTxt('💥 失去1次机会','#ef9a9a');
  for(let i=0;i<18;i++){parts.push({x:FX+(Math.random()-0.5)*60,y:fy+(Math.random()-0.5)*60,vx:(Math.random()-0.5)*5,vy:(Math.random()-0.5)*5-1,life:1,c:['#ef9a9a','#ff8a80','#fff'][i%3],r:2+Math.random()*3});}
  resetFeather();
  refreshHud();
  if(lives<=0)endGame();
}
function startGame(){
  running=true;paused=false;holding=false;
  lives=3;score=0;passed=0;rings=[];parts=[];
  ringT=0.6;gustT=10+Math.random()*6;gustOn=0;invuln=0;speed=150;time=0;
  resetFeather();invuln=0;
  $('pauseov').classList.remove('on');$('gustban').style.display='none';
  showScreen('s-game');refreshHud();refreshBest();
  sClick();
}
function endGame(){
  running=false;paused=false;
  const nb=score>best();
  saveBest();refreshBest();
  $('endTitle').textContent=nb?'🏆 新纪录！':'🪶 练习结束';
  $('endDesc').innerHTML='穿过光环 <b>'+passed+'</b> 个<br>本局得分 <b style="color:#80cbc4;font-size:22px">'+score+'</b>';
  showScreen('s-end');$('gustban').style.display='none';
  if(nb)sPerfect();else sOver();
}
/* ===== 输入 ===== */
function pressOn(e){e.preventDefault();if(!running||paused)return;holding=true;}
function pressOff(e){if(e)e.preventDefault();holding=false;}
cv.addEventListener('pointerdown',pressOn);
window.addEventListener('pointerup',pressOff);
window.addEventListener('pointercancel',pressOff);
cv.addEventListener('contextmenu',e=>e.preventDefault());
/* ===== 绘制 ===== */
function drawFeather(){
  if(invuln>0&&Math.floor(time*12)%2===0)return; // 受伤闪烁
  ctx.save();
  ctx.translate(FX,fy);
  const tilt=Math.max(-0.6,Math.min(0.6,vy/900));
  ctx.rotate(tilt);
  const sway=Math.sin(time*7)*0.06;
  ctx.rotate(sway);
  ctx.font='44px serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('🪶',0,0);
  ctx.restore();
  // 魔法光尾
  ctx.save();
  ctx.globalAlpha=0.35;
  for(let i=1;i<=3;i++){
    ctx.fillStyle='rgba(128,203,196,'+(0.12*i)+')';
    ctx.beginPath();ctx.arc(FX-8-i*7,fy+Math.sin(time*7+i)*3,5-i,0,7);ctx.fill();
  }
  ctx.restore();
}
function drawRing(r){
  ctx.save();
  ctx.translate(r.x,r.y);
  // 外圈光晕
  const g=ctx.createRadialGradient(0,0,r.hole,0,0,r.r+8);
  g.addColorStop(0,'rgba(128,203,196,0)');
  g.addColorStop(0.55,'rgba(128,203,196,0.15)');
  g.addColorStop(0.8,'rgba(179,255,235,0.75)');
  g.addColorStop(1,'rgba(179,255,235,0)');
  ctx.fillStyle=g;
  ctx.beginPath();ctx.arc(0,0,r.r+8,0,7);ctx.fill();
  // 环带
  ctx.strokeStyle='#b2ffeb';ctx.lineWidth=9;
  ctx.beginPath();ctx.arc(0,0,(r.r+r.hole)/2,0,7);ctx.stroke();
  ctx.strokeStyle='rgba(0,105,92,.85)';ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(0,0,(r.r+r.hole)/2,0,7);ctx.stroke();
  // 靶心
  ctx.strokeStyle='rgba(255,215,106,.9)';ctx.lineWidth=2;ctx.setLineDash([5,4]);
  ctx.beginPath();ctx.arc(0,0,r.hole*0.45,0,7);ctx.stroke();ctx.setLineDash([]);
  ctx.restore();
}
function draw(dt){
  ctx.clearRect(0,0,W,H);
  // 星空魔法尘
  ctx.fillStyle='rgba(255,255,255,.5)';
  for(let i=0;i<26;i++){
    const sx=(i*97)%W,sy=(i*173)%H;
    ctx.globalAlpha=0.25+0.2*Math.sin(time*2+i);
    ctx.beginPath();ctx.arc(sx,sy,1.2,0,7);ctx.fill();
  }
  ctx.globalAlpha=1;
  // 上下边界警示
  ctx.fillStyle='rgba(239,154,154,.25)';
  ctx.fillRect(0,0,W,14);ctx.fillRect(0,H-14,W,14);
  rings.forEach(drawRing);
  drawFeather();
  // 粒子
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.08;p.life-=dt*0.9;
    if(p.life<=0){parts.splice(i,1);continue;}
    ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();ctx.globalAlpha=1;
  }
  // 阵风横线
  if(gustOn>0){
    ctx.strokeStyle='rgba(178,223,219,.5)';ctx.lineWidth=2;
    for(let i=0;i<5;i++){
      const yy=(i*107+time*500)%H;
      ctx.beginPath();ctx.moveTo(0,yy);ctx.lineTo(W,yy);ctx.stroke();
    }
  }
}
/* ===== 主循环 ===== */
let lastT=0;
function loop(t){
  requestAnimationFrame(loop);
  const dt=Math.min(0.05,(t-lastT)/1000||0);lastT=t;
  if(!running||paused){if(!running)return;draw(0);return;}
  time+=dt;
  if(invuln>0)invuln-=dt;
  // 羽毛物理：按住上升、松开下落
  if(holding){
    vy+=(-420-vy)*Math.min(1,dt*8); // 趋向稳定上升速度
  }else{
    vy+=1500*dt;
    if(vy>560)vy=560;
  }
  fy+=vy*dt;
  // 出界判定
  if(fy<16||fy>H-16){loseLife('bound');}
  // 光环生成
  ringT-=dt;
  if(ringT<=0){newRing();ringT=1.5+Math.random()*0.8;}
  // 阵风
  if(gustOn>0){
    gustOn-=dt;
    vy+=gustPow*dt;
    if(gustOn<=0){$('gustban').style.display='none';gustT=11+Math.random()*8;}
  }else{
    gustT-=dt;
    if(gustT<=0){
      gustOn=1.6;gustPow=(Math.random()<0.5?-1:1)*(260+Math.random()*160);
      $('gustban').style.display='block';sGust();buzz(40);
      toast('💨 阵风！');
    }
  }
  // 光环移动与判定
  for(let i=rings.length-1;i>=0;i--){
    const r=rings[i];
    r.x-=speed*dt;
    if(!r.passed&&r.x<=FX){
      r.passed=true;
      const dy=Math.abs(fy-r.y);
      if(dy<=r.hole*0.45){
        score+=20;passed++;
        sPerfect();buzz(60);floatTxt('完美 +20','#ffd76a');
        for(let k=0;k<24;k++){parts.push({x:r.x,y:r.y+(Math.random()-0.5)*30,vx:(Math.random()-0.5)*5,vy:(Math.random()-0.5)*5,life:1,c:['#ffd76a','#fff59d','#b2ffeb','#fff'][k%4],r:2+Math.random()*3});}
      }else if(dy<=r.hole){
        score+=10;passed++;
        sScore();
        floatTxt('+10','#80cbc4');
        for(let k=0;k<12;k++){parts.push({x:r.x,y:r.y+(Math.random()-0.5)*30,vx:(Math.random()-0.5)*4,vy:(Math.random()-0.5)*4,life:1,c:['#80cbc4','#b2ffeb','#fff'][k%3],r:2+Math.random()*2});}
      }else{
        loseLife('ring');
      }
      speed=Math.min(280,speed+3);
      refreshHud();
    }
    if(r.x<-70)rings.splice(i,1);
  }
  draw(dt);
}
requestAnimationFrame(loop);
/* ===== 暂停/静音 ===== */
$('pauseBtn').addEventListener('click',()=>{
  if(!running||paused)return;
  paused=true;$('pauseov').classList.add('on');holding=false;sClick();
});
$('resumeBtn').addEventListener('click',()=>{paused=false;$('pauseov').classList.remove('on');sClick();});
$('quitBtn').addEventListener('click',()=>{sClick();running=false;paused=false;$('pauseov').classList.remove('on');$('gustban').style.display='none';showScreen('s-start');refreshBest();});
function refreshSnd(){$('sndBtn').textContent=soundOn?'🔊':'🔇';}
$('sndBtn').addEventListener('click',()=>{soundOn=!soundOn;localStorage.setItem('g100_mute',soundOn?'0':'1');refreshSnd();if(soundOn)sClick();});
$('startBtn').addEventListener('click',startGame);
$('againBtn').addEventListener('click',startGame);
refreshSnd();refreshBest();
</script>
</body>
</html>
