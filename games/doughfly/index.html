<style>
/* 游戏自身样式只管布局与玩法元素；颜色/面板/按钮外观交给共用皮肤（sync 时注入）。 */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{display:flex;justify-content:center;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.wrap{width:100%;max-width:480px;height:100%;padding:12px;display:flex;flex-direction:column;align-items:center;gap:10px}
.topbar{width:100%;display:flex;justify-content:space-between;align-items:center}
.topbar .tools{display:flex;gap:8px}
.topbar .tools .iconbtn{min-width:44px;min-height:44px}
#cashBtn{min-width:72px;min-height:44px;font-size:14px}
#cashBtn:disabled{opacity:.4}
#cv{width:100%;max-height:calc(100svh - 170px);aspect-ratio:360/540;object-fit:contain;touch-action:none;border-radius:16px}
.hint{font-size:13px;text-align:center}
.overlay{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;z-index:20;padding:24px;text-align:center}
.overlay.hidden{display:none}
</style>
<!-- GAME UI BEGIN -->
<style>
:root{--page:#f2dfd5;--surface:#fff6ed;--soft:#e9caba;--ink:#542f29;--muted:#8b5d50;--accent:#a64a32;--on-accent:#ffffff;--line:#cfa693;--stage:#452b26;--page:#ff5f6d;--surface:#fff6ee;--soft:#ffe4d5;--ink:#5a2318;--muted:#8e5446;--accent:#735f23;--on-accent:#ffffff;--line:#ffad8a;--b-bg1:#ffb58a;--b-bg2:#ff5f6d;--b-btn:#ffd34d;--b-btn-hi:#ffe28b;--b-edge:#d98a00;--b-glow:#ffe2c4;--b-glow-rgb:255,226,196;--b-pedge-rgb:255,173,138;--b-btn-ink:#774c00;--b-btn-tsh:0 1px 0 rgba(255,255,255,.45);--b-coin-ink:#774c00;--b-coin-tsh:none;--b-key-ink:#735f23;--b-title:#935e00}
/* Shared presentation only; mechanics and state remain inside each standalone game. */
html.game-ui{background:var(--page);color:var(--ink);color-scheme:light;font-family:"Bahnschrift","Microsoft YaHei UI","PingFang SC",sans-serif}

.game-ui body{background:var(--page);color:var(--ink);font-family:inherit;overscroll-behavior:none}
.game-ui body>.wrap{padding:20px 16px max(20px,env(safe-area-inset-bottom));gap:14px;max-width:500px}
.game-ui #app{background:var(--page);color:var(--ink)}
.game-ui :is(.topbar,#topbar){gap:8px;flex-wrap:wrap;min-height:58px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:10px 12px;box-shadow:0 3px 0 var(--soft);font-size:13px}
.game-ui :is(.title,.tb-title,.tb-title,#topbar .t,.topbar .t){color:var(--ink);font-size:16px;font-weight:750;letter-spacing:0}

.game-ui :is(.dbtn,.cbtn,.gbtn,.holdbtn,.firebtn,.bombbtn,.jumpbtn,.pumpbtn,.nbtn){border-radius:12px;box-shadow:0 3px 0 var(--line);min-height:44px}
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv,.screen):has(>.ui-panel){padding:20px;overflow-y:auto;overscroll-behavior:contain}
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv):has(>.ui-panel){background:var(--page);backdrop-filter:none;justify-content:safe center;align-items:center}
.game-ui .ui-panel{width:min(100%,380px);max-height:100%;overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:18px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:24px;padding:30px 24px;box-shadow:0 8px 0 var(--soft),0 20px 48px #15253618;text-align:center;margin:auto}

.game-ui body>.wrap>canvas:not(#fx){background-color:var(--stage);box-shadow:0 0 0 1px var(--line),0 6px 0 var(--soft);border-radius:18px;flex-shrink:0}

.game-ui #hud{gap:6px;background:var(--surface);color:var(--ink)}
.game-ui #hud :is(.left,.t,.s,.grp,.pill){color:var(--ink)}
.game-ui #hud .pill{background:var(--surface);border-color:var(--line)}
.game-ui body canvas:is(#cv,#game,#board){background-color:var(--stage)}
.game-ui :is(button.dbtn,button.cbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.game-ui :is(button.lvl,button.lvlbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line);border-radius:12px;min-height:54px}
.game-ui :is(button.lvl,button.lvlbtn) :is(.nc,.sz,small){color:var(--muted)}
.game-ui .ui-panel button.lvl{margin:0;min-width:44px;box-shadow:none;padding:8px}
.game-ui #hud :is(.left,.right,.hudl,.hbtns){gap:5px;flex-wrap:wrap}
.game-ui #hud :is(.left,.hudl){min-width:0;flex-shrink:1}
.game-ui #hud :is(.pill,.left){font-size:12px}
.game-ui button:disabled{cursor:default;opacity:.45;box-shadow:none}
.game-ui .ui-panel .ui-assist-note{color:var(--accent);font-weight:700}
@media(min-width:700px){.game-ui body>.wrap{padding-top:32px}.game-ui .ui-panel{padding:36px 30px}}
@media(max-width:360px){.game-ui body>.wrap{padding:10px;gap:10px}.game-ui .ui-panel{padding:22px 18px;gap:13px}.game-ui .ui-panel h1{font-size:26px}.game-ui .ui-emblem{width:70px;height:70px;font-size:38px}.game-ui :is(.topbar,#topbar){gap:5px;padding:8px}.game-ui :is(.iconbtn,.icobtn,.ibtn,.tbtn,.ib){min-width:40px;min-height:44px}}
@media(max-height:650px){.game-ui .ui-panel{padding:18px;gap:12px}.game-ui .ui-emblem{width:60px;height:60px;font-size:32px}.game-ui .ui-panel h1{font-size:25px}.game-ui .ui-panel :is(p,.howto,.sub,.rule){font-size:13px}}

/* 2026-10-20 热修：开局/结算遮罩铺满整屏，主按钮固定在面板底部，避免被画布尺寸裁切（#10） */
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv):has(>.ui-panel){position:fixed;inset:0;z-index:1000;border-radius:0;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}

.game-ui .ui-panel :is(#startBtn,#btnStart,.startbtn,#bStart,#restartBtn,#btnRestart,#againBtn,#btnAgain,#retryBtn,#btnRetry,#playBtn,#btnPlay){position:sticky;bottom:0;z-index:3;flex-shrink:0}
.game-ui .ui-panel :not(.card,.panel,.pausecard,.ovcard,.ui-mode):has(>:is(#startBtn,#btnStart,.startbtn,#bStart,#restartBtn,#btnRestart,#againBtn,#btnAgain,#retryBtn,#btnRetry,#playBtn,#btnPlay)){position:sticky;bottom:0;z-index:3;flex-shrink:0;background:var(--surface);box-shadow:0 -10px 10px -6px var(--surface)}

      ctx.setTransform(d, 0, 0, d, 0, 0); return d;
    },
    // Lightweight particle bursts (pooled array, no allocations per frame beyond the burst).
    burst: function (list, x, y, color, n) {
      for (var i = 0; i < (n || 12); i++) { var a = Math.random() * 6.283, v = 1 + Math.random() * 2.6; list.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 1, life: 1, c: color, r: 1.5 + Math.random() * 2.5 }); }
    },
    drawBurst: function (ctx, list) {
      for (var i = list.length - 1; i >= 0; i--) {
        var p = list[i]; p.x += p.vx; p.y += p.vy; p.vy += .12; p.life -= .035;
        if (p.life <= 0) { list.splice(i, 1); continue; }
        ctx.globalAlpha = p.life; ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (skin === 'b' ? 1.2 : 1), 0, 7); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
  };
  window.GameUI.fx = fx;
}());

</script>
<!-- GAME UI END -->
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <span class="title">🫓 甩饼飞天</span>
    <span>得分 <b id="score">0</b> · 最佳 <b id="best">0</b></span>
    <span class="tools"><button class="iconbtn" id="cashBtn" aria-label="收饼结算连击加成">收饼(0)</button><button class="iconbtn" id="muteBtn" aria-label="切换音效">🔊</button><button class="iconbtn" id="pauseBtn" aria-label="暂停游戏">⏸</button></span>
  </div>
  <canvas id="cv"></canvas>
  <p class="hint">按住蓄力、松手甩饼 · 落进盘子得分 · 饼塔越高加成越大</p>
</div>
<div class="overlay" id="startScr"><h1>🫓 甩饼飞天</h1><p>按住屏幕蓄力，松手把面饼甩向右侧移动的盘子。<br>落进盘子 +10 起，连击叠饼塔：每层 +10%（上限翻倍）。<br>第 6 关起有阵风干扰，注意风向箭头；3 条命。<br>12 关：3/6/9 关解锁新饼皮；随时按「收饼」落袋为安。</p><button class="btn" id="startBtn">开始游戏</button></div>
<div class="overlay hidden" id="pauseOv"><h1>⏸ 已暂停</h1><button class="btn" id="resumeBtn">继续</button><button class="btn ghost" id="quitBtn">重新开始</button></div>
<div class="overlay hidden" id="overScr"><h1 id="overTitle">游戏结束</h1><div class="score" id="finalScore">0</div><p id="overText"></p><button class="btn" id="againBtn">再来一局</button></div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const W=360,H=540;                       // 逻辑坐标：所有玩法/命中判定都用它
const cv=$('cv'),ctx=cv.getContext('2d');
const UI=window.GameUI||{pick:(a)=>a,storageGet:k=>localStorage.getItem(k),storageSet:(k,v)=>localStorage.setItem(k,v)};
const FX=UI.fx&&UI.fx.on?UI.fx:null;     // 共用皮肤的画布立体工具；没有时走平面画法
if(FX)FX.hidpi(cv,ctx,W,H);else{cv.width=W;cv.height=H;}
// ---- 玩法常量 ----
const G=560,LX=64,LY=392,PLATE_Y=428,GY=H-20,DR=13;
const COSA=0.559,SINA=0.829;             // 甩出仰角 56°
const MAXLEVEL=12;
// ---- 状态 ----
let state='menu',score=0,lives=3,level=1,hits=0,tower=0,maxTower=0;
let charging=false,power=0,shakeT=0,respawnT=0,overT=0,win=false;
let sparks=[],floats=[],last=0,rot=0;
const dough={flying:false,x:LX,y:LY,vx:0,vy:0,rot:0,prevY:LY};
const plate={x:270,dir:1,w:62,golden:false,speed:60};
// ---- 存档 ----
let best=+UI.storageGet('g100_doughfly_hs')||0;$('best').textContent=best;
let prog={skins:[0],max:1};
try{const p=JSON.parse(UI.storageGet('g100_doughfly_prog')||'null');if(p&&Array.isArray(p.skins))prog=p;}catch(e){}
function saveProg(){UI.storageSet('g100_doughfly_prog',JSON.stringify(prog));}
const SKINS=[{c:'#f6e7c1',dot:null},{c:'#f6e7c1',dot:'#8a6b3f'},{c:'#cfe3a1',dot:'#4e7d2a'},{c:'#e8b7a0',dot:'#7a3b2e'}];
const SKIN_NAME=['原味','芝麻','葱花','豆沙'];
function skinIdx(){return Math.min(3,Math.max.apply(null,prog.skins));}
// ---- 风 ----
let baseWind=0,gustA=0,gustT=0,gustCd=0;
function newWind(){baseWind=(Math.random()*2-1)*(8+level*7);}
// ---- 音效：WebAudio 合成，无外部资源；遵守静音开关 ----
let muted=UI.storageGet('g100_doughfly_mute')==='1',ac=null;$('muteBtn').textContent=muted?'🔇':'🔊';
function tone(f,d,type){if(muted)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(.16,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d);}catch(e){}}
function sweep(f1,f2,d,type){if(muted)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f1,ac.currentTime);o.frequency.exponentialRampToValueAtTime(f2,ac.currentTime+d);g.gain.setValueAtTime(.16,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d);}catch(e){}}
$('muteBtn').addEventListener('click',()=>{muted=!muted;UI.storageSet('g100_doughfly_mute',muted?'1':'0');$('muteBtn').textContent=muted?'🔇':'🔊';});
// ---- 输入：pointer 事件 + 按画布显示尺寸换算成逻辑坐标 ----
function posOf(e){const r=cv.getBoundingClientRect();const t=(e.touches&&e.touches.length)?e.touches[0]:(e.changedTouches&&e.changedTouches.length)?e.changedTouches[0]:e;return{x:(t.clientX-r.left)*W/r.width,y:(t.clientY-r.top)*H/r.height};}
cv.addEventListener('pointerdown',e=>{if(state!=='play')return;if(dough.flying||respawnT>0)return;e.preventDefault();cv.setPointerCapture&&cv.setPointerCapture(e.pointerId);charging=true;power=0;});
function release(){if(!charging)return;charging=false;if(power<12){power=0;return;}launch();}
['pointerup','pointercancel'].forEach(t=>cv.addEventListener(t,release));
$('cashBtn').addEventListener('click',()=>{if(state!=='play'||tower<=0)return;const bonus=tower*8;score+=bonus;$('score').textContent=score;floats.push({x:plate.x,y:PLATE_Y-60,txt:'收饼 +'+bonus,t:1,c:'#ffd34d'});tower=0;syncCashBtn();tone(880,.1);setTimeout(()=>tone(1174,.14),90);});
// ---- 流程 ----
function show(id,on){$(id).classList.toggle('hidden',!on);}
function setupLevel(){const need=3+level;hits=0;plate.golden=(level===10||level===12);plate.w=plate.golden?46:62;plate.speed=(45+level*14)*(plate.golden?1.35:1);plate.x=270;plate.dir=Math.random()<.5?-1:1;newWind();return need;}
function start(){score=0;lives=3;level=1;tower=0;maxTower=0;charging=false;power=0;shakeT=0;respawnT=0;overT=0;win=false;sparks=[];floats=[];dough.flying=false;dough.x=LX;dough.y=LY;setupLevel();$('score').textContent=0;syncCashBtn();show('startScr',false);show('overScr',false);show('pauseOv',false);state='play';last=performance.now();tone(660,.12);}
function pause(){if(state!=='play')return;state='pause';show('pauseOv',true);}
function resume(){if(state!=='pause')return;state='play';last=performance.now();show('pauseOv',false);}
function over(w){state='over';win=w;if(score>best){best=score;UI.storageSet('g100_doughfly_hs',best);$('best').textContent=best;}
  $('overTitle').textContent=w?'🎉 通关！12 关全过':'游戏结束';$('finalScore').textContent=score;
  $('overText').textContent=(w?'全部通关':'到达第 '+level+' 关')+' · 最高连击 '+maxTower+' 层 · 最佳 '+best;
  show('overScr',true);if(w){tone(523,.15);setTimeout(()=>tone(659,.15),140);setTimeout(()=>tone(784,.25),280);}else sweep(300,120,.5,'sawtooth');}
$('startBtn').addEventListener('click',start);$('againBtn').addEventListener('click',start);
$('pauseBtn').addEventListener('click',()=>state==='play'?pause():resume());$('resumeBtn').addEventListener('click',resume);
$('quitBtn').addEventListener('click',()=>{show('pauseOv',false);start();});
// 切到后台自动暂停（App 切换、锁屏）
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
function syncCashBtn(){$('cashBtn').textContent='收饼('+tower+')';$('cashBtn').disabled=tower<=0;}
// ---- 发射与判定 ----
function launch(){const v=240+power/100*360;power=0;dough.flying=true;dough.x=LX;dough.y=LY;dough.prevY=LY;dough.vx=v*COSA;dough.vy=-v*SINA;dough.rot=0;gustCd=1+Math.random()*1.5;sweep(500,180,.28,'sawtooth');}
function need(){return 3+level;}
function onHit(){const mult=1+Math.min(tower,10)*0.1;const gain=Math.round(10*mult*(plate.golden?2:1));score+=gain;$('score').textContent=score;tower++;maxTower=Math.max(maxTower,tower);syncCashBtn();hits++;
  if(FX)FX.burst(sparks,dough.x,PLATE_Y-8,plate.golden?'#ffe14d':'#ffd34d',16);
  floats.push({x:dough.x,y:PLATE_Y-46,txt:'+'+gain+(plate.golden?' 金盘!':''),t:1,c:'#fff'});
  tone(plate.golden?1320:990,.09);setTimeout(()=>tone(1320,.1),70);
  dough.flying=false;respawnT=.4;dough.x=LX;dough.y=LY;
  if(hits>=need()){ // 过关
    level++;tower=0;syncCashBtn();
    if(level>MAXLEVEL){over(true);return;}
    setupLevel();
    floats.push({x:W/2,y:H/2-40,txt:'第 '+level+' 关！',t:1.4,c:'#ffd34d'});tone(1200,.15,'square');
    let ns=-1;if(level===3)ns=1;else if(level===6)ns=2;else if(level===9)ns=3;
    if(ns>0&&prog.skins.indexOf(ns)<0){prog.skins.push(ns);prog.max=Math.max(prog.max,level);saveProg();floats.push({x:W/2,y:H/2,txt:'解锁饼皮：'+SKIN_NAME[ns]+'！',t:1.8,c:'#8ef7a1'});setTimeout(()=>tone(1568,.2),200);}
    else{prog.max=Math.max(prog.max,level);saveProg();}
  }}
function onMiss(){lives--;tower=0;syncCashBtn();shakeT=.35;sweep(280,90,.4,'sawtooth');
  floats.push({x:W/2,y:H/2,txt:lives>0?'掉地了！剩 '+lives+' 条命':'',t:1,c:'#ff8a8a'});
  dough.flying=false;respawnT=.4;dough.x=LX;dough.y=LY;
  if(lives<=0){overT=.7;}}
// ---- 循环 ----
function update(dt){
  rot+=dt*2;
  // 盘子移动
  plate.x+=plate.dir*plate.speed*dt;
  if(plate.x<195+plate.w/2){plate.x=195+plate.w/2;plate.dir=1;}
  if(plate.x>340-plate.w/2){plate.x=340-plate.w/2;plate.dir=-1;}
  if(respawnT>0){respawnT-=dt;}
  if(overT>0){overT-=dt;if(overT<=0){over(false);return;}}
  if(shakeT>0)shakeT-=dt;
  if(charging){power=Math.min(100,power+dt*87);}
  if(dough.flying){
    // 第 6 关起随机阵风
    if(level>=6){gustCd-=dt;if(gustCd<=0){gustA=(Math.random()<.5?-1:1)*(50+level*10);gustT=.45;gustCd=1.2+Math.random()*1.8;}}
    if(gustT>0){gustT-=dt;if(gustT<=0)gustA=0;}
    dough.vx+=(baseWind+gustA)*dt;dough.vy+=G*dt;dough.prevY=dough.y;dough.x+=dough.vx*dt;dough.y+=dough.vy*dt;dough.rot+=dt*9;
    if(dough.vy>0&&dough.prevY<PLATE_Y&&dough.y>=PLATE_Y){
      if(Math.abs(dough.x-plate.x)<=plate.w/2){onHit();return;}
    }
    if(dough.y>=GY||dough.x>W+14||dough.x<-14||dough.y<-40){onMiss();return;}
  }
  for(const f of floats)f.t-=dt;floats=floats.filter(f=>f.t>0);
}
function drawDough(x,y,r,rotA,si){const sk=SKINS[si];
  ctx.save();ctx.translate(x,y);ctx.rotate(rotA);
  if(FX){FX.orb(ctx,0,0,r,sk.c);}else{ctx.fillStyle=sk.c;ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fill();}
  if(sk.dot){ctx.fillStyle=sk.dot;for(let i=0;i<6;i++){const a=i*1.047+rotA*.3;ctx.beginPath();ctx.arc(Math.cos(a)*r*.55,Math.sin(a)*r*.55,2.2,0,7);ctx.fill();}}
  ctx.restore();}
function draw(){
  ctx.save();
  if(shakeT>0)ctx.translate((Math.random()-.5)*10*shakeT/.35,(Math.random()-.5)*8*shakeT/.35);
  if(FX)FX.stage(ctx,W,H,'#4a2e1c','#1c1008');else{ctx.fillStyle='#2a1a10';ctx.fillRect(-20,-20,W+40,H+40);}
  // 地面
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(0,GY,W,H-GY);
  // 左侧案台
  if(FX){FX.shadow(ctx,70,LY+26,80,8);FX.tile(ctx,-10,LY+18,170,34,'#a5713f',10);}
  else{ctx.fillStyle='#a5713f';ctx.fillRect(-10,LY+18,170,34);}
  // 待发的饼（持续旋转）
  if(!dough.flying&&respawnT<=0){const pr=charging?DR+power/100*5:DR;drawDough(LX,LY,pr,rot,skinIdx());}
  // 蓄力条
  if(charging){const bx=18,by0=150,by1=400,bh=by1-by0,ph=bh*power/100;
    ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(bx-4,by0-4,20,bh+8);
    const pc=power<50?'#7CFC90':power<80?'#ffd34d':'#ff5a5a';
    ctx.fillStyle=pc;ctx.fillRect(bx,by1-ph,12,ph);
    ctx.fillStyle='#fff';ctx.font='bold 13px sans-serif';ctx.textAlign='center';ctx.fillText(Math.round(power)+'%',bx+6,by1+20);
    // 预测落点（虚线 + 落点标记，计入基础风，不计随机阵风）
    let px=LX,py=LY,pvx=(240+power/100*360)*COSA,pvy=-(240+power/100*360)*SINA,landed=false;
    ctx.fillStyle='rgba(255,255,255,.55)';
    for(let i=0;i<70&&!landed;i++){pvx+=baseWind*.04;pvy+=G*.04;px+=pvx*.04;py+=pvy*.04;
      if(i%3===0){ctx.beginPath();ctx.arc(px,py,2,0,7);ctx.fill();}
      if(pvy>0&&py>=PLATE_Y){landed=true;ctx.strokeStyle='#8ef7a1';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(px-9,py-9);ctx.lineTo(px+9,py+9);ctx.moveTo(px+9,py-9);ctx.lineTo(px-9,py+9);ctx.stroke();}
      if(py>GY||px>W+10||px<-10)landed=true;}
  }
  // 飞行中的饼
  if(dough.flying)drawDough(dough.x,dough.y,DR,dough.rot,skinIdx());
  // 盘子 + 饼塔
  if(FX)FX.shadow(ctx,plate.x,PLATE_Y+10,plate.w/2+6,5);
  const pc2=plate.golden?'#f7c948':'#e8e2d5';
  if(FX)FX.tile(ctx,plate.x-plate.w/2,PLATE_Y-6,plate.w,14,pc2,7);else{ctx.fillStyle=pc2;ctx.fillRect(plate.x-plate.w/2,PLATE_Y-6,plate.w,14);}
  if(plate.golden){ctx.fillStyle='#fff2b0';ctx.font='14px sans-serif';ctx.textAlign='center';ctx.fillText('✦',plate.x,PLATE_Y+4);}
  const tn=Math.min(tower,10);
  for(let i=0;i<tn;i++){const wy=PLATE_Y-8-i*11,ww=plate.w/2-4-i*1.5;
    if(FX)FX.tile(ctx,plate.x-ww/2,wy-6,ww,12,SKINS[skinIdx()].c,6);
    else{ctx.fillStyle=SKINS[skinIdx()].c;ctx.fillRect(plate.x-ww/2,wy-6,ww,12);}}
  if(FX)FX.drawBurst(ctx,sparks);
  // 阵风提示
  if(gustT>0){ctx.fillStyle='rgba(140,220,255,.9)';ctx.font='bold 22px sans-serif';ctx.textAlign='center';
    ctx.fillText(gustA>0?'🌬️ →→':'←← 🌬️',gustA>0?W-70:70,150);}
  // 浮动文字
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(const f of floats){ctx.globalAlpha=Math.min(1,f.t);ctx.fillStyle=f.c;ctx.font='bold 20px sans-serif';ctx.fillText(f.txt,f.x,f.y-(1-f.t)*30);}
  ctx.globalAlpha=1;
  // HUD
  ctx.fillStyle='#fff';ctx.font='bold 15px sans-serif';ctx.textAlign='left';ctx.textBaseline='top';
  ctx.fillText('第'+Math.min(level,MAXLEVEL)+'关 '+Math.min(hits,need())+'/'+need(),10,8);
  ctx.textAlign='right';ctx.fillText('❤️'.repeat(Math.max(0,lives)),W-10,8);
  ctx.textAlign='center';ctx.font='13px sans-serif';
  const wdir=baseWind>=0?'→':'←',wlv=Math.min(5,Math.round(Math.abs(baseWind)/10));
  ctx.fillText('🌬️'+wdir+' 风级'+wlv,W/2,9);
  if(plate.golden){ctx.fillStyle='#ffe14d';ctx.font='bold 13px sans-serif';ctx.fillText('金盘双倍！',W/2,28);}
  ctx.restore();
}
function frame(t){const dt=Math.min(.05,(t-last)/1000);last=t;if(state==='play')update(dt);draw();requestAnimationFrame(frame);}
syncCashBtn();draw();requestAnimationFrame(frame);
</script>
</body></html>
