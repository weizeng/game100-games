<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{display:flex;justify-content:center;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.wrap{width:100%;max-width:480px;height:100%;padding:10px 12px;display:flex;flex-direction:column;align-items:center;gap:8px}
.topbar{width:100%;display:flex;justify-content:space-between;align-items:center}

.trayrow .tbtn.sel{outline:3px solid #ff8c1a}

#tut{background:rgba(20,12,4,.82);color:#ffe9c4;border:1px solid #a3762e}
.trayrow .tbtn.sel{outline:3px solid currentColor}
.hint{font-size:13px;text-align:center;min-height:18px}

.lvgrid button{min-width:64px;min-height:48px;font-size:16px;border-radius:10px}
.lvgrid button:disabled{opacity:.35}
.stars{font-size:20px;letter-spacing:2px}
</style>
<!-- GAME UI BEGIN -->
<style>
:root{--page:#eee1c7;--surface:#fff7e7;--soft:#e5d1ab;--ink:#302d23;--muted:#70654d;--accent:#3f5b43;--on-accent:#ffffff;--line:#bea77a;--stage:#654e31;--page:#f0803c;--surface:#fff7e6;--soft:#fce3c0;--ink:#4a2a12;--muted:#7f5b3a;--accent:#246f39;--on-accent:#ffffff;--line:#f1a54f;--b-bg1:#ffcf6b;--b-bg2:#f0803c;--b-btn:#3fc163;--b-btn-hi:#82d79a;--b-edge:#22863d;--b-glow:#ffe08a;--b-glow-rgb:255,224,138;--b-pedge-rgb:241,165,79;--b-btn-ink:#124620;--b-btn-tsh:0 1px 0 rgba(255,255,255,.45);--b-coin-ink:#124620;--b-coin-tsh:none;--b-key-ink:#246f39;--b-title:#1d7234}

.game-ui .ui-panel{width:min(100%,380px);max-height:100%;overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:18px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:24px;padding:30px 24px;box-shadow:0 8px 0 var(--soft),0 20px 48px #15253618;text-align:center;margin:auto}

.game-ui body canvas:is(#cv,#game,#board){background-color:var(--stage)}
.game-ui :is(button.dbtn,button.cbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line)}

@media(max-height:650px){.game-ui .ui-panel{padding:18px;gap:12px}.game-ui .ui-emblem{width:60px;height:60px;font-size:32px}.game-ui .ui-panel h1{font-size:25px}.game-ui .ui-panel :is(p,.howto,.sub,.rule){font-size:13px}}

    glow: function (ctx, color, blur) { ctx.shadowColor = color; ctx.shadowBlur = blur; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0; },
    noGlow: function (ctx) { ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; },
    // Crisp rendering on high-DPI phones without changing game coordinates.
    // Only safe where input code converts with getBoundingClientRect + logical W/H, not cv.width.
    hidpi: function (cv, ctx, w, h) {
      var d = Math.max(1, Math.min(2.5, window.devicePixelRatio || 1));
      cv.width = Math.round(w * d); cv.height = Math.round(h * d); // intrinsic ratio stays w:h, so CSS sizing is unchanged
      ctx.setTransform(d, 0, 0, d, 0, 0); return d;
    },
    // Lightweight particle bursts (pooled array, no allocations per frame beyond the burst).
    burst: function (list, x, y, color, n) {
      for (var i = 0; i < (n || 12); i++) { var a = Math.random() * 6.283, v = 1 + Math.random() * 2.6; list.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 1, life: 1, c: color, r: 1.5 + Math.random() * 2.5 }); }
    },
    drawBurst: function (ctx, list) {
      for (var i = list.length - 1; i >= 0; i--) {
        var p = list[i]; p.x += p.vx; p.y += p.vy; p.vy += .12; p.life -= .035;
        if (p.life <= 0) { list.splice(i, 1); continue; }
        ctx.globalAlpha = p.life; ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (skin === 'b' ? 1.2 : 1), 0, 7); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
  };
  window.GameUI.fx = fx;
}());

</script>
<!-- GAME UI END -->

<script>
'use strict';
const $=id=>document.getElementById(id);
const W=360,H=500;
const cv=$('cv'),ctx=cv.getContext('2d');
const UI=window.GameUI||{pick:(a)=>a,storageGet:k=>localStorage.getItem(k),storageSet:(k,v)=>localStorage.setItem(k,v)};
const FX=UI.fx&&UI.fx.on?UI.fx:null;
if(FX)FX.hidpi(cv,ctx,W,H);else{cv.width=W;cv.height=H;}
const LEVELS=/*__LEVELS__*/[{"name":"第一铲","n":5,"start":[0,0],"dir":1,"goal":[0,4],"rocks":[],"fixed":[],"inv":{"I":3,"L":0,"Y":0},"sol":[[0,1,"I",1],[0,2,"I",1],[0,3,"I",1]],"par":3},{"name":"转弯","n":5,"start":[0,0],"dir":1,"goal":[4,4],"rocks":[],"fixed":[],"inv":{"I":5,"L":2,"Y":0},"sol":[[0,1,"I",1],[0,2,"I",1],[0,3,"L",2],[1,3,"I",0],[2,3,"I",0],[3,3,"I",0],[4,3,"L",0]],"par":7},{"name":"绕石","n":5,"start":[2,0],"dir":1,"goal":[2,4],"rocks":[[2,2]],"fixed":[],"inv":{"I":4,"L":3,"Y":0},"sol":[[2,1,"L",3],[1,1,"I",0],[0,1,"L",1],[0,2,"I",1],[0,3,"I",1],[0,4,"L",2],[1,4,"I",0]],"par":7},{"name":"石阵","n":6,"start":[0,0],"dir":1,"goal":[5,5],"rocks":[[2,2],[2,3],[3,2],[3,3]],"fixed":[],"inv":{"I":6,"L":3,"Y":0},"sol":[[0,1,"I",1],[0,2,"I",1],[0,3,"I",1],[0,4,"L",2],[1,4,"I",0],[2,4,"I",0],[3,4,"I",0],[4,4,"L",0],[4,5,"L",2]],"par":9},{"name":"扳道岔","n":6,"start":[5,0],"dir":1,"goal":[0,5],"rocks":[[2,1],[3,1]],"fixed":[],"inv":{"I":7,"L":1,"Y":1},"sol":[[5,1,"I",1],[5,2,"I",1],[5,3,"Y",1,0],[5,4,"I",1],[5,5,"L",3],[4,5,"I",0],[3,5,"I",0],[2,5,"I",0],[1,5,"I",0]],"par":9},{"name":"双岔口","n":7,"start":[2,0],"dir":1,"goal":[6,6],"rocks":[[1,5],[2,5]],"fixed":[],"inv":{"I":8,"L":2,"Y":1},"sol":[[2,1,"I",1],[2,2,"Y",1,0],[2,3,"I",1],[2,4,"L",2],[3,4,"I",0],[4,4,"I",0],[5,4,"I",0],[6,4,"L",0],[6,5,"I",1]],"par":9},{"name":"双重岔道","n":7,"start":[0,0],"dir":1,"goal":[6,6],"rocks":[[1,1],[2,1],[5,2],[1,5]],"fixed":[],"inv":{"I":8,"L":1,"Y":2},"sol":[[0,1,"I",1],[0,2,"I",1],[0,3,"Y",1,1],[1,3,"I",0],[2,3,"I",0],[3,3,"Y",2,0],[4,3,"I",0],[5,3,"I",0],[6,3,"L",0],[6,4,"I",1],[6,5,"I",1]],"par":11},{"name":"下坡道","n":8,"start":[0,0],"dir":1,"goal":[7,7],"rocks":[[2,6],[3,6],[5,6],[1,1]],"fixed":[[4,4,"I",0,2]],"inv":{"I":10,"L":2,"Y":0},"sol":[[0,1,"I",1],[0,2,"I",1],[0,3,"I",1],[0,4,"L",2],[1,4,"I",0],[2,4,"I",0],[3,4,"I",0],[5,4,"I",0],[6,4,"I",0],[7,4,"L",0],[7,5,"I",1],[7,6,"I",1]],"par":12},{"name":"陷阱坡","n":8,"start":[7,0],"dir":1,"goal":[0,7],"rocks":[[5,5],[3,5]],"fixed":[[4,6,"I",1,1]],"inv":{"I":10,"L":2,"Y":1},"sol":[[7,1,"I",1],[7,2,"I",1],[7,3,"L",3],[6,3,"I",0],[5,3,"I",0],[4,3,"Y",0,0],[3,3,"I",0],[2,3,"I",0],[1,3,"I",0],[0,3,"L",1],[0,4,"I",1],[0,5,"I",1],[0,6,"I",1]],"par":13},{"name":"穿岩","n":9,"start":[0,0],"dir":1,"goal":[8,8],"rocks":[[3,3],[3,4],[3,5],[4,3],[4,4],[4,5],[5,3],[5,4],[5,5],[1,4],[6,2]],"fixed":[[4,8,"I",0,2]],"inv":{"I":13,"L":1,"Y":1},"sol":[[0,1,"I",1],[0,2,"I",1],[0,3,"I",1],[0,4,"I",1],[0,5,"Y",1,0],[0,6,"I",1],[0,7,"I",1],[0,8,"L",2],[1,8,"I",0],[2,8,"I",0],[3,8,"I",0],[5,8,"I",0],[6,8,"I",0],[7,8,"I",0]],"par":14},{"name":"终极矿脉","n":9,"start":[8,0],"dir":1,"goal":[8,8],"rocks":[[6,5],[4,5],[7,7],[6,7],[3,1]],"fixed":[[5,3,"I",0,0]],"inv":{"I":14,"L":3,"Y":2},"sol":[[8,1,"I",1],[8,2,"L",3],[7,2,"I",0],[6,2,"I",0],[5,2,"Y",0,0],[4,2,"I",0],[3,2,"I",0],[2,2,"L",1],[2,3,"I",1],[2,4,"I",1],[2,5,"I",1],[2,6,"Y",1,0],[2,7,"I",1],[2,8,"L",2],[3,8,"I",0],[4,8,"I",0],[5,8,"I",0],[6,8,"I",0],[7,8,"I",0]],"par":19}];
// ---- 轨道逻辑（与关卡验证脚本一致） ----
const DR=[[-1,0],[0,1],[1,0],[0,-1]];
function conns(t,rot,br){
  if(t==='I')return rot%2===0?[0,2]:[1,3];
  if(t==='L')return [[0,1],[1,2],[2,3],[3,0]][((rot%4)+4)%4];
  const r=((rot%4)+4)%4,stem=[2,3,0,1][r],through=(stem+2)%4,branch=(stem+3)%4;
  return {stem,through,branch,active:br?branch:through,all:[stem,through,branch]};
}
function sim(lv,place){
  const P=new Map();
  for(const f of lv.fixed)P.set(f[0]+','+f[1],{t:f[2],rot:f[3],slope:f[4],lock:1});
  for(const k in place)P.set(k,place[k]);
  let r=lv.start[0],c=lv.start[1],d=lv.dir;
  const trace=[[r,c]],need=[];
  for(let i=0;i<400;i++){
    r+=DR[d][0];c+=DR[d][1];
    if(r<0||c<0||r>=lv.n||c>=lv.n)return{ok:false,trace,need,failAt:[r,c]};
    if(r===lv.goal[0]&&c===lv.goal[1]){trace.push([r,c]);return{ok:true,trace,need};}
    const p=P.get(r+','+c);
    if(!p)return{ok:false,trace,need,failAt:[r,c]};
    const ine=(d+2)%4;
    if(p.slope!=null){if(d!==p.slope)return{ok:false,trace,need,failAt:[r,c]};}
    else if(p.t==='Y'){const cc=conns('Y',p.rot,p.br);
      if(ine===cc.stem)d=cc.active;
      else if(ine===cc.through||ine===cc.branch)d=cc.stem;
      else return{ok:false,trace,need,failAt:[r,c]};
    }else{const cc=conns(p.t,p.rot);
      if(cc.indexOf(ine)<0)return{ok:false,trace,need,failAt:[r,c]};
      d=cc[0]===ine?cc[1]:cc[0];
    }
    trace.push([r,c]);
    if(!lv.fixed.some(f=>f[0]===r&&f[1]===c))need.push([r,c,p.t,p.rot,p.br||0]);
  }
  return{ok:false,trace,need,failAt:[r,c]};
}
// ---- 状态 ----
let state='menu',lvIdx=0,place={},inv={},sel='I',selRot={I:1,L:1,Y:1};
let runScore=0,best=0,hintsLeft=2,hintMax=2,hintCell=null,hintT=0;
let cartAnim=null,elapsed=0,lastT=0,sparks=[],shake=0,failFlash=0;
let prog={unlocked:1,stars:{},best:{},tut:{}};
try{const p=JSON.parse(UI.storageGet('g100_minetrack_prog')||'null');if(p)prog=Object.assign(prog,p);}catch(e){}
best=+UI.storageGet('g100_minetrack_hs')||0;$('best').textContent=best;
function saveProg(){UI.storageSet('g100_minetrack_prog',JSON.stringify(prog));}
function clearedCount(){return Object.keys(prog.stars).length;}
function refreshHintMax(){hintMax=Math.min(5,2+Math.floor(clearedCount()/3));}
// ---- 音效 ----
let muted=UI.storageGet('g100_minetrack_mute')==='1',ac=null;
$('muteBtn').textContent=muted?'🔇':'🔊';
function beep(f,d,type){if(muted)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(.15,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d);}catch(e){}}
$('muteBtn').addEventListener('click',()=>{muted=!muted;UI.storageSet('g100_minetrack_mute',muted?'1':'0');$('muteBtn').textContent=muted?'🔇':'🔊';});
// ---- 关卡 ----
function lv(){return LEVELS[lvIdx];}
function loadLevel(i){
lvIdx=i;place={};const L=lv();
inv={I:L.inv.I||0,L:L.inv.L||0,Y:L.inv.Y||0};
sel='I';refreshHintMax();hintsLeft=hintMax;hintCell=null;
cartAnim=null;elapsed=0;shake=0;failFlash=0;
$('lv').textContent=i+1;$('hintBtn').textContent='💡 提示×'+hintsLeft;
$('hintText').textContent='第'+(i+1)+'关·'+L.name+'：选轨道→点空格铺设 · 点已铺轨道旋转/扳岔道 · 长按拆除';
buildTray();showTut();
show('startScr',false);show('overScr',false);show('pauseOv',false);state='play';lastT=performance.now();
}
function invLeft(){return inv.I+inv.L+inv.Y;}
function usedCount(){return Object.keys(place).length;}
// ---- 教学 ----
const TUTS={
0:[['① 点下方选中，再点 3 个空格铺轨道',()=>usedCount()>=3],
['② 点已铺的轨道可以旋转方向',()=>tutFlag('rot')],
['③ 点，把矿车送进💰金矿！',()=>tutFlag('drive')]],
1:[['① 弯道让矿车转弯：先点再点空格铺设',()=>Object.keys(place).some(k=>place[k].t==='L')],
['② 点轨道旋转找对方向，然后发车！',()=>tutFlag('drive')]]
};
let tutStep=0;
function tutFlag(k){return (tutFlag.s=tutFlag.s||{})[k];}
function setTutFlag(k){(tutFlag.s=tutFlag.s||{})[k]=true;checkTut();}
function showTut(){
tutStep=0;tutFlag.s={};
const t=TUTS[lvIdx];
if(t&&!prog.tut[lvIdx]){$('tut').classList.add('show');$('tut').textContent=t[0][0];}
else $('tut').classList.remove('show');
}
function checkTut(){
const t=TUTS[lvIdx];
if(!t||prog.tut[lvIdx])return;
if(tutStep<t.length&&t[tutStep][1]()){tutStep++;
if(tutStep>=t.length){prog.tut[lvIdx]=1;saveProg();$('tut').classList.remove('show');}
else $('tut').textContent=t[tutStep][0];
}
}
// ---- 托盘 ----
const TN={I:'🛤️直道',L:'↩️弯道',Y:'🔀岔道'};
const ROTG={I:['↕','↔'],L:['◜','◞','◟','◝'],Y:['↓','←','↑','→']};
function buildTray(){
const tr=$('tray');tr.innerHTML='';
for(const t of ['I','L','Y']){
const b=document.createElement('button');b.className='tbtn'+(sel===t?' sel':'');
b.textContent=TN[t]+'×'+inv[t]+ROTG[t][selRot[t]%ROTG[t].length];
b.addEventListener('click',()=>{
if(sel===t){selRot[t]=(selRot[t]+1)%4;beep(500,.06);}
else{sel=t;beep(600,.06);}
buildTray();
});
tr.appendChild(b);
}
}
// ---- 提示 ----
$('hintBtn').addEventListener('click',()=>{
if(state!=='play')return;
if(hintsLeft<=0){beep(200,.15,'sawtooth');$('hintText').textContent='💡 提示用完了，过关补充！';return;}
const L=lv(),need=solutionNeed(L);
const bad=need.find(n=>{
const p=place[n[0]+','+n[1]];
return!p||p.t!==n[2]||p.rot!==n[3]||(p.br||0)!==(n[4]||0);
});
if(!bad){$('hintText').textContent='💡 路线看起来是对的，直接发车试试！';return;}
hintsLeft--;$('hintBtn').textContent='💡 提示×'+hintsLeft;
hintCell=[bad[0],bad[1]];hintT=performance.now();
$('hintText').textContent='💡 试试在闪烁格放'+TN[bad[2]]+'（点托盘可切换方向）';
beep(880,.12);
});
function solutionNeed(L){
const pm={};L.sol.forEach(s=>pm[s[0]+','+s[1]]={t:s[2],rot:s[3],br:s[4]||0});
return sim(L,pm).need;
}
// ---- 输入 ----
function posOf(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};}
function gridGeom(){const n=lv().n,cell=Math.floor(336/n);return{n,cell,ox:(W-cell*n)/2,oy:16};}
function cellOf(x,y){const{n,cell,ox,oy}=gridGeom();const c=Math.floor((x-ox)/cell),r=Math.floor((y-oy)/cell);return(r<0||c<0||r>=n||c>=n)?null:[r,c];}
function isRock(r,c){return lv().rocks.some(k=>k[0]===r&&k[1]===c);}
function isFixed(r,c){return lv().fixed.some(f=>f[0]===r&&f[1]===c);}
function isStartGoal(r,c){const L=lv();return(r===L.start[0]&&c===L.start[1])||(r===L.goal[0]&&c===L.goal[1]);}
let lpTimer=null,lpFired=false;
cv.addEventListener('pointerdown',e=>{
e.preventDefault();
if(state!=='play')return;
const p=posOf(e),cell=cellOf(p.x,p.y);if(!cell)return;
const[r,c]=cell,key=r+','+c;
lpFired=false;
clearTimeout(lpTimer);
lpTimer=setTimeout(()=>{
lpFired=true;
if(place[key]&&!isFixed(r,c)){const t=place[key].t;delete place[key];inv[t]++;buildTray();beep(300,.08);$('hintText').textContent='已拆除，'+TN[t]+'返还';}
},550);
try{cv.setPointerCapture&&cv.setPointerCapture(e.pointerId);}catch(err){}
});
cv.addEventListener('pointerup',e=>{
clearTimeout(lpTimer);
if(lpFired||state!=='play')return;
const p=posOf(e),cell=cellOf(p.x,p.y);if(!cell)return;
const[r,c]=cell,key=r+','+c;
if(isRock(r,c)||isFixed(r,c)||isStartGoal(r,c)){beep(180,.1,'sawtooth');return;}
const cur=place[key];
if(cur){
if(cur.t==='Y'){cur.br=(cur.br||0)^1;beep(700,.07);setTutFlag('rot');$('hintText').textContent='扳道岔：矿车将走'+(cur.br?'岔路':'直路');}
else{cur.rot=(cur.rot+1)%(cur.t==='I'?2:4);beep(700,.07);setTutFlag('rot');}
}else{
if(inv[sel]<=0){beep(200,.12,'sawtooth');$('hintText').textContent=TN[sel]+'用完了，长按已铺轨道可拆除返还';return;}
place[key]={t:sel,rot:sel==='I'?selRot[sel]%2:selRot[sel],br:0};
inv[sel]--;buildTray();beep(520,.06);checkTut();
}
});
cv.addEventListener('pointercancel',()=>clearTimeout(lpTimer));
// ---- 发车 ----
$('driveBtn').addEventListener('click',()=>{
  if(state!=='play')return;
  setTutFlag('drive');
  const L=lv(),res=sim(L,place);
  cartAnim={trace:res.trace,ok:res.ok,failAt:res.failAt,t:0,speed:3.2};
  state='drive';beep(440,.15,'square');
});
$('resetBtn').addEventListener('click',()=>{
  if(state!=='play'&&state!=='drive')return;
  const L=lv();place={};inv={I:L.inv.I||0,L:L.inv.L||0,Y:L.inv.Y||0};
  cartAnim=null;state='play';buildTray();beep(400,.08);
  $('hintText').textContent='已清空重来';
});
function driveDone(ok){
  const L=lv();
  if(ok){
    const used=usedCount(),par=L.par;
    const stars=used<=par?3:used<=par+2?2:1;
    const timeBonus=Math.max(0,240-Math.floor(elapsed)*3);
    const sc=120*(lvIdx+1)+60*invLeft()+timeBonus;
    runScore+=sc;$('score').textContent=runScore;
    if(runScore>best){best=runScore;UI.storageSet('g100_minetrack_hs',best);$('best').textContent=best;}
    prog.stars[lvIdx]=Math.max(prog.stars[lvIdx]||0,stars);
    prog.best[lvIdx]=Math.max(prog.best[lvIdx]||0,sc);
    prog.unlocked=Math.max(prog.unlocked,Math.min(LEVELS.length,lvIdx+2));
    saveProg();
    if(FX){const g=gridGeom(),gr=L.goal;FX.burst(sparks,g.ox+(gr[1]+.5)*g.cell,g.oy+(gr[0]+.5)*g.cell,'#ffd34d',26);}
    beep(660,.12);setTimeout(()=>beep(880,.15),120);
    const last=lvIdx>=LEVELS.length-1;
    $('overTitle').textContent=last?'🏆 全部通关！':'🎉 过关！';
    $('overStars').textContent='★'.repeat(stars)+'☆'.repeat(3-stars);
    $('finalScore').textContent='+'+sc;
    $('overText').textContent=(last?'总分 '+runScore+' · 最佳 '+best+' · 共 '+Object.keys(prog.stars).length+'/11 关':'用 '+used+' 块轨道（标准 '+par+'）· 总分 '+runScore);
    $('nextBtn').style.display=last?'none':'';
    state='over';show('overScr',true);
  }else{
    failFlash=1;shake=8;
    if(FX&&cartAnim){const g=gridGeom(),f=cartAnim.failAt;
      if(f)FX.burst(sparks,g.ox+(f[1]+.5)*g.cell,g.oy+(f[0]+.5)*g.cell,'#ff5a5a',20);}
    beep(160,.35,'sawtooth');
    $('hintText').textContent='💥 脱轨了！检查断开/方向错的轨道再发车';
    cartAnim=null;state='play';
  }
}
// ---- 流程 ----
function show(id,on){$(id).classList.toggle('hidden',!on);}
function startRun(){runScore=0;$('score').textContent=0;loadLevel(0);beep(660,.12);}
function pause(){if(state!=='play'&&state!=='drive')return;state='pause';buildLvGrid();show('pauseOv',true);}
function resume(){if(state!=='pause')return;state=cartAnim?'drive':'play';lastT=performance.now();show('pauseOv',false);}
function buildLvGrid(){
  const g=$('lvgrid');g.innerHTML='';
  LEVELS.forEach((L,i)=>{
    const b=document.createElement('button');
    b.textContent=(i+1)+(prog.stars[i]?'★'.repeat(prog.stars[i]):'');
    b.disabled=i>=prog.unlocked;
    b.addEventListener('click',()=>{loadLevel(i);beep(600,.08);});
    g.appendChild(b);
  });
}
$('startBtn').addEventListener('click',startRun);
$('againBtn').addEventListener('click',()=>{show('overScr',false);startRun();});
$('nextBtn').addEventListener('click',()=>{show('overScr',false);loadLevel(Math.min(LEVELS.length-1,lvIdx+1));beep(600,.08);});
$('pauseBtn').addEventListener('click',()=>state==='pause'?resume():pause());
$('resumeBtn').addEventListener('click',resume);
$('retryBtn').addEventListener('click',()=>{show('pauseOv',false);loadLevel(lvIdx);});
$('quitBtn').addEventListener('click',()=>{show('pauseOv',false);state='menu';show('startScr',true);});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')state==='pause'?resume():pause();});
// ---- 绘制 ----
function drawTrack(x,y,cell,t,rot,br,slope,dim){
  const cx=x+cell/2,cy=y+cell/2,r=cell/2,lw=Math.max(3,cell*.4);
  ctx.lineCap='round';
  const seg=(x1,y1,x2,y2,c,w)=>{ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();};
  const arcSeg=(ax,ay,a1,a2,c,w)=>{ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();ctx.arc(ax,ay,r,a1,a2,true);ctx.stroke();};
  const bed=dim?'#6b4a26':'#8a5a2b',rail=dim?'#9aa4ad':'#d7dee5';
  if(t==='I'){const v=rot%2===0;seg(v?cx:x,v?y:cy,v?cx:x+cell,v?y+cell:cy,bed,lw);seg(v?cx:x,v?y:cy,v?cx:x+cell,v?y+cell:cy,rail,lw*.38);}
  else if(t==='L'){const rr=((rot%4)+4)%4;
    const A=[[x+cell,y,Math.PI,Math.PI/2],[x+cell,y+cell,-Math.PI/2,Math.PI],[x,y+cell,0,-Math.PI/2],[x,y,Math.PI/2,0]][rr];
    arcSeg(A[0],A[1],A[2],A[3],bed,lw);arcSeg(A[0],A[1],A[2],A[3],rail,lw*.38);
  }else{const cc=conns('Y',rot,br),stem=cc.stem,thr=cc.through,brc=cc.branch,brOn=(br||0)===1;
    const ep=e=>e===0?[cx,y]:e===1?[x+cell,cy]:e===2?[cx,y+cell]:[x,cy];
    const line=(e1,e2,c,w)=>{const a=ep(e1),b=ep(e2);seg(a[0],a[1],b[0],b[1],c,w);};
    line(stem,thr,bed,lw);line(stem,thr,brOn?'#8d99a3':rail,lw*.38);
    line(stem,brc,bed,lw);line(stem,brc,brOn?rail:'#8d99a3',lw*.38);
    const te=ep(thr),be=ep(brc),dr2=Math.max(3,cell*.09);
    ctx.fillStyle=brOn?'#8d99a3':'#3fd97c';ctx.beginPath();ctx.arc(te[0],te[1],dr2,0,7);ctx.fill();
    ctx.fillStyle=brOn?'#3fd97c':'#8d99a3';ctx.beginPath();ctx.arc(be[0],be[1],dr2,0,7);ctx.fill();
  }
  if(slope!=null){const a=slope,[dx,dy]=DR[a];
    ctx.fillStyle='#ffd34d';ctx.strokeStyle='#7a4d00';ctx.lineWidth=2;
    const sx=cx+dx*cell*.1,sy=cy+dy*cell*.1,s=cell*.16;
    ctx.beginPath();
    if(a===0)ctx.moveTo(sx,sy-s),ctx.lineTo(sx-s*.8,sy+s*.6),ctx.lineTo(sx+s*.8,sy+s*.6);
    if(a===2)ctx.moveTo(sx,sy+s),ctx.lineTo(sx-s*.8,sy-s*.6),ctx.lineTo(sx+s*.8,sy-s*.6);
    if(a===1)ctx.moveTo(sx+s,sy),ctx.lineTo(sx-s*.6,sy-s*.8),ctx.lineTo(sx-s*.6,sy+s*.8);
    if(a===3)ctx.moveTo(sx-s,sy),ctx.lineTo(sx+s*.6,sy-s*.8),ctx.lineTo(sx+s*.6,sy+s*.8);
    ctx.closePath();ctx.fill();ctx.stroke();
  }
}
function draw(){
  ctx.save();
  if(shake>0){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.9;if(shake<.5)shake=0;}
  if(FX)FX.stage(ctx,W,H,'#4a2f1d','#1d1208');
  else{ctx.fillStyle='#241610';ctx.fillRect(0,0,W,H);}
  const L=lv(),g=gridGeom(),cell=g.cell;
  for(let r=0;r<L.n;r++)for(let c=0;c<L.n;c++){
    const x=g.ox+c*cell,y=g.oy+r*cell;
    if(FX)FX.tile(ctx,x+1,y+1,cell-2,cell-2,(r+c)%2?'#5a3d22':'#63452a',4);
    else{ctx.fillStyle=(r+c)%2?'#5a3d22':'#63452a';ctx.fillRect(x+1,y+1,cell-2,cell-2);}
  }
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(const k of L.rocks){const x=g.ox+k[1]*cell,y=g.oy+k[0]*cell;
    if(FX)FX.tile(ctx,x+1,y+1,cell-2,cell-2,'#6e6e78',4);
    ctx.font=(cell*.5)+'px sans-serif';ctx.fillText('🪨',x+cell/2,y+cell/2+1);}
  const[sr,sc]=L.start,[gr,gc]=L.goal;
  ctx.font=(cell*.62)+'px sans-serif';
  ctx.fillText('⛏️',g.ox+(sc+.5)*cell,g.oy+(sr+.5)*cell+1);
  ctx.fillText('💰',g.ox+(gc+.5)*cell,g.oy+(gr+.5)*cell+1);
  for(const f of L.fixed)drawTrack(g.ox+f[1]*cell,g.oy+f[0]*cell,cell,f[2],f[3],0,f[4],true);
  for(const k in place){const p=place[k],[r,c]=k.split(',').map(Number);
    drawTrack(g.ox+c*cell,g.oy+r*cell,cell,p.t,p.rot,p.br||0,undefined,false);}
  if(hintCell&&performance.now()-hintT<2500){
    const[hr,hc]=hintCell,bl=.5+.5*Math.sin(performance.now()/120);
    ctx.strokeStyle='rgba(255,220,80,'+(0.4+0.6*bl)+')';ctx.lineWidth=4;
    ctx.strokeRect(g.ox+hc*cell+2,g.oy+hr*cell+2,cell-4,cell-4);
  }
  if(cartAnim){
    const tr=cartAnim.trace,fi=Math.min(tr.length-1,Math.floor(cartAnim.t)),fr=cartAnim.t-fi;
    const a=tr[fi],b=tr[Math.min(tr.length-1,fi+1)];
    const px=g.ox+(a[1]+(b[1]-a[1])*fr+.5)*cell,py=g.oy+(a[0]+(b[0]-a[0])*fr+.5)*cell;
    if(FX)FX.shadow(ctx,px,py+cell*.22,cell*.3,4);
    ctx.font=(cell*.66)+'px sans-serif';ctx.fillText('🛒',px,py-1+Math.sin(cartAnim.t*9)*1.5);
  }
  if(FX)FX.drawBurst(ctx,sparks);
  if(failFlash>0){ctx.fillStyle='rgba(255,40,40,'+(failFlash*.25)+')';ctx.fillRect(0,0,W,H);failFlash-=.03;}
  ctx.fillStyle='#ffe9c4';ctx.font='13px sans-serif';ctx.textAlign='left';
  ctx.fillText('第'+(lvIdx+1)+'关·'+L.name+'  剩余轨道 '+(inv.I+inv.L+inv.Y),10,H-14);
  ctx.restore();
}
function frame(t){
  const dt=Math.min(.05,(t-lastT)/1000);lastT=t;
  if(state==='play')elapsed+=dt;
  if(state==='drive'&&cartAnim){
    cartAnim.t+=dt*cartAnim.speed;
    const maxT=cartAnim.ok?cartAnim.trace.length-1:traceFailT();
    if(cartAnim.t>=maxT){const ok=cartAnim.ok;cartAnim=null;state='play';driveDone(ok);}
  }
  if(state==='pause'){/* 冻结 */}
  draw();requestAnimationFrame(frame);
}
function traceFailT(){
  const tr=cartAnim.trace,f=cartAnim.failAt;
  for(let i=0;i<tr.length;i++)if(tr[i][0]===f[0]&&tr[i][1]===f[1])return i;
  return tr.length-1;
}
// ---- 关卡数据注入点 ----
draw();requestAnimationFrame(t=>{lastT=t;requestAnimationFrame(frame);});
</script>
</body></html>
