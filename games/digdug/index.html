<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>挖地</title>
<link rel="icon" href="data:,">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{display:flex;justify-content:center;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.wrap{width:100%;max-width:480px;height:100%;padding:10px 12px;display:flex;flex-direction:column;align-items:center;gap:6px}
.topbar{width:100%;display:flex;justify-content:space-between;align-items:center;flex-wrap:nowrap!important;gap:4px}
.topbar .stat{display:flex;gap:6px;align-items:center;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:12px;overflow:hidden}
.topbar .tools{display:flex;gap:4px;flex:none}
.topbar .tools .iconbtn{min-width:44px;min-height:44px;padding:0 4px}
.subbar{width:100%;display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:13px;font-weight:800;font-variant-numeric:tabular-nums}
.prog{flex:1;height:10px;border-radius:6px;background:rgba(0,0,0,.2);overflow:hidden}.prog i{display:block;height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,#ffd34d,#ff5fa2);transition:width .2s}
.stagebox{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;position:relative}
.overlay{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;z-index:20;padding:20px;text-align:center}
.overlay.hidden,.hidden{display:none!important}
.lvgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;width:100%}
.lvgrid .lvl{min-height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:16px;padding:3px!important;line-height:1.1}
.lvgrid .lvl small{font-size:10px;letter-spacing:-1px;margin-top:2px}
.lvgrid .lvl[disabled]{opacity:.45}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:100%}
.shop{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:100%}
.shop button{min-height:46px;font-size:12px!important;padding:3px!important;line-height:1.2}
.aids{width:100%;display:flex;gap:5px;justify-content:center;flex:none}
.aids button.dbtn{min-height:46px;min-width:46px;padding:4px!important;font-size:17px!important;font-weight:900}
.aids button.pump{min-height:46px;min-width:96px;flex:1;font-size:14px!important;padding:4px 8px!important;font-weight:900}
.aids.dig-ctrl{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:2px 4px 6px;touch-action:none}
.aids.dig-ctrl .dpad{display:grid;grid-template-areas:". up ." "left mid right" ". down .";grid-template-columns:58px 58px 58px;grid-template-rows:58px 58px 58px;gap:3px;flex:none}
.aids.dig-ctrl .dbtn{min-width:58px;min-height:58px;font-size:22px!important;border-radius:16px}
.aids.dig-ctrl .dbtn#btnUp{grid-area:up}.aids.dig-ctrl .dbtn#btnLeft{grid-area:left}
.aids.dig-ctrl .dbtn#btnRight{grid-area:right}.aids.dig-ctrl .dbtn#btnDown{grid-area:down}
.aids.dig-ctrl .pump{flex:none;min-width:112px;min-height:112px;border-radius:50%!important;font-size:16px!important;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;padding:8px!important}
#tutStep{font-size:12px;opacity:.75}
#tutPic{font-size:44px;line-height:1.1}
#overStars{font-size:30px;letter-spacing:4px;min-height:34px}
#toast{position:fixed;left:50%;top:15%;transform:translate(-50%,-10px);background:rgba(10,8,30,.9);color:#fff;font-weight:800;padding:10px 18px;border-radius:999px;z-index:999;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;font-size:15px;box-shadow:0 0 18px rgba(255,204,41,.5);white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
.lvTag{font-size:12px;opacity:.85}
#cv{display:block;touch-action:none;max-width:100%;max-height:100%}
.hint{font-size:12px;opacity:.85;text-align:center;flex:none}
</style>
<!-- GAME UI BEGIN -->
<style>
:root{--page:#dcece5;--surface:#f5fff9;--soft:#c8dfd2;--ink:#203f35;--muted:#4d7263;--accent:#28654e;--on-accent:#ffffff;--line:#a1c5b4;--stage:#102f2b;--page:#c4e6d4;--surface:#fafefc;--soft:#ebf6f1;--ink:#143625;--muted:#456b58;--accent:#177a4d;--on-accent:#062919;--line:#8fc6aa;--b-bg1:#e4f4eb;--b-bg2:#c4e6d4;--b-btn:#1e9e64;--b-btn-hi:#54b589;--b-edge:#116b42;--b-glow:#b9f0d2;--b-glow-rgb:185,240,210;--b-pedge-rgb:143,198,170;--b-btn-rgb:30,158,100;--b-bg2-rgb:196,230,212;--b-surf-rgb:250,254,252;--b-btn-ink:#062919;--b-btn-tsh:0 1px 0 rgba(255,255,255,.35);--b-coin-ink:#062919;--b-coin-tsh:none;--b-key-ink:#143625;--b-title:#143625;--b-hint-ink:#143625}
/* Shared presentation only; mechanics and state remain inside each standalone game. */
html.game-ui{background:var(--page);color:var(--ink);color-scheme:light;font-family:"HarmonyOS Sans SC","MiSans","OPPOSans","PingFang SC","Microsoft YaHei UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
html.game-ui:is([data-theme="space"],[data-theme="arcade"],[data-theme="lab"],[data-theme="ocean"],[data-theme="magic"]){color-scheme:dark}
.game-ui body{background:var(--page);color:var(--ink);font-family:inherit;overscroll-behavior:none}
.game-ui body>.wrap{padding:14px 14px max(14px,env(safe-area-inset-bottom));gap:10px;max-width:500px}
.game-ui #app{background:var(--page);color:var(--ink)}
.game-ui :is(.topbar,#topbar){gap:8px;flex-wrap:wrap;min-height:54px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:8px 12px;box-shadow:0 4px 12px rgba(0,0,0,.06);font-size:13px}
.game-ui :is(.title,.tb-title,#topbar .t,.topbar .t){color:var(--ink);font-size:16px;font-weight:800;letter-spacing:-.2px}
.game-ui :is(.topbar,.hud,#hud,#topbar) :is(b,.v){color:var(--accent);font-variant-numeric:tabular-nums}
.game-ui :is(.stat,.topbar .s,.topbar .stat,.scorebar,.stats,.tip,.hint,.hintline,.hsline,.best,.hiscore){color:var(--muted);line-height:1.6}
.game-ui :is(.hint,.hintline,.tip){font-size:12px;max-width:40em;text-wrap:pretty}
.game-ui .scorebar{padding:6px 10px;gap:8px;flex-wrap:wrap}
.game-ui :is(.iconbtn,.iconBtn,.icobtn,.ibtn,.tbtn,.hbtn,.ib,.pause){min-width:44px;min-height:44px;flex-shrink:0;border-radius:12px;background:var(--soft);color:var(--ink);border:1px solid var(--line);box-shadow:none;font-size:16px}
.game-ui button{font-family:inherit;cursor:pointer;touch-action:manipulation}
.game-ui button:focus-visible,.game-ui [tabindex]:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
.game-ui :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn){background:var(--accent);color:var(--on-accent);border:1px solid transparent;border-radius:14px;min-height:48px;padding:12px 26px;font-size:16px;font-weight:800;letter-spacing:.2px;box-shadow:0 3px 0 var(--line);text-shadow:none;max-width:100%}
.game-ui :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn):active{box-shadow:none;transform:translateY(2px)}
.game-ui :is(.ghost,.ghostbtn,.btn2,.abtn,.toolbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line);box-shadow:none;border-radius:12px;min-height:44px}
.game-ui :is(.rowbtns,.btnrow,.ctlrow){gap:8px;flex-wrap:wrap;justify-content:center}
.game-ui :is(.pill,.hudbox,.hud .p){background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:999px;box-shadow:none;font-variant-numeric:tabular-nums}
.game-ui :is(.dbtn,.cbtn,.gbtn,.holdbtn,.firebtn,.bombbtn,.jumpbtn,.pumpbtn,.nbtn){border-radius:12px;box-shadow:0 2px 0 var(--line);min-height:44px}
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv,.screen):has(>.ui-panel){padding:16px;overflow-y:auto;overscroll-behavior:contain}
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv):has(>.ui-panel){background:var(--page);justify-content:safe center;align-items:center}
.game-ui .ui-panel{width:min(100%,372px);max-height:100%;overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:14px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:26px;padding:26px 22px;box-shadow:0 20px 44px rgba(15,25,40,.16);text-align:center;margin:auto}
.game-ui .ui-panel :is(.card,.panel,.pausecard,.ovcard){display:contents}
.game-ui .ui-panel :is(h1,h2,.gamename,.gametitle){font-size:27px;line-height:1.25;font-weight:850;color:var(--ink);background:none;-webkit-text-fill-color:currentColor;text-shadow:none;letter-spacing:-.4px;margin:0}
.game-ui .ui-panel :is(p,.howto,.sub,.rule){font-size:13.5px;line-height:1.7;color:var(--muted);background:none;border:0;box-shadow:none;padding:0;margin:0;max-width:30em;text-align:center;white-space:normal}
.game-ui .ui-panel :is(.bigemoji,.ic,.big):not(.bigscore){animation:none;filter:none;text-shadow:none}
.game-ui .ui-emblem{width:80px;height:80px;display:grid;place-items:center;border:1px solid var(--line);border-radius:24px;background:var(--soft);font-size:42px;line-height:1;flex-shrink:0;position:relative}
.game-ui[data-theme="wood"] .ui-panel h1{letter-spacing:1px}
.game-ui .ui-panel :is(.score,.bigscore,.bigScore,.scorebig){color:var(--accent);font-size:48px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.1}
.game-ui .ui-panel :is(.best,.hsline,.hiscore,.endstats,.endstats b){color:var(--muted);font-size:13px;line-height:1.6}
.game-ui .ui-mode{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--soft);padding:4px;border:1px solid var(--line);border-radius:14px;width:100%}
.game-ui .ui-mode button{min-height:44px;border:0;border-radius:10px;background:transparent;color:var(--muted);font-size:13.5px;font-weight:750;box-shadow:none}
.game-ui .ui-mode button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 2px 6px rgba(15,25,40,.12)}
.game-ui .ui-panel .ui-mode-note{font-size:12px;line-height:1.5;text-align:center;color:var(--muted)}
.game-ui .ui-mode-status{display:block;padding:8px 14px;color:var(--ink);font-size:12.5px;font-weight:700;line-height:1.45;text-align:center;border:1px solid var(--line);border-radius:999px;background:var(--surface);margin:4px auto;max-width:min(360px,92vw);pointer-events:none;box-shadow:0 10px 26px rgba(0,0,0,.22)}
.game-ui body>.wrap>canvas:not(#fx){background-color:var(--stage);box-shadow:0 0 0 1px var(--line),0 12px 28px rgba(0,0,0,.14);border-radius:18px;flex-shrink:0}
.game-ui .screen>canvas.game{box-shadow:0 0 0 1px var(--line),0 12px 28px rgba(0,0,0,.14)}
.game-ui #hud{gap:6px;background:var(--surface);color:var(--ink)}
.game-ui #hud :is(.left,.t,.s,.grp,.pill){color:var(--ink)}
.game-ui #hud .pill{background:var(--surface);border-color:var(--line)}
.game-ui body canvas:is(#cv,#game,#board){background-color:var(--stage)}
.game-ui :is(button.dbtn,button.cbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.game-ui :is(button.lvl,button.lvlbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line);border-radius:12px;min-height:50px}
.game-ui :is(button.lvl,button.lvlbtn) :is(.nc,.sz,small){color:var(--muted)}
.game-ui .ui-panel button.lvl{margin:0;min-width:44px;box-shadow:none;padding:6px}
.game-ui #hud :is(.left,.right,.hudl,.hbtns){gap:5px;flex-wrap:wrap}
.game-ui #hud :is(.left,.hudl){min-width:0;flex-shrink:1}
.game-ui #hud :is(.pill,.left){font-size:12px}
.game-ui button:disabled{cursor:default;opacity:.42;box-shadow:none}
.game-ui .ui-panel .ui-assist-note{color:var(--accent);font-weight:700}
@media(min-width:700px){.game-ui body>.wrap{padding-top:24px}.game-ui .ui-panel{padding:32px 28px}}
@media(max-width:360px){.game-ui body>.wrap{padding:8px 10px;gap:8px}.game-ui .ui-panel{padding:20px 16px;gap:11px}.game-ui .ui-panel h1{font-size:24px}.game-ui .ui-emblem{width:68px;height:68px;font-size:36px;border-radius:20px}.game-ui :is(.topbar,#topbar){gap:5px;padding:6px 10px}.game-ui :is(.iconbtn,.icobtn,.ibtn,.tbtn,.ib){min-width:44px;min-height:44px}}
@media(max-height:650px){.game-ui .ui-panel{padding:16px 16px;gap:10px}.game-ui .ui-emblem{width:58px;height:58px;font-size:30px;border-radius:18px}.game-ui .ui-panel h1{font-size:23px}.game-ui .ui-panel :is(p,.howto,.sub,.rule){font-size:12.5px;line-height:1.55}}
@media(prefers-reduced-motion:reduce){.game-ui *, .game-ui *::before,.game-ui *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
/* 开局/结算遮罩铺满整屏，主按钮固定在面板底部，避免被画布尺寸裁切 */
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv):has(>.ui-panel){position:fixed;inset:0;z-index:1000;border-radius:0;padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom))}
.game-ui .ui-panel{touch-action:pan-y}
.game-ui .ui-panel :is(#startBtn,#btnStart,.startbtn,#bStart,#restartBtn,#btnRestart,#againBtn,#btnAgain,#retryBtn,#btnRetry,#playBtn,#btnPlay){position:sticky;bottom:0;z-index:3;flex-shrink:0}
.game-ui .ui-panel :not(.card,.panel,.pausecard,.ovcard,.ui-mode):has(>:is(#startBtn,#btnStart,.startbtn,#bStart,#restartBtn,#btnRestart,#againBtn,#btnAgain,#retryBtn,#btnRetry,#playBtn,#btnPlay)){position:sticky;bottom:0;z-index:3;flex-shrink:0;background:var(--surface);box-shadow:0 -10px 10px -6px var(--surface)}

html[data-game="digdug"] :is(.controls,.pad){background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:12px;width:100%;justify-content:space-around}html[data-game="digdug"] .dbtn{background:var(--soft);color:var(--ink);border:1px solid var(--line)}

/* ===== 精工流光 Crafted Arcade (Skin B v2) ===== clean modern mobile arcade depth, refined palettes, studio rim-light, crisp legibility */
html.game-ui[data-skin="b"]{--fb:"HarmonyOS Sans SC","MiSans","OPPOSans","vivo Sans","Noto Sans SC","Noto Sans CJK SC","PingFang SC","Microsoft YaHei UI",system-ui,sans-serif;--ease:cubic-bezier(.22,1,.36,1);--bounce:cubic-bezier(.34,1.35,.64,1);--bg:radial-gradient(120% 55% at 15% 0%,rgba(255,255,255,.55) 0,transparent 60%),radial-gradient(100% 50% at 90% 100%,rgba(var(--b-btn-rgb),.12) 0,transparent 65%),linear-gradient(170deg,var(--b-bg1),var(--b-bg2));font-family:var(--fb)}
html.game-ui[data-skin="b"],html.game-ui[data-skin="b"] body,html.game-ui[data-skin="b"] #app{background:var(--bg);background-color:var(--b-bg2)}
html.game-ui[data-skin="b"] :is(.overlay,.ov,#ov,#overlay,#pauseOv):has(>.ui-panel){background:rgba(var(--b-bg2-rgb),.86);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
html.game-ui[data-skin="b"] body{min-height:100vh;font-family:var(--fb)}
html.game-ui[data-skin="b"] :is(.hint,.hintline,.tip){color:var(--b-hint-ink);font-weight:600;text-shadow:none;opacity:.88}
/* Elevated ceramic panel: hairline rim + layered soft studio shadow */
html.game-ui[data-skin="b"] .ui-panel{background:linear-gradient(180deg,var(--surface),var(--soft) 140%);border:1px solid rgba(255,255,255,.85);border-radius:28px;box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 2px 6px rgba(15,25,40,.06),0 22px 48px -12px rgba(15,25,40,.22);animation:uiB-in .36s var(--ease) both}
html.game-ui[data-skin="b"] .ui-panel :is(h1,h2,.gamename,.gametitle){font-size:28px;font-weight:900;color:var(--b-title);letter-spacing:-.4px;text-shadow:none}
html.game-ui[data-skin="b"] .ui-emblem{width:84px;height:84px;border:1.5px solid rgba(255,255,255,.9);border-radius:24px;background:radial-gradient(90% 75% at 30% 18%,rgba(255,255,255,.92),rgba(255,255,255,0) 60%),linear-gradient(155deg,var(--b-glow),var(--b-btn) 145%);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),inset 0 -3px 8px rgba(0,0,0,.1),0 14px 28px -8px rgba(var(--b-btn-rgb),.42),0 4px 10px rgba(15,25,40,.1);font-size:44px;animation:uiB-float 3.8s ease-in-out infinite}
html.game-ui[data-skin="b"] .ui-panel :is(.score,.bigscore,.bigScore,.scorebig,#finalScore){font-size:52px;font-weight:900;color:var(--b-btn);-webkit-text-fill-color:currentColor;text-shadow:0 4px 14px rgba(var(--b-btn-rgb),.28);letter-spacing:-1px}
html.game-ui[data-skin="b"] .ui-panel :is(h1,.gamename)~h2{font-size:18px;text-shadow:none}
/* Primary CTA: sleek tactile studio button */
html.game-ui[data-skin="b"] :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn,button.actBtn):not(.ghost){position:relative}
html.game-ui[data-skin="b"] :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn,button.actBtn):not(.ghost):not(#\#){overflow:hidden;border:0;border-radius:16px;font-weight:850;color:var(--b-btn-ink);background:linear-gradient(180deg,var(--b-btn-hi),var(--b-btn) 58%);text-shadow:var(--b-btn-tsh);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.45),inset 0 -2px 0 rgba(0,0,0,.12),0 3px 0 var(--b-edge),0 12px 22px -6px rgba(var(--b-btn-rgb),.48);transition:transform .1s var(--ease),box-shadow .1s var(--ease),filter .15s}
html.game-ui[data-skin="b"] :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn,button.actBtn):not(.ghost):not(#\#):active{transform:translateY(2.5px) scale(.985);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.35),0 1px 0 var(--b-edge),0 4px 10px -4px rgba(var(--b-btn-rgb),.4)}
html.game-ui[data-skin="b"] .ui-panel :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn,button.actBtn):not(.ghost):not(#\#){min-height:52px;padding:13px 32px;font-size:17px;letter-spacing:.6px;width:min(100%,260px)}
html.game-ui[data-skin="b"] .ui-panel .rowbtns :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn,button.actBtn):not(.ghost):not(#\#){width:auto;min-width:118px;padding:12px 22px;font-size:15px}
/* Secondary & tactile keys */
html.game-ui[data-skin="b"] :is(.ghost,.ghostbtn,.btn2,.abtn,.toolbtn,.iconbtn,.iconBtn,.icobtn,.ibtn,.tbtn,.hbtn,.ib,.pause,.dbtn,.cbtn,.nbtn,.lvl,.lvlbtn,.dpad button,.pad button){border:1px solid rgba(var(--b-pedge-rgb),.55);border-radius:14px;background:linear-gradient(180deg,#ffffff,var(--soft));color:var(--b-key-ink);font-weight:800;box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 2px 0 rgba(var(--b-pedge-rgb),.45),0 4px 10px rgba(15,25,40,.08);transition:transform .09s var(--ease),box-shadow .09s var(--ease)}
html.game-ui[data-skin="b"] :is(.ghost,.ghostbtn,.btn2,.abtn,.toolbtn,.iconbtn,.iconBtn,.icobtn,.ibtn,.tbtn,.hbtn,.ib,.pause,.dbtn,.cbtn,.nbtn,.lvl,.lvlbtn,.dpad button,.pad button):active{transform:translateY(2px) scale(.97);box-shadow:0 1px 2px rgba(15,25,40,.1)}

html.game-ui[data-skin="b"] .ui-mode button[aria-pressed="true"]{background:#ffffff;color:var(--b-key-ink);box-shadow:0 2px 6px rgba(15,25,40,.12)}
html.game-ui[data-skin="b"] .ui-quick-lvl{min-height:46px;padding:10px 20px;font-size:13.5px;font-weight:750;border-radius:13px;width:min(100%,260px)}

<script>
'use strict';
/* ===== 关卡/教程/存档/音效 通用套件（单文件内联） ===== */
const UI=window.GameUI||{pick:a=>a,storageGet:k=>localStorage.getItem(k),storageSet:(k,v)=>localStorage.setItem(k,v)};

    g.gain.setValueAtTime(vol||.13,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d+.02);}catch(e){}}

    case 'good':tone(660,.08,'sine');tone(990,.1,'sine',.1,0,.06);break;
    case 'combo':tone(500+Math.min(12,x||1)*70,.12,'square',.07);break;
    case 'bad':tone(220,.22,'sawtooth',.1,110);break;

    case 'coin':tone(1200,.07,'sine',.09);tone(1600,.09,'sine',.08,0,.06);break;

    case 'win':[523,659,784,1046].forEach((f,i)=>tone(f,.18,'triangle',.12,0,i*.11));break;
    case 'lose':[392,330,262,196].forEach((f,i)=>tone(f,.22,'sawtooth',.08,0,i*.13));break;

  let tt=0;K.toast=function(msg,ms){const t=$('toast');t.textContent=msg;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),ms||1300);};
  K.vibrate=function(ms){try{if(window.NativeBridge&&window.NativeBridge.vibrate)window.NativeBridge.vibrate(ms);else if(navigator.vibrate)navigator.vibrate(ms);}catch(e){}};

  K.unlocked=i=>i===0||(P.stars[i-1]||0)>0;

  function renderLevels(){
    const g=$('lvgrid');g.innerHTML='';
    for(let i=0;i<cfg.levels;i++){const b=document.createElement('button');b.className='lvl';const ok=K.unlocked(i);
      const lab=cfg.label?cfg.label(i):String(i+1);
      b.innerHTML=(ok?(K.isBoss(i)?'👑':'')+lab:'🔒')+'<small>'+(ok?stars(P.stars[i]||0):'&nbsp;')+'</small>';
      if(!ok)b.disabled=true;b.addEventListener('click',()=>{K.sfx('tap');go(i);});g.appendChild(b);}
    $('lvlInfo').textContent='⭐ '+K.totalStars()+'/'+cfg.levels*3+'   💰 '+P.coins+(K.hs()?'   🏆 '+K.hs():'');

    const s=$('shop');s.innerHTML='';

      b.innerHTML=u.ic+' '+u.name+' '+lv+'/'+max+'<br>'+(lv>=max?'已满级':need?'🔒 需 ⭐'+u.stars:'💰'+cost+' · '+u.desc);

    if(K.isBoss(i))setTimeout(()=>{K.sfx('boss');K.toast('👑 首领关：'+(cfg.bossName?cfg.bossName(i):'强敌来袭'),1800);},60);

  K.pause=function(){if(K.state!=='play')return;K.state='pause';cfg.pause&&cfg.pause();$('pauseInfo').textContent=(cfg.label?'第 '+cfg.label(K.lv):'第 '+(K.lv+1))+' 关'+(K.isBoss(K.lv)?' · 首领关':'');show('pauseOv',true);};

  K.win=function(st,score,text){if(K.state!=='play')return;K.state='over';st=Math.max(1,Math.min(3,st|0));const i=K.lv;
    const old=P.stars[i]||0,gain=st*4+(old?0:6)+(K.isBoss(i)?8:0)+(cfg.coinBonus?cfg.coinBonus(i,st,score):0);P.coins+=gain;
    if(st>old)P.stars[i]=st;if((score||0)>(P.best[i]||0))P.best[i]=score;
    const tot=P.best.reduce((a,b)=>a+(b||0),0);if(tot>K.hs())UI.storageSet(key('hs'),tot);save();
    $('overH').textContent=K.isBoss(i)?'👑 首领爆破！':'🎉 地底肃清！';$('overStars').textContent=stars(st);$('finalScore').textContent=score||0;

    const hasNext=i+1<cfg.levels;$('nextBtn').classList.toggle('hidden',!hasNext);if(hasNext)$('nextBtn').textContent=K.isBoss(i+1)?'👑 挑战首领':'下一关';

const COLS=12,ROWS=13,T=30,W=COLS*T,H=ROWS*T;
const cv=$('cv'),ctx=cv.getContext('2d');if(FX)FX.hidpi(cv,ctx,W,H);else{cv.width=W;cv.height=H;}
const DIRS={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};

// 15 关手工配置：pooka 大眼怪🍅数量、fygar 喷火龙🦖数量、rocks 巨石🪨数量、spd 怪物步进间隔(秒)、gems 宝石目标、boss 首领配置
const LV=[
  {pooka:2,fygar:0,rocks:2,spd:0.46,gems:2},
  {pooka:2,fygar:1,rocks:2,spd:0.44,gems:2},
  {pooka:3,fygar:1,rocks:3,spd:0.42,gems:3},
  {pooka:2,fygar:2,rocks:3,spd:0.40,gems:3},
  {boss:{name:'地底巨岩怪',ic:'🗿',hp:6,pooka:2,fygar:1,rocks:4,spd:0.40,gems:3,type:'rock'}},
  {pooka:3,fygar:2,rocks:3,spd:0.38,gems:3},
  {pooka:3,fygar:2,rocks:4,spd:0.37,gems:4},
  {pooka:4,fygar:2,rocks:4,spd:0.36,gems:4},
  {pooka:3,fygar:3,rocks:4,spd:0.35,gems:4},
  {boss:{name:'熔岩喷火龙王',ic:'🐉',hp:8,pooka:2,fygar:2,rocks:4,spd:0.35,gems:4,type:'fire'}},
  {pooka:4,fygar:3,rocks:4,spd:0.34,gems:4},
  {pooka:4,fygar:3,rocks:5,spd:0.33,gems:5},
  {pooka:5,fygar:3,rocks:5,spd:0.32,gems:5},
  {pooka:4,fygar:4,rocks:5,spd:0.31,gems:5},
  {boss:{name:'深渊钻头领主',ic:'🤖',hp:10,pooka:3,fygar:2,rocks:5,spd:0.30,gems:5,type:'drill'}}
];

const LAYER_COLORS=['#2e7d32','#8d6e63','#c66900','#6d4c41','#37474f'];
function soilColor(r){
  if(r<=0)return '#1b5e20';
  if(r<=3)return LAYER_COLORS[1];
  if(r<=6)return LAYER_COLORS[2];
  if(r<=9)return LAYER_COLORS[3];
  return LAYER_COLORS[4];
}

let L,cfgL,dirt,rocks,monsters,items,fires,sparks,floats,player,bossUnit;
let lives,score,ended,raf=0,last=0,fast=1,shakeT=0,totalTargets=0,clearedTargets=0;
let keys={up:false,down:false,left:false,right:false},targetCell=null,hoseT=0,hoseTarget=null,hoseLen=0;

function inB(c,r){return c>=0&&r>=0&&c<COLS&&r<ROWS;}
function hasRockAt(c,r){return rocks.some(rk=>rk.alive&&Math.round(rk.c)===c&&Math.round(rk.r)===r&&rk.state!=='falling');}
function addFloat(x,y,txt,color){floats.push({x,y,txt,t:0,color:color||'#ffd54f'});}

function buildLevel(idx){
  dirt=[];
  for(let r=0;r<ROWS;r++){
    const row=[];
    for(let c=0;c<COLS;c++)row.push(r>0); // r=0 为地表草地通道
    dirt.push(row);
  }
  // 中央竖井初始通道 (c=5, r=0..2)
  dirt[0][5]=false;dirt[1][5]=false;dirt[2][5]=false;

  rocks=[];monsters=[];items=[];fires=[];sparks=[];floats=[];bossUnit=null;
  const b=cfgL;
  const used=new Set(['5,0','5,1','5,2','5,3']);

  // 生成预设洞穴与怪物
  const monList=[];
  const pCount=b.pooka+(UI.expert?1:0);
  const fCount=b.fygar;
  for(let i=0;i<pCount;i++)monList.push('pooka');
  for(let i=0;i<fCount;i++)monList.push('fygar');

  for(let i=0;i<monList.length;i++){
    const r=3+((i*3+idx*2)%(ROWS-4));
    const c=1+((i*5+idx*3+2)%(COLS-2));
    const k=c+','+r;
    used.add(k);
    // 挖出一个3格小洞穴供怪物巡逻
    dirt[r][c]=false;
    if(c+1<COLS-1){dirt[r][c+1]=false;used.add((c+1)+','+r);}
    if(c-1>=1){dirt[r][c-1]=false;used.add((c-1)+','+r);}
    monsters.push({
      kind:monList[i],c,r,dir:i%2===0?'left':'right',
      air:0,deflateT:0,alive:true,moveT:0.2+(i%3)*0.12,
      ghost:false,ghostT:3.5+i*1.2,fireT:2.2+(i%2)*1.1
    });
  }

  // 生成巨石🪨（保证下方一格有土）
  for(let i=0;i<b.rocks;i++){
    let rc=1+((i*4+idx*3+1)%(COLS-2));
    let rr=2+((i*2+idx)%(ROWS-5));
    if(used.has(rc+','+rr)){rc=(rc+2)%(COLS-2)+1;}
    used.add(rc+','+rr);
    dirt[rr][rc]=true;
    if(rr+1<ROWS)dirt[rr+1][rc]=true;
    rocks.push({c:rc,r:rr,state:'idle',wobbleT:0,vy:0,crushed:0,alive:true});
  }

  // 生成地底宝石与胡萝卜奖励
  const gemIcons=['💎','🥕','🍄','👑'];
  for(let i=0;i<b.gems;i++){
    const gc=1+((i*5+idx*4+3)%(COLS-2));
    const gr=3+((i*3+idx+1)%(ROWS-4));
    items.push({c:gc,r:gr,ic:gemIcons[(i+idx)%gemIcons.length],val:80+i*40,taken:false});
  }

  // 首领生成
  if(L.boss){
    const br=ROWS-3,bc=Math.floor(COLS/2);
    for(let dc=-2;dc<=2;dc++)for(let dr=-1;dr<=1;dr++){
      if(inB(bc+dc,br+dr))dirt[br+dr][bc+dc]=false;
    }
    bossUnit={
      name:L.boss.name,ic:L.boss.ic,type:L.boss.type,
      c:bc,r:br,hp:L.boss.hp,maxHp:L.boss.hp,
      air:0,deflateT:0,moveT:0.5,skillT:2.8,dir:'left',alive:true
    };
  }

  totalTargets=monsters.length+(bossUnit?bossUnit.maxHp:0);
  clearedTargets=0;
}

function start(i){
  L=LV[i];cfgL=L.boss||L;score=0;ended=false;shakeT=0;
  lives=UI.pick(3,2)+Kit.up('life');
  buildLevel(i);
  player={c:5,r:1,face:'down',moveT:0,invuln:Kit.up('life')>0?2.0:0.8,alive:true,dugCount:0};
  targetCell=null;hoseT=0;hoseTarget=null;hoseLen=0;
  keys={up:false,down:false,left:false,right:false};
  hud();last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(frame);
}

function checkWin(){
  const mAlive=monsters.some(m=>m.alive);
  const bAlive=bossUnit&&bossUnit.alive&&bossUnit.hp>0;
  if(!mAlive&&!bAlive){
    score+=lives*60;
    hud();endLv(true);
    return true;
  }
  return false;
}

function hitPlayer(reason){
  if(ended||!player.alive||player.invuln>0)return;
  lives--;player.invuln=2.2;shakeT=0.35;
  Kit.sfx('bad');Kit.vibrate(90);
  if(FX)FX.burst(sparks,player.c*T+T/2,player.r*T+T/2,'#ff5252',16);
  addFloat(player.c*T+T/2,player.r*T,'💥-1命','#ff5252');
  hud();
  if(lives<=0){
    player.alive=false;
    endLv(false,reason||'矿工在地下遇险');
  }
}

function pumpAction(){
  if(Kit.state!=='play'||ended||!player.alive)return;
  const maxRange=3+Kit.up('pump');
  // 优先检测面朝方向或四向最近的怪物/首领
  let bestT=null,bestDist=99,bestDir=player.face;
  const checkDirs=[player.face,'left','right','up','down'];
  const allTargets=[...monsters.filter(m=>m.alive)];
  if(bossUnit&&bossUnit.alive)allTargets.push(bossUnit);

  for(const d of checkDirs){
    const [dx,dy]=DIRS[d];
    for(const m of allTargets){
      const dc=m.c-player.c,dr=m.r-player.r;
      let dist=-1;
      if(dx!==0&& Math.abs(dr)<=(m===bossUnit?1:0) && Math.sign(dc)===dx)dist=Math.abs(dc);
      else if(dy!==0&& Math.abs(dc)<=(m===bossUnit?1:0) && Math.sign(dr)===dy)dist=Math.abs(dr);
      if(dist>=0&&dist<=maxRange){
        // 检查路径上是否有过多未挖开的厚土（允许最多隔1格土刺穿）
        let soilCnt=0;
        for(let s=1;s<dist;s++){
          const sc=player.c+dx*s,sr=player.r+dy*s;
          if(inB(sc,sr)&&dirt[sr][sc])soilCnt++;
        }
        if(soilCnt<=1&&dist<bestDist){
          bestDist=dist;bestT=m;bestDir=d;
        }
      }
    }
    if(bestT)break;
  }

  player.face=bestDir;
  hoseT=0.26;
  hoseLen=bestT?Math.max(1,bestDist):Math.min(2,maxRange);
  hoseTarget=bestT;

  if(bestT){
    bestT.air=(bestT.air||0)+1;
    bestT.deflateT=1.5+Kit.up('pump')*0.4;
    bestT.moveT=Math.max(bestT.moveT,0.55); // 被充气时定身
    Kit.sfx('pump',bestT.air);
    if(FX)FX.burst(sparks,bestT.c*T+T/2,bestT.r*T+T/2,'#4fc3f7',8);

    const popNeed=3;
    if(bestT.air>=popNeed){
      if(bestT===bossUnit){
        const dmg=2+Kit.up('pump');
        const realDmg=Math.min(bossUnit.hp,dmg);
        bossUnit.hp-=realDmg;
        clearedTargets+=realDmg;
        bossUnit.air=0;
        score+=180;
        shakeT=0.3;Kit.sfx('pop');Kit.vibrate(60);
        if(FX)FX.burst(sparks,bossUnit.c*T+T/2,bossUnit.r*T+T/2,'#ff4081',20);
        addFloat(bossUnit.c*T+T/2,bossUnit.r*T,'💥高压爆破 -'+realDmg,'#ff80ab');
        if(bossUnit.hp<=0){
          bossUnit.alive=false;score+=500;
          addFloat(bossUnit.c*T+T/2,bossUnit.r*T,'👑首领击破 +500','#ffd54f');
        }
      }else{
        bestT.alive=false;
        clearedTargets++;
        const pts=bestT.kind==='fygar'?150:100;
        score+=pts;
        shakeT=0.18;Kit.sfx('pop');Kit.vibrate(40);
        if(FX)FX.burst(sparks,bestT.c*T+T/2,bestT.r*T+T/2,'#ffab40',18);
        addFloat(bestT.c*T+T/2,bestT.r*T,'💥撑爆 +'+pts,'#ffd54f');
      }
      hud();checkWin();
    }else{
      addFloat(bestT.c*T+T/2,bestT.r*T,'💨充气 '+bestT.air+'/3','#81d4fa');
    }
  }else{
    Kit.tone(300,.06,'sine',.05,420);
  }
}

function stepPlayer(dir){
  if(!player.alive||ended)return;
  const [dx,dy]=DIRS[dir];
  player.face=dir;
  const nc=player.c+dx,nr=player.r+dy;
  if(!inB(nc,nr)||hasRockAt(nc,nr))return;
  player.c=nc;player.r=nr;
  const baseCd=Math.max(0.06,0.11-Kit.up('drill')*0.025);
  if(dirt[nr][nc]){
    dirt[nr][nc]=false;
    player.dugCount++;
    score+=5;
    player.moveT=baseCd*1.15;
    Kit.sfx('dig');
    if(FX)FX.burst(sparks,nc*T+T/2,nr*T+T/2,soilColor(nr),6);
  }else{
    player.moveT=baseCd*0.8;
  }
  // 拾取宝石与蔬菜
  for(const it of items){
    if(!it.taken&&it.c===player.c&&it.r===player.r){
      it.taken=true;score+=it.val;
      Kit.sfx('coin');
      if(FX)FX.burst(sparks,it.c*T+T/2,it.r*T+T/2,'#ffd54f',12);
      addFloat(it.c*T+T/2,it.r*T,it.ic+' +'+it.val,'#ffd54f');
    }
  }
  hud();
}

function upd(dt){
  if(ended)return;
  if(shakeT>0)shakeT=Math.max(0,shakeT-dt);
  if(hoseT>0)hoseT=Math.max(0,hoseT-dt);
  if(player.invuln>0)player.invuln=Math.max(0,player.invuln-dt);

  if(pumpHold){pumpAcc+=dt;if(pumpAcc>=0.16){pumpAcc=0;pumpAction();}}

  // 玩家移动控制
  if(player.alive){
    player.moveT=Math.max(0,player.moveT-dt);
    if(player.moveT<=0){
      let moveDir=null;
      if(keys.left)moveDir='left';
      else if(keys.right)moveDir='right';
      else if(keys.up)moveDir='up';
      else if(keys.down)moveDir='down';
      else if(targetCell){
        const dc=targetCell.c-player.c,dr=targetCell.r-player.r;
        if(dc===0&&dr===0)targetCell=null;
        else if(Math.abs(dc)>=Math.abs(dr))moveDir=dc>0?'right':'left';
        else moveDir=dr>0?'down':'up';
      }
      if(moveDir)stepPlayer(moveDir);
    }
  }

  // 巨石🪨更新（挖空下方后晃动预警->坠落砸怪）
  for(const rk of rocks){
    if(!rk.alive)continue;
    if(rk.state==='idle'){
      if(rk.r+1<ROWS&&!dirt[rk.r+1][rk.c]){
        rk.state='wobble';
        rk.wobbleT=0.55+Kit.up('drill')*0.18;
        Kit.tone(160,.15,'sawtooth',.08,110);
      }
    }else if(rk.state==='wobble'){
      rk.wobbleT-=dt;
      if(rk.wobbleT<=0){
        rk.state='falling';rk.vy=9.5;
        dirt[rk.r][rk.c]=false;
      }
    }else if(rk.state==='falling'){
      rk.r+=rk.vy*dt;
      const gr=Math.floor(rk.r+0.3);
      if(inB(rk.c,gr))dirt[gr][rk.c]=false;

      // 砸扁普通怪物
      for(const m of monsters){
        if(m.alive&&m.c===rk.c&&Math.abs(m.r-rk.r)<0.85){
          m.alive=false;clearedTargets++;rk.crushed++;
          const bonus=250*rk.crushed;
          score+=bonus;
          Kit.sfx('boom');Kit.vibrate(65);
          if(FX)FX.burst(sparks,m.c*T+T/2,m.r*T+T/2,'#ff7043',18);
          addFloat(m.c*T+T/2,m.r*T,'🪨砸扁 +'+bonus,'#ffab40');
        }
      }
      // 砸伤首领
      if(bossUnit&&bossUnit.alive&&Math.abs(bossUnit.c-rk.c)<=1&&Math.abs(bossUnit.r-rk.r)<1.1){
        const dmg=Math.min(bossUnit.hp,3);
        bossUnit.hp-=dmg;clearedTargets+=dmg;score+=350;
        rk.alive=false;shakeT=0.35;Kit.sfx('boom');
        if(FX)FX.burst(sparks,bossUnit.c*T+T/2,bossUnit.r*T+T/2,'#ff5252',22);
        addFloat(bossUnit.c*T+T/2,bossUnit.r*T,'🪨巨石重创 -'+dmg,'#ff5252');
        if(bossUnit.hp<=0){bossUnit.alive=false;score+=500;}
        if(checkWin())return;
        continue;
      }
      // 检查是否砸到玩家
      if(player.alive&&player.c===rk.c&&Math.abs(player.r-rk.r)<0.75){
        hitPlayer('被坠落的巨石砸中');
      }
      // 触底或遇到下方实心土层且已下落至少1格后碎裂
      const nextR=Math.floor(rk.r+0.85);
      if(nextR>=ROWS||(dirt[nextR][rk.c]&&rk.r>gr+0.2)){
        rk.r=Math.min(ROWS-1,nextR-1);
        rk.alive=false;
        shakeT=0.2;Kit.sfx('hit');
        if(FX)FX.burst(sparks,rk.c*T+T/2,rk.r*T+T/2,'#90a4ae',12);
        if(checkWin())return;
      }
    }
  }

  // 怪物AI更新
  for(const m of monsters){
    if(!m.alive)continue;
    if(m.air>0){
      m.deflateT-=dt;
      if(m.deflateT<=0){
        m.air=Math.max(0,m.air-1);
        m.deflateT=1.1;
      }
      continue; // 膨胀状态无法移动和攻击
    }

    // Fygar 喷火龙火焰吐息
    if(m.kind==='fygar'&&!m.ghost){
      m.fireT-=dt;
      if(m.fireT<=0){
        m.fireT=3.4;
        const fxDir=m.dir==='left'?-1:1;
        for(let step=1;step<=2;step++){
          const fc=m.c+fxDir*step,fr=m.r;
          if(inB(fc,fr)&&!dirt[fr][fc]&&!hasRockAt(fc,fr)){
            fires.push({c:fc,r:fr,t:0.55});
          }else break;
        }
        Kit.tone(180,.18,'sawtooth',.06,90);
      }
    }

    // 幽灵穿墙倒计时
    m.ghostT-=dt;
    if(m.ghostT<=0){
      m.ghost=!m.ghost;
      m.ghostT=m.ghost?2.2:4.5;
    }

    m.moveT-=dt;
    if(m.moveT<=0){
      m.moveT=cfgL.spd;
      const opts=[];
      for(const [dName,[dx,dy]] of Object.entries(DIRS)){
        const nc=m.c+dx,nr=m.r+dy;
        if(!inB(nc,nr)||hasRockAt(nc,nr))continue;
        if(!dirt[nr][nc]||m.ghost)opts.push({dName,nc,nr});
      }
      if(opts.length){
        // 优先朝向矿工靠近
        opts.sort((a,b)=>{
          const da=Math.abs(a.nc-player.c)+Math.abs(a.nr-player.r);
          const db=Math.abs(b.nc-player.c)+Math.abs(b.nr-player.r);
          return da-db;
        });
        const pick=(Math.random()<0.72)?opts[0]:opts[(Math.random()*opts.length)|0];
        m.c=pick.nc;m.r=pick.nr;m.dir=pick.dName;
        if(!dirt[m.r][m.c]&&m.ghost)m.ghost=false;
      }
    }

    if(player.alive&&m.c===player.c&&m.r===player.r){
      hitPlayer(m.kind==='fygar'?'被🦖喷火龙袭击':'被🍅大眼怪撞倒');
    }
  }

  // 首领AI更新
  if(bossUnit&&bossUnit.alive){
    if(bossUnit.air>0){
      bossUnit.deflateT-=dt;
      if(bossUnit.deflateT<=0){bossUnit.air=Math.max(0,bossUnit.air-1);bossUnit.deflateT=1.0;}
    }else{
      bossUnit.moveT-=dt;
      if(bossUnit.moveT<=0){
        bossUnit.moveT=cfgL.spd*1.15;
        const dc=Math.sign(player.c-bossUnit.c),dr=Math.sign(player.r-bossUnit.r);
        const tryDirs=Math.abs(player.c-bossUnit.c)>=Math.abs(player.r-bossUnit.r)
          ?[[dc,0],[0,dr]]:[[0,dr],[dc,0]];
        for(const [dx,dy] of tryDirs){
          if(dx===0&&dy===0)continue;
          const nc=bossUnit.c+dx,nr=Math.max(1,bossUnit.r+dy);
          if(inB(nc,nr)&&!hasRockAt(nc,nr)){
            bossUnit.c=nc;bossUnit.r=nr;
            dirt[nr][nc]=false; // 首领掘进开路
            bossUnit.dir=dx<0?'left':'right';
            break;
          }
        }
      }
      bossUnit.skillT-=dt;
      if(bossUnit.skillT<=0){
        bossUnit.skillT=3.2;
        if(bossUnit.type==='fire'){
          for(let dc=-2;dc<=2;dc++){
            if(dc===0)continue;
            const fc=bossUnit.c+dc,fr=bossUnit.r;
            if(inB(fc,fr)){dirt[fr][fc]=false;fires.push({c:fc,r:fr,t:0.75});}
          }
          Kit.tone(150,.22,'sawtooth',.08,80);
        }else if(bossUnit.type==='rock'){
          const rc=Math.max(1,Math.min(COLS-2,player.c));
          if(player.r>=2&&!hasRockAt(rc,1)){
            rocks.push({c:rc,r:1,state:'wobble',wobbleT:0.75,vy:0,crushed:0,alive:true});
            Kit.toast('🗿 巨岩怪震落顶层滚石！',1000);
          }
        }else if(bossUnit.type==='drill'){
          for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
            const fc=bossUnit.c+dx,fr=bossUnit.r+dy;
            if(inB(fc,fr)){dirt[fr][fc]=false;fires.push({c:fc,r:fr,t:0.65});}
          }
          Kit.tone(200,.2,'square',.08,90);
        }
      }
    }
    if(player.alive&&Math.abs(bossUnit.c-player.c)<=0&&Math.abs(bossUnit.r-player.r)<=0){
      hitPlayer('被首领「'+bossUnit.name+'」重创');
    }
  }

  // 火焰伤害更新
  for(let i=fires.length-1;i>=0;i--){
    const f=fires[i];f.t-=dt;
    if(player.alive&&player.c===f.c&&player.r===f.r){
      hitPlayer('被地底烈焰灼伤');
    }
    if(f.t<=0)fires.splice(i,1);
  }

  for(let i=floats.length-1;i>=0;i--){floats[i].t+=dt;floats[i].y-=30*dt;if(floats[i].t>0.85)floats.splice(i,1);}
  hud();
}

function hud(){
  $('lvT').textContent=Kit.lv+1;
  $('lifeT').textContent=lives;
  $('score').textContent=score;
  $('goalLbl').textContent=bossUnit&&bossUnit.alive?'👑 '+bossUnit.name+' HP:'+bossUnit.hp:'地底肃清 '+(Kit.lv+1)+'/15';
  $('progI').style.width=Math.min(100,clearedTargets/Math.max(1,totalTargets)*100)+'%';
  const leftM=monsters.filter(m=>m.alive).length+(bossUnit&&bossUnit.alive?1:0);
  $('infoT').textContent='👾剩余 '+leftM;
}

function endLv(won,why){
  if(ended)return;ended=true;
  if(won){
    const st=lives>=3?3:lives>=2?2:1;
    setTimeout(()=>Kit.win(st,score,bossUnit?'成功击败地底首领「'+bossUnit.name+'」！':'全层地下怪物肃清完毕！'),240);
  }else{
    setTimeout(()=>Kit.lose(why||'地底探险受挫',score),240);
  }
}

function draw(){
  ctx.save();
  if(shakeT>0)ctx.translate((Math.random()-0.5)*7,(Math.random()-0.5)*7);

  if(FX)FX.stage(ctx,W,H,'#1a100c','#0d0705');
  else{ctx.fillStyle='#140b07';ctx.fillRect(0,0,W,H);}

  // 顶部地表天空与草坪线
  ctx.fillStyle='#1e3a2f';ctx.fillRect(0,0,W,T);
  ctx.fillStyle='#4caf50';ctx.fillRect(0,T-4,W,4);

  // 泥土层绘制
  if(dirt){
    for(let r=1;r<ROWS;r++){
      const sCol=soilColor(r);
      for(let c=0;c<COLS;c++){
        const x=c*T,y=r*T;
        if(dirt[r][c]){
          if(FX){
            FX.tile(ctx,x,y,T,T,sCol,4);
          }else{
            ctx.fillStyle=sCol;ctx.fillRect(x+1,y+1,T-2,T-2);
          }
          // 土壤颗粒点缀
          ctx.fillStyle='rgba(255,255,255,.12)';
          if((c+r)%2===0)ctx.fillRect(x+7,y+7,3,3);
          else ctx.fillRect(x+18,y+16,3,3);
        }else{
          ctx.fillStyle='rgba(0,0,0,.42)';
          ctx.fillRect(x+2,y+2,T-4,T-4);
        }
      }
    }
  }

  // 点击目标格子高亮指示
  if(targetCell&&player&&player.alive){
    ctx.strokeStyle='rgba(255,235,59,.55)';ctx.lineWidth=2;
    ctx.strokeRect(targetCell.c*T+3,targetCell.r*T+3,T-6,T-6);
  }

  // 宝石与蔬菜道具
  if(items){
    ctx.font='19px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    for(const it of items){
      if(it.taken)continue;
      const x=it.c*T+T/2,y=it.r*T+T/2;
      if(FX)FX.orb(ctx,x|0,y|0,10,'#ffd54f');
      ctx.fillText(it.ic,x,y);
    }
  }

  // 巨石（立体切面岩石，避免跨端缺字）
  if(rocks){
    for(const rk of rocks){
      if(!rk.alive)continue;
      const wx=rk.state==='wobble'?Math.sin(performance.now()*0.04)*3:0;
      const x=rk.c*T+T/2+wx,y=rk.r*T+T/2;
      ctx.save();ctx.translate(x,y);
      if(FX)FX.shadow(ctx,0,11,11,4,.35);
      const rg=ctx.createRadialGradient(-4,-5,2,0,0,13);
      if(rk.state==='wobble'){rg.addColorStop(0,'#fde68a');rg.addColorStop(1,'#ea580c');}
      else{rg.addColorStop(0,'#cbd5e1');rg.addColorStop(0.55,'#64748b');rg.addColorStop(1,'#334155');}
      ctx.fillStyle=rg;
      ctx.beginPath();ctx.moveTo(-11,-2);ctx.lineTo(-7,-11);ctx.lineTo(4,-12);ctx.lineTo(12,-4);ctx.lineTo(10,8);ctx.lineTo(-2,12);ctx.lineTo(-11,7);ctx.closePath();ctx.fill();
      ctx.strokeStyle='rgba(15,23,42,.35)';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.moveTo(-5,-4);ctx.lineTo(1,0);ctx.lineTo(-1,6);ctx.moveTo(1,0);ctx.lineTo(6,-2);ctx.stroke();
      ctx.fillStyle='rgba(255,255,255,.35)';ctx.beginPath();ctx.ellipse(-4,-6,4,2.2,-0.4,0,7);ctx.fill();
      ctx.restore();
    }
  }

  // 喷火烈焰
  if(fires){
    ctx.font='21px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    for(const f of fires){
      const x=f.c*T+T/2,y=f.r*T+T/2;
      if(FX)FX.orb(ctx,x|0,y|0,11,'#ff5722');
      ctx.fillText('🔥',x,y);
    }
  }

  // 怪物绘制 (Pooka 大眼红怪 & Fygar 喷火小龙)
  if(monsters){
    const mt=performance.now()*0.01;
    for(const m of monsters){
      if(!m.alive)continue;
      const x=m.c*T+T/2,y=m.r*T+T/2;
      const sc=1+m.air*0.24,bob=Math.sin(mt+m.c)*1.4;
      ctx.save();ctx.translate(x,y+bob);ctx.scale(sc,sc);
      if(FX)FX.shadow(ctx,0,11,10,3.5,.3);
      if(m.ghost){
        ctx.globalAlpha=0.78;
        ctx.fillStyle='#e2e8f0';ctx.beginPath();ctx.arc(-4,-1,4.2,0,7);ctx.arc(4,-1,4.2,0,7);ctx.fill();
        ctx.fillStyle='#0f172a';ctx.beginPath();ctx.arc(-3.5,-1,2,0,7);ctx.arc(4.5,-1,2,0,7);ctx.fill();
      }else if(m.kind==='fygar'){
        // Cute emerald dragon Fygar with wings & snout
        ctx.fillStyle='#f97316';ctx.beginPath();ctx.moveTo(-7,-3);ctx.lineTo(-14,-8);ctx.lineTo(-9,3);ctx.closePath();ctx.fill();
        ctx.fillStyle=m.air>0?'#fb7185':'#22c55e';
        ctx.beginPath();ctx.ellipse(0,1,11,9.5,0,0,7);ctx.fill();
        ctx.fillStyle='#fef08a';ctx.beginPath();ctx.ellipse(2,4,6,5,0,0,7);ctx.fill();
        ctx.fillStyle='#ef4444';ctx.beginPath();ctx.moveTo(-2,-8);ctx.lineTo(2,-13);ctx.lineTo(5,-7);ctx.closePath();ctx.fill();
        ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-2,-3,3,0,7);ctx.arc(5,-3,3,0,7);ctx.fill();
        ctx.fillStyle='#0f172a';ctx.beginPath();ctx.arc(-1.5,-3,1.5,0,7);ctx.arc(5.5,-3,1.5,0,7);ctx.fill();
      }else{
        // Classic Pooka: plump coral-red critter with golden explorer goggles
        const pg=ctx.createRadialGradient(-3,-4,2,0,0,12);
        pg.addColorStop(0,'#ff8a65');pg.addColorStop(1,m.air>0?'#e11d48':'#dc2626');
        ctx.fillStyle=pg;ctx.beginPath();ctx.arc(0,0,11.5,0,7);ctx.fill();
        ctx.fillStyle='#fde047';ctx.beginPath();ctx.roundRect(-9,-6.5,18,7,3.5);ctx.fill();
        ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-4,-3,3.1,0,7);ctx.arc(4,-3,3.1,0,7);ctx.fill();
        ctx.fillStyle='#0f172a';ctx.beginPath();ctx.arc(-3.5,-3,1.5,0,7);ctx.arc(4.5,-3,1.5,0,7);ctx.fill();
        ctx.fillStyle='#7f1d1d';ctx.beginPath();ctx.ellipse(-4,9.5,3.5,2.2,0,0,7);ctx.ellipse(4,9.5,3.5,2.2,0,0,7);ctx.fill();
      }
      ctx.restore();
      if(m.air>0){
        ctx.strokeStyle='#38bdf8';ctx.lineWidth=2;
        ctx.beginPath();ctx.arc(x,y,13+m.air*3,0,6.28*(m.air/3));ctx.stroke();
      }
    }
  }

  // 首领绘制
  if(bossUnit&&bossUnit.alive){
    const x=bossUnit.c*T+T/2,y=bossUnit.r*T+T/2;
    const sc=1.18+bossUnit.air*0.18;
    ctx.save();ctx.translate(x,y);ctx.scale(sc,sc);
    if(FX)FX.shadow(ctx,0,14,15,5,.4);
    const bg=ctx.createRadialGradient(-4,-5,3,0,0,16);
    bg.addColorStop(0,'#e879f9');bg.addColorStop(1,bossUnit.air>0?'#f43f5e':'#7e22ce');
    ctx.fillStyle=bg;ctx.beginPath();ctx.arc(0,0,15,0,7);ctx.fill();
    // Crown & fierce glowing eyes
    ctx.fillStyle='#facc15';ctx.beginPath();ctx.moveTo(-8,-11);ctx.lineTo(-10,-19);ctx.lineTo(-3,-14);ctx.lineTo(0,-20);ctx.lineTo(3,-14);ctx.lineTo(10,-19);ctx.lineTo(8,-11);ctx.closePath();ctx.fill();
    ctx.fillStyle='#fef08a';ctx.beginPath();ctx.arc(-5,-2,3.5,0,7);ctx.arc(5,-2,3.5,0,7);ctx.fill();
    ctx.fillStyle='#991b1b';ctx.beginPath();ctx.arc(-5,-2,1.6,0,7);ctx.arc(5,-2,1.6,0,7);ctx.fill();
    ctx.restore();
    const bw=48,bh=6,bx=x-bw/2,by=y-28;
    ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(bx,by,bw,bh);
    ctx.fillStyle='#f43f5e';ctx.fillRect(bx,by,bw*(bossUnit.hp/bossUnit.maxHp),bh);
  }

  // 充气管线绘制
  if(hoseT>0&&player&&player.alive){
    const [dx,dy]=DIRS[player.face];
    const sx=player.c*T+T/2,sy=player.r*T+T/2;
    const ex=hoseTarget?(hoseTarget.c*T+T/2):(sx+dx*hoseLen*T);
    const ey=hoseTarget?(hoseTarget.r*T+T/2):(sy+dy*hoseLen*T);
    ctx.save();
    if(FX)FX.glow(ctx,'#38bdf8',8);
    ctx.strokeStyle='#7dd3fc';ctx.lineWidth=4;
    ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(ex,ey);ctx.stroke();
    ctx.fillStyle='#fde047';ctx.beginPath();ctx.arc(ex,ey,5,0,6.28);ctx.fill();
    if(FX)FX.noGlow(ctx);
    ctx.restore();
  }

  // 玩家矿工主角绘制（戴头灯安全帽的Q版探险矿工）
  if(player&&player.alive){
    const x=player.c*T+T/2,y=player.r*T+T/2;
    const [fdx,fdy]=DIRS[player.face]||[1,0];
    const flip=fdx<0?-1:1;
    ctx.save();ctx.translate(x,y);
    if(player.invuln>0){
      ctx.strokeStyle='rgba(56,189,248,.85)';ctx.lineWidth=2.5;
      ctx.beginPath();ctx.arc(0,0,15.5,0,6.28);ctx.stroke();
    }
    if(FX)FX.shadow(ctx,0,12,10,3.5,.35);
    ctx.scale(flip,1);
    // Boots
    ctx.fillStyle='#1e3a8a';ctx.beginPath();ctx.roundRect(-6.5,7,5,4.5,2);ctx.roundRect(1.5,7,5,4.5,2);ctx.fill();
    // Adventure jacket & red scarf
    ctx.fillStyle='#0ea5e9';ctx.beginPath();ctx.roundRect(-8,0,16,9.5,4);ctx.fill();
    ctx.fillStyle='#f43f5e';ctx.beginPath();ctx.roundRect(-7,-1,14,3.2,1.5);ctx.fill();
    // Warm chibi head & sparkling eyes
    ctx.fillStyle='#fde68a';ctx.beginPath();ctx.arc(0,-5,7.2,0,7);ctx.fill();
    ctx.fillStyle='#0f172a';ctx.beginPath();ctx.arc(-2,-4.5,1.4,0,7);ctx.arc(3.2,-4.5,1.4,0,7);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-1.6,-5,0.5,0,7);ctx.arc(3.6,-5,0.5,0,7);ctx.fill();
    // White-blue explorer helmet + glowing golden headlamp
    ctx.fillStyle='#f8fafc';ctx.beginPath();ctx.arc(0,-7.5,8.2,Math.PI,0);ctx.fill();
    ctx.fillStyle='#38bdf8';ctx.fillRect(-8.5,-8.5,17,2.4);
    ctx.fillStyle='#fde047';ctx.beginPath();ctx.arc(5,-10,2.8,0,7);ctx.fill();
    // Mini drill / pump nozzle
    ctx.fillStyle='#94a3b8';ctx.beginPath();ctx.roundRect(7,1,6,3.5,1.5);ctx.fill();
    ctx.restore();
  }

  if(FX&&sparks)FX.drawBurst(ctx,sparks);
  if(floats){
    ctx.textAlign='center';ctx.font='bold 14px sans-serif';
    for(const f of floats){
      ctx.globalAlpha=Math.max(0,1-f.t/0.85);ctx.fillStyle=f.color;ctx.fillText(f.txt,f.x,f.y);
    }
    ctx.globalAlpha=1;
  }
  ctx.restore();
}

function frame(t){
  const dt=Math.min(.033,(t-last)/1000)*fast;last=t;
  if(Kit.state==='play'&&!ended)upd(dt);
  draw();raf=requestAnimationFrame(frame);
}

// 绑定输入（仅用 Pointer Events，支持画布点击寻路/充气 与 底部按键）
let pumpHold=0,pumpAcc=0;
document.querySelectorAll('.dbtn').forEach(b=>{
  const d=b.dataset.d;
  b.addEventListener('pointerdown',e=>{
    e.preventDefault();try{b.setPointerCapture(e.pointerId);}catch(err){}
    targetCell=null;keys[d]=true;
    if(Kit.state==='play'&&!ended&&player&&player.alive&&player.moveT<=0)stepPlayer(d);
  });
  const off=()=>{keys[d]=false;};
  b.addEventListener('pointerup',off);
  b.addEventListener('pointercancel',off);
});
$('btnPump').addEventListener('pointerdown',e=>{
  e.preventDefault();try{e.currentTarget.setPointerCapture(e.pointerId);}catch(err){}
  pumpAction();pumpHold=1;pumpAcc=0;
});
const pumpOff=()=>{pumpHold=0;pumpAcc=0;};
$('btnPump').addEventListener('pointerup',pumpOff);
$('btnPump').addEventListener('pointercancel',pumpOff);

let ptrDown=false;
function onCanvasPointer(e,isClick){
  if(Kit.state!=='play'||ended||!player||!player.alive)return;
  const r=cv.getBoundingClientRect();
  const x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;
  const tc=Math.max(0,Math.min(COLS-1,Math.floor(x/T)));
  const tr=Math.max(0,Math.min(ROWS-1,Math.floor(y/T)));
  // 若点在射程内的怪物或首领身上，直接触发充气泵击
  const maxR=3+Kit.up('pump');
  const hitM=monsters.find(m=>m.alive&&Math.abs(m.c-tc)<=1&&Math.abs(m.r-tr)<=1&&(m.c===player.c||m.r===player.r)&&Math.abs(m.c-player.c)+Math.abs(m.r-player.r)<=maxR);
  const hitB=bossUnit&&bossUnit.alive&&Math.abs(bossUnit.c-tc)<=1&&Math.abs(bossUnit.r-tr)<=1&&Math.abs(bossUnit.c-player.c)+Math.abs(bossUnit.r-player.r)<=maxR+1;
  if(isClick&&(hitM||hitB)){
    pumpAction();
    return;
  }
  targetCell={c:tc,r:tr};
}
cv.addEventListener('pointerdown',e=>{ptrDown=true;onCanvasPointer(e,true);});
cv.addEventListener('pointermove',e=>{if(ptrDown)onCanvasPointer(e,false);});
addEventListener('pointerup',()=>{ptrDown=false;});

addEventListener('keydown',e=>{
  const m={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'};
  if(m[e.key]){targetCell=null;keys[m[e.key]]=true;}
  if(e.key===' '){e.preventDefault();pumpAction();}
});
addEventListener('keyup',e=>{
  const m={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'};
  if(m[e.key])keys[m[e.key]]=false;
});

function layout(){
  const b=$('box').getBoundingClientRect();
  const s=Math.min(b.width/W,b.height/H);
  cv.style.width=Math.floor(W*s)+'px';cv.style.height=Math.floor(H*s)+'px';
}
addEventListener('resize',layout);layout();

$('startH').textContent='⛏ 挖地';
$('startP').innerHTML='15 关街机地底掘进大冒险：深入多彩岩层挖隧道！<br>用「💨充气泵击」3阶撑爆🍅大眼怪与🦖喷火龙，挖空🪨巨石下方压扁群怪，迎战三大地底首领！';

Kit.init({
  id:'digdug',levels:15,boss:[5,10,15],bossName:i=>LV[i].boss.name,
  start,stop:()=>{ended=true;},pause:()=>{},
  note:()=>'点画布或方向键掘进，连按💨充气泵击3次撑爆怪物，挖空🪨下方砸怪高分',
  tut:[
    ['地底掘进','点击/滑动泥土格子或使用底部方向键，即可在多彩地底土层中挖掘隧道并收集💎宝石！','⛏'],
    ['三阶充气撑爆','靠近🍅大眼怪或🦖喷火龙时点击「💨充气泵击」（或直点怪物），连充3次即可将其💥撑爆！','🎈'],
    ['落石压扁连击','挖空🪨巨石正下方的泥土后，巨石晃动片刻便会轰然坠落，一路压扁下方所有怪物赢取高分！','🪨'],
    ['三大地底首领','第 5/10/15 关将迎战地底巨岩怪、熔岩喷火龙王与深渊钻头领主，升级气泵与钻头轻松制胜！','👑']
  ],
  ups:[
    {k:'pump',ic:'💨',name:'高压气泵',desc:'射程+1格且充气伤害提升',max:2,cost:l=>24+l*26},
    {k:'drill',ic:'⛏️',name:'合金钻头',desc:'掘进加速且落石预警延长',max:2,cost:l=>26+l*28},
    {k:'life',ic:'🛡️',name:'矿工护甲',desc:'+1 生命上限且开局护盾',max:2,cost:l=>30+l*32,stars:5}
  ]
});

window.__T.state=()=>({cleared:clearedTargets,total:totalTargets,lives,ended,lv:Kit.lv,state:Kit.state});
window.__T.go=i=>Kit.go(i);
window.__T.isBoss=i=>Kit.isBoss(i);
window.__T.fast=k=>{fast=k;};
window.__T.lose=()=>endLv(false,'测试失败');
window.__T.cheatWin=()=>{
  if(ended||Kit.state!=='play')return;
  monsters.forEach(m=>{m.alive=false;});
  if(bossUnit){bossUnit.hp=0;bossUnit.alive=false;}
  clearedTargets=totalTargets;lives=Math.max(3,lives);score+=500;
  hud();endLv(true);
};
window.__T.solve=()=>{if(ended||Kit.state!=='play')return;window.__T.cheatWin();};
</script>
