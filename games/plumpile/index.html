*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{display:flex;justify-content:center;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.wrap{width:100%;max-width:480px;height:100%;padding:12px;display:flex;flex-direction:column;align-items:center;gap:10px}
.topbar{width:100%;display:flex;justify-content:space-between;align-items:center;flex-wrap:nowrap!important}
.topbar .stat{display:flex;gap:8px;align-items:center;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:13px}
.topbar .tools{display:flex;gap:6px}

.rowbtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:100%}
#tutStep{font-size:12px;opacity:.7}

.hidden{display:none!important}

.pad{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:8px}.pad button{min-height:60px;font-size:24px!important;padding:0!important;touch-action:none}
.shop{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:100%}.shop button{min-height:48px;font-size:12px!important;padding:3px!important;line-height:1.2}

<!-- GAME UI BEGIN -->
<style>
:root{--page:#172638;--surface:#22374c;--soft:#2e4760;--ink:#f0f6fc;--muted:#b1c6d9;--accent:#f0bc74;--on-accent:#342717;--line:#45637c;--stage:#142438;--page:#0b0620;--surface:#211040;--soft:#33234f;--ink:#fff3fb;--muted:#d4b6dd;--accent:#ff3d9a;--on-accent:#0b0620;--line:#ff3d9a;--b-bg1:#3a0d5e;--b-bg2:#0b0620;--b-btn:#ff3d9a;--b-btn-hi:#ff81bd;--b-edge:#a3124f;--b-glow:#00e5ff;--b-glow-rgb:0,229,255;--b-pedge-rgb:255,61,154;--b-btn-ink:#510927;--b-btn-tsh:0 1px 0 rgba(255,255,255,.45);--b-coin-ink:#510927;--b-coin-tsh:none;--b-key-ink:#00e5ff;--b-title:#ffffff}

.game-ui body>.wrap>canvas:not(#fx){background-color:var(--stage);box-shadow:0 0 0 1px var(--line),0 6px 0 var(--soft);border-radius:18px;flex-shrink:0}

.game-ui #hud{gap:6px;background:var(--surface);color:var(--ink)}
.game-ui #hud :is(.left,.t,.s,.grp,.pill){color:var(--ink)}
.game-ui #hud .pill{background:var(--surface);border-color:var(--line)}
.game-ui body canvas:is(#cv,#game,#board){background-color:var(--stage)}
.game-ui :is(button.dbtn,button.cbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.game-ui :is(button.lvl,button.lvlbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line);border-radius:12px;min-height:54px}

@media(max-height:650px){.game-ui .ui-panel{padding:18px;gap:12px}.game-ui .ui-emblem{width:60px;height:60px;font-size:32px}.game-ui .ui-panel h1{font-size:25px}.game-ui .ui-panel :is(p,.howto,.sub,.rule){font-size:13px}}

.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv):has(>.ui-panel){position:fixed;inset:0;z-index:1000;border-radius:0;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}

// 绘制
function pile(x,y,p,r,dim){let a=dim?.35:1;if(p.type==='ghost')a=r.sunk?.25:(.55+.25*Math.sin(t*(save.up.eye?14:9)+x))*(save.up.eye?.75:1)*(dim?.4:1);ctx.globalAlpha=a;
 const col={n:'#a0703f',crack:'#7a5a3a',swap:'#4fa3c7',bell:'#c9a227',ghost:'#a0703f'}[p.type]; ctx.fillStyle='rgba(60,30,10,.6)';ctx.fillRect(x-10,y,20,90);if(FX)FX.tile(ctx,x-30,y-12,60,24,col,10);else{ctx.fillStyle=col;ctx.fillRect(x-30,y-12,60,24);}
 if(p.type==='crack'){ctx.strokeStyle='#2a1a0a';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x-12,y-8);ctx.lineTo(x-2,y+2);ctx.lineTo(x+8,y-6);ctx.stroke();}
 if(p.type==='swap')txt(ctx,'🔄',x,y,14);if(p.type==='bell')txt(ctx,'🔔',x,y-2,16);if(p.coin)txt(ctx,'🪙',x,y-26,16);if(r.doom!=null){ctx.fillStyle='rgba(255,60,80,.5)';ctx.fillRect(x-30,y-12,60*clamp(r.doom/1.6,0,1),5);}ctx.globalAlpha=1;}
/* ART T2-3 */var ppBg=null,ppBgKey='';
function ensurePpBg(){var k=W+'x'+H;if(ppBg&&ppBgKey===k)return ppBg;ppBgKey=k;var c=document.createElement('canvas');c.width=W;c.height=H;var g=c.getContext('2d');if(FX)FX.stage(g,W,H,'#ffd9a8','#5b7fb8');else{g.fillStyle='#5b7fb8';g.fillRect(0,0,W,H);}ppBg=c;return ppBg;}
function draw(){ctx.drawImage(ensurePpBg(),0,0);
 ctx.fillStyle='rgba(60,80,120,.25)';for(let k=0;k<3;k++){ctx.beginPath();ctx.moveTo(0,200+k*30);for(let x=0;x<=W;x+=40)ctx.lineTo(x,150+k*40+Math.sin(x*.02+k*2)*40);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();}
 const wy=Math.min(H,(boss?water:rows.length&&rows[cur]?rows[cur].y+170:H)-camY);ctx.fillStyle='rgba(40,120,200,.55)';ctx.beginPath();ctx.moveTo(0,wy);for(let x=0;x<=W;x+=20)ctx.lineTo(x,wy+Math.sin(x*.05+t*3)*5);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();
 if(!L){txt(ctx,'🪵',W/2,H/2,80);return;}
 for(let k=Math.max(0,cur-2);k<rows.length;k++){const r=rows[k],y=r.y-camY;if(y<-60||y>H+40)continue;for(const p of r.piles){if(k<cur&&p.side!==r.landSide)continue;pile(PX(p.side),y,p,r,k<cur);}}
 const nx=rows[cur+1];if(nx&&!jumpA&&!fallA&&cur<3&&!endless&&li===0){otxt(ctx,nx.real===0?'↖ 点左边':'点右边 ↗',W/2,nx.y-camY-40,15,'#fff');}
 // 稳定度环
 if(!jumpA&&!fallA&&rows[cur]){const r=rows[cur],x=PX(r.landSide!=null?r.landSide:r.real),y=r.y-camY,k=clamp(stab/stabMax,0,1);ctx.strokeStyle=k>.35?'#fff':'#ff4d6e';ctx.lineWidth=4;ctx.beginPath();ctx.arc(x,y-20,40,-Math.PI/2,-Math.PI/2+6.283*k);ctx.stroke();}
 // 人物
 let px,py;if(fallA){px=fallA.x;py=fallA.y-camY;}else if(jumpA){const k=Math.min(1,jumpA.t/jumpA.dur),e=1-(1-k)**3;px=jumpA.fx+(jumpA.tx-jumpA.fx)*e;py=jumpA.fy+(jumpA.ty-jumpA.fy)*e-Math.sin(k*Math.PI)*50-camY;}else{const r=rows[cur];px=PX(r.landSide!=null?r.landSide:r.real);py=r.y-camY;}
 txt(ctx,'🥷',px,py-30,36);
 if(boss){txt(ctx,'🐉',W/2,Math.min(H-40,wy+30),54);ctx.fillStyle='rgba(0,0,0,.35)';rr(ctx,70,10,W-140,12,6);ctx.fill();ctx.fillStyle='#4fc3f7';rr(ctx,70,10,(W-140)*boss.hp/boss.max,12,6);ctx.fill();txt(ctx,'河妖',W/2,16,9,'#fff');}
 else if(!endless){ctx.fillStyle='rgba(0,0,0,.3)';rr(ctx,70,10,W-140,10,5);ctx.fill();ctx.fillStyle='#ffe066';rr(ctx,70,10,(W-140)*clamp(jumps/L.need,0,1),10,5);ctx.fill();}
 if(FX)FX.drawBurst(ctx,sparks);for(const f of floats){ctx.globalAlpha=clamp(f.l,0,1);otxt(ctx,f.s,f.x,f.y-camY,14,f.c);}ctx.globalAlpha=1;}
// 菜单
function openLevels(){state='menu';['overScr','pauseOv'].forEach(i=>show(i,false));const g=$('lvgrid');g.innerHTML='';$('lvlInfo').textContent='★'+save.stars.reduce((a,b)=>a+(b||0),0)+' / 45 · 🪙'+save.coins+' · 最高连跳 '+legacyBest();
 LV.forEach((s,i)=>{const b=document.createElement('button');b.className='lvl';const open=i===0||(save.stars[i-1]||0)>0||(save.stars[i]||0)>0;b.disabled=!open;b.innerHTML=(open?(s.boss?'🐉':i+1):'🔒')+'<small>'+(open?starStr(save.stars[i]||0):'')+'</small>';b.onclick=()=>{tone(660,.08,'triangle');startLevel(i);};g.appendChild(b);});
 const sh=$('shop');sh.innerHTML='';for(const u of UPS){const lv=save.up[u.k],cost=u.c*(lv+1);const b=document.createElement('button');b.className='ghost';b.disabled=lv>=u.max||save.coins<cost;b.innerHTML=u.n+' '+lv+'<br><small>'+(lv>=u.max?'已满级':u.d+' 🪙'+cost)+'</small>';b.onclick=()=>{save.coins-=cost;save.up[u.k]++;Store.set('save',save);tone(880,.1,'triangle');openLevels();};sh.appendChild(b);}
 show('lvlScr',true);}
function showTut(done){tutorial([['🪵 跳桩','看清下一根桩在左还是右，点 ↖左 或 右↗（也可点画面左右半边）。'],['⏳ 下沉','脚下白色圆环是木桩剩余时间，归零就会沉没。越往后沉得越快。'],['⚠ 特殊桩','裂桩沉得快；🔄 转桩会在你落地后换边；幻影桩会闪烁、一踩就空；🪙 金币在裂桩岔路上。'],['🐉 河妖','首领关河水不断上涨，踩 🔔 铜铃桩攻击河妖并压低水位；红条标记的桩即将被浪打沉。']],done);}
$('howBtn').onclick=()=>{show('lvlScr',false);showTut(openLevels);};$('endlessBtn').onclick=()=>startLevel(0,1);
$('startBtn').onclick=()=>{audio();show('startScr',false);if(!save.tut){showTut(()=>{save.tut=1;Store.set('save',save);startLevel(0);});}else openLevels();};
$('bestLine').textContent='最高连跳 '+legacyBest();
function pause(){if(state==='play'){state='pause';show('pauseOv',true);}}
$('pauseBtn').onclick=pause;$('resumeBtn').onclick=()=>{show('pauseOv',false);state='play';last=performance.now();};$('restartBtn').onclick=()=>startLevel(li,endless);$('menuBtn').onclick=openLevels;
$('nextBtn').onclick=()=>startLevel(li+1);$('againBtn').onclick=()=>startLevel(li,endless);$('menu2Btn').onclick=openLevels;
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
let last=performance.now();function frame(tm){const dt=Math.min(.05,(tm-last)/1000);last=tm;tick(dt);draw();requestAnimationFrame(frame);}
fit();requestAnimationFrame(frame);
window.__pp={LV,startLevel,tick,jump,setFast:v=>FAST=v,save:()=>save,get s(){return{state,li,jumps,cur,rows,stab,stabMax,landT,boss,water,busy:!!(jumpA||fallA),used,t,why:lastWhy}}};
</script>
