<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>梅花桩</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;overflow:hidden;background:#0d0f1a;font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;color:#fff}
#wrap{position:relative;width:100%;max-width:480px;height:100%;margin:0 auto;display:flex;flex-direction:column;background:linear-gradient(#141a2e 0%,#0d0f1a 60%,#0a0c14 100%)}
#hud{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;font-size:15px;z-index:5}
#hud .grp{display:flex;gap:8px;align-items:center}
.ibtn{width:44px;height:44px;border-radius:12px;border:1px solid #3a4066;background:#1a1f36;color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.ibtn:active{transform:scale(.92)}
#cv{flex:1;width:100%;touch-action:none}
#hint{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:13px;color:#8a90b8;pointer-events:none;z-index:6}
#overlay{position:absolute;inset:0;background:rgba(5,6,12,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;padding:24px;text-align:center}
#overlay h1{font-size:34px;margin-bottom:8px}
#overlay p{font-size:14px;color:#aab;line-height:1.8;margin-bottom:6px;max-width:340px}
#overlay .big{font-size:20px;color:#ffd54f;margin:10px 0}
.startbtn{margin-top:14px;min-width:200px;height:56px;border-radius:28px;border:none;background:linear-gradient(135deg,#8D6E63,#4e342e);color:#fff;font-size:20px;font-weight:700;cursor:pointer}
.startbtn:active{transform:scale(.95)}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <div class="grp"><span>🪵 <b id="score">0</b> 桩</span><span style="color:#8a90b8;font-size:13px">最高 <b id="hs">0</b></span></div>
    <div class="grp">
      <button class="ibtn" id="muteBtn" aria-label="静音">🔊</button>
      <button class="ibtn" id="pauseBtn" aria-label="暂停">⏸</button>
    </div>
  </div>
  <canvas id="cv"></canvas>
  <div id="hint">👈 点左半屏跳左上桩 ｜ 点右半屏跳右上桩 👉<br>看准↖↗箭头！桩不再严格左右交替，木桩会下沉</div>
  <div id="overlay">
    <h1>🪵 梅花桩</h1>
    <p id="ovText">轻功水上漂，脚下是梅花桩！<br>看清<span style="color:#ffd54f">下一根桩在左还是右</span>：点<b>左半屏</b>跳向左上桩，点<b>右半屏</b>跳向右上桩。<br>跳错方向、或脚下木桩下沉消失，就会掉落。<span style="color:#ff8a80">桩不再严格左右交替，看准箭头再跳！</span><br>跳过的桩越多，桩沉得越快！</p>
    <div class="big hidden" id="ovScore"></div>
    <button class="startbtn" id="startBtn">开始游戏</button>
  </div>
</div>
<script>
'use strict';
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const scoreEl=document.getElementById('score'),hsEl=document.getElementById('hs');
const overlay=document.getElementById('overlay'),ovText=document.getElementById('ovText'),ovScore=document.getElementById('ovScore');
const startBtn=document.getElementById('startBtn'),pauseBtn=document.getElementById('pauseBtn'),muteBtn=document.getElementById('muteBtn');
let W=0,H=0;
function resize(){const r=cv.getBoundingClientRect();const dpr=Math.min(2,window.devicePixelRatio||1);W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);}
window.addEventListener('resize',resize);
// 音效
let actx=null;let muted=localStorage.getItem('g100_sound')==='1';
function ac(){if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(actx&&actx.state==='suspended')actx.resume();return actx;}
function tone(f,dur,type,vol,slideTo){if(muted)return;const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,a.currentTime);if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,a.currentTime+dur);g.gain.setValueAtTime(vol||.2,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+dur);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+dur);}
const sJump=()=>tone(300,.18,'sine',.18,700);
const sLand=()=>tone(180,.1,'triangle',.25,90);
const sFall=()=>tone(500,.7,'sawtooth',.2,80);
const sMile=()=>{[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.12,'triangle',.18),i*80));};
const sStart=()=>{[392,523,659].forEach((f,i)=>setTimeout(()=>tone(f,.12,'triangle',.18),i*90));};
const sOver=()=>{[330,247,165].forEach((f,i)=>setTimeout(()=>tone(f,.25,'triangle',.2),i*160));};
function vibrate(p){try{if(navigator.vibrate)navigator.vibrate(p);}catch(e){}}
// 状态
let state='menu',jumps=0,best=0,cur=0,scroll=0,shake=0,camY=0,pileSeq=0,lastScoredId=-1;
let piles=[],jumping=null,parts=[],floats=[],fallAnim=null;
const KEY='g100_plumpile_hs';
try{best=parseInt(localStorage.getItem(KEY)||'0',10)||0;}catch(e){}
hsEl.textContent=best;
function px(side){return side===0?W*0.26:W*0.74;}
function py(){return H*0.62;}
function stabMax(){return Math.max(0.8,2.2-jumps*.04);}
function scrollSpd(){return Math.min(50+jumps*2.2,150);}
function genPile(){const last=piles[piles.length-1];const prev2=piles.length>=2?piles[piles.length-2]:null;
  let side;
  if(prev2&&prev2.side===last.side)side=1-last.side; // 最多连续两根同侧
  else side=Math.random()<0.22?last.side:1-last.side; // 22% 概率同侧：无脑左右连点会跳错，防刷分
  const y=last.y-(92+Math.random()*42);piles.push({id:pileSeq++,side,y,stab:stabMax(),state:'ok',sinkT:0});}
function startGame(){state='playing';jumps=0;cur=0;scroll=0;shake=0;camY=0;pileSeq=0;lastScoredId=-1;piles=[];jumping=null;parts=[];floats=[];fallAnim=null;
  piles.push({id:pileSeq++,side:Math.random()<.5?0:1,y:py(),stab:stabMax(),state:'ok',sinkT:0});
  for(let i=0;i<8;i++)genPile();
  scoreEl.textContent='0';overlay.classList.add('hidden');pauseBtn.textContent='⏸';sStart();}
function gameOver(reason){state='over';sOver();vibrate([150,80,150]);shake=.4;
  if(jumps>best){best=jumps;try{localStorage.setItem(KEY,String(best));}catch(e){}hsEl.textContent=best;}
  ovText.innerHTML=reason==='wrong'?'跳错了方向，一脚踏空……':reason==='late'?'脚下木桩沉没了……':'失足跌落……';
  ovScore.classList.remove('hidden');ovScore.textContent='跳过 '+jumps+' 桩 ｜ 最高 '+best;startBtn.textContent='再来一局';overlay.classList.remove('hidden');}
function togglePause(){if(state==='playing'){state='paused';pauseBtn.textContent='▶️';ovText.innerHTML='已暂停，桩还等着你。';ovScore.classList.add('hidden');startBtn.textContent='继续';overlay.classList.remove('hidden');}else if(state==='paused'){state='playing';overlay.classList.add('hidden');pauseBtn.textContent='⏸';}}
startBtn.addEventListener('click',()=>{if(state==='paused')togglePause();else startGame();});
pauseBtn.addEventListener('click',togglePause);
function updateMute(){muteBtn.textContent=muted?'🔇':'🔊';}
muteBtn.addEventListener('click',()=>{muted=!muted;try{localStorage.setItem('g100_sound',muted?'1':'0');}catch(e){}updateMute();if(!muted)tone(600,.1,'sine',.15);});
updateMute();
function dust(x,y,n){for(let i=0;i<n;i++){parts.push({x:x+(Math.random()-.5)*30,y,vx:(Math.random()-.5)*80,vy:-40-Math.random()*80,life:.5+Math.random()*.4,t:0,sz:2+Math.random()*3,col:'#c9a227'});}}
function doJump(side){if(state!=='playing'||jumping||fallAnim)return;
  const next=piles[cur+1];const fx=px(piles[cur].side),fy=piles[cur].y;
  const ok=next&&next.side===side&&next.state==='ok';
  const reason=!next||next.state!=='ok'?'late':'wrong';
  const tx=px(side),ty=ok?next.y:fy-120;
  sJump();jumping={fx,fy,tx,ty,t:0,dur:.24,ok:!!ok,reason};
}
cv.addEventListener('pointerdown',e=>{if(state!=='playing')return;const r=cv.getBoundingClientRect();const x=e.clientX-r.left;doJump(x<W/2?0:1);});
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')doJump(0);if(e.key==='ArrowRight')doJump(1);if((e.key===' '||e.key==='Enter')&&(state==='menu'||state==='over'))startGame();});
let last=0;
// 相机跟随：玩家世界坐标，相机让玩家始终固定在屏幕 62% 高度处
function playerWorldY(){if(fallAnim)return fallAnim.y;if(jumping){const j=jumping;const k=Math.min(1,j.t/j.dur);const e=1-Math.pow(1-k,3);return j.fy+(j.ty-j.fy)*e-Math.sin(k*Math.PI)*52;}if(piles[cur])return piles[cur].y;return null;}
function drawPile(p,sy){const x=px(p.side),y=sy;let alpha=1,dy=0;
  if(p.state==='sinking'){const k=p.sinkT/.5;alpha=1-k;dy=k*60;}
  ctx.save();ctx.globalAlpha=Math.max(0,alpha);
  ctx.fillStyle='#5d4037';const w=54,h=20;
  ctx.beginPath();ctx.roundRect(x-w/2,y-h/2+dy,w,h,8);ctx.fill();
  ctx.fillStyle='#8D6E63';ctx.beginPath();ctx.roundRect(x-w/2,y-h/2+dy-5,w,h,8);ctx.fill();
  ctx.font='15px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🪵',x,y-4+dy);
  // 下一桩提示箭头
  ctx.restore();}
function loop(ts){requestAnimationFrame(loop);const dt=Math.min(.05,(ts-last)/1000||0);last=ts;
  ctx.clearRect(0,0,W,H);
  if(shake>0){shake-=dt;ctx.save();ctx.translate((Math.random()-.5)*shake*24,(Math.random()-.5)*shake*24);}else ctx.save();
  // 背景山水
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#141a2e');g.addColorStop(1,'#0a0c14');ctx.fillStyle=g;ctx.fillRect(-20,-20,W+40,H+40);
  ctx.globalAlpha=.12;ctx.fillStyle='#3a4066';for(let i=0;i<4;i++){ctx.beginPath();ctx.arc(W*(0.15+i*0.25),H*0.25+Math.sin(ts/2000+i)*8,50+i*12,0,Math.PI*2);ctx.fill();}ctx.globalAlpha=1;
  if(state==='playing'&&!jumping&&!fallAnim){
    scroll=scrollSpd();for(const p of piles)p.y+=scroll*dt;
    const c=piles[cur];if(c){c.stab-=dt;if(c.stab<=0&&c.state==='ok'){c.state='sinking';c.sinkT=0;}}
    // 移除过低桩
    while(piles.length&&piles[0].y>H+60){piles.shift();cur--;}
    if(cur<0){gameOver('late');}
    while(piles.length<cur+9)genPile();
    // 脚下桩沉没 -> 掉落
    const cc=piles[cur];
    if(cc&&cc.state==='sinking'&&!fallAnim&&state==='playing'){fallAnim={x:px(cc.side),y:cc.y,vy:0};}
  }
  // sinking 动画
  for(const p of piles)if(p.state==='sinking'){p.sinkT+=dt;}
  // 相机跟随：玩家固定在屏幕 62% 高度，世界（桩）随玩家滚动，保证玩家永远可见
  if(state==='playing'){const pyw=playerWorldY();if(pyw!==null){const target=pyw-H*0.62;camY+=(target-camY)*Math.min(1,dt*8);}}
  // 画桩
  for(const p of piles)drawPile(p,p.y-camY);
  // 当前桩稳定度光环 + 下一桩箭头
  if(state==='playing'&&piles[cur]){const c=piles[cur],x=px(c.side),y=c.y-camY;
    const k=Math.max(0,c.stab/stabMax());
    ctx.strokeStyle=k>.4?'#8D6E63':'#EF5350';ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y,34,-Math.PI/2,-Math.PI/2+Math.PI*2*k);ctx.stroke();
    const nx=piles[cur+1];if(nx&&nx.state==='ok'){const ny=nx.y-camY;const bl=Math.abs(Math.sin(ts/200))>.35;if(bl){ctx.font='22px serif';ctx.textAlign='center';ctx.fillText(nx.side===0?'↖️':'↗️',px(nx.side),ny-30);}}}
  // 玩家
  let pxp=null,pyp=null;
  if(fallAnim){fallAnim.vy+=900*dt;fallAnim.y+=fallAnim.vy*dt;pxp=fallAnim.x;pyp=fallAnim.y-camY;
    if(fallAnim.y>H+60){gameOver(fallAnim.reason||'late');fallAnim=null;}
  }else if(jumping){const j=jumping;j.t+=dt;const k=Math.min(1,j.t/j.dur);const e=1-Math.pow(1-k,3);
    pxp=j.fx+(j.tx-j.fx)*e;pyp=j.fy+(j.ty-j.fy)*e-Math.sin(k*Math.PI)*52-camY;
    if(k>=1){if(j.ok){cur++;const landed=piles[cur];dust(pxp,pyp+8,10);sLand();
        if(landed&&landed.id!==lastScoredId){lastScoredId=landed.id;jumps++;scoreEl.textContent=jumps;floats.push({x:pxp,y:pyp-34,text:'+1',life:.7,t:0,col:'#ffd54f'});
        if(jumps>best){best=jumps;hsEl.textContent=best;try{localStorage.setItem(KEY,String(best));}catch(e){}}
        if(jumps%15===0){sMile();floats.push({x:pxp,y:pyp-58,text:'轻功渐入佳境！',life:1.2,t:0,col:'#8D6E63'});}}
        jumping=null;
      }else{fallAnim={x:j.tx,y:j.ty,vy:-60,reason:j.reason||'wrong'};sFall();vibrate(120);jumping=null;}}}
  else if(piles[cur]){pxp=px(piles[cur].side);pyp=piles[cur].y-camY;}
  if(pxp!==null){ctx.font='38px serif';ctx.textAlign='center';ctx.textBaseline='middle';const wob=jumping?Math.sin(ts/60)*4:Math.sin(ts/300)*2;ctx.fillText('🧍',pxp,pyp-30+wob);}
  // 粒子
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.t+=dt;if(p.t>p.life){parts.splice(i,1);continue;}p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=260*dt;const k=1-p.t/p.life;ctx.globalAlpha=k;ctx.fillStyle=p.col;ctx.fillRect(p.x-p.sz/2,p.y-p.sz/2,p.sz,p.sz);ctx.globalAlpha=1;}
  ctx.textAlign='center';for(let i=floats.length-1;i>=0;i--){const f=floats[i];f.t+=dt;if(f.t>f.life){floats.splice(i,1);continue;}const k=1-f.t/f.life;ctx.globalAlpha=k;ctx.font='bold 19px sans-serif';ctx.fillStyle=f.col;ctx.fillText(f.text,f.x,f.y-f.t*40);ctx.globalAlpha=1;}
  ctx.restore();}
resize();requestAnimationFrame(loop);
</script>
</body>
</html>
