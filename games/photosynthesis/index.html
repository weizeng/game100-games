<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>光合作用</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{background:radial-gradient(1200px 800px at 50% -10%,#16243f 0%,#0a0f1e 60%,#060a14 100%);color:#eef4ea;font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;min-height:100vh;user-select:none;-webkit-user-select:none;touch-action:manipulation;}
#app{max-width:520px;margin:0 auto;padding:10px 14px 40px;}
#topbar{display:flex;align-items:center;gap:8px;padding:6px 2px;}
#game-title{flex:1;font-weight:800;font-size:18px;}
.icon-btn{width:44px;height:44px;font-size:20px;border-radius:12px;background:#1b2740;border:1px solid #2c3d63;color:#fff;cursor:pointer;}
.icon-btn:active{transform:scale(.93);}
.screen{animation:fadeUp .45s cubic-bezier(.22,.9,.3,1.15);}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}
.hidden{display:none !important;}
.card{background:rgba(20,30,55,.88);border:1px solid #2c3d63;border-radius:18px;padding:22px 18px;margin-top:12px;box-shadow:0 8px 30px rgba(0,0,0,.45);}
.card.narrow{width:78%;text-align:center;}
.big-emoji{font-size:52px;text-align:center;}
h1{text-align:center;margin:10px 0;}
h2{font-size:19px;}
h3{margin:14px 0 6px;}
.how{line-height:1.9;font-size:15px;color:#c9d6c2;}
.btn{display:block;width:100%;min-height:48px;margin:12px 0 0;border:none;border-radius:14px;font-size:17px;font-weight:800;color:#0b2410;background:linear-gradient(180deg,#b9e39a,#7cb342);cursor:pointer;box-shadow:0 4px 14px rgba(124,179,66,.35);transition:transform .12s ease;}
.btn:active{transform:scale(.96);}
.btn.primary{background:linear-gradient(180deg,#c5e1a5,#8BC34A);}
.opt{background:#22314f;color:#fff;text-align:left;padding:6px 16px;box-shadow:none;border:1px solid #33456b;}
.opt.ok{background:linear-gradient(180deg,#a5d6a7,#66bb6a);color:#0b2410;border-color:#66bb6a;}
.opt.no{background:linear-gradient(180deg,#ef9a9a,#e57373);color:#3d0c0c;border-color:#e57373;animation:shake .4s;}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-7px);}75%{transform:translateX(7px);}}
.prog{color:#9fb3c8;font-size:14px;margin-bottom:6px;}
#formula{background:#101b30;border:1px solid #2c3d63;border-radius:14px;padding:12px;text-align:center;font-size:16px;font-weight:700;margin-top:10px;line-height:1.8;}
#formula .cond{color:#ffd54f;font-size:13px;display:block;}
#round-info{text-align:center;margin:10px 0;font-size:15px;color:#c9d6c2;}
#round-info b{color:#fff;}
#beaker{position:relative;height:250px;border:3px solid #5b7ba5;border-top:1px solid #3d5578;border-radius:6px 6px 26px 26px;background:linear-gradient(180deg,rgba(90,150,210,.10) 0%,rgba(60,120,190,.38) 100%);overflow:hidden;margin:6px 0 4px;}
#bubbles{position:absolute;inset:0;overflow:hidden;pointer-events:none;}
.bubble{position:absolute;bottom:64px;border-radius:50%;background:radial-gradient(circle at 32% 30%,rgba(255,255,255,.95),rgba(150,205,255,.30) 70%);border:1px solid rgba(210,235,255,.65);will-change:transform,opacity;}
#plant{position:absolute;bottom:6px;left:50%;font-size:62px;transform-origin:50% 100%;animation:sway 3.2s ease-in-out infinite;pointer-events:none;}
@keyframes sway{0%,100%{transform:translateX(-50%) rotate(-7deg);}50%{transform:translateX(-50%) rotate(7deg);}}
#rate-line{text-align:center;font-size:14px;color:#9fb3c8;margin:8px 0 2px;min-height:22px;}
#rate-line b{color:#aed581;}
.slider-row{margin:6px 0;}
.slider-row label{display:flex;justify-content:space-between;font-size:15px;margin-bottom:2px;}
.slider-row label b{color:#ffd54f;}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:48px;background:transparent;margin:0;cursor:pointer;}
input[type=range]::-webkit-slider-runnable-track{height:12px;border-radius:6px;background:linear-gradient(90deg,#22314f,#3d5a99);}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:36px;height:36px;margin-top:-12px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff9c4,#ffb300 70%);box-shadow:0 2px 10px rgba(0,0,0,.55);border:2px solid rgba(255,255,255,.5);}
input[type=range]::-moz-range-track{height:12px;border-radius:6px;background:#3d5a99;}
input[type=range]::-moz-range-thumb{width:34px;height:34px;border-radius:50%;background:#ffb300;border:2px solid rgba(255,255,255,.5);}
#s-co2::-webkit-slider-thumb{background:radial-gradient(circle at 35% 35%,#e1f5fe,#0288d1 70%);}
#s-co2::-moz-range-thumb{background:#0288d1;}
.score-line{text-align:center;font-size:19px;margin:8px 0;}
.score-line b{color:#ffd54f;font-size:26px;}
.score-line.dim{font-size:15px;color:#9fb3c8;}
.score-line .sub{font-size:14px;color:#9fb3c8;}
.concl{line-height:1.9;font-size:15px;color:#d7e2cf;padding-left:20px;margin:6px 0 4px;}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(16px);background:#22314f;border:1px solid #3d5a99;color:#fff;padding:12px 20px;border-radius:14px;font-size:15px;font-weight:700;opacity:0;transition:opacity .3s ease,transform .3s ease;z-index:60;pointer-events:none;max-width:86%;text-align:center;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.overlay{position:fixed;inset:0;background:rgba(4,7,15,.72);display:flex;align-items:center;justify-content:center;z-index:50;animation:fadeUp .25s ease;}
.p{position:fixed;width:9px;height:9px;border-radius:50%;pointer-events:none;z-index:99;animation:part .8s cubic-bezier(.2,.7,.4,1) forwards;}
@keyframes part{to{transform:translate(var(--tx),var(--ty)) scale(.15);opacity:0;}}
.ft{position:fixed;font-weight:800;font-size:24px;pointer-events:none;z-index:99;transform:translate(-50%,-50%);text-shadow:0 2px 6px rgba(0,0,0,.6);animation:floatUp 1.1s ease-out forwards;}
@keyframes floatUp{to{transform:translate(-50%,-170%);opacity:0;}}
</style>
</head>
<body>
<div id="app">
<header id="topbar">
<span id="game-title">☀️ 光合作用</span>
<button id="btn-mute" class="icon-btn" aria-label="静音开关">🔊</button>
<button id="btn-pause" class="icon-btn" aria-label="暂停">⏸</button>
</header>

<section id="scr-start" class="screen">
<div class="card">
<div class="big-emoji">☀️🌱🫧</div>
<h1>光合作用</h1>
<p class="how">🔬 <b>虚拟实验室</b>：烧杯里有一株水生植物。<br>👆 拖动滑杆调节 <b>光照强度</b> 和 <b>CO₂ 浓度</b>，植物会释放氧气气泡上升。<br>⏱ 每轮 <b>30 秒</b>，共 <b>3 轮</b>，收集尽可能多的氧气（mL）！<br>💡 产氧速率取决于 <b>min(光照, CO₂)</b> —— 找出限制因素！<br>📝 实验后还有 3 道挑战题，每题 10 分。</p>
<button id="btn-start" class="btn primary">开始实验</button>
</div>
</section>

<section id="scr-game" class="screen hidden">
<div id="formula">CO₂ ＋ H₂O <span class="cond">—（光能 / 叶绿体）→</span> 有机物 ＋ O₂</div>
<div id="round-info">第 <b id="round-num">1</b> / 3 轮 · ⏱ <b id="time-left">30</b>s · 🫧 已收集 <b id="o2">0.0</b> mL</div>
<div id="beaker">
<div id="bubbles"></div>
<div id="plant">🌿</div>
</div>
<div id="rate-line">⚗️ 产氧速率 <b id="rate">0.0</b> mL/s · <span id="limiting"></span></div>
<div class="slider-row">
<label for="s-light">💡 光照强度 <b id="v-light">50</b></label>
<input id="s-light" type="range" min="0" max="100" value="50">
</div>
<div class="slider-row">
<label for="s-co2">🫧 CO₂ 浓度 <b id="v-co2">50</b></label>
<input id="s-co2" type="range" min="0" max="100" value="50">
</div>
</section>

<section id="scr-quiz" class="screen hidden">
<div class="card">
<div id="quiz-progress" class="prog"></div>
<h2 id="quiz-q"></h2>
<div id="quiz-opts"></div>
</div>
</section>

<section id="scr-end" class="screen hidden">
<div class="card">
<div class="big-emoji">🎉</div>
<h1>实验完成</h1>
<div id="final-score" class="score-line"></div>
<div id="final-hs" class="score-line dim"></div>
<h3>📝 实验结论</h3>
<ul id="conclusion" class="concl"></ul>
<button id="btn-again" class="btn primary">再来一次</button>
</div>
</section>

<div id="pause-ov" class="overlay hidden">
<div class="card narrow">
<h2>⏸ 已暂停</h2>
<button id="btn-resume" class="btn primary">继续</button>
</div>
</div>
<div id="toast" class="hidden"></div>
<div id="fx"></div>
</div>
<script>'use strict';
const $=function(id){return document.getElementById(id);};
const LS_HS='g100_photosynthesis_hs';
const LS_MUTE='g100_mute';
let muted=false;
try{muted=localStorage.getItem(LS_MUTE)==='1';}catch(e){}
function vib(p){try{if(navigator.vibrate){navigator.vibrate(p);}}catch(e){}}
let AC=null;
function ac(){try{if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(C){AC=new C();}}if(AC&&AC.state==='suspended'){AC.resume();}}catch(e){}return AC;}
function tone(f,d,type,v,dl){if(muted){return;}const a=ac();if(!a){return;}try{const t=a.currentTime+(dl||0);const o=a.createOscillator();const g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.05);}catch(e){}}
function sClick(){tone(620,0.07,'square',0.08,0);}
function sGood(){tone(523,0.12,'sine',0.2,0);tone(784,0.2,'sine',0.2,0.1);}
function sBad(){tone(170,0.28,'sawtooth',0.16,0);}
function sWin(){const fs=[523,659,784,1047];for(let i=0;i<fs.length;i++){tone(fs[i],0.22,'triangle',0.2,i*0.12);}}
function sPop(){tone(700+Math.random()*600,0.05,'sine',0.04,0);}
function burst(x,y,c){const layer=$('fx');for(let i=0;i<14;i++){const s=document.createElement('span');s.className='p';const ang=Math.random()*6.283;const dist=40+Math.random()*70;s.style.setProperty('--tx',(Math.cos(ang)*dist).toFixed(1)+'px');s.style.setProperty('--ty',(Math.sin(ang)*dist).toFixed(1)+'px');s.style.background=c||'#8BC34A';s.style.left=x+'px';s.style.top=y+'px';layer.appendChild(s);(function(el){setTimeout(function(){el.remove();},800);})(s);}}
function floatText(txt,x,y,c){const layer=$('fx');const s=document.createElement('span');s.className='ft';s.textContent=txt;s.style.left=x+'px';s.style.top=y+'px';s.style.color=c||'#fff';layer.appendChild(s);setTimeout(function(){s.remove();},1200);}
function centerOf(el){const r=el.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2};}
let toastH=null;
function toast(msg,ms){const t=$('toast');t.textContent=msg;t.classList.remove('hidden');requestAnimationFrame(function(){t.classList.add('show');});if(toastH){clearTimeout(toastH);}toastH=setTimeout(function(){t.classList.remove('show');setTimeout(function(){t.classList.add('hidden');},350);},ms||1600);}
const SCREENS=['scr-start','scr-game','scr-quiz','scr-end'];
function show(id){for(let i=0;i<SCREENS.length;i++){$(SCREENS[i]).classList.toggle('hidden',SCREENS[i]!==id);}try{window.scrollTo(0,0);}catch(e){}}
function refreshMute(){$('btn-mute').textContent=muted?'🔇':'🔊';}
function toggleMute(){muted=!muted;try{localStorage.setItem(LS_MUTE,muted?'1':'0');}catch(e){}refreshMute();if(!muted){sClick();}}
let paused=false;
let phase='start';
function setPaused(p){if(phase!=='game'&&phase!=='quiz'){return;}paused=p;$('pause-ov').classList.toggle('hidden',!p);if(p){sClick();}}
const QUIZ=[
{q:'光合作用的原料是什么？',opts:['二氧化碳和水','氧气和有机物','光能和叶绿体'],a:0},
{q:'光合作用的产物是什么？',opts:['二氧化碳和水','有机物和氧气','氮气和氢气'],a:1},
{q:'光照很强、但 CO₂ 浓度很低时，限制因素是？',opts:['光照强度','CO₂ 浓度','温度'],a:1}
];
const CONCL=[
'条件：需要光能和叶绿体（公式中的 光能/叶绿体）',
'原料：二氧化碳（CO₂）＋ 水（H₂O）',
'产物：有机物（养料）＋ 氧气（O₂）',
'影响因素：光照强度、CO₂ 浓度、温度；速率由“最短板”（限制因素）决定'
];
let round=1,timeLeft=30,totalO2=0,light=50,co2=50,quizIdx=0,quizScore=0,roundActive=false,spawnAcc=0;
function minLC(){return light<co2?light:co2;}
function updLabels(){$('v-light').textContent=light;$('v-co2').textContent=co2;}
function startGame(){round=1;totalO2=0;quizScore=0;quizIdx=0;light=50;co2=50;$('s-light').value='50';$('s-co2').value='50';updLabels();paused=false;$('pause-ov').classList.add('hidden');phase='game';show('scr-game');startRound();}
function startRound(){timeLeft=30;roundActive=true;spawnAcc=0;$('round-num').textContent=round;$('bubbles').innerHTML='';toast('第 '+round+' / 3 轮开始，收集氧气吧 🫧');}
function endRound(){roundActive=false;if(round<3){toast('第 '+round+' 轮结束！');round++;setTimeout(startRound,1200);}else{toast('实验结束，进入挑战环节！');setTimeout(startQuiz,1200);}}
function spawnBubble(){const layer=$('bubbles');const b=document.createElement('div');b.className='bubble';const sz=6+Math.random()*9;b.style.width=sz+'px';b.style.height=sz+'px';b.style.left=(42+Math.random()*16)+'%';b._age=0;b._life=1.5+Math.random()*0.8;b._H=190+Math.random()*30;b._wx=(Math.random()-0.5)*30;layer.appendChild(b);if(Math.random()<0.25){sPop();}}
function update(dt){
if(!roundActive){return;}
timeLeft-=dt;
const m=minLC();
totalO2+=dt*2.0*m/100;
spawnAcc+=dt*(0.6+9*m/100);
while(spawnAcc>=1){spawnAcc-=1;spawnBubble();}
$('time-left').textContent=Math.max(0,Math.ceil(timeLeft));
$('o2').textContent=totalO2.toFixed(1);
$('rate').textContent=(2.0*m/100).toFixed(1);
$('limiting').textContent=light<co2?'限制因素：💡 光照强度':(co2<light?'限制因素：🫧 CO₂ 浓度':'💡🫧 两者均衡');
const bl=$('bubbles').children;
for(let i=bl.length-1;i>=0;i--){const b=bl[i];b._age+=dt;const p=b._age/b._life;if(p>=1){b.remove();continue;}const sc=p<0.15?p/0.15:1;b.style.transform='translate('+b._wx*p+'px,'+(-b._H*p*p).toFixed(1)+'px) scale('+sc.toFixed(2)+')';b.style.opacity=p>0.7?(1-(p-0.7)/0.3).toFixed(2):'1';}
if(timeLeft<=0){timeLeft=0;endRound();}
}
let lastT=0;
function loop(t){requestAnimationFrame(loop);if(paused){lastT=t;return;}let dt=(t-lastT)/1000;lastT=t;if(!(dt>0)||dt>0.05){dt=0.016;}if(phase==='game'){update(dt);}}
function startQuiz(){phase='quiz';quizIdx=0;show('scr-quiz');renderQuiz();}
function renderQuiz(){const q=QUIZ[quizIdx];$('quiz-progress').textContent='挑战 '+(quizIdx+1)+' / '+QUIZ.length+'（每题 10 分）';$('quiz-q').textContent=q.q;const box=$('quiz-opts');box.innerHTML='';for(let i=0;i<q.opts.length;i++){(function(i){const b=document.createElement('button');b.className='btn opt';b.textContent=q.opts[i];b.addEventListener('pointerdown',function(e){e.preventDefault();answerQuiz(i,b);});box.appendChild(b);})(i);}}
function answerQuiz(i,btn){const q=QUIZ[quizIdx];const box=$('quiz-opts');const kids=box.children;for(let k=0;k<kids.length;k++){kids[k].style.pointerEvents='none';}const c=centerOf(btn);
if(i===q.a){quizScore+=10;sGood();vib(40);btn.classList.add('ok');burst(c.x,c.y,'#8BC34A');floatText('+10',c.x,c.y-8,'#AED581');}
else{sBad();vib([70,40,70]);btn.classList.add('no');kids[q.a].classList.add('ok');}
setTimeout(function(){quizIdx++;if(quizIdx<QUIZ.length){renderQuiz();}else{endGame();}},1200);}
function endGame(){phase='end';const o2=Math.round(totalO2);const score=o2+quizScore;let hs=0;try{hs=parseInt(localStorage.getItem(LS_HS)||'0',10)||0;}catch(e){}const isNew=score>hs;if(isNew){hs=score;try{localStorage.setItem(LS_HS,String(hs));}catch(e){}}
$('final-score').innerHTML='🏆 本次得分：<b>'+score+'</b><br><span class="sub">氧气 '+o2+' mL ＋ 答题 '+quizScore+' 分</span>';
$('final-hs').textContent='📈 历史最高：'+hs+(isNew?'（新纪录 🎉）':'');
const ul=$('conclusion');ul.innerHTML='';for(let i=0;i<CONCL.length;i++){const li=document.createElement('li');li.textContent=CONCL[i];ul.appendChild(li);}
show('scr-end');sWin();vib([50,50,120]);}
function bind(id,fn){$(id).addEventListener('pointerdown',function(e){e.preventDefault();fn();});}
bind('btn-start',function(){sClick();startGame();});
bind('btn-mute',toggleMute);
bind('btn-pause',function(){setPaused(true);});
bind('btn-resume',function(){sClick();setPaused(false);});
bind('btn-again',function(){sClick();startGame();});
$('s-light').addEventListener('input',function(){light=parseInt(this.value,10);updLabels();});
$('s-co2').addEventListener('input',function(){co2=parseInt(this.value,10);updLabels();});
document.addEventListener('contextmenu',function(e){e.preventDefault();});
document.addEventListener('dblclick',function(e){e.preventDefault();});
refreshMute();updLabels();show('scr-start');
requestAnimationFrame(loop);
</script>
</body>
</html>
