<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>小丑牌局</title>
<link rel="icon" href="data:,">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{display:flex;justify-content:center;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.wrap{width:100%;max-width:480px;height:100%;padding:12px;display:flex;flex-direction:column;align-items:center;gap:10px}
.topbar{width:100%;display:flex;justify-content:space-between;align-items:center;flex-wrap:nowrap!important}
.topbar .stat{display:flex;gap:8px;align-items:center;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:13px}
.topbar .tools{display:flex;gap:6px}
.topbar .tools .iconbtn{min-width:44px;min-height:44px;padding:0 6px}
.stagebox{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
#cv{touch-action:none;display:block}
.overlay{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;z-index:20;padding:24px;text-align:center}
.overlay.hidden{display:none!important}
.lvgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:100%}
.lvgrid .lvl{min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:17px;padding:4px!important;line-height:1.1}
.lvgrid .lvl small{font-size:10px;letter-spacing:-1px;margin-top:2px}
.rowbtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:100%}
#tutStep{font-size:12px;opacity:.7}
#toast{position:fixed;left:50%;top:16%;transform:translate(-50%,-10px);background:rgba(10,8,30,.88);color:#fff;font-weight:800;padding:10px 18px;border-radius:999px;z-index:999;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;font-size:15px;box-shadow:0 0 18px rgba(255,61,154,.5);white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
.hidden{display:none!important}
.btn.ghost.on,.btn.ghost[aria-pressed="true"]{outline:3px solid #ff3d9a!important;outline-offset:-3px;filter:brightness(1.08)}
.rowbtns .iconbtn{flex:0 0 auto!important;min-width:48px!important;min-height:48px!important}

.ctl{width:100%;display:flex;gap:8px}
.ctl button{flex:1;min-height:52px;font-size:16px;padding:4px 6px!important;line-height:1.15}
.ctl button small{display:block;font-size:11px;opacity:.85}
#shopScr .shop{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:420px}
#shopScr .it{min-height:84px;padding:6px!important;font-size:13px;line-height:1.25;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
#shopScr .it b{font-size:15px}#shopScr .it i{font-style:normal;font-size:11px;opacity:.9}
#shopScr .own{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;width:100%}
#shopScr .own button{min-height:48px;min-width:58px;font-size:12px;padding:2px 6px!important;line-height:1.2}
#shopScr h2{margin:0}#shopMoney{font-weight:900}
.deck{min-height:64px!important}
</style>
<!-- GAME UI BEGIN -->
<style>
:root{--page:#172638;--surface:#22374c;--soft:#2e4760;--ink:#f0f6fc;--muted:#b1c6d9;--accent:#f0bc74;--on-accent:#342717;--line:#45637c;--stage:#142438;--page:#0b0620;--surface:#211040;--soft:#33234f;--ink:#fff3fb;--muted:#d4b6dd;--accent:#ff3d9a;--on-accent:#0b0620;--line:#ff3d9a;--b-bg1:#3a0d5e;--b-bg2:#0b0620;--b-btn:#ff3d9a;--b-btn-hi:#ff81bd;--b-edge:#a3124f;--b-glow:#00e5ff;--b-glow-rgb:0,229,255;--b-pedge-rgb:255,61,154;--b-btn-ink:#510927;--b-btn-tsh:0 1px 0 rgba(255,255,255,.45);--b-coin-ink:#510927;--b-coin-tsh:none;--b-key-ink:#00e5ff;--b-title:#ffffff}
/* Shared presentation only; mechanics and state remain inside each standalone game. */
html.game-ui{background:var(--page);color:var(--ink);color-scheme:light;font-family:"Bahnschrift","Microsoft YaHei UI","PingFang SC",sans-serif}
html.game-ui:is([data-theme="space"],[data-theme="arcade"],[data-theme="lab"],[data-theme="ocean"],[data-theme="magic"]){color-scheme:dark}
.game-ui body{background:var(--page);color:var(--ink);font-family:inherit;overscroll-behavior:none}
.game-ui body>.wrap{padding:20px 16px max(20px,env(safe-area-inset-bottom));gap:14px;max-width:500px}
.game-ui #app{background:var(--page);color:var(--ink)}
.game-ui :is(.topbar,#topbar){gap:8px;flex-wrap:wrap;min-height:58px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:10px 12px;box-shadow:0 3px 0 var(--soft);font-size:13px}
.game-ui :is(.title,.tb-title,.tb-title,#topbar .t,.topbar .t){color:var(--ink);font-size:16px;font-weight:750;letter-spacing:0}
.game-ui :is(.topbar,.hud,#hud,#topbar) :is(b,.v){color:var(--accent);font-variant-numeric:tabular-nums}
.game-ui :is(.stat,.topbar .s,.topbar .stat,.scorebar,.stats,.tip,.hint,.hintline,.hsline,.best,.hiscore){color:var(--muted);line-height:1.7}
.game-ui :is(.hint,.hintline,.tip){font-size:12px;max-width:40em;text-wrap:pretty}
.game-ui .scorebar{padding:6px 10px;gap:8px;flex-wrap:wrap}
.game-ui :is(.iconbtn,.iconBtn,.icobtn,.ibtn,.tbtn,.hbtn,.ib,.iconBtn,.pause){min-width:44px;min-height:44px;flex-shrink:0;border-radius:12px;background:var(--soft);color:var(--ink);border:1px solid var(--line);box-shadow:none;font-size:17px}
.game-ui button{font-family:inherit;cursor:pointer;touch-action:manipulation}
.game-ui button:focus-visible,.game-ui [tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.game-ui :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn){background:var(--accent);color:var(--on-accent);border:1px solid transparent;border-radius:13px;min-height:50px;padding:13px 28px;font-size:16px;font-weight:750;letter-spacing:0;box-shadow:0 4px 0 var(--line);text-shadow:none;max-width:100%}
.game-ui :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn):active{box-shadow:none;transform:translateY(2px)}
.game-ui :is(.ghost,.ghostbtn,.btn2,.abtn,.toolbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line);box-shadow:none;border-radius:12px;min-height:44px}
.game-ui :is(.rowbtns,.btnrow,.ctlrow){gap:10px;flex-wrap:wrap;justify-content:center}
.game-ui :is(.pill,.hudbox,.hud .p){background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:none;font-variant-numeric:tabular-nums}
.game-ui :is(.dbtn,.cbtn,.gbtn,.holdbtn,.firebtn,.bombbtn,.jumpbtn,.pumpbtn,.nbtn){border-radius:12px;box-shadow:0 3px 0 var(--line);min-height:44px}
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv,.screen):has(>.ui-panel){padding:20px;overflow-y:auto;overscroll-behavior:contain}
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv):has(>.ui-panel){background:var(--page);backdrop-filter:none;justify-content:safe center;align-items:center}
.game-ui .ui-panel{width:min(100%,380px);max-height:100%;overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:18px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:24px;padding:30px 24px;box-shadow:0 8px 0 var(--soft),0 20px 48px #15253618;text-align:center;margin:auto}
.game-ui .ui-panel :is(.card,.panel,.pausecard,.ovcard){display:contents}
.game-ui .ui-panel :is(h1,h2,.gamename,.gametitle){font-size:30px;line-height:1.25;font-weight:800;color:var(--ink);background:none;-webkit-text-fill-color:currentColor;text-shadow:none;letter-spacing:-.6px;margin:0}
.game-ui .ui-panel :is(p,.howto,.sub,.rule){font-size:14px;line-height:1.85;color:var(--muted);background:none;border:0;box-shadow:none;padding:0;margin:0;max-width:32em;text-align:left;white-space:normal}
.game-ui .ui-panel :is(.bigemoji,.bigemoji,.ic,.big):not(.bigscore){animation:none;filter:none;text-shadow:none}
.game-ui .ui-emblem{width:90px;height:90px;display:grid;place-items:center;border:1px solid var(--line);border-radius:28px;background:var(--soft);font-size:48px;line-height:1;flex-shrink:0;position:relative}
.game-ui[data-theme="wood"] .ui-emblem{border-radius:50%;box-shadow:inset 0 0 0 5px var(--surface),inset 0 0 0 6px var(--line)}
.game-ui[data-theme="wood"] .ui-panel h1{font-family:"STKaiti","KaiTi","Microsoft YaHei",serif;letter-spacing:2px}
.game-ui[data-theme="ice"] .ui-emblem{border-radius:26px 8px 26px 8px}
.game-ui[data-theme="space"] .ui-emblem{background:radial-gradient(circle at center,var(--soft) 42%,transparent 43%),var(--surface);border-radius:50%;outline:1px solid var(--line);outline-offset:7px;margin:7px}
.game-ui[data-theme="kitchen"] .ui-emblem{border-radius:22px;border-bottom:5px solid var(--line)}
.game-ui .ui-panel :is(.score,.bigscore,.bigScore,.scorebig){color:var(--accent);font-size:48px;font-weight:800;font-variant-numeric:tabular-nums}
.game-ui .ui-panel :is(.best,.hsline,.hiscore,.endstats,.endstats b){color:var(--muted);font-size:13px;line-height:1.8}
.game-ui .ui-mode{display:grid;grid-template-columns:1fr 1fr;gap:5px;background:var(--soft);padding:5px;border:1px solid var(--line);border-radius:14px;width:100%}
.game-ui .ui-mode button{min-height:44px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-size:14px;font-weight:700;box-shadow:none}
.game-ui .ui-mode button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 2px 5px #1525361a}
.game-ui .ui-panel .ui-mode-note{font-size:12px;line-height:1.6;text-align:center;color:var(--muted)}
.game-ui .ui-mode-status{display:block;padding:5px 10px;color:var(--accent);font-size:11px;font-weight:700;line-height:1.5;text-align:center;border:1px solid var(--line);border-radius:8px;background:var(--surface);margin:4px auto;max-width:100%;pointer-events:none}
.game-ui body>.wrap>canvas:not(#fx){background-color:var(--stage);box-shadow:0 0 0 1px var(--line),0 6px 0 var(--soft);border-radius:18px;flex-shrink:0}
.game-ui .screen>canvas.game{box-shadow:0 0 0 1px var(--line),0 6px 0 var(--soft)}
.game-ui #hud{gap:6px;background:var(--surface);color:var(--ink)}
.game-ui #hud :is(.left,.t,.s,.grp,.pill){color:var(--ink)}
.game-ui #hud .pill{background:var(--surface);border-color:var(--line)}
.game-ui body canvas:is(#cv,#game,#board){background-color:var(--stage)}
.game-ui :is(button.dbtn,button.cbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.game-ui :is(button.lvl,button.lvlbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line);border-radius:12px;min-height:54px}
.game-ui :is(button.lvl,button.lvlbtn) :is(.nc,.sz,small){color:var(--muted)}
.game-ui .ui-panel button.lvl{margin:0;min-width:44px;box-shadow:none;padding:8px}
.game-ui #hud :is(.left,.right,.hudl,.hbtns){gap:5px;flex-wrap:wrap}
.game-ui #hud :is(.left,.hudl){min-width:0;flex-shrink:1}
.game-ui #hud :is(.pill,.left){font-size:12px}
.game-ui button:disabled{cursor:default;opacity:.45;box-shadow:none}
.game-ui .ui-panel .ui-assist-note{color:var(--accent);font-weight:700}
@media(min-width:700px){.game-ui body>.wrap{padding-top:32px}.game-ui .ui-panel{padding:36px 30px}}
@media(max-width:360px){.game-ui body>.wrap{padding:10px;gap:10px}.game-ui .ui-panel{padding:22px 18px;gap:13px}.game-ui .ui-panel h1{font-size:26px}.game-ui .ui-emblem{width:70px;height:70px;font-size:38px}.game-ui :is(.topbar,#topbar){gap:5px;padding:8px}.game-ui :is(.iconbtn,.icobtn,.ibtn,.tbtn,.ib){min-width:44px;min-height:44px}}
@media(max-height:650px){.game-ui .ui-panel{padding:18px;gap:12px}.game-ui .ui-emblem{width:60px;height:60px;font-size:32px}.game-ui .ui-panel h1{font-size:25px}.game-ui .ui-panel :is(p,.howto,.sub,.rule){font-size:13px}}
@media(prefers-reduced-motion:reduce){.game-ui *, .game-ui *::before,.game-ui *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
/* 2026-10-20 热修：开局/结算遮罩铺满整屏，主按钮固定在面板底部，避免被画布尺寸裁切（#10） */
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv):has(>.ui-panel){position:fixed;inset:0;z-index:1000;border-radius:0;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
.game-ui .ui-panel{touch-action:pan-y}
.game-ui .ui-panel :is(#startBtn,#btnStart,.startbtn,#bStart,#restartBtn,#btnRestart,#againBtn,#btnAgain,#retryBtn,#btnRetry,#playBtn,#btnPlay){position:sticky;bottom:0;z-index:3;flex-shrink:0}
.game-ui .ui-panel :not(.card,.panel,.pausecard,.ovcard,.ui-mode):has(>:is(#startBtn,#btnStart,.startbtn,#bStart,#restartBtn,#btnRestart,#againBtn,#btnAgain,#retryBtn,#btnRetry,#playBtn,#btnPlay)){position:sticky;bottom:0;z-index:3;flex-shrink:0;background:var(--surface);box-shadow:0 -10px 10px -6px var(--surface)}


/* ===== Direction B · 霓虹糖果 Pop Arcade ===== saturated gradients, chunky bevels with a hard bottom edge, sticker panels, neon on dark themes */
html.game-ui[data-skin="b"]{--fb:"HarmonyOS Sans SC","MiSans","OPPOSans","vivo Sans","Noto Sans SC","Noto Sans CJK SC","PingFang SC","Microsoft YaHei UI",system-ui,sans-serif;--bounce:cubic-bezier(.34,1.56,.64,1);--bg:radial-gradient(circle at 12% 18%,rgba(255,255,255,.28) 0 38px,transparent 40px),radial-gradient(circle at 88% 30%,rgba(255,255,255,.16) 0 64px,transparent 66px),radial-gradient(circle at 20% 82%,rgba(255,255,255,.14) 0 52px,transparent 54px),radial-gradient(rgba(255,255,255,.16) 1.5px,transparent 2.2px) 0 0/22px 22px,linear-gradient(165deg,var(--b-bg1),var(--b-bg2));font-family:var(--fb)}
html.game-ui[data-skin="b"],html.game-ui[data-skin="b"] body,html.game-ui[data-skin="b"] #app,html.game-ui[data-skin="b"] :is(.overlay,.ov,#ov,#overlay,#pauseOv):has(>.ui-panel){background:var(--bg);background-color:var(--b-bg2)}
html.game-ui[data-skin="b"] body{min-height:100vh;font-family:var(--fb)}
html.game-ui[data-skin="b"] :is(.hint,.hintline,.tip){color:rgba(255,255,255,.94);text-shadow:0 1px 2px rgba(0,0,0,.35)}
/* Sticker panel: white rim + hard coloured bottom edge + drop */
html.game-ui[data-skin="b"] .ui-panel{background:linear-gradient(180deg,var(--surface),var(--soft));border:4px solid #fff;border-radius:32px;box-shadow:0 9px 0 var(--line),0 9px 0 4px rgba(0,0,0,.08),0 26px 40px rgba(0,0,0,.28);animation:uiB-in .5s var(--bounce) both}
html.game-ui[data-skin="b"] .ui-panel :is(h1,h2,.gamename,.gametitle){font-size:34px;font-weight:900;color:var(--b-title);letter-spacing:0;text-shadow:0 3px 0 var(--line),0 6px 10px rgba(0,0,0,.15)}
html.game-ui[data-skin="b"] .ui-emblem{width:100px;height:100px;border:4px solid #fff;border-radius:50%;background:radial-gradient(circle at 32% 26%,#fff 0 12%,var(--b-glow) 13%,var(--line) 70%,var(--b-edge) 100%);box-shadow:0 7px 0 var(--b-edge),0 16px 24px rgba(0,0,0,.25);font-size:54px;animation:uiB-wobble 2.6s ease-in-out infinite}
html.game-ui[data-skin="b"] .ui-emblem::before,html.game-ui[data-skin="b"] .ui-emblem::after{content:"✦";position:absolute;color:#fff;font-size:20px;text-shadow:0 0 8px var(--b-glow);animation:uiB-twinkle 1.8s ease-in-out infinite}
html.game-ui[data-skin="b"] .ui-emblem::before{top:-10px;right:-14px}
html.game-ui[data-skin="b"] .ui-emblem::after{bottom:4px;left:-18px;font-size:14px;animation-delay:.9s}
html.game-ui[data-skin="b"] .ui-panel :is(.score,.bigscore,.bigScore,.scorebig,#finalScore){font-size:56px;font-weight:900;color:var(--b-btn);-webkit-text-fill-color:currentColor;text-shadow:0 4px 0 var(--b-edge),0 0 2px var(--b-edge),0 10px 16px rgba(0,0,0,.25)}
html.game-ui[data-skin="b"] .ui-panel :is(h1,.gamename)~h2{font-size:19px;text-shadow:0 2px 0 var(--line)}
/* Chunky bevelled button: highlight lip, darker bottom slab, presses down onto the slab */
html.game-ui[data-skin="b"] :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn,button.actBtn):not(.ghost){position:relative}
html.game-ui[data-skin="b"] :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn,button.actBtn):not(.ghost):not(#\#){overflow:hidden;border:0;border-radius:20px;font-weight:900;color:var(--b-btn-ink);background:linear-gradient(180deg,var(--b-btn-hi),var(--b-btn) 52%);text-shadow:var(--b-btn-tsh);box-shadow:inset 0 3px 0 rgba(255,255,255,.55),inset 0 -5px 0 rgba(0,0,0,.14),0 6px 0 var(--b-edge),0 12px 18px rgba(0,0,0,.25);transition:transform .08s,box-shadow .08s}
html.game-ui[data-skin="b"] :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn,button.actBtn):not(.ghost):not(#\#)::before{content:"";position:absolute;left:12px;top:6px;width:22px;height:9px;border-radius:9px;background:rgba(255,255,255,.75);transform:rotate(-12deg);pointer-events:none}
html.game-ui[data-skin="b"] :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn,button.actBtn):not(.ghost):not(#\#):active{transform:translateY(5px);box-shadow:inset 0 3px 0 rgba(255,255,255,.4),inset 0 -2px 0 rgba(0,0,0,.14),0 1px 0 var(--b-edge),0 4px 8px rgba(0,0,0,.2)}
html.game-ui[data-skin="b"] .ui-panel :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn,button.actBtn):not(.ghost):not(#\#){min-height:56px;padding:14px 34px;font-size:19px;letter-spacing:1px}
/* Secondary keys: white candy keys with a coloured slab */
html.game-ui[data-skin="b"] :is(.ghost,.ghostbtn,.btn2,.abtn,.toolbtn,.iconbtn,.iconBtn,.icobtn,.ibtn,.tbtn,.hbtn,.ib,.pause,.dbtn,.cbtn,.nbtn,.lvl,.lvlbtn){border:0;border-radius:16px;background:linear-gradient(180deg,#fff,var(--soft));color:var(--b-key-ink);font-weight:900;box-shadow:inset 0 -3px 0 rgba(0,0,0,.06),0 5px 0 var(--line),0 8px 12px rgba(0,0,0,.18);transition:transform .08s,box-shadow .08s}
html.game-ui[data-skin="b"] :is(.ghost,.ghostbtn,.btn2,.abtn,.toolbtn,.iconbtn,.iconBtn,.icobtn,.ibtn,.tbtn,.hbtn,.ib,.pause,.dbtn,.cbtn,.nbtn,.lvl,.lvlbtn):active{transform:translateY(4px);box-shadow:0 1px 0 var(--line),0 2px 4px rgba(0,0,0,.15)}
html.game-ui[data-skin="b"] :is(.dbtn,.lvl,.lvlbtn):is(.on,.sel,[aria-pressed="true"]){background:linear-gradient(180deg,var(--b-btn-hi),var(--b-btn));color:var(--b-btn-ink);text-shadow:var(--b-coin-tsh);box-shadow:0 5px 0 var(--b-edge),0 8px 12px rgba(0,0,0,.18)}
html.game-ui[data-skin="b"] .ui-mode{background:rgba(0,0,0,.08);border:0;border-radius:18px;padding:5px;box-shadow:inset 0 3px 0 rgba(0,0,0,.08)}
html.game-ui[data-skin="b"] .ui-mode button{border-radius:14px;font-weight:900}
html.game-ui[data-skin="b"] .ui-mode button[aria-pressed="true"]{background:#fff;color:var(--b-key-ink);box-shadow:0 4px 0 var(--line)}
/* HUD: candy capsule bar, numbers in coin badges */
/* HUD keeps a 1px border (same box size as base.css → no layout shift); the thick rim is an inset shadow */
html.game-ui[data-skin="b"] :is(.topbar,#topbar,:is(.wrap,#app,body)>.hud,.stats,#panel){background:linear-gradient(180deg,#fff,var(--soft));border:1px solid #fff;border-radius:22px;box-shadow:inset 0 0 0 2px #fff,0 6px 0 var(--line),0 12px 18px rgba(0,0,0,.2);font-weight:800}
html.game-ui[data-skin="b"] #hud{background:linear-gradient(180deg,rgba(255,255,255,.95),var(--soft));box-shadow:0 5px 0 var(--line),0 10px 16px rgba(0,0,0,.2)}
html.game-ui[data-skin="b"] :is(.topbar,.hud,#hud,#topbar) :is(#score,.score,[id*="score" i]){display:inline-block;min-width:1.6em;text-align:center;padding:0 9px;line-height:inherit;vertical-align:baseline;border-radius:999px;color:var(--b-coin-ink);background:linear-gradient(180deg,var(--b-btn-hi),var(--b-btn));box-shadow:inset 0 -2px 0 rgba(0,0,0,.15),0 2px 0 var(--b-edge);text-shadow:var(--b-coin-tsh);font-weight:900}
html.game-ui[data-skin="b"] :is(.pill,.hudbox,.hud .p){background:#fff;border:0;border-radius:999px;box-shadow:0 4px 0 var(--line);color:var(--ink);font-weight:800;padding:5px 12px}

 R.pile=[];for(let s=0;s<4;s++)for(let r=2;r<=14;r++)R.pile.push({r,s,id:s*13+r});for(let i=R.pile.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[R.pile[i],R.pile[j]]=[R.pile[j],R.pile[i]];}
 R.hand=[];R.sel=[];draw();state='play';msg={t:R.blind===2?R.boss[2]+' '+R.boss[1]+'：'+R.boss[3]:['小盲注','大盲注'][R.blind]+' · 目标 '+R.target,a:2.5};hud();tone(520,.1,'triangle');}
function draw(){const n=handSize();while(R.hand.length<n&&R.pile.length)R.hand.push(R.pile.pop());sortHand();}
function sortHand(){R.hand.sort(sortMode?(a,b)=>a.s-b.s||b.r-a.r:(a,b)=>b.r-a.r||a.s-b.s);}
function debuffed(c){if(R.blind!==2)return false;const b=R.boss[0];return(b==='club'&&c.s===2)||(b==='heart'&&c.s===1)||(b==='crown'&&c.r>10&&c.r<14);}
function evalHand(cs){const n=cs.length;const cnt={};cs.forEach(c=>cnt[c.r]=(cnt[c.r]||0)+1);const groups=Object.entries(cnt).map(([r,k])=>[+r,k]).sort((a,b)=>b[1]-a[1]||b[0]-a[0]);
 const flush=n===5&&cs.every(c=>c.s===cs[0].s);let straight=false;if(n===5&&groups.length===5){const rs=cs.map(c=>c.r).sort((a,b)=>a-b);straight=rs[4]-rs[0]===4||rs.join()==='2,3,4,5,14';}
 let t=0,sc;const g0=groups[0]?groups[0][1]:0,g1=groups[1]?groups[1][1]:0;
 if(straight&&flush){t=8;sc=cs;}else if(g0===4){t=7;sc=cs.filter(c=>c.r===groups[0][0]);}else if(g0===3&&g1>=2){t=6;sc=cs;}else if(flush){t=5;sc=cs;}else if(straight){t=4;sc=cs;}
 else if(g0===3){t=3;sc=cs.filter(c=>c.r===groups[0][0]);}else if(g0===2&&g1===2){t=2;sc=cs.filter(c=>c.r===groups[0][0]||c.r===groups[1][0]);}else if(g0===2){t=1;sc=cs.filter(c=>c.r===groups[0][0]);}
 else{t=0;sc=n?[cs.slice().sort((a,b)=>b.r-a.r)[0]]:[];}
 return{t,sc,has:{pair:g0>=2,three:g0>=3,flush,straight}};}
function scoreOf(cs,handsAfter){const e=evalHand(cs);const h=HT[e.t];let chips=h[1]+h[3]*R.lv[e.t],mult=h[2]+h[4]*R.lv[e.t];
 if(bossOn('flint')){chips=Math.ceil(chips/2);mult=Math.ceil(mult/2);}
 const sc=e.sc.filter(c=>!debuffed(c));sc.forEach(c=>chips+=chipOf(c.r));
 const c={chips,mult,sc,has:e.has,disc:R.disc,hands:handsAfter,nj:R.jokers.length,deckLeft:R.pile.length};
 for(const id of R.jokers){const f=JMAP[id][5];if(f)f(c);}
 let total=Math.floor(c.chips*c.mult);if(bossOn('eye')&&R.used[e.t])total=0;
 return{t:e.t,chips:Math.floor(c.chips),mult:Math.round(c.mult*10)/10,total,sc};}
function selCards(){return R.hand.filter(c=>R.sel.includes(c.id));}
function play(){if(state!=='play'||anim)return;const cs=selCards();if(!cs.length)return toast('先点选 1–5 张牌');if(bossOn('psychic')&&cs.length<5)return toast('🔮 灵媒：必须打出 5 张牌');
 R.hands--;const s=scoreOf(cs,R.hands);R.used[s.t]=1;R.hand=R.hand.filter(c=>!R.sel.includes(c.id));R.sel=[];
 anim={cs,s,t:0};tone(440+s.t*60,.12,'square',.08);
 const fin=()=>{anim=null;R.score+=s.total;R.total+=s.total;if(s.total>save.bestHand){save.bestHand=s.total;Store.set('save',save);}
  for(let i=0;i<14;i++)burst(sparks,W/2,170,['#ffd34d','#ff3d9a','#00e5ff'][i%3],2);tone(880,.15,'triangle');
  if(bossOn('hook')){for(let k=0;k<2&&R.hand.length;k++)R.hand.splice(Math.floor(Math.random()*R.hand.length),1);}
  hud();if(R.score>=R.target)return winBlind();if(R.hands<=0)return loseRun();draw();hud();};
 if(FAST)fin();else setTimeout(fin,850);}
function discard(){if(state!=='play'||anim)return;const cs=selCards();if(!cs.length)return toast('先点选要弃掉的牌');if(R.disc<=0)return toast('没有弃牌次数了');R.disc--;R.hand=R.hand.filter(c=>!R.sel.includes(c.id));R.sel=[];draw();hud();noise(.12,.08,3000);}
function winBlind(){state='won';const reward=[3,4,5][R.blind]+R.hands+Math.min(5,Math.floor(R.money/5))+(hasJ('golden')?4:0);R.money+=reward;
 if(R.blind===2)R.seen.push(R.boss[0]);tone(660,.1,'triangle');tone(990,.2,'triangle',.1,null,.1);
 const finalWin=R.blind===2&&R.ante===8;
 if(R.blind===2){if(R.ante>save.bestAnte){save.bestAnte=R.ante;}if(finalWin)save.wins=(save.wins||0)+1;Store.set('save',save);legacyBest(save.bestAnte*1000);}
 const go=()=>{if(finalWin){$('overH').textContent='🏆 击败小丑王！';$('finalScore').textContent=fmt(R.total);$('overText').innerHTML='8 个底注全部通关！累计得分 '+fmt(R.total)+'<br>新牌组与小丑已解锁。点「无尽模式」继续挑战更高底注。';$('nextBtn').textContent='无尽模式';$('nextBtn').classList.remove('hidden');show('overScr',true);}
  else openShop(reward);};
 FAST?go():setTimeout(go,700);}
function advance(){R.blind++;if(R.blind>2){R.blind=0;R.ante++;pickBoss();}startBlind();}
function loseRun(){state='over';tone(200,.5,'sawtooth',.1,60);if(R.ante-1>save.bestAnte){save.bestAnte=R.ante-1;Store.set('save',save);}
 const go=()=>{$('overH').textContent='💀 筹码耗尽';$('finalScore').textContent=fmt(R.score)+' / '+fmt(R.target);$('overText').innerHTML='止步第 '+R.ante+' 底注 · '+['小盲注','大盲注','首领 '+R.boss[1]][R.blind]+'<br>最佳纪录：第 '+save.bestAnte+' 底注 · 单手最高 '+fmt(save.bestHand)+'<br>提示：倍率型小丑越早买越好，星球牌能永久强化常用牌型。';$('nextBtn').classList.add('hidden');show('overScr',true);};FAST?go():setTimeout(go,600);}
function fmt(n){return n>=1e6?(n/1e6).toFixed(2)+'M':n>=1e4?(n/1e3).toFixed(1)+'K':String(n);}
// ---- 商店 ----
let shop=[];
function rollShop(){const pool=unlockedJ().filter(j=>!R.jokers.includes(j[0]));shop=[];for(let i=0;i<2&&pool.length;i++){const k=Math.floor(Math.random()*pool.length);shop.push({k:'j',j:pool.splice(k,1)[0]});}
 const t1=Math.floor(Math.random()*9);let t2=Math.floor(Math.random()*9);if(t2===t1)t2=(t2+4)%9;shop.push({k:'p',t:t1},{k:'p',t:t2});}
function openShop(reward){state='shop';rollShop();$('shopInfo').innerHTML='过关奖励 +$'+reward+'（含剩余出牌与利息）· 下一个：'+nextName();renderShop();show('shopScr',true);}
function nextName(){const b=R.blind+1>2?0:R.blind+1;return b===2?'首领 '+R.boss[2]+R.boss[1]+'（'+R.boss[3]+'）':['小盲注','大盲注'][b];}
const PL=['🌑冥王星','☿水星','🌍地球','♂火星','♄土星','♃木星','♆海王星','♅天王星','🪐银河'];
function renderShop(){$('shopMoney').textContent=R.money;const box=$('shopItems');box.innerHTML='';
 shop.forEach((it,i)=>{const b=document.createElement('button');b.className='btn ghost it';
  if(it.k==='j'){const j=it.j;b.innerHTML='<b>'+j[2]+' '+j[1]+'</b><i>'+j[4]+'</i><span>$'+j[3]+'</span>';b.disabled=R.money<j[3]||R.jokers.length>=R.slots;b.onclick=()=>buy(i);}
  else{const h=HT[it.t];b.innerHTML='<b>'+PL[it.t]+'</b><i>'+h[0]+' 升级 Lv'+(R.lv[it.t]+2)+'（+'+h[3]+'筹码 +'+h[4]+'倍率）</i><span>$3</span>';b.disabled=R.money<3;b.onclick=()=>buy(i);}
  if(it.sold){b.disabled=true;b.innerHTML='<b>已售出</b>';}box.appendChild(b);});
 const o=$('ownJ');o.innerHTML='';R.jokers.forEach((id,i)=>{const j=JMAP[id];const b=document.createElement('button');b.className='btn ghost';b.innerHTML=j[2]+' 卖$'+Math.max(1,Math.floor(j[3]/2));b.title=j[1]+'：'+j[4];b.onclick=()=>{R.money+=Math.max(1,Math.floor(j[3]/2));R.jokers.splice(i,1);tone(300,.1);renderShop();hud();};o.appendChild(b);});
 if(!R.jokers.length)o.innerHTML='<small>小丑栏 0/'+R.slots+' · 点击已拥有的小丑可出售</small>';$('rerollBtn').disabled=R.money<5;hud();}
function buy(i){const it=shop[i];if(it.sold)return;if(it.k==='j'){if(R.money<it.j[3]||R.jokers.length>=R.slots)return;R.money-=it.j[3];R.jokers.push(it.j[0]);}else{if(R.money<3)return;R.money-=3;R.lv[it.t]++;}it.sold=1;tone(990,.08,'triangle');tone(1320,.1,'triangle',.08,null,.06);renderShop();}
$('rerollBtn').onclick=()=>{if(R.money<5)return;R.money-=5;rollShop();renderShop();tone(600,.06);};
$('leaveBtn').onclick=()=>{show('shopScr',false);advance();};
// ---- 输入 ----
const HY=390,CW=50,CH=72;
function cardPos(i,n){const span=Math.min(W-20-CW,(n-1)*44);const x0=(W-span-CW)/2;return{x:x0+(n>1?i*span/(n-1):0),y:HY};}
cv.addEventListener('pointerdown',e=>{if(state!=='play'||anim)return;const p=posOf(e,cv,W,H);const n=R.hand.length;
 for(let i=n-1;i>=0;i--){const c=R.hand[i],q=cardPos(i,n),up=R.sel.includes(c.id)?-20:0;if(p.x>=q.x&&p.x<=q.x+CW&&p.y>=q.y+up-6&&p.y<=q.y+up+CH+16){toggle(c.id);return;}}
 // 点小丑看说明
 R.jokers.forEach((id,i)=>{const x=jx(i);if(p.x>x&&p.x<x+52&&p.y>8&&p.y<76){const j=JMAP[id];toast(j[2]+' '+j[1]+'：'+j[4],2200);}});});
function toggle(id){const k=R.sel.indexOf(id);if(k>=0)R.sel.splice(k,1);else{if(R.sel.length>=5)return toast('最多选 5 张');R.sel.push(id);}tone(700+R.sel.length*60,.05,'triangle',.07);hud();}
const jx=i=>{const n=Math.max(R.slots,R.jokers.length);const gap=(W-20)/n;return 10+i*gap+(gap-52)/2;};
$('playBtn2').onclick=play;$('discBtn').onclick=discard;$('sortBtn').onclick=()=>{if(!R)return;sortMode^=1;sortHand();$('sortBtn').innerHTML='排序<small>'+(sortMode?'花色':'点数')+'</small>';tone(500,.05);};
function hud(){if(!R)return;$('anteT').textContent=R.ante+(R.ante<=8?'/8':'');$('moneyT').textContent=R.money;$('score').textContent=fmt(R.score);
 $('playBtn2').innerHTML='出牌<small>剩 '+R.hands+'</small>';$('discBtn').innerHTML='弃牌<small>剩 '+R.disc+'</small>';$('discBtn').disabled=R.disc<=0;}
// ---- 绘制 ----
function drawCard(c,x,y,sel,dim){shad(ctx,x+CW/2,y+CH+3,CW/2-2,5,.3);box3d(ctx,x,y,CW,CH,sel?'#fff3b0':'#fbf7ef',9);
 const col=SC[c.s];txt(ctx,rname(c.r),x+10,y+13,15,col,'center',900);txt(ctx,SUITS[c.s],x+10,y+28,12,col);txt(ctx,SUITS[c.s],x+CW/2+2,y+CH/2+8,26,col);
 if(dim){ctx.fillStyle='rgba(40,30,60,.55)';rr(ctx,x,y,CW,CH,9);ctx.fill();txt(ctx,'🚫',x+CW/2,y+CH/2,18);}
 if(sel){ctx.strokeStyle='#ff3d9a';ctx.lineWidth=3;rr(ctx,x+1,y+1,CW-2,CH-2,9);ctx.stroke();}}
function render(dt){stage(ctx,W,H,'#174a3a','#0a1f1a');
 // 牌桌毡面
 ctx.fillStyle='rgba(255,255,255,.04)';rr(ctx,8,86,W-16,286,18);ctx.fill();ctx.strokeStyle='rgba(255,215,120,.25)';ctx.lineWidth=2;ctx.stroke();
 if(!R){drawBurst(ctx,sparks);return;}
 // 小丑栏
 for(let i=0;i<R.slots;i++){const x=jx(i);if(i<R.jokers.length){const j=JMAP[R.jokers[i]];shad(ctx,x+26,76,22,4);box3d(ctx,x,10,52,64,'#7b3fe4',10);emo(ctx,j[2],x+26,36,24);txt(ctx,j[1].slice(0,4),x+26,62,10,'#fff','center',800);}
  else{ctx.strokeStyle='rgba(255,255,255,.22)';ctx.setLineDash([4,4]);rr(ctx,x+2,12,48,60,10);ctx.stroke();ctx.setLineDash([]);}}
 // 盲注信息
 const bn=R.blind===2?R.boss[2]+' '+R.boss[1]:['小盲注','大盲注'][R.blind];
 box3d(ctx,18,96,150,64,R.blind===2?'#b5179e':'#2a6fdb',12);otxt(ctx,bn,93,114,15,'#fff');otxt(ctx,'目标 '+fmt(R.target),93,140,15,'#ffe066');
 box3d(ctx,178,96,164,64,'#14213d',12);otxt(ctx,'本局得分',260,112,12,'#cde');otxt(ctx,fmt(R.score),260,138,22,'#fff');
 const pr=Math.min(1,R.score/R.target);ctx.fillStyle='rgba(255,255,255,.12)';rr(ctx,18,168,324,10,5);ctx.fill();ctx.fillStyle='#ffd34d';rr(ctx,18,168,Math.max(10,324*pr),10,5);ctx.fill();
 if(R.blind===2){txt(ctx,R.boss[3],W/2,192,12,'#ffb3e6');}
 // 预览
 const cs=anim?anim.cs:selCards();
 if(cs.length){const s=anim?anim.s:scoreOf(cs,R.hands-1);box3d(ctx,40,206,280,60,'#3a0d5e',14);otxt(ctx,HT[s.t][0]+(R.lv[s.t]?' Lv'+(R.lv[s.t]+1):''),W/2,222,15,'#ffe066');
  box3d(ctx,64,234,100,26,'#1d7fe0',8);box3d(ctx,196,234,100,26,'#e5383b',8);otxt(ctx,String(s.chips),114,247,15,'#fff');otxt(ctx,'×',W/2,247,16,'#fff');otxt(ctx,String(s.mult),246,247,15,'#fff');
  if(anim){anim.t+=dt;const n=cs.length;cs.forEach((c,i)=>{const x=W/2-n*28+i*56+3;drawCard(c,x,280,!s.sc.includes(c)?false:true,debuffed(c));});otxt(ctx,'+'+fmt(s.total),W/2,370-anim.t*20,22,'#ffd34d');}}
 else txt(ctx,'点选 1–5 张牌组成牌型 · 点小丑看效果',W/2,236,13,'rgba(255,255,255,.7)');
 // 手牌
 const n=R.hand.length;R.hand.forEach((c,i)=>{const q=cardPos(i,n);const s=R.sel.includes(c.id);drawCard(c,q.x,q.y+(s?-20:0),s,debuffed(c));});
 txt(ctx,'牌库 '+R.pile.length+'/52',W-14,H-14,11,'rgba(255,255,255,.6)','right');
 if(msg&&msg.a>0){msg.a-=dt;ctx.globalAlpha=Math.min(1,msg.a);box3d(ctx,20,300,W-40,44,'#ff3d9a',14);otxt(ctx,msg.t,W/2,322,13,'#fff');ctx.globalAlpha=1;}
 drawBurst(ctx,sparks);}
// ---- 流程 ----
function openMenu(){state='menu';const gr=$('lvgrid');gr.innerHTML='';
 $('lvlInfo').innerHTML='选择起始牌组 · 最佳：第 '+save.bestAnte+' 底注 · 单手最高 '+fmt(save.bestHand)+'<br>已解锁小丑 '+unlockedJ().length+'/'+JK.length+'（每突破一个底注解锁 2 张）';
 gr.style.gridTemplateColumns='1fr 1fr';
 DECKS.forEach((d,i)=>{const b=document.createElement('button');b.className='lvl deck';const open=save.bestAnte>=d[4];b.disabled=!open;b.innerHTML=(open?d[2]+' '+d[1]:'🔒 '+d[1])+'<small>'+(open?d[3]:'到达第 '+d[4]+' 底注解锁')+'</small>';b.onclick=()=>{tone(660,.08,'triangle');['lvlScr','overScr','pauseOv'].forEach(x=>show(x,false));newRun(i);};gr.appendChild(b);});
 ['overScr','pauseOv','shopScr'].forEach(i=>show(i,false));show('lvlScr',true);}
function showTut(done){tutorial([['🃏 出牌得分','点选 1–5 张手牌，按「出牌」打出。按牌型给出基础<b>筹码</b>和<b>倍率</b>，计分牌的点数会加到筹码上，最终得分 = 筹码 × 倍率。'],['🎯 盲注目标','每个盲注有 4 次出牌、3 次弃牌。得分达到目标就过关；出牌用完还没达到就输掉整局。剩余的出牌会变成金币奖励。'],['🤡 小丑与星球','过关后进入商店：小丑牌提供持续加成（+倍率、×倍率、加筹码），星球牌永久升级某个牌型。小丑栏只有 5 格，要学会取舍。'],['👑 首领盲注','每个底注的第三关是首领，带特殊规则：封锁花色、必须出 5 张、没有弃牌……第 8 底注的小丑王最难。通关后可继续无尽模式。']],done);}
$('howBtn').onclick=()=>{show('lvlScr',false);showTut(openMenu);};
$('startBtn').onclick=()=>{audio();show('startScr',false);if(!save.tut){showTut(()=>{save.tut=1;Store.set('save',save);newRun(0);});}else openMenu();};
$('bestLine').textContent=save.bestAnte?'最佳：第 '+save.bestAnte+' 底注 · 单手最高 '+fmt(save.bestHand):'';
function pause(){if(state==='play'){state='pause';show('pauseOv',true);}}
$('pauseBtn').onclick=pause;$('resumeBtn').onclick=()=>{show('pauseOv',false);state='play';};$('restartBtn').onclick=()=>{show('pauseOv',false);newRun(R.deck);};$('menuBtn').onclick=openMenu;
$('nextBtn').onclick=()=>{show('overScr',false);openShop(0);};$('againBtn').onclick=()=>{show('overScr',false);newRun(R?R.deck:0);};$('menu2Btn').onclick=openMenu;
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
let last=performance.now();function frame(t){const dt=Math.min(.05,(t-last)/1000);last=t;render(dt);requestAnimationFrame(frame);}
fit();requestAnimationFrame(frame);
// 测试钩子
function bestPlay(){const h=R.hand;let best=null;const n=h.length;const need5=bossOn('psychic');
 for(let m=1;m<(1<<n);m++){let k=0;for(let i=0;i<n;i++)if(m>>i&1)k++;if(k>5||(need5&&k<5))continue;const cs=h.filter((c,i)=>m>>i&1);const s=scoreOf(cs,R.hands-1);if(!best||s.total>best.v)best={v:s.total,ids:cs.map(c=>c.id)};}return best;}
window.__jp={newRun,play,discard,winBlind,advance,setFast:v=>FAST=v,bestPlay,select:ids=>{R.sel=ids.slice();},buy,leave:()=>$('leaveBtn').click(),get R(){return R},get state(){return state},get shop(){return shop},targetOf};
