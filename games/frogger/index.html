<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>青蛙过河</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#121212;color:#f0f0f0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;display:flex;justify-content:center;min-height:100vh;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.wrap{width:100%;max-width:480px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:10px}
.topbar{width:100%;display:flex;justify-content:space-between;align-items:center;font-size:16px}
.topbar b{color:#8BC34A;font-size:22px}
.timebar{width:100%;height:8px;background:#2a2a2a;border-radius:4px;overflow:hidden}
.timebar i{display:block;height:100%;background:#8BC34A;width:100%}
canvas{background:#1e1e1e;border-radius:12px;touch-action:none;width:100%;height:auto;max-width:468px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;z-index:20;padding:24px;text-align:center}
.overlay.hidden{display:none}
.overlay h1{font-size:30px}
.overlay p{color:#bbb;font-size:15px;line-height:1.8}
.btn{background:#8BC34A;border:none;color:#fff;font-size:19px;font-weight:700;padding:13px 52px;border-radius:14px;cursor:pointer}
.btn:active{transform:scale(.95)}
.hint{color:#888;font-size:13px;text-align:center}
</style>
<!-- GAME UI BEGIN -->
<style>
:root{--page:#dcece5;--surface:#f5fff9;--soft:#c8dfd2;--ink:#203f35;--muted:#4d7263;--accent:#28654e;--on-accent:#ffffff;--line:#a1c5b4;--stage:#102f2b}
/* Shared presentation only; mechanics and state remain inside each standalone game. */
html.game-ui{background:var(--page);color:var(--ink);color-scheme:light;font-family:"Bahnschrift","Microsoft YaHei UI","PingFang SC",sans-serif}
html.game-ui[data-theme="space"],html.game-ui[data-theme="arcade"]{color-scheme:dark}
.game-ui body{background:var(--page);color:var(--ink);font-family:inherit;overscroll-behavior:none}
.game-ui body>.wrap{padding:20px 16px max(20px,env(safe-area-inset-bottom));gap:14px;max-width:500px}
.game-ui #app{background:var(--page);color:var(--ink)}
.game-ui :is(.topbar,#topbar){gap:8px;flex-wrap:wrap;min-height:58px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:10px 12px;box-shadow:0 3px 0 var(--soft);font-size:13px}
.game-ui :is(.title,.tb-title,.tb-title,#topbar .t,.topbar .t){color:var(--ink);font-size:16px;font-weight:750;letter-spacing:0}
.game-ui :is(.topbar,.hud,#hud,#topbar) :is(b,.v){color:var(--accent);font-variant-numeric:tabular-nums}
.game-ui :is(.stat,.topbar .s,.topbar .stat,.scorebar,.stats,.tip,.hint,.hintline,.hsline,.best,.hiscore){color:var(--muted);line-height:1.7}
.game-ui :is(.hint,.hintline,.tip){font-size:12px;max-width:40em;text-wrap:pretty}
.game-ui .scorebar{padding:6px 10px;gap:8px;flex-wrap:wrap}
.game-ui :is(.iconbtn,.iconBtn,.icobtn,.ibtn,.tbtn,.hbtn,.ib,.iconBtn,.pause){min-width:44px;min-height:44px;flex-shrink:0;border-radius:12px;background:var(--soft);color:var(--ink);border:1px solid var(--line);box-shadow:none;font-size:17px}
.game-ui button{font-family:inherit;cursor:pointer;touch-action:manipulation}
.game-ui button:focus-visible,.game-ui [tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.game-ui :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn){background:var(--accent);color:var(--on-accent);border:1px solid transparent;border-radius:13px;min-height:50px;padding:13px 28px;font-size:16px;font-weight:750;letter-spacing:0;box-shadow:0 4px 0 var(--line);text-shadow:none;max-width:100%}
.game-ui :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn):active{box-shadow:none;transform:translateY(2px)}
.game-ui :is(.ghost,.ghostbtn,.btn2,.abtn,.toolbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line);box-shadow:none;border-radius:12px;min-height:44px}
.game-ui :is(.rowbtns,.btnrow,.ctlrow){gap:10px;flex-wrap:wrap;justify-content:center}
.game-ui :is(.pill,.hudbox,.hud .p){background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:none;font-variant-numeric:tabular-nums}
.game-ui :is(.dbtn,.cbtn,.gbtn,.holdbtn,.firebtn,.bombbtn,.jumpbtn,.pumpbtn,.nbtn){border-radius:12px;box-shadow:0 3px 0 var(--line);min-height:44px}
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv,.screen):has(>.ui-panel){padding:20px;overflow-y:auto;overscroll-behavior:contain}
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv):has(>.ui-panel){background:var(--page);backdrop-filter:none;justify-content:safe center;align-items:center}
.game-ui .ui-panel{width:min(100%,380px);max-height:100%;overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:18px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:24px;padding:30px 24px;box-shadow:0 8px 0 var(--soft),0 20px 48px #15253618;text-align:center;margin:auto}
.game-ui .ui-panel :is(.card,.panel,.pausecard,.ovcard){display:contents}
.game-ui .ui-panel :is(h1,h2,.gamename,.gametitle){font-size:30px;line-height:1.25;font-weight:800;color:var(--ink);background:none;-webkit-text-fill-color:currentColor;text-shadow:none;letter-spacing:-.6px;margin:0}
.game-ui .ui-panel :is(p,.howto,.sub,.rule){font-size:14px;line-height:1.85;color:var(--muted);background:none;border:0;box-shadow:none;padding:0;margin:0;max-width:32em;text-align:left;white-space:normal}
.game-ui .ui-panel :is(.bigemoji,.bigemoji,.ic,.big):not(.bigscore){animation:none;filter:none;text-shadow:none}
.game-ui .ui-emblem{width:90px;height:90px;display:grid;place-items:center;border:1px solid var(--line);border-radius:28px;background:var(--soft);font-size:48px;line-height:1;flex-shrink:0;position:relative}
.game-ui[data-theme="wood"] .ui-emblem{border-radius:50%;box-shadow:inset 0 0 0 5px var(--surface),inset 0 0 0 6px var(--line)}
.game-ui[data-theme="wood"] .ui-panel h1{font-family:"STKaiti","KaiTi","Microsoft YaHei",serif;letter-spacing:2px}
.game-ui[data-theme="ice"] .ui-emblem{border-radius:26px 8px 26px 8px}
.game-ui[data-theme="space"] .ui-emblem{background:radial-gradient(circle at center,var(--soft) 42%,transparent 43%),var(--surface);border-radius:50%;outline:1px solid var(--line);outline-offset:7px;margin:7px}
.game-ui[data-theme="kitchen"] .ui-emblem{border-radius:22px;border-bottom:5px solid var(--line)}
.game-ui .ui-panel :is(.score,.bigscore,.bigScore,.scorebig){color:var(--accent);font-size:48px;font-weight:800;font-variant-numeric:tabular-nums}
.game-ui .ui-panel :is(.best,.hsline,.hiscore,.endstats,.endstats b){color:var(--muted);font-size:13px;line-height:1.8}
.game-ui .ui-mode{display:grid;grid-template-columns:1fr 1fr;gap:5px;background:var(--soft);padding:5px;border:1px solid var(--line);border-radius:14px;width:100%}
.game-ui .ui-mode button{min-height:44px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-size:14px;font-weight:700;box-shadow:none}
.game-ui .ui-mode button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 2px 5px #1525361a}
.game-ui .ui-panel .ui-mode-note{font-size:12px;line-height:1.6;text-align:center;color:var(--muted)}
.game-ui .ui-mode-status{display:block;padding:5px 10px;color:var(--accent);font-size:11px;font-weight:700;line-height:1.5;text-align:center;border:1px solid var(--line);border-radius:8px;background:var(--surface);margin:4px auto;max-width:100%;pointer-events:none}
.game-ui body>.wrap>canvas:not(#fx){background-color:var(--stage);box-shadow:0 0 0 1px var(--line),0 6px 0 var(--soft);border-radius:18px;flex-shrink:0}
.game-ui .screen>canvas.game{box-shadow:0 0 0 1px var(--line),0 6px 0 var(--soft)}
.game-ui #hud{gap:6px;background:var(--surface);color:var(--ink)}
.game-ui #hud :is(.left,.t,.s,.grp,.pill){color:var(--ink)}
.game-ui #hud .pill{background:var(--surface);border-color:var(--line)}
.game-ui body canvas:is(#cv,#game,#board){background-color:var(--stage)}
.game-ui :is(button.dbtn,button.cbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.game-ui :is(button.lvl,button.lvlbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line);border-radius:12px;min-height:54px}
.game-ui :is(button.lvl,button.lvlbtn) :is(.nc,.sz,small){color:var(--muted)}
.game-ui .ui-panel button.lvl{margin:0;min-width:44px;box-shadow:none;padding:8px}
.game-ui #hud :is(.left,.right,.hudl,.hbtns){gap:5px;flex-wrap:wrap}
.game-ui #hud :is(.left,.hudl){min-width:0;flex-shrink:1}
.game-ui #hud :is(.pill,.left){font-size:12px}
.game-ui button:disabled{cursor:default;opacity:.45;box-shadow:none}
.game-ui .ui-panel .ui-assist-note{color:var(--accent);font-weight:700}
@media(min-width:700px){.game-ui body>.wrap{padding-top:32px}.game-ui .ui-panel{padding:36px 30px}}
@media(max-width:360px){.game-ui body>.wrap{padding:10px;gap:10px}.game-ui .ui-panel{padding:22px 18px;gap:13px}.game-ui .ui-panel h1{font-size:26px}.game-ui .ui-emblem{width:70px;height:70px;font-size:38px}.game-ui :is(.topbar,#topbar){gap:5px;padding:8px}.game-ui :is(.iconbtn,.icobtn,.ibtn,.tbtn,.ib){min-width:40px;min-height:44px}}
@media(max-height:650px){.game-ui .ui-panel{padding:18px;gap:12px}.game-ui .ui-emblem{width:60px;height:60px;font-size:32px}.game-ui .ui-panel h1{font-size:25px}.game-ui .ui-panel :is(p,.howto,.sub,.rule){font-size:13px}}
@media(prefers-reduced-motion:reduce){.game-ui *, .game-ui *::before,.game-ui *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}


</style>
<script>
// Installed before the original game script; embedded so downloaded ZIPs remain offline capable.
(function () {
  'use strict';
  var config = {"id":"frogger","name":"青蛙过河","theme":"garden","icon":"🐸","challenge":"每次过河限时由 30 秒缩至 22 秒"};
  var mode = 'classic';
  try { mode = sessionStorage.getItem('game100-mode-' + config.id) || mode; } catch (_) {}
  var expert = mode === 'expert';
  var used = { hint: 0, undo: 0 };
  var limits = { hint: 1, undo: 3 };
  function storageKey(key) { return expert && !/sound|mute/i.test(key) ? 'expert:' + key : key; }
  window.GameUI = {
    expert: expert,
    pick: function (classic, advanced) { return expert ? advanced : classic; },
    storageGet: function (key) { return localStorage.getItem(storageKey(key)); },
    storageSet: function (key, value) { localStorage.setItem(storageKey(key), value); },
    storageRemove: function (key) { localStorage.removeItem(storageKey(key)); }
  };
  var root = document.documentElement;
  root.classList.add('game-ui');
  root.dataset.theme = config.theme;
  root.dataset.game = config.id;
  root.dataset.mode = mode;
  var gesture = new WeakMap();
  function labelButtons(scope) {
    scope.querySelectorAll('button').forEach(function (button) {
      if (button.getAttribute('aria-label')) return;
      var id = button.id.toLowerCase(), text = button.textContent.trim();
      var name = /mute|sound|snd/.test(id) ? '切换音效' : /pause/.test(id) ? '暂停游戏' : /hint/.test(id) && !/close|ok/.test(id) ? '查看提示' : '';
      if (!name && /^[⏸🔊🔇💡Ⅱ]+$/u.test(text)) name = { '⏸': '暂停游戏', '🔊': '切换音效', '🔇': '切换音效', '💡': '查看提示' }[text];
      if (name) button.setAttribute('aria-label', name);
    });
  }
  function decorate(container) {
    if (container.querySelector(':scope > .ui-panel') || !container.querySelector('h1,h2,.gamename')) return;
    if (container.matches('.screen') && container.querySelector('canvas:not(#fx)')) return;
    var panel = document.createElement('div');
    panel.className = 'ui-panel';
    while (container.firstChild) panel.appendChild(container.firstChild);
    container.appendChild(panel);
    var heading = panel.querySelector('h1,h2,.gamename');
    var start = /start|menu|ready/i.test(container.id) || !!panel.querySelector('#startBtn,#btnStart,.startbtn');
    if (start) {
      var headings = panel.querySelectorAll('h1,h2,.gamename');
      if (headings.length > 1 && !/[A-Za-z0-9\u4e00-\u9fff]/.test(heading.textContent)) { heading.remove(); heading = headings[1]; }
      var oldIcon = panel.querySelector('.bigemoji,.ic');
      if (oldIcon) oldIcon.remove();
      var emblem = document.createElement('div');
      emblem.className = 'ui-emblem'; emblem.textContent = config.icon; emblem.setAttribute('aria-hidden', 'true');
      panel.insertBefore(emblem, panel.firstChild);
      heading.textContent = config.name;
      var switcher = document.createElement('div'); switcher.className = 'ui-mode'; switcher.setAttribute('role', 'group'); switcher.setAttribute('aria-label', '选择玩法模式');
      [['classic','经典模式'],['expert','进阶挑战']].forEach(function (item) {
        var b = document.createElement('button'); b.type = 'button'; b.textContent = item[1]; b.dataset.mode = item[0]; b.setAttribute('aria-pressed', String(mode === item[0]));
        b.addEventListener('click', function () {
          if (mode === item[0]) return;
          try { sessionStorage.setItem('game100-mode-' + config.id, item[0]); location.reload(); }
          catch (_) { b.textContent = '浏览器未允许保存模式'; }
        });
        switcher.appendChild(b);
      });
      var primary = panel.querySelector('#startBtn,#btnStart,.startbtn,button');
      var anchor = primary;
      while (anchor && anchor.parentNode !== panel && !anchor.parentNode.matches('.card,.panel,.pausecard,.ovcard')) anchor = anchor.parentNode;
      var target = anchor ? anchor.parentNode : panel;
      target.insertBefore(switcher, anchor || null);
      var note = document.createElement('p'); note.className = 'ui-mode-note';
      note.textContent = expert ? config.challenge + '。进阶纪录单独保存。' : '按原规则轻松开局，也可切换进阶挑战。';
      target.insertBefore(note, anchor || null);
    }
    labelButtons(panel);
  }
  function notify(text) {
    var el = document.getElementById('ui-assist-toast');
    if (!el) { el = document.createElement('div'); el.id = 'ui-assist-toast'; el.className = 'ui-mode-status'; el.setAttribute('role', 'status'); el.style.cssText = 'position:fixed;bottom:18px;left:16px;right:16px;z-index:200;padding:14px'; document.body.appendChild(el); }
    el.textContent = text; el.hidden = false;
    clearTimeout(notify.timer); notify.timer = setTimeout(function () { el.hidden = true; }, 2000);
  }
  function assistEvent(event) {
    if (!expert) return;
    var b = event.target.closest('button'); if (!b || b.closest('.ui-mode')) return;
    var kind = /^(hintBtn|hintTopBtn|btnHint)$/i.test(b.id) ? 'hint' : /^(undoBtn|undoTopBtn|btnUndo)$/i.test(b.id) || /悔一步|撤销/.test(b.textContent) ? 'undo' : '';
    if (!kind) return;
    var prev = gesture.get(b), blocked;
    if (event.type === 'click' && prev && performance.now() - prev.at < 1000) blocked = prev.blocked;
    else { blocked = used[kind] >= limits[kind]; if (!blocked) used[kind]++; gesture.set(b, { at: performance.now(), blocked: blocked }); }
    if (blocked) { event.preventDefault(); event.stopImmediatePropagation(); notify(kind === 'hint' ? '本次挑战的 1 次提示已用完' : '本次挑战的 3 次撤销已用完'); }
  }
  document.addEventListener('pointerdown', assistEvent, true);
  document.addEventListener('click', assistEvent, true);
  document.addEventListener('click', function (event) {
    var b = event.target.closest('button');
    if (b && /^(startBtn|btnStart|restartBtn|againBtn|retryBtn|btnAgain|btnRestart|playAgain)$/i.test(b.id)) used = { hint: 0, undo: 0 };
  }, true);
  document.addEventListener('DOMContentLoaded', function () {
    var selector = '.overlay,.ov,#ov,#overlay,#pauseOv,.screen';
    document.querySelectorAll(selector).forEach(function (container) {
      decorate(container);
      // Only dynamic overlay children are observed; animated scores never trigger this work.
      new MutationObserver(function () { decorate(container); }).observe(container, { childList: true });
    });
    labelButtons(document);
  });
}());

</script>
<!-- GAME UI END -->
</head>
<body>
<div class="wrap">
<div class="topbar"><span>🐸 青蛙过河</span><span>过关 <b id="succ">0</b>/5</span><span>⏱️<b id="time">30</b>s</span><span>❤️<b id="lives">3</b></span></div>
<div class="timebar"><i id="timefill"></i></div>
<canvas id="cv" width="468" height="396"></canvas>
<p class="hint">点击相邻格或滑动跳一格（方向键也行）<br>马路躲汽车，河流踩木头，30 秒内到达对岸</p>
</div>
<div class="overlay" id="startScr"><h1>🐸 青蛙过河</h1><p>点击青蛙旁边的格子，或向目标方向滑动<br>即可跳一格（也可用方向键/WASD）<br>下半马路：躲开左右行驶的汽车<br>上半河流：必须站在漂移的木头上，落水就扣命<br>到达对岸 +1，累计 5 次过关胜利<br>每次限时 30 秒，超时/被撞/落水扣 1 条命，共 3 条</p><button class="btn" id="startBtn">开始游戏</button></div>
<div class="overlay hidden" id="overScr"><h1 id="overTitle">游戏结束</h1><p id="overText"></p><button class="btn" id="restartBtn">再来一局</button></div>
<script>
/* GAMEPLAY UPGRADE */
'use strict';
const $=id=>document.getElementById(id);
function vibrate(ms){try{if(window.NativeBridge&&window.NativeBridge.vibrate)window.NativeBridge.vibrate(ms);}catch(e){}}
function setHUD(){
  $('succ').textContent=succ;$('lives').textContent=Math.max(0,lives);
  $('time').textContent=Math.ceil(timer/60);
  $('timefill').style.width=(timer/(30*60)*100)+'%';
}

const cv=$('cv'),ctx=cv.getContext('2d');
const COLS=13,ROWS=11,CELL=36,W=468,H=396;
const GOAL_ROW=0,RIVER_TOP=1,RIVER_BOT=4,MID_ROW=5,ROAD_TOP=6,ROAD_BOT=9,START_ROW=10;
const TIME_LIMIT=GameUI.pick(30,22)*60;

let fx,fy,succ,lives,timer,raf,state,cars,logs;

function speedMul(){return 1+succ*0.18;}
function reset(){
  succ=0;lives=3;
  buildTraffic();
  resetFrog();
  setHUD();
}
function resetFrog(){
  fx=6;fy=START_ROW;timer=TIME_LIMIT;setHUD();
}
function buildTraffic(){
  cars=[];logs=[];
  const roadCfg=[
    {row:6,dir:1,sp:1.6,n:3},{row:7,dir:-1,sp:2.1,n:3},
    {row:8,dir:1,sp:2.6,n:2},{row:9,dir:-1,sp:1.4,n:3}
  ];
  const carColors=['#F44336','#FF9800','#9C27B0','#2196F3'];
  roadCfg.forEach((c,ri)=>{
    for(let i=0;i<c.n;i++){
      cars.push({row:c.row,x:(i*(W/c.n)+(ri*97)%W)%W,w:CELL*1.7,dir:c.dir,sp:c.sp,c:carColors[(ri+i)%4]});
    }
  });
  const riverCfg=[
    {row:1,dir:-1,sp:1.1,n:3},{row:2,dir:1,sp:1.5,n:2},
    {row:3,dir:-1,sp:1.9,n:3},{row:4,dir:1,sp:1.3,n:2}
  ];
  riverCfg.forEach((c,ri)=>{
    for(let i=0;i<c.n;i++){
      logs.push({row:c.row,x:(i*(W/c.n)+(ri*131)%W)%W,w:CELL*(2.4+((ri+i)%2)*0.8),dir:c.dir,sp:c.sp});
    }
  });
}
function px(){return fx*CELL;}
function py(){return fy*CELL;}
function loseLife(reason){
  lives--;vibrate(150);setHUD();
  if(lives<=0)gameOver(false,reason+'\n3 条命用完了！');
  else resetFrog();
}
function reachGoal(){
  succ++;vibrate(60);setHUD();
  if(succ>=5)gameOver(true,'5 次成功到达对岸！🎉');
  else resetFrog();
}
function gameOver(win,text){
  if(state!=='play')return;
  state='over';
  cancelAnimationFrame(raf);
  $('overTitle').textContent=win?'🏆 过关胜利！':'💥 游戏结束';
  $('overText').textContent=text+'\n成功过河 '+succ+' 次';
  $('overScr').classList.remove('hidden');
}
function jump(dx,dy){
  if(state!=='play')return;
  const bx=Math.round(fx);
  const nx=bx+dx,ny=fy+dy;
  if(nx<0||nx>=COLS||ny<0||ny>=ROWS)return;
  fx=nx;fy=ny;vibrate(10);
  if(fy===GOAL_ROW)reachGoal();
}
function frogOnLog(){
  const cx=px()+CELL/2;
  for(const l of logs){
    if(l.row===fy&&cx>=l.x&&cx<=l.x+l.w)return l;
  }
  return null;
}
function update(){
  const m=speedMul();
  // 车辆移动（含回绕）
  for(const c of cars){
    c.x+=c.dir*c.sp*m;
    if(c.dir>0&&c.x>W)c.x=-c.w;
    if(c.dir<0&&c.x<-c.w)c.x=W;
  }
  for(const l of logs){
    l.x+=l.dir*l.sp*m;
    if(l.dir>0&&l.x>W)l.x=-l.w;
    if(l.dir<0&&l.x<-l.w)l.x=W;
  }
  // 倒计时
  timer--;
  if(timer<=0){loseLife('⏱️ 超时了！');return;}
  // 河流：必须在木头上，且随木头漂移
  if(fy>=RIVER_TOP&&fy<=RIVER_BOT){
    const l=frogOnLog();
    if(!l){loseLife('🌊 掉进河里了！');return;}
    const newX=px()+l.dir*l.sp*m;
    if(newX<-CELL/2||newX>W-CELL/2){loseLife('🪵 被木头带出画面了！');return;}
    fx=newX/CELL; // 浮点保留，保证连续漂移
  }
  // 马路：碰撞检测
  if(fy>=ROAD_TOP&&fy<=ROAD_BOT){
    const fr={x:px()+6,y:py()+6,w:CELL-12,h:CELL-12};
    for(const c of cars){
      if(c.row===fy){
        const cr={x:c.x+4,y:c.row*CELL+4,w:c.w-8,h:CELL-8};
        if(fr.x<cr.x+cr.w&&fr.x+fr.w>cr.x&&fr.y<cr.y+cr.h&&fr.y+fr.h>cr.y){
          loseLife('🚗 被汽车撞了！');return;
        }
      }
    }
  }
  setHUD();
}
function draw(){
  ctx.clearRect(0,0,W,H);
  for(let r=0;r<ROWS;r++){
    if(r===GOAL_ROW){ctx.fillStyle='#2e7d32';}
    else if(r>=RIVER_TOP&&r<=RIVER_BOT){ctx.fillStyle='#1565c0';}
    else if(r===MID_ROW||r===START_ROW){ctx.fillStyle='#33691e';}
    else{ctx.fillStyle='#3a3a3a';}
    ctx.fillRect(0,r*CELL,W,CELL);
  }
  // 河流波纹
  ctx.strokeStyle='rgba(255,255,255,.15)';ctx.lineWidth=1;
  for(let r=RIVER_TOP;r<=RIVER_BOT;r++)
    for(let i=0;i<6;i++){
      const x=((i*97+r*53)%W);
      ctx.beginPath();ctx.moveTo(x,r*CELL+18);ctx.lineTo(x+18,r*CELL+18);ctx.stroke();
    }
  // 马路分道线
  ctx.fillStyle='#ffeb3b';
  for(let r=ROAD_TOP;r<=ROAD_BOT;r++)
    for(let x=0;x<W;x+=44)ctx.fillRect(x,r*CELL+CELL/2-1,22,2);
  // 木头
  for(const l of logs){
    ctx.fillStyle='#8d6e63';
    ctx.beginPath();ctx.roundRect(l.x,l.row*CELL+5,l.w,CELL-10,8);ctx.fill();
    ctx.fillStyle='#6d4c41';
    for(let x=l.x+12;x<l.x+l.w-8;x+=26)ctx.fillRect(x,l.row*CELL+8,4,CELL-16);
  }
  // 汽车
  for(const c of cars){
    const y=c.row*CELL+4;
    ctx.fillStyle=c.c;
    ctx.beginPath();ctx.roundRect(c.x,y,c.w,CELL-8,7);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.35)';
    ctx.beginPath();ctx.roundRect(c.x+8,y+6,c.w-16,10,4);ctx.fill();
    ctx.fillStyle='#ffeb3b';
    if(c.dir>0){ctx.fillRect(c.x+c.w-6,y+CELL/2-8,5,5);ctx.fillRect(c.x+c.w-6,y+CELL/2+3,5,5);}
    else{ctx.fillRect(c.x+1,y+CELL/2-8,5,5);ctx.fillRect(c.x+1,y+CELL/2+3,5,5);}
  }
  // 终点旗
  ctx.font='22px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  for(let i=0;i<COLS;i+=2)ctx.fillText('🏁',i*CELL+CELL/2,CELL/2);
  // 青蛙
  ctx.font='26px sans-serif';
  ctx.fillText('🐸',px()+CELL/2,py()+CELL/2+1);
}
function loop(){
  if(state!=='play')return;
  update();
  if(state!=='play')return;
  draw();
  raf=requestAnimationFrame(loop);
}
function startGame(){
  cancelAnimationFrame(raf);
  $('overScr').classList.add('hidden');
  $('startScr').classList.add('hidden');
  reset();
  state='play';
  loop();
}
// 输入：滑动 / 点击相邻格 / 鼠标 / 键盘
let tS=null;
cv.addEventListener('touchstart',e=>{e.preventDefault();const t=e.touches[0];tS={x:t.clientX,y:t.clientY,time:Date.now()};},{passive:false});
cv.addEventListener('touchend',e=>{
  e.preventDefault();
  if(!tS)return;
  const t=e.changedTouches[0];
  const dx=t.clientX-tS.x,dy=t.clientY-tS.y;
  if(Math.hypot(dx,dy)>24){
    if(Math.abs(dx)>Math.abs(dy))jump(dx>0?1:-1,0);
    else jump(0,dy>0?1:-1);
  }else{
    const r=cv.getBoundingClientRect();
    const gx=(((t.clientX-r.left)/r.width*W)/CELL)|0,gy=(((t.clientY-r.top)/r.height*H)/CELL)|0;
    const bx=Math.round(fx);
    if(Math.abs(gx-bx)+Math.abs(gy-fy)===1)jump(gx-bx,gy-fy);
  }
  tS=null;
});
let mD=null;
cv.addEventListener('mousedown',e=>{mD={x:e.clientX,y:e.clientY};});
cv.addEventListener('mouseup',e=>{
  if(!mD)return;
  const dx=e.clientX-mD.x,dy=e.clientY-mD.y;
  if(Math.hypot(dx,dy)>24){
    if(Math.abs(dx)>Math.abs(dy))jump(dx>0?1:-1,0);
    else jump(0,dy>0?1:-1);
  }else{
    const r=cv.getBoundingClientRect();
    const gx=(((e.clientX-r.left)/r.width*W)/CELL)|0,gy=(((e.clientY-r.top)/r.height*H)/CELL)|0;
    const bx=Math.round(fx);
    if(Math.abs(gx-bx)+Math.abs(gy-fy)===1)jump(gx-bx,gy-fy);
  }
  mD=null;
});
document.addEventListener('keydown',e=>{
  const m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0],W:[0,-1],S:[0,1],A:[-1,0],D:[1,0]};
  if(m[e.key]){e.preventDefault();jump(m[e.key][0],m[e.key][1]);}
});
$('startBtn').addEventListener('click',startGame);
$('restartBtn').addEventListener('click',startGame);
reset();draw();
</script>
