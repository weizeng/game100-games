<style>
:root{--page:#e2eafb;--surface:#ffffff;--soft:#cedbf2;--ink:#293f67;--muted:#5c7296;--accent:#3a62ad;--on-accent:#ffffff;--line:#b1c5e5;--stage:#1c304e;--page:#5875ff;--surface:#ffffff;--soft:#e9f1ff;--ink:#1f2f66;--muted:#56679a;--accent:#7d6717;--on-accent:#ffffff;--line:#a7c8ff;--b-bg1:#86d8ff;--b-bg2:#5875ff;--b-btn:#ffd02e;--b-btn-hi:#ffe077;--b-edge:#d98b00;--b-glow:#e0f2ff;--b-glow-rgb:224,242,255;--b-pedge-rgb:167,200,255;--b-btn-ink:#774c00;--b-btn-tsh:0 1px 0 rgba(255,255,255,.45);--b-coin-ink:#774c00;--b-coin-tsh:none;--b-key-ink:#7d6717;--b-title:#935e00}

    g.fillStyle = 'rgba(0,0,0,' + (skin === 'b' ? .34 : .26) + ')'; g.beginPath(); g.ellipse(cx + r * .12, cy + r * .78, r * .82, r * .32, 0, 0, 7); g.fill();
    var body = g.createRadialGradient(cx - r * .38, cy - r * .42, r * .08, cx, cy, r);
    body.addColorStop(0, shade(color, .75)); body.addColorStop(.28, shade(color, .18)); body.addColorStop(.75, color); body.addColorStop(1, shade(color, -.45));
    g.fillStyle = body; g.beginPath(); g.arc(cx, cy, r, 0, 7); g.fill();
    if (skin === 'b') { // rim light + crisp specular for the candy look
      g.strokeStyle = 'rgba(255,255,255,.55)'; g.lineWidth = Math.max(1, r * .1); g.beginPath(); g.arc(cx, cy, r * .82, .35 * Math.PI, .75 * Math.PI); g.stroke();
      g.strokeStyle = shade(color, -.55); g.lineWidth = Math.max(1, r * .08); g.beginPath(); g.arc(cx, cy, r - g.lineWidth / 2, 0, 7); g.stroke();
    }
    g.fillStyle = 'rgba(255,255,255,.85)'; g.beginPath(); g.ellipse(cx - r * .35, cy - r * .42, r * .22, r * .14, -.6, 0, 7); g.fill();
  }
  var fx = {
    on: !!skin, skin: skin, shade: shade, rgba: rgba,
    tile: function (ctx, x, y, w, h, color, r) {
      r = r == null ? Math.min(w, h) * (skin === 'b' ? .24 : .2) : r;
      var pad = Math.ceil(w * .25) + 2, s = scaleOf(ctx);
      ctx.drawImage(sprite('t' + color + w + 'x' + h + 'r' + r, w, h, pad, s, function (g) { tileArt(g, w, h, color, r); }), x - pad, y - pad, w + pad * 2, h + pad * 2);
    },
    orb: function (ctx, x, y, r, color) {
      var pad = Math.ceil(r * .5) + 2, s = scaleOf(ctx);
      ctx.drawImage(sprite('o' + color + r, r * 2, r * 2, pad, s, function (g) { orbArt(g, r, color, pad); }), x - r - pad, y - r - pad, r * 2 + pad * 2, r * 2 + pad * 2);
    },
    // Soft elliptical contact shadow under any sprite (emoji, characters, pieces).
    shadow: function (ctx, x, y, rx, ry, a) {
      ctx.save(); ctx.fillStyle = 'rgba(0,0,0,' + (a == null ? .28 : a) + ')'; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, 7); ctx.fill(); ctx.restore();
    },
    // Lit stage background: vertical gradient plus a vignette. Cached per size/colours.
    stage: function (ctx, w, h, top, bottom) {
      var s = scaleOf(ctx);
      ctx.drawImage(sprite('s' + w + 'x' + h + top + bottom, w, h, 0, s, function (g) {
        var lg = g.createLinearGradient(0, 0, 0, h); lg.addColorStop(0, top); lg.addColorStop(1, bottom); g.fillStyle = lg; g.fillRect(0, 0, w, h);
        var v = g.createRadialGradient(w / 2, h * .35, Math.min(w, h) * .2, w / 2, h / 2, Math.max(w, h) * .75);
        v.addColorStop(0, 'rgba(255,255,255,' + (skin === 'b' ? .10 : .07) + ')'); v.addColorStop(1, 'rgba(0,0,0,.35)'); g.fillStyle = v; g.fillRect(0, 0, w, h);
      }), 0, 0, w, h);
    },
    // Glow is shadowBlur: cheap for a handful of shapes, never use it on every tile.
    glow: function (ctx, color, blur) { ctx.shadowColor = color; ctx.shadowBlur = blur; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0; },
    noGlow: function (ctx) { ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; },
    // Crisp rendering on high-DPI phones without changing game coordinates.
    // Only safe where input code converts with getBoundingClientRect + logical W/H, not cv.width.
    hidpi: function (cv, ctx, w, h) {

      ctx.setTransform(d, 0, 0, d, 0, 0); return d;
    },
    // Lightweight particle bursts (pooled array, no allocations per frame beyond the burst).
    burst: function (list, x, y, color, n) {
      for (var i = 0; i < (n || 12); i++) { var a = Math.random() * 6.283, v = 1 + Math.random() * 2.6; list.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 1, life: 1, c: color, r: 1.5 + Math.random() * 2.5 }); }
    },
    drawBurst: function (ctx, list) {
      for (var i = list.length - 1; i >= 0; i--) {
        var p = list[i]; p.x += p.vx; p.y += p.vy; p.vy += .12; p.life -= .035;
        if (p.life <= 0) { list.splice(i, 1); continue; }
        ctx.globalAlpha = p.life; ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (skin === 'b' ? 1.2 : 1), 0, 7); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
  };
  window.GameUI.fx = fx;
}());

</script>
<!-- GAME UI END -->
</head><body>
<main class="wrap">
<header class="topbar"><div><span class="edition">经典游乐场</span><h1>跳格金字塔</h1></div><div class="tools"><button id="soundBtn" class="iconbtn" aria-label="切换音效">♪</button><button id="pauseBtn" class="iconbtn" aria-label="暂停游戏" disabled>Ⅱ</button></div></header>
<div class="stats"><div><span>得分</span><b id="scoreV">0</b></div><div><span>最佳纪录</span><b id="bestV">0</b></div><div><span id="extraLabel">生命 / 关卡</span><b id="extraV">—</b></div></div>
<p id="status" class="status" role="status">一步一块，点亮整座金字塔。</p>
<div class="stage pyramid-stage"><canvas id="cv" width="420" height="365" aria-label="七层金字塔跳跃棋盘"></canvas><div class="pyramid-legend"><span>◆ 踩亮方格</span><span>● 避开追逐球</span></div></div>
<div class="controls"><div class="jump-pad"><button data-step="ul" aria-label="向左上跳">↖</button><button data-step="ur" aria-label="向右上跳">↗</button><button data-step="dl" aria-label="向左下跳">↙</button><button data-step="dr" aria-label="向右下跳">↘</button></div><button id="rescueBtn">传送回顶点 · 2</button></div>
<p class="hint">↖ ↗ ↙ ↘ 跳跃 · 键盘 Q E Z C 或方向键 · 空格传送</p>
</main>
<section id="startScreen" class="overlay"><h2>跳格金字塔</h2><p>沿四个斜方向跳跃，把全部方格踩亮。跳出边界或碰到追逐球会失去一条命。每关有两次传送机会，回到顶点脱险。踩亮整座金字塔即可进入下一关。</p><button id="startBtn" class="btn">开始游戏</button></section>
<section id="pauseScreen" class="overlay hidden"><h2>休息一下</h2><p>进度已暂停，准备好再继续。</p><button id="resumeBtn" class="btn">继续游戏</button><button id="restartBtn" class="ghost">重新开始</button></section>
<section id="endScreen" class="overlay hidden"><h2 id="endTitle">本局结束</h2><p id="endText"></p><button id="againBtn" class="btn">再玩一局</button><button id="menuBtn" class="ghost">返回菜单</button></section>
<section id="levelScreen" class="overlay hidden"><h2>整座金字塔亮起来了！</h2><p id="levelText"></p><button id="nextLevelBtn" class="btn">进入下一关</button></section>
<script>
const GAME_ID="pyramid";
const $ = id => document.getElementById(id);
const expert = GameUI.expert;
const ui = {
  running:false, paused:false, score:0, best:0, sound:true, audio:null,
  init() {
    try { this.best = Number(GameUI.storageGet('classic-best-'+GAME_ID)) || 0; this.sound = GameUI.storageGet('g100_sound') !== '0'; } catch (_) {}
    this.hud();
    $('soundBtn').textContent = this.sound ? '♪' : '♩';
    $('soundBtn').setAttribute('aria-pressed',String(this.sound));
    $('startBtn').onclick = $('againBtn').onclick = $('restartBtn').onclick = () => this.start();
    $('pauseBtn').onclick = () => this.pause(true);
    $('resumeBtn').onclick = () => this.pause(false);
    $('menuBtn').onclick = () => { this.running=false; this.hideScreens(); $('startScreen').classList.remove('hidden'); $('pauseBtn').disabled=true; };
    $('soundBtn').onclick = () => { this.sound=!this.sound; $('soundBtn').textContent=this.sound?'♪':'♩'; $('soundBtn').setAttribute('aria-pressed',String(this.sound)); try { GameUI.storageSet('g100_sound',this.sound?'1':'0'); } catch (_) {} this.tone(); };
    document.addEventListener('visibilitychange', () => { if(document.hidden && this.running && !this.paused) this.pause(true); });
    window.addEventListener('keydown', e => {
      if (e.key === 'Escape' && this.running) { e.preventDefault(); this.pause(!this.paused); return; }
      if (this.running && !this.paused && game.key) game.key(e);
    });
    game.preview?.();
  },
  hideScreens() { document.querySelectorAll('.overlay').forEach(el=>el.classList.add('hidden')); },
  start() { this.hideScreens(); this.running=true; this.paused=false; this.score=0; $('pauseBtn').disabled=false; this.hud(); this.tone(); game.start(); },
  pause(on) { if(!this.running || game.locked) return; this.paused=on; $('pauseScreen').classList.toggle('hidden',!on); if(!on) this.tone(); game.cancelHold?.(); },
  hud(extra) { $('scoreV').textContent=this.score; $('bestV').textContent=this.best; if(extra!==undefined) $('extraV').textContent=extra; },
  say(text) { $('status').textContent=text; },
  add(points) { this.score+=points; this.hud(); $('scoreV').classList.remove('result-flash'); requestAnimationFrame(()=>$('scoreV').classList.add('result-flash')); },
  save() { if(this.score>this.best) { this.best=this.score; try { GameUI.storageSet('classic-best-'+GAME_ID,String(this.best)); } catch (_) {} this.hud(); } },
  finish(title, text) { if(!this.running) return; this.running=false; this.paused=false; this.save(); $('pauseBtn').disabled=true; this.hideScreens(); $('endTitle').textContent=title; $('endText').textContent=text+' · 本局 '+this.score+' 分'; $('endScreen').classList.remove('hidden'); game.cancelHold?.(); this.tone(520); },
  active() { return this.running && !this.paused; },
  tone(frequency=360) { if(!this.sound) return; try { if(!this.audio) this.audio=new (window.AudioContext||window.webkitAudioContext)(); this.audio.resume().catch(()=>{}); const o=this.audio.createOscillator(),g=this.audio.createGain(); o.type='sine'; o.frequency.value=frequency; g.gain.setValueAtTime(.035,this.audio.currentTime); g.gain.exponentialRampToValueAtTime(.001,this.audio.currentTime+.08); o.connect(g);g.connect(this.audio.destination);o.start();o.stop(this.audio.currentTime+.09); } catch (_) {} }
};


const jumps={ul:[-1,-1],ur:[-1,0],dl:[1,0],dr:[1,1]};
const game={
  tiles:[],player:{r:0,c:0},enemies:[],lives:3,level:1,discs:2,clock:0,enemyClock:0,spawnClock:0,last:0,lastMove:0,grace:0,locked:false,
  valid(r,c){return r>=0&&r<7&&c>=0&&c<=r;},
  start(){this.level=1;this.lives=expert?2:3;this.locked=false;this.setup();},
  setup(){this.tiles=Array.from({length:7},(_,r)=>Array(r+1).fill(0));this.player={r:0,c:0};this.tiles[0][0]=1;this.enemies=[];this.discs=2;this.clock=0;this.enemyClock=0;this.spawnClock=0;this.grace=1300;this.lastMove=0;ui.say(expert?'每块方格需要踩亮两次，留意下一步的退路。':'把每块方格踩成金色，追逐球很快就会来了。');this.render();},
  preview(){this.tiles=Array.from({length:7},(_,r)=>Array(r+1).fill(0));this.render();},
  completed(){return this.tiles.every(row=>row.every(v=>v>=(expert?2:1)));},
  paint(){const {r,c}=this.player;if(this.tiles[r][c]<(expert?2:1)){this.tiles[r][c]++;ui.add(10);}if(this.completed()){ui.add(this.level*100);ui.save();this.locked=true;ui.paused=true;$('pauseBtn').disabled=true;$('levelText').textContent='第 '+this.level+' 关完成，奖励 '+this.level*100+' 分。下一关追逐球会更快。';$('levelScreen').classList.remove('hidden');ui.tone(700);}},
  move(direction){
    if(!ui.active()||!jumps[direction])return;
    const now=performance.now();if(now-this.lastMove<130)return;this.lastMove=now;
    const [dy,dx]=jumps[direction],r=this.player.r+dy,c=this.player.c+dx;
    if(!this.valid(r,c)){this.hurt('跳出了边界，回到顶点重新找路线。');return;}
    this.player={r,c};ui.tone(280+r*35);this.paint();if(!this.locked)this.collision();this.render();
  },
  hurt(reason){if(!ui.active())return;this.lives--;if(!this.lives){this.render();ui.finish('这次冒险到这里','已到达第 '+this.level+' 关，试着把传送留给险境');return;}this.player={r:0,c:0};this.enemies=[];this.grace=1600;this.spawnClock=0;ui.say(reason+' 还剩 '+this.lives+' 条命。');ui.tone(150);this.render();},
  collision(){if(this.grace<=0&&this.enemies.some(e=>e.r===this.player.r&&e.c===this.player.c))this.hurt('碰到追逐球了。');},
  rescue(){if(!ui.active()||!this.discs)return;this.discs--;this.player={r:0,c:0};this.grace=1400;this.paint();ui.say('传送成功！观察追逐球的位置再出发。');ui.tone(580);this.render();},
  distance(a,b){return Math.abs(a.c-b.c)+Math.abs((a.r-a.c)-(b.r-b.c));},
  advanceEnemies(){for(const enemy of this.enemies){const options=Object.values(jumps).map(([dy,dx])=>({r:enemy.r+dy,c:enemy.c+dx})).filter(p=>this.valid(p.r,p.c));options.sort((a,b)=>this.distance(a,this.player)-this.distance(b,this.player));if(options.length)Object.assign(enemy,options[0]);}this.collision();},
  nextLevel(){if(!this.locked)return;this.level++;this.locked=false;ui.paused=false;$('levelScreen').classList.add('hidden');$('pauseBtn').disabled=false;this.setup();},
  render(){
    const ctx=$('cv').getContext('2d');
    /* ART T2-4 */var FX=window.GameUI&&GameUI.fx&&GameUI.fx.on?GameUI.fx:null;
    if(!this._pyBg){const c=document.createElement('canvas');c.width=420;c.height=365;const g=c.getContext('2d');if(FX)FX.stage(g,420,365,'#e8f2fc','#c7d9ec');else{g.fillStyle='#dce9f7';g.fillRect(0,0,420,365);}this._pyBg=c;}
    ctx.drawImage(this._pyBg,0,0);
    if(FX){FX.shadow(ctx,210,330,165,13,.25);}else{ctx.fillStyle='#c7d9ec';ctx.beginPath();ctx.ellipse(210,330,165,13,0,0,Math.PI*2);ctx.fill();}
    const pos=(r,c)=>({x:210+(c-r/2)*48,y:42+r*43});
    for(let r=0;r<7;r++)for(let c=0;c<=r;c++){const {x,y}=pos(r,c),v=this.tiles[r]?.[c]||0;ctx.fillStyle=v>=(expert?2:1)?'#cd9142':v?'#5a9b9e':'#7993b4';ctx.beginPath();ctx.moveTo(x-24,y);ctx.lineTo(x,y+13);ctx.lineTo(x,y+31);ctx.lineTo(x-24,y+18);ctx.closePath();ctx.fill();ctx.fillStyle=v>=(expert?2:1)?'#b77c35':v?'#43888d':'#56769f';ctx.beginPath();ctx.moveTo(x,y+13);ctx.lineTo(x+24,y);ctx.lineTo(x+24,y+18);ctx.lineTo(x,y+31);ctx.closePath();ctx.fill();ctx.fillStyle=v>=(expert?2:1)?'#ffc66b':v?'#8bd0c2':'#aac0da';ctx.beginPath();ctx.moveTo(x,y-13);ctx.lineTo(x+24,y);ctx.lineTo(x,y+13);ctx.lineTo(x-24,y);ctx.closePath();ctx.fill();ctx.strokeStyle='#dce9f7';ctx.lineWidth=1.5;ctx.stroke();if(expert&&v===1){ctx.fillStyle='#366b71';ctx.font='10px sans-serif';ctx.textAlign='center';ctx.fillText('1/2',x,y+3);}}
    for(const e of this.enemies){const {x,y}=pos(e.r,e.c);if(FX){FX.glow(ctx,'#584774',8);FX.orb(ctx,x|0,(y-15)|0,11,'#584774');FX.noGlow(ctx);}else{ctx.fillStyle='#584774';ctx.beginPath();ctx.arc(x,y-15,11,0,Math.PI*2);ctx.fill();}ctx.fillStyle='#fff';ctx.fillRect(x-6,y-19,4,4);ctx.fillRect(x+2,y-19,4,4);ctx.fillStyle='#ffb17c';ctx.fillRect(x-5,y-14,3,2);ctx.fillRect(x+3,y-14,3,2);}
    const {x,y}=pos(this.player.r,this.player.c);ctx.globalAlpha=this.grace>0?.72:1;if(FX){FX.tile(ctx,(x-11)|0,(y-29)|0,22,23,'#e48339',6);FX.tile(ctx,(x-11)|0,(y-29)|0,22,5,'#ffe0a1',3);}else{ctx.fillStyle='#e48339';ctx.fillRect(x-11,y-29,22,23);ctx.fillStyle='#ffe0a1';ctx.fillRect(x-11,y-29,22,5);}ctx.fillStyle='#fff';ctx.fillRect(x-7,y-21,5,6);ctx.fillRect(x+2,y-21,5,6);ctx.fillStyle='#293f67';ctx.fillRect(x-5,y-19,3,3);ctx.fillRect(x+2,y-19,3,3);ctx.fillStyle='#c9672a';ctx.fillRect(x-12,y-7,9,4);ctx.fillRect(x+3,y-7,9,4);ctx.globalAlpha=1;
    $('rescueBtn').textContent='传送回顶点 · '+this.discs;$('rescueBtn').disabled=!this.discs;ui.hud(this.lives+' / '+this.level);
  },
  tick(t){const dt=this.last?Math.min(100,t-this.last):0;this.last=t;if(ui.active()){this.clock+=dt;this.grace=Math.max(0,this.grace-dt);this.enemyClock+=dt;this.spawnClock+=dt;if(this.spawnClock>=3800&&this.enemies.length<Math.min(3,1+Math.floor(this.level/2))){this.spawnClock=0;this.enemies.push({r:6,c:Math.floor(Math.random()*7)});ui.say('追逐球出现了！留好回到顶点的传送。');}if(this.enemyClock>=Math.max(430,1250-this.level*90)){this.enemyClock=0;this.advanceEnemies();}this.render();}requestAnimationFrame(t=>this.tick(t));},
  key(e){const map={q:'ul',e:'ur',z:'dl',c:'dr',ArrowLeft:'ul',ArrowUp:'ur',ArrowDown:'dl',ArrowRight:'dr'};if(map[e.key]){e.preventDefault();this.move(map[e.key]);}if(e.code==='Space'){e.preventDefault();this.rescue();}}
};
document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>game.move(b.dataset.step));$('rescueBtn').onclick=()=>game.rescue();$('nextLevelBtn').onclick=()=>game.nextLevel();requestAnimationFrame(t=>game.tick(t));

ui.init();
</script></body></html>
