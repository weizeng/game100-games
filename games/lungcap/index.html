<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>肺活量测试</title>
<style>
/* ART T2-1 */
html.game-ui .iconbtn,html.game-ui .icobtn,html.game-ui #btnPause,html.game-ui #btnMute,html.game-ui #muteBtn,html.game-ui #pauseBtn,html.game-ui #btnSound{min-width:44px;min-height:44px}
html.game-ui #cv{max-width:min(480px,calc((100vh - 260px)*1.2));max-width:min(480px,calc((100svh - 260px)*1.2))}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#0b0e14;color:#eef2f7;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;display:flex;justify-content:center;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#app{width:100%;max-width:430px;min-height:100%;display:flex;flex-direction:column;background:radial-gradient(120% 55% at 50% 0%,#0e1c2b 0%,#0b0e14 62%)}
#top{display:flex;align-items:center;justify-content:space-between;padding:10px 12px}
#title{font-size:18px;font-weight:800}
#topbtns{display:flex;gap:8px}
.icobtn{width:44px;height:44px;font-size:20px;border-radius:12px;border:1px solid #27405a;background:#101a26;color:#fff}
.icobtn:active{transform:scale(.93)}
#hud{display:flex;justify-content:space-between;align-items:center;padding:2px 16px 6px;font-size:14px;color:#a9c6e2}
#hud b{color:#ffd54f;font-size:17px}
#cwrap{padding:2px 10px}
canvas{width:100%;display:block;border-radius:14px;background:#07090d;border:1px solid #1e3048;touch-action:none}
#demoWrap{display:none;margin:8px 12px 0;padding:10px 14px;border-radius:12px;background:#0e1a26;border:1px solid #1f4b5e;font-size:15px;line-height:1.7;color:#cfe8f5}
#demoWrap .row{display:flex;gap:8px;margin-top:8px}
#expWrap{display:none;margin:8px 12px 0;padding:12px 14px;border-radius:12px;background:#0e1a26;border:1px solid #27405a}
#volNum{font-size:42px;font-weight:800;color:#4fc3f7;text-align:center;letter-spacing:1px}
#volNum small{font-size:16px;color:#a9c6e2;font-weight:400}
#holdBtn{display:block;width:100%;min-height:96px;margin-top:10px;font-size:20px;font-weight:800;color:#fff;background:linear-gradient(135deg,#29b6f6,#0288d1);border:none;border-radius:16px;touch-action:none;box-shadow:0 4px 16px rgba(41,182,246,.35)}
#holdBtn.holding{background:linear-gradient(135deg,#66bb6a,#2e7d32);box-shadow:0 4px 20px rgba(102,187,106,.5);transform:scale(.98)}
#holdHint{text-align:center;font-size:14px;color:#a9c6e2;margin-top:8px;min-height:22px}
#trialList{display:flex;gap:8px;justify-content:center;margin-top:8px;flex-wrap:wrap}
.tchip{min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center;padding:6px 10px;border-radius:10px;background:#16283a;border:1px solid #27405a;font-size:14px;font-weight:700;color:#4fc3f7}
#trialMsg{text-align:center;font-size:14px;color:#cfe8f5;margin-top:8px;min-height:22px;line-height:1.6}
#btnToQuiz{display:none;width:100%;min-height:52px;margin-top:10px;font-size:18px;font-weight:800;color:#fff;background:linear-gradient(135deg,#29b6f6,#0288d1);border:none;border-radius:14px}
#quizWrap{display:none;margin:8px 12px 0;padding:12px 14px;border-radius:12px;background:#0e1a26;border:1px solid #27405a}
#qTitle{font-size:16px;font-weight:700;line-height:1.6;margin-bottom:10px}
.qopt{display:block;width:100%;min-height:48px;margin-top:8px;padding:8px 12px;font-size:15px;text-align:left;color:#eef2f7;background:#16283a;border:1px solid #2c4a68;border-radius:12px}
.qopt:active{transform:scale(.98)}
.qopt.right{background:#1b4d2e;border-color:#43a047;color:#c8e6c9}
.qopt.wrong{background:#4d1b1b;border-color:#e53935;color:#ffcdd2}
.qopt:disabled{opacity:1}
#qWhy{display:none;margin-top:10px;font-size:14px;line-height:1.7;color:#ffe0b2;background:#231a0e;border-radius:10px;padding:8px 10px}
#btnNext{display:none;width:100%;min-height:48px;margin-top:10px;font-size:16px;font-weight:800;color:#fff;background:linear-gradient(135deg,#29b6f6,#0288d1);border:none;border-radius:12px}
.screen{margin:12px;padding:20px 18px;border-radius:16px;background:#0f1622;border:1px solid #27405a}
.screen h2{font-size:23px;margin-bottom:10px}
.screen p{font-size:15px;line-height:1.85;color:#c9d9ea;margin-bottom:6px}
.screen .tip{font-size:13px;color:#8fa8c2}
.bigbtn{display:block;width:100%;min-height:52px;margin-top:14px;font-size:18px;font-weight:800;color:#fff;background:linear-gradient(135deg,#29b6f6,#0288d1);border:none;border-radius:14px;box-shadow:0 4px 14px rgba(41,182,246,.35)}
.bigbtn:active{transform:scale(.97)}
.smbtn{flex:1;min-height:46px;font-size:16px;font-weight:700;color:#fff;background:#2b3a4d;border:1px solid #3d526b;border-radius:12px}
.smbtn.hot{background:linear-gradient(135deg,#29b6f6,#0288d1);border:none}
#endBody .score{font-size:17px;line-height:2;color:#d7e7f5}
#endBody .score b{color:#ffd54f;font-size:22px}
#endBody .eval{font-size:19px;font-weight:800;color:#69f0ae}
#endBody h3{font-size:17px;margin:12px 0 8px;color:#ffd54f}
#endBody .con{font-size:14.5px;line-height:1.9;color:#c9d9ea;background:#0a0f16;border-radius:10px;padding:10px 12px}
#overlay{position:fixed;inset:0;background:rgba(4,6,9,.8);display:none;align-items:center;justify-content:center;z-index:50}
#ocard{background:#0f1622;border:1px solid #27405a;border-radius:16px;padding:28px 30px;text-align:center}
#ocard h3{font-size:20px;margin-bottom:16px}
#ocard .row{display:flex;gap:10px}

/* 2026-10-20 热修：开始按钮固定在可视区底部 */#scrStart #btnStart{position:sticky;bottom:12px;z-index:5;box-shadow:0 6px 18px rgba(0,0,0,.45)}
</style>
<!-- GAME UI BEGIN -->
<style>
:root{--page:#0b1626;--surface:#13243a;--soft:#1c3350;--ink:#eaf6ff;--muted:#9fb6cc;--accent:#4fc3f7;--on-accent:#05263a;--line:#2b4a6a;--stage:#081220;--page:#03101f;--surface:#0f2742;--soft:#223851;--ink:#eafffb;--muted:#a6c7cf;--accent:#33e1a0;--on-accent:#0b0620;--line:#33e1a0;--b-bg1:#0f3256;--b-bg2:#03101f;--b-btn:#33e1a0;--b-btn-hi:#7aecc1;--b-edge:#0f8a5a;--b-glow:#4fc3f7;--b-glow-rgb:79,195,247;--b-pedge-rgb:51,225,160;--b-btn-ink:#084c32;--b-btn-tsh:0 1px 0 rgba(255,255,255,.45);--b-coin-ink:#084c32;--b-coin-tsh:none;--b-key-ink:#4fc3f7;--b-title:#ffffff}
/* Shared presentation only; mechanics and state remain inside each standalone game. */
html.game-ui{background:var(--page);color:var(--ink);color-scheme:light;font-family:"Bahnschrift","Microsoft YaHei UI","PingFang SC",sans-serif}
html.game-ui:is([data-theme="space"],[data-theme="arcade"],[data-theme="lab"],[data-theme="ocean"],[data-theme="magic"]){color-scheme:dark}
.game-ui body{background:var(--page);color:var(--ink);font-family:inherit;overscroll-behavior:none}
.game-ui body>.wrap{padding:20px 16px max(20px,env(safe-area-inset-bottom));gap:14px;max-width:500px}
.game-ui #app{background:var(--page);color:var(--ink)}
.game-ui :is(.topbar,#topbar){gap:8px;flex-wrap:wrap;min-height:58px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:10px 12px;box-shadow:0 3px 0 var(--soft);font-size:13px}
.game-ui :is(.title,.tb-title,.tb-title,#topbar .t,.topbar .t){color:var(--ink);font-size:16px;font-weight:750;letter-spacing:0}
.game-ui :is(.topbar,.hud,#hud,#topbar) :is(b,.v){color:var(--accent);font-variant-numeric:tabular-nums}
.game-ui :is(.stat,.topbar .s,.topbar .stat,.scorebar,.stats,.tip,.hint,.hintline,.hsline,.best,.hiscore){color:var(--muted);line-height:1.7}
.game-ui :is(.hint,.hintline,.tip){font-size:12px;max-width:40em;text-wrap:pretty}
.game-ui .scorebar{padding:6px 10px;gap:8px;flex-wrap:wrap}
.game-ui :is(.iconbtn,.iconBtn,.icobtn,.ibtn,.tbtn,.hbtn,.ib,.iconBtn,.pause){min-width:44px;min-height:44px;flex-shrink:0;border-radius:12px;background:var(--soft);color:var(--ink);border:1px solid var(--line);box-shadow:none;font-size:17px}
.game-ui button{font-family:inherit;cursor:pointer;touch-action:manipulation}
.game-ui button:focus-visible,.game-ui [tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.game-ui :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn){background:var(--accent);color:var(--on-accent);border:1px solid transparent;border-radius:13px;min-height:50px;padding:13px 28px;font-size:16px;font-weight:750;letter-spacing:0;box-shadow:0 4px 0 var(--line);text-shadow:none;max-width:100%}
.game-ui :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn):active{box-shadow:none;transform:translateY(2px)}
.game-ui :is(.ghost,.ghostbtn,.btn2,.abtn,.toolbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line);box-shadow:none;border-radius:12px;min-height:44px}
.game-ui :is(.rowbtns,.btnrow,.ctlrow){gap:10px;flex-wrap:wrap;justify-content:center}
.game-ui :is(.pill,.hudbox,.hud .p){background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:none;font-variant-numeric:tabular-nums}
.game-ui :is(.dbtn,.cbtn,.gbtn,.holdbtn,.firebtn,.bombbtn,.jumpbtn,.pumpbtn,.nbtn){border-radius:12px;box-shadow:0 3px 0 var(--line);min-height:44px}
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv,.screen):has(>.ui-panel){padding:20px;overflow-y:auto;overscroll-behavior:contain}
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv):has(>.ui-panel){background:var(--page);backdrop-filter:none;justify-content:safe center;align-items:center}
.game-ui .ui-panel{width:min(100%,380px);max-height:100%;overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:18px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:24px;padding:30px 24px;box-shadow:0 8px 0 var(--soft),0 20px 48px #15253618;text-align:center;margin:auto}
.game-ui .ui-panel :is(.card,.panel,.pausecard,.ovcard){display:contents}
.game-ui .ui-panel :is(h1,h2,.gamename,.gametitle){font-size:30px;line-height:1.25;font-weight:800;color:var(--ink);background:none;-webkit-text-fill-color:currentColor;text-shadow:none;letter-spacing:-.6px;margin:0}
.game-ui .ui-panel :is(p,.howto,.sub,.rule){font-size:14px;line-height:1.85;color:var(--muted);background:none;border:0;box-shadow:none;padding:0;margin:0;max-width:32em;text-align:left;white-space:normal}
.game-ui .ui-panel :is(.bigemoji,.bigemoji,.ic,.big):not(.bigscore){animation:none;filter:none;text-shadow:none}
.game-ui .ui-emblem{width:90px;height:90px;display:grid;place-items:center;border:1px solid var(--line);border-radius:28px;background:var(--soft);font-size:48px;line-height:1;flex-shrink:0;position:relative}
.game-ui[data-theme="wood"] .ui-emblem{border-radius:50%;box-shadow:inset 0 0 0 5px var(--surface),inset 0 0 0 6px var(--line)}
.game-ui[data-theme="wood"] .ui-panel h1{font-family:"STKaiti","KaiTi","Microsoft YaHei",serif;letter-spacing:2px}
.game-ui[data-theme="ice"] .ui-emblem{border-radius:26px 8px 26px 8px}
.game-ui[data-theme="space"] .ui-emblem{background:radial-gradient(circle at center,var(--soft) 42%,transparent 43%),var(--surface);border-radius:50%;outline:1px solid var(--line);outline-offset:7px;margin:7px}
.game-ui[data-theme="kitchen"] .ui-emblem{border-radius:22px;border-bottom:5px solid var(--line)}
.game-ui .ui-panel :is(.score,.bigscore,.bigScore,.scorebig){color:var(--accent);font-size:48px;font-weight:800;font-variant-numeric:tabular-nums}
.game-ui .ui-panel :is(.best,.hsline,.hiscore,.endstats,.endstats b){color:var(--muted);font-size:13px;line-height:1.8}
.game-ui .ui-mode{display:grid;grid-template-columns:1fr 1fr;gap:5px;background:var(--soft);padding:5px;border:1px solid var(--line);border-radius:14px;width:100%}
.game-ui .ui-mode button{min-height:44px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-size:14px;font-weight:700;box-shadow:none}
.game-ui .ui-mode button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 2px 5px #1525361a}
.game-ui .ui-panel .ui-mode-note{font-size:12px;line-height:1.6;text-align:center;color:var(--muted)}
.game-ui .ui-mode-status{display:block;padding:5px 10px;color:var(--accent);font-size:11px;font-weight:700;line-height:1.5;text-align:center;border:1px solid var(--line);border-radius:8px;background:var(--surface);margin:4px auto;max-width:100%;pointer-events:none}
.game-ui body>.wrap>canvas:not(#fx){background-color:var(--stage);box-shadow:0 0 0 1px var(--line),0 6px 0 var(--soft);border-radius:18px;flex-shrink:0}
.game-ui .screen>canvas.game{box-shadow:0 0 0 1px var(--line),0 6px 0 var(--soft)}
.game-ui #hud{gap:6px;background:var(--surface);color:var(--ink)}
.game-ui #hud :is(.left,.t,.s,.grp,.pill){color:var(--ink)}
.game-ui #hud .pill{background:var(--surface);border-color:var(--line)}
.game-ui body canvas:is(#cv,#game,#board){background-color:var(--stage)}
.game-ui :is(button.dbtn,button.cbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.game-ui :is(button.lvl,button.lvlbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line);border-radius:12px;min-height:54px}
.game-ui :is(button.lvl,button.lvlbtn) :is(.nc,.sz,small){color:var(--muted)}
.game-ui .ui-panel button.lvl{margin:0;min-width:44px;box-shadow:none;padding:8px}
.game-ui #hud :is(.left,.right,.hudl,.hbtns){gap:5px;flex-wrap:wrap}
.game-ui #hud :is(.left,.hudl){min-width:0;flex-shrink:1}
.game-ui #hud :is(.pill,.left){font-size:12px}
.game-ui button:disabled{cursor:default;opacity:.45;box-shadow:none}
.game-ui .ui-panel .ui-assist-note{color:var(--accent);font-weight:700}
@media(min-width:700px){.game-ui body>.wrap{padding-top:32px}.game-ui .ui-panel{padding:36px 30px}}
@media(max-width:360px){.game-ui body>.wrap{padding:10px;gap:10px}.game-ui .ui-panel{padding:22px 18px;gap:13px}.game-ui .ui-panel h1{font-size:26px}.game-ui .ui-emblem{width:70px;height:70px;font-size:38px}.game-ui :is(.topbar,#topbar){gap:5px;padding:8px}.game-ui :is(.iconbtn,.icobtn,.ibtn,.tbtn,.ib){min-width:40px;min-height:44px}}
@media(max-height:650px){.game-ui .ui-panel{padding:18px;gap:12px}.game-ui .ui-emblem{width:60px;height:60px;font-size:32px}.game-ui .ui-panel h1{font-size:25px}.game-ui .ui-panel :is(p,.howto,.sub,.rule){font-size:13px}}
@media(prefers-reduced-motion:reduce){.game-ui *, .game-ui *::before,.game-ui *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
/* 2026-10-20 热修：开局/结算遮罩铺满整屏，主按钮固定在面板底部，避免被画布尺寸裁切（#10） */
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv):has(>.ui-panel){position:fixed;inset:0;z-index:1000;border-radius:0;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
.game-ui .ui-panel{touch-action:pan-y}
.game-ui .ui-panel :is(#startBtn,#btnStart,.startbtn,#bStart,#restartBtn,#btnRestart,#againBtn,#btnAgain,#retryBtn,#btnRetry,#playBtn,#btnPlay){position:sticky;bottom:0;z-index:3;flex-shrink:0}
.game-ui .ui-panel :not(.card,.panel,.pausecard,.ovcard,.ui-mode):has(>:is(#startBtn,#btnStart,.startbtn,#bStart,#restartBtn,#btnRestart,#againBtn,#btnAgain,#retryBtn,#btnRetry,#playBtn,#btnPlay)){position:sticky;bottom:0;z-index:3;flex-shrink:0;background:var(--surface);box-shadow:0 -10px 10px -6px var(--surface)}


/* ===== Direction B · 霓虹糖果 Pop Arcade ===== saturated gradients, chunky bevels with a hard bottom edge, sticker panels, neon on dark themes */
html.game-ui[data-skin="b"]{--fb:"HarmonyOS Sans SC","MiSans","OPPOSans","vivo Sans","Noto Sans SC","Noto Sans CJK SC","PingFang SC","Microsoft YaHei UI",system-ui,sans-serif;--bounce:cubic-bezier(.34,1.56,.64,1);--bg:radial-gradient(circle at 12% 18%,rgba(255,255,255,.28) 0 38px,transparent 40px),radial-gradient(circle at 88% 30%,rgba(255,255,255,.16) 0 64px,transparent 66px),radial-gradient(circle at 20% 82%,rgba(255,255,255,.14) 0 52px,transparent 54px),radial-gradient(rgba(255,255,255,.16) 1.5px,transparent 2.2px) 0 0/22px 22px,linear-gradient(165deg,var(--b-bg1),var(--b-bg2));font-family:var(--fb)}
html.game-ui[data-skin="b"],html.game-ui[data-skin="b"] body,html.game-ui[data-skin="b"] #app,html.game-ui[data-skin="b"] :is(.overlay,.ov,#ov,#overlay,#pauseOv):has(>.ui-panel){background:var(--bg);background-color:var(--b-bg2)}
html.game-ui[data-skin="b"] body{min-height:100vh;font-family:var(--fb)}
html.game-ui[data-skin="b"] :is(.hint,.hintline,.tip){color:rgba(255,255,255,.94);text-shadow:0 1px 2px rgba(0,0,0,.35)}
/* Sticker panel: white rim + hard coloured bottom edge + drop */
html.game-ui[data-skin="b"] .ui-panel{background:linear-gradient(180deg,var(--surface),var(--soft));border:4px solid #fff;border-radius:32px;box-shadow:0 9px 0 var(--line),0 9px 0 4px rgba(0,0,0,.08),0 26px 40px rgba(0,0,0,.28);animation:uiB-in .5s var(--bounce) both}
html.game-ui[data-skin="b"] .ui-panel :is(h1,h2,.gamename,.gametitle){font-size:34px;font-weight:900;color:var(--b-title);letter-spacing:0;text-shadow:0 3px 0 var(--line),0 6px 10px rgba(0,0,0,.15)}
html.game-ui[data-skin="b"] .ui-emblem{width:100px;height:100px;border:4px solid #fff;border-radius:50%;background:radial-gradient(circle at 32% 26%,#fff 0 12%,var(--b-glow) 13%,var(--line) 70%,var(--b-edge) 100%);box-shadow:0 7px 0 var(--b-edge),0 16px 24px rgba(0,0,0,.25);font-size:54px;animation:uiB-wobble 2.6s ease-in-out infinite}
html.game-ui[data-skin="b"] .ui-emblem::before,html.game-ui[data-skin="b"] .ui-emblem::after{content:"✦";position:absolute;color:#fff;font-size:20px;text-shadow:0 0 8px var(--b-glow);animation:uiB-twinkle 1.8s ease-in-out infinite}
html.game-ui[data-skin="b"] .ui-emblem::before{top:-10px;right:-14px}
html.game-ui[data-skin="b"] .ui-emblem::after{bottom:4px;left:-18px;font-size:14px;animation-delay:.9s}
html.game-ui[data-skin="b"] .ui-panel :is(.score,.bigscore,.bigScore,.scorebig,#finalScore){font-size:56px;font-weight:900;color:var(--b-btn);-webkit-text-fill-color:currentColor;text-shadow:0 4px 0 var(--b-edge),0 0 2px var(--b-edge),0 10px 16px rgba(0,0,0,.25)}
html.game-ui[data-skin="b"] .ui-panel :is(h1,.gamename)~h2{font-size:19px;text-shadow:0 2px 0 var(--line)}
/* Chunky bevelled button: highlight lip, darker bottom slab, presses down onto the slab */
html.game-ui[data-skin="b"] :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn,button.actBtn):not(.ghost){position:relative}
html.game-ui[data-skin="b"] :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn,button.actBtn):not(.ghost):not(#\#){overflow:hidden;border:0;border-radius:20px;font-weight:900;color:var(--b-btn-ink);background:linear-gradient(180deg,var(--b-btn-hi),var(--b-btn) 52%);text-shadow:var(--b-btn-tsh);box-shadow:inset 0 3px 0 rgba(255,255,255,.55),inset 0 -5px 0 rgba(0,0,0,.14),0 6px 0 var(--b-edge),0 12px 18px rgba(0,0,0,.25);transition:transform .08s,box-shadow .08s}

      g.fillStyle = 'rgba(255,255,255,.75)'; g.beginPath(); g.ellipse(w * .3, h * .27, w * .13, h * .07, -.5, 0, 7); g.fill();
    } else { // soft 3D: drop shadow, vertical light falloff, top gloss band
      g.shadowColor = 'rgba(0,0,0,.32)'; g.shadowBlur = Math.max(2, w * .18); g.shadowOffsetY = Math.max(1, h * .08);
      var body = g.createLinearGradient(0, 0, 0, h); body.addColorStop(0, shade(color, .28)); body.addColorStop(.55, color); body.addColorStop(1, shade(color, -.22));
      rr(g, 0, 0, w, h, r); g.fillStyle = body; g.fill(); g.shadowColor = 'transparent';
      var gloss = g.createLinearGradient(0, 0, 0, h * .5); gloss.addColorStop(0, 'rgba(255,255,255,.45)'); gloss.addColorStop(1, 'rgba(255,255,255,0)');
      rr(g, w * .08, h * .06, w * .84, h * .42, r * .7); g.fillStyle = gloss; g.fill();
      rr(g, .5, .5, w - 1, h - 1, r); g.strokeStyle = 'rgba(255,255,255,.22)'; g.lineWidth = 1; g.stroke();
    }
  }
  function orbArt(g, r, color, pad) {
    var cx = r, cy = r;
    g.fillStyle = 'rgba(0,0,0,' + (skin === 'b' ? .34 : .26) + ')'; g.beginPath(); g.ellipse(cx + r * .12, cy + r * .78, r * .82, r * .32, 0, 0, 7); g.fill();
    var body = g.createRadialGradient(cx - r * .38, cy - r * .42, r * .08, cx, cy, r);
    body.addColorStop(0, shade(color, .75)); body.addColorStop(.28, shade(color, .18)); body.addColorStop(.75, color); body.addColorStop(1, shade(color, -.45));
    g.fillStyle = body; g.beginPath(); g.arc(cx, cy, r, 0, 7); g.fill();
    if (skin === 'b') { // rim light + crisp specular for the candy look
      g.strokeStyle = 'rgba(255,255,255,.55)'; g.lineWidth = Math.max(1, r * .1); g.beginPath(); g.arc(cx, cy, r * .82, .35 * Math.PI, .75 * Math.PI); g.stroke();
      g.strokeStyle = shade(color, -.55); g.lineWidth = Math.max(1, r * .08); g.beginPath(); g.arc(cx, cy, r - g.lineWidth / 2, 0, 7); g.stroke();
    }
    g.fillStyle = 'rgba(255,255,255,.85)'; g.beginPath(); g.ellipse(cx - r * .35, cy - r * .42, r * .22, r * .14, -.6, 0, 7); g.fill();
  }
  var fx = {
    on: !!skin, skin: skin, shade: shade, rgba: rgba,
    tile: function (ctx, x, y, w, h, color, r) {
      r = r == null ? Math.min(w, h) * (skin === 'b' ? .24 : .2) : r;
      var pad = Math.ceil(w * .25) + 2, s = scaleOf(ctx);
      ctx.drawImage(sprite('t' + color + w + 'x' + h + 'r' + r, w, h, pad, s, function (g) { tileArt(g, w, h, color, r); }), x - pad, y - pad, w + pad * 2, h + pad * 2);
    },
    orb: function (ctx, x, y, r, color) {
      var pad = Math.ceil(r * .5) + 2, s = scaleOf(ctx);
      ctx.drawImage(sprite('o' + color + r, r * 2, r * 2, pad, s, function (g) { orbArt(g, r, color, pad); }), x - r - pad, y - r - pad, r * 2 + pad * 2, r * 2 + pad * 2);
    },
    // Soft elliptical contact shadow under any sprite (emoji, characters, pieces).
    shadow: function (ctx, x, y, rx, ry, a) {
      ctx.save(); ctx.fillStyle = 'rgba(0,0,0,' + (a == null ? .28 : a) + ')'; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, 7); ctx.fill(); ctx.restore();
    },
    // Lit stage background: vertical gradient plus a vignette. Cached per size/colours.
    stage: function (ctx, w, h, top, bottom) {
      var s = scaleOf(ctx);
      ctx.drawImage(sprite('s' + w + 'x' + h + top + bottom, w, h, 0, s, function (g) {
        var lg = g.createLinearGradient(0, 0, 0, h); lg.addColorStop(0, top); lg.addColorStop(1, bottom); g.fillStyle = lg; g.fillRect(0, 0, w, h);
        var v = g.createRadialGradient(w / 2, h * .35, Math.min(w, h) * .2, w / 2, h / 2, Math.max(w, h) * .75);
        v.addColorStop(0, 'rgba(255,255,255,' + (skin === 'b' ? .10 : .07) + ')'); v.addColorStop(1, 'rgba(0,0,0,.35)'); g.fillStyle = v; g.fillRect(0, 0, w, h);
      }), 0, 0, w, h);
    },
    // Glow is shadowBlur: cheap for a handful of shapes, never use it on every tile.
    glow: function (ctx, color, blur) { ctx.shadowColor = color; ctx.shadowBlur = blur; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0; },
    noGlow: function (ctx) { ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; },
    // Crisp rendering on high-DPI phones without changing game coordinates.
    // Only safe where input code converts with getBoundingClientRect + logical W/H, not cv.width.
    hidpi: function (cv, ctx, w, h) {
      var d = Math.max(1, Math.min(2.5, window.devicePixelRatio || 1));
      cv.width = Math.round(w * d); cv.height = Math.round(h * d); // intrinsic ratio stays w:h, so CSS sizing is unchanged
      ctx.setTransform(d, 0, 0, d, 0, 0); return d;
    },
    // Lightweight particle bursts (pooled array, no allocations per frame beyond the burst).
    burst: function (list, x, y, color, n) {
      for (var i = 0; i < (n || 12); i++) { var a = Math.random() * 6.283, v = 1 + Math.random() * 2.6; list.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 1, life: 1, c: color, r: 1.5 + Math.random() * 2.5 }); }
    },
    drawBurst: function (ctx, list) {
      for (var i = list.length - 1; i >= 0; i--) {
        var p = list[i]; p.x += p.vx; p.y += p.vy; p.vy += .12; p.life -= .035;
        if (p.life <= 0) { list.splice(i, 1); continue; }
        ctx.globalAlpha = p.life; ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (skin === 'b' ? 1.2 : 1), 0, 7); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
  };
  window.GameUI.fx = fx;
}());

<script>'use strict';
/* ================= 肺活量测试 ================= */
function $(id){ return document.getElementById(id); }
var cv=$('cv'), ctx=cv.getContext('2d');
var W=cv.width, H=cv.height;
var FONT='-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif';

/* ---------- 音频（全部 WebAudio 合成） ---------- */
var AC=null;
function ac(){
  if(!AC){ var C=window.AudioContext||window.webkitAudioContext; AC=new C(); }
  if(AC.state==='suspended'){ AC.resume(); }
  return AC;
}
var muted=localStorage.getItem('g100_mute')==='1';
function beep(f0,f1,dur,type,vol,delay){
  if(muted) return;
  try{
    var a=ac(), t=a.currentTime+(delay||0);
    var o=a.createOscillator(), g=a.createGain();
    o.type=type;
    o.frequency.setValueAtTime(Math.max(30,f0),t);
    if(f1 && f1!==f0){ o.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t+dur); }
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol,t+0.015);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(a.destination);
    o.start(t); o.stop(t+dur+0.05);
  }catch(e){}
}
function sClick(){ beep(660,660,0.07,'square',0.10,0); }
function sCorrect(){ beep(523,523,0.12,'sine',0.22,0); beep(784,784,0.20,'sine',0.22,0.11); }
function sWrong(){ beep(200,120,0.28,'sawtooth',0.16,0); }
function sWin(){ var n=[523,659,784,1047]; for(var i=0;i<n.length;i++){ beep(n[i],n[i],0.16,'triangle',0.22,i*0.13); } }
var noiseBuf=null;
function sBreath(up){
  if(muted) return;
  try{
    var a=ac(), t=a.currentTime, dur=1.1, i;
    if(!noiseBuf){
      noiseBuf=a.createBuffer(1,Math.floor(a.sampleRate*1.6),a.sampleRate);
      var d=noiseBuf.getChannelData(0);
      for(i=0;i<d.length;i++){ d[i]=Math.random()*2-1; }
    }
    var src=a.createBufferSource(); src.buffer=noiseBuf; src.loop=true;
    var f=a.createBiquadFilter(); f.type='bandpass'; f.frequency.value=750; f.Q.value=0.7;
    var g=a.createGain();
    if(up){
      g.gain.setValueAtTime(0.001,t);
      g.gain.exponentialRampToValueAtTime(0.22,t+dur*0.85);
    }else{
      g.gain.setValueAtTime(0.22,t);
      g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    }
    src.connect(f); f.connect(g); g.connect(a.destination);
    src.start(t); src.stop(t+dur+0.15);
  }catch(e){}
}

/* ---------- 状态 ---------- */
var state='start', paused=false;
var tG=0, lastTs=0;
var lungF=0;               /* 肺充盈度 0..1 */
var demoPhase='in', demoT=0, demoCycles=0, demoOver=false;
var airParts=[], airAcc=0;
var vol=0, peak=0, inhaling=false, inhaleT=0, exhaling=false, exhaleT=0, breathSndT=0;
var trials=[];
var qi=0, qScore=0;
var QUIZ=[
  {q:'1️⃣ 吸气时，膈肌处于什么状态？',
   o:['收缩，膈顶下降','舒张，膈顶上升','保持不动','先舒张后收缩'],a:0,
   w:'✅ 吸气时膈肌收缩，膈顶下降，胸廓上下径增大，肺随之扩张。'},
  {q:'2️⃣ 深吸气时，胸廓容积和肺内气压如何变化？',
   o:['胸廓扩大，肺内气压下降','胸廓缩小，肺内气压上升','胸廓扩大，肺内气压上升','都没有变化'],a:0,
   w:'✅ 胸廓扩大 → 肺扩张 → 肺内气压低于外界大气压，空气被压入肺内。'},
  {q:'3️⃣ 下列哪项不能有效提高肺活量？',
   o:['长期坚持跑步、游泳等有氧运动','长期久坐、缺乏运动','练习深呼吸、扩胸运动','保持挺胸抬头的正确姿势'],a:1,
   w:'✅ 久坐少动会使呼吸肌力量下降、胸廓活动度变小，肺活量难以提高。'}
];

function easeIO(p){ return p<0.5 ? 4*p*p*p : 1-Math.pow(-2*p+2,3)/2; }
function rr(c,x,y,w,h,r){
  c.beginPath();
  c.moveTo(x+r,y);
  c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r);
  c.closePath();
}

/* ---------- 绘制 ---------- */
/* ART T2-1 */var FX=window.GameUI&&GameUI.fx&&GameUI.fx.on?GameUI.fx:null;var sparks=[];
/* ART T2-1: candy-depth */
var luBg=null,luBgKey='';
function ensureLuBg(){
  var k=W+'x'+H; if(luBg&&luBgKey===k)return luBg; luBgKey=k;
  var c=document.createElement('canvas'); c.width=W; c.height=H; var g=c.getContext('2d');
  if(FX)FX.stage(g,W,H,'#0e2a48','#061018'); else {g.fillStyle='#07090d';g.fillRect(0,0,W,H);}
  luBg=c; return luBg;
}
function drawLungs(){
  var f=lungF;
  ctx.clearRect(0,0,W,H);
  ctx.drawImage(ensureLuBg(),0,0);
  /* 胸廓外框 */
  ctx.strokeStyle='rgba(140,180,220,0.22)'; ctx.lineWidth=3;
  rr(ctx,38,48,284,272,42); ctx.stroke();
  /* 气管 */
  if(FX){FX.tile(ctx,168,8,24,62,'#d98ca6',10);}
  else{ctx.fillStyle='#d98ca6';rr(ctx,168,8,24,62,10); ctx.fill();}
  /* 支气管 */
  ctx.strokeStyle='#d98ca6'; ctx.lineWidth=11; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(176,64); ctx.lineTo(132,100); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(184,64); ctx.lineTo(228,100); ctx.stroke();
  /* 肺 */
  var sc=0.72+0.42*f;
  var g=ctx.createLinearGradient(0,80,0,270);
  g.addColorStop(0,'#f8bbd0'); g.addColorStop(1,'#ec407a');
  ctx.fillStyle=g;
  if(FX)FX.glow(ctx,'#ec407a',14);
  ctx.beginPath(); ctx.ellipse(118,172,54*sc,80*sc,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(242,172,54*sc,80*sc,0,0,Math.PI*2); ctx.fill();
  if(FX)FX.noGlow(ctx);
  ctx.fillStyle='rgba(255,255,255,0.16)';
  ctx.beginPath(); ctx.ellipse(104,150,22*sc,36*sc,-0.25,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(228,150,22*sc,36*sc,-0.25,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='rgba(255,138,160,0.9)'; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.ellipse(118,172,54*sc,80*sc,0,0,Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(242,172,54*sc,80*sc,0,0,Math.PI*2); ctx.stroke();
  /* 气流粒子 */
  for(var i=0;i<airParts.length;i++){
    var p=airParts[i];
    ctx.save();
    ctx.globalAlpha=Math.max(0,Math.min(1,p.life));
    if(FX)FX.orb(ctx,p.x|0,p.y|0,Math.max(2,p.r|0),'#a5dcff');
    else{ctx.fillStyle='#a5dcff';ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();}
    ctx.restore();
  }
  /* 膈肌：吸气时下降变平，呼气时上升成穹顶 */
  var dy=282+42*f, lift=56-36*f;
  ctx.strokeStyle='#ef5350'; ctx.lineWidth=9; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(50,dy); ctx.quadraticCurveTo(180,dy-lift,310,dy); ctx.stroke();
  ctx.fillStyle='#ffb3ab'; ctx.font='700 12px '+FONT;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('膈肌',180,dy+18);
  /* 标注 */
  ctx.fillStyle='rgba(200,220,240,0.75)'; ctx.font='700 12px '+FONT;
  ctx.fillText('气管',208,34);
  ctx.fillText('肺',118,172-80*sc-12);
  ctx.fillText(f>0.5?'吸气中…':'呼气中…',180,344);
}
function render(){ drawLungs(); }

/* ---------- 更新 ---------- */
function spawnAir(up){
  if(up){
    airParts.push({x:172+Math.random()*16,y:16,vy:130,life:1,r:2+Math.random()*2});
  }else{
    var lx=Math.random()<0.5;
    airParts.push({x:(lx?118:242)+(Math.random()-0.5)*30,y:120,vy:-110,life:1,r:2+Math.random()*2});
  }
}
function update(dt){
  tG+=dt;
  var i;
  if(state==='start'||state==='end'){
    lungF=0.18+0.10*Math.sin(tG*1.4); /* 待机微呼吸 */
  }
  if(state==='demo' && !demoOver){
    demoT+=dt;
    airAcc+=dt;
    if(demoPhase==='in'){
      var p=Math.min(1,demoT/2.6);
      lungF=easeIO(p);
      if(airAcc>0.07){ airAcc=0; spawnAir(true); }
      if(p>=1){ demoPhase='out'; demoT=0; setDemoCap(1); sBreath(false); }
    }else{
      var q=Math.min(1,demoT/2.6);
      lungF=1-easeIO(q);
      if(airAcc>0.07){ airAcc=0; spawnAir(false); }
      if(q>=1){
        demoPhase='in'; demoT=0; demoCycles++;
        if(demoCycles>=2){ demoDone(); }
        else{ setDemoCap(0); sBreath(true); }
      }
    }
  }
  if(state==='exp'){
    if(inhaling){
      inhaleT+=dt;
      vol=Math.min(4500,4600*(1-Math.exp(-0.55*inhaleT)));
      if(vol>peak) peak=vol;
      lungF=vol/4500;
      breathSndT+=dt;
      if(breathSndT>1.0){ breathSndT=0; sBreath(true); }
      airAcc+=dt;
      if(airAcc>0.09){ airAcc=0; spawnAir(true); }
      $('volNum').innerHTML=Math.round(vol)+' <small>mL</small>';
    }else if(exhaling){
      exhaleT+=dt;
      var e=Math.min(1,exhaleT/0.9);
      vol=peak*(1-easeIO(e));
      lungF=Math.max(0,vol/4500);
      airAcc+=dt;
      if(airAcc>0.09){ airAcc=0; spawnAir(false); }
      $('volNum').innerHTML=Math.round(vol)+' <small>mL</small>';
      if(e>=1){
        exhaling=false; vol=0; peak=0; lungF=0;
        $('volNum').innerHTML='0 <small>mL</small>';
        if(trials.length>=3){ $('btnToQuiz').style.display='block'; }
      }
    }
  }
  for(i=airParts.length-1;i>=0;i--){
    var ap=airParts[i];
    ap.y+=ap.vy*dt; ap.life-=dt*1.1;
    if(ap.life<=0||ap.y<-10||ap.y>H+10) airParts.splice(i,1);
  }
}
function loop(ts){
  requestAnimationFrame(loop);
  if(paused){ lastTs=ts; return; }
  var dt=Math.min(0.05,(ts-lastTs)/1000||0);
  lastTs=ts;
  update(dt);
  render();
}

/* ---------- 界面 ---------- */
function setHud(txt){ $('hudV').innerHTML=txt; }
function showStart(){
  state='start'; paused=false;
  $('overlay').style.display='none';
  $('hud').style.display='none';
  $('demoWrap').style.display='none';
  $('expWrap').style.display='none';
  $('quizWrap').style.display='none';
  $('scrEnd').style.display='none';
  $('scrStart').style.display='block';
  $('btnPause').style.display='none';
}
function setDemoCap(k){
  if(k===0) $('demoCap').innerHTML='🫁 <b>吸气</b>：肋间肌、膈肌<b>收缩</b> → 胸廓扩大 → 肺扩张，空气进入';
  else $('demoCap').innerHTML='😮‍💨 <b>呼气</b>：肋间肌、膈肌<b>舒张</b> → 胸廓缩小 → 肺回缩，空气排出';
}
function startDemo(){
  ac(); sClick();
  state='demo'; demoOver=false;
  demoPhase='in'; demoT=0; demoCycles=0;
  lungF=0; airParts=[];
  $('scrStart').style.display='none';
  $('scrEnd').style.display='none';
  $('hud').style.display='none';
  $('expWrap').style.display='none';
  $('quizWrap').style.display='none';
  $('demoWrap').style.display='block';
  setDemoCap(0); sBreath(true);
  $('btnSkip').textContent='⏩ 跳过演示';
  $('btnSkip').onclick=function(){ sClick(); demoCycles=2; demoDone(); };
  $('btnPause').style.display='block';
}
function demoDone(){
  if(demoOver) return;
  demoOver=true;
  $('demoCap').innerHTML='✅ 演示结束！记住：肌肉<b>收缩</b>→胸廓扩大→<b>吸气</b>；肌肉<b>舒张</b>→胸廓缩小→<b>呼气</b>。肺是被胸廓带着运动的！';
  $('btnSkip').textContent='🧪 开始实验';
  $('btnSkip').onclick=function(){ startExp(); };
}
function updTrials(){
  var h='';
  for(var i=0;i<trials.length;i++){ h+='<div class="tchip">'+trials[i]+'</div>'; }
  for(var j=trials.length;j<3;j++){ h+='<div class="tchip" style="color:#54687e">-</div>'; }
  $('trialList').innerHTML=h;
  setHud('🧪 实验：第 <b>'+Math.min(trials.length+1,3)+'</b>/3 次');
}
function startExp(){
  sClick();
  state='exp';
  trials=[]; vol=0; peak=0; lungF=0;
  inhaling=false; exhaling=false;
  $('demoWrap').style.display='none';
  $('quizWrap').style.display='none';
  $('expWrap').style.display='block';
  $('hud').style.display='block';
  $('volNum').innerHTML='0 <small>mL</small>';
  $('holdHint').textContent='按住按钮深吸气，松开呼气';
  $('trialMsg').textContent='';
  $('btnToQuiz').style.display='none';
  $('holdBtn').textContent='👆 按住吸气';
  updTrials();
  $('btnPause').style.display='block';
}
function endInhale(){
  if(!inhaling) return;
  inhaling=false;
  $('holdBtn').classList.remove('holding');
  $('holdBtn').textContent='👆 按住吸气';
  var p=Math.round(peak);
  if(p<300){
    $('trialMsg').textContent='⚠️ 这次吸气太短了（'+p+' mL），不计数，再深深吸一次！';
    vol=0; peak=0; lungF=0;
    $('volNum').innerHTML='0 <small>mL</small>';
    return;
  }
  trials.push(p);
  updTrials();
  $('trialMsg').textContent='✅ 第'+trials.length+'次：'+p+' mL'+(trials.length<3?'，再来一次！':'，完成！');
  $('holdHint').textContent=trials.length>=3?'🎉 3 次测完，看看你的肺活量！':'👆 按住开始第'+(trials.length+1)+'次';
  exhaling=true; exhaleT=0;
  sBreath(false);
}
var holdBtn=$('holdBtn');
holdBtn.addEventListener('pointerdown',function(e){
  if(state!=='exp'||paused||exhaling||trials.length>=3) return;
  e.preventDefault();
  inhaling=true; inhaleT=0; peak=0; breathSndT=1;
  sBreath(true);
  holdBtn.classList.add('holding');
  holdBtn.textContent='🌬️ 吸气中…松开呼气';
});
holdBtn.addEventListener('contextmenu',function(e){ e.preventDefault(); });
window.addEventListener('pointerup',function(){ endInhale(); });
window.addEventListener('pointercancel',function(){ endInhale(); });

/* ---------- 答题 ---------- */
function startQuiz(){
  sClick();
  state='quiz'; qi=0; qScore=0;
  $('expWrap').style.display='none';
  $('quizWrap').style.display='block';
  $('hud').style.display='block';
  renderQuiz();
}
function renderQuiz(){
  var Q=QUIZ[qi];
  setHud('📝 答题：第 <b>'+(qi+1)+'</b>/3 题 · 得分 <b>'+qScore+'</b>');
  $('qTitle').innerHTML=Q.q;
  $('qWhy').style.display='none';
  $('btnNext').style.display='none';
  var box=$('qOpts'); box.innerHTML='';
  for(var j=0;j<Q.o.length;j++){
    (function(j){
      var b=document.createElement('button');
      b.className='qopt';
      b.textContent=String.fromCharCode(65+j)+'．'+Q.o[j];
      b.addEventListener('pointerdown',function(e){ e.preventDefault(); answer(j,b); });
      box.appendChild(b);
    })(j);
  }
}
function answer(j,btn){
  var Q=QUIZ[qi];
  var opts=$('qOpts').children;
  for(var k=0;k<opts.length;k++){ opts[k].disabled=true; }
  if(j===Q.a){
    qScore+=10;
    btn.classList.add('right');
    sCorrect();
    if(navigator.vibrate){ try{ navigator.vibrate(60); }catch(e){} }
  }else{
    btn.classList.add('wrong');
    opts[Q.a].classList.add('right');
    sWrong();
    if(navigator.vibrate){ try{ navigator.vibrate(180); }catch(e){} }
  }
  setHud('📝 答题：第 <b>'+(qi+1)+'</b>/3 题 · 得分 <b>'+qScore+'</b>');
  $('qWhy').innerHTML=Q.w;
  $('qWhy').style.display='block';
  $('btnNext').textContent=(qi<2)?'下一题 →':'查看结果 🎉';
  $('btnNext').style.display='block';
}
$('btnNext').addEventListener('pointerdown',function(e){
  e.preventDefault(); sClick();
  qi++;
  if(qi<3) renderQuiz();
  else showEnd();
});
$('btnToQuiz').addEventListener('pointerdown',function(e){ e.preventDefault(); startQuiz(); });

/* ---------- 结束 ---------- */
function rating(v){
  if(v<2000) return '还要加油，多锻炼！';
  if(v<=3500) return '良好！';
  return '优秀！';
}
function showEnd(){
  sWin();
  state='end';
  $('quizWrap').style.display='none';
  $('hud').style.display='none';
  $('btnPause').style.display='none';
  var vital=trials.length?Math.max.apply(null,trials):0;
  var best=parseInt(localStorage.getItem('g100_lungcap_hs')||'0',10);
  if(qScore>best){ best=qScore; localStorage.setItem('g100_lungcap_hs',String(best)); }
  var html='<div class="score">🫁 你的肺活量：<b>'+vital+'</b> mL<br>'+
    '<span class="eval">'+rating(vital)+'</span><br>'+
    '📝 答题得分：<b>'+qScore+'</b> / 30<br>'+
    '📊 最高分：<b>'+best+'</b></div>'+
    '<h3>📚 实验结论</h3><div class="con">'+
    '🔬 <b>呼吸运动原理</b>：呼吸肌（肋间肌、膈肌）<b>收缩</b> → 胸廓扩大 → 肺扩张 → <b>吸气</b>；'+
    '呼吸肌<b>舒张</b> → 胸廓缩小 → 肺回缩 → <b>呼气</b>。肺本身没有肌肉，是被胸廓“带着”运动的。<br>'+
    '💪 <b>影响肺活量的因素</b>：体育锻炼（尤其跑步、游泳等有氧运动）、姿势（挺胸抬头让胸廓充分打开）、'+
    '身体健康状况、年龄等。想提高肺活量，就从每天锻炼开始吧！</div>';
  $('endBody').innerHTML=html;
  $('scrEnd').style.display='block';
  window.scrollTo(0,0);
}

/* ---------- 暂停 / 静音 ---------- */
$('btnPause').addEventListener('pointerdown',function(e){
  e.preventDefault();
  if(state==='demo'||state==='exp'||state==='quiz'){
    if(inhaling){ inhaling=false; vol=0; peak=0; lungF=0; $('holdBtn').classList.remove('holding'); $('volNum').innerHTML='0 <small>mL</small>'; }
    paused=true;
    $('overlay').style.display='flex';
  }
});
$('btnResume').addEventListener('pointerdown',function(e){
  e.preventDefault(); sClick();
  paused=false;
  $('overlay').style.display='none';
});
$('btnQuit').addEventListener('pointerdown',function(e){
  e.preventDefault(); sClick();
  showStart();
});
function updMute(){ $('btnMute').textContent=muted?'🔇':'🔊'; }
$('btnMute').addEventListener('pointerdown',function(e){
  e.preventDefault();
  muted=!muted;
  localStorage.setItem('g100_mute',muted?'1':'0');
  updMute();
  if(!muted) sClick();
});
$('btnStart').addEventListener('pointerdown',function(e){ e.preventDefault(); startDemo(); });
$('btnRetry').addEventListener('pointerdown',function(e){ e.preventDefault(); startExp(); });
document.addEventListener('visibilitychange',function(){
  if(document.hidden && (state==='demo'||state==='exp'||state==='quiz') && !paused){
    if(inhaling){ inhaling=false; vol=0; peak=0; lungF=0; }
    paused=true;
    $('overlay').style.display='flex';
  }
});

/* ---------- 启动 ---------- */
updMute();
showStart();
requestAnimationFrame(loop);
</script>
</body>
</html>
