<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>孤岛王国</title>
<link rel="icon" href="data:,">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{display:flex;justify-content:center;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.wrap{width:100%;max-width:480px;height:100%;padding:12px;display:flex;flex-direction:column;align-items:center;gap:10px}
.topbar{width:100%;display:flex;justify-content:space-between;align-items:center;flex-wrap:nowrap!important}
.topbar .stat{display:flex;gap:8px;align-items:center;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:13px}
.topbar .tools{display:flex;gap:6px}
.topbar .tools .iconbtn{min-width:44px;min-height:44px;padding:0 6px}
.stagebox{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
#cv{touch-action:none;display:block}
.overlay{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;z-index:20;padding:24px;text-align:center}
.overlay.hidden{display:none}
.lvgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:100%}
.lvgrid .lvl{min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:17px;padding:4px!important;line-height:1.1}
.lvgrid .lvl small{font-size:10px;letter-spacing:-1px;margin-top:2px}
.rowbtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:100%}
#tutStep{font-size:12px;opacity:.7}
#toast{position:fixed;left:50%;top:16%;transform:translate(-50%,-10px);background:rgba(10,8,30,.88);color:#fff;font-weight:800;padding:10px 18px;border-radius:999px;z-index:999;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;font-size:15px;box-shadow:0 0 18px rgba(255,61,154,.5);white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}

.pal{width:100%;display:flex;gap:5px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.pal::-webkit-scrollbar{display:none}
.pal button{flex:0 0 auto;min-width:58px;min-height:54px;padding:2px 4px!important;font-size:19px;line-height:1.05;display:flex;flex-direction:column;align-items:center;justify-content:center}
.pal button small{font-size:9.5px;font-weight:900;white-space:nowrap}
.pal button.on{outline:3px solid #fff;outline-offset:-3px}
.act{width:100%;display:flex;gap:6px}
.act button{flex:1;min-height:46px;font-size:15px!important}
#info{font-size:12px;font-weight:800;text-align:center;min-height:16px;width:100%}
</style>
<!-- GAME UI BEGIN -->
<style>
:root{--page:#dcece5;--surface:#f5fff9;--soft:#c8dfd2;--ink:#203f35;--muted:#4d7263;--accent:#28654e;--on-accent:#ffffff;--line:#a1c5b4;--stage:#102f2b;--page:#16a37a;--surface:#f6fff0;--soft:#d8f3cf;--ink:#1b4a2c;--muted:#476e52;--accent:#7d6414;--on-accent:#ffffff;--line:#7fd06b;--b-bg1:#93e46c;--b-bg2:#16a37a;--b-btn:#ffcc29;--b-btn-hi:#ffde74;--b-edge:#d48a00;--b-glow:#d8ffb0;--b-glow-rgb:216,255,176;--b-pedge-rgb:127,208,107;--b-btn-ink:#754c00;--b-btn-tsh:0 1px 0 rgba(255,255,255,.45);--b-coin-ink:#754c00;--b-coin-tsh:none;--b-key-ink:#7d6414;--b-title:#905e00}
/* Shared presentation only; mechanics and state remain inside each standalone game. */
html.game-ui{background:var(--page);color:var(--ink);color-scheme:light;font-family:"Bahnschrift","Microsoft YaHei UI","PingFang SC",sans-serif}
html.game-ui:is([data-theme="space"],[data-theme="arcade"],[data-theme="lab"],[data-theme="ocean"],[data-theme="magic"]){color-scheme:dark}
.game-ui body{background:var(--page);color:var(--ink);font-family:inherit;overscroll-behavior:none}
.game-ui body>.wrap{padding:20px 16px max(20px,env(safe-area-inset-bottom));gap:14px;max-width:500px}
.game-ui #app{background:var(--page);color:var(--ink)}
.game-ui :is(.topbar,#topbar){gap:8px;flex-wrap:wrap;min-height:58px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:10px 12px;box-shadow:0 3px 0 var(--soft);font-size:13px}
.game-ui :is(.title,.tb-title,.tb-title,#topbar .t,.topbar .t){color:var(--ink);font-size:16px;font-weight:750;letter-spacing:0}
.game-ui :is(.topbar,.hud,#hud,#topbar) :is(b,.v){color:var(--accent);font-variant-numeric:tabular-nums}
.game-ui :is(.stat,.topbar .s,.topbar .stat,.scorebar,.stats,.tip,.hint,.hintline,.hsline,.best,.hiscore){color:var(--muted);line-height:1.7}
.game-ui :is(.hint,.hintline,.tip){font-size:12px;max-width:40em;text-wrap:pretty}
.game-ui .scorebar{padding:6px 10px;gap:8px;flex-wrap:wrap}
.game-ui :is(.iconbtn,.iconBtn,.icobtn,.ibtn,.tbtn,.hbtn,.ib,.iconBtn,.pause){min-width:44px;min-height:44px;flex-shrink:0;border-radius:12px;background:var(--soft);color:var(--ink);border:1px solid var(--line);box-shadow:none;font-size:17px}
.game-ui button{font-family:inherit;cursor:pointer;touch-action:manipulation}
.game-ui button:focus-visible,.game-ui [tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.game-ui :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn){background:var(--accent);color:var(--on-accent);border:1px solid transparent;border-radius:13px;min-height:50px;padding:13px 28px;font-size:16px;font-weight:750;letter-spacing:0;box-shadow:0 4px 0 var(--line);text-shadow:none;max-width:100%}
.game-ui :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn):active{box-shadow:none;transform:translateY(2px)}
.game-ui :is(.ghost,.ghostbtn,.btn2,.abtn,.toolbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line);box-shadow:none;border-radius:12px;min-height:44px}
.game-ui :is(.rowbtns,.btnrow,.ctlrow){gap:10px;flex-wrap:wrap;justify-content:center}
.game-ui :is(.pill,.hudbox,.hud .p){background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:none;font-variant-numeric:tabular-nums}
.game-ui :is(.dbtn,.cbtn,.gbtn,.holdbtn,.firebtn,.bombbtn,.jumpbtn,.pumpbtn,.nbtn){border-radius:12px;box-shadow:0 3px 0 var(--line);min-height:44px}
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv,.screen):has(>.ui-panel){padding:20px;overflow-y:auto;overscroll-behavior:contain}
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv):has(>.ui-panel){background:var(--page);backdrop-filter:none;justify-content:safe center;align-items:center}
.game-ui .ui-panel{width:min(100%,380px);max-height:100%;overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:18px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:24px;padding:30px 24px;box-shadow:0 8px 0 var(--soft),0 20px 48px #15253618;text-align:center;margin:auto}
.game-ui .ui-panel :is(.card,.panel,.pausecard,.ovcard){display:contents}
.game-ui .ui-panel :is(h1,h2,.gamename,.gametitle){font-size:30px;line-height:1.25;font-weight:800;color:var(--ink);background:none;-webkit-text-fill-color:currentColor;text-shadow:none;letter-spacing:-.6px;margin:0}
.game-ui .ui-panel :is(p,.howto,.sub,.rule){font-size:14px;line-height:1.85;color:var(--muted);background:none;border:0;box-shadow:none;padding:0;margin:0;max-width:32em;text-align:left;white-space:normal}
.game-ui .ui-panel :is(.bigemoji,.bigemoji,.ic,.big):not(.bigscore){animation:none;filter:none;text-shadow:none}
.game-ui .ui-emblem{width:90px;height:90px;display:grid;place-items:center;border:1px solid var(--line);border-radius:28px;background:var(--soft);font-size:48px;line-height:1;flex-shrink:0;position:relative}
.game-ui[data-theme="wood"] .ui-emblem{border-radius:50%;box-shadow:inset 0 0 0 5px var(--surface),inset 0 0 0 6px var(--line)}
.game-ui[data-theme="wood"] .ui-panel h1{font-family:"STKaiti","KaiTi","Microsoft YaHei",serif;letter-spacing:2px}
.game-ui[data-theme="ice"] .ui-emblem{border-radius:26px 8px 26px 8px}
.game-ui[data-theme="space"] .ui-emblem{background:radial-gradient(circle at center,var(--soft) 42%,transparent 43%),var(--surface);border-radius:50%;outline:1px solid var(--line);outline-offset:7px;margin:7px}
.game-ui[data-theme="kitchen"] .ui-emblem{border-radius:22px;border-bottom:5px solid var(--line)}
.game-ui .ui-panel :is(.score,.bigscore,.bigScore,.scorebig){color:var(--accent);font-size:48px;font-weight:800;font-variant-numeric:tabular-nums}
.game-ui .ui-panel :is(.best,.hsline,.hiscore,.endstats,.endstats b){color:var(--muted);font-size:13px;line-height:1.8}
.game-ui .ui-mode{display:grid;grid-template-columns:1fr 1fr;gap:5px;background:var(--soft);padding:5px;border:1px solid var(--line);border-radius:14px;width:100%}
.game-ui .ui-mode button{min-height:44px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-size:14px;font-weight:700;box-shadow:none}
.game-ui .ui-mode button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 2px 5px #1525361a}
.game-ui .ui-panel .ui-mode-note{font-size:12px;line-height:1.6;text-align:center;color:var(--muted)}
.game-ui .ui-mode-status{display:block;padding:5px 10px;color:var(--accent);font-size:11px;font-weight:700;line-height:1.5;text-align:center;border:1px solid var(--line);border-radius:8px;background:var(--surface);margin:4px auto;max-width:100%;pointer-events:none}
.game-ui body>.wrap>canvas:not(#fx){background-color:var(--stage);box-shadow:0 0 0 1px var(--line),0 6px 0 var(--soft);border-radius:18px;flex-shrink:0}
.game-ui .screen>canvas.game{box-shadow:0 0 0 1px var(--line),0 6px 0 var(--soft)}
.game-ui #hud{gap:6px;background:var(--surface);color:var(--ink)}
.game-ui #hud :is(.left,.t,.s,.grp,.pill){color:var(--ink)}
.game-ui #hud .pill{background:var(--surface);border-color:var(--line)}
.game-ui body canvas:is(#cv,#game,#board){background-color:var(--stage)}
.game-ui :is(button.dbtn,button.cbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.game-ui :is(button.lvl,button.lvlbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line);border-radius:12px;min-height:54px}
.game-ui :is(button.lvl,button.lvlbtn) :is(.nc,.sz,small){color:var(--muted)}
.game-ui .ui-panel button.lvl{margin:0;min-width:44px;box-shadow:none;padding:8px}
.game-ui #hud :is(.left,.right,.hudl,.hbtns){gap:5px;flex-wrap:wrap}
.game-ui #hud :is(.left,.hudl){min-width:0;flex-shrink:1}
.game-ui #hud :is(.pill,.left){font-size:12px}
.game-ui button:disabled{cursor:default;opacity:.45;box-shadow:none}
.game-ui .ui-panel .ui-assist-note{color:var(--accent);font-weight:700}
@media(min-width:700px){.game-ui body>.wrap{padding-top:32px}.game-ui .ui-panel{padding:36px 30px}}
@media(max-width:360px){.game-ui body>.wrap{padding:10px;gap:10px}.game-ui .ui-panel{padding:22px 18px;gap:13px}.game-ui .ui-panel h1{font-size:26px}.game-ui .ui-emblem{width:70px;height:70px;font-size:38px}.game-ui :is(.topbar,#topbar){gap:5px;padding:8px}.game-ui :is(.iconbtn,.icobtn,.ibtn,.tbtn,.ib){min-width:40px;min-height:44px}}
@media(max-height:650px){.game-ui .ui-panel{padding:18px;gap:12px}.game-ui .ui-emblem{width:60px;height:60px;font-size:32px}.game-ui .ui-panel h1{font-size:25px}.game-ui .ui-panel :is(p,.howto,.sub,.rule){font-size:13px}}
@media(prefers-reduced-motion:reduce){.game-ui *, .game-ui *::before,.game-ui *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
/* 2026-10-20 热修：开局/结算遮罩铺满整屏，主按钮固定在面板底部，避免被画布尺寸裁切（#10） */
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv):has(>.ui-panel){position:fixed;inset:0;z-index:1000;border-radius:0;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
.game-ui .ui-panel{touch-action:pan-y}
.game-ui .ui-panel :is(#startBtn,#btnStart,.startbtn,#bStart,#restartBtn,#btnRestart,#againBtn,#btnAgain,#retryBtn,#btnRetry,#playBtn,#btnPlay){position:sticky;bottom:0;z-index:3;flex-shrink:0}
.game-ui .ui-panel :not(.card,.panel,.pausecard,.ovcard,.ui-mode):has(>:is(#startBtn,#btnStart,.startbtn,#bStart,#restartBtn,#btnRestart,#againBtn,#btnAgain,#retryBtn,#btnRetry,#playBtn,#btnPlay)){position:sticky;bottom:0;z-index:3;flex-shrink:0;background:var(--surface);box-shadow:0 -10px 10px -6px var(--surface)}


/* ===== Direction B · 霓虹糖果 Pop Arcade ===== saturated gradients, chunky bevels with a hard bottom edge, sticker panels, neon on dark themes */
html.game-ui[data-skin="b"]{--fb:"HarmonyOS Sans SC","MiSans","OPPOSans","vivo Sans","Noto Sans SC","Noto Sans CJK SC","PingFang SC","Microsoft YaHei UI",system-ui,sans-serif;--bounce:cubic-bezier(.34,1.56,.64,1);--bg:radial-gradient(circle at 12% 18%,rgba(255,255,255,.28) 0 38px,transparent 40px),radial-gradient(circle at 88% 30%,rgba(255,255,255,.16) 0 64px,transparent 66px),radial-gradient(circle at 20% 82%,rgba(255,255,255,.14) 0 52px,transparent 54px),radial-gradient(rgba(255,255,255,.16) 1.5px,transparent 2.2px) 0 0/22px 22px,linear-gradient(165deg,var(--b-bg1),var(--b-bg2));font-family:var(--fb)}

html.game-ui[data-skin="b"] .ui-panel :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn,button.actBtn):not(.ghost):not(#\#){min-height:56px;padding:14px 34px;font-size:19px;letter-spacing:1px}

  const cx=Math.floor(f.x),cy=Math.floor(f.y);
  // 投石兵：射程内有建筑就远程攻击
  if(f.D.rng){const tg=bld.filter(b=>Math.hypot(b.x+.5-f.x,b.y+.5-f.y)<=f.D.rng).sort((a,b)=>Math.hypot(a.x-f.x,a.y-f.y)-Math.hypot(b.x-f.x,b.y-f.y))[0];if(tg){f.cd-=dt;if(f.cd<=0){f.cd=1.6;shots.push({x:f.x,y:f.y,tx:tg.x+.5,ty:tg.y+.5,t:.3,c:'#555'});dmgB(tg,f.D.dmg);}continue;}}
  // 沿势场走
  let best=null,bd=field[cy]&&field[cy][cx]!=null?field[cy][cx]:1e9;for(const [a,b] of nb4(cx,cy)){if(!map[b][a])continue;if(field[b][a]<bd){bd=field[b][a];best=[a,b];}}
  const here=bAt(cx,cy);
  if(!best){const tg=castle;f.cd-=dt;if(f.cd<=0){f.cd=1;dmgB(tg,f.D.dmg);}continue;}
  const nbB=bAt(best[0],best[1]);
  if(nbB&&Math.hypot(best[0]+.5-f.x,best[1]+.5-f.y)<1.05){f.cd-=dt;if(f.cd<=0){f.cd=1;dmgB(nbB,f.D.dmg);nbB.hit=.2;tone(150,.05,'square',.04);}continue;}
  const tx=best[0]+.5,ty=best[1]+.5,dx=tx-f.x,dy=ty-f.y,l=Math.hypot(dx,dy)||1;f.x+=dx/l*f.D.sp*dt;f.y+=dy/l*f.D.sp*dt;}
 // 防御
 for(const b of bld){if(!(b.k==='tower'||b.k==='castle')||(b.k==='tower'&&!b.on))continue;b.cd=(b.cd||0)-dt;if(b.cd>0)continue;const rg=b.k==='castle'?2.5:2.5+((b.lv||1)-1)*.5;
  let tg=null,td=1e9;for(const f of foes){if(f.delay>0)continue;const d=Math.hypot(f.x-b.x-.5,f.y-b.y-.5);if(d<=rg&&d<td){td=d;tg=f;}}
  if(tg){const dm=(b.k==='castle'?5:6+((b.lv||1)-1)*4)*shrine;b.cd=b.k==='castle'?.8:.7;tg.hp-=Math.max(1,dm-tg.D.arm);tg.hit=.15;shots.push({x:b.x+.5,y:b.y+.3,tx:tg.x,ty:tg.y,t:.15,c:'#ffe066'});if(!FAST)tone(900,.03,'triangle',.03);}}
 for(const s of sold){let tg=null,td=1e9;for(const f of foes){if(f.delay>0)continue;const d=Math.hypot(f.x-s.x,f.y-s.y);if(d<td){td=d;tg=f;}}
  if(tg){if(td>.6){s.x+=(tg.x-s.x)/td*1.4*dt;s.y+=(tg.y-s.y)/td*1.4*dt;}else{s.cd-=dt;if(s.cd<=0){s.cd=.8;tg.hp-=Math.max(1,5-tg.D.arm);tg.hit=.15;}}}}
 sold=sold.filter(s=>s.hp>0);
 for(const f of foes)if(f.hp<=0){res.gold+=f.D.boss?15:1;if(FX)FX.burst(sparks,f.x*TS,GY+f.y*TS,f.D.boss?'#ffcf33':'#ff6b6b',f.D.boss?30:8);}
 foes=foes.filter(f=>f.hp>0);
 if(state==='raid'&&!foes.length)endRaid();}
function endRaid(){raidN++;state='build';lands=[];if(!FAST){toast('✅ 击退海盗！'+(raidN<S.raids?'下一波在 '+S.gap+' 天后':''),2200);tone(660,.15,'triangle');}
 if(raidN>=S.raids){win();return;}nextRaid=day+S.gap;renderPal();hud();}
// ---------- 流程 ----------
function startLevel(i){si=i;S=SC[i];genMap(S);bld=[];castle={k:'castle',x:4,y:5,hp:B.castle.hp,max:B.castle.hp,lv:1};bld.push(castle);res={...S.res};pop=3;day=1;raidN=0;nextRaid=S.first;lands=[];foes=[];sold=[];shots=[];pick='farm';state='build';
 ['lvlScr','overScr','pauseOv','startScr','bInfo'].forEach(k=>show(k,false));fit();renderPal();hud();bgK=null;if(S.tip&&!FAST)toast(S.tip,3000);}
function hud(){$('lvT').textContent=si+1;$('dayT').textContent=day;$('score').textContent=save.stars.reduce((a,b)=>a+(b||0),0);$('nextBtn2').disabled=state!=='build';$('nextBtn2').textContent=state==='raid'?'⚔ 战斗中…':(day+1===nextRaid?'迎战海盗 ⚔':'下一天 ▶');
 const p=prod();$('info').textContent=info||('预计每天 🍖'+(p.food>=0?'+':'')+p.food+' 🪵+'+p.wood+' 🪨+'+p.stone+' 🪙+'+p.gold+' · 空闲人口 '+staff());info='';}
function renderPal(){const pl=$('pal');pl.innerHTML='';for(const k of ORDER){const D=B[k];const lock=k==='shrine'&&si<4||k==='market'&&si<1||k==='barracks'&&si<1;const e=document.createElement('button');e.className='ghost'+(pick===k?' on':'');e.disabled=lock||state!=='build';
  e.innerHTML=(lock?'🔒':D.a)+'<small>'+(lock?'后续解锁':D.n)+'</small><small>'+(lock?'':costStr(D.cost))+'</small>';e.onclick=()=>{pick=pick===k?null:k;info=pick?D.n+'：'+D.d+'（'+costStr(D.cost)+(D.w?'，需 '+D.w+' 名工人':'')+'）':'';renderPal();hud();};pl.appendChild(e);}}
function place(k,x,y){const D=B[k];if(state!=='build')return'现在不能建造';if(!map[y]||!map[y][x])return'不能建在海上';if(bAt(x,y))return'这里已有建筑';if(!D.on.includes(map[y][x]))return D.n+'不能建在'+TILE[map[y][x]].n+'上';
 if(k==='quarry'&&!nb4(x,y).some(([a,b])=>map[b][a]===4))return'采石场必须挨着山石';if(!canPay(D.cost))return'资源不足：需要 '+costStr(D.cost);
 pay(D.cost);bld.push({k,x,y,hp:D.hp,max:D.hp,lv:1});staff();if(!FAST)tone(520,.08,'square',.06,780);if(FX)FX.burst(sparks,(x+.5)*TS,GY+(y+.5)*TS,'#fff',8);hud();renderPal();return'';}
function win(){state='over';const r=castle.hp/castle.max;const st=r>=.75?3:r>=.4?2:1;if(st>(save.stars[si]||0))save.stars[si]=st;Store.set('save',save);hud();
 tone(523,.12,'triangle');tone(659,.12,'triangle',.1,0,.12);tone(1046,.3,'triangle',.1,0,.25);
 const go=()=>{$('overH').textContent=S.boss?'👑 击败海盗王！':'🏝️ 王国屹立不倒';$('finalScore').textContent=starStr(st);$('overText').textContent='坚持 '+day+' 天 · 击退 '+raidN+' 波海盗 · 人口 '+pop+' · 城堡 '+Math.ceil(castle.hp)+'/'+castle.max+(st<3?'（城堡≥75% 得三星）':'');$('nextBtn').classList.toggle('hidden',si>=SC.length-1);show('overScr',true);};FAST?go():setTimeout(go,700);}
function lose(){if(state==='over')return;state='over';tone(220,.5,'sawtooth',.08,70);const go=()=>{$('overH').textContent='🔥 城堡陷落';$('finalScore').textContent='第 '+(raidN+1)+' 波';$('overText').textContent='提示：箭塔放在登陆点（⚠）与城堡之间，城墙能拖住海盗，兵营士兵会主动拦截。';$('nextBtn').classList.add('hidden');show('overScr',true);};FAST?go():setTimeout(go,700);}
// ---------- 输入 ----------
let selB=null;
cv.addEventListener('pointerdown',e=>{e.preventDefault();if(state!=='build')return;const q=posOf(e,cv,W,H);const x=Math.floor(q.x/TS),y=Math.floor((q.y-GY)/TS);if(x<0||y<0||x>=C||y>=R)return;
 const b=bAt(x,y);if(b){openB(b);return;}if(!pick){info=TILE[map[y][x]].n+'：选择下方建筑后点击建造';hud();return;}const m=place(pick,x,y);if(m){info='⚠ '+m;hud();tone(200,.08,'sawtooth',.04);}});
function openB(b){selB=b;const D=B[b.k];$('biH').textContent=D.a+' '+D.n+(b.lv>1?' Lv'+b.lv:'');$('biP').innerHTML='耐久 '+Math.ceil(b.hp)+'/'+b.max+(D.w?'<br>'+(b.on?'✅ 已有工人':'💤 缺少工人（人口不足）'):'')+(D.d?'<br>'+D.d:'');
 const up=D.up&&(b.lv||1)<3;$('biUp').classList.toggle('hidden',!up);if(up){$('biUp').textContent='升级 '+costStr(D.up);$('biUp').disabled=!canPay(D.up);}
 $('biDel').classList.toggle('hidden',b.k==='castle');show('bInfo',true);}
$('biUp').onclick=()=>{const b=selB,D=B[b.k];if(!canPay(D.up))return;pay(D.up);b.lv=(b.lv||1)+1;b.max=Math.round(b.max*1.5);b.hp=b.max;tone(880,.12,'triangle');show('bInfo',false);hud();};
$('biDel').onclick=()=>{const b=selB;const D=B[b.k];for(const [k,v] of Object.entries(D.cost))res[k]+=Math.floor(v/2);bld.splice(bld.indexOf(b),1);staff();show('bInfo',false);hud();};
$('biClose').onclick=()=>show('bInfo',false);
$('nextBtn2').onclick=()=>{if(state==='build'){tone(440,.06,'triangle');newDay();}};
$('actA').onclick=()=>{pick=null;renderPal();info='点击建筑查看详情；⚠ 为海盗登陆点，倒计时见左上';hud();};
$('spdBtn').onclick=()=>{spd=spd===1?2:spd===2?3:1;$('spdBtn').textContent=spd+'×';};
// ---------- 绘制 ----------
let bgK=null,bgC=null;
function drawBg(g){g.fillStyle='#3fa7e0';g.fillRect(0,0,W,H);for(let y=0;y<R;y++)for(let x=0;x<C;x++){const t=map[y][x];const px=x*TS,py=GY+y*TS;
  if(!t){g.fillStyle=(x+y)%2?'#45ade6':'#3aa1da';g.fillRect(px,py,TS,TS);continue;}
  g.fillStyle=TILE[t].c;g.fillRect(px,py,TS,TS);g.fillStyle='rgba(0,0,0,.05)';if((x+y)%2)g.fillRect(px,py,TS,TS);
  if(t===3){txt(g,'🌲',px+13,py+15,16);txt(g,'🌳',px+27,py+27,16);}if(t===4){txt(g,'⛰️',px+20,py+22,22);}if(t===5){g.strokeStyle='rgba(110,80,20,.25)';g.lineWidth=2;for(let i=8;i<40;i+=10){g.beginPath();g.moveTo(px+4,py+i);g.lineTo(px+36,py+i);g.stroke();}}}
 for(let y=0;y<R;y++)for(let x=0;x<C;x++)if(map[y][x]){for(const [a,b,dx,dy] of [[x+1,y,1,0],[x-1,y,-1,0],[x,y+1,0,1],[x,y-1,0,-1]]){if(a<0||b<0||a>=C||b>=R||!map[b][a]){g.fillStyle='rgba(255,255,255,.5)';g.fillRect(x*TS+(dx>0?TS-3:0),GY+y*TS+(dy>0?TS-3:0),dx?3:TS,dy?3:TS);}}}}
function draw(dt){if(!S){if(FX)FX.stage(ctx,W,H,'#7fd3ff','#2f8fd0');txt(ctx,'🏝️',W/2,H/2,80);return;}
 if(bgK!==si||!bgC){const d=FX?Math.max(1,Math.min(2.5,devicePixelRatio||1)):1;bgC=document.createElement('canvas');bgC.width=W*d;bgC.height=H*d;const g=bgC.getContext('2d');g.scale(d,d);drawBg(g);bgK=si;}
 ctx.drawImage(bgC,0,0,W,H);
 // 波浪
 const t0=performance.now()/600;ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=1.5;for(let i=0;i<6;i++){const y=GY+30+i*75,x=(t0*20+i*57)%W;ctx.beginPath();ctx.arc(x,y,6,Math.PI*1.1,Math.PI*1.9);ctx.stroke();}
 for(const [x,y] of lands){ctx.fillStyle='rgba(255,60,60,'+(.35+.25*Math.sin(performance.now()/180))+')';ctx.fillRect(x*TS,GY+y*TS,TS,TS);txt(ctx,'⚠',x*TS+20,GY+y*TS+20,20);}
 if(state==='build'&&pick==='tower'){ctx.strokeStyle='rgba(255,255,255,.15)';}
 for(const b of bld){const D=B[b.k];const px=b.x*TS,py=GY+b.y*TS;if(FX)FX.tile(ctx,px+3,py+3,TS-6,TS-6,b.k==='castle'?'#ffd36b':b.k==='wall'?'#b8a88f':'#fff6e0',8);else{ctx.fillStyle='#fff6e0';rr(ctx,px+3,py+3,TS-6,TS-6,8);ctx.fill();}
  if(b.hit>0){ctx.fillStyle='rgba(255,0,0,.35)';rr(ctx,px+3,py+3,TS-6,TS-6,8);ctx.fill();b.hit-=dt;}
  txt(ctx,D.a,px+20,py+20,b.k==='castle'?26:20);if(D.w&&!b.on)txt(ctx,'💤',px+33,py+9,10);if(b.lv>1)txt(ctx,'★'.repeat(b.lv-1),px+20,py+35,9,'#c77700');
  if(b.hp<b.max){ctx.fillStyle='rgba(0,0,0,.4)';ctx.fillRect(px+5,py+2,30,4);ctx.fillStyle=b.hp/b.max>.4?'#2ed47a':'#ff4d4d';ctx.fillRect(px+5,py+2,30*b.hp/b.max,4);}
  if(state==='raid'&&(b.k==='tower'&&b.on)){ctx.strokeStyle='rgba(255,230,100,.18)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(px+20,py+20,(2.5+((b.lv||1)-1)*.5)*TS,0,7);ctx.stroke();}}
 for(const s of sold){txt(ctx,'💂',s.x*TS,GY+s.y*TS,18);}
 for(const f of foes){if(f.delay>0)continue;const px=f.x*TS,py=GY+f.y*TS;if(FX)FX.shadow(ctx,px,py+10,f.D.boss?14:8,3);ctx.globalAlpha=f.hit>0?.6:1;txt(ctx,f.D.a,px,py,f.D.boss?30:18);ctx.globalAlpha=1;
  ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(px-12,py-16,24,3);ctx.fillStyle='#ff4d4d';ctx.fillRect(px-12,py-16,24*f.hp/f.max,3);}
 for(const s of shots){ctx.strokeStyle=s.c;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(s.x*TS,GY+s.y*TS);ctx.lineTo(s.tx*TS,GY+s.ty*TS);ctx.stroke();s.t-=dt;}shots=shots.filter(s=>s.t>0);
 if(FX)FX.drawBurst(ctx,sparks);
 // 资源栏
 ctx.fillStyle='rgba(15,40,70,.85)';ctx.fillRect(0,0,W,GY);const items=[['🍖',res.food],['🪵',res.wood],['🪨',res.stone],['🪙',res.gold],['👥',pop+'/'+popCap()]];
 items.forEach(([a,v],i)=>{txt(ctx,a,12+i*60,20,15,'#fff','left');txt(ctx,typeof v==='number'?String(Math.floor(v)):v,32+i*60,21,13,'#fff','left');});
 const left=nextRaid-day;txt(ctx,state==='raid'?'⚔ 战斗':left>0?'🏴‍☠️'+left+'天':'',W-6,20,12,left<=1||state==='raid'?'#ff8080':'#ffe9a8','right');
 txt(ctx,'波次 '+Math.min(raidN+1,S.raids)+'/'+S.raids,W-6,GY+10,10,'rgba(255,255,255,.85)','right');}
// ---------- 菜单 ----------
function openLevels(){state='menu';['overScr','pauseOv'].forEach(i=>show(i,false));const g=$('lvgrid');g.innerHTML='';$('lvlInfo').textContent='★'+save.stars.reduce((a,b)=>a+(b||0),0)+' / '+SC.length*3+' · 👑 海盗王来袭';
 SC.forEach((s,i)=>{const b=document.createElement('button');b.className='lvl';const open=i===0||(save.stars[i-1]||0)>0||(save.stars[i]||0)>0;b.disabled=!open;b.innerHTML=(open?(s.boss?'👑':i+1):'🔒')+'<small>'+(open?starStr(save.stars[i]||0):'')+'</small>';b.title=s.n;b.onclick=()=>{tone(660,.08,'triangle');startLevel(i);};g.appendChild(b);});show('lvlScr',true);}
function showTut(done){tutorial([['🌾 发展经济','农田产食物，伐木场挨着🌲森林产木材，采石场挨着⛰️山石产石材。每个人每天吃 1 份食物，食物有余人口才会增长。'],
 ['👥 人口与工人','生产建筑需要工人，人口不够时显示 💤 停工。造 🏠 民居提高人口上限。'],
 ['🏴‍☠️ 海盗来袭','左上角显示距离袭击的天数，前一天会标出 ⚠ 登陆点。海盗会冲向 🏰 城堡，沿途拆毁建筑。'],
 ['🏹 守卫王国','箭塔自动射击，城墙拖住敌人，兵营派士兵拦截，可点击建筑升级。撑过所有波次就能获胜！']],done);}
$('howBtn').onclick=()=>{show('lvlScr',false);showTut(openLevels);};
$('startBtn').onclick=()=>{audio();show('startScr',false);if(!save.tut){showTut(()=>{save.tut=1;Store.set('save',save);startLevel(0);});}else openLevels();};
$('bestLine').textContent=save.stars.length?'已获得 ★'+save.stars.reduce((a,b)=>a+(b||0),0):'';
let pst='build';function pause(){if(state==='build'||state==='raid'){pst=state;state='pause';show('pauseOv',true);}}
$('pauseBtn').onclick=pause;$('resumeBtn').onclick=()=>{show('pauseOv',false);state=pst;};$('restartBtn').onclick=()=>startLevel(si);$('menuBtn').onclick=openLevels;
$('nextBtn').onclick=()=>startLevel(si+1);$('againBtn').onclick=()=>startLevel(si);$('menu2Btn').onclick=openLevels;
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
let last=performance.now();function frame(t){const dt=Math.min(.05,(t-last)/1000);last=t;if(state==='raid'){for(let i=0;i<spd;i++){stepRaid(dt);if(state!=='raid')break;}}draw(dt);requestAnimationFrame(frame);}
fit();requestAnimationFrame(frame);
window.__il={SC,startLevel,place,newDay,setFast:v=>FAST=v,stepRaid,get s(){return{state,si,day,raidN,nextRaid,pop,cap:popCap(),res:{...res},castle:castle&&Math.ceil(castle.hp),n:bld.length,foes:foes.length}},map:()=>map,bld:()=>bld,lands:()=>lands,prod};
