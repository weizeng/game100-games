<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>汉诺塔</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:linear-gradient(160deg,#4d1f2b 0%,#121212 55%,#0a0a0a 100%);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;display:flex;justify-content:center;min-height:100vh;touch-action:manipulation;-webkit-user-select:none;user-select:none;overflow-x:hidden}
.wrap{width:100%;max-width:480px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:10px;position:relative;z-index:1}
.topbar{width:100%;display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:9px 12px;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.topbar .title{font-weight:700;font-size:16px}
.topbar .stat{color:#f5c2ce;font-size:13px}
.topbar .stat b{color:#fff;font-size:15px}
.tbtn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:#fff;font-size:16px;min-width:38px;height:38px;border-radius:11px;cursor:pointer;transition:transform .08s}
.tbtn:active{transform:scale(.9)}
.screen{width:100%;display:none;flex-direction:column;align-items:center;gap:12px}
.screen.on{display:flex}
.card{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:20px;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.card h1{font-size:26px;margin-bottom:6px;background:linear-gradient(90deg,#f9a8d4,#fda4af);-webkit-background-clip:text;background-clip:text;color:transparent}
.card h2{font-size:22px;margin-bottom:8px}
.card p{color:#f3cdd6;font-size:14px;line-height:1.7;margin-bottom:10px}
.bigbtn{background:linear-gradient(135deg,#f43f5e,#fb7185);border:none;color:#fff;font-size:18px;font-weight:700;padding:14px 46px;border-radius:999px;cursor:pointer;box-shadow:0 6px 18px rgba(244,63,94,.45);transition:transform .1s}
.bigbtn:active{transform:scale(.93)}
.ghostbtn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#fff;font-size:14px;padding:10px 22px;border-radius:999px;cursor:pointer;transition:transform .1s}
.ghostbtn:active{transform:scale(.93)}
.lvlrow{display:flex;gap:10px;justify-content:center}
.lvlbtn{background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.15);color:#fff;font-size:16px;padding:12px 28px;border-radius:14px;cursor:pointer;transition:transform .1s}
.lvlbtn:active{transform:scale(.93)}
.lvlbtn.sel{border-color:#fb7185;background:rgba(251,113,133,.15);font-weight:700}
#cvwrap{width:100%;display:flex;justify-content:center}
#cv{border-radius:14px;background:rgba(255,255,255,.03);touch-action:none;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.hint{color:#f3cdd6;font-size:13px}
.best{color:#ffd76a;font-size:14px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
.float{position:fixed;pointer-events:none;z-index:60;font-weight:700;font-size:18px;animation:floatup 1.1s ease-out forwards}
@keyframes floatup{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-46px)}}
#pauseov{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:40;backdrop-filter:blur(4px)}
#pauseov.on{display:flex}
.pausecard{background:#1c1c22;border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:28px 36px;text-align:center;display:flex;flex-direction:column;gap:12px}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="wrap">
  <div class="topbar">
    <span class="title">🗼 汉诺塔</span>
    <span class="stat">步数 <b id="moves">0</b>/<span id="minm">15</span></span>
    <span><button class="tbtn" id="sndBtn">🔊</button><button class="tbtn" id="hintBtn" title="提示">💡</button><button class="tbtn" id="pauseBtn">⏸</button></span>
  </div>
  <div class="screen on" id="s-start">
    <div class="card">
      <h1>🗼 汉诺塔</h1>
      <p>点选一根柱子，再点另一根柱子移动圆盘。<br>规则：一次移一盘，大盘不能压小盘。<br>目标：把所有圆盘移到最右边的柱子。<br>最少步数 = 2<sup>n</sup> − 1，挑战完美通关！</p>
      <div class="lvlrow">
        <button class="lvlbtn sel" data-n="4">4 层 · 15步</button>
        <button class="lvlbtn" data-n="5">5 层 · 31步</button>
      </div>
      <div style="height:12px"></div>
      <button class="bigbtn" id="btnStart">开始</button>
    </div>
  </div>
  <div class="screen" id="s-game">
    <div id="cvwrap"><canvas id="cv"></canvas></div>
    <div class="hint" id="hint">点选一根柱子开始</div>
    <button class="ghostbtn" id="btnReset">↩ 重来</button>
  </div>
  <div class="screen" id="s-end">
    <div class="card">
      <h2>🎉 通关成功！</h2>
      <p id="endInfo"></p>
      <p id="endPerfect" style="font-size:17px;font-weight:700"></p>
      <p class="best" id="endBest"></p>
      <div style="display:flex;gap:10px;justify-content:center"><button class="bigbtn" id="btnAgain">再来一次</button><button class="ghostbtn" id="btnHome">选层数</button></div>
    </div>
  </div>
</div>
<div id="pauseov"><div class="pausecard"><h2>⏸ 已暂停</h2><button class="bigbtn" id="btnResume">继续</button><button class="ghostbtn" id="btnQuit">退出</button></div></div>
<script>
"use strict";
var $=function(id){return document.getElementById(id)};
var store={get:function(k,d){try{var v=localStorage.getItem("hanoi_"+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set:function(k,v){try{localStorage.setItem("hanoi_"+k,JSON.stringify(v))}catch(e){}}};
var AC=null,soundOn=store.get("sound",true);
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==="suspended"){AC.resume()}return AC}
function tone(f,dur,type,vol,when){if(!soundOn)return;var c=ac();if(!c)return;try{var o=c.createOscillator(),g=c.createGain();o.type=type||"sine";o.frequency.value=f;g.gain.setValueAtTime(vol||.13,c.currentTime+(when||0));g.gain.exponentialRampToValueAtTime(.001,c.currentTime+(when||0)+(dur||.1));o.connect(g);g.connect(c.destination);o.start(c.currentTime+(when||0));o.stop(c.currentTime+(when||0)+(dur||.1)+.02)}catch(e){}}
var sClick=function(){tone(520,.07,"triangle")},sMove=function(){tone(440+Math.random()*120,.1,"sine")},sErr=function(){tone(170,.16,"sawtooth",.1)},sWin=function(){[523,659,784,1046,1318].forEach(function(f,i){tone(f,.2,"sine",.15,i*.1)})};
var fx=$("fx"),fctx=fx.getContext("2d"),parts=[];
function fxSize(){fx.width=innerWidth;fx.height=innerHeight}addEventListener("resize",fxSize);fxSize();
function burst(x,y,color,n){for(var i=0;i<(n||14);i++)parts.push({x:x,y:y,vx:(Math.random()-.5)*7,vy:(Math.random()-.5)*7-2,life:1,color:color||"#fb7185",r:2+Math.random()*3})}
(function fxLoop(){fctx.clearRect(0,0,fx.width,fx.height);parts=parts.filter(function(p){return p.life>0});parts.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=.22;p.life-=.028;fctx.globalAlpha=Math.max(0,p.life);fctx.fillStyle=p.color;fctx.beginPath();fctx.arc(p.x,p.y,p.r,0,7);fctx.fill()});fctx.globalAlpha=1;requestAnimationFrame(fxLoop)})();
function floatTxt(txt,x,y,color){var d=document.createElement("div");d.className="float";d.textContent=txt;d.style.left=x+"px";d.style.top=y+"px";d.style.color=color||"#ffd76a";document.body.appendChild(d);setTimeout(function(){d.remove()},1150)}
/* ---------- 游戏 ---------- */
var nDisc=4,pegs,sel,moves,minMoves,t=0;
var cv=$("cv"),ctx=cv.getContext("2d"),CW=0,CH=0;
var COLORS=["#f43f5e","#fb923c","#facc15","#4ade80","#38bdf8"];
function show(id){["s-start","s-game","s-end"].forEach(function(s){$(s).classList.toggle("on",s===id)})}
function startGame(){pegs=[[],[],[]];for(var i=nDisc;i>=1;i--)pegs[0].push(i);sel=-1;moves=0;minMoves=Math.pow(2,nDisc)-1;$("minm").textContent=minMoves;$("moves").textContent=0;$("hint").textContent="点选一根柱子开始";sizeCv();show("s-game")}
function sizeCv(){CW=Math.min(440,innerWidth-24);CH=Math.max(300,Math.min(420,innerWidth*.9));cv.width=CW;cv.height=CH;draw()}
function pegX(i){return CW*(i+.5)/3}
function draw(){ctx.clearRect(0,0,CW,CH);t+=.05;
 var base=CH-36,discH=Math.min(34,(CH-120)/nDisc);
 // 底座
 ctx.fillStyle="rgba(255,255,255,.14)";roundRect(16,base,CW-32,10,5);ctx.fill();
 for(var i=0;i<3;i++){var x=pegX(i);
  ctx.fillStyle=i===sel?"rgba(251,113,133,.9)":"rgba(255,255,255,.35)";
  roundRect(x-5,60,10,base-60,5);ctx.fill();
  if(hintMove&&hintMove.to===i&&Date.now()<hintMove.until){ctx.save();ctx.shadowColor="#7ee2a8";ctx.shadowBlur=16;ctx.strokeStyle="#7ee2a8";ctx.lineWidth=3;roundRect(x-9,56,18,base-52,9);ctx.stroke();ctx.restore()}
  // 盘
  var stack=pegs[i];
  for(var j=0;j<stack.length;j++){var d=stack[j];var w=CW/3*.86*(d/nDisc)+26;
   var selected=(i===sel&&j===stack.length-1);
   var y=base-(j+1)*discH;
   var yy=selected?y-14+Math.sin(t*2)*3:y;
   var g=ctx.createLinearGradient(x-w/2,0,x+w/2,0);g.addColorStop(0,COLORS[(d-1)%5]);g.addColorStop(1,"#ffffff88");
   ctx.fillStyle=g;roundRect(x-w/2,yy,w,discH-5,8);ctx.fill();
   if(hintMove&&hintMove.d===d&&Date.now()<hintMove.until){ctx.save();ctx.shadowColor="#ffd76a";ctx.shadowBlur=12+10*Math.abs(Math.sin(t*5));ctx.strokeStyle="#ffd76a";ctx.lineWidth=3;roundRect(x-w/2-3,yy-3,w+6,discH+1,10);ctx.stroke();ctx.restore()}
   ctx.fillStyle="rgba(0,0,0,.35)";ctx.font="bold "+Math.floor(discH*.42)+"px sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(d,x,yy+(discH-5)/2)}
  ctx.fillStyle="rgba(255,255,255,.5)";ctx.font="13px sans-serif";ctx.textAlign="center";ctx.fillText(["起点","中转","目标"][i],x,CH-12)}
 if(sel>=0){ctx.fillStyle="#ffd76a";ctx.font="13px sans-serif";ctx.textAlign="center";ctx.fillText("已选中柱子 "+(sel+1)+"，再点目标柱子",CW/2,24)}}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function tapPeg(i){hintMove=null;if(sel<0){if(!pegs[i].length){sErr();$("hint").textContent="这根柱子是空的";return}sel=i;sClick();$("hint").textContent="已选中柱子 "+(i+1)+"，点目标柱子移动";draw();return}
 if(sel===i){sel=-1;sClick();$("hint").textContent="已取消选择";draw();return}
 var from=pegs[sel],to=pegs[i],d=from[from.length-1];
 if(to.length&&to[to.length-1]<d){sErr();$("hint").textContent="❌ 大盘不能压小盘！";var r=cv.getBoundingClientRect();floatTxt("大盘不能压小盘",r.left+pegX(i)-50,r.top+50,"#ff6b6b");sel=-1;draw();return}
 from.pop();to.push(d);moves++;$("moves").textContent=moves;sMove();sel=-1;
 $("hint").textContent=moves>=minMoves?"已用 "+moves+" 步（最少 "+minMoves+" 步）":"已用 "+moves+" 步，最少 "+minMoves+" 步";
 draw();
 if(pegs[2].length===nDisc)win()}
function win(){sWin();var r=cv.getBoundingClientRect();for(var i=0;i<5;i++)setTimeout(function(){burst(r.left+Math.random()*r.width,r.top+80,["#ffd76a","#fb7185","#4ade80"][i%3],22)},i*130);
 var perfect=moves===minMoves,score=Math.max(100,Math.round(minMoves*2000/Math.max(moves,minMoves))+(perfect?500:0));
 var key="best_"+nDisc,best=store.get(key,null),nb=false;if(best==null||score>best){store.set(key,score);nb=true}
 setTimeout(function(){$("endInfo").textContent=nDisc+" 层 · 用了 "+moves+" 步（最少 "+minMoves+" 步）· 得分 "+score;
  $("endPerfect").textContent=perfect?"✨ 完美通关！步数就是理论最少！":(moves<=minMoves+4?"👏 接近完美，再接再厉！":"💪 通关成功，试试更少步数吧");
  $("endBest").textContent=nb?"🏆 新纪录！":"历史最高 "+best;show("s-end")},600)}
function pick(e){var r=cv.getBoundingClientRect();var x=(e.touches?e.touches[0].clientX:e.clientX)-r.left;var i=Math.max(0,Math.min(2,Math.floor(x/(CW/3))));tapPeg(i)}
cv.addEventListener("touchstart",function(e){e.preventDefault();pick(e)},{passive:false});
cv.addEventListener("mousedown",function(e){pick(e)});
document.querySelectorAll(".lvlbtn").forEach(function(b){b.addEventListener("click",function(){sClick();document.querySelectorAll(".lvlbtn").forEach(function(x){x.classList.remove("sel")});b.classList.add("sel");nDisc=+b.dataset.n})});
$("btnStart").onclick=function(){sClick();startGame()};
$("btnReset").onclick=function(){sClick();startGame()};
$("btnAgain").onclick=function(){sClick();startGame()};
$("btnHome").onclick=function(){sClick();show("s-start")};
/* ---------- 提示：BFS 求当前局面到全收目标的最短路，取第一步 ---------- */
var hintMove=null;
function hanoiHint(){
 if(!$("s-game").classList.contains("on"))return;
 if(pegs[2].length===nDisc){$("hint").textContent="🎉 已经全部移到目标柱了！";return}
 var pos=new Array(nDisc+1);
 for(var p=0;p<3;p++)for(var j=0;j<pegs[p].length;j++)pos[pegs[p][j]]=p;
 var key=function(a){return a.slice(1).join("")};
 var seen={};seen[key(pos)]=1;
 var q=[{pos:pos,first:null}],found=null;
 while(q.length&&!found){
  var cur=q.shift(),top=[-1,-1,-1];
  for(var d=1;d<=nDisc;d++){var pp=cur.pos[d];if(top[pp]<0)top[pp]=d}
  for(var f=0;f<3&&!found;f++){if(top[f]<0)continue;
   for(var tt=0;tt<3;tt++){if(tt===f)continue;
    if(top[tt]>=0&&top[tt]<top[f])continue;
    var np=cur.pos.slice();np[top[f]]=tt;var k=key(np);
    if(seen[k])continue;seen[k]=1;
    var fm=cur.first||{d:top[f],from:f,to:tt};
    var done=true;for(var d2=1;d2<=nDisc;d2++)if(np[d2]!==2){done=false;break}
    if(done){found=fm;break}
    q.push({pos:np,first:fm});
   }}}
 if(!found){$("hint").textContent="💡 提示：算不出走法，试试重来";return}
 hintMove={d:found.d,from:found.from,to:found.to,until:Date.now()+2600};
 var names=["起点","中转","目标"];
 $("hint").textContent="💡 提示：把 "+found.d+" 号盘从「"+names[found.from]+"」移到「"+names[found.to]+"」（最优解下一步）";
 draw();
 setTimeout(function(){hintMove=null;draw()},2650);
}
$("hintBtn").onclick=function(){sClick();hanoiHint()};
$("sndBtn").onclick=function(){soundOn=!soundOn;store.set("sound",soundOn);$("sndBtn").textContent=soundOn?"🔊":"🔇";if(soundOn)sClick()};
$("sndBtn").textContent=soundOn?"🔊":"🔇";
$("pauseBtn").onclick=function(){if(!$("s-game").classList.contains("on"))return;sClick();$("pauseov").classList.add("on")};
$("btnResume").onclick=function(){sClick();$("pauseov").classList.remove("on")};
$("btnQuit").onclick=function(){sClick();$("pauseov").classList.remove("on");show("s-start")};
setInterval(function(){if($("s-game").classList.contains("on")&&!$("pauseov").classList.contains("on"))draw()},100);
addEventListener("resize",function(){if($("s-game").classList.contains("on"))sizeCv()});
</script>
</body>
</html>
