<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>熄灯</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:linear-gradient(160deg,#2b1a4d 0%,#121212 55%,#0a0a0a 100%);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;display:flex;justify-content:center;min-height:100vh;touch-action:manipulation;-webkit-user-select:none;user-select:none;overflow-x:hidden}
.wrap{width:100%;max-width:480px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:10px;position:relative;z-index:1}
.topbar{width:100%;display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:9px 12px;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.topbar .title{font-weight:700;font-size:16px}
.topbar .stat{color:#cdbcf5;font-size:13px}
.topbar .stat b{color:#fff;font-size:15px}
.tbtn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:#fff;font-size:16px;min-width:38px;height:38px;border-radius:11px;cursor:pointer;transition:transform .08s}
.tbtn:active{transform:scale(.9)}
.screen{width:100%;display:none;flex-direction:column;align-items:center;gap:12px}
.screen.on{display:flex}
.card{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:20px;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.card h1{font-size:26px;margin-bottom:6px;background:linear-gradient(90deg,#c4b5fd,#f0abfc);-webkit-background-clip:text;background-clip:text;color:transparent}
.card h2{font-size:22px;margin-bottom:8px}
.card p{color:#d6cbf5;font-size:14px;line-height:1.7;margin-bottom:10px}
.bigbtn{background:linear-gradient(135deg,#8b5cf6,#d946ef);border:none;color:#fff;font-size:18px;font-weight:700;padding:14px 46px;border-radius:999px;cursor:pointer;box-shadow:0 6px 18px rgba(139,92,246,.45);transition:transform .1s}
.bigbtn:active{transform:scale(.93)}
.ghostbtn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#fff;font-size:14px;padding:10px 22px;border-radius:999px;cursor:pointer;transition:transform .1s}
.ghostbtn:active{transform:scale(.93)}
#grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:100%;max-width:400px}
.cell{aspect-ratio:1;border-radius:14px;cursor:pointer;transition:transform .08s,background .15s,box-shadow .15s;display:flex;align-items:center;justify-content:center;font-size:26px;border:1px solid rgba(255,255,255,.1)}
.cell:active{transform:scale(.92)}
.cell.on{background:linear-gradient(135deg,#fbbf24,#f59e0b);box-shadow:0 0 18px rgba(251,191,36,.55);color:#3a2503}
.cell.off{background:rgba(255,255,255,.06);color:#555}
.cell.hint{outline:3px solid #4ade80;outline-offset:2px;animation:hintpulse .6s ease-in-out infinite}
@keyframes hintpulse{50%{box-shadow:0 0 22px rgba(74,222,128,.9);transform:scale(1.08)}}
.hintbar{min-height:20px;font-size:13px;color:#ffd76a;text-align:center}
.toolbar{display:flex;gap:10px}
.best{color:#ffd76a;font-size:14px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
.float{position:fixed;pointer-events:none;z-index:60;font-weight:700;font-size:18px;animation:floatup 1.1s ease-out forwards}
@keyframes floatup{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-46px)}}
#pauseov{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:40;backdrop-filter:blur(4px)}
#pauseov.on{display:flex}
.pausecard{background:#1c1c22;border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:28px 36px;text-align:center;display:flex;flex-direction:column;gap:12px}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="wrap">
  <div class="topbar">
    <span class="title">💡 熄灯</span>
    <span class="stat">步数 <b id="moves">0</b></span>
    <span><button class="tbtn" id="sndBtn">🔊</button><button class="tbtn" id="hintBtn" title="提示">💡</button><button class="tbtn" id="pauseBtn">⏸</button></span>
  </div>
  <div class="screen on" id="s-start">
    <div class="card">
      <h1>💡 熄灯游戏</h1>
      <p>点一盏灯，它和上下左右的邻居都会翻转！<br>目标：把 5×5 的灯全部熄灭。<br>题目由全灭状态随机逆操作生成，<b>保证可解</b>。<br>步数越少，得分越高！</p>
      <button class="bigbtn" id="btnStart">开始挑战</button>
    </div>
  </div>
  <div class="screen" id="s-game">
    <div id="grid"></div>
    <div class="hintbar" id="hintbar"></div>
    <div class="toolbar">
      <button class="ghostbtn" id="btnUndo">↩ 悔一步</button>
      <button class="ghostbtn" id="btnNew">🎲 新题目</button>
    </div>
  </div>
  <div class="screen" id="s-end">
    <div class="card">
      <h2>🌟 全部熄灭！</h2>
      <p id="endInfo"></p>
      <p class="best" id="endBest"></p>
      <div style="display:flex;gap:10px;justify-content:center"><button class="bigbtn" id="btnAgain">再来一局</button><button class="ghostbtn" id="btnHome">返回</button></div>
    </div>
  </div>
</div>
<div id="pauseov"><div class="pausecard"><h2>⏸ 已暂停</h2><button class="bigbtn" id="btnResume">继续</button><button class="ghostbtn" id="btnQuit">退出</button></div></div>
<script>
"use strict";
var $=function(id){return document.getElementById(id)};
var store={get:function(k,d){try{var v=localStorage.getItem("lightsout_"+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set:function(k,v){try{localStorage.setItem("lightsout_"+k,JSON.stringify(v))}catch(e){}}};
var AC=null,soundOn=store.get("sound",true);
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==="suspended"){AC.resume()}return AC}
function tone(f,dur,type,vol,when){if(!soundOn)return;var c=ac();if(!c)return;try{var o=c.createOscillator(),g=c.createGain();o.type=type||"sine";o.frequency.value=f;g.gain.setValueAtTime(vol||.13,c.currentTime+(when||0));g.gain.exponentialRampToValueAtTime(.001,c.currentTime+(when||0)+(dur||.1));o.connect(g);g.connect(c.destination);o.start(c.currentTime+(when||0));o.stop(c.currentTime+(when||0)+(dur||.1)+.02)}catch(e){}}
var sClick=function(){tone(520,.07,"triangle")},sOn=function(){tone(760,.09,"sine")},sOff=function(){tone(320,.09,"sine")},sWin=function(){[523,659,784,1046,1318,1568].forEach(function(f,i){tone(f,.18,"sine",.15,i*.09)})};
var fx=$("fx"),fctx=fx.getContext("2d"),parts=[];
function fxSize(){fx.width=innerWidth;fx.height=innerHeight}addEventListener("resize",fxSize);fxSize();
function burst(x,y,color,n){for(var i=0;i<(n||14);i++)parts.push({x:x,y:y,vx:(Math.random()-.5)*7,vy:(Math.random()-.5)*7-2,life:1,color:color||"#fbbf24",r:2+Math.random()*3})}
(function fxLoop(){fctx.clearRect(0,0,fx.width,fx.height);parts=parts.filter(function(p){return p.life>0});parts.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=.22;p.life-=.028;fctx.globalAlpha=Math.max(0,p.life);fctx.fillStyle=p.color;fctx.beginPath();fctx.arc(p.x,p.y,p.r,0,7);fctx.fill()});fctx.globalAlpha=1;requestAnimationFrame(fxLoop)})();
function floatTxt(txt,x,y,color){var d=document.createElement("div");d.className="float";d.textContent=txt;d.style.left=x+"px";d.style.top=y+"px";d.style.color=color||"#ffd76a";document.body.appendChild(d);setTimeout(function(){d.remove()},1150)}
/* ---------- 题目：从全灭随机逆操作生成，必可解 ---------- */
var N=5,grid,hist,moves;
var hintCell=null,hintTimer=null;
function clearLoHint(){hintCell=null;if(hintTimer){clearTimeout(hintTimer);hintTimer=null}var hb=$("hintbar");if(hb)hb.textContent=""}
function flip(g,r,c,silent){var d=[[0,0],[1,0],[-1,0],[0,1],[0,-1]];d.forEach(function(o){var nr=r+o[1],nc=c+o[0];if(nr>=0&&nr<N&&nc>=0&&nc<N)g[nr][nc]^=1})}
function newPuzzle(){grid=[];for(var i=0;i<N;i++){grid.push([]);for(var j=0;j<N;j++)grid[i].push(0)}
 // 随机做 14~24 次逆操作
 var times=14+Math.floor(Math.random()*11),seen={};
 for(var k=0;k<times;k++){var r=Math.floor(Math.random()*N),c=Math.floor(Math.random()*N);var key=r+"_"+c;seen[key]=(seen[key]||0)+1;flip(grid,r,c)}
 // 偶数次按同一格会抵消：若全灭则重来（极小概率）
 var lit=0;for(var a=0;a<N;a++)for(var b=0;b<N;b++)lit+=grid[a][b];
 if(lit===0)return newPuzzle();
 hist=[];moves=0;$("moves").textContent=0;clearLoHint();render()}
function render(){var g=$("grid");g.innerHTML="";for(var r=0;r<N;r++)for(var c=0;c<N;c++){var d=document.createElement("div");d.className="cell "+(grid[r][c]?"on":"off");if(hintCell&&hintCell[0]===r&&hintCell[1]===c)d.className+=" hint";d.textContent=grid[r][c]?"💡":"";(function(rr,cc,el){var press=function(e){if(e)e.preventDefault();doFlip(rr,cc,el)};el.addEventListener("touchstart",press,{passive:false});el.addEventListener("mousedown",press)})(r,c,d);g.appendChild(d)}}
function doFlip(r,c,el){clearLoHint();var rc=el.getBoundingClientRect();flip(grid,r,c);hist.push([r,c]);moves++;$("moves").textContent=moves;
 var lit=0;for(var a=0;a<N;a++)for(var b=0;b<N;b++)lit+=grid[a][b];
 if(grid[r][c])sOn();else sOff();
 render();
 if(lit===0)win();else if(lit<=3)floatTxt("还剩 "+lit+" 盏",rc.left,rc.top-8,"#fbbf24")}
function undo(){clearLoHint();if(!hist.length){sClick();return}var m=hist.pop();flip(grid,m[0],m[1]);moves=Math.max(0,moves-1);$("moves").textContent=moves;sClick();render()}
function win(){sWin();var lit=0;for(var i=0;i<5;i++)setTimeout(function(){burst(innerWidth/2+(Math.random()-.5)*260,innerHeight/3+(Math.random()-.5)*160,["#ffd76a","#fbbf24","#c4b5fd"][i%3],24)},i*120);
 var score=Math.max(50,Math.round(3000/(1+moves*.35)));
 var best=store.get("best",null),nb=false;if(best==null||score>best){store.set("best",score);nb=true}
 setTimeout(function(){$("endInfo").textContent="用了 "+moves+" 步 · 得分 "+score;$("endBest").textContent=nb?"🏆 新纪录！":"历史最高 "+best;show("s-end")},600)}
function show(id){["s-start","s-game","s-end"].forEach(function(s){$(s).classList.toggle("on",s===id)})}
/* ---------- 提示：mod 2 高斯消元求解，高亮下一步该按的格 ---------- */
function solveLO(){
 var n=N*N,A=[];
 for(var i=0;i<n;i++){var row=new Array(n+1);for(var j=0;j<=n;j++)row[j]=0;A.push(row)}
 for(var r=0;r<N;r++)for(var c=0;c<N;c++){
  var j=r*N+c,cells=[[r,c],[r+1,c],[r-1,c],[r,c+1],[r,c-1]];
  for(var k=0;k<cells.length;k++){var nr=cells[k][0],nc=cells[k][1];
   if(nr>=0&&nr<N&&nc>=0&&nc<N)A[nr*N+nc][j]=1}
  A[j][n]=grid[r][c];
 }
 var where=new Array(n).fill(-1),rw=0;
 for(var col=0;col<n&&rw<n;col++){
  var sel=-1;
  for(var i=rw;i<n;i++)if(A[i][col]){sel=i;break}
  if(sel<0)continue;
  var tmp=A[sel];A[sel]=A[rw];A[rw]=tmp;where[col]=rw;
  for(var i=0;i<n;i++)if(i!==rw&&A[i][col]){for(var j=col;j<=n;j++)A[i][j]^=A[rw][j]}
  rw++;
 }
 var x=new Array(n).fill(0);
 for(var i=0;i<n;i++)if(where[i]>=0)x[i]=A[where[i]][n];
 return x;
}
function loHint(){
 if(!$("s-game").classList.contains("on"))return;
 sClick();clearLoHint();
 var x=solveLO(),cell=-1;
 for(var j=0;j<x.length;j++)if(x[j]){cell=j;break}
 if(cell<0){$("hintbar").textContent="💡 灯已经全灭了！";return}
 var r=(cell/N)|0,c=cell%N;
 hintCell=[r,c];
 $("hintbar").textContent="💡 提示：按第 "+(r+1)+" 行第 "+(c+1)+" 列这盏灯（消元法算出的关键一步）";
 render();
 hintTimer=setTimeout(function(){clearLoHint();render()},2600);
}
$("hintBtn").onclick=function(){loHint()};
$("btnStart").onclick=function(){sClick();newPuzzle();show("s-game")};
$("btnNew").onclick=function(){sClick();newPuzzle()};
$("btnUndo").onclick=function(){undo()};
$("btnAgain").onclick=function(){sClick();newPuzzle();show("s-game")};
$("btnHome").onclick=function(){sClick();show("s-start")};
$("sndBtn").onclick=function(){soundOn=!soundOn;store.set("sound",soundOn);$("sndBtn").textContent=soundOn?"🔊":"🔇";if(soundOn)sClick()};
$("sndBtn").textContent=soundOn?"🔊":"🔇";
$("pauseBtn").onclick=function(){if(!$("s-game").classList.contains("on"))return;sClick();$("pauseov").classList.add("on")};
$("btnResume").onclick=function(){sClick();$("pauseov").classList.remove("on")};
$("btnQuit").onclick=function(){sClick();$("pauseov").classList.remove("on");show("s-start")};
</script>
</body>
</html>
