<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>霓虹黑客</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{background:#050510;color:#c9f4ff;font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.hidden{display:none!important}
.screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
h1.title{font-size:42px;letter-spacing:10px;color:#00f0ff;text-shadow:0 0 12px #00f0ff,0 0 38px #00bcd4;margin-bottom:12px}
.subtitle{color:#7fd8e8;margin-bottom:18px;font-size:14px;letter-spacing:3px}
.rules{background:rgba(0,240,255,.06);border:1px solid rgba(0,240,255,.35);border-radius:12px;padding:14px 16px;margin:0 0 24px;max-width:340px;font-size:13px;line-height:2.1;color:#a8e6f5;text-align:left;box-shadow:0 0 18px rgba(0,188,212,.15)}
.btn{min-height:44px;min-width:120px;padding:12px 26px;font-size:17px;color:#04121a;background:linear-gradient(180deg,#3ff5ff,#00c8de);border:none;border-radius:12px;font-weight:700;letter-spacing:2px;box-shadow:0 0 16px rgba(0,240,255,.55);cursor:pointer;font-family:inherit}
.btn:active{transform:scale(.96)}
.btn.ghost{background:rgba(0,240,255,.08);color:#7df3ff;border:1px solid rgba(0,240,255,.5);box-shadow:none;font-size:15px;min-width:100px}
.btn:disabled{background:#1a2433;color:#5a6b7d;box-shadow:none;border:1px solid #2a3648;cursor:default}
.btnrow{display:flex;gap:12px;justify-content:center;margin-top:16px;flex-wrap:wrap}
#gamescreen{min-height:100vh;display:flex;flex-direction:column;padding:10px 10px 18px;max-width:460px;margin:0 auto}
#topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
#levellabel{font-size:14px;color:#7df3ff;white-space:nowrap}
#scorelabel{font-size:14px;color:#ffe66d;text-shadow:0 0 8px rgba(255,230,109,.6);white-space:nowrap}
.iconbtn{min-width:44px;min-height:44px;font-size:20px;background:rgba(0,240,255,.08);border:1px solid rgba(0,240,255,.4);border-radius:10px;color:#7df3ff;cursor:pointer;font-family:inherit}
#seqbar{display:flex;align-items:center;gap:6px;overflow-x:auto;padding:10px 8px;margin-bottom:10px;border:1px solid rgba(0,240,255,.25);border-radius:12px;background:rgba(0,20,30,.5);min-height:56px}
#seqbar .cap{font-size:12px;color:#5fa8bb;white-space:nowrap}
.chip{min-width:40px;min-height:40px;display:inline-flex;align-items:center;justify-content:center;padding:6px 10px;border-radius:10px;border:1px solid rgba(0,240,255,.45);color:#9be9f8;font-size:16px;font-weight:700;white-space:nowrap;transition:all .25s ease}
.chip.cur{border-color:#00f0ff;animation:curblink 1.2s infinite}
.chip.on{background:rgba(0,255,157,.15);border-color:#00ff9d;color:#00ff9d;box-shadow:0 0 12px rgba(0,255,157,.6);animation:none}
.arrow{color:#3d7f8f;font-size:14px;flex:none}
@keyframes curblink{0%,100%{box-shadow:0 0 6px rgba(0,240,255,.4)}50%{box-shadow:0 0 14px rgba(0,240,255,.9)}}
#gridwrap{position:relative;width:min(94vw,420px);margin:0 auto}
#grid{display:grid;gap:6px;width:100%}
#fx{position:absolute;inset:0;pointer-events:none;overflow:visible;z-index:5}
.cell{aspect-ratio:1/1;min-height:40px;font-size:clamp(14px,4.5vw,20px);font-weight:700;color:#8fd8ea;background:rgba(0,60,80,.35);border:1px solid rgba(0,240,255,.35);border-radius:10px;cursor:pointer;transition:transform .22s ease,box-shadow .22s ease,background-color .22s ease,color .22s ease;display:flex;align-items:center;justify-content:center;font-family:inherit}
.cell:active{transform:scale(.93)}
.cell.lit{background-color:rgba(0,255,157,.22);border-color:#00ff9d;color:#a4ffcf;transform:scale(1.07);box-shadow:0 0 18px rgba(0,255,157,.85),inset 0 0 10px rgba(0,255,157,.35)}
.cell.fw{background-color:rgba(255,40,70,.12);border-color:#ff2d55;color:#ff5d7a;animation:fwpulse 1.1s infinite;font-size:clamp(16px,5vw,22px)}
@keyframes fwpulse{0%,100%{box-shadow:0 0 6px rgba(255,45,85,.4)}50%{box-shadow:0 0 20px rgba(255,45,85,.95)}}
.cell.bad{background-color:rgba(255,45,85,.45);border-color:#ff2d55;box-shadow:0 0 22px rgba(255,45,85,.9)}
.cell.hintpulse{outline:3px solid #ffe66d;outline-offset:2px;animation:hintblink .5s infinite}
@keyframes hintblink{0%,100%{outline-color:#ffe66d}50%{outline-color:transparent}}
#tracebar{margin:10px auto 0;font-size:14px;color:#ff8fa3;letter-spacing:2px}
#hintbtn{margin:12px auto 0}
.spark{position:absolute;width:7px;height:7px;border-radius:50%;background:#7dffce;box-shadow:0 0 8px #00ff9d;animation:sparkfly .65s ease-out forwards}
@keyframes sparkfly{from{transform:translate(0,0) scale(1);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.floatxt{position:absolute;transform:translate(-50%,-100%);color:#7dff9a;font-weight:800;font-size:18px;text-shadow:0 0 10px rgba(0,255,157,.8);animation:floatup .85s ease-out forwards;white-space:nowrap}
@keyframes floatup{from{opacity:1;margin-top:0}to{opacity:0;margin-top:-46px}}
.overlay{position:fixed;inset:0;background:rgba(5,5,16,.88);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.panel{background:#0a0f22;border:1px solid rgba(0,240,255,.45);border-radius:16px;padding:28px 24px;max-width:340px;width:100%;text-align:center;box-shadow:0 0 30px rgba(0,188,212,.35)}
.panel h2{color:#00f0ff;font-size:24px;margin-bottom:14px;text-shadow:0 0 12px rgba(0,240,255,.7)}
.panel p{font-size:15px;line-height:2;color:#bfeefb;margin-bottom:6px}
body.paused *{animation-play-state:paused!important}
</style>
</head>
<body>
<div id="startscreen" class="screen">
  <h1 class="title">霓虹黑客</h1>
  <div class="subtitle">NEO-HACK · 电网潜入协议</div>
  <div class="rules">
    ▸ 按顶部「入侵序列」顺序点亮节点<br>
    ▸ 点对 +10 分，点错追踪度 +1<br>
    ▸ 红色 ⚠ 是防火墙，千万别点<br>
    ▸ 追踪度满 3 → 本关失败<br>
    ▸ 💡提示每关限用 3 次<br>
    ▸ 8 关全通即完成入侵
  </div>
  <button id="startBtn" class="btn">开始入侵</button>
</div>

<div id="gamescreen" class="hidden">
  <div id="topbar">
    <button id="pausebtn" class="iconbtn">⏸</button>
    <span id="levellabel">第 1 / 8 关</span>
    <span id="scorelabel">得分 0</span>
    <button id="mutebtn" class="iconbtn">🔊</button>
  </div>
  <div id="seqbar"><span class="cap">入侵序列</span></div>
  <div id="gridwrap">
    <div id="grid"></div>
    <div id="fx"></div>
  </div>
  <div id="tracebar"></div>
  <button id="hintbtn" class="btn ghost">💡 提示 ×3</button>
</div>

<div id="pauseoverlay" class="overlay hidden">
  <div class="panel">
    <h2>⏸ 已暂停</h2>
    <p>电网潜入已冻结</p>
    <div class="btnrow"><button id="resumebtn" class="btn">继续</button></div>
  </div>
</div>

<div id="resultoverlay" class="overlay hidden">
  <div class="panel">
    <h2 id="resulttitle"></h2>
    <p id="resulttext"></p>
    <div class="btnrow">
      <button id="retrybtn" class="btn ghost hidden">重来本关</button>
      <button id="nextbtn" class="btn hidden">下一关 →</button>
      <button id="restartbtn" class="btn ghost">重新开始</button>
    </div>
  </div>
</div>

<script>'use strict';
function $(id){return document.getElementById(id);}

var level=1,total=0,levelScore=0,trace=0,seq=[],fw=[],lit=[],nextIdx=0,hints=3,paused=false,over=false,gridN=5;
var nodeEls={};
var lastPtrTs=0;
var hintTimer=null;
var actx=null;

function gridSizeFor(lv){return lv<=2?5:(lv<=5?6:7);}

function genLevel(lv){
  var n=gridSizeFor(lv),i,j,t,pool=[];
  for(i=1;i<=n*n;i++){pool.push(i);}
  for(i=pool.length-1;i>0;i--){j=Math.floor(Math.random()*(i+1));t=pool[i];pool[i]=pool[j];pool[j]=t;}
  var seqLen=3+lv,fwCount=1+lv;
  return {n:n,seq:pool.slice(0,seqLen),fw:pool.slice(seqLen,seqLen+fwCount)};
}

function pressOutcome(s,idx,fwArr,litArr,num){
  if(litArr.indexOf(num)>=0){return 'ignored';}
  if(fwArr.indexOf(num)>=0){return 'wrong';}
  return num===s[idx]?'correct':'wrong';
}

function muted(){try{return localStorage.getItem('g100_mute')==='1';}catch(e){return false;}}

function ac(){
  if(actx){return actx;}
  var AC=window.AudioContext||window.webkitAudioContext;
  if(!AC){return null;}
  try{actx=new AC();}catch(e){actx=null;}
  return actx;
}

function tone(freq,delay,dur,type,vol){
  if(muted()){return;}
  var c=ac();
  if(!c){return;}
  try{
    if(c.state==='suspended'){c.resume();}
    var t=c.currentTime+delay;
    var o=c.createOscillator(),g=c.createGain();
    o.type=type||'sine';
    o.frequency.setValueAtTime(freq,t);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol||0.25,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);g.connect(c.destination);
    o.start(t);o.stop(t+dur+0.05);
  }catch(e){}
}

function sndCorrect(){tone(660,0,0.12,'sine',0.25);tone(880,0.1,0.18,'sine',0.25);}
function sndWrong(){tone(150,0,0.3,'sawtooth',0.3);tone(110,0.05,0.3,'sawtooth',0.25);}
function sndClear(){var f=[523,659,784,1046];for(var i=0;i<f.length;i++){tone(f[i],i*0.12,0.2,'triangle',0.25);}}
function sndFail(){tone(330,0,0.25,'sawtooth',0.25);tone(220,0.2,0.25,'sawtooth',0.25);tone(140,0.4,0.45,'sawtooth',0.3);}
function sndHint(){tone(1200,0,0.1,'sine',0.2);tone(1500,0.09,0.12,'sine',0.2);}

function getHs(){try{return parseInt(localStorage.getItem('g100_neohack_hs')||'0',10)||0;}catch(e){return 0;}}
function setHs(v){try{localStorage.setItem('g100_neohack_hs',String(v));}catch(e){}}

function renderTop(){
  var s='追踪度 ',i;
  $('levellabel').textContent='第 '+level+' / 8 关';
  $('scorelabel').textContent='得分 '+(total+levelScore);
  for(i=0;i<3;i++){s+=(i<trace?'▓':'░');}
  $('tracebar').textContent=s;
}

function renderSeq(){
  var bar=$('seqbar'),i;
  bar.innerHTML='<span class="cap">入侵序列</span>';
  for(i=0;i<seq.length;i++){
    var c=document.createElement('span');
    c.className='chip'+(i<nextIdx?' on':'')+(i===nextIdx?' cur':'');
    c.textContent=String(seq[i]);
    bar.appendChild(c);
    if(i<seq.length-1){
      var a=document.createElement('span');
      a.className='arrow';
      a.textContent='→';
      bar.appendChild(a);
    }
  }
}

function updateHintBtn(){
  var b=$('hintbtn');
  b.textContent='💡 提示 ×'+hints;
  b.disabled=hints<=0;
}

function fxXY(elm){
  return {x:elm.offsetLeft+elm.offsetWidth/2,y:elm.offsetTop+elm.offsetHeight/2};
}

function floatText(elm,txt){
  var layer=$('fx');
  var s=document.createElement('span');
  s.className='floatxt';
  s.textContent=txt;
  s.style.left=fxXY(elm).x+'px';
  s.style.top=elm.offsetTop+'px';
  layer.appendChild(s);
  setTimeout(function(){if(s.parentNode){s.parentNode.removeChild(s);}},900);
}

function sparks(elm){
  var layer=$('fx'),p=fxXY(elm),i;
  for(i=0;i<10;i++){
    (function(){
      var s=document.createElement('span');
      s.className='spark';
      var ang=Math.random()*Math.PI*2,d=26+Math.random()*38;
      s.style.left=p.x+'px';
      s.style.top=p.y+'px';
      s.style.setProperty('--dx',Math.cos(ang)*d+'px');
      s.style.setProperty('--dy',Math.sin(ang)*d+'px');
      layer.appendChild(s);
      setTimeout(function(){if(s.parentNode){s.parentNode.removeChild(s);}},700);
    })();
  }
}

function onPress(num,elm){
  if(paused||over){return;}
  var r=pressOutcome(seq,nextIdx,fw,lit,num);
  if(r==='ignored'){return;}
  if(r==='correct'){
    lit.push(num);
    nextIdx++;
    levelScore+=10;
    elm.classList.add('lit');
    renderSeq();
    renderTop();
    sndCorrect();
    floatText(elm,'+10');
    sparks(elm);
    if(nextIdx>=seq.length){levelClear();}
  }else{
    trace++;
    renderTop();
    elm.classList.add('bad');
    (function(el){setTimeout(function(){el.classList.remove('bad');},450);})(elm);
    sndWrong();
    try{if(navigator.vibrate){navigator.vibrate(200);}}catch(e){}
    if(trace>=3){over=true;setTimeout(showFail,650);}
  }
}

function bindPress(elm,num){
  var fn=function(e){
    var now=Date.now();
    if(e.type==='click'&&now-lastPtrTs<600){return;}
    if(e.type==='pointerdown'){lastPtrTs=now;}
    onPress(num,elm);
  };
  elm.addEventListener('pointerdown',fn);
  elm.addEventListener('click',fn);
}

function useHint(){
  if(paused||over){return;}
  if(hints<=0||nextIdx>=seq.length){return;}
  hints--;
  var target=nodeEls[seq[nextIdx]];
  if(target){
    target.classList.add('hintpulse');
    sndHint();
    if(hintTimer){clearTimeout(hintTimer);}
    hintTimer=setTimeout(function(){target.classList.remove('hintpulse');},2000);
  }
  updateHintBtn();
}

function setPaused(p){
  paused=p;
  document.body.classList.toggle('paused',p);
  $('pauseoverlay').classList.toggle('hidden',!p);
}

function hideResult(){$('resultoverlay').classList.add('hidden');}

function showFail(){
  sndFail();
  $('resulttitle').textContent='入侵失败';
  $('resulttext').innerHTML='追踪度已满（3/3），连接被切断。<br>本关得分：'+levelScore+'<br>最高分：'+getHs();
  $('retrybtn').classList.remove('hidden');
  $('nextbtn').classList.add('hidden');
  var rb=$('restartbtn');
  rb.classList.remove('hidden');
  rb.textContent='重新开始';
  $('resultoverlay').classList.remove('hidden');
}

function levelClear(){
  over=true;
  var bonus=(3-trace)*30;
  levelScore+=bonus;
  total+=levelScore;
  renderTop();
  sndClear();
  setTimeout(function(){
    if(level>=8){showVictory();return;}
    $('resulttitle').textContent='第 '+level+' 关 · 入侵成功';
    $('resulttext').innerHTML='本关得分：'+levelScore+'（含追踪奖励 +'+bonus+'）<br>累计总分：'+total+'<br>最高分：'+getHs();
    $('retrybtn').classList.add('hidden');
    var nb=$('nextbtn');
    nb.classList.remove('hidden');
    nb.textContent='下一关 →';
    var rb=$('restartbtn');
    rb.classList.remove('hidden');
    rb.textContent='重新开始';
    $('resultoverlay').classList.remove('hidden');
  },650);
}

function showVictory(){
  var hs=getHs(),isNew=false;
  if(total>hs){setHs(total);hs=total;isNew=true;}
  sndClear();
  $('resulttitle').textContent='🏆 入侵完成';
  $('resulttext').innerHTML='8 关全通！总分：'+total+(isNew?'（新纪录！）':'')+'<br>最高分：'+hs;
  $('retrybtn').classList.add('hidden');
  $('nextbtn').classList.add('hidden');
  var rb=$('restartbtn');
  rb.classList.remove('hidden');
  rb.textContent='再来一局';
  $('resultoverlay').classList.remove('hidden');
}

function startLevel(){
  var g=genLevel(level),num;
  gridN=g.n;
  seq=g.seq;
  fw=g.fw;
  lit=[];
  nextIdx=0;
  trace=0;
  levelScore=0;
  hints=3;
  over=false;
  nodeEls={};
  setPaused(false);
  hideResult();
  if(hintTimer){clearTimeout(hintTimer);hintTimer=null;}
  var grid=$('grid');
  grid.innerHTML='';
  grid.style.gridTemplateColumns='repeat('+gridN+',1fr)';
  for(num=1;num<=gridN*gridN;num++){
    (function(n){
      var b=document.createElement('button');
      b.type='button';
      b.className='cell';
      if(fw.indexOf(n)>=0){
        b.classList.add('fw');
        b.textContent='⚠';
      }else{
        b.textContent=String(n);
      }
      nodeEls[n]=b;
      bindPress(b,n);
      grid.appendChild(b);
    })(num);
  }
  $('fx').innerHTML='';
  renderSeq();
  renderTop();
  updateHintBtn();
}

function startGame(){
  level=1;
  total=0;
  $('startscreen').classList.add('hidden');
  $('gamescreen').classList.remove('hidden');
  startLevel();
}

function toggleMute(){
  var m=!muted();
  try{localStorage.setItem('g100_mute',m?'1':'0');}catch(e){}
  $('mutebtn').textContent=m?'🔇':'🔊';
  if(!m){sndHint();}
}

function init(){
  $('mutebtn').textContent=muted()?'🔇':'🔊';
  $('startBtn').addEventListener('click',function(){ac();startGame();});
  $('pausebtn').addEventListener('click',function(){setPaused(true);});
  $('resumebtn').addEventListener('click',function(){setPaused(false);});
  $('mutebtn').addEventListener('click',toggleMute);
  $('hintbtn').addEventListener('click',useHint);
  $('retrybtn').addEventListener('click',function(){startLevel();});
  $('nextbtn').addEventListener('click',function(){level++;startLevel();});
  $('restartbtn').addEventListener('click',function(){startGame();});
}

init();
</script>
</body>
</html>
