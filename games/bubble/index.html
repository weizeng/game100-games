<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>泡泡龙</title>
<style>
html.game-ui #pauseBtn,html.game-ui #soundBtn{min-width:44px;min-height:44px}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#121212;color:#f0f0f0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;display:flex;justify-content:center;min-height:100vh;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.wrap{width:100%;max-width:480px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:10px}
.topbar{width:100%;display:flex;justify-content:space-between;align-items:center;font-size:15px}
.topbar b{color:#40C4FF;font-size:22px}
.iconbtn{background:#1e1e1e;border:1px solid #333;color:#fff;font-size:18px;min-width:40px;height:40px;border-radius:10px;cursor:pointer}
.iconbtn:active{transform:scale(.92)}
canvas{background:linear-gradient(180deg,#0d1b2a 0%,#121212 75%);border-radius:12px;touch-action:none;width:100%;height:auto;max-width:400px;border:1px solid #222}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.86);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;z-index:20;padding:24px;text-align:center}
.overlay.hidden{display:none}
.overlay h1{font-size:30px}
.overlay p{color:#bbb;font-size:15px;line-height:1.9}
.btn{background:linear-gradient(135deg,#40C4FF,#0288D1);border:none;color:#fff;font-size:19px;font-weight:700;padding:13px 52px;border-radius:14px;cursor:pointer;box-shadow:0 4px 14px rgba(64,196,255,.35)}
.btn:active{transform:scale(.95)}
.btn.ghost{background:#2a2a2a;box-shadow:none}
.hint{color:#888;font-size:13px;text-align:center;line-height:1.7}
.rowbtns{display:flex;gap:12px}
</style>
<!-- GAME UI BEGIN -->
<style>
:root{--page:#f5e4eb;--surface:#fff8fc;--soft:#edd5e2;--ink:#4e2e49;--muted:#806079;--accent:#a33d70;--on-accent:#ffffff;--line:#d9b4ca;--stage:#33223d;--page:#8d58ff;--surface:#fff4fb;--soft:#ffdff0;--ink:#5a1f55;--muted:#91517f;--accent:#7d6619;--on-accent:#ffffff;--line:#ff9fd0;--b-bg1:#ff8ac6;--b-bg2:#8d58ff;--b-btn:#ffcf33;--b-btn-hi:#ffe07a;--b-edge:#e08600;--b-glow:#ffd6f0;--b-glow-rgb:255,214,240;--b-pedge-rgb:255,159,208;--b-btn-ink:#7b4a00;--b-btn-tsh:0 1px 0 rgba(255,255,255,.45);--b-coin-ink:#7b4a00;--b-coin-tsh:none;--b-key-ink:#7d6619;--b-title:#8f5600}
/* Shared presentation only; mechanics and state remain inside each standalone game. */
html.game-ui{background:var(--page);color:var(--ink);color-scheme:light;font-family:"Bahnschrift","Microsoft YaHei UI","PingFang SC",sans-serif}
html.game-ui:is([data-theme="space"],[data-theme="arcade"],[data-theme="lab"],[data-theme="ocean"],[data-theme="magic"]){color-scheme:dark}
.game-ui body{background:var(--page);color:var(--ink);font-family:inherit;overscroll-behavior:none}
.game-ui body>.wrap{padding:20px 16px max(20px,env(safe-area-inset-bottom));gap:14px;max-width:500px}
.game-ui #app{background:var(--page);color:var(--ink)}
.game-ui :is(.topbar,#topbar){gap:8px;flex-wrap:wrap;min-height:58px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:10px 12px;box-shadow:0 3px 0 var(--soft);font-size:13px}
.game-ui :is(.title,.tb-title,.tb-title,#topbar .t,.topbar .t){color:var(--ink);font-size:16px;font-weight:750;letter-spacing:0}
.game-ui :is(.topbar,.hud,#hud,#topbar) :is(b,.v){color:var(--accent);font-variant-numeric:tabular-nums}
.game-ui :is(.stat,.topbar .s,.topbar .stat,.scorebar,.stats,.tip,.hint,.hintline,.hsline,.best,.hiscore){color:var(--muted);line-height:1.7}
.game-ui :is(.hint,.hintline,.tip){font-size:12px;max-width:40em;text-wrap:pretty}
.game-ui .scorebar{padding:6px 10px;gap:8px;flex-wrap:wrap}
.game-ui :is(.iconbtn,.iconBtn,.icobtn,.ibtn,.tbtn,.hbtn,.ib,.iconBtn,.pause){min-width:44px;min-height:44px;flex-shrink:0;border-radius:12px;background:var(--soft);color:var(--ink);border:1px solid var(--line);box-shadow:none;font-size:17px}
.game-ui button{font-family:inherit;cursor:pointer;touch-action:manipulation}
.game-ui button:focus-visible,.game-ui [tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.game-ui :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn){background:var(--accent);color:var(--on-accent);border:1px solid transparent;border-radius:13px;min-height:50px;padding:13px 28px;font-size:16px;font-weight:750;letter-spacing:0;box-shadow:0 4px 0 var(--line);text-shadow:none;max-width:100%}
.game-ui :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn):active{box-shadow:none;transform:translateY(2px)}
.game-ui :is(.ghost,.ghostbtn,.btn2,.abtn,.toolbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line);box-shadow:none;border-radius:12px;min-height:44px}
.game-ui :is(.rowbtns,.btnrow,.ctlrow){gap:10px;flex-wrap:wrap;justify-content:center}
.game-ui :is(.pill,.hudbox,.hud .p){background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:none;font-variant-numeric:tabular-nums}
.game-ui :is(.dbtn,.cbtn,.gbtn,.holdbtn,.firebtn,.bombbtn,.jumpbtn,.pumpbtn,.nbtn){border-radius:12px;box-shadow:0 3px 0 var(--line);min-height:44px}
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv,.screen):has(>.ui-panel){padding:20px;overflow-y:auto;overscroll-behavior:contain}
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv):has(>.ui-panel){background:var(--page);backdrop-filter:none;justify-content:safe center;align-items:center}
.game-ui .ui-panel{width:min(100%,380px);max-height:100%;overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:18px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:24px;padding:30px 24px;box-shadow:0 8px 0 var(--soft),0 20px 48px #15253618;text-align:center;margin:auto}
.game-ui .ui-panel :is(.card,.panel,.pausecard,.ovcard){display:contents}
.game-ui .ui-panel :is(h1,h2,.gamename,.gametitle){font-size:30px;line-height:1.25;font-weight:800;color:var(--ink);background:none;-webkit-text-fill-color:currentColor;text-shadow:none;letter-spacing:-.6px;margin:0}
.game-ui .ui-panel :is(p,.howto,.sub,.rule){font-size:14px;line-height:1.85;color:var(--muted);background:none;border:0;box-shadow:none;padding:0;margin:0;max-width:32em;text-align:left;white-space:normal}
.game-ui .ui-panel :is(.bigemoji,.bigemoji,.ic,.big):not(.bigscore){animation:none;filter:none;text-shadow:none}
.game-ui .ui-emblem{width:90px;height:90px;display:grid;place-items:center;border:1px solid var(--line);border-radius:28px;background:var(--soft);font-size:48px;line-height:1;flex-shrink:0;position:relative}
.game-ui[data-theme="wood"] .ui-emblem{border-radius:50%;box-shadow:inset 0 0 0 5px var(--surface),inset 0 0 0 6px var(--line)}
.game-ui[data-theme="wood"] .ui-panel h1{font-family:"STKaiti","KaiTi","Microsoft YaHei",serif;letter-spacing:2px}
.game-ui[data-theme="ice"] .ui-emblem{border-radius:26px 8px 26px 8px}
.game-ui[data-theme="space"] .ui-emblem{background:radial-gradient(circle at center,var(--soft) 42%,transparent 43%),var(--surface);border-radius:50%;outline:1px solid var(--line);outline-offset:7px;margin:7px}
.game-ui[data-theme="kitchen"] .ui-emblem{border-radius:22px;border-bottom:5px solid var(--line)}
.game-ui .ui-panel :is(.score,.bigscore,.bigScore,.scorebig){color:var(--accent);font-size:48px;font-weight:800;font-variant-numeric:tabular-nums}
.game-ui .ui-panel :is(.best,.hsline,.hiscore,.endstats,.endstats b){color:var(--muted);font-size:13px;line-height:1.8}
.game-ui .ui-mode{display:grid;grid-template-columns:1fr 1fr;gap:5px;background:var(--soft);padding:5px;border:1px solid var(--line);border-radius:14px;width:100%}
.game-ui .ui-mode button{min-height:44px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-size:14px;font-weight:700;box-shadow:none}
.game-ui .ui-mode button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 2px 5px #1525361a}
.game-ui .ui-panel .ui-mode-note{font-size:12px;line-height:1.6;text-align:center;color:var(--muted)}
.game-ui .ui-mode-status{display:block;padding:5px 10px;color:var(--accent);font-size:11px;font-weight:700;line-height:1.5;text-align:center;border:1px solid var(--line);border-radius:8px;background:var(--surface);margin:4px auto;max-width:100%;pointer-events:none}
.game-ui body>.wrap>canvas:not(#fx){background-color:var(--stage);box-shadow:0 0 0 1px var(--line),0 6px 0 var(--soft);border-radius:18px;flex-shrink:0}
.game-ui .screen>canvas.game{box-shadow:0 0 0 1px var(--line),0 6px 0 var(--soft)}
.game-ui #hud{gap:6px;background:var(--surface);color:var(--ink)}
.game-ui #hud :is(.left,.t,.s,.grp,.pill){color:var(--ink)}
.game-ui #hud .pill{background:var(--surface);border-color:var(--line)}
.game-ui body canvas:is(#cv,#game,#board){background-color:var(--stage)}
.game-ui :is(button.dbtn,button.cbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.game-ui :is(button.lvl,button.lvlbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line);border-radius:12px;min-height:54px}
.game-ui :is(button.lvl,button.lvlbtn) :is(.nc,.sz,small){color:var(--muted)}
.game-ui .ui-panel button.lvl{margin:0;min-width:44px;box-shadow:none;padding:8px}
.game-ui #hud :is(.left,.right,.hudl,.hbtns){gap:5px;flex-wrap:wrap}
.game-ui #hud :is(.left,.hudl){min-width:0;flex-shrink:1}
.game-ui #hud :is(.pill,.left){font-size:12px}
.game-ui button:disabled{cursor:default;opacity:.45;box-shadow:none}
.game-ui .ui-panel .ui-assist-note{color:var(--accent);font-weight:700}
@media(min-width:700px){.game-ui body>.wrap{padding-top:32px}.game-ui .ui-panel{padding:36px 30px}}
@media(max-width:360px){.game-ui body>.wrap{padding:10px;gap:10px}.game-ui .ui-panel{padding:22px 18px;gap:13px}.game-ui .ui-panel h1{font-size:26px}.game-ui .ui-emblem{width:70px;height:70px;font-size:38px}.game-ui :is(.topbar,#topbar){gap:5px;padding:8px}.game-ui :is(.iconbtn,.icobtn,.ibtn,.tbtn,.ib){min-width:40px;min-height:44px}}
@media(max-height:650px){.game-ui .ui-panel{padding:18px;gap:12px}.game-ui .ui-emblem{width:60px;height:60px;font-size:32px}.game-ui .ui-panel h1{font-size:25px}.game-ui .ui-panel :is(p,.howto,.sub,.rule){font-size:13px}}
@media(prefers-reduced-motion:reduce){.game-ui *, .game-ui *::before,.game-ui *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
/* 2026-10-20 热修：开局/结算遮罩铺满整屏，主按钮固定在面板底部，避免被画布尺寸裁切（#10） */
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv):has(>.ui-panel){position:fixed;inset:0;z-index:1000;border-radius:0;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
.game-ui .ui-panel{touch-action:pan-y}
.game-ui .ui-panel :is(#startBtn,#btnStart,.startbtn,#bStart,#restartBtn,#btnRestart,#againBtn,#btnAgain,#retryBtn,#btnRetry,#playBtn,#btnPlay){position:sticky;bottom:0;z-index:3;flex-shrink:0}
.game-ui .ui-panel :not(.card,.panel,.pausecard,.ovcard,.ui-mode):has(>:is(#startBtn,#btnStart,.startbtn,#bStart,#restartBtn,#btnRestart,#againBtn,#btnAgain,#retryBtn,#btnRetry,#playBtn,#btnPlay)){position:sticky;bottom:0;z-index:3;flex-shrink:0;background:var(--surface);box-shadow:0 -10px 10px -6px var(--surface)}


/* ===== Direction B · 霓虹糖果 Pop Arcade ===== saturated gradients, chunky bevels with a hard bottom edge, sticker panels, neon on dark themes */
html.game-ui[data-skin="b"]{--fb:"HarmonyOS Sans SC","MiSans","OPPOSans","vivo Sans","Noto Sans SC","Noto Sans CJK SC","PingFang SC","Microsoft YaHei UI",system-ui,sans-serif;--bounce:cubic-bezier(.34,1.56,.64,1);--bg:radial-gradient(circle at 12% 18%,rgba(255,255,255,.28) 0 38px,transparent 40px),radial-gradient(circle at 88% 30%,rgba(255,255,255,.16) 0 64px,transparent 66px),radial-gradient(circle at 20% 82%,rgba(255,255,255,.14) 0 52px,transparent 54px),radial-gradient(rgba(255,255,255,.16) 1.5px,transparent 2.2px) 0 0/22px 22px,linear-gradient(165deg,var(--b-bg1),var(--b-bg2));font-family:var(--fb)}
html.game-ui[data-skin="b"],html.game-ui[data-skin="b"] body,html.game-ui[data-skin="b"] #app,html.game-ui[data-skin="b"] :is(.overlay,.ov,#ov,#overlay,#pauseOv):has(>.ui-panel){background:var(--bg);background-color:var(--b-bg2)}
html.game-ui[data-skin="b"] body{min-height:100vh;font-family:var(--fb)}
html.game-ui[data-skin="b"] :is(.hint,.hintline,.tip){color:rgba(255,255,255,.94);text-shadow:0 1px 2px rgba(0,0,0,.35)}
/* Sticker panel: white rim + hard coloured bottom edge + drop */

html.game-ui[data-skin="b"] .ui-panel :is(h1,h2,.gamename,.gametitle){font-size:34px;font-weight:900;color:var(--b-title);letter-spacing:0;text-shadow:0 3px 0 var(--line),0 6px 10px rgba(0,0,0,.15)}
html.game-ui[data-skin="b"] .ui-emblem{width:100px;height:100px;border:4px solid #fff;border-radius:50%;background:radial-gradient(circle at 32% 26%,#fff 0 12%,var(--b-glow) 13%,var(--line) 70%,var(--b-edge) 100%);box-shadow:0 7px 0 var(--b-edge),0 16px 24px rgba(0,0,0,.25);font-size:54px;animation:uiB-wobble 2.6s ease-in-out infinite}

html.game-ui[data-skin="b"] .ui-emblem::before{top:-10px;right:-14px}

html.game-ui[data-skin="b"] .ui-panel :is(.score,.bigscore,.bigScore,.scorebig,#finalScore){font-size:56px;font-weight:900;color:var(--b-btn);-webkit-text-fill-color:currentColor;text-shadow:0 4px 0 var(--b-edge),0 0 2px var(--b-edge),0 10px 16px rgba(0,0,0,.25)}
html.game-ui[data-skin="b"] .ui-panel :is(h1,.gamename)~h2{font-size:19px;text-shadow:0 2px 0 var(--line)}
/* Chunky bevelled button: highlight lip, darker bottom slab, presses down onto the slab */
html.game-ui[data-skin="b"] :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn,button.actBtn):not(.ghost){position:relative}
html.game-ui[data-skin="b"] :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn,button.actBtn):not(.ghost):not(#\#){overflow:hidden;border:0;border-radius:20px;font-weight:900;color:var(--b-btn-ink);background:linear-gradient(180deg,var(--b-btn-hi),var(--b-btn) 52%);text-shadow:var(--b-btn-tsh);box-shadow:inset 0 3px 0 rgba(255,255,255,.55),inset 0 -5px 0 rgba(0,0,0,.14),0 6px 0 var(--b-edge),0 12px 18px rgba(0,0,0,.25);transition:transform .08s,box-shadow .08s}
html.game-ui[data-skin="b"] :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn,button.actBtn):not(.ghost):not(#\#)::before{content:"";position:absolute;left:12px;top:6px;width:22px;height:9px;border-radius:9px;background:rgba(255,255,255,.75);transform:rotate(-12deg);pointer-events:none}
html.game-ui[data-skin="b"] :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn,button.actBtn):not(.ghost):not(#\#):active{transform:translateY(5px);box-shadow:inset 0 3px 0 rgba(255,255,255,.4),inset 0 -2px 0 rgba(0,0,0,.14),0 1px 0 var(--b-edge),0 4px 8px rgba(0,0,0,.2)}
html.game-ui[data-skin="b"] .ui-panel :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn,button.actBtn):not(.ghost):not(#\#){min-height:56px;padding:14px 34px;font-size:19px;letter-spacing:1px}
/* Secondary keys: white candy keys with a coloured slab */
html.game-ui[data-skin="b"] :is(.ghost,.ghostbtn,.btn2,.abtn,.toolbtn,.iconbtn,.iconBtn,.icobtn,.ibtn,.tbtn,.hbtn,.ib,.pause,.dbtn,.cbtn,.nbtn,.lvl,.lvlbtn){border:0;border-radius:16px;background:linear-gradient(180deg,#fff,var(--soft));color:var(--b-key-ink);font-weight:900;box-shadow:inset 0 -3px 0 rgba(0,0,0,.06),0 5px 0 var(--line),0 8px 12px rgba(0,0,0,.18);transition:transform .08s,box-shadow .08s}
html.game-ui[data-skin="b"] :is(.ghost,.ghostbtn,.btn2,.abtn,.toolbtn,.iconbtn,.iconBtn,.icobtn,.ibtn,.tbtn,.hbtn,.ib,.pause,.dbtn,.cbtn,.nbtn,.lvl,.lvlbtn):active{transform:translateY(4px);box-shadow:0 1px 0 var(--line),0 2px 4px rgba(0,0,0,.15)}

html.game-ui[data-skin="b"] body canvas:is(#cv,#game,#board):not(#fx),html.game-ui[data-skin="b"] body>.wrap>canvas:not(#fx),html.game-ui[data-skin="b"] .stage{border-radius:24px;outline:5px solid #fff;outline-offset:0;box-shadow:0 10px 0 5px var(--line),0 24px 36px rgba(0,0,0,.32)}

    // Glow is shadowBlur: cheap for a handful of shapes, never use it on every tile.
    glow: function (ctx, color, blur) { ctx.shadowColor = color; ctx.shadowBlur = blur; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0; },
    noGlow: function (ctx) { ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; },
    // Crisp rendering on high-DPI phones without changing game coordinates.
    // Only safe where input code converts with getBoundingClientRect + logical W/H, not cv.width.
    hidpi: function (cv, ctx, w, h) {
      var d = Math.max(1, Math.min(2.5, window.devicePixelRatio || 1));
      cv.width = Math.round(w * d); cv.height = Math.round(h * d); // intrinsic ratio stays w:h, so CSS sizing is unchanged
      ctx.setTransform(d, 0, 0, d, 0, 0); return d;
    },
    // Lightweight particle bursts (pooled array, no allocations per frame beyond the burst).
    burst: function (list, x, y, color, n) {
      for (var i = 0; i < (n || 12); i++) { var a = Math.random() * 6.283, v = 1 + Math.random() * 2.6; list.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 1, life: 1, c: color, r: 1.5 + Math.random() * 2.5 }); }
    },
    drawBurst: function (ctx, list) {
      for (var i = list.length - 1; i >= 0; i--) {
        var p = list[i]; p.x += p.vx; p.y += p.vy; p.vy += .12; p.life -= .035;
        if (p.life <= 0) { list.splice(i, 1); continue; }
        ctx.globalAlpha = p.life; ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (skin === 'b' ? 1.2 : 1), 0, 7); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
  };
  window.GameUI.fx = fx;
}());

</script>
<!-- GAME UI END -->
</head>
<body>
<div class="wrap">
<div class="topbar"><span>🫧 泡泡龙</span><span>得分 <b id="score">0</b></span><span>第 <b id="level">1</b> 关</span><span><button class="iconbtn" id="pauseBtn">⏸</button> <button class="iconbtn" id="soundBtn">🔊</button></span></div>
<canvas id="cv" width="400" height="560"></canvas>
<p class="hint">手指拖动瞄准，松手发射泡泡<br>3 个以上同色相连即可消除，别让泡泡压过红线</p>
</div>
<div class="overlay" id="startScr"><h1>🫧 泡泡龙</h1><p>手指在屏幕上拖动，发射器跟随瞄准<br>松开手指发射彩色泡泡<br>3 个以上同色泡泡相连即消除<br>悬空泡泡会一起掉落<br>每打几发顶部就下压一行<br>泡泡压过底部红线则失败</p><button class="btn" id="startBtn">开始游戏</button></div>
<div class="overlay hidden" id="pauseScr"><h1>⏸ 已暂停</h1><div class="rowbtns"><button class="btn" id="resumeBtn">继续</button><button class="btn ghost" id="restartBtn2">重来</button></div></div>
<div class="overlay hidden" id="overScr"><h1 id="overTitle">游戏结束</h1><p id="overText"></p><button class="btn" id="restartBtn">再来一局</button></div>
<script>
/* GAMEPLAY UPGRADE */
'use strict';
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d'),W=400,H=560;
let AC=null,soundOn=true;try{soundOn=GameUI.storageGet('g100_sound')!=='0';}catch(e){}
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f,d,type,vol,when){if(!soundOn)return;const a=ac();if(!a)return;type=type||'sine';vol=vol||0.15;when=when||0;const t=a.currentTime+when;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.05);}
function sShoot(){tone(520,0.12,'square',0.08);tone(780,0.1,'square',0.06,0.05);}
function sPop(n){for(let i=0;i<Math.min(n,6);i++)tone(600+i*160,0.12,'triangle',0.12,i*0.05);}
function sStick(){tone(220,0.08,'sine',0.1);}
function sDrop(){tone(300,0.25,'sawtooth',0.08);}
function sOver(){tone(400,0.2,'sawtooth',0.14);tone(300,0.2,'sawtooth',0.14,0.2);tone(200,0.35,'sawtooth',0.14,0.4);}
function sWin(){[523,659,784,1047].forEach((f,i)=>tone(f,0.18,'triangle',0.14,i*0.1));}
function getBest(k){try{return parseInt(GameUI.storageGet(k)||'0',10)||0;}catch(e){return 0;}}
function setBest(k,v){try{GameUI.storageSet(k,v);}catch(e){}}

const R=15,OX=50,TOPY=86,ROWH=26,COLS=10,DEADY=GameUI.pick(492,440),SX=W/2,SY=H-46;
const COLORS=['#ff5252','#40c4ff','#ffd740','#69f0ae','#ce93d8'];
const BESTK='g100_bubble_best';
let grid,cur,nxt,shot,score,level,stuckN,state,paused,aimA,parts,floats,raf,best,clearT;

function cellX(r,c){return OX+R+c*2*R+(r%2?R:0);}
function cellY(r){return TOPY+r*ROWH;}
function rowLen(r){return r%2?COLS-1:COLS;}
function nbList(r,c){return r%2?[[r,c+1],[r,c-1],[r-1,c+1],[r-1,c],[r+1,c+1],[r+1,c]]:[[r,c+1],[r,c-1],[r-1,c],[r-1,c-1],[r+1,c],[r+1,c-1]];}
function valid(r,c){return r>=0&&c>=0&&c<rowLen(r);}
function presentColors(){const s=new Set();for(const row of grid)for(const v of row)if(v!=null)s.add(v);return s.size?[...s]:COLORS.slice();}
function pickColor(){const p=presentColors();return p[(Math.random()*p.length)|0];}
function fillRows(n){grid=[];for(let r=0;r<n;r++){const row=[];for(let c=0;c<rowLen(r);c++)row.push((Math.random()*COLORS.length)|0);grid.push(row);}}
function reset(){fillRows(Math.min(3+level,8));cur=pickColor();nxt=pickColor();shot=null;score=0;stuckN=0;aimA=-Math.PI/2;parts=[];floats=[];clearT=0;paused=false;setHUD();}
function setHUD(){$('score').textContent=score;$('level').textContent=level;}
function pressureEvery(){return Math.max(4,9-level);}

function flood(sr,sc){const col=grid[sr][sc];const seen=new Set([sr+','+sc]);const q=[[sr,sc]];while(q.length){const[r,c]=q.pop();for(const[nr,nc]of nbList(r,c)){const k=nr+','+nc;if(!valid(nr,nc)||seen.has(k)||!grid[nr]||grid[nr][nc]!==col)continue;seen.add(k);q.push([nr,nc]);}}return[...seen].map(k=>k.split(',').map(Number));}
function removeFloaters(){const seen=new Set();const q=[];if(grid[0])for(let c=0;c<rowLen(0);c++)if(grid[0][c]!=null){seen.add('0,'+c);q.push([0,c]);}while(q.length){const[r,c]=q.pop();for(const[nr,nc]of nbList(r,c)){const k=nr+','+nc;if(!valid(nr,nc)||seen.has(k)||!grid[nr]||grid[nr][nc]==null)continue;seen.add(k);q.push([nr,nc]);}}let dropped=0;for(let r=0;r<grid.length;r++)for(let c=0;c<rowLen(r);c++)if(grid[r][c]!=null&&!seen.has(r+','+c)){grid[r][c]=null;dropped++;burst(cellX(r,c),cellY(r),COLORS[0]||'#fff',4);}if(dropped>0){score+=dropped*15;sDrop();setHUD();}}
function gridEmpty(){for(const row of grid)for(const v of row)if(v!=null)return false;return true;}
function checkDead(){for(let r=0;r<grid.length;r++)for(let c=0;c<rowLen(r);c++)if(grid[r][c]!=null&&cellY(r)+R>DEADY)return true;return false;}
function addRow(){const p=presentColors();const row=[];for(let c=0;c<rowLen(0);c++)row.push((Math.random()*p.length)|0);grid.unshift(row);if(checkDead())gameOver();}
function findCell(x,y){let r=Math.round((y-TOPY)/ROWH);if(r<0)r=0;while(grid.length<=r)grid.push(new Array(rowLen(r)).fill(null));let c=Math.round((x-OX-R-(r%2?R:0))/(2*R));c=Math.max(0,Math.min(rowLen(r)-1,c));if(grid[r][c]==null)return[r,c];for(const[nr,nc]of nbList(r,c))if(valid(nr,nc)){while(grid.length<=nr)grid.push(new Array(rowLen(nr)).fill(null));if(grid[nr][nc]==null)return[nr,nc];}for(let rr=r+1;rr<r+4;rr++){while(grid.length<=rr)grid.push(new Array(rowLen(rr)).fill(null));for(let cc=0;cc<rowLen(rr);cc++)if(grid[rr][cc]==null)return[rr,cc];}return[r,c];}

function fire(){if(state!=='play'||paused||shot)return;const sp=9;shot={x:SX,y:SY,vx:Math.cos(aimA)*sp,vy:Math.sin(aimA)*sp,col:cur};cur=nxt;nxt=pickColor();sShoot();}
function stickShot(){const s=shot;shot=null;const[r,c]=findCell(s.x,s.y);grid[r][c]=s.col;sStick();burst(cellX(r,c),cellY(r),COLORS[s.col],6);const grp=flood(r,c);if(grp.length>=3){for(const[gr,gc]of grp){burst(cellX(gr,gc),cellY(gr,gc),COLORS[s.col],8);grid[gr][gc]=null;}const gain=grp.length*10;score+=gain;floats.push({x:cellX(r,c),y:cellY(r),t:'+'+gain,life:50});sPop(grp.length);}removeFloaters();if(gridEmpty()){level++;clearT=70;sWin();floats.push({x:W/2,y:H/2,t:'第 '+level+' 关!',life:70});fillRows(Math.min(3+level,8));setHUD();return;}stuckN++;if(stuckN>=pressureEvery()){stuckN=0;addRow();}setHUD();if(checkDead())gameOver();}
function stepShot(){const s=shot;s.x+=s.vx;s.y+=s.vy;if(s.x<R){s.x=R;s.vx*=-1;}if(s.x>W-R){s.x=W-R;s.vx*=-1;}if(s.y-R<=58){stickShot();return;}for(let r=0;r<grid.length;r++)for(let c=0;c<rowLen(r);c++){if(grid[r][c]==null)continue;const dx=s.x-cellX(r,c),dy=s.y-cellY(r);if(dx*dx+dy*dy<(2*R-3)*(2*R-3)){stickShot();return;}}}

function burst(x,y,color,n){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,sp=1+Math.random()*3;parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:30+Math.random()*20,color});}}
function gameOver(){if(state!=='play')return;state='over';sOver();best=getBest(BESTK);if(score>best){best=score;setBest(BESTK,score);}$('overTitle').textContent='游戏结束';$('overText').innerHTML='得分：<b style="color:#40C4FF">'+score+'</b><br>最高分：'+best;show('overScr');}
function show(id){$(id).classList.remove('hidden');}
function hide(id){$(id).classList.add('hidden');}
function startGame(){level=1;reset();state='play';hide('startScr');hide('overScr');hide('pauseScr');}

function ppos(e){const r=cv.getBoundingClientRect();const p=e.touches&&e.touches[0]?e.touches[0]:e;return{x:(p.clientX-r.left)/r.width*W,y:(p.clientY-r.top)/r.height*H};}
function onDown(e){if(state!=='play'||paused)return;const p=ppos(e);aimA=Math.atan2(p.y-SY,p.x-SX);aimA=Math.max(-2.88,Math.min(-0.26,aimA));e.preventDefault&&e.preventDefault();}
function onUp(e){if(state!=='play'||paused)return;fire();e.preventDefault&&e.preventDefault();}
cv.addEventListener('touchstart',onDown,{passive:false});
cv.addEventListener('touchmove',onDown,{passive:false});
cv.addEventListener('touchend',onUp,{passive:false});
cv.addEventListener('mousedown',e=>{onDown(e);md=true;});
cv.addEventListener('mousemove',e=>{if(md)onDown(e);});
window.addEventListener('mouseup',e=>{if(md){md=false;onUp(e);}});
let md=false;

function drawBubble(x,y,col,sc){sc=sc||1;ctx.save();ctx.translate(x,y);ctx.scale(sc,sc);const g=ctx.createRadialGradient(-4,-5,2,0,0,R);g.addColorStop(0,'#ffffff');g.addColorStop(0.25,col);g.addColorStop(1,col);ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,R,0,7);ctx.fill();ctx.fillStyle='rgba(255,255,255,.55)';ctx.beginPath();ctx.arc(-5,-6,4,0,7);ctx.fill();ctx.restore();}
function draw(){if(FX)return drawFx();ctx.clearRect(0,0,W,H);
ctx.fillStyle='rgba(255,82,82,.25)';ctx.fillRect(0,56,W,3);
ctx.strokeStyle='rgba(255,82,82,.7)';ctx.setLineDash([8,6]);ctx.beginPath();ctx.moveTo(0,DEADY);ctx.lineTo(W,DEADY);ctx.stroke();ctx.setLineDash([]);
ctx.fillStyle='#f44336';ctx.font='12px sans-serif';ctx.fillText('危险线',8,DEADY-6);
for(let r=0;r<grid.length;r++)for(let c=0;c<rowLen(r);c++){const v=grid[r][c];if(v==null)continue;drawBubble(cellX(r,c),cellY(r),COLORS[v]);}
if(shot)drawBubble(shot.x,shot.y,COLORS[shot.col]);
if(state==='play'&&!shot&&!paused){ctx.strokeStyle='rgba(255,255,255,.45)';ctx.setLineDash([6,8]);ctx.lineWidth=2;let x=SX,y=SY,a=aimA;for(let seg=0;seg<2;seg++){let nx=x+Math.cos(a)*600,ny=y+Math.sin(a)*600;if(nx<R){const t=(R-x)/Math.cos(a);nx=R;ny=y+Math.sin(a)*t;a=Math.PI-a;}else if(nx>W-R){const t=(W-R-x)/Math.cos(a);nx=W-R;ny=y+Math.sin(a)*t;a=Math.PI-a;}ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(nx,ny);ctx.stroke();x=nx;y=ny;if(ny<60)break;}ctx.setLineDash([]);ctx.lineWidth=1;}
ctx.save();ctx.translate(SX,SY);ctx.rotate(aimA+Math.PI/2);ctx.fillStyle='#37474F';ctx.beginPath();ctx.moveTo(-12,0);ctx.lineTo(12,0);ctx.lineTo(0,-34);ctx.closePath();ctx.fill();ctx.restore();
drawBubble(SX,SY-6,COLORS[cur]);drawBubble(SX+44,SY+6,COLORS[nxt],0.55);
ctx.fillStyle='#888';ctx.font='11px sans-serif';ctx.fillText('下一个',SX+30,SY+32);
for(const p of parts){ctx.globalAlpha=Math.max(0,p.life/50);ctx.fillStyle=p.color;ctx.fillRect(p.x-2,p.y-2,4,4);}ctx.globalAlpha=1;
ctx.textAlign='center';for(const f of floats){ctx.globalAlpha=Math.max(0,f.life/50);ctx.fillStyle='#ffd740';ctx.font='bold 20px sans-serif';ctx.fillText(f.t,f.x,f.y);}ctx.globalAlpha=1;ctx.textAlign='left';
if(clearT>0){ctx.fillStyle='rgba(64,196,255,.9)';ctx.font='bold 26px sans-serif';ctx.textAlign='center';ctx.fillText('第 '+level+' 关!',W/2,H/2);ctx.textAlign='left';}
}
/* ART T1-1: candy-depth renderer (GameUI.fx); the flat draw() below stays as the no-FX fallback */
const FX=window.GameUI&&GameUI.fx&&GameUI.fx.on?GameUI.fx:null;let boardLayer=null;
if(FX)FX.hidpi(cv,ctx,W,H);
function fxBoard(){
  const d=Math.max(1,Math.min(2.5,window.devicePixelRatio||1)),c=document.createElement('canvas');c.width=W*d;c.height=H*d;const g=c.getContext('2d');g.scale(d,d);
  const bg=g.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#4a1f86');bg.addColorStop(.7,'#2a1158');bg.addColorStop(1,'#1a0a3a');g.fillStyle=bg;g.fillRect(0,0,W,H);
  const sp=g.createRadialGradient(W/2,180,20,W/2,240,360);sp.addColorStop(0,'rgba(255,170,230,.22)');sp.addColorStop(1,'rgba(0,0,0,.3)');g.fillStyle=sp;g.fillRect(0,0,W,H);
  g.fillStyle='rgba(255,255,255,.06)';for(let y=10;y<H;y+=26)for(let x=(y/26|0)%2?13:0;x<W;x+=26){g.beginPath();g.arc(x,y,2.2,0,7);g.fill();}
  const tp=g.createLinearGradient(0,0,0,58);tp.addColorStop(0,'#ff8ac6');tp.addColorStop(1,'#b0418a');g.fillStyle=tp;g.fillRect(0,0,W,56);
  g.fillStyle='rgba(255,255,255,.45)';g.fillRect(0,0,W,3);g.fillStyle='rgba(60,0,40,.45)';g.fillRect(0,56,W,4);
  g.fillStyle='rgba(255,255,255,.25)';for(let x=12;x<W;x+=28){g.beginPath();g.arc(x,30,5,0,7);g.fill();}
  const fl=g.createLinearGradient(0,DEADY,0,H);fl.addColorStop(0,'rgba(255,82,120,.16)');fl.addColorStop(1,'rgba(255,82,120,0)');g.fillStyle=fl;g.fillRect(0,DEADY,W,H-DEADY);
  g.shadowColor='#ff4d6d';g.shadowBlur=8;g.strokeStyle='rgba(255,110,140,.9)';g.lineWidth=2;g.setLineDash([8,6]);g.beginPath();g.moveTo(0,DEADY);g.lineTo(W,DEADY);g.stroke();g.setLineDash([]);g.shadowBlur=0;
  g.fillStyle='#ff9db3';g.font='800 12px sans-serif';g.fillText('危险线',8,DEADY-6);
  const bs=g.createRadialGradient(SX,SY+30,6,SX,SY+30,70);bs.addColorStop(0,'rgba(255,215,64,.35)');bs.addColorStop(1,'rgba(255,215,64,0)');g.fillStyle=bs;g.fillRect(SX-80,SY-40,160,100);
  return c;
}
function drawFx(){
  if(!boardLayer)boardLayer=fxBoard();
  ctx.drawImage(boardLayer,0,0,W,H);
  for(let r=0;r<grid.length;r++)for(let c=0;c<rowLen(r);c++){const v=grid[r][c];if(v==null)continue;FX.orb(ctx,cellX(r,c),cellY(r),R,COLORS[v]);}
  if(shot){FX.glow(ctx,COLORS[shot.col],12);FX.orb(ctx,shot.x,shot.y,R,COLORS[shot.col]);FX.noGlow(ctx);}
  if(state==='play'&&!shot&&!paused){ctx.strokeStyle='rgba(255,255,255,.7)';ctx.setLineDash([2,9]);ctx.lineCap='round';ctx.lineWidth=4;let x=SX,y=SY,a=aimA;for(let seg=0;seg<2;seg++){let nx=x+Math.cos(a)*600,ny=y+Math.sin(a)*600;if(nx<R){const t=(R-x)/Math.cos(a);nx=R;ny=y+Math.sin(a)*t;a=Math.PI-a;}else if(nx>W-R){const t=(W-R-x)/Math.cos(a);nx=W-R;ny=y+Math.sin(a)*t;a=Math.PI-a;}ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(nx,ny);ctx.stroke();x=nx;y=ny;if(ny<60)break;}ctx.setLineDash([]);ctx.lineWidth=1;ctx.lineCap='butt';}
  FX.shadow(ctx,SX,SY+24,34,7,.35);
  ctx.save();ctx.translate(SX,SY);ctx.rotate(aimA+Math.PI/2);
  const bg=ctx.createLinearGradient(-12,0,12,0);bg.addColorStop(0,'#7b4bd6');bg.addColorStop(.4,'#c9a4ff');bg.addColorStop(1,'#4a248f');
  ctx.fillStyle=bg;ctx.beginPath();if(ctx.roundRect)ctx.roundRect(-11,-40,22,40,8);else ctx.rect(-11,-40,22,40);ctx.fill();
  ctx.fillStyle='#ffd23f';ctx.fillRect(-11,-40,22,6);ctx.restore();
  FX.tile(ctx,SX-30,SY+6,60,22,'#8d58ff',11);
  FX.orb(ctx,SX,SY-6,R,COLORS[cur]);
  FX.orb(ctx,SX+50,SY+12,9,COLORS[nxt]);
  ctx.fillStyle='rgba(255,255,255,.8)';ctx.font='700 11px sans-serif';ctx.fillText('下一个',SX+32,SY+38);
  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life/50);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,2.6,0,7);ctx.fill();}ctx.globalAlpha=1;
  ctx.textAlign='center';ctx.lineJoin='round';ctx.lineWidth=5;for(const f of floats){ctx.globalAlpha=Math.max(0,f.life/50);ctx.font='900 20px sans-serif';ctx.strokeStyle='#4a1050';ctx.strokeText(f.t,f.x,f.y);ctx.fillStyle='#ffe14d';ctx.fillText(f.t,f.x,f.y);}ctx.globalAlpha=1;ctx.textAlign='left';
  if(clearT>0){ctx.font='900 28px sans-serif';ctx.textAlign='center';ctx.lineWidth=7;ctx.strokeStyle='#4a1050';ctx.strokeText('第 '+level+' 关!',W/2,H/2);ctx.fillStyle='#7af5ff';ctx.fillText('第 '+level+' 关!',W/2,H/2);ctx.textAlign='left';}
}
function loop(){raf=requestAnimationFrame(loop);if(state==='play'&&!paused){if(shot)stepShot();if(clearT>0)clearT--;for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=0.12;p.life--;}parts=parts.filter(p=>p.life>0);for(const f of floats){f.y-=0.8;f.life--;}floats=floats.filter(f=>f.life>0);}draw();}
$('startBtn').onclick=()=>{ac();startGame();};
$('restartBtn').onclick=()=>{ac();startGame();};
$('restartBtn2').onclick=()=>{ac();startGame();};
$('resumeBtn').onclick=()=>{paused=false;hide('pauseScr');};
$('pauseBtn').onclick=()=>{if(state!=='play')return;paused=!paused;if(paused)show('pauseScr');else hide('pauseScr');};
$('soundBtn').onclick=function(){soundOn=!soundOn;try{GameUI.storageSet('g100_sound',soundOn?'1':'0');}catch(e){}this.textContent=soundOn?'🔊':'🔇';if(soundOn)tone(660,0.1);};
$('soundBtn').textContent=soundOn?'🔊':'🔇';
level=1;state='start';reset();loop();
</script>
