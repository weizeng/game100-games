<style>

<style>

function bindControls(){
  cv.addEventListener('pointerdown',e=>{
    if(Kit.state!=='play')return;

    if(!dragActive||Kit.state!=='play')return;

    }

    if(dragActive&&dragMoved<8&&holdDir!==0&&Kit.state==='play'){

    if(Kit.state!=='play')return;

}

function makeRing(idx,lv,R){
  const g=new THREE.Group();
  const boss=[4,9,14].includes(lv);
  const palA=PALETTES[(idx+lv)%PALETTES.length];
  const palB=PALETTES[(idx+lv+2)%PALETTES.length];
  const rim=new THREE.Mesh(geoRim,new THREE.MeshStandardMaterial({color:0x231542,emissive:0x0e0822}));
  g.add(rim);

  // Determine sector types: 0 = gap, 1 = safe pad, 2 = danger solid block
  const sectors=new Array(N_SEC).fill(1);
  const gapWidth=(boss&&lv>=9)?2:(lv>=11&&idx%2===1)?2:3;
  const gapStart=Math.floor(R()*N_SEC);
  for(let k=0;k<gapWidth;k++)sectors[(gapStart+k)%N_SEC]=0;
  // Secondary gap on early levels or wide rings
  if(lv<4||(idx%3===0&&!boss)){
    const g2=(gapStart+6)%N_SEC;
    sectors[g2]=0;if(lv<2)sectors[(g2+1)%N_SEC]=0;
  }
  // Place danger solid blocks away from immediate gap edges
  const dangerCount=Math.min(5,1+Math.floor(lv/3)+(boss?2:0)+(idx%2));
  let placed=0,tries=0;
  while(placed<dangerCount&&tries<24){
    tries++;
    const s=Math.floor(R()*N_SEC);
    if(sectors[s]!==0&&sectors[(s+1)%N_SEC]!==0&&sectors[(s+N_SEC-1)%N_SEC]!==0){
      sectors[s]=2;placed++;
    }
  }

  const meshes=new Array(N_SEC).fill(null);
  for(let s=0;s<N_SEC;s++){
    const t=sectors[s];
    if(t===0)continue;
    const ang=s*SEC_STEP;
    const isAlt=(boss||lv>=5)&&(s%2===1);
    const pal=isAlt?palB:palA;
    const mat=t===2
      ?new THREE.MeshStandardMaterial({color:0xff2255,emissive:0x550018,roughness:0.35})
      :new THREE.MeshStandardMaterial({color:pal[0],emissive:pal[1],roughness:0.4});
    const m=new THREE.Mesh(t===2?geoDanger:geoSafe,mat);
    m.position.set(Math.sin(ang)*R_MID,t===2?0.08:0,Math.cos(ang)*R_MID);
    m.rotation.y=ang;
    if(t===2){
      const cap=new THREE.Mesh(geoDangerCap,new THREE.MeshStandardMaterial({color:0xffb703,emissive:0x552200}));
      cap.position.set(0,0.24,0);
      m.add(cap);
    }
    g.add(m);
    meshes[s]=m;
  }

  const dir=(idx%2===0?1:-1);

  ball.add(ballHalo);

// Shift entire world upward by +RING_GAP whenever a ring is cleared so coordinates stay near origin (anti-black-screen)
function shiftWorldUp(){
  ballY+=RING_GAP;
  camY+=RING_GAP;
  for(const r of rings)r.group.position.y+=RING_GAP;
  if(goalPad)goalPad.position.y+=RING_GAP;
  for(const b of bursts)b.position.y+=RING_GAP;
  const span=14*RING_GAP*0.9;
  for(const p of bgProps){
    p.position.y+=RING_GAP*0.65;
    if(p.position.y>5)p.position.y-=span;
  }
  updateCamera();
}

function step(dt){
  if(ended||Kit.state!=='play'||!ball)return;
  elTime+=dt;

  // Continuous hold rotation (when tapping/holding left or right half of screen or arrow keys)
  if(holdDir!==0&&(!dragActive||dragMoved<6)){
    userRot+=holdDir*2.5*dt;
  }

  // Rotate all active rings
  for(let i=0;i<rings.length;i++){
    const r=rings[i];
    const wave=r.osc?Math.sin(elTime*2.1+r.idx)*0.55:0;
    r.rot+=r.spd*dt;
    r.group.rotation.y=r.rot+wave+userRot;
  }
  if(goalPad)goalPad.rotation.y=userRot*0.5+elTime*0.4;

  // Ball physics
  const grav=13.5-Kit.up('bounce')*0.6;
  ballVY=Math.max(-11.5,ballVY-grav*dt);
  ballY+=ballVY*dt;

  // Fever visuals
  const isFever=combo>=3;
  ballHalo.visible=isFever;
  if(isFever){
    ball.material.color=new THREE.Color(0xff5500);
    ball.material.emissive=new THREE.Color(0x882200);
    ballHalo.rotation.z+=dt*8;
  }else{
    ball.material.color=new THREE.Color(0xffcf33);
    ball.material.emissive=new THREE.Color(0x552800);
  }

  // Check interaction with top ring (always at y = 0 because of shiftWorldUp!)
  if(rings.length>0){
    const topR=rings[0];
    const ringY=topR.group.position.y; // 0
    if(ballY-BALL_R<=ringY+0.13&&ballVY<0){
      // Find which sector is at world angle 0 (under the ball at x=0, z=R_MID)
      const rel=normAngle(-topR.group.rotation.y);
      const norm=((rel%(Math.PI*2))+Math.PI*2)%(Math.PI*2);
      const secIdx=Math.round(norm/SEC_STEP)%N_SEC;
      const secType=topR.sectors[secIdx];

      if(secType===0){
        // Passed cleanly through gap!
        combo++;
        const pts=(25+Kit.lv*4)*Math.min(5,combo);
        score+=pts;$('score').textContent=score;
        Kit.sfx(combo>=3?'coin':'ok');
        if(combo===3)Kit.toast('🔥 连穿 3 层！烈焰击碎开启',1000);
        clearTopRing(false);
      }else if(isFever){
        // Fever mode smashes right through ANY sector (safe or danger)!
        score+=60+Kit.lv*6;$('score').textContent=score;
        Kit.sfx('smash');
        Kit.toast('💥 烈焰击碎平台！',800);
        combo=0;
        ballY=ringY+0.13+BALL_R;
        bounceBall();
        clearTopRing(true);
      }else if(secType===1){
        // Safe bounce pad: bounce up, reset combo
        ballY=ringY+0.13+BALL_R;
        bounceBall();
        combo=0;
        Kit.sfx('tap');
      }else{
        // Hit danger solid block! Deduct 1 life and shatter that block into safe pad
        ballY=ringY+0.21+BALL_R;
        bounceBall();
        combo=0;hits++;lives--;
        Kit.sfx('bad');
        spawnBurst(ringY+0.15,0xff2255,10);
        topR.sectors[secIdx]=1;
        const m=topR.meshes[secIdx];
        if(m){
          m.material.color=new THREE.Color(topR.pal);
          m.material.emissive=new THREE.Color(0x112233);
          m.position.y=0;
          while(m.children.length)m.remove(m.children[0]);
        }
        if(lives<=0){
          updHud();
          lose('撞上异色禁区耗尽生命');
          return;
        }else{
          Kit.toast('⚠️ 撞上禁区！生命 -1',900);
        }
      }
    }
  }else if(goalPad){
    const gy=goalPad.position.y;
    if(ballY-BALL_R<=gy+0.2){
      ballY=gy+0.2+BALL_R;
      spawnBurst(gy+0.2,0x33e1a0,16);
      win();
      return;
    }
  }

  ball.position.set(0,ballY,R_MID);
  ball.rotation.x-=ballVY*dt*1.6;

  // Camera smoothly follows downward or upward with clamping so ball is always in frame
  const targetCamY=Math.min(camY,ballY+0.35);
  camY+=(targetCamY-camY)*Math.min(1,dt*8);
  if(ballY>camY+1.1)camY=ballY-1.1;
  updateCamera();

  // Update burst particles
  for(let i=bursts.length-1;i>=0;i--){
    const b=bursts[i],u=b.userData;
    b.position.x+=u.vx*dt;b.position.y+=u.vy*dt;b.position.z+=u.vz*dt;
    u.vy-=9*dt;u.life-=dt;
    b.rotation.x+=dt*6;b.rotation.y+=dt*5;
    if(u.life<=0){scene.remove(b);bursts.splice(i,1);}
  }

  updHud();
}

function win(){
  if(ended)return;ended=true;running=false;
  const sc=Math.max(0,Math.round(score+lives*80-hits*25+(Kit.lv+1)*45));
  let st=1;if(hits<=1)st=2;if(hits===0&&lives>=maxLives)st=3;
  Kit.win(sc,st,'穿透 '+ringsNeed+' 层 · 失误 '+hits+' 次 · 剩余 ❤️'+lives+'<br>对准缺口连续直坠可触发烈焰破层！');
}

function lose(m){
  if(ended)return;ended=true;running=false;
  Kit.lose(Math.round(score*0.5+passed*20),m+'（已穿透 '+passed+'/'+ringsNeed+' 层）');
}

function loop(t){
  if(!running||Kit.state!=='play')return;
  const dt=Math.min(0.033,(t-last)/1000);last=t;
  step(dt);
  if(renderer&&scene&&camera)renderer.render(scene,camera);
  raf=requestAnimationFrame(loop);
}

function start(i){
  if(!renderer)init3();
  layout();
  makeLevel(i);
  running=true;ended=false;last=performance.now();
  $('hint').textContent=bossMode===1?'👑 旋风双环塔：相邻层反向快转，抓准交汇缺口':bossMode===2?'👑 窄缝棱镜塔：缺口收窄且周期摆动，连击破层':bossMode===3?'👑 终焉螺旋王座：极速多层异色禁区，善用烈焰暴走':'按住屏幕左右拖动（或点左/右半屏）旋转高塔，让球从缺口落下。';
  $('acts').innerHTML='<button class="btn ghost" id="rotLBtn">⏪ 左旋</button><button class="btn ghost" id="rotRBtn">右旋 ⏩</button>';
  const bindAct=(id,dir)=>{
    const el=$(id);if(!el)return;
    el.addEventListener('pointerdown',e=>{e.preventDefault();holdDir=dir;userRot+=dir*0.22;Kit.sfx('tap');});
    el.addEventListener('pointerup',()=>{holdDir=0;});
    el.addEventListener('pointercancel',()=>{holdDir=0;});
    el.addEventListener('pointerleave',()=>{holdDir=0;});
  };
  bindAct('rotLBtn',-1);
  bindAct('rotRBtn',1);
  updHud();
  if(renderer&&scene&&camera)renderer.render(scene,camera);
  raf=requestAnimationFrame(loop);
}

function stop(){running=false;cancelAnimationFrame(raf);ended=true;holdDir=0;dragActive=false;}

Kit.init({
  id:'helixdrop',levels:15,boss:[5,10,15],
  bossName:i=>i===4?'旋风双环塔':i===9?'窄缝棱镜塔':'终焉螺旋王座',
  start,stop,
  pause:()=>{running=false;holdDir=0;},
  resume:()=>{if(!ended){running=true;last=performance.now();raf=requestAnimationFrame(loop);}},
  note:()=>'Three.js 三维螺旋高塔 · 旋转缺口直坠到底',
  tut:[
    ['旋转高塔','按住屏幕左右拖动（或点左/右半屏）旋转整座螺旋塔，把缺口转到小球正下方。','🌀'],
    ['穿过缺口','小球落在普通彩色扇区会安全弹起；对准缺口即可穿过该层得分。','⬇️'],
    ['连穿暴走','连续穿过 3 层缺口不弹跳，小球化为烈焰火球，可直接击碎下一层任意扇区！','🔥'],
    ['异色禁区 & 首领','撞上赤红高凸禁区会扣命；第 5/10/15 关为首领塔，转速更快、缺口更窄！','👑']
  ],
  ups:[
    {k:'life',ic:'❤️',name:'额外命',max:3,cost:l=>24+l*22},
    {k:'slow',ic:'❄️',name:'慢转',max:3,cost:l=>26+l*24},
    {k:'bounce',ic:'🏀',name:'弹力',max:3,cost:l=>22+l*20}
  ]
});
</script>
