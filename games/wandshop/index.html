<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>魔杖店</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:linear-gradient(165deg,#3d1f02 0%,#2a1503 45%,#120a02 100%);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;display:flex;justify-content:center;min-height:100vh;touch-action:manipulation;-webkit-user-select:none;user-select:none;overflow-x:hidden}
.wrap{width:100%;max-width:480px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:10px;position:relative;z-index:1}
.topbar{width:100%;display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:9px 12px;font-size:14px}
.topbar .title{font-weight:700;font-size:16px}
.topbar .stat{color:#ffe0b2;font-size:12px}
.topbar .stat b{color:#fff;font-size:14px}
.tbtn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:#fff;font-size:17px;min-width:42px;height:42px;border-radius:11px;cursor:pointer;transition:transform .08s}
.tbtn:active{transform:scale(.9)}
.screen{width:100%;display:none;flex-direction:column;align-items:center;gap:10px}
.screen.on{display:flex}
.card{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:20px;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.card h1{font-size:26px;margin-bottom:8px;background:linear-gradient(90deg,#ffcc80,#ff9800);-webkit-background-clip:text;background-clip:text;color:transparent}
.card h2{font-size:22px;margin-bottom:8px}
.card p{color:#f5e6d0;font-size:14px;line-height:1.9;margin-bottom:12px;text-align:left}
.card p b{color:#ffcc80}
.bigbtn{background:linear-gradient(135deg,#ef6c00,#ffb74d);border:none;color:#3d1f00;font-size:18px;font-weight:700;padding:14px 44px;border-radius:999px;cursor:pointer;box-shadow:0 6px 18px rgba(239,108,0,.45);transition:transform .1s;min-height:48px}
.bigbtn:active{transform:scale(.93)}
.ghostbtn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#fff;font-size:14px;padding:10px 22px;border-radius:999px;cursor:pointer;min-height:44px}
.ghostbtn:active{transform:scale(.93)}
.best{color:#ffd76a;font-size:14px;margin-top:8px}
.cust{display:flex;gap:12px;align-items:center;text-align:left;background:rgba(255,152,0,.08);border:1px solid rgba(255,152,0,.25);border-radius:14px;padding:12px;margin-bottom:10px}
.cust .ava{font-size:44px}
.cust .req{font-size:14px;line-height:1.7;color:#f5e6d0}
.cust .req b{color:#ffcc80}
.optrow{margin-bottom:8px;text-align:left}
.optrow .lbl{font-size:13px;color:#ffcc80;font-weight:700;margin-bottom:6px}
.opts{display:flex;gap:8px}
.opt{flex:1;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.12);color:#fff;font-size:14px;border-radius:12px;padding:10px 4px;cursor:pointer;min-height:48px;transition:transform .08s}
.opt:active{transform:scale(.95)}
.opt.sel{border-color:#ff9800;background:rgba(255,152,0,.22);box-shadow:0 0 12px rgba(255,152,0,.35)}
.opt .sub{display:block;font-size:11px;color:#d8c9b0;margin-top:3px}
.fb{background:rgba(255,255,255,.06);border:1px dashed rgba(255,204,128,.5);border-radius:12px;padding:12px;font-size:14px;line-height:1.8;color:#ffe9cc;margin:10px 0;display:none;text-align:left}
.fb.on{display:block}
.stars{font-size:30px;letter-spacing:4px;margin:6px 0}
.stars .off{color:rgba(255,255,255,.22)}
.btnrow{display:flex;gap:10px;justify-content:center;margin-top:8px;flex-wrap:wrap}
.prog{font-size:13px;color:#ffcc80;margin-bottom:2px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:40;backdrop-filter:blur(4px)}
.ov.on{display:flex}
.pausecard{background:#2a1a06;border:1px solid rgba(255,152,0,.3);border-radius:18px;padding:28px 32px;text-align:center;display:flex;flex-direction:column;gap:12px;max-width:86vw}
.pausecard h2{font-size:20px}
#toast{position:fixed;top:38%;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.82);border:1px solid rgba(255,152,0,.4);color:#fff;font-size:16px;font-weight:700;padding:12px 26px;border-radius:999px;z-index:70;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;max-width:92vw}
.float{position:fixed;pointer-events:none;z-index:60;font-weight:800;font-size:26px;animation:floatup 1.1s ease-out forwards;text-shadow:0 2px 6px rgba(0,0,0,.6)}
@keyframes floatup{0%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-52px)}}
</style>
<!-- GAME UI BEGIN -->
<style>
:root{--page:#1a1030;--surface:#261a44;--soft:#33245a;--ink:#f4eeff;--muted:#bcaedb;--accent:#c79bff;--on-accent:#1f0f3a;--line:#4a3a78;--stage:#120a24;--page:#0d0620;--surface:#22113f;--soft:#34244e;--ink:#f6eeff;--muted:#c9b6e6;--accent:#b26bff;--on-accent:#0b0620;--line:#b26bff;--b-bg1:#4a1a7a;--b-bg2:#0d0620;--b-btn:#b26bff;--b-btn-hi:#cd9fff;--b-edge:#5a22a8;--b-glow:#ff8af0;--b-glow-rgb:255,138,240;--b-pedge-rgb:178,107,255;--b-btn-ink:#32135c;--b-btn-tsh:0 1px 0 rgba(255,255,255,.45);--b-coin-ink:#32135c;--b-coin-tsh:none;--b-key-ink:#ff8af0;--b-title:#ffffff}
/* Shared presentation only; mechanics and state remain inside each standalone game. */
html.game-ui{background:var(--page);color:var(--ink);color-scheme:light;font-family:"Bahnschrift","Microsoft YaHei UI","PingFang SC",sans-serif}
html.game-ui:is([data-theme="space"],[data-theme="arcade"],[data-theme="lab"],[data-theme="ocean"],[data-theme="magic"]){color-scheme:dark}
.game-ui body{background:var(--page);color:var(--ink);font-family:inherit;overscroll-behavior:none}
.game-ui body>.wrap{padding:20px 16px max(20px,env(safe-area-inset-bottom));gap:14px;max-width:500px}
.game-ui #app{background:var(--page);color:var(--ink)}
.game-ui :is(.topbar,#topbar){gap:8px;flex-wrap:wrap;min-height:58px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:10px 12px;box-shadow:0 3px 0 var(--soft);font-size:13px}
.game-ui :is(.title,.tb-title,.tb-title,#topbar .t,.topbar .t){color:var(--ink);font-size:16px;font-weight:750;letter-spacing:0}
.game-ui :is(.topbar,.hud,#hud,#topbar) :is(b,.v){color:var(--accent);font-variant-numeric:tabular-nums}
.game-ui :is(.stat,.topbar .s,.topbar .stat,.scorebar,.stats,.tip,.hint,.hintline,.hsline,.best,.hiscore){color:var(--muted);line-height:1.7}
.game-ui :is(.hint,.hintline,.tip){font-size:12px;max-width:40em;text-wrap:pretty}
.game-ui .scorebar{padding:6px 10px;gap:8px;flex-wrap:wrap}
.game-ui :is(.iconbtn,.iconBtn,.icobtn,.ibtn,.tbtn,.hbtn,.ib,.iconBtn,.pause){min-width:44px;min-height:44px;flex-shrink:0;border-radius:12px;background:var(--soft);color:var(--ink);border:1px solid var(--line);box-shadow:none;font-size:17px}
.game-ui button{font-family:inherit;cursor:pointer;touch-action:manipulation}
.game-ui button:focus-visible,.game-ui [tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.game-ui :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn){background:var(--accent);color:var(--on-accent);border:1px solid transparent;border-radius:13px;min-height:50px;padding:13px 28px;font-size:16px;font-weight:750;letter-spacing:0;box-shadow:0 4px 0 var(--line);text-shadow:none;max-width:100%}
.game-ui :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn):active{box-shadow:none;transform:translateY(2px)}
.game-ui :is(.ghost,.ghostbtn,.btn2,.abtn,.toolbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line);box-shadow:none;border-radius:12px;min-height:44px}
.game-ui :is(.rowbtns,.btnrow,.ctlrow){gap:10px;flex-wrap:wrap;justify-content:center}
.game-ui :is(.pill,.hudbox,.hud .p){background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:none;font-variant-numeric:tabular-nums}
.game-ui :is(.dbtn,.cbtn,.gbtn,.holdbtn,.firebtn,.bombbtn,.jumpbtn,.pumpbtn,.nbtn){border-radius:12px;box-shadow:0 3px 0 var(--line);min-height:44px}
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv,.screen):has(>.ui-panel){padding:20px;overflow-y:auto;overscroll-behavior:contain}
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv):has(>.ui-panel){background:var(--page);backdrop-filter:none;justify-content:safe center;align-items:center}
.game-ui .ui-panel{width:min(100%,380px);max-height:100%;overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:18px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:24px;padding:30px 24px;box-shadow:0 8px 0 var(--soft),0 20px 48px #15253618;text-align:center;margin:auto}
.game-ui .ui-panel :is(.card,.panel,.pausecard,.ovcard){display:contents}
.game-ui .ui-panel :is(h1,h2,.gamename,.gametitle){font-size:30px;line-height:1.25;font-weight:800;color:var(--ink);background:none;-webkit-text-fill-color:currentColor;text-shadow:none;letter-spacing:-.6px;margin:0}
.game-ui .ui-panel :is(p,.howto,.sub,.rule){font-size:14px;line-height:1.85;color:var(--muted);background:none;border:0;box-shadow:none;padding:0;margin:0;max-width:32em;text-align:left;white-space:normal}
.game-ui .ui-panel :is(.bigemoji,.bigemoji,.ic,.big):not(.bigscore){animation:none;filter:none;text-shadow:none}
.game-ui .ui-emblem{width:90px;height:90px;display:grid;place-items:center;border:1px solid var(--line);border-radius:28px;background:var(--soft);font-size:48px;line-height:1;flex-shrink:0;position:relative}
.game-ui[data-theme="wood"] .ui-emblem{border-radius:50%;box-shadow:inset 0 0 0 5px var(--surface),inset 0 0 0 6px var(--line)}
.game-ui[data-theme="wood"] .ui-panel h1{font-family:"STKaiti","KaiTi","Microsoft YaHei",serif;letter-spacing:2px}
.game-ui[data-theme="ice"] .ui-emblem{border-radius:26px 8px 26px 8px}
.game-ui[data-theme="space"] .ui-emblem{background:radial-gradient(circle at center,var(--soft) 42%,transparent 43%),var(--surface);border-radius:50%;outline:1px solid var(--line);outline-offset:7px;margin:7px}
.game-ui[data-theme="kitchen"] .ui-emblem{border-radius:22px;border-bottom:5px solid var(--line)}
.game-ui .ui-panel :is(.score,.bigscore,.bigScore,.scorebig){color:var(--accent);font-size:48px;font-weight:800;font-variant-numeric:tabular-nums}
.game-ui .ui-panel :is(.best,.hsline,.hiscore,.endstats,.endstats b){color:var(--muted);font-size:13px;line-height:1.8}
.game-ui .ui-mode{display:grid;grid-template-columns:1fr 1fr;gap:5px;background:var(--soft);padding:5px;border:1px solid var(--line);border-radius:14px;width:100%}
.game-ui .ui-mode button{min-height:44px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-size:14px;font-weight:700;box-shadow:none}
.game-ui .ui-mode button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 2px 5px #1525361a}
.game-ui .ui-panel .ui-mode-note{font-size:12px;line-height:1.6;text-align:center;color:var(--muted)}
.game-ui .ui-mode-status{display:block;padding:5px 10px;color:var(--accent);font-size:11px;font-weight:700;line-height:1.5;text-align:center;border:1px solid var(--line);border-radius:8px;background:var(--surface);margin:4px auto;max-width:100%;pointer-events:none}
.game-ui body>.wrap>canvas:not(#fx){background-color:var(--stage);box-shadow:0 0 0 1px var(--line),0 6px 0 var(--soft);border-radius:18px;flex-shrink:0}
.game-ui .screen>canvas.game{box-shadow:0 0 0 1px var(--line),0 6px 0 var(--soft)}
.game-ui #hud{gap:6px;background:var(--surface);color:var(--ink)}
.game-ui #hud :is(.left,.t,.s,.grp,.pill){color:var(--ink)}
.game-ui #hud .pill{background:var(--surface);border-color:var(--line)}
.game-ui body canvas:is(#cv,#game,#board){background-color:var(--stage)}
.game-ui :is(button.dbtn,button.cbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.game-ui :is(button.lvl,button.lvlbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line);border-radius:12px;min-height:54px}
.game-ui :is(button.lvl,button.lvlbtn) :is(.nc,.sz,small){color:var(--muted)}
.game-ui .ui-panel button.lvl{margin:0;min-width:44px;box-shadow:none;padding:8px}
.game-ui #hud :is(.left,.right,.hudl,.hbtns){gap:5px;flex-wrap:wrap}
.game-ui #hud :is(.left,.hudl){min-width:0;flex-shrink:1}
.game-ui #hud :is(.pill,.left){font-size:12px}
.game-ui button:disabled{cursor:default;opacity:.45;box-shadow:none}
.game-ui .ui-panel .ui-assist-note{color:var(--accent);font-weight:700}
@media(min-width:700px){.game-ui body>.wrap{padding-top:32px}.game-ui .ui-panel{padding:36px 30px}}
@media(max-width:360px){.game-ui body>.wrap{padding:10px;gap:10px}.game-ui .ui-panel{padding:22px 18px;gap:13px}.game-ui .ui-panel h1{font-size:26px}.game-ui .ui-emblem{width:70px;height:70px;font-size:38px}.game-ui :is(.topbar,#topbar){gap:5px;padding:8px}.game-ui :is(.iconbtn,.icobtn,.ibtn,.tbtn,.ib){min-width:44px;min-height:44px}}
@media(max-height:650px){.game-ui .ui-panel{padding:18px;gap:12px}.game-ui .ui-emblem{width:60px;height:60px;font-size:32px}.game-ui .ui-panel h1{font-size:25px}.game-ui .ui-panel :is(p,.howto,.sub,.rule){font-size:13px}}
@media(prefers-reduced-motion:reduce){.game-ui *, .game-ui *::before,.game-ui *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
/* 2026-10-20 热修：开局/结算遮罩铺满整屏，主按钮固定在面板底部，避免被画布尺寸裁切（#10） */
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv):has(>.ui-panel){position:fixed;inset:0;z-index:1000;border-radius:0;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
.game-ui .ui-panel{touch-action:pan-y}
.game-ui .ui-panel :is(#startBtn,#btnStart,.startbtn,#bStart,#restartBtn,#btnRestart,#againBtn,#btnAgain,#retryBtn,#btnRetry,#playBtn,#btnPlay){position:sticky;bottom:0;z-index:3;flex-shrink:0}
.game-ui .ui-panel :not(.card,.panel,.pausecard,.ovcard,.ui-mode):has(>:is(#startBtn,#btnStart,.startbtn,#bStart,#restartBtn,#btnRestart,#againBtn,#btnAgain,#retryBtn,#btnRetry,#playBtn,#btnPlay)){position:sticky;bottom:0;z-index:3;flex-shrink:0;background:var(--surface);box-shadow:0 -10px 10px -6px var(--surface)}


/* ===== Direction B · 霓虹糖果 Pop Arcade ===== saturated gradients, chunky bevels with a hard bottom edge, sticker panels, neon on dark themes */
html.game-ui[data-skin="b"]{--fb:"HarmonyOS Sans SC","MiSans","OPPOSans","vivo Sans","Noto Sans SC","Noto Sans CJK SC","PingFang SC","Microsoft YaHei UI",system-ui,sans-serif;--bounce:cubic-bezier(.34,1.56,.64,1);--bg:radial-gradient(circle at 12% 18%,rgba(255,255,255,.28) 0 38px,transparent 40px),radial-gradient(circle at 88% 30%,rgba(255,255,255,.16) 0 64px,transparent 66px),radial-gradient(circle at 20% 82%,rgba(255,255,255,.14) 0 52px,transparent 54px),radial-gradient(rgba(255,255,255,.16) 1.5px,transparent 2.2px) 0 0/22px 22px,linear-gradient(165deg,var(--b-bg1),var(--b-bg2));font-family:var(--fb)}
html.game-ui[data-skin="b"],html.game-ui[data-skin="b"] body,html.game-ui[data-skin="b"] #app,html.game-ui[data-skin="b"] :is(.overlay,.ov,#ov,#overlay,#pauseOv):has(>.ui-panel){background:var(--bg);background-color:var(--b-bg2)}
html.game-ui[data-skin="b"] body{min-height:100vh;font-family:var(--fb)}
html.game-ui[data-skin="b"] :is(.hint,.hintline,.tip){color:rgba(255,255,255,.94);text-shadow:0 1px 2px rgba(0,0,0,.35)}
/* Sticker panel: white rim + hard coloured bottom edge + drop */
html.game-ui[data-skin="b"] .ui-panel{background:linear-gradient(180deg,var(--surface),var(--soft));border:4px solid #fff;border-radius:32px;box-shadow:0 9px 0 var(--line),0 9px 0 4px rgba(0,0,0,.08),0 26px 40px rgba(0,0,0,.28);animation:uiB-in .5s var(--bounce) both}
html.game-ui[data-skin="b"] .ui-panel :is(h1,h2,.gamename,.gametitle){font-size:34px;font-weight:900;color:var(--b-title);letter-spacing:0;text-shadow:0 3px 0 var(--line),0 6px 10px rgba(0,0,0,.15)}
html.game-ui[data-skin="b"] .ui-emblem{width:100px;height:100px;border:4px solid #fff;border-radius:50%;background:radial-gradient(circle at 32% 26%,#fff 0 12%,var(--b-glow) 13%,var(--line) 70%,var(--b-edge) 100%);box-shadow:0 7px 0 var(--b-edge),0 16px 24px rgba(0,0,0,.25);font-size:54px;animation:uiB-wobble 2.6s ease-in-out infinite}
html.game-ui[data-skin="b"] .ui-emblem::before,html.game-ui[data-skin="b"] .ui-emblem::after{content:"✦";position:absolute;color:#fff;font-size:20px;text-shadow:0 0 8px var(--b-glow);animation:uiB-twinkle 1.8s ease-in-out infinite}
html.game-ui[data-skin="b"] .ui-emblem::before{top:-10px;right:-14px}
html.game-ui[data-skin="b"] .ui-emblem::after{bottom:4px;left:-18px;font-size:14px;animation-delay:.9s}
html.game-ui[data-skin="b"] .ui-panel :is(.score,.bigscore,.bigScore,.scorebig,#finalScore){font-size:56px;font-weight:900;color:var(--b-btn);-webkit-text-fill-color:currentColor;text-shadow:0 4px 0 var(--b-edge),0 0 2px var(--b-edge),0 10px 16px rgba(0,0,0,.25)}
html.game-ui[data-skin="b"] .ui-panel :is(h1,.gamename)~h2{font-size:19px;text-shadow:0 2px 0 var(--line)}
/* Chunky bevelled button: highlight lip, darker bottom slab, presses down onto the slab */
html.game-ui[data-skin="b"] :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn,button.actBtn):not(.ghost){position:relative}
html.game-ui[data-skin="b"] :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn,button.actBtn):not(.ghost):not(#\#){overflow:hidden;border:0;border-radius:20px;font-weight:900;color:var(--b-btn-ink);background:linear-gradient(180deg,var(--b-btn-hi),var(--b-btn) 52%);text-shadow:var(--b-btn-tsh);box-shadow:inset 0 3px 0 rgba(255,255,255,.55),inset 0 -5px 0 rgba(0,0,0,.14),0 6px 0 var(--b-edge),0 12px 18px rgba(0,0,0,.25);transition:transform .08s,box-shadow .08s}
html.game-ui[data-skin="b"] :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn,button.actBtn):not(.ghost):not(#\#)::before{content:"";position:absolute;left:12px;top:6px;width:22px;height:9px;border-radius:9px;background:rgba(255,255,255,.75);transform:rotate(-12deg);pointer-events:none}
html.game-ui[data-skin="b"] :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn,button.actBtn):not(.ghost):not(#\#):active{transform:translateY(5px);box-shadow:inset 0 3px 0 rgba(255,255,255,.4),inset 0 -2px 0 rgba(0,0,0,.14),0 1px 0 var(--b-edge),0 4px 8px rgba(0,0,0,.2)}
html.game-ui[data-skin="b"] .ui-panel :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn,button.actBtn):not(.ghost):not(#\#){min-height:56px;padding:14px 34px;font-size:19px;letter-spacing:1px}
/* Secondary keys: white candy keys with a coloured slab */
html.game-ui[data-skin="b"] :is(.ghost,.ghostbtn,.btn2,.abtn,.toolbtn,.iconbtn,.iconBtn,.icobtn,.ibtn,.tbtn,.hbtn,.ib,.pause,.dbtn,.cbtn,.nbtn,.lvl,.lvlbtn){border:0;border-radius:16px;background:linear-gradient(180deg,#fff,var(--soft));color:var(--b-key-ink);font-weight:900;box-shadow:inset 0 -3px 0 rgba(0,0,0,.06),0 5px 0 var(--line),0 8px 12px rgba(0,0,0,.18);transition:transform .08s,box-shadow .08s}

      g.fillStyle = 'rgba(255,255,255,.75)'; g.beginPath(); g.ellipse(w * .3, h * .27, w * .13, h * .07, -.5, 0, 7); g.fill();
    } else { // soft 3D: drop shadow, vertical light falloff, top gloss band
      g.shadowColor = 'rgba(0,0,0,.32)'; g.shadowBlur = Math.max(2, w * .18); g.shadowOffsetY = Math.max(1, h * .08);
      var body = g.createLinearGradient(0, 0, 0, h); body.addColorStop(0, shade(color, .28)); body.addColorStop(.55, color); body.addColorStop(1, shade(color, -.22));
      rr(g, 0, 0, w, h, r); g.fillStyle = body; g.fill(); g.shadowColor = 'transparent';
      var gloss = g.createLinearGradient(0, 0, 0, h * .5); gloss.addColorStop(0, 'rgba(255,255,255,.45)'); gloss.addColorStop(1, 'rgba(255,255,255,0)');
      rr(g, w * .08, h * .06, w * .84, h * .42, r * .7); g.fillStyle = gloss; g.fill();
      rr(g, .5, .5, w - 1, h - 1, r); g.strokeStyle = 'rgba(255,255,255,.22)'; g.lineWidth = 1; g.stroke();
    }
  }
  function orbArt(g, r, color, pad) {
    var cx = r, cy = r;
    g.fillStyle = 'rgba(0,0,0,' + (skin === 'b' ? .34 : .26) + ')'; g.beginPath(); g.ellipse(cx + r * .12, cy + r * .78, r * .82, r * .32, 0, 0, 7); g.fill();
    var body = g.createRadialGradient(cx - r * .38, cy - r * .42, r * .08, cx, cy, r);
    body.addColorStop(0, shade(color, .75)); body.addColorStop(.28, shade(color, .18)); body.addColorStop(.75, color); body.addColorStop(1, shade(color, -.45));
    g.fillStyle = body; g.beginPath(); g.arc(cx, cy, r, 0, 7); g.fill();
    if (skin === 'b') { // rim light + crisp specular for the candy look
      g.strokeStyle = 'rgba(255,255,255,.55)'; g.lineWidth = Math.max(1, r * .1); g.beginPath(); g.arc(cx, cy, r * .82, .35 * Math.PI, .75 * Math.PI); g.stroke();
      g.strokeStyle = shade(color, -.55); g.lineWidth = Math.max(1, r * .08); g.beginPath(); g.arc(cx, cy, r - g.lineWidth / 2, 0, 7); g.stroke();
    }
    g.fillStyle = 'rgba(255,255,255,.85)'; g.beginPath(); g.ellipse(cx - r * .35, cy - r * .42, r * .22, r * .14, -.6, 0, 7); g.fill();
  }
  var fx = {
    on: !!skin, skin: skin, shade: shade, rgba: rgba,
    tile: function (ctx, x, y, w, h, color, r) {
      r = r == null ? Math.min(w, h) * (skin === 'b' ? .24 : .2) : r;
      var pad = Math.ceil(w * .25) + 2, s = scaleOf(ctx);
      ctx.drawImage(sprite('t' + color + w + 'x' + h + 'r' + r, w, h, pad, s, function (g) { tileArt(g, w, h, color, r); }), x - pad, y - pad, w + pad * 2, h + pad * 2);
    },
    orb: function (ctx, x, y, r, color) {
      var pad = Math.ceil(r * .5) + 2, s = scaleOf(ctx);
      ctx.drawImage(sprite('o' + color + r, r * 2, r * 2, pad, s, function (g) { orbArt(g, r, color, pad); }), x - r - pad, y - r - pad, r * 2 + pad * 2, r * 2 + pad * 2);
    },
    // Soft elliptical contact shadow under any sprite (emoji, characters, pieces).
    shadow: function (ctx, x, y, rx, ry, a) {
      ctx.save(); ctx.fillStyle = 'rgba(0,0,0,' + (a == null ? .28 : a) + ')'; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, 7); ctx.fill(); ctx.restore();
    },
    // Lit stage background: vertical gradient plus a vignette. Cached per size/colours.
    stage: function (ctx, w, h, top, bottom) {
      var s = scaleOf(ctx);
      ctx.drawImage(sprite('s' + w + 'x' + h + top + bottom, w, h, 0, s, function (g) {
        var lg = g.createLinearGradient(0, 0, 0, h); lg.addColorStop(0, top); lg.addColorStop(1, bottom); g.fillStyle = lg; g.fillRect(0, 0, w, h);
        var v = g.createRadialGradient(w / 2, h * .35, Math.min(w, h) * .2, w / 2, h / 2, Math.max(w, h) * .75);
        v.addColorStop(0, 'rgba(255,255,255,' + (skin === 'b' ? .10 : .07) + ')'); v.addColorStop(1, 'rgba(0,0,0,.35)'); g.fillStyle = v; g.fillRect(0, 0, w, h);
      }), 0, 0, w, h);
    },
    // Glow is shadowBlur: cheap for a handful of shapes, never use it on every tile.
    glow: function (ctx, color, blur) { ctx.shadowColor = color; ctx.shadowBlur = blur; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0; },
    noGlow: function (ctx) { ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; },
    // Crisp rendering on high-DPI phones without changing game coordinates.
    // Only safe where input code converts with getBoundingClientRect + logical W/H, not cv.width.
    hidpi: function (cv, ctx, w, h) {
      var d = Math.max(1, Math.min(2.5, window.devicePixelRatio || 1));
      cv.width = Math.round(w * d); cv.height = Math.round(h * d); // intrinsic ratio stays w:h, so CSS sizing is unchanged
      ctx.setTransform(d, 0, 0, d, 0, 0); return d;
    },
    // Lightweight particle bursts (pooled array, no allocations per frame beyond the burst).
    burst: function (list, x, y, color, n) {
      for (var i = 0; i < (n || 12); i++) { var a = Math.random() * 6.283, v = 1 + Math.random() * 2.6; list.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 1, life: 1, c: color, r: 1.5 + Math.random() * 2.5 }); }
    },
    drawBurst: function (ctx, list) {
      for (var i = list.length - 1; i >= 0; i--) {
        var p = list[i]; p.x += p.vx; p.y += p.vy; p.vy += .12; p.life -= .035;
        if (p.life <= 0) { list.splice(i, 1); continue; }
        ctx.globalAlpha = p.life; ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (skin === 'b' ? 1.2 : 1), 0, 7); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
  };
  window.GameUI.fx = fx;
}());

</script>
<!-- GAME UI END -->
</head>
<body>
<div id="toast"></div>
<div class="wrap">
  <div class="topbar">
    <span class="title">🏪 魔杖店</span>
    <span class="stat">顾客 <b id="cnum">1</b>/5 · ⭐<b id="score">0</b>/15</span>
    <span><button class="tbtn" id="sndBtn" aria-label="静音开关">🔊</button><button class="tbtn" id="pauseBtn" aria-label="暂停">⏸</button></span>
  </div>
  <div class="screen on" id="s-start">
    <div class="card">
      <h1>🏪 魔杖店</h1>
      <p>欢迎来到对角巷最神秘的魔杖店！你将接待 <b>5 位顾客</b>。<br>
      👂 每位顾客只说一句<b>含糊的需求</b>，他们的真实偏好藏在心里<br>
      🪄 从 <b>木材 × 杖芯 × 长度</b> 中搭配一根魔杖呈上<br>
      💬 呈上后顾客给 <b>1-3 星</b> + 一句反馈（透露偏好！）<br>
      🧠 若不满 3 星，可<b>调整一次</b>再正式交付——用反馈推理出偏好，拿下 3 星<br>
      🏆 5 位顾客总星数（满分 15 星）就是你的店主评分！</p>
      <button class="bigbtn" id="startBtn">开店营业</button>
      <div class="best">🏅 历史最佳：<b id="best0">0</b>/15 星</div>
    </div>
  </div>
  <div class="screen" id="s-game">
    <div class="card">
      <div class="prog" id="prog">第 1 位顾客</div>
      <div class="cust">
        <div class="ava" id="ava">🧙‍♀️</div>
        <div class="req" id="req"></div>
      </div>
      <div class="optrow"><div class="lbl">🪵 木材</div><div class="opts" id="woods"></div></div>
      <div class="optrow"><div class="lbl">✨ 杖芯</div><div class="opts" id="cores"></div></div>
      <div class="optrow"><div class="lbl">📏 长度</div><div class="opts" id="lens"></div></div>
      <div class="fb" id="fb"></div>
      <div class="stars" id="stars"></div>
      <div class="btnrow">
        <button class="bigbtn" id="deliverBtn">呈上魔杖</button>
        <button class="ghostbtn" id="retryBtn" style="display:none">调整魔杖</button>
        <button class="ghostbtn" id="nextBtn" style="display:none">下一位顾客</button>
      </div>
    </div>
  </div>
  <div class="screen" id="s-end">
    <div class="card">
      <h2 id="endTitle">🏪 打烊啦</h2>
      <p id="endDesc" style="text-align:center"></p>
      <div class="stars" id="endStars"></div>
      <div class="best">🏅 历史最佳：<b id="best1">0</b>/15 星</div>
      <button class="bigbtn" id="againBtn">重新开店</button>
    </div>
  </div>
</div>
<div class="ov" id="pauseov"><div class="pausecard"><h2>⏸ 中场休息</h2><button class="bigbtn" id="resumeBtn">继续</button><button class="ghostbtn" id="quitBtn">重开一局</button></div></div>
<script>
'use strict';
const $=id=>document.getElementById(id);
/* ===== 音效 ===== */
let AC=null;
let soundOn=GameUI.storageGet('g100_mute')!=='1';
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return null;}}if(AC&&AC.state==='suspended'){AC.resume();}return AC;}
function tone(f,d,type,v,when){if(!soundOn)return;const a=ac();if(!a)return;try{const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.value=f;const t=a.currentTime+(when||0);g.gain.setValueAtTime(v||0.12,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.03);}catch(e){}}
const sClick=()=>tone(640,0.07,'square',0.07);
const sDeliver=()=>tone(523,0.12,'triangle',0.12);
const sStars=n=>{for(let i=0;i<n;i++)tone(784+i*196,0.16,'sine',0.13,i*0.12);};
const sLow=()=>{tone(220,0.2,'sawtooth',0.11);tone(165,0.25,'sawtooth',0.1,0.08);};
const sWin=()=>{[523,659,784,1047,1319].forEach((f,i)=>tone(f,0.16,'triangle',0.12,i*0.11));};
/* ===== 工具 ===== */
function toast(msg){const t=$('toast');t.textContent=msg;t.style.opacity='1';clearTimeout(t._tm);t._tm=setTimeout(()=>{t.style.opacity='0';},1300);}
function floatTxt(txt,color){const d=document.createElement('div');d.className='float';d.textContent=txt;d.style.color=color||'#ffcc80';d.style.left='50%';d.style.top='30%';document.body.appendChild(d);setTimeout(()=>d.remove(),1150);}
function buzz(ms){try{if(navigator.vibrate)navigator.vibrate(ms);}catch(e){}}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));$(id).classList.add('on');}
/* ===== 数据 ===== */
const WOODS=[{k:'oak',n:'橡木',s:'稳重可靠'},{k:'willow',n:'柳木',s:'轻盈灵巧'},{k:'ebony',n:'黑檀',s:'强力深邃'}];
const CORES=[{k:'unicorn',n:'独角兽毛',s:'纯净温和'},{k:'phoenix',n:'凤凰羽',s:'爆发澎湃'},{k:'dragon',n:'龙心弦',s:'强劲霸道'}];
const LENS=[{k:'short',n:'短',s:'灵活迅捷'},{k:'mid',n:'中',s:'均衡万能'},{k:'long',n:'长',s:'威力十足'}];
const ATTR_CN={wood:'木材',core:'杖芯',len:'长度'};
function attrName(attr,k){
  const pool=attr==='wood'?WOODS:attr==='core'?CORES:LENS;
  const f=pool.find(o=>o.k===k);
  return f?f.n:k;
}
const CUSTOMERS=[
  {ava:'🧙‍♀️',name:'决斗俱乐部的新生',req:'"我要<b>决斗</b>用的，要有劲儿的！"'},
  {ava:'🧚',name:'花园小精灵',req:'"轻一点的啦，人家手腕很细的…"'},
  {ava:'🧛',name:'夜行巫师',req:'"低调，越不显眼越好，但关键时刻得顶用。"'},
  {ava:'🧝',name:'草药课助教',req:'"每天挥几百次，手不能累，要顺手的。"'},
  {ava:'👩‍🎓',name:'占卜课学姐',req:'"要那种…有灵气、能跟我心意相通的！"'}
];
const HSKEY='g100_wandshop_hs';
/* ===== 状态 ===== */
let running=false,paused=false;
let ci=0,attempt=1,total=0;
let prefs=null,sel={wood:null,core:null,len:null};
let firstStars=0;
function best(){return parseInt(GameUI.storageGet(HSKEY)||'0',10);}
function saveBest(){if(total>best())GameUI.storageSet(HSKEY,String(total));}
function refreshBest(){$('best0').textContent=best();$('best1').textContent=best();}
function refreshHud(){$('cnum').textContent=Math.min(5,ci+1);$('score').textContent=total;}
function randPrefs(){
  return{
    wood:WOODS[Math.floor(Math.random()*3)].k,
    core:CORES[Math.floor(Math.random()*3)].k,
    len:LENS[Math.floor(Math.random()*3)].k
  };
}
/* ===== 界面 ===== */
function buildOpts(el,pool,attr){
  el.innerHTML='';
  pool.forEach(o=>{
    const b=document.createElement('button');
    b.className='opt';b.dataset.k=o.k;
    b.innerHTML=o.n+'<span class="sub">'+o.s+'</span>';
    b.addEventListener('click',()=>{
      if(!running||paused||locked())return;
      sClick();sel[attr]=o.k;
      el.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));
      b.classList.add('sel');
    });
    el.appendChild(b);
  });
}
function locked(){
  // 呈上后锁定选项，直到点击"调整魔杖"
  return $('retryBtn').style.display!=='none'||$('nextBtn').style.display!=='none';
}
function selName(){
  return attrName('wood',sel.wood)+' · '+attrName('core',sel.core)+' · '+attrName('len',sel.len);
}
function renderCustomer(){
  const c=CUSTOMERS[ci];
  $('prog').textContent='第 '+(ci+1)+' 位顾客 · '+c.name;
  $('ava').textContent=c.ava;
  $('req').innerHTML=c.req;
  $('fb').classList.remove('on');$('fb').innerHTML='';
  $('stars').innerHTML='';
  $('retryBtn').style.display='none';$('nextBtn').style.display='none';
  $('deliverBtn').style.display='';$('deliverBtn').textContent='呈上魔杖';
  buildOpts($('woods'),WOODS,'wood');
  buildOpts($('cores'),CORES,'core');
  buildOpts($('lens'),LENS,'len');
  prefs=randPrefs();
  sel={wood:null,core:null,len:null};
  attempt=1;firstStars=0;
  refreshHud();
}
function starHtml(n){
  let h='';
  for(let i=0;i<3;i++)h+='<span class="'+(i<n?'':'off')+'">★</span>';
  return h;
}
/* ===== 评价与反馈 ===== */
function matchCount(s){
  let m=0;
  if(s.wood===prefs.wood)m++;
  if(s.core===prefs.core)m++;
  if(s.len===prefs.len)m++;
  return m;
}
function feedback(stars){
  const wrong=[],right=[];
  ['wood','core','len'].forEach(a=>{
    if(sel[a]===prefs[a])right.push(a);else wrong.push(a);
  });
  if(stars===3){
    const praises=['"完美！这就是我梦中的魔杖！"','"天哪，你怎么知道我想要这个的？！"','"成交！以后我的魔杖只找你买！"'];
    return praises[Math.floor(Math.random()*praises.length)];
  }
  let fb='';
  const w=wrong[Math.floor(Math.random()*wrong.length)];
  fb+='"'+ATTR_CN[w]+'我不喜欢'+attrName(w,sel[w])+'！"';
  if(right.length>0&&Math.random()<0.6){
    const r=right[Math.floor(Math.random()*right.length)];
    fb+=' 不过'+ATTR_CN[r]+'选的'+attrName(r,sel[r])+'倒是正好。';
  }
  return fb;
}
function deliver(){
  if(!sel.wood||!sel.core||!sel.len){toast('先选好木材、杖芯和长度哦');return;}
  const m=matchCount(sel);
  const stars=Math.max(1,m); // 0命中也给1星安慰
  $('fb').classList.add('on');
  $('fb').innerHTML='🪄 你呈上：<b>'+selName()+'</b><br>💬 '+feedback(stars);
  $('stars').innerHTML=starHtml(stars);
  if(stars===3){sStars(3);buzz(80);floatTxt('⭐⭐⭐','#ffd76a');}
  else if(stars===2){sStars(2);floatTxt('⭐⭐','#ffcc80');}
  else{sLow();}
  if(attempt===1){
    firstStars=stars;
    if(stars===3){
      total+=3;refreshHud();
      $('deliverBtn').style.display='none';
      $('nextBtn').style.display='';
      toast('一次成交！+3 星');
    }else{
      $('deliverBtn').style.display='none';
      $('retryBtn').style.display='';
      toast('顾客给了 '+stars+' 星，再调整一次吧');
    }
  }else{
    total+=stars;refreshHud();
    $('deliverBtn').style.display='none';$('retryBtn').style.display='none';
    $('nextBtn').style.display='';
    if(stars>firstStars)toast('改进成功！+'+stars+' 星');
    else toast('最终 '+stars+' 星');
  }
}
/* ===== 流程 ===== */
function startGame(){
  running=true;paused=false;
  ci=0;total=0;
  $('pauseov').classList.remove('on');
  showScreen('s-game');
  renderCustomer();refreshBest();
  sClick();
}
function rating(){
  if(total>=15)return'🧙‍♂️ 传奇杖匠！满分！';
  if(total>=12)return'🏆 王牌店主！';
  if(total>=8)return'👍 合格店主，继续加油！';
  if(total>=5)return'🌱 见习店员，多听听顾客的心声吧';
  return'💤 还需进修…顾客们都摇摇头走了';
}
function endGame(){
  running=false;paused=false;
  const nb=total>best();
  saveBest();refreshBest();
  $('endTitle').textContent=nb?'🏆 新纪录！':'🏪 打烊啦';
  $('endDesc').innerHTML='5 位顾客共给了 <b style="color:#ffcc80;font-size:22px">'+total+'</b> / 15 星<br>'+rating();
  $('endStars').innerHTML=starHtml(Math.round(total/5));
  showScreen('s-end');
  if(nb)sWin();else sStars(Math.min(3,Math.max(1,Math.round(total/5))));
}
$('deliverBtn').addEventListener('click',()=>{if(!running||paused)return;deliver();});
$('retryBtn').addEventListener('click',()=>{
  if(!running||paused)return;
  sClick();attempt=2;
  $('retryBtn').style.display='none';
  $('deliverBtn').style.display='';$('deliverBtn').textContent='正式交付';
  $('fb').innerHTML+='<br>🧠 <i>（根据反馈调整组合，再交一次）</i>';
});
$('nextBtn').addEventListener('click',()=>{
  if(!running||paused)return;
  sClick();ci++;
  if(ci>=5){endGame();}else{renderCustomer();}
});
/* ===== 暂停/静音 ===== */
$('pauseBtn').addEventListener('click',()=>{
  if(!running||paused)return;
  paused=true;$('pauseov').classList.add('on');sClick();
});
$('resumeBtn').addEventListener('click',()=>{paused=false;$('pauseov').classList.remove('on');sClick();});
$('quitBtn').addEventListener('click',()=>{sClick();running=false;paused=false;$('pauseov').classList.remove('on');showScreen('s-start');refreshBest();});
function refreshSnd(){$('sndBtn').textContent=soundOn?'🔊':'🔇';}
$('sndBtn').addEventListener('click',()=>{soundOn=!soundOn;GameUI.storageSet('g100_mute',soundOn?'0':'1');refreshSnd();if(soundOn)sClick();});
$('startBtn').addEventListener('click',startGame);
$('againBtn').addEventListener('click',startGame);
refreshSnd();refreshBest();
</script>
<script>GameUI.autoPause();</script>
</body>
</html>
