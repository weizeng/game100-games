 const hp=50+round*10+(boss?boss.hp:0);const S=compile(bag,-1,hp);if(boss){S.boss=round;if(boss.arm)S.arm+=boss.arm;}S.bag=bag;S.name=boss?boss.n:['哥布林','史莱姆','强盗','狼人','食人魔','暗精灵','巨魔','石像鬼','女妖','邪教徒','牛头人','死灵法师'][(round*7)%12];S.e=boss?boss.e:['👺','🟢','🥷','🐺','👹','🧝‍♀️','🧌','🗿','👻','🦹','🐂','☠️'][(round*7)%12];return S;}
function startFight(){if(state!=='shop')return;const me=compile(R.bag,R.hero,R.hpBase+R.round*10);me.name='你';me.e=HEROES[R.hero].e;const en=enemyFor(R.round);B={me,en,t:0,bossT:0,log:[],done:false};pick=null;state='fight';hud();tone(330,.15,'square',.08);tone(440,.15,'square',.08,null,.12);
 if(FAST){while(!B.done)simStep(.05);}}
function dmgTo(S,amt,magic,src){if(!magic){amt=Math.max(1,amt-S.flat);if(S.blk&&Math.random()<S.blk)amt=Math.max(0,amt-4);const a=Math.min(S.arm,amt);S.arm-=a;amt-=a;}S.hp-=amt;return amt;}
function simStep(dt){const{me,en}=B;B.t+=dt;
 for(const[A,D]of[[me,en],[en,me]]){if(A.stun>0){A.stun-=dt;continue;}
  for(const u of A.items){if(u.sealed>0){u.sealed-=dt;continue;}u.t+=dt*(1-Math.min(.4,A.chill*.04));if(u.t<u.cd)continue;u.t-=u.cd;
   if(u.heal){A.hp=Math.min(A.max,A.hp+u.heal);if(!FAST)floats.push({x:A===me?90:270,y:200,t:'+'+u.heal,c:'#80ed99',a:1});continue;}
   let d=u.dmg[0]+Math.floor(Math.random()*(u.dmg[1]-u.dmg[0]+1));const cr=Math.random()<u.crit;if(cr)d*=2;if(A.rage&&A.hp<A.max/2)d=Math.round(d*1.3);
   const dealt=dmgTo(D,d,u.magic);if(u.steal)A.hp=Math.min(A.max,A.hp+dealt*u.steal);D.burn+=u.burn;D.poison+=u.poison;if(u.chill)D.chill=Math.min(10,D.chill+u.chill);if(u.stunC&&Math.random()<u.stunC)D.stun=.6;
   if(!FAST){floats.push({x:A===me?270:90,y:190,t:(cr?'💥':'')+d,c:cr?'#ffd34d':'#fff',a:1});burst(sparks,A===me?270:90,180,cr?'#ffd34d':'#ff5c8a',5);tone(cr?880:300+Math.random()*100,.05,'square',.05);}}}
 // 持续伤害
 for(const S of[me,en]){S.dotT=(S.dotT||0)+dt;if(S.dotT>=1){S.dotT-=1;if(S.burn){S.hp-=S.burn;S.burn=Math.max(0,S.burn-1);}if(S.poison){S.hp-=S.poison;}}
  if(S.pots.length&&S.hp<S.max*.4&&S.hp>0){S.hp+=S.pots.pop();if(!FAST)tone(1000,.1,'triangle');}}
 // 首领技能
 if(en.boss){B.bossT+=dt;const iv=en.boss===15?5:4;if(B.bossT>=iv){B.bossT-=iv;if(en.boss===5)en.arm+=6;if(en.boss===10){me.burn+=2;if(!FAST)burst(sparks,90,180,'#ff7b00',14);}if(en.boss===15&&me.items.length){me.items[Math.floor(Math.random()*me.items.length)].sealed=2;}}}
 // 疲劳
 if(B.t>20){const f=(B.t-20)*dt*1.5;me.hp-=f;en.hp-=f;}
 if(me.hp<=0||en.hp<=0){B.done=true;B.win=en.hp<=0&&me.hp>0||(me.hp>0)||(me.hp<=0&&en.hp<=0&&me.hp>=en.hp);endFight();}}
function endFight(){const win=B.win;const boss=!!BOSS[R.round];let msg;
 if(win){R.won++;const g=5+Math.floor(R.round/2)+(boss?5:0);R.gold+=g;msg='胜利！+'+g+'🪙';tone(660,.1,'triangle');tone(990,.2,'triangle',.1,null,.1);for(let i=0;i<20;i++)burst(sparks,270,190,'#ffd34d',2);}
 else{R.life--;R.gold+=4;msg='失败… 失去 1 条命（+4🪙 安慰金）';tone(200,.4,'sawtooth',.1,70);}
 R.gold+=R.bag.filter(it=>it.k==='piggy').length+Math.min(3,Math.floor(R.gold/10));
 if(R.round>save.best){save.best=R.round;}Store.set('save',save);legacyBest(save.best*100+R.won);
 const finalWin=win&&R.round===15;
 const go=()=>{if(finalWin){save.wins=(save.wins||0)+1;Store.set('save',save);state='over';$('overH').textContent='🏆 击败虚空巫妖！';$('finalScore').textContent=R.won+' 胜';$('overText').innerHTML='15 回合全部打完，赢下 '+R.won+' 场。<br>英雄 '+HEROES[R.hero].n+' 登顶！最佳纪录：第 '+save.best+' 回合 · 通关 '+save.wins+' 次';$('nextBtn').classList.add('hidden');show('overScr',true);return;}
  if(R.life<=0){state='over';$('overH').textContent='💀 冒险结束';$('finalScore').textContent='第 '+R.round+' 回合';$('overText').innerHTML='赢下 '+R.won+' 场 · 最佳：第 '+save.best+' 回合<br>提示：把磨刀石、火焰宝石等摆在武器旁边；沙漏能让相邻武器更快出手。';$('nextBtn').classList.add('hidden');show('overScr',true);return;}
  if(!(R.round===15&&!win))R.round++;else msg+=' · 再次挑战虚空巫妖！';state='shop';rollShop(true);B=null;toast(msg+(BOSS[R.round]?' · 下一回合首领：'+BOSS[R.round].n:''),2200);hud();};
 B.msg=msg;B.go=go;}

  if(fits(R.bag,x,y,pick.w,pick.h,ign)){if(pick.shop!=null){const s=R.shop[pick.shop];const c=price(s);if(R.gold<c){toast('金币不足');tone(180,.1,'square');return;}R.gold-=c;R.bag.push({k:s.k,x,y,w:pick.w,h:pick.h});R.shop[pick.shop]=null;tone(990,.06,'triangle');tone(1320,.08,'triangle',.08,null,.05);}
   else{pick.it.x=x;pick.it.y=y;pick.it.w=pick.w;pick.it.h=pick.h;tone(800,.05,'triangle');}burst(sparks,GX+(x+pick.w/2)*CS,GY+(y+pick.h/2)*CS,'#c77dff',10);pick=null;hud();return;}
  if(at&&pick.it!==at){pick={it:at,k:at.k,w:at.w,h:at.h};hud();return;}toast('放不下：换个位置或旋转');tone(180,.08,'square',.05);return;}
 if(at){pick={it:at,k:at.k,w:at.w,h:at.h};tone(700,.04,'triangle');hud();}});
$('rotBtn').onclick=()=>{if(!pick)return toast('先选中一件物品');[pick.w,pick.h]=[pick.h,pick.w];tone(650,.05);hud();};
$('sellBtn').onclick=()=>{if(!pick||!pick.it)return toast('先点背包里的物品再出售');R.gold+=Math.max(1,Math.floor(IT[pick.it.k].c/2));R.bag.splice(R.bag.indexOf(pick.it),1);pick=null;tone(400,.08);hud();};
$('rollBtn').onclick=()=>{if(state==='shop')rollShop(false);};
$('fightBtn').onclick=()=>{if(state==='shop')startFight();else if(state==='fight'&&B){if(!B.done){const f=FAST;FAST=true;while(!B.done)simStep(.05);FAST=f;}if(B&&B.go){const g=B.go;B.go=null;g();}}};
function hud(){if(!R)return;$('rdT').textContent=R.round+'/15';$('lifeT').textContent=R.life;$('score').textContent=R.gold;
 $('fightBtn').innerHTML=state==='fight'?(B&&B.done?'继续':'跳过')+'<small>&nbsp;</small>':'开战！<small>'+(BOSS[R.round]?'首领 '+BOSS[R.round].n:'第 '+R.round+' 回合')+'</small>';
 $('sellBtn').innerHTML='出售<small>'+(pick&&pick.it?'+'+Math.max(1,Math.floor(IT[pick.it.k].c/2))+'🪙':'&nbsp;')+'</small>';$('rollBtn').disabled=state!=='shop'||R.gold<1;}
// ---------- 绘制 ----------
const TYC={wpn:'#e85d75',def:'#4895ef',heal:'#52b788',gem:'#b5179e',misc:'#f4a261'};
function drawItem(k,x,y,w,h,ghost){const I=IT[k];shad(ctx,x+w/2,y+h-2,w*.4,5,.35);box3d(ctx,x+3,y+3,w-6,h-6,TYC[I.ty],10);emo(ctx,I.e,x+w/2,y+h/2-2,Math.min(w,h)*.5);if(ghost){ctx.fillStyle='rgba(255,255,255,.25)';rr(ctx,x+3,y+3,w-6,h-6,10);ctx.fill();}}
function render(dt){stage(ctx,W,H,'#3c1e6e','#120826');if(!R)return;
 if(state==='fight'&&B)return renderFight(dt);
 // 背包
 box3d(ctx,GX-10,GY-10,GC*CS+20,GR*CS+20,'#8d5524',16);
 for(let y=0;y<GR;y++)for(let x=0;x<GC;x++){ctx.fillStyle='rgba(40,20,10,.45)';rr(ctx,GX+x*CS+2,GY+y*CS+2,CS-4,CS-4,8);ctx.fill();}
 // 相邻加成连线
 for(const it of R.bag){const I=IT[it.k];if(!I.adj)continue;for(const o of adjOf(R.bag,it)){const O=IT[o.k];if(O.ty==='wpn'||(I.adj.crit||I.adj.haste)&&(O.ty==='wpn'||O.heal)){ctx.strokeStyle='rgba(255,215,0,.7)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(GX+(it.x+it.w/2)*CS,GY+(it.y+it.h/2)*CS);ctx.lineTo(GX+(o.x+o.w/2)*CS,GY+(o.y+o.h/2)*CS);ctx.stroke();}}}
 for(const it of R.bag){if(pick&&pick.it===it)continue;drawItem(it.k,GX+it.x*CS,GY+it.y*CS,it.w*CS,it.h*CS);}
 if(pick&&pick.it){const it=pick.it;ctx.globalAlpha=.85;drawItem(it.k,GX+it.x*CS,GY+it.y*CS,pick.w*CS,pick.h*CS,true);ctx.globalAlpha=1;ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.setLineDash([5,4]);rr(ctx,GX+it.x*CS+2,GY+it.y*CS+2,pick.w*CS-4,pick.h*CS-4,10);ctx.stroke();ctx.setLineDash([]);}
 // 标题
 otxt(ctx,HEROES[R.hero].e+' '+HEROES[R.hero].n+' · 生命 '+(R.hpBase+R.round*10),W/2,22,14,'#fff');
 otxt(ctx,BOSS[R.round]?'⚠️ 首领 '+BOSS[R.round].e+BOSS[R.round].n+'：'+BOSS[R.round].t:'整理背包，然后点「开战」',W/2,GY+GR*CS+26,BOSS[R.round]?11:12,BOSS[R.round]?'#ffb3c1':'#e0d4ff');
 // 商店
 otxt(ctx,'🛒 商店',30,SY-14,13,'#ffd34d');
 for(let i=0;i<5;i++){const r=shopRect(i),s=R.shop[i];ctx.fillStyle='rgba(255,255,255,.07)';rr(ctx,r.x,r.y,r.w,r.h,10);ctx.fill();if(!s)continue;const I=IT[s.k];
  drawItem(s.k,r.x+6,r.y+2,r.w-12,r.w-12);box3d(ctx,r.x+10,r.y+r.h-24,r.w-20,22,R.gold>=price(s)?'#ffd166':'#6c757d',8);txt(ctx,price(s)+'🪙'+(s.sale?'↓':''),r.x+r.w/2,r.y+r.h-13,12,'#3a2400','center',900);
  if(pick&&pick.shop===i){ctx.strokeStyle='#ff3d9a';ctx.lineWidth=3;rr(ctx,r.x,r.y,r.w,r.h,10);ctx.stroke();}}
 // 说明
 const k=pick?pick.k:null;ctx.fillStyle='rgba(0,0,0,.35)';rr(ctx,8,SY+92,W-16,54,10);ctx.fill();
 if(k){const I=IT[k];otxt(ctx,I.e+' '+I.n+(I.d?'  伤害 '+I.d[0]+'-'+I.d[1]+' · 冷却 '+I.cd+'s':''),W/2,SY+108,13,'#fff');txt(ctx,I.t+(pick.shop!=null?' · 点背包空格购买放置':' · 点空格移动'),W/2,SY+130,11,'#e0d4ff');}
 else txt(ctx,'点商店物品查看并购买；相邻的宝石会强化武器（金线）',W/2,SY+118,11,'#e0d4ff');
 drawBurst(ctx,sparks);}
function fighter(S,x,flip){shad(ctx,x,250,40,8,.4);emo(ctx,S.e,x,200,64);const hp=Math.max(0,S.hp);ctx.fillStyle='rgba(0,0,0,.5)';rr(ctx,x-60,110,120,14,7);ctx.fill();ctx.fillStyle=S===B.me?'#52b788':'#e85d75';rr(ctx,x-60,110,Math.max(4,120*hp/S.max),14,7);ctx.fill();
 otxt(ctx,Math.ceil(hp)+' / '+S.max,x,117,11,'#fff');otxt(ctx,S.name,x,92,14,'#fff');let s=[];if(S.arm>0)s.push('🛡'+Math.round(S.arm));if(S.burn)s.push('🔥'+S.burn);if(S.poison)s.push('☠️'+S.poison);if(S.stun>0)s.push('💫');txt(ctx,s.join(' '),x,136,12,'#fff');
 // 物品冷却
 S.items.forEach((u,i)=>{const ix=x-60+(i%4)*32,iy=280+Math.floor(i/4)*36;box3d(ctx,ix,iy,28,28,u.sealed>0?'#444':TYC[IT[u.k].ty],7);emo(ctx,IT[u.k].e,ix+14,iy+14,16);ctx.fillStyle='rgba(255,255,255,.85)';ctx.fillRect(ix+2,iy+29,24*Math.min(1,u.t/u.cd),3);});}
function renderFight(dt){if(!FAST&&!B.done){for(let k=0;k<2;k++)if(!B.done)simStep(dt/2);}
 fighter(B.me,90);fighter(B.en,270);otxt(ctx,'VS',W/2,200,26,'#ffd34d');otxt(ctx,'⏱ '+B.t.toFixed(1)+'s'+(B.t>20?' · 疲劳！':''),W/2,40,13,B.t>20?'#ff6b6b':'#fff');
 for(let i=floats.length-1;i>=0;i--){const f=floats[i];f.y-=30*dt;f.a-=dt*1.2;if(f.a<=0){floats.splice(i,1);continue;}ctx.globalAlpha=Math.max(0,f.a);otxt(ctx,f.t,f.x,f.y,16,f.c);ctx.globalAlpha=1;}
 if(B.done){box3d(ctx,40,420,W-80,70,B.win?'#2a9d8f':'#9d0208',14);otxt(ctx,B.msg||'',W/2,446,15,'#fff');otxt(ctx,'点击画面继续',W/2,472,12,'#ffe8a3');}
