<style>

@media(max-height:650px){.game-ui .ui-panel{padding:18px;gap:12px}.game-ui .ui-emblem{width:60px;height:60px;font-size:32px}.game-ui .ui-panel h1{font-size:25px}.game-ui .ui-panel :is(p,.howto,.sub,.rule){font-size:13px}}

<script>
// Installed before the original game script; embedded so downloaded ZIPs remain offline capable.
(function () {
  'use strict';
  var config = {"id":"columns","name":"宝石列柱","theme":"arcade","icon":"💎","challenge":"宝石增加到 7 种，初始下落速度更快"};
  var mode = 'classic';
  try { mode = sessionStorage.getItem('game100-mode-' + config.id) || mode; } catch (_) {}
  var expert = mode === 'expert';
  var used = { hint: 0, undo: 0 };
  var limits = { hint: 1, undo: 3 };
  function storageKey(key) { return expert && !/sound|mute/i.test(key) ? 'expert:' + key : key; }
  window.GameUI = {
    expert: expert,
    pick: function (classic, advanced) { return expert ? advanced : classic; },
    storageGet: function (key) { return localStorage.getItem(storageKey(key)); },
    storageSet: function (key, value) { localStorage.setItem(storageKey(key), value); },
    storageRemove: function (key) { localStorage.removeItem(storageKey(key)); }
  };
  var root = document.documentElement;
  root.classList.add('game-ui');
  root.dataset.theme = config.theme;
  root.dataset.game = config.id;
  root.dataset.mode = mode;
  var gesture = new WeakMap();
  function labelButtons(scope) {
    scope.querySelectorAll('button').forEach(function (button) {
      if (button.getAttribute('aria-label')) return;
      var id = button.id.toLowerCase(), text = button.textContent.trim();
      var name = /mute|sound|snd/.test(id) ? '切换音效' : /pause/.test(id) ? '暂停游戏' : /hint/.test(id) && !/close|ok/.test(id) ? '查看提示' : '';
      if (!name && /^[⏸🔊🔇💡Ⅱ]+$/u.test(text)) name = { '⏸': '暂停游戏', '🔊': '切换音效', '🔇': '切换音效', '💡': '查看提示' }[text];
      if (name) button.setAttribute('aria-label', name);
    });
  }
  function decorate(container) {
    if (container.querySelector(':scope > .ui-panel') || !container.querySelector('h1,h2,.gamename')) return;
    if (container.matches('.screen') && container.querySelector('canvas:not(#fx)')) return;
    var panel = document.createElement('div');
    panel.className = 'ui-panel';
    while (container.firstChild) panel.appendChild(container.firstChild);
    container.appendChild(panel);
    var heading = panel.querySelector('h1,h2,.gamename');
    var start = /start|menu|ready/i.test(container.id) || !!panel.querySelector('#startBtn,#btnStart,.startbtn');
    if (start) {
      var headings = panel.querySelectorAll('h1,h2,.gamename');
      if (headings.length > 1 && !/[A-Za-z0-9\u4e00-\u9fff]/.test(heading.textContent)) { heading.remove(); heading = headings[1]; }
      var oldIcon = panel.querySelector('.bigemoji,.ic');
      if (oldIcon) oldIcon.remove();
      var emblem = document.createElement('div');
      emblem.className = 'ui-emblem'; emblem.textContent = config.icon; emblem.setAttribute('aria-hidden', 'true');
      panel.insertBefore(emblem, panel.firstChild);
      heading.textContent = config.name;
      var switcher = document.createElement('div'); switcher.className = 'ui-mode'; switcher.setAttribute('role', 'group'); switcher.setAttribute('aria-label', '选择玩法模式');
      [['classic','经典模式'],['expert','进阶挑战']].forEach(function (item) {
        var b = document.createElement('button'); b.type = 'button'; b.textContent = item[1]; b.dataset.mode = item[0]; b.setAttribute('aria-pressed', String(mode === item[0]));
        b.addEventListener('click', function () {
          if (mode === item[0]) return;
          try { sessionStorage.setItem('game100-mode-' + config.id, item[0]); location.reload(); }
          catch (_) { b.textContent = '浏览器未允许保存模式'; }
        });
        switcher.appendChild(b);
      });
      var primary = panel.querySelector('#startBtn,#btnStart,.startbtn,button');
      var anchor = primary;
      while (anchor && anchor.parentNode !== panel && !anchor.parentNode.matches('.card,.panel,.pausecard,.ovcard')) anchor = anchor.parentNode;
      var target = anchor ? anchor.parentNode : panel;
      target.insertBefore(switcher, anchor || null);
      var note = document.createElement('p'); note.className = 'ui-mode-note';
      note.textContent = expert ? config.challenge + '。进阶纪录单独保存。' : '按原规则轻松开局，也可切换进阶挑战。';
      target.insertBefore(note, anchor || null);
    }
    labelButtons(panel);
  }
  function notify(text) {
    var el = document.getElementById('ui-assist-toast');
    if (!el) { el = document.createElement('div'); el.id = 'ui-assist-toast'; el.className = 'ui-mode-status'; el.setAttribute('role', 'status'); el.style.cssText = 'position:fixed;bottom:18px;left:16px;right:16px;z-index:200;padding:14px'; document.body.appendChild(el); }
    el.textContent = text; el.hidden = false;
    clearTimeout(notify.timer); notify.timer = setTimeout(function () { el.hidden = true; }, 2000);
  }
  function assistEvent(event) {
    if (!expert) return;
    var b = event.target.closest('button'); if (!b || b.closest('.ui-mode')) return;
    var kind = /^(hintBtn|hintTopBtn|btnHint)$/i.test(b.id) ? 'hint' : /^(undoBtn|undoTopBtn|btnUndo)$/i.test(b.id) || /悔一步|撤销/.test(b.textContent) ? 'undo' : '';
    if (!kind) return;
    var prev = gesture.get(b), blocked;
    if (event.type === 'click' && prev && performance.now() - prev.at < 1000) blocked = prev.blocked;
    else { blocked = used[kind] >= limits[kind]; if (!blocked) used[kind]++; gesture.set(b, { at: performance.now(), blocked: blocked }); }
    if (blocked) { event.preventDefault(); event.stopImmediatePropagation(); notify(kind === 'hint' ? '本次挑战的 1 次提示已用完' : '本次挑战的 3 次撤销已用完'); }
  }
  document.addEventListener('pointerdown', assistEvent, true);
  document.addEventListener('click', assistEvent, true);
  document.addEventListener('click', function (event) {
    var b = event.target.closest('button');
    if (b && /^(startBtn|btnStart|restartBtn|againBtn|retryBtn|btnAgain|btnRestart|playAgain)$/i.test(b.id)) used = { hint: 0, undo: 0 };
  }, true);
  document.addEventListener('DOMContentLoaded', function () {
    var selector = '.overlay,.ov,#ov,#overlay,#pauseOv,.screen';
    document.querySelectorAll(selector).forEach(function (container) {
      decorate(container);
      // Only dynamic overlay children are observed; animated scores never trigger this work.
      new MutationObserver(function () { decorate(container); }).observe(container, { childList: true });
    });
    labelButtons(document);
  });
}());

</script>
<!-- GAME UI END -->
</head><body>
<main class="wrap">
<header class="topbar"><div><span class="edition">经典游乐场</span><h1>宝石列柱</h1></div><div class="tools"><button id="soundBtn" class="iconbtn" aria-label="切换音效">♪</button><button id="pauseBtn" class="iconbtn" aria-label="暂停游戏" disabled>Ⅱ</button></div></header>
<div class="stats"><div><span>得分</span><b id="scoreV">0</b></div><div><span>最佳纪录</span><b id="bestV">0</b></div><div><span id="extraLabel">等级</span><b id="extraV">—</b></div></div>
<p id="status" class="status" role="status">换个顺序，落下一整串连锁。</p>
<div class="stage columns-frame"><canvas id="cv" width="240" height="520" tabindex="0" aria-label="六列十三行宝石列柱棋盘"></canvas><aside><p>下一组</p><div id="nextGems"></div><p>已消除</p><b id="clearedV">0</b><p id="chainV">等待连锁</p></aside></div>
<div class="controls"><button id="leftBtn" aria-label="向左移动">←</button><button id="rotateBtn">换色</button><button id="downBtn" aria-label="加速下落">↓</button><button id="rightBtn" aria-label="向右移动">→</button><button id="hardBtn">直落</button></div>
<p class="hint">← → 移动 · ↑ 换色 · ↓ 加速 · 空格直落；也可点按 / 滑动棋盘</p>
</main>
<section id="startScreen" class="overlay"><h2>宝石列柱</h2><p>每次落下一列三颗宝石。左右移动，换色调整三颗的顺序；横、竖或斜向至少三颗同色就会消除。消除后的宝石继续下落，可触发连锁。堆到顶端则结束。</p><button id="startBtn" class="btn">开始游戏</button></section>
<section id="pauseScreen" class="overlay hidden"><h2>休息一下</h2><p>进度已暂停，准备好再继续。</p><button id="resumeBtn" class="btn">继续游戏</button><button id="restartBtn" class="ghost">重新开始</button></section>
<section id="endScreen" class="overlay hidden"><h2 id="endTitle">本局结束</h2><p id="endText"></p><button id="againBtn" class="btn">再玩一局</button><button id="menuBtn" class="ghost">返回菜单</button></section>

<script>
const GAME_ID="columns";
const $ = id => document.getElementById(id);
const expert = GameUI.expert;
const ui = {
  running:false, paused:false, score:0, best:0, sound:true, audio:null,
  init() {
    try { this.best = Number(GameUI.storageGet('classic-best-'+GAME_ID)) || 0; this.sound = GameUI.storageGet('g100_sound') !== '0'; } catch (_) {}
    this.hud();
    $('soundBtn').textContent = this.sound ? '♪' : '♩';
    $('soundBtn').setAttribute('aria-pressed',String(this.sound));
    $('startBtn').onclick = $('againBtn').onclick = $('restartBtn').onclick = () => this.start();
    $('pauseBtn').onclick = () => this.pause(true);
    $('resumeBtn').onclick = () => this.pause(false);
    $('menuBtn').onclick = () => { this.running=false; this.hideScreens(); $('startScreen').classList.remove('hidden'); $('pauseBtn').disabled=true; };
    $('soundBtn').onclick = () => { this.sound=!this.sound; $('soundBtn').textContent=this.sound?'♪':'♩'; $('soundBtn').setAttribute('aria-pressed',String(this.sound)); try { GameUI.storageSet('g100_sound',this.sound?'1':'0'); } catch (_) {} this.tone(); };
    document.addEventListener('visibilitychange', () => { if(document.hidden && this.running && !this.paused) this.pause(true); });
    window.addEventListener('keydown', e => {
      if (e.key === 'Escape' && this.running) { e.preventDefault(); this.pause(!this.paused); return; }
      if (this.running && !this.paused && game.key) game.key(e);
    });
    game.preview?.();
  },
  hideScreens() { document.querySelectorAll('.overlay').forEach(el=>el.classList.add('hidden')); },
  start() { this.hideScreens(); this.running=true; this.paused=false; this.score=0; $('pauseBtn').disabled=false; this.hud(); this.tone(); game.start(); },
  pause(on) { if(!this.running || game.locked) return; this.paused=on; $('pauseScreen').classList.toggle('hidden',!on); if(!on) this.tone(); game.cancelHold?.(); },
  hud(extra) { $('scoreV').textContent=this.score; $('bestV').textContent=this.best; if(extra!==undefined) $('extraV').textContent=extra; },
  say(text) { $('status').textContent=text; },
  add(points) { this.score+=points; this.hud(); $('scoreV').classList.remove('result-flash'); requestAnimationFrame(()=>$('scoreV').classList.add('result-flash')); },
  save() { if(this.score>this.best) { this.best=this.score; try { GameUI.storageSet('classic-best-'+GAME_ID,String(this.best)); } catch (_) {} this.hud(); } },
  finish(title, text) { if(!this.running) return; this.running=false; this.paused=false; this.save(); $('pauseBtn').disabled=true; this.hideScreens(); $('endTitle').textContent=title; $('endText').textContent=text+' · 本局 '+this.score+' 分'; $('endScreen').classList.remove('hidden'); game.cancelHold?.(); this.tone(520); },
  active() { return this.running && !this.paused; },
  tone(frequency=360) { if(!this.sound) return; try { if(!this.audio) this.audio=new (window.AudioContext||window.webkitAudioContext)(); this.audio.resume().catch(()=>{}); const o=this.audio.createOscillator(),g=this.audio.createGain(); o.type='sine'; o.frequency.value=frequency; g.gain.setValueAtTime(.035,this.audio.currentTime); g.gain.exponentialRampToValueAtTime(.001,this.audio.currentTime+.08); o.connect(g);g.connect(this.audio.destination);o.start();o.stop(this.audio.currentTime+.09); } catch (_) {} }
};


const gemColors=['#e35c79','#63b9ed','#65c596','#d5ad5d','#a890e2','#e58c5f','#69c7cb'];
const gemMarks=['●','◆','▲','★','■','✚','✦'];
const game={
  board:Array.from({length:13},()=>Array(6).fill(0)),piece:null,next:[],cleared:0,level:1,elapsed:0,last:0,holdTimer:null,holdDelay:null,
  random(){return 1+Math.floor(Math.random()*(expert?7:6));},
  trio(){return [this.random(),this.random(),this.random()];},
  start(){this.cancelHold();this.board=Array.from({length:13},()=>Array(6).fill(0));this.cleared=0;this.level=1;this.elapsed=0;this.next=this.trio();$('chainV').textContent='等待连锁';this.spawn();ui.say('三颗成列，横、竖、斜向三连都能消除。');this.render();},
  preview(){this.render();},
  valid(x,y,colors=this.piece?.colors){return !!colors&&colors.every((_,i)=>x>=0&&x<6&&y+i<13&&(y+i<0||!this.board[y+i][x]));},
  spawn(){this.piece={x:2,y:-2,colors:this.next};this.next=this.trio();this.elapsed=0;if(!this.valid(2,-2))ui.finish('宝石堆到顶端了','试着沿斜线留出连锁空间');},
  matches(b=this.board){
    const found=new Set();for(let r=0;r<13;r++)for(let c=0;c<6;c++)if(b[r][c])for(const [dy,dx] of [[0,1],[1,0],[1,1],[1,-1]]){let cells=[],y=r,x=c;while(y>=0&&y<13&&x>=0&&x<6&&b[y][x]===b[r][c]){cells.push(y*6+x);y+=dy;x+=dx;}if(cells.length>=3)cells.forEach(i=>found.add(i));}return [...found];
  },
  gravity(){for(let c=0;c<6;c++){const values=this.board.map(row=>row[c]).filter(Boolean);for(let r=12;r>=0;r--)this.board[r][c]=values.pop()||0;}},
  resolve(){let chain=0,total=0;while(true){const cells=this.matches();if(!cells.length)break;chain++;total+=cells.length;cells.forEach(i=>this.board[Math.floor(i/6)][i%6]=0);this.gravity();ui.add(cells.length*10*chain);}this.cleared+=total;this.level=1+Math.floor(this.cleared/24);if(chain){$('chainV').textContent=chain+' 连锁！';ui.say('消除 '+total+' 颗宝石，打出 '+chain+' 连锁！');ui.tone(520+chain*70);}return {chain,total};},
  lock(){if(!this.piece)return;if(this.piece.y<0){ui.finish('没有落脚空间了','三颗宝石需要完整进入棋盘');return;}this.piece.colors.forEach((v,k)=>this.board[this.piece.y+k][this.piece.x]=v);this.resolve();this.spawn();this.render();},
  move(dx){if(!ui.active()||!this.piece)return;if(this.valid(this.piece.x+dx,this.piece.y)){this.piece.x+=dx;this.render();}},
  rotate(){if(!ui.active()||!this.piece)return;this.piece.colors=[this.piece.colors[2],this.piece.colors[0],this.piece.colors[1]];ui.tone(410);this.render();},
  down(soft=false){if(!ui.active()||!this.piece)return;if(this.valid(this.piece.x,this.piece.y+1)){this.piece.y++;if(soft)ui.add(1);}else this.lock();this.render();},
  hard(){if(!ui.active()||!this.piece)return;let distance=0;while(this.valid(this.piece.x,this.piece.y+1)){this.piece.y++;distance++;}ui.add(distance*2);this.lock();ui.tone(260);},
  render(){
    const ctx=$('cv').getContext('2d');ctx.fillStyle='#142438';ctx.fillRect(0,0,240,520);ctx.strokeStyle='#294056';ctx.lineWidth=1;for(let r=0;r<=13;r++){ctx.beginPath();ctx.moveTo(0,r*40);ctx.lineTo(240,r*40);ctx.stroke();}for(let c=0;c<=6;c++){ctx.beginPath();ctx.moveTo(c*40,0);ctx.lineTo(c*40,520);ctx.stroke();}
    const gem=(r,c,v,alpha=1)=>{if(r<0||r>=13)return;ctx.globalAlpha=alpha;ctx.fillStyle=gemColors[v-1];ctx.beginPath();ctx.roundRect(c*40+4,r*40+4,32,32,7);ctx.fill();ctx.fillStyle='#ffffff30';ctx.fillRect(c*40+9,r*40+7,22,3);ctx.fillStyle='#fff';ctx.font='bold 20px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(gemMarks[v-1],c*40+20,r*40+21);ctx.globalAlpha=1;};
    this.board.forEach((row,r)=>row.forEach((v,c)=>{if(v)gem(r,c,v);}));
    if(this.piece&&ui.running){let landing=this.piece.y;while(this.valid(this.piece.x,landing+1))landing++;this.piece.colors.forEach((v,i)=>gem(landing+i,this.piece.x,v,.18));this.piece.colors.forEach((v,i)=>gem(this.piece.y+i,this.piece.x,v));}
    $('nextGems').replaceChildren();for(const v of this.next){const s=document.createElement('span');s.className='next-gem';s.style.background=gemColors[v-1];s.textContent=gemMarks[v-1];$('nextGems').append(s);}$('clearedV').textContent=this.cleared;ui.hud(this.level);
  },
  tick(t){const dt=this.last?Math.min(100,t-this.last):0;this.last=t;if(ui.active()){this.elapsed+=dt;const interval=Math.max(130,(expert?590:820)-(this.level-1)*55);if(this.elapsed>=interval){this.elapsed=0;this.down();}}requestAnimationFrame(t=>this.tick(t));},
  cancelHold(){clearTimeout(this.holdDelay);clearInterval(this.holdTimer);},
  key(e){const actions={ArrowLeft:()=>this.move(-1),ArrowRight:()=>this.move(1),ArrowDown:()=>this.down(true),ArrowUp:()=>this.rotate(),' ':()=>this.hard()};if(actions[e.key]){e.preventDefault();actions[e.key]();}}
};
for(const [id,action]of [['leftBtn',()=>game.move(-1)],['rightBtn',()=>game.move(1)],['downBtn',()=>game.down(true)]]){const b=$(id);b.onpointerdown=e=>{e.preventDefault();if(!ui.active())return;b.setPointerCapture(e.pointerId);game.cancelHold();action();game.holdDelay=setTimeout(()=>game.holdTimer=setInterval(action,90),240);};b.onpointerup=b.onpointercancel=()=>game.cancelHold();b.onclick=e=>{if(e.detail===0)action();};}
$('rotateBtn').onclick=()=>game.rotate();$('hardBtn').onclick=()=>game.hard();
let touch=null;$('cv').onpointerdown=e=>{e.preventDefault();touch={x:e.clientX,y:e.clientY};$('cv').setPointerCapture(e.pointerId);};$('cv').onpointercancel=()=>touch=null;$('cv').onpointerup=e=>{if(!touch)return;const dx=e.clientX-touch.x,dy=e.clientY-touch.y;touch=null;if(Math.abs(dy)>35&&dy>Math.abs(dx))game.hard();else if(Math.abs(dx)>20)game.move(dx>0?1:-1);else game.rotate();};
requestAnimationFrame(t=>game.tick(t));

ui.init();
</script></body></html>
