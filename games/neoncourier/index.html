<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{display:flex;justify-content:center;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.wrap{width:100%;max-width:480px;height:100%;padding:12px;display:flex;flex-direction:column;align-items:center;gap:10px}
.topbar{width:100%;display:flex;justify-content:space-between;align-items:center;flex-wrap:nowrap!important}

.stagebox{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
#cv{touch-action:none;display:block}

.overlay.hidden{display:none!important}
.lvgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:100%}
.lvgrid .lvl{min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:17px;padding:4px!important;line-height:1.1}
.lvgrid .lvl small{font-size:10px;letter-spacing:-1px;margin-top:2px}
.rowbtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:100%}
#tutStep{font-size:12px;opacity:.7}
#toast{position:fixed;left:50%;top:16%;transform:translate(-50%,-10px);background:rgba(10,8,30,.88);color:#fff;font-weight:800;padding:10px 18px;border-radius:999px;z-index:999;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;font-size:15px;box-shadow:0 0 18px rgba(255,61,154,.5);white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
.hidden{display:none!important}

.pad{width:100%;display:grid;grid-template-columns:1fr 1.3fr 1fr 1fr;gap:6px}.pad button{min-height:54px;font-size:20px!important;padding:0!important;touch-action:none}
.shop{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:100%}.shop button{min-height:48px;font-size:12px!important;padding:3px!important;line-height:1.2}
</style>
<!-- GAME UI BEGIN -->
<style>
:root{--page:#172638;--surface:#22374c;--soft:#2e4760;--ink:#f0f6fc;--muted:#b1c6d9;--accent:#f0bc74;--on-accent:#342717;--line:#45637c;--stage:#142438;--page:#0b0817;--surface:#19132e;--soft:#29243d;--ink:#f5f2ff;--muted:#a99fcb;--accent:#f54988;--on-accent:#460e23;--line:#7252cc;--b-bg1:#1b1433;--b-bg2:#0b0817;--b-btn:#f54988;--b-btn-hi:#f771a2;--b-edge:#b5245a;--b-glow:#5ce1e6;--b-glow-rgb:92,225,230;--b-pedge-rgb:114,82,204;--b-btn-rgb:245,73,136;--b-bg2-rgb:11,8,23;--b-surf-rgb:25,19,46;--b-btn-ink:#460e23;--b-btn-tsh:0 1px 0 rgba(255,255,255,.35);--b-coin-ink:#460e23;--b-coin-tsh:none;--b-key-ink:#f5f2ff;--b-title:#ffffff;--b-hint-ink:#f7f4ff}

@media(max-width:360px){.game-ui body>.wrap{padding:8px 10px;gap:8px}.game-ui .ui-panel{padding:20px 16px;gap:11px}.game-ui .ui-panel h1{font-size:24px}.game-ui .ui-emblem{width:68px;height:68px;font-size:36px;border-radius:20px}.game-ui :is(.topbar,#topbar){gap:5px;padding:6px 10px}.game-ui :is(.iconbtn,.icobtn,.ibtn,.tbtn,.ib){min-width:44px;min-height:44px}}

const rnd=(a,b)=>a+Math.random()*(b-a);
function streetPt(){for(let k=0;k<80;k++){const vert=Math.random()<.5;const x=vert?ST/2+Math.floor(Math.random()*4)*(CW+ST):rnd(20,W-20),y=vert?rnd(20,H-20):ST/2+Math.floor(Math.random()*5)*(CH+ST);if(!hit(x,y,14)&&Math.hypot(x-car.x,y-car.y)>150)return{x,y};}return{x:ST/2,y:H/2};}
function newOrder(){const p=streetPt(),d=streetPt();const r=Math.random();order={p,d,has:false,fragile:r<L.fragile,express:r>=L.fragile&&r<L.fragile+L.express,et:0};}
function startLevel(i){li=i;L=LV[i];mkMap(L.seed);car={x:ST/2,y:H-ST/2,a:-Math.PI/2,v:0};time=L.time+save.up.time*5;done=0;nitro=1+save.up.nitro;nitroT=0;cash=0;catches=0;cool=0;broke=0;t=0;keys={l:0,r:0,g:0};touch=null;sparks=[];floats=[];waves=[];ntrail=[];
 traffic=[];for(let k=0;k<L.traffic;k++){const vert=k%2===0;const lane=vert?Math.floor(Math.random()*4):Math.floor(Math.random()*5);traffic.push(vert?{x:ST/2+lane*(CW+ST)+(Math.random()<.5?-7:7),y:rnd(0,H),vx:0,vy:(Math.random()<.5?-1:1)*rnd(50,80)}:{x:rnd(0,W),y:ST/2+lane*(CH+ST)+(Math.random()<.5?-7:7),vx:(Math.random()<.5?-1:1)*rnd(50,80),vy:0});}
 police=[];for(let k=0;k<L.police;k++){police.push({x:W-ST/2,y:ST/2+k*(CH+ST),v:95+li*3,p:null,pt:0,chief:false});}
 boss=L.boss?{x:W-ST/2,y:ST/2,v:118+li*3,p:null,pt:0,chief:true}:null;if(boss)police.push(boss);
 newOrder();state='play';['lvlScr','overScr','pauseOv','startScr'].forEach(k=>show(k,false));fit();hud();if(!FAST)toast(L.boss?'👮 警长在追你！被抓 3 次就失败':'城区 '+(i+1)+'：'+L.need+' 单 · '+time+' 秒',1800);}
function hud(){$('lvT').textContent=li+1;$('ordT').textContent=done+'/'+L.need;$('timeT').textContent=Math.ceil(Math.max(0,time));$('nitroT').textContent=nitro;}
function float(x,y,s,c){floats.push({x,y,s,c,l:1});}
function useNitro(){if(state!=='play'||nitro<=0||nitroT>0)return;nitro--;nitroT=1.6;tone(200,.5,'sawtooth',.05,900);hud();}
function breakFragile(){if(order&&order.fragile&&order.has){broke++;float(car.x,car.y-20,'💔 易碎件摔坏了','#ff4d6e');toast('💔 易碎件摔坏，重新接单');newOrder();}}
function tick(dt){if(state!=='play')return;t+=dt;time-=dt;if(cool>0)cool-=dt;if(nitroT>0)nitroT-=dt;
 const grip=1+save.up.grip*.18,max=(165+save.up.eng*20)*(nitroT>0?1.55:1);let steer=keys.r-keys.l,gas=keys.g||nitroT>0;
 if(touch){const ta=Math.atan2(touch.y-car.y,touch.x-car.x);let da=((ta-car.a+Math.PI*3)%(Math.PI*2))-Math.PI;steer=clamp(da*3,-1,1);gas=1;}
 car.a+=steer*2.9*grip*dt*(.4+Math.min(1,Math.abs(car.v)/100)*.6);
 if(gas)car.v=Math.min(max,car.v+340*dt);else car.v*=Math.pow(.25,dt);if(car.v>max)car.v=max;
 const nx=car.x+Math.cos(car.a)*car.v*dt,ny=car.y+Math.sin(car.a)*car.v*dt;
 if(!hit(nx,ny,11)){car.x=nx;car.y=ny;}else{if(!hit(nx,car.y,11))car.x=nx;else if(!hit(car.x,ny,11))car.y=ny;else{if(Math.abs(car.v)>110){noise(.12,.1,800);breakFragile();}car.v*=-.3;}if(Math.abs(car.v)>120){car.v*=.6;}}
 for(const c of traffic){c.x+=c.vx*dt;c.y+=c.vy*dt;if(c.x<-20)c.x=W+20;if(c.x>W+20)c.x=-20;if(c.y<-20)c.y=H+20;if(c.y>H+20)c.y=-20;
  if(cool<=0&&Math.abs(c.x-car.x)<(c.vx?20:13)&&Math.abs(c.y-car.y)<(c.vy?20:13)){cool=1;car.v=-60;time-=2;noise(.18,.14,500);float(car.x,car.y-20,'-2s 追尾','#ff4d6e');if(FX)FX.burst(sparks,car.x,car.y,'#ffc531',12);breakFragile();}}
 for(const p of police){p.pt-=dt;if(p.pt<=0||!p.p||!p.p.length){p.p=path(p.x,p.y,car.x,car.y)||[];p.pt=.6;}const w=p.p[0];if(w){const dx=w.x-p.x,dy=w.y-p.y,dd=Math.hypot(dx,dy);const sp=p.v*(p.stun>0?.2:1)*dt;if(dd<sp+1)p.p.shift();else{p.x+=dx/dd*sp;p.y+=dy/dd*sp;}}if(p.stun>0)p.stun-=dt;
  if(Math.hypot(p.x-car.x,p.y-car.y)<20&&cool<=0&&!(p.stun>0)){cool=1.5;p.stun=2.5;time-=p.chief?3:5;tone(900,.3,'sawtooth',.05,500);float(car.x,car.y-20,p.chief?'👮 被警长抓到！':'-5s 罚单','#ff4d6e');breakFragile();if(p.chief){catches++;if(catches>=3){end(false);return;}}}}
 if(order){if(order.express&&order.has)order.et+=dt;const tg=order.has?order.d:order.p;if(Math.hypot(car.x-tg.x,car.y-tg.y)<22){if(!order.has){order.has=true;waves.push({x:tg.x,y:tg.y,r:10,c:'#ffe066',a:1});tone(500,.12,'square',.05,900);float(tg.x,tg.y-20,order.fragile?'📦 易碎！慢点开':order.express?'⚡ 加急 12 秒':'取件！','#ffe066');}
  else{let earn=20;if(order.express&&order.et<=12){earn+=15;time+=4;float(tg.x,tg.y-34,'⚡ 准时 +4s','#2ee6a0');}if(order.fragile)earn+=15;cash+=earn;done++;waves.push({x:tg.x,y:tg.y,r:12,c:'#2ee6a0',a:1});tone(660,.1,'triangle');tone(990,.2,'triangle',.08,0,.1);if(FX)FX.burst(sparks,tg.x,tg.y,'#2ee6a0',16);float(tg.x,tg.y-20,'+$'+earn,'#2ee6a0');hud();if(done>=L.need){end(true);return;}newOrder();}}}
 if(nitroT>0&&Math.random()<.75)ntrail.push({x:car.x-Math.cos(car.a)*12,y:car.y-Math.sin(car.a)*12,r:6,a:.75});
 waves=waves.filter(w=>{w.r+=dt*95;w.a-=dt*2.4;return w.a>0;});
 ntrail=ntrail.filter(n=>{n.r=Math.max(1,n.r-dt*10);n.a-=dt*2.4;return n.a>0;});
 for(const f of floats){f.y-=30*dt;f.l-=dt*.8;}floats=floats.filter(f=>f.l>0);
 if(time<=0){time=0;hud();end(false);return;}if(Math.floor(t*4)!==Math.floor((t-dt)*4))hud();}
function end(ok){if(state!=='play')return;state='over';const tl=Math.ceil(time);let st=0;
 if(ok){st=1+(tl>=L.time*.2?1:0)+(tl>=L.time*.35?1:0);if(st>(save.stars[li]||0))save.stars[li]=st;cash+=tl;tone(523,.12,'triangle');tone(784,.3,'triangle',.1,0,.15);}else tone(220,.5,'sawtooth',.08,70);
 save.cash+=cash;legacyBest(cash);Store.set('save',save);
 const go=()=>{$('overH').textContent=ok?(L.boss?'👮 甩掉了警长！':'🏁 全部送达'):(catches>=3?'🚔 被警长逮捕':'⌛ 超时了');$('finalScore').textContent=ok?starStr(st):done+' / '+L.need+' 单';
  $('overText').textContent=(ok?'剩余 '+tl+' 秒（35% 以上三星）':'提示：按住画面可直接朝手指方向开车')+' · 收入 $'+cash;$('nextBtn').classList.toggle('hidden',!ok||li>=LV.length-1);show('overScr',true);};FAST?go():setTimeout(go,600);}
// 输入
function hold(id,k){const e=$(id);e.addEventListener('pointerdown',ev=>{ev.preventDefault();audio();keys[k]=1;});for(const n of ['pointerup','pointerleave','pointercancel'])e.addEventListener(n,()=>keys[k]=0);}
hold('bL','l');hold('bR','r');hold('bG','g');$('bN').onclick=useNitro;
cv.addEventListener('pointerdown',e=>{e.preventDefault();audio();touch=posOf(e,cv,W,H);});cv.addEventListener('pointermove',e=>{if(touch)touch=posOf(e,cv,W,H);});addEventListener('pointerup',()=>touch=null);
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')keys.l=1;if(e.key==='ArrowRight')keys.r=1;if(e.key==='ArrowUp')keys.g=1;if(e.key===' ')useNitro();});addEventListener('keyup',e=>{if(e.key==='ArrowLeft')keys.l=0;if(e.key==='ArrowRight')keys.r=0;if(e.key==='ArrowUp')keys.g=0;});
// 绘制
function carArt(x,y,a,col,icon){ctx.save();ctx.translate(x,y);ctx.rotate(a);if(FX)FX.shadow(ctx,2,4,15,8);if(FX)FX.tile(ctx,-14,-9,28,18,col,6);else{ctx.fillStyle=col;ctx.fillRect(-14,-9,28,18);}ctx.fillStyle='rgba(255,255,255,.7)';ctx.fillRect(4,-6,5,12);ctx.restore();if(icon)txt(ctx,icon,x,y,12);}
function draw(){const dtc=DISTRICTS[Math.floor(li/5)%3];if(FX)FX.stage(ctx,W,H,dtc[0],dtc[1]);else{ctx.fillStyle=dtc[1];ctx.fillRect(0,0,W,H);}if(!L){txt(ctx,'🛵',W/2,H/2,80);return;}
 ctx.strokeStyle='rgba(255,255,255,.18)';ctx.setLineDash([8,10]);ctx.lineWidth=2;for(let c=0;c<4;c++){const x=ST/2+c*(CW+ST);ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}for(let r=0;r<5;r++){const y=ST/2+r*(CH+ST);ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}ctx.setLineDash([]);
 for(const b of blocks){if(FX)FX.tile(ctx,b.x,b.y,b.w,b.h,b.hue,12);else{ctx.fillStyle=b.hue;ctx.fillRect(b.x,b.y,b.w,b.h);}ctx.fillStyle='rgba(255,255,255,.25)';for(let yy=b.y+14;yy<b.y+b.h-14;yy+=18)for(let xx=b.x+12;xx<b.x+b.w-12;xx+=16)if((xx*7+yy*3+b.win)%5<3)ctx.fillRect(xx,yy,7,9);}
 if(order){const tg=order.has?order.d:order.p,pulse=1+.15*Math.sin(t*6);if(FX)FX.glow(ctx,order.has?'#2ee6a0':'#ffe066',20);ctx.strokeStyle=order.has?'#2ee6a0':'#ffe066';ctx.lineWidth=4;ctx.beginPath();ctx.arc(tg.x,tg.y,18*pulse,0,7);ctx.stroke();if(FX)FX.noGlow(ctx);txt(ctx,order.has?'🏠':(order.fragile?'🥚':order.express?'⚡':'📦'),tg.x,tg.y,18);
  const a=Math.atan2(tg.y-car.y,tg.x-car.x);ctx.fillStyle='rgba(255,255,255,.85)';ctx.save();ctx.translate(car.x+Math.cos(a)*30,car.y+Math.sin(a)*30);ctx.rotate(a);ctx.beginPath();ctx.moveTo(8,0);ctx.lineTo(-5,-6);ctx.lineTo(-5,6);ctx.fill();ctx.restore();}
 for(const c of traffic)carArt(c.x,c.y,Math.atan2(c.vy,c.vx),'#8e9ab8');
 for(const p of police){carArt(p.x,p.y,p.p&&p.p[0]?Math.atan2(p.p[0].y-p.y,p.p[0].x-p.x):0,p.chief?'#222':'#e8ecff',p.chief?'👮':'');ctx.fillStyle=Math.sin(t*12)>0?'#ff3d6e':'#4fc3f7';ctx.beginPath();ctx.arc(p.x,p.y-12,3.5,0,7);ctx.fill();if(p.stun>0)txt(ctx,'💫',p.x,p.y-22,12);}
 for(const n of ntrail){ctx.save();ctx.globalAlpha=Math.max(0,n.a);ctx.fillStyle='#4fc3f7';ctx.beginPath();ctx.arc(n.x,n.y,n.r,0,7);ctx.fill();ctx.restore();}
 if(nitroT>0&&FX)FX.glow(ctx,'#4fc3f7',22);carArt(car.x,car.y,car.a,order&&order.has?'#2ee6a0':'#ff4d8d');if(FX)FX.noGlow(ctx);if(cool>0&&Math.sin(t*30)>0){ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(car.x,car.y,18,0,7);ctx.stroke();}
 for(const w of waves){ctx.save();ctx.globalAlpha=Math.max(0,w.a);ctx.strokeStyle=w.c;ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(w.x,w.y,w.r,0,7);ctx.stroke();ctx.restore();}
 if(FX)FX.drawBurst(ctx,sparks);for(const f of floats){ctx.globalAlpha=clamp(f.l,0,1);otxt(ctx,f.s,f.x,f.y,13,f.c);}ctx.globalAlpha=1;
 if(order&&order.express&&order.has){otxt(ctx,'⚡ 加急 '+Math.max(0,12-order.et).toFixed(1)+'s',W/2,16,14,order.et<=12?'#ffe066':'#ff8a8a');}
 if(boss)otxt(ctx,'👮 被抓 '+catches+'/3',W-60,16,13,'#fff');
 if(li===0&&t<5&&state==='play')otxt(ctx,'按住屏幕：朝手指方向开车',W/2,H-60,14,'#ffe066');}
// 菜单
function openLevels(){state='menu';['overScr','pauseOv'].forEach(i=>show(i,false));const g=$('lvgrid');g.innerHTML='';$('lvlInfo').textContent='★'+save.stars.reduce((a,b)=>a+(b||0),0)+' / 45 · 💵$'+save.cash+' · 最佳单局 $'+legacyBest();
 LV.forEach((s,i)=>{const b=document.createElement('button');b.className='lvl';const open=i===0||(save.stars[i-1]||0)>0||(save.stars[i]||0)>0;b.disabled=!open;b.innerHTML=(open?(s.boss?'👮':i+1):'🔒')+'<small>'+(open?starStr(save.stars[i]||0):'')+'</small>';b.onclick=()=>{tone(660,.08,'triangle');startLevel(i);};g.appendChild(b);});
 const sh=$('shop');sh.innerHTML='';for(const u of UPS){const lv=save.up[u.k],cost=u.c*(lv+1);const b=document.createElement('button');b.className='ghost';b.disabled=lv>=u.max||save.cash<cost;b.innerHTML=u.n+' '+lv+'<br><small>'+(lv>=u.max?'已满级':u.d+' $'+cost)+'</small>';b.onclick=()=>{save.cash-=cost;save.up[u.k]++;Store.set('save',save);tone(880,.1,'triangle');openLevels();};sh.appendChild(b);}
 show('lvlScr',true);}
function showTut(done){tutorial([['🛵 驾驶','按住画面，摩托会朝手指方向开；也可以用 ◀ ⛽ ▶ 按钮。🚀 氮气短时加速。'],['📦 送件','先到 📦 取件点，再跟着白色箭头送到 🏠。'],['⚠ 特殊订单','🥚 易碎件撞墙或追尾就摔坏；⚡ 加急单 12 秒内送达 +4 秒。'],['🚔 警察','巡警会抓你罚时；首领关的 👮 警长更快，被抓 3 次失败。赚钱在城区页升级装备。']],done);}
$('howBtn').onclick=()=>{show('lvlScr',false);showTut(openLevels);};
$('startBtn').onclick=()=>{audio();show('startScr',false);if(!save.tut){showTut(()=>{save.tut=1;Store.set('save',save);startLevel(0);});}else openLevels();};
$('bestLine').textContent='最佳单局 $'+legacyBest();
function pause(){if(state==='play'){state='pause';keys={l:0,r:0,g:0};touch=null;show('pauseOv',true);}}
$('pauseBtn').onclick=pause;$('resumeBtn').onclick=()=>{show('pauseOv',false);state='play';last=performance.now();};$('restartBtn').onclick=()=>startLevel(li);$('menuBtn').onclick=openLevels;
$('nextBtn').onclick=()=>startLevel(li+1);$('againBtn').onclick=()=>startLevel(li);$('menu2Btn').onclick=openLevels;
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
$('spdBtn').onclick=()=>{spdMul=spdMul===1?2:1;$('spdBtn').textContent=spdMul+'×';};
let last=performance.now();function frame(tm){const dt=Math.min(.04,(tm-last)/1000);last=tm;for(let k=0;k<spdMul;k++)tick(dt);draw();requestAnimationFrame(frame);}
fit();requestAnimationFrame(frame);
window.__nc={LV,startLevel,tick,path,setFast:v=>FAST=v,setTouch:p=>touch=p,useNitro,get s(){return{state,li,done,time,catches,car,order,broke}}};
</script>
