<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>挪车让路</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:linear-gradient(160deg,#241207 0%,#3d1f0e 55%,#200f06 100%);color:#f7efe8;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;display:flex;justify-content:center;min-height:100vh;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.wrap{width:100%;max-width:480px;padding:12px 14px 22px;display:flex;flex-direction:column;align-items:center;gap:10px}
.topbar{width:100%;display:flex;justify-content:space-between;align-items:center}
.title{font-size:19px;font-weight:800}
.tbtns{display:flex;gap:8px}
.iconbtn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:#fff;font-size:18px;width:42px;height:42px;border-radius:12px;cursor:pointer}
.iconbtn:active{transform:scale(.94)}
.stats{width:100%;display:flex;justify-content:space-around;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:10px 6px;box-shadow:0 4px 14px rgba(0,0,0,.25);font-size:14px;color:#d8bfae}
.stats b{color:#fff;font-size:18px;margin-left:4px}
canvas{width:100%;height:auto;border-radius:16px;touch-action:none;box-shadow:0 8px 26px rgba(0,0,0,.45);background:#2a1a10}
.btnrow{display:flex;gap:12px;width:100%}
.btn{flex:1;border:none;border-radius:14px;padding:13px;font-size:17px;font-weight:800;color:#fff;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.3);background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.16)}
.btn:active{transform:scale(.96)}
.hint{color:#a68a76;font-size:13px;text-align:center;line-height:1.7}
.overlay{position:fixed;inset:0;background:rgba(16,8,4,.88);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;z-index:30;padding:28px;text-align:center}
.overlay.hidden{display:none}
.overlay h1{font-size:32px}
.overlay h2{font-size:24px}
.overlay p{color:#d8bfae;font-size:15px;line-height:1.9}
.overlay .btn{flex:none;padding:13px 44px;min-width:200px;border:none;border-radius:14px;font-size:18px;font-weight:800;color:#fff;cursor:pointer}
.overlay .btn:active{transform:scale(.96)}
.overlay .btn.primary{background:linear-gradient(135deg,#ff7043,#f4511e)}
.overlay .btn.ghost{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.16);font-size:16px;padding:11px 40px}
.lvlgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;width:100%;max-width:400px}
.lvl{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);border-radius:12px;padding:10px 2px;color:#fff;cursor:pointer;font-size:16px;font-weight:700}
.lvl small{display:block;font-size:11px;color:#ffb74d;margin-top:3px;font-weight:400;letter-spacing:1px}
.lvl:active{transform:scale(.94)}
.stars{font-size:26px;color:#ffd54f;letter-spacing:4px}
.statline{display:flex;gap:18px;color:#f0ddd0;font-size:15px}
.statline b{color:#ffd54f;font-size:20px}
</style>
<!-- GAME UI BEGIN -->
<style>
:root{--page:#e7edf4;--surface:#ffffff;--soft:#dce5ef;--ink:#243952;--muted:#5b6d83;--accent:#275e9b;--on-accent:#ffffff;--line:#bacbdd;--stage:#172d48}
/* Shared presentation only; mechanics and state remain inside each standalone game. */
html.game-ui{background:var(--page);color:var(--ink);color-scheme:light;font-family:"Bahnschrift","Microsoft YaHei UI","PingFang SC",sans-serif}
html.game-ui[data-theme="space"],html.game-ui[data-theme="arcade"]{color-scheme:dark}
.game-ui body{background:var(--page);color:var(--ink);font-family:inherit;overscroll-behavior:none}
.game-ui body>.wrap{padding:20px 16px max(20px,env(safe-area-inset-bottom));gap:14px;max-width:500px}
.game-ui #app{background:var(--page);color:var(--ink)}
.game-ui :is(.topbar,#topbar){gap:8px;flex-wrap:wrap;min-height:58px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:10px 12px;box-shadow:0 3px 0 var(--soft);font-size:13px}
.game-ui :is(.title,.tb-title,.tb-title,#topbar .t,.topbar .t){color:var(--ink);font-size:16px;font-weight:750;letter-spacing:0}
.game-ui :is(.topbar,.hud,#hud,#topbar) :is(b,.v){color:var(--accent);font-variant-numeric:tabular-nums}
.game-ui :is(.stat,.topbar .s,.topbar .stat,.scorebar,.stats,.tip,.hint,.hintline,.hsline,.best,.hiscore){color:var(--muted);line-height:1.7}
.game-ui :is(.hint,.hintline,.tip){font-size:12px;max-width:40em;text-wrap:pretty}
.game-ui .scorebar{padding:6px 10px;gap:8px;flex-wrap:wrap}
.game-ui :is(.iconbtn,.iconBtn,.icobtn,.ibtn,.tbtn,.hbtn,.ib,.iconBtn,.pause){min-width:44px;min-height:44px;flex-shrink:0;border-radius:12px;background:var(--soft);color:var(--ink);border:1px solid var(--line);box-shadow:none;font-size:17px}
.game-ui button{font-family:inherit;cursor:pointer;touch-action:manipulation}
.game-ui button:focus-visible,.game-ui [tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.game-ui :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn){background:var(--accent);color:var(--on-accent);border:1px solid transparent;border-radius:13px;min-height:50px;padding:13px 28px;font-size:16px;font-weight:750;letter-spacing:0;box-shadow:0 4px 0 var(--line);text-shadow:none;max-width:100%}
.game-ui :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn):active{box-shadow:none;transform:translateY(2px)}
.game-ui :is(.ghost,.ghostbtn,.btn2,.abtn,.toolbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line);box-shadow:none;border-radius:12px;min-height:44px}
.game-ui :is(.rowbtns,.btnrow,.ctlrow){gap:10px;flex-wrap:wrap;justify-content:center}
.game-ui :is(.pill,.hudbox,.hud .p){background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:none;font-variant-numeric:tabular-nums}
.game-ui :is(.dbtn,.cbtn,.gbtn,.holdbtn,.firebtn,.bombbtn,.jumpbtn,.pumpbtn,.nbtn){border-radius:12px;box-shadow:0 3px 0 var(--line);min-height:44px}
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv,.screen):has(>.ui-panel){padding:20px;overflow-y:auto;overscroll-behavior:contain}
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv):has(>.ui-panel){background:var(--page);backdrop-filter:none;justify-content:safe center;align-items:center}
.game-ui .ui-panel{width:min(100%,380px);max-height:100%;overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:18px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:24px;padding:30px 24px;box-shadow:0 8px 0 var(--soft),0 20px 48px #15253618;text-align:center;margin:auto}
.game-ui .ui-panel :is(.card,.panel,.pausecard,.ovcard){display:contents}
.game-ui .ui-panel :is(h1,h2,.gamename,.gametitle){font-size:30px;line-height:1.25;font-weight:800;color:var(--ink);background:none;-webkit-text-fill-color:currentColor;text-shadow:none;letter-spacing:-.6px;margin:0}
.game-ui .ui-panel :is(p,.howto,.sub,.rule){font-size:14px;line-height:1.85;color:var(--muted);background:none;border:0;box-shadow:none;padding:0;margin:0;max-width:32em;text-align:left;white-space:normal}
.game-ui .ui-panel :is(.bigemoji,.bigemoji,.ic,.big):not(.bigscore){animation:none;filter:none;text-shadow:none}
.game-ui .ui-emblem{width:90px;height:90px;display:grid;place-items:center;border:1px solid var(--line);border-radius:28px;background:var(--soft);font-size:48px;line-height:1;flex-shrink:0;position:relative}
.game-ui[data-theme="wood"] .ui-emblem{border-radius:50%;box-shadow:inset 0 0 0 5px var(--surface),inset 0 0 0 6px var(--line)}
.game-ui[data-theme="wood"] .ui-panel h1{font-family:"STKaiti","KaiTi","Microsoft YaHei",serif;letter-spacing:2px}
.game-ui[data-theme="ice"] .ui-emblem{border-radius:26px 8px 26px 8px}
.game-ui[data-theme="space"] .ui-emblem{background:radial-gradient(circle at center,var(--soft) 42%,transparent 43%),var(--surface);border-radius:50%;outline:1px solid var(--line);outline-offset:7px;margin:7px}
.game-ui[data-theme="kitchen"] .ui-emblem{border-radius:22px;border-bottom:5px solid var(--line)}
.game-ui .ui-panel :is(.score,.bigscore,.bigScore,.scorebig){color:var(--accent);font-size:48px;font-weight:800;font-variant-numeric:tabular-nums}
.game-ui .ui-panel :is(.best,.hsline,.hiscore,.endstats,.endstats b){color:var(--muted);font-size:13px;line-height:1.8}
.game-ui .ui-mode{display:grid;grid-template-columns:1fr 1fr;gap:5px;background:var(--soft);padding:5px;border:1px solid var(--line);border-radius:14px;width:100%}
.game-ui .ui-mode button{min-height:44px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-size:14px;font-weight:700;box-shadow:none}
.game-ui .ui-mode button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 2px 5px #1525361a}
.game-ui .ui-panel .ui-mode-note{font-size:12px;line-height:1.6;text-align:center;color:var(--muted)}
.game-ui .ui-mode-status{display:block;padding:5px 10px;color:var(--accent);font-size:11px;font-weight:700;line-height:1.5;text-align:center;border:1px solid var(--line);border-radius:8px;background:var(--surface);margin:4px auto;max-width:100%;pointer-events:none}
.game-ui body>.wrap>canvas:not(#fx){background-color:var(--stage);box-shadow:0 0 0 1px var(--line),0 6px 0 var(--soft);border-radius:18px;flex-shrink:0}
.game-ui .screen>canvas.game{box-shadow:0 0 0 1px var(--line),0 6px 0 var(--soft)}
.game-ui #hud{gap:6px;background:var(--surface);color:var(--ink)}
.game-ui #hud :is(.left,.t,.s,.grp,.pill){color:var(--ink)}
.game-ui #hud .pill{background:var(--surface);border-color:var(--line)}
.game-ui body canvas:is(#cv,#game,#board){background-color:var(--stage)}
.game-ui :is(button.dbtn,button.cbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.game-ui :is(button.lvl,button.lvlbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line);border-radius:12px;min-height:54px}
.game-ui :is(button.lvl,button.lvlbtn) :is(.nc,.sz,small){color:var(--muted)}
.game-ui .ui-panel button.lvl{margin:0;min-width:44px;box-shadow:none;padding:8px}
.game-ui #hud :is(.left,.right,.hudl,.hbtns){gap:5px;flex-wrap:wrap}
.game-ui #hud :is(.left,.hudl){min-width:0;flex-shrink:1}
.game-ui #hud :is(.pill,.left){font-size:12px}
.game-ui button:disabled{cursor:default;opacity:.45;box-shadow:none}
.game-ui .ui-panel .ui-assist-note{color:var(--accent);font-weight:700}
@media(min-width:700px){.game-ui body>.wrap{padding-top:32px}.game-ui .ui-panel{padding:36px 30px}}
@media(max-width:360px){.game-ui body>.wrap{padding:10px;gap:10px}.game-ui .ui-panel{padding:22px 18px;gap:13px}.game-ui .ui-panel h1{font-size:26px}.game-ui .ui-emblem{width:70px;height:70px;font-size:38px}.game-ui :is(.topbar,#topbar){gap:5px;padding:8px}.game-ui :is(.iconbtn,.icobtn,.ibtn,.tbtn,.ib){min-width:40px;min-height:44px}}
@media(max-height:650px){.game-ui .ui-panel{padding:18px;gap:12px}.game-ui .ui-emblem{width:60px;height:60px;font-size:32px}.game-ui .ui-panel h1{font-size:25px}.game-ui .ui-panel :is(p,.howto,.sub,.rule){font-size:13px}}
@media(prefers-reduced-motion:reduce){.game-ui *, .game-ui *::before,.game-ui *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

html[data-game="unblock"] .stats{background:var(--surface);color:var(--muted);box-shadow:0 4px 0 var(--soft)}html[data-game="unblock"] .stats b{color:var(--accent)}

</style>
<script>
// Installed before the original game script; embedded so downloaded ZIPs remain offline capable.
(function () {
  'use strict';
  var config = {"id":"unblock","name":"挪车让路","theme":"paper","icon":"🚗","challenge":"每次挑战仅 1 次提示、3 次撤销，谨慎规划再落子"};
  var mode = 'classic';
  try { mode = sessionStorage.getItem('game100-mode-' + config.id) || mode; } catch (_) {}
  var expert = mode === 'expert';
  var used = { hint: 0, undo: 0 };
  var limits = { hint: 1, undo: 3 };
  function storageKey(key) { return expert && !/sound|mute/i.test(key) ? 'expert:' + key : key; }
  window.GameUI = {
    expert: expert,
    pick: function (classic, advanced) { return expert ? advanced : classic; },
    storageGet: function (key) { return localStorage.getItem(storageKey(key)); },
    storageSet: function (key, value) { localStorage.setItem(storageKey(key), value); },
    storageRemove: function (key) { localStorage.removeItem(storageKey(key)); }
  };
  var root = document.documentElement;
  root.classList.add('game-ui');
  root.dataset.theme = config.theme;
  root.dataset.game = config.id;
  root.dataset.mode = mode;
  var gesture = new WeakMap();
  function labelButtons(scope) {
    scope.querySelectorAll('button').forEach(function (button) {
      if (button.getAttribute('aria-label')) return;
      var id = button.id.toLowerCase(), text = button.textContent.trim();
      var name = /mute|sound|snd/.test(id) ? '切换音效' : /pause/.test(id) ? '暂停游戏' : /hint/.test(id) && !/close|ok/.test(id) ? '查看提示' : '';
      if (!name && /^[⏸🔊🔇💡Ⅱ]+$/u.test(text)) name = { '⏸': '暂停游戏', '🔊': '切换音效', '🔇': '切换音效', '💡': '查看提示' }[text];
      if (name) button.setAttribute('aria-label', name);
    });
  }
  function decorate(container) {
    if (container.querySelector(':scope > .ui-panel') || !container.querySelector('h1,h2,.gamename')) return;
    if (container.matches('.screen') && container.querySelector('canvas:not(#fx)')) return;
    var panel = document.createElement('div');
    panel.className = 'ui-panel';
    while (container.firstChild) panel.appendChild(container.firstChild);
    container.appendChild(panel);
    var heading = panel.querySelector('h1,h2,.gamename');
    var start = /start|menu|ready/i.test(container.id) || !!panel.querySelector('#startBtn,#btnStart,.startbtn');
    if (start) {
      var headings = panel.querySelectorAll('h1,h2,.gamename');
      if (headings.length > 1 && !/[A-Za-z0-9\u4e00-\u9fff]/.test(heading.textContent)) { heading.remove(); heading = headings[1]; }
      var oldIcon = panel.querySelector('.bigemoji,.ic');
      if (oldIcon) oldIcon.remove();
      var emblem = document.createElement('div');
      emblem.className = 'ui-emblem'; emblem.textContent = config.icon; emblem.setAttribute('aria-hidden', 'true');
      panel.insertBefore(emblem, panel.firstChild);
      heading.textContent = config.name;
      var switcher = document.createElement('div'); switcher.className = 'ui-mode'; switcher.setAttribute('role', 'group'); switcher.setAttribute('aria-label', '选择玩法模式');
      [['classic','经典模式'],['expert','进阶挑战']].forEach(function (item) {
        var b = document.createElement('button'); b.type = 'button'; b.textContent = item[1]; b.dataset.mode = item[0]; b.setAttribute('aria-pressed', String(mode === item[0]));
        b.addEventListener('click', function () {
          if (mode === item[0]) return;
          try { sessionStorage.setItem('game100-mode-' + config.id, item[0]); location.reload(); }
          catch (_) { b.textContent = '浏览器未允许保存模式'; }
        });
        switcher.appendChild(b);
      });
      var primary = panel.querySelector('#startBtn,#btnStart,.startbtn,button');
      var anchor = primary;
      while (anchor && anchor.parentNode !== panel && !anchor.parentNode.matches('.card,.panel,.pausecard,.ovcard')) anchor = anchor.parentNode;
      var target = anchor ? anchor.parentNode : panel;
      target.insertBefore(switcher, anchor || null);
      var note = document.createElement('p'); note.className = 'ui-mode-note';
      note.textContent = expert ? config.challenge + '。进阶纪录单独保存。' : '按原规则轻松开局，也可切换进阶挑战。';
      target.insertBefore(note, anchor || null);
    }
    labelButtons(panel);
  }
  function notify(text) {
    var el = document.getElementById('ui-assist-toast');
    if (!el) { el = document.createElement('div'); el.id = 'ui-assist-toast'; el.className = 'ui-mode-status'; el.setAttribute('role', 'status'); el.style.cssText = 'position:fixed;bottom:18px;left:16px;right:16px;z-index:200;padding:14px'; document.body.appendChild(el); }
    el.textContent = text; el.hidden = false;
    clearTimeout(notify.timer); notify.timer = setTimeout(function () { el.hidden = true; }, 2000);
  }
  function assistEvent(event) {
    if (!expert) return;
    var b = event.target.closest('button'); if (!b || b.closest('.ui-mode')) return;
    var kind = /^(hintBtn|hintTopBtn|btnHint)$/i.test(b.id) ? 'hint' : /^(undoBtn|undoTopBtn|btnUndo)$/i.test(b.id) || /悔一步|撤销/.test(b.textContent) ? 'undo' : '';
    if (!kind) return;
    var prev = gesture.get(b), blocked;
    if (event.type === 'click' && prev && performance.now() - prev.at < 1000) blocked = prev.blocked;
    else { blocked = used[kind] >= limits[kind]; if (!blocked) used[kind]++; gesture.set(b, { at: performance.now(), blocked: blocked }); }
    if (blocked) { event.preventDefault(); event.stopImmediatePropagation(); notify(kind === 'hint' ? '本次挑战的 1 次提示已用完' : '本次挑战的 3 次撤销已用完'); }
  }
  document.addEventListener('pointerdown', assistEvent, true);
  document.addEventListener('click', assistEvent, true);
  document.addEventListener('click', function (event) {
    var b = event.target.closest('button');
    if (b && /^(startBtn|btnStart|restartBtn|againBtn|retryBtn|btnAgain|btnRestart|playAgain)$/i.test(b.id)) used = { hint: 0, undo: 0 };
  }, true);
  document.addEventListener('DOMContentLoaded', function () {
    var selector = '.overlay,.ov,#ov,#overlay,#pauseOv,.screen';
    document.querySelectorAll(selector).forEach(function (container) {
      decorate(container);
      // Only dynamic overlay children are observed; animated scores never trigger this work.
      new MutationObserver(function () { decorate(container); }).observe(container, { childList: true });
    });
    labelButtons(document);
  });
}());

</script>
<!-- GAME UI END -->
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="title">🚗 挪车让路 <span id="lvlLabel" style="font-size:14px;color:#c9a68c"></span></div>
    <div class="tbtns">
      <button class="iconbtn" id="hintBtn" title="提示">💡</button>
      <button class="iconbtn" id="muteBtn">🔊</button>
      <button class="iconbtn" id="pauseBtn">⏸</button>
    </div>
  </div>
  <div class="stats">
    <span>步数<b id="moves">0</b></span>
    <span>参考<b id="par">0</b></span>
    <span>关卡<b id="clvl">1/20</b></span>
  </div>
  <canvas id="cv" width="480" height="480"></canvas>
  <div class="btnrow">
    <button class="btn" id="undoBtn">↩ 撤销</button>
    <button class="btn" id="resetBtn">↺ 重来</button>
  </div>
  <p class="hint">拖动车辆（只能沿车身方向移动）<br>把 <b style="color:#ff5252">红色小车</b> 从右侧出口挪出去即过关</p>
</div>

<div class="overlay" id="startScr">
  <h1>🚗 挪车让路</h1>
  <p>20 关挪车，红车突围<br><br>👆 按住车辆沿车身方向拖动<br>🚗 横车左右移，竖车上下移<br>🎯 把红色小车送出右侧出口<br>⭐ 步数越少星级越高（1-3 星）<br>↩ 走错了可以撤销</p>
  <button class="btn primary" id="startBtn">开始游戏</button>
</div>

<div class="overlay hidden" id="lvlScr">
  <h2>选择关卡</h2>
  <div class="lvlgrid" id="lvlGrid"></div>
  <button class="btn ghost" id="lvlBack">返回</button>
</div>

<div class="overlay hidden" id="pauseScr">
  <h2>⏸ 已暂停</h2>
  <p>车辆们熄火等待中</p>
  <button class="btn primary" id="resumeBtn">继续</button>
  <button class="btn ghost" id="pauseRetryBtn">重来本关</button>
  <button class="btn ghost" id="pauseLevelsBtn">选择关卡</button>
</div>

<div class="overlay hidden" id="winScr">
  <h1>🎉 突围成功！</h1>
  <div class="stars" id="wStars">★★★</div>
  <div class="statline"><span>步数 <b id="wMoves">0</b></span><span>参考 <b id="wPar">0</b></span></div>
  <p id="wNew" style="color:#ffd54f;font-weight:700"></p>
  <button class="btn primary" id="nextBtn">下一关 →</button>
  <button class="btn ghost" id="winRetryBtn">重玩本关</button>
  <button class="btn ghost" id="winLevelsBtn">选择关卡</button>
</div>

<div class="overlay hidden" id="hintScr">
  <h2>💡 提示</h2>
  <p id="hintText"></p>
  <button class="btn ghost" id="hintClose">知道了</button>
</div>

<script>
/* GAMEPLAY UPGRADE */
'use strict';
/* ============ 工具 ============ */
const $=id=>document.getElementById(id);
function lsGet(k,d){try{const v=GameUI.storageGet(k);return v==null?d:JSON.parse(v);}catch(e){return d;}}

/* ============ 音效（WebAudio 现场合成） ============ */
const Snd={
  ctx:null,
  get muted(){return lsGet('unblock_mute',false);},
  set muted(v){lsSet('unblock_mute',v);},
  ensure(){
    if(!this.ctx){try{this.ctx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
    if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();
  },
  tone(f,dur,type,vol,delay,slideTo){
    if(this.muted)return;this.ensure();if(!this.ctx)return;
    const t=this.ctx.currentTime+(delay||0);
    const o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.type=type||'sine';o.frequency.setValueAtTime(f,t);
    if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,t+dur);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol||0.14,t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);g.connect(this.ctx.destination);
    o.start(t);o.stop(t+dur+0.05);
  },
  click(){this.tone(660,0.06,'square',0.07);},
  drag(){this.tone(240,0.08,'triangle',0.08,0,300);},
  snap(){this.tone(520,0.07,'triangle',0.1,0,660);},
  win(){const s=this;[523,659,784,1046,1318].forEach(function(f,i){s.tone(f,0.2,'triangle',0.13,i*0.09);});}
};

/* ============ 状态 ============ */
const cv=$('cv'),g=cv.getContext('2d');
const SZ=480,CELL=80,P=CELL-4,EXIT_ROW=2; // P=76 车辆格距
const CAR_COLORS=['#FF7043','#4FC3F7','#AED581','#FFF176','#BA68C8','#4DB6AC','#FF8A65','#90A4AE','#F06292','#7986CB','#A1887F','#81D4FA','#80CBC4'];
let li=0,cars=[],moves=0,history=[];
let playing=false,paused=false,won=false,drag=null;
let raf=0,lastT=0,parts=[];
let stars=lsGet('unblock_stars',{});

function loadLevel(l){
  stopLoop();
  li=l;won=false;drag=null;parts=[];
  const lv=LEVELS[l];
  cars=lv.cars.map(function(c,i){
    return {x:c[0],y:c[1],len:c[2],h:c[3]===1,fx:c[0],fy:c[1],
      color:i===0?'#E53935':CAR_COLORS[(i-1)%CAR_COLORS.length],target:i===0};
  });
  moves=0;history=[];
  $('moves').textContent='0';
  $('par').textContent=lv.par;
  $('lvlLabel').textContent='第 '+(l+1)+' 关';
  $('clvl').textContent=(l+1)+'/'+LEVELS.length;
  hideAll();
  playing=true;paused=false;
  startLoop();
}
function stopLoop(){if(raf)cancelAnimationFrame(raf);raf=0;}
function startLoop(){stopLoop();lastT=performance.now();raf=requestAnimationFrame(loop);}
function hideAll(){['startScr','lvlScr','pauseScr','winScr'].forEach(function(id){$(id).classList.add('hidden');});}
function positions(){return cars.map(function(c){return c.h?c.x:c.y;});}
function restore(pos){cars.forEach(function(c,i){if(c.h){c.x=pos[i];c.fx=pos[i];}else{c.y=pos[i];c.fy=pos[i];}});}
function occupancy(skip){
  const o=[];
  for(let x=0;x<6;x++){o.push([]);for(let y=0;y<6;y++)o[x].push(-1);}
  cars.forEach(function(c,i){
    if(i===skip)return;
    for(let k=0;k<c.len;k++)o[c.h?c.x+k:c.x][c.h?c.y:c.y+k]=i;
  });
  return o;
}
function dragRange(i){
  const c=cars[i],o=occupancy(i);
  let lo,hi;
  if(c.h){
    lo=c.x;while(lo-1>=0&&o[lo-1][c.y]<0)lo--;
    hi=c.x;while(hi+c.len<6&&o[hi+c.len][c.y]<0)hi++;
    if(i===0&&hi>4)hi=4; // 红车最多到出口格
  }else{
    lo=c.y;while(lo-1>=0&&o[c.x][lo-1]<0)lo--;
    hi=c.y;while(hi+c.len<6&&o[c.x][hi+c.len]<0)hi++;
  }
  return [lo,hi];
}

/* ============ 输入（拖动） ============ */
let lastTouch=0;
function evtPos(e){
  const r=cv.getBoundingClientRect();
  return {x:(e.clientX-r.left)/r.width*SZ,y:(e.clientY-r.top)/r.height*SZ};
}
function carAt(px,py){
  for(let i=cars.length-1;i>=0;i--){
    const c=cars[i];
    const x0=c.fx*P+12,y0=c.fy*P+12;
    const w=(c.h?c.len:1)*P,h=(c.h?1:c.len)*P;
    if(px>=x0&&px<=x0+w&&py>=y0&&py<=y0+h)return i;
  }
  return -1;
}
function onDown(e){
  if(!playing||paused||won)return;
  const p=evtPos(e);
  const i=carAt(p.x,p.y);
  if(i<0)return;
  const c=cars[i];
  drag={i:i,range:dragRange(i),
    startP:c.h?p.x:p.y,
    orig:c.h?c.x:c.y};
  Snd.drag();
}
function onMove(e){
  if(!drag)return;
  const p=evtPos(e);
  const c=cars[drag.i];
  const cur=c.h?p.x:p.y;
  const np=Math.max(drag.range[0],Math.min(drag.range[1],drag.orig+(cur-drag.startP)/P));
  if(c.h)c.fx=np;else c.fy=np;
}
function onUp(){
  if(!drag)return;
  const d=drag;drag=null;
  const c=cars[d.i];
  const cur=c.h?c.fx:c.fy;
  const np=Math.round(Math.max(d.range[0],Math.min(d.range[1],cur)));
  if(c.h)c.fx=np;else c.fy=np;
  if(np!==d.orig){
    history.push(positions());
    if(c.h)c.x=np;else c.y=np;
    moves++;$('moves').textContent=moves;
    Snd.snap();buzz(25);
    if(d.i===0&&np===4)doWin();
  }else{
    if(c.h)c.fx=d.orig;else c.fy=d.orig;
  }
}
cv.addEventListener('touchstart',function(e){e.preventDefault();lastTouch=Date.now();Snd.ensure();onDown(e.touches[0]);},{passive:false});
cv.addEventListener('touchmove',function(e){e.preventDefault();onMove(e.touches[0]);},{passive:false});
cv.addEventListener('touchend',function(e){e.preventDefault();onUp();},{passive:false});
cv.addEventListener('touchcancel',function(){onUp();});
cv.addEventListener('mousedown',function(e){if(Date.now()-lastTouch<600)return;Snd.ensure();onDown(e);});
cv.addEventListener('mousemove',function(e){if(Date.now()-lastTouch<600)return;onMove(e);});
cv.addEventListener('mouseup',function(e){if(Date.now()-lastTouch<600)return;onUp();});

/* ============ 胜利 ============ */
function starCount(mv,par){
  if(mv<=par)return 3;
  if(mv<=par+Math.max(2,Math.ceil(par*0.5)))return 2;
  return 1;
}
function doWin(){
  won=true;playing=false;
  Snd.win();buzz(80);
  const lv=LEVELS[li],st=starCount(moves,lv.par);
  const prev=stars[li]||0,isNew=st>prev;
  if(isNew){stars[li]=st;lsSet('unblock_stars',stars);}
  const red=cars[0];
  let slideT=0;
  const slide=function(){
    slideT+=0.035;red.fx=4+slideT*3.4;
    if(slideT<1)requestAnimationFrame(slide);
  };
  slide();
  const cols=['#ffd54f','#ff7043','#fff176','#aed581'];
  for(let i=0;i<80;i++)parts.push({x:380+Math.random()*100,y:180+Math.random()*80,vx:120+Math.random()*220,vy:-60-Math.random()*160,life:1.6,max:1.6,c:cols[(Math.random()*4)|0],s:3+Math.random()*4,grav:300,conf:true});
  setTimeout(function(){
    stopLoop();
    $('wMoves').textContent=moves;$('wPar').textContent=lv.par;
    let ss='';for(let i=0;i<3;i++)ss+=i<st?'★':'☆';
    $('wStars').textContent=ss;
    $('wNew').textContent=isNew?'🏆 新纪录！':'';
    $('nextBtn').style.display=(li<LEVELS.length-1)?'':'none';
    $('winScr').classList.remove('hidden');
  },850);
}

/* ============ 主循环 ============ */
function loop(t){
  raf=requestAnimationFrame(loop);
  const dt=Math.min(0.05,(t-lastT)/1000);lastT=t;
  for(let i=0;i<cars.length;i++){
    if(drag&&drag.i===i)continue;
    const c=cars[i];
    if(c.h&&Math.abs(c.fx-c.x)>0.001)c.fx+=(c.x-c.fx)*Math.min(1,dt*18);
    if(!c.h&&Math.abs(c.fy-c.y)>0.001)c.fy+=(c.y-c.fy)*Math.min(1,dt*18);
  }
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];p.life-=dt;
    if(p.life<=0){parts.splice(i,1);continue;}
    p.vy+=(p.grav||0)*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
  }
  render();
}

/* ============ 绘制 ============ */
function rr(x,y,w,h,r){
  g.beginPath();
  g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();
}
function shade(hex,amt){
  const n=parseInt(hex.slice(1),16);
  let r=(n>>16)+amt,gc=((n>>8)&255)+amt,b=(n&255)+amt;
  r=Math.max(0,Math.min(255,r));gc=Math.max(0,Math.min(255,gc));b=Math.max(0,Math.min(255,b));
  return '#'+((r<<16)|(gc<<8)|b).toString(16).padStart(6,'0');
}
function render(){
  g.clearRect(0,0,SZ,SZ);
  const ox=(SZ-6*P)/2,oy=(SZ-6*P)/2;
  g.fillStyle='#312013';rr(2,2,SZ-4,SZ-4,14);g.fill();
  g.fillStyle='#241708';rr(ox-4,oy-4,6*P+8,6*P+8,12);g.fill();
  for(let y=0;y<6;y++)for(let x=0;x<6;x++){
    if((x+y)%2===0){g.fillStyle='rgba(255,255,255,0.03)';g.fillRect(ox+x*P,oy+y*P,P,P);}
  }
  g.strokeStyle='rgba(255,255,255,0.07)';g.lineWidth=1;
  for(let i=0;i<=6;i++){
    g.beginPath();g.moveTo(ox+i*P,oy);g.lineTo(ox+i*P,oy+6*P);g.stroke();
    g.beginPath();g.moveTo(ox,oy+i*P);g.lineTo(ox+6*P,oy+i*P);g.stroke();
  }
  // 出口：在右侧边框 row2 处开缺口 + 箭头
  const ey=oy+EXIT_ROW*P;
  g.fillStyle='#2a1a10';
  g.fillRect(ox+6*P-3,ey+2,15,P-4);
  g.fillStyle='#ff7043';
  g.font='bold 26px sans-serif';g.textAlign='center';g.textBaseline='middle';
  g.fillText('▶',ox+6*P-12,ey+P/2);
  // 车辆
  const di=drag?drag.i:-1;
  for(let i=0;i<cars.length;i++){
    const c=cars[i];
    const w=(c.h?c.len:1)*P-8,h=(c.h?1:c.len)*P-8;
    const x=ox+c.fx*P+4,y=oy+c.fy*P+4;
    g.save();
    if(i===di){g.shadowColor='rgba(0,0,0,0.6)';g.shadowBlur=14;g.shadowOffsetY=5;}
    const gr=g.createLinearGradient(x,y,x,y+h);
    gr.addColorStop(0,shade(c.color,30));gr.addColorStop(0.5,c.color);gr.addColorStop(1,shade(c.color,-32));
    g.fillStyle=gr;rr(x,y,w,h,13);g.fill();
    g.strokeStyle='rgba(0,0,0,0.35)';g.lineWidth=2;rr(x,y,w,h,13);g.stroke();
    g.fillStyle='rgba(255,255,255,0.26)';
    if(c.h){rr(x+w*0.16,y+h*0.2,w*0.68,h*0.6,8);g.fill();}
    else{rr(x+w*0.2,y+h*0.12,w*0.6,h*0.32,8);g.fill();}
    if(c.target){
      g.fillStyle='rgba(255,255,255,0.9)';
      g.font='bold 22px sans-serif';g.textAlign='center';g.textBaseline='middle';
      g.fillText('★',x+w/2,y+h/2+1);
    }
    g.restore();
  }
  for(let i=0;i<parts.length;i++){
    const p=parts[i];
    g.globalAlpha=Math.max(0,p.life/p.max);
    g.fillStyle=p.c;
    if(p.conf){g.save();g.translate(p.x,p.y);g.rotate(p.life*5);g.fillRect(-p.s/2,-p.s/3,p.s,p.s*0.66);g.restore();}
    else{g.beginPath();g.arc(p.x,p.y,p.s,0,Math.PI*2);g.fill();}
  }
  g.globalAlpha=1;
}

/* ============ 界面 ============ */
function starStr(s){let r='';for(let i=0;i<3;i++)r+=i<s?'★':'☆';return r;}
function buildLevels(){
  const gr=$('lvlGrid');gr.innerHTML='';
  LEVELS.forEach(function(lv,i){
    const b=document.createElement('button');
    b.className='lvl';
    const s=stars[i]||0;
    b.innerHTML=(i+1)+'<small>'+(s?starStr(s):'未过关')+'</small>';
    b.addEventListener('click',function(){Snd.ensure();Snd.click();buzz(20);loadLevel(i);});
    gr.appendChild(b);
  });
}
$('startBtn').addEventListener('click',function(){Snd.ensure();Snd.click();buzz(30);buildLevels();$('startScr').classList.add('hidden');$('lvlScr').classList.remove('hidden');});
$('lvlBack').addEventListener('click',function(){Snd.click();$('lvlScr').classList.add('hidden');$('startScr').classList.remove('hidden');});
$('undoBtn').addEventListener('click',function(){
  if(!playing||paused||won||!history.length)return;
  restore(history.pop());
  moves=Math.max(0,moves-1);$('moves').textContent=moves;
  Snd.click();
});
$('resetBtn').addEventListener('click',function(){if(!playing||paused)return;Snd.click();loadLevel(li);});
/* ============ 提示 ============ */
$('hintBtn').addEventListener('click',function(){
  Snd.ensure();Snd.click();
  $('hintText').innerHTML='<b style="color:#fff">第 '+(li+1)+' 关 · 参考 '+LEVELS[li].par+' 步</b><br>'+HINTS[li];
  $('hintScr').classList.remove('hidden');
});
$('hintClose').addEventListener('click',function(){Snd.click();$('hintScr').classList.add('hidden');});
$('pauseBtn').addEventListener('click',function(){
  if(!playing||paused||won||drag)return;
  Snd.click();paused=true;stopLoop();$('pauseScr').classList.remove('hidden');
});
$('resumeBtn').addEventListener('click',function(){Snd.click();$('pauseScr').classList.add('hidden');paused=false;startLoop();});
$('pauseRetryBtn').addEventListener('click',function(){Snd.click();loadLevel(li);});
$('pauseLevelsBtn').addEventListener('click',function(){Snd.click();$('pauseScr').classList.add('hidden');buildLevels();$('lvlScr').classList.remove('hidden');});
$('nextBtn').addEventListener('click',function(){Snd.click();loadLevel(li+1);});
$('winRetryBtn').addEventListener('click',function(){Snd.click();loadLevel(li);});
$('winLevelsBtn').addEventListener('click',function(){Snd.click();buildLevels();$('winScr').classList.add('hidden');$('lvlScr').classList.remove('hidden');});
function refreshMute(){$('muteBtn').textContent=Snd.muted?'🔇':'🔊';}
$('muteBtn').addEventListener('click',function(){Snd.ensure();Snd.muted=!Snd.muted;refreshMute();if(!Snd.muted)Snd.click();});
refreshMute();
document.addEventListener('visibilitychange',function(){if(document.hidden&&playing&&!paused&&!won)$('pauseBtn').click();});
</script>
</body>
</html>
