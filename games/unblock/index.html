    glow: function (ctx, color, blur) { ctx.shadowColor = color; ctx.shadowBlur = blur; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0; },

    // Crisp rendering on high-DPI phones without changing game coordinates.
    // Only safe where input code converts with getBoundingClientRect + logical W/H, not cv.width.
    hidpi: function (cv, ctx, w, h) {
      var d = Math.max(1, Math.min(2.5, window.devicePixelRatio || 1));
      cv.width = Math.round(w * d); cv.height = Math.round(h * d); // intrinsic ratio stays w:h, so CSS sizing is unchanged
      ctx.setTransform(d, 0, 0, d, 0, 0); return d;
    },
    // Lightweight particle bursts (pooled array, no allocations per frame beyond the burst).
    burst: function (list, x, y, color, n) {
      for (var i = 0; i < (n || 12); i++) { var a = Math.random() * 6.283, v = 1 + Math.random() * 2.6; list.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 1, life: 1, c: color, r: 1.5 + Math.random() * 2.5 }); }
    },
    drawBurst: function (ctx, list) {
      for (var i = list.length - 1; i >= 0; i--) {
        var p = list[i]; p.x += p.vx; p.y += p.vy; p.vy += .12; p.life -= .035;
        if (p.life <= 0) { list.splice(i, 1); continue; }

      }
      ctx.globalAlpha = 1;
    }
  };
  window.GameUI.fx = fx;
}());

<script>
'use strict';
const $=id=>document.getElementById(id);

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};}
const PK='g100_unblock_prog',HK='g100_unblock_hs',MK='g100_mute';

function loadProg(){try{return JSON.parse(UI.storageGet(PK)||'{}');}catch(e){return{};}}

let prog=loadProg();

try{const old=JSON.parse(UI.storageGet('unblock_stars')||'null');if(old&&!prog.migratedUB){Object.keys(old).forEach(k=>{const i=(+k)+1||+k;if(old[k]>(prog.stars[i]|0))prog.stars[i]=old[k];});prog.unlock=Math.max(prog.unlock|1,Object.keys(old).length);prog.migratedUB=1;saveProg(prog);}}catch(e){}
const TUT=[['拖动挪车','按住车辆沿它的朝向拖动，横车左右、竖车上下。','🚗'],['红车突围','红色主车要从右侧出口开出去才算过关。','🚨'],['步数评星','每拖一次算一步，接近最优步数可得三星。','⭐'],['高峰首领','第5/10/15关有步数上限；升级拖车可移走一辆挡路车。','👑']];
const SHOP=[{k:'undoLv',name:'撤销',max:4,cost(){return 28+(prog.undoLv|0)*22;},desc(){return '每关悔棋+'}},{k:'hintLv',name:'让路提示',max:3,cost(){return 34+(prog.hintLv|0)*26;},desc(){return '高亮可动的车'}},{k:'towLv',name:'拖车',max:2,cost(){return 48+(prog.towLv|0)*40;},desc(){return '每关可拖走挡路车'}}];
const LEVELS=[{"cars":[[0,2,2,1],[3,4,2,0],[3,3,2,1]],"par":1},{"cars":[[0,2,2,1],[2,1,2,0],[2,3,2,1],[1,0,2,0]],"par":2},{"cars":[[0,2,2,1],[4,4,2,1],[3,2,2,0],[4,3,2,1],[5,1,2,0],[2,2,2,0],[0,0,2,0]],"par":4},{"cars":[[0,2,2,1],[5,2,3,0],[0,3,2,0],[2,1,2,0],[3,5,3,1],[3,0,3,1],[2,4,2,0]],"par":5},{"cars":[[0,2,2,1],[4,0,3,0],[0,4,2,1],[3,3,2,1],[5,1,2,0],[2,1,2,1],[3,4,2,1]],"par":5},{"cars":[[0,2,2,1],[2,0,2,0],[1,5,3,1],[1,4,3,1],[5,0,3,0],[2,2,2,0],[3,0,2,1],[1,0,2,0]],"par":7},{"cars":[[0,2,2,1],[4,3,2,1],[1,1,3,1],[3,2,2,0],[1,3,3,0],[5,0,3,0],[2,4,2,1],[0,0,2,0],[4,0,3,0]],"par":8},{"cars":[[0,2,2,1],[0,4,2,1],[3,1,2,0],[5,1,3,0],[2,0,3,0],[1,5,3,1],[3,3,2,0],[3,0,2,1]],"par":9},{"cars":[[0,2,2,1],[4,4,2,0],[5,2,3,0],[3,0,2,0],[0,5,3,1],[2,1,3,0],[4,1,2,0],[3,3,2,1]],"par":11},{"cars":[[0,2,2,1],[3,1,2,0],[3,5,2,1],[1,0,2,0],[4,3,2,0],[0,4,3,1],[2,3,2,1],[2,0,3,0],[5,3,3,0]],"par":11},{"cars":[[0,2,2,1],[3,1,2,1],[3,4,3,1],[1,5,2,1],[4,2,2,0],[2,2,3,0],[2,0,3,1],[5,2,2,0],[5,0,2,0],[3,2,2,0]],"par":11},{"cars":[[0,2,2,1],[0,4,2,0],[4,0,2,0],[4,2,2,0],[1,3,2,1],[2,1,2,0],[1,5,2,1],[1,0,3,1],[2,4,2,1]],"par":13},{"cars":[[0,2,2,1],[2,1,3,0],[5,1,2,0],[3,0,3,1],[0,0,2,1],[3,3,2,0],[0,3,2,0],[4,2,3,0],[1,4,2,1]],"par":15},{"cars":[[0,2,2,1],[3,1,3,1],[1,1,2,1],[0,3,2,0],[1,5,2,1],[5,4,2,0],[3,4,2,1],[2,3,2,0],[5,2,2,0],[3,2,2,0],[4,0,2,1],[1,0,3,1]],"par":15},{"cars":[[0,2,2,1],[2,3,3,0],[3,1,3,0],[5,2,3,0],[4,5,2,1],[5,0,2,0],[1,1,2,1],[0,4,2,0],[0,3,2,1]],"par":16}];
const COLS=['#e53935','#42a5f5','#66bb6a','#ffee58','#ab47bc','#26a69a','#ff8a65','#90a4ae','#ec407a','#5c6bc0','#8d6e63','#29b6f6'];
let cars=[],moves=0,par=1,limit=99,history=[],drag=null,cell=52,ox=24,oy=64,towLeft=0,glow=-1;
function startLevel(n){lvl=n|0;boss=lvl%5===0;score=0;sparks=[];const L=LEVELS[Math.max(0,Math.min(LEVELS.length-1,n-1))];
  cars=L.cars.map((c,i)=>({x:c[0],y:c[1],len:c[2],h:c[3]===1,col:i===0?'#e53935':COLS[1+(i-1)%(COLS.length-1)],red:i===0}));
  par=L.par;moves=0;history=[];drag=null;towLeft=prog.towLv|0;glow=-1;cell=Math.min(54,((W-36)/6)|0);ox=(W-cell*6)/2;oy=70;
  limit=boss?par*2+4+(prog.undoLv|0):999;show('lvlScr',false);show('shopScr',false);show('overScr',false);show('pauseOv',false);show('startScr',false);state='play';last=performance.now();beep(600,.1);$('score').textContent=0;
  $('hint').textContent=boss?'👑 高峰限步：'+limit+' 步内突围':'拖动车辆，红车从右侧出口离开';}
function occ(skip){const g=Array.from({length:6},()=>Array(6).fill(-1));cars.forEach((c,i)=>{if(i===skip)return;for(let k=0;k<c.len;k++){const x=c.h?c.x+k:c.x,y=c.h?c.y:c.y+k;if(x>=0&&y>=0&&x<6&&y<6)g[y][x]=i;}});return g;}
function rangeOf(i){const c=cars[i],g=occ(i);if(c.h){let lo=c.x,hi=c.x;while(lo>0&&g[c.y][lo-1]<0)lo--;while(hi+c.len<6&&g[c.y][hi+c.len]<0)hi++;if(c.red)hi=6-c.len+1;return {lo,hi};}
  let lo=c.y,hi=c.y;while(lo>0&&g[lo-1][c.x]<0)lo--;while(hi+c.len<6&&g[hi+c.len][c.x]<0)hi++;return {lo,hi};}
function doWin(){if(state!=='play')return;const stars=moves<=par?3:moves<=par+3?2:1;score=Math.max(10,200-moves*6);$('score').textContent=score;finishWin(stars,46+stars*12+(boss?50:0)+Math.max(0,par+4-moves)*2,'红车突围！');}
function lose(msg){if(state!=='play')return;finishLose(msg);}
function snapWin(){const red=cars[0];if(red && red.h && red.x+red.len>=6)doWin();}
function carAt(cx,cy){const g=occ(-1);if(cx<0||cy<0||cx>=6||cy>=6)return -1;return g[cy][cx];}
cv.addEventListener('pointerdown',e=>{if(state!=='play')return;e.preventDefault();const p=posOf(e);
  if(p.x<80&&p.y>H-50&&history.length){const h=history.pop();cars.forEach((c,i)=>{c.x=h[i].x;c.y=h[i].y;});moves=Math.max(0,moves-1);$('score').textContent=moves;beep(480,.06);return;}
  if(p.x>W-80&&p.y>H-50&&towLeft>0){glow=-2;toast('点一辆非红车拖走');return;}
  const cx=Math.floor((p.x-ox)/cell),cy=Math.floor((p.y-oy)/cell);const i=carAt(cx,cy);if(i<0)return;
  if(glow===-2&&!cars[i].red){history.push(cars.map(c=>({x:c.x,y:c.y})));cars.splice(i,1);towLeft--;glow=-1;moves++;$('score').textContent=moves;beep(300,.1);return;}
  const r=rangeOf(i);drag={i,sx:p.x,sy:p.y,ox:cars[i].x,oy:cars[i].y,r};});

  if(c.h){const dx=(p.x-drag.sx)/cell;c.x=Math.max(drag.r.lo,Math.min(drag.r.hi,Math.round((drag.ox+dx)*2)/2));}
  else{const dy=(p.y-drag.sy)/cell;c.y=Math.max(drag.r.lo,Math.min(drag.r.hi,Math.round((drag.oy+dy)*2)/2));}});

  if(changed){history.push(cars.map((cc,i)=>i===drag.i?{x:drag.ox,y:drag.oy}:{x:cc.x,y:cc.y}));cars[drag.i].x=nx;cars[drag.i].y=ny;moves++;score=moves;$('score').textContent=moves;beep(520,.05);if(moves>limit){drag=null;return lose('堵到下班了');}snapWin();}
  else{c.x=drag.ox;c.y=drag.oy;}drag=null;});
cv.addEventListener('pointercancel',()=>{if(drag){cars[drag.i].x=drag.ox;cars[drag.i].y=drag.oy;}drag=null;});
function update(){}
function draw(){if(FX)FX.stage(ctx,W,H,'#263238','#102027');else{ctx.fillStyle='#102027';ctx.fillRect(0,0,W,H);}
  ctx.fillStyle='#37474f';ctx.fillRect(ox-6,oy-6,cell*6+12,cell*6+12);

  ctx.fillStyle='#ffcc80';ctx.fillRect(ox+6*cell-2,oy+2*cell+8,18,cell-16);
  cars.forEach(c=>{const px=ox+c.x*cell+4,py=oy+c.y*cell+4,pw=(c.h?c.len:1)*cell-8,ph=(c.h?1:c.len)*cell-8;if(FX)FX.tile(ctx,px,py,pw,ph,c.col,10);else{ctx.fillStyle=c.col;ctx.fillRect(px,py,pw,ph);}if(c.red){ctx.fillStyle='#fff';ctx.font='16px sans-serif';ctx.textAlign='center';ctx.fillText('🚘',px+pw/2,py+ph/2+6);}});
  ctx.fillStyle='#eceff1';ctx.font='bold 13px sans-serif';ctx.textAlign='left';ctx.fillText('步'+moves+(limit<900?('/'+limit):'')+' 最优'+par+(boss?' 👑':''),10,22);
  ctx.fillStyle='#90caf9';ctx.font='12px sans-serif';ctx.fillText('↩撤销',16,H-22);if(towLeft)ctx.fillText('拖车'+towLeft,W-70,H-22);}
window.__T={go(n){prog.seenTut=1;saveProg(prog);startLevel(n|0||1);},win(){if(state!=='play')startLevel(lvl||1);doWin();},lose(){if(state!=='play')startLevel(lvl||1);lose('测试失败');},state(){return{state,lvl,score,boss,moves,par}},kit:{get state(){return state;}}};


function finishWin(stars,gain,title){state='over';const prev=prog.stars[lvl]|0;if(stars>prev)prog.stars[lvl]=stars;prog.coins+=gain;if(lvl>=prog.unlock&&lvl<TOTAL)prog.unlock=lvl+1;saveProg(prog);if(score>best){best=score;UI.storageSet(HK,best);$('best').textContent=best;}$('overH').textContent=title||'过关！';$('finalScore').textContent='★'.repeat(stars);$('overText').textContent='关卡 '+lvl+' · +'+gain+'币';show('overScr',true);beep(880,.2);}
function finishLose(msg){state='over';$('overH').textContent='失败';$('finalScore').textContent='💀';$('overText').textContent=(msg||'')+' · 得分 '+score;show('overScr',true);beep(160,.35,'triangle');}
function tutorial(steps,done){let i=0;show('tutScr',true);const paint=()=>{$('tutH').textContent=steps[i][0];$('tutP').textContent=steps[i][1];$('tutStep').textContent=(i+1)+'/'+steps.length;};paint();$('tutNext').onclick=()=>{i++;if(i>=steps.length){show('tutScr',false);done();}else paint();};$('tutSkip').onclick=()=>{show('tutScr',false);done();};}
function openLevels(){state='menu';show('startScr',false);show('shopScr',false);show('overScr',false);show('pauseOv',false);show('tutScr',false);show('lvlScr',true);$('lvlInfo').textContent='解锁 '+prog.unlock+'/'+TOTAL+' · 币 '+prog.coins;const g=$('lvgrid');g.innerHTML='';for(let i=1;i<=TOTAL;i++){const b=document.createElement('button');b.className='btn lvl';const locked=i>prog.unlock;const st=prog.stars[i]|0;b.innerHTML=locked?'🔒':(i%5===0?'👑':'')+i+'<small>'+'★'.repeat(st)+'</small>';b.disabled=locked;if(!locked)b.onclick=()=>enter(i);g.appendChild(b);}}
function enter(n){const go=()=>startLevel(n);if(!prog.seenTut){prog.seenTut=1;saveProg(prog);tutorial(TUT,go);}else go();}
function openShop(){show('lvlScr',false);show('shopScr',true);$('coinLine').textContent='金币：'+prog.coins;const box=$('shopList');box.innerHTML='';for(const it of SHOP){if(prog[it.k]==null)prog[it.k]=0;const row=document.createElement('div');row.className='row';row.innerHTML='<div><b>'+it.name+'</b><br><small>'+it.desc()+'</small></div>';const btn=document.createElement('button');btn.className='btn';const maxed=prog[it.k]>=it.max;const cost=it.cost();btn.textContent=maxed?'满':cost+'币';btn.disabled=maxed||prog.coins<cost;btn.onclick=()=>{prog.coins-=cost;prog[it.k]++;saveProg(prog);beep(900,.1);openShop();};row.appendChild(btn);box.appendChild(row);}}
$('startBtn').onclick=openLevels;$('backStart').onclick=()=>{show('lvlScr',false);show('startScr',true);};
$('shopBtn').onclick=openShop;$('shopBack').onclick=openLevels;

$('resumeBtn').onclick=()=>{state='play';last=performance.now();show('pauseOv',false);};
$('restartBtn').onclick=()=>{show('pauseOv',false);startLevel(lvl);};
$('menuBtn').onclick=()=>{show('pauseOv',false);state='menu';openLevels();};
$('againBtn').onclick=()=>startLevel(lvl);
$('nextBtn').onclick=()=>{if(lvl<TOTAL)startLevel(lvl+1);else openLevels();};
$('menu2Btn').onclick=()=>{show('overScr',false);openLevels();};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play'){state='pause';show('pauseOv',true);}});
requestAnimationFrame(function frame(t){const dt=Math.min(.05,(t-last)/1000);last=t;if(state==='play'&&typeof update==='function')update(dt);if(typeof draw==='function')draw();requestAnimationFrame(frame);});

</script>
</body></html>
