<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>象棋</title>
<style>
html.game-ui #pauseBtn,html.game-ui #muteBtn{min-width:44px;min-height:44px}
html.game-ui #cv{max-width:min(420px,calc((100vh - 220px)*0.887));max-width:min(420px,calc((100svh - 220px)*0.887))}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#0d0a16;color:#f0eaff;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;display:flex;justify-content:center;min-height:100vh;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.wrap{width:100%;max-width:460px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:8px}
.topbar{width:100%;display:flex;justify-content:space-between;align-items:center;font-size:18px}
.topbar .title{color:#c39bff;font-weight:700}
#status{color:#ffd76a;font-size:15px;min-height:20px;text-align:center;flex:1;padding:0 8px}
.tbtns{display:flex;gap:8px}
.iconbtn{background:#2a2140;border:1px solid #6b4fa8;color:#fff;font-size:20px;width:44px;height:44px;border-radius:12px;cursor:pointer}
.iconbtn:active{transform:scale(.93)}
.scorebar{width:100%;display:flex;justify-content:space-between;font-size:13px;color:#9d8fc7}
canvas{width:100%;max-width:420px;height:auto;touch-action:none;border-radius:12px;background:#171224}
.hint{color:#8f83b3;font-size:13px;text-align:center}
.overlay{position:fixed;inset:0;background:rgba(10,6,20,.9);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;z-index:20;padding:24px;text-align:center}
.overlay.hidden{display:none}
.overlay h1{font-size:32px;color:#c39bff}
.overlay p{color:#bdb2dd;font-size:15px;line-height:1.8}
.btn{background:linear-gradient(135deg,#8e44ad,#6c3483);border:none;color:#fff;font-size:19px;font-weight:700;padding:13px 54px;border-radius:14px;cursor:pointer;min-height:52px}
.btn:active{transform:scale(.95)}
.kbd{color:#ffd76a}
</style>
<!-- GAME UI BEGIN -->
<style>
:root{--page:#eee1c7;--surface:#fff7e7;--soft:#e5d1ab;--ink:#302d23;--muted:#70654d;--accent:#3f5b43;--on-accent:#ffffff;--line:#bea77a;--stage:#654e31;--page:#f0803c;--surface:#fff7e6;--soft:#fce3c0;--ink:#4a2a12;--muted:#7f5b3a;--accent:#246f39;--on-accent:#ffffff;--line:#f1a54f;--b-bg1:#ffcf6b;--b-bg2:#f0803c;--b-btn:#3fc163;--b-btn-hi:#82d79a;--b-edge:#22863d;--b-glow:#ffe08a;--b-glow-rgb:255,224,138;--b-pedge-rgb:241,165,79;--b-btn-ink:#124620;--b-btn-tsh:0 1px 0 rgba(255,255,255,.45);--b-coin-ink:#124620;--b-coin-tsh:none;--b-key-ink:#246f39;--b-title:#1d7234}
/* Shared presentation only; mechanics and state remain inside each standalone game. */
html.game-ui{background:var(--page);color:var(--ink);color-scheme:light;font-family:"Bahnschrift","Microsoft YaHei UI","PingFang SC",sans-serif}
html.game-ui:is([data-theme="space"],[data-theme="arcade"],[data-theme="lab"],[data-theme="ocean"],[data-theme="magic"]){color-scheme:dark}
.game-ui body{background:var(--page);color:var(--ink);font-family:inherit;overscroll-behavior:none}
.game-ui body>.wrap{padding:20px 16px max(20px,env(safe-area-inset-bottom));gap:14px;max-width:500px}
.game-ui #app{background:var(--page);color:var(--ink)}
.game-ui :is(.topbar,#topbar){gap:8px;flex-wrap:wrap;min-height:58px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:10px 12px;box-shadow:0 3px 0 var(--soft);font-size:13px}
.game-ui :is(.title,.tb-title,.tb-title,#topbar .t,.topbar .t){color:var(--ink);font-size:16px;font-weight:750;letter-spacing:0}
.game-ui :is(.topbar,.hud,#hud,#topbar) :is(b,.v){color:var(--accent);font-variant-numeric:tabular-nums}
.game-ui :is(.stat,.topbar .s,.topbar .stat,.scorebar,.stats,.tip,.hint,.hintline,.hsline,.best,.hiscore){color:var(--muted);line-height:1.7}
.game-ui :is(.hint,.hintline,.tip){font-size:12px;max-width:40em;text-wrap:pretty}
.game-ui .scorebar{padding:6px 10px;gap:8px;flex-wrap:wrap}
.game-ui :is(.iconbtn,.iconBtn,.icobtn,.ibtn,.tbtn,.hbtn,.ib,.iconBtn,.pause){min-width:44px;min-height:44px;flex-shrink:0;border-radius:12px;background:var(--soft);color:var(--ink);border:1px solid var(--line);box-shadow:none;font-size:17px}
.game-ui button{font-family:inherit;cursor:pointer;touch-action:manipulation}
.game-ui button:focus-visible,.game-ui [tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.game-ui :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn){background:var(--accent);color:var(--on-accent);border:1px solid transparent;border-radius:13px;min-height:50px;padding:13px 28px;font-size:16px;font-weight:750;letter-spacing:0;box-shadow:0 4px 0 var(--line);text-shadow:none;max-width:100%}
.game-ui :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn):active{box-shadow:none;transform:translateY(2px)}
.game-ui :is(.ghost,.ghostbtn,.btn2,.abtn,.toolbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line);box-shadow:none;border-radius:12px;min-height:44px}
.game-ui :is(.rowbtns,.btnrow,.ctlrow){gap:10px;flex-wrap:wrap;justify-content:center}
.game-ui :is(.pill,.hudbox,.hud .p){background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:none;font-variant-numeric:tabular-nums}
.game-ui :is(.dbtn,.cbtn,.gbtn,.holdbtn,.firebtn,.bombbtn,.jumpbtn,.pumpbtn,.nbtn){border-radius:12px;box-shadow:0 3px 0 var(--line);min-height:44px}
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv,.screen):has(>.ui-panel){padding:20px;overflow-y:auto;overscroll-behavior:contain}
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv):has(>.ui-panel){background:var(--page);backdrop-filter:none;justify-content:safe center;align-items:center}
.game-ui .ui-panel{width:min(100%,380px);max-height:100%;overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:18px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:24px;padding:30px 24px;box-shadow:0 8px 0 var(--soft),0 20px 48px #15253618;text-align:center;margin:auto}
.game-ui .ui-panel :is(.card,.panel,.pausecard,.ovcard){display:contents}
.game-ui .ui-panel :is(h1,h2,.gamename,.gametitle){font-size:30px;line-height:1.25;font-weight:800;color:var(--ink);background:none;-webkit-text-fill-color:currentColor;text-shadow:none;letter-spacing:-.6px;margin:0}
.game-ui .ui-panel :is(p,.howto,.sub,.rule){font-size:14px;line-height:1.85;color:var(--muted);background:none;border:0;box-shadow:none;padding:0;margin:0;max-width:32em;text-align:left;white-space:normal}
.game-ui .ui-panel :is(.bigemoji,.bigemoji,.ic,.big):not(.bigscore){animation:none;filter:none;text-shadow:none}
.game-ui .ui-emblem{width:90px;height:90px;display:grid;place-items:center;border:1px solid var(--line);border-radius:28px;background:var(--soft);font-size:48px;line-height:1;flex-shrink:0;position:relative}
.game-ui[data-theme="wood"] .ui-emblem{border-radius:50%;box-shadow:inset 0 0 0 5px var(--surface),inset 0 0 0 6px var(--line)}
.game-ui[data-theme="wood"] .ui-panel h1{font-family:"STKaiti","KaiTi","Microsoft YaHei",serif;letter-spacing:2px}
.game-ui[data-theme="ice"] .ui-emblem{border-radius:26px 8px 26px 8px}
.game-ui[data-theme="space"] .ui-emblem{background:radial-gradient(circle at center,var(--soft) 42%,transparent 43%),var(--surface);border-radius:50%;outline:1px solid var(--line);outline-offset:7px;margin:7px}
.game-ui[data-theme="kitchen"] .ui-emblem{border-radius:22px;border-bottom:5px solid var(--line)}
.game-ui .ui-panel :is(.score,.bigscore,.bigScore,.scorebig){color:var(--accent);font-size:48px;font-weight:800;font-variant-numeric:tabular-nums}
.game-ui .ui-panel :is(.best,.hsline,.hiscore,.endstats,.endstats b){color:var(--muted);font-size:13px;line-height:1.8}
.game-ui .ui-mode{display:grid;grid-template-columns:1fr 1fr;gap:5px;background:var(--soft);padding:5px;border:1px solid var(--line);border-radius:14px;width:100%}
.game-ui .ui-mode button{min-height:44px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-size:14px;font-weight:700;box-shadow:none}
.game-ui .ui-mode button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 2px 5px #1525361a}
.game-ui .ui-panel .ui-mode-note{font-size:12px;line-height:1.6;text-align:center;color:var(--muted)}
.game-ui .ui-mode-status{display:block;padding:5px 10px;color:var(--accent);font-size:11px;font-weight:700;line-height:1.5;text-align:center;border:1px solid var(--line);border-radius:8px;background:var(--surface);margin:4px auto;max-width:100%;pointer-events:none}
.game-ui body>.wrap>canvas:not(#fx){background-color:var(--stage);box-shadow:0 0 0 1px var(--line),0 6px 0 var(--soft);border-radius:18px;flex-shrink:0}
.game-ui .screen>canvas.game{box-shadow:0 0 0 1px var(--line),0 6px 0 var(--soft)}
.game-ui #hud{gap:6px;background:var(--surface);color:var(--ink)}
.game-ui #hud :is(.left,.t,.s,.grp,.pill){color:var(--ink)}
.game-ui #hud .pill{background:var(--surface);border-color:var(--line)}
.game-ui body canvas:is(#cv,#game,#board){background-color:var(--stage)}
.game-ui :is(button.dbtn,button.cbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.game-ui :is(button.lvl,button.lvlbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line);border-radius:12px;min-height:54px}
.game-ui :is(button.lvl,button.lvlbtn) :is(.nc,.sz,small){color:var(--muted)}
.game-ui .ui-panel button.lvl{margin:0;min-width:44px;box-shadow:none;padding:8px}
.game-ui #hud :is(.left,.right,.hudl,.hbtns){gap:5px;flex-wrap:wrap}
.game-ui #hud :is(.left,.hudl){min-width:0;flex-shrink:1}
.game-ui #hud :is(.pill,.left){font-size:12px}
.game-ui button:disabled{cursor:default;opacity:.45;box-shadow:none}
.game-ui .ui-panel .ui-assist-note{color:var(--accent);font-weight:700}
@media(min-width:700px){.game-ui body>.wrap{padding-top:32px}.game-ui .ui-panel{padding:36px 30px}}
@media(max-width:360px){.game-ui body>.wrap{padding:10px;gap:10px}.game-ui .ui-panel{padding:22px 18px;gap:13px}.game-ui .ui-panel h1{font-size:26px}.game-ui .ui-emblem{width:70px;height:70px;font-size:38px}.game-ui :is(.topbar,#topbar){gap:5px;padding:8px}.game-ui :is(.iconbtn,.icobtn,.ibtn,.tbtn,.ib){min-width:40px;min-height:44px}}
@media(max-height:650px){.game-ui .ui-panel{padding:18px;gap:12px}.game-ui .ui-emblem{width:60px;height:60px;font-size:32px}.game-ui .ui-panel h1{font-size:25px}.game-ui .ui-panel :is(p,.howto,.sub,.rule){font-size:13px}}
@media(prefers-reduced-motion:reduce){.game-ui *, .game-ui *::before,.game-ui *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
/* 2026-10-20 热修：开局/结算遮罩铺满整屏，主按钮固定在面板底部，避免被画布尺寸裁切（#10） */
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv):has(>.ui-panel){position:fixed;inset:0;z-index:1000;border-radius:0;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
.game-ui .ui-panel{touch-action:pan-y}
.game-ui .ui-panel :is(#startBtn,#btnStart,.startbtn,#bStart,#restartBtn,#btnRestart,#againBtn,#btnAgain,#retryBtn,#btnRetry,#playBtn,#btnPlay){position:sticky;bottom:0;z-index:3;flex-shrink:0}
.game-ui .ui-panel :not(.card,.panel,.pausecard,.ovcard,.ui-mode):has(>:is(#startBtn,#btnStart,.startbtn,#bStart,#restartBtn,#btnRestart,#againBtn,#btnAgain,#retryBtn,#btnRetry,#playBtn,#btnPlay)){position:sticky;bottom:0;z-index:3;flex-shrink:0;background:var(--surface);box-shadow:0 -10px 10px -6px var(--surface)}

html[data-game="xiangqi"] #status{color:#765224}

/* ===== Direction B · 霓虹糖果 Pop Arcade ===== saturated gradients, chunky bevels with a hard bottom edge, sticker panels, neon on dark themes */

html.game-ui[data-skin="b"],html.game-ui[data-skin="b"] body,html.game-ui[data-skin="b"] #app,html.game-ui[data-skin="b"] :is(.overlay,.ov,#ov,#overlay,#pauseOv):has(>.ui-panel){background:var(--bg);background-color:var(--b-bg2)}

<script>
/* GAMEPLAY UPGRADE */
'use strict';
/* ================= 纯逻辑层（走法/规则/AI），可被 node 测试复用 ================= */
const FILES=9, RANKS=10;
const VAL={K:100000,A:150,E:150,H:300,R:500,C:300,P:100};
function newBoard(){
  const b=Array.from({length:RANKS},()=>Array(FILES).fill(null));

}
function colorOf(p){ return p===p.toUpperCase()?'r':'b'; }
function typeOf(p){ return p.toUpperCase(); }

  for(let y=0;y<10;y++)for(let x=0;x<9;x++) if(b[y][x]===k) return {x,y};
  return null; }

  const r=findKing(b,'r'), k=findKing(b,'k');
  if(!r||!k||r.x!==k.x) return false;

/* 伪合法走法（不含照面/送将过滤） */
function genMoves(b,x,y){
  const p=b[y][x]; if(!p) return [];
  const c=colorOf(p), t=typeOf(p), ms=[];

    if(!inB(tx,ty)) return;

    const ds=[[2,2],[2,-2],[-2,2],[-2,-2]];

      const tx=x+d[0], ty=y+d[1];

    const ds=[[1,2],[2,1],[2,-1],[1,-2],[-1,-2],[-2,-1],[-2,1],[-1,2]];

        const q=b[ty][tx];

          else screen=true;
        }else{
          if(q){ if(colorOf(q)!==c) ms.push({fx:x,fy:y,tx,ty,cap:q}); break; }

}

function attacked(b,x,y,by){

function genAllLegal(b,side){

    const p=b[y][x];

function evaluate(b){

function aiBestMove(b){

  }
  if(glow){ ctx.strokeStyle='#ffd76a'; ctx.lineWidth=4;
    ctx.beginPath(); ctx.arc(px,py,R+5,0,Math.PI*2); ctx.stroke(); }
  const grad=ctx.createRadialGradient(px-6,py-8,4,px,py,R);
  grad.addColorStop(0,'#fff3d9');grad.addColorStop(1,'#d0af73');
  ctx.fillStyle=grad;
  ctx.beginPath(); ctx.arc(px,py,R,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle=c==='r'?'#a83b31':'#4c4b3e'; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.arc(px,py,R,0,Math.PI*2); ctx.stroke();
  ctx.fillStyle=c==='r'?'#a02e27':'#343a34';
  ctx.font='bold 30px "PingFang SC","Microsoft YaHei",serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(GLYPH[t][c==='r'?0:1],px,py+1);
}
function easeOut(p){ return 1-Math.pow(1-p,3); }
function draw(now){
  drawBoard();
  if(lastMove){
    ctx.fillStyle='rgba(255,215,106,0.18)';
    ctx.fillRect(cx(lastMove.fx)-CELL/2, cy(lastMove.fy)-CELL/2, CELL, CELL);
    ctx.fillRect(cx(lastMove.tx)-CELL/2, cy(lastMove.ty)-CELL/2, CELL, CELL);
  }
  for(let y=0;y<10;y++)for(let x=0;x<9;x++){
    const p=board[y][x];
    if(!p) continue;
    if(anim&&anim.m.fx===x&&anim.m.fy===y) continue;
    const isSel=selected&&selected.x===x&&selected.y===y;
    drawPieceAt(cx(x),cy(y),p,isSel);
  }
  if(selected){
    for(const m of selMoves){
      const px=cx(m.tx), py=cy(m.ty);
      if(m.cap){
        ctx.strokeStyle='#ff5b5b'; ctx.lineWidth=4;
        ctx.beginPath(); ctx.arc(px,py,CELL*0.44+4,0,Math.PI*2); ctx.stroke();
      }else{
        ctx.fillStyle='rgba(142,255,110,0.85)';
        ctx.beginPath(); ctx.arc(px,py,7,0,Math.PI*2); ctx.fill();
      }
    }
  }
  if(anim){
    const p=Math.min(1,(now-anim.t0)/180), e=easeOut(p);
    const px=cx(anim.m.fx)+(cx(anim.m.tx)-cx(anim.m.fx))*e;
    const py=cy(anim.m.fy)+(cy(anim.m.ty)-cy(anim.m.fy))*e;
    drawPieceAt(px,py,anim.piece,false);
    if(p>=1) anim=null;
  }
  particles=particles.filter(pt=>{
    const age=now-pt.t0;
    if(age>pt.life) return false;
    const k=age/pt.life;
    ctx.globalAlpha=1-k;
    ctx.fillStyle=pt.color;
    ctx.beginPath(); ctx.arc(pt.x+pt.vx*k,pt.y+pt.vy*k,pt.r*(1-k*0.5),0,Math.PI*2); ctx.fill();
    ctx.globalAlpha=1;
    return true;
  });
  floaters=floaters.filter(f=>{
    const age=now-f.t0;
    if(age>1100) return false;
    const k=age/1100;
    ctx.globalAlpha=1-k;
    ctx.fillStyle=f.color;
    ctx.font='bold 34px "PingFang SC","Microsoft YaHei",serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(f.txt,f.x,f.y-50*k);
    ctx.globalAlpha=1;
    return true;
  });
  requestAnimationFrame(draw);
}
function spawnBurst(x,y,color){
  const now=performance.now();
  for(let i=0;i<14;i++){
    const a=Math.random()*Math.PI*2, sp=40+Math.random()*90;
    particles.push({x:cx(x),y:cy(y),vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-30,
      r:3+Math.random()*4,color:color,t0:now,life:500+Math.random()*400});
  }
}
function floater(x,y,txt,color){
  floaters.push({x:cx(x),y:cy(y)-20,txt:txt,color:color,t0:performance.now()});
}

/* ---------- 状态 ---------- */
function setStatus(s){ $('status').textContent=s; }
function updateBar(){
  $('scoreLine').textContent='得分 '+score;
  $('hsLine').textContent='最高 '+best;
  $('roundLine').textContent='第 '+(halfmoves+1)+' 手';
}
function saveBest(){
  if(score>best){ best=score; try{ GameUI.storageSet(HS_KEY,String(best)); }catch(e){} }
  updateBar();
}

/* ---------- 走棋流程 ---------- */
function doMove(m,byAI){
  const piece=board[m.fy][m.fx];
  const captured=!!m.cap;
  anim={m:m,piece:piece,t0:performance.now()};
  lastMove=m;
  board=applyMove(board,m);
  halfmoves++;
  if(captured){ noCap=0; } else { noCap++; }
  selected=null; selMoves=[];
  if(captured){ sfx.capture(); spawnBurst(m.tx,m.ty,'#ffd76a'); vibrate(60); }
  else sfx.move();
  updateBar();
  const foe=byAI?'r':'b';
  const foeKing=findKing(board,foe);
  if(!foeKing){ endGame(byAI?'lose':'win',byAI?'你的帅被吃了！':'你吃掉了对方的将！'); return; }
  const chk=inCheck(board,foe);
  if(chk){
    floater(foeKing.x,foeKing.y,'将军！','#ff5b5b');
    sfx.check(); vibrate([70,40,70]);
  }
  const replies=genAllLegal(board,foe);
  if(replies.length===0){
    endGame(byAI?'lose':'win',chk?'绝杀！对方无子可走':'对方无子可走（困毙）');
    return;
  }
  if(noCap>=120){ endGame('draw','60 回合无吃子，和棋'); return; }
  if(byAI){
    turn='r'; aiThinking=false;
    setStatus(chk?'将军！轮到你走':'轮到你走');
  }else{
    turn='b';
    setStatus('AI 思考中…');
    aiThinking=true;
    scheduleAI(300+Math.random()*500);
  }
}
function scheduleAI(ms){
  if(aiTimer) clearTimeout(aiTimer);
  aiTimer=setTimeout(aiMove,ms);
}
function aiMove(){
  aiTimer=null;
  if(over||paused||turn!=='b') return;
  const m=aiBestMove(board);
  if(!m){ endGame('win','AI 无子可走，你赢了！'); return; }
  doMove(m,true);
}
function endGame(result,reason){
  over=true; aiThinking=false;
  if(aiTimer){ clearTimeout(aiTimer); aiTimer=null; }
  let title, pts;
  if(result==='win'){ title='🏆 你赢了！'; pts=100+Math.max(0,50-Math.ceil(halfmoves/2))*2; sfx.win(); vibrate([80,50,120]); }
  else if(result==='lose'){ title='😢 你输了'; pts=0; sfx.lose(); vibrate(120); }
  else{ title='🤝 和棋'; pts=30; sfx.draw(); }
  score=pts; saveBest();
  $('overTitle').textContent=title;
  $('overText').innerHTML=reason+'<br>本局得分 <b style="color:#ffd76a">'+pts+'</b> · 历史最高 '+best;
  $('overScr').classList.remove('hidden');
  setStatus(title);
}

/* ---------- 输入 ---------- */
cv.addEventListener('pointerdown',e=>{
  if(over||paused||turn!=='r'||aiThinking||anim) return;
  const rect=cv.getBoundingClientRect();
  const gx=Math.round(((e.clientX-rect.left)/rect.width*W-M)/CELL);
  const gy=Math.round(((e.clientY-rect.top)/rect.height*H-M)/CELL);
  if(!inB(gx,gy)) return;
  const p=board[gy][gx];
  if(selected){
    const hit=selMoves.find(m=>m.tx===gx&&m.ty===gy);
    if(hit){ doMove(hit,false); return; }
    if(p&&colorOf(p)==='r'){
      if(selected.x===gx&&selected.y===gy){ selected=null; selMoves=[]; return; }
      selectAt(gx,gy); return;
    }
    selected=null; selMoves=[]; return;
  }
  if(p&&colorOf(p)==='r') selectAt(gx,gy);
});
function selectAt(x,y){
  selected={x,y};
  selMoves=genAllLegal(board,'r').filter(m=>m.fx===x&&m.fy===y);
  sfx.select();
}
cv.addEventListener('contextmenu',e=>e.preventDefault());

/* ---------- 按钮 ---------- */
function startGame(){
  board=newBoard(); turn='r';
  selected=null; selMoves=[]; over=false; paused=false; aiThinking=false;
  halfmoves=0; noCap=0; score=0; anim=null; lastMove=null;
  particles=[]; floaters=[];
  needAI=false;
  if(aiTimer){ clearTimeout(aiTimer); aiTimer=null; }
  $('startScr').classList.add('hidden');
  $('overScr').classList.add('hidden');
  $('pauseScr').classList.add('hidden');
  setStatus('轮到你走'); updateBar();
}
$('startBtn').addEventListener('click',()=>{ ac(); startGame(); });
$('restartBtn').addEventListener('click',()=>{ startGame(); });
$('pauseBtn').addEventListener('click',()=>{
  if(over) return;
  if($('startScr').classList.contains('hidden')===false) return;
  paused=true;
  if(aiTimer){ clearTimeout(aiTimer); aiTimer=null; needAI=aiThinking; }
  aiThinking=false;
  $('pauseScr').classList.remove('hidden');
});
$('resumeBtn').addEventListener('click',()=>{
  paused=false;
  $('pauseScr').classList.add('hidden');
  if(needAI&&turn==='b'&&!over){ needAI=false; aiThinking=true; scheduleAI(400); }
});
function refreshMute(){ $('muteBtn').textContent=muted?'🔇':'🔊'; }
$('muteBtn').addEventListener('click',()=>{
  muted=!muted;
  try{ GameUI.storageSet(MUTE_KEY,muted?'1':'0'); }catch(e){}
  refreshMute();
  if(!muted) sfx.select();
});
refreshMute();
/* 初始预设棋盘（开始界面后才真正开局） */
board=newBoard(); turn='r'; selected=null; selMoves=[];
over=true; paused=false; aiThinking=false;
halfmoves=0; noCap=0; score=0; anim=null; lastMove=null;
particles=[]; floaters=[];
updateBar();
requestAnimationFrame(draw);
</script>
