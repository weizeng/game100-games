<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>象棋</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#0d0a16;color:#f0eaff;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;display:flex;justify-content:center;min-height:100vh;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.wrap{width:100%;max-width:460px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:8px}
.topbar{width:100%;display:flex;justify-content:space-between;align-items:center;font-size:18px}
.topbar .title{color:#c39bff;font-weight:700}
#status{color:#ffd76a;font-size:15px;min-height:20px;text-align:center;flex:1;padding:0 8px}
.tbtns{display:flex;gap:8px}
.iconbtn{background:#2a2140;border:1px solid #6b4fa8;color:#fff;font-size:20px;width:44px;height:44px;border-radius:12px;cursor:pointer}
.iconbtn:active{transform:scale(.93)}
.scorebar{width:100%;display:flex;justify-content:space-between;font-size:13px;color:#9d8fc7}
canvas{width:100%;max-width:420px;height:auto;touch-action:none;border-radius:12px;background:#171224}
.hint{color:#8f83b3;font-size:13px;text-align:center}
.overlay{position:fixed;inset:0;background:rgba(10,6,20,.9);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;z-index:20;padding:24px;text-align:center}
.overlay.hidden{display:none}
.overlay h1{font-size:32px;color:#c39bff}
.overlay p{color:#bdb2dd;font-size:15px;line-height:1.8}
.btn{background:linear-gradient(135deg,#8e44ad,#6c3483);border:none;color:#fff;font-size:19px;font-weight:700;padding:13px 54px;border-radius:14px;cursor:pointer;min-height:52px}
.btn:active{transform:scale(.95)}
.kbd{color:#ffd76a}
</style>
</head>
<body>
<div class="wrap">
<div class="topbar"><span class="title">♟️ 象棋</span><span id="status">楚河汉界</span><span class="tbtns"><button class="iconbtn" id="pauseBtn">⏸</button><button class="iconbtn" id="muteBtn">🔊</button></span></div>
<div class="scorebar"><span id="scoreLine">得分 0</span><span id="roundLine">第 1 手</span><span id="hsLine">最高 0</span></div>
<canvas id="cv" width="420" height="474"></canvas>
<div class="hint">你执🔴红先行 · 点棋子选中 → 绿点为可走位 → 点目标走棋</div>
</div>
<div class="overlay" id="startScr"><h1>♟️ 中国象棋</h1><p>人机对战，你执<span class="kbd">红先行</span>。<br>点击己方棋子选中，高亮显示可走位，<br>再点目标格走棋；点已选中棋子可取消。<br>吃掉对方的 <span class="kbd">将</span> 即获胜！<br>⚠️ 60 回合无吃子判和棋，无子可走判负。</p><button class="btn" id="startBtn">开始对弈</button></div>
<div class="overlay hidden" id="pauseScr"><h1>⏸ 已暂停</h1><p>棋盘已遮盖，AI 计时已冻结</p><button class="btn" id="resumeBtn">继续</button></div>
<div class="overlay hidden" id="overScr"><h1 id="overTitle">对局结束</h1><p id="overText"></p><button class="btn" id="restartBtn">再来一局</button></div>
<script>
'use strict';
/* ================= 纯逻辑层（走法/规则/AI），可被 node 测试复用 ================= */
const FILES=9, RANKS=10;
const VAL={K:100000,A:150,E:150,H:300,R:500,C:300,P:100};
function newBoard(){
  const b=Array.from({length:RANKS},()=>Array(FILES).fill(null));
  const back=['r','h','e','a','k','a','e','h','r'];
  for(let x=0;x<9;x++){ b[0][x]=back[x]; b[9][x]=back[x].toUpperCase(); }
  b[2][1]='c'; b[2][7]='c'; b[7][1]='C'; b[7][7]='C';
  for(let x=0;x<9;x+=2){ b[3][x]='p'; b[6][x]='P'; }
  return b;
}
function colorOf(p){ return p===p.toUpperCase()?'r':'b'; }
function typeOf(p){ return p.toUpperCase(); }
function inB(x,y){ return x>=0&&x<9&&y>=0&&y<10; }
function inPalace(x,y,c){ return x>=3&&x<=5&&(c==='r'?y>=7:y<=2); }
function findKing(b,c){ const k=c==='r'?'K':'k';
  for(let y=0;y<10;y++)for(let x=0;x<9;x++) if(b[y][x]===k) return {x,y};
  return null; }
function kingsFacing(b){
  const r=findKing(b,'r'), k=findKing(b,'k');
  if(!r||!k||r.x!==k.x) return false;
  const y1=r.y<k.y?r.y:k.y, y2=r.y<k.y?k.y:r.y;
  for(let y=y1+1;y<y2;y++) if(b[y][r.x]) return false;
  return true;
}
function applyMove(b,m){
  const nb=b.map(row=>row.slice());
  nb[m.ty][m.tx]=nb[m.fy][m.fx]; nb[m.fy][m.fx]=null;
  return nb;
}
/* 伪合法走法（不含照面/送将过滤） */
function genMoves(b,x,y){
  const p=b[y][x]; if(!p) return [];
  const c=colorOf(p), t=typeOf(p), ms=[];
  const add=(tx,ty)=>{
    if(!inB(tx,ty)) return;
    const q=b[ty][tx];
    if(!q||colorOf(q)!==c) ms.push({fx:x,fy:y,tx,ty,cap:q||null});
  };
  const slide=(dx,dy)=>{
    let tx=x+dx, ty=y+dy;
    while(inB(tx,ty)){
      const q=b[ty][tx];
      if(!q) ms.push({fx:x,fy:y,tx,ty,cap:null});
      else { if(colorOf(q)!==c) ms.push({fx:x,fy:y,tx,ty,cap:q}); break; }
      tx+=dx; ty+=dy;
    }
  };
  if(t==='K'){
    const ds=[[1,0],[-1,0],[0,1],[0,-1]];
    for(const d of ds){ const tx=x+d[0], ty=y+d[1]; if(inPalace(tx,ty,c)) add(tx,ty); }
  }else if(t==='A'){
    const ds=[[1,1],[1,-1],[-1,1],[-1,-1]];
    for(const d of ds){ const tx=x+d[0], ty=y+d[1]; if(inPalace(tx,ty,c)) add(tx,ty); }
  }else if(t==='E'){
    const ds=[[2,2],[2,-2],[-2,2],[-2,-2]];
    for(const d of ds){
      const tx=x+d[0], ty=y+d[1];
      if(!inB(tx,ty)) continue;
      if(c==='r'&&ty<5) continue;
      if(c==='b'&&ty>4) continue;
      if(!b[y+d[1]/2][x+d[0]/2]) add(tx,ty); /* 象眼 */
    }
  }else if(t==='H'){
    const ds=[[1,2],[2,1],[2,-1],[1,-2],[-1,-2],[-2,-1],[-2,1],[-1,2]];
    for(const d of ds){
      const tx=x+d[0], ty=y+d[1];
      if(!inB(tx,ty)) continue;
      const lx=x+(Math.abs(d[0])===2?d[0]/2:0);
      const ly=y+(Math.abs(d[1])===2?d[1]/2:0);
      if(!b[ly][lx]) add(tx,ty); /* 蹩马腿 */
    }
  }else if(t==='R'){
    slide(1,0); slide(-1,0); slide(0,1); slide(0,-1);
  }else if(t==='C'){
    const ds=[[1,0],[-1,0],[0,1],[0,-1]];
    for(const d of ds){
      let tx=x+d[0], ty=y+d[1], screen=false;
      while(inB(tx,ty)){
        const q=b[ty][tx];
        if(!screen){
          if(!q) ms.push({fx:x,fy:y,tx,ty,cap:null});
          else screen=true;
        }else{
          if(q){ if(colorOf(q)!==c) ms.push({fx:x,fy:y,tx,ty,cap:q}); break; }
        }
        tx+=d[0]; ty+=d[1];
      }
    }
  }else if(t==='P'){
    const fwd=c==='r'?-1:1;
    add(x,y+fwd);
    const crossed=c==='r'?y<=4:y>=5;
    if(crossed){ add(x+1,y); add(x-1,y); }
  }
  return ms;
}
/* (x,y) 是否被 by 方攻击 */
function attacked(b,x,y,by){
  const isE=(q,t)=>q&&colorOf(q)===by&&typeOf(q)===t;
  let q,tx,ty;
  const ortho=[[1,0],[-1,0],[0,1],[0,-1]];
  for(const d of ortho){ tx=x+d[0]; ty=y+d[1];
    if(inB(tx,ty)&&(q=b[ty][tx])&&isE(q,'K')) return true; }
  const diag=[[1,1],[1,-1],[-1,1],[-1,-1]];
  for(const d of diag){ tx=x+d[0]; ty=y+d[1];
    if(inB(tx,ty)&&(q=b[ty][tx])&&isE(q,'A')) return true; }
  for(const d of diag){
    const ex=x+d[0], ey=y+d[1]; tx=x+2*d[0]; ty=y+2*d[1];
    if(inB(tx,ty)&&!b[ey][ex]&&(q=b[ty][tx])&&isE(q,'E')) return true; }
  const hm=[[1,2],[2,1],[2,-1],[1,-2],[-1,-2],[-2,-1],[-2,1],[-1,2]];
  for(const d of hm){
    tx=x+d[0]; ty=y+d[1]; if(!inB(tx,ty)) continue;
    /* d 为目标->马方向，马->目标为反向，蹩马腿看马侧正交邻格 */
    const lx=tx+(Math.abs(d[0])===2?-d[0]/2:0);
    const ly=ty+(Math.abs(d[1])===2?-d[1]/2:0);
    if(!b[ly][lx]&&(q=b[ty][tx])&&isE(q,'H')) return true; }
  for(const d of ortho){
    tx=x+d[0]; ty=y+d[1]; let screen=false;
    while(inB(tx,ty)){
      q=b[ty][tx];
      if(q){
        if(!screen){ if(isE(q,'R')) return true; screen=true; }
        else { if(isE(q,'C')) return true; break; }
      }
      tx+=d[0]; ty+=d[1];
    }
  }
  const py=y+(by==='r'?1:-1);
  if(inB(x,py)&&(q=b[py][x])&&isE(q,'P')) return true;
  for(const s of [-1,1]){
    tx=x+s; if(!inB(tx,y)) continue;
    if((q=b[y][tx])&&isE(q,'P')){
      if(by==='r'&&y<=4) return true;
      if(by==='b'&&y>=5) return true;
    }
  }
  return false;
}
function inCheck(b,side){
  const k=findKing(b,side);
  return !!k&&attacked(b,k.x,k.y,side==='r'?'b':'r');
}
/* 完全合法走法：排除将帅照面、送将（走后己方被将军） */
function genAllLegal(b,side){
  const ms=[];
  for(let y=0;y<10;y++)for(let x=0;x<9;x++){
    const p=b[y][x];
    if(!p||colorOf(p)!==side) continue;
    for(const m of genMoves(b,x,y)){
      const nb=applyMove(b,m);
      if(kingsFacing(nb)) continue;
      const k=findKing(nb,side);
      if(k&&attacked(nb,k.x,k.y,side==='r'?'b':'r')) continue;
      ms.push(m);
    }
  }
  return ms;
}
/* 评估：红方视角，正值红优 */
function evaluate(b){
  let s=0;
  for(let y=0;y<10;y++)for(let x=0;x<9;x++){
    const p=b[y][x]; if(!p) continue;
    const t=typeOf(p), c=colorOf(p);
    let v=VAL[t];
    if(t==='P'){ if(c==='r'&&y<=4)v+=60; if(c==='b'&&y>=5)v+=60; }
    if((t==='R'||t==='H')&&x>=3&&x<=5) v+=20;
    if(t==='C'&&x>=3&&x<=5) v+=10;
    s+=c==='r'?v:-v;
  }
  return s;
}
/* 2层 minimax：黑方(AI)最小化。返回最佳走法 */
function aiBestMove(b){
  const moves=genAllLegal(b,'b');
  if(moves.length===0) return null;
  moves.sort((m1,m2)=>((m2.cap?VAL[typeOf(m2.cap)]:0)-(m1.cap?VAL[typeOf(m1.cap)]:0)));
  let best=moves[0], bestScore=Infinity;
  for(const m of moves){
    const nb=applyMove(b,m);
    if(!findKing(nb,'r')) return m; /* 直接吃帅 */
    const replies=genAllLegal(nb,'r');
    if(replies.length===0) return m; /* 将死/困毙 */
    replies.sort((r1,r2)=>((r2.cap?VAL[typeOf(r2.cap)]:0)-(r1.cap?VAL[typeOf(r1.cap)]:0)));
    let worst=-Infinity;
    for(const r of replies){
      const e=evaluate(applyMove(nb,r));
      if(e>worst) worst=e;
      if(worst>=bestScore) break; /* alpha 剪枝 */
    }
    if(worst<bestScore){ bestScore=worst; best=m; }
  }
  return best;
}
/*__UI__*/

/* ================= UI 层 ================= */
const $=id=>document.getElementById(id);
const cv=$('cv'), ctx=cv.getContext('2d');
const W=420, H=474, M=30, CELL=46;
const GLYPH={K:['帅','将'],A:['仕','士'],E:['相','象'],H:['傌','马'],R:['俥','车'],C:['炮','炮'],P:['兵','卒']};
const HS_KEY='g100_xiangqi_hs', MUTE_KEY='g100_mute';

let board, turn, selected, selMoves, over, paused, aiThinking;
let halfmoves, noCap, score, best, anim, particles, floaters, lastMove;
let aiTimer=null, needAI=false;
let muted=false;
try{ muted=localStorage.getItem(MUTE_KEY)==='1'; }catch(e){}
try{ best=parseInt(localStorage.getItem(HS_KEY)||'0',10)||0; }catch(e){ best=0; }

function cx(x){ return M+x*CELL; }
function cy(y){ return M+y*CELL; }

/* ---------- 音效 ---------- */
let AC=null;
function ac(){
  if(!AC){ const Ctor=window.AudioContext||window.webkitAudioContext; if(!Ctor) return null; AC=new Ctor(); }
  if(AC.state==='suspended') AC.resume();
  return AC;
}
function tone(f,d,type,g,when){
  if(muted) return;
  const a=ac(); if(!a) return;
  type=type||'sine'; g=g||0.15; when=when||0;
  const o=a.createOscillator(), v=a.createGain();
  o.type=type; o.frequency.value=f;
  const t0=a.currentTime+when;
  v.gain.setValueAtTime(g,t0);
  v.gain.exponentialRampToValueAtTime(0.001,t0+d);
  o.connect(v); v.connect(a.destination);
  o.start(t0); o.stop(t0+d+0.05);
}
const sfx={
  select(){ tone(700,0.07,'square',0.07); },
  move(){ tone(420,0.10,'triangle',0.20); tone(260,0.08,'triangle',0.12,0.03); },
  capture(){ tone(160,0.18,'sawtooth',0.22); tone(95,0.22,'square',0.15,0.04); },
  check(){ tone(880,0.12,'square',0.14); tone(660,0.16,'square',0.14,0.14); },
  win(){ const f=[523,659,784,1047]; for(let i=0;i<f.length;i++) tone(f[i],0.16,'triangle',0.18,i*0.12); },
  lose(){ const f=[392,311,262,196]; for(let i=0;i<f.length;i++) tone(f[i],0.18,'triangle',0.16,i*0.15); },
  draw(){ tone(520,0.14,'sine',0.15); tone(520,0.14,'sine',0.15,0.18); }
};
function vibrate(pat){ try{ if(navigator.vibrate) navigator.vibrate(pat); }catch(e){} }

/* ---------- 棋盘绘制 ---------- */
function drawStar(x,y){
  const px=cx(x), py=cy(y), L=10, g=5;
  ctx.strokeStyle='#8a6d3b'; ctx.lineWidth=2;
  const corners=[];
  if(x>0) corners.push([-1,-1],[-1,1]);
  if(x<8) corners.push([1,-1],[1,1]);
  for(const c of corners){
    ctx.beginPath();
    ctx.moveTo(px+c[0]*g, py+c[1]*g+c[1]*L);
    ctx.lineTo(px+c[0]*g, py+c[1]*g);
    ctx.lineTo(px+c[0]*g+c[0]*L, py+c[1]*g);
    ctx.stroke();
  }
}
function drawBoard(){
  ctx.fillStyle='#171224'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#231a30';
  roundRect(M-18,M-18,W-2*M+36,H-2*M+36,10); ctx.fill();
  ctx.strokeStyle='#6b4fa8'; ctx.lineWidth=2;
  roundRect(M-18,M-18,W-2*M+36,H-2*M+36,10); ctx.stroke();
  ctx.strokeStyle='#c9a24b'; ctx.lineWidth=2;
  for(let y=0;y<10;y++){
    ctx.beginPath(); ctx.moveTo(cx(0),cy(y)); ctx.lineTo(cx(8),cy(y)); ctx.stroke();
  }
  for(let x=0;x<9;x++){
    if(x===0||x===8){
      ctx.beginPath(); ctx.moveTo(cx(x),cy(0)); ctx.lineTo(cx(x),cy(9)); ctx.stroke();
    }else{
      ctx.beginPath(); ctx.moveTo(cx(x),cy(0)); ctx.lineTo(cx(x),cy(4)); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx(x),cy(5)); ctx.lineTo(cx(x),cy(9)); ctx.stroke();
    }
  }
  ctx.beginPath(); ctx.moveTo(cx(3),cy(0)); ctx.lineTo(cx(5),cy(2)); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx(5),cy(0)); ctx.lineTo(cx(3),cy(2)); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx(3),cy(7)); ctx.lineTo(cx(5),cy(9)); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx(5),cy(7)); ctx.lineTo(cx(3),cy(9)); ctx.stroke();
  const pts=[[1,2],[7,2],[1,7],[7,7],[0,3],[2,3],[4,3],[6,3],[8,3],[0,6],[2,6],[4,6],[6,6],[8,6]];
  for(const q of pts) drawStar(q[0],q[1]);
  ctx.fillStyle='#5d4a7a'; ctx.font='bold 26px "PingFang SC","Microsoft YaHei",serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('楚 河', cx(2), cy(4)+CELL/2);
  ctx.fillText('汉 界', cx(6), cy(4)+CELL/2);
}
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function drawPieceAt(px,py,p,glow){
  const c=colorOf(p), t=typeOf(p);
  const R=CELL*0.44;
  if(glow){ ctx.strokeStyle='#ffd76a'; ctx.lineWidth=4;
    ctx.beginPath(); ctx.arc(px,py,R+5,0,Math.PI*2); ctx.stroke(); }
  const grad=ctx.createRadialGradient(px-6,py-8,4,px,py,R);
  if(c==='r'){ grad.addColorStop(0,'#8a2a2a'); grad.addColorStop(1,'#4a1212'); }
  else{ grad.addColorStop(0,'#2a3f55'); grad.addColorStop(1,'#101c28'); }
  ctx.fillStyle=grad;
  ctx.beginPath(); ctx.arc(px,py,R,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle=c==='r'?'#ff7b6b':'#6fc3ff'; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.arc(px,py,R,0,Math.PI*2); ctx.stroke();
  ctx.fillStyle=c==='r'?'#ffb3a7':'#bfe3ff';
  ctx.font='bold 30px "PingFang SC","Microsoft YaHei",serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(GLYPH[t][c==='r'?0:1],px,py+1);
}
function easeOut(p){ return 1-Math.pow(1-p,3); }
function draw(now){
  drawBoard();
  if(lastMove){
    ctx.fillStyle='rgba(255,215,106,0.18)';
    ctx.fillRect(cx(lastMove.fx)-CELL/2, cy(lastMove.fy)-CELL/2, CELL, CELL);
    ctx.fillRect(cx(lastMove.tx)-CELL/2, cy(lastMove.ty)-CELL/2, CELL, CELL);
  }
  for(let y=0;y<10;y++)for(let x=0;x<9;x++){
    const p=board[y][x];
    if(!p) continue;
    if(anim&&anim.m.fx===x&&anim.m.fy===y) continue;
    const isSel=selected&&selected.x===x&&selected.y===y;
    drawPieceAt(cx(x),cy(y),p,isSel);
  }
  if(selected){
    for(const m of selMoves){
      const px=cx(m.tx), py=cy(m.ty);
      if(m.cap){
        ctx.strokeStyle='#ff5b5b'; ctx.lineWidth=4;
        ctx.beginPath(); ctx.arc(px,py,CELL*0.44+4,0,Math.PI*2); ctx.stroke();
      }else{
        ctx.fillStyle='rgba(142,255,110,0.85)';
        ctx.beginPath(); ctx.arc(px,py,7,0,Math.PI*2); ctx.fill();
      }
    }
  }
  if(anim){
    const p=Math.min(1,(now-anim.t0)/180), e=easeOut(p);
    const px=cx(anim.m.fx)+(cx(anim.m.tx)-cx(anim.m.fx))*e;
    const py=cy(anim.m.fy)+(cy(anim.m.ty)-cy(anim.m.fy))*e;
    drawPieceAt(px,py,anim.piece,false);
    if(p>=1) anim=null;
  }
  particles=particles.filter(pt=>{
    const age=now-pt.t0;
    if(age>pt.life) return false;
    const k=age/pt.life;
    ctx.globalAlpha=1-k;
    ctx.fillStyle=pt.color;
    ctx.beginPath(); ctx.arc(pt.x+pt.vx*k,pt.y+pt.vy*k,pt.r*(1-k*0.5),0,Math.PI*2); ctx.fill();
    ctx.globalAlpha=1;
    return true;
  });
  floaters=floaters.filter(f=>{
    const age=now-f.t0;
    if(age>1100) return false;
    const k=age/1100;
    ctx.globalAlpha=1-k;
    ctx.fillStyle=f.color;
    ctx.font='bold 34px "PingFang SC","Microsoft YaHei",serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(f.txt,f.x,f.y-50*k);
    ctx.globalAlpha=1;
    return true;
  });
  requestAnimationFrame(draw);
}
function spawnBurst(x,y,color){
  const now=performance.now();
  for(let i=0;i<14;i++){
    const a=Math.random()*Math.PI*2, sp=40+Math.random()*90;
    particles.push({x:cx(x),y:cy(y),vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-30,
      r:3+Math.random()*4,color:color,t0:now,life:500+Math.random()*400});
  }
}
function floater(x,y,txt,color){
  floaters.push({x:cx(x),y:cy(y)-20,txt:txt,color:color,t0:performance.now()});
}

/* ---------- 状态 ---------- */
function setStatus(s){ $('status').textContent=s; }
function updateBar(){
  $('scoreLine').textContent='得分 '+score;
  $('hsLine').textContent='最高 '+best;
  $('roundLine').textContent='第 '+(halfmoves+1)+' 手';
}
function saveBest(){
  if(score>best){ best=score; try{ localStorage.setItem(HS_KEY,String(best)); }catch(e){} }
  updateBar();
}

/* ---------- 走棋流程 ---------- */
function doMove(m,byAI){
  const piece=board[m.fy][m.fx];
  const captured=!!m.cap;
  anim={m:m,piece:piece,t0:performance.now()};
  lastMove=m;
  board=applyMove(board,m);
  halfmoves++;
  if(captured){ noCap=0; } else { noCap++; }
  selected=null; selMoves=[];
  if(captured){ sfx.capture(); spawnBurst(m.tx,m.ty,'#ffd76a'); vibrate(60); }
  else sfx.move();
  updateBar();
  const foe=byAI?'r':'b';
  const foeKing=findKing(board,foe);
  if(!foeKing){ endGame(byAI?'lose':'win',byAI?'你的帅被吃了！':'你吃掉了对方的将！'); return; }
  const chk=inCheck(board,foe);
  if(chk){
    floater(foeKing.x,foeKing.y,'将军！','#ff5b5b');
    sfx.check(); vibrate([70,40,70]);
  }
  const replies=genAllLegal(board,foe);
  if(replies.length===0){
    endGame(byAI?'lose':'win',chk?'绝杀！对方无子可走':'对方无子可走（困毙）');
    return;
  }
  if(noCap>=120){ endGame('draw','60 回合无吃子，和棋'); return; }
  if(byAI){
    turn='r'; aiThinking=false;
    setStatus(chk?'将军！轮到你走':'轮到你走');
  }else{
    turn='b';
    setStatus('AI 思考中…');
    aiThinking=true;
    scheduleAI(300+Math.random()*500);
  }
}
function scheduleAI(ms){
  if(aiTimer) clearTimeout(aiTimer);
  aiTimer=setTimeout(aiMove,ms);
}
function aiMove(){
  aiTimer=null;
  if(over||paused||turn!=='b') return;
  const m=aiBestMove(board);
  if(!m){ endGame('win','AI 无子可走，你赢了！'); return; }
  doMove(m,true);
}
function endGame(result,reason){
  over=true; aiThinking=false;
  if(aiTimer){ clearTimeout(aiTimer); aiTimer=null; }
  let title, pts;
  if(result==='win'){ title='🏆 你赢了！'; pts=100+Math.max(0,50-Math.ceil(halfmoves/2))*2; sfx.win(); vibrate([80,50,120]); }
  else if(result==='lose'){ title='😢 你输了'; pts=0; sfx.lose(); vibrate(120); }
  else{ title='🤝 和棋'; pts=30; sfx.draw(); }
  score=pts; saveBest();
  $('overTitle').textContent=title;
  $('overText').innerHTML=reason+'<br>本局得分 <b style="color:#ffd76a">'+pts+'</b> · 历史最高 '+best;
  $('overScr').classList.remove('hidden');
  setStatus(title);
}

/* ---------- 输入 ---------- */
cv.addEventListener('pointerdown',e=>{
  if(over||paused||turn!=='r'||aiThinking||anim) return;
  const rect=cv.getBoundingClientRect();
  const gx=Math.round(((e.clientX-rect.left)/rect.width*W-M)/CELL);
  const gy=Math.round(((e.clientY-rect.top)/rect.height*H-M)/CELL);
  if(!inB(gx,gy)) return;
  const p=board[gy][gx];
  if(selected){
    const hit=selMoves.find(m=>m.tx===gx&&m.ty===gy);
    if(hit){ doMove(hit,false); return; }
    if(p&&colorOf(p)==='r'){
      if(selected.x===gx&&selected.y===gy){ selected=null; selMoves=[]; return; }
      selectAt(gx,gy); return;
    }
    selected=null; selMoves=[]; return;
  }
  if(p&&colorOf(p)==='r') selectAt(gx,gy);
});
function selectAt(x,y){
  selected={x,y};
  selMoves=genAllLegal(board,'r').filter(m=>m.fx===x&&m.fy===y);
  sfx.select();
}
cv.addEventListener('contextmenu',e=>e.preventDefault());

/* ---------- 按钮 ---------- */
function startGame(){
  board=newBoard(); turn='r';
  selected=null; selMoves=[]; over=false; paused=false; aiThinking=false;
  halfmoves=0; noCap=0; score=0; anim=null; lastMove=null;
  particles=[]; floaters=[];
  needAI=false;
  if(aiTimer){ clearTimeout(aiTimer); aiTimer=null; }
  $('startScr').classList.add('hidden');
  $('overScr').classList.add('hidden');
  $('pauseScr').classList.add('hidden');
  setStatus('轮到你走'); updateBar();
}
$('startBtn').addEventListener('click',()=>{ ac(); startGame(); });
$('restartBtn').addEventListener('click',()=>{ startGame(); });
$('pauseBtn').addEventListener('click',()=>{
  if(over) return;
  if($('startScr').classList.contains('hidden')===false) return;
  paused=true;
  if(aiTimer){ clearTimeout(aiTimer); aiTimer=null; needAI=aiThinking; }
  aiThinking=false;
  $('pauseScr').classList.remove('hidden');
});
$('resumeBtn').addEventListener('click',()=>{
  paused=false;
  $('pauseScr').classList.add('hidden');
  if(needAI&&turn==='b'&&!over){ needAI=false; aiThinking=true; scheduleAI(400); }
});
function refreshMute(){ $('muteBtn').textContent=muted?'🔇':'🔊'; }
$('muteBtn').addEventListener('click',()=>{
  muted=!muted;
  try{ localStorage.setItem(MUTE_KEY,muted?'1':'0'); }catch(e){}
  refreshMute();
  if(!muted) sfx.select();
});
refreshMute();
/* 初始预设棋盘（开始界面后才真正开局） */
board=newBoard(); turn='r'; selected=null; selMoves=[];
over=true; paused=false; aiThinking=false;
halfmoves=0; noCap=0; score=0; anim=null; lastMove=null;
particles=[]; floaters=[];
updateBar();
requestAnimationFrame(draw);
</script>
