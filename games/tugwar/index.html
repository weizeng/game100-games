<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>江湖拔河</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;overflow:hidden;background:#0d0f1a;font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;color:#fff}
#wrap{position:relative;width:100%;max-width:480px;height:100%;margin:0 auto;display:flex;flex-direction:column;background:linear-gradient(#1c1410 0%,#0d0f1a 70%)}
#hud{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;font-size:15px;z-index:5}
#hud .grp{display:flex;gap:8px;align-items:center}
.ibtn{width:44px;height:44px;border-radius:12px;border:1px solid #3a4066;background:#1a1f36;color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.ibtn:active{transform:scale(.92)}
#cv{flex:1;width:100%;touch-action:none}
#pullBtn{margin:0 24px 22px;height:84px;border-radius:20px;border:3px solid #FF8A65;background:linear-gradient(135deg,rgba(255,138,101,.35),rgba(255,138,101,.12));color:#fff;font-size:26px;font-weight:800;cursor:pointer;touch-action:manipulation;z-index:5}
#pullBtn:active{transform:scale(.96);background:rgba(255,138,101,.55)}
#overlay{position:absolute;inset:0;background:rgba(5,6,12,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;padding:24px;text-align:center}
#overlay h1{font-size:34px;margin-bottom:8px}
#overlay p{font-size:14px;color:#aab;line-height:1.8;margin-bottom:6px;max-width:340px}
#overlay .big{font-size:20px;color:#ffd54f;margin:10px 0}
.startbtn{margin-top:14px;min-width:200px;height:56px;border-radius:28px;border:none;background:linear-gradient(135deg,#FF8A65,#d84315);color:#fff;font-size:20px;font-weight:700;cursor:pointer}
.startbtn:active{transform:scale(.95)}
.hidden{display:none!important}
#roundInfo{position:absolute;top:64px;left:0;right:0;text-align:center;font-size:18px;font-weight:700;color:#FF8A65;pointer-events:none;z-index:6;text-shadow:0 2px 8px #000}
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <div class="grp"><span>💪 <b id="rounds">0:0</b></span><span style="color:#8a90b8;font-size:13px">连胜 <b id="hs">0</b></span></div>
    <div class="grp"><span id="timer" style="font-size:14px;color:#ffd54f">⏱ --</span>
      <button class="ibtn" id="muteBtn" aria-label="静音">🔊</button>
      <button class="ibtn" id="pauseBtn" aria-label="暂停">⏸</button>
    </div>
  </div>
  <div id="roundInfo"></div>
  <canvas id="cv"></canvas>
  <button id="pullBtn">👊 狂点拉绳！</button>
  <div id="overlay">
    <h1>💪 江湖拔河</h1>
    <p id="ovText">与 AI 大力士拔河！<span style="color:#FF8A65">狂点下方按钮</span>（或点屏幕任意处）把绳子往你这边拉。<br>绳结先过<span style="color:#7CFC90">绿色界线</span>者赢一局，<b>三局两胜</b>。<br>每局 AI 发力方式都不同：稳扎稳打 → 波浪发力 → 狂暴连击！</p>
    <div class="big hidden" id="ovScore"></div>
    <button class="startbtn" id="startBtn">开始拔河</button>
  </div>
</div>
<script>
'use strict';
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const roundsEl=document.getElementById('rounds'),hsEl=document.getElementById('hs'),timerEl=document.getElementById('timer'),roundInfo=document.getElementById('roundInfo');
const overlay=document.getElementById('overlay'),ovText=document.getElementById('ovText'),ovScore=document.getElementById('ovScore');
const startBtn=document.getElementById('startBtn'),pauseBtn=document.getElementById('pauseBtn'),muteBtn=document.getElementById('muteBtn'),pullBtn=document.getElementById('pullBtn');
let W=0,H=0;
function resize(){const r=cv.getBoundingClientRect();const dpr=Math.min(2,window.devicePixelRatio||1);W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);}
window.addEventListener('resize',resize);
// 音效
let actx=null;let muted=localStorage.getItem('g100_sound')==='1';
function ac(){if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(actx&&actx.state==='suspended')actx.resume();return actx;}
function tone(f,dur,type,vol,slideTo){if(muted)return;const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,a.currentTime);if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,a.currentTime+dur);g.gain.setValueAtTime(vol||.2,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+dur);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+dur);}
function noiseHit(dur,vol,ff){if(muted)return;const a=ac();if(!a)return;const n=a.sampleRate*dur,b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=ff||900;const g=a.createGain();g.gain.value=vol||.25;s.connect(f);f.connect(g);g.connect(a.destination);s.start();}
const sPull=()=>{noiseHit(.07,.18,700);tone(120+Math.random()*60,.07,'square',.08);};
const sRoundWin=()=>{[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.15,'triangle',.2),i*110));};
const sRoundLose=()=>{[392,330,262].forEach((f,i)=>setTimeout(()=>tone(f,.18,'sawtooth',.15),i*130));};
const sMatchWin=()=>{[523,659,784,1046,1318].forEach((f,i)=>setTimeout(()=>tone(f,.2,'triangle',.22),i*120));};
const sCount=()=>tone(880,.09,'square',.15);
const sStart=()=>{[392,523,659].forEach((f,i)=>setTimeout(()=>tone(f,.12,'triangle',.18),i*90));};
function vibrate(p){try{if(navigator.vibrate)navigator.vibrate(p);}catch(e){}}
// 状态
let state='menu',round=1,pwins=0,awins=0,streak=0,best=0;
let p=0,v=0,rt=0,aiT=0,countT=0,tapCd=0,shake=0;
let parts=[],floats=[];
const KEY='g100_tugwar_hs';
try{best=parseInt(localStorage.getItem(KEY)||'0',10)||0;}catch(e){}
hsEl.textContent=best;
const PATTERNS=[{name:'稳扎稳打',desc:'AI 力度平稳，别松懈！'},{name:'波浪发力',desc:'AI 一阵一阵地爆发！'},{name:'狂暴连击',desc:'AI 全力狂暴，顶住！'}];
function aiForce(t){const r=Math.min(round,3);
  if(r===1)return .55+.15*Math.sin(1.3*t);
  if(r===2){const s=Math.max(0,Math.sin(2.1*t));return .5+.55*s*s;}
  return .62+.42*Math.sin(.8*t+1.2)+(Math.sin(5*t)>.9?.45:0);}
function startMatch(){state='countdown';round=1;pwins=0;awins=0;p=0;v=0;parts=[];floats=[];shake=0;
  roundsEl.textContent='0:0';overlay.classList.add('hidden');pauseBtn.textContent='⏸';startRound();}
function startRound(){state='countdown';p=0;v=0;aiT=0;rt=30;countT=3;
  roundInfo.textContent='第 '+round+' 局 · '+PATTERNS[Math.min(round,3)-1].name;}
function endRound(playerWon){state='roundEnd';
  if(playerWon){pwins++;sRoundWin();vibrate([80,40,80]);burst(W/2,H/2,40,'#7CFC90');floats.push({x:W/2,y:H/2-60,text:'本局拿下！',life:1.4,t:0,col:'#7CFC90'});}
  else{awins++;sRoundLose();vibrate(150);shake=.4;burst(W/2,H/2,24,'#EF5350');floats.push({x:W/2,y:H/2-60,text:'被 AI 拉过去了…',life:1.4,t:0,col:'#EF5350'});}
  roundsEl.textContent=pwins+':'+awins;
  setTimeout(()=>{if(state!=='roundEnd')return;
    if(pwins>=2)endMatch(true);else if(awins>=2)endMatch(false);else{round++;startRound();}},2000);}
function endMatch(won){state='over';
  if(won){streak++;sMatchWin();vibrate([100,50,100,50,200]);for(let i=0;i<3;i++)setTimeout(()=>burst(Math.random()*W,Math.random()*H*.6,26,['#FF8A65','#ffd54f','#7CFC90'][i%3]),i*220);
    if(streak>best){best=streak;try{localStorage.setItem(KEY,String(best));}catch(e){}}
  }else{streak=0;try{localStorage.setItem(KEY,String(best));}catch(e){}}
  hsEl.textContent=best;roundsEl.textContent=pwins+':'+awins;
  ovText.innerHTML=won?'三局两胜，你赢了 AI 大力士！':'AI 大力士更胜一筹，再练练臂力！';
  ovScore.classList.remove('hidden');ovScore.textContent=(won?'🏆 胜利':'😞 惜败')+' ｜ 连胜 '+streak+' 场 ｜ 历史最佳 '+best+' 场';
  startBtn.textContent='再战一场';overlay.classList.remove('hidden');}
function togglePause(){if(state==='playing'||state==='countdown'){state='paused';pauseBtn.textContent='▶️';ovText.innerHTML='已暂停，绳子绷住别松。';ovScore.classList.add('hidden');startBtn.textContent='继续';overlay.classList.remove('hidden');}
  else if(state==='paused'){overlay.classList.add('hidden');pauseBtn.textContent='⏸';startRound();}}
startBtn.addEventListener('click',()=>{if(state==='paused')togglePause();else startMatch();});
pauseBtn.addEventListener('click',togglePause);
function updateMute(){muteBtn.textContent=muted?'🔇':'🔊';}
muteBtn.addEventListener('click',()=>{muted=!muted;try{localStorage.setItem('g100_sound',muted?'1':'0');}catch(e){}updateMute();if(!muted)tone(600,.1,'sine',.15);});
updateMute();
function burst(x,y,n,col){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=60+Math.random()*180;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.7+Math.random()*.5,t:0,col,sz:2+Math.random()*4});}}
function doPull(){if(state!=='playing')return;if(tapCd>0)return;tapCd=.045;v-=.42;sPull();
  const kx=W/2+p*(W/2-70);burst(kx,H/2,3,'#FFD54F');}
pullBtn.addEventListener('pointerdown',e=>{e.preventDefault();doPull();});
cv.addEventListener('pointerdown',()=>doPull());
document.addEventListener('keydown',e=>{if(e.key===' '){e.preventDefault();doPull();}if(e.key==='Enter'&&(state==='menu'||state==='over'))startMatch();});
function knotX(){return W/2+p*(W/2-70);}
let last=0,prevCount=4;
function loop(ts){requestAnimationFrame(loop);const dt=Math.min(.05,(ts-last)/1000||0);last=ts;
  ctx.clearRect(0,0,W,H);
  if(shake>0){shake-=dt;ctx.save();ctx.translate((Math.random()-.5)*shake*26,(Math.random()-.5)*shake*26);}else ctx.save();
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1c1410');g.addColorStop(1,'#0d0f1a');ctx.fillStyle=g;ctx.fillRect(-20,-20,W+40,H+40);
  const midY=H/2;
  if(state==='countdown'){countT-=dt;const c=Math.ceil(countT);
    ctx.font='bold 90px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#FF8A65';
    const sc=1+Math.abs(countT-c)*.4;ctx.save();ctx.translate(W/2,midY);ctx.scale(sc,sc);ctx.fillText(c>0?String(c):'拉！',0,0);ctx.restore();
    if(c!==prevCount&&c>0){prevCount=c;sCount();}
    if(countT<=0){state='playing';prevCount=4;roundInfo.textContent='第 '+round+' 局 · 进行中';}}
  if(state==='playing'){tapCd=Math.max(0,tapCd-dt);aiT+=dt;rt-=dt;timerEl.textContent='⏱ '+Math.max(0,Math.ceil(rt))+'s';
    const af=aiForce(aiT);v+=af*dt*.95;v*=Math.exp(-1.7*dt);p+=v*dt*1.6;
    if(p<=-.8){endRound(true);}else if(p>=.8){endRound(false);}
    else if(rt<=0){endRound(p<0);}
    // AI 力度条
    const bw=W-120,bx=60;ctx.fillStyle='#1a1f36';ctx.beginPath();ctx.roundRect(bx,midY+86,bw,12,6);ctx.fill();
    ctx.fillStyle=af>.9?'#EF5350':af>.6?'#FF8A65':'#8D6E63';const wk=Math.min(1,af/1.4);ctx.beginPath();ctx.roundRect(bx,midY+86,bw*wk,12,6);ctx.fill();
    ctx.font='12px sans-serif';ctx.textAlign='center';ctx.fillStyle='#8a90b8';ctx.fillText('AI 发力',bx+bw/2,midY+116);}
  // 界线
  const lx=W/2-.8*(W/2-70),rx=W/2+.8*(W/2-70);
  ctx.strokeStyle='#7CFC90';ctx.lineWidth=4;ctx.setLineDash([8,6]);ctx.beginPath();ctx.moveTo(lx,midY-70);ctx.lineTo(lx,midY+70);ctx.stroke();
  ctx.strokeStyle='#EF5350';ctx.beginPath();ctx.moveTo(rx,midY-70);ctx.lineTo(rx,midY+70);ctx.stroke();ctx.setLineDash([]);
  ctx.font='12px sans-serif';ctx.textAlign='center';ctx.fillStyle='#7CFC90';ctx.fillText('你的界线',lx,midY-80);ctx.fillStyle='#EF5350';ctx.fillText('AI 的界线',rx,midY-80);
  // 绳子
  const kx=knotX(),sway=state==='playing'?Math.sin(aiT*7)*6:0;
  ctx.strokeStyle='#c9a227';ctx.lineWidth=7;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(30,midY+sway*.4);ctx.quadraticCurveTo(W/2,midY+sway,kx,midY);ctx.lineTo(W-30,midY-sway*.4);ctx.stroke();
  // 双方队伍
  const lean=state==='playing'?Math.max(-6,Math.min(6,-v*8)):0;
  ctx.font='40px serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('🧑‍🦰',44+lean,midY-34);ctx.fillText('👷',44+lean*1.2,midY+34);
  ctx.fillText('🦍',W-44-lean,midY-34);ctx.fillText('🤖',W-44-lean*1.2,midY+34);
  ctx.font='13px sans-serif';ctx.fillStyle='#8a90b8';ctx.fillText('你',44,midY-64);ctx.fillText('AI',W-44,midY-64);
  // 绳结
  ctx.font='34px serif';ctx.fillText('🪢',kx,midY-4);
  // 粒子
  for(let i=parts.length-1;i>=0;i--){const pt=parts[i];pt.t+=dt;if(pt.t>pt.life){parts.splice(i,1);continue;}pt.x+=pt.vx*dt;pt.y+=pt.vy*dt;pt.vy+=300*dt;const k=1-pt.t/pt.life;ctx.globalAlpha=k;ctx.fillStyle=pt.col;ctx.fillRect(pt.x-pt.sz/2,pt.y-pt.sz/2,pt.sz,pt.sz);ctx.globalAlpha=1;}
  ctx.textAlign='center';for(let i=floats.length-1;i>=0;i--){const f=floats[i];f.t+=dt;if(f.t>f.life){floats.splice(i,1);continue;}const k=1-f.t/f.life;ctx.globalAlpha=k;ctx.font='bold 20px sans-serif';ctx.fillStyle=f.col;ctx.fillText(f.text,f.x,f.y-f.t*40);ctx.globalAlpha=1;}
  ctx.restore();}
resize();requestAnimationFrame(loop);
</script>
</body>
</html>
