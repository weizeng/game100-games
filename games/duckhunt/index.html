<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>打鸭子</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#0d0d16;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#fff;user-select:none;-webkit-user-select:none}
#wrap{max-width:480px;height:100%;margin:0 auto;position:relative;background:linear-gradient(180deg,#1a2332 0%,#0d0d16 55%,#0f1a12 100%)}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
.hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:10px 12px;pointer-events:none;font-size:15px}
.hud .left{font-weight:bold;text-shadow:0 0 8px #ffd740}
.hud .right{display:flex;gap:8px;pointer-events:auto}
.iconbtn{width:38px;height:38px;border-radius:50%;border:1px solid #ffd74055;background:#1c1c2bd9;color:#fff;font-size:17px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .08s}
.iconbtn:active{transform:scale(.9)}
.ammo{color:#ff8a80;font-size:14px;letter-spacing:1px}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,10,20,.88);backdrop-filter:blur(4px);z-index:10;text-align:center;padding:24px}
.screen h1{font-size:38px;margin-bottom:6px;background:linear-gradient(135deg,#ffd740,#ff7043);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.screen p{color:#aaa;font-size:14px;line-height:1.7;margin:12px 0 20px}
.bigbtn{padding:14px 56px;font-size:18px;border:none;border-radius:30px;background:linear-gradient(135deg,#ffd740,#ff7043);color:#fff;font-weight:bold;cursor:pointer;transition:transform .1s;box-shadow:0 4px 20px #ffd74055}
.bigbtn:active{transform:scale(.93)}
.score{font-size:52px;font-weight:bold;background:linear-gradient(135deg,#ffd740,#ff7043);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin:8px 0}
.hiscore{color:#888;font-size:14px;margin-bottom:20px}
.hidden{display:none!important}
#timebar{position:absolute;top:0;left:0;height:4px;background:linear-gradient(90deg,#ffd740,#ff7043);width:100%;z-index:5}
</style>
</head>
<body>
<div id="wrap">
<canvas id="cv"></canvas>
<div id="timebar"></div>
<div class="hud">
<div class="left">SCORE <span id="score">0</span> · <span id="time">60</span>s <span class="ammo" id="ammo"></span></div>
<div class="right"><button class="iconbtn" id="muteBtn">MUTE</button><button class="iconbtn" id="pauseBtn">II</button></div>
</div>
<div class="screen" id="startScr">
<h1>DUCK HUNT</h1>
<p>点击飞过的鸭子射击命中加分<br>3 发连射后需要短暂换弹<br>限时 60 秒，看你能打几只</p>
<button class="bigbtn" id="startBtn">开始狩猎</button>
</div>
<div class="screen hidden" id="overScr">
<h1>时间到</h1>
<div class="score" id="finalScore">0</div>
<div class="hiscore">最高分：<span id="hiScore">0</span> · 命中 <span id="hits">0</span>/<span id="shots">0</span></div>
<button class="bigbtn" id="retryBtn">再来一局</button>
</div>
<div class="screen hidden" id="pauseScr">
<h1>已暂停</h1>
<button class="bigbtn" id="resumeBtn">继续</button>
</div>
</div>
<script>
"use strict";
var cv=document.getElementById('cv'),ctx=cv.getContext('2d'),wrap=document.getElementById('wrap');
var W,H,DPR;
function resize(){DPR=Math.min(window.devicePixelRatio||1,2);W=wrap.clientWidth;H=wrap.clientHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
window.addEventListener('resize',resize);resize();
var muted=false,AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,dur,type,vol,slide){if(muted)return;var c=ac();if(!c)return;try{var o=c.createOscillator(),g=c.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,c.currentTime);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,slide),c.currentTime+dur);g.gain.setValueAtTime(vol||.12,c.currentTime);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+dur);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+dur);}catch(e){}}
function sShoot(){tone(1500,.08,'square',.1,300);}
function sHit(){tone(700,.15,'square',.12,1400);setTimeout(function(){tone(1050,.15,'square',.1,1800);},70);}
function sReload(){tone(400,.1,'square',.08,800);}
function sQuack(){tone(300,.12,'sawtooth',.05,180);}
document.getElementById('muteBtn').onclick=function(e){e.stopPropagation();muted=!muted;this.textContent=muted?'OFF':'MUTE';};
var HIKEY='g100_duckhunt_hi',hi=0;
try{hi=parseInt(localStorage.getItem(HIKEY))||0;}catch(e){}
var state='start',paused=false,score=0,shots=0,hits=0;
var ducks,parts,floats,clouds,ammo,reloadT,spawnT,timeLeft,grass,frame=0;
var TIME_LIMIT=60;
function rand(a,b){return a+Math.random()*(b-a);}
var DUCK_COLORS=[['#ffd740','#ff8f00'],['#80d8ff','#0277bd'],['#ce93d8','#6a1b9a'],['#a5d6a7','#2e7d32']];
function spawnDuck(){
var dir=Math.random()<.5?1:-1;
var col=DUCK_COLORS[Math.floor(Math.random()*DUCK_COLORS.length)];
var spd=rand(1.8,3.2)+Math.min(2,(TIME_LIMIT-timeLeft)*.03);
var s=rand(.8,1.15);
ducks.push({x:dir>0?-40:W+40,y:rand(H*.12,H*.62),vx:dir*spd,dir:dir,ph:rand(0,6.28),amp:rand(20,50),baseY:0,s:s,col:col,wing:0,dead:false});
var d=ducks[ducks.length-1];d.baseY=d.y;
if(Math.random()<.3)sQuack();}
function startGame(){score=0;shots=0;hits=0;ducks=[];parts=[];floats=[];clouds=[];ammo=3;reloadT=0;spawnT=20;timeLeft=TIME_LIMIT;frame=0;
for(var i=0;i<5;i++)clouds.push({x:Math.random()*W,y:rand(20,H*.35),s:rand(.6,1.3),v:rand(.1,.4)});
grass=[];for(var g=0;g<40;g++)grass.push({x:Math.random()*W,h:rand(14,34)});
document.getElementById('score').textContent='0';
setAmmo();setTime();
document.getElementById('startScr').classList.add('hidden');document.getElementById('overScr').classList.add('hidden');document.getElementById('pauseScr').classList.add('hidden');
state='play';paused=false;}
function setAmmo(){var s='';for(var i=0;i<3;i++)s+=i<ammo?'\u25CF':'\u25CB';document.getElementById('ammo').textContent=s;}
function setTime(){document.getElementById('time').textContent=Math.ceil(timeLeft);
document.getElementById('timebar').style.width=(timeLeft/TIME_LIMIT*100)+'%';}
function gameOver(){state='over';
document.getElementById('finalScore').textContent=score;
document.getElementById('hits').textContent=hits;
document.getElementById('shots').textContent=shots;
if(score>hi){hi=score;try{localStorage.setItem(HIKEY,hi);}catch(e){}}
document.getElementById('hiScore').textContent=hi;
document.getElementById('overScr').classList.remove('hidden');}
function update(){
if(state!=='play'||paused)return;
frame++;
timeLeft-=1/60;setTime();
if(timeLeft<=0){gameOver();return;}
if(reloadT>0){reloadT--;if(reloadT===0){ammo=3;setAmmo();sReload();floats.push({x:W/2,y:H*.4,t:'换弹完毕',life:40,vy:-.8});}}
spawnT--;if(spawnT<=0){spawnDuck();spawnT=Math.max(18,Math.floor(70-(TIME_LIMIT-timeLeft)*.8));}
clouds.forEach(function(c){c.x-=c.v;if(c.x<-70)c.x=W+70;});
for(var i=ducks.length-1;i>=0;i--){var d=ducks[i];d.x+=d.vx;d.ph+=.08;d.wing+=.35;
d.y=d.baseY+Math.sin(d.ph)*d.amp;
if(d.x<-60||d.x>W+60){ducks.splice(i,1);}}
for(var p=parts.length-1;p>=0;p--){var pt=parts[p];pt.x+=pt.vx;pt.y+=pt.vy;pt.vy+=.25;pt.life--;if(pt.life<=0)parts.splice(p,1);}
for(var f=floats.length-1;f>=0;f--){var fl=floats[f];fl.y+=fl.vy;fl.life--;if(fl.life<=0)floats.splice(f,1);}
}
function drawDuck(d){
ctx.save();ctx.translate(d.x,d.y);ctx.scale(d.dir*d.s,d.s);
var w=Math.sin(d.wing)*10;
ctx.fillStyle=d.col[0];ctx.beginPath();ctx.ellipse(0,0,20,11,0,0,6.28);ctx.fill(); // 身体
ctx.beginPath();ctx.arc(16,-6,8,0,6.28);ctx.fill(); // 头
ctx.fillStyle='#ff8f00';ctx.beginPath();ctx.moveTo(23,-6);ctx.lineTo(29,-3);ctx.lineTo(23,-1);ctx.closePath();ctx.fill(); // 嘴
ctx.fillStyle='#212121';ctx.fillRect(14,-8,3,3); // 眼
ctx.fillStyle=d.col[1];
ctx.beginPath();ctx.moveTo(-4,-6);ctx.quadraticCurveTo(-16,-22-w,-26,-14-w);ctx.quadraticCurveTo(-16,-8,-4,0);ctx.closePath();ctx.fill(); // 翅膀
ctx.strokeStyle=d.col[1];ctx.lineWidth=3;
ctx.beginPath();ctx.moveTo(-18,8);ctx.lineTo(-24,14);ctx.moveTo(-12,9);ctx.lineTo(-14,15);ctx.stroke(); // 尾
ctx.restore();}
function draw(){
ctx.clearRect(0,0,W,H);
ctx.fillStyle='rgba(255,255,255,.08)';
clouds.forEach(function(c){ctx.beginPath();ctx.ellipse(c.x,c.y,40*c.s,13*c.s,0,0,6.28);ctx.fill();});
ducks.forEach(drawDuck);
// 草地
ctx.fillStyle='#1b2f1b';ctx.fillRect(0,H-46,W,46);
ctx.strokeStyle='#2e7d32';ctx.lineWidth=2;
grass.forEach(function(g){ctx.beginPath();ctx.moveTo(g.x,H);ctx.quadraticCurveTo(g.x+4,H-g.h,g.x-2,H-g.h*1.2);ctx.stroke();});
parts.forEach(function(p){ctx.globalAlpha=Math.max(0,p.life/40);ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.s,0,6.28);ctx.fill();});ctx.globalAlpha=1;
ctx.font='bold 16px sans-serif';floats.forEach(function(f){ctx.globalAlpha=Math.max(0,f.life/40);ctx.fillStyle='#ffd740';ctx.fillText(f.t,f.x-20,f.y);});ctx.globalAlpha=1;
if(reloadT>0){ctx.fillStyle='rgba(255,255,255,.8)';ctx.font='bold 13px sans-serif';ctx.fillText('换弹中…',W/2-26,H-60);}
}
function loop(){update();draw();requestAnimationFrame(loop);}
loop();
function shootAt(px,py){
if(state!=='play'||paused)return;
if(ammo<=0){tone(200,.06,'square',.06);return;}
ammo--;shots++;setAmmo();sShoot();
parts.push({x:px-14,y:py+16,vx:-2,vy:3,life:8,col:'#fff176',s:2});
if(ammo===0)reloadT=75;
var hit=null,hd=1e9;
for(var i=0;i<ducks.length;i++){var d=ducks[i];var dd=Math.hypot(d.x-px,d.y-py);if(dd<26*d.s&&dd<hd){hd=dd;hit=d;}}
if(hit){
ducks.splice(ducks.indexOf(hit),1);hits++;
var pts=Math.round(100*hit.s*(Math.abs(hit.vx)/2.5));
score+=pts;document.getElementById('score').textContent=score;
floats.push({x:hit.x,y:hit.y,t:'+'+pts,life:45,vy:-1.2});
for(var j=0;j<16;j++){var a=Math.random()*6.28,sp=rand(1,4);parts.push({x:hit.x,y:hit.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:rand(20,40),col:hit.col[0],s:rand(2,4)});}
sHit();}}
function posOf(e){var r=cv.getBoundingClientRect();var t=e.touches?e.touches[0]:e;return{x:t.clientX-r.left,y:t.clientY-r.top};}
cv.addEventListener('touchstart',function(e){e.preventDefault();var p=posOf(e);shootAt(p.x,p.y);},{passive:false});
cv.addEventListener('mousedown',function(e){var p=posOf(e);shootAt(p.x,p.y);});
document.getElementById('startBtn').onclick=function(){ac();startGame();};
document.getElementById('retryBtn').onclick=function(){startGame();};
document.getElementById('pauseBtn').onclick=function(){if(state!=='play')return;paused=true;document.getElementById('pauseScr').classList.remove('hidden');};
document.getElementById('resumeBtn').onclick=function(){paused=false;document.getElementById('pauseScr').classList.add('hidden');};
document.addEventListener('visibilitychange',function(){if(document.hidden&&state==='play'&&!paused){paused=true;document.getElementById('pauseScr').classList.remove('hidden');}});
</script>
</body>
</html>
