<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>礁石赶潮</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{display:flex;justify-content:center;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.wrap{width:100%;max-width:480px;height:100%;padding:12px;display:flex;flex-direction:column;align-items:center;gap:10px}
.topbar{width:100%;display:flex;justify-content:space-between;align-items:center}
.topbar .tools{display:flex;gap:8px}
.topbar .tools .iconbtn{min-width:44px;min-height:44px}
.stagebox{width:100%;display:flex;justify-content:center}
#cv{width:100%;max-height:calc(100svh - 170px);aspect-ratio:360/540;object-fit:contain;touch-action:none;border-radius:16px}
.hint{font-size:13px;text-align:center}
.overlay{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;z-index:20;padding:24px;text-align:center}
.overlay.hidden{display:none}
.lvgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:min(360px,92vw)}
.btn.lvl{min-width:44px;min-height:44px;font-size:14px}
.btn.lvl small{display:block;font-size:10px;opacity:.85}
.shop{width:min(360px,92vw);display:flex;flex-direction:column;gap:10px}
.shop .row{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left}
.rowbtns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
#toast{position:fixed;left:50%;bottom:18%;transform:translateX(-50%);background:rgba(0,0,0,.7);color:#fff;padding:8px 16px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;z-index:50;transition:opacity .2s}
#toast.on{opacity:1}
</style>
<!-- GAME UI BEGIN -->
<style>
:root{--page:#08202e;--surface:#0f3042;--soft:#164058;--ink:#e8fbff;--muted:#9cc4cf;--accent:#4fd8e8;--on-accent:#04222c;--line:#24576e;--stage:#061824;--page:#05131e;--surface:#0d2536;--soft:#1e3444;--ink:#e8f9fc;--muted:#8db8c7;--accent:#1bd1c2;--on-accent:#074844;--line:#2b84a1;--b-bg1:#0b2c3e;--b-bg2:#05131e;--b-btn:#1bd1c2;--b-btn-hi:#4ddbcf;--b-edge:#0d827c;--b-glow:#6ff2eb;--b-glow-rgb:111,242,235;--b-pedge-rgb:43,132,161;--b-btn-rgb:27,209,194;--b-bg2-rgb:5,19,30;--b-surf-rgb:13,37,54;--b-btn-ink:#074844;--b-btn-tsh:0 1px 0 rgba(255,255,255,.35);--b-coin-ink:#074844;--b-coin-tsh:none;--b-key-ink:#e8f9fc;--b-title:#ffffff;--b-hint-ink:#ebfafc}

@media(min-width:700px){.game-ui body>.wrap{padding-top:24px}.game-ui .ui-panel{padding:32px 28px}}
@media(max-width:360px){.game-ui body>.wrap{padding:8px 10px;gap:8px}.game-ui .ui-panel{padding:20px 16px;gap:11px}.game-ui .ui-panel h1{font-size:24px}.game-ui .ui-emblem{width:68px;height:68px;font-size:36px;border-radius:20px}.game-ui :is(.topbar,#topbar){gap:5px;padding:6px 10px}.game-ui :is(.iconbtn,.icobtn,.ibtn,.tbtn,.ib){min-width:44px;min-height:44px}}

<script>

let state='menu',lvl=1,score=0,sparks=[],last=performance.now(),boss=false,diff=1;

  {k:'hopLv',name:'跨步',max:1,cost(){return 50;},desc(){return '允许在窗口内跨过一块石头';}},

    const x=28+i*(300/Math.max(1,nR-1)),y=210+((i%2)?30:-10);

  const maxD=1+(prog.hopLv|0);
  if(Math.abs(i-pos)>maxD||i===pos)return false;

  if(!exposed(i))return false;
  const hopT=0.32-(prog.balLv|0)*0.05;

  if(!exposed(i,tideT+hopT))return false;

}
function hop(i){
  if(state!=='play'||mode!=='run')return false;
  if(!canHop(i)){toast('那块礁石现在不能跳');beep(180,.1,'sawtooth');return false;}
  const hopT=0.32-(prog.balLv|0)*0.05;
  tideT+=hopT;pos=i;addScore(8+lvl);beep(760,.07);
  waves.push({x:rocks[i].x,y:rocks[i].y,r:10,c:'#86efac',a:1});
  pops.push({x:rocks[i].x,y:rocks[i].y-24,t:'+'+(8+lvl),c:'#ffd34d',a:1});

  if(state!=='play'||mode!=='run')return false;

}

  tideT+=dt*0.25;
  waves=waves.filter(w=>{w.r+=dt*90;w.a-=dt*2.4;return w.a>0;});
  pops=pops.filter(p=>{p.y-=dt*28;p.a-=dt*1.5;return p.a>0;});
  if(!exposed(pos))splash();
}
function draw(){
  const se=SEAS[Math.min(2,((lvl-1)/5)|0)];
  hits=[];stage(se[0],se[1]);
  if(state!=='play'&&state!=='pause')return;
  const tv=tide();
  // water
  const wy=340-tv*18;
  ctx.fillStyle='rgba(14,165,233,.45)';ctx.fillRect(0,wy,W,H-wy);
  ctx.fillStyle='rgba(165,243,252,.25)';ctx.fillRect(0,wy,W,10);
  label((boss?'👑 ':'')+'第 '+lvl+' 关 · 潮 '+tv.toFixed(1),14,18,'#fff',13,'left');
  label('命 '+lives,346,18,'#ffd34d',12,'right');
  rocks.forEach((r,i)=>{
    const ex=exposed(i);
    const col=!ex?'#1e3a5f':i===pos?'#ffd34d':i===goal?'#86efac':'#fb923c';
    tile(r.x-28,r.y-18,56,50,col,12);
    if(FX&&ex)FX.shadow(ctx,r.x,r.y+22,22,6);
    label((i+1)+ (ex?'':' 没'),r.x,r.y+4,ex?'#3a2200':'#94a3b8',12,'center');
    if(prog.winLv&&!ex){
      // next expose estimate
      let eta='';
      for(let k=1;k<40;k++){if(exposed(i,tideT+k*0.15)){eta=(k*0.15).toFixed(1)+'s';break;}}
      label(eta,r.x,r.y+22,'#a5f3fc',9,'center');
    }
    addHit(r.x-28,r.y-18,56,50,()=>hop(i));
  });
  orb(rocks[pos].x,rocks[pos].y-28,10,'#fef3c7');
  for(const w of waves){ctx.save();ctx.globalAlpha=Math.max(0,w.a);ctx.strokeStyle=w.c;ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(w.x,w.y,w.r,0,7);ctx.stroke();ctx.restore();}
  for(const p of pops){ctx.save();ctx.globalAlpha=Math.max(0,p.a);ctx.fillStyle=p.c;ctx.font='bold 12px sans-serif';ctx.textAlign='center';ctx.fillText(p.t,p.x,p.y);ctx.restore();}
  btn(16,H-62,150,48,'等待退潮','#93c5fd',wait);
  btn(178,H-62,166,48,'跳向前','#86efac',()=>hop(Math.min(goal,pos+1)));
  if(FX&&FX.drawBurst)FX.drawBurst(ctx,sparks);
}
function win(){if(state!=='play')return;const s=lives>=2?3:lives>=1?2:1;finishWin(s,40+lvl*3+(boss?30:0)+lives*8,'赶到对岸');}
function lose(msg){if(state!=='play')return;finishLose(msg||'被浪卷走');}
window.__T={go(n){prog.seenTut=1;saveProg(prog);startLevel(n|0||1);},win(){if(state!=='play')startLevel(lvl||1);win();},lose(){if(state!=='play')startLevel(lvl||1);lose('测试失败');},hop,wait,canHop,state(){return{state,lvl,score,boss,diff,pos,goal,tide:tide(),tideT,period,amp,lives,exposed:rocks.map((_,i)=>exposed(i)),can:rocks.map((_,i)=>canHop(i)),n:rocks.length};}};

function finishWin(stars,gain,title){state='over';const prev=prog.stars[lvl]|0;if(stars>prev)prog.stars[lvl]=stars;prog.coins+=gain;if(lvl>=prog.unlock&&lvl<TOTAL)prog.unlock=lvl+1;saveProg(prog);if(score>best){best=score;UI.storageSet(HK,best);$('best').textContent=best;}$('overH').textContent=title||'过关！';$('finalScore').textContent='★'.repeat(stars)+'☆'.repeat(Math.max(0,3-stars));$('overText').textContent='第 '+lvl+' 关 · +'+gain+'币 · 得分 '+score;show('overScr',true);beep(880,.22);}
function finishLose(msg){state='over';$('overH').textContent='失败';$('finalScore').textContent='💀';$('overText').textContent=(msg||'')+' · 得分 '+score;show('overScr',true);beep(160,.35,'triangle');}
function tutorial(steps,done){let i=0;show('tutScr',true);const paint=()=>{$('tutH').textContent=steps[i][0];$('tutP').textContent=steps[i][1];$('tutStep').textContent=(i+1)+'/'+steps.length;};paint();$('tutNext').onclick=()=>{i++;if(i>=steps.length){show('tutScr',false);done();}else paint();};$('tutSkip').onclick=()=>{show('tutScr',false);done();};}
function openLevels(){state='menu';show('startScr',false);show('shopScr',false);show('overScr',false);show('pauseOv',false);show('tutScr',false);show('lvlScr',true);$('lvlInfo').textContent='解锁 '+prog.unlock+'/'+TOTAL+' · 币 '+prog.coins;const g=$('lvgrid');g.innerHTML='';for(let i=1;i<=TOTAL;i++){const b=document.createElement('button');b.className='btn lvl';const locked=i>prog.unlock;const st=prog.stars[i]|0;b.innerHTML=locked?'🔒':((i%5===0?'👑':'')+i+'<small>'+'★'.repeat(st)+'</small>');b.disabled=locked;if(!locked)b.onclick=()=>enter(i);g.appendChild(b);}}
function enter(n){const go=()=>startLevel(n);if(!prog.seenTut){prog.seenTut=1;saveProg(prog);tutorial(TUT,go);}else go();}
function openShop(){show('lvlScr',false);show('shopScr',true);$('coinLine').textContent='金币：'+prog.coins;const box=$('shopList');box.innerHTML='';for(const it of SHOP){if(prog[it.k]==null)prog[it.k]=0;const row=document.createElement('div');row.className='row';row.innerHTML='<div><b>'+it.name+'</b><br><small>'+it.desc()+'</small></div>';const b=document.createElement('button');b.className='btn';const maxed=prog[it.k]>=it.max;const cost=it.cost();b.textContent=maxed?'满级':cost+'币';b.disabled=maxed||prog.coins<cost;b.onclick=()=>{prog.coins-=cost;prog[it.k]++;saveProg(prog);beep(900,.1);openShop();};row.appendChild(b);box.appendChild(row);}}
$('startBtn').onclick=openLevels;$('backStart').onclick=()=>{show('lvlScr',false);show('startScr',true);};
$('spdBtn').onclick=()=>{spdMul=spdMul===1?2:1;$('spdBtn').textContent=spdMul+'×';};
$('shopBtn').onclick=openShop;$('shopBack').onclick=openLevels;
$('pauseBtn').onclick=()=>{if(state==='play'){state='pause';show('pauseOv',true);}else if(state==='pause'){state='play';last=performance.now();show('pauseOv',false);}};
$('resumeBtn').onclick=()=>{state='play';last=performance.now();show('pauseOv',false);};
$('menuBtn').onclick=()=>{show('pauseOv',false);state='menu';openLevels();};
$('againBtn').onclick=()=>startLevel(lvl);
$('nextBtn').onclick=()=>{if(lvl<TOTAL)startLevel(lvl+1);else openLevels();};
$('menu2Btn').onclick=()=>{show('overScr',false);openLevels();};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play'){state='pause';show('pauseOv',true);}});
requestAnimationFrame(function frame(t){const dt=Math.min(.05,(t-last)/1000);last=t;if(state==='play'&&typeof update==='function')for(let k=0;k<spdMul;k++)update(dt);if(typeof draw==='function')draw();requestAnimationFrame(frame);});

</script>
</body></html>
