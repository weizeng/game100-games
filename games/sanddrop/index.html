<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>落沙成画</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{display:flex;justify-content:center;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.wrap{width:100%;max-width:480px;height:100%;padding:10px;display:flex;flex-direction:column;align-items:center;gap:8px}
.topbar{width:100%;display:flex;justify-content:space-between;align-items:center;flex-wrap:nowrap!important;gap:6px}
.topbar .stat{font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.topbar .tools{display:flex;gap:6px}
.topbar .tools .iconbtn{min-width:44px;min-height:44px}
.stagebox{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
#cv{touch-action:none;display:block;border-radius:16px;max-width:100%;max-height:100%}
.hint{font-size:12px;text-align:center;min-height:16px;font-weight:700}
.overlay{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;z-index:20;padding:20px;text-align:center}
.overlay.hidden{display:none!important}
.lvgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:100%;max-width:360px;max-height:50vh;overflow:auto}
.lvgrid .lvl{min-height:54px;min-width:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:16px;padding:4px!important;line-height:1.1}
.lvgrid .lvl small{font-size:10px;margin-top:2px}
.rowbtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:100%}
#tutStep{font-size:12px;opacity:.7}
#toast{position:fixed;left:50%;top:16%;transform:translate(-50%,-10px);background:rgba(10,8,30,.88);color:#fff;font-weight:800;padding:10px 18px;border-radius:999px;z-index:999;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;font-size:15px;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
.shop{display:flex;flex-direction:column;gap:8px;width:100%;max-width:320px}
.shop .row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;border-radius:12px;background:rgba(255,255,255,.12)}
</style>
<!-- GAME UI BEGIN -->
<style>
:root{--page:#0b1626;--surface:#13243a;--soft:#1c3350;--ink:#eaf6ff;--muted:#9fb6cc;--accent:#4fc3f7;--on-accent:#05263a;--line:#2b4a6a;--stage:#081220;--page:#03101f;--surface:#0f2742;--soft:#223851;--ink:#eafffb;--muted:#a6c7cf;--accent:#33e1a0;--on-accent:#0b0620;--line:#33e1a0;--b-bg1:#0f3256;--b-bg2:#03101f;--b-btn:#33e1a0;--b-btn-hi:#7aecc1;--b-edge:#0f8a5a;--b-glow:#4fc3f7;--b-glow-rgb:79,195,247;--b-pedge-rgb:51,225,160;--b-btn-ink:#084c32;--b-btn-tsh:0 1px 0 rgba(255,255,255,.45);--b-coin-ink:#084c32;--b-coin-tsh:none;--b-key-ink:#4fc3f7;--b-title:#ffffff}
/* Shared presentation only; mechanics and state remain inside each standalone game. */
html.game-ui{background:var(--page);color:var(--ink);color-scheme:light;font-family:"Bahnschrift","Microsoft YaHei UI","PingFang SC",sans-serif}

.game-ui body{background:var(--page);color:var(--ink);font-family:inherit;overscroll-behavior:none}
.game-ui body>.wrap{padding:20px 16px max(20px,env(safe-area-inset-bottom));gap:14px;max-width:500px}
.game-ui #app{background:var(--page);color:var(--ink)}
.game-ui :is(.topbar,#topbar){gap:8px;flex-wrap:wrap;min-height:58px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:10px 12px;box-shadow:0 3px 0 var(--soft);font-size:13px}
.game-ui :is(.title,.tb-title,.tb-title,#topbar .t,.topbar .t){color:var(--ink);font-size:16px;font-weight:750;letter-spacing:0}
.game-ui :is(.topbar,.hud,#hud,#topbar) :is(b,.v){color:var(--accent);font-variant-numeric:tabular-nums}
.game-ui :is(.stat,.topbar .s,.topbar .stat,.scorebar,.stats,.tip,.hint,.hintline,.hsline,.best,.hiscore){color:var(--muted);line-height:1.7}
.game-ui :is(.hint,.hintline,.tip){font-size:12px;max-width:40em;text-wrap:pretty}
.game-ui .scorebar{padding:6px 10px;gap:8px;flex-wrap:wrap}
.game-ui :is(.iconbtn,.iconBtn,.icobtn,.ibtn,.tbtn,.hbtn,.ib,.iconBtn,.pause){min-width:44px;min-height:44px;flex-shrink:0;border-radius:12px;background:var(--soft);color:var(--ink);border:1px solid var(--line);box-shadow:none;font-size:17px}
.game-ui button{font-family:inherit;cursor:pointer;touch-action:manipulation}
.game-ui button:focus-visible,.game-ui [tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.game-ui :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn){background:var(--accent);color:var(--on-accent);border:1px solid transparent;border-radius:13px;min-height:50px;padding:13px 28px;font-size:16px;font-weight:750;letter-spacing:0;box-shadow:0 4px 0 var(--line);text-shadow:none;max-width:100%}
.game-ui :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn):active{box-shadow:none;transform:translateY(2px)}
.game-ui :is(.ghost,.ghostbtn,.btn2,.abtn,.toolbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line);box-shadow:none;border-radius:12px;min-height:44px}
.game-ui :is(.rowbtns,.btnrow,.ctlrow){gap:10px;flex-wrap:wrap;justify-content:center}
.game-ui :is(.pill,.hudbox,.hud .p){background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:none;font-variant-numeric:tabular-nums}
.game-ui :is(.dbtn,.cbtn,.gbtn,.holdbtn,.firebtn,.bombbtn,.jumpbtn,.pumpbtn,.nbtn){border-radius:12px;box-shadow:0 3px 0 var(--line);min-height:44px}
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv,.screen):has(>.ui-panel){padding:20px;overflow-y:auto;overscroll-behavior:contain}
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv):has(>.ui-panel){background:var(--page);backdrop-filter:none;justify-content:safe center;align-items:center}
.game-ui .ui-panel{width:min(100%,380px);max-height:100%;overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:18px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:24px;padding:30px 24px;box-shadow:0 8px 0 var(--soft),0 20px 48px #15253618;text-align:center;margin:auto}
.game-ui .ui-panel :is(.card,.panel,.pausecard,.ovcard){display:contents}
.game-ui .ui-panel :is(h1,h2,.gamename,.gametitle){font-size:30px;line-height:1.25;font-weight:800;color:var(--ink);background:none;-webkit-text-fill-color:currentColor;text-shadow:none;letter-spacing:-.6px;margin:0}

.game-ui .ui-panel :is(.best,.hsline,.hiscore,.endstats,.endstats b){color:var(--muted);font-size:13px;line-height:1.8}
.game-ui .ui-mode{display:grid;grid-template-columns:1fr 1fr;gap:5px;background:var(--soft);padding:5px;border:1px solid var(--line);border-radius:14px;width:100%}

.game-ui .ui-mode-status{display:block;padding:5px 10px;color:var(--accent);font-size:11px;font-weight:700;line-height:1.5;text-align:center;border:1px solid var(--line);border-radius:8px;background:var(--surface);margin:4px auto;max-width:100%;pointer-events:none}
.game-ui body>.wrap>canvas:not(#fx){background-color:var(--stage);box-shadow:0 0 0 1px var(--line),0 6px 0 var(--soft);border-radius:18px;flex-shrink:0}
.game-ui .screen>canvas.game{box-shadow:0 0 0 1px var(--line),0 6px 0 var(--soft)}
.game-ui #hud{gap:6px;background:var(--surface);color:var(--ink)}
.game-ui #hud :is(.left,.t,.s,.grp,.pill){color:var(--ink)}
.game-ui #hud .pill{background:var(--surface);border-color:var(--line)}
.game-ui body canvas:is(#cv,#game,#board){background-color:var(--stage)}
.game-ui :is(button.dbtn,button.cbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.game-ui :is(button.lvl,button.lvlbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line);border-radius:12px;min-height:54px}
.game-ui :is(button.lvl,button.lvlbtn) :is(.nc,.sz,small){color:var(--muted)}
.game-ui .ui-panel button.lvl{margin:0;min-width:44px;box-shadow:none;padding:8px}
.game-ui #hud :is(.left,.right,.hudl,.hbtns){gap:5px;flex-wrap:wrap}
.game-ui #hud :is(.left,.hudl){min-width:0;flex-shrink:1}
.game-ui #hud :is(.pill,.left){font-size:12px}
.game-ui button:disabled{cursor:default;opacity:.45;box-shadow:none}
.game-ui .ui-panel .ui-assist-note{color:var(--accent);font-weight:700}
@media(min-width:700px){.game-ui body>.wrap{padding-top:32px}.game-ui .ui-panel{padding:36px 30px}}
@media(max-width:360px){.game-ui body>.wrap{padding:10px;gap:10px}.game-ui .ui-panel{padding:22px 18px;gap:13px}.game-ui .ui-panel h1{font-size:26px}.game-ui .ui-emblem{width:70px;height:70px;font-size:38px}.game-ui :is(.topbar,#topbar){gap:5px;padding:8px}.game-ui :is(.iconbtn,.icobtn,.ibtn,.tbtn,.ib){min-width:40px;min-height:44px}}
@media(max-height:650px){.game-ui .ui-panel{padding:18px;gap:12px}.game-ui .ui-emblem{width:60px;height:60px;font-size:32px}.game-ui .ui-panel h1{font-size:25px}.game-ui .ui-panel :is(p,.howto,.sub,.rule){font-size:13px}}
@media(prefers-reduced-motion:reduce){.game-ui *, .game-ui *::before,.game-ui *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
/* 2026-10-20 热修：开局/结算遮罩铺满整屏，主按钮固定在面板底部，避免被画布尺寸裁切（#10） */
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv):has(>.ui-panel){position:fixed;inset:0;z-index:1000;border-radius:0;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
.game-ui .ui-panel{touch-action:pan-y}
.game-ui .ui-panel :is(#startBtn,#btnStart,.startbtn,#bStart,#restartBtn,#btnRestart,#againBtn,#btnAgain,#retryBtn,#btnRetry,#playBtn,#btnPlay){position:sticky;bottom:0;z-index:3;flex-shrink:0}
.game-ui .ui-panel :not(.card,.panel,.pausecard,.ovcard,.ui-mode):has(>:is(#startBtn,#btnStart,.startbtn,#bStart,#restartBtn,#btnRestart,#againBtn,#btnAgain,#retryBtn,#btnRetry,#playBtn,#btnPlay)){position:sticky;bottom:0;z-index:3;flex-shrink:0;background:var(--surface);box-shadow:0 -10px 10px -6px var(--surface)}

      }), 0, 0, w, h);
    },
    // Glow is shadowBlur: cheap for a handful of shapes, never use it on every tile.
    glow: function (ctx, color, blur) { ctx.shadowColor = color; ctx.shadowBlur = blur; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0; },
    noGlow: function (ctx) { ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; },
    // Crisp rendering on high-DPI phones without changing game coordinates.
    // Only safe where input code converts with getBoundingClientRect + logical W/H, not cv.width.
    hidpi: function (cv, ctx, w, h) {
      var d = Math.max(1, Math.min(2.5, window.devicePixelRatio || 1));
      cv.width = Math.round(w * d); cv.height = Math.round(h * d); // intrinsic ratio stays w:h, so CSS sizing is unchanged
      ctx.setTransform(d, 0, 0, d, 0, 0); return d;
    },
    // Lightweight particle bursts (pooled array, no allocations per frame beyond the burst).
    burst: function (list, x, y, color, n) {
      for (var i = 0; i < (n || 12); i++) { var a = Math.random() * 6.283, v = 1 + Math.random() * 2.6; list.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 1, life: 1, c: color, r: 1.5 + Math.random() * 2.5 }); }
    },
    drawBurst: function (ctx, list) {
      for (var i = list.length - 1; i >= 0; i--) {
        var p = list[i]; p.x += p.vx; p.y += p.vy; p.vy += .12; p.life -= .035;
        if (p.life <= 0) { list.splice(i, 1); continue; }
        ctx.globalAlpha = p.life; ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (skin === 'b' ? 1.2 : 1), 0, 7); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
  };
  window.GameUI.fx = fx;
}());

</script>
<!-- GAME UI END -->
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <span class="title">🏜️ 落沙成画</span>
    <span class="stat">得分 <b id="score">0</b> · 最佳 <b id="best">0</b></span>
    <span class="tools">
      <button class="iconbtn" id="muteBtn" aria-label="音效">🔊</button>
      <button class="iconbtn" id="pauseBtn" aria-label="暂停">⏸</button>
    </span>
  </div>
  <div class="stagebox"><canvas id="cv"></canvas></div>
  <p class="hint" id="hint">点色桶落沙 · 归入同色桶</p>
</div>
<div class="overlay" id="startScr"><h1>🏜️ 落沙成画</h1><p>点色桶释放沙粒流入画面。<br>沙落入同色收纳桶才算收集。<br>15 关限时清画，Boss 关陷阱多。</p><p id="bestLine"></p><button class="btn" id="startBtn">开始游戏</button></div>
<div class="overlay hidden" id="lvlScr"><h2>选择关卡</h2><p id="lvlInfo"></p><div class="lvgrid" id="lvgrid"></div><div class="rowbtns"><button class="btn ghost" id="shopBtn">成长商店</button><button class="btn ghost" id="backStart">返回</button></div></div>
<div class="overlay hidden" id="shopScr"><h2>成长商店</h2><p id="coinLine"></p><div class="shop" id="shopList"></div><button class="btn" id="shopBack">返回选关</button></div>
<div class="overlay hidden" id="tutScr"><h2 id="tutH"></h2><p id="tutP"></p><span id="tutStep"></span><div class="rowbtns"><button class="btn ghost" id="tutSkip">跳过</button><button class="btn" id="tutNext">下一步</button></div></div>
<div class="overlay hidden" id="pauseOv"><h2>⏸ 已暂停</h2><div class="rowbtns"><button class="btn" id="resumeBtn">继续</button><button class="btn ghost" id="menuBtn">选关</button></div></div>
<div class="overlay hidden" id="overScr"><h2 id="overH">过关！</h2><div class="score" id="finalScore">★★★</div><p id="overText"></p><div class="rowbtns"><button class="btn" id="nextBtn">下一关</button><button class="btn ghost" id="againBtn">再玩一次</button><button class="btn ghost" id="menu2Btn">选关</button></div></div>
<div id="toast"></div>
<script>
'use strict';

const $=id=>document.getElementById(id);
const W=360,H=540;
const cv=$('cv'),ctx=cv.getContext('2d');
const UI=window.GameUI||{pick:a=>a,storageGet:k=>localStorage.getItem(k),storageSet:(k,v)=>localStorage.setItem(k,v)};
const FX=UI.fx&&UI.fx.on?UI.fx:null;
if(FX)FX.hidpi(cv,ctx,W,H);else{cv.width=W;cv.height=H;}
function show(id,on){$(id).classList.toggle('hidden',!on);}
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('on'),1200);}
function posOf(e){const r=cv.getBoundingClientRect();const t=(e.touches&&e.touches[0])||(e.changedTouches&&e.changedTouches[0])||e;return{x:(t.clientX-r.left)*W/r.width,y:(t.clientY-r.top)*H/r.height};}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};}

const PK='g100_sanddrop_prog',HK='g100_sanddrop_hs',MK='g100_sanddrop_mute';
let muted=UI.storageGet(MK)==='1',ac=null;$('muteBtn').textContent=muted?'🔇':'🔊';
function beep(f,d,type){if(muted)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(.12,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d);}catch(e){}}
$('muteBtn').onclick=()=>{muted=!muted;UI.storageSet(MK,muted?'1':'0');$('muteBtn').textContent=muted?'🔇':'🔊';};
function loadProg(){try{return JSON.parse(UI.storageGet(PK)||'{}');}catch(e){return{};}}
function saveProg(p){UI.storageSet(PK,JSON.stringify(p));}
let prog=loadProg();
if(!prog.stars)prog.stars={};if(prog.coins==null)prog.coins=0;if(prog.unlock==null)prog.unlock=1;
if(!prog.seenTut)prog.seenTut=0;
let best=+UI.storageGet(HK)||0;$('best').textContent=best;$('bestLine').textContent='解锁 '+prog.unlock+'/15 · 币 '+prog.coins;
const TOTAL=15;
let state='menu',lvl=1,score=0,sparks=[],last=performance.now(),boss=false;
const TUT=[['落沙','点色桶释放该色沙粒流入画面。'],['归桶','沙落入同色收纳桶才算收集。'],['规划','先放哪色决定会不会堵路。'],['Boss','Boss 关混色陷阱多，限时更紧。']];
const COLS=['#ff6b9d','#ffcf33','#5ad0ff','#7dff9a','#b26bff','#ff9f2e'];
const SHOP=[
  {k:'timeLv',name:'加时',max:3,cost(){return 45+(prog.timeLv|0)*30;},desc(){return '每关 +'+((prog.timeLv|0)*5)+' 秒';}},
  {k:'windLv',name:'定向风',max:2,cost(){return 55+(prog.windLv|0)*40;},desc(){return '风向道具 '+(1+(prog.windLv|0))+' 次';}},
  {k:'magLv',name:'磁吸',max:3,cost(){return 50+(prog.magLv|0)*35;},desc(){return '磁吸强度 Lv'+(prog.magLv|0);}}
];
const GW=18,GH=28,CS=12;let grid=[],buckets=[],timeLeft=0,active=-1,winds=0,collected={},need={},spawnY=40;
function startLevel(n){lvl=n|0;boss=lvl%5===0;score=0;sparks=[];active=-1;winds=1+(prog.windLv|0);$('score').textContent=0;show('lvlScr',false);show('shopScr',false);show('overScr',false);show('pauseOv',false);show('startScr',false);grid=Array(GW*GH).fill(0);const colors=Math.min(2+((lvl-1)/3|0),COLS.length);need={};collected={};for(let i=0;i<colors;i++){need[i+1]=8+lvl*2+(boss?6:0);collected[i+1]=0;}buckets=[];const gap=W/(colors+1);for(let i=0;i<colors;i++)buckets.push({x:gap*(i+1),y:H-36,c:i+1,w:36});// seed pixels as "painting"
const rng=mulberry32(lvl*777);for(let y=4;y<GH-8;y++)for(let x=2;x<GW-2;x++){if(rng()<0.35+lvl*0.01){const c=1+(rng()*colors|0);grid[y*GW+x]=c;}}timeLeft=55+lvl*2+(prog.timeLv|0)*5-(boss?10:0);state='play';last=performance.now();beep(660,.1);$('hint').textContent='点底桶释放同色 · 限时'+timeLeft|0+'s';}
function fall(){for(let y=GH-2;y>=0;y--)for(let x=0;x<GW;x++){const i=y*GW+x,v=grid[i];if(!v)continue;const below=(y+1)*GW+x;if(!grid[below]){grid[below]=v;grid[i]=0;continue;}const dl=(y+1)*GW+x-1,dr=(y+1)*GW+x+1;if(x>0&&!grid[dl]&&Math.random()<0.5){grid[dl]=v;grid[i]=0;}else if(x<GW-1&&!grid[dr]){grid[dr]=v;grid[i]=0;}}}
function release(){if(active<1)return;const bx=buckets.find(b=>b.c===active);if(!bx)return;const gx=Math.max(1,Math.min(GW-2,((bx.x/W)*GW)|0));for(let k=0;k<3+(prog.magLv|0);k++){const x=gx+(k%3)-1;if(x>=0&&x<GW&&!grid[x])grid[x]=active;}beep(500,.04);}
function collect(){for(const b of buckets){const gx=((b.x/W)*GW)|0;for(let dy=0;dy<3;dy++){const y=GH-1-dy,i=y*GW+gx;if(grid[i]===b.c){grid[i]=0;collected[b.c]=(collected[b.c]|0)+1;score+=5;$('score').textContent=score;if(FX)FX.burst(sparks,b.x,b.y,COLS[b.c-1],6);beep(880,.05);}}}}
function checkWin(){return Object.keys(need).every(k=>(collected[k]|0)>=need[k]);}
function remainingPaint(){return grid.some(v=>v>0);}
cv.addEventListener('pointerdown',e=>{if(state!=='play')return;e.preventDefault();const p=posOf(e);if(p.y>H-70){let best=null,bd=1e9;for(const b of buckets){const d=Math.abs(b.x-p.x);if(d<bd){bd=d;best=b;}}if(best&&bd<40){active=best.c;release();}}else if(winds>0&&p.y>80){winds--;const gx=((p.x/W)*GW)|0;for(let y=0;y<GH;y++){const i=y*GW+gx;if(grid[i]){const ni=y*GW+Math.min(GW-1,gx+1);if(!grid[ni]){grid[ni]=grid[i];grid[i]=0;}}}toast('吹风!');beep(600,.08);}});
function win(){if(state!=='play')return;state='over';const stars=timeLeft>20?3:timeLeft>8?2:1;const prev=prog.stars[lvl]|0;if(stars>prev)prog.stars[lvl]=stars;const gain=30+stars*14+(boss?55:0)+Math.floor(score/8);prog.coins+=gain;if(lvl>=prog.unlock&&lvl<TOTAL)prog.unlock=lvl+1;saveProg(prog);if(score>best){best=score;UI.storageSet(HK,best);$('best').textContent=best;}$('overH').textContent='画作成形！';$('finalScore').textContent='★'.repeat(stars);$('overText').textContent='关卡 '+lvl+' · +'+gain+'币';show('overScr',true);beep(880,.2);}
function lose(msg){if(state!=='play')return;state='over';$('overH').textContent='失败';$('finalScore').textContent='💀';$('overText').textContent=(msg||'时间到')+' · 得分 '+score;show('overScr',true);beep(160,.35,'triangle');}
let acc=0;function update(dt){timeLeft-=dt;if(timeLeft<=0)return lose('时间到');acc+=dt;while(acc>0.05){acc-=0.05;fall();collect();}if(active>0)release();if(checkWin())win();}
function draw(){if(FX)FX.stage(ctx,W,H,'#0f3256','#03101f');else{ctx.fillStyle='#03101f';ctx.fillRect(0,0,W,H);}if(state!=='play'&&state!=='pause')return;const ox=(W-GW*CS)/2,oy=50;for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){const v=grid[y*GW+x];if(!v)continue;const col=COLS[v-1];if(FX)FX.tile(ctx,ox+x*CS,oy+y*CS,CS-1,CS-1,col,2);else{ctx.fillStyle=col;ctx.fillRect(ox+x*CS,oy+y*CS,CS-1,CS-1);}}buckets.forEach(b=>{ctx.fillStyle=COLS[b.c-1];ctx.fillRect(b.x-b.w/2,b.y-10,b.w,24);ctx.fillStyle='#fff';ctx.font='11px sans-serif';ctx.textAlign='center';ctx.fillText((collected[b.c]|0)+'/'+need[b.c],b.x,b.y+6);if(active===b.c){ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.strokeRect(b.x-b.w/2-2,b.y-12,b.w+4,28);}});ctx.fillStyle='#fff';ctx.font='13px sans-serif';ctx.textAlign='left';ctx.fillText('⏱ '+Math.ceil(timeLeft)+(boss?' 👑':'')+' 风'+winds,10,22);if(FX&&FX.drawBurst)FX.drawBurst(ctx,sparks);}
window.__T={go(n){prog.seenTut=1;saveProg(prog);startLevel(n|0||1);},win(){if(state!=='play')startLevel(lvl||1);Object.keys(need).forEach(k=>collected[k]=need[k]);win();},lose(){if(state!=='play')startLevel(lvl||1);lose('测试失败');},state(){return{state,lvl,score,boss,timeLeft};}};


function tutorial(steps,done){
  let i=0;show('tutScr',true);
  const paint=()=>{$('tutH').textContent=steps[i][0];$('tutP').textContent=steps[i][1];$('tutStep').textContent=(i+1)+'/'+steps.length;};
  paint();
  $('tutNext').onclick=()=>{i++;if(i>=steps.length){show('tutScr',false);done();}else paint();};
  $('tutSkip').onclick=()=>{show('tutScr',false);done();};
}
function openLevels(){
  state='menu';show('startScr',false);show('shopScr',false);show('overScr',false);show('pauseOv',false);show('tutScr',false);show('lvlScr',true);
  $('lvlInfo').textContent='解锁 '+prog.unlock+'/'+TOTAL+' · 币 '+prog.coins;
  const g=$('lvgrid');g.innerHTML='';
  for(let i=1;i<=TOTAL;i++){
    const b=document.createElement('button');b.className='btn lvl';
    const locked=i>prog.unlock;const st=prog.stars[i]|0;
    b.innerHTML=locked?'🔒':(i%5===0?'👑':'')+i+'<small>'+'★'.repeat(st)+'</small>';b.disabled=locked;
    if(!locked)b.onclick=()=>enter(i);g.appendChild(b);
  }
}
function enter(n){const go=()=>startLevel(n);if(!prog.seenTut){prog.seenTut=1;saveProg(prog);tutorial(TUT,go);}else go();}
function openShop(){
  show('lvlScr',false);show('shopScr',true);$('coinLine').textContent='金币：'+prog.coins;
  const box=$('shopList');box.innerHTML='';
  for(const it of SHOP){
    if(prog[it.k]==null)prog[it.k]=0;
    const row=document.createElement('div');row.className='row';
    row.innerHTML='<div><b>'+it.name+'</b><br><small>'+it.desc()+'</small></div>';
    const btn=document.createElement('button');btn.className='btn';
    const maxed=prog[it.k]>=it.max;const cost=it.cost();
    btn.textContent=maxed?'满':cost+'币';btn.disabled=maxed||prog.coins<cost;
    btn.onclick=()=>{prog.coins-=cost;prog[it.k]++;saveProg(prog);beep(900,.1);openShop();};
    row.appendChild(btn);box.appendChild(row);
  }
}
$('startBtn').onclick=openLevels;$('backStart').onclick=()=>{show('lvlScr',false);show('startScr',true);};
$('shopBtn').onclick=openShop;$('shopBack').onclick=openLevels;
$('pauseBtn').onclick=()=>{if(state==='play'){state='pause';show('pauseOv',true);}else if(state==='pause'){state='play';last=performance.now();show('pauseOv',false);}};
$('resumeBtn').onclick=()=>{state='play';last=performance.now();show('pauseOv',false);};
$('menuBtn').onclick=()=>{show('pauseOv',false);state='menu';openLevels();};
$('againBtn').onclick=()=>startLevel(lvl);
$('nextBtn').onclick=()=>{if(lvl<TOTAL)startLevel(lvl+1);else openLevels();};
$('menu2Btn').onclick=()=>{show('overScr',false);openLevels();};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play'){state='pause';show('pauseOv',true);}});
requestAnimationFrame(function frame(t){const dt=Math.min(.05,(t-last)/1000);last=t;if(state==='play'&&typeof update==='function')update(dt);if(typeof draw==='function')draw();requestAnimationFrame(frame);});

</script>
</body></html>
