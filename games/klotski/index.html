<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>华容道</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:linear-gradient(160deg,#3d1414 0%,#121212 55%,#0a0a0a 100%);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;display:flex;justify-content:center;min-height:100vh;touch-action:manipulation;-webkit-user-select:none;user-select:none;overflow-x:hidden}
.wrap{width:100%;max-width:480px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:10px;position:relative;z-index:1}
.topbar{width:100%;display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:9px 12px;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.topbar .title{font-weight:700;font-size:16px}
.topbar .stat{color:#f0b8a8;font-size:13px}
.topbar .stat b{color:#fff;font-size:15px}
.tbtn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:#fff;font-size:16px;min-width:38px;height:38px;border-radius:11px;cursor:pointer;transition:transform .08s}
.tbtn:active{transform:scale(.9)}
.screen{width:100%;display:none;flex-direction:column;align-items:center;gap:10px}
.screen.on{display:flex}
.card{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:20px;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.card h1{font-size:26px;margin-bottom:6px;background:linear-gradient(90deg,#fca5a5,#fcd34d);-webkit-background-clip:text;background-clip:text;color:transparent}
.card h2{font-size:22px;margin-bottom:8px}
.card p{color:#f0c4b4;font-size:14px;line-height:1.7;margin-bottom:10px}
.bigbtn{background:linear-gradient(135deg,#dc2626,#f59e0b);border:none;color:#fff;font-size:18px;font-weight:700;padding:14px 46px;border-radius:999px;cursor:pointer;box-shadow:0 6px 18px rgba(220,38,38,.45);transition:transform .1s}
.bigbtn:active{transform:scale(.93)}
.ghostbtn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#fff;font-size:14px;padding:10px 22px;border-radius:999px;cursor:pointer;transition:transform .1s}
.ghostbtn:active{transform:scale(.93)}
#cvwrap{width:100%;display:flex;justify-content:center;touch-action:none}
#cv{border-radius:14px;background:linear-gradient(160deg,#2a1512,#1a0e0c);touch-action:none;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.hint{color:#f0c4b4;font-size:13px;text-align:center}
.best{color:#ffd76a;font-size:14px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
.float{position:fixed;pointer-events:none;z-index:60;font-weight:700;font-size:18px;animation:floatup 1.1s ease-out forwards}
@keyframes floatup{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-46px)}}
#pauseov{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:40;backdrop-filter:blur(4px)}
#pauseov.on{display:flex}
.pausecard{background:#1c1c22;border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:28px 36px;text-align:center;display:flex;flex-direction:column;gap:12px}
#hintov{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:40;backdrop-filter:blur(4px);padding:24px}
#hintov.on{display:flex}
.hintcard{background:#1c1c22;border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:26px 28px;text-align:center;display:flex;flex-direction:column;gap:12px;max-width:380px}
.hintcard h2{font-size:22px}
.hintcard p{color:#f0c4b4;font-size:14px;line-height:1.9}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="wrap">
  <div class="topbar">
    <span class="title">🏯 华容道</span>
    <span class="stat">步数 <b id="moves">0</b></span>
    <span><button class="tbtn" id="hintBtn" title="提示">💡</button><button class="tbtn" id="sndBtn">🔊</button><button class="tbtn" id="pauseBtn">⏸</button></span>
  </div>
  <div class="screen on" id="s-start">
    <div class="card">
      <h1>🏯 华容道</h1>
      <p>经典「横刀立马」开局！<br>拖动或点选棋子移动（一次一格）。<br>目标：把 <b>曹操</b> 从底部缺口移出棋盘！<br>出口在底部中间（▼ 标记处）。<br>步数越少越厉害！</p>
      <button class="bigbtn" id="btnStart">开始闯关</button>
    </div>
  </div>
  <div class="screen" id="s-game">
    <div id="cvwrap"><canvas id="cv"></canvas></div>
    <div class="hint">拖动棋子移动 · 点选棋子后再点相邻空格也可移动</div>
    <button class="ghostbtn" id="btnReset">↩ 重新开始</button>
  </div>
  <div class="screen" id="s-end">
    <div class="card">
      <h2>🎉 曹操逃出生天！</h2>
      <p id="endInfo"></p>
      <p class="best" id="endBest"></p>
      <div style="display:flex;gap:10px;justify-content:center"><button class="bigbtn" id="btnAgain">再来一局</button><button class="ghostbtn" id="btnHome">返回</button></div>
    </div>
  </div>
</div>
<div id="pauseov"><div class="pausecard"><h2>⏸ 已暂停</h2><button class="bigbtn" id="btnResume">继续</button><button class="ghostbtn" id="btnQuit">退出</button></div></div>
<div id="hintov"><div class="hintcard"><h2>💡 提示</h2><p id="hintText"></p><button class="ghostbtn" id="hintClose">知道了</button></div></div>
<script>
"use strict";
var $=function(id){return document.getElementById(id)};
var store={get:function(k,d){try{var v=localStorage.getItem("klotski_"+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set:function(k,v){try{localStorage.setItem("klotski_"+k,JSON.stringify(v))}catch(e){}}};
var AC=null,soundOn=store.get("sound",true);
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==="suspended"){AC.resume()}return AC}
function tone(f,dur,type,vol,when){if(!soundOn)return;var c=ac();if(!c)return;try{var o=c.createOscillator(),g=c.createGain();o.type=type||"sine";o.frequency.value=f;g.gain.setValueAtTime(vol||.13,c.currentTime+(when||0));g.gain.exponentialRampToValueAtTime(.001,c.currentTime+(when||0)+(dur||.1));o.connect(g);g.connect(c.destination);o.start(c.currentTime+(when||0));o.stop(c.currentTime+(when||0)+(dur||.1)+.02)}catch(e){}}
var sClick=function(){tone(520,.07,"triangle")},sMove=function(){tone(380+Math.random()*100,.09,"sine",.11)},sWin=function(){[523,659,784,1046,1318,1568].forEach(function(f,i){tone(f,.2,"sine",.15,i*.1)})};
var fx=$("fx"),fctx=fx.getContext("2d"),parts=[];
function fxSize(){fx.width=innerWidth;fx.height=innerHeight}addEventListener("resize",fxSize);fxSize();
function burst(x,y,color,n){for(var i=0;i<(n||14);i++)parts.push({x:x,y:y,vx:(Math.random()-.5)*7,vy:(Math.random()-.5)*7-2,life:1,color:color||"#fca5a5",r:2+Math.random()*3})}
(function fxLoop(){fctx.clearRect(0,0,fx.width,fx.height);parts=parts.filter(function(p){return p.life>0});parts.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=.22;p.life-=.028;fctx.globalAlpha=Math.max(0,p.life);fctx.fillStyle=p.color;fctx.beginPath();fctx.arc(p.x,p.y,p.r,0,7);fctx.fill()});fctx.globalAlpha=1;requestAnimationFrame(fxLoop)})();
/* ---------- 横刀立马布局（4列x5行） ---------- */
var ROWS=5,COLS=4;
function initPieces(){return[
 {id:"cc",name:"曹操",w:2,h:2,r:0,c:1,col:["#dc2626","#991b1b"]},
 {id:"gy",name:"关羽",w:2,h:1,r:2,c:1,col:["#f59e0b","#b45309"]},
 {id:"zf",name:"张飞",w:1,h:2,r:0,c:0,col:["#3b82f6","#1d4ed8"]},
 {id:"zy",name:"赵云",w:1,h:2,r:0,c:3,col:["#3b82f6","#1d4ed8"]},
 {id:"mc",name:"马超",w:1,h:2,r:2,c:0,col:["#3b82f6","#1d4ed8"]},
 {id:"hz",name:"黄忠",w:1,h:2,r:2,c:3,col:["#3b82f6","#1d4ed8"]},
 {id:"b1",name:"兵",w:1,h:1,r:3,c:1,col:["#6b7280","#374151"]},
 {id:"b2",name:"兵",w:1,h:1,r:3,c:2,col:["#6b7280","#374151"]},
 {id:"b3",name:"兵",w:1,h:1,r:4,c:0,col:["#6b7280","#374151"]},
 {id:"b4",name:"兵",w:1,h:1,r:4,c:3,col:["#6b7280","#374151"]}
]}
var pieces,moves,sel,over;
var cv=$("cv"),ctx=cv.getContext("2d"),CS=0,PAD=14;
/* ---------- 三段式提示（按曹操所在行） ---------- */
function hintText(){
  var r=pieces[0].r; // 曹操行：0顶 → 3出口位
  if(r<=0)return "<b style='color:#fff'>【开局】</b><br>先把四个小兵往下、往两边挪，腾出中间通道。关键是关羽（横着的那员大将）——想办法把它移到最下面一行，曹操才能下来。别让小兵堵在中间两列！";
  if(r===1)return "<b style='color:#fff'>【中盘】</b><br>曹操下来一格了，继续！把挡在曹操下方的兵将挪到两侧，目标是让曹操一路下到第 4 行。四个竖将尽量往底行两边塞，中间留给曹操。";
  return "<b style='color:#fff'>【残局】</b><br>曹操离出口很近了！检查底部中间两列是否畅通——把挡在曹操正下方的棋子移到两侧，曹操就能直下走出▼出口。一鼓作气！";
}
function show(id){["s-start","s-game","s-end"].forEach(function(s){$(s).classList.toggle("on",s===id)})}
function startGame(){pieces=initPieces();moves=0;sel=null;over=false;$("moves").textContent=0;sizeCv();show("s-game")}
function sizeCv(){var w=Math.min(400,innerWidth-28);CS=Math.floor((w-PAD*2)/COLS);cv.width=CS*COLS+PAD*2;cv.height=CS*ROWS+PAD*2+26;draw()}
function occ(){var g=[];for(var r=0;r<ROWS;r++){g.push([]);for(var c=0;c<COLS;c++)g[r].push(null)}pieces.forEach(function(p){for(var dr=0;dr<p.h;dr++)for(var dc=0;dc<p.w;dc++)g[p.r+dr][p.c+dc]=p});return g}
function pieceAt(r,c){var g=occ();if(r<0||r>=ROWS||c<0||c>=COLS)return undefined;return g[r][c]}
function canMove(p,dr,dc){var g=occ();for(var i=0;i<p.h;i++)for(var j=0;j<p.w;j++){var nr=p.r+i+dr,nc=p.c+j+dc;if(nr<0||nr>=ROWS||nc<0||nc>=COLS)return false;var o=g[nr][nc];if(o&&o!==p)return false}return true}
function doMove(p,dr,dc){if(!canMove(p,dr,dc))return false;p.r+=dr;p.c+=dc;moves++;$("moves").textContent=moves;sMove();draw();
 var cc=pieces[0];if(cc.r===3&&cc.c===1)win();return true}
function draw(){ctx.clearRect(0,0,cv.width,cv.height);
 // 棋盘底
 ctx.fillStyle="rgba(255,255,255,.04)";roundRect(PAD-6,PAD-6,CS*COLS+12,CS*ROWS+12,12);ctx.fill();
 // 网格线
 ctx.strokeStyle="rgba(255,255,255,.07)";ctx.lineWidth=1;
 for(var r=0;r<=ROWS;r++){ctx.beginPath();ctx.moveTo(PAD,PAD+r*CS);ctx.lineTo(PAD+COLS*CS,PAD+r*CS);ctx.stroke()}
 for(var c=0;c<=COLS;c++){ctx.beginPath();ctx.moveTo(PAD+c*CS,PAD);ctx.lineTo(PAD+c*CS,PAD+ROWS*CS);ctx.stroke()}
 // 出口
 ctx.fillStyle="#4ade80";ctx.font="bold 15px sans-serif";ctx.textAlign="center";
 ctx.fillText("▼ 出 口 ▼",PAD+COLS*CS/2,PAD+ROWS*CS+20);
 // 棋子
 pieces.forEach(function(p){var x=PAD+p.c*CS+3,y=PAD+p.r*CS+3,w=p.w*CS-6,h=p.h*CS-6;
  var g=ctx.createLinearGradient(x,y,x,y+h);g.addColorStop(0,p.col[0]);g.addColorStop(1,p.col[1]);
  ctx.fillStyle=g;roundRect(x,y,w,h,10);ctx.fill();
  if(sel===p){ctx.strokeStyle="#ffd76a";ctx.lineWidth=3;roundRect(x,y,w,h,10);ctx.stroke()}
  ctx.fillStyle="#fff";ctx.font="bold "+Math.floor(Math.min(w,h)*.34)+"px sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";
  var lines=p.name.length>2?[p.name]:p.name.split("");
  if(p.h===1&&p.w===2){ctx.fillText(p.name,x+w/2,y+h/2)}
  else{lines.forEach(function(ch,i){ctx.fillText(ch,x+w/2,y+h/2+(i-(lines.length-1)/2)*Math.min(w,h)*.36)})}
  ctx.textBaseline="alphabetic"})}
function roundRect(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function win(){over=true;sWin();var r=cv.getBoundingClientRect();for(var i=0;i<6;i++)setTimeout(function(){burst(r.left+Math.random()*r.width,r.top+Math.random()*r.height,["#ffd76a","#fca5a5","#4ade80"][i%3],24)},i*130);
 var score=Math.max(100,Math.round(20000/Math.max(20,moves)));
 var best=store.get("best",null),nb=false;if(best==null||score>best){store.set("best",score);nb=true}
 setTimeout(function(){$("endInfo").textContent="用了 "+moves+" 步 · 得分 "+score;$("endBest").textContent=nb?"🏆 新纪录！":"历史最高 "+best;show("s-end")},700)}
function pos2cell(e){var r=cv.getBoundingClientRect();var t=(e.touches&&e.touches.length)?e.touches[0]:((e.changedTouches&&e.changedTouches.length)?e.changedTouches[0]:e);var x=t.clientX-r.left-PAD,y=t.clientY-r.top-PAD;var c=Math.floor(x/CS),rr=Math.floor(y/CS);if(c<0||c>=COLS||rr<0||rr>=ROWS)return null;return[rr,c]}
var dStart=null,dPiece=null,dMoved=false;
cv.addEventListener("touchstart",function(e){e.preventDefault();var p=pos2cell(e);if(!p)return;dStart=[e.touches[0].clientX,e.touches[0].clientY];dPiece=pieceAt(p[0],p[1]);dMoved=false},{passive:false});
cv.addEventListener("touchmove",function(e){e.preventDefault();if(!dPiece||over)return;var dx=e.touches[0].clientX-dStart[0],dy=e.touches[0].clientY-dStart[1];if(Math.abs(dx)<CS*.4&&Math.abs(dy)<CS*.4)return;
 var dr=0,dc=0;if(Math.abs(dx)>Math.abs(dy))dc=dx>0?1:-1;else dr=dy>0?1:-1;
 if(doMove(dPiece,dr,dc)){dStart=[e.touches[0].clientX,e.touches[0].clientY];dMoved=true}},{passive:false});
cv.addEventListener("touchend",function(e){e.preventDefault();if(!dPiece||over){dPiece=null;return}
 if(!dMoved){ // 点选逻辑
  var p=pos2cell(e);if(p){var hit=pieceAt(p[0],p[1]);
   if(sel&&!hit){ // 点空格：尝试向该方向移动
    var dr=p[0]-sel.r,dc=p[1]-sel.c;
    // 找到相邻方向
    var moved=false;
    if(Math.abs(dr)+Math.abs(dc)>=1){var sdr=dr===0?0:(dr>0?1:-1),sdc=dc===0?0:(dc>0?1:-1);
     if(Math.abs(dr)>=Math.abs(dc)){if(canMove(sel,sdr,0))moved=doMove(sel,sdr,0);else if(sdc!==0&&canMove(sel,0,sdc))moved=doMove(sel,0,sdc)}
     else{if(canMove(sel,0,sdc))moved=doMove(sel,0,sdc);else if(sdr!==0&&canMove(sel,sdr,0))moved=doMove(sel,sdr,0)}}
    if(!moved){sel=null;sClick();draw()}
    else sel=null;}
   else if(hit===sel){sel=null;sClick();draw()}
   else{sel=hit;sClick();draw()}}}
 dPiece=null;dMoved=false});
var mdown=false;
cv.addEventListener("mousedown",function(e){if(over)return;var p=pos2cell(e);if(!p)return;var hit=pieceAt(p[0],p[1]);mdown=true;
 if(sel&&!hit){var dr=p[0]-sel.r,dc=p[1]-sel.c;var sdr=dr===0?0:(dr>0?1:-1),sdc=dc===0?0:(dc>0?1:-1);var moved=false;
  if(Math.abs(dr)>=Math.abs(dc)){if(canMove(sel,sdr,0))moved=doMove(sel,sdr,0);else if(sdc!==0&&canMove(sel,0,sdc))moved=doMove(sel,0,sdc)}
  else{if(canMove(sel,0,sdc))moved=doMove(sel,0,sdc);else if(sdr!==0&&canMove(sel,sdr,0))moved=doMove(sel,sdr,0)}
  sel=null;draw();mdown=false;return}
 sel=hit;sClick();draw()});
cv.addEventListener("mouseup",function(){mdown=false});
$("btnStart").onclick=function(){sClick();startGame()};
$("btnReset").onclick=function(){sClick();startGame()};
$("btnAgain").onclick=function(){sClick();startGame()};
$("btnHome").onclick=function(){sClick();show("s-start")};
$("sndBtn").onclick=function(){soundOn=!soundOn;store.set("sound",soundOn);$("sndBtn").textContent=soundOn?"🔊":"🔇";if(soundOn)sClick()};
$("sndBtn").textContent=soundOn?"🔊":"🔇";
$("pauseBtn").onclick=function(){if(!$("s-game").classList.contains("on"))return;sClick();$("pauseov").classList.add("on")};
$("hintBtn").onclick=function(){if(!$("s-game").classList.contains("on")||!pieces||over)return;sClick();$("hintText").innerHTML=hintText();$("hintov").classList.add("on")};
$("hintClose").onclick=function(){sClick();$("hintov").classList.remove("on")};
$("btnResume").onclick=function(){sClick();$("pauseov").classList.remove("on")};
$("btnQuit").onclick=function(){sClick();$("pauseov").classList.remove("on");show("s-start")};
addEventListener("resize",function(){if($("s-game").classList.contains("on"))sizeCv()});
</script>
</body>
</html>
