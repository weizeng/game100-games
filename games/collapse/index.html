<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>方块消消</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:linear-gradient(160deg,#1e2a4d 0%,#121212 55%,#0a0a0a 100%);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;display:flex;justify-content:center;min-height:100vh;touch-action:manipulation;-webkit-user-select:none;user-select:none;overflow-x:hidden}
.wrap{width:100%;max-width:480px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:10px;position:relative;z-index:1}
.topbar{width:100%;display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:9px 12px;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.topbar .title{font-weight:700;font-size:16px}
.topbar .stat{color:#a9bdf5;font-size:13px}
.topbar .stat b{color:#fff;font-size:15px}
.topbar .stat b.low{color:#ff6b6b;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.4}}
.tbtn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:#fff;font-size:16px;min-width:38px;height:38px;border-radius:11px;cursor:pointer;transition:transform .08s}
.tbtn:active{transform:scale(.9)}
.screen{width:100%;display:none;flex-direction:column;align-items:center;gap:10px}
.screen.on{display:flex}
.card{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:20px;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.card h1{font-size:26px;margin-bottom:6px;background:linear-gradient(90deg,#a5b4fc,#f0abfc);-webkit-background-clip:text;background-clip:text;color:transparent}
.card h2{font-size:22px;margin-bottom:8px}
.card p{color:#b8c6f0;font-size:14px;line-height:1.7;margin-bottom:10px}
.bigbtn{background:linear-gradient(135deg,#6366f1,#a855f7);border:none;color:#fff;font-size:18px;font-weight:700;padding:14px 46px;border-radius:999px;cursor:pointer;box-shadow:0 6px 18px rgba(99,102,241,.45);transition:transform .1s}
.bigbtn:active{transform:scale(.93)}
.ghostbtn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#fff;font-size:14px;padding:10px 22px;border-radius:999px;cursor:pointer;transition:transform .1s}
.ghostbtn:active{transform:scale(.93)}
#cvwrap{width:100%;display:flex;justify-content:center;touch-action:none}
#cv{border-radius:14px;background:rgba(255,255,255,.03);touch-action:none;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.hint{color:#b8c6f0;font-size:13px}
.best{color:#ffd76a;font-size:14px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
.float{position:fixed;pointer-events:none;z-index:60;font-weight:700;font-size:18px;animation:floatup 1.1s ease-out forwards}
@keyframes floatup{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-46px)}}
#pauseov{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:40;backdrop-filter:blur(4px)}
#pauseov.on{display:flex}
.pausecard{background:#1c1c22;border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:28px 36px;text-align:center;display:flex;flex-direction:column;gap:12px}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="wrap">
  <div class="topbar">
    <span class="title">💥 方块消消</span>
    <span class="stat">⏱<b id="tm">90</b>s · 分数 <b id="score">0</b></span>
    <span><button class="tbtn" id="sndBtn">🔊</button><button class="tbtn" id="pauseBtn">⏸</button></span>
  </div>
  <div class="screen on" id="s-start">
    <div class="card">
      <h1>💥 方块消消</h1>
      <p>点击 <b>3 个或以上</b>相连的同色方块消除！<br>上方方块下落补充。连块越大分数越高<br>（n 个方块 = n² × 10 分）。<br>⏱ 限时 <b>90 秒</b>，冲击最高分！</p>
      <button class="bigbtn" id="btnStart">开始挑战</button>
    </div>
  </div>
  <div class="screen" id="s-game">
    <div id="cvwrap"><canvas id="cv"></canvas></div>
    <div class="hint">点击 3+ 连块消除 · 连击加成！</div>
  </div>
  <div class="screen" id="s-end">
    <div class="card">
      <h2>⏰ 时间到！</h2>
      <p id="endInfo"></p>
      <p class="best" id="endBest"></p>
      <div style="display:flex;gap:10px;justify-content:center"><button class="bigbtn" id="btnAgain">再来一次</button><button class="ghostbtn" id="btnHome">返回</button></div>
    </div>
  </div>
</div>
<div id="pauseov"><div class="pausecard"><h2>⏸ 已暂停</h2><button class="bigbtn" id="btnResume">继续</button><button class="ghostbtn" id="btnQuit">退出</button></div></div>
<script>
"use strict";
var $=function(id){return document.getElementById(id)};
var store={get:function(k,d){try{var v=localStorage.getItem("collapse_"+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set:function(k,v){try{localStorage.setItem("collapse_"+k,JSON.stringify(v))}catch(e){}}};
var AC=null,soundOn=store.get("sound",true);
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==="suspended"){AC.resume()}return AC}
function tone(f,dur,type,vol,when){if(!soundOn)return;var c=ac();if(!c)return;try{var o=c.createOscillator(),g=c.createGain();o.type=type||"sine";o.frequency.value=f;g.gain.setValueAtTime(vol||.13,c.currentTime+(when||0));g.gain.exponentialRampToValueAtTime(.001,c.currentTime+(when||0)+(dur||.1));o.connect(g);g.connect(c.destination);o.start(c.currentTime+(when||0));o.stop(c.currentTime+(when||0)+(dur||.1)+.02)}catch(e){}}
var sClick=function(){tone(520,.07,"triangle")},sErr=function(){tone(170,.14,"sawtooth",.09)};
function popSound(n){var base=Math.min(1200,400+n*60);for(var i=0;i<Math.min(6,n);i++)tone(base+i*90,.1,"triangle",.12,i*.05)}
var sWin=function(){[523,659,784,1046,1318].forEach(function(f,i){tone(f,.2,"sine",.15,i*.1)})};
var fx=$("fx"),fctx=fx.getContext("2d"),parts=[];
function fxSize(){fx.width=innerWidth;fx.height=innerHeight}addEventListener("resize",fxSize);fxSize();
function burst(x,y,color,n){for(var i=0;i<(n||16);i++)parts.push({x:x,y:y,vx:(Math.random()-.5)*8,vy:(Math.random()-.5)*8-2,life:1,color:color,r:2+Math.random()*3})}
(function fxLoop(){fctx.clearRect(0,0,fx.width,fx.height);parts=parts.filter(function(p){return p.life>0});parts.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=.22;p.life-=.03;fctx.globalAlpha=Math.max(0,p.life);fctx.fillStyle=p.color;fctx.beginPath();fctx.arc(p.x,p.y,p.r,0,7);fctx.fill()});fctx.globalAlpha=1;requestAnimationFrame(fxLoop)})();
function floatTxt(txt,x,y,color){var d=document.createElement("div");d.className="float";d.textContent=txt;d.style.left=x+"px";d.style.top=y+"px";d.style.color=color||"#ffd76a";document.body.appendChild(d);setTimeout(function(){d.remove()},1150)}
/* ---------- 游戏 ---------- */
var COLS=8,ROWS=10,NCOLOR=4,TIME=90;
var CCOLORS=["#ef4444","#3b82f6","#22c55e","#eab308"];
var grid,score,left,over,paused,timer,animT=0,hover;
var cv=$("cv"),ctx=cv.getContext("2d"),CS=0;
function show(id){["s-start","s-game","s-end"].forEach(function(s){$(s).classList.toggle("on",s===id)})}
function newBlock(){return Math.floor(Math.random()*NCOLOR)}
function startGame(){grid=[];for(var r=0;r<ROWS;r++){grid.push([]);for(var c=0;c<COLS;c++)grid[r].push(newBlock())}
 // 避免开局无解：保证至少一组 3 连
 if(!anyGroup())grid[ROWS-1][0]=grid[ROWS-1][1]=grid[ROWS-1][2]=0;
 score=0;left=TIME;over=false;paused=false;hover=null;$("score").textContent=0;$("tm").textContent=TIME;$("tm").classList.remove("low");
 sizeCv();show("s-game");clearInterval(timer);timer=setInterval(function(){if(paused||over)return;left--;$("tm").textContent=left;if(left<=10)$("tm").classList.add("low");if(left<=0)finish()},1000)}
function sizeCv(){var w=Math.min(400,innerWidth-28);CS=Math.floor(w/COLS);cv.width=CS*COLS;cv.height=CS*ROWS;draw()}
function groupAt(r,c){var col=grid[r][c],seen={},stack=[[r,c]],res=[];seen[r+"_"+c]=1;
 while(stack.length){var p=stack.pop();res.push(p);var d=[[1,0],[-1,0],[0,1],[0,-1]];
  for(var i=0;i<4;i++){var nr=p[0]+d[i][0],nc=p[1]+d[i][1],k=nr+"_"+nc;
   if(nr>=0&&nr<ROWS&&nc>=0&&nc<COLS&&!seen[k]&&grid[nr][nc]===col){seen[k]=1;stack.push([nr,nc])}}}
 return res}
function anyGroup(){for(var r=0;r<ROWS;r++)for(var c=0;c<COLS;c++)if(groupAt(r,c).length>=3)return true;return false}
function draw(){animT+=.06;ctx.clearRect(0,0,cv.width,cv.height);
 for(var r=0;r<ROWS;r++)for(var c=0;c<COLS;c++){var col=grid[r][c];if(col<0)continue;
  var x=c*CS+2,y=r*CS+2,w=CS-4;
  var isH=hover&&hover[0]===r&&hover[1]===c;
  var g=ctx.createLinearGradient(x,y,x,y+w);g.addColorStop(0,CCOLORS[col]);g.addColorStop(1,"rgba(0,0,0,.35)");
  ctx.fillStyle=g;roundRect(x,y,w,w,8);ctx.fill();
  ctx.fillStyle="rgba(255,255,255,.25)";roundRect(x+4,y+4,w-8,Math.max(3,w*.22),4);ctx.fill();
  if(isH){ctx.strokeStyle="#fff";ctx.lineWidth=2.5;roundRect(x,y,w,w,8);ctx.stroke()}}}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function tap(r,c){if(over||paused||r<0||c<0||r>=ROWS||c>=COLS||grid[r][c]<0)return;
 var grp=groupAt(r,c);
 if(grp.length<3){sErr();var rc=cv.getBoundingClientRect();floatTxt("需要 3 个以上连块",rc.left+20,rc.top+40,"#ff6b6b");return}
 var col=grid[r][c],n=grp.length,gain=n*n*10;
 score+=gain;$("score").textContent=score;popSound(n);
 grp.forEach(function(p){grid[p[0]][p[1]]=-1});
 // 粒子
 var rc2=cv.getBoundingClientRect();grp.forEach(function(p){burst(rc2.left+(p[1]+.5)*CS,rc2.top+(p[0]+.5)*CS,CCOLORS[col],3)});
 floatTxt("+"+gain,rc2.left+(c+.5)*CS-20,rc2.top+(r+.5)*CS-10,"#ffd76a");
 // 重力下落 + 顶部补充
 for(var cc=0;cc<COLS;cc++){var write=ROWS-1;for(var rr=ROWS-1;rr>=0;rr--){if(grid[rr][cc]>=0){grid[write][cc]=grid[rr][cc];if(write!==rr)grid[rr][cc]=-1;write--}}for(var f=write;f>=0;f--)grid[f][cc]=newBlock()}
 draw();
 if(!anyGroup()){ // 盘面僵死：洗牌补充
  for(var i=0;i<ROWS;i++)for(var j=0;j<COLS;j++)grid[i][j]=newBlock();
  if(!anyGroup())grid[ROWS-1][0]=grid[ROWS-1][1]=grid[ROWS-1][2]=0;
  floatTxt("洗牌！",innerWidth/2-30,innerHeight/2,"#7dd3fc");draw()}}
function finish(){over=true;clearInterval(timer);sWin();for(var i=0;i<5;i++)setTimeout(function(){burst(innerWidth/2+(Math.random()-.5)*280,innerHeight/3,["#ffd76a","#a5b4fc","#4ade80"][i%3],22)},i*120);
 var best=store.get("best",null),nb=false;if(best==null||score>best){store.set("best",score);nb=true}
 setTimeout(function(){$("endInfo").textContent="最终得分 "+score;$("endBest").textContent=nb?"🏆 新纪录！":"历史最高 "+best;show("s-end")},600)}
function pos2cell(e){var r=cv.getBoundingClientRect();var t=(e.touches&&e.touches.length)?e.touches[0]:((e.changedTouches&&e.changedTouches.length)?e.changedTouches[0]:e);var x=t.clientX-r.left,y=t.clientY-r.top;return[Math.floor(y/CS),Math.floor(x/CS)]}
cv.addEventListener("touchstart",function(e){e.preventDefault();var p=pos2cell(e);hover=p;draw()},{passive:false});
cv.addEventListener("touchend",function(e){e.preventDefault();var p=pos2cell(e);hover=null;if(p)tap(p[0],p[1]);else draw()});
cv.addEventListener("mousedown",function(e){var p=pos2cell(e);if(p)tap(p[0],p[1])});
cv.addEventListener("mousemove",function(e){if(e.buttons){var p=pos2cell(e);if(p&&( !hover||hover[0]!==p[0]||hover[1]!==p[1])){hover=p;draw()}}});
$("btnStart").onclick=function(){sClick();startGame()};
$("btnAgain").onclick=function(){sClick();startGame()};
$("btnHome").onclick=function(){sClick();show("s-start")};
$("sndBtn").onclick=function(){soundOn=!soundOn;store.set("sound",soundOn);$("sndBtn").textContent=soundOn?"🔊":"🔇";if(soundOn)sClick()};
$("sndBtn").textContent=soundOn?"🔊":"🔇";
$("pauseBtn").onclick=function(){if(!$("s-game").classList.contains("on")||over)return;sClick();paused=true;$("pauseov").classList.add("on")};
$("btnResume").onclick=function(){sClick();paused=false;$("pauseov").classList.remove("on")};
$("btnQuit").onclick=function(){sClick();paused=false;$("pauseov").classList.remove("on");clearInterval(timer);over=true;show("s-start")};
setInterval(function(){if($("s-game").classList.contains("on")&&!paused&&!over)draw()},150);
addEventListener("resize",function(){if($("s-game").classList.contains("on"))sizeCv()});
</script>
</body>
</html>
