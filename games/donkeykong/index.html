<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>金刚</title>
<link rel="icon" href="data:,">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{display:flex;justify-content:center;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.wrap{width:100%;max-width:480px;height:100%;padding:10px 12px;display:flex;flex-direction:column;align-items:center;gap:6px}
.topbar{width:100%;display:flex;justify-content:space-between;align-items:center;flex-wrap:nowrap!important;gap:4px}
.topbar .stat{display:flex;gap:6px;align-items:center;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:12px;overflow:hidden}
.topbar .tools{display:flex;gap:4px;flex:none}
.topbar .tools .iconbtn{min-width:44px;min-height:44px;padding:0 4px}
.subbar{width:100%;display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:13px;font-weight:800;font-variant-numeric:tabular-nums}
.prog{flex:1;height:10px;border-radius:6px;background:rgba(0,0,0,.2);overflow:hidden}.prog i{display:block;height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,#ffd34d,#ff5fa2);transition:width .2s}
.stagebox{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;position:relative}
.overlay{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;z-index:20;padding:20px;text-align:center}
.overlay.hidden,.hidden{display:none!important}
.lvgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;width:100%}
.lvgrid .lvl{min-height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:16px;padding:3px!important;line-height:1.1}
.lvgrid .lvl small{font-size:10px;letter-spacing:-1px;margin-top:2px}
.lvgrid .lvl[disabled]{opacity:.45}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:100%}
.shop{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:100%}
.shop button{min-height:46px;font-size:12px!important;padding:3px!important;line-height:1.2}
.aids{width:100%;display:flex;gap:5px;justify-content:center;flex:none}
.aids button.cbtn{min-height:46px;min-width:54px;padding:4px 6px!important;font-size:14px!important;font-weight:900}
.aids button.act{min-height:46px;min-width:86px;flex:1;font-size:13px!important;padding:4px 6px!important;font-weight:900}
#tutStep{font-size:12px;opacity:.75}
#tutPic{font-size:44px;line-height:1.1}
#overStars{font-size:30px;letter-spacing:4px;min-height:34px}
#toast{position:fixed;left:50%;top:15%;transform:translate(-50%,-10px);background:rgba(10,8,30,.9);color:#fff;font-weight:800;padding:10px 18px;border-radius:999px;z-index:999;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;font-size:15px;box-shadow:0 0 18px rgba(255,61,154,.5);white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
.lvTag{font-size:12px;opacity:.85}
#cv{display:block;touch-action:none;max-width:100%;max-height:100%}
.hint{font-size:12px;opacity:.85;text-align:center;flex:none}
</style>
<!-- GAME UI BEGIN -->
<style>
:root{--page:#172638;--surface:#22374c;--soft:#2e4760;--ink:#f0f6fc;--muted:#b1c6d9;--accent:#f0bc74;--on-accent:#342717;--line:#45637c;--stage:#142438;--page:#0b0817;--surface:#19132e;--soft:#29243d;--ink:#f5f2ff;--muted:#a99fcb;--accent:#f54988;--on-accent:#460e23;--line:#7252cc;--b-bg1:#1b1433;--b-bg2:#0b0817;--b-btn:#f54988;--b-btn-hi:#f771a2;--b-edge:#b5245a;--b-glow:#5ce1e6;--b-glow-rgb:92,225,230;--b-pedge-rgb:114,82,204;--b-btn-rgb:245,73,136;--b-bg2-rgb:11,8,23;--b-surf-rgb:25,19,46;--b-btn-ink:#460e23;--b-btn-tsh:0 1px 0 rgba(255,255,255,.35);--b-coin-ink:#460e23;--b-coin-tsh:none;--b-key-ink:#f5f2ff;--b-title:#ffffff;--b-hint-ink:#f7f4ff}
/* Shared presentation only; mechanics and state remain inside each standalone game. */
html.game-ui{background:var(--page);color:var(--ink);color-scheme:light;font-family:"HarmonyOS Sans SC","MiSans","OPPOSans","PingFang SC","Microsoft YaHei UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
html.game-ui:is([data-theme="space"],[data-theme="arcade"],[data-theme="lab"],[data-theme="ocean"],[data-theme="magic"]){color-scheme:dark}
.game-ui body{background:var(--page);color:var(--ink);font-family:inherit;overscroll-behavior:none}
.game-ui body>.wrap{padding:14px 14px max(14px,env(safe-area-inset-bottom));gap:10px;max-width:500px}
.game-ui #app{background:var(--page);color:var(--ink)}
.game-ui :is(.topbar,#topbar){gap:8px;flex-wrap:wrap;min-height:54px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:8px 12px;box-shadow:0 4px 12px rgba(0,0,0,.06);font-size:13px}
.game-ui :is(.title,.tb-title,#topbar .t,.topbar .t){color:var(--ink);font-size:16px;font-weight:800;letter-spacing:-.2px}
.game-ui :is(.topbar,.hud,#hud,#topbar) :is(b,.v){color:var(--accent);font-variant-numeric:tabular-nums}
.game-ui :is(.stat,.topbar .s,.topbar .stat,.scorebar,.stats,.tip,.hint,.hintline,.hsline,.best,.hiscore){color:var(--muted);line-height:1.6}
.game-ui :is(.hint,.hintline,.tip){font-size:12px;max-width:40em;text-wrap:pretty}
.game-ui .scorebar{padding:6px 10px;gap:8px;flex-wrap:wrap}
.game-ui :is(.iconbtn,.iconBtn,.icobtn,.ibtn,.tbtn,.hbtn,.ib,.pause){min-width:44px;min-height:44px;flex-shrink:0;border-radius:12px;background:var(--soft);color:var(--ink);border:1px solid var(--line);box-shadow:none;font-size:16px}
.game-ui button{font-family:inherit;cursor:pointer;touch-action:manipulation}
.game-ui button:focus-visible,.game-ui [tabindex]:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
.game-ui :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn){background:var(--accent);color:var(--on-accent);border:1px solid transparent;border-radius:14px;min-height:48px;padding:12px 26px;font-size:16px;font-weight:800;letter-spacing:.2px;box-shadow:0 3px 0 var(--line);text-shadow:none;max-width:100%}
.game-ui :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn):active{box-shadow:none;transform:translateY(2px)}
.game-ui :is(.ghost,.ghostbtn,.btn2,.abtn,.toolbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line);box-shadow:none;border-radius:12px;min-height:44px}
.game-ui :is(.rowbtns,.btnrow,.ctlrow){gap:8px;flex-wrap:wrap;justify-content:center}
.game-ui :is(.pill,.hudbox,.hud .p){background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:999px;box-shadow:none;font-variant-numeric:tabular-nums}
.game-ui :is(.dbtn,.cbtn,.gbtn,.holdbtn,.firebtn,.bombbtn,.jumpbtn,.pumpbtn,.nbtn){border-radius:12px;box-shadow:0 2px 0 var(--line);min-height:44px}
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv,.screen):has(>.ui-panel){padding:16px;overflow-y:auto;overscroll-behavior:contain}
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv):has(>.ui-panel){background:var(--page);justify-content:safe center;align-items:center}
.game-ui .ui-panel{width:min(100%,372px);max-height:100%;overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:14px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:26px;padding:26px 22px;box-shadow:0 20px 44px rgba(15,25,40,.16);text-align:center;margin:auto}
.game-ui .ui-panel :is(.card,.panel,.pausecard,.ovcard){display:contents}
.game-ui .ui-panel :is(h1,h2,.gamename,.gametitle){font-size:27px;line-height:1.25;font-weight:850;color:var(--ink);background:none;-webkit-text-fill-color:currentColor;text-shadow:none;letter-spacing:-.4px;margin:0}
.game-ui .ui-panel :is(p,.howto,.sub,.rule){font-size:13.5px;line-height:1.7;color:var(--muted);background:none;border:0;box-shadow:none;padding:0;margin:0;max-width:30em;text-align:center;white-space:normal}
.game-ui .ui-panel :is(.bigemoji,.ic,.big):not(.bigscore){animation:none;filter:none;text-shadow:none}
.game-ui .ui-emblem{width:80px;height:80px;display:grid;place-items:center;border:1px solid var(--line);border-radius:24px;background:var(--soft);font-size:42px;line-height:1;flex-shrink:0;position:relative}
.game-ui[data-theme="wood"] .ui-panel h1{letter-spacing:1px}
.game-ui .ui-panel :is(.score,.bigscore,.bigScore,.scorebig){color:var(--accent);font-size:48px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.1}
.game-ui .ui-panel :is(.best,.hsline,.hiscore,.endstats,.endstats b){color:var(--muted);font-size:13px;line-height:1.6}
.game-ui .ui-mode{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--soft);padding:4px;border:1px solid var(--line);border-radius:14px;width:100%}
.game-ui .ui-mode button{min-height:44px;border:0;border-radius:10px;background:transparent;color:var(--muted);font-size:13.5px;font-weight:750;box-shadow:none}
.game-ui .ui-mode button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 2px 6px rgba(15,25,40,.12)}
.game-ui .ui-panel .ui-mode-note{font-size:12px;line-height:1.5;text-align:center;color:var(--muted)}
.game-ui .ui-mode-status{display:block;padding:8px 14px;color:var(--ink);font-size:12.5px;font-weight:700;line-height:1.45;text-align:center;border:1px solid var(--line);border-radius:999px;background:var(--surface);margin:4px auto;max-width:min(360px,92vw);pointer-events:none;box-shadow:0 10px 26px rgba(0,0,0,.22)}
.game-ui body>.wrap>canvas:not(#fx){background-color:var(--stage);box-shadow:0 0 0 1px var(--line),0 12px 28px rgba(0,0,0,.14);border-radius:18px;flex-shrink:0}
.game-ui .screen>canvas.game{box-shadow:0 0 0 1px var(--line),0 12px 28px rgba(0,0,0,.14)}
.game-ui #hud{gap:6px;background:var(--surface);color:var(--ink)}
.game-ui #hud :is(.left,.t,.s,.grp,.pill){color:var(--ink)}
.game-ui #hud .pill{background:var(--surface);border-color:var(--line)}
.game-ui body canvas:is(#cv,#game,#board){background-color:var(--stage)}
.game-ui :is(button.dbtn,button.cbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.game-ui :is(button.lvl,button.lvlbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line);border-radius:12px;min-height:50px}
.game-ui :is(button.lvl,button.lvlbtn) :is(.nc,.sz,small){color:var(--muted)}
.game-ui .ui-panel button.lvl{margin:0;min-width:44px;box-shadow:none;padding:6px}
.game-ui #hud :is(.left,.right,.hudl,.hbtns){gap:5px;flex-wrap:wrap}
.game-ui #hud :is(.left,.hudl){min-width:0;flex-shrink:1}
.game-ui #hud :is(.pill,.left){font-size:12px}
.game-ui button:disabled{cursor:default;opacity:.42;box-shadow:none}
.game-ui .ui-panel .ui-assist-note{color:var(--accent);font-weight:700}
@media(min-width:700px){.game-ui body>.wrap{padding-top:24px}.game-ui .ui-panel{padding:32px 28px}}
@media(max-width:360px){.game-ui body>.wrap{padding:8px 10px;gap:8px}.game-ui .ui-panel{padding:20px 16px;gap:11px}.game-ui .ui-panel h1{font-size:24px}.game-ui .ui-emblem{width:68px;height:68px;font-size:36px;border-radius:20px}.game-ui :is(.topbar,#topbar){gap:5px;padding:6px 10px}.game-ui :is(.iconbtn,.icobtn,.ibtn,.tbtn,.ib){min-width:44px;min-height:44px}}
@media(max-height:650px){.game-ui .ui-panel{padding:16px 16px;gap:10px}.game-ui .ui-emblem{width:58px;height:58px;font-size:30px;border-radius:18px}.game-ui .ui-panel h1{font-size:23px}.game-ui .ui-panel :is(p,.howto,.sub,.rule){font-size:12.5px;line-height:1.55}}
@media(prefers-reduced-motion:reduce){.game-ui *, .game-ui *::before,.game-ui *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
/* 开局/结算遮罩铺满整屏，主按钮固定在面板底部，避免被画布尺寸裁切 */
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv):has(>.ui-panel){position:fixed;inset:0;z-index:1000;border-radius:0;padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom))}
.game-ui .ui-panel{touch-action:pan-y}
.game-ui .ui-panel :is(#startBtn,#btnStart,.startbtn,#bStart,#restartBtn,#btnRestart,#againBtn,#btnAgain,#retryBtn,#btnRetry,#playBtn,#btnPlay){position:sticky;bottom:0;z-index:3;flex-shrink:0}
.game-ui .ui-panel :not(.card,.panel,.pausecard,.ovcard,.ui-mode):has(>:is(#startBtn,#btnStart,.startbtn,#bStart,#restartBtn,#btnRestart,#againBtn,#btnAgain,#retryBtn,#btnRetry,#playBtn,#btnPlay)){position:sticky;bottom:0;z-index:3;flex-shrink:0;background:var(--surface);box-shadow:0 -10px 10px -6px var(--surface)}


/* ===== 精工流光 Crafted Arcade (Skin B v2) ===== clean modern mobile arcade depth, refined palettes, studio rim-light, crisp legibility */
html.game-ui[data-skin="b"]{--fb:"HarmonyOS Sans SC","MiSans","OPPOSans","vivo Sans","Noto Sans SC","Noto Sans CJK SC","PingFang SC","Microsoft YaHei UI",system-ui,sans-serif;--ease:cubic-bezier(.22,1,.36,1);--bounce:cubic-bezier(.34,1.35,.64,1);--bg:radial-gradient(120% 55% at 15% 0%,rgba(255,255,255,.55) 0,transparent 60%),radial-gradient(100% 50% at 90% 100%,rgba(var(--b-btn-rgb),.12) 0,transparent 65%),linear-gradient(170deg,var(--b-bg1),var(--b-bg2));font-family:var(--fb)}
html.game-ui[data-skin="b"],html.game-ui[data-skin="b"] body,html.game-ui[data-skin="b"] #app{background:var(--bg);background-color:var(--b-bg2)}
html.game-ui[data-skin="b"] :is(.overlay,.ov,#ov,#overlay,#pauseOv):has(>.ui-panel){background:rgba(var(--b-bg2-rgb),.86);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
html.game-ui[data-skin="b"] body{min-height:100vh;font-family:var(--fb)}
html.game-ui[data-skin="b"] :is(.hint,.hintline,.tip){color:var(--b-hint-ink);font-weight:600;text-shadow:none;opacity:.88}
/* Elevated ceramic panel: hairline rim + layered soft studio shadow */
html.game-ui[data-skin="b"] .ui-panel{background:linear-gradient(180deg,var(--surface),var(--soft) 140%);border:1px solid rgba(255,255,255,.85);border-radius:28px;box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 2px 6px rgba(15,25,40,.06),0 22px 48px -12px rgba(15,25,40,.22);animation:uiB-in .36s var(--ease) both}
html.game-ui[data-skin="b"] .ui-panel :is(h1,h2,.gamename,.gametitle){font-size:28px;font-weight:900;color:var(--b-title);letter-spacing:-.4px;text-shadow:none}
html.game-ui[data-skin="b"] .ui-emblem{width:84px;height:84px;border:1.5px solid rgba(255,255,255,.9);border-radius:24px;background:radial-gradient(90% 75% at 30% 18%,rgba(255,255,255,.92),rgba(255,255,255,0) 60%),linear-gradient(155deg,var(--b-glow),var(--b-btn) 145%);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),inset 0 -3px 8px rgba(0,0,0,.1),0 14px 28px -8px rgba(var(--b-btn-rgb),.42),0 4px 10px rgba(15,25,40,.1);font-size:44px;animation:uiB-float 3.8s ease-in-out infinite}
html.game-ui[data-skin="b"] .ui-panel :is(.score,.bigscore,.bigScore,.scorebig,#finalScore){font-size:52px;font-weight:900;color:var(--b-btn);-webkit-text-fill-color:currentColor;text-shadow:0 4px 14px rgba(var(--b-btn-rgb),.28);letter-spacing:-1px}
html.game-ui[data-skin="b"] .ui-panel :is(h1,.gamename)~h2{font-size:18px;text-shadow:none}
/* Primary CTA: sleek tactile studio button */
html.game-ui[data-skin="b"] :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn,button.actBtn):not(.ghost){position:relative}
html.game-ui[data-skin="b"] :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn,button.actBtn):not(.ghost):not(#\#){overflow:hidden;border:0;border-radius:16px;font-weight:850;color:var(--b-btn-ink);background:linear-gradient(180deg,var(--b-btn-hi),var(--b-btn) 58%);text-shadow:var(--b-btn-tsh);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.45),inset 0 -2px 0 rgba(0,0,0,.12),0 3px 0 var(--b-edge),0 12px 22px -6px rgba(var(--b-btn-rgb),.48);transition:transform .1s var(--ease),box-shadow .1s var(--ease),filter .15s}
html.game-ui[data-skin="b"] :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn,button.actBtn):not(.ghost):not(#\#):active{transform:translateY(2.5px) scale(.985);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.35),0 1px 0 var(--b-edge),0 4px 10px -4px rgba(var(--b-btn-rgb),.4)}
html.game-ui[data-skin="b"] .ui-panel :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn,button.actBtn):not(.ghost):not(#\#){min-height:52px;padding:13px 32px;font-size:17px;letter-spacing:.6px;width:min(100%,260px)}
html.game-ui[data-skin="b"] .ui-panel .rowbtns :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn,button.actBtn):not(.ghost):not(#\#){width:auto;min-width:118px;padding:12px 22px;font-size:15px}
/* Secondary & tactile keys */
html.game-ui[data-skin="b"] :is(.ghost,.ghostbtn,.btn2,.abtn,.toolbtn,.iconbtn,.iconBtn,.icobtn,.ibtn,.tbtn,.hbtn,.ib,.pause,.dbtn,.cbtn,.nbtn,.lvl,.lvlbtn,.dpad button,.pad button){border:1px solid rgba(var(--b-pedge-rgb),.55);border-radius:14px;background:linear-gradient(180deg,#ffffff,var(--soft));color:var(--b-key-ink);font-weight:800;box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 2px 0 rgba(var(--b-pedge-rgb),.45),0 4px 10px rgba(15,25,40,.08);transition:transform .09s var(--ease),box-shadow .09s var(--ease)}
html.game-ui[data-skin="b"] :is(.ghost,.ghostbtn,.btn2,.abtn,.toolbtn,.iconbtn,.iconBtn,.icobtn,.ibtn,.tbtn,.hbtn,.ib,.pause,.dbtn,.cbtn,.nbtn,.lvl,.lvlbtn,.dpad button,.pad button):active{transform:translateY(2px) scale(.97);box-shadow:0 1px 2px rgba(15,25,40,.1)}
html.game-ui[data-skin="b"] :is(.dbtn,.lvl,.lvlbtn):is(.on,.sel,[aria-pressed="true"]){border-color:transparent;background:linear-gradient(180deg,var(--b-btn-hi),var(--b-btn));color:var(--b-btn-ink);text-shadow:var(--b-coin-tsh);box-shadow:0 3px 0 var(--b-edge),0 8px 16px -4px rgba(var(--b-btn-rgb),.42)}
html.game-ui[data-skin="b"] .ui-mode{background:rgba(15,25,40,.06);border:1px solid rgba(var(--b-pedge-rgb),.32);border-radius:14px;padding:3px;box-shadow:inset 0 1px 3px rgba(15,25,40,.07)}
html.game-ui[data-skin="b"] .ui-mode button{border-radius:11px;font-weight:800;min-height:46px;transition:background .18s,color .18s,box-shadow .18s}
html.game-ui[data-skin="b"] .ui-mode button[aria-pressed="true"]{background:#ffffff;color:var(--b-key-ink);box-shadow:0 2px 6px rgba(15,25,40,.12)}
html.game-ui[data-skin="b"] .ui-quick-lvl{min-height:46px;padding:10px 20px;font-size:13.5px;font-weight:750;border-radius:13px;width:min(100%,260px)}
/* HUD: crisp modern floating glass bar */
html.game-ui[data-skin="b"] :is(.topbar,#topbar,:is(.wrap,#app,body)>.hud,.stats,#panel){background:rgba(255,255,255,.86);border:1px solid rgba(255,255,255,.92);border-radius:18px;box-shadow:inset 0 1px 0 #ffffff,0 6px 18px rgba(15,25,40,.09),0 1px 2px rgba(15,25,40,.05);font-weight:750}
html.game-ui[data-skin="b"] #hud{background:rgba(255,255,255,.9);box-shadow:0 6px 18px rgba(15,25,40,.1)}
html.game-ui[data-skin="b"] :is(.topbar,.hud,#hud,#topbar) :is(#score,.score,[id*="score" i]){display:inline-block;min-width:1.6em;text-align:center;padding:1px 9px;line-height:1.35;vertical-align:baseline;border-radius:999px;color:var(--b-coin-ink);background:linear-gradient(180deg,var(--b-btn-hi),var(--b-btn));box-shadow:0 2px 6px rgba(var(--b-btn-rgb),.32);text-shadow:var(--b-coin-tsh);font-weight:850}
html.game-ui[data-skin="b"] :is(.pill,.hudbox,.hud .p){background:rgba(255,255,255,.92);border:1px solid rgba(var(--b-pedge-rgb),.4);border-radius:999px;box-shadow:0 2px 6px rgba(15,25,40,.07);color:var(--ink);font-weight:750;padding:4px 11px}

<script>
'use strict';
/* ===== 关卡/教程/存档/音效 通用套件（单文件内联） ===== */
const UI=window.GameUI||{pick:a=>a,storageGet:k=>localStorage.getItem(k),storageSet:(k,v)=>localStorage.setItem(k,v)};

const $=id=>document.getElementById(id);

const Kit=(function(){
  const K={state:'menu',lv:0};let cfg,P,muted,ac=null,tutI=0,tutThen=null;

  K.sfx=function(n,x){switch(n){
    case 'tap':tone(520,.06,'triangle',.08);break;
    case 'jump':tone(300,.13,'square',.08,580);break;
    case 'climb':tone(480,.05,'sine',.06,560);break;
    case 'smash':tone(180,.18,'sawtooth',.12,420);tone(640,.12,'square',.09,880,.04);break;
    case 'good':tone(660,.08,'sine');tone(990,.1,'sine',.1,0,.06);break;
    case 'combo':tone(500+Math.min(12,x||1)*70,.12,'square',.07);break;
    case 'bad':tone(220,.22,'sawtooth',.1,110);break;
    case 'hit':tone(180,.08,'square',.08,90);break;
    case 'coin':tone(1200,.07,'sine',.09);tone(1600,.09,'sine',.08,0,.06);break;
    case 'boss':tone(110,.5,'sawtooth',.12,70);tone(165,.5,'square',.06,90,.1);break;
    case 'win':[523,659,784,1046].forEach((f,i)=>tone(f,.18,'triangle',.12,0,i*.11));break;
    case 'lose':[392,330,262,196].forEach((f,i)=>tone(f,.22,'sawtooth',.08,0,i*.13));break;

  let tt=0;K.toast=function(msg,ms){const t=$('toast');t.textContent=msg;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),ms||1300);};
  K.vibrate=function(ms){try{if(window.NativeBridge&&window.NativeBridge.vibrate)window.NativeBridge.vibrate(ms);else if(navigator.vibrate)navigator.vibrate(ms);}catch(e){}};
  K.isBoss=i=>(cfg.boss||[]).includes(i+1);
  K.unlocked=i=>i===0||(P.stars[i-1]||0)>0;
  function stars(n){return '★★★'.slice(0,n)+'☆☆☆'.slice(0,3-n);}
  K.starStr=stars;
  function renderLevels(){
    const g=$('lvgrid');g.innerHTML='';
    for(let i=0;i<cfg.levels;i++){const b=document.createElement('button');b.className='lvl';const ok=K.unlocked(i);
      const lab=cfg.label?cfg.label(i):String(i+1);
      b.innerHTML=(ok?(K.isBoss(i)?'👑':'')+lab:'🔒')+'<small>'+(ok?stars(P.stars[i]||0):'&nbsp;')+'</small>';

    $('lvlInfo').textContent='⭐ '+K.totalStars()+'/'+cfg.levels*3+'   💰 '+P.coins+(K.hs()?'   🏆 '+K.hs():'');

      const need=u.stars&&K.totalStars()<u.stars;
      b.innerHTML=u.ic+' '+u.name+' '+lv+'/'+max+'<br>'+(lv>=max?'已满级':need?'🔒 需 ⭐'+u.stars:'💰'+cost+' · '+u.desc);

  }

    if(K.isBoss(i))setTimeout(()=>{K.sfx('boss');K.toast('👑 首领关：'+(cfg.bossName?cfg.bossName(i):'巨猿来袭'),1800);},60);

  K.tutorial=function(then){tutI=0;tutThen=then;['startScr','lvlScr'].forEach(x=>show(x,false));tutShow();show('tutScr',true);};
  function tutEnd(){show('tutScr',false);P.tut=1;save();(tutThen||K.menu)();}
  K.pause=function(){if(K.state!=='play')return;K.state='pause';cfg.pause&&cfg.pause();$('pauseInfo').textContent=(cfg.label?'第 '+cfg.label(K.lv):'第 '+(K.lv+1))+' 关'+(K.isBoss(K.lv)?' · 首领关':'');show('pauseOv',true);};
  K.resume=function(){if(K.state!=='pause')return;K.state='play';show('pauseOv',false);cfg.resume&&cfg.resume();};
  K.win=function(st,score,text){if(K.state!=='play')return;K.state='over';st=Math.max(1,Math.min(3,st|0));const i=K.lv;
    const old=P.stars[i]||0,gain=st*4+(old?0:6)+(K.isBoss(i)?8:0)+(cfg.coinBonus?cfg.coinBonus(i,st,score):0);P.coins+=gain;
    if(st>old)P.stars[i]=st;if((score||0)>(P.best[i]||0))P.best[i]=score;
    const tot=P.best.reduce((a,b)=>a+(b||0),0);if(tot>K.hs())UI.storageSet(key('hs'),tot);save();
    $('overH').textContent=K.isBoss(i)?'👑 击溃巨猿！':'🎉 登顶营救！';$('overStars').textContent=stars(st);$('finalScore').textContent=score||0;
    $('overText').innerHTML=(text||'')+'<br>💰 +'+gain+'　本关最佳 '+(P.best[i]||0);
    const hasNext=i+1<cfg.levels;$('nextBtn').classList.toggle('hidden',!hasNext);if(hasNext)$('nextBtn').textContent=K.isBoss(i+1)?'👑 挑战首领':'下一关';
    show('overScr',true);K.sfx('win');cfg.stop&&cfg.stop();};

    $('overH').textContent='💥 攀登受挫';$('overStars').textContent='☆☆☆';$('finalScore').textContent=score||0;

const cv=$('cv'),ctx=cv.getContext('2d');if(FX)FX.hidpi(cv,ctx,W,H);else{cv.width=W;cv.height=H;}

// 15 关手工配置：gap 抛桶间隔(秒)、spd 滚桶速度、shock 蓝电桶概率、spring 是否含弹簧跳板、bolts 铆钉机关数、boss 首领参数
const LV=[
  {gap:2.3,spd:95,shock:0.0,spring:false,bolts:0},
  {gap:2.1,spd:102,shock:0.15,spring:false,bolts:1},
  {gap:1.95,spd:108,shock:0.20,spring:true,bolts:1},
  {gap:1.85,spd:114,shock:0.25,spring:true,bolts:2},
  {boss:{name:'狂暴巨猿',ic:'🦍',hp:4,gap:1.75,spd:118,shock:0.30,spring:true,bolts:3}},
  {gap:1.75,spd:120,shock:0.28,spring:true,bolts:2},
  {gap:1.68,spd:125,shock:0.32,spring:true,bolts:2},
  {gap:1.62,spd:130,shock:0.35,spring:true,bolts:2},
  {gap:1.55,spd:135,shock:0.38,spring:true,bolts:3},
  {boss:{name:'雷霆机械金刚',ic:'🤖',hp:5,gap:1.50,spd:138,shock:0.50,spring:true,bolts:4}},
  {gap:1.48,spd:140,shock:0.42,spring:true,bolts:3},
  {gap:1.42,spd:145,shock:0.45,spring:true,bolts:3},
  {gap:1.36,spd:150,shock:0.48,spring:true,bolts:3},
  {gap:1.30,spd:155,shock:0.52,spring:true,bolts:4},
  {boss:{name:'摩天霸王金刚',ic:'👑',hp:6,gap:1.25,spd:160,shock:0.58,spring:true,bolts:5}}
];

let L,cfgK,plats,ladders,barrels,pickups,bolts,springs,sparks,floats,player,bossKong;
let lives,score,ended,raf=0,last=0,fast=1,shakeT=0,barrelTimer=0,hammerCd=0,hammerT=0;
let keys={left:false,right:false,up:false,down:false},touchTarget=null;

function addFloat(x,y,txt,color){floats.push({x,y,txt,t:0,color:color||'#ffd54f'});}

function buildStage(idx){
  // 6 层钢梁平台（从顶层 0 到最底层 5）
  plats=[
    {y:66, x0:28, x1:332, dir:1, color:'#e91e63'},
    {y:134,x0:22, x1:316, dir:-1,color:'#d81b60'},
    {y:202,x0:44, x1:338, dir:1, color:'#c2185b'},
    {y:270,x0:22, x1:316, dir:-1,color:'#ad1457'},
    {y:338,x0:44, x1:338, dir:1, color:'#880e4f'},
    {y:402,x0:16, x1:344, dir:-1,color:'#6a1b9a'}
  ];
  // 错落梯子（保证每层可顺畅攀爬，并有捷径梯）
  const shift=(idx%2)*16;
  ladders=[
    {x:288-shift,y0:66, y1:134},
    {x:84+shift, y0:134,y1:202},
    {x:205,      y0:134,y1:202},
    {x:294-shift,y0:202,y1:270},
    {x:78+shift, y0:270,y1:338},
    {x:190,      y0:270,y1:338},
    {x:292-shift,y0:338,y1:402},
    {x:126+shift,y0:338,y1:402}
  ];
  barrels=[];pickups=[];bolts=[];springs=[];sparks=[];floats=[];

  // 黄金战锤拾取物与奖杯金币
  pickups.push({x:165,y:270-18,kind:'hammer',taken:false});
  if(idx>=2)pickups.push({x:155,y:134-18,kind:'hammer',taken:false});
  pickups.push({x:240,y:338-18,kind:'coin',val:120,taken:false});
  pickups.push({x:130,y:202-18,kind:'coin',val:150,taken:false});

  // 弹簧跳板（踩上可直接弹跃一层半！）
  if(cfgK.spring){
    springs.push({x:58,y:338,plat:4,bounceT:0});
    if(idx>=5)springs.push({x:308,y:202,plat:2,bounceT:0});
  }

  // 金色钢梁铆钉（踩过或砸击可拔除，首领关拔光铆钉可直接震塌巨猿！）
  const boltSpots=[
    {x:220,y:338,plat:4},{x:140,y:270,plat:3},{x:235,y:202,plat:2},
    {x:125,y:134,plat:1},{x:240,y:66,plat:0}
  ];
  for(let i=0;i<(cfgK.bolts||0)&&i<boltSpots.length;i++){
    bolts.push({...boltSpots[i],pulled:false});
  }

  if(L.boss){
    bossKong={name:L.boss.name,ic:L.boss.ic,hp:L.boss.hp,maxHp:L.boss.hp,x:64,y:44,animT:0};
  }else bossKong=null;
}

function start(i){
  L=LV[i];cfgK=L.boss||L;score=0;ended=false;shakeT=0;
  lives=UI.pick(3,2)+Kit.up('life');
  hammerCd=0;hammerT=0;barrelTimer=0.6;
  buildStage(i);
  player={
    x:48,y:402-14,vx:0,vy:0,plat:5,
    grounded:true,climbing:false,climbL:null,
    face:1,invuln:Kit.up('life')>0?2.2:1.0,alive:true
  };
  keys={left:false,right:false,up:false,down:false};
  touchTarget=null;
  // 开局预置1个滚动木桶增加动感
  barrels.push({x:140,y:202-11,vx:cfgK.spd,vy:0,plat:2,falling:false,shock:false,counted:false});
  hud();last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(frame);
}

function ladderNear(x,y,dirY){
  let best=null,bestD=99;
  for(const l of ladders){
    const dx=Math.abs(x-l.x);
    if(dx<18){
      if(dirY<0&&y>=l.y0-4&&y<=l.y1+10&&dx<bestD){best=l;bestD=dx;}
      else if(dirY>0&&y>=l.y0-16&&y<=l.y1-4&&dx<bestD){best=l;bestD=dx;}
      else if(dirY===0&&y>=l.y0-8&&y<=l.y1+8&&dx<bestD){best=l;bestD=dx;}
    }
  }
  return best;
}

function triggerUpOrJump(){
  if(Kit.state!=='play'||ended||!player||!player.alive)return;
  if(player.climbing){
    keys.up=true;return;
  }
  // 若脚下或头顶紧邻梯子且周围无贴脸木桶威胁，优先爬梯；若有木桶逼近则起跳越桶
  const lad=ladderNear(player.x,player.y+14,-1);
  const dangerBarrel=barrels.some(b=>b.plat===player.plat&&!b.falling&&Math.abs(b.x-player.x)<48);
  if(lad&&!dangerBarrel&&player.grounded){
    player.climbing=true;player.climbL=lad;player.x=lad.x;player.vy=0;
    Kit.sfx('climb');
    return;
  }
  if(player.grounded){
    const jumpBoost=1+Kit.up('boots')*0.08;
    player.vy=-245*jumpBoost;
    player.grounded=false;
    Kit.sfx('jump');
  }
}

function triggerHammer(){
  if(Kit.state!=='play'||ended||!player||!player.alive)return;
  if(hammerT>0){Kit.toast('🔨 黄金战锤挥舞中！',800);return;}
  if(hammerCd>0){Kit.toast('🔨 战锤冷却中 ('+Math.ceil(hammerCd)+'s)',900);return;}
  hammerT=4.2+Kit.up('hammer')*1.5;
  hammerCd=8.5-Kit.up('hammer')*1.5;
  player.invuln=Math.max(player.invuln,hammerT);
  // 开启战锤时附带一小段向前冲刺
  player.x=Math.max(24,Math.min(W-24,player.x+player.face*22));
  Kit.sfx('smash');Kit.toast('🔨 黄金战锤开启：无敌砸桶！',1100);
  if(FX)FX.burst(sparks,player.x,player.y,'#ffd54f',16);
  hud();
}

function damageBoss(dmg,reason){
  if(!bossKong||bossKong.hp<=0)return;
  bossKong.hp=Math.max(0,bossKong.hp-dmg);
  score+=220*dmg;shakeT=0.3;
  Kit.sfx('boom');Kit.vibrate(65);
  if(FX)FX.burst(sparks,bossKong.x,bossKong.y,'#ff4081',20);
  addFloat(bossKong.x+20,bossKong.y,reason||('💥重创 -'+dmg),'#ff80ab');
  if(bossKong.hp<=0){
    score+=600+lives*80;
    hud();endLv(true);
  }
}

function hitPlayer(why){
  if(ended||!player.alive)return;
  if(hammerT>0||player.invuln>0)return;
  lives--;player.invuln=2.2;shakeT=0.32;
  Kit.sfx('bad');Kit.vibrate(90);
  if(FX)FX.burst(sparks,player.x,player.y,'#ff5252',16);
  addFloat(player.x,player.y-12,'💥-1命','#ff5252');
  hud();
  if(lives<=0){
    player.alive=false;
    endLv(false,why||'被滚桶击落');
  }
}

function upd(dt){
  if(ended)return;
  if(shakeT>0)shakeT=Math.max(0,shakeT-dt);
  if(hammerT>0)hammerT=Math.max(0,hammerT-dt);
  if(hammerCd>0)hammerCd=Math.max(0,hammerCd-dt);
  if(player.invuln>0)player.invuln=Math.max(0,player.invuln-dt);

  const moveSpd=128*(1+Kit.up('boots')*0.14);
  const climbSpd=108*(1+Kit.up('boots')*0.15);

  if(player.alive){
    // 触摸目标自动导航辅助
    let goL=keys.left,goR=keys.right,goU=keys.up,goD=keys.down;
    if(touchTarget){
      const dx=touchTarget.x-player.x,dy=touchTarget.y-player.y;
      if(Math.hypot(dx,dy)<12)touchTarget=null;
      else if(player.climbing){
        if(dy<-6)goU=true;else if(dy>6)goD=true;
      }else{
        if(dy<-24){
          const lad=ladderNear(player.x,player.y+14,-1);
          if(lad){goU=true;}
          else if(Math.abs(dx)>10){if(dx<0)goL=true;else goR=true;}
          else if(player.grounded){triggerUpOrJump();touchTarget=null;}
        }else if(Math.abs(dx)>8){
          if(dx<0)goL=true;else goR=true;
        }
      }
    }

    if(player.climbing){
      const l=player.climbL;
      player.x=l.x;
      if(goU){
        player.y-=climbSpd*dt;
      }else if(goD){
        player.y+=climbSpd*dt;
      }
      if(player.y+14<=l.y0+2){
        const pi=plats.findIndex(p=>Math.abs(p.y-l.y0)<4);
        if(pi>=0){
          player.plat=pi;player.y=plats[pi].y-14;
          player.climbing=false;player.grounded=true;
          score+=40;addFloat(player.x,player.y-14,'登层+40','#81d4fa');
        }
      }else if(player.y+14>=l.y1-2&&goD){
        const pi=plats.findIndex(p=>Math.abs(p.y-l.y1)<4);
        if(pi>=0){
          player.plat=pi;player.y=plats[pi].y-14;
          player.climbing=false;player.grounded=true;
        }
      }
    }else{
      const pl=plats[player.plat];
      if(goL){player.x-=moveSpd*dt;player.face=-1;}
      if(goR){player.x+=moveSpd*dt;player.face=1;}
      player.x=Math.max(pl.x0+8,Math.min(pl.x1-8,player.x));

      if(goU&&player.grounded){
        const lad=ladderNear(player.x,player.y+14,-1);
        if(lad){
          player.climbing=true;player.climbL=lad;player.x=lad.x;player.vy=0;
          Kit.sfx('climb');
        }else{
          triggerUpOrJump();
          keys.up=false;
        }
      }else if(goD&&player.grounded){
        const lad=ladderNear(player.x,player.y+14,1);
        if(lad){
          player.climbing=true;player.climbL=lad;player.x=lad.x;player.y+=6;player.vy=0;
          Kit.sfx('climb');
        }
      }

      if(!player.grounded){
        player.vy+=560*dt;
        player.y+=player.vy*dt;
        // 弹簧跳板跨层落点检测
        for(let pIdx=0;pIdx<=player.plat;pIdx++){
          const candP=plats[pIdx];
          if(player.vy>=0&&player.y+14>=candP.y-4&&player.y+14<=candP.y+14&&player.x>=candP.x0&&player.x<=candP.x1){
            player.plat=pIdx;
            player.y=candP.y-14;player.vy=0;player.grounded=true;
            break;
          }
        }
      }else{
        player.y=pl.y-14;
      }
    }

    // 拾取战锤与金币
    for(const pk of pickups){
      if(pk.taken)continue;
      if(Math.hypot(player.x-pk.x,player.y-pk.y)<22){
        pk.taken=true;
        if(pk.kind==='hammer'){
          hammerCd=0;triggerHammer();
          score+=100;
        }else{
          score+=pk.val;Kit.sfx('coin');
          if(FX)FX.burst(sparks,pk.x,pk.y,'#ffd54f',12);
          addFloat(pk.x,pk.y-10,'🪙+'+pk.val,'#ffd54f');
        }
      }
    }

    // 弹簧跳板触发
    for(const sp of springs){
      if(sp.bounceT>0)sp.bounceT=Math.max(0,sp.bounceT-dt);
      if(!player.climbing&&player.plat===sp.plat&&Math.abs(player.x-sp.x)<18&&Math.abs(player.y+14-sp.y)<10){
        player.grounded=false;
        player.vy=-365; // 直接跃升上一层平台！
        sp.bounceT=0.35;
        score+=60;Kit.sfx('jump');
        if(FX)FX.burst(sparks,sp.x,sp.y,'#00e5ff',12);
        addFloat(sp.x,sp.y-16,'🚀弹射跃层+60','#00e5ff');
      }
    }

    // 拔除金色铆钉
    for(const bt of bolts){
      if(bt.pulled)continue;
      if(!player.climbing&&player.plat===bt.plat&&Math.abs(player.x-bt.x)<16){
        bt.pulled=true;score+=120;
        Kit.sfx('good');
        if(FX)FX.burst(sparks,bt.x,bt.y,'#ffd54f',14);
        addFloat(bt.x,bt.y-14,'🔩拔除铆钉+120','#ffd54f');
        if(bossKong)damageBoss(1,'🔩钢梁松动 -1');
        if(ended)return;
      }
    }

    // 到达顶层平台营救人质 / 重创首领
    if(player.plat===0&&!player.climbing){
      if(bossKong&&bossKong.hp>0&&player.x<120&&hammerT>0){
        damageBoss(bossKong.hp,'🔨战锤绝杀！');
        return;
      }
      if(player.x>=235){
        if(bossKong&&bossKong.hp>0){
          damageBoss(bossKong.hp,'⚡总闸坍塌！');
        }else{
          score+=400+lives*80;
          hud();endLv(true);
        }
        return;
      }
    }
  }

  // 金刚抛投滚桶
  barrelTimer-=dt;
  if(barrelTimer<=0){
    barrelTimer=cfgK.gap;
    const isShock=Math.random()<cfgK.shock;
    barrels.push({
      x:82,y:plats[0].y-11,
      vx:cfgK.spd*(isShock?1.12:1),vy:0,
      plat:0,falling:false,shock:isShock,counted:false
    });
    if(bossKong)bossKong.animT=0.35;
  }
  if(bossKong&&bossKong.animT>0)bossKong.animT=Math.max(0,bossKong.animT-dt);

  // 更新滚桶与蓝电桶
  for(let i=barrels.length-1;i>=0;i--){
    const b=barrels[i];
    const pl=plats[b.plat];
    if(b.falling){
      b.vy+=520*dt;
      b.y+=b.vy*dt;
      const nextP=plats[b.plat+1];
      if(nextP&&b.y+11>=nextP.y){
        b.plat++;
        b.y=nextP.y-11;b.vy=0;b.falling=false;
        b.vx=Math.abs(b.vx)*nextP.dir;
      }else if(!nextP&&b.y>H+20){
        barrels.splice(i,1);continue;
      }
    }else{
      b.vx=Math.abs(b.vx)*pl.dir;
      b.x+=b.vx*dt;
      b.y=pl.y-11;
      // 梯子口坠落（蓝电桶高频顺梯而下）
      const dropChance=b.shock?0.45:0.18;
      for(const l of ladders){
        if(Math.abs(l.y0-pl.y)<5&&Math.abs(b.x-l.x)<7&&b.plat+1<plats.length){
          if(!b.checkedLad||b.checkedLad!==l){
            b.checkedLad=l;
            if(Math.random()<dropChance){
              b.falling=true;b.vy=35;b.x=l.x;break;
            }
          }
        }
      }
      // 平台边缘跌落下一层
      if((b.vx>0&&b.x>=pl.x1-8)||(b.vx<0&&b.x<=pl.x0+8)){
        if(b.plat+1<plats.length){
          b.falling=true;b.vy=25;
        }else{
          barrels.splice(i,1);continue;
        }
      }
    }

    // 与玩家碰撞或战锤粉碎或跃桶加分
    if(player.alive){
      const dist=Math.hypot(b.x-player.x,b.y-player.y);
      if(dist<20){
        if(hammerT>0){
          const pts=b.shock?200:150;
          score+=pts;
          barrels.splice(i,1);
          Kit.sfx('smash');Kit.vibrate(45);
          if(FX)FX.burst(sparks,b.x,b.y,b.shock?'#00e5ff':'#ffb74d',16);
          addFloat(b.x,b.y-10,'🔨粉碎+'+pts,'#ffd54f');
          if(bossKong&&bossKong.hp>1&&Math.random()<0.35){
            damageBoss(1,'💥震波反噬 -1');
            if(ended)return;
          }
          continue;
        }else{
          hitPlayer(b.shock?'被⚡蓝电桶击中':'被🛢️滚桶撞倒');
          if(ended)return;
          barrels.splice(i,1);
          continue;
        }
      }
      // 跳过木桶奖励 +100
      if(!b.counted&&!player.grounded&&!player.climbing&&b.plat===player.plat&&Math.abs(b.x-player.x)<22&&player.y<b.y-10){
        b.counted=true;score+=100;
        Kit.sfx('good');
        addFloat(player.x,player.y-16,'跳过+100','#00e5ff');
      }
    }
  }

  for(let i=floats.length-1;i>=0;i--){floats[i].t+=dt;floats[i].y-=32*dt;if(floats[i].t>0.85)floats.splice(i,1);}
  hud();
}

function hud(){
  $('lvT').textContent=Kit.lv+1;
  $('lifeT').textContent=lives;
  $('score').textContent=score;
  $('goalLbl').textContent=bossKong?'👑 '+bossKong.name+' HP:'+bossKong.hp:'攀登营救 '+(Kit.lv+1)+'/15';
  const climbPct=player?Math.max(0,Math.min(100,((402-player.y)/(402-52))*100)):0;
  $('progI').style.width=(bossKong?((bossKong.maxHp-bossKong.hp)/bossKong.maxHp*100):climbPct)+'%';
  $('infoT').textContent=hammerT>0?'🔨无敌 '+Math.ceil(hammerT)+'s':(hammerCd>0?'🔨冷却 '+Math.ceil(hammerCd)+'s':'🔨战锤就绪');
  $('btnHammer').textContent=hammerT>0?'🔨 挥舞中':(hammerCd>0?'🔨 '+Math.ceil(hammerCd)+'s':'🔨 战锤冲刺');
}

function endLv(won,why){
  if(ended)return;ended=true;
  if(won){
    const st=lives>=3?3:lives>=2?2:1;
    setTimeout(()=>Kit.win(st,score,bossKong?'成功击败巨猿首领「'+bossKong.name+'」救出人质！':'成功登顶钢梁高塔救出人质！'),240);
  }else{
    setTimeout(()=>Kit.lose(why||'攀登失败',score),240);
  }
}

function draw(){
  ctx.save();
  if(shakeT>0)ctx.translate((Math.random()-0.5)*7,(Math.random()-0.5)*7);

  if(FX)FX.stage(ctx,W,H,'#14082e','#070312');
  else{ctx.fillStyle='#0d0620';ctx.fillRect(0,0,W,H);}

  // 霓虹星点与远景摩天楼钢架
  ctx.fillStyle='rgba(255,255,255,.32)';
  for(let i=0;i<24;i++)ctx.fillRect((i*67)%W,(i*43)%H,2,2);

  // 梯子绘制
  if(ladders){
    for(const l of ladders){
      ctx.save();
      if(FX)FX.glow(ctx,'#00e5ff',4);
      ctx.strokeStyle='#80d8ff';ctx.lineWidth=3;
      ctx.beginPath();
      ctx.moveTo(l.x-7,l.y0);ctx.lineTo(l.x-7,l.y1);
      ctx.moveTo(l.x+7,l.y0);ctx.lineTo(l.x+7,l.y1);
      for(let y=l.y0+6;y<l.y1;y+=11){
        ctx.moveTo(l.x-7,y);ctx.lineTo(l.x+7,y);
      }
      ctx.stroke();
      if(FX)FX.noGlow(ctx);
      ctx.restore();
    }
  }

  // 钢梁平台与金色铆钉绘制
  if(plats){
    for(const p of plats){
      const pw=p.x1-p.x0;
      if(FX){
        FX.shadow(ctx,p.x0+pw/2,p.y+6,pw*0.45,4,.35);
        FX.tile(ctx,p.x0,p.y-6,pw,12,p.color,4);
      }else{
        ctx.fillStyle=p.color;ctx.fillRect(p.x0,p.y-6,pw,12);
      }
      // 钢梁斜撑纹理
      ctx.fillStyle='rgba(255,255,255,.18)';
      for(let x=p.x0+10;x<p.x1-10;x+=22)ctx.fillRect(x,p.y-2,8,4);
    }
  }

  // 铆钉机关
  if(bolts){
    for(const bt of bolts){
      if(bt.pulled)continue;
      if(FX)FX.orb(ctx,bt.x|0,(bt.y-4)|0,7,'#ffd54f');
      else{ctx.fillStyle='#ffd54f';ctx.fillRect(bt.x-5,bt.y-9,10,10);}
    }
  }

  // 弹簧跳板
  if(springs){
    for(const sp of springs){
      const sy=sp.y-(sp.bounceT>0?10:5);
      if(FX)FX.tile(ctx,sp.x-12,sy-4,24,8,'#00e5ff',3);
      else{ctx.fillStyle='#00e5ff';ctx.fillRect(sp.x-12,sy-4,24,8);}
    }
  }

  // 顶层金刚与受困公主
  if(plats){
    const kx=bossKong?bossKong.x:62,ky=plats[0].y-24,beat=Math.sin(performance.now()*0.009)*3;
    if(FX)FX.shadow(ctx,kx,plats[0].y-4,20,5,.42);
    ctx.save();ctx.translate(kx+(bossKong&&bossKong.animT>0?4:0),ky);
    // Muscular charismatic gorilla boss
    ctx.fillStyle='#5d3a24';
    ctx.beginPath();ctx.ellipse(-15,2+beat*0.5,7,11,0.3,0,7);ctx.ellipse(15,2-beat*0.5,7,11,-0.3,0,7);ctx.fill();
    ctx.fillStyle='#78350f';ctx.beginPath();ctx.roundRect(-14,-10,28,24,10);ctx.fill();
    ctx.fillStyle='#d97706';ctx.beginPath();ctx.ellipse(0,3,9,8,0,0,7);ctx.fill();
    ctx.fillStyle='#5d3a24';ctx.beginPath();ctx.arc(0,-13,11,0,7);ctx.fill();
    ctx.fillStyle='#f59e0b';ctx.beginPath();ctx.ellipse(0,-10,8,5.5,0,0,7);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-4,-14,2.8,0,7);ctx.arc(4,-14,2.8,0,7);ctx.fill();
    ctx.fillStyle='#0f172a';ctx.beginPath();ctx.arc(-3.5,-14,1.4,0,7);ctx.arc(4.5,-14,1.4,0,7);ctx.fill();
    if(bossKong){ctx.fillStyle='#facc15';ctx.beginPath();ctx.moveTo(-7,-22);ctx.lineTo(-9,-29);ctx.lineTo(0,-25);ctx.lineTo(9,-29);ctx.lineTo(7,-22);ctx.closePath();ctx.fill();}
    ctx.restore();
    if(bossKong){
      const bw=54,bh=6,bx=kx-bw/2,by=ky-34;
      ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(bx,by,bw,bh);
      ctx.fillStyle='#f43f5e';ctx.fillRect(bx,by,bw*(bossKong.hp/bossKong.maxHp),bh);
    }
    // 顶层右端公主与营救信标
    const px=265,py=plats[0].y-20;
    ctx.save();ctx.translate(px,py);
    if(FX)FX.shadow(ctx,0,16,11,3.5,.32);
    // Pink gown, blonde hair, golden tiara
    ctx.fillStyle='#f472b6';ctx.beginPath();ctx.moveTo(0,-2);ctx.lineTo(-10,15);ctx.lineTo(10,15);ctx.closePath();ctx.fill();
    ctx.fillStyle='#facc15';ctx.beginPath();ctx.arc(0,-9,8.5,0,7);ctx.fill();
    ctx.fillStyle='#fde68a';ctx.beginPath();ctx.arc(0,-8,6.2,0,7);ctx.fill();
    ctx.fillStyle='#0f172a';ctx.beginPath();ctx.arc(-2.2,-8.5,1.2,0,7);ctx.arc(2.2,-8.5,1.2,0,7);ctx.fill();
    ctx.fillStyle='#fde047';ctx.beginPath();ctx.moveTo(-5,-14);ctx.lineTo(-3,-20);ctx.lineTo(0,-16);ctx.lineTo(3,-20);ctx.lineTo(5,-14);ctx.closePath();ctx.fill();
    ctx.restore();
    ctx.fillStyle='#fde047';ctx.font='bold 10px sans-serif';ctx.textAlign='center';
    ctx.fillText('营救终点',px,py-23);
  }

  // 战锤与金币道具
  if(pickups){
    ctx.font='20px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    for(const pk of pickups){
      if(pk.taken)continue;
      if(FX)FX.orb(ctx,pk.x|0,pk.y|0,11,pk.kind==='hammer'?'#ffab40':'#ffd54f');
      ctx.fillText(pk.kind==='hammer'?'🔨':'🪙',pk.x,pk.y);
    }
  }

  // 滚桶与蓝电桶（木纹桶箍/电弧滚桶）
  if(barrels){
    for(const b of barrels){
      ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.x*0.08);
      if(b.shock){
        const sg=ctx.createRadialGradient(-3,-3,1,0,0,11);sg.addColorStop(0,'#bae6fd');sg.addColorStop(1,'#0284c7');
        ctx.fillStyle=sg;ctx.beginPath();ctx.arc(0,0,10.5,0,7);ctx.fill();
        ctx.strokeStyle='#fde047';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-4,-3);ctx.lineTo(1,-1);ctx.lineTo(-2,2);ctx.lineTo(4,4);ctx.stroke();
      }else{
        const bg=ctx.createRadialGradient(-3,-3,1,0,0,11);bg.addColorStop(0,'#f59e0b');bg.addColorStop(1,'#92400e');
        ctx.fillStyle=bg;ctx.beginPath();ctx.arc(0,0,10.5,0,7);ctx.fill();
        ctx.strokeStyle='#451a03';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,10,0,7);ctx.stroke();
        ctx.strokeStyle='#fcd34d';ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(-7,-3);ctx.lineTo(7,-3);ctx.moveTo(-7,3);ctx.lineTo(7,3);ctx.stroke();
      }
      ctx.restore();
    }
  }

  // 玩家红帽攀爬主角绘制
  if(player&&player.alive){
    const x=player.x,y=player.y,run=Math.abs(player.vx)>5?Math.sin(performance.now()*0.02)*4:0;
    ctx.save();ctx.translate(x,y);
    if(hammerT>0){ctx.strokeStyle='#facc15';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(0,0,19,0,6.28);ctx.stroke();}
    else if(player.invuln>0){ctx.strokeStyle='rgba(56,189,248,.8)';ctx.lineWidth=2.2;ctx.beginPath();ctx.arc(0,0,16,0,6.28);ctx.stroke();}
    if(FX)FX.shadow(ctx,0,12,11,3.5,.35);
    ctx.scale(player.face||1,1);
    // Boots & blue overalls
    ctx.fillStyle='#451a03';ctx.beginPath();ctx.roundRect(-6-run*0.4,7,5,4.5,2);ctx.roundRect(1+run*0.4,7,5,4.5,2);ctx.fill();
    ctx.fillStyle='#ef4444';ctx.beginPath();ctx.roundRect(-7,-1,14,8.5,3);ctx.fill();
    ctx.fillStyle='#2563eb';ctx.beginPath();ctx.roundRect(-6,2,12,6.5,2.5);ctx.fill();
    ctx.fillStyle='#facc15';ctx.beginPath();ctx.arc(-3,3.5,1.2,0,7);ctx.arc(3,3.5,1.2,0,7);ctx.fill();
    // Chibi face & red hero cap
    ctx.fillStyle='#fde68a';ctx.beginPath();ctx.arc(0,-6.5,6.8,0,7);ctx.fill();
    ctx.fillStyle='#0f172a';ctx.beginPath();ctx.arc(2.5,-7,1.4,0,7);ctx.arc(-1.8,-7,1.4,0,7);ctx.fill();
    ctx.fillStyle='#dc2626';ctx.beginPath();ctx.arc(0,-9,7.6,Math.PI,0);ctx.fill();
    ctx.fillRect(-4,-10,13,2.8);
    // Swinging golden hammer when active
    if(hammerT>0){
      const sw=Math.sin(performance.now()*0.028)*0.9;
      ctx.save();ctx.translate(7,-2);ctx.rotate(sw);
      ctx.fillStyle='#b45309';ctx.fillRect(-1.5,-13,3,13);
      ctx.fillStyle='#facc15';ctx.beginPath();ctx.roundRect(-7,-18,14,7,2.5);ctx.fill();
      ctx.restore();
    }
    ctx.restore();
  }

  if(FX&&sparks)FX.drawBurst(ctx,sparks);
  if(floats){
    ctx.textAlign='center';ctx.font='bold 14px sans-serif';
    for(const f of floats){
      ctx.globalAlpha=Math.max(0,1-f.t/0.85);ctx.fillStyle=f.color;ctx.fillText(f.txt,f.x,f.y);
    }
    ctx.globalAlpha=1;
  }
  ctx.restore();
}

function frame(t){
  const dt=Math.min(.033,(t-last)/1000)*fast;last=t;
  if(Kit.state==='play'&&!ended)upd(dt);
  draw();raf=requestAnimationFrame(frame);
}

// 绑定输入（仅用 Pointer Events）
function bindHoldBtn(el,onDown,onUp){
  el.addEventListener('pointerdown',e=>{e.preventDefault();touchTarget=null;onDown();});
  const end=()=>{if(onUp)onUp();};
  el.addEventListener('pointerup',end);
  el.addEventListener('pointercancel',end);
  el.addEventListener('pointerleave',end);
}
bindHoldBtn($('btnLeft'),()=>{keys.left=true;keys.right=false;},()=>{keys.left=false;});
bindHoldBtn($('btnRight'),()=>{keys.right=true;keys.left=false;},()=>{keys.right=false;});
bindHoldBtn($('btnUp'),()=>{keys.up=true;triggerUpOrJump();},()=>{keys.up=false;});
$('btnHammer').addEventListener('pointerdown',e=>{e.preventDefault();triggerHammer();});

let ptrDown=false;
function onCanvasPtr(e,isTap){
  if(Kit.state!=='play'||ended||!player||!player.alive)return;
  const r=cv.getBoundingClientRect();
  const x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;
  if(isTap&&y<player.y-18&&Math.abs(x-player.x)<45){
    triggerUpOrJump();
  }
  touchTarget={x,y};
}
cv.addEventListener('pointerdown',e=>{ptrDown=true;onCanvasPtr(e,true);});
cv.addEventListener('pointermove',e=>{if(ptrDown)onCanvasPtr(e,false);});
addEventListener('pointerup',()=>{ptrDown=false;touchTarget=null;});

addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'||e.key==='a')keys.left=true;
  if(e.key==='ArrowRight'||e.key==='d')keys.right=true;
  if(e.key==='ArrowUp'||e.key==='w'||e.key===' '){e.preventDefault();keys.up=true;triggerUpOrJump();}
  if(e.key==='ArrowDown'||e.key==='s')keys.down=true;
  if(e.key==='h'||e.key==='k')triggerHammer();
});
addEventListener('keyup',e=>{
  if(e.key==='ArrowLeft'||e.key==='a')keys.left=false;
  if(e.key==='ArrowRight'||e.key==='d')keys.right=false;
  if(e.key==='ArrowUp'||e.key==='w'||e.key===' ')keys.up=false;
  if(e.key==='ArrowDown'||e.key==='s')keys.down=false;
});

function layout(){
  const b=$('box').getBoundingClientRect();
  const s=Math.min(b.width/W,b.height/H);
  cv.style.width=Math.floor(W*s)+'px';cv.style.height=Math.floor(H*s)+'px';
}
addEventListener('resize',layout);layout();

$('startH').textContent='🦍 金刚';
$('startP').innerHTML='15 关街机攀爬躲桶大冒险：跃过滚落木桶与⚡蓝电桶！<br>挥舞「🔨黄金战锤」无敌粉碎滚桶、拔除钢梁铆钉，登顶营救👸公主并击败三大金刚首领！';

Kit.init({
  id:'donkeykong',levels:15,boss:[5,10,15],bossName:i=>LV[i].boss.name,
  start,stop:()=>{ended=true;},pause:()=>{},
  note:()=>'点画布或按钮爬梯跃桶（跳过🛢️+100），开🔨战锤无敌砸桶，登顶救出👸过关',
  tut:[
    ['攀爬钢梁','使用左右键或点击画布在多层钢梁上移动，靠近梯子按「▲跳跃/爬梯」即可向上攀登！','🪜'],
    ['跃桶高分','看准滚落的🛢️木桶与⚡蓝电桶起跳越过，每次成功跳过木桶立即奖励 +100 分！','🛢️'],
    ['黄金战锤','拾取场地🔨或点击「🔨战锤冲刺」，即可进入无敌挥锤状态，正面粉碎一切滚桶赢取高分！','🔨'],
    ['三大巨猿首领','第 5/10/15 关迎战狂暴巨猿、雷霆机械金刚与摩天霸王金刚，踩拔🔩金色铆钉或登顶即可击溃首领！','👑']
  ],
  ups:[
    {k:'hammer',ic:'🔨',name:'黄金战锤',desc:'战锤无敌延长且冷却缩短',max:2,cost:l=>24+l*26},
    {k:'boots',ic:'🥾',name:'弹簧飞靴',desc:'移动爬梯加速且跳得更高',max:2,cost:l=>26+l*28},
    {k:'life',ic:'🛡️',name:'金刚护心镜',desc:'+1 生命上限且开局护盾',max:2,cost:l=>30+l*32,stars:5}
  ]
});

window.__T.state=()=>({plat:player?player.plat:5,lives,ended,lv:Kit.lv,state:Kit.state});
window.__T.go=i=>Kit.go(i);
window.__T.isBoss=i=>Kit.isBoss(i);
window.__T.fast=k=>{fast=k;};
window.__T.lose=()=>endLv(false,'测试失败');
window.__T.cheatWin=()=>{
  if(ended||Kit.state!=='play')return;
  if(player){player.plat=0;player.x=265;player.y=plats[0].y-14;}
  if(bossKong)bossKong.hp=0;
  lives=Math.max(3,lives);score+=600;
  hud();endLv(true);
};
window.__T.solve=()=>{if(ended||Kit.state!=='play')return;window.__T.cheatWin();};
</script>
