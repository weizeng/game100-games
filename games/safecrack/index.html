<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

.skingrid button.sel{outline:3px solid #ff8c1a}
.stars{font-size:20px;letter-spacing:2px}

<style>

@media(max-width:360px){.game-ui body>.wrap{padding:10px;gap:10px}.game-ui .ui-panel{padding:22px 18px;gap:13px}.game-ui .ui-panel h1{font-size:26px}.game-ui .ui-emblem{width:70px;height:70px;font-size:38px}.game-ui :is(.topbar,#topbar){gap:5px;padding:8px}.game-ui :is(.iconbtn,.icobtn,.ibtn,.tbtn,.ib){min-width:44px;min-height:44px}}

      var pad = Math.ceil(r * .5) + 2, s = scaleOf(ctx);
      ctx.drawImage(sprite('o' + color + r, r * 2, r * 2, pad, s, function (g) { orbArt(g, r, color, pad); }), x - r - pad, y - r - pad, r * 2 + pad * 2, r * 2 + pad * 2);
    },
    // Soft elliptical contact shadow under any sprite (emoji, characters, pieces).
    shadow: function (ctx, x, y, rx, ry, a) {
      ctx.save(); ctx.fillStyle = 'rgba(0,0,0,' + (a == null ? .28 : a) + ')'; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, 7); ctx.fill(); ctx.restore();
    },
    // Lit stage background: vertical gradient plus a vignette. Cached per size/colours.
    stage: function (ctx, w, h, top, bottom) {
      var s = scaleOf(ctx);
      ctx.drawImage(sprite('s' + w + 'x' + h + top + bottom, w, h, 0, s, function (g) {
        var lg = g.createLinearGradient(0, 0, 0, h); lg.addColorStop(0, top); lg.addColorStop(1, bottom); g.fillStyle = lg; g.fillRect(0, 0, w, h);
        var v = g.createRadialGradient(w / 2, h * .35, Math.min(w, h) * .2, w / 2, h / 2, Math.max(w, h) * .75);
        v.addColorStop(0, 'rgba(255,255,255,' + (skin === 'b' ? .10 : .07) + ')'); v.addColorStop(1, 'rgba(0,0,0,.35)'); g.fillStyle = v; g.fillRect(0, 0, w, h);
      }), 0, 0, w, h);
    },
    // Glow is shadowBlur: cheap for a handful of shapes, never use it on every tile.
    glow: function (ctx, color, blur) { ctx.shadowColor = color; ctx.shadowBlur = blur; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0; },
    noGlow: function (ctx) { ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; },
    // Crisp rendering on high-DPI phones without changing game coordinates.
    // Only safe where input code converts with getBoundingClientRect + logical W/H, not cv.width.
    hidpi: function (cv, ctx, w, h) {
      var d = Math.max(1, Math.min(2.5, window.devicePixelRatio || 1));
      cv.width = Math.round(w * d); cv.height = Math.round(h * d); // intrinsic ratio stays w:h, so CSS sizing is unchanged
      ctx.setTransform(d, 0, 0, d, 0, 0); return d;
    },
    // Lightweight particle bursts (pooled array, no allocations per frame beyond the burst).
    burst: function (list, x, y, color, n) {
      for (var i = 0; i < (n || 12); i++) { var a = Math.random() * 6.283, v = 1 + Math.random() * 2.6; list.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 1, life: 1, c: color, r: 1.5 + Math.random() * 2.5 }); }
    },
    drawBurst: function (ctx, list) {
      for (var i = list.length - 1; i >= 0; i--) {
        var p = list[i]; p.x += p.vx; p.y += p.vy; p.vy += .12; p.life -= .035;
        if (p.life <= 0) { list.splice(i, 1); continue; }
        ctx.globalAlpha = p.life; ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (skin === 'b' ? 1.2 : 1), 0, 7); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
  };
  window.GameUI.fx = fx;
}());

</script>

{name:'决斗正午',timed:0,answer:[12,20,5],clues:[

{name:'火车大劫案',timed:150,answer:[30,28,14],clues:[

{icon:'🎰',title:'酒馆海报',text:'「7 名劫匪，每人分 4 袋金币」',hint:'海报：7 × 4 = 28 → 第二组 = 28'},
{icon:'📅',title:'旧日历',text:'「正午 12 点发车，晚点了 2 小时」',hint:'日历：12 + 2 = 14 → 第三组 = 14'}]},
{name:'沙漠驿站',timed:150,answer:[36,12,18],clues:[

{icon:'🎰',title:'酒馆海报',text:'「赌桌上两颗骰子，都是 6 点」',hint:'海报：6 + 6 = 12 → 第二组 = 12'},
{icon:'📅',title:'旧日历',text:'「驿站开了 21 天，关门 3 天」',hint:'日历：21 − 3 = 18 → 第三组 = 18'}]},
{name:'警长办公室',timed:0,answer:[28,18,16],clues:[
{icon:'📒',title:'通缉令',text:'「通缉令编号：7 × 4」',hint:'通缉令：7 × 4 = 28 → 第一组 = 28'},
{icon:'🎰',title:'证物袋',text:'「左轮 6 发，装满 3 把枪」',hint:'证物：6 × 3 = 18 → 第二组 = 18'},
{icon:'📅',title:'旧日历',text:'「1888 年建镇，8 + 8」',hint:'日历：8 + 8 = 16 → 第三组 = 16'}]},
{name:'午夜快车',timed:120,answer:[0,21,9],clues:[
{icon:'📒',title:'时刻表',text:'「午夜 0 点发车」',hint:'时刻表：0 点 → 第一组 = 0'},
{icon:'🎰',title:'酒馆海报',text:'「头奖 777，三个 7 相加」',hint:'海报：7 + 7 + 7 = 21 → 第二组 = 21'},
{icon:'📅',title:'旧日历',text:'「12 节车厢，少了 3 节没到」',hint:'日历：12 − 3 = 9 → 第三组 = 9'}]},
{name:'金库之王',timed:120,answer:[24,15,17],clues:[
{icon:'📒',title:'银行铭牌',text:'「本银行 1887 年开业」',hint:'铭牌：1 + 8 + 8 + 7 = 24 → 第一组 = 24'},
{icon:'🎰',title:'酒馆海报',text:'「赌桌骰子：4 点、5 点、6 点」',hint:'海报：4 + 5 + 6 = 15 → 第二组 = 15'},
{icon:'📅',title:'旧日历',text:'「连胜 34 场的枪手，取一半场次」',hint:'日历：34 ÷ 2 = 17 → 第三组 = 17'}]}
];
const SKINS={steel:{name:'钢锁',ring:'#8f9aa6',face:'#3a4048',tick:'#dfe6ee'},brass:{name:'黄铜锁',ring:'#c9973f',face:'#4a3418',tick:'#ffe1a1'},blackgold:{name:'黑金锁',ring:'#2b2b33',face:'#101014',tick:'#ffd34d'},sheriff:{name:'警长星锁',ring:'#b8c4d4',face:'#233a5e',tick:'#9fd8ff'}};
// ---- 状态 ----
let state='menu',lvIdx=0,slots=[-1,-1,-1],slotIdx=0,rot=0,value=0,lastValue=-1;
let runScore=0,best=0,hintsLeft=2,hintMax=2,wrongs=0,timeLeft=0,snapA=null,sparks=[];
let alarmT=0,revealed={};
let prog={unlocked:1,stars:{},best:{},skins:['steel'],skin:'steel',tut:{}};
try{const p=JSON.parse(UI.storageGet('g100_safecrack_prog')||'null');if(p)prog=Object.assign(prog,p);}catch(e){}
if(!SKINS[prog.skin])prog.skin='steel';
best=+UI.storageGet('g100_safecrack_hs')||0;$('best').textContent=best;
function saveProg(){UI.storageSet('g100_safecrack_prog',JSON.stringify(prog));}
function refreshHintMax(){hintMax=Math.min(5,2+Math.floor(Object.keys(prog.stars).length/2));}
// ---- 音效 ----
let muted=UI.storageGet('g100_safecrack_mute')==='1',ac=null;
$('muteBtn').textContent=muted?'🔇':'🔊';
function beep(f,d,type){if(muted)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(.12,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d);}catch(e){}}
function tick(){beep(1200,.03,'square');}
$('muteBtn').addEventListener('click',()=>{muted=!muted;UI.storageSet('g100_safecrack_mute',muted?'1':'0');$('muteBtn').textContent=muted?'🔇':'🔊';});
// ---- 关卡 ----
function lv(){return LEVELS[lvIdx];}
function loadLevel(i){
lvIdx=i;slots=[-1,-1,-1];slotIdx=0;rot=0;value=0;lastValue=-1;wrongs=0;revealed={};
snapA=null;sparks=[];alarmT=0;
const L=lv();timeLeft=L.timed;
refreshHintMax();hintsLeft=hintMax;
$('lv').textContent=i+1;$('hintBtn').textContent='💡 提示×'+hintsLeft;
$('timer').textContent=L.timed?('⏱'+fmtT(timeLeft)+' '):'';
$('hintText').textContent='第'+(i+1)+'关·'+L.name+(L.timed?'（限时）':'')+'：拖转盘对准刻度→按✓锁定 · 点下方线索找密码';
buildClues();showTut();
show('startScr',false);show('overScr',false);show('pauseOv',false);show('clueOv',false);
state='play';lastT=performance.now();
}
function fmtT(s){s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+('0'+s%60).slice(-2);}
function buildClues(){
const row=$('clues');row.innerHTML='';
lv().clues.forEach((c,i)=>{
const b=document.createElement('button');
b.textContent=c.icon+' '+c.title+(revealed[i]?' ✓':'');
b.addEventListener('click',()=>{openClue(i);beep(600,.06);});
row.appendChild(b);
});
}
function openClue(i){
const c=lv().clues[i];
$('clueTitle').textContent=c.icon+' '+c.title;
$('clueText').textContent=c.text;
const h=$('clueHint');
if(revealed[i]){h.style.display='';h.textContent='💡 '+c.hint;}else{h.style.display='none';}
show('clueOv',true);
}
$('clueClose').addEventListener('click',()=>show('clueOv',false));
// ---- 教学 ----
const TUTS={0:[['① 按住转盘拖动，把顶针对准一个数字',()=>tutFlag('turn')],['② 按锁定，集齐三组开锁',()=>tutFlag('ok')]]};
let tutStep=0;function tutFlag(k){return(tutFlag.s=tutFlag.s||{})[k];}
function setTutFlag(k){(tutFlag.s=tutFlag.s||{})[k]=true;checkTut();}
function showTut(){tutStep=0;tutFlag.s={};const t=TUTS[lvIdx];
if(t&&!prog.tut[lvIdx]){$('tut').classList.add('show');$('tut').textContent=t[0][0];}
else $('tut').classList.remove('show');}
function checkTut(){const t=TUTS[lvIdx];if(!t||prog.tut[lvIdx])return;
if(tutStep<t.length&&t[tutStep][1]()){tutStep++;
if(tutStep>=t.length){prog.tut[lvIdx]=1;saveProg();$('tut').classList.remove('show');}
else $('tut').textContent=t[tutStep][0];}}
// ---- 提示 ----
$('hintBtn').addEventListener('click',()=>{
if(state!=='play')return;
const cs=lv().clues;
const i=cs.findIndex((c,k)=>!revealed[k]);
if(i<0){$('hintText').textContent='💡 线索都解读过了，相信你的推理！';return;}
if(hintsLeft<=0){beep(200,.15,'sawtooth');$('hintText').textContent='💡 提示用完了，过关补充！';return;}
hintsLeft--;revealed[i]=1;
$('hintBtn').textContent='💡 提示×'+hintsLeft;
buildClues();openClue(i);beep(880,.12);
});
// ---- 转盘输入 ----
const DCX=W/2,DCY=272,DR2=112;
function posOf(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};}
function angOf(x,y){return Math.atan2(y-DCY,x-DCX);}
let dragging=false,lastAng=0;
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();
  if(state!=='play')return;
  const p=posOf(e),d=Math.hypot(p.x-DCX,p.y-DCY);
  if(d<DR2+30){dragging=true;lastAng=angOf(p.x,p.y);snapA=null;setTutFlag('turn');
    try{cv.setPointerCapture&&cv.setPointerCapture(e.pointerId);}catch(err){}}
});
cv.addEventListener('pointermove',e=>{
  if(!dragging||state!=='play')return;
  const p=posOf(e),a=angOf(p.x,p.y);
  let da=a-lastAng;
  if(da>Math.PI)da-=2*Math.PI;if(da<-Math.PI)da+=2*Math.PI;
  lastAng=a;rot+=da;
  const v=((Math.round(rot/(2*Math.PI)*40))%40+40)%40;
  if(v!==value){value=v;tick();}
});
function endDrag(){dragging=false;
  const target=value/40*2*Math.PI;
  let d=target-rot;
  while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;
  snapA={from:rot,to:rot+d,t:0};
}
cv.addEventListener('pointerup',endDrag);
cv.addEventListener('pointercancel',()=>{dragging=false;snapA=null;});
// ---- 确认 / 校验 ----
$('okBtn').addEventListener('click',()=>{
  if(state!=='play'||slotIdx>=3)return;

});
$('clrBtn').addEventListener('click',()=>{
  if(state!=='play'||slotIdx<=0)return;
  slotIdx--;slots[slotIdx]=-1;beep(400,.06);
});
function checkAnswer(){
  if(state!=='play')return;
  const a=lv().answer;
  const ok=slots[0]===a[0]&&slots[1]===a[1]&&slots[2]===a[2];
  if(ok)winLevel();else wrongAnswer();
}
function wrongAnswer(){
  wrongs++;alarmT=1;
  if(lv().timed)timeLeft-=15;

  $('hintText').textContent='🚨 警报！密码错误'+(lv().timed?'，扣 15 秒':'')+'（第 '+wrongs+' 次）';
  beep(140,.4,'sawtooth');setTimeout(()=>beep(110,.4,'sawtooth'),200);
  if(FX)FX.burst(sparks,DCX,DCY,'#ff5a5a',18);
}
function winLevel(){
  const L=lv();
  const stars=wrongs===0?3:wrongs===1?2:1;
  const sc=Math.max(50,300+(L.timed?Math.ceil(timeLeft)*2:100)-60*wrongs);
  runScore+=sc;$('score').textContent=runScore;
  if(runScore>best){best=runScore;UI.storageSet('g100_safecrack_hs',best);$('best').textContent=best;}
  prog.stars[lvIdx]=Math.max(prog.stars[lvIdx]||0,stars);
  prog.best[lvIdx]=Math.max(prog.best[lvIdx]||0,sc);
  prog.unlocked=Math.max(prog.unlocked,Math.min(LEVELS.length,lvIdx+2));
  const cleared=Object.keys(prog.stars).length;
  if(cleared>=3&&!prog.skins.includes('brass')){prog.skins.push('brass');$('hintText').textContent='🔓 解锁新锁皮肤：黄铜锁！暂停菜单可换';}
  if(cleared>=6&&!prog.skins.includes('blackgold')){prog.skins.push('blackgold');}
  if(cleared>=9&&!prog.skins.includes('sheriff')){prog.skins.push('sheriff');}
  saveProg();
  if(FX)FX.burst(sparks,DCX,DCY,'#ffd34d',30);
  beep(660,.12);setTimeout(()=>beep(880,.18),130);
  const last=lvIdx>=LEVELS.length-1;
  $('overTitle').textContent=last?'🏆 金库之王！':'💰 开锁成功！';
  $('overStars').textContent='★'.repeat(stars)+'☆'.repeat(3-stars);
  $('finalScore').textContent='+'+sc;
  $('overText').textContent=(last?'总分 '+runScore+' · 最佳 '+best:'试错 '+wrongs+' 次 · 总分 '+runScore);
  $('nextBtn').style.display=last?'none':'';
  state='over';show('overScr',true);
}
function failLevel(){
  state='over';
  $('overTitle').textContent='⏰ 时间到！';
  $('overStars').textContent='☆☆☆';
  $('finalScore').textContent='0';
  $('overText').textContent='警报引来了警长……再试一次吧';
  $('nextBtn').style.display='none';
  beep(160,.5,'sawtooth');show('overScr',true);
}
// ---- 流程 ----
function show(id,on){$(id).classList.toggle('hidden',!on);}
function startRun(){runScore=0;$('score').textContent=0;loadLevel(0);beep(660,.12);}
function pause(){if(state!=='play')return;state='pause';buildLvGrid();buildSkins();show('pauseOv',true);}
function resume(){if(state!=='pause')return;state='play';lastT=performance.now();show('pauseOv',false);}
function buildLvGrid(){
  const g=$('lvgrid');g.innerHTML='';
  LEVELS.forEach((L,i)=>{
    const b=document.createElement('button');
    b.textContent=(i+1)+(prog.stars[i]?'★'.repeat(prog.stars[i]):'');
    b.disabled=i>=prog.unlocked;
    b.addEventListener('click',()=>{loadLevel(i);beep(600,.08);});
    g.appendChild(b);
  });
}
function buildSkins(){
  const g=$('skingrid');g.innerHTML='';
  prog.skins.forEach(s=>{
    const b=document.createElement('button');
    b.textContent=(prog.skin===s?'✓':'')+SKINS[s].name;
    b.className=prog.skin===s?'sel':'';
    b.addEventListener('click',()=>{prog.skin=s;saveProg();buildSkins();beep(700,.07);});
    g.appendChild(b);
  });
}
$('startBtn').addEventListener('click',startRun);
$('againBtn').addEventListener('click',()=>{show('overScr',false);startRun();});
$('nextBtn').addEventListener('click',()=>{show('overScr',false);loadLevel(Math.min(LEVELS.length-1,lvIdx+1));beep(600,.08);});
$('pauseBtn').addEventListener('click',()=>state==='pause'?resume():pause());
$('resumeBtn').addEventListener('click',resume);
$('retryBtn').addEventListener('click',()=>{show('pauseOv',false);loadLevel(lvIdx);});
$('quitBtn').addEventListener('click',()=>{show('pauseOv',false);state='menu';show('startScr',true);});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
// ---- 绘制 ----
function draw(){
  const sk=SKINS[prog.skin]||SKINS.steel;
  if(FX)FX.stage(ctx,W,H,'#3a2a18','#17100a');
  else{ctx.fillStyle='#241a10';ctx.fillRect(0,0,W,H);}
  if(alarmT>0){ctx.fillStyle='rgba(255,40,40,'+(alarmT*.3)+')';ctx.fillRect(0,0,W,H);alarmT-=.04;}
  // 保险柜门
  const dx=30,dy=88,dw=W-60,dh=320;
  if(FX)FX.tile(ctx,dx,dy,dw,dh,'#4d4438',14);
  else{ctx.fillStyle='#4d4438';ctx.fillRect(dx,dy,dw,dh);}
  ctx.strokeStyle='#2c251c';ctx.lineWidth=3;ctx.strokeRect(dx+6,dy+6,dw-12,dh-12);
  // 三个密码槽
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(let i=0;i<3;i++){
    const sx=W/2+(i-1)*92,sy=dy+34;
    ctx.fillStyle=i===slotIdx&&state==='play'?'#5a4a28':'#241c12';
    ctx.fillRect(sx-38,sy-22,76,44);
    ctx.strokeStyle=i===slotIdx?'#ffd34d':'#6b5a40';ctx.lineWidth=2;
    ctx.strokeRect(sx-38,sy-22,76,44);
    ctx.fillStyle=slots[i]>=0?'#ffd34d':'#6b5a40';
    ctx.font='bold 26px sans-serif';
    ctx.fillText(slots[i]>=0?('0'+slots[i]).slice(-2):'––',sx,sy+1);
  }
  // 转盘
  ctx.save();ctx.translate(DCX,DCY);
  if(FX){FX.shadow(ctx,0,10,DR2,10);}
  ctx.fillStyle=sk.ring;ctx.beginPath();ctx.arc(0,0,DR2,0,7);ctx.fill();
  ctx.save();ctx.rotate(rot);
  ctx.fillStyle=sk.face;ctx.beginPath();ctx.arc(0,0,DR2-14,0,7);ctx.fill();
  for(let i=0;i<40;i++){
    const a=i/40*2*Math.PI,big=i%5===0;
    ctx.strokeStyle=sk.tick;ctx.lineWidth=big?3:1;
    const r1=DR2-16,r0=big?DR2-30:DR2-24;
    ctx.beginPath();ctx.moveTo(Math.sin(a)*r0,-Math.cos(a)*r0);ctx.lineTo(Math.sin(a)*r1,-Math.cos(a)*r1);ctx.stroke();
    if(big){ctx.fillStyle=sk.tick;ctx.font='bold 13px sans-serif';
      ctx.fillText(i,Math.sin(a)*(DR2-42),-Math.cos(a)*(DR2-42));}
  }
  // 把手
  for(let k=0;k<3;k++){const a=k/3*2*Math.PI;
    ctx.fillStyle='rgba(255,255,255,.25)';
    ctx.beginPath();ctx.arc(Math.sin(a)*(DR2-58),-Math.cos(a)*(DR2-58),9,0,7);ctx.fill();}
  ctx.restore();
  if(FX)FX.orb(ctx,0,0,34,'rgba(255,255,255,.18)');
  // 中心当前值
  ctx.fillStyle='#141414';ctx.beginPath();ctx.arc(0,0,34,0,7);ctx.fill();
  ctx.strokeStyle=sk.ring;ctx.lineWidth=3;ctx.stroke();
  ctx.fillStyle='#ffd34d';ctx.font='bold 26px sans-serif';
  ctx.fillText(('0'+value).slice(-2),0,1);
  ctx.restore();
  // 顶部指针
  ctx.fillStyle='#ff5a5a';
  ctx.beginPath();ctx.moveTo(DCX-8,DCY-DR2-4);ctx.lineTo(DCX+8,DCY-DR2-4);ctx.lineTo(DCX,DCY-DR2+10);ctx.closePath();ctx.fill();
  if(FX)FX.drawBurst(ctx,sparks);
  // 底部文字
  ctx.fillStyle='#ffe9c4';ctx.font='13px sans-serif';ctx.textAlign='left';
  const L=lv();
  ctx.fillText('第'+(lvIdx+1)+'关·'+L.name+(L.timed?' · 限时':'')+' · 试错 '+wrongs+' 次',10,H-14);
}
let lastT=0;
function frame(t){
  const dt=Math.min(.05,(t-lastT)/1000);lastT=t;
  if(state==='play'){
    const L=lv();
    if(L.timed){timeLeft-=dt;$('timer').textContent='⏱'+fmtT(timeLeft)+' ';
      if(timeLeft<=0){timeLeft=0;failLevel();}}
    if(snapA){snapA.t+=dt*6;
      if(snapA.t>=1){rot=snapA.to;snapA=null;}
      else{const k=snapA.t*snapA.t*(3-2*snapA.t);rot=snapA.from+(snapA.to-snapA.from)*k;}
      const v=((Math.round(rot/(2*Math.PI)*40))%40+40)%40;value=v;}
  }
  draw();requestAnimationFrame(frame);
}
draw();requestAnimationFrame(t=>{lastT=t;requestAnimationFrame(frame);});
</script>
