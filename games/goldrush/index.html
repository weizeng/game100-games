<style>
/* 游戏自身样式只管布局与玩法元素；颜色/面板/按钮外观交给共用皮肤（sync 时注入）。 */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{display:flex;justify-content:center;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.wrap{width:100%;max-width:480px;height:100%;padding:12px;display:flex;flex-direction:column;align-items:center;gap:8px}
.topbar{width:100%;display:flex;justify-content:space-between;align-items:center}
.topbar .tools{display:flex;gap:8px}
.topbar .tools .iconbtn{min-width:44px;min-height:44px}
#cv{width:100%;max-height:calc(100svh - 260px);aspect-ratio:360/540;object-fit:contain;touch-action:none;border-radius:16px}
.controls{width:100%;display:flex;flex-direction:column;gap:8px}

.controls .btn{flex:1;min-height:44px;font-size:15px}
.controls .seg{flex:1;display:flex;gap:6px}
.controls .seg .btn{flex:1}
.controls .btn.sel{outline:3px solid #ffd34d}
.hint{font-size:13px;text-align:center}
.overlay{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;z-index:20;padding:24px;text-align:center}
.overlay.hidden{display:none}
.overlay .btn{min-height:44px;min-width:180px}
.shoprow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
</style>

<style>

    orb: function (ctx, x, y, r, color) {
      var pad = Math.ceil(r * .5) + 2, s = scaleOf(ctx);
      ctx.drawImage(sprite('o' + color + r, r * 2, r * 2, pad, s, function (g) { orbArt(g, r, color, pad); }), x - r - pad, y - r - pad, r * 2 + pad * 2, r * 2 + pad * 2);
    },
    // Soft elliptical contact shadow under any sprite (emoji, characters, pieces).
    shadow: function (ctx, x, y, rx, ry, a) {
      ctx.save(); ctx.fillStyle = 'rgba(0,0,0,' + (a == null ? .28 : a) + ')'; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, 7); ctx.fill(); ctx.restore();
    },
    // Lit stage background: vertical gradient plus a vignette. Cached per size/colours.
    stage: function (ctx, w, h, top, bottom) {
      var s = scaleOf(ctx);
      ctx.drawImage(sprite('s' + w + 'x' + h + top + bottom, w, h, 0, s, function (g) {
        var lg = g.createLinearGradient(0, 0, 0, h); lg.addColorStop(0, top); lg.addColorStop(1, bottom); g.fillStyle = lg; g.fillRect(0, 0, w, h);
        var v = g.createRadialGradient(w / 2, h * .35, Math.min(w, h) * .2, w / 2, h / 2, Math.max(w, h) * .75);
        v.addColorStop(0, 'rgba(255,255,255,' + (skin === 'b' ? .10 : .07) + ')'); v.addColorStop(1, 'rgba(0,0,0,.35)'); g.fillStyle = v; g.fillRect(0, 0, w, h);
      }), 0, 0, w, h);
    },
    // Glow is shadowBlur: cheap for a handful of shapes, never use it on every tile.
    glow: function (ctx, color, blur) { ctx.shadowColor = color; ctx.shadowBlur = blur; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0; },
    noGlow: function (ctx) { ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; },
    // Crisp rendering on high-DPI phones without changing game coordinates.
    // Only safe where input code converts with getBoundingClientRect + logical W/H, not cv.width.
    hidpi: function (cv, ctx, w, h) {
      var d = Math.max(1, Math.min(2.5, window.devicePixelRatio || 1));
      cv.width = Math.round(w * d); cv.height = Math.round(h * d); // intrinsic ratio stays w:h, so CSS sizing is unchanged
      ctx.setTransform(d, 0, 0, d, 0, 0); return d;
    },
    // Lightweight particle bursts (pooled array, no allocations per frame beyond the burst).
    burst: function (list, x, y, color, n) {
      for (var i = 0; i < (n || 12); i++) { var a = Math.random() * 6.283, v = 1 + Math.random() * 2.6; list.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 1, life: 1, c: color, r: 1.5 + Math.random() * 2.5 }); }
    },
    drawBurst: function (ctx, list) {
      for (var i = list.length - 1; i >= 0; i--) {
        var p = list[i]; p.x += p.vx; p.y += p.vy; p.vy += .12; p.life -= .035;
        if (p.life <= 0) { list.splice(i, 1); continue; }
        ctx.globalAlpha = p.life; ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (skin === 'b' ? 1.2 : 1), 0, 7); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
  };
  window.GameUI.fx = fx;
}());

</script>
<!-- GAME UI END -->
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <span class="title">⛏️ 淘金热</span>
    <span>得分 <b id="score">0</b> · 最佳 <b id="best">0</b></span>
    <span class="tools"><button class="iconbtn" id="muteBtn" aria-label="切换音效">🔊</button><button class="iconbtn" id="pauseBtn" aria-label="暂停游戏">⏸</button></span>
  </div>
  <canvas id="cv"></canvas>
  <div class="controls">
    <div class="row">
      <div class="seg" role="group" aria-label="水势">
        <button class="btn" data-str="1">💧弱</button>
        <button class="btn sel" data-str="2">💧💧中</button>
        <button class="btn" data-str="3">💧💧💧强</button>
      </div>
    </div>
    <div class="row">
      <button class="btn" id="flushBtn">🚿 冲水</button>
      <button class="btn" id="collectBtn">💰 收金入库</button>
    </div>
  </div>
  <p class="hint" id="hint">左右拖动摇晃淘金盘，把砂石晃到上面再冲掉</p>
</div>
<div class="overlay" id="startScr"><h1>⛏️ 淘金热</h1><p>左右拖动摇晃淘金盘，让砂石浮到上层。<br>选水势按「冲水」：弱水只冲沙，强水连小金粒也冲走！<br>金粒=10，大金块=50；冲干净砂石后「收金入库」。<br>10 关，目标金重递增；第 5/10 关是限时富矿脉。<br>金币可升级盘面（更多水）与筛网（护住小金粒）。</p><button class="btn" id="startBtn">开始游戏</button></div>
<div class="overlay hidden" id="pauseOv"><h1>⏸ 已暂停</h1><button class="btn" id="resumeBtn">继续</button><button class="btn ghost" id="quitBtn">重开本关</button></div>
<div class="overlay hidden" id="passOv"><h1>✅ 过关！</h1><p id="passText"></p><div class="shoprow">
<button class="btn" id="upPanBtn"></button>
<button class="btn" id="upMeshBtn"></button>
</div><button class="btn" id="nextBtn">下一关</button></div>
<div class="overlay hidden" id="overScr"><h1 id="overTitle">游戏结束</h1><div class="score" id="finalScore">0</div><p id="overText"></p><button class="btn" id="againBtn">再来一局</button></div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const W=360,H=540;
const cv=$('cv'),ctx=cv.getContext('2d');
const UI=window.GameUI||{pick:a=>a,storageGet:k=>localStorage.getItem(k),storageSet:(k,v)=>localStorage.setItem(k,v)};
const FX=UI.fx&&UI.fx.on?UI.fx:null;
if(FX)FX.hidpi(cv,ctx,W,H);else{cv.width=W;cv.height=H;}
// ---- 关卡配置 ----
const LEVELS=[
 {sand:26,s:3,b:1,target:50, water:8},
 {sand:32,s:4,b:1,target:70, water:8},
 {sand:38,s:4,b:2,target:100,water:9},
 {sand:44,s:5,b:2,target:110,water:9},
 {sand:40,s:8,b:3,target:180,water:10,time:90,rich:true},
 {sand:50,s:6,b:2,target:120,water:10},
 {sand:56,s:7,b:2,target:130,water:10},
 {sand:62,s:7,b:3,target:160,water:11},
 {sand:68,s:8,b:3,target:170,water:11},
 {sand:60,s:10,b:4,target:240,water:12,time:120,rich:true},
];
const VAL={s:10,b:50};
const STR_COST=[0,1,2,3];          // 弱/中/强每次耗水
const SAND_WASH=[0,4,7,11];        // 每次冲水带走的砂石数
const GOLD_LOSS=[0,0,0.15,0.45];   // 小金粒被冲走概率（按水势）
const PAN={cx:180,cy:300,rx:138,ry:70};
// ---- 存档 ----
let prog={coins:0,panLv:0,meshLv:0};
try{const p=JSON.parse(UI.storageGet('g100_goldrush_prog')||'null');if(p)prog=p;}catch(e){}
function saveProg(){UI.storageSet('g100_goldrush_prog',JSON.stringify(prog));}
let best=+UI.storageGet('g100_goldrush_hs')||0;$('best').textContent=best;
// ---- 状态 ----
let state='menu',level=1,score=0,water=0,strength=2,parts=[],sparks=[],debris=[],floats=[],flushT=0,flushAnim=null,timeLeft=0,bannerT=0,shakeV=0,panTilt=0,lvlMsg='';
let muted=UI.storageGet('g100_goldrush_mute')==='1',ac=null;$('muteBtn').textContent=muted?'🔇':'🔊';
function beep(f,d,type){if(muted)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(.15,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d);}catch(e){}}
$('muteBtn').addEventListener('click',()=>{muted=!muted;UI.storageSet('g100_goldrush_mute',muted?'1':'0');$('muteBtn').textContent=muted?'🔇':'🔊';});
function show(id,on){$(id).classList.toggle('hidden',!on);}
function toast(t){lvlMsg=t;bannerT=2.2;}
function updateHint(){const L=LEVELS[level-1];$('hint').textContent='第'+level+'关'+(L.rich?'·富矿脉':'')+' · 目标'+L.target+'金 · 💧'+water+(L.time?' · ⏱'+Math.ceil(timeLeft)+'s':'')+' · 金币'+prog.coins;}
// ---- 开关卡 ----
function mkParts(L){const a=[];const rnd=(n,fn)=>{for(let i=0;i<n;i++)fn();};
 const put=(t)=>{const ang=Math.random()*Math.PI*2,rr=Math.sqrt(Math.random());
  a.push({t,x:PAN.cx+Math.cos(ang)*rr*PAN.rx*.85,y:PAN.cy+Math.sin(ang)*rr*PAN.ry*.85,vx:0,vy:0,r:t==='sand'?2.5+Math.random()*2:t==='s'?4.5:8});};
 rnd(L.sand,()=>put('sand'));rnd(L.s,()=>put('s'));rnd(L.b,()=>put('b'));return a;}
function startLevel(lv){level=lv;const L=LEVELS[lv-1];water=L.water+prog.panLv*3;parts=mkParts(L);sparks=[];debris=[];floats=[];
 timeLeft=L.time||0;flushT=0;flushAnim=null;panTilt=0;shakeV=0;state='play';last=performance.now();
 show('startScr',false);show('overScr',false);show('pauseOv',false);show('passOv',false);
 toast((L.rich?'⛏ 富矿脉！限时'+L.time+'秒 ':'第'+lv+'关：')+'目标 '+L.target+' 金');updateHint();beep(660,.12);}
function startGame(){score=0;$('score').textContent=0;startLevel(1);}
function pause(){if(state!=='play')return;state='pause';show('pauseOv',true);}
function resume(){if(state!=='pause')return;state='play';last=performance.now();show('pauseOv',false);}
function gameOver(title,text){state='over';if(score>best){best=score;UI.storageSet('g100_goldrush_hs',best);$('best').textContent=best;}
 $('overTitle').textContent=title;$('finalScore').textContent=score;$('overText').textContent=text+' · 最佳 '+best;show('overScr',true);beep(220,.4,'triangle');}
$('startBtn').addEventListener('click',startGame);
$('againBtn').addEventListener('click',()=>{const t=$('overTitle').textContent;if(t==='🏆 淘金大亨！'||t==='游戏结束')startGame();else startLevel(level);});
$('pauseBtn').addEventListener('click',()=>state==='play'?pause():resume());$('resumeBtn').addEventListener('click',resume);
$('quitBtn').addEventListener('click',()=>{show('pauseOv',false);startLevel(level);});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
// ---- 输入：摇晃 + 水势 ----
function posOf(e){const r=cv.getBoundingClientRect();const t=(e.touches&&e.touches.length)?e.touches[0]:(e.changedTouches&&e.changedTouches.length)?e.changedTouches[0]:e;return{x:(t.clientX-r.left)*W/r.width,y:(t.clientY-r.top)*H/r.height};}
let dragging=false,lastX=0;
cv.addEventListener('pointerdown',e=>{if(state!=='play')return;e.preventDefault();dragging=true;lastX=posOf(e).x;cv.setPointerCapture&&cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointermove',e=>{if(!dragging||state!=='play')return;const x=posOf(e).x;shakeV+=(x-lastX)*.9;lastX=x;});
['pointerup','pointercancel'].forEach(t=>cv.addEventListener(t,()=>{dragging=false;}));
document.querySelectorAll('.seg .btn').forEach(b=>b.addEventListener('click',()=>{strength=+b.dataset.str;document.querySelectorAll('.seg .btn').forEach(x=>x.classList.toggle('sel',x===b));beep(500+strength*150,.06);}));
$('flushBtn').addEventListener('click',()=>{if(state!=='play'||flushT>0)return;const cost=STR_COST[strength];if(water<cost){toast('💧 水不够了！');beep(180,.2,'sawtooth');return;}
 water-=cost;flushT=1.4;const meshCut=Math.max(.1,1-.5*prog.meshLv);
 flushAnim={t:0,left:SAND_WASH[strength],goldP:GOLD_LOSS[strength]*meshCut};beep(300,.5,'sawtooth');updateHint();});
$('collectBtn').addEventListener('click',()=>{if(state!=='play'||flushT>0)return;
 const sand=parts.filter(p=>p.t==='sand').length;
 if(sand>0){toast('还有 '+sand+' 粒砂石没冲干净！');beep(180,.2,'sawtooth');return;}
 const val=parts.reduce((s,p)=>s+(VAL[p.t]||0),0);score+=val;$('score').textContent=score;
 const L=LEVELS[level-1];
 if(val>=L.target){const coins=Math.floor(val/10)+(L.rich&&timeLeft>0?15:0);prog.coins+=coins;saveProg();
  if(FX)FX.burst(sparks,PAN.cx,PAN.cy,'#ffd34d',26);beep(880,.2);
  if(level>=LEVELS.length){gameOver('🏆 淘金大亨！','10 关全部通关，总得分 '+score+'，金币 '+prog.coins);}
  else{$('passText').textContent='入库 '+val+' 金（目标 '+L.target+'） · +'+coins+' 金币';refreshShop();show('passOv',true);state='pass';}}
 else{gameOver('😢 本关失败','只淘到 '+val+' 金，没达到目标 '+L.target+'。');}});
function refreshShop(){$('upPanBtn').textContent='🍽 升级盘面 Lv'+prog.panLv+'（'+(25*(prog.panLv+1))+'币，+3水）';
 $('upMeshBtn').textContent='🥅 升级筛网 Lv'+prog.meshLv+'（'+(35*(prog.meshLv+1))+'币，护小金粒）';}
$('upPanBtn').addEventListener('click',()=>{const c=25*(prog.panLv+1);if(prog.coins<c){toast('金币不够');beep(180,.15,'sawtooth');return;}prog.coins-=c;prog.panLv++;saveProg();refreshShop();updateHint();beep(990,.12);});
$('upMeshBtn').addEventListener('click',()=>{const c=35*(prog.meshLv+1);if(prog.coins<c){toast('金币不够');beep(180,.15,'sawtooth');return;}prog.coins-=c;prog.meshLv++;saveProg();refreshShop();updateHint();beep(990,.12);});
$('nextBtn').addEventListener('click',()=>{show('passOv',false);startLevel(level+1);});
// ---- 物理 ----
function inside(p){const dx=(p.x-PAN.cx)/PAN.rx,dy=(p.y-PAN.cy)/PAN.ry;const d=dx*dx+dy*dy;if(d>1){p.x=PAN.cx+dx/d*PAN.rx;p.y=PAN.cy+dy/d*PAN.ry;}}
function update(dt){
 panTilt+= (Math.max(-1,Math.min(1,shakeV*.04))-panTilt)*Math.min(1,dt*8);shakeV*=.9;
 const mob={sand:1.3,s:.55,b:.28};
 for(const p of parts){const m=mob[p.t];
  p.vx+=shakeV*m*dt*8;p.vx*=.92;p.x+=p.vx*dt*60;
  const sinkY=PAN.cy+PAN.ry*.55*(p.t==='sand'?.25:p.t==='s'?.6:.85);
  p.vy+=(sinkY-p.y)*dt*3*(p.t==='sand'?.4:1);p.vy*=.9;p.y+=p.vy*dt*60;
  inside(p);}
 if(flushT>0){flushT-=dt;const fa=flushAnim;fa.t+=dt;
  // 砂石被水流带走
  if(fa.left>0&&Math.random()<.6){const sands=parts.filter(p=>p.t==='sand');if(sands.length){const v=sands[Math.floor(Math.random()*sands.length)];parts.splice(parts.indexOf(v),1);fa.left--;debris.push({x:v.x,y:v.y,vx:-140-Math.random()*80,vy:-60-Math.random()*60,life:.7});}}
  if(fa.t>1.0&&!fa.goldDone){fa.goldDone=true; // 结算小金粒损失
   for(let i=parts.length-1;i>=0;i--){const p=parts[i];if(p.t==='s'&&Math.random()<fa.goldP){parts.splice(i,1);floats.push({x:p.x,y:p.y,txt:'-10',life:1.2,c:'#ff5f5f'});beep(200,.25,'sawtooth');}}}
  if(flushT<=0){flushAnim=null;
   const sandLeft=parts.filter(p=>p.t==='sand').length;
   if(water<STR_COST[1]&&sandLeft>0){gameOver('😢 本关失败','水用完了，还剩 '+sandLeft+' 粒砂石。');return;}}}
 const L=LEVELS[level-1];
 if(L.time){timeLeft-=dt;if(timeLeft<=0){timeLeft=0;gameOver('⏱ 时间到！','富矿脉限时结束。');return;}if(Math.ceil(timeLeft)!==Math.ceil(timeLeft+dt))updateHint();}
 if(bannerT>0)bannerT-=dt;
 for(let i=floats.length-1;i>=0;i--){const f=floats[i];f.life-=dt;f.y-=30*dt;if(f.life<=0)floats.splice(i,1);}
 for(let i=sparks.length-1;i>=0;i--){const s=sparks[i];s.life-=dt;if(s.life<=0)sparks.splice(i,1);}
 for(let i=debris.length-1;i>=0;i--){const d=debris[i];d.life-=dt;d.x+=d.vx*dt;d.y+=d.vy*dt;if(d.life<=0)debris.splice(i,1);}
}
// ---- 绘制 ----
function draw(){
 if(FX)FX.stage(ctx,W,H,'#8a5a2b','#2e1a0c');else{ctx.fillStyle='#3a2412';ctx.fillRect(0,0,W,H);}
 // 水流
 if(flushT>0){ctx.save();ctx.globalAlpha=.55;ctx.fillStyle='#5ec8f2';const wpx=30+Math.sin(flushAnim.t*30)*8;
  ctx.fillRect(PAN.cx+PAN.rx*.4-wpx/2,40,wpx,PAN.cy-40);ctx.restore();}
 // 淘金盘
 ctx.save();ctx.translate(PAN.cx,PAN.cy);ctx.rotate(panTilt*.25);
 const px=-PAN.rx,py=-PAN.ry;
 if(FX){FX.shadow(ctx,0,26,PAN.rx,14);ctx.fillStyle='#6b4a2a';ctx.beginPath();ctx.ellipse(0,0,PAN.rx+10,PAN.ry+10,0,0,7);ctx.fill();
  ctx.fillStyle='#8f6238';ctx.beginPath();ctx.ellipse(0,0,PAN.rx,PAN.ry,0,0,7);ctx.fill();
  ctx.fillStyle='#5d3f22';ctx.beginPath();ctx.ellipse(0,6,PAN.rx*.88,PAN.ry*.82,0,0,7);ctx.fill();}
 else{ctx.fillStyle='#7a5230';ctx.beginPath();ctx.ellipse(0,0,PAN.rx,PAN.ry,0,0,7);ctx.fill();}
 // 粒子（按 y 排序有纵深）
 const ps=parts.slice().sort((a,b)=>a.y-b.y);
 for(const p of ps){const lx=p.x-PAN.cx,ly=p.y-PAN.cy;
  if(p.t==='sand'){ctx.fillStyle='#c9a86a';ctx.beginPath();ctx.arc(lx,ly,p.r,0,7);ctx.fill();}
  else{const c=p.t==='s'?'#ffd34d':'#ff9f1c';
   if(FX){FX.orb(ctx,lx,ly,p.r,c);}else{ctx.fillStyle=c;ctx.beginPath();ctx.arc(lx,ly,p.r,0,7);ctx.fill();}
   if(p.t==='b'){ctx.fillStyle='#7a4a00';ctx.font='bold 9px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('金',lx,ly);}}}
 ctx.restore();
 if(FX)FX.drawBurst(ctx,sparks);
 for(const d of debris){ctx.fillStyle='#c9a86a';ctx.globalAlpha=Math.max(0,Math.min(1,d.life));ctx.beginPath();ctx.arc(d.x,d.y,2.5,0,7);ctx.fill();ctx.globalAlpha=1;}
 // 飘字
 ctx.textAlign='center';ctx.textBaseline='middle';
 for(const f of floats){ctx.globalAlpha=Math.min(1,f.life);ctx.fillStyle=f.c;ctx.font='bold 18px sans-serif';ctx.fillText(f.txt,f.x,f.y);ctx.globalAlpha=1;}
 // 顶部信息条
 ctx.fillStyle='#fff';ctx.font='bold 14px sans-serif';ctx.textAlign='left';
 const sandN=parts.filter(p=>p.t==='sand').length,goldN=parts.filter(p=>p.t!=='sand').length;
 ctx.fillText('🏖 砂石'+sandN+'  ✨ 金'+goldN+'粒',12,22);
 const L=LEVELS[level-1];if(L.time){ctx.fillStyle=timeLeft<15?'#ff6b6b':'#ffe08a';ctx.textAlign='right';ctx.fillText('⏱ '+Math.ceil(timeLeft)+'s',W-12,22);}
 if(bannerT>0){ctx.fillStyle='rgba(0,0,0,.55)';const bw=Math.min(W-40,lvlMsg.length*16+40);
  ctx.fillRect((W-bw)/2,70,bw,36);ctx.fillStyle='#ffe08a';ctx.font='bold 15px sans-serif';ctx.textAlign='center';ctx.fillText(lvlMsg,W/2,89);}
}
let last=0;
function frame(t){const dt=Math.min(.05,(t-last)/1000);last=t;if(state==='play')update(dt);draw();requestAnimationFrame(frame);}
draw();requestAnimationFrame(frame);
</script>
</body></html>
