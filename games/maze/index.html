<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>迷宫</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:linear-gradient(160deg,#0f3b2e 0%,#121212 55%,#0a0a0a 100%);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;display:flex;justify-content:center;min-height:100vh;touch-action:manipulation;-webkit-user-select:none;user-select:none;overflow-x:hidden}
.wrap{width:100%;max-width:480px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:10px;position:relative;z-index:1}
.topbar{width:100%;display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:9px 12px;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.topbar .title{font-weight:700;font-size:16px}
.topbar .stat{color:#9df0cd;font-size:13px}
.topbar .stat b{color:#fff;font-size:15px}
.tbtn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:#fff;font-size:16px;min-width:38px;height:38px;border-radius:11px;cursor:pointer;transition:transform .08s}
.tbtn:active{transform:scale(.9)}
.screen{width:100%;display:none;flex-direction:column;align-items:center;gap:12px}
.screen.on{display:flex}
.card{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:20px;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.card h1{font-size:26px;margin-bottom:6px;background:linear-gradient(90deg,#34d399,#a7f3d0);-webkit-background-clip:text;background-clip:text;color:transparent}
.card h2{font-size:22px;margin-bottom:8px}
.card p{color:#bfe9d4;font-size:14px;line-height:1.7;margin-bottom:10px}
.bigbtn{background:linear-gradient(135deg,#10b981,#34d399);border:none;color:#06281c;font-size:18px;font-weight:700;padding:14px 46px;border-radius:999px;cursor:pointer;box-shadow:0 6px 18px rgba(16,185,129,.45);transition:transform .1s}
.bigbtn:active{transform:scale(.93)}
.ghostbtn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#fff;font-size:14px;padding:10px 22px;border-radius:999px;cursor:pointer;transition:transform .1s}
.ghostbtn:active{transform:scale(.93)}
#cvwrap{width:100%;display:flex;justify-content:center;touch-action:none}
#cv{border-radius:14px;background:#0d1f18;box-shadow:0 8px 24px rgba(0,0,0,.5);touch-action:none}
.pad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(3,64px);gap:6px}
.pbtn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#fff;font-size:22px;border-radius:14px;cursor:pointer;transition:transform .08s}
.pbtn:active{transform:scale(.9);background:rgba(52,211,153,.25)}
.best{color:#ffd76a;font-size:14px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
.float{position:fixed;pointer-events:none;z-index:60;font-weight:700;font-size:18px;animation:floatup 1.1s ease-out forwards}
@keyframes floatup{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-46px)}}
#pauseov{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:40;backdrop-filter:blur(4px)}
#pauseov.on{display:flex}
.pausecard{background:#1c1c22;border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:28px 36px;text-align:center;display:flex;flex-direction:column;gap:12px}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="wrap">
  <div class="topbar">
    <span class="title">🌀 迷宫</span>
    <span class="stat">⏱<b id="tm">0s</b> · 步数<b id="steps">0</b></span>
    <span><button class="tbtn" id="sndBtn">🔊</button><button class="tbtn" id="pauseBtn">⏸</button></span>
  </div>
  <div class="screen on" id="s-start">
    <div class="card">
      <h1>🌀 迷宫大冒险</h1>
      <p>DFS 算法随机生成的完美迷宫，等你来闯！<br>滑动屏幕、方向键或点按方向按钮移动。<br>🟢 出发 → 🏁 到达红色终点。<br>用时越短、步数越少，评价越高！</p>
      <button class="bigbtn" id="btnStart">开始闯关</button>
    </div>
  </div>
  <div class="screen" id="s-game">
    <div id="cvwrap"><canvas id="cv"></canvas></div>
    <div class="pad">
      <span></span><button class="pbtn" data-d="up">▲</button><span></span>
      <button class="pbtn" data-d="left">◀</button><button class="pbtn" data-d="down">▼</button><button class="pbtn" data-d="right">▶</button>
      <span></span><span></span><span></span>
    </div>
    <button class="ghostbtn" id="btnNew">🔄 重开新迷宫</button>
  </div>
  <div class="screen" id="s-end">
    <div class="card">
      <h2>🏆 走出迷宫！</h2>
      <p id="endInfo"></p>
      <p id="endRank" style="font-size:18px;font-weight:700"></p>
      <p class="best" id="endBest"></p>
      <div style="display:flex;gap:10px;justify-content:center"><button class="bigbtn" id="btnAgain">再闯一次</button><button class="ghostbtn" id="btnHome">返回</button></div>
    </div>
  </div>
</div>
<div id="pauseov"><div class="pausecard"><h2>⏸ 已暂停</h2><button class="bigbtn" id="btnResume">继续</button><button class="ghostbtn" id="btnQuit">退出</button></div></div>
<script>
"use strict";
var $=function(id){return document.getElementById(id)};
var store={get:function(k,d){try{var v=localStorage.getItem("maze_"+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set:function(k,v){try{localStorage.setItem("maze_"+k,JSON.stringify(v))}catch(e){}}};
var AC=null,soundOn=store.get("sound",true);
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==="suspended"){AC.resume()}return AC}
function tone(f,dur,type,vol,when){if(!soundOn)return;var c=ac();if(!c)return;try{var o=c.createOscillator(),g=c.createGain();o.type=type||"sine";o.frequency.value=f;g.gain.setValueAtTime(vol||.12,c.currentTime+(when||0));g.gain.exponentialRampToValueAtTime(.001,c.currentTime+(when||0)+(dur||.1));o.connect(g);g.connect(c.destination);o.start(c.currentTime+(when||0));o.stop(c.currentTime+(when||0)+(dur||.1)+.02)}catch(e){}}
var sClick=function(){tone(500,.07,"triangle")},sStep=function(){tone(340+Math.random()*80,.05,"sine",.08)},sWall=function(){tone(140,.1,"sawtooth",.08)},sWin=function(){[523,659,784,1046,1318].forEach(function(f,i){tone(f,.2,"sine",.15,i*.1)})};
var fx=$("fx"),fctx=fx.getContext("2d"),parts=[];
function fxSize(){fx.width=innerWidth;fx.height=innerHeight}addEventListener("resize",fxSize);fxSize();
function burst(x,y,color,n){for(var i=0;i<(n||14);i++)parts.push({x:x,y:y,vx:(Math.random()-.5)*7,vy:(Math.random()-.5)*7-2,life:1,color:color||"#34d399",r:2+Math.random()*3})}
(function fxLoop(){fctx.clearRect(0,0,fx.width,fx.height);parts=parts.filter(function(p){return p.life>0});parts.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=.22;p.life-=.028;fctx.globalAlpha=Math.max(0,p.life);fctx.fillStyle=p.color;fctx.beginPath();fctx.arc(p.x,p.y,p.r,0,7);fctx.fill()});fctx.globalAlpha=1;requestAnimationFrame(fxLoop)})();
function floatTxt(txt,x,y,color){var d=document.createElement("div");d.className="float";d.textContent=txt;d.style.left=x+"px";d.style.top=y+"px";d.style.color=color||"#ffd76a";document.body.appendChild(d);setTimeout(function(){d.remove()},1150)}
/* ---------- 迷宫生成（DFS 回溯，完美迷宫） ---------- */
var N=15,cells,px,py,steps,secs,timer=null,paused=false,anim=0;
function genMaze(){cells=[];var i,j;for(i=0;i<N;i++){cells.push([]);for(j=0;j<N;j++)cells[i].push({v:false,w:[true,true,true,true]})} // w:上右下左
 var stack=[[0,0]];cells[0][0].v=true;
 var dirs=[[0,-1,0,2],[1,0,1,3],[0,1,2,0],[-1,0,3,1]]; // dx,dy,wall,opp
 while(stack.length){var top=stack[stack.length-1],x=top[0],y=top[1];var ns=[];
  for(var d=0;d<4;d++){var nx=x+dirs[d][0],ny=y+dirs[d][1];if(nx>=0&&ny>=0&&nx<N&&ny<N&&!cells[ny][nx].v)ns.push([nx,ny,dirs[d][2],dirs[d][3]])}
  if(!ns.length){stack.pop();continue}
  var ch=ns[Math.floor(Math.random()*ns.length)];cells[y][x].w[ch[2]]=false;cells[ch[1]][ch[0]].w[ch[3]]=false;cells[ch[1]][ch[0]].v=true;stack.push([ch[0],ch[1]])}}
/* ---------- 绘制 ---------- */
var cv=$("cv"),ctx=cv.getContext("2d"),cellPx=0;
function sizeCv(){var s=Math.min(440,innerWidth-24);cv.width=s;cv.height=s;cellPx=s/N;draw()}
function draw(){var s=cv.width;ctx.clearRect(0,0,s,s);
 ctx.fillStyle="#0d1f18";ctx.fillRect(0,0,s,s);
 // 终点
 ctx.fillStyle="rgba(255,80,80,.25)";ctx.fillRect((N-1)*cellPx,(N-1)*cellPx,cellPx,cellPx);
 ctx.font=Math.floor(cellPx*.6)+"px serif";ctx.textAlign="center";ctx.textBaseline="middle";
 ctx.fillText("🏁",(N-.5)*cellPx,(N-.5)*cellPx);
 ctx.fillStyle="rgba(52,211,153,.18)";ctx.fillRect(0,0,cellPx,cellPx);
 ctx.fillText("🟢",cellPx/2,cellPx/2);
 // 路径小人（带弹性动画）
 var bx=(px+.5)*cellPx,by=(py+.5)*cellPx;
 var sc=1+Math.sin(anim*.35)*.06;anim++;
 ctx.font=Math.floor(cellPx*.62*sc)+"px serif";
 ctx.fillText("🧭",bx,by);
 // 墙
 ctx.strokeStyle="#3b6b58";ctx.lineWidth=Math.max(2,cellPx*.09);ctx.lineCap="round";
 for(var y=0;y<N;y++)for(var x=0;x<N;x++){var c=cells[y][x],X=x*cellPx,Y=y*cellPx;
  ctx.beginPath();
  if(c.w[0]){ctx.moveTo(X,Y);ctx.lineTo(X+cellPx,Y)}
  if(c.w[1]){ctx.moveTo(X+cellPx,Y);ctx.lineTo(X+cellPx,Y+cellPx)}
  if(c.w[2]){ctx.moveTo(X,Y+cellPx);ctx.lineTo(X+cellPx,Y+cellPx)}
  if(c.w[3]){ctx.moveTo(X,Y);ctx.lineTo(X,Y+cellPx)}
  ctx.stroke()}
 ctx.strokeStyle="rgba(255,215,106,.7)";ctx.lineWidth=3;ctx.strokeRect(1.5,1.5,s-3,s-3)}
function show(id){["s-start","s-game","s-end"].forEach(function(s){$(s).classList.toggle("on",s===id)})}
function tryMove(dx,dy){var nx=px+dx,ny=py+dy;if(nx<0||ny<0||nx>=N||ny>=N){sWall();return}
 var w=cells[py][px].w; // 上右下左
 if((dx===1&&w[1])||(dx===-1&&w[3])||(dy===1&&w[2])||(dy===-1&&w[0])){sWall();return}
 px=nx;py=ny;steps++;$("steps").textContent=steps;sStep();draw();
 if(px===N-1&&py===N-1)win()}
function win(){clearInterval(timer);sWin();var r=cv.getBoundingClientRect();for(var i=0;i<5;i++)setTimeout(function(){burst(r.left+Math.random()*r.width,r.top+Math.random()*r.height,["#ffd76a","#34d399","#8ab4ff"][i%3],20)},i*130);
 var best=store.get("best",null),score=Math.max(1,Math.round(100000/(secs*2+steps)));
 var nb=false;if(best==null||score>best){store.set("best",score);nb=true}
 var rank=secs<=60&&steps<=N*3?"⚡ 传奇探险家":secs<=120?"🥇 迷宫大师":secs<=240?"🥈 熟练旅者":"🥉 坚持就是胜利";
 setTimeout(function(){$("endInfo").textContent="用时 "+secs+"s · 步数 "+steps+" · 得分 "+score;$("endRank").textContent=rank;$("endBest").textContent=nb?"🏆 新纪录！":"历史最高 "+best;show("s-end")},700)}
function startGame(){genMaze();px=0;py=0;steps=0;secs=0;$("steps").textContent=0;$("tm").textContent="0s";paused=false;sizeCv();show("s-game");clearInterval(timer);timer=setInterval(function(){if(!paused){secs++;$("tm").textContent=secs+"s"}},1000)}
/* ---------- 输入 ---------- */
document.querySelectorAll(".pbtn").forEach(function(b){b.addEventListener("click",function(){sClick();var d=b.dataset.d;if(d==="up")tryMove(0,-1);else if(d==="down")tryMove(0,1);else if(d==="left")tryMove(-1,0);else tryMove(1,0)})});
document.addEventListener("keydown",function(e){if(!$("s-game").classList.contains("on")||paused)return;var k=e.key;if(k==="ArrowUp"){tryMove(0,-1);e.preventDefault()}else if(k==="ArrowDown"){tryMove(0,1);e.preventDefault()}else if(k==="ArrowLeft"){tryMove(-1,0);e.preventDefault()}else if(k==="ArrowRight"){tryMove(1,0);e.preventDefault()}});
var tx=0,ty=0;
cv.addEventListener("touchstart",function(e){e.preventDefault();tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:false});
cv.addEventListener("touchmove",function(e){e.preventDefault()},{passive:false});
cv.addEventListener("touchend",function(e){e.preventDefault();var t=e.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty;if(Math.abs(dx)<18&&Math.abs(dy)<18)return;if(Math.abs(dx)>Math.abs(dy))tryMove(dx>0?1:-1,0);else tryMove(0,dy>0?1:-1)});
var mdown=false,mx=0,my=0;
cv.addEventListener("mousedown",function(e){mdown=true;mx=e.clientX;my=e.clientY});
cv.addEventListener("mouseup",function(e){if(!mdown)return;mdown=false;var dx=e.clientX-mx,dy=e.clientY-my;if(Math.abs(dx)<12&&Math.abs(dy)<12)return;if(Math.abs(dx)>Math.abs(dy))tryMove(dx>0?1:-1,0);else tryMove(0,dy>0?1:-1)});
$("btnStart").onclick=function(){sClick();startGame()};
$("btnNew").onclick=function(){sClick();startGame()};
$("btnAgain").onclick=function(){sClick();startGame()};
$("btnHome").onclick=function(){sClick();show("s-start")};
$("sndBtn").onclick=function(){soundOn=!soundOn;store.set("sound",soundOn);$("sndBtn").textContent=soundOn?"🔊":"🔇";if(soundOn)sClick()};
$("sndBtn").textContent=soundOn?"🔊":"🔇";
$("pauseBtn").onclick=function(){if(!$("s-game").classList.contains("on"))return;sClick();paused=true;$("pauseov").classList.add("on")};
$("btnResume").onclick=function(){sClick();paused=false;$("pauseov").classList.remove("on")};
$("btnQuit").onclick=function(){sClick();paused=false;$("pauseov").classList.remove("on");clearInterval(timer);show("s-start")};
setInterval(function(){if($("s-game").classList.contains("on")&&!paused)draw()},120);
</script>
</body>
</html>
