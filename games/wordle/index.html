<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>猜单词 · 游戏100</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#121212;color:#f2f2f2;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;display:flex;justify-content:center;overscroll-behavior:none}
#app{width:100%;max-width:480px;min-height:100vh;position:relative;display:flex;flex-direction:column;background:radial-gradient(900px 480px at 50% -8%,rgba(155,89,182,.13),transparent 60%),radial-gradient(700px 500px at 90% 110%,rgba(78,205,196,.08),transparent 60%),#121212;overflow:hidden}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;z-index:20}
.tb-title{font-size:14px;font-weight:700;color:#cfcfcf;letter-spacing:1px}
.tb-right{display:flex;gap:8px}
.iconbtn{width:38px;height:38px;border-radius:12px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .1s}
.iconbtn:active{transform:scale(.88)}
.screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;gap:12px;text-align:center;z-index:10}
.hidden{display:none!important}
.bigemoji{font-size:64px;filter:drop-shadow(0 6px 16px rgba(0,0,0,.5));animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.gamename{font-size:28px;font-weight:800;background:linear-gradient(135deg,#d7aefb,#9b59b6);-webkit-background-clip:text;background-clip:text;color:transparent}
.howto{font-size:13.5px;line-height:1.8;color:#bdbdbd;max-width:350px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:12px 16px}
.btn{background:linear-gradient(135deg,#9b59b6,#7d3c98);border:none;color:#fff;font-size:17px;font-weight:800;padding:13px 46px;border-radius:999px;cursor:pointer;box-shadow:0 8px 24px rgba(155,89,182,.35);transition:transform .1s;letter-spacing:2px}
.btn:active{transform:scale(.93)}
.btn.ghost{background:rgba(255,255,255,.08);box-shadow:none;border:1px solid rgba(255,255,255,.16)}
.hsline{font-size:13px;color:#ffd76a}
#fx{position:absolute;inset:0;pointer-events:none;z-index:50}
.float-txt{position:absolute;transform:translate(-50%,-50%);font-weight:800;font-size:20px;pointer-events:none;z-index:60;text-shadow:0 2px 8px rgba(0,0,0,.6);animation:floatUp 1.1s ease-out forwards}
@keyframes floatUp{to{transform:translate(-50%,-160%);opacity:0}}
#pauseOv{position:absolute;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(4px);z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
#pauseOv .btn{font-size:15px;padding:11px 34px}
.endstats{font-size:15px;line-height:2.1;color:#ddd}
.endstats b{color:#ffd76a;font-size:22px}
.msg{min-height:22px;font-size:13px;color:#ff9a9a}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
#board{display:grid;grid-template-rows:repeat(6,1fr);gap:6px;margin:4px 0}
.brow{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.tile{width:56px;height:56px;border:2px solid rgba(255,255,255,.18);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;text-transform:uppercase;background:rgba(255,255,255,.03);transition:transform .12s,background .2s,border-color .2s}
.tile.filled{border-color:rgba(255,255,255,.45);transform:scale(1.05)}
.tile.reveal{animation:flip .5s ease forwards}
@keyframes flip{0%{transform:rotateX(0)}50%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
.tile.correct{background:#2ecc71;border-color:#2ecc71}
.tile.present{background:#d4a017;border-color:#d4a017}
.tile.absent{background:#3a3a3c;border-color:#3a3a3c}
.tile.win{animation:winbounce .5s ease}
@keyframes winbounce{0%,100%{transform:translateY(0)}40%{transform:translateY(-12px)}}
#kbd{display:flex;flex-direction:column;gap:6px;width:100%;max-width:420px;margin-top:6px}
.krow{display:flex;gap:5px;justify-content:center}
.key{flex:1;max-width:44px;height:52px;border-radius:8px;background:#3d3d42;color:#fff;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .08s;text-transform:uppercase;border:none}
.key:active{transform:scale(.9)}
.key.wide{max-width:64px;font-size:13px}
.key.correct{background:#2ecc71}.key.present{background:#d4a017}.key.absent{background:#1e1e20;color:#777}
.hud{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
.pill{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:700}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="tb-title">🔤 猜单词 Wordle</div>
    <div class="tb-right">
      <div class="iconbtn" id="soundBtn">🔊</div>
      <div class="iconbtn hidden" id="pauseBtn">⏸</div>
    </div>
  </div>
  <div class="screen" id="scrStart">
    <div class="bigemoji">🔤</div>
    <div class="gamename">猜单词</div>
    <div class="howto">6 次机会猜出 <strong style="color:#fff">5 字母</strong>英文单词。<br><span style="color:#2ecc71">■ 绿色</span>：字母和位置都对<br><span style="color:#d4a017">■ 黄色</span>：有这个字母但位置不对<br><span style="color:#777">■ 灰色</span>：单词里没有这个字母</div>
    <button class="btn" id="startBtn">开始游戏</button>
    <div class="hsline" id="startHs"></div>
  </div>
  <div class="screen hidden" id="scrGame" style="justify-content:flex-start;padding-top:6px">
    <div class="hud"><div class="pill">第 <span id="round" style="color:#d7aefb">1</span> 次尝试 / 6</div></div>
    <div id="board"></div>
    <div id="kbd"></div>
    <div class="msg" id="msg"></div>
  </div>
  <div class="screen hidden" id="scrEnd">
    <div class="bigemoji" id="endEmoji">🏆</div>
    <div class="gamename" id="endTitle">猜对了！</div>
    <div class="endstats" id="endStats"></div>
    <div class="hsline" id="endHs"></div>
    <button class="btn" id="againBtn">再来一局</button>
    <button class="btn ghost" id="backBtn">返回</button>
  </div>
  <div id="pauseOv" class="hidden">
    <div style="font-size:24px;font-weight:800">⏸ 已暂停</div>
    <button class="btn" id="resumeBtn">继续</button>
    <button class="btn ghost" id="restartBtn">重新开始</button>
  </div>
  <canvas id="fx"></canvas>
</div>
<script>
'use strict';
let ACTX=null, soundOn=true;
try{ soundOn=localStorage.getItem('g100_sound')!=='0'; }catch(e){}
function audio(){ if(!ACTX){ try{ ACTX=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } } if(ACTX&&ACTX.state==='suspended'){ ACTX.resume().catch(function(){}); } return ACTX; }
function tone(f,d,type,vol,delay){ if(!soundOn) return; try{ const c=audio(); if(!c) return; const t=c.currentTime+(delay||0); const o=c.createOscillator(),g=c.createGain(); o.type=type||'sine'; o.frequency.setValueAtTime(f,t); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||0.12,t+0.012); g.gain.exponentialRampToValueAtTime(0.0001,t+d); o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+d+0.05); }catch(e){} }
function sClick(){ tone(700,0.05,'square',0.04); }
function sGood(){ tone(660,0.09,'sine',0.1); tone(990,0.12,'sine',0.1,0.07); }
function sBad(){ tone(200,0.18,'sawtooth',0.07); }
function sWin(){ const seq=[523,659,784,1046,1318]; for(let i=0;i<seq.length;i++) tone(seq[i],0.22,'triangle',0.11,i*0.11); }
function hsGet(k){ try{ const v=parseInt(localStorage.getItem(k)||'0',10); return isNaN(v)?0:v; }catch(e){ return 0; } }
function hsSet(k,v){ try{ localStorage.setItem(k,String(v)); }catch(e){} }
const fxC=document.getElementById('fx'), fxX=fxC.getContext('2d');
let P=[];
function fxSize(){ const r=fxC.parentElement.getBoundingClientRect(); fxC.width=r.width; fxC.height=r.height; }
window.addEventListener('resize',fxSize);
function burst(x,y,n,cols){ for(let i=0;i<(n||24);i++){ const a=Math.random()*Math.PI*2,s=1+Math.random()*3.2; P.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1.2,l:1,c:cols[i%cols.length],r:2+Math.random()*3}); } }
function fxLoop(){ fxX.clearRect(0,0,fxC.width,fxC.height); P=P.filter(function(p){return p.l>0;}); for(let i=0;i<P.length;i++){ const p=P[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=0.06; p.l-=0.018; fxX.globalAlpha=Math.max(p.l,0); fxX.fillStyle=p.c; fxX.beginPath(); fxX.arc(p.x,p.y,p.r,0,7); fxX.fill(); } fxX.globalAlpha=1; requestAnimationFrame(fxLoop); }
function shakeEl(el){ el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }
const $=function(id){ return document.getElementById(id); };
const scrStart=$('scrStart'), scrGame=$('scrGame'), scrEnd=$('scrEnd'), pauseOv=$('pauseOv'), pauseBtn=$('pauseBtn'), soundBtn=$('soundBtn');
let paused=false;
function show(el){ [scrStart,scrGame,scrEnd].forEach(function(s){ s.classList.add('hidden'); }); el.classList.remove('hidden'); fxSize(); }
function setPaused(p){ paused=p; pauseOv.classList.toggle('hidden',!p); }
soundBtn.textContent=soundOn?'🔊':'🔇';
soundBtn.addEventListener('click',function(){ soundOn=!soundOn; soundBtn.textContent=soundOn?'🔊':'🔇'; try{ localStorage.setItem('g100_sound',soundOn?'1':'0'); }catch(e){} if(soundOn) sClick(); });
pauseBtn.addEventListener('click',function(){ sClick(); setPaused(true); });
$('resumeBtn').addEventListener('click',function(){ sClick(); setPaused(false); });
/* ===== 游戏：猜单词 ===== */
const WORDS=['about','above','actor','acute','admit','adopt','adult','after','again','agent','agree','ahead','alarm','album','alert','alive','allow','alone','along','alter','among','angle','angry','apart','apple','apply','arena','argue','arise','arrow','aside','asset','audio','audit','avoid','award','aware','baker','beach','beast','begin','below','berry','birth','black','blade','blame','blank','blast','blend','bless','blind','block','blood','board','bonus','boost','booth','bound','brain','brand','brave','bread','break','brick','bride','brief','bring','brown','brush','build','bunch','buyer','cabin','cable','candy','carry','catch','cause','chain'];
const WORDSET={}; WORDS.forEach(function(w){ WORDSET[w]=1; });
const ROWS=['qwertyuiop','asdfghjkl','zxcvbnm'];
let answer='', row=0, cur='', playing=false, lock=false;
const boardEl=$('board'), kbdEl=$('kbd');
function buildBoard(){
  boardEl.innerHTML='';
  for(let r=0;r<6;r++){
    const dr=document.createElement('div'); dr.className='brow';
    for(let c=0;c<5;c++){ const t=document.createElement('div'); t.className='tile'; t.id='t'+r+'_'+c; dr.appendChild(t); }
    boardEl.appendChild(dr);
  }
}
function buildKbd(){
  kbdEl.innerHTML='';
  ROWS.forEach(function(rstr,ri){
    const kr=document.createElement('div'); kr.className='krow';
    if(ri===2){ const bk=mkKey('⌫','wide','back'); kr.appendChild(bk); }
    for(let i=0;i<rstr.length;i++) kr.appendChild(mkKey(rstr[i],'',rstr[i]));
    if(ri===2){ const en=mkKey('⏎','wide','enter'); kr.appendChild(en); }
    kbdEl.appendChild(kr);
  });
}
function mkKey(label,cls,act){
  const k=document.createElement('button'); k.className='key '+cls; k.textContent=label; k.dataset.k=act;
  k.addEventListener('pointerdown',function(e){ e.preventDefault(); onKey(act); });
  return k;
}
function newGame(){
  answer=WORDS[(Math.random()*WORDS.length)|0];
  row=0; cur=''; playing=true; lock=false;
  setPaused(false); pauseBtn.classList.remove('hidden');
  $('msg').textContent=''; $('round').textContent='1';
  buildBoard(); buildKbd();
  show(scrGame);
}
function onKey(k){
  if(!playing||paused||lock) return;
  if(k==='enter'){ submit(); return; }
  if(k==='back'){ if(cur.length){ cur=cur.slice(0,-1); paintRow(); sClick(); } return; }
  if(cur.length<5){ cur+=k; paintRow(); sClick(); }
}
function paintRow(){
  for(let c=0;c<5;c++){
    const t=$('t'+row+'_'+c);
    t.textContent=cur[c]||'';
    t.classList.toggle('filled',!!cur[c]);
  }
}
function feedback(guess,ans){
  const res=['absent','absent','absent','absent','absent'];
  const cnt={};
  for(let i=0;i<5;i++) cnt[ans[i]]=(cnt[ans[i]]||0)+1;
  for(let i=0;i<5;i++) if(guess[i]===ans[i]){ res[i]='correct'; cnt[guess[i]]--; }
  for(let i=0;i<5;i++) if(res[i]!=='correct'&&cnt[guess[i]]>0){ res[i]='present'; cnt[guess[i]]--; }
  return res;
}
function submit(){
  if(cur.length<5){ $('msg').textContent='请输入5个字母'; shakeEl(boardEl); sBad(); return; }
  if(!WORDSET[cur]){ $('msg').textContent='“'+cur.toUpperCase()+'” 不在词库中'; shakeEl(boardEl); sBad(); return; }
  $('msg').textContent='';
  const fb=feedback(cur,answer);
  lock=true;
  const keyState={};
  for(let c=0;c<5;c++){
    (function(c){
      setTimeout(function(){
        const t=$('t'+row+'_'+c);
        t.classList.add('reveal');
        setTimeout(function(){ t.classList.remove('reveal'); t.classList.add(fb[c]); },250);
        const ch=cur[c];
        const pr={absent:0,present:1,correct:2};
        if(!keyState[ch]||pr[fb[c]]>pr[keyState[ch]]) keyState[ch]=fb[c];
        tone(fb[c]==='correct'?880:(fb[c]==='present'?660:330),0.09,'sine',0.08);
      },c*280);
    })(c);
  }
  setTimeout(function(){
    const keys=kbdEl.querySelectorAll('.key');
    keys.forEach(function(k){
      const ch=k.dataset.k;
      if(keyState[ch]){
        const pr={absent:0,present:1,correct:2};
        const cur2=k.classList.contains('correct')?'correct':(k.classList.contains('present')?'present':(k.classList.contains('absent')?'absent':null));
        if(!cur2||pr[keyState[ch]]>pr[cur2]){ k.classList.remove('correct','present','absent'); k.classList.add(keyState[ch]); }
      }
    });
    const won=fb.every(function(f){ return f==='correct'; });
    if(won){
      for(let c=0;c<5;c++){ (function(c){ setTimeout(function(){ $('t'+row+'_'+c).classList.add('win'); },c*90); })(c); }
      setTimeout(function(){ endGame(true); },900);
    } else if(row>=5){
      setTimeout(function(){ endGame(false); },600);
    } else {
      row++; cur=''; lock=false;
      $('round').textContent=row+1;
    }
  },5*280+350);
}
function endGame(win){
  playing=false; pauseBtn.classList.add('hidden'); setPaused(false);
  const guesses=row+1;
  const key='g100_wordle_hs', best=hsGet(key);
  let nb=false;
  if(win&&(best===0||guesses<best)){ hsSet(key,guesses); nb=true; }
  $('endEmoji').textContent=win?'🏆':'😅';
  $('endTitle').textContent=win?'猜对了！':'没猜出来';
  $('endStats').innerHTML=win?('用了 <b>'+guesses+'</b> 次'+(nb?'<br>🎉 新纪录！':'')):('答案是 <b style="font-size:26px">'+answer.toUpperCase()+'</b><br>下次好运！');
  $('endHs').textContent=best===0&&!win?'暂无纪录':('🏅 最快：'+(win?Math.min(best||guesses,guesses):best)+' 次猜中');
  show(scrEnd);
  if(win){ sWin(); const r=$('app').getBoundingClientRect(); burst(r.width/2,220,80,['#2ecc71','#d4a017','#9b59b6','#fff']); }
  else sBad();
}
$('startBtn').addEventListener('click',function(){ audio(); sClick(); newGame(); });
$('againBtn').addEventListener('click',function(){ sClick(); newGame(); });
$('backBtn').addEventListener('click',function(){ sClick(); playing=false; pauseBtn.classList.add('hidden'); show(scrStart); refreshStartHs(); });
$('restartBtn').addEventListener('click',function(){ sClick(); newGame(); });
function refreshStartHs(){ const b=hsGet('g100_wordle_hs'); $('startHs').textContent=b>0?('🏅 最快 '+b+' 次猜中'):''; }
refreshStartHs(); fxSize(); fxLoop();
</script>
</body>
</html>
