<style>
/* 游戏自身样式只管布局与玩法元素；颜色/面板/按钮外观交给共用皮肤（sync 时注入）。 */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{display:flex;justify-content:center;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.wrap{width:100%;max-width:480px;height:100%;padding:12px;display:flex;flex-direction:column;align-items:center;gap:8px}
.topbar{width:100%;display:flex;justify-content:space-between;align-items:center}

.topbar .tools .iconbtn{min-width:44px;min-height:44px}

.ctlrow{width:100%;display:flex;gap:8px}

.hint{font-size:13px;text-align:center}

.overlay.hidden{display:none}
.formula{display:inline-block;border:1px dashed currentColor;border-radius:8px;padding:6px 10px;font-size:14px;margin:4px 0}
.warn{color:#ff6b6b;font-weight:700}
</style>

<style>

.game-ui body canvas:is(#cv,#game,#board){background-color:var(--stage)}
.game-ui :is(button.dbtn,button.cbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line)}

<script>

 if(coalUsed>=L.coal){toast('煤用完了！省着点烧');beep(160,.15,'square');return;}

// ---- 物理（每游戏秒）----
function update(dt){

 ctx.stroke();
 ctx.fillStyle='#ffd34d';const mx=12+(dist/L.d)*(W-24);
 ctx.beginPath();ctx.moveTo(mx,py+14);ctx.lineTo(mx-6,py+26);ctx.lineTo(mx+6,py+26);ctx.fill();
 ctx.fillStyle='#9fb6cc';ctx.font='11px sans-serif';ctx.textAlign='center';ctx.fillText('路线剖面（上坡▲/下坡▼）',W/2,py+30);
 // 效率与提示
 ctx.fillStyle='#9fb6cc';ctx.font='12px sans-serif';ctx.textAlign='left';
 const etaNow=coalUsed>0?work/(coalUsed*5*29e6)*100:0;
 ctx.fillText(`η 热效率 ${etaNow.toFixed(1)}% · 总分 ${total}`,12,514);
 if(msgT>0){ctx.fillStyle='#fff';ctx.font='bold 14px sans-serif';ctx.textAlign='center';
  ctx.fillStyle='rgba(0,0,0,.6)';const tw=ctx.measureText(msg).width+24;ctx.fillRect(W/2-tw/2,190,tw,30);
  ctx.fillStyle='#ffe9a8';ctx.fillText(msg,W/2,197);}
 if(state==='menu'){ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(0,0,W,H);}
}
function frame(t){const dt=Math.min(.05,(t-last)/1000);last=t;if(state==='play')update(dt);draw();requestAnimationFrame(frame);}
start();draw();requestAnimationFrame(frame);
</script>
