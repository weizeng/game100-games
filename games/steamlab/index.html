<style>

    g.save();

    var body = g.createRadialGradient(cx - r * .34, cy - r * .36, r * .06, cx, cy, r);

    g.beginPath(); g.arc(cx, cy, r * .84, .18 * Math.PI, .72 * Math.PI); g.stroke();

    g.fillStyle = 'rgba(255,255,255,.82)';
    g.beginPath(); g.ellipse(cx - r * .33, cy - r * .37, r * .2, r * .12, -.62, 0, 7); g.fill();
    g.fillStyle = 'rgba(255,255,255,.45)';

    tile: function (ctx, x, y, w, h, color, r) {

    stage: function (ctx, w, h, top, bottom) {

<body>
<div class="wrap">

    <span class="title">🚂 蒸汽机车</span>

  </div>
  <canvas id="cv"></canvas>

</div>
<div class="overlay" id="startScr"><h1>🚂 蒸汽机车</h1><p id="startText"></p><button class="btn" id="startBtn">开始游戏</button></div>

<div class="overlay hidden" id="overScr"><h1 id="overTitle">本关完成</h1><div class="score" id="finalScore">0</div><p id="overText"></p><button class="btn" id="againBtn">下一关</button></div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const W=360,H=540;                       // 逻辑坐标：所有玩法/命中判定都用它
const cv=$('cv'),ctx=cv.getContext('2d');
const UI=window.GameUI||{pick:(a)=>a,storageGet:k=>localStorage.getItem(k),storageSet:(k,v)=>localStorage.setItem(k,v)};
const FX=UI.fx&&UI.fx.on?UI.fx:null;     // 共用皮肤的画布立体工具；没有时走平面画法
if(FX)FX.hidpi(cv,ctx,W,H);else{cv.width=W;cv.height=H;}
// ---------------- 关卡 ----------------
// segs: f=路段占比, g=坡度%, cv=弯道限速km/h, tun=隧道
const LEVELS=[
 {name:'平原首航',note:'热身：平直赛道，熟悉添煤与放汽',d:2000,t:240,coal:12,segs:[{f:1,g:0}]},
 {name:'缓坡练习',note:'1% 上坡：上坡前先把汽压烧足',d:2500,t:300,coal:16,segs:[{f:1,g:1}]},
 {name:'起伏路段',note:'上坡下坡交替，下坡可关小汽门省煤',d:3000,t:360,coal:20,segs:[{f:.5,g:1.5},{f:.5,g:-1}]},
 {name:'弯道限速',note:'弯道限速 50km/h，超速颠簸扣分',d:3000,t:360,coal:20,segs:[{f:1,g:0,cv:50}]},
 {name:'长上坡',note:'2% 长坡：保持高火力，别让汽压掉下来',d:3500,t:420,coal:26,segs:[{f:1,g:2}]},
 {name:'连续弯坡',note:'弯道+坡道组合，控速又控压',d:4000,t:480,coal:30,segs:[{f:.5,g:1.5,cv:55},{f:.5,g:2,cv:55}]},
 {name:'隧道之夜',note:'隧道里看不见前方坡度，凭经验提前备压',d:4000,t:480,coal:30,segs:[{f:.4,g:2},{f:.3,g:0,tun:1},{f:.3,g:-1.5}]},
 {name:'暴雨行车',note:'雨天牵引力下降 10%，弯道更要减速',d:4500,t:540,coal:34,segs:[{f:1,g:1,cv:45}],rain:true},
 {name:'长大坡道',note:'2.5% 长大坡：冲刺还是匀速？省煤是关键',d:5000,t:600,coal:40,segs:[{f:1,g:2.5}]},
 {name:'西部干线·Boss',note:'终极考验：长坡＋弯道＋隧道，限时最紧',d:6000,t:660,coal:44,segs:[{f:.3,g:2,cv:55},{f:.2,g:0,tun:1},{f:.25,g:-2,cv:50},{f:.25,g:2.5}],boss:true},
];
const TS=10;                 // 时间加速：1 真实秒 = 10 游戏秒
const REDLINE=800;           // 汽压红线 kPa
const MASS=50000;            // 机车质量 50 吨
// ---------------- 存档 ----------------
const HS='g100_steamlab_hs',PG='g100_steamlab_prog',MU='g100_steamlab_mute';
let best=+UI.storageGet(HS)||0;$('best').textContent=best;
let unlocked=Math.min(10,Math.max(1,+UI.storageGet(PG)||1));
// ---------------- 状态 ----------------
let state='menu',lvl=0,total=0,last=0,tGame=0,lastViolT=-99;
let dist,tLeft,p,fire,valve,v,coalUsed,work,viol,overT,curvePen,shakeT,blowT;
let smoke=[],steam=[],msg='',msgT=0,etas=[];
function segAt(d){const L=LEVELS[lvl];let acc=0;for(const s of L.segs){acc+=s.f*L.d;if(d<acc)return s;}return L.segs[L.segs.length-1];}
function show(id,on){$(id).classList.toggle('hidden',!on);}
function toast(t){msg=t;msgT=2.2;}
// ---- 音效：WebAudio 合成，无外部资源；遵守静音开关 ----
let muted=UI.storageGet(MU)==='1',ac=null;$('muteBtn').textContent=muted?'🔇':'🔊';
function beep(f,d,type,vol){if(muted)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(vol||.15,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d);}catch(e){}}
function whistle(){beep(620,.18,'triangle',.2);setTimeout(()=>beep(830,.3,'triangle',.2),180);}
$('muteBtn').addEventListener('click',()=>{muted=!muted;UI.storageSet(MU,muted?'1':'0');$('muteBtn').textContent=muted?'🔇':'🔊';});
// ---- 流程 ----
function startTextFor(i){const L=LEVELS[i];
 return `第 ${i+1}/10 关 · ${L.name}${L.boss?' 👹':''}<br>${L.note}<br>目标：${(L.d/1000).toFixed(1)}km 内到达，限时 ${L.t} 游戏秒，煤限 ${L.coal} 铲<br>计分：准时＋省煤加分，超压泄压/弯道超速扣分<br>公式：Q＝cmΔT（烧水） P＝F·v（功率） η＝有用功÷煤热量`;}
function startLevel(i){lvl=i;const L=LEVELS[i];
 dist=0;tLeft=L.t;p=420;fire=30;valve=0;v=0;coalUsed=0;work=0;viol=0;overT=0;curvePen=0;shakeT=0;blowT=0;smoke=[];steam=[];tGame=0;lastViolT=-99;
 $('coalLeft').textContent=L.coal;$('score').textContent=total;
 show('startScr',false);show('overScr',false);show('pauseOv',false);state='play';last=performance.now();whistle();}
function start(){ // 从解锁关或第1关开始
 $('startText').innerHTML=startTextFor(unlocked-1)+'<br><br>⛏️ 添煤提高火力 → 汽压上升；🔺🔻 调放汽阀开度控牵引力<br>多添煤冲刺 vs 省煤匀速，你来选！';
 $('startBtn').textContent='开始第 '+(unlocked)+' 关';
 show('startScr',true);show('overScr',false);state='menu';}
function pause(){if(state!=='play')return;state='pause';show('pauseOv',true);}
function resume(){if(state!=='pause')return;state='play';last=performance.now();show('pauseOv',false);}
function fail(reason){state='over';$('overTitle').textContent='❌ '+reason;
 $('finalScore').textContent='第 '+(lvl+1)+' 关';
 $('overText').innerHTML='别灰心，调整策略再来一次。<br>💡 提示：上坡前先把汽压烧到 700kPa 以上，下坡关小汽门。';
 $('againBtn').textContent='重开本关';$('againBtn').onclick=()=>startLevel(lvl);
 show('overScr',true);beep(220,.5,'sawtooth');}
function levelDone(){const L=LEVELS[lvl];state='over';
 const eta=coalUsed>0?work/(coalUsed*5*29e6)*100:0;etas[lvl]=eta;
 const sc=Math.max(0,Math.round(1000+tLeft*2+(L.coal-coalUsed)*15-viol*20-curvePen));total+=sc;
 if(total>best){best=total;UI.storageSet(HS,best);}$('best').textContent=best;$('score').textContent=total;
 if(lvl+1>unlocked&&lvl+1<10){unlocked=lvl+2;UI.storageSet(PG,unlocked);}
 const lastOne=lvl===9;
 $('overTitle').textContent=lastOne?'🏁 全部通关！':'✅ 第 '+(lvl+1)+' 关完成';
 $('finalScore').textContent=sc;
 $('overText').innerHTML=
  `用时 ${(L.t-tLeft).toFixed(0)}s · 用煤 ${coalUsed}/${L.coal} 铲<br>`+
  `🔥 平均热效率 <b>${eta.toFixed(1)}%</b>（真实蒸汽机车约 5～10%）<br>`+
  `🌡️ 超压泄压 ${viol} 次 · 弯道超速扣 ${Math.round(curvePen)} 分<br>`+
  `<span class="formula">Q＝cmΔT → 汽压 → P＝F·v → η＝W÷(m煤·29MJ/kg)</span><br>`+
  (lastOne?`<b>实验总结</b>：10 关平均热效率 <b>${(etas.reduce((a,b)=>a+b,0)/10).toFixed(1)}%</b>，总分 ${total}（最佳 ${best}）<br>省煤的关键：下坡/平路关小汽门，上坡提前备压，避免超压泄压浪费蒸汽。`:'');
 $('againBtn').textContent=lastOne?'再来一局':'下一关';
 $('againBtn').onclick=()=>{if(lastOne){total=0;etas=[];startLevel(0);}else startLevel(lvl+1);};
 show('overScr',true);beep(880,.12);setTimeout(()=>beep(1174,.2),140);}
$('startBtn').addEventListener('click',()=>startLevel(unlocked-1));
$('againBtn').addEventListener('click',()=>{});
$('pauseBtn').addEventListener('click',()=>state==='play'?pause():resume());
$('resumeBtn').addEventListener('click',resume);
$('quitBtn').addEventListener('click',()=>{show('pauseOv',false);startLevel(lvl);});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
// ---- 操作 ----
$('coalBtn').addEventListener('click',()=>{if(state!=='play')return;const L=LEVELS[lvl];
 if(coalUsed>=L.coal){toast('煤用完了！省着点烧');beep(160,.15,'square');return;}
 coalUsed++;fire=Math.min(100,fire+22);$('coalLeft').textContent=L.coal-coalUsed;
 toast('⛏️ 添煤＋1 铲（5kg）');beep(150,.12,'triangle',.25);
 if(FX)FX.burst(smoke,120,300,'#5a4632',8);});
function setValve(d){if(state!=='play')return;valve=Math.max(0,Math.min(1,valve+d));beep(500+d*2000,.06,'square',.12);}
$('valveUp').addEventListener('click',()=>setValve(.1));
$('valveDown').addEventListener('click',()=>setValve(-.1));
// ---- 物理（每游戏秒）----
function update(dt){
 const gdt=dt*TS,L=LEVELS[lvl];tGame+=gdt;
 fire=Math.max(0,fire-1.0*gdt);                       // 火力衰减
 const G=fire*0.12, flow=valve*(p/800)*11.8;           // 产汽 / 耗汽 kg/s
 const pPrev=p;
 p+=(G-flow)*22*gdt;                                  // 汽压变化
 if(pPrev<=850&&p>850&&tGame-lastViolT>15){viol++;lastViolT=tGame;toast('⚠️ 超压泄压！浪费蒸汽');beep(300,.3,'square',.2);}
 if(p>850){p-=80*gdt;blowT=.3;                        // 安全阀自动泄压
   if(FX&&Math.random()<.5)FX.burst(steam,150,280,'#cfe8ff',4);}
 p=Math.max(0,Math.min(1000,p));
 if(p>=950){overT+=dt;if(overT>5){fail('锅炉抛锚');return;}}else overT=0;
 const s=segAt(dist),rain=L.rain?0.9:1;
 let F=valve*(p/800)*45*rain;                         // 牵引力 kN
 const R=1.2+MASS*9.81*(s.g/100)/1000+0.055*v*v+(s.cv?0.8:0);  // 阻力：滚动＋坡度＋风阻＋弯道
 v+=(F-R)/50*gdt;v=Math.max(0,Math.min(33,v));         // a=(F-R)/m
 if(s.cv&&v>s.cv/3.6){shakeT+=dt;curvePen+=12*dt;     // 弯道超速
   if(msgT<=0)toast('⚠️ 弯道超速！减速通过');beep(200,.1,'sawtooth',.1);
   if(v>s.cv/3.6*1.35&&shakeT>3){fail('弯道脱轨');return;}}
 else shakeT=Math.max(0,shakeT-dt);
 dist+=v*gdt;tLeft-=gdt;work+=F*1000*v*gdt;
 if(dist>=L.d){levelDone();return;}
 if(tLeft<=0){fail('时间到');return;}
 msgT-=dt;
 // 烟雾粒子
 if(fire>20&&Math.random()<fire/100*.6)smoke.push({x:150+Math.random()*8,y:272,vx:8+Math.random()*10,vy:-28-Math.random()*20,r:4+Math.random()*5,a:.7});
 for(let i=smoke.length-1;i>=0;i--){const q=smoke[i];q.x+=q.vx*dt;q.y+=q.vy*dt;q.r+=6*dt;q.a-=dt*.5;if(q.a<=0)smoke.splice(i,1);}
 for(let i=steam.length-1;i>=0;i--){const q=steam[i];if(q.life<=0)steam.splice(i,1);}
 if(blowT>0)blowT-=dt;
}
function fmtT(s){s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function draw(){
 const L=LEVELS[lvl]||LEVELS[0];
 if(FX)FX.stage(ctx,W,H,'#1c2b52','#070b18');else{ctx.fillStyle='#0a1024';ctx.fillRect(0,0,W,H);}
 const inTun=segAt(dist).tun&&state==='play';
 // 远山（视差）
 ctx.fillStyle='rgba(90,110,160,.5)';
 for(let i=0;i<5;i++){const mx=((i*160-dist*.05)%(W+160)+(W+160))%(W+160)-80;ctx.beginPath();ctx.moveTo(mx-80,300);ctx.lineTo(mx,220+((i*37)%40));ctx.lineTo(mx+80,300);ctx.fill();}
 // 地面与铁轨
 ctx.fillStyle='#2c2418';ctx.fillRect(0,300,W,60);
 const shx=shakeT>0&&v>(segAt(dist).cv||99)/3.6?Math.sin(performance.now()/40)*3:0;
 ctx.save();ctx.translate(shx,0);
 ctx.fillStyle='#4a3b28';for(let x=-20;x<W+20;x+=28)ctx.fillRect(((x-dist*2)%(W+56)+(W+56))%(W+56)-28,318,16,8);
 ctx.fillStyle='#8a8f9a';ctx.fillRect(0,318,W,3);ctx.fillRect(0,330,W,3);
 // 机车
 const tx=120,ty=306;
 if(FX)FX.shadow(ctx,tx,ty+22,64,7);
 const bodyC='#b33a2e';
 if(FX){FX.tile(ctx,tx-58,ty-34,116,30,bodyC,8);}else{ctx.fillStyle=bodyC;ctx.fillRect(tx-58,ty-34,116,30);}
 ctx.fillStyle='#7a241c';ctx.fillRect(tx+28,ty-58,26,26);           // 驾驶室
 ctx.fillStyle='#ffe9a8';ctx.fillRect(tx+33,ty-52,16,12);            // 车窗
 ctx.fillStyle='#333';ctx.fillRect(tx-40,ty-58,14,26);               // 烟囱
 ctx.fillStyle='#5a4632';ctx.fillRect(tx-58,ty-30,30,26);            // 煤仓
 // 车轮
 const wr=(dist*2)%(Math.PI*2);
 for(const wx of[-38,0,38]){ctx.fillStyle='#222';ctx.beginPath();ctx.arc(tx+wx,ty,13,0,7);ctx.fill();
  ctx.strokeStyle='#999';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(tx+wx,ty);ctx.lineTo(tx+wx+Math.cos(wr)*10,ty+Math.sin(wr)*10);ctx.stroke();}
 // 烟雾 / 泄汽
 for(const q of smoke){ctx.globalAlpha=Math.max(0,q.a);ctx.fillStyle='#9aa0ad';ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,7);ctx.fill();}
 ctx.globalAlpha=1;
 if(FX)FX.drawBurst(ctx,steam);
 ctx.restore();
 // 隧道 / 雨
 if(inTun){ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#ffd34d';ctx.font='14px sans-serif';ctx.textAlign='center';ctx.fillText('🚇 隧道中…凭经验控压！',W/2,180);}
 if(L.rain){ctx.strokeStyle='rgba(150,200,255,.6)';ctx.lineWidth=1;const tt=performance.now()/30;for(let i=0;i<30;i++){const rx=(i*53+tt*4)%W,ry=(i*97+tt*9)%H;ctx.beginPath();ctx.moveTo(rx,ry);ctx.lineTo(rx-3,ry+12);ctx.stroke();}}
 // ---- 仪表区 ----
 ctx.textBaseline='top';
 // 汽压表
 const gx=62,gy=88,gr=44;
 ctx.fillStyle='rgba(0,0,0,.45)';ctx.beginPath();ctx.arc(gx,gy,gr+6,0,7);ctx.fill();
 for(let k=0;k<=10;k++){const a=Math.PI*.75+k/10*Math.PI*1.5,val=k*100;
  ctx.strokeStyle=val>=800?'#ff5252':'#9fb6cc';ctx.lineWidth=val>=800?4:2;
  ctx.beginPath();ctx.moveTo(gx+Math.cos(a)*gr,gy+Math.sin(a)*gr);ctx.lineTo(gx+Math.cos(a)*(gr-8),gy+Math.sin(a)*(gr-8));ctx.stroke();}
 const na=Math.PI*.75+Math.min(1000,p)/1000*Math.PI*1.5;
 ctx.strokeStyle=p>=800?'#ff5252':'#ffd34d';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(gx,gy);ctx.lineTo(gx+Math.cos(na)*(gr-12),gy+Math.sin(na)*(gr-12));ctx.stroke();
 ctx.fillStyle='#fff';ctx.font='bold 15px sans-serif';ctx.textAlign='center';ctx.fillText(Math.round(p)+'kPa',gx,gy+16);
 ctx.fillStyle=p>=800?'#ff5252':'#9fb6cc';ctx.font='12px sans-serif';ctx.fillText('汽压',gx,gy-34);
 // 速度
 ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.textAlign='center';
 ctx.fillText(Math.round(v*3.6)+' km/h',W-72,52);
 ctx.fillStyle='#9fb6cc';ctx.font='12px sans-serif';ctx.fillText('速度',W-72,84);
 // 火力 / 汽门条
 function bar(x,y,w,label,val,col){ctx.fillStyle='#9fb6cc';ctx.font='12px sans-serif';ctx.textAlign='left';ctx.fillText(label,x,y-2);
  ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(x,y+14,w,10);
  ctx.fillStyle=col;ctx.fillRect(x,y+14,w*Math.max(0,Math.min(1,val)),10);}
 bar(120,40,110,'🔥火力',fire/100,'#ff9f2e');
 bar(120,72,110,'🚂汽门',valve,'#4fc3f7');
 // 状态行
 const s=segAt(dist);
 ctx.fillStyle='#fff';ctx.font='13px sans-serif';ctx.textAlign='left';
 ctx.fillText(`⏱${fmtT(tLeft)}  🛤${(dist/1000).toFixed(2)}/${(L.d/1000).toFixed(1)}km`,12,120);
 ctx.fillText(`⛰坡度 ${s.g>0?'+':''}${s.g}%${s.cv?' · 弯道限速'+s.cv:''}${L.rain?' · 🌧雨天':''}`,12,140);
 if(p>=800){ctx.fillStyle='#ff5252';ctx.font='bold 14px sans-serif';ctx.fillText('⚠️ 超压泄压中！',W-150,120);}
 // 路线剖面
 const py=452,ph=44;
 ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(8,py-8,W-16,ph+34);
 let ax=12;ctx.strokeStyle='#4fc3f7';ctx.lineWidth=2;ctx.beginPath();
 const prof=[];let acc=0;for(const sg of L.segs){acc+=sg.f*L.d;prof.push({x:12+(acc/L.d)*(W-24),g:sg.g,tun:sg.tun});}
 ctx.moveTo(12,py);
 for(const pt of prof)ctx.lineTo(pt.x,py-pt.g*8);
 ctx.stroke();
 ctx.fillStyle='#ffd34d';const mx=12+(dist/L.d)*(W-24);
 ctx.beginPath();ctx.moveTo(mx,py+14);ctx.lineTo(mx-6,py+26);ctx.lineTo(mx+6,py+26);ctx.fill();
 ctx.fillStyle='#9fb6cc';ctx.font='11px sans-serif';ctx.textAlign='center';ctx.fillText('路线剖面（上坡▲/下坡▼）',W/2,py+30);
 // 效率与提示
 ctx.fillStyle='#9fb6cc';ctx.font='12px sans-serif';ctx.textAlign='left';
 const etaNow=coalUsed>0?work/(coalUsed*5*29e6)*100:0;
 ctx.fillText(`η 热效率 ${etaNow.toFixed(1)}% · 总分 ${total}`,12,514);
 if(msgT>0){ctx.fillStyle='#fff';ctx.font='bold 14px sans-serif';ctx.textAlign='center';
  ctx.fillStyle='rgba(0,0,0,.6)';const tw=ctx.measureText(msg).width+24;ctx.fillRect(W/2-tw/2,190,tw,30);
  ctx.fillStyle='#ffe9a8';ctx.fillText(msg,W/2,197);}
 if(state==='menu'){ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(0,0,W,H);}
}
function frame(t){const dt=Math.min(.05,(t-last)/1000);last=t;if(state==='play')update(dt);draw();requestAnimationFrame(frame);}
start();draw();requestAnimationFrame(frame);
</script>
