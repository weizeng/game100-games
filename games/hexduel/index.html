<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>巫师决斗</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:linear-gradient(165deg,#1a0b2e 0%,#2b1055 45%,#08040f 100%);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;display:flex;justify-content:center;min-height:100vh;touch-action:manipulation;-webkit-user-select:none;user-select:none;overflow-x:hidden}
.wrap{width:100%;max-width:480px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:10px;position:relative;z-index:1}
.topbar{width:100%;display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:9px 12px;font-size:14px}
.topbar .title{font-weight:700;font-size:16px;white-space:nowrap}
.topbar .stat{color:#d9c9f0;font-size:12px}
.topbar .stat b{color:#fff;font-size:14px}
.tbtn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:#fff;font-size:17px;min-width:42px;height:42px;border-radius:11px;cursor:pointer;transition:transform .08s}
.tbtn:active{transform:scale(.9)}
.screen{width:100%;display:none;flex-direction:column;align-items:center;gap:10px}
.screen.on{display:flex}
.card{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:20px;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.card h1{font-size:26px;margin-bottom:8px;background:linear-gradient(90deg,#ce93d8,#f3e5f5);-webkit-background-clip:text;background-clip:text;color:transparent}
.card h2{font-size:22px;margin-bottom:8px}
.card p{color:#e2d5f2;font-size:14px;line-height:1.9;margin-bottom:12px;text-align:left}
.card p b{color:#ce93d8}
.kb{display:flex;flex-direction:column;gap:6px;margin:0 0 12px;padding:10px 12px;background:rgba(206,147,216,.08);border:1px solid rgba(206,147,216,.2);border-radius:12px;font-size:13px;line-height:1.8;text-align:left;color:#d9c9f0}
.bigbtn{background:linear-gradient(135deg,#7b1fa2,#ce93d8);border:none;color:#fff;font-size:18px;font-weight:700;padding:14px 44px;border-radius:999px;cursor:pointer;box-shadow:0 6px 18px rgba(123,31,162,.5);transition:transform .1s;min-height:48px}
.bigbtn:active{transform:scale(.93)}
.ghostbtn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#fff;font-size:14px;padding:10px 22px;border-radius:999px;cursor:pointer;min-height:44px}
.ghostbtn:active{transform:scale(.93)}
.best{color:#ce93d8;font-size:14px;margin-top:8px}
#cvwrap{width:100%;display:flex;justify-content:center}
#cv{border-radius:14px;background:rgba(255,255,255,.03);touch-action:none;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.hint{color:#d9c9f0;font-size:13px;text-align:center;line-height:1.7;min-height:40px}
#btns{display:flex;gap:10px;width:100%;justify-content:center}
.pick{flex:1;max-width:140px;background:rgba(255,255,255,.07);border:2px solid rgba(206,147,216,.35);color:#fff;border-radius:14px;padding:10px 4px;font-size:13px;cursor:pointer;min-height:64px;transition:transform .08s,border-color .08s,opacity .15s;display:flex;flex-direction:column;align-items:center;gap:2px}
.pick .em{font-size:26px}
.pick:active{transform:scale(.93)}
.pick.sel{border-color:#ffd54f;background:rgba(255,213,79,.18)}
.pick:disabled{opacity:.35;cursor:default}
.pick:disabled:active{transform:none}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:40;backdrop-filter:blur(4px)}
.ov.on{display:flex}
.pausecard{background:#241038;border:1px solid rgba(206,147,216,.3);border-radius:18px;padding:28px 32px;text-align:center;display:flex;flex-direction:column;gap:12px;max-width:86vw}
.pausecard h2{font-size:20px}
#toast{position:fixed;top:38%;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.82);border:1px solid rgba(206,147,216,.4);color:#fff;font-size:16px;font-weight:700;padding:12px 26px;border-radius:999px;z-index:70;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;max-width:92vw}
.float{position:fixed;pointer-events:none;z-index:60;font-weight:800;font-size:22px;animation:floatup 1.1s ease-out forwards;text-shadow:0 2px 6px rgba(0,0,0,.6)}
@keyframes floatup{0%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-52px)}}
#shake{position:fixed;inset:0;pointer-events:none;z-index:50}
</style>
</head>
<body>
<div id="toast"></div>
<div id="shake"></div>
<div class="wrap">
  <div class="topbar">
    <span class="title">🪄 巫师决斗</span>
    <span class="stat">回合<b id="round">1</b> · 🔥<b id="streak">0</b></span>
    <span><button class="tbtn" id="sndBtn" aria-label="静音开关">🔊</button><button class="tbtn" id="pauseBtn" aria-label="暂停">⏸</button></span>
  </div>
  <div class="screen on" id="s-start">
    <div class="card">
      <h1>🪄 巫师决斗</h1>
      <div class="kb">
        <div>🔥 <b>火球术</b> → 用 🛡️<b>护盾</b>格挡</div>
        <div>❄️ <b>冰锥术</b> → 用 💨<b>闪避</b>躲开</div>
        <div>⚡ <b>闪电术</b> → 用 🪞<b>反射</b>弹回去</div>
      </div>
      <p>看准敌方巫师🧙‍♂️蓄力的法术，在读招时间内点选<b>克制应对</b>！<br>
      ✅ 选对克制 → 对手掉血，你还能反击<br>
      ❌ 选错或超时 → 你掉血<br>
      🔥 连续选对攒<b>连击</b>，每 3 连击额外爆发伤害<br>
      ⏱️ 读招时间随回合缩短（1.5s → 0.8s）<br>
      双方各 <b>5 点血</b>，先清空对方获胜！</p>
      <button class="bigbtn" id="startBtn">开始决斗</button>
      <div class="best">🏅 最高连胜：<b id="best0">0</b> · ⚡ 最快获胜：<b id="fast0">—</b></div>
    </div>
  </div>
  <div class="screen" id="s-game">
    <div id="cvwrap"><canvas id="cv" width="360" height="430"></canvas></div>
    <div class="hint" id="hint">🧙‍♂️ 对手正在蓄力……看招选克制！</div>
    <div id="btns">
      <button class="pick" id="p0"><span class="em">🛡️</span><span>护盾·挡火球</span></button>
      <button class="pick" id="p1"><span class="em">💨</span><span>闪避·躲冰锥</span></button>
      <button class="pick" id="p2"><span class="em">🪞</span><span>反射·弹闪电</span></button>
    </div>
  </div>
  <div class="screen" id="s-end">
    <div class="card">
      <h2 id="endTitle">🏆 决斗胜利</h2>
      <p id="endDesc" style="text-align:center"></p>
      <div class="best">🏅 最高连胜：<b id="best1">0</b> · ⚡ 最快获胜：<b id="fast1">—</b></div>
      <button class="bigbtn" id="againBtn">再决一场</button>
    </div>
  </div>
</div>
<div class="ov" id="pauseov"><div class="pausecard"><h2>⏸ 中场休息</h2><button class="bigbtn" id="resumeBtn">继续决斗</button><button class="ghostbtn" id="quitBtn">重开一局</button></div></div>
<script>
'use strict';
const $=id=>document.getElementById(id);
/* ===== 音效 ===== */
let AC=null;
let soundOn=localStorage.getItem('g100_mute')!=='1';
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return null;}}if(AC&&AC.state==='suspended'){AC.resume();}return AC;}
function tone(f,d,type,v,when){if(!soundOn)return;const a=ac();if(!a)return;try{const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.value=f;const t=a.currentTime+(when||0);g.gain.setValueAtTime(v||0.12,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.03);}catch(e){}}
function sweep(f0,f1,d,type,v){if(!soundOn)return;const a=ac();if(!a)return;try{const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';const t=a.currentTime;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+d);g.gain.setValueAtTime(v||0.1,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.03);}catch(e){}}
const sClick=()=>tone(640,0.07,'square',0.07);
const sCharge=()=>sweep(140,420,0.5,'sawtooth',0.05);
const sCorrect=()=>{[880,1175,1568].forEach((f,i)=>tone(f,0.1,'sine',0.12,i*0.06));};
const sWrong=()=>{tone(160,0.25,'sawtooth',0.14);tone(110,0.3,'sawtooth',0.12,0.09);};
const sTick=()=>tone(1200,0.05,'square',0.06);
const sWin=()=>{[523,659,784,1047,1319].forEach((f,i)=>tone(f,0.16,'triangle',0.12,i*0.11));};
const sLose=()=>{[392,330,262,196].forEach((f,i)=>tone(f,0.22,'triangle',0.12,i*0.15));};
/* ===== 工具 ===== */
function toast(msg){const t=$('toast');t.textContent=msg;t.style.opacity='1';clearTimeout(t._tm);t._tm=setTimeout(()=>{t.style.opacity='0';},1300);}
function floatTxt(txt,color){const d=document.createElement('div');d.className='float';d.textContent=txt;d.style.color=color||'#ffd54f';d.style.left='50%';d.style.top='30%';document.body.appendChild(d);setTimeout(()=>d.remove(),1150);}
function buzz(ms){try{if(navigator.vibrate)navigator.vibrate(ms);}catch(e){}}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));$(id).classList.add('on');}
function shake(){const s=$('shake');s.style.animation='none';void s.offsetWidth;document.body.style.transform='translate(6px,0)';setTimeout(()=>{document.body.style.transform='translate(-6px,0)';},60);setTimeout(()=>{document.body.style.transform='';},120);}
/* ===== 常量/状态 ===== */
const HSKEY='g100_hexduel_hs',FASTKEY='g100_hexduel_fast';
const SPELLS=[{e:'🔥',name:'火球术',c:0},{e:'❄️',name:'冰锥术',c:1},{e:'⚡',name:'闪电术',c:2}];
const CNAME=['🛡️护盾','💨闪避','🪞反射'];
const COUNTER_TXT=['🛡️ 格挡火球！','💨 闪避冰锥！','🪞 反射闪电！'];
const cv=$('cv'),ctx=cv.getContext('2d');
const W=cv.width,H=cv.height;
const PW={x:88,y:318},EW={x:272,y:112};
let running=false,paused=false,lastT=0;
let state='idle';              // charge|resolve
let stateT=0,round=1,readTime=1.5,spell=0,streak=0,bestStreakRun=0;
let php=5,ehp=5,ticked=false;
let bolt=null,flashP=0,flashE=0,parts=[];
const picks=[$('p0'),$('p1'),$('p2')];
function bestStreak(){return parseInt(localStorage.getItem(HSKEY)||'0',10);}
function fastest(){return parseInt(localStorage.getItem(FASTKEY)||'0',10);}
function fastTxt(){const f=fastest();return f>0?f+' 回合':'—';}
function refreshBest(){$('best0').textContent=bestStreak();$('best1').textContent=bestStreak();$('fast0').textContent=fastTxt();$('fast1').textContent=fastTxt();}
function refreshHud(){$('round').textContent=round;$('streak').textContent=streak;}
function setPicks(en){picks.forEach(b=>{b.disabled=!en;b.classList.remove('sel');});}
function setHint(t){$('hint').innerHTML=t;}
function burst(x,y,colors,n,pw){for(let i=0;i<n;i++)parts.push({x:x,y:y,vx:(Math.random()-0.5)*pw,vy:(Math.random()-0.5)*pw-1,life:1,c:colors[i%colors.length],r:2+Math.random()*3});}
/* ===== 回合 ===== */
function startGame(){
  running=true;paused=false;
  round=1;streak=0;bestStreakRun=0;php=5;ehp=5;parts=[];bolt=null;flashP=0;flashE=0;
  $('pauseov').classList.remove('on');
  showScreen('s-game');refreshHud();refreshBest();
  newRound();sClick();
}
function newRound(){
  spell=Math.floor(Math.random()*3);
  readTime=Math.max(0.8,1.5-0.04*(round-1));
  state='charge';stateT=0;ticked=false;bolt=null;
  setPicks(true);
  refreshHud();
  setHint('🧙‍♂️ 对手蓄力 <b>'+SPELLS[spell].e+' '+SPELLS[spell].name+'</b>！'+readTime.toFixed(1)+' 秒内选克制！');
  sCharge();
}
function pick(c){
  if(!running||paused||state!=='charge')return;
  resolve(c);
}
function resolve(c){
  state='resolve';stateT=0;
  setPicks(false);
  picks[c!==null?c:0].classList.toggle('sel',c!==null);
  const good=c!==null&&SPELLS[spell].c===c;
  if(good){
    ehp--;streak++;bestStreakRun=Math.max(bestStreakRun,streak);
    sCorrect();
    bolt={fx:PW.x,fy:PW.y-30,tx:EW.x,ty:EW.y+10,t:0,e:CNAME[c][0]};
    burst(EW.x,EW.y+20,['#ce93d8','#f3e5f5','#ffd54f','#ffffff'],24,6);
    flashE=0.5;
    let msg=COUNTER_TXT[c]+' 反击！';
    if(streak%3===0&&ehp>0){
      ehp--;msg='🔥 '+streak+' 连击爆发！双倍伤害！';
      burst(EW.x,EW.y+20,['#ff5252','#ffd54f','#ffffff'],18,7);
    }
    floatTxt(msg,'#ce93d8');
    setHint('✅ <b>'+msg+'</b>对手剩余 ❤️'+Math.max(0,ehp));
  }else{
    php--;streak=0;
    if(c===null){sTick();}else{sWrong();}
    buzz(140);shake();flashP=0.5;
    bolt={fx:EW.x,fy:EW.y+30,tx:PW.x,ty:PW.y-20,t:0,e:SPELLS[spell].e};
    burst(PW.x,PW.y-20,['#ff5252','#ff8a80','#ffffff'],20,6);
    const why=c===null?'⏱️ 超时没出招！':'❌ 选错了！'+SPELLS[spell].name+'要用'+CNAME[SPELLS[spell].c]+'应对';
    floatTxt('💔 -1','#ff8a80');
    setHint(why+'，你剩余 ❤️'+Math.max(0,php));
  }
  refreshHud();
}
function endGame(win){
  running=false;paused=false;state='idle';
  $('pauseov').classList.remove('on');
  const nb=bestStreakRun>bestStreak();
  if(nb)localStorage.setItem(HSKEY,String(bestStreakRun));
  let fastNew=false;
  if(win){const f=fastest();if(f===0||round<f){localStorage.setItem(FASTKEY,String(round));fastNew=true;}}
  refreshBest();
  $('endTitle').textContent=win?'🏆 决斗胜利！':'💀 决斗落败';
  $('endDesc').innerHTML=(win?'用了 <b>'+round+'</b> 回合击败对手！':'坚持了 <b>'+round+'</b> 回合……')
    +'<br>本局最高连击 🔥<b>'+bestStreakRun+'</b>'
    +(nb?'<br>🎉 <b style="color:#ffd54f">新纪录：最高连胜 '+bestStreakRun+'！</b>':'')
    +(fastNew?'<br>⚡ <b style="color:#ffd54f">新纪录：最快获胜 '+round+' 回合！</b>':'');
  showScreen('s-end');
  if(win)sWin();else sLose();
}
/* ===== 绘制 ===== */
function hpBar(x,y,hp,max,label,flip){
  ctx.font='13px sans-serif';ctx.textAlign=flip?'right':'left';ctx.fillStyle='#cfc3e8';
  ctx.fillText(label,flip?x+74:x-74,y-14);
  for(let i=0;i<max;i++){
    const bx=flip?x+64-i*15:x-64+i*15;
    ctx.fillStyle=i<hp?'#ff5252':'rgba(255,255,255,.12)';
    ctx.strokeStyle='rgba(255,255,255,.25)';ctx.lineWidth=1;
    ctx.beginPath();ctx.arc(bx,y-10,6.5,0,7);ctx.fill();ctx.stroke();
  }
}
function draw(dt){
  ctx.clearRect(0,0,W,H);
  // 决斗台
  ctx.strokeStyle='rgba(206,147,216,.25)';ctx.lineWidth=2;
  ctx.beginPath();ctx.ellipse(W/2,H/2,140,150,0,0,7);ctx.stroke();
  ctx.strokeStyle='rgba(206,147,216,.12)';
  ctx.beginPath();ctx.ellipse(W/2,H/2,100,110,0,0,7);ctx.stroke();
  // 血条
  hpBar(PW.x,PW.y-52,php,5,'🧙 你',false);
  hpBar(EW.x,EW.y+52,ehp,5,'🧙‍♂️ 对手',true);
  // 法术飞行
  if(bolt){
    bolt.t+=dt*2.6;
    const p=Math.min(1,bolt.t);
    const e=p<0.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
    const bx=bolt.fx+(bolt.tx-bolt.fx)*e,by=bolt.fy+(bolt.ty-bolt.fy)*e-40*Math.sin(p*Math.PI);
    ctx.save();ctx.shadowColor='#ce93d8';ctx.shadowBlur=18;
    ctx.font='34px serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(bolt.e,bx,by);ctx.restore();
  }
  // 玩家巫师
  if(flashP>0){ctx.save();ctx.shadowColor='#ff5252';ctx.shadowBlur=24;flashP-=dt;}
  ctx.font='56px serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('🧙',PW.x,PW.y);
  if(flashP>0)ctx.restore();
  // 敌方巫师
  if(flashE>0){ctx.save();ctx.shadowColor='#ffd54f';ctx.shadowBlur=24;flashE-=dt;}
  const eb=state==='charge'?Math.sin(performance.now()/140)*4:0;
  ctx.fillText('🧙‍♂️',EW.x,EW.y+eb);
  if(flashE>0)ctx.restore();
  // 蓄力法术
  if(state==='charge'&&running){
    const cx=EW.x,cy=EW.y-66;
    const pr=stateT/readTime;
    const glow=0.5+0.5*Math.sin(performance.now()/120);
    ctx.save();ctx.shadowColor='#ffd54f';ctx.shadowBlur=14+14*glow;
    const sc=1+0.18*Math.sin(performance.now()/160);
    ctx.font=Math.round(52*sc)+'px serif';
    ctx.fillText(SPELLS[spell].e,cx,cy);ctx.restore();
    // 读招条
    const bw=150,bx=cx-bw/2,by=cy+44;
    ctx.fillStyle='rgba(255,255,255,.12)';ctx.fillRect(bx,by,bw,10);
    const w=bw*(1-Math.min(1,pr));
    ctx.fillStyle=pr>0.75?'#ff5252':pr>0.45?'#ffb300':'#ce93d8';
    ctx.fillRect(bx,by,w,10);
    ctx.strokeStyle='rgba(255,255,255,.3)';ctx.lineWidth=1;ctx.strokeRect(bx,by,bw,10);
    ctx.fillStyle='#fff';ctx.font='12px sans-serif';ctx.textAlign='center';
    ctx.fillText(Math.max(0,readTime-stateT).toFixed(1)+'s',cx,by+26);
    // 对应克制提示
    ctx.fillStyle='#d9c9f0';ctx.font='13px sans-serif';
    ctx.fillText('克制：'+CNAME[SPELLS[spell].c],cx,by+44);
  }
  if(state==='resolve'){
    ctx.fillStyle='#d9c9f0';ctx.font='13px sans-serif';ctx.textAlign='center';
    ctx.fillText('……',W/2,H/2);
  }
  // 粒子
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.08;p.life-=dt*1.1;
    if(p.life<=0){parts.splice(i,1);continue;}
    ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();ctx.globalAlpha=1;
  }
}
/* ===== 主循环 ===== */
let lastTT=0;
function loop(tms){
  requestAnimationFrame(loop);
  const dt=Math.min(0.05,(tms-lastT)/1000||0);lastT=tms;
  if(!running||paused){if(!running)return;draw(0);return;}
  if(state==='charge'){
    stateT+=dt;
    const left=readTime-stateT;
    if(left<=0.3&&!ticked){ticked=true;sTick();}
    if(left<=0)resolve(null);
  }else if(state==='resolve'){
    stateT+=dt;
    if(stateT>=1.0){
      bolt=null;
      if(ehp<=0){endGame(true);return;}
      if(php<=0){endGame(false);return;}
      round++;newRound();
    }
  }
  draw(dt);
}
requestAnimationFrame(loop);
/* ===== 输入 ===== */
picks[0].addEventListener('click',()=>pick(0));
picks[1].addEventListener('click',()=>pick(1));
picks[2].addEventListener('click',()=>pick(2));
window.addEventListener('keydown',e=>{
  if(e.key==='1')pick(0);if(e.key==='2')pick(1);if(e.key==='3')pick(2);
});
/* ===== 暂停/静音 ===== */
$('pauseBtn').addEventListener('click',()=>{
  if(!running||paused)return;
  paused=true;$('pauseov').classList.add('on');sClick();
});
$('resumeBtn').addEventListener('click',()=>{paused=false;$('pauseov').classList.remove('on');sClick();});
$('quitBtn').addEventListener('click',()=>{sClick();running=false;paused=false;state='idle';$('pauseov').classList.remove('on');showScreen('s-start');refreshBest();});
function refreshSnd(){$('sndBtn').textContent=soundOn?'🔊':'🔇';}
$('sndBtn').addEventListener('click',()=>{soundOn=!soundOn;localStorage.setItem('g100_mute',soundOn?'0':'1');refreshSnd();if(soundOn)sClick();});
$('startBtn').addEventListener('click',startGame);
$('againBtn').addEventListener('click',startGame);
refreshSnd();refreshBest();
</script>
</body>
</html>
