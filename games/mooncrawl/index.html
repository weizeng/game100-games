<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>月球车</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0b1020;overflow:hidden;font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;color:#e6ecff;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#wrap{max-width:480px;height:100dvh;margin:0 auto;display:flex;flex-direction:column;background:#0b1020}
#stage{position:relative;flex:1;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hbtn{position:absolute;top:10px;width:44px;height:44px;border-radius:12px;background:rgba(20,28,55,.85);border:1px solid #2c3a63;color:#fff;font-size:22px;z-index:5}
#btnPause{right:10px}
#btnMute{right:62px}
#ctrl{display:flex;gap:10px;padding:10px 12px 14px;background:#0b1020}
#ctrl button{flex:1;height:76px;font-size:24px;font-weight:700;border-radius:16px;border:1px solid #2c3a63;color:#fff;touch-action:none}
#btnGas{background:#14532d;border-color:#35d07f}
#btnGas:active{background:#1d7a44}
#btnBrake{background:#5c1a1a;border-color:#ff5a3c}
#btnBrake:active{background:#7d2424}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(5,8,20,.88);z-index:10;text-align:center;padding:24px}
.ov h1{font-size:44px;margin-bottom:8px}
.ov h2{font-size:30px;margin-bottom:10px}
.ov p{font-size:15px;line-height:1.7;color:#aebadd;margin:6px 0;max-width:380px}
.ov .big{font-size:20px;color:#fff}
.bigbtn{margin-top:18px;min-width:200px;min-height:56px;font-size:22px;border-radius:16px;border:none;background:linear-gradient(135deg,#4a6cf7,#7a4af7);color:#fff;font-weight:700}
.bigbtn:active{transform:scale(.96)}
.hidden{display:none!important}
.tag{font-size:13px;color:#8fa0c8}
</style>
<!-- GAME UI BEGIN -->
<style>
:root{--page:#10182f;--surface:#1a2742;--soft:#243754;--ink:#eff7ff;--muted:#adc3da;--accent:#8dded6;--on-accent:#102b36;--line:#38506b;--stage:#111e36}
/* Shared presentation only; mechanics and state remain inside each standalone game. */
html.game-ui{background:var(--page);color:var(--ink);color-scheme:light;font-family:"Bahnschrift","Microsoft YaHei UI","PingFang SC",sans-serif}
html.game-ui[data-theme="space"],html.game-ui[data-theme="arcade"]{color-scheme:dark}
.game-ui body{background:var(--page);color:var(--ink);font-family:inherit;overscroll-behavior:none}
.game-ui body>.wrap{padding:20px 16px max(20px,env(safe-area-inset-bottom));gap:14px;max-width:500px}
.game-ui #app{background:var(--page);color:var(--ink)}
.game-ui :is(.topbar,#topbar){gap:8px;flex-wrap:wrap;min-height:58px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:10px 12px;box-shadow:0 3px 0 var(--soft);font-size:13px}
.game-ui :is(.title,.tb-title,.tb-title,#topbar .t,.topbar .t){color:var(--ink);font-size:16px;font-weight:750;letter-spacing:0}
.game-ui :is(.topbar,.hud,#hud,#topbar) :is(b,.v){color:var(--accent);font-variant-numeric:tabular-nums}
.game-ui :is(.stat,.topbar .s,.topbar .stat,.scorebar,.stats,.tip,.hint,.hintline,.hsline,.best,.hiscore){color:var(--muted);line-height:1.7}
.game-ui :is(.hint,.hintline,.tip){font-size:12px;max-width:40em;text-wrap:pretty}
.game-ui .scorebar{padding:6px 10px;gap:8px;flex-wrap:wrap}
.game-ui :is(.iconbtn,.iconBtn,.icobtn,.ibtn,.tbtn,.hbtn,.ib,.iconBtn,.pause){min-width:44px;min-height:44px;flex-shrink:0;border-radius:12px;background:var(--soft);color:var(--ink);border:1px solid var(--line);box-shadow:none;font-size:17px}
.game-ui button{font-family:inherit;cursor:pointer;touch-action:manipulation}
.game-ui button:focus-visible,.game-ui [tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.game-ui :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn){background:var(--accent);color:var(--on-accent);border:1px solid transparent;border-radius:13px;min-height:50px;padding:13px 28px;font-size:16px;font-weight:750;letter-spacing:0;box-shadow:0 4px 0 var(--line);text-shadow:none;max-width:100%}
.game-ui :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn):active{box-shadow:none;transform:translateY(2px)}
.game-ui :is(.ghost,.ghostbtn,.btn2,.abtn,.toolbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line);box-shadow:none;border-radius:12px;min-height:44px}
.game-ui :is(.rowbtns,.btnrow,.ctlrow){gap:10px;flex-wrap:wrap;justify-content:center}
.game-ui :is(.pill,.hudbox,.hud .p){background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:none;font-variant-numeric:tabular-nums}
.game-ui :is(.dbtn,.cbtn,.gbtn,.holdbtn,.firebtn,.bombbtn,.jumpbtn,.pumpbtn,.nbtn){border-radius:12px;box-shadow:0 3px 0 var(--line);min-height:44px}
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv,.screen):has(>.ui-panel){padding:20px;overflow-y:auto;overscroll-behavior:contain}
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv):has(>.ui-panel){background:var(--page);backdrop-filter:none;justify-content:safe center;align-items:center}
.game-ui .ui-panel{width:min(100%,380px);max-height:100%;overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:18px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:24px;padding:30px 24px;box-shadow:0 8px 0 var(--soft),0 20px 48px #15253618;text-align:center;margin:auto}
.game-ui .ui-panel :is(.card,.panel,.pausecard,.ovcard){display:contents}
.game-ui .ui-panel :is(h1,h2,.gamename,.gametitle){font-size:30px;line-height:1.25;font-weight:800;color:var(--ink);background:none;-webkit-text-fill-color:currentColor;text-shadow:none;letter-spacing:-.6px;margin:0}
.game-ui .ui-panel :is(p,.howto,.sub,.rule){font-size:14px;line-height:1.85;color:var(--muted);background:none;border:0;box-shadow:none;padding:0;margin:0;max-width:32em;text-align:left;white-space:normal}
.game-ui .ui-panel :is(.bigemoji,.bigemoji,.ic,.big):not(.bigscore){animation:none;filter:none;text-shadow:none}
.game-ui .ui-emblem{width:90px;height:90px;display:grid;place-items:center;border:1px solid var(--line);border-radius:28px;background:var(--soft);font-size:48px;line-height:1;flex-shrink:0;position:relative}
.game-ui[data-theme="wood"] .ui-emblem{border-radius:50%;box-shadow:inset 0 0 0 5px var(--surface),inset 0 0 0 6px var(--line)}
.game-ui[data-theme="wood"] .ui-panel h1{font-family:"STKaiti","KaiTi","Microsoft YaHei",serif;letter-spacing:2px}
.game-ui[data-theme="ice"] .ui-emblem{border-radius:26px 8px 26px 8px}
.game-ui[data-theme="space"] .ui-emblem{background:radial-gradient(circle at center,var(--soft) 42%,transparent 43%),var(--surface);border-radius:50%;outline:1px solid var(--line);outline-offset:7px;margin:7px}
.game-ui[data-theme="kitchen"] .ui-emblem{border-radius:22px;border-bottom:5px solid var(--line)}
.game-ui .ui-panel :is(.score,.bigscore,.bigScore,.scorebig){color:var(--accent);font-size:48px;font-weight:800;font-variant-numeric:tabular-nums}
.game-ui .ui-panel :is(.best,.hsline,.hiscore,.endstats,.endstats b){color:var(--muted);font-size:13px;line-height:1.8}
.game-ui .ui-mode{display:grid;grid-template-columns:1fr 1fr;gap:5px;background:var(--soft);padding:5px;border:1px solid var(--line);border-radius:14px;width:100%}
.game-ui .ui-mode button{min-height:44px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-size:14px;font-weight:700;box-shadow:none}
.game-ui .ui-mode button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 2px 5px #1525361a}
.game-ui .ui-panel .ui-mode-note{font-size:12px;line-height:1.6;text-align:center;color:var(--muted)}
.game-ui .ui-mode-status{display:block;padding:5px 10px;color:var(--accent);font-size:11px;font-weight:700;line-height:1.5;text-align:center;border:1px solid var(--line);border-radius:8px;background:var(--surface);margin:4px auto;max-width:100%;pointer-events:none}
.game-ui body>.wrap>canvas:not(#fx){background-color:var(--stage);box-shadow:0 0 0 1px var(--line),0 6px 0 var(--soft);border-radius:18px;flex-shrink:0}
.game-ui .screen>canvas.game{box-shadow:0 0 0 1px var(--line),0 6px 0 var(--soft)}
.game-ui #hud{gap:6px;background:var(--surface);color:var(--ink)}
.game-ui #hud :is(.left,.t,.s,.grp,.pill){color:var(--ink)}
.game-ui #hud .pill{background:var(--surface);border-color:var(--line)}
.game-ui body canvas:is(#cv,#game,#board){background-color:var(--stage)}
.game-ui :is(button.dbtn,button.cbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.game-ui :is(button.lvl,button.lvlbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line);border-radius:12px;min-height:54px}
.game-ui :is(button.lvl,button.lvlbtn) :is(.nc,.sz,small){color:var(--muted)}
.game-ui .ui-panel button.lvl{margin:0;min-width:44px;box-shadow:none;padding:8px}
.game-ui #hud :is(.left,.right,.hudl,.hbtns){gap:5px;flex-wrap:wrap}
.game-ui #hud :is(.left,.hudl){min-width:0;flex-shrink:1}
.game-ui #hud :is(.pill,.left){font-size:12px}
.game-ui button:disabled{cursor:default;opacity:.45;box-shadow:none}
.game-ui .ui-panel .ui-assist-note{color:var(--accent);font-weight:700}
@media(min-width:700px){.game-ui body>.wrap{padding-top:32px}.game-ui .ui-panel{padding:36px 30px}}
@media(max-width:360px){.game-ui body>.wrap{padding:10px;gap:10px}.game-ui .ui-panel{padding:22px 18px;gap:13px}.game-ui .ui-panel h1{font-size:26px}.game-ui .ui-emblem{width:70px;height:70px;font-size:38px}.game-ui :is(.topbar,#topbar){gap:5px;padding:8px}.game-ui :is(.iconbtn,.icobtn,.ibtn,.tbtn,.ib){min-width:40px;min-height:44px}}
@media(max-height:650px){.game-ui .ui-panel{padding:18px;gap:12px}.game-ui .ui-emblem{width:60px;height:60px;font-size:32px}.game-ui .ui-panel h1{font-size:25px}.game-ui .ui-panel :is(p,.howto,.sub,.rule){font-size:13px}}
@media(prefers-reduced-motion:reduce){.game-ui *, .game-ui *::before,.game-ui *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}


</style>
<script>
// Installed before the original game script; embedded so downloaded ZIPs remain offline capable.
(function () {
  'use strict';
  var config = {"id":"mooncrawl","name":"月球车","theme":"space","icon":"🚗","challenge":"每段赛道限时缩为 75 秒，收集样本还要稳住车身"};
  var mode = 'classic';
  try { mode = sessionStorage.getItem('game100-mode-' + config.id) || mode; } catch (_) {}
  var expert = mode === 'expert';
  var used = { hint: 0, undo: 0 };
  var limits = { hint: 1, undo: 3 };
  function storageKey(key) { return expert && !/sound|mute/i.test(key) ? 'expert:' + key : key; }
  window.GameUI = {
    expert: expert,
    pick: function (classic, advanced) { return expert ? advanced : classic; },
    storageGet: function (key) { return localStorage.getItem(storageKey(key)); },
    storageSet: function (key, value) { localStorage.setItem(storageKey(key), value); },
    storageRemove: function (key) { localStorage.removeItem(storageKey(key)); }
  };
  var root = document.documentElement;
  root.classList.add('game-ui');
  root.dataset.theme = config.theme;
  root.dataset.game = config.id;
  root.dataset.mode = mode;
  var gesture = new WeakMap();
  function labelButtons(scope) {
    scope.querySelectorAll('button').forEach(function (button) {
      if (button.getAttribute('aria-label')) return;
      var id = button.id.toLowerCase(), text = button.textContent.trim();
      var name = /mute|sound|snd/.test(id) ? '切换音效' : /pause/.test(id) ? '暂停游戏' : /hint/.test(id) && !/close|ok/.test(id) ? '查看提示' : '';
      if (!name && /^[⏸🔊🔇💡Ⅱ]+$/u.test(text)) name = { '⏸': '暂停游戏', '🔊': '切换音效', '🔇': '切换音效', '💡': '查看提示' }[text];
      if (name) button.setAttribute('aria-label', name);
    });
  }
  function decorate(container) {
    if (container.querySelector(':scope > .ui-panel') || !container.querySelector('h1,h2,.gamename')) return;
    if (container.matches('.screen') && container.querySelector('canvas:not(#fx)')) return;
    var panel = document.createElement('div');
    panel.className = 'ui-panel';
    while (container.firstChild) panel.appendChild(container.firstChild);
    container.appendChild(panel);
    var heading = panel.querySelector('h1,h2,.gamename');
    var start = /start|menu|ready/i.test(container.id) || !!panel.querySelector('#startBtn,#btnStart,.startbtn');
    if (start) {
      var headings = panel.querySelectorAll('h1,h2,.gamename');
      if (headings.length > 1 && !/[A-Za-z0-9\u4e00-\u9fff]/.test(heading.textContent)) { heading.remove(); heading = headings[1]; }
      var oldIcon = panel.querySelector('.bigemoji,.ic');
      if (oldIcon) oldIcon.remove();
      var emblem = document.createElement('div');
      emblem.className = 'ui-emblem'; emblem.textContent = config.icon; emblem.setAttribute('aria-hidden', 'true');
      panel.insertBefore(emblem, panel.firstChild);
      heading.textContent = config.name;
      var switcher = document.createElement('div'); switcher.className = 'ui-mode'; switcher.setAttribute('role', 'group'); switcher.setAttribute('aria-label', '选择玩法模式');
      [['classic','经典模式'],['expert','进阶挑战']].forEach(function (item) {
        var b = document.createElement('button'); b.type = 'button'; b.textContent = item[1]; b.dataset.mode = item[0]; b.setAttribute('aria-pressed', String(mode === item[0]));
        b.addEventListener('click', function () {
          if (mode === item[0]) return;
          try { sessionStorage.setItem('game100-mode-' + config.id, item[0]); location.reload(); }
          catch (_) { b.textContent = '浏览器未允许保存模式'; }
        });
        switcher.appendChild(b);
      });
      var primary = panel.querySelector('#startBtn,#btnStart,.startbtn,button');
      var anchor = primary;
      while (anchor && anchor.parentNode !== panel && !anchor.parentNode.matches('.card,.panel,.pausecard,.ovcard')) anchor = anchor.parentNode;
      var target = anchor ? anchor.parentNode : panel;
      target.insertBefore(switcher, anchor || null);
      var note = document.createElement('p'); note.className = 'ui-mode-note';
      note.textContent = expert ? config.challenge + '。进阶纪录单独保存。' : '按原规则轻松开局，也可切换进阶挑战。';
      target.insertBefore(note, anchor || null);
    }
    labelButtons(panel);
  }
  function notify(text) {
    var el = document.getElementById('ui-assist-toast');
    if (!el) { el = document.createElement('div'); el.id = 'ui-assist-toast'; el.className = 'ui-mode-status'; el.setAttribute('role', 'status'); el.style.cssText = 'position:fixed;bottom:18px;left:16px;right:16px;z-index:200;padding:14px'; document.body.appendChild(el); }
    el.textContent = text; el.hidden = false;
    clearTimeout(notify.timer); notify.timer = setTimeout(function () { el.hidden = true; }, 2000);
  }
  function assistEvent(event) {
    if (!expert) return;
    var b = event.target.closest('button'); if (!b || b.closest('.ui-mode')) return;
    var kind = /^(hintBtn|hintTopBtn|btnHint)$/i.test(b.id) ? 'hint' : /^(undoBtn|undoTopBtn|btnUndo)$/i.test(b.id) || /悔一步|撤销/.test(b.textContent) ? 'undo' : '';
    if (!kind) return;
    var prev = gesture.get(b), blocked;
    if (event.type === 'click' && prev && performance.now() - prev.at < 1000) blocked = prev.blocked;
    else { blocked = used[kind] >= limits[kind]; if (!blocked) used[kind]++; gesture.set(b, { at: performance.now(), blocked: blocked }); }
    if (blocked) { event.preventDefault(); event.stopImmediatePropagation(); notify(kind === 'hint' ? '本次挑战的 1 次提示已用完' : '本次挑战的 3 次撤销已用完'); }
  }
  document.addEventListener('pointerdown', assistEvent, true);
  document.addEventListener('click', assistEvent, true);
  document.addEventListener('click', function (event) {
    var b = event.target.closest('button');
    if (b && /^(startBtn|btnStart|restartBtn|againBtn|retryBtn|btnAgain|btnRestart|playAgain)$/i.test(b.id)) used = { hint: 0, undo: 0 };
  }, true);
  document.addEventListener('DOMContentLoaded', function () {
    var selector = '.overlay,.ov,#ov,#overlay,#pauseOv,.screen';
    document.querySelectorAll(selector).forEach(function (container) {
      decorate(container);
      // Only dynamic overlay children are observed; animated scores never trigger this work.
      new MutationObserver(function () { decorate(container); }).observe(container, { childList: true });
    });
    labelButtons(document);
  });
}());

</script>
<!-- GAME UI END -->
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="cv" width="480" height="720"></canvas>
    <button class="hbtn" id="btnMute">🔊</button>
    <button class="hbtn" id="btnPause">⏸</button>
    <div class="ov" id="ovStart">
      <h1>🚗</h1>
      <h2>月球车</h2>
      <p>开着月球车翻山越岭！🟢油门加速，🔴刹车/倒车。<br>
      沿途收集 5 颗 💎 样本（+100分），冲过终点 🏁。<br>
      每条赛道限时 100 秒，落地倾角超过 65° 会翻车！<br>
      共 3 条赛道，坡度一条比一条陡，分数累加。<br>
      计分：样本×100 + 剩余时间×5 + 距离÷10。</p>
      <button class="bigbtn" id="btnStart">开始游戏</button>
      <p class="tag">最高分 <span id="startBest">0</span></p>
    </div>
    <div class="ov hidden" id="ovPause">
      <h2>⏸ 已暂停</h2>
      <button class="bigbtn" id="btnResume">继续</button>
    </div>
    <div class="ov hidden" id="ovOver">
      <h2 id="overTitle">🏁 完成</h2>
      <p class="big" id="overScore">总分 0</p>
      <p class="tag" id="overDetail"></p>
      <p class="tag" id="overBest">最高分 0</p>
      <button class="bigbtn" id="btnRetry">再来一局</button>
    </div>
  </div>
  <div id="ctrl">
    <button id="btnGas">🟢 油门</button>
    <button id="btnBrake">🔴 刹车</button>
  </div>
</div>
<script>
/* GAMEPLAY UPGRADE */'use strict';
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var W=480,H=720,TRACK_LEN=2800,FINISH_X=2750,TIME_LIMIT=GameUI.pick(100,75);
var A1=[90,120,140],A2=[40,55,60];
function h(x,tr){return 520+A1[tr]*Math.sin(x*0.004)+A2[tr]*Math.sin(x*0.011+2);}
function slope(x,tr){return (h(x+2,tr)-h(x-2,tr))/4;}
var state='start';
var track=0,totalScore=0,gemsGot=0,timeLeft=TIME_LIMIT,car=null,gems=[];
var parts=[],floats=[],shakeT=0,msg='',msgT=0,msgMax=1;
var ctl={gas:false,brake:false};
var best=parseInt(GameUI.storageGet('g100_mooncrawl_hs')||'0',10)||0;
var muted=GameUI.storageGet('g100_mute')==='1';
var stars=[];
for(var i=0;i<80;i++)stars.push({x:Math.random()*W,y:Math.random()*H*0.6,r:Math.random()*1.6+0.4,tw:Math.random()*6.28});

function $(id){return document.getElementById(id);}
function normAng(a){a=a%360;if(a>180)a-=360;if(a<-180)a+=360;return a;}
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function buzz(ms){if(navigator.vibrate){try{navigator.vibrate(ms);}catch(e){}}}

var AC=null;
function ac(){if(!AC){var C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AC=new C();}if(AC.state==='suspended')AC.resume();return AC;}
function tone(f,d,type,g,slide){if(muted)return;var c=ac();if(!c)return;var o=c.createOscillator(),v=c.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,c.currentTime);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,slide),c.currentTime+d);v.gain.setValueAtTime(g||0.14,c.currentTime);v.gain.exponentialRampToValueAtTime(0.001,c.currentTime+d);o.connect(v);v.connect(c.destination);o.start();o.stop(c.currentTime+d+0.02);}
function noiseBurst(d,g){if(muted)return;var c=ac();if(!c)return;var n=Math.floor(c.sampleRate*d),buf=c.createBuffer(1,n,c.sampleRate),ch=buf.getChannelData(0);for(var i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);var s=c.createBufferSource(),v=c.createGain();s.buffer=buf;v.gain.value=g||0.25;s.connect(v);v.connect(c.destination);s.start();}
function sfxClick(){tone(660,0.08,'square',0.08);}
function sfxGem(){tone(880,0.1,'sine',0.15);setTimeout(function(){tone(1320,0.16,'sine',0.15);},90);}
function sfxCrash(){noiseBurst(0.5,0.3);tone(140,0.6,'sawtooth',0.2,35);}
function sfxWin(){var n=[523,659,784,1047];for(var i=0;i<n.length;i++)(function(f,k){setTimeout(function(){tone(f,0.18,'triangle',0.16);},k*130);})(n[i],i);}
var engOsc=null,engGain=null;
function engine(on,vx){
  if(on&&!muted){
    var c=ac();if(!c)return;
    if(!engOsc){engOsc=c.createOscillator();engGain=c.createGain();engOsc.type='sawtooth';engGain.gain.value=0.045;engOsc.connect(engGain);engGain.connect(c.destination);engOsc.start();}
    engOsc.frequency.value=55+Math.abs(vx)*0.55;
  }else if(engOsc){try{engOsc.stop();}catch(e){}try{engOsc.disconnect();}catch(e2){}engOsc=null;engGain=null;}
}

function startTrack(tr){
  track=tr;gemsGot=0;timeLeft=TIME_LIMIT;
  parts=[];floats=[];
  car={x:40,vx:0,vy:0,y:h(40,tr),tilt:0,air:false,spin:0,wheel:0};
  gems=[];
  var gx=[350,800,1250,1750,2250];
  for(var i=0;i<gx.length;i++)gems.push({x:gx[i],y:h(gx[i],tr)-36,got:false,ph:Math.random()*6.28});
  engine(false,0);
  showMsg('第 '+(tr+1)+' / 3 条赛道',1.8);
}
function newGame(){
  track=0;totalScore=0;
  startTrack(0);
}
function showMsg(t,d){msg=t;msgT=d;msgMax=d;}
function trackScore(){
  return gemsGot*100+Math.max(0,Math.ceil(timeLeft))*5+Math.floor(car.x/10);
}
function finishTrack(){
  var sc=trackScore();
  totalScore+=sc;
  floats.push({x:car.x,y:car.y-60,txt:'+'+sc,t:1.6});
  sfxWin();buzz(50);
  if(track>=2){endRun(true,'🏆 三条赛道全部完成！');}
  else{startTrack(track+1);}
}
function failRun(reason){
  engine(false,0);
  sfxCrash();buzz(100);shakeT=0.5;
  for(var i=0;i<24;i++){
    var a=Math.random()*6.28,sp=60+Math.random()*200;
    parts.push({x:car.x,y:car.y-14,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-60,r:2+Math.random()*3,t:0.8,c:['#ff9a3c','#ff5a3c','#8a8f9e'][i%3]});
  }
  endRun(false,reason);
}
function endRun(win,title){
  state='over';engine(false,0);
  if(totalScore>best){best=totalScore;GameUI.storageSet('g100_mooncrawl_hs',String(best));}
  $('overTitle').textContent=title;
  $('overScore').textContent='总分 '+totalScore;
  $('overDetail').textContent=win?'样本 '+gemsGot+' / 15 · 太空老司机！':'第 '+(track+1)+' 条赛道 · 样本 '+gemsGot+' / 5';
  $('overBest').textContent='最高分 '+best;
  $('ovOver').classList.remove('hidden');
}

var last=0;
function loop(ts){
  requestAnimationFrame(loop);
  var dt=Math.min(0.05,(ts-last)/1000||0.016);last=ts;
  if(state==='play')update(dt);
  draw(dt,ts/1000);
}
function update(dt){
  var c=car;
  if(ctl.gas)c.vx+=160*dt;
  if(ctl.brake)c.vx-=120*dt;
  c.vx-=c.vx*0.5*dt;
  c.vx+=-slope(c.x,track)*28*dt;
  c.vx=clamp(c.vx,-120,290);
  engine(ctl.gas&&state==='play',c.vx);
  c.vy+=520*dt;
  c.x+=c.vx*dt;
  c.y+=c.vy*dt;
  if(c.x<20){c.x=20;c.vx=Math.max(0,c.vx);}
  if(c.air)c.tilt+=c.spin*dt;
  var gy=h(c.x,track),s=slope(c.x,track);
  if(c.y>=gy-1){
    if(c.air){
      c.y=gy;
      if(Math.abs(normAng(c.tilt))>65){failRun('💥 翻车了！落地倾角 '+Math.round(Math.abs(normAng(c.tilt)))+'°');return;}
      c.air=false;c.spin=0;
    }else c.y=gy;
    c.vy=s*c.vx;
    var target=Math.atan(s)*57.2958;
    c.tilt+=(target-c.tilt)*Math.min(1,12*dt);
  }else if(c.y<gy-4&&!c.air){
    c.air=true;c.spin=c.vx*0.28;
  }
  c.wheel+=c.vx*dt*0.06;
  timeLeft-=dt;
  if(timeLeft<=0){timeLeft=0;failRun('⏱ 时间到！没能冲过终点');return;}
  var i,g;
  for(i=0;i<gems.length;i++){
    g=gems[i];
    if(!g.got){
      var dx=c.x-g.x,dy=(c.y-16)-g.y;
      if(dx*dx+dy*dy<1600){g.got=true;gemsGot++;sfxGem();buzz(25);floats.push({x:g.x,y:g.y-24,txt:'+100',t:1.2});}
    }
  }
  if(c.x>=FINISH_X){finishTrack();return;}
  for(i=parts.length-1;i>=0;i--){var q=parts[i];q.t-=dt;if(q.t<=0){parts.splice(i,1);continue;}q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=300*dt;}
  for(i=floats.length-1;i>=0;i--){var f=floats[i];f.t-=dt;f.y-=34*dt;if(f.t<=0)floats.splice(i,1);}
  if(shakeT>0)shakeT-=dt;
  if(msgT>0)msgT-=dt;
}

function draw(dt,t){
  var camX=clamp(car?car.x-140:0,0,TRACK_LEN-W);
  ctx.save();
  if(shakeT>0)ctx.translate((Math.random()-0.5)*16*shakeT,(Math.random()-0.5)*16*shakeT);
  var g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#0b1020');g.addColorStop(0.6,'#141b38');g.addColorStop(1,'#1c1a3e');
  ctx.fillStyle=g;ctx.fillRect(-20,-20,W+40,H+40);
  ctx.fillStyle='#fff';
  for(var i=0;i<stars.length;i++){var s=stars[i];ctx.globalAlpha=0.3+0.35*Math.sin(t*2+s.tw);ctx.fillRect(s.x,s.y,s.r,s.r);}
  ctx.globalAlpha=1;
  ctx.font='52px serif';ctx.fillText('🌍',400,80);
  ctx.save();ctx.translate(-camX,0);
  // terrain
  ctx.beginPath();ctx.moveTo(camX-40,H);
  for(var x=camX-40;x<=camX+W+40;x+=8)ctx.lineTo(x,h(x,track));
  ctx.lineTo(camX+W+40,H);ctx.closePath();
  var tg=ctx.createLinearGradient(0,380,0,H);tg.addColorStop(0,'#4c4f5e');tg.addColorStop(1,'#262833');
  ctx.fillStyle=tg;ctx.fill();
  ctx.strokeStyle='#8a8fa0';ctx.lineWidth=3;ctx.beginPath();
  for(x=camX-40;x<=camX+W+40;x+=8){var yy=h(x,track);if(x===camX-40)ctx.moveTo(x,yy);else ctx.lineTo(x,yy);}
  ctx.stroke();
  // craters
  ctx.fillStyle='rgba(0,0,0,0.18)';
  for(x=Math.floor((camX-40)/260)*260;x<camX+W+40;x+=260){
    var cx2=x+90,cy2=h(cx2,track)+26;
    ctx.beginPath();ctx.ellipse(cx2,cy2,34,12,0,0,6.29);ctx.fill();
  }
  // gems
  ctx.textAlign='center';ctx.font='30px serif';
  for(i=0;i<gems.length;i++){var gm=gems[i];if(gm.got)continue;var bob=Math.sin(t*3+gm.ph)*5;ctx.fillText('💎',gm.x,gm.y+bob);}
  // finish
  ctx.font='44px serif';ctx.fillText('🏁',FINISH_X,h(FINISH_X,track)-44);
  ctx.fillStyle='#e8ecff';ctx.font='15px sans-serif';
  ctx.fillText('终点',FINISH_X,h(FINISH_X,track)-4);
  // progress markers
  ctx.fillStyle='#8fa0c8';ctx.font='13px sans-serif';
  for(i=1;i<3;i++){var mx=i*1000;ctx.fillText(mx+'m',mx,h(mx,track)-8);}
  // car
  if(car&&state!=='over'){
    ctx.save();ctx.translate(car.x,car.y);ctx.rotate(car.tilt*Math.PI/180);
    ctx.fillStyle='rgba(0,0,0,0.3)';
    ctx.beginPath();ctx.ellipse(0,4,30,7,0,0,6.29);ctx.fill();
    var wy=-2;
    ctx.fillStyle='#151824';
    ctx.beginPath();ctx.arc(-17,wy,10,0,6.29);ctx.arc(17,wy,10,0,6.29);ctx.fill();
    ctx.strokeStyle='#8a8fa0';ctx.lineWidth=3;
    for(var wv=0;wv<3;wv++){var wa=car.wheel+wv*2.094;ctx.beginPath();ctx.moveTo(-17+Math.cos(wa)*8,wy+Math.sin(wa)*8);ctx.lineTo(-17-Math.cos(wa)*8,wy-Math.sin(wa)*8);ctx.moveTo(17+Math.cos(wa)*8,wy+Math.sin(wa)*8);ctx.lineTo(17-Math.cos(wa)*8,wy-Math.sin(wa)*8);ctx.stroke();}
    ctx.fillStyle='#d99a3c';
    ctx.beginPath();ctx.roundRect(-26,-22,52,18,6);ctx.fill();
    ctx.fillStyle='#7ec8e8';
    ctx.beginPath();ctx.roundRect(-12,-32,26,14,5);ctx.fill();
    ctx.fillStyle='#2b3a55';ctx.fillRect(-12,-32,26,4);
    ctx.fillStyle='#ff5a3c';
    if(ctl.gas&&state==='play'){var fl=8+Math.random()*10;ctx.beginPath();ctx.moveTo(-26,-16);ctx.lineTo(-26,-6);ctx.lineTo(-26-fl,-11);ctx.closePath();ctx.fill();}
    ctx.restore();
  }
  // particles
  for(i=0;i<parts.length;i++){var q=parts[i];ctx.globalAlpha=Math.min(1,q.t*2);ctx.fillStyle=q.c;ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,6.29);ctx.fill();}
  ctx.globalAlpha=1;
  // floats
  ctx.textAlign='center';ctx.font='bold 22px sans-serif';
  for(i=0;i<floats.length;i++){var f=floats[i];ctx.globalAlpha=Math.min(1,f.t);ctx.fillStyle='#7de8ff';ctx.fillText(f.txt,f.x,f.y);}
  ctx.globalAlpha=1;
  ctx.restore();
  // HUD
  ctx.textAlign='left';ctx.font='15px sans-serif';ctx.fillStyle='#dfe7ff';
  ctx.fillText('⏱ '+Math.ceil(timeLeft)+'s',12,28);
  ctx.fillText('速度 '+Math.round(Math.abs(car?car.vx:0)),12,50);
  ctx.fillText('💎 '+gemsGot+'/5',12,72);
  ctx.fillStyle='#ffd23c';ctx.font='bold 16px sans-serif';ctx.textAlign='right';
  ctx.fillText('赛道 '+(track+1)+'/3',W-12,28);
  ctx.fillText('总分 '+totalScore,W-12,50);
  var tl=clamp(timeLeft/TIME_LIMIT,0,1);
  ctx.fillStyle='#223';ctx.fillRect(12,80,120,10);
  ctx.fillStyle=tl>0.25?'#35d07f':'#ff5a3c';ctx.fillRect(12,80,120*tl,10);
  // progress bar
  ctx.fillStyle='rgba(255,255,255,0.15)';ctx.fillRect(12,H-24,W-24,8);
  ctx.fillStyle='#7a4af7';ctx.fillRect(12,H-24,(W-24)*clamp((car?car.x:0)/FINISH_X,0,1),8);
  if(msgT>0){ctx.globalAlpha=Math.min(1,msgT/(msgMax*0.4));ctx.textAlign='center';ctx.font='bold 30px sans-serif';ctx.fillStyle='#fff';ctx.fillText(msg,W/2,300);ctx.globalAlpha=1;}
  ctx.restore();
}

function bindHold(el,set){
  var on=function(e){e.preventDefault();set(true);};
  var off=function(e){e.preventDefault();set(false);};
  el.addEventListener('pointerdown',on);
  el.addEventListener('pointerup',off);
  el.addEventListener('pointerleave',off);
  el.addEventListener('pointercancel',off);
  el.addEventListener('contextmenu',function(e){e.preventDefault();});
}
bindHold($('btnGas'),function(v){ctl.gas=v;});
bindHold($('btnBrake'),function(v){ctl.brake=v;});
document.addEventListener('keydown',function(e){
  if(e.code==='ArrowRight'||e.code==='KeyD')ctl.gas=true;
  if(e.code==='ArrowLeft'||e.code==='KeyA')ctl.brake=true;
});
document.addEventListener('keyup',function(e){
  if(e.code==='ArrowRight'||e.code==='KeyD')ctl.gas=false;
  if(e.code==='ArrowLeft'||e.code==='KeyA')ctl.brake=false;
});

function refreshMute(){$('btnMute').textContent=muted?'🔇':'🔊';}
$('btnMute').addEventListener('click',function(){muted=!muted;GameUI.storageSet('g100_mute',muted?'1':'0');refreshMute();engine(false,0);if(!muted)sfxClick();});
$('btnPause').addEventListener('click',function(){
  if(state==='play'){state='pause';engine(false,0);$('ovPause').classList.remove('hidden');}
  else if(state==='pause'){$('ovPause').classList.add('hidden');state='play';}
  sfxClick();
});
$('btnStart').addEventListener('click',function(){
  ac();sfxClick();
  $('ovStart').classList.add('hidden');
  newGame();state='play';
});
$('btnResume').addEventListener('click',function(){sfxClick();$('ovPause').classList.add('hidden');state='play';});
$('btnRetry').addEventListener('click',function(){
  sfxClick();
  $('ovOver').classList.add('hidden');
  newGame();state='play';
});
refreshMute();
$('startBest').textContent=best;
startTrack(0);
requestAnimationFrame(loop);
</script>
