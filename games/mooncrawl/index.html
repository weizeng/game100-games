<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>月球车</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0b1020;overflow:hidden;font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;color:#e6ecff;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#wrap{max-width:480px;height:100dvh;margin:0 auto;display:flex;flex-direction:column;background:#0b1020}
#stage{position:relative;flex:1;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hbtn{position:absolute;top:10px;width:44px;height:44px;border-radius:12px;background:rgba(20,28,55,.85);border:1px solid #2c3a63;color:#fff;font-size:22px;z-index:5}
#btnPause{right:10px}
#btnMute{right:62px}
#ctrl{display:flex;gap:10px;padding:10px 12px 14px;background:#0b1020}
#ctrl button{flex:1;height:76px;font-size:24px;font-weight:700;border-radius:16px;border:1px solid #2c3a63;color:#fff;touch-action:none}
#btnGas{background:#14532d;border-color:#35d07f}
#btnGas:active{background:#1d7a44}
#btnBrake{background:#5c1a1a;border-color:#ff5a3c}
#btnBrake:active{background:#7d2424}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(5,8,20,.88);z-index:10;text-align:center;padding:24px}
.ov h1{font-size:44px;margin-bottom:8px}
.ov h2{font-size:30px;margin-bottom:10px}
.ov p{font-size:15px;line-height:1.7;color:#aebadd;margin:6px 0;max-width:380px}
.ov .big{font-size:20px;color:#fff}
.bigbtn{margin-top:18px;min-width:200px;min-height:56px;font-size:22px;border-radius:16px;border:none;background:linear-gradient(135deg,#4a6cf7,#7a4af7);color:#fff;font-weight:700}
.bigbtn:active{transform:scale(.96)}
.hidden{display:none!important}
.tag{font-size:13px;color:#8fa0c8}
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="cv" width="480" height="720"></canvas>
    <button class="hbtn" id="btnMute">🔊</button>
    <button class="hbtn" id="btnPause">⏸</button>
    <div class="ov" id="ovStart">
      <h1>🚗</h1>
      <h2>月球车</h2>
      <p>开着月球车翻山越岭！🟢油门加速，🔴刹车/倒车。<br>
      沿途收集 5 颗 💎 样本（+100分），冲过终点 🏁。<br>
      每条赛道限时 100 秒，落地倾角超过 65° 会翻车！<br>
      共 3 条赛道，坡度一条比一条陡，分数累加。<br>
      计分：样本×100 + 剩余时间×5 + 距离÷10。</p>
      <button class="bigbtn" id="btnStart">开始游戏</button>
      <p class="tag">最高分 <span id="startBest">0</span></p>
    </div>
    <div class="ov hidden" id="ovPause">
      <h2>⏸ 已暂停</h2>
      <button class="bigbtn" id="btnResume">继续</button>
    </div>
    <div class="ov hidden" id="ovOver">
      <h2 id="overTitle">🏁 完成</h2>
      <p class="big" id="overScore">总分 0</p>
      <p class="tag" id="overDetail"></p>
      <p class="tag" id="overBest">最高分 0</p>
      <button class="bigbtn" id="btnRetry">再来一局</button>
    </div>
  </div>
  <div id="ctrl">
    <button id="btnGas">🟢 油门</button>
    <button id="btnBrake">🔴 刹车</button>
  </div>
</div>
<script>'use strict';
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var W=480,H=720,TRACK_LEN=2800,FINISH_X=2750,TIME_LIMIT=100;
var A1=[90,120,140],A2=[40,55,60];
function h(x,tr){return 520+A1[tr]*Math.sin(x*0.004)+A2[tr]*Math.sin(x*0.011+2);}
function slope(x,tr){return (h(x+2,tr)-h(x-2,tr))/4;}
var state='start';
var track=0,totalScore=0,gemsGot=0,timeLeft=TIME_LIMIT,car=null,gems=[];
var parts=[],floats=[],shakeT=0,msg='',msgT=0,msgMax=1;
var ctl={gas:false,brake:false};
var best=parseInt(localStorage.getItem('g100_mooncrawl_hs')||'0',10)||0;
var muted=localStorage.getItem('g100_mute')==='1';
var stars=[];
for(var i=0;i<80;i++)stars.push({x:Math.random()*W,y:Math.random()*H*0.6,r:Math.random()*1.6+0.4,tw:Math.random()*6.28});

function $(id){return document.getElementById(id);}
function normAng(a){a=a%360;if(a>180)a-=360;if(a<-180)a+=360;return a;}
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function buzz(ms){if(navigator.vibrate){try{navigator.vibrate(ms);}catch(e){}}}

var AC=null;
function ac(){if(!AC){var C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AC=new C();}if(AC.state==='suspended')AC.resume();return AC;}
function tone(f,d,type,g,slide){if(muted)return;var c=ac();if(!c)return;var o=c.createOscillator(),v=c.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,c.currentTime);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,slide),c.currentTime+d);v.gain.setValueAtTime(g||0.14,c.currentTime);v.gain.exponentialRampToValueAtTime(0.001,c.currentTime+d);o.connect(v);v.connect(c.destination);o.start();o.stop(c.currentTime+d+0.02);}
function noiseBurst(d,g){if(muted)return;var c=ac();if(!c)return;var n=Math.floor(c.sampleRate*d),buf=c.createBuffer(1,n,c.sampleRate),ch=buf.getChannelData(0);for(var i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);var s=c.createBufferSource(),v=c.createGain();s.buffer=buf;v.gain.value=g||0.25;s.connect(v);v.connect(c.destination);s.start();}
function sfxClick(){tone(660,0.08,'square',0.08);}
function sfxGem(){tone(880,0.1,'sine',0.15);setTimeout(function(){tone(1320,0.16,'sine',0.15);},90);}
function sfxCrash(){noiseBurst(0.5,0.3);tone(140,0.6,'sawtooth',0.2,35);}
function sfxWin(){var n=[523,659,784,1047];for(var i=0;i<n.length;i++)(function(f,k){setTimeout(function(){tone(f,0.18,'triangle',0.16);},k*130);})(n[i],i);}
var engOsc=null,engGain=null;
function engine(on,vx){
  if(on&&!muted){
    var c=ac();if(!c)return;
    if(!engOsc){engOsc=c.createOscillator();engGain=c.createGain();engOsc.type='sawtooth';engGain.gain.value=0.045;engOsc.connect(engGain);engGain.connect(c.destination);engOsc.start();}
    engOsc.frequency.value=55+Math.abs(vx)*0.55;
  }else if(engOsc){try{engOsc.stop();}catch(e){}try{engOsc.disconnect();}catch(e2){}engOsc=null;engGain=null;}
}

function startTrack(tr){
  track=tr;gemsGot=0;timeLeft=TIME_LIMIT;
  parts=[];floats=[];
  car={x:40,vx:0,vy:0,y:h(40,tr),tilt:0,air:false,spin:0,wheel:0};
  gems=[];
  var gx=[350,800,1250,1750,2250];
  for(var i=0;i<gx.length;i++)gems.push({x:gx[i],y:h(gx[i],tr)-36,got:false,ph:Math.random()*6.28});
  engine(false,0);
  showMsg('第 '+(tr+1)+' / 3 条赛道',1.8);
}
function newGame(){
  track=0;totalScore=0;
  startTrack(0);
}
function showMsg(t,d){msg=t;msgT=d;msgMax=d;}
function trackScore(){
  return gemsGot*100+Math.max(0,Math.ceil(timeLeft))*5+Math.floor(car.x/10);
}
function finishTrack(){
  var sc=trackScore();
  totalScore+=sc;
  floats.push({x:car.x,y:car.y-60,txt:'+'+sc,t:1.6});
  sfxWin();buzz(50);
  if(track>=2){endRun(true,'🏆 三条赛道全部完成！');}
  else{startTrack(track+1);}
}
function failRun(reason){
  engine(false,0);
  sfxCrash();buzz(100);shakeT=0.5;
  for(var i=0;i<24;i++){
    var a=Math.random()*6.28,sp=60+Math.random()*200;
    parts.push({x:car.x,y:car.y-14,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-60,r:2+Math.random()*3,t:0.8,c:['#ff9a3c','#ff5a3c','#8a8f9e'][i%3]});
  }
  endRun(false,reason);
}
function endRun(win,title){
  state='over';engine(false,0);
  if(totalScore>best){best=totalScore;localStorage.setItem('g100_mooncrawl_hs',String(best));}
  $('overTitle').textContent=title;
  $('overScore').textContent='总分 '+totalScore;
  $('overDetail').textContent=win?'样本 '+gemsGot+' / 15 · 太空老司机！':'第 '+(track+1)+' 条赛道 · 样本 '+gemsGot+' / 5';
  $('overBest').textContent='最高分 '+best;
  $('ovOver').classList.remove('hidden');
}

var last=0;
function loop(ts){
  requestAnimationFrame(loop);
  var dt=Math.min(0.05,(ts-last)/1000||0.016);last=ts;
  if(state==='play')update(dt);
  draw(dt,ts/1000);
}
function update(dt){
  var c=car;
  if(ctl.gas)c.vx+=160*dt;
  if(ctl.brake)c.vx-=120*dt;
  c.vx-=c.vx*0.5*dt;
  c.vx+=-slope(c.x,track)*28*dt;
  c.vx=clamp(c.vx,-120,290);
  engine(ctl.gas&&state==='play',c.vx);
  c.vy+=520*dt;
  c.x+=c.vx*dt;
  c.y+=c.vy*dt;
  if(c.x<20){c.x=20;c.vx=Math.max(0,c.vx);}
  if(c.air)c.tilt+=c.spin*dt;
  var gy=h(c.x,track),s=slope(c.x,track);
  if(c.y>=gy-1){
    if(c.air){
      c.y=gy;
      if(Math.abs(normAng(c.tilt))>65){failRun('💥 翻车了！落地倾角 '+Math.round(Math.abs(normAng(c.tilt)))+'°');return;}
      c.air=false;c.spin=0;
    }else c.y=gy;
    c.vy=s*c.vx;
    var target=Math.atan(s)*57.2958;
    c.tilt+=(target-c.tilt)*Math.min(1,12*dt);
  }else if(c.y<gy-4&&!c.air){
    c.air=true;c.spin=c.vx*0.28;
  }
  c.wheel+=c.vx*dt*0.06;
  timeLeft-=dt;
  if(timeLeft<=0){timeLeft=0;failRun('⏱ 时间到！没能冲过终点');return;}
  var i,g;
  for(i=0;i<gems.length;i++){
    g=gems[i];
    if(!g.got){
      var dx=c.x-g.x,dy=(c.y-16)-g.y;
      if(dx*dx+dy*dy<1600){g.got=true;gemsGot++;sfxGem();buzz(25);floats.push({x:g.x,y:g.y-24,txt:'+100',t:1.2});}
    }
  }
  if(c.x>=FINISH_X){finishTrack();return;}
  for(i=parts.length-1;i>=0;i--){var q=parts[i];q.t-=dt;if(q.t<=0){parts.splice(i,1);continue;}q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=300*dt;}
  for(i=floats.length-1;i>=0;i--){var f=floats[i];f.t-=dt;f.y-=34*dt;if(f.t<=0)floats.splice(i,1);}
  if(shakeT>0)shakeT-=dt;
  if(msgT>0)msgT-=dt;
}

function draw(dt,t){
  var camX=clamp(car?car.x-140:0,0,TRACK_LEN-W);
  ctx.save();
  if(shakeT>0)ctx.translate((Math.random()-0.5)*16*shakeT,(Math.random()-0.5)*16*shakeT);
  var g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#0b1020');g.addColorStop(0.6,'#141b38');g.addColorStop(1,'#1c1a3e');
  ctx.fillStyle=g;ctx.fillRect(-20,-20,W+40,H+40);
  ctx.fillStyle='#fff';
  for(var i=0;i<stars.length;i++){var s=stars[i];ctx.globalAlpha=0.3+0.35*Math.sin(t*2+s.tw);ctx.fillRect(s.x,s.y,s.r,s.r);}
  ctx.globalAlpha=1;
  ctx.font='52px serif';ctx.fillText('🌍',400,80);
  ctx.save();ctx.translate(-camX,0);
  // terrain
  ctx.beginPath();ctx.moveTo(camX-40,H);
  for(var x=camX-40;x<=camX+W+40;x+=8)ctx.lineTo(x,h(x,track));
  ctx.lineTo(camX+W+40,H);ctx.closePath();
  var tg=ctx.createLinearGradient(0,380,0,H);tg.addColorStop(0,'#4c4f5e');tg.addColorStop(1,'#262833');
  ctx.fillStyle=tg;ctx.fill();
  ctx.strokeStyle='#8a8fa0';ctx.lineWidth=3;ctx.beginPath();
  for(x=camX-40;x<=camX+W+40;x+=8){var yy=h(x,track);if(x===camX-40)ctx.moveTo(x,yy);else ctx.lineTo(x,yy);}
  ctx.stroke();
  // craters
  ctx.fillStyle='rgba(0,0,0,0.18)';
  for(x=Math.floor((camX-40)/260)*260;x<camX+W+40;x+=260){
    var cx2=x+90,cy2=h(cx2,track)+26;
    ctx.beginPath();ctx.ellipse(cx2,cy2,34,12,0,0,6.29);ctx.fill();
  }
  // gems
  ctx.textAlign='center';ctx.font='30px serif';
  for(i=0;i<gems.length;i++){var gm=gems[i];if(gm.got)continue;var bob=Math.sin(t*3+gm.ph)*5;ctx.fillText('💎',gm.x,gm.y+bob);}
  // finish
  ctx.font='44px serif';ctx.fillText('🏁',FINISH_X,h(FINISH_X,track)-44);
  ctx.fillStyle='#e8ecff';ctx.font='15px sans-serif';
  ctx.fillText('终点',FINISH_X,h(FINISH_X,track)-4);
  // progress markers
  ctx.fillStyle='#8fa0c8';ctx.font='13px sans-serif';
  for(i=1;i<3;i++){var mx=i*1000;ctx.fillText(mx+'m',mx,h(mx,track)-8);}
  // car
  if(car&&state!=='over'){
    ctx.save();ctx.translate(car.x,car.y);ctx.rotate(car.tilt*Math.PI/180);
    ctx.fillStyle='rgba(0,0,0,0.3)';
    ctx.beginPath();ctx.ellipse(0,4,30,7,0,0,6.29);ctx.fill();
    var wy=-2;
    ctx.fillStyle='#151824';
    ctx.beginPath();ctx.arc(-17,wy,10,0,6.29);ctx.arc(17,wy,10,0,6.29);ctx.fill();
    ctx.strokeStyle='#8a8fa0';ctx.lineWidth=3;
    for(var wv=0;wv<3;wv++){var wa=car.wheel+wv*2.094;ctx.beginPath();ctx.moveTo(-17+Math.cos(wa)*8,wy+Math.sin(wa)*8);ctx.lineTo(-17-Math.cos(wa)*8,wy-Math.sin(wa)*8);ctx.moveTo(17+Math.cos(wa)*8,wy+Math.sin(wa)*8);ctx.lineTo(17-Math.cos(wa)*8,wy-Math.sin(wa)*8);ctx.stroke();}
    ctx.fillStyle='#d99a3c';
    ctx.beginPath();ctx.roundRect(-26,-22,52,18,6);ctx.fill();
    ctx.fillStyle='#7ec8e8';
    ctx.beginPath();ctx.roundRect(-12,-32,26,14,5);ctx.fill();
    ctx.fillStyle='#2b3a55';ctx.fillRect(-12,-32,26,4);
    ctx.fillStyle='#ff5a3c';
    if(ctl.gas&&state==='play'){var fl=8+Math.random()*10;ctx.beginPath();ctx.moveTo(-26,-16);ctx.lineTo(-26,-6);ctx.lineTo(-26-fl,-11);ctx.closePath();ctx.fill();}
    ctx.restore();
  }
  // particles
  for(i=0;i<parts.length;i++){var q=parts[i];ctx.globalAlpha=Math.min(1,q.t*2);ctx.fillStyle=q.c;ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,6.29);ctx.fill();}
  ctx.globalAlpha=1;
  // floats
  ctx.textAlign='center';ctx.font='bold 22px sans-serif';
  for(i=0;i<floats.length;i++){var f=floats[i];ctx.globalAlpha=Math.min(1,f.t);ctx.fillStyle='#7de8ff';ctx.fillText(f.txt,f.x,f.y);}
  ctx.globalAlpha=1;
  ctx.restore();
  // HUD
  ctx.textAlign='left';ctx.font='15px sans-serif';ctx.fillStyle='#dfe7ff';
  ctx.fillText('⏱ '+Math.ceil(timeLeft)+'s',12,28);
  ctx.fillText('速度 '+Math.round(Math.abs(car?car.vx:0)),12,50);
  ctx.fillText('💎 '+gemsGot+'/5',12,72);
  ctx.fillStyle='#ffd23c';ctx.font='bold 16px sans-serif';ctx.textAlign='right';
  ctx.fillText('赛道 '+(track+1)+'/3',W-12,28);
  ctx.fillText('总分 '+totalScore,W-12,50);
  var tl=clamp(timeLeft/TIME_LIMIT,0,1);
  ctx.fillStyle='#223';ctx.fillRect(12,80,120,10);
  ctx.fillStyle=tl>0.25?'#35d07f':'#ff5a3c';ctx.fillRect(12,80,120*tl,10);
  // progress bar
  ctx.fillStyle='rgba(255,255,255,0.15)';ctx.fillRect(12,H-24,W-24,8);
  ctx.fillStyle='#7a4af7';ctx.fillRect(12,H-24,(W-24)*clamp((car?car.x:0)/FINISH_X,0,1),8);
  if(msgT>0){ctx.globalAlpha=Math.min(1,msgT/(msgMax*0.4));ctx.textAlign='center';ctx.font='bold 30px sans-serif';ctx.fillStyle='#fff';ctx.fillText(msg,W/2,300);ctx.globalAlpha=1;}
  ctx.restore();
}

function bindHold(el,set){
  var on=function(e){e.preventDefault();set(true);};
  var off=function(e){e.preventDefault();set(false);};
  el.addEventListener('pointerdown',on);
  el.addEventListener('pointerup',off);
  el.addEventListener('pointerleave',off);
  el.addEventListener('pointercancel',off);
  el.addEventListener('contextmenu',function(e){e.preventDefault();});
}
bindHold($('btnGas'),function(v){ctl.gas=v;});
bindHold($('btnBrake'),function(v){ctl.brake=v;});
document.addEventListener('keydown',function(e){
  if(e.code==='ArrowRight'||e.code==='KeyD')ctl.gas=true;
  if(e.code==='ArrowLeft'||e.code==='KeyA')ctl.brake=true;
});
document.addEventListener('keyup',function(e){
  if(e.code==='ArrowRight'||e.code==='KeyD')ctl.gas=false;
  if(e.code==='ArrowLeft'||e.code==='KeyA')ctl.brake=false;
});

function refreshMute(){$('btnMute').textContent=muted?'🔇':'🔊';}
$('btnMute').addEventListener('click',function(){muted=!muted;localStorage.setItem('g100_mute',muted?'1':'0');refreshMute();engine(false,0);if(!muted)sfxClick();});
$('btnPause').addEventListener('click',function(){
  if(state==='play'){state='pause';engine(false,0);$('ovPause').classList.remove('hidden');}
  else if(state==='pause'){$('ovPause').classList.add('hidden');state='play';}
  sfxClick();
});
$('btnStart').addEventListener('click',function(){
  ac();sfxClick();
  $('ovStart').classList.add('hidden');
  newGame();state='play';
});
$('btnResume').addEventListener('click',function(){sfxClick();$('ovPause').classList.add('hidden');state='play';});
$('btnRetry').addEventListener('click',function(){
  sfxClick();
  $('ovOver').classList.add('hidden');
  newGame();state='play';
});
refreshMute();
$('startBest').textContent=best;
startTrack(0);
requestAnimationFrame(loop);
</script>
</body>
</html>
