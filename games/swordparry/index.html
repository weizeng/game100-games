<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>剑气格挡</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;overflow:hidden;background:#0d0f1a;font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;color:#fff}
#wrap{position:relative;width:100%;max-width:480px;height:100%;margin:0 auto;display:flex;flex-direction:column;background:radial-gradient(circle at 50% 30%,#1b2138 0%,#0d0f1a 70%)}
#hud{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;font-size:15px;z-index:5}
#hud .grp{display:flex;gap:8px;align-items:center}
.ibtn{width:44px;height:44px;border-radius:12px;border:1px solid #3a4066;background:#1a1f36;color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.ibtn:active{transform:scale(.92);background:#232a4a}
#cv{flex:1;width:100%;touch-action:none}
#pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px 60px 18px;z-index:5}
.dbtn{height:64px;border-radius:16px;border:2px solid #EF5350;background:rgba(239,83,80,.14);color:#fff;font-size:30px;cursor:pointer;touch-action:manipulation}
.dbtn:active{background:rgba(239,83,80,.45);transform:scale(.94)}
.dbtn.flash{background:rgba(239,83,80,.6)}
#overlay{position:absolute;inset:0;background:rgba(5,6,12,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;padding:24px;text-align:center}
#overlay h1{font-size:34px;margin-bottom:8px}
#overlay p{font-size:14px;color:#aab;line-height:1.8;margin-bottom:6px;max-width:340px}
#overlay .big{font-size:20px;color:#ffd54f;margin:10px 0}
.startbtn{margin-top:14px;min-width:200px;height:56px;border-radius:28px;border:none;background:linear-gradient(135deg,#EF5350,#b71c1c);color:#fff;font-size:20px;font-weight:700;cursor:pointer}
.startbtn:active{transform:scale(.95)}
.hidden{display:none!important}
#combo{position:absolute;top:64px;left:0;right:0;text-align:center;font-size:18px;color:#ffd54f;font-weight:700;pointer-events:none;z-index:6;text-shadow:0 2px 8px #000}
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <div class="grp"><span>⚔️ <b id="score">0</b></span><span style="color:#8a90b8;font-size:13px">最高 <b id="hs">0</b></span></div>
    <div class="grp"><span id="lives" style="font-size:18px">❤️❤️❤️</span>
      <button class="ibtn" id="muteBtn" aria-label="静音">🔊</button>
      <button class="ibtn" id="pauseBtn" aria-label="暂停">⏸</button>
    </div>
  </div>
  <div id="combo"></div>
  <canvas id="cv"></canvas>
  <div id="pad">
    <div></div><button class="dbtn" data-dir="0">⬆️</button><div></div>
    <button class="dbtn" data-dir="3">⬅️</button><div></div><button class="dbtn" data-dir="1">➡️</button>
    <div></div><button class="dbtn" data-dir="2">⬇️</button><div></div>
  </div>
  <div id="overlay">
    <h1>🗡️ 剑气格挡</h1>
    <p id="ovText">四面八方飞来剑气！看准<span style="color:#EF5350">红色预警箭头</span>，剑气进入金色格挡圈时，点击对应方向按钮（或点屏幕对应方位）格挡。<br>格挡成功加分攒连击，漏挡扣 1 命，共 3 命，速度越来越快！</p>
    <div class="big hidden" id="ovScore"></div>
    <button class="startbtn" id="startBtn">开始游戏</button>
  </div>
</div>
<script>
'use strict';
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const scoreEl=document.getElementById('score'),hsEl=document.getElementById('hs'),livesEl=document.getElementById('lives');
const overlay=document.getElementById('overlay'),ovText=document.getElementById('ovText'),ovScore=document.getElementById('ovScore');
const startBtn=document.getElementById('startBtn'),pauseBtn=document.getElementById('pauseBtn'),muteBtn=document.getElementById('muteBtn');
const comboEl=document.getElementById('combo');
let W=0,H=0;
function resize(){const r=cv.getBoundingClientRect();const dpr=Math.min(2,window.devicePixelRatio||1);W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);}
window.addEventListener('resize',resize);
// 音效
let actx=null;let muted=localStorage.getItem('g100_sound')==='1';
function ac(){if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(actx&&actx.state==='suspended')actx.resume();return actx;}
function tone(f,dur,type,vol,slideTo){if(muted)return;const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,a.currentTime);if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,a.currentTime+dur);g.gain.setValueAtTime(vol||.2,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+dur);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+dur);}
function noiseHit(dur,vol,ff){if(muted)return;const a=ac();if(!a)return;const n=a.sampleRate*dur,b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=ff||1200;const g=a.createGain();g.gain.value=vol||.3;s.connect(f);f.connect(g);g.connect(a.destination);s.start();}
const sBlock=()=>{noiseHit(.12,.35,3000);tone(880,.12,'square',.12,440);};
const sPerfect=()=>{tone(660,.1,'triangle',.2);setTimeout(()=>tone(990,.15,'triangle',.2),70);};
const sWhiff=()=>tone(220,.08,'sine',.08,140);
const sMiss=()=>{tone(160,.35,'sawtooth',.25,60);noiseHit(.25,.3,500);};
const sOver=()=>{[440,330,247,165].forEach((f,i)=>setTimeout(()=>tone(f,.25,'triangle',.2),i*160));};
const sStart=()=>{[523,659,784].forEach((f,i)=>setTimeout(()=>tone(f,.12,'triangle',.18),i*90));};
function vibrate(p){try{if(navigator.vibrate)navigator.vibrate(p);}catch(e){}}
// 状态
let state='menu',score=0,combo=0,lives=3,best=0,spawnT=0,shake=0;
let qis=[],warns=[],parts=[],floats=[];
const KEY='g100_swordparry_hs';
try{best=parseInt(localStorage.getItem(KEY)||'0',10)||0;}catch(e){}
hsEl.textContent=best;
const DIRS=[{x:0,y:-1,arrow:'⬇️'},{x:1,y:0,arrow:'⬅️'},{x:0,y:1,arrow:'⬆️'},{x:-1,y:0,arrow:'➡️'}];
function cx(){return W/2;}function cy(){return H/2;}
function blockR(){return Math.min(W,H)*0.26;}
function maxDist(){return Math.min(W,H)*0.52;}
function spawnInterval(){return Math.max(.5,1.5-score*.006);}
function qiSpeed(){return Math.min(150+score*1.2,430);}
function updateMute(){muteBtn.textContent=muted?'🔇':'🔊';}
muteBtn.addEventListener('click',()=>{muted=!muted;try{localStorage.setItem('g100_sound',muted?'1':'0');}catch(e){}updateMute();if(!muted)tone(600,.1,'sine',.15);});
updateMute();
function startGame(){state='playing';score=0;combo=0;lives=3;qis=[];warns=[];parts=[];floats=[];spawnT=.6;shake=0;scoreEl.textContent='0';livesEl.textContent='❤️❤️❤️';comboEl.textContent='';overlay.classList.add('hidden');pauseBtn.textContent='⏸';sStart();}
function gameOver(){state='over';sOver();vibrate([120,60,120]);if(score>best){best=score;try{localStorage.setItem(KEY,String(best));}catch(e){}hsEl.textContent=best;}ovText.innerHTML='剑气穿身，侠客倒下……';ovScore.classList.remove('hidden');ovScore.textContent='得分 '+score+' ｜ 最高 '+best;startBtn.textContent='再来一局';overlay.classList.remove('hidden');}
function togglePause(){if(state==='playing'){state='paused';pauseBtn.textContent='▶️';ovText.innerHTML='已暂停，养精蓄锐。';ovScore.classList.add('hidden');startBtn.textContent='继续';overlay.classList.remove('hidden');}else if(state==='paused'){state='playing';overlay.classList.add('hidden');pauseBtn.textContent='⏸';}}
startBtn.addEventListener('click',()=>{if(state==='paused')togglePause();else startGame();});
pauseBtn.addEventListener('click',togglePause);
function burst(x,y,n,col){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=60+Math.random()*160;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.6+Math.random()*.4,t:0,col,sz:2+Math.random()*4});}}
function doBlock(dir){if(state!=='playing')return;const br=blockR();let qi=null;for(const q of qis){if(q.dir===dir&&q.dist<br){if(!qi||q.dist<qi.dist)qi=q;}}
  const d=DIRS[dir],bx=cx()+d.x*(br*.8),by=cy()+d.y*(br*.8);
  if(qi){qis.splice(qis.indexOf(qi),1);const gain=10+combo*2;score+=gain;combo++;scoreEl.textContent=score;burst(bx,by,14,'#ffd54f');burst(bx,by,8,'#EF5350');floats.push({x:bx,y:by-14,text:'+'+gain,life:1,t:0,col:'#ffd54f'});if(combo>=5){comboEl.textContent='🔥 '+combo+' 连击！';sPerfect();}else{comboEl.textContent=combo>=2?combo+' 连击':'';sBlock();}
    if(score>best){best=score;hsEl.textContent=best;try{localStorage.setItem(KEY,String(best));}catch(e){}}
  }else{sWhiff();floats.push({x:bx,y:by-14,text:'挥空',life:.5,t:0,col:'#8a90b8'});}
}
document.querySelectorAll('.dbtn').forEach(b=>{const dir=parseInt(b.dataset.dir,10);b.addEventListener('pointerdown',e=>{e.preventDefault();b.classList.add('flash');setTimeout(()=>b.classList.remove('flash'),120);doBlock(dir);});});
cv.addEventListener('pointerdown',e=>{if(state!=='playing')return;const r=cv.getBoundingClientRect();const x=e.clientX-r.left-cx(),y=e.clientY-r.top-cy();if(Math.abs(x)<24&&Math.abs(y)<24)return;const dir=Math.abs(x)>Math.abs(y)?(x>0?1:3):(y>0?2:0);doBlock(dir);});
document.addEventListener('keydown',e=>{const m={ArrowUp:0,ArrowRight:1,ArrowDown:2,ArrowLeft:3};if(m[e.key]!==undefined)doBlock(m[e.key]);if(e.key===' '||e.key==='Enter'){if(state==='menu'||state==='over')startGame();}});
let last=0;
function loop(ts){requestAnimationFrame(loop);const dt=Math.min(.05,(ts-last)/1000||0);last=ts;
  ctx.clearRect(0,0,W,H);
  if(shake>0){shake-=dt;ctx.save();ctx.translate((Math.random()-.5)*shake*30,(Math.random()-.5)*shake*30);}else ctx.save();
  const g=ctx.createRadialGradient(cx(),cy(),10,cx(),cy(),maxDist()*1.3);g.addColorStop(0,'#232a4a');g.addColorStop(1,'#0d0f1a');ctx.fillStyle=g;ctx.fillRect(-20,-20,W+40,H+40);
  const br=blockR();
  // 格挡圈（缓动呼吸）
  const pulse=1+Math.sin(ts/300)*.02;
  ctx.strokeStyle='rgba(255,213,79,.55)';ctx.lineWidth=2;ctx.setLineDash([10,8]);ctx.beginPath();ctx.arc(cx(),cy(),br*pulse,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);
  // 预警箭头
  for(let i=warns.length-1;i>=0;i--){const w=warns[i];w.t-=dt;if(w.t<=0){warns.splice(i,1);qis.push({dir:w.dir,dist:maxDist(),speed:qiSpeed()*(0.9+Math.random()*.2)});continue;}
    const d=DIRS[w.dir],ax=cx()+d.x*(maxDist()+26),ay=cy()+d.y*(maxDist()+26);const bl=Math.abs(Math.sin(ts/90))>.4;ctx.font='30px serif';ctx.textAlign='center';ctx.textBaseline='middle';if(bl)ctx.fillText(d.arrow,ax,ay);}
  // 剑气
  for(let i=qis.length-1;i>=0;i--){const q=qis[i];q.dist-=q.speed*dt;
    if(q.dist<=20){qis.splice(i,1);lives--;combo=0;comboEl.textContent='';livesEl.textContent='❤️'.repeat(Math.max(0,lives))+'🖤'.repeat(3-Math.max(0,lives));sMiss();vibrate(90);shake=.35;burst(cx(),cy(),20,'#EF5350');floats.push({x:cx(),y:cy()-40,text:'-1 ❤️',life:1,t:0,col:'#EF5350'});if(lives<=0){gameOver();}continue;}
    const d=DIRS[q.dir],x=cx()+d.x*q.dist,y=cy()+d.y*q.dist;const inZone=q.dist<br;
    const px=-d.y,py=d.x,L=26;
    ctx.strokeStyle=inZone?'#ffd54f':'#EF5350';ctx.lineWidth=inZone?7:5;ctx.lineCap='round';ctx.shadowColor=inZone?'#ffd54f':'#EF5350';ctx.shadowBlur=inZone?16:10;
    ctx.beginPath();ctx.moveTo(x-px*L,y-py*L);ctx.lineTo(x+px*L,y+py*L);ctx.stroke();ctx.shadowBlur=0;}
  // 侠客
  ctx.font='44px serif';ctx.textAlign='center';ctx.textBaseline='middle';const bob=state==='playing'?Math.sin(ts/240)*3:0;ctx.fillText('🥷',cx(),cy()+bob);
  // 粒子
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.t+=dt;if(p.t>p.life){parts.splice(i,1);continue;}p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=300*dt;const k=1-p.t/p.life;ctx.globalAlpha=k;ctx.fillStyle=p.col;ctx.fillRect(p.x-p.sz/2,p.y-p.sz/2,p.sz,p.sz);ctx.globalAlpha=1;}
  // 飘字
  ctx.textAlign='center';for(let i=floats.length-1;i>=0;i--){const f=floats[i];f.t+=dt;if(f.t>f.life){floats.splice(i,1);continue;}const k=1-f.t/f.life;ctx.globalAlpha=k;ctx.font='bold 20px sans-serif';ctx.fillStyle=f.col;ctx.fillText(f.text,f.x,f.y-f.t*44);ctx.globalAlpha=1;}
  ctx.restore();
  if(state==='playing'){spawnT-=dt;if(spawnT<=0){spawnT=spawnInterval();const dir=Math.floor(Math.random()*4);warns.push({dir,t:.55});
    if(score>120&&Math.random()<.3){let d2=(dir+1+Math.floor(Math.random()*3))%4;warns.push({dir:d2,t:.55});}}}
}
resize();requestAnimationFrame(loop);
</script>
</body>
</html>
