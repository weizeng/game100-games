<style>

    // Glow is shadowBlur: cheap for a handful of shapes, never use it on every tile.
    glow: function (ctx, color, blur) { ctx.shadowColor = color; ctx.shadowBlur = blur; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0; },
    noGlow: function (ctx) { ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; },
    // Crisp rendering on high-DPI phones without changing game coordinates.
    // Only safe where input code converts with getBoundingClientRect + logical W/H, not cv.width.
    hidpi: function (cv, ctx, w, h) {
      var d = Math.max(1, Math.min(2.5, window.devicePixelRatio || 1));
      cv.width = Math.round(w * d); cv.height = Math.round(h * d); // intrinsic ratio stays w:h, so CSS sizing is unchanged
      ctx.setTransform(d, 0, 0, d, 0, 0); return d;
    },
    // Lightweight particle bursts (pooled array, no allocations per frame beyond the burst).
    burst: function (list, x, y, color, n) {
      for (var i = 0; i < (n || 12); i++) { var a = Math.random() * 6.283, v = 1 + Math.random() * 2.6; list.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 1, life: 1, c: color, r: 1.5 + Math.random() * 2.5 }); }
    },
    drawBurst: function (ctx, list) {
      for (var i = list.length - 1; i >= 0; i--) {
        var p = list[i]; p.x += p.vx; p.y += p.vy; p.vy += .12; p.life -= .035;
        if (p.life <= 0) { list.splice(i, 1); continue; }
        ctx.globalAlpha = p.life; ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (skin === 'b' ? 1.2 : 1), 0, 7); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
  };
  window.GameUI.fx = fx;
}());

</script>

<div id="toast"></div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const W=360,H=540;
const cv=$('cv'),ctx=cv.getContext('2d');
const UI=window.GameUI||{pick:a=>a,storageGet:k=>localStorage.getItem(k),storageSet:(k,v)=>localStorage.setItem(k,v)};
const FX=UI.fx&&UI.fx.on?UI.fx:null;
if(FX)FX.hidpi(cv,ctx,W,H);else{cv.width=W;cv.height=H;}
const PK='g100_colorgate_prog', MK='g100_colorgate_mute', HK='g100_colorgate_hs';
const COLORS=['#FF5C8A','#FFB21E','#3FC163','#5B8CFF','#C77DFF','#FF7A59'];
const TOTAL=32;
let muted=UI.storageGet(MK)==='1',ac=null;
$('muteBtn').textContent=muted?'🔇':'🔊';
function beep(f,d,type){if(muted)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(.12,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d);}catch(e){}}
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('on'),1200);}
function show(id,on){$(id).classList.toggle('hidden',!on);}
function loadProg(){try{return JSON.parse(UI.storageGet(PK)||'{}')}catch(e){return{}}}
function saveProg(p){UI.storageSet(PK,JSON.stringify(p));}
let prog=loadProg();
if(!prog.stars)prog.stars={}; if(prog.coins==null)prog.coins=0; if(prog.unlock==null)prog.unlock=1;
if(prog.hammer==null)prog.hammer=1; if(prog.freeze==null)prog.freeze=1; if(!prog.seenTut)prog.seenTut=0;
let hs=+UI.storageGet(HK)||0;
$('muteBtn').onclick=()=>{muted=!muted;UI.storageSet(MK,muted?'1':'0');$('muteBtn').textContent=muted?'🔇':'🔊';};
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function levelSpec(n){
  const size=n<=6?5:n<=14?6:n<=22?7:8;
  const colors=Math.min(6,2+Math.floor((n-1)/4));
  const blocks=Math.min(colors+Math.floor(n/3), size*2);
  const boss=n%5===0;
  const wood=n>=15?(boss?3:1+Math.floor((n-15)/5)):0;
  const double=n>=15?(boss?2:n>=20?1:0):0;
  const portals=n>=18?(boss?2:1):0;
  const rainbow=n>=22?(boss?2:1):0;
  return{size,colors,blocks,boss,wood,double,portals,rainbow};
}

function genLevel(n){
  const sp=levelSpec(n); const rnd=mulberry32(n*12289+13);
  const size=sp.size;
  // One gate per color on unique edge slots
  const gates=[]; const usedEdge=new Set();
  for(let ci=0;ci<sp.colors;ci++){
    let side,idx,guard=0;
    do{ side=['L','R','T','B'][Math.floor(rnd()*4)]; idx=Math.floor(rnd()*size); guard++; }
    while(usedEdge.has(side+idx)&&guard<50);
    usedEdge.add(side+idx);
    gates.push({side,i:idx,color:ci});
  }
  // Reverse-construct: place each block at its gate mouth, then scramble by reverse slides
  const blocks=[]; let bid=0;
  const colorCounts=Array(sp.colors).fill(1);
  let extra=Math.max(0,sp.blocks-sp.colors);
  for(let e=0;e<extra;e++) colorCounts[e%sp.colors]++;
  function cellFree(r,c){ return r>=0&&c>=0&&r<size&&c<size&&!blocks.some(b=>!b.gone&&b.r===r&&b.c===c); }
  for(let ci=0;ci<sp.colors;ci++){
    const g=gates[ci];
    for(let k=0;k<colorCounts[ci];k++){
      let r,c;
      if(g.side==='L'){ r=g.i; c=Math.min(size-1,k); }
      else if(g.side==='R'){ r=g.i; c=Math.max(0,size-1-k); }
      else if(g.side==='T'){ c=g.i; r=Math.min(size-1,k); }
      else { c=g.i; r=Math.max(0,size-1-k); }
      // find free near target
      let guard=0;
      while(!cellFree(r,c)&&guard++<40){
        r=Math.floor(rnd()*size); c=Math.floor(rnd()*size);
      }
      if(!cellFree(r,c)) continue;
      const dbl=sp.double>0&&k===0&&(sp.double--,true);
      blocks.push({id:bid++,r,c,color:ci,layers:dbl?2:1,gone:false,px:0,py:0});
    }
  }
  // Scramble mostly along each block's gate axis so a reverse slide can exit;
  // occasional sideways nudge on harder levels creates ordering puzzles.
  const scramble=4+n+(sp.boss?6:0);
  for(let s=0;s<scramble;s++){
    const b=blocks[Math.floor(rnd()*blocks.length)];
    const g=gates.find(x=>x.color===b.color); if(!g) continue;
    let dr=0,dc=0;
    // push inward away from gate
    if(g.side==='L') dc=1; else if(g.side==='R') dc=-1;
    else if(g.side==='T') dr=1; else dr=-1;
    if(n>=8 && rnd()<0.35){ // sideways
      if(g.side==='L'||g.side==='R'){dr=rnd()<.5?1:-1;dc=0;}
      else {dc=rnd()<.5?1:-1;dr=0;}
    }
    let r=b.r,c=b.c,steps=0,maxStep=1+Math.floor(rnd()*(1+(n>10?2:0)));
    while(steps++<maxStep){
      const nr=r+dr,nc=c+dc;
      if(nr<0||nc<0||nr>=size||nc>=size) break;
      if(blocks.some(x=>x!==b&&x.r===nr&&x.c===nc)) break;
      r=nr;c=nc;
    }
    b.r=r;b.c=c;
  }
  // woods on empty cells (not covering all gate lanes completely)
  const woods=[];
  const empt=[];
  for(let r=0;r<size;r++) for(let c=0;c<size;c++) if(!blocks.some(b=>b.r===r&&b.c===c)) empt.push({r,c});
  for(let i=empt.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[empt[i],empt[j]]=[empt[j],empt[i]];}
  for(let i=0;i<sp.wood&&i<empt.length;i++){
    const e=empt[i];
    // avoid blocking the single cell at gate mouth if only one free path — still ok for puzzle
    woods.push({r:e.r,c:e.c});
  }
  const used=new Set(blocks.map(b=>b.r+','+b.c).concat(woods.map(w=>w.r+','+w.c)));
  const portals=[];
  let pi=0;
  for(let i=0;i<sp.portals;i++){
    const cand=empt.filter(e=>!used.has(e.r+','+e.c));
    if(cand.length<2) break;
    const a=cand[Math.floor(rnd()*cand.length)];
    const b=cand.filter(x=>x!==a)[Math.floor(rnd()*(cand.length-1))];
    if(!b) break;
    used.add(a.r+','+a.c); used.add(b.r+','+b.c);
    portals.push({r:a.r,c:a.c,pair:pi},{r:b.r,c:b.c,pair:pi}); pi++;
  }
  const rainbows=[];
  for(let i=0;i<sp.rainbow;i++){
    const cand=empt.filter(e=>!used.has(e.r+','+e.c));
    if(!cand.length) break;
    const e=cand[Math.floor(rnd()*cand.length)];
    used.add(e.r+','+e.c);
    rainbows.push({r:e.r,c:e.c,to:Math.floor(rnd()*sp.colors)});
  }
  const grid=Array.from({length:size},()=>Array(size).fill(null));
  for(const b of blocks) grid[b.r][b.c]=b;
  for(const w of woods) grid[w.r][w.c]={wood:true};
  return{size,gates,blocks,woods,portals,rainbows,grid,sp,moves:0,tool:null,freezeLeft:0,drag:null,hammersUsed:0,freezesUsed:0};
}

let state='menu', lvl=1, game=null, sparks=[], last=0;

function layout(){
  if(!game) return;
  const pad=28, top=40, bot=56;
  const avail=Math.min(W-pad*2, H-top-bot);
  game.cell=Math.floor(avail/game.size);
  game.ox=(W-game.cell*game.size)/2;
  game.oy=top+(H-top-bot-game.cell*game.size)/2;
}
function cellX(c){return game.ox+c*game.cell+game.cell/2;}
function cellY(r){return game.oy+r*game.cell+game.cell/2;}

function gatePos(g){
  const s=game.cell;
  if(g.side==='L') return {x:game.ox-s*0.55,y:game.oy+g.i*s+s/2};
  if(g.side==='R') return {x:game.ox+game.size*s+s*0.55,y:game.oy+g.i*s+s/2};
  if(g.side==='T') return {x:game.ox+g.i*s+s/2,y:game.oy-s*0.55};
  return {x:game.ox+g.i*s+s/2,y:game.oy+game.size*s+s*0.55};
}

function occupied(r,c,ignoreId){
  if(r<0||c<0||r>=game.size||c>=game.size) return 'edge';
  for(const w of game.woods) if(w.r===r&&w.c===c) return 'wood';
  for(const b of game.blocks) if(!b.gone&&b.id!==ignoreId&&b.r===r&&b.c===c) return b;
  return null;
}

function portalAt(r,c){return game.portals.find(p=>p.r===r&&p.c===c);}
function rainbowAt(r,c){return game.rainbows.find(p=>p.r===r&&p.c===c);}

function tryExit(b,dr,dc){
  // if moving off board toward matching gate
  const nr=b.r+dr, nc=b.c+dc;
  if(nr>=0&&nc>=0&&nr<game.size&&nc<game.size) return false;
  let side, idx;
  if(nc<0){side='L';idx=b.r;}
  else if(nc>=game.size){side='R';idx=b.r;}
  else if(nr<0){side='T';idx=b.c;}
  else {side='B';idx=b.c;}
  const g=game.gates.find(x=>x.side===side&&x.i===idx&&x.color===b.color);
  return !!g;
}

function slideBlock(b,dr,dc){
  if(game.freezeLeft>0 && b._frozen) return false;
  let r=b.r, c=b.c;
  let moved=false;
  while(true){
    const nr=r+dr, nc=c+dc;
    // exit?
    if(nr<0||nc<0||nr>=game.size||nc>=game.size){
      if(tryExit({r,c,color:b.color},dr,dc)){
        b.r=r; b.c=c;
        // exit clear
        if(b.layers>1){ b.layers--; beep(500,.08); toast('双层破一层'); moved=true; break; }
        b.gone=true; moved=true;
        if(FX) FX.burst(sparks, cellX(c), cellY(r), COLORS[b.color], 12);
        beep(880,.12);
        break;
      }
      break; // blocked by edge/wrong gate
    }
    const occ=occupied(nr,nc,b.id);
    if(occ) break;
    r=nr; c=nc; moved=true;
    // portal teleport
    const P=portalAt(r,c);
    if(P){
      const other=game.portals.find(p=>p.pair===P.pair&&(p.r!==P.r||p.c!==P.c));
      if(other && !occupied(other.r,other.c,b.id)){
        r=other.r; c=other.c; beep(720,.08);
      }
    }
    const R=rainbowAt(r,c);
    if(R){ b.color=R.to; beep(990,.08); toast('彩虹变色！'); }
  }
  if(moved){ b.r=r; b.c=c; game.moves++; if(game.freezeLeft>0) game.freezeLeft--; }
  return moved;
}

function useHammer(r,c){
  if(prog.hammer<=0 && game.hammersUsed>=0){ /* inventory */ }
  const wood=game.woods.findIndex(w=>w.r===r&&w.c===c);
  if(wood<0){toast('请点木挡块');return;}
  if(prog.hammer<=0){toast('没有锤子');return;}
  prog.hammer--; saveProg(prog);
  game.woods.splice(wood,1); game.hammersUsed++;
  beep(400,.1,'square'); toast('木挡清除'); updateStat();
  game.tool=null;
}
function useFreeze(){
  if(prog.freeze<=0){toast('没有冻结');return;}
  prog.freeze--; saveProg(prog);
  game.freezeLeft=3; game.freezesUsed++;
  // freeze all but allow selected — mark others
  for(const b of game.blocks) if(!b.gone) b._frozen=true;
  beep(300,.15); toast('冻结 3 步（拖一块解冻它）'); updateStat(); game.tool=null;
}

function startLevel(n){
  lvl=n; game=genLevel(n); sparks=[]; layout();
  state='play'; last=performance.now();
  show('startScr',false);show('lvlScr',false);show('shopScr',false);show('tutScr',false);show('pauseOv',false);show('overScr',false);
  updateStat(); beep(660,.1);
}

function updateStat(){
  const left=game?game.blocks.filter(b=>!b.gone).length:0;
  $('score').textContent=`关 ${lvl} · 剩 ${left} · 币 ${prog.coins}`;
  $('hint').textContent=game&&game.sp.boss?'⚠ Boss：机关更多 · 拖块出同色闸':'拖色块滑入同色闸 · 底栏锤子/冻结';
}

function checkWin(){
  if(game.blocks.every(b=>b.gone)) finishWin();
}

function starsFor(){
  const par=game.sp.blocks*3;
  if(game.moves<=par) return 3;
  if(game.moves<=par*1.6) return 2;
  return 1;
}
function finishWin(){
  state='over';
  const st=starsFor();
  const prev=prog.stars[lvl]|0;
  if(st>prev) prog.stars[lvl]=st;
  const gain=10+st*5+(game.sp.boss?20:0);
  prog.coins+=gain;
  if(lvl>=prog.unlock && lvl<TOTAL) prog.unlock=lvl+1;
  if(prog.coins>hs){hs=prog.coins;UI.storageSet(HK,hs);}
  saveProg(prog);
  $('overH').textContent=game.sp.boss?'Boss 通关！':'全部出闸！';
  $('finalScore').textContent='★'.repeat(st)+'☆'.repeat(3-st);
  $('overText').textContent=`步数 ${game.moves} · +${gain} 币 · 总币 ${prog.coins}`;
  show('overScr',true); beep(880,.15); setTimeout(()=>beep(1100,.2),120);
}
function finishLose(){
  state='over';
  $('overH').textContent='卡住了？';
  $('finalScore').textContent='🔄';
  $('overText').textContent='可以用锤子清木挡，或重开本关';
  show('overScr',true); beep(180,.3,'triangle');
}

function posOf(e){const r=cv.getBoundingClientRect();const t=(e.touches&&e.touches[0])||(e.changedTouches&&e.changedTouches[0])||e;return{x:(t.clientX-r.left)*W/r.width,y:(t.clientY-r.top)*H/r.height};}

const FINGER_OFFSET=48; // so finger doesn't cover block

function blockAt(p){
  // account for visual offset when dragging — hit test without offset
  for(let i=game.blocks.length-1;i>=0;i--){
    const b=game.blocks[i]; if(b.gone) continue;
    const x=cellX(b.c)+b.px, y=cellY(b.r)+b.py;
    if(Math.abs(p.x-x)<game.cell*0.45 && Math.abs(p.y-y)<game.cell*0.45) return b;
  }
  return null;
}

cv.addEventListener('pointerdown',e=>{
  e.preventDefault(); if(state!=='play'||!game) return;
  const p=posOf(e);
  // tools bar
  if(p.y>H-50){
    if(p.x<W/2){ game.tool=game.tool==='hammer'?null:'hammer'; toast(game.tool?'选择木挡砸掉':'锤子取消'); }
    else { useFreeze(); }
    return;
  }
  if(game.tool==='hammer'){
    const c=Math.floor((p.x-game.ox)/game.cell), r=Math.floor((p.y-game.oy)/game.cell);
    if(r>=0&&c>=0&&r<game.size&&c<game.size) useHammer(r,c);
    return;
  }
  const hit={x:p.x, y:p.y};
  const b=blockAt(hit);
  if(!b) return;
  if(b._frozen){ b._frozen=false; toast('解冻此块'); }
  game.drag={b, x0:p.x, y0:p.y, moved:false};
  cv.setPointerCapture&&cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove',e=>{
  if(!game||!game.drag) return;
  const p=posOf(e);
  const d=game.drag;
  // visual offset upward so finger doesn't cover
  d.b.px=p.x-d.x0;
  d.b.py=p.y-d.y0-FINGER_OFFSET;
  if(Math.hypot(p.x-d.x0,p.y-d.y0)>12) d.moved=true;
});
cv.addEventListener('pointerup',e=>{
  if(!game||!game.drag) return;
  const d=game.drag; const b=d.b;
  const dx=b.px, dy=b.py+FINGER_OFFSET;
  b.px=0; b.py=0; game.drag=null;
  if(!d.moved) return;
  let dr=0,dc=0;
  if(Math.abs(dx)>Math.abs(dy)) dc=dx>0?1:-1; else dr=dy>0?1:-1;
  if(slideBlock(b,dr,dc)){ updateStat(); checkWin(); }
  else beep(160,.08,'sawtooth');
});
cv.addEventListener('pointercancel',()=>{ if(game&&game.drag){ game.drag.b.px=0; game.drag.b.py=0; game.drag=null; }});

function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function draw(){
  if(FX) FX.stage(ctx,W,H,'#F9A8D4','#9D174D'); else { ctx.fillStyle='#9D174D'; ctx.fillRect(0,0,W,H); }
  if(!game){ ctx.fillStyle='#fff'; ctx.font='18px sans-serif'; ctx.textAlign='center'; ctx.fillText('选择关卡开始',W/2,H/2); return; }
  if(game.sp.boss){ ctx.fillStyle='#FFE08A'; ctx.font='bold 14px sans-serif'; ctx.textAlign='center'; ctx.fillText('👑 Boss 关',W/2,18); }
  // board
  for(let r=0;r<game.size;r++) for(let c=0;c<game.size;c++){
    const x=game.ox+c*game.cell, y=game.oy+r*game.cell;
    if(FX) FX.tile(ctx,x+2,y+2,game.cell-4,game.cell-4,'#4A1942',8);
    else { ctx.fillStyle='rgba(0,0,0,.25)'; roundRect(x+2,y+2,game.cell-4,game.cell-4,8); ctx.fill(); }
  }
  // gates
  for(const g of game.gates){
    const p=gatePos(g); const col=COLORS[g.color];
    const w=game.cell*0.7, h=game.cell*0.35;
    ctx.save();
    if(FX){ FX.glow(ctx,col,10); FX.tile(ctx,p.x-w/2,p.y-h/2,w,h,col,6); FX.noGlow(ctx); }
    else { ctx.fillStyle=col; roundRect(p.x-w/2,p.y-h/2,w,h,6); ctx.fill(); }
    ctx.fillStyle='#fff'; ctx.font=`bold ${Math.floor(game.cell*0.22)}px sans-serif`;
    ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('🚪',p.x,p.y);
    ctx.restore();
  }
  // portals
  for(const p of game.portals){
    ctx.fillStyle='#A78BFA'; ctx.font=`${Math.floor(game.cell*0.4)}px sans-serif`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('◎',cellX(p.c),cellY(p.r));
  }
  // rainbows
  for(const r of game.rainbows){
    ctx.fillStyle=COLORS[r.to]; ctx.font=`${Math.floor(game.cell*0.35)}px sans-serif`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('🌈',cellX(r.c),cellY(r.r));
  }
  // woods
  for(const w of game.woods){
    if(FX) FX.tile(ctx,game.ox+w.c*game.cell+4,game.oy+w.r*game.cell+4,game.cell-8,game.cell-8,'#92400E',6);
    else { ctx.fillStyle='#92400E'; roundRect(game.ox+w.c*game.cell+4,game.oy+w.r*game.cell+4,game.cell-8,game.cell-8,6); ctx.fill(); }
    ctx.fillStyle='#FDE68A'; ctx.font=`${Math.floor(game.cell*0.35)}px sans-serif`;
    ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('🪵',cellX(w.c),cellY(w.r));
  }
  // blocks
  for(const b of game.blocks){
    if(b.gone) continue;
    const x=cellX(b.c)+b.px-game.cell*0.38, y=cellY(b.r)+b.py-game.cell*0.38;
    const s=game.cell*0.76; const col=COLORS[b.color%COLORS.length];
    if(FX){ FX.shadow(ctx,x+s/2,y+s+4,s*0.35,5); FX.tile(ctx,x,y,s,s,col,10); }
    else { ctx.fillStyle=col; roundRect(x,y,s,s,10); ctx.fill(); }
    if(b.layers>1){
      ctx.strokeStyle='#fff'; ctx.lineWidth=3; roundRect(x+4,y+4,s-8,s-8,8); ctx.stroke();
      ctx.fillStyle='#fff'; ctx.font=`bold ${Math.floor(s*0.28)}px sans-serif`;
      ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('2',x+s/2,y+s/2);
    }
    if(b._frozen && game.freezeLeft>0){
      ctx.fillStyle='rgba(165,243,252,.45)'; roundRect(x,y,s,s,10); ctx.fill();
      ctx.fillText('❄',x+s/2,y+s/2);
    }
  }
  // tool bar
  ctx.fillStyle='rgba(0,0,0,.25)';
  roundRect(16,H-48,W/2-24,40,12); ctx.fill();
  roundRect(W/2+8,H-48,W/2-24,40,12); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='bold 14px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(`🔨×${prog.hammer}`,W/4,H-28);
  ctx.fillText(`❄×${prog.freeze}`,W*3/4,H-28);
  if(game.tool==='hammer'){ ctx.strokeStyle='#FFE08A'; ctx.lineWidth=3; roundRect(16,H-48,W/2-24,40,12); ctx.stroke(); }
  if(FX) FX.drawBurst(ctx,sparks);
}

function frame(t){ last=t; draw(); requestAnimationFrame(frame); }
draw(); requestAnimationFrame(frame);

function tutorial(pages,done){ let i=0; function render(){ $('tutH').textContent=pages[i][0]; $('tutP').innerHTML=pages[i][1]; $('tutStep').textContent=(i+1)+' / '+pages.length; $('tutNext').textContent=i<pages.length-1?'下一步':'开始挑战'; }
  show('tutScr',true); render();
  $('tutNext').onclick=()=>{ if(i<pages.length-1){i++;render();} else {show('tutScr',false);done();} };
  $('tutSkip').onclick=()=>{show('tutScr',false);done();};
}

function openLevels(){
  show('startScr',false); show('shopScr',false); show('overScr',false); show('pauseOv',false); show('tutScr',false); show('lvlScr',true);
  const stars=Object.values(prog.stars).reduce((a,b)=>a+b,0);
  $('lvlInfo').textContent=`解锁至第 ${prog.unlock} 关 · 总星 ${stars} · 金币 ${prog.coins}`;
  const g=$('lvgrid'); g.innerHTML='';
  for(let i=1;i<=TOTAL;i++){
    const b=document.createElement('button'); b.className='btn lvl';
    const locked=i>prog.unlock; const st=prog.stars[i]|0; const boss=i%5===0;
    b.innerHTML=locked?'🔒':`${boss?'👑':''}${i}<small>${'★'.repeat(st)}${'☆'.repeat(3-st)}</small>`;
    b.disabled=locked; if(!locked) b.onclick=()=>enterLevel(i);
    g.appendChild(b);
  }
}
function enterLevel(n){
  const go=()=>startLevel(n);
  if(!prog.seenTut){ prog.seenTut=1; saveProg(prog);
    tutorial([
      ['彩块出闸','拖动彩色方块，沿直线滑向棋盘边缘的同色闸门即可消除。'],
      ['阻挡','其他色块与木挡会挡住去路；只能横向或纵向滑。'],
      ['特殊','15 关起出现木挡、双层块、传送门与彩虹变色格。'],
      ['道具','锤子砸木挡，冻结可暂停干扰；金币可在商店补充。']
    ], go);
  } else go();
}
function openShop(){
  show('lvlScr',false); show('shopScr',true);
  $('coinLine').textContent='金币：'+prog.coins;
  const items=[
    {k:'hammer',name:'锤子',desc:'清除一个木挡（持有 '+prog.hammer+'）',cost:12,max:99,add:1},
    {k:'freeze',name:'冻结',desc:'冻结干扰 3 步（持有 '+prog.freeze+'）',cost:15,max:99,add:1},
  ];
  const box=$('shopList'); box.innerHTML='';
  for(const it of items){
    const row=document.createElement('div'); row.className='row';
    const left=document.createElement('div'); left.innerHTML=`<b>${it.name}</b><br><small>${it.desc}</small>`;
    const btn=document.createElement('button'); btn.className='btn'; btn.textContent=prog.coins<it.cost?'金币不足':`${it.cost}币`;
    btn.disabled=prog.coins<it.cost;
    btn.onclick=()=>{ if(prog.coins<it.cost)return; prog.coins-=it.cost; prog[it.k]+=it.add; saveProg(prog); beep(900,.1); openShop(); };
    row.appendChild(left); row.appendChild(btn); box.appendChild(row);
  }
}
function showTutOnly(){
  show('lvlScr',false);
  tutorial([
    ['彩块出闸','拖色块滑入同色闸门。'],
    ['阻挡','块与木挡互相挡住。'],
    ['特殊','双层、传送、彩虹变色。'],
    ['道具','锤子与冻结助你通关。']
  ], ()=>openLevels());
}

$('startBtn').onclick=()=>openLevels();
$('backStart').onclick=()=>{show('lvlScr',false);show('startScr',true);};
$('shopBtn').onclick=openShop; $('shopBack').onclick=()=>openLevels();
$('tutReopen').onclick=showTutOnly;
$('pauseBtn').onclick=()=>{ if(state==='play'){ state='pause'; show('pauseOv',true);} else if(state==='pause'){ state='play'; show('pauseOv',false);} };
$('resumeBtn').onclick=()=>{ state='play'; show('pauseOv',false); };
$('menuBtn').onclick=()=>{ show('pauseOv',false); state='menu'; openLevels(); };
$('againBtn').onclick=()=>startLevel(lvl);
$('nextBtn').onclick=()=>{ if(lvl<TOTAL) startLevel(lvl+1); else openLevels(); };
$('menu2Btn').onclick=()=>{ show('overScr',false); openLevels(); };
document.addEventListener('visibilitychange',()=>{ if(document.hidden && state==='play'){ state='pause'; show('pauseOv',true);} });
$('bestLine').textContent='进度：解锁 '+prog.unlock+' / '+TOTAL+' · 币 '+prog.coins;

window.__T={
  go(n){enterLevel(n);},
  win(){if(!game)return; game.blocks.forEach(b=>b.gone=true); finishWin();},
  lose(){finishLose();},
  state(){return{state,lvl,left:game&&game.blocks.filter(b=>!b.gone).length,size:game&&game.size,boss:game&&game.sp.boss,moves:game&&game.moves,woods:game&&game.woods.length};}
};
