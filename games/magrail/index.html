<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>磁轨滑行</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{display:flex;justify-content:center;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.wrap{width:100%;max-width:480px;height:100%;padding:12px;display:flex;flex-direction:column;align-items:center;gap:10px}
.topbar{width:100%;display:flex;justify-content:space-between;align-items:center;flex-wrap:nowrap!important}
.topbar .stat{display:flex;gap:8px;align-items:center;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:13px}
.topbar .tools{display:flex;gap:6px}
.topbar .tools .iconbtn{min-width:44px;min-height:44px;padding:0 6px}
.stagebox{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
#cv{touch-action:none;display:block}
.overlay{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;z-index:20;padding:24px;text-align:center}
.overlay.hidden{display:none!important}
.lvgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:100%}
.lvgrid .lvl{min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:17px;padding:4px!important;line-height:1.1}
.lvgrid .lvl small{font-size:10px;letter-spacing:-1px;margin-top:2px}
.rowbtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:100%}
#tutStep{font-size:12px;opacity:.7}
#toast{position:fixed;left:50%;top:16%;transform:translate(-50%,-10px);background:rgba(10,8,30,.88);color:#fff;font-weight:800;padding:10px 18px;border-radius:999px;z-index:999;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;font-size:15px;box-shadow:0 0 18px rgba(255,61,154,.5);white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
.hidden{display:none!important}

.pad{width:100%;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.pad button{min-height:54px;font-size:22px!important;padding:0!important}
.shop{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:100%}.shop button{min-height:48px;font-size:12px!important;padding:3px!important;line-height:1.2}
</style>
<!-- GAME UI BEGIN -->
<style>
:root{--page:#172638;--surface:#22374c;--soft:#2e4760;--ink:#f0f6fc;--muted:#b1c6d9;--accent:#f0bc74;--on-accent:#342717;--line:#45637c;--stage:#142438;--page:#0b0620;--surface:#211040;--soft:#33234f;--ink:#fff3fb;--muted:#d4b6dd;--accent:#ff3d9a;--on-accent:#0b0620;--line:#ff3d9a;--b-bg1:#3a0d5e;--b-bg2:#0b0620;--b-btn:#ff3d9a;--b-btn-hi:#ff81bd;--b-edge:#a3124f;--b-glow:#00e5ff;--b-glow-rgb:0,229,255;--b-pedge-rgb:255,61,154;--b-btn-ink:#510927;--b-btn-tsh:0 1px 0 rgba(255,255,255,.45);--b-coin-ink:#510927;--b-coin-tsh:none;--b-key-ink:#00e5ff;--b-title:#ffffff}
/* Shared presentation only; mechanics and state remain inside each standalone game. */

.game-ui body>.wrap{padding:20px 16px max(20px,env(safe-area-inset-bottom));gap:14px;max-width:500px}
.game-ui #app{background:var(--page);color:var(--ink)}
.game-ui :is(.topbar,#topbar){gap:8px;flex-wrap:wrap;min-height:58px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:10px 12px;box-shadow:0 3px 0 var(--soft);font-size:13px}
.game-ui :is(.title,.tb-title,.tb-title,#topbar .t,.topbar .t){color:var(--ink);font-size:16px;font-weight:750;letter-spacing:0}

.game-ui :is(.stat,.topbar .s,.topbar .stat,.scorebar,.stats,.tip,.hint,.hintline,.hsline,.best,.hiscore){color:var(--muted);line-height:1.7}
.game-ui :is(.hint,.hintline,.tip){font-size:12px;max-width:40em;text-wrap:pretty}
.game-ui .scorebar{padding:6px 10px;gap:8px;flex-wrap:wrap}
.game-ui :is(.iconbtn,.iconBtn,.icobtn,.ibtn,.tbtn,.hbtn,.ib,.iconBtn,.pause){min-width:44px;min-height:44px;flex-shrink:0;border-radius:12px;background:var(--soft);color:var(--ink);border:1px solid var(--line);box-shadow:none;font-size:17px}
.game-ui button{font-family:inherit;cursor:pointer;touch-action:manipulation}

.game-ui :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn){background:var(--accent);color:var(--on-accent);border:1px solid transparent;border-radius:13px;min-height:50px;padding:13px 28px;font-size:16px;font-weight:750;letter-spacing:0;box-shadow:0 4px 0 var(--line);text-shadow:none;max-width:100%}
.game-ui :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn):active{box-shadow:none;transform:translateY(2px)}
.game-ui :is(.ghost,.ghostbtn,.btn2,.abtn,.toolbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line);box-shadow:none;border-radius:12px;min-height:44px}
.game-ui :is(.rowbtns,.btnrow,.ctlrow){gap:10px;flex-wrap:wrap;justify-content:center}
.game-ui :is(.pill,.hudbox,.hud .p){background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:none;font-variant-numeric:tabular-nums}
.game-ui :is(.dbtn,.cbtn,.gbtn,.holdbtn,.firebtn,.bombbtn,.jumpbtn,.pumpbtn,.nbtn){border-radius:12px;box-shadow:0 3px 0 var(--line);min-height:44px}
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv,.screen):has(>.ui-panel){padding:20px;overflow-y:auto;overscroll-behavior:contain}
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv):has(>.ui-panel){background:var(--page);backdrop-filter:none;justify-content:safe center;align-items:center}
.game-ui .ui-panel{width:min(100%,380px);max-height:100%;overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:18px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:24px;padding:30px 24px;box-shadow:0 8px 0 var(--soft),0 20px 48px #15253618;text-align:center;margin:auto}
.game-ui .ui-panel :is(.card,.panel,.pausecard,.ovcard){display:contents}
.game-ui .ui-panel :is(h1,h2,.gamename,.gametitle){font-size:30px;line-height:1.25;font-weight:800;color:var(--ink);background:none;-webkit-text-fill-color:currentColor;text-shadow:none;letter-spacing:-.6px;margin:0}

.game-ui .ui-panel :is(.score,.bigscore,.bigScore,.scorebig){color:var(--accent);font-size:48px;font-weight:800;font-variant-numeric:tabular-nums}

.game-ui .ui-mode-status{display:block;padding:5px 10px;color:var(--accent);font-size:11px;font-weight:700;line-height:1.5;text-align:center;border:1px solid var(--line);border-radius:8px;background:var(--surface);margin:4px auto;max-width:100%;pointer-events:none}
.game-ui body>.wrap>canvas:not(#fx){background-color:var(--stage);box-shadow:0 0 0 1px var(--line),0 6px 0 var(--soft);border-radius:18px;flex-shrink:0}
.game-ui .screen>canvas.game{box-shadow:0 0 0 1px var(--line),0 6px 0 var(--soft)}
.game-ui #hud{gap:6px;background:var(--surface);color:var(--ink)}
.game-ui #hud :is(.left,.t,.s,.grp,.pill){color:var(--ink)}
.game-ui #hud .pill{background:var(--surface);border-color:var(--line)}
.game-ui body canvas:is(#cv,#game,#board){background-color:var(--stage)}
.game-ui :is(button.dbtn,button.cbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.game-ui :is(button.lvl,button.lvlbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line);border-radius:12px;min-height:54px}
.game-ui :is(button.lvl,button.lvlbtn) :is(.nc,.sz,small){color:var(--muted)}
.game-ui .ui-panel button.lvl{margin:0;min-width:44px;box-shadow:none;padding:8px}
.game-ui #hud :is(.left,.right,.hudl,.hbtns){gap:5px;flex-wrap:wrap}
.game-ui #hud :is(.left,.hudl){min-width:0;flex-shrink:1}
.game-ui #hud :is(.pill,.left){font-size:12px}
.game-ui button:disabled{cursor:default;opacity:.45;box-shadow:none}
.game-ui .ui-panel .ui-assist-note{color:var(--accent);font-weight:700}
@media(min-width:700px){.game-ui body>.wrap{padding-top:32px}.game-ui .ui-panel{padding:36px 30px}}
@media(max-width:360px){.game-ui body>.wrap{padding:10px;gap:10px}.game-ui .ui-panel{padding:22px 18px;gap:13px}.game-ui .ui-panel h1{font-size:26px}.game-ui .ui-emblem{width:70px;height:70px;font-size:38px}.game-ui :is(.topbar,#topbar){gap:5px;padding:8px}.game-ui :is(.iconbtn,.icobtn,.ibtn,.tbtn,.ib){min-width:44px;min-height:44px}}
@media(max-height:650px){.game-ui .ui-panel{padding:18px;gap:12px}.game-ui .ui-emblem{width:60px;height:60px;font-size:32px}.game-ui .ui-panel h1{font-size:25px}.game-ui .ui-panel :is(p,.howto,.sub,.rule){font-size:13px}}

/* 2026-10-20 热修：开局/结算遮罩铺满整屏，主按钮固定在面板底部，避免被画布尺寸裁切（#10） */
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv):has(>.ui-panel){position:fixed;inset:0;z-index:1000;border-radius:0;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
.game-ui .ui-panel{touch-action:pan-y}
.game-ui .ui-panel :is(#startBtn,#btnStart,.startbtn,#bStart,#restartBtn,#btnRestart,#againBtn,#btnAgain,#retryBtn,#btnRetry,#playBtn,#btnPlay){position:sticky;bottom:0;z-index:3;flex-shrink:0}
.game-ui .ui-panel :not(.card,.panel,.pausecard,.ovcard,.ui-mode):has(>:is(#startBtn,#btnStart,.startbtn,#bStart,#restartBtn,#btnRestart,#againBtn,#btnAgain,#retryBtn,#btnRetry,#playBtn,#btnPlay)){position:sticky;bottom:0;z-index:3;flex-shrink:0;background:var(--surface);box-shadow:0 -10px 10px -6px var(--surface)}


/* ===== Direction B · 霓虹糖果 Pop Arcade ===== saturated gradients, chunky bevels with a hard bottom edge, sticker panels, neon on dark themes */

      var pad = Math.ceil(r * .5) + 2, s = scaleOf(ctx);

    stage: function (ctx, w, h, top, bottom) {

    },

    glow: function (ctx, color, blur) { ctx.shadowColor = color; ctx.shadowBlur = blur; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0; },

    // Only safe where input code converts with getBoundingClientRect + logical W/H, not cv.width.
    hidpi: function (cv, ctx, w, h) {

    burst: function (list, x, y, color, n) {

    },
    drawBurst: function (ctx, list) {

    }

<script>
'use strict';
// ---- 公共小工具（内联，离线） ----
const $=id=>document.getElementById(id);
const UI=window.GameUI||{pick:a=>a,storageGet:k=>localStorage.getItem(k),storageSet:(k,v)=>localStorage.setItem(k,v)};
const FX=UI.fx&&UI.fx.on?UI.fx:null;
const GID='magrail';
const Store={get(k,d){try{const v=UI.storageGet(GID+'-'+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{UI.storageSet(GID+'-'+k,JSON.stringify(v));}catch(e){}}};
let muted=UI.storageGet(GID+'-mute')==='1',AC=null;

function setMute(m){muted=m;UI.storageSet(GID+'-mute',m?'1':'0');document.querySelectorAll('.muteBtn').forEach(b=>b.textContent=m?'🔇':'🔊');}
document.addEventListener('DOMContentLoaded',()=>{document.querySelectorAll('.muteBtn').forEach(b=>{b.textContent=muted?'🔇':'🔊';b.addEventListener('click',()=>setMute(!muted));});});
function show(id,on){const e=$(id);if(e)e.classList.toggle('hidden',!on);}

function otxt(c,s,x,y,size,color,align,weight){c.lineWidth=Math.max(2,size/5);c.strokeStyle='rgba(0,0,0,.7)';c.lineJoin='round';c.font=(weight||900)+' '+size+'px "HarmonyOS Sans SC","MiSans","Noto Sans SC","PingFang SC",system-ui,sans-serif';c.textAlign=align||'center';c.textBaseline='middle';c.strokeText(s,x,y);c.fillStyle=color||'#fff';c.fillText(s,x,y);}
function mkRng(seed){let s=seed>>>0||1;return()=>{s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

// 新手引导：pages=[[标题,说明],...]，看完后回调
function tutorial(pages,done){let i=0;const ov=$('tutScr');function render(){$('tutH').textContent=pages[i][0];$('tutP').innerHTML=pages[i][1];$('tutStep').textContent=(i+1)+' / '+pages.length;$('tutNext').textContent=i<pages.length-1?'下一步':'开始挑战';}
  $('tutNext').onclick=()=>{tone(700,.06,'triangle');if(i<pages.length-1){i++;render();}else{show('tutScr',false);done&&done();}};

// 兼容旧版最高分键 g100_<id>_hs
function legacyBest(v){const k='g100_'+GID+'_hs';let o=0;try{o=parseInt(UI.storageGet(k)||'0',10)||0;if(v!=null&&v>o){UI.storageSet(k,String(Math.round(v)));o=Math.round(v);}}catch(e){}return o;}

const W=360,H=560,PY=440;const cv=$('cv'),ctx=cv.getContext('2d');if(FX)FX.hidpi(cv,ctx,W,H);else{cv.width=W;cv.height=H;}

const UPS=[{k:'life',n:'❤️ 备用电池',d:'起始生命 +1',c:60,max:2},{k:'mag',n:'🧲 磁力线圈',d:'磁铁持续 +2 秒',c:40,max:4},{k:'shield',n:'🛡️ 护盾发生器',d:'开局自带护盾',c:80,max:1},{k:'orb',n:'🔮 能量转换',d:'能量球价值 +25%',c:50,max:4}];
let save=Store.get('save',{stars:[],orbs:0,best:0,up:{life:0,mag:0,shield:0,orb:0},tut:0});
let state='menu',si=0,S=null,endless=false,lane=1,lx=1,jumpT=0,slideT=0,inv=0,lives=3,dist=0,orbs=0,speed=300,obs=[],pw={mag:0,shield:0,boost:0},spawnD=0,boss=null,sparks=[],t=0,hits=0,FAST=false,score=0,flash=0;

function startRun(i,end){endless=!!end;si=end?Math.min(14,Math.max(0,save.stars.filter(x=>x).length-1)):i;S=end?{len:1e9,sp:300,dens:.9,boss:false,th:0}:SEC[i];lane=1;lx=1;jumpT=slideT=0;inv=0;lives=3+save.up.life;dist=0;orbs=0;speed=S.sp;obs=[];pw={mag:0,shield:save.up.shield?1:0,boost:0};spawnD=200;boss=null;t=0;hits=0;score=0;state='play';
 ['lvlScr','overScr','pauseOv','startScr'].forEach(k=>show(k,false));fit();hud();if(!FAST)toast(end?'♾ 无尽模式：能跑多远？':'区段 '+(i+1)+(S.boss?' · 👾 机甲追击！':' · 目标 '+S.len+' 米'),1800);}
function hud(){$('lvT').textContent=endless?'♾':si+1;$('orbT').textContent=save.orbs+orbs;$('lifeT').textContent=lives;}
// ---------- 生成 ----------
function spawnRow(){const d=endless?.9+dist/4000:S.dens;const r=Math.random();const lanes=[0,1,2].sort(()=>Math.random()-.5);const y=-60;
 const n=r<.18*d?2:1;const kinds=dist<300&&!endless&&si===0?['low','wall']:['low','high','wall','wall','train'];
 for(let k=0;k<n;k++){const kd=kinds[Math.random()*kinds.length|0];obs.push({l:lanes[k],y,k:kd,len:kd==='train'?170+Math.random()*120:24,done:0});}
 const free=lanes[n];if(Math.random()<.55)for(let j=0;j<4;j++)obs.push({l:free,y:y-j*45,k:'orb'});
 if(Math.random()<.07)obs.push({l:lanes[2]!=null?lanes[2]:free,y:y-200,k:['mag','shield','boost'][Math.random()*3|0]});}
function bossTick(dt){if(!S.boss)return;if(!boss&&dist>S.len*.35){boss={t:0,next:2,hp:3,y:-80};if(!FAST)toast('👾 机甲追上来了！躲开红色激光，撞上它投下的 ⚡ 线圈反击',2600);}
 if(!boss)return;boss.t+=dt;boss.y+= (60-boss.y)*dt*2;boss.next-=dt;if(boss.next<=0){const l=Math.random()*3|0;obs.push({l,y:0,k:'laser',warn:1.1,life:.5});if(Math.random()<.4)obs.push({l:(l+1+(Math.random()*2|0))%3,y:-40,k:'coil'});boss.next=Math.max(1.1,2.4-si*.06);}}
// ---------- 更新 ----------
function act(a){if(state!=='play')return;audio();if(a==='L'&&lane>0){lane--;tone(500,.04,'triangle',.04);}if(a==='R'&&lane<2){lane++;tone(500,.04,'triangle',.04);}
 if(a==='J'&&jumpT<=0&&slideT<=0){jumpT=JD;tone(400,.15,'sine',.05,800);}if(a==='S'&&slideT<=0){jumpT=0;slideT=SD;tone(300,.12,'triangle',.05,150);}}
function hurt(){if(inv>0||pw.boost>0||GOD)return;if(pw.shield){pw.shield=0;inv=1;toast('🛡️ 护盾抵挡了撞击');tone(700,.1,'square',.05);return;}lives--;hits++;inv=1.4;flash=.3;noise(.2,.15,600);if(FX)FX.burst(sparks,LX(lane),PY,'#ff4d6e',16);hud();if(lives<=0)end(false);}
function tick(dt){if(state!=='play')return;t+=dt;const sp=(endless?300+Math.min(260,dist*.05):speed+(S.boss&&boss?20:0))*(pw.boost>0?1.5:1);const dy=sp*dt;dist+=dy/10;
 lx+=(lane-lx)*Math.min(1,dt*14);if(jumpT>0)jumpT-=dt;if(slideT>0)slideT-=dt;if(inv>0)inv-=dt;if(flash>0)flash-=dt;for(const k of ['mag','boost'])if(pw[k]>0)pw[k]-=dt;
 spawnD-=dy;if(spawnD<=0&&(endless||dist<S.len-40)){spawnRow();const d=endless?.9+dist/4000:S.dens;spawnD=Math.max(120,(260-d*55)+Math.random()*90);}
 bossTick(dt);

  o.y+=dy;if(o.k==='orb'&&pw.mag>0&&Math.abs(o.y-PY)<260){o.l=lane;}
  const top=o.y-(o.k==='train'?o.len:0),hitY=PY>top-18&&PY<o.y+18;if(o.done||!hitY)continue;
  if(Math.round(lx)!==o.l&&o.k!=='orb')continue;if(o.k==='orb'&&o.l!==lane)continue;
  if(o.k==='orb'){o.done=1;orbs+=1+save.up.orb*.25;if(!FAST)tone(880+Math.random()*200,.05,'sine',.04);hud();continue;}

  if(o.k==='coil'){o.done=1;if(boss){boss.hp--;if(FX)FX.burst(sparks,W/2,80,'#ffe066',24);tone(1000,.2,'square',.06,300);toast('⚡ 击中机甲！剩余 '+boss.hp);if(boss.hp<=0){boss.dead=1;}}continue;}
  if(o.k==='low'&&air){o.done=1;continue;}if(o.k==='high'&&low){o.done=1;continue;}o.done=1;hurt();}
 obs=obs.filter(o=>o.k==='laser'?(o.warn>0||o.life>0):o.y-(o.len||0)<H+60);
 score=Math.round(dist+orbs*5);
 if(!endless&&dist>=S.len&&(!S.boss||!boss||boss.dead||dist>=S.len*1.25)){end(true);}
 if(S.boss&&boss&&boss.dead&&!endless){end(true);}}
function end(ok){if(state!=='play')return;state='over';const gained=Math.round(orbs);save.orbs+=gained;
 if(endless){save.best=Math.max(save.best,score);legacyBest(score);Store.set('save',save);hud();tone(300,.4,'sawtooth',.08,80);
  const go=()=>{$('overH').textContent='♾ 无尽模式结束';$('finalScore').textContent=Math.round(dist)+' 米';$('overText').textContent='得分 '+score+' · 最佳 '+save.best+' · 获得 🔮'+gained;$('nextBtn').classList.add('hidden');show('overScr',true);};FAST?go():setTimeout(go,600);return;}
 let st=0;if(ok){st=hits===0?3:hits<=1?2:1;if(st>(save.stars[si]||0))save.stars[si]=st;}save.best=Math.max(save.best,score);legacyBest(score);Store.set('save',save);hud();
 if(ok){tone(523,.12,'triangle');tone(784,.3,'triangle',.1,0,.15);}else tone(250,.4,'sawtooth',.08,80);
 const go=()=>{$('overH').textContent=ok?(S.boss?'👾 甩掉机甲！':'🏁 区段 '+(si+1)+' 完成'):'💥 磁轨板报废';$('finalScore').textContent=ok?starStr(st):Math.round(dist)+' / '+S.len+' 米';$('overText').textContent=(ok?'受伤 '+hits+' 次'+(st<3?'（无伤得三星）':''):'差 '+Math.max(0,Math.round(S.len-dist))+' 米')+' · 获得 🔮'+gained+'，可在区段页强化';$('nextBtn').classList.toggle('hidden',!ok||si>=SEC.length-1);show('overScr',true);};FAST?go():setTimeout(go,600);}
// ---------- 输入 ----------
$('bL').onclick=()=>act('L');$('bR').onclick=()=>act('R');$('bJ').onclick=()=>act('J');$('bS').onclick=()=>act('S');
addEventListener('keydown',e=>{const m={ArrowLeft:'L',ArrowRight:'R',ArrowUp:'J',ArrowDown:'S',a:'L',d:'R',w:'J',s:'S'}[e.key];if(m)act(m);});

cv.addEventListener('pointerup',e=>{if(!sw)return;const q=posOf(e,cv,W,H);const dx=q.x-sw.x,dy=q.y-sw.y;sw=null;if(Math.max(Math.abs(dx),Math.abs(dy))<20){act(q.x<W/2?'L':'R');return;}if(Math.abs(dx)>Math.abs(dy))act(dx>0?'R':'L');else act(dy<0?'J':'S');});
// ---------- 绘制 ----------
let off=0;
function draw(dt){const th=THEME[S?S.th:0];if(FX)FX.stage(ctx,W,H,th[0],th[1]);else{ctx.fillStyle=th[1];ctx.fillRect(0,0,W,H);}
 off=(off+(state==='play'?speed*dt:30*dt))%60;ctx.strokeStyle='rgba(255,255,255,.07)';ctx.lineWidth=1;for(let y=-60+off;y<H;y+=60){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
 for(let i=0;i<3;i++){const x=LX(i);ctx.fillStyle='rgba(255,255,255,.05)';ctx.fillRect(x-44,0,88,H);ctx.strokeStyle=th[2];ctx.globalAlpha=.55;ctx.lineWidth=3;for(const s of [-30,30]){ctx.beginPath();ctx.moveTo(x+s,0);ctx.lineTo(x+s,H);ctx.stroke();}ctx.globalAlpha=1;}
 if(!S){txt(ctx,'⚡',W/2,H/2,80);return;}
 for(const o of obs){if(o.done&&o.k!=='laser')continue;const x=LX(o.l);
  if(o.k==='laser'){if(o.warn>0){ctx.fillStyle='rgba(255,60,90,'+(.15+.2*Math.sin(performance.now()/60))+')';ctx.fillRect(x-40,0,80,H);txt(ctx,'⚠',x,PY-60,26);}else{if(FX)FX.glow(ctx,'#ff3d6e',20);ctx.fillStyle='rgba(255,80,110,.85)';ctx.fillRect(x-14,0,28,H);if(FX)FX.noGlow(ctx);}continue;}
  if(o.k==='orb'){if(FX)FX.orb(ctx,x,o.y,9,'#b65cff');else{ctx.fillStyle='#b65cff';ctx.beginPath();ctx.arc(x,o.y,9,0,7);ctx.fill();}continue;}
  if(o.k==='mag'||o.k==='shield'||o.k==='boost'||o.k==='coil'){if(FX)FX.orb(ctx,x,o.y,16,o.k==='coil'?'#ffe066':'#4fc3f7');txt(ctx,{mag:'🧲',shield:'🛡️',boost:'⚡',coil:'🌀'}[o.k],x,o.y+1,18);continue;}
  if(o.k==='low'){if(FX)FX.tile(ctx,x-38,o.y-12,76,24,'#ffc531',8);else{ctx.fillStyle='#ffc531';ctx.fillRect(x-38,o.y-12,76,24);}txt(ctx,'⤴ 跳',x,o.y+1,11,'#3b2a00');}
  else if(o.k==='high'){ctx.fillStyle='#4fc3f7';ctx.fillRect(x-40,o.y-40,8,52);ctx.fillRect(x+32,o.y-40,8,52);if(FX)FX.tile(ctx,x-40,o.y-44,80,20,'#4fc3f7',6);txt(ctx,'⤵ 滑',x,o.y-34,11,'#062a3d');}
  else if(o.k==='wall'){if(FX)FX.tile(ctx,x-36,o.y-30,72,44,'#ff4d6e',10);else{ctx.fillStyle='#ff4d6e';ctx.fillRect(x-36,o.y-30,72,44);}txt(ctx,'⛔',x,o.y-8,20);}
  else if(o.k==='train'){if(FX)FX.tile(ctx,x-38,o.y-o.len,76,o.len+14,'#7c4dff',12);else{ctx.fillStyle='#7c4dff';ctx.fillRect(x-38,o.y-o.len,76,o.len);}for(let k=o.y-o.len+20;k<o.y;k+=40){ctx.fillStyle='rgba(255,255,255,.35)';rr(ctx,x-24,k,48,18,4);ctx.fill();}}}
 if(boss&&!boss.dead){txt(ctx,'🤖',W/2,boss.y,48);ctx.fillStyle='rgba(0,0,0,.4)';rr(ctx,W/2-40,boss.y+30,80,8,4);ctx.fill();ctx.fillStyle='#ff9f43';rr(ctx,W/2-40,boss.y+30,80*boss.hp/3,8,4);ctx.fill();}
 // 玩家
 const px=W*(.2+.3*lx);const jh=jumpT>0?Math.sin((1-jumpT/JD)*Math.PI)*34:0;const sl=slideT>0;
 if(FX)FX.shadow(ctx,px,PY+18,22-jh*.2,6);ctx.globalAlpha=inv>0&&Math.sin(performance.now()/50)>0?.45:1;
 if(pw.shield){ctx.strokeStyle='rgba(120,220,255,.8)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(px,PY-jh,30,0,7);ctx.stroke();}
 if(pw.boost>0){if(FX)FX.glow(ctx,'#ffe066',25);}
 if(FX)FX.tile(ctx,px-22,PY-jh-(sl?2:14)+6,44,sl?14:22,'#2ee6a0',8);txt(ctx,sl?'🛹':'🏂',px,PY-jh-(sl?6:20),sl?22:30);if(FX)FX.noGlow(ctx);ctx.globalAlpha=1;
 if(FX)FX.drawBurst(ctx,sparks);if(flash>0){ctx.fillStyle='rgba(255,0,60,'+flash+')';ctx.fillRect(0,0,W,H);}
 // HUD
 ctx.fillStyle='rgba(0,0,0,.35)';rr(ctx,10,10,W-20,26,13);ctx.fill();if(!endless){ctx.fillStyle=th[2];rr(ctx,12,12,(W-24)*clamp(dist/S.len,0,1),22,11);ctx.fill();txt(ctx,Math.round(dist)+' / '+S.len+' 米',W/2,23,12,'#fff');}else txt(ctx,Math.round(dist)+' 米 · 得分 '+score,W/2,23,12,'#fff');
 const pws=[pw.mag>0?'🧲'+Math.ceil(pw.mag):'',pw.shield?'🛡️':'',pw.boost>0?'⚡'+Math.ceil(pw.boost):''].filter(Boolean).join(' ');if(pws)txt(ctx,pws,W/2,50,14,'#fff');
 if(si===0&&!endless&&dist<120&&state==='play')otxt(ctx,'左右滑换轨 · 上滑跳 · 下滑铲',W/2,PY+70,13,'#ffe066');}
// ---------- 菜单 ----------
function openLevels(){state='menu';['overScr','pauseOv'].forEach(i=>show(i,false));const g=$('lvgrid');g.innerHTML='';$('lvlInfo').textContent='★'+save.stars.reduce((a,b)=>a+(b||0),0)+' / 45 · 🔮'+save.orbs+' · 无尽最佳 '+Math.max(save.best,legacyBest());
 SEC.forEach((s,i)=>{const b=document.createElement('button');b.className='lvl';const open=i===0||(save.stars[i-1]||0)>0||(save.stars[i]||0)>0;b.disabled=!open;b.innerHTML=(open?(s.boss?'👾':i+1):'🔒')+'<small>'+(open?starStr(save.stars[i]||0):'')+'</small>';b.onclick=()=>{tone(660,.08,'triangle');startRun(i);};g.appendChild(b);});
 const sh=$('shop');sh.innerHTML='';for(const u of UPS){const lv=save.up[u.k],cost=u.c*(lv+1);const b=document.createElement('button');b.className='ghost';b.disabled=lv>=u.max||save.orbs<cost;b.innerHTML=u.n+' '+lv+'<br><small>'+(lv>=u.max?'已满级':u.d+' 🔮'+cost)+'</small>';b.onclick=()=>{save.orbs-=cost;save.up[u.k]++;Store.set('save',save);tone(880,.1,'triangle');openLevels();};sh.appendChild(b);}
 $('endlessBtn').disabled=!(save.stars[4]>0);$('endlessBtn').textContent=save.stars[4]>0?'♾ 无尽模式':'♾ 通关区段5解锁';show('lvlScr',true);hud();}
function showTut(done){tutorial([['⚡ 换轨','左右滑动（或点 ◀ ▶）在三条磁轨间切换，躲开 ⛔ 路障和长长的 🟪 磁轨列车。'],['⤴⤵ 跳与滑','黄色低栏要 ⤴ 跳过，蓝色高门要 ⤵ 滑铲通过。'],['🔮 道具','收集能量球强化装备；🧲 磁铁吸球、🛡️ 护盾挡一次、⚡ 冲刺无敌。'],['👾 机甲追击','第 5/10/15 区段机甲会发射激光（先出现 ⚠ 预警），撞上 🌀 线圈能反击它，击中 3 次就赢！']],done);}
$('howBtn').onclick=()=>{show('lvlScr',false);showTut(openLevels);};$('endlessBtn').onclick=()=>startRun(0,1);
$('startBtn').onclick=()=>{audio();show('startScr',false);if(!save.tut){showTut(()=>{save.tut=1;Store.set('save',save);startRun(0);});}else openLevels();};
$('bestLine').textContent='最佳 '+Math.max(save.best,legacyBest());
function pause(){if(state==='play'){state='pause';show('pauseOv',true);}}
$('pauseBtn').onclick=pause;$('resumeBtn').onclick=()=>{show('pauseOv',false);state='play';last=performance.now();};$('restartBtn').onclick=()=>startRun(si,endless);$('menuBtn').onclick=openLevels;
$('nextBtn').onclick=()=>startRun(si+1);$('againBtn').onclick=()=>startRun(si,endless);$('menu2Btn').onclick=openLevels;
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
let last=performance.now();function frame(tm){const dt=Math.min(.04,(tm-last)/1000);last=tm;tick(dt);draw(dt);requestAnimationFrame(frame);}
fit();requestAnimationFrame(frame);
let GOD=false;window.__mg={god:v=>GOD=v,SEC,startRun,act,tick,setFast:v=>FAST=v,get s(){return{state,si,dist,lives,hits,lane,len:S&&S.len,boss:boss&&{hp:boss.hp,dead:boss.dead}}},obs:()=>obs,save:()=>save,PY};
</script>
