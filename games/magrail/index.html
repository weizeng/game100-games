<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>磁轨滑行</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#05050c}
body{font-family:system-ui,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:#eaf6ff;touch-action:none;user-select:none;-webkit-user-select:none}
#wrap{position:relative;max-width:480px;height:100dvh;margin:0 auto;overflow:hidden;background:#06060f}
#top{position:absolute;top:0;left:0;right:0;bottom:106px}
#cv{position:absolute;top:0;left:0;display:block;touch-action:none}
#hud{position:absolute;top:0;left:0;right:0;padding:10px 12px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:5}
#hud .left{text-shadow:0 0 8px #2de2ff}
#score{font-size:26px;font-weight:800;color:#fff}
#dist{font-size:12px;color:#9fd8ff;margin-top:2px}
#lives{font-size:20px;letter-spacing:2px;padding-top:6px;text-shadow:0 0 8px #ff2d55}
#corner{position:absolute;top:64px;right:10px;display:flex;gap:8px;z-index:7}
.iconbtn{min-width:48px;min-height:48px;font-size:22px;border-radius:12px;border:1px solid rgba(45,226,255,.4);background:rgba(10,16,32,.85);color:#eaf6ff;touch-action:none}
.iconbtn:active{background:#1b2b4d}
#controls{position:absolute;bottom:0;left:0;right:0;height:106px;display:flex;gap:8px;padding:10px 12px 16px;background:rgba(4,4,12,.72);z-index:6}
.ctl{flex:1;min-height:64px;font-size:28px;border-radius:14px;border:1px solid rgba(45,226,255,.45);background:#0d1526;color:#aef;touch-action:none;cursor:pointer}
.ctl:active{background:#1e3a66;transform:scale(.96)}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(4,4,14,.9);z-index:20;text-align:center;padding:24px}
.title{font-size:44px;font-weight:900;letter-spacing:6px;color:#fff;text-shadow:0 0 18px #ffab00,0 0 42px #ffab00;margin-bottom:8px}
.sub{font-size:15px;color:#ffd166;margin-bottom:18px}
.how{background:rgba(13,21,38,.85);border:1px solid rgba(45,226,255,.35);border-radius:14px;padding:14px 18px;margin-bottom:20px;font-size:14px;line-height:2;text-align:left;max-width:340px}
.how b{color:#fff}
.btn{min-height:56px;padding:0 40px;font-size:21px;font-weight:800;border-radius:16px;border:none;color:#1a0e00;background:linear-gradient(180deg,#ffd166,#ffab00);box-shadow:0 0 22px rgba(255,171,0,.65);touch-action:none;cursor:pointer}
.btn:active{transform:scale(.96)}
.hs{margin-top:14px;font-size:14px;color:#9fd8ff}
.stat{font-size:17px;margin:5px 0;color:#cfe9ff}
.stat b{color:#ffd166;font-size:24px}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="wrap">
  <div id="top"><canvas id="cv"></canvas></div>
  <div id="hud">
    <div class="left"><div id="score">0</div><div id="dist">0 m</div></div>
    <div id="lives">❤❤❤</div>
  </div>
  <div id="corner">
    <button id="mutebtn" class="iconbtn">🔊</button>
    <button id="pausebtn" class="iconbtn">⏸</button>
  </div>
  <div id="controls">
    <button id="btnl" class="ctl">◀</button>
    <button id="btnr" class="ctl">▶</button>
    <button id="btnu" class="ctl">⤴</button>
    <button id="btnd" class="ctl">⤵</button>
  </div>
  <div id="startov" class="overlay">
    <div class="title">磁轨滑行</div>
    <div class="sub">⚡ 三轨霓虹疾驰 · 无限跑酷 ⚡</div>
    <div class="how">
      <p>🟥 <b>高栏</b> —— ⤴ / 上滑 / ↑ 跳跃越过</p>
      <p>🟦 <b>低门</b> —— ⤵ / 下滑 / ↓ 滑铲穿过</p>
      <p>🟪 <b>封锁墙</b> —— ◀ ▶ / 左右滑 / ← → 提前换轨</p>
      <p>⚡ <b>能量块</b> —— 收集 +10 分</p>
      <p>❤ 3 次受伤机会 · 存活越久速度越快</p>
    </div>
    <button id="startBtn" class="btn">开始滑行</button>
    <div class="hs">最高分 <span id="menuhs">0</span></div>
  </div>
  <div id="pauseov" class="overlay hidden">
    <div class="title" style="font-size:34px">已暂停</div>
    <div class="sub">磁轨已冻结，随时回来继续</div>
    <button id="resumebtn" class="btn">继续</button>
  </div>
  <div id="overov" class="overlay hidden">
    <div class="title" style="font-size:34px">滑行结束</div>
    <div class="stat">得分 <b id="finalscore">0</b></div>
    <div class="stat">最高分 <b id="finalbest">0</b></div>
    <div class="stat">距离 <span id="finaldist">0</span> m · 收集 <span id="finalorb">0</span> ⚡</div>
    <div style="height:18px"></div>
    <button id="retrybtn" class="btn">再来一次</button>
  </div>
</div>
<script>'use strict';
var cv=document.getElementById('cv');
var ctx=cv.getContext('2d');
var dpr=Math.min(window.devicePixelRatio||1,2);
var vw=420,vh=700;
var HSKEY='g100_magrail_hs';
var MUTEKEY='g100_mute';
var JUMP_DUR=0.6,SLIDE_DUR=0.6;
var state='start';
var lane=1,fx=1,tilt=0;
var jumpT=0,slideT=0,invulnT=0,flashT=0;
var lives=3,score=0,dist=0,orbs=0,elapsed=0,speed=340;
var spawnT=1,lastWallT=-10,gridOff=0,trailT=0,lineT=0;
var obs=[],parts=[],slines=[];
var rafId=0,lastT=0;
var muted=false;
try{muted=localStorage.getItem(MUTEKEY)==='1';}catch(e){muted=false;}
var AC=null;
function laneX(i){return vw*(0.22+0.28*i);}
function playerY(){return vh-150;}
function jumpH(){
  if(jumpT<=0)return 0;
  var e=JUMP_DUR-jumpT;
  return 110*Math.sin(Math.PI*e/JUMP_DUR);
}
function vibrate(ms){try{if(navigator.vibrate)navigator.vibrate(ms);}catch(e){}}
function audio(){
  if(!AC){
    var C=window.AudioContext||window.webkitAudioContext;
    if(C)AC=new C();
  }
  if(AC&&AC.state==='suspended')AC.resume();
  return AC;
}
function tone(f0,f1,dur,type,vol){
  if(muted)return;
  try{
    var ac=audio();if(!ac)return;
    var o=ac.createOscillator(),g=ac.createGain();
    o.type=type;
    o.frequency.setValueAtTime(f0,ac.currentTime);
    o.frequency.exponentialRampToValueAtTime(Math.max(f1,1),ac.currentTime+dur);
    g.gain.setValueAtTime(vol,ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+dur);
    o.connect(g);g.connect(ac.destination);
    o.start();o.stop(ac.currentTime+dur+0.03);
  }catch(e){}
}
function sfx(name){
  if(muted)return;
  if(name==='jump')tone(300,720,0.18,'square',0.14);
  else if(name==='slide')tone(520,140,0.2,'sawtooth',0.12);
  else if(name==='collect'){tone(880,880,0.08,'sine',0.2);setTimeout(function(){tone(1318,1318,0.12,'sine',0.2);},70);}
  else if(name==='hit'){tone(220,40,0.3,'sawtooth',0.25);tone(130,30,0.35,'square',0.2);}
  else if(name==='lane')tone(420,640,0.07,'triangle',0.12);
}
function resize(){
  var top=document.getElementById('top');
  var r=top.getBoundingClientRect();
  vw=Math.max(280,r.width);vh=Math.max(420,r.height);
  cv.width=Math.round(vw*dpr);cv.height=Math.round(vh*dpr);
  cv.style.width=vw+'px';cv.style.height=vh+'px';
  draw();
}
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function burst(x,y,color,n,spd){
  for(var i=0;i<n;i++){
    var a=Math.random()*Math.PI*2,s=spd*(0.4+Math.random());
    parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-60,life:0.5+Math.random()*0.3,maxLife:0.8,size:2+Math.random()*3,color:color,text:null});
  }
}
function floatText(x,y,txt,color){
  parts.push({x:x,y:y,vx:0,vy:-70,life:0.9,maxLife:0.9,size:17,color:color,text:txt});
}
function updateParts(dt){
  for(var i=parts.length-1;i>=0;i--){
    var p=parts[i];
    p.life-=dt;
    if(p.life<=0){parts.splice(i,1);continue;}
    p.x+=p.vx*dt;p.y+=p.vy*dt;
    if(!p.text)p.vy+=320*dt;
  }
}
function rndLane(){return Math.floor(Math.random()*3);}
function spawnOrbRow(L){
  for(var j=0;j<3;j++)obs.push({lane:L,y:-70-j*70,type:'orb',done:false});
}
function spawnRow(){
  var t=elapsed,tier=Math.floor(t/10);
  var n=1+(Math.random()<Math.min(0.15+tier*0.12,0.6)?1:0);
  var order=[0,1,2].sort(function(){return Math.random()-0.5;});
  for(var k=0;k<n;k++){
    var L=order[k],r=Math.random(),type;
    if(t<10){type=r<0.5?'orbRow':'bar';}
    else if(t<25){type=r<0.3?'orbRow':(r<0.55?'bar':'gate');}
    else{
      if(elapsed-lastWallT>1.4&&Math.random()<0.25){type='wall';lastWallT=elapsed;}
      else type=r<0.25?'orbRow':(r<0.55?'bar':'gate');
    }
    if(type==='orbRow')spawnOrbRow(L);
    else obs.push({lane:L,y:-70,type:type,done:false});
  }
  if(Math.random()<0.3)spawnOrbRow(rndLane());
}
function curLane(){return Math.max(0,Math.min(2,Math.round(fx)));}
function collectOrb(o){
  score+=10;orbs++;
  sfx('collect');vibrate(20);
  var x=laneX(o.lane);
  burst(x,o.y,'#ffd166',14,220);
  floatText(x,o.y-20,'+10','#ffd166');
}
function hit(o){
  if(invulnT>0)return;
  lives--;invulnT=1;flashT=0.3;
  sfx('hit');vibrate(150);
  burst(laneX(o.lane),playerY(),'#ff5d5d',18,260);
  if(lives<=0)gameOver();
}
function checkColl(o){
  if(o.done)return;
  var py=playerY();
  if(Math.abs(o.y-py)>44)return;
  if(curLane()!==o.lane)return;
  if(o.type==='orb'){o.done=true;collectOrb(o);return;}
  var jh=jumpH();
  if(o.type==='bar'){if(jh>34)o.done=true;else hit(o);}
  else if(o.type==='gate'){if(slideT>0)o.done=true;else hit(o);}
  else if(o.type==='wall'){hit(o);}
}
function moveLane(d){
  if(state!=='play')return;
  var nl=Math.max(0,Math.min(2,lane+d));
  if(nl!==lane){lane=nl;sfx('lane');}
}
function doJump(){
  if(state!=='play')return;
  if(jumpT<=0){jumpT=JUMP_DUR;slideT=0;sfx('jump');vibrate(20);}
}
function doSlide(){
  if(state!=='play')return;
  if(slideT<=0){slideT=SLIDE_DUR;jumpT=0;sfx('slide');vibrate(20);}
}
function update(dt){
  elapsed+=dt;
  var tier=Math.floor(elapsed/10);
  speed=Math.min(340+tier*55,780);
  score+=speed*dt*0.03;
  dist+=speed*dt*0.06;
  gridOff+=speed*dt;
  spawnT-=dt;
  if(spawnT<=0){
    spawnRow();
    var base=Math.max(1.05-tier*0.09,0.42);
    spawnT=base*(0.8+Math.random()*0.4);
  }
  for(var i=obs.length-1;i>=0;i--){
    var o=obs[i];
    o.y+=speed*dt;
    if(o.y>vh+90){obs.splice(i,1);continue;}
    checkColl(o);
  }
  if(jumpT>0)jumpT-=dt;
  if(slideT>0)slideT-=dt;
  if(invulnT>0)invulnT-=dt;
  if(flashT>0)flashT-=dt;
  var kf=Math.min(1,dt*14);
  fx+=(lane-fx)*kf;
  tilt+=((lane-fx)*0.6-tilt)*Math.min(1,dt*10);
  trailT-=dt;
  if(trailT<=0){
    parts.push({x:laneX(fx)+(Math.random()*24-12),y:playerY()+10,vx:Math.random()*40-20,vy:80+Math.random()*60,life:0.4,maxLife:0.4,size:2+Math.random()*2.5,color:'#22d3ee',text:null});
    trailT=0.03;
  }
  lineT-=dt;
  if(lineT<=0){
    slines.push({x:Math.random()*vw,y:-40,len:30+Math.random()*60});
    lineT=0.06;
  }
  for(var s=slines.length-1;s>=0;s--){
    slines[s].y+=speed*1.7*dt;
    if(slines[s].y>vh+60)slines.splice(s,1);
  }
  updateParts(dt);
  updateHud();
}
function drawBg(){
  var g=ctx.createLinearGradient(0,0,0,vh);
  g.addColorStop(0,'#04040c');g.addColorStop(0.6,'#0a0a1c');g.addColorStop(1,'#12081f');
  ctx.fillStyle=g;ctx.fillRect(0,0,vw,vh);
  ctx.strokeStyle='rgba(80,120,255,0.10)';ctx.lineWidth=1;
  var off=gridOff%150,y;
  for(y=-150+off;y<vh;y+=150){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(vw,y);ctx.stroke();}
  ctx.lineWidth=3;
  for(var i=0;i<3;i++){
    var x=laneX(i);
    ctx.strokeStyle='rgba(45,226,255,0.55)';
    ctx.shadowColor='#2de2ff';ctx.shadowBlur=12;
    ctx.setLineDash([26,20]);ctx.lineDashOffset=-gridOff;
    ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,vh);ctx.stroke();
  }
  ctx.setLineDash([]);ctx.shadowBlur=0;
  var sg=ctx.createLinearGradient(0,0,vw,0);
  sg.addColorStop(0,'rgba(192,38,211,0.20)');sg.addColorStop(0.12,'rgba(192,38,211,0)');
  sg.addColorStop(0.88,'rgba(192,38,211,0)');sg.addColorStop(1,'rgba(192,38,211,0.20)');
  ctx.fillStyle=sg;ctx.fillRect(0,0,vw,vh);
}
function drawSLines(){
  ctx.strokeStyle='rgba(160,220,255,0.35)';ctx.lineWidth=2;
  for(var i=0;i<slines.length;i++){
    var s=slines[i];
    ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(s.x,s.y+s.len);ctx.stroke();
  }
}
function drawObs(o){
  var x=laneX(o.lane),y=o.y,i;
  ctx.save();
  if(o.type==='bar'){
    ctx.shadowColor='#ff2d55';ctx.shadowBlur=16;
    ctx.fillStyle='#ff2d55';
    roundRect(x-52,y-9,104,18,8);ctx.fill();
    ctx.shadowBlur=0;ctx.fillStyle='#7a0f22';
    roundRect(x-58,y-28,10,56,4);ctx.fill();
    roundRect(x+48,y-28,10,56,4);ctx.fill();
    ctx.fillStyle='#ffd166';ctx.font='bold 15px sans-serif';ctx.textAlign='center';
    ctx.fillText('▲',x,y-20);
  }else if(o.type==='gate'){
    ctx.shadowColor='#22d3ee';ctx.shadowBlur=16;
    ctx.strokeStyle='#22d3ee';ctx.lineWidth=8;
    ctx.strokeRect(x-52,y-64,104,56);
    ctx.shadowBlur=0;
    ctx.fillStyle='#ffd166';ctx.font='bold 15px sans-serif';ctx.textAlign='center';
    ctx.fillText('▼',x,y+34);
  }else if(o.type==='wall'){
    ctx.shadowColor='#c026d3';ctx.shadowBlur=20;
    var g=ctx.createLinearGradient(x-56,0,x+56,0);
    g.addColorStop(0,'#7e22ce');g.addColorStop(0.5,'#c026d3');g.addColorStop(1,'#7e22ce');
    ctx.fillStyle=g;
    roundRect(x-56,y-66,112,132,10);ctx.fill();
    ctx.shadowBlur=0;ctx.fillStyle='rgba(0,0,0,0.35)';
    for(i=-2;i<=2;i++){
      ctx.save();ctx.translate(x,y+i*26-52);ctx.rotate(0.5);ctx.fillRect(-56,-6,112,12);ctx.restore();
    }
    ctx.fillStyle='#ffffff';ctx.font='bold 16px sans-serif';ctx.textAlign='center';
    ctx.fillText('封锁',x,y+6);
  }else if(o.type==='orb'){
    ctx.shadowColor='#ffd166';ctx.shadowBlur=18;
    ctx.fillStyle='#ffab00';
    ctx.beginPath();ctx.arc(x,y,14,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;ctx.fillStyle='#fff8e1';
    ctx.beginPath();
    ctx.moveTo(x+2,y-9);ctx.lineTo(x-5,y+1);ctx.lineTo(x-1,y+1);
    ctx.lineTo(x-3,y+9);ctx.lineTo(x+5,y-1);ctx.lineTo(x+1,y-1);
    ctx.closePath();ctx.fill();
  }
  ctx.restore();
}
function drawPlayer(){
  var x=laneX(fx),y=playerY()-jumpH();
  var sq=slideT>0?1-0.45*Math.sin(Math.PI*(SLIDE_DUR-slideT)/SLIDE_DUR):1;
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(tilt*0.5);
  if(invulnT>0&&Math.floor(invulnT*14)%2===0)ctx.globalAlpha=0.35;
  ctx.scale(1,Math.max(sq,0.4));
  ctx.shadowColor='#22d3ee';ctx.shadowBlur=22;
  ctx.fillStyle='#0e7490';
  roundRect(-34,-10,68,20,10);ctx.fill();
  ctx.shadowBlur=0;ctx.fillStyle='#67e8f9';
  roundRect(-34,-10,68,6,3);ctx.fill();
  ctx.shadowColor='#e879f9';ctx.shadowBlur=14;
  ctx.fillStyle='#e879f9';
  ctx.beginPath();ctx.arc(0,-22,10,0,Math.PI*2);ctx.fill();
  ctx.restore();
}
function drawParts(){
  for(var i=0;i<parts.length;i++){
    var p=parts[i],a=Math.max(p.life/p.maxLife,0);
    if(p.text){
      ctx.globalAlpha=a;
      ctx.fillStyle=p.color;
      ctx.font='bold '+p.size+'px sans-serif';
      ctx.textAlign='center';
      ctx.fillText(p.text,p.x,p.y);
      ctx.globalAlpha=1;
    }else{
      ctx.globalAlpha=a;
      ctx.fillStyle=p.color;
      ctx.shadowColor=p.color;ctx.shadowBlur=8;
      ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();
      ctx.shadowBlur=0;ctx.globalAlpha=1;
    }
  }
}
function draw(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  drawBg();
  drawSLines();
  var i;
  for(i=0;i<obs.length;i++)drawObs(obs[i]);
  if(state==='play'||state==='pause')drawPlayer();
  drawParts();
  if(flashT>0){
    ctx.fillStyle='rgba(255,30,60,'+Math.min(flashT*1.6,0.5)+')';
    ctx.fillRect(0,0,vw,vh);
  }
}
function updateHud(){
  document.getElementById('score').textContent=Math.floor(score);
  document.getElementById('dist').textContent=Math.floor(dist)+' m';
  var h='';
  for(var i=0;i<3;i++)h+=(i<lives?'❤':'🖤');
  document.getElementById('lives').textContent=h;
}
function getBest(){
  try{return parseInt(localStorage.getItem(HSKEY)||'0',10)||0;}catch(e){return 0;}
}
function setBest(v){
  try{localStorage.setItem(HSKEY,String(v));}catch(e){}
}
function show(id){document.getElementById(id).classList.remove('hidden');}
function hide(id){document.getElementById(id).classList.add('hidden');}
function reset(){
  lane=1;fx=1;tilt=0;
  jumpT=0;slideT=0;invulnT=0;flashT=0;
  lives=3;score=0;dist=0;orbs=0;elapsed=0;speed=340;
  spawnT=0.8;lastWallT=-10;gridOff=0;trailT=0;lineT=0;
  obs=[];parts=[];slines=[];
  updateHud();
}
function loop(t){
  if(state!=='play')return;
  var dt=Math.min((t-lastT)/1000,0.05);
  lastT=t;
  update(dt);
  draw();
  rafId=requestAnimationFrame(loop);
}
function startGame(){
  audio();
  reset();
  hide('startov');hide('overov');hide('pauseov');
  state='play';
  lastT=performance.now();
  cancelAnimationFrame(rafId);
  rafId=requestAnimationFrame(loop);
}
function pauseGame(){
  if(state!=='play')return;
  state='pause';
  cancelAnimationFrame(rafId);
  show('pauseov');
}
function resumeGame(){
  if(state!=='pause')return;
  hide('pauseov');
  state='play';
  lastT=performance.now();
  rafId=requestAnimationFrame(loop);
}
function gameOver(){
  state='over';
  cancelAnimationFrame(rafId);
  var s=Math.floor(score),best=getBest();
  if(s>best){best=s;setBest(best);}
  document.getElementById('finalscore').textContent=s;
  document.getElementById('finalbest').textContent=best;
  document.getElementById('finaldist').textContent=Math.floor(dist);
  document.getElementById('finalorb').textContent=orbs;
  show('overov');
}
function toggleMute(){
  muted=!muted;
  try{localStorage.setItem(MUTEKEY,muted?'1':'0');}catch(e){}
  document.getElementById('mutebtn').textContent=muted?'🔇':'🔊';
}
function bindBtn(id,fn){
  var el=document.getElementById(id);
  el.addEventListener('pointerdown',function(e){e.preventDefault();fn();});
}
function swipe(dx,dy){
  if(Math.abs(dx)<24&&Math.abs(dy)<24)return;
  if(Math.abs(dx)>Math.abs(dy))moveLane(dx>0?1:-1);
  else if(dy<0)doJump();
  else doSlide();
}
document.getElementById('startBtn').addEventListener('click',startGame);
document.getElementById('retrybtn').addEventListener('click',startGame);
document.getElementById('resumebtn').addEventListener('click',resumeGame);
document.getElementById('pausebtn').addEventListener('click',function(){
  if(state==='play')pauseGame();else if(state==='pause')resumeGame();
});
document.getElementById('mutebtn').addEventListener('click',toggleMute);
bindBtn('btnl',function(){moveLane(-1);});
bindBtn('btnr',function(){moveLane(1);});
bindBtn('btnu',doJump);
bindBtn('btnd',doSlide);
var tsx=0,tsy=0,touching=false;
cv.addEventListener('touchstart',function(e){
  e.preventDefault();
  var t=e.changedTouches[0];
  tsx=t.clientX;tsy=t.clientY;touching=true;
},{passive:false});
cv.addEventListener('touchend',function(e){
  e.preventDefault();
  if(!touching)return;
  touching=false;
  var t=e.changedTouches[0];
  swipe(t.clientX-tsx,t.clientY-tsy);
},{passive:false});
var psx=0,psy=0,ptouching=false;
cv.addEventListener('pointerdown',function(e){
  if(e.pointerType!=='mouse')return;
  psx=e.clientX;psy=e.clientY;ptouching=true;
});
cv.addEventListener('pointerup',function(e){
  if(e.pointerType!=='mouse'||!ptouching)return;
  ptouching=false;
  swipe(e.clientX-psx,e.clientY-psy);
});
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowLeft'){e.preventDefault();moveLane(-1);}
  else if(e.key==='ArrowRight'){e.preventDefault();moveLane(1);}
  else if(e.key==='ArrowUp'){e.preventDefault();doJump();}
  else if(e.key==='ArrowDown'){e.preventDefault();doSlide();}
  else if(e.key==='p'||e.key==='P'){
    if(state==='play')pauseGame();else if(state==='pause')resumeGame();
  }
});
document.addEventListener('touchmove',function(e){e.preventDefault();},{passive:false});
document.addEventListener('contextmenu',function(e){e.preventDefault();});
document.addEventListener('visibilitychange',function(){
  if(document.hidden)pauseGame();
});
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){setTimeout(resize,200);});
document.getElementById('mutebtn').textContent=muted?'🔇':'🔊';
document.getElementById('menuhs').textContent=getBest();
resize();
</script>
</body>
</html>
