<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>海战棋 · 游戏100</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#121212;color:#f2f2f2;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;display:flex;justify-content:center;overscroll-behavior:none}
#app{width:100%;max-width:480px;min-height:100vh;position:relative;display:flex;flex-direction:column;background:radial-gradient(900px 480px at 50% -8%,rgba(91,141,239,.13),transparent 60%),radial-gradient(700px 500px at 90% 110%,rgba(46,204,113,.08),transparent 60%),#121212;overflow:hidden}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;z-index:20}
.tb-title{font-size:14px;font-weight:700;color:#cfcfcf;letter-spacing:1px}
.tb-right{display:flex;gap:8px}
.iconbtn{width:38px;height:38px;border-radius:12px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .1s}
.iconbtn:active{transform:scale(.88)}
.screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;gap:12px;text-align:center;z-index:10}
.hidden{display:none!important}
.bigemoji{font-size:64px;filter:drop-shadow(0 6px 16px rgba(0,0,0,.5));animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.gamename{font-size:28px;font-weight:800;background:linear-gradient(135deg,#9fc2ff,#5b8def);-webkit-background-clip:text;background-clip:text;color:transparent}
.howto{font-size:13.5px;line-height:1.8;color:#bdbdbd;max-width:350px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:12px 16px}
.btn{background:linear-gradient(135deg,#5b8def,#3a6fd8);border:none;color:#fff;font-size:17px;font-weight:800;padding:13px 46px;border-radius:999px;cursor:pointer;box-shadow:0 8px 24px rgba(91,141,239,.35);transition:transform .1s;letter-spacing:2px}
.btn:active{transform:scale(.93)}
.btn.ghost{background:rgba(255,255,255,.08);box-shadow:none;border:1px solid rgba(255,255,255,.16)}
.btn.small{font-size:14px;padding:9px 26px;letter-spacing:1px}
.hsline{font-size:13px;color:#ffd76a}
.hud{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap}
.pill{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:700}
#fx{position:absolute;inset:0;pointer-events:none;z-index:50}
.float-txt{position:absolute;transform:translate(-50%,-50%);font-weight:800;font-size:20px;pointer-events:none;z-index:60;text-shadow:0 2px 8px rgba(0,0,0,.6);animation:floatUp 1.1s ease-out forwards}
@keyframes floatUp{to{transform:translate(-50%,-160%);opacity:0}}
#pauseOv{position:absolute;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(4px);z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
#pauseOv .btn{font-size:15px;padding:11px 34px}
.endstats{font-size:15px;line-height:2.1;color:#ddd}
.endstats b{color:#ffd76a;font-size:22px}
.msg{min-height:22px;font-size:13.5px;color:#ffd76a;font-weight:700}
.boardlabel{font-size:13px;font-weight:700;color:#9fc2ff;margin-top:2px}
#enemyBoard{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;width:min(320px,86vw);touch-action:manipulation}
#ownBoard{display:grid;grid-template-columns:repeat(10,1fr);gap:1px;width:min(200px,54vw)}
.cell{aspect-ratio:1;border-radius:3px;background:linear-gradient(135deg,#1d3a5f,#16294a);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;transition:transform .08s}
.cell:active{transform:scale(.92)}
.cell.miss{background:#22303f;cursor:default}
.cell.hit{background:radial-gradient(circle,#ff9a5c,#c0392b);cursor:default;animation:hitpop .3s}
.cell.sunk{background:#5b1a1a;cursor:default;box-shadow:inset 0 0 0 2px #ff6b6b}
@keyframes hitpop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
#ownBoard .cell{cursor:default;font-size:10px;border-radius:2px}
#ownBoard .cell.ship{background:linear-gradient(135deg,#4a5a75,#33405a)}
#ownBoard .cell.miss{background:#1c2733}
#ownBoard .cell.hit{background:radial-gradient(circle,#ff9a5c,#c0392b)}
#ownBoard .cell.sunk{background:#5b1a1a;box-shadow:inset 0 0 0 1px #ff6b6b}
.turndot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#2ecc71;margin-right:4px;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.3}}
.cell.hintshot{animation:hintpulse .8s ease-in-out 4}
@keyframes hintpulse{0%,100%{box-shadow:inset 0 0 0 2px rgba(255,215,106,.6)}50%{box-shadow:inset 0 0 0 4px #ffd76a,0 0 18px rgba(255,215,106,.9)}}
#hintToast{position:fixed;top:64px;left:50%;transform:translateX(-50%);max-width:88vw;background:rgba(20,22,34,.96);border:1px solid rgba(255,215,106,.55);color:#ffe9a8;font-size:13px;line-height:1.7;padding:10px 16px;border-radius:12px;z-index:90;display:none;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.5)}
#hintToast.show{display:block;animation:toastin .25s}
@keyframes toastin{from{opacity:0;transform:translate(-50%,-8px)}to{opacity:1;transform:translate(-50%,0)}}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="tb-title">🚢 海战棋</div>
    <div class="tb-right">
      <div class="iconbtn" id="hintBtn">💡</div>
      <div class="iconbtn" id="soundBtn">🔊</div>
      <div class="iconbtn hidden" id="pauseBtn">⏸</div>
    </div>
  </div>
  <div class="screen" id="scrStart">
    <div class="bigemoji">🚢</div>
    <div class="gamename">海战棋</div>
    <div class="howto">10×10 海域，双方各 <strong style="color:#fff">5 艘战舰</strong>（5/4/3/3/2 格）。<br>点击敌方海域开火：💥 击中 · ⚪ 未命中。<br>先击沉对方全部战舰者获胜！<br>AI 会<strong style="color:#fff">追击</strong>命中点周围格子，小心布阵。</div>
    <button class="btn" id="startBtn">开始布阵</button>
    <div class="hsline" id="startHs"></div>
  </div>
  <div class="screen hidden" id="scrDeploy" style="justify-content:flex-start;padding-top:10px">
    <div class="boardlabel">🛡️ 我的舰队（点击重新布阵可换位置）</div>
    <div id="deployBoard" style="display:grid;grid-template-columns:repeat(10,1fr);gap:2px;width:min(320px,86vw)"></div>
    <div class="hud" style="margin-top:8px">
      <button class="btn small ghost" id="reshuffleBtn">🎲 重新布阵</button>
      <button class="btn small" id="battleBtn">⚔️ 开战</button>
    </div>
    <div class="msg" id="deployMsg"></div>
  </div>
  <div class="screen hidden" id="scrGame" style="justify-content:flex-start;padding-top:6px">
    <div class="hud">
      <div class="pill"><span class="turndot" id="turnDot"></span><span id="turnTxt">你的回合</span></div>
      <div class="pill">敌舰剩余 <span id="enemyLeft" style="color:#ff6b6b">5</span></div>
      <div class="pill">我舰剩余 <span id="ownLeft" style="color:#7ee2a8">5</span></div>
    </div>
    <div class="boardlabel">🎯 敌方海域（点击开火）</div>
    <div id="enemyBoard"></div>
    <div class="boardlabel">🛡️ 我方海域</div>
    <div id="ownBoard"></div>
    <div class="msg" id="msg"></div>
  </div>
  <div class="screen hidden" id="scrEnd">
    <div class="bigemoji" id="endEmoji">🏆</div>
    <div class="gamename" id="endTitle">胜利！</div>
    <div class="endstats" id="endStats"></div>
    <div class="hsline" id="endHs"></div>
    <button class="btn" id="againBtn">再来一局</button>
    <button class="btn ghost" id="backBtn">返回</button>
  </div>
  <div id="pauseOv" class="hidden">
    <div style="font-size:24px;font-weight:800">⏸ 已暂停</div>
    <button class="btn" id="resumeBtn">继续</button>
    <button class="btn ghost" id="restartBtn">重新开始</button>
  </div>
  <canvas id="fx"></canvas>
</div>
<script>
'use strict';
let ACTX=null, soundOn=true;
try{ soundOn=localStorage.getItem('g100_sound')!=='0'; }catch(e){}
function audio(){ if(!ACTX){ try{ ACTX=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } } if(ACTX&&ACTX.state==='suspended'){ ACTX.resume().catch(function(){}); } return ACTX; }
function tone(f,d,type,vol,delay){ if(!soundOn) return; try{ const c=audio(); if(!c) return; const t=c.currentTime+(delay||0); const o=c.createOscillator(),g=c.createGain(); o.type=type||'sine'; o.frequency.setValueAtTime(f,t); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||0.12,t+0.012); g.gain.exponentialRampToValueAtTime(0.0001,t+d); o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+d+0.05); }catch(e){} }
function sClick(){ tone(600,0.06,'square',0.05); }
function sHit(){ tone(180,0.25,'sawtooth',0.12); tone(90,0.3,'square',0.1,0.05); }
function sMiss(){ tone(300,0.12,'sine',0.08); tone(220,0.1,'sine',0.06,0.08); }
function sWin(){ const seq=[523,659,784,1046,1318]; for(let i=0;i<seq.length;i++) tone(seq[i],0.22,'triangle',0.11,i*0.11); }
function sBad(){ tone(200,0.25,'sawtooth',0.09); }
function hsGet(k){ try{ const v=parseInt(localStorage.getItem(k)||'0',10); return isNaN(v)?0:v; }catch(e){ return 0; } }
function hsSet(k,v){ try{ localStorage.setItem(k,String(v)); }catch(e){} }
const fxC=document.getElementById('fx'), fxX=fxC.getContext('2d');
let P=[];
function fxSize(){ const r=fxC.parentElement.getBoundingClientRect(); fxC.width=r.width; fxC.height=r.height; }
window.addEventListener('resize',fxSize);
function burst(x,y,n,cols){ for(let i=0;i<(n||24);i++){ const a=Math.random()*Math.PI*2,s=1+Math.random()*3.2; P.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1.2,l:1,c:cols[i%cols.length],r:2+Math.random()*3}); } }
function fxLoop(){ fxX.clearRect(0,0,fxC.width,fxC.height); P=P.filter(function(p){return p.l>0;}); for(let i=0;i<P.length;i++){ const p=P[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=0.06; p.l-=0.018; fxX.globalAlpha=Math.max(p.l,0); fxX.fillStyle=p.c; fxX.beginPath(); fxX.arc(p.x,p.y,p.r,0,7); fxX.fill(); } fxX.globalAlpha=1; requestAnimationFrame(fxLoop); }
const $=function(id){ return document.getElementById(id); };
const scrStart=$('scrStart'), scrDeploy=$('scrDeploy'), scrGame=$('scrGame'), scrEnd=$('scrEnd'), pauseOv=$('pauseOv'), pauseBtn=$('pauseBtn'), soundBtn=$('soundBtn');
let paused=false;
function show(el){ [scrStart,scrDeploy,scrGame,scrEnd].forEach(function(s){ s.classList.add('hidden'); }); el.classList.remove('hidden'); fxSize(); }
function setPaused(p){ paused=p; pauseOv.classList.toggle('hidden',!p); }
soundBtn.textContent=soundOn?'🔊':'🔇';
soundBtn.addEventListener('click',function(){ soundOn=!soundOn; soundBtn.textContent=soundOn?'🔊':'🔇'; try{ localStorage.setItem('g100_sound',soundOn?'1':'0'); }catch(e){} if(soundOn) sClick(); });
pauseBtn.addEventListener('click',function(){ sClick(); setPaused(true); });
$('hintBtn').addEventListener('click',function(){ sClick(); bsHint(); });
$('resumeBtn').addEventListener('click',function(){ sClick(); setPaused(false); });
/* ===== 游戏：海战棋 ===== */
const SZ=10, SHIPS=[5,4,3,3,2];
const NAMES=['航空母舰','战列舰','巡洋舰','驱逐舰','潜艇'];
let playerFleet=null, aiFleet=null;
let playerShots=new Set(), aiShots=new Set();
let aiQueue=[], aiQueued=new Set();
let turn='player', playing=false, shotsFired=0, aiTimer=null;

function placeFleet(){
  const grid=[]; for(let r=0;r<SZ;r++){ grid.push([]); for(let c=0;c<SZ;c++) grid[r].push(-1); }
  const ships=[];
  for(let s=0;s<SHIPS.length;s++){
    const len=SHIPS[s]; let placed=false, guard=0;
    while(!placed&&guard++<2000){
      const horiz=Math.random()<0.5;
      const r=(Math.random()*SZ)|0, c=(Math.random()*SZ)|0;
      const cells=[];
      for(let i=0;i<len;i++){ const rr=horiz?r:r+i, cc=horiz?c+i:c; if(rr>=SZ||cc>=SZ) break; cells.push([rr,cc]); }
      if(cells.length<len) continue;
      let clash=false;
      for(let i=0;i<cells.length;i++) if(grid[cells[i][0]][cells[i][1]]!==-1){ clash=true; break; }
      if(clash) continue;
      for(let i=0;i<cells.length;i++) grid[cells[i][0]][cells[i][1]]=s;
      ships.push({len:len,cells:cells,hits:0,sunk:false});
      placed=true;
    }
  }
  return {grid:grid,ships:ships};
}
function key(r,c){ return r+','+c; }
function renderDeploy(){
  const b=$('deployBoard'); b.innerHTML='';
  for(let r=0;r<SZ;r++) for(let c=0;c<SZ;c++){
    const d=document.createElement('div'); d.className='cell';
    if(playerFleet.grid[r][c]!==-1){ d.style.background='linear-gradient(135deg,#4a5a75,#33405a)'; }
    b.appendChild(d);
  }
}
function renderBoards(){
  const eb=$('enemyBoard'); eb.innerHTML='';
  for(let r=0;r<SZ;r++) for(let c=0;c<SZ;c++){
    const d=document.createElement('div'); d.className='cell'; d.dataset.r=r; d.dataset.c=c;
    const k=key(r,c);
    if(playerShots.has(k)){
      const sid=aiFleet.grid[r][c];
      if(sid===-1){ d.classList.add('miss'); d.textContent='·'; }
      else{ const sh=aiFleet.ships[sid]; d.classList.add(sh.sunk?'sunk':'hit'); d.textContent=sh.sunk?'💥':'🔥'; }
    }
    eb.appendChild(d);
  }
  const ob=$('ownBoard'); ob.innerHTML='';
  for(let r=0;r<SZ;r++) for(let c=0;c<SZ;c++){
    const d=document.createElement('div'); d.className='cell';
    const k=key(r,c), sid=playerFleet.grid[r][c];
    if(aiShots.has(k)){
      if(sid===-1){ d.classList.add('miss'); }
      else{ const sh=playerFleet.ships[sid]; d.classList.add(sh.sunk?'sunk':'hit'); }
    } else if(sid!==-1){ d.classList.add('ship'); }
    ob.appendChild(d);
  }
  let eL=0,oL=0;
  aiFleet.ships.forEach(function(s){ if(!s.sunk)eL++; });
  playerFleet.ships.forEach(function(s){ if(!s.sunk)oL++; });
  $('enemyLeft').textContent=eL; $('ownLeft').textContent=oL;
}
function msg(t){ $('msg').textContent=t; }
function fireResult(fleet,r,c){
  const sid=fleet.grid[r][c];
  if(sid===-1) return {hit:false};
  const sh=fleet.ships[sid]; sh.hits++;
  if(sh.hits>=sh.len){ sh.sunk=true; return {hit:true,sunk:true,ship:sh,idx:sid}; }
  return {hit:true};
}
function checkWin(fleet){ return fleet.ships.every(function(s){ return s.sunk; }); }
function playerShoot(r,c){
  if(!playing||paused||turn!=='player') return;
  const k=key(r,c);
  if(playerShots.has(k)) return;
  playerShots.add(k); shotsFired++;
  const res=fireResult(aiFleet,r,c);
  const el=$('enemyBoard').children[r*SZ+c];
  if(res.hit){
    sHit();
    if(res.sunk){
      msg('🎉 击沉敌方'+NAMES[res.idx]+'！');
      const ar=$('app').getBoundingClientRect(), er=el.getBoundingClientRect();
      burst(er.left-ar.left+er.width/2, er.top-ar.top+er.height/2, 40, ['#ff6b6b','#ffd76a','#fff']);
    } else msg('💥 击中！');
  } else { sMiss(); msg('🌊 未命中…'); }
  renderBoards();
  if(checkWin(aiFleet)){ endGame(true); return; }
  turn='ai'; $('turnTxt').textContent='AI 思考中…'; $('turnDot').style.background='#ff9a5c';
  clearTimeout(aiTimer);
  aiTimer=setTimeout(aiShoot,650);
}
function aiShoot(){
  if(!playing||turn!=='ai') return;
  if(paused){ clearTimeout(aiTimer); aiTimer=setTimeout(aiShoot,500); return; }
  let cell=null;
  while(aiQueue.length){
    const c=aiQueue.shift();
    if(!aiShots.has(key(c[0],c[1]))){ cell=c; break; }
  }
  if(!cell){
    // hunt: 纯随机（留破绽，不用奇偶优化）
    const opts=[];
    for(let r=0;r<SZ;r++) for(let c=0;c<SZ;c++) if(!aiShots.has(key(r,c))) opts.push([r,c]);
    if(!opts.length){ endGame(true); return; }
    cell=opts[(Math.random()*opts.length)|0];
  }
  const r=cell[0], c=cell[1];
  aiShots.add(key(r,c));
  const res=fireResult(playerFleet,r,c);
  if(res.hit){
    sHit();
    if(res.sunk){
      msg('🔥 我方'+NAMES[res.idx]+'被击沉了！');
      aiQueue=[]; aiQueued=new Set(); // 破绽：击沉后清空追击队列
    } else {
      msg('⚠️ 我方战舰被击中！');
      const nb=[[r+1,c],[r-1,c],[r,c+1],[r,c-1]];
      for(let i=0;i<nb.length;i++){
        const nr=nb[i][0], nc=nb[i][1], k=key(nr,nc);
        if(nr>=0&&nc>=0&&nr<SZ&&nc<SZ&&!aiShots.has(k)&&!aiQueued.has(k)){ aiQueue.push([nr,nc]); aiQueued.add(k); }
      }
    }
  } else { sMiss(); msg('🌊 AI 未命中'); }
  renderBoards();
  if(checkWin(playerFleet)){ endGame(false); return; }
  turn='player'; $('turnTxt').textContent='你的回合'; $('turnDot').style.background='#2ecc71';
}
var hintToastTimer=null;
function showHintToast(html,ms){
  var t=document.getElementById('hintToast');
  if(!t){t=document.createElement('div');t.id='hintToast';document.body.appendChild(t);}
  t.innerHTML=html;t.classList.add('show');
  if(hintToastTimer)clearTimeout(hintToastTimer);
  hintToastTimer=setTimeout(function(){t.classList.remove('show');},ms||4500);
}
function bsHint(){
  if(!playing||paused||turn!=='player')return;
  var r,c,k,shots=playerShots;
  // 1) 追击模式：找已命中但未击沉的格子，看 DOM 上 hit(非sunk) 的邻格
  var hits=[];
  var cells=$('enemyBoard').children;
  for(r=0;r<SZ;r++)for(c=0;c<SZ;c++){
    var el=cells[r*SZ+c];
    if(el.classList.contains('hit')&&!el.classList.contains('sunk'))hits.push([r,c]);
  }
  var why='';
  var pick=null;
  if(hits.length){
    var nb=[],i;
    for(i=0;i<hits.length;i++){
      var h=hits[i];
      var ns=[[h[0]+1,h[1]],[h[0]-1,h[1]],[h[0],h[1]+1],[h[0],h[1]-1]];
      for(var j=0;j<ns.length;j++){
        var nr=ns[j][0],nc=ns[j][1];
        if(nr>=0&&nr<SZ&&nc>=0&&nc<SZ&&!shots.has(key(nr,nc)))nb.push([nr,nc]);
      }
    }
    if(nb.length){
      pick=nb[(Math.random()*nb.length)|0];
      why='这艘船已被命中，相邻格很可能还有船身，顺着打过去';
    }
  }
  // 2) 狩猎模式：黑白格跳打（最小的船占2格，跳打必能先发现任意船）
  if(!pick){
    var opts=[];
    for(r=0;r<SZ;r++)for(c=0;c<SZ;c++){
      if(!shots.has(key(r,c))&&(r+c)%2===0)opts.push([r,c]);
    }
    if(!opts.length){
      for(r=0;r<SZ;r++)for(c=0;c<SZ;c++){
        if(!shots.has(key(r,c)))opts.push([r,c]);
      }
    }
    if(!opts.length){showHintToast('没有可打的格子了');return;}
    pick=opts[(Math.random()*opts.length)|0];
    why='按黑白格跳打：最小的船也占 2 格，跳打一定能先蹭到任意一艘船，比逐格扫快近一倍';
  }
  var el2=cells[pick[0]*SZ+pick[1]];
  el2.classList.remove('hintshot');void el2.offsetWidth;el2.classList.add('hintshot');
  setTimeout(function(){el2.classList.remove('hintshot');},3400);
  sClick();
  var colName='ABCDEFGHIJ';
  showHintToast('💡 建议打 <b>'+colName[pick[1]]+(pick[0]+1)+'</b>（已闪烁标出）<br>'+why);
}
function endGame(win){
  playing=false; clearTimeout(aiTimer); pauseBtn.classList.add('hidden'); setPaused(false);
  const key='g100_battleship_hs', best=hsGet(key);
  let nb=false;
  if(win&&(best===0||shotsFired<best)){ hsSet(key,shotsFired); nb=true; }
  $('endEmoji').textContent=win?'🏆':'💀';
  $('endTitle').textContent=win?'大获全胜！':'舰队覆没…';
  $('endStats').innerHTML=win?('共开火 <b>'+shotsFired+'</b> 次'+(nb?'<br>🎉 新纪录！':'')):('AI 先击沉了你的舰队<br>调整布阵再战！');
  $('endHs').textContent=(win||best>0)?('🏅 最少开火获胜：'+(win?Math.min(best||shotsFired,shotsFired):best)+' 次'):'暂无获胜纪录';
  show(scrEnd);
  if(win){ sWin(); const r=$('app').getBoundingClientRect(); burst(r.width/2,220,90,['#5b8def','#ffd76a','#7ee2a8','#fff']); }
  else sBad();
}
function toDeploy(){
  playerFleet=placeFleet();
  renderDeploy();
  $('deployMsg').textContent='';
  setPaused(false); pauseBtn.classList.add('hidden');
  show(scrDeploy);
}
$('startBtn').addEventListener('click',function(){ audio(); sClick(); toDeploy(); });
$('reshuffleBtn').addEventListener('click',function(){ sClick(); playerFleet=placeFleet(); renderDeploy(); $('deployMsg').textContent='已重新随机布阵'; });
$('battleBtn').addEventListener('click',function(){
  sClick();
  aiFleet=placeFleet();
  playerShots=new Set(); aiShots=new Set(); aiQueue=[]; aiQueued=new Set();
  turn='player'; shotsFired=0; playing=true;
  pauseBtn.classList.remove('hidden');
  $('turnTxt').textContent='你的回合'; $('turnDot').style.background='#2ecc71';
  msg('点击敌方海域开火！');
  renderBoards(); show(scrGame);
});
$('enemyBoard').addEventListener('pointerdown',function(e){
  const t=e.target.closest('.cell'); if(!t||!t.dataset.r) return;
  e.preventDefault();
  playerShoot(parseInt(t.dataset.r,10),parseInt(t.dataset.c,10));
});
$('againBtn').addEventListener('click',function(){ sClick(); toDeploy(); });
$('backBtn').addEventListener('click',function(){ sClick(); playing=false; clearTimeout(aiTimer); pauseBtn.classList.add('hidden'); show(scrStart); refreshStartHs(); });
$('restartBtn').addEventListener('click',function(){ sClick(); toDeploy(); });
function refreshStartHs(){ const b=hsGet('g100_battleship_hs'); $('startHs').textContent=b>0?('🏅 最少 '+b+' 次开火获胜'):''; }
refreshStartHs(); fxSize(); fxLoop();
</script>
