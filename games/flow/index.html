<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>连连线</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:linear-gradient(160deg,#0e2a4d 0%,#121212 55%,#0a0a0a 100%);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;display:flex;justify-content:center;min-height:100vh;touch-action:manipulation;-webkit-user-select:none;user-select:none;overflow-x:hidden}
.wrap{width:100%;max-width:480px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:10px;position:relative;z-index:1}
.topbar{width:100%;display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:9px 12px;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.topbar .title{font-weight:700;font-size:16px}
.topbar .stat{color:#a9cdf5;font-size:13px}
.topbar .stat b{color:#fff;font-size:15px}
.tbtn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:#fff;font-size:16px;min-width:38px;height:38px;border-radius:11px;cursor:pointer;transition:transform .08s}
.tbtn:active{transform:scale(.9)}
.screen{width:100%;display:none;flex-direction:column;align-items:center;gap:10px}
.screen.on{display:flex}
.card{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:20px;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.card h1{font-size:26px;margin-bottom:6px;background:linear-gradient(90deg,#7dd3fc,#f0abfc);-webkit-background-clip:text;background-clip:text;color:transparent}
.card h2{font-size:22px;margin-bottom:8px}
.card p{color:#b8d4f0;font-size:14px;line-height:1.7;margin-bottom:10px}
.bigbtn{background:linear-gradient(135deg,#0ea5e9,#8b5cf6);border:none;color:#fff;font-size:18px;font-weight:700;padding:14px 46px;border-radius:999px;cursor:pointer;box-shadow:0 6px 18px rgba(14,165,233,.45);transition:transform .1s}
.bigbtn:active{transform:scale(.93)}
.ghostbtn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#fff;font-size:14px;padding:10px 22px;border-radius:999px;cursor:pointer;transition:transform .1s}
.ghostbtn:active{transform:scale(.93)}
.lvlgrid{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.lvl{width:70px;height:70px;border-radius:14px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);color:#fff;font-size:14px;font-weight:700;cursor:pointer;transition:transform .1s;display:flex;flex-direction:column;align-items:center;justify-content:center}
.lvl:active{transform:scale(.92)}
.lvl.done{border-color:#4ade80;color:#4ade80}
.lvl .nc{font-size:11px;color:#a9cdf5;font-weight:400}
#cvwrap{width:100%;display:flex;justify-content:center;touch-action:none}
#cv{border-radius:14px;background:rgba(255,255,255,.03);touch-action:none;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.toolbar{display:flex;gap:10px}
.best{color:#ffd76a;font-size:14px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
.float{position:fixed;pointer-events:none;z-index:60;font-weight:700;font-size:18px;animation:floatup 1.1s ease-out forwards}
@keyframes floatup{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-46px)}}
#pauseov{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:40;backdrop-filter:blur(4px)}
#pauseov.on{display:flex}
.pausecard{background:#1c1c22;border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:28px 36px;text-align:center;display:flex;flex-direction:column;gap:12px}
#hintov{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:40;backdrop-filter:blur(4px);padding:24px}
#hintov.on{display:flex}
.hintcard{background:#1c1c22;border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:26px 28px;text-align:center;display:flex;flex-direction:column;gap:12px;max-width:380px}
.hintcard h2{font-size:22px}
.hintcard p{color:#b8d4f0;font-size:14px;line-height:1.9}
</style>
<!-- GAME UI BEGIN -->
<style>
:root{--page:#e7edf4;--surface:#ffffff;--soft:#dce5ef;--ink:#243952;--muted:#5b6d83;--accent:#275e9b;--on-accent:#ffffff;--line:#bacbdd;--stage:#172d48}
/* Shared presentation only; mechanics and state remain inside each standalone game. */
html.game-ui{background:var(--page);color:var(--ink);color-scheme:light;font-family:"Bahnschrift","Microsoft YaHei UI","PingFang SC",sans-serif}
html.game-ui[data-theme="space"],html.game-ui[data-theme="arcade"]{color-scheme:dark}
.game-ui body{background:var(--page);color:var(--ink);font-family:inherit;overscroll-behavior:none}
.game-ui body>.wrap{padding:20px 16px max(20px,env(safe-area-inset-bottom));gap:14px;max-width:500px}
.game-ui #app{background:var(--page);color:var(--ink)}
.game-ui :is(.topbar,#topbar){gap:8px;flex-wrap:wrap;min-height:58px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:10px 12px;box-shadow:0 3px 0 var(--soft);font-size:13px}
.game-ui :is(.title,.tb-title,.tb-title,#topbar .t,.topbar .t){color:var(--ink);font-size:16px;font-weight:750;letter-spacing:0}
.game-ui :is(.topbar,.hud,#hud,#topbar) :is(b,.v){color:var(--accent);font-variant-numeric:tabular-nums}
.game-ui :is(.stat,.topbar .s,.topbar .stat,.scorebar,.stats,.tip,.hint,.hintline,.hsline,.best,.hiscore){color:var(--muted);line-height:1.7}
.game-ui :is(.hint,.hintline,.tip){font-size:12px;max-width:40em;text-wrap:pretty}
.game-ui .scorebar{padding:6px 10px;gap:8px;flex-wrap:wrap}
.game-ui :is(.iconbtn,.iconBtn,.icobtn,.ibtn,.tbtn,.hbtn,.ib,.iconBtn,.pause){min-width:44px;min-height:44px;flex-shrink:0;border-radius:12px;background:var(--soft);color:var(--ink);border:1px solid var(--line);box-shadow:none;font-size:17px}
.game-ui button{font-family:inherit;cursor:pointer;touch-action:manipulation}
.game-ui button:focus-visible,.game-ui [tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.game-ui :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn){background:var(--accent);color:var(--on-accent);border:1px solid transparent;border-radius:13px;min-height:50px;padding:13px 28px;font-size:16px;font-weight:750;letter-spacing:0;box-shadow:0 4px 0 var(--line);text-shadow:none;max-width:100%}
.game-ui :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn):active{box-shadow:none;transform:translateY(2px)}
.game-ui :is(.ghost,.ghostbtn,.btn2,.abtn,.toolbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line);box-shadow:none;border-radius:12px;min-height:44px}
.game-ui :is(.rowbtns,.btnrow,.ctlrow){gap:10px;flex-wrap:wrap;justify-content:center}
.game-ui :is(.pill,.hudbox,.hud .p){background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:none;font-variant-numeric:tabular-nums}
.game-ui :is(.dbtn,.cbtn,.gbtn,.holdbtn,.firebtn,.bombbtn,.jumpbtn,.pumpbtn,.nbtn){border-radius:12px;box-shadow:0 3px 0 var(--line);min-height:44px}
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv,.screen):has(>.ui-panel){padding:20px;overflow-y:auto;overscroll-behavior:contain}
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv):has(>.ui-panel){background:var(--page);backdrop-filter:none;justify-content:safe center;align-items:center}
.game-ui .ui-panel{width:min(100%,380px);max-height:100%;overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:18px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:24px;padding:30px 24px;box-shadow:0 8px 0 var(--soft),0 20px 48px #15253618;text-align:center;margin:auto}
.game-ui .ui-panel :is(.card,.panel,.pausecard,.ovcard){display:contents}
.game-ui .ui-panel :is(h1,h2,.gamename,.gametitle){font-size:30px;line-height:1.25;font-weight:800;color:var(--ink);background:none;-webkit-text-fill-color:currentColor;text-shadow:none;letter-spacing:-.6px;margin:0}
.game-ui .ui-panel :is(p,.howto,.sub,.rule){font-size:14px;line-height:1.85;color:var(--muted);background:none;border:0;box-shadow:none;padding:0;margin:0;max-width:32em;text-align:left;white-space:normal}
.game-ui .ui-panel :is(.bigemoji,.bigemoji,.ic,.big):not(.bigscore){animation:none;filter:none;text-shadow:none}
.game-ui .ui-emblem{width:90px;height:90px;display:grid;place-items:center;border:1px solid var(--line);border-radius:28px;background:var(--soft);font-size:48px;line-height:1;flex-shrink:0;position:relative}
.game-ui[data-theme="wood"] .ui-emblem{border-radius:50%;box-shadow:inset 0 0 0 5px var(--surface),inset 0 0 0 6px var(--line)}
.game-ui[data-theme="wood"] .ui-panel h1{font-family:"STKaiti","KaiTi","Microsoft YaHei",serif;letter-spacing:2px}
.game-ui[data-theme="ice"] .ui-emblem{border-radius:26px 8px 26px 8px}
.game-ui[data-theme="space"] .ui-emblem{background:radial-gradient(circle at center,var(--soft) 42%,transparent 43%),var(--surface);border-radius:50%;outline:1px solid var(--line);outline-offset:7px;margin:7px}
.game-ui[data-theme="kitchen"] .ui-emblem{border-radius:22px;border-bottom:5px solid var(--line)}
.game-ui .ui-panel :is(.score,.bigscore,.bigScore,.scorebig){color:var(--accent);font-size:48px;font-weight:800;font-variant-numeric:tabular-nums}
.game-ui .ui-panel :is(.best,.hsline,.hiscore,.endstats,.endstats b){color:var(--muted);font-size:13px;line-height:1.8}
.game-ui .ui-mode{display:grid;grid-template-columns:1fr 1fr;gap:5px;background:var(--soft);padding:5px;border:1px solid var(--line);border-radius:14px;width:100%}
.game-ui .ui-mode button{min-height:44px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-size:14px;font-weight:700;box-shadow:none}
.game-ui .ui-mode button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 2px 5px #1525361a}
.game-ui .ui-panel .ui-mode-note{font-size:12px;line-height:1.6;text-align:center;color:var(--muted)}
.game-ui .ui-mode-status{display:block;padding:5px 10px;color:var(--accent);font-size:11px;font-weight:700;line-height:1.5;text-align:center;border:1px solid var(--line);border-radius:8px;background:var(--surface);margin:4px auto;max-width:100%;pointer-events:none}
.game-ui body>.wrap>canvas:not(#fx){background-color:var(--stage);box-shadow:0 0 0 1px var(--line),0 6px 0 var(--soft);border-radius:18px;flex-shrink:0}
.game-ui .screen>canvas.game{box-shadow:0 0 0 1px var(--line),0 6px 0 var(--soft)}
.game-ui #hud{gap:6px;background:var(--surface);color:var(--ink)}
.game-ui #hud :is(.left,.t,.s,.grp,.pill){color:var(--ink)}
.game-ui #hud .pill{background:var(--surface);border-color:var(--line)}
.game-ui body canvas:is(#cv,#game,#board){background-color:var(--stage)}
.game-ui :is(button.dbtn,button.cbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.game-ui :is(button.lvl,button.lvlbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line);border-radius:12px;min-height:54px}
.game-ui :is(button.lvl,button.lvlbtn) :is(.nc,.sz,small){color:var(--muted)}
.game-ui .ui-panel button.lvl{margin:0;min-width:44px;box-shadow:none;padding:8px}
.game-ui #hud :is(.left,.right,.hudl,.hbtns){gap:5px;flex-wrap:wrap}
.game-ui #hud :is(.left,.hudl){min-width:0;flex-shrink:1}
.game-ui #hud :is(.pill,.left){font-size:12px}
.game-ui button:disabled{cursor:default;opacity:.45;box-shadow:none}
.game-ui .ui-panel .ui-assist-note{color:var(--accent);font-weight:700}
@media(min-width:700px){.game-ui body>.wrap{padding-top:32px}.game-ui .ui-panel{padding:36px 30px}}
@media(max-width:360px){.game-ui body>.wrap{padding:10px;gap:10px}.game-ui .ui-panel{padding:22px 18px;gap:13px}.game-ui .ui-panel h1{font-size:26px}.game-ui .ui-emblem{width:70px;height:70px;font-size:38px}.game-ui :is(.topbar,#topbar){gap:5px;padding:8px}.game-ui :is(.iconbtn,.icobtn,.ibtn,.tbtn,.ib){min-width:40px;min-height:44px}}
@media(max-height:650px){.game-ui .ui-panel{padding:18px;gap:12px}.game-ui .ui-emblem{width:60px;height:60px;font-size:32px}.game-ui .ui-panel h1{font-size:25px}.game-ui .ui-panel :is(p,.howto,.sub,.rule){font-size:13px}}
@media(prefers-reduced-motion:reduce){.game-ui *, .game-ui *::before,.game-ui *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
/* 2026-10-20 热修：开局/结算遮罩铺满整屏，主按钮固定在面板底部，避免被画布尺寸裁切（#10） */
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv):has(>.ui-panel){position:fixed;inset:0;z-index:1000;border-radius:0;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
.game-ui .ui-panel{touch-action:pan-y}
.game-ui .ui-panel :is(#startBtn,#btnStart,.startbtn,#bStart,#restartBtn,#btnRestart,#againBtn,#btnAgain,#retryBtn,#btnRetry,#playBtn,#btnPlay){position:sticky;bottom:0;z-index:3;flex-shrink:0}
.game-ui .ui-panel :not(.card,.panel,.pausecard,.ovcard,.ui-mode):has(>:is(#startBtn,#btnStart,.startbtn,#bStart,#restartBtn,#btnRestart,#againBtn,#btnAgain,#retryBtn,#btnRetry,#playBtn,#btnPlay)){position:sticky;bottom:0;z-index:3;flex-shrink:0;background:var(--surface);box-shadow:0 -10px 10px -6px var(--surface)}

html[data-game="flow"] #cvwrap{min-width:0;max-width:100%}html[data-game="flow"] #cv{max-width:100%;height:auto}

</style>
<script>
// Installed before the original game script; embedded so downloaded ZIPs remain offline capable.
(function () {
  'use strict';
  var config = {"id":"flow","name":"连连线","theme":"paper","icon":"🌈","challenge":"每次挑战仅 1 次提示、3 次撤销，谨慎规划再落子"};
  var mode = 'classic';
  try { mode = sessionStorage.getItem('game100-mode-' + config.id) || mode; } catch (_) {}
  var expert = mode === 'expert';
  var used = { hint: 0, undo: 0 };
  var limits = { hint: 1, undo: 3 };
  function storageKey(key) { return expert && !/sound|mute/i.test(key) ? 'expert:' + key : key; }
  window.GameUI = {
    expert: expert,
    pick: function (classic, advanced) { return expert ? advanced : classic; },
    storageGet: function (key) { return localStorage.getItem(storageKey(key)); },
    storageSet: function (key, value) { localStorage.setItem(storageKey(key), value); },
    storageRemove: function (key) { localStorage.removeItem(storageKey(key)); }
  };
  var root = document.documentElement;
  root.classList.add('game-ui');
  root.dataset.theme = config.theme;
  root.dataset.game = config.id;
  root.dataset.mode = mode;
  var gesture = new WeakMap();
  function labelButtons(scope) {
    scope.querySelectorAll('button').forEach(function (button) {
      if (button.getAttribute('aria-label')) return;
      var id = button.id.toLowerCase(), text = button.textContent.trim();
      var name = /mute|sound|snd/.test(id) ? '切换音效' : /pause/.test(id) ? '暂停游戏' : /hint/.test(id) && !/close|ok/.test(id) ? '查看提示' : '';
      if (!name && /^[⏸🔊🔇💡Ⅱ]+$/u.test(text)) name = { '⏸': '暂停游戏', '🔊': '切换音效', '🔇': '切换音效', '💡': '查看提示' }[text];
      if (name) button.setAttribute('aria-label', name);
    });
  }
  function decorate(container) {
    if (container.querySelector(':scope > .ui-panel') || !container.querySelector('h1,h2,.gamename')) return;
    if (container.matches('.screen') && container.querySelector('canvas:not(#fx)')) return;
    var panel = document.createElement('div');
    panel.className = 'ui-panel';
    while (container.firstChild) panel.appendChild(container.firstChild);
    container.appendChild(panel);
    var heading = panel.querySelector('h1,h2,.gamename');
    var start = /start|menu|ready/i.test(container.id) || !!panel.querySelector('#startBtn,#btnStart,.startbtn');
    if (start) {
      var headings = panel.querySelectorAll('h1,h2,.gamename');
      if (headings.length > 1 && !/[A-Za-z0-9\u4e00-\u9fff]/.test(heading.textContent)) { heading.remove(); heading = headings[1]; }
      var oldIcon = panel.querySelector('.bigemoji,.ic');
      if (oldIcon) oldIcon.remove();
      var emblem = document.createElement('div');
      emblem.className = 'ui-emblem'; emblem.textContent = config.icon; emblem.setAttribute('aria-hidden', 'true');
      panel.insertBefore(emblem, panel.firstChild);
      heading.textContent = config.name;
      var switcher = document.createElement('div'); switcher.className = 'ui-mode'; switcher.setAttribute('role', 'group'); switcher.setAttribute('aria-label', '选择玩法模式');
      [['classic','经典模式'],['expert','进阶挑战']].forEach(function (item) {
        var b = document.createElement('button'); b.type = 'button'; b.textContent = item[1]; b.dataset.mode = item[0]; b.setAttribute('aria-pressed', String(mode === item[0]));
        b.addEventListener('click', function () {
          if (mode === item[0]) return;
          try { sessionStorage.setItem('game100-mode-' + config.id, item[0]); location.reload(); }
          catch (_) { b.textContent = '浏览器未允许保存模式'; }
        });
        switcher.appendChild(b);
      });
      var primary = panel.querySelector('#startBtn,#btnStart,.startbtn,button');
      var anchor = primary;
      while (anchor && anchor.parentNode !== panel && !anchor.parentNode.matches('.card,.panel,.pausecard,.ovcard')) anchor = anchor.parentNode;
      var target = anchor ? anchor.parentNode : panel;
      target.insertBefore(switcher, anchor || null);
      var note = document.createElement('p'); note.className = 'ui-mode-note';
      note.textContent = expert ? config.challenge + '。进阶纪录单独保存。' : '按原规则轻松开局，也可切换进阶挑战。';
      target.insertBefore(note, anchor || null);
    }
    labelButtons(panel);
  }
  function notify(text) {
    var el = document.getElementById('ui-assist-toast');
    if (!el) { el = document.createElement('div'); el.id = 'ui-assist-toast'; el.className = 'ui-mode-status'; el.setAttribute('role', 'status'); el.style.cssText = 'position:fixed;bottom:18px;left:16px;right:16px;z-index:200;padding:14px'; document.body.appendChild(el); }
    el.textContent = text; el.hidden = false;
    clearTimeout(notify.timer); notify.timer = setTimeout(function () { el.hidden = true; }, 2000);
  }
  function assistEvent(event) {
    if (!expert) return;
    var b = event.target.closest('button'); if (!b || b.closest('.ui-mode')) return;
    var kind = /^(hintBtn|hintTopBtn|btnHint)$/i.test(b.id) ? 'hint' : /^(undoBtn|undoTopBtn|btnUndo)$/i.test(b.id) || /悔一步|撤销/.test(b.textContent) ? 'undo' : '';
    if (!kind) return;
    var prev = gesture.get(b), blocked;
    if (event.type === 'click' && prev && performance.now() - prev.at < 1000) blocked = prev.blocked;
    else { blocked = used[kind] >= limits[kind]; if (!blocked) used[kind]++; gesture.set(b, { at: performance.now(), blocked: blocked }); }
    if (blocked) { event.preventDefault(); event.stopImmediatePropagation(); notify(kind === 'hint' ? '本次挑战的 1 次提示已用完' : '本次挑战的 3 次撤销已用完'); }
  }
  document.addEventListener('pointerdown', assistEvent, true);
  document.addEventListener('click', assistEvent, true);
  document.addEventListener('click', function (event) {
    var b = event.target.closest('button');
    if (b && /^(startBtn|btnStart|restartBtn|againBtn|retryBtn|btnAgain|btnRestart|playAgain)$/i.test(b.id)) used = { hint: 0, undo: 0 };
  }, true);
  document.addEventListener('DOMContentLoaded', function () {
    var selector = '.overlay,.ov,#ov,#overlay,#pauseOv,.screen';
    document.querySelectorAll(selector).forEach(function (container) {
      decorate(container);
      // Only dynamic overlay children are observed; animated scores never trigger this work.
      new MutationObserver(function () { decorate(container); }).observe(container, { childList: true });
    });
    labelButtons(document);
  });
}());

</script>
<!-- GAME UI END -->
</head>
<body>
<canvas id="fx"></canvas>
<div class="wrap">
  <div class="topbar">
    <span class="title">🌈 连连线</span>
    <span class="stat">第 <b id="lvl">1</b>/6 关 · 笔画 <b id="strokes">0</b></span>
    <span><button class="tbtn" id="hintBtn" title="提示">💡</button><button class="tbtn" id="sndBtn">🔊</button><button class="tbtn" id="pauseBtn">⏸</button></span>
  </div>
  <div class="screen on" id="s-start">
    <div class="card">
      <h1>🌈 连连线</h1>
      <p>从彩色圆点出发，拖动铺出管道，<br>连到同色圆点，并<b>铺满所有格子</b>、互不交叉！<br>6 个手工设计关卡，全部可解。</p>
      <div class="lvlgrid" id="lvlGrid"></div>
    </div>
  </div>
  <div class="screen" id="s-game">
    <div id="cvwrap"><canvas id="cv"></canvas></div>
    <div class="toolbar">
      <button class="ghostbtn" id="btnReset">↩ 重置本关</button>
      <button class="ghostbtn" id="btnLvls">📋 选关</button>
    </div>
  </div>
  <div class="screen" id="s-end">
    <div class="card">
      <h2>🏆 全部通关！</h2>
      <p id="endInfo"></p>
      <p class="best" id="endBest"></p>
      <div style="display:flex;gap:10px;justify-content:center"><button class="bigbtn" id="btnAgain">再玩一次</button><button class="ghostbtn" id="btnHome">选关</button></div>
    </div>
  </div>
</div>
<div id="pauseov"><div class="pausecard"><h2>⏸ 已暂停</h2><button class="bigbtn" id="btnResume">继续</button><button class="ghostbtn" id="btnQuit">退出</button></div></div>
<div id="hintov"><div class="hintcard"><h2>💡 提示</h2><p id="hintText"></p><button class="ghostbtn" id="hintClose">知道了</button></div></div>
<script>
/* GAMEPLAY UPGRADE */
"use strict";
var $=function(id){return document.getElementById(id)};
var store={get:function(k,d){try{var v=GameUI.storageGet("flow_"+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set:function(k,v){try{GameUI.storageSet("flow_"+k,JSON.stringify(v))}catch(e){}}};
var AC=null,soundOn=store.get("sound",true);
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==="suspended"){AC.resume()}return AC}
function tone(f,dur,type,vol,when){if(!soundOn)return;var c=ac();if(!c)return;try{var o=c.createOscillator(),g=c.createGain();o.type=type||"sine";o.frequency.value=f;g.gain.setValueAtTime(vol||.12,c.currentTime+(when||0));g.gain.exponentialRampToValueAtTime(.001,c.currentTime+(when||0)+(dur||.1));o.connect(g);g.connect(c.destination);o.start(c.currentTime+(when||0));o.stop(c.currentTime+(when||0)+(dur||.1)+.02)}catch(e){}}
var sClick=function(){tone(520,.07,"triangle")},sDraw=function(){tone(430+Math.random()*60,.05,"sine",.07)},sDone=function(){tone(760,.12,"sine");tone(1140,.16,"sine",.12,.09)},sWin=function(){[523,659,784,1046,1318].forEach(function(f,i){tone(f,.2,"sine",.15,i*.1)})};
var fx=$("fx"),fctx=fx.getContext("2d"),parts=[];
function fxSize(){fx.width=innerWidth;fx.height=innerHeight}addEventListener("resize",fxSize);fxSize();
function burst(x,y,color,n){for(var i=0;i<(n||14);i++)parts.push({x:x,y:y,vx:(Math.random()-.5)*7,vy:(Math.random()-.5)*7-2,life:1,color:color||"#7dd3fc",r:2+Math.random()*3})}
(function fxLoop(){fctx.clearRect(0,0,fx.width,fx.height);parts=parts.filter(function(p){return p.life>0});parts.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=.22;p.life-=.028;fctx.globalAlpha=Math.max(0,p.life);fctx.fillStyle=p.color;fctx.beginPath();fctx.arc(p.x,p.y,p.r,0,7);fctx.fill()});fctx.globalAlpha=1;requestAnimationFrame(fxLoop)})();
/* ---------- 6 关手工关卡（每关解法已用脚本验证：路径连贯、端点正确、互不交叉、铺满全格） ---------- */
var FCOLORS=["#ef4444","#22c55e","#3b82f6","#eab308","#a855f7"];
var LEVELS=[
 {name:"入门",n:5,terms:[[[0,0],[4,4]],[[4,0],[4,1]]]},
 {name:"三色",n:5,terms:[[[0,0],[0,4]],[[1,0],[1,4]],[[2,0],[4,4]]]},
 {name:"竖条",n:5,terms:[[[0,0],[4,0]],[[0,1],[4,1]],[[0,2],[4,4]]]},
 {name:"五色框",n:5,terms:[[[0,0],[0,4]],[[4,0],[4,4]],[[1,0],[3,0]],[[1,4],[3,4]],[[1,1],[2,2]]]},
 {name:"横条",n:5,terms:[[[0,0],[0,4]],[[4,0],[4,4]],[[1,0],[2,0]],[[3,0],[3,4]]]},
 {name:"五彩",n:5,terms:[[[0,0],[2,0]],[[0,4],[2,4]],[[0,1],[1,2]],[[3,0],[4,0]],[[3,3],[4,3]]]}
];
/* ---------- 状态 ---------- */
var L=null,li=0,paths,owner,strokes,dragK,dragging,totalScore,doneList=store.get("done",[]);
/* ---------- 每关提示（解题思路） ---------- */
var HINTS=[
"入门关：绿色两点紧挨着，先一笔画连好；红色从左上出发，贴着边缘绕一圈，把剩下的格子全部吃完再到右下角。",
"三色关：三对点都是上下对应的——红色、绿色沿第 1、2 列直下，蓝色在右半区绕 S 形铺满所有空格。",
"竖条关：红、绿两条横线先贴着上、下边缘连好，蓝色在下面三行里来回蛇形走满再到终点。",
"五色框：四个角的颜色先贴边连成一个框（红左列、绿右列、黄上行、紫下行），蓝色最后在中间 3x3 里绕一圈。",
"横条关：红、绿先贴左右两边直连，黄点紧挨着直接连，紫色从上到下在中间两列绕 S 形铺满。",
"五彩关：先把短的几对连好（红走上行、绿走下行、蓝紫都是紧挨着），黄色最后在中间三行蛇形铺满全部空格。"
];
var cv=$("cv"),ctx=cv.getContext("2d"),CS=0;
function show(id){["s-start","s-game","s-end"].forEach(function(s){$(s).classList.toggle("on",s===id)})}
function renderLvls(){var g=$("lvlGrid");g.innerHTML="";LEVELS.forEach(function(l,i){var b=document.createElement("button");b.className="lvl"+(doneList.indexOf(i)>=0?" done":"");b.innerHTML=(doneList.indexOf(i)>=0?"✅ ":"")+(i+1)+'<span class="nc">'+l.name+" · "+l.terms.length+"色</span>";b.onclick=function(){sClick();startLevel(i)};g.appendChild(b)})}
function startLevel(i){li=i;L=LEVELS[i];paths=L.terms.map(function(){return[]});owner=[];for(var r=0;r<L.n;r++){owner.push([]);for(var c=0;c<L.n;c++)owner[r].push(-1)}strokes=0;$("lvl").textContent=i+1;$("strokes").textContent=0;sizeCv();show("s-game")}
function sizeCv(){var s=Math.min(440,innerWidth-24);cv.width=s;cv.height=s;CS=s/L.n;draw()}
function cellCenter(r,c){return[(c+.5)*CS,(r+.5)*CS]}
function draw(){var n=L.n;ctx.clearRect(0,0,cv.width,cv.height);
 // 网格
 ctx.strokeStyle="rgba(255,255,255,.1)";ctx.lineWidth=1;
 for(var i=0;i<=n;i++){ctx.beginPath();ctx.moveTo(i*CS,0);ctx.lineTo(i*CS,n*CS);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*CS);ctx.lineTo(n*CS,i*CS);ctx.stroke()}
 // 管道
 ctx.lineCap="round";
 for(var k=0;k<paths.length;k++){var p=paths[k];if(p.length<1)continue;
  ctx.strokeStyle=FCOLORS[k];ctx.lineWidth=CS*.34;ctx.globalAlpha=.85;ctx.beginPath();
  p.forEach(function(cell,i){var xy=cellCenter(cell[0],cell[1]);if(i===0)ctx.moveTo(xy[0],xy[1]);else ctx.lineTo(xy[0],xy[1])});
  ctx.stroke();ctx.globalAlpha=1}
 // 端点
 for(var k2=0;k2<L.terms.length;k2++){L.terms[k2].forEach(function(t){var xy=cellCenter(t[0],t[1]);ctx.fillStyle=FCOLORS[k2];ctx.beginPath();ctx.arc(xy[0],xy[1],CS*.3,0,7);ctx.fill();ctx.fillStyle="rgba(255,255,255,.85)";ctx.beginPath();ctx.arc(xy[0],xy[1],CS*.13,0,7);ctx.fill()})}}
function termOf(r,c){for(var k=0;k<L.terms.length;k++)for(var e=0;e<2;e++)if(L.terms[k][e][0]===r&&L.terms[k][e][1]===c)return k;return -1}
function erasePath(k){paths[k].forEach(function(cell){owner[cell[0]][cell[1]]=-1});paths[k]=[]}
function extendTo(r,c){var p=paths[dragK],last=p[p.length-1];
 if(Math.abs(r-last[0])+Math.abs(c-last[1])!==1)return; // 必须相邻
 var tk=termOf(r,c);
 if(tk>=0&&tk!==dragK)return; // 别色端点
 if(owner[r][c]>=0&&owner[r][c]!==dragK)return; // 别色管道
 // 回退：走到自己路径上则截断
 var idx=-1;for(var i=0;i<p.length;i++)if(p[i][0]===r&&p[i][1]===c){idx=i;break}
 if(idx>=0){for(var j=p.length-1;j>idx;j--){owner[p[j][0]][p[j][1]]=-1;p.pop()}draw();return}
 // 自己的另一端点：允许连上
 p.push([r,c]);owner[r][c]=dragK;sDraw();draw();checkWin()}
function startDrag(r,c){var k=termOf(r,c);
 if(k<0){ // 从已有管道末端续画
  var o=owner[r][c];if(o<0)return;var p=paths[o],last=p[p.length-1];
  if(!(last[0]===r&&last[1]===c)){ // 不是末端：从该点截断重画
   var idx=-1;for(var i=0;i<p.length;i++)if(p[i][0]===r&&p[i][1]===c){idx=i;break}
   for(var j=p.length-1;j>idx;j--){owner[p[j][0]][p[j][1]]=-1;p.pop()}}
  dragK=o;dragging=true;strokes++;$("strokes").textContent=strokes;return}
 erasePath(k);paths[k]=[[r,c]];owner[r][c]=k;dragK=k;dragging=true;strokes++;$("strokes").textContent=strokes;sClick();draw()}
function checkWin(){var n=L.n;
 for(var r=0;r<n;r++)for(var c=0;c<n;c++)if(owner[r][c]<0)return;
 for(var k=0;k<L.terms.length;k++){var p=paths[k];if(p.length<2)return;
  var has0=false,has1=false;p.forEach(function(cell){if(cell[0]===L.terms[k][0][0]&&cell[1]===L.terms[k][0][1])has0=true;if(cell[0]===L.terms[k][1][0]&&cell[1]===L.terms[k][1][1])has1=true});
  if(!has0||has1===false)return;if(!has1)return}
 levelClear()}
function levelClear(){sDone();var r=cv.getBoundingClientRect();for(var i=0;i<4;i++)setTimeout(function(){burst(r.left+Math.random()*r.width,r.top+Math.random()*r.height,FCOLORS[i%FCOLORS.length],18)},i*110);
 var sc=Math.max(100,1000-strokes*20);totalScore=(totalScore||0)+sc;
 if(doneList.indexOf(li)<0){doneList.push(li);store.set("done",doneList)}
 setTimeout(function(){
  if(li+1<LEVELS.length){floatTxt("第"+(li+2)+"关",innerWidth/2,innerHeight/2,"#ffd76a");startLevel(li+1)}
  else{gameWin()}},900)}
function gameWin(){sWin();for(var i=0;i<6;i++)setTimeout(function(){burst(innerWidth/2+(Math.random()-.5)*280,innerHeight/3,["#ffd76a","#7dd3fc","#f0abfc"][i%3],24)},i*130);
 var best=store.get("best",null),nb=false;if(best==null||totalScore>best){store.set("best",totalScore);nb=true}
 setTimeout(function(){$("endInfo").textContent="6 关全通 · 总分 "+totalScore;$("endBest").textContent=nb?"🏆 新纪录！":"历史最高 "+best;show("s-end")},700)}
function pos2cell(e){var r=cv.getBoundingClientRect();var x=(e.touches?e.touches[0].clientX:e.clientX)-r.left,y=(e.touches?e.touches[0].clientY:e.clientY)-r.top;var c=Math.floor(x/CS),rr=Math.floor(y/CS);if(c<0||c>=L.n||rr<0||rr>=L.n)return null;return[rr,c]}
cv.addEventListener("touchstart",function(e){e.preventDefault();var p=pos2cell(e);if(p)startDrag(p[0],p[1])},{passive:false});
cv.addEventListener("touchmove",function(e){if(!dragging)return;e.preventDefault();var p=pos2cell(e);if(p)extendTo(p[0],p[1])},{passive:false});
cv.addEventListener("touchend",function(e){dragging=false;draw()});
var mdown=false;
cv.addEventListener("mousedown",function(e){var p=pos2cell(e);if(p){mdown=true;startDrag(p[0],p[1])}});
cv.addEventListener("mousemove",function(e){if(!mdown||!dragging)return;var p=pos2cell(e);if(p)extendTo(p[0],p[1])});
cv.addEventListener("mouseup",function(){mdown=false;dragging=false;draw()});
$("btnReset").onclick=function(){sClick();startLevel(li)};
$("btnLvls").onclick=function(){sClick();renderLvls();show("s-start")};
$("btnAgain").onclick=function(){sClick();totalScore=0;startLevel(0)};
$("btnHome").onclick=function(){sClick();renderLvls();show("s-start")};
$("sndBtn").onclick=function(){soundOn=!soundOn;store.set("sound",soundOn);$("sndBtn").textContent=soundOn?"🔊":"🔇";if(soundOn)sClick()};
$("sndBtn").textContent=soundOn?"🔊":"🔇";
$("pauseBtn").onclick=function(){if(!$("s-game").classList.contains("on"))return;sClick();$("pauseov").classList.add("on")};
$("hintBtn").onclick=function(){if(!$("s-game").classList.contains("on"))return;sClick();$("hintText").innerHTML="<b style='color:#fff'>第 "+(li+1)+" 关 · "+L.name+"</b><br>"+HINTS[li];$("hintov").classList.add("on")};
$("hintClose").onclick=function(){sClick();$("hintov").classList.remove("on")};
$("btnResume").onclick=function(){sClick();$("pauseov").classList.remove("on")};
$("btnQuit").onclick=function(){sClick();$("pauseov").classList.remove("on");renderLvls();show("s-start")};
renderLvls();totalScore=0;
</script>
</body>
</html>
