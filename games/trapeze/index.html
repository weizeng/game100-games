<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>空中飞人</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0b0a14;overflow:hidden}
body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:#fff}
#wrap{max-width:430px;height:100%;margin:0 auto;position:relative;background:#141021}
canvas{display:block;width:100%;aspect-ratio:360/520;touch-action:none;background:#141021}
.hud{position:absolute;top:6px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:center;pointer-events:none;z-index:5}
#scoreBox{background:rgba(0,0,0,.45);border:1px solid #d81b60;border-radius:10px;padding:4px 10px;font-size:14px;font-weight:bold}
#comboBox{font-size:12px;color:#ffea00;margin-top:2px;min-height:16px}
.hudbtns{pointer-events:auto}
.iconbtn{width:44px;height:44px;font-size:22px;background:rgba(0,0,0,.45);border:1px solid #555;border-radius:12px;color:#fff;margin-left:6px}
.ovl{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,8,22,.88);z-index:10;text-align:center;padding:24px}
.hidden{display:none!important}
.ovl h1{font-size:34px;margin-bottom:6px}
.ovl h2{font-size:26px;margin-bottom:10px;color:#ffea00}
.ovl p{font-size:14px;line-height:1.9;color:#cfc6e8;margin-bottom:14px;max-width:300px}
.bigbtn{min-width:170px;min-height:52px;font-size:20px;font-weight:bold;color:#fff;background:linear-gradient(135deg,#d81b60,#8e0038);border:none;border-radius:16px;margin:6px;box-shadow:0 4px 14px rgba(216,27,96,.5)}
.bigbtn:active{transform:scale(.95)}
.rec{color:#ffea00;font-weight:bold;margin:6px 0;animation:pop .5s ease}
@keyframes pop{0%{transform:scale(.5);opacity:0}100%{transform:scale(1);opacity:1}}
.tip{font-size:12px;color:#8f86ad;margin-top:10px}
</style>
</head>
<body>
<div id="wrap">
<canvas id="cv" width="360" height="520"></canvas>
<div class="hud">
<div><div id="scoreBox">0 分</div><div id="comboBox"></div></div>
<div class="hudbtns"><button id="muteBtn" class="iconbtn">🔊</button><button id="pauseBtn" class="iconbtn">⏸</button></div>
</div>
<div id="menu" class="ovl">
<h1>🎪 空中飞人</h1>
<p>夜空马戏篷下荡秋千！<br>👆 点按屏幕 = 从秋千跃出<br>👆 空中再点按 = 抓住下一架秋千<br>💡 等下一架秋千荡过来时再跃出！<br>接近时进入慢动作，套中金色圆环即抓住<br>抓空或落地就结束，每次接力 +100，连击翻倍！<br>秋千越荡越快、间距越拉越大。</p>
<button id="startBtn" class="bigbtn">开始表演</button>
<div class="tip" id="menuBest"></div>
</div>
<div id="pause" class="ovl hidden">
<h2>⏸ 已暂停</h2>
<button id="resumeBtn" class="bigbtn">继续</button>
<button id="quitBtn" class="bigbtn" style="background:linear-gradient(135deg,#546e7a,#37474f)">重来</button>
</div>
<div id="over" class="ovl hidden">
<h2>🎪 表演结束</h2>
<div id="newRec" class="rec hidden">🏆 新纪录！</div>
<p id="overInfo"></p>
<button id="againBtn" class="bigbtn">再来一次</button>
</div>
</div>
<script>
'use strict';
(function(){
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var W=cv.width,H=cv.height;
var HS='g100_trapeze_hs';
var best=parseInt(localStorage.getItem(HS)||'0',10)||0;
var muted=localStorage.getItem('g100_sound')==='0';
var AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended'){AC.resume();}return AC;}
function tone(f0,f1,dur,type,vol,delay){
  if(muted)return;var a=ac();if(!a)return;
  var t=a.currentTime+(delay||0);
  var o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(Math.max(1,f0),t);
  if(f1&&f1!==f0)o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol||0.16,t+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+0.05);
}
function sfx(n){
  if(n==='click')tone(660,660,0.07,'square',0.1);
  else if(n==='release')tone(300,720,0.18,'sine',0.15);
  else if(n==='catch'){tone(523,523,0.09,'sine',0.15);tone(784,784,0.13,'sine',0.15,0.09);}
  else if(n==='combo'){tone(523,523,0.08,'triangle',0.16);tone(659,659,0.08,'triangle',0.16,0.08);tone(880,880,0.16,'triangle',0.16,0.16);}
  else if(n==='fail')tone(240,70,0.45,'sawtooth',0.2);
  else if(n==='win'){var f=[523,659,784,1046];for(var i=0;i<f.length;i++)tone(f[i],f[i],0.12,'triangle',0.16,i*0.1);}
}
function buzz(p){if(navigator.vibrate){try{navigator.vibrate(p);}catch(e){}}}
var mode='menu',phase='hold';
var swings=[],ci=0,catches=0,score=0,combo=1;
var p={x:0,y:0,vx:0,vy:0};
var missed=false,lastTapT=0,cam=0,focusZone=false;
var parts=[],floats=[];
var stars=[];
for(var i=0;i<80;i++)stars.push({x:Math.random()*W,y:Math.random()*H*0.55,r:Math.random()*1.6+0.4,tw:Math.random()*6.28});
function seat(s){
  var th=s.A*Math.sin(s.ph);
  return {x:s.px+s.L*Math.sin(th),y:s.py+s.L*Math.cos(th),th:th};
}
var OM=1.87,swingIdx=0;
function omNow(){return Math.min(1.87*(1+catches*0.06),3.2);}
function newSwing(prevX,n){
  var gap=Math.min(95+n*6,225);
  swingIdx++;
  return {px:prevX+gap,py:88+Math.random()*24,L:158+Math.random()*24,
    A:0.5+Math.random()*0.14,ph:(swingIdx%2)*Math.PI,idx:swingIdx};
}
function reset(){
  swingIdx=0;catches=0;
  OM=omNow();
  swings=[{px:150,py:92,L:165,A:0.55,ph:0,idx:0}];
  swings.push(newSwing(150,0));
  ci=0;score=0;combo=1;missed=false;phase='hold';cam=0;
  var s0=seat(swings[0]);p.x=s0.x;p.y=s0.y;p.vx=0;p.vy=0;
  parts=[];floats=[];updHud();
}
function updHud(){
  document.getElementById('scoreBox').textContent=score+' 分';
  document.getElementById('comboBox').textContent=combo>1?('🔥 连击 x'+combo):'';
}
function addFloat(x,y,txt,color){floats.push({x:x,y:y,txt:txt,color:color,life:1.2,max:1.2});}
function burst(x,y,color,n){
  for(var i=0;i<n;i++){
    var a=Math.random()*6.28,sp=60+Math.random()*140;
    parts.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-60,life:0.9,max:0.9,color:color,r:2+Math.random()*2.5});
  }
}
function confetti(){
  var cols=['#ffea00','#ff4081','#69f0ae','#40c4ff','#ffab40'];
  for(var i=0;i<50;i++){
    parts.push({x:cam+Math.random()*W,y:-10,vx:(Math.random()-0.5)*60,vy:80+Math.random()*120,
      life:1.6,max:1.6,color:cols[i%cols.length],r:2.5+Math.random()*3});
  }
}
function onCatch(ns){
  ci++;catches++;
  OM=omNow();
  var gain=100*combo;score+=gain;
  addFloat(ns.x,ns.y-30,'+'+gain,'#a7ffeb');
  burst(ns.x,ns.y,'#ffd54f',26);
  buzz(25);
  if(combo>=2&&(combo%3===0||combo===2)){
    sfx('combo');
    addFloat(ns.x,ns.y-58,'连击 x'+combo+'！','#ffea00');
    if(combo%6===0)confetti();
  }else sfx('catch');
  combo++;
  swings.push(newSwing(swings[swings.length-1].px,catches));
  while(swings.length>3&&swings[0].px<cam-120)swings.shift(),ci--;
  phase='hold';missed=false;
  var s0=seat(swings[ci]);p.x=s0.x;p.y=s0.y;p.vx=0;p.vy=0;
  updHud();
}
function gameOver(){
  mode='over';
  sfx('fail');buzz([60,40,60]);
  var rec=false;
  if(score>best){best=score;localStorage.setItem(HS,String(best));rec=true;sfx('win');}
  document.getElementById('overInfo').innerHTML=
    '本场得分：<b>'+score+'</b><br>成功接力：<b>'+catches+'</b> 次<br>历史最高：<b>'+best+'</b>';
  document.getElementById('newRec').classList.toggle('hidden',!rec);
  document.getElementById('over').classList.remove('hidden');
  document.getElementById('pauseBtn').textContent='⏸';
}
function doTap(){
  if(mode!=='play')return;
  var now=performance.now();
  if(now-lastTapT<220)return;lastTapT=now;ac();
  if(phase==='hold'){
    var sw=swings[ci],s=seat(sw);
    var dth=sw.A*OM*Math.cos(sw.ph);
    p.x=s.x;p.y=s.y;
    p.vx=sw.L*Math.cos(s.th)*dth;
    p.vy=-sw.L*Math.sin(s.th)*dth-150;
    phase='fly';missed=false;
    sfx('release');
    addFloat(p.x,p.y-22,'跃！','#ffd54f');
  }else if(phase==='fly'&&!missed){
    var nx=seat(swings[ci+1]);
    var dx=p.x-nx.x,dy=p.y-nx.y;
    if(Math.sqrt(dx*dx+dy*dy)<28)onCatch(nx);
    else{missed=true;addFloat(p.x,p.y-24,'抓空！','#ff8a80');}
  }
}
var lastT=0;
function loop(ts){
  requestAnimationFrame(loop);
  if(!lastT)lastT=ts;
  var dt=Math.min(0.05,(ts-lastT)/1000);lastT=ts;
  if(mode==='play'){
    var i,target;
    var pdt=dt;
    if(phase==='fly'){
      var _ns=seat(swings[ci+1]);
      var _dx=p.x-_ns.x,_dy=p.y-_ns.y;
      focusZone=(_dx*_dx+_dy*_dy<80*80);
      if(focusZone){pdt=dt*0.35;}
    }else focusZone=false;
    for(i=0;i<swings.length;i++)swings[i].ph+=OM*pdt;
    if(phase==='hold'){
      var s=seat(swings[ci]);p.x=s.x;p.y=s.y;
      target=swings[ci].px-110;
    }else{
      p.vy+=700*pdt;p.x+=p.vx*pdt;p.y+=p.vy*pdt;
      target=p.x-160;
      if(p.y>H+24){gameOver();}
    }
    if(target<-30)target=-30;
    cam+=(target-cam)*Math.min(1,dt*5);
    for(i=parts.length-1;i>=0;i--){var q=parts[i];q.life-=dt;
      if(q.life<=0){parts.splice(i,1);continue;}
      q.vy+=420*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;}
    for(i=floats.length-1;i>=0;i--){var f=floats[i];f.life-=dt;f.y-=36*dt;
      if(f.life<=0)floats.splice(i,1);}
  }
  draw(ts/1000);
}
function draw(t){
  var g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#0d0a1f');g.addColorStop(0.55,'#1a1033');g.addColorStop(1,'#241536');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  var i;
  for(i=0;i<stars.length;i++){var st=stars[i];
    ctx.globalAlpha=0.35+0.65*Math.abs(Math.sin(t*1.5+st.tw));
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(st.x,st.y,st.r,0,6.29);ctx.fill();}
  ctx.globalAlpha=1;
  ctx.fillStyle='#f4f1de';ctx.beginPath();ctx.arc(308,52,20,0,6.29);ctx.fill();
  ctx.fillStyle='#141021';ctx.beginPath();ctx.arc(300,46,18,0,6.29);ctx.fill();
  ctx.save();
  ctx.beginPath();ctx.moveTo(-40,100);ctx.lineTo(W/2,-70);ctx.lineTo(W+40,100);ctx.closePath();ctx.clip();
  for(i=-2;i<12;i++){ctx.fillStyle=(i%2===0)?'#6a2c91':'#4a1d68';
    ctx.fillRect(i*60-120,-80,30,220);}
  ctx.restore();
  ctx.fillStyle='#2c1a4d';ctx.fillRect(-40,92,W+80,10);
  ctx.fillStyle='#1a0f2e';ctx.fillRect(0,H-60,W,60);
  ctx.fillStyle='rgba(216,27,96,.25)';ctx.fillRect(0,H-60,W,3);
  ctx.save();ctx.translate(-cam,0);
  for(i=0;i<swings.length;i++){
    var sw=swings[i],sd=seat(sw);
    ctx.strokeStyle='#caa25a';ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(sw.px,sw.py);ctx.lineTo(sd.x,sd.y);ctx.stroke();
    ctx.fillStyle='#8d6e3a';ctx.beginPath();ctx.arc(sw.px,sw.py,5,0,6.29);ctx.fill();
    ctx.fillStyle='#ffd54f';ctx.fillRect(sd.x-14,sd.y-3,28,7);
    ctx.fillStyle='#8e0038';ctx.fillRect(sd.x-14,sd.y-3,28,2.5);
    if(phase==='fly'&&i===ci+1){
      var rr=28+((focusZone)?3*Math.sin(t*14):0);
      ctx.strokeStyle=focusZone?'rgba(255,234,0,.95)':'rgba(255,234,0,.65)';
      ctx.lineWidth=focusZone?3:2;ctx.setLineDash([6,5]);
      ctx.beginPath();ctx.arc(sd.x,sd.y,rr,0,6.29);ctx.stroke();ctx.setLineDash([]);
    }
    if(phase==='hold'&&i===ci){
      ctx.font='26px serif';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText('🤸',sd.x,sd.y+22);
    }
  }
  if(phase==='fly'){
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(Math.atan2(p.vy,p.vx)+0.5);
    ctx.font='28px serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('🤸',0,0);ctx.restore();
  }
  var j;
  for(j=0;j<parts.length;j++){var q2=parts[j];
    ctx.globalAlpha=Math.max(0,q2.life/q2.max);
    ctx.fillStyle=q2.color;ctx.fillRect(q2.x-q2.r/2,q2.y-q2.r/2,q2.r,q2.r);}
  ctx.globalAlpha=1;
  ctx.textAlign='center';
  for(j=0;j<floats.length;j++){var f2=floats[j];
    ctx.globalAlpha=Math.max(0,f2.life/f2.max);
    ctx.fillStyle=f2.color;ctx.font='bold 17px sans-serif';
    ctx.fillText(f2.txt,f2.x,f2.y);}
  ctx.globalAlpha=1;
  ctx.restore();
  if(mode==='play'&&phase==='hold'&&catches===0){
    ctx.fillStyle='rgba(255,255,255,.9)';ctx.font='bold 15px sans-serif';ctx.textAlign='center';
    ctx.fillText('👆 点按屏幕，从秋千跃出！',W/2,H-90);
  }
}
cv.addEventListener('pointerdown',function(e){e.preventDefault();doTap();});
cv.addEventListener('contextmenu',function(e){e.preventDefault();});
function show(id){document.getElementById(id).classList.remove('hidden');}
function hide(id){document.getElementById(id).classList.add('hidden');}
document.getElementById('startBtn').addEventListener('click',function(){
  ac();sfx('click');reset();mode='play';hide('menu');hide('over');hide('pause');
});
document.getElementById('againBtn').addEventListener('click',function(){
  ac();sfx('click');reset();mode='play';hide('over');
});
document.getElementById('pauseBtn').addEventListener('click',function(){
  if(mode==='play'){mode='pause';show('pause');this.textContent='▶';sfx('click');}
  else if(mode==='pause'){mode='play';hide('pause');this.textContent='⏸';sfx('click');}
});
document.getElementById('resumeBtn').addEventListener('click',function(){
  sfx('click');mode='play';hide('pause');document.getElementById('pauseBtn').textContent='⏸';
});
document.getElementById('quitBtn').addEventListener('click',function(){
  sfx('click');reset();mode='play';hide('pause');document.getElementById('pauseBtn').textContent='⏸';
});
var muteBtn=document.getElementById('muteBtn');
function updMute(){muteBtn.textContent=muted?'🔇':'🔊';}
muteBtn.addEventListener('click',function(){
  muted=!muted;localStorage.setItem('g100_sound',muted?'0':'1');updMute();
  if(!muted)sfx('click');
});
updMute();
document.getElementById('menuBest').textContent=best>0?('历史最高：'+best+' 分'):'';
reset();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
