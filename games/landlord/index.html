<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>斗地主擂台</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{display:flex;justify-content:center;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.wrap{width:100%;max-width:480px;height:100%;padding:12px;display:flex;flex-direction:column;align-items:center;gap:10px}
.topbar{width:100%;display:flex;justify-content:space-between;align-items:center;flex-wrap:nowrap!important}
.topbar .stat{display:flex;gap:8px;align-items:center;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:13px}
.topbar .tools{display:flex;gap:6px}
.topbar .tools .iconbtn{min-width:44px;min-height:44px;padding:0 6px}
.stagebox{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
#cv{touch-action:none;display:block}
.overlay{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;z-index:20;padding:24px;text-align:center}
.overlay.hidden{display:none!important}
.lvgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:100%}
.lvgrid .lvl{min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:17px;padding:4px!important;line-height:1.1}
.lvgrid .lvl small{font-size:10px;letter-spacing:-1px;margin-top:2px}
.rowbtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:100%}
#tutStep{font-size:12px;opacity:.7}
#toast{position:fixed;left:50%;top:16%;transform:translate(-50%,-10px);background:rgba(10,8,30,.88);color:#fff;font-weight:800;padding:10px 18px;border-radius:999px;z-index:999;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;font-size:15px;box-shadow:0 0 18px rgba(255,61,154,.5);white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
.hidden{display:none!important}
.btn.ghost.on,.btn.ghost[aria-pressed="true"]{outline:3px solid #ff3d9a!important;outline-offset:-3px;filter:brightness(1.08)}
.rowbtns .iconbtn{flex:0 0 auto!important;min-width:48px!important;min-height:48px!important}

.ctl{width:100%;display:flex;gap:8px;min-height:52px}
.ctl button{flex:1;min-height:52px;font-size:16px;padding:4px 4px!important;line-height:1.15}
.ctl button small{display:block;font-size:11px;opacity:.85}
</style>
<!-- GAME UI BEGIN -->
<style>
:root{--page:#f5e4eb;--surface:#fff8fc;--soft:#edd5e2;--ink:#4e2e49;--muted:#806079;--accent:#a33d70;--on-accent:#ffffff;--line:#d9b4ca;--stage:#33223d;--page:#8d58ff;--surface:#fff4fb;--soft:#ffdff0;--ink:#5a1f55;--muted:#91517f;--accent:#7d6619;--on-accent:#ffffff;--line:#ff9fd0;--b-bg1:#ff8ac6;--b-bg2:#8d58ff;--b-btn:#ffcf33;--b-btn-hi:#ffe07a;--b-edge:#e08600;--b-glow:#ffd6f0;--b-glow-rgb:255,214,240;--b-pedge-rgb:255,159,208;--b-btn-ink:#7b4a00;--b-btn-tsh:0 1px 0 rgba(255,255,255,.45);--b-coin-ink:#7b4a00;--b-coin-tsh:none;--b-key-ink:#7d6619;--b-title:#8f5600}
/* Shared presentation only; mechanics and state remain inside each standalone game. */

.game-ui body>.wrap{padding:20px 16px max(20px,env(safe-area-inset-bottom));gap:14px;max-width:500px}
.game-ui #app{background:var(--page);color:var(--ink)}
.game-ui :is(.topbar,#topbar){gap:8px;flex-wrap:wrap;min-height:58px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:10px 12px;box-shadow:0 3px 0 var(--soft);font-size:13px}
.game-ui :is(.title,.tb-title,.tb-title,#topbar .t,.topbar .t){color:var(--ink);font-size:16px;font-weight:750;letter-spacing:0}

.game-ui :is(.stat,.topbar .s,.topbar .stat,.scorebar,.stats,.tip,.hint,.hintline,.hsline,.best,.hiscore){color:var(--muted);line-height:1.7}
.game-ui :is(.hint,.hintline,.tip){font-size:12px;max-width:40em;text-wrap:pretty}
.game-ui .scorebar{padding:6px 10px;gap:8px;flex-wrap:wrap}
.game-ui :is(.iconbtn,.iconBtn,.icobtn,.ibtn,.tbtn,.hbtn,.ib,.iconBtn,.pause){min-width:44px;min-height:44px;flex-shrink:0;border-radius:12px;background:var(--soft);color:var(--ink);border:1px solid var(--line);box-shadow:none;font-size:17px}
.game-ui button{font-family:inherit;cursor:pointer;touch-action:manipulation}
.game-ui button:focus-visible,.game-ui [tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.game-ui :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn){background:var(--accent);color:var(--on-accent);border:1px solid transparent;border-radius:13px;min-height:50px;padding:13px 28px;font-size:16px;font-weight:750;letter-spacing:0;box-shadow:0 4px 0 var(--line);text-shadow:none;max-width:100%}
.game-ui :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn):active{box-shadow:none;transform:translateY(2px)}
.game-ui :is(.ghost,.ghostbtn,.btn2,.abtn,.toolbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line);box-shadow:none;border-radius:12px;min-height:44px}
.game-ui :is(.rowbtns,.btnrow,.ctlrow){gap:10px;flex-wrap:wrap;justify-content:center}
.game-ui :is(.pill,.hudbox,.hud .p){background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:none;font-variant-numeric:tabular-nums}
.game-ui :is(.dbtn,.cbtn,.gbtn,.holdbtn,.firebtn,.bombbtn,.jumpbtn,.pumpbtn,.nbtn){border-radius:12px;box-shadow:0 3px 0 var(--line);min-height:44px}
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv,.screen):has(>.ui-panel){padding:20px;overflow-y:auto;overscroll-behavior:contain}
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv):has(>.ui-panel){background:var(--page);backdrop-filter:none;justify-content:safe center;align-items:center}
.game-ui .ui-panel{width:min(100%,380px);max-height:100%;overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:18px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:24px;padding:30px 24px;box-shadow:0 8px 0 var(--soft),0 20px 48px #15253618;text-align:center;margin:auto}
.game-ui .ui-panel :is(.card,.panel,.pausecard,.ovcard){display:contents}

.game-ui .ui-mode-status{display:block;padding:5px 10px;color:var(--accent);font-size:11px;font-weight:700;line-height:1.5;text-align:center;border:1px solid var(--line);border-radius:8px;background:var(--surface);margin:4px auto;max-width:100%;pointer-events:none}
.game-ui body>.wrap>canvas:not(#fx){background-color:var(--stage);box-shadow:0 0 0 1px var(--line),0 6px 0 var(--soft);border-radius:18px;flex-shrink:0}
.game-ui .screen>canvas.game{box-shadow:0 0 0 1px var(--line),0 6px 0 var(--soft)}
.game-ui #hud{gap:6px;background:var(--surface);color:var(--ink)}
.game-ui #hud :is(.left,.t,.s,.grp,.pill){color:var(--ink)}
.game-ui #hud .pill{background:var(--surface);border-color:var(--line)}
.game-ui body canvas:is(#cv,#game,#board){background-color:var(--stage)}
.game-ui :is(button.dbtn,button.cbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.game-ui :is(button.lvl,button.lvlbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line);border-radius:12px;min-height:54px}
.game-ui :is(button.lvl,button.lvlbtn) :is(.nc,.sz,small){color:var(--muted)}
.game-ui .ui-panel button.lvl{margin:0;min-width:44px;box-shadow:none;padding:8px}
.game-ui #hud :is(.left,.right,.hudl,.hbtns){gap:5px;flex-wrap:wrap}
.game-ui #hud :is(.left,.hudl){min-width:0;flex-shrink:1}
.game-ui #hud :is(.pill,.left){font-size:12px}
.game-ui button:disabled{cursor:default;opacity:.45;box-shadow:none}
.game-ui .ui-panel .ui-assist-note{color:var(--accent);font-weight:700}
@media(min-width:700px){.game-ui body>.wrap{padding-top:32px}.game-ui .ui-panel{padding:36px 30px}}
@media(max-width:360px){.game-ui body>.wrap{padding:10px;gap:10px}.game-ui .ui-panel{padding:22px 18px;gap:13px}.game-ui .ui-panel h1{font-size:26px}.game-ui .ui-emblem{width:70px;height:70px;font-size:38px}.game-ui :is(.topbar,#topbar){gap:5px;padding:8px}.game-ui :is(.iconbtn,.icobtn,.ibtn,.tbtn,.ib){min-width:44px;min-height:44px}}
@media(max-height:650px){.game-ui .ui-panel{padding:18px;gap:12px}.game-ui .ui-emblem{width:60px;height:60px;font-size:32px}.game-ui .ui-panel h1{font-size:25px}.game-ui .ui-panel :is(p,.howto,.sub,.rule){font-size:13px}}

/* 2026-10-20 热修：开局/结算遮罩铺满整屏，主按钮固定在面板底部，避免被画布尺寸裁切（#10） */
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv):has(>.ui-panel){position:fixed;inset:0;z-index:1000;border-radius:0;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
.game-ui .ui-panel{touch-action:pan-y}
.game-ui .ui-panel :is(#startBtn,#btnStart,.startbtn,#bStart,#restartBtn,#btnRestart,#againBtn,#btnAgain,#retryBtn,#btnRetry,#playBtn,#btnPlay){position:sticky;bottom:0;z-index:3;flex-shrink:0}
.game-ui .ui-panel :not(.card,.panel,.pausecard,.ovcard,.ui-mode):has(>:is(#startBtn,#btnStart,.startbtn,#bStart,#restartBtn,#btnRestart,#againBtn,#btnAgain,#retryBtn,#btnRetry,#playBtn,#btnPlay)){position:sticky;bottom:0;z-index:3;flex-shrink:0;background:var(--surface);box-shadow:0 -10px 10px -6px var(--surface)}

const unl=()=>({counter:(save.stars[1]||0)>0,swap:(save.stars[5]||0)>0,dbl:(save.stars[8]||0)>0});
let BOT=null,M=null,R=null,li=0,state='menu',FAST=false,sparks=[],sel=new Set(),hintList=[],hintI=0,busy=false;
function startLevel(i){li=i;M={hand:0,net:0,swap:unl().swap?1:0,log:[]};['lvlScr','overScr','pauseOv','tutScr','startScr'].forEach(x=>show(x,false));deal();}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function deal(){const L=LV[li];let d=[];let id=0;for(let v=3;v<=15;v++)for(let s=0;s<4;s++)d.push({v,s,id:id++});d.push({v:16,s:4,id:id++},{v:17,s:4,id:id++});shuffle(d);
 const hands=[d.slice(0,17),d.slice(17,34),d.slice(34,51)],bottom=d.slice(51);
 if(L.rig){// 首领作弊：首领 1 号拿到一手炸弹
  const v=11+Math.floor(Math.random()*4);const all=hands.flat().concat(bottom);const quad=all.filter(x=>x.v===v);const others=hands[1].filter(x=>x.v!==v);
  const pool=all.filter(x=>x.v!==v&&!others.includes(x));hands[1]=others.slice(0,13).concat(quad);const rest=shuffle(pool.concat(others.slice(13)));hands[0]=rest.slice(0,17);hands[2]=rest.slice(17,34);bottom.length=0;bottom.push(...rest.slice(34,37));}
 R={hands,bottom,lord:-1,bid:0,bids:[],turn:Math.floor(Math.random()*3),last:null,lastWho:-1,passes:0,plays:[[],[],[]],shown:[null,null,null],bombs:0,mult:1,dbl:1,played:[0,0,0],seen:[]};
 R.hands.forEach(sortH);sel.clear();hintList=[];state='bid';R.bidder=R.turn;R.bidCount=0;
 if(L.forceLord){R.bids=[3,0,0];setLord(0,3);}else stepBid();hud();}
function sortH(h){h.sort((a,b)=>b.v-a.v||a.s-b.s);}
function strength(h){const c=counts(h);let s=0;if(c[17])s+=3;if(c[16])s+=2;s+=(c[15]||0)*1.5+(c[14]||0)*.8;for(const v in c)if(c[v]===4)s+=3;return s;}
function stepBid(){if(state!=='bid')return;if(R.bidCount>=3||R.bid===3){if(R.lord<0){if(R.bid===0){toast('无人叫地主，重新发牌');return FAST?deal():setTimeout(deal,600);}}return setLord(R.lord,R.bid);}
 const p=R.bidder;if(p===0){renderCtl();return;}
 const go=()=>{const s=strength(R.hands[p])+(Math.random()-.5);let b=s>=8?3:s>=6?2:s>=4?1:0;if(b<=R.bid)b=0;doBid(p,b);};FAST?go():setTimeout(go,500);}
function doBid(p,b){R.shown[p]={bid:b};if(b>R.bid){R.bid=b;R.lord=p;tone(500+b*120,.12,'triangle');}else tone(300,.06);R.bidCount++;R.bidder=(R.bidder+1)%3;hud();stepBid();}
function setLord(p,b){R.lord=p;R.bid=b;R.hands[p].push(...R.bottom);sortH(R.hands[p]);R.turn=p;R.shown=[null,null,null];state='play';tone(880,.15,'triangle');toast((p===0?'你':LV[li].ai[p-1])+' 成为地主（'+b+' 分）',1600);renderCtl();hud();next();}
function isMate(a,b){return a!==R.lord&&b!==R.lord;}
function next(){if(state!=='play')return;renderCtl();if(R.turn===0){hintList=follows(R.hands[0],R.lastWho===0?null:R.last);hintI=0;return;}const go=()=>{if(state==='play'&&R.turn!==0)aiAct(R.turn);};FAST?go():setTimeout(go,650);}
function follows(hand,target){const all=genAll(hand);const ok=target?all.filter(p=>beats(p.cb,target)):all;return ok.sort((a,b)=>((a.cb.t==='bomb'||a.cb.t==='rocket')-(b.cb.t==='bomb'||b.cb.t==='rocket'))||a.cb.m-b.cb.m||b.cs.length-a.cs.length);}
function aiAct(p){const L=LV[li],h=R.hands[p];const lead=R.lastWho===p||!R.last;const target=lead?null:R.last;let choice=null;
 const enemies=[0,1,2].filter(q=>q!==p&&!isMate(p,q));const minEnemy=Math.min(...enemies.map(q=>R.hands[q].length));
 const smart=Math.random()<(p===0&&BOT!=null?BOT:L.skill);
 if(lead){const gs=decompose(h);if(gs.length===1)choice=gs[0];else{let opts=gs.filter(g=>{const t=parse(g).t;return t!=='bomb'&&t!=='rocket';});if(!opts.length)opts=gs;
   if(!smart)choice=opts[Math.floor(Math.random()*opts.length)];else{opts.sort((a,b)=>parse(a).m-parse(b).m||b.length-a.length);
    // 敌人只剩 1-2 张时，避免出单张/对子，或者出最大的
    if(minEnemy<=2){const multi=opts.filter(g=>g.length>minEnemy);if(multi.length)choice=multi[0];else choice=opts[opts.length-1];}else{const big=opts.find(g=>g.length>=5);choice=big&&parse(big).m<=12?big:opts[0];}}}}
 else{const cands=follows(h,target);const mateLast=isMate(p,R.lastWho)&&L.coop;
  const win=cands.find(c=>c.cs.length===h.length);
  if(win)choice=win.cs;
  else if(cands.length){if(!smart){choice=Math.random()<.6?cands[Math.floor(Math.random()*cands.length)].cs:null;}
   else if(mateLast){choice=null;if(target.m<=9&&R.hands[R.lastWho].length>4){const c0=cands.find(c=>c.cb.t!=='bomb'&&c.cb.t!=='rocket'&&c.cb.m<=13&&movesOf(h.filter(x=>!c.cs.includes(x)))<=movesOf(h));if(c0&&Math.random()<.3)choice=c0.cs;}}
   else{const cur=movesOf(h);let best=null,bv=1e9;for(const c of cands){const isB=c.cb.t==='bomb'||c.cb.t==='rocket';if(isB&&minEnemy>5&&cur>3)continue;const after=movesOf(h.filter(x=>!c.cs.includes(x)));let v=after*10+c.cb.m*.5+(isB?25:0);if(minEnemy<=3)v-=c.cb.m;if(v<bv){bv=v;best=c;}}
    if(best){const after=movesOf(h.filter(x=>!best.cs.includes(x)));if(after>cur+1&&minEnemy>8&&best.cb.m>=14&&Math.random()<.5)best=null;}choice=best?best.cs:null;}}}
 act(p,choice);}
function act(p,cs){if(cs&&cs.length){const cb=parse(cs);if(!cb||(R.lastWho!==p&&R.last&&!beats(cb,R.last))){if(p===0){toast('牌型不对或压不过');tone(180,.1,'square');return false;}cs=null;}else{
  const ids=new Set(cs.map(x=>x.id));R.hands[p]=R.hands[p].filter(x=>!ids.has(x.id));R.last=cb;R.lastWho=p;R.passes=0;R.shown[p]=cs.slice();R.played[p]++;R.seen.push(...cs);
  if(cb.t==='bomb'||cb.t==='rocket'){R.bombs++;R.mult*=2;noise(.4,.25,900);tone(80,.4,'sawtooth',.12,40);for(let i=0;i<24;i++)burst(sparks,p===0?W/2:p===1?280:80,p===0?300:170,['#ffd34d','#ff5a2c'][i%2],2);toast(cb.t==='rocket'?'🚀 王炸！倍数×2':'💣 炸弹！倍数×2',1200);}
  else if(['straight','pairs','plane','plane1','plane2'].includes(cb.t)){tone(660,.08,'square',.07);tone(990,.12,'square',.07,null,.08);}else tone(520+cb.m*20,.08,'triangle',.09);
  if(!R.hands[p].length)return endHand(p);}}
 if(!cs||!cs.length){R.shown[p]='pass';R.passes++;tone(260,.05,'sine',.05);if(R.passes>=2){R.last=null;R.passes=0;}}
 R.turn=(p+1)%3;if(R.last===null&&R.lastWho>=0&&R.passes===0&&R.turn!==R.lastWho){} 
 if(!R.last){R.turn=R.lastWho>=0?R.lastWho:R.turn;R.lastWho=R.turn;R.shown=R.shown.map((s,i)=>i===R.turn?null:s);}
 sel.clear();hud();next();return true;}
function endHand(w){state='handEnd';const L=LV[li];const lordWin=w===R.lord;let spring=false;
 if(lordWin&&R.played.filter((n,i)=>i!==R.lord).every(n=>n===0))spring=true;if(!lordWin&&R.played[R.lord]<=1)spring=true;
 const unit=R.bid*R.mult*(spring?2:1);const myDbl=R.dbl;let gain;if(R.lord===0)gain=(lordWin?2:-2)*unit*myDbl;else gain=(lordWin?-1:1)*unit*myDbl;
 M.net+=gain;M.hand++;M.log.push(gain);const iWon=gain>0;
 iWon?(tone(660,.12,'triangle'),tone(990,.2,'triangle',.1,null,.12)):tone(220,.4,'sawtooth',.08,90);
 if(iWon)for(let i=0;i<30;i++)burst(sparks,W/2,300,['#ffd34d','#ff3d9a','#3fc163'][i%3],2);
 R.result={lordWin,spring,gain,unit};hud();
 const L2=LV[li];const go=()=>{if(M.hand>=L2.hands)return finishMatch();state='between';renderCtl();};FAST?go():setTimeout(go,900);}
function finishMatch(){state='over';const L=LV[li];const g=L.goal;const st=M.net>=g*3?3:M.net>=g*2?2:M.net>=g?1:0;
 if(st>(save.stars[li]||0))save.stars[li]=st;if(M.net*L.base>(save.bestNet||0))save.bestNet=M.net*L.base;Store.set('save',save);legacyBest(sumStars(save)*100);
 $('overH').textContent=st?'🏆 擂台告捷！':'💀 擂台失利';$('finalScore').textContent=st?starStr(st):(M.net>0?'+':'')+M.net*L.base;
 $('overText').innerHTML='本擂台净赢 '+(M.net>0?'+':'')+M.net+' 份（'+(M.net*L.base)+' 豆）· 目标 '+g+' 份<br>每局：'+M.log.map(x=>(x>0?'+':'')+x).join(' / ')+'<br>'+(st?'达到目标 2 倍、3 倍可拿 ★★、★★★。':'提示：牌好就叫 3 分抢地主；农民要配合队友，地主剩一张时别出单张。');
 $('nextBtn').classList.toggle('hidden',!(st&&li<LV.length-1));show('overScr',true);st?tone(1320,.3,'triangle'):tone(150,.5,'sawtooth',.1,50);}
// ---------- 控制栏 ----------
function btn(label,sub,cls,fn,dis){const b=document.createElement('button');b.className='btn '+(cls||'');b.innerHTML=label+(sub!=null?'<small>'+sub+'</small>':'');b.disabled=!!dis;b.onclick=()=>{audio();fn();};return b;}
function renderCtl(){const c=$('ctl');c.innerHTML='';if(!R)return;
 if(state==='bid'&&R.bidder===0){c.append(btn('不叫',null,'ghost',()=>doBid(0,0)));for(let b=1;b<=3;b++)c.append(btn(b+' 分',null,b===3?'':'ghost',()=>doBid(0,b),b<=R.bid));if(M.swap)c.append(btn('换牌',M.swap,'ghost',()=>{M.swap--;deal();toast('🔄 已使用换牌卡');}));}
 else if(state==='play'&&R.turn===0){const lead=R.lastWho===0||!R.last;c.append(btn('不出',null,'ghost',()=>act(0,null),lead));c.append(btn('提示',null,'ghost',hint));c.append(btn('出牌',null,'',()=>act(0,R.hands[0].filter(x=>sel.has(x.id)))));
  if(unl().dbl&&R.dbl===1&&R.played[0]===0)c.append(btn('加倍',null,'ghost',()=>{R.dbl=2;toast('🔥 本局你的输赢 ×2');renderCtl();}));}
 else if(state==='between'){c.append(btn('下一局',(M.hand+1)+'/'+LV[li].hands,'',()=>deal()));}
 else c.append(btn(state==='bid'?'叫分中…':'等待对手…',null,'ghost',()=>{},true));}
function hint(){if(!hintList.length){toast('没有能压过的牌，点「不出」');return;}const h=hintList[hintI%hintList.length];hintI++;sel=new Set(h.cs.map(x=>x.id));tone(800,.05,'triangle');}
function hud(){$('lvT').textContent=(li+1)+'/15';$('handT').textContent=(M?Math.min(M.hand+1,LV[li].hands):1)+'/'+LV[li].hands;$('score').textContent=M?(M.net>0?'+':'')+M.net*LV[li].base:0;}
// ---------- 输入 ----------
const CW=44,CH=64,HY=430;
function hpos(i,n){const span=Math.min(W-16-CW,(n-1)*26);const x0=(W-span-CW)/2;return x0+(n>1?i*span/(n-1):0);}
cv.addEventListener('pointerdown',e=>{if(state!=='play'||R.turn!==0)return;const p=posOf(e,cv,W,H);const h=R.hands[0],n=h.length;
 for(let i=n-1;i>=0;i--){const x=hpos(i,n),up=sel.has(h[i].id)?-16:0;if(p.x>=x&&p.x<=x+CW&&p.y>=HY+up-4&&p.y<=HY+up+CH+20){sel.has(h[i].id)?sel.delete(h[i].id):sel.add(h[i].id);tone(700,.03,'triangle',.05);return;}}});
// ---------- 绘制 ----------
function card(c,x,y,w,h,up){shad(ctx,x+w/2,y+h+2,w/2-2,4,.28);box3d(ctx,x,y,w,h,up?'#fff3b0':'#fbf7ef',7);const red=c.s===1||c.s===3||c.v===17;const col=red?'#d62839':'#22223b';
 const fs=Math.round(w*.36);if(c.v>=16){txt(ctx,vname(c.v),x+w*.26,y+fs*.7,fs,col,'center',900);txt(ctx,'王',x+w*.26,y+fs*1.7,fs,col,'center',900);emo(ctx,'🃏',x+w*.62,y+h*.68,Math.round(w*.45));}
 else{txt(ctx,vname(c.v),x+w*.26,y+fs*.75,c.v===10?Math.round(fs*.78):fs,col,'center',900);txt(ctx,SU[c.s],x+w*.26,y+fs*1.75,Math.round(fs*.8),col);if(w>36)txt(ctx,SU[c.s],x+w*.62,y+h*.66,Math.round(w*.5),col);}
 if(up){ctx.strokeStyle='#ff3d9a';ctx.lineWidth=2.5;rr(ctx,x+1,y+1,w-2,h-2,7);ctx.stroke();}}
function miniRow(cs,cx,y){const n=cs.length,w=30,h=42,step=Math.min(15,(150-w)/Math.max(1,n-1));const x0=cx-((n-1)*step+w)/2;cs.forEach((c,i)=>card(c,x0+i*step,y,w,h));}
function seat(p,x,y){const L=LV[li];const isL=R&&R.lord===p;const name=p===0?'你':L.ai[p-1];
 box3d(ctx,x-44,y-26,88,70,isL?'#c9184a':'#355070',12);emo(ctx,p===0?'😎':L.boss?'🎩':'🧑',x,y-4,24);otxt(ctx,name,x,y+22,11,'#fff');if(isL)emo(ctx,'👑',x+34,y-24,16);
 if(p!==0&&R){box3d(ctx,x+(p===1?-70:42),y-18,28,40,'#e9d8a6',6);otxt(ctx,String(R.hands[p].length),x+(p===1?-56:56),y+2,15,R.hands[p].length<=2?'#ff4d6d':'#fff');}}
function render(dt){stage(ctx,W,H,'#1f7a4d','#0b3320');ctx.fillStyle='rgba(255,255,255,.05)';ctx.beginPath();ctx.ellipse(W/2,250,170,140,0,0,7);ctx.fill();
 if(!R){return;}const L=LV[li];
 seat(2,52,48);seat(1,W-52,48);
 // 底牌
 const bx=W/2-52;R.bottom.forEach((c,i)=>{if(state==='bid')box3d(ctx,bx+i*36,14,30,42,'#5a189a',6);else card(c,bx+i*36,14,30,42);});
 otxt(ctx,'底分 '+L.base+' · '+(R.bid||'-')+'分 ×'+R.mult+(R.dbl>1?' ×2':''),W/2,70,12,'#ffe8a3');
 // 出牌区
 const sh=[[W/2,330],[W-90,112],[90,112]];for(let p=0;p<3;p++){const s=R.shown[p];const[x,y]=sh[p];if(s==='pass')otxt(ctx,'不出',x,y+20,16,'#cde');else if(s&&s.bid!=null)otxt(ctx,s.bid?s.bid+' 分':'不叫',x,y+20,16,'#ffd34d');else if(Array.isArray(s))miniRow(s,x,p===0?y-28:y);}
 // 记牌器
 if(unl().counter&&state==='play'){const rem={};for(let v=3;v<=17;v++)rem[v]=v>=16?1:4;R.seen.concat(R.hands[0]).forEach(c=>rem[c.v]--);ctx.fillStyle='rgba(0,0,0,.3)';rr(ctx,8,176,W-16,30,8);ctx.fill();
  for(let v=3;v<=17;v++){const x=18+(v-3)*22.6;txt(ctx,vname(v),x,186,10,'#fff');txt(ctx,String(rem[v]),x,199,11,rem[v]?'#ffd34d':'#6c757d','center',900);}}
 // 轮到谁
 if(state==='play'){const[x,y]=R.turn===0?[W/2,402]:R.turn===1?[W-52,100]:[52,100];ctx.fillStyle='rgba(255,211,77,'+(.5+.4*Math.sin(performance.now()/200))+')';ctx.beginPath();ctx.arc(x,y,6,0,7);ctx.fill();}
 if(R.result&&(state==='between'||state==='handEnd'||state==='over')){const r=R.result;box3d(ctx,40,220,W-80,74,r.gain>0?'#2a9d8f':'#9d0208',14);otxt(ctx,(r.lordWin?'地主':'农民')+'获胜'+(r.spring?' · 春天！':''),W/2,242,16,'#fff');otxt(ctx,'你 '+(r.gain>0?'+':'')+r.gain*L.base+' 豆',W/2,272,20,'#ffd34d');}
 // 手牌
 const h=R.hands[0],n=h.length;h.forEach((c,i)=>{const up=sel.has(c.id);card(c,hpos(i,n),HY+(up?-16:0),CW,CH,up);});
 drawBurst(ctx,sparks);}
// ---------- 菜单与流程 ----------
function openLevels(){state='menu';const u=unl();levelMenu(LV,save,startLevel,'★'+sumStars(save)+' / 45 · 👑 首领擂台<br>'+(u.counter?'✅':'🔒')+'记牌器（过第2擂） '+(u.swap?'✅':'🔒')+'换牌卡（过第6擂） '+(u.dbl?'✅':'🔒')+'加倍（过第9擂）');}
