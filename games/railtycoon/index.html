<style>

<body>
<div class="wrap">
  <div class="topbar">
    <span class="title">🚇 轨线大亨</span>
    <span class="stat">得分 <b id="score">0</b> · 最佳 <b id="best">0</b></span>

    </span>
  </div>

</div>
<div class="overlay" id="startScr"><h1>🚇 轨线大亨</h1><p>在网格铺轨连接站点，开列车送达乘客。<br>15 关预算与拥堵升级，每 5 关高峰潮汐 Boss。<br>成长解锁快车、大容量与桥梁次数。</p><p id="bestLine"></p><button class="btn" id="startBtn">开始游戏</button></div>
<div class="overlay hidden" id="lvlScr"><h2>选择关卡</h2><p id="lvlInfo"></p><div class="lvgrid" id="lvgrid"></div><div class="rowbtns"><button class="btn ghost" id="shopBtn">成长商店</button><button class="btn ghost" id="backStart">返回</button></div></div>
<div class="overlay hidden" id="shopScr"><h2>成长商店</h2><p id="coinLine"></p><div class="shop" id="shopList"></div><button class="btn" id="shopBack">返回选关</button></div>
<div class="overlay hidden" id="tutScr"><h2 id="tutH"></h2><p id="tutP"></p><span id="tutStep"></span><div class="rowbtns"><button class="btn ghost" id="tutSkip">跳过</button><button class="btn" id="tutNext">下一步</button></div></div>
<div class="overlay hidden" id="pauseOv"><h2>⏸ 已暂停</h2><div class="rowbtns"><button class="btn" id="resumeBtn">继续</button><button class="btn ghost" id="menuBtn">选关</button></div></div>
<div class="overlay hidden" id="overScr"><h2 id="overH">过关！</h2><div class="score" id="finalScore">★★★</div><p id="overText"></p><div class="rowbtns"><button class="btn" id="nextBtn">下一关</button><button class="btn ghost" id="againBtn">再玩一次</button><button class="btn ghost" id="menu2Btn">选关</button></div></div>
<div id="toast"></div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const W=360,H=540;
const cv=$('cv'),ctx=cv.getContext('2d');
const UI=window.GameUI||{pick:a=>a,storageGet:k=>localStorage.getItem(k),storageSet:(k,v)=>localStorage.setItem(k,v)};
const FX=UI.fx&&UI.fx.on?UI.fx:null;
if(FX)FX.hidpi(cv,ctx,W,H);else{cv.width=W;cv.height=H;}
function show(id,on){$(id).classList.toggle('hidden',!on);}
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('on'),1200);}
function posOf(e){const r=cv.getBoundingClientRect();const t=(e.touches&&e.touches[0])||(e.changedTouches&&e.changedTouches[0])||e;return{x:(t.clientX-r.left)*W/r.width,y:(t.clientY-r.top)*H/r.height};}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};}

const PK='g100_railtycoon_prog',HK='g100_railtycoon_hs',MK='g100_railtycoon_mute';
let muted=UI.storageGet(MK)==='1',ac=null;$('muteBtn').textContent=muted?'🔇':'🔊';
function beep(f,d,type){if(muted)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(.12,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d);}catch(e){}}
$('muteBtn').onclick=()=>{muted=!muted;UI.storageSet(MK,muted?'1':'0');$('muteBtn').textContent=muted?'🔇':'🔊';};
function loadProg(){try{return JSON.parse(UI.storageGet(PK)||'{}');}catch(e){return{};}}
function saveProg(p){UI.storageSet(PK,JSON.stringify(p));}
let prog=loadProg();
if(!prog.stars)prog.stars={};if(prog.coins==null)prog.coins=0;if(prog.unlock==null)prog.unlock=1;
if(prog.speedLv==null)prog.speedLv=0;if(prog.capLv==null)prog.capLv=0;if(prog.bridgeLv==null)prog.bridgeLv=0;if(!prog.seenTut)prog.seenTut=0;
let best=+UI.storageGet(HK)||0;$('best').textContent=best;$('bestLine').textContent='解锁 '+prog.unlock+'/15 · 币 '+prog.coins+' · 星 '+Object.values(prog.stars).reduce((a,b)=>a+(b|0),0);

const TOTAL=15;
const COLS=6,ROWS=7,CELL=48,OX=24,OY=70;
let state='menu',lvl=1,score=0,sparks=[],last=0;
let stations=[],rails=new Set(),budget=0,usedRails=0,delivered=0,goal=0,boss=false;
let trains=[],passengers=[],timeLeft=0,phase='build',bridgeLeft=0,fails=0,water=new Set();

function key(c,r){return c+','+r;}
function parseKey(k){const[a,b]=k.split(',').map(Number);return{c:a,r:b};}
function cellAt(x,y){const c=Math.floor((x-OX)/CELL),r=Math.floor((y-OY)/CELL);if(c<0||r<0||c>=COLS||r>=ROWS)return null;return{c,r};}
function center(c,r){return{x:OX+c*CELL+CELL/2,y:OY+r*CELL+CELL/2};}
function neighbors(c,r){return[[c+1,r],[c-1,r],[c,r+1],[c,r-1]].filter(([x,y])=>x>=0&&y>=0&&x<COLS&&y<ROWS);}
function isStation(c,r){return stations.some(s=>s.c===c&&s.r===r);}

function genLevel(n){
  const rnd=mulberry32(n*7919+42);
  const st=[]; const used=new Set();
  const count=n===1?2:Math.min(5,2+Math.floor(n/3));
  while(st.length<count){
    const c=(rnd()*COLS)|0,r=(rnd()*ROWS)|0; const k=key(c,r);
    if(used.has(k))continue;
    if(st.some(s=>Math.abs(s.c-c)+Math.abs(s.r-r)<(n===1?3:2)))continue;
    used.add(k);st.push({c,r,id:st.length,name:String.fromCharCode(65+st.length)});
  }
  const special=new Set();
  const sc=n>=4?Math.min(6,1+Math.floor(n/3)):0;
  while(special.size<sc){
    const c=(rnd()*COLS)|0,r=(rnd()*ROWS)|0;
    if(used.has(key(c,r)))continue;
    special.add(key(c,r));
  }
  return{stations:st,special};
}

function trainSpeed(){return 90+prog.speedLv*35;}
function trainCap(){return 2+prog.capLv;}

function startLevel(n){
  lvl=n;boss=n%5===0;score=Math.max(0,score);delivered=0;fails=0;trains=[];passengers=[];phase='build';
  const L=genLevel(n);
  stations=L.stations;rails=new Set();water=L.special;
  stations.forEach(s=>rails.add(key(s.c,s.r)));
  goal=boss?Math.min(18,8+n):Math.min(14,3+Math.floor(n*0.8));
  budget=n===1?10:Math.min(28,10+n)+(prog.bridgeLv*2);
  usedRails=0;bridgeLeft=1+prog.bridgeLv+(boss?1:0);
  timeLeft=boss?75:0;
  spawnPassengers(true);
  state='play';last=performance.now();
  show('startScr',false);show('lvlScr',false);show('shopScr',false);show('tutScr',false);show('pauseOv',false);show('overScr',false);
  $('hint').textContent=boss?'👑 高峰潮汐：限时送达更多乘客，注意拥堵':'点相邻格铺轨连站，再点底部「发车」';
  $('score').textContent=score;beep(660,.08);
}

function spawnPassengers(init){
  const need=boss?4:Math.min(3,1+Math.floor(lvl/4));
  while(passengers.length<need&&delivered+passengers.length<goal){
    if(stations.length<2)break;
    let a=(Math.random()*stations.length)|0,b=(Math.random()*stations.length)|0;
    if(a===b)b=(b+1)%stations.length;
    passengers.push({from:stations[a].id,to:stations[b].id,wait:0,boarded:null});
  }
  if(init&&passengers.length===0&&stations.length>=2)
    passengers.push({from:stations[0].id,to:stations[1].id,wait:0,boarded:null});
}

function pathBetween(a,b){
  const start=key(a.c,a.r),goalK=key(b.c,b.r);
  if(!rails.has(start)||!rails.has(goalK))return null;
  const q=[start],prev=new Map([[start,null]]);
  while(q.length){
    const cur=q.shift(); if(cur===goalK)break;
    const {c,r}=parseKey(cur);
    for(const[nc,nr] of neighbors(c,r)){
      const nk=key(nc,nr);
      if(!rails.has(nk)||prev.has(nk))continue;
      prev.set(nk,cur);q.push(nk);
    }
  }
  if(!prev.has(goalK))return null;
  const path=[]; let cur=goalK; while(cur){path.push(parseKey(cur));cur=prev.get(cur);} path.reverse();
  return path;
}

function tryPlace(c,r){
  if(phase!=='build'||state!=='play')return;
  const k=key(c,r);
  if(isStation(c,r)){toast('站点已连通');return;}
  if(rails.has(k)){rails.delete(k);usedRails=Math.max(0,usedRails-1);beep(300,.05);return;}
  if(usedRails>=budget){toast('预算用尽');beep(180,.1,'square');return;}
  const adj=neighbors(c,r).some(([x,y])=>rails.has(key(x,y)));
  if(!adj){toast('需邻接已有轨道');beep(200,.06,'square');return;}
  if(water.has(k)){
    if(bridgeLeft<=0){toast('桥梁/隧道次数用尽');beep(180,.1,'square');return;}
    bridgeLeft--; toast('架桥/开隧 -1');
  }
  rails.add(k);usedRails++;beep(520,.05);
  if(FX){const p=center(c,r);FX.burst(sparks,p.x,p.y,'#5875FF',6);}
}

function launchTrains(){
  if(state!=='play'||phase!=='build')return;
  let launched=0;
  for(const p of passengers){
    if(p.boarded)continue;
    const a=stations.find(s=>s.id===p.from),b=stations.find(s=>s.id===p.to);
    if(!a||!b)continue;
    const path=pathBetween(a,b);
    if(!path||path.length<2)continue;
    let t=trains.find(tr=>tr.passengers.length<tr.cap&&tr.to===p.to&&tr.from===p.from&&!tr.done);
    if(!t){t={from:p.from,to:p.to,path,idx:0,t:0,passengers:[],cap:trainCap(),speed:trainSpeed(),done:false};trains.push(t);launched++;}
    if(t.passengers.length<t.cap){t.passengers.push(p);p.boarded=t;}
  }
  if(launched||trains.some(t=>t.passengers.length)){phase='run';beep(700,.1);toast('列车出发');}
  else{toast('先铺轨连通有乘客的站点');beep(200,.08,'square');}
}

function win(){
  if(state!=='play')return;state='over';
  const stars=fails===0&&usedRails<=budget*0.75?3:(fails<=1?2:1);
  const prev=prog.stars[lvl]|0;if(stars>prev)prog.stars[lvl]=stars;
  const gain=Math.floor(30+stars*15+(boss?50:0)+delivered*2);
  prog.coins+=gain;score+=gain;
  if(lvl>=prog.unlock&&lvl<TOTAL)prog.unlock=lvl+1;
  if(score>best){best=score;UI.storageSet(HK,String(best));$('best').textContent=best;}
  saveProg(prog);$('score').textContent=score;
  $('overH').textContent=boss?'高峰顶住了！':'线路开通！';
  $('finalScore').textContent='★'.repeat(stars)+'☆'.repeat(3-stars);
  $('overText').textContent='送达 '+delivered+'/'+goal+' · +'+gain+' 币 · 总币 '+prog.coins;
  $('nextBtn').style.display='';show('overScr',true);beep(900,.15);
  if(FX)for(let i=0;i<12;i++)FX.burst(sparks,W/2,220,'#FFD34D',4);
}
function lose(msg){
  if(state!=='play')return;state='over';
  $('overH').textContent=msg||'运营失败';
  $('finalScore').textContent='关 '+lvl;
  $('overText').textContent='送达 '+delivered+'/'+goal+' · 差评 '+fails;
  $('nextBtn').style.display='none';show('overScr',true);beep(180,.35,'sawtooth');
}

function update(dt){
  if(state!=='play')return;
  if(boss){timeLeft-=dt;if(timeLeft<=0){if(delivered>=goal)win();else lose('⏰ 高峰超时');return;}}
  for(const p of passengers){
    if(p.boarded)continue;p.wait+=dt;
    if(p.wait>18+(boss?-4:0)){fails++;p.wait=0;toast('乘客抱怨拥堵');beep(160,.15,'sawtooth');
      if(fails>=4){lose('差评太多');return;}}
  }
  for(const t of trains){
    if(t.done)continue;
    t.t+=dt*(t.speed/CELL);
    while(t.t>=1&&t.idx<t.path.length-1){t.t-=1;t.idx++;}
    if(t.idx>=t.path.length-1){
      delivered+=t.passengers.length;score+=t.passengers.length*10;$('score').textContent=score;
      passengers=passengers.filter(p=>!t.passengers.includes(p));
      t.done=true;beep(880,.08);
      if(FX){const p=t.path[t.path.length-1];const c=center(p.c,p.r);FX.burst(sparks,c.x,c.y,'#3FC163',8);}
      if(delivered>=goal){win();return;}
    }
  }
  trains=trains.filter(t=>!t.done);
  if(phase==='run'&&trains.length===0){phase='build';spawnPassengers(false);}
  if(boss&&phase==='build')spawnPassengers(false);
}

function draw(){
  if(FX)FX.stage(ctx,W,H,'#7aa0ff','#3a4fc8');else{ctx.fillStyle='#3a4fc8';ctx.fillRect(0,0,W,H);}
  ctx.fillStyle='rgba(0,0,0,.28)';ctx.fillRect(8,8,W-16,52);
  ctx.fillStyle='#fff';ctx.font='bold 13px sans-serif';ctx.textAlign='left';
  ctx.fillText((boss?'👑 ':'')+'送达 '+delivered+'/'+goal+(boss?(' · ⏱'+Math.ceil(timeLeft)+'s'):''),16,28);
  ctx.fillText('轨 '+usedRails+'/'+budget+' · 桥 '+bridgeLeft+' · '+(phase==='build'?'铺轨中':'运行中'),16,48);
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const x=OX+c*CELL,y=OY+r*CELL; const k=key(c,r);
    let col=water.has(k)?'#2a3a6a':'#5a7ad0';
    if(rails.has(k))col='#c8d6ff';
    if(FX)FX.tile(ctx,x+2,y+2,CELL-4,CELL-4,col,8);else{ctx.fillStyle=col;ctx.fillRect(x+2,y+2,CELL-4,CELL-4);}
    if(water.has(k)&&!rails.has(k)){ctx.fillStyle='#7ec8ff';ctx.font='16px sans-serif';ctx.textAlign='center';ctx.fillText('💧',x+CELL/2,y+CELL/2+6);}
  }
  ctx.strokeStyle='#2a3a8a';ctx.lineWidth=5;ctx.lineCap='round';
  for(const k of rails){
    const {c,r}=parseKey(k);const p=center(c,r);
    for(const[nc,nr] of neighbors(c,r)){
      if(nc<c||(nc===c&&nr<r))continue;
      if(!rails.has(key(nc,nr)))continue;
      const q=center(nc,nr);
      ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke();
    }
  }
  for(const s of stations){
    const p=center(s.c,s.r);
    if(FX)FX.orb(ctx,p.x,p.y,16,'#FFD34D');else{ctx.fillStyle='#FFD34D';ctx.beginPath();ctx.arc(p.x,p.y,16,0,7);ctx.fill();}
    ctx.fillStyle='#1a2040';ctx.font='bold 14px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(s.name,p.x,p.y);ctx.textBaseline='alphabetic';
  }
  const waitCount={};
  for(const p of passengers){if(p.boarded)continue;waitCount[p.from]=(waitCount[p.from]|0)+1;}
  for(const s of stations){
    const n=waitCount[s.id]|0;if(!n)continue;
    const p=center(s.c,s.r);
    ctx.fillStyle='#fff';ctx.font='11px sans-serif';ctx.textAlign='center';
    ctx.fillText('👤'+n,p.x,p.y-22);
  }
  for(const t of trains){
    const a=t.path[t.idx],b=t.path[Math.min(t.idx+1,t.path.length-1)];
    const pa=center(a.c,a.r),pb=center(b.c,b.r);
    const f=Math.min(1,t.t);const x=pa.x+(pb.x-pa.x)*f,y=pa.y+(pb.y-pa.y)*f;
    if(FX)FX.tile(ctx,x-12,y-8,24,16,'#FF5C8A',6);else{ctx.fillStyle='#FF5C8A';ctx.fillRect(x-12,y-8,24,16);}
    ctx.fillStyle='#fff';ctx.font='10px sans-serif';ctx.textAlign='center';ctx.fillText(t.passengers.length+'/'+t.cap,x,y+4);
  }
  const bx=W/2-70,by=H-58,bw=140,bh=44;
  if(FX)FX.tile(ctx,bx,by,bw,bh,phase==='build'?'#3FC163':'#8899bb',12);else{ctx.fillStyle=phase==='build'?'#3FC163':'#8899bb';ctx.fillRect(bx,by,bw,bh);}
  ctx.fillStyle='#fff';ctx.font='bold 16px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(phase==='build'?'▶ 发车':'运行中…',W/2,by+bh/2);ctx.textBaseline='alphabetic';
  if(FX)FX.drawBurst(ctx,sparks);
}
function frame(t){const dt=Math.min(.05,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

cv.addEventListener('pointerdown',e=>{
  e.preventDefault();if(state!=='play')return;
  const p=posOf(e);
  if(p.y>=H-58&&p.y<=H-14&&p.x>=W/2-70&&p.x<=W/2+70){if(phase==='build')launchTrains();return;}
  const cell=cellAt(p.x,p.y);if(!cell)return;
  tryPlace(cell.c,cell.r);
});

function tutorial(pages,done){let i=0;function render(){$('tutH').textContent=pages[i][0];$('tutP').innerHTML=pages[i][1];$('tutStep').textContent=(i+1)+' / '+pages.length;$('tutNext').textContent=i<pages.length-1?'下一步':'开始挑战';}
  show('tutScr',true);render();
  $('tutNext').onclick=()=>{if(i<pages.length-1){i++;render();}else{show('tutScr',false);done();}};
  $('tutSkip').onclick=()=>{show('tutScr',false);done();};
}
function openLevels(){
  show('startScr',false);show('shopScr',false);show('overScr',false);show('lvlScr',true);
  $('lvlInfo').textContent='解锁 '+prog.unlock+'/'+TOTAL+' · 币 '+prog.coins;
  const g=$('lvgrid');g.innerHTML='';
  for(let i=1;i<=TOTAL;i++){const b=document.createElement('button');b.className='btn lvl';const locked=i>prog.unlock;const st=prog.stars[i]|0;
    b.innerHTML=locked?'🔒':(i%5===0?'👑':'')+i+'<small>'+'★'.repeat(st)+'</small>';b.disabled=locked;
    if(!locked)b.onclick=()=>enter(i);g.appendChild(b);}
}
function enter(n){const go=()=>startLevel(n);if(!prog.seenTut){prog.seenTut=1;saveProg(prog);tutorial([['铺轨','点相邻格子铺轨道，连接金色站点。'],['发车','连通后点底部「发车」，列车按轨送达乘客。'],['Boss','每 5 关高峰潮汐：限时送达更多乘客，注意预算与桥梁。']],go);}else go();}
function openShop(){show('lvlScr',false);show('shopScr',true);$('coinLine').textContent='金币：'+prog.coins;
  const items=[
    {k:'speedLv',name:'快车',desc:'列车加速 ('+prog.speedLv+'/3)',cost:25+prog.speedLv*20,max:3},
    {k:'capLv',name:'大容量',desc:'载客 +'+prog.capLv+' ('+prog.capLv+'/3)',cost:30+prog.capLv*25,max:3},
    {k:'bridgeLv',name:'桥梁许可',desc:'额外桥梁 ('+prog.bridgeLv+'/3)',cost:35+prog.bridgeLv*20,max:3}
  ];
  const box=$('shopList');box.innerHTML='';
  for(const it of items){const row=document.createElement('div');row.className='row';row.innerHTML='<div><b>'+it.name+'</b><br><small>'+it.desc+'</small></div>';
    const btn=document.createElement('button');btn.className='btn';const maxed=prog[it.k]>=it.max;
    btn.textContent=maxed?'满':it.cost+'币';btn.disabled=maxed||prog.coins<it.cost;
    btn.onclick=()=>{prog.coins-=it.cost;prog[it.k]++;saveProg(prog);beep(900,.1);openShop();};row.appendChild(btn);box.appendChild(row);}
}
$('startBtn').onclick=openLevels;$('backStart').onclick=()=>{show('lvlScr',false);show('startScr',true);};
$('shopBtn').onclick=openShop;$('shopBack').onclick=openLevels;
$('pauseBtn').onclick=()=>{if(state==='play'){state='pause';show('pauseOv',true);}else if(state==='pause'){state='play';last=performance.now();show('pauseOv',false);}};
$('resumeBtn').onclick=()=>{state='play';last=performance.now();show('pauseOv',false);};
$('menuBtn').onclick=()=>{show('pauseOv',false);state='menu';openLevels();};
$('againBtn').onclick=()=>startLevel(lvl);
$('nextBtn').onclick=()=>{if(lvl<TOTAL)startLevel(lvl+1);else openLevels();};
$('menu2Btn').onclick=()=>{show('overScr',false);openLevels();};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play'){state='pause';show('pauseOv',true);}});

window.__T={
  go(n){prog.seenTut=1;saveProg(prog);startLevel(n|0||1);},
  win(){if(state!=='play')startLevel(lvl||1);delivered=goal;win();},
  lose(){if(state!=='play')startLevel(lvl||1);lose('测试失败');},
  state(){return{state,lvl,delivered,goal,usedRails,budget,phase,boss,score,unlock:prog.unlock};}
};
</script>
