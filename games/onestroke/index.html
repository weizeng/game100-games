<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>一笔画 · 游戏100</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#121212;color:#f2f2f2;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;display:flex;justify-content:center;overscroll-behavior:none}
#app{width:100%;max-width:480px;min-height:100vh;position:relative;display:flex;flex-direction:column;background:radial-gradient(900px 480px at 50% -8%,rgba(232,116,97,.12),transparent 60%),radial-gradient(700px 500px at 90% 110%,rgba(255,215,106,.08),transparent 60%),#121212;overflow:hidden}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;z-index:20}
.tb-title{font-size:14px;font-weight:700;color:#cfcfcf;letter-spacing:1px}
.tb-right{display:flex;gap:8px}
.iconbtn{width:38px;height:38px;border-radius:12px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .1s}
.iconbtn:active{transform:scale(.88)}
.screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;gap:12px;text-align:center;z-index:10}
.hidden{display:none!important}
.bigemoji{font-size:64px;filter:drop-shadow(0 6px 16px rgba(0,0,0,.5));animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.gamename{font-size:28px;font-weight:800;background:linear-gradient(135deg,#ffd76a,#e87461);-webkit-background-clip:text;background-clip:text;color:transparent}
.howto{font-size:13.5px;line-height:1.8;color:#bdbdbd;max-width:350px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:12px 16px}
.btn{background:linear-gradient(135deg,#e87461,#d35450);border:none;color:#fff;font-size:17px;font-weight:800;padding:13px 46px;border-radius:999px;cursor:pointer;box-shadow:0 8px 24px rgba(232,116,97,.35);transition:transform .1s;letter-spacing:2px}
.btn:active{transform:scale(.93)}
.btn.ghost{background:rgba(255,255,255,.08);box-shadow:none;border:1px solid rgba(255,255,255,.16)}
.btn.small{font-size:14px;padding:9px 26px;letter-spacing:1px}
.hsline{font-size:13px;color:#ffd76a}
.hud{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
.pill{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:700}
#fx{position:absolute;inset:0;pointer-events:none;z-index:50}
.float-txt{position:absolute;transform:translate(-50%,-50%);font-weight:800;font-size:20px;pointer-events:none;z-index:60;text-shadow:0 2px 8px rgba(0,0,0,.6);animation:floatUp 1.1s ease-out forwards}
@keyframes floatUp{to{transform:translate(-50%,-160%);opacity:0}}
#pauseOv{position:absolute;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(4px);z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
#pauseOv .btn{font-size:15px;padding:11px 34px}
#hintOv{position:absolute;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(4px);z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:28px;text-align:center}
#hintOv .btn{font-size:15px;padding:11px 34px}
.endstats{font-size:15px;line-height:2.1;color:#ddd}
.endstats b{color:#ffd76a;font-size:22px}
canvas.game{border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.45);touch-action:none}
.msg{min-height:22px;font-size:13px;color:#ff9a9a}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
</style>
<!-- GAME UI BEGIN -->
<style>
:root{--page:#e7edf4;--surface:#ffffff;--soft:#dce5ef;--ink:#243952;--muted:#5b6d83;--accent:#275e9b;--on-accent:#ffffff;--line:#bacbdd;--stage:#172d48}
/* Shared presentation only; mechanics and state remain inside each standalone game. */
html.game-ui{background:var(--page);color:var(--ink);color-scheme:light;font-family:"Bahnschrift","Microsoft YaHei UI","PingFang SC",sans-serif}
html.game-ui[data-theme="space"],html.game-ui[data-theme="arcade"]{color-scheme:dark}
.game-ui body{background:var(--page);color:var(--ink);font-family:inherit;overscroll-behavior:none}
.game-ui body>.wrap{padding:20px 16px max(20px,env(safe-area-inset-bottom));gap:14px;max-width:500px}
.game-ui #app{background:var(--page);color:var(--ink)}
.game-ui :is(.topbar,#topbar){gap:8px;flex-wrap:wrap;min-height:58px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:10px 12px;box-shadow:0 3px 0 var(--soft);font-size:13px}
.game-ui :is(.title,.tb-title,.tb-title,#topbar .t,.topbar .t){color:var(--ink);font-size:16px;font-weight:750;letter-spacing:0}
.game-ui :is(.topbar,.hud,#hud,#topbar) :is(b,.v){color:var(--accent);font-variant-numeric:tabular-nums}
.game-ui :is(.stat,.topbar .s,.topbar .stat,.scorebar,.stats,.tip,.hint,.hintline,.hsline,.best,.hiscore){color:var(--muted);line-height:1.7}
.game-ui :is(.hint,.hintline,.tip){font-size:12px;max-width:40em;text-wrap:pretty}
.game-ui .scorebar{padding:6px 10px;gap:8px;flex-wrap:wrap}
.game-ui :is(.iconbtn,.iconBtn,.icobtn,.ibtn,.tbtn,.hbtn,.ib,.iconBtn,.pause){min-width:44px;min-height:44px;flex-shrink:0;border-radius:12px;background:var(--soft);color:var(--ink);border:1px solid var(--line);box-shadow:none;font-size:17px}
.game-ui button{font-family:inherit;cursor:pointer;touch-action:manipulation}
.game-ui button:focus-visible,.game-ui [tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.game-ui :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn){background:var(--accent);color:var(--on-accent);border:1px solid transparent;border-radius:13px;min-height:50px;padding:13px 28px;font-size:16px;font-weight:750;letter-spacing:0;box-shadow:0 4px 0 var(--line);text-shadow:none;max-width:100%}
.game-ui :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn):active{box-shadow:none;transform:translateY(2px)}
.game-ui :is(.ghost,.ghostbtn,.btn2,.abtn,.toolbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line);box-shadow:none;border-radius:12px;min-height:44px}
.game-ui :is(.rowbtns,.btnrow,.ctlrow){gap:10px;flex-wrap:wrap;justify-content:center}
.game-ui :is(.pill,.hudbox,.hud .p){background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:none;font-variant-numeric:tabular-nums}
.game-ui :is(.dbtn,.cbtn,.gbtn,.holdbtn,.firebtn,.bombbtn,.jumpbtn,.pumpbtn,.nbtn){border-radius:12px;box-shadow:0 3px 0 var(--line);min-height:44px}
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv,.screen):has(>.ui-panel){padding:20px;overflow-y:auto;overscroll-behavior:contain}
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv):has(>.ui-panel){background:var(--page);backdrop-filter:none;justify-content:safe center;align-items:center}
.game-ui .ui-panel{width:min(100%,380px);max-height:100%;overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:18px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:24px;padding:30px 24px;box-shadow:0 8px 0 var(--soft),0 20px 48px #15253618;text-align:center;margin:auto}
.game-ui .ui-panel :is(.card,.panel,.pausecard,.ovcard){display:contents}
.game-ui .ui-panel :is(h1,h2,.gamename,.gametitle){font-size:30px;line-height:1.25;font-weight:800;color:var(--ink);background:none;-webkit-text-fill-color:currentColor;text-shadow:none;letter-spacing:-.6px;margin:0}
.game-ui .ui-panel :is(p,.howto,.sub,.rule){font-size:14px;line-height:1.85;color:var(--muted);background:none;border:0;box-shadow:none;padding:0;margin:0;max-width:32em;text-align:left;white-space:normal}
.game-ui .ui-panel :is(.bigemoji,.bigemoji,.ic,.big):not(.bigscore){animation:none;filter:none;text-shadow:none}
.game-ui .ui-emblem{width:90px;height:90px;display:grid;place-items:center;border:1px solid var(--line);border-radius:28px;background:var(--soft);font-size:48px;line-height:1;flex-shrink:0;position:relative}
.game-ui[data-theme="wood"] .ui-emblem{border-radius:50%;box-shadow:inset 0 0 0 5px var(--surface),inset 0 0 0 6px var(--line)}
.game-ui[data-theme="wood"] .ui-panel h1{font-family:"STKaiti","KaiTi","Microsoft YaHei",serif;letter-spacing:2px}
.game-ui[data-theme="ice"] .ui-emblem{border-radius:26px 8px 26px 8px}
.game-ui[data-theme="space"] .ui-emblem{background:radial-gradient(circle at center,var(--soft) 42%,transparent 43%),var(--surface);border-radius:50%;outline:1px solid var(--line);outline-offset:7px;margin:7px}
.game-ui[data-theme="kitchen"] .ui-emblem{border-radius:22px;border-bottom:5px solid var(--line)}
.game-ui .ui-panel :is(.score,.bigscore,.bigScore,.scorebig){color:var(--accent);font-size:48px;font-weight:800;font-variant-numeric:tabular-nums}
.game-ui .ui-panel :is(.best,.hsline,.hiscore,.endstats,.endstats b){color:var(--muted);font-size:13px;line-height:1.8}
.game-ui .ui-mode{display:grid;grid-template-columns:1fr 1fr;gap:5px;background:var(--soft);padding:5px;border:1px solid var(--line);border-radius:14px;width:100%}
.game-ui .ui-mode button{min-height:44px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-size:14px;font-weight:700;box-shadow:none}
.game-ui .ui-mode button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 2px 5px #1525361a}
.game-ui .ui-panel .ui-mode-note{font-size:12px;line-height:1.6;text-align:center;color:var(--muted)}
.game-ui .ui-mode-status{display:block;padding:5px 10px;color:var(--accent);font-size:11px;font-weight:700;line-height:1.5;text-align:center;border:1px solid var(--line);border-radius:8px;background:var(--surface);margin:4px auto;max-width:100%;pointer-events:none}
.game-ui body>.wrap>canvas:not(#fx){background-color:var(--stage);box-shadow:0 0 0 1px var(--line),0 6px 0 var(--soft);border-radius:18px;flex-shrink:0}
.game-ui .screen>canvas.game{box-shadow:0 0 0 1px var(--line),0 6px 0 var(--soft)}
.game-ui #hud{gap:6px;background:var(--surface);color:var(--ink)}
.game-ui #hud :is(.left,.t,.s,.grp,.pill){color:var(--ink)}
.game-ui #hud .pill{background:var(--surface);border-color:var(--line)}
.game-ui body canvas:is(#cv,#game,#board){background-color:var(--stage)}
.game-ui :is(button.dbtn,button.cbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.game-ui :is(button.lvl,button.lvlbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line);border-radius:12px;min-height:54px}
.game-ui :is(button.lvl,button.lvlbtn) :is(.nc,.sz,small){color:var(--muted)}
.game-ui .ui-panel button.lvl{margin:0;min-width:44px;box-shadow:none;padding:8px}
.game-ui #hud :is(.left,.right,.hudl,.hbtns){gap:5px;flex-wrap:wrap}
.game-ui #hud :is(.left,.hudl){min-width:0;flex-shrink:1}
.game-ui #hud :is(.pill,.left){font-size:12px}
.game-ui button:disabled{cursor:default;opacity:.45;box-shadow:none}
.game-ui .ui-panel .ui-assist-note{color:var(--accent);font-weight:700}
@media(min-width:700px){.game-ui body>.wrap{padding-top:32px}.game-ui .ui-panel{padding:36px 30px}}
@media(max-width:360px){.game-ui body>.wrap{padding:10px;gap:10px}.game-ui .ui-panel{padding:22px 18px;gap:13px}.game-ui .ui-panel h1{font-size:26px}.game-ui .ui-emblem{width:70px;height:70px;font-size:38px}.game-ui :is(.topbar,#topbar){gap:5px;padding:8px}.game-ui :is(.iconbtn,.icobtn,.ibtn,.tbtn,.ib){min-width:40px;min-height:44px}}
@media(max-height:650px){.game-ui .ui-panel{padding:18px;gap:12px}.game-ui .ui-emblem{width:60px;height:60px;font-size:32px}.game-ui .ui-panel h1{font-size:25px}.game-ui .ui-panel :is(p,.howto,.sub,.rule){font-size:13px}}
@media(prefers-reduced-motion:reduce){.game-ui *, .game-ui *::before,.game-ui *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}


</style>
<script>
// Installed before the original game script; embedded so downloaded ZIPs remain offline capable.
(function () {
  'use strict';
  var config = {"id":"onestroke","name":"一笔画","theme":"paper","icon":"✏️","challenge":"每次挑战仅 1 次提示、3 次撤销，谨慎规划再落子"};
  var mode = 'classic';
  try { mode = sessionStorage.getItem('game100-mode-' + config.id) || mode; } catch (_) {}
  var expert = mode === 'expert';
  var used = { hint: 0, undo: 0 };
  var limits = { hint: 1, undo: 3 };
  function storageKey(key) { return expert && !/sound|mute/i.test(key) ? 'expert:' + key : key; }
  window.GameUI = {
    expert: expert,
    pick: function (classic, advanced) { return expert ? advanced : classic; },
    storageGet: function (key) { return localStorage.getItem(storageKey(key)); },
    storageSet: function (key, value) { localStorage.setItem(storageKey(key), value); },
    storageRemove: function (key) { localStorage.removeItem(storageKey(key)); }
  };
  var root = document.documentElement;
  root.classList.add('game-ui');
  root.dataset.theme = config.theme;
  root.dataset.game = config.id;
  root.dataset.mode = mode;
  var gesture = new WeakMap();
  function labelButtons(scope) {
    scope.querySelectorAll('button').forEach(function (button) {
      if (button.getAttribute('aria-label')) return;
      var id = button.id.toLowerCase(), text = button.textContent.trim();
      var name = /mute|sound|snd/.test(id) ? '切换音效' : /pause/.test(id) ? '暂停游戏' : /hint/.test(id) && !/close|ok/.test(id) ? '查看提示' : '';
      if (!name && /^[⏸🔊🔇💡Ⅱ]+$/u.test(text)) name = { '⏸': '暂停游戏', '🔊': '切换音效', '🔇': '切换音效', '💡': '查看提示' }[text];
      if (name) button.setAttribute('aria-label', name);
    });
  }
  function decorate(container) {
    if (container.querySelector(':scope > .ui-panel') || !container.querySelector('h1,h2,.gamename')) return;
    if (container.matches('.screen') && container.querySelector('canvas:not(#fx)')) return;
    var panel = document.createElement('div');
    panel.className = 'ui-panel';
    while (container.firstChild) panel.appendChild(container.firstChild);
    container.appendChild(panel);
    var heading = panel.querySelector('h1,h2,.gamename');
    var start = /start|menu|ready/i.test(container.id) || !!panel.querySelector('#startBtn,#btnStart,.startbtn');
    if (start) {
      var headings = panel.querySelectorAll('h1,h2,.gamename');
      if (headings.length > 1 && !/[A-Za-z0-9\u4e00-\u9fff]/.test(heading.textContent)) { heading.remove(); heading = headings[1]; }
      var oldIcon = panel.querySelector('.bigemoji,.ic');
      if (oldIcon) oldIcon.remove();
      var emblem = document.createElement('div');
      emblem.className = 'ui-emblem'; emblem.textContent = config.icon; emblem.setAttribute('aria-hidden', 'true');
      panel.insertBefore(emblem, panel.firstChild);
      heading.textContent = config.name;
      var switcher = document.createElement('div'); switcher.className = 'ui-mode'; switcher.setAttribute('role', 'group'); switcher.setAttribute('aria-label', '选择玩法模式');
      [['classic','经典模式'],['expert','进阶挑战']].forEach(function (item) {
        var b = document.createElement('button'); b.type = 'button'; b.textContent = item[1]; b.dataset.mode = item[0]; b.setAttribute('aria-pressed', String(mode === item[0]));
        b.addEventListener('click', function () {
          if (mode === item[0]) return;
          try { sessionStorage.setItem('game100-mode-' + config.id, item[0]); location.reload(); }
          catch (_) { b.textContent = '浏览器未允许保存模式'; }
        });
        switcher.appendChild(b);
      });
      var primary = panel.querySelector('#startBtn,#btnStart,.startbtn,button');
      var anchor = primary;
      while (anchor && anchor.parentNode !== panel && !anchor.parentNode.matches('.card,.panel,.pausecard,.ovcard')) anchor = anchor.parentNode;
      var target = anchor ? anchor.parentNode : panel;
      target.insertBefore(switcher, anchor || null);
      var note = document.createElement('p'); note.className = 'ui-mode-note';
      note.textContent = expert ? config.challenge + '。进阶纪录单独保存。' : '按原规则轻松开局，也可切换进阶挑战。';
      target.insertBefore(note, anchor || null);
    }
    labelButtons(panel);
  }
  function notify(text) {
    var el = document.getElementById('ui-assist-toast');
    if (!el) { el = document.createElement('div'); el.id = 'ui-assist-toast'; el.className = 'ui-mode-status'; el.setAttribute('role', 'status'); el.style.cssText = 'position:fixed;bottom:18px;left:16px;right:16px;z-index:200;padding:14px'; document.body.appendChild(el); }
    el.textContent = text; el.hidden = false;
    clearTimeout(notify.timer); notify.timer = setTimeout(function () { el.hidden = true; }, 2000);
  }
  function assistEvent(event) {
    if (!expert) return;
    var b = event.target.closest('button'); if (!b || b.closest('.ui-mode')) return;
    var kind = /^(hintBtn|hintTopBtn|btnHint)$/i.test(b.id) ? 'hint' : /^(undoBtn|undoTopBtn|btnUndo)$/i.test(b.id) || /悔一步|撤销/.test(b.textContent) ? 'undo' : '';
    if (!kind) return;
    var prev = gesture.get(b), blocked;
    if (event.type === 'click' && prev && performance.now() - prev.at < 1000) blocked = prev.blocked;
    else { blocked = used[kind] >= limits[kind]; if (!blocked) used[kind]++; gesture.set(b, { at: performance.now(), blocked: blocked }); }
    if (blocked) { event.preventDefault(); event.stopImmediatePropagation(); notify(kind === 'hint' ? '本次挑战的 1 次提示已用完' : '本次挑战的 3 次撤销已用完'); }
  }
  document.addEventListener('pointerdown', assistEvent, true);
  document.addEventListener('click', assistEvent, true);
  document.addEventListener('click', function (event) {
    var b = event.target.closest('button');
    if (b && /^(startBtn|btnStart|restartBtn|againBtn|retryBtn|btnAgain|btnRestart|playAgain)$/i.test(b.id)) used = { hint: 0, undo: 0 };
  }, true);
  document.addEventListener('DOMContentLoaded', function () {
    var selector = '.overlay,.ov,#ov,#overlay,#pauseOv,.screen';
    document.querySelectorAll(selector).forEach(function (container) {
      decorate(container);
      // Only dynamic overlay children are observed; animated scores never trigger this work.
      new MutationObserver(function () { decorate(container); }).observe(container, { childList: true });
    });
    labelButtons(document);
  });
}());

</script>
<!-- GAME UI END -->
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="tb-title">✏️ 一笔画</div>
    <div class="tb-right">
      <div class="iconbtn hidden" id="hintBtn" title="提示">💡</div>
      <div class="iconbtn" id="soundBtn">🔊</div>
      <div class="iconbtn hidden" id="pauseBtn">⏸</div>
    </div>
  </div>
  <div class="screen" id="scrStart">
    <div class="bigemoji">✏️</div>
    <div class="gamename">一笔画</div>
    <div class="howto">点击一个顶点开始，再点击<strong style="color:#fff">相邻顶点</strong>连线。<br>每条边只能画<strong style="color:#fff">一次</strong>，画完所有边即过关。<br>共 <strong style="color:#ffd76a">8 关</strong>，卡住就悔一步试试！</div>
    <button class="btn" id="startBtn">开始游戏</button>
    <div class="hsline" id="startHs"></div>
  </div>
  <div class="screen hidden" id="scrGame" style="justify-content:flex-start;padding-top:6px">
    <div class="hud">
      <div class="pill">第 <span id="lvl" style="color:#ffd76a">1</span>/8 关 · <span id="lname" style="color:#fff">三角形</span></div>
      <div class="pill">进度 <span id="prog" style="color:#7ee2a8">0/3</span></div>
    </div>
    <canvas class="game" id="cv" width="400" height="400"></canvas>
    <div class="hud">
      <button class="btn small ghost" id="undoBtn">↩ 悔一步</button>
      <button class="btn small ghost" id="resetBtn">🔄 重画</button>
    </div>
    <div class="msg" id="msg">点击任意顶点开始</div>
  </div>
  <div class="screen hidden" id="scrEnd">
    <div class="bigemoji" id="endEmoji">🏆</div>
    <div class="gamename" id="endTitle">全部通关！</div>
    <div class="endstats" id="endStats"></div>
    <div class="hsline" id="endHs"></div>
    <button class="btn" id="againBtn">再来一局</button>
    <button class="btn ghost" id="backBtn">返回</button>
  </div>
  <div id="pauseOv" class="hidden">
    <div style="font-size:24px;font-weight:800">⏸ 已暂停</div>
    <button class="btn" id="resumeBtn">继续</button>
    <button class="btn ghost" id="restartBtn">重新开始</button>
  </div>
  <div id="hintOv" class="hidden">
    <div style="font-size:24px;font-weight:800">💡 提示</div>
    <div class="howto" id="hintText" style="max-width:340px"></div>
    <button class="btn" id="hintClose">知道了</button>
  </div>
  <canvas id="fx"></canvas>
</div>
<script>
/* GAMEPLAY UPGRADE */
'use strict';
let ACTX=null, soundOn=true;
try{ soundOn=GameUI.storageGet('g100_sound')!=='0'; }catch(e){}
function audio(){ if(!ACTX){ try{ ACTX=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } } if(ACTX&&ACTX.state==='suspended'){ ACTX.resume().catch(function(){}); } return ACTX; }
function tone(f,d,type,vol,delay){ if(!soundOn) return; try{ const c=audio(); if(!c) return; const t=c.currentTime+(delay||0); const o=c.createOscillator(),g=c.createGain(); o.type=type||'sine'; o.frequency.setValueAtTime(f,t); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||0.12,t+0.012); g.gain.exponentialRampToValueAtTime(0.0001,t+d); o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+d+0.05); }catch(e){} }
function sClick(){ tone(720,0.05,'square',0.04); }
function sDraw(){ tone(440+Math.random()*220,0.07,'triangle',0.07); }
function sBad(){ tone(200,0.16,'sawtooth',0.07); }
function sGood(){ tone(520,0.1,'sine',0.11); tone(780,0.14,'sine',0.11,0.09); }
function sWin(){ const seq=[523,659,784,1046,1318]; for(let i=0;i<seq.length;i++) tone(seq[i],0.22,'triangle',0.11,i*0.11); }
function hsGet(k){ try{ const v=parseInt(GameUI.storageGet(k)||'0',10); return isNaN(v)?0:v; }catch(e){ return 0; } }
function hsSet(k,v){ try{ GameUI.storageSet(k,String(v)); }catch(e){} }
const fxC=document.getElementById('fx'), fxX=fxC.getContext('2d');
let P=[];
function fxSize(){ const r=fxC.parentElement.getBoundingClientRect(); fxC.width=r.width; fxC.height=r.height; }
window.addEventListener('resize',fxSize);
function burst(x,y,n,cols){ for(let i=0;i<(n||24);i++){ const a=Math.random()*Math.PI*2,s=1+Math.random()*3.2; P.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1.2,l:1,c:cols[i%cols.length],r:2+Math.random()*3}); } }
function fxLoop(){ fxX.clearRect(0,0,fxC.width,fxC.height); P=P.filter(function(p){return p.l>0;}); for(let i=0;i<P.length;i++){ const p=P[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=0.06; p.l-=0.018; fxX.globalAlpha=Math.max(p.l,0); fxX.fillStyle=p.c; fxX.beginPath(); fxX.arc(p.x,p.y,p.r,0,7); fxX.fill(); } fxX.globalAlpha=1; requestAnimationFrame(fxLoop); }
function shakeEl(el){ el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }
const $=function(id){ return document.getElementById(id); };
const scrStart=$('scrStart'), scrGame=$('scrGame'), scrEnd=$('scrEnd'), pauseOv=$('pauseOv'), pauseBtn=$('pauseBtn'), soundBtn=$('soundBtn');
let paused=false;
function show(el){ [scrStart,scrGame,scrEnd].forEach(function(s){ s.classList.add('hidden'); }); el.classList.remove('hidden'); fxSize(); }
function setPaused(p){ paused=p; pauseOv.classList.toggle('hidden',!p); }
soundBtn.textContent=soundOn?'🔊':'🔇';
soundBtn.addEventListener('click',function(){ soundOn=!soundOn; soundBtn.textContent=soundOn?'🔊':'🔇'; try{ GameUI.storageSet('g100_sound',soundOn?'1':'0'); }catch(e){} if(soundOn) sClick(); });
pauseBtn.addEventListener('click',function(){ sClick(); setPaused(true); });
$('hintBtn').addEventListener('click',function(){
  if(!playing||paused) return;
  sClick();
  const L=LEVELS[lvl];
  const odds=eulerOdds(L);
  const start=odds.length?odds[0]:0;
  const trail=eulerTrail(L,start);
  hintHL=trail.slice(0,3);
  draw(performance.now());
  const tip=odds.length
    ? '秘诀：一笔画要从“奇点”（连着奇数条边的顶点）出发，本关的奇点就是它！选对起点，成功一半。'
    : '本关每个顶点都连着偶数条边，从任意点出发都能一笔画成，推荐从 ⭐ 处开始！';
  $('hintText').innerHTML='<b style="color:#fff">第 '+(lvl+1)+' 关 · '+L.name+'</b><br>推荐从标 ⭐ 的顶点起笔，沿绿色高亮的两条边走。<br>'+tip;
  $('hintOv').classList.remove('hidden');
});
$('hintClose').addEventListener('click',function(){ sClick(); $('hintOv').classList.add('hidden'); });
$('resumeBtn').addEventListener('click',function(){ sClick(); setPaused(false); });
/* ===== 游戏：一笔画（8关均有欧拉路，已验证） ===== */
const LEVELS=[
 {name:'三角形',pts:[[0.5,0.14],[0.14,0.8],[0.86,0.8]],edges:[[0,1],[1,2],[2,0]]},
 {name:'方块斜线',pts:[[0.2,0.2],[0.8,0.2],[0.8,0.8],[0.2,0.8]],edges:[[0,1],[1,2],[2,3],[3,0],[0,2]]},
 {name:'小房子',pts:[[0.25,0.75],[0.75,0.75],[0.75,0.35],[0.25,0.35],[0.5,0.12]],edges:[[0,1],[1,2],[2,3],[3,0],[2,4],[4,3]]},
 {name:'五角星',pts:[[0.5,0.12],[0.8614,0.3826],[0.7234,0.8074],[0.2766,0.8074],[0.1386,0.3826]],edges:[[0,2],[2,4],[4,1],[1,3],[3,0]]},
 {name:'蝴蝶结',pts:[[0.2,0.2],[0.2,0.8],[0.5,0.5],[0.8,0.2],[0.8,0.8]],edges:[[0,1],[1,2],[2,0],[2,3],[3,4],[4,2]]},
 {name:'信封',pts:[[0.2,0.7],[0.8,0.7],[0.8,0.3],[0.2,0.3],[0.5,0.12]],edges:[[0,1],[1,2],[2,3],[3,0],[0,2],[1,3],[2,4],[4,3]]},
 {name:'双正方形',pts:[[0.15,0.3],[0.5,0.3],[0.5,0.7],[0.15,0.7],[0.85,0.3],[0.85,0.7]],edges:[[0,1],[1,2],[2,3],[3,0],[1,4],[4,5],[5,2]]},
 {name:'双三角',pts:[[0.35,0.25],[0.1,0.75],[0.6,0.75],[0.85,0.25]],edges:[[0,1],[1,2],[2,0],[0,3],[3,2]]}
];
const cv=$('cv'), ctx=cv.getContext('2d');
let lvl=0, drawn=new Set(), path=[], cur=-1, playing=false, undos=0, levelDone=false;
let hintHL=null; // 提示高亮：[起点, 经点1, 经点2]
/* ===== 欧拉路：算出推荐起笔点及前两条边 ===== */
function eulerOdds(L){
  const deg=new Array(L.pts.length).fill(0);
  L.edges.forEach(function(e){ deg[e[0]]++; deg[e[1]]++; });
  const odds=[];
  for(let i=0;i<deg.length;i++) if(deg[i]%2===1) odds.push(i);
  return odds;
}
function eulerTrail(L,start){
  const adj=L.pts.map(function(){return[];});
  L.edges.forEach(function(e,i){ adj[e[0]].push({to:e[1],id:i}); adj[e[1]].push({to:e[0],id:i}); });
  const used={}, stack=[start], trail=[];
  while(stack.length){
    const v=stack[stack.length-1];
    let e=null;
    while(adj[v].length){ const c=adj[v].pop(); if(!used[c.id]){ e=c; break; } }
    if(e){ used[e.id]=1; stack.push(e.to); }
    else trail.push(stack.pop());
  }
  trail.reverse();
  return trail;
}
function sizeCanvas(){ const w=Math.min(400,document.getElementById('app').clientWidth-36); cv.width=w; cv.height=w; cv.style.width=w+'px'; cv.style.height=w+'px'; }
window.addEventListener('resize',function(){ sizeCanvas(); if(playing) draw(performance.now()); });
function ekey(a,b){ return a<b?a+'_'+b:b+'_'+a; }
function hasEdge(a,b){ const E=LEVELS[lvl].edges; for(let i=0;i<E.length;i++) if(ekey(E[i][0],E[i][1])===ekey(a,b)) return true; return false; }
function loadLevel(i){
  drawn=new Set(); path=[]; cur=-1; levelDone=false; hintHL=null;
  $('lvl').textContent=i+1; $('lname').textContent=LEVELS[i].name;
  $('prog').textContent='0/'+LEVELS[i].edges.length;
  $('msg').textContent='点击任意顶点开始';
  sizeCanvas(); draw(performance.now());
}
function newGame(){
  lvl=0; undos=0; playing=true;
  setPaused(false); pauseBtn.classList.remove('hidden');
  $('hintBtn').classList.remove('hidden');
  show(scrGame); loadLevel(0);
}
function vxy(i){ const w=cv.width, p=LEVELS[lvl].pts[i]; return [p[0]*w,p[1]*w]; }
function tapVertex(e){
  if(!playing||paused||levelDone) return;
  const rect=cv.getBoundingClientRect();
  const x=(e.clientX-rect.left)*(cv.width/rect.width), y=(e.clientY-rect.top)*(cv.width/rect.height);
  let best=-1, bd=34*(cv.width/rect.width);
  const pts=LEVELS[lvl].pts;
  for(let i=0;i<pts.length;i++){
    const p=vxy(i), d=Math.hypot(x-p[0],y-p[1]);
    if(d<bd){ bd=d; best=i; }
  }
  if(best===-1) return;
  if(cur===-1){ cur=best; path=[best]; hintHL=null; sClick(); $('msg').textContent='从这里出发，点相邻顶点连线'; draw(performance.now()); return; }
  if(best===cur){ $('msg').textContent='已经在这里了，点别的顶点'; return; }
  const k=ekey(cur,best);
  if(!hasEdge(cur,best)){ $('msg').textContent='这两点之间没有边'; sBad(); shakeEl(cv); return; }
  if(drawn.has(k)){ $('msg').textContent='这条边已经画过了'; sBad(); shakeEl(cv); return; }
  drawn.add(k); path.push(best); cur=best;
  sDraw();
  $('prog').textContent=drawn.size+'/'+LEVELS[lvl].edges.length;
  draw(performance.now());
  if(drawn.size===LEVELS[lvl].edges.length) onLevelClear();
}
function onLevelClear(){
  levelDone=true; sGood();
  const r=cv.getBoundingClientRect(), ar=$('app').getBoundingClientRect();
  burst(r.left-ar.left+r.width/2, r.top-ar.top+r.height/2, 60, ['#e87461','#ffd76a','#7ee2a8','#fff']);
  $('msg').textContent='🎉 一笔画成！';
  setTimeout(function(){
    if(lvl<LEVELS.length-1){ lvl++; loadLevel(lvl); }
    else endGame();
  },1100);
}
function undo(){
  if(!playing||paused||levelDone||path.length<2) return;
  const last=path.pop();
  const prev=path[path.length-1];
  drawn.delete(ekey(prev,last));
  cur=prev; undos++;
  sClick();
  $('prog').textContent=drawn.size+'/'+LEVELS[lvl].edges.length;
  $('msg').textContent='悔了一步';
  draw(performance.now());
}
function endGame(){
  playing=false; pauseBtn.classList.add('hidden'); $('hintBtn').classList.add('hidden'); setPaused(false);
  const key='g100_onestroke_hs';
  let nb=false, raw=null;
  try{ raw=GameUI.storageGet(key); }catch(e){}
  if(raw===null||undos<parseInt(raw,10)){ hsSet(key,undos); nb=true; }
  const shown=hsGet(key);
  $('endStats').innerHTML='8 关全通<br>共悔步 <b>'+undos+'</b> 次'+(nb?'<br>🎉 新纪录！':'');
  $('endHs').textContent='🏅 最少悔步：'+shown+' 次';
  show(scrEnd); sWin();
  const r=$('app').getBoundingClientRect(); burst(r.width/2,220,90,['#e87461','#ffd76a','#7ee2a8','#fff']);
}
function draw(t){
  const w=cv.width;
  ctx.clearRect(0,0,w,w);
  const L=LEVELS[lvl];
  // 未画的边
  ctx.lineCap='round';
  for(let i=0;i<L.edges.length;i++){
    const k=ekey(L.edges[i][0],L.edges[i][1]);
    if(drawn.has(k)) continue;
    const a=vxy(L.edges[i][0]), b=vxy(L.edges[i][1]);
    ctx.strokeStyle='rgba(255,255,255,.22)'; ctx.lineWidth=5;
    ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke();
  }
  // 已画的边（发光）
  ctx.shadowColor='rgba(232,116,97,.8)'; ctx.shadowBlur=10;
  const g=ctx.createLinearGradient(0,0,w,w);
  g.addColorStop(0,'#ffd76a'); g.addColorStop(1,'#e87461');
  ctx.strokeStyle=g; ctx.lineWidth=7;
  for(let i=1;i<path.length;i++){
    const a=vxy(path[i-1]), b=vxy(path[i]);
    ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke();
  }
  ctx.shadowBlur=0;
  // 顶点
  for(let i=0;i<L.pts.length;i++){
    const p=vxy(i);
    ctx.fillStyle=i===cur?'#ffd76a':'#2a3550';
    ctx.strokeStyle=i===cur?'#fff':'rgba(255,255,255,.4)';
    ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(p[0],p[1],14,0,7); ctx.fill(); ctx.stroke();
    if(i===cur){
      const pr=18+4*Math.sin(t/250);
      ctx.strokeStyle='rgba(255,215,106,.7)';
      ctx.beginPath(); ctx.arc(p[0],p[1],pr,0,7); ctx.stroke();
    }
  }
  // 提示高亮：推荐起点 ⭐ + 前两条边（绿色）
  if(hintHL&&hintHL.length>=3){
    const ha=vxy(hintHL[0]), hb=vxy(hintHL[1]), hc=vxy(hintHL[2]);
    ctx.save();
    ctx.strokeStyle='rgba(126,226,168,.92)'; ctx.lineWidth=9; ctx.lineCap='round';
    ctx.shadowColor='rgba(126,226,168,.8)'; ctx.shadowBlur=12;
    ctx.beginPath(); ctx.moveTo(ha[0],ha[1]); ctx.lineTo(hb[0],hb[1]); ctx.lineTo(hc[0],hc[1]); ctx.stroke();
    ctx.restore();
    const pr=20+5*Math.sin(t/220);
    ctx.font='26px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('⭐', ha[0], ha[1]-pr-10);
  }
}
cv.addEventListener('pointerdown',function(e){ e.preventDefault(); tapVertex(e); },{passive:false});
$('undoBtn').addEventListener('click',function(){ undo(); });
$('resetBtn').addEventListener('click',function(){ if(!playing||paused||levelDone) return; sClick(); loadLevel(lvl); });
$('startBtn').addEventListener('click',function(){ audio(); sClick(); newGame(); });
$('againBtn').addEventListener('click',function(){ sClick(); newGame(); });
$('backBtn').addEventListener('click',function(){ sClick(); playing=false; pauseBtn.classList.add('hidden'); $('hintBtn').classList.add('hidden'); show(scrStart); refreshStartHs(); });
$('restartBtn').addEventListener('click',function(){ sClick(); newGame(); });
function refreshStartHs(){ let txt=''; try{ const raw=GameUI.storageGet('g100_onestroke_hs'); if(raw!==null) txt='🏅 最少悔步 '+raw+' 次'; }catch(e){} $('startHs').textContent=txt; }
try{ refreshStartHs(); }catch(e){}
fxSize(); fxLoop();
(function anim(t){ requestAnimationFrame(anim); if(playing&&cur!==-1&&!paused) draw(t||performance.now()); })(performance.now());
</script>
