<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>炮击堡垒</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#0d0d16;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#fff;user-select:none;-webkit-user-select:none}
#wrap{max-width:480px;height:100%;margin:0 auto;position:relative;background:linear-gradient(180deg,#101a2e 0%,#0d0d16 60%,#141020 100%)}
canvas{display:block;width:100%;height:100%;touch-action:none}
.hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:10px 12px;pointer-events:none;font-size:15px}
.hud .left{font-weight:bold;text-shadow:0 0 8px #ff8a65}
.hud .right{display:flex;gap:8px;pointer-events:auto}
.iconbtn{width:38px;height:38px;border-radius:50%;border:1px solid #ff8a6555;background:#1c1c2bd9;color:#fff;font-size:15px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .08s}
.iconbtn:active{transform:scale(.9)}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,10,20,.88);backdrop-filter:blur(4px);z-index:10;text-align:center;padding:24px}
.screen h1{font-size:38px;margin-bottom:6px;background:linear-gradient(135deg,#ff8a65,#ffd740);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.screen p{color:#aaa;font-size:14px;line-height:1.7;margin:12px 0 20px}
.bigbtn{padding:14px 56px;font-size:18px;border:none;border-radius:30px;background:linear-gradient(135deg,#ff8a65,#ffd740);color:#fff;font-weight:bold;cursor:pointer;transition:transform .1s;box-shadow:0 4px 20px #ff8a6555}
.bigbtn:active{transform:scale(.93)}
.score{font-size:52px;font-weight:bold;background:linear-gradient(135deg,#ffd740,#ff8a65);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin:8px 0}
.hiscore{color:#888;font-size:14px;margin-bottom:20px}
.hidden{display:none!important}
.windtag{position:absolute;top:56px;left:0;right:0;text-align:center;font-size:13px;color:#80d8ff;pointer-events:none}
</style>
<!-- GAME UI BEGIN -->
<style>
:root{--page:#172638;--surface:#22374c;--soft:#2e4760;--ink:#f0f6fc;--muted:#b1c6d9;--accent:#f0bc74;--on-accent:#342717;--line:#45637c;--stage:#142438}
/* Shared presentation only; mechanics and state remain inside each standalone game. */
html.game-ui{background:var(--page);color:var(--ink);color-scheme:light;font-family:"Bahnschrift","Microsoft YaHei UI","PingFang SC",sans-serif}
html.game-ui[data-theme="space"],html.game-ui[data-theme="arcade"]{color-scheme:dark}
.game-ui body{background:var(--page);color:var(--ink);font-family:inherit;overscroll-behavior:none}
.game-ui body>.wrap{padding:20px 16px max(20px,env(safe-area-inset-bottom));gap:14px;max-width:500px}
.game-ui #app{background:var(--page);color:var(--ink)}
.game-ui :is(.topbar,#topbar){gap:8px;flex-wrap:wrap;min-height:58px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:10px 12px;box-shadow:0 3px 0 var(--soft);font-size:13px}
.game-ui :is(.title,.tb-title,.tb-title,#topbar .t,.topbar .t){color:var(--ink);font-size:16px;font-weight:750;letter-spacing:0}
.game-ui :is(.topbar,.hud,#hud,#topbar) :is(b,.v){color:var(--accent);font-variant-numeric:tabular-nums}
.game-ui :is(.stat,.topbar .s,.topbar .stat,.scorebar,.stats,.tip,.hint,.hintline,.hsline,.best,.hiscore){color:var(--muted);line-height:1.7}
.game-ui :is(.hint,.hintline,.tip){font-size:12px;max-width:40em;text-wrap:pretty}
.game-ui .scorebar{padding:6px 10px;gap:8px;flex-wrap:wrap}
.game-ui :is(.iconbtn,.iconBtn,.icobtn,.ibtn,.tbtn,.hbtn,.ib,.iconBtn,.pause){min-width:44px;min-height:44px;flex-shrink:0;border-radius:12px;background:var(--soft);color:var(--ink);border:1px solid var(--line);box-shadow:none;font-size:17px}
.game-ui button{font-family:inherit;cursor:pointer;touch-action:manipulation}
.game-ui button:focus-visible,.game-ui [tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.game-ui :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn){background:var(--accent);color:var(--on-accent);border:1px solid transparent;border-radius:13px;min-height:50px;padding:13px 28px;font-size:16px;font-weight:750;letter-spacing:0;box-shadow:0 4px 0 var(--line);text-shadow:none;max-width:100%}
.game-ui :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn):active{box-shadow:none;transform:translateY(2px)}
.game-ui :is(.ghost,.ghostbtn,.btn2,.abtn,.toolbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line);box-shadow:none;border-radius:12px;min-height:44px}
.game-ui :is(.rowbtns,.btnrow,.ctlrow){gap:10px;flex-wrap:wrap;justify-content:center}
.game-ui :is(.pill,.hudbox,.hud .p){background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:none;font-variant-numeric:tabular-nums}
.game-ui :is(.dbtn,.cbtn,.gbtn,.holdbtn,.firebtn,.bombbtn,.jumpbtn,.pumpbtn,.nbtn){border-radius:12px;box-shadow:0 3px 0 var(--line);min-height:44px}
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv,.screen):has(>.ui-panel){padding:20px;overflow-y:auto;overscroll-behavior:contain}
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv):has(>.ui-panel){background:var(--page);backdrop-filter:none;justify-content:safe center;align-items:center}
.game-ui .ui-panel{width:min(100%,380px);max-height:100%;overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:18px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:24px;padding:30px 24px;box-shadow:0 8px 0 var(--soft),0 20px 48px #15253618;text-align:center;margin:auto}
.game-ui .ui-panel :is(.card,.panel,.pausecard,.ovcard){display:contents}
.game-ui .ui-panel :is(h1,h2,.gamename,.gametitle){font-size:30px;line-height:1.25;font-weight:800;color:var(--ink);background:none;-webkit-text-fill-color:currentColor;text-shadow:none;letter-spacing:-.6px;margin:0}
.game-ui .ui-panel :is(p,.howto,.sub,.rule){font-size:14px;line-height:1.85;color:var(--muted);background:none;border:0;box-shadow:none;padding:0;margin:0;max-width:32em;text-align:left;white-space:normal}
.game-ui .ui-panel :is(.bigemoji,.bigemoji,.ic,.big):not(.bigscore){animation:none;filter:none;text-shadow:none}
.game-ui .ui-emblem{width:90px;height:90px;display:grid;place-items:center;border:1px solid var(--line);border-radius:28px;background:var(--soft);font-size:48px;line-height:1;flex-shrink:0;position:relative}
.game-ui[data-theme="wood"] .ui-emblem{border-radius:50%;box-shadow:inset 0 0 0 5px var(--surface),inset 0 0 0 6px var(--line)}
.game-ui[data-theme="wood"] .ui-panel h1{font-family:"STKaiti","KaiTi","Microsoft YaHei",serif;letter-spacing:2px}
.game-ui[data-theme="ice"] .ui-emblem{border-radius:26px 8px 26px 8px}
.game-ui[data-theme="space"] .ui-emblem{background:radial-gradient(circle at center,var(--soft) 42%,transparent 43%),var(--surface);border-radius:50%;outline:1px solid var(--line);outline-offset:7px;margin:7px}
.game-ui[data-theme="kitchen"] .ui-emblem{border-radius:22px;border-bottom:5px solid var(--line)}
.game-ui .ui-panel :is(.score,.bigscore,.bigScore,.scorebig){color:var(--accent);font-size:48px;font-weight:800;font-variant-numeric:tabular-nums}
.game-ui .ui-panel :is(.best,.hsline,.hiscore,.endstats,.endstats b){color:var(--muted);font-size:13px;line-height:1.8}
.game-ui .ui-mode{display:grid;grid-template-columns:1fr 1fr;gap:5px;background:var(--soft);padding:5px;border:1px solid var(--line);border-radius:14px;width:100%}
.game-ui .ui-mode button{min-height:44px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-size:14px;font-weight:700;box-shadow:none}
.game-ui .ui-mode button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 2px 5px #1525361a}
.game-ui .ui-panel .ui-mode-note{font-size:12px;line-height:1.6;text-align:center;color:var(--muted)}
.game-ui .ui-mode-status{display:block;padding:5px 10px;color:var(--accent);font-size:11px;font-weight:700;line-height:1.5;text-align:center;border:1px solid var(--line);border-radius:8px;background:var(--surface);margin:4px auto;max-width:100%;pointer-events:none}
.game-ui body>.wrap>canvas:not(#fx){background-color:var(--stage);box-shadow:0 0 0 1px var(--line),0 6px 0 var(--soft);border-radius:18px;flex-shrink:0}
.game-ui .screen>canvas.game{box-shadow:0 0 0 1px var(--line),0 6px 0 var(--soft)}
.game-ui #hud{gap:6px;background:var(--surface);color:var(--ink)}
.game-ui #hud :is(.left,.t,.s,.grp,.pill){color:var(--ink)}
.game-ui #hud .pill{background:var(--surface);border-color:var(--line)}
.game-ui body canvas:is(#cv,#game,#board){background-color:var(--stage)}
.game-ui :is(button.dbtn,button.cbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.game-ui :is(button.lvl,button.lvlbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line);border-radius:12px;min-height:54px}
.game-ui :is(button.lvl,button.lvlbtn) :is(.nc,.sz,small){color:var(--muted)}
.game-ui .ui-panel button.lvl{margin:0;min-width:44px;box-shadow:none;padding:8px}
.game-ui #hud :is(.left,.right,.hudl,.hbtns){gap:5px;flex-wrap:wrap}
.game-ui #hud :is(.left,.hudl){min-width:0;flex-shrink:1}
.game-ui #hud :is(.pill,.left){font-size:12px}
.game-ui button:disabled{cursor:default;opacity:.45;box-shadow:none}
.game-ui .ui-panel .ui-assist-note{color:var(--accent);font-weight:700}
@media(min-width:700px){.game-ui body>.wrap{padding-top:32px}.game-ui .ui-panel{padding:36px 30px}}
@media(max-width:360px){.game-ui body>.wrap{padding:10px;gap:10px}.game-ui .ui-panel{padding:22px 18px;gap:13px}.game-ui .ui-panel h1{font-size:26px}.game-ui .ui-emblem{width:70px;height:70px;font-size:38px}.game-ui :is(.topbar,#topbar){gap:5px;padding:8px}.game-ui :is(.iconbtn,.icobtn,.ibtn,.tbtn,.ib){min-width:40px;min-height:44px}}
@media(max-height:650px){.game-ui .ui-panel{padding:18px;gap:12px}.game-ui .ui-emblem{width:60px;height:60px;font-size:32px}.game-ui .ui-panel h1{font-size:25px}.game-ui .ui-panel :is(p,.howto,.sub,.rule){font-size:13px}}
@media(prefers-reduced-motion:reduce){.game-ui *, .game-ui *::before,.game-ui *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

html[data-game="cannon"] .ui-panel h1{font-size:30px}html[data-game="cannon"] .ui-panel .hiscore{color:var(--muted)}

</style>
<script>
// Installed before the original game script; embedded so downloaded ZIPs remain offline capable.
(function () {
  'use strict';
  var config = {"id":"cannon","name":"炮击堡垒","theme":"arcade","icon":"💣","challenge":"堡垒缩窄至 48，风力下更考验角度与力度"};
  var mode = 'classic';
  try { mode = sessionStorage.getItem('game100-mode-' + config.id) || mode; } catch (_) {}
  var expert = mode === 'expert';
  var used = { hint: 0, undo: 0 };
  var limits = { hint: 1, undo: 3 };
  function storageKey(key) { return expert && !/sound|mute/i.test(key) ? 'expert:' + key : key; }
  window.GameUI = {
    expert: expert,
    pick: function (classic, advanced) { return expert ? advanced : classic; },
    storageGet: function (key) { return localStorage.getItem(storageKey(key)); },
    storageSet: function (key, value) { localStorage.setItem(storageKey(key), value); },
    storageRemove: function (key) { localStorage.removeItem(storageKey(key)); }
  };
  var root = document.documentElement;
  root.classList.add('game-ui');
  root.dataset.theme = config.theme;
  root.dataset.game = config.id;
  root.dataset.mode = mode;
  var gesture = new WeakMap();
  function labelButtons(scope) {
    scope.querySelectorAll('button').forEach(function (button) {
      if (button.getAttribute('aria-label')) return;
      var id = button.id.toLowerCase(), text = button.textContent.trim();
      var name = /mute|sound|snd/.test(id) ? '切换音效' : /pause/.test(id) ? '暂停游戏' : /hint/.test(id) && !/close|ok/.test(id) ? '查看提示' : '';
      if (!name && /^[⏸🔊🔇💡Ⅱ]+$/u.test(text)) name = { '⏸': '暂停游戏', '🔊': '切换音效', '🔇': '切换音效', '💡': '查看提示' }[text];
      if (name) button.setAttribute('aria-label', name);
    });
  }
  function decorate(container) {
    if (container.querySelector(':scope > .ui-panel') || !container.querySelector('h1,h2,.gamename')) return;
    if (container.matches('.screen') && container.querySelector('canvas:not(#fx)')) return;
    var panel = document.createElement('div');
    panel.className = 'ui-panel';
    while (container.firstChild) panel.appendChild(container.firstChild);
    container.appendChild(panel);
    var heading = panel.querySelector('h1,h2,.gamename');
    var start = /start|menu|ready/i.test(container.id) || !!panel.querySelector('#startBtn,#btnStart,.startbtn');
    if (start) {
      var headings = panel.querySelectorAll('h1,h2,.gamename');
      if (headings.length > 1 && !/[A-Za-z0-9\u4e00-\u9fff]/.test(heading.textContent)) { heading.remove(); heading = headings[1]; }
      var oldIcon = panel.querySelector('.bigemoji,.ic');
      if (oldIcon) oldIcon.remove();
      var emblem = document.createElement('div');
      emblem.className = 'ui-emblem'; emblem.textContent = config.icon; emblem.setAttribute('aria-hidden', 'true');
      panel.insertBefore(emblem, panel.firstChild);
      heading.textContent = config.name;
      var switcher = document.createElement('div'); switcher.className = 'ui-mode'; switcher.setAttribute('role', 'group'); switcher.setAttribute('aria-label', '选择玩法模式');
      [['classic','经典模式'],['expert','进阶挑战']].forEach(function (item) {
        var b = document.createElement('button'); b.type = 'button'; b.textContent = item[1]; b.dataset.mode = item[0]; b.setAttribute('aria-pressed', String(mode === item[0]));
        b.addEventListener('click', function () {
          if (mode === item[0]) return;
          try { sessionStorage.setItem('game100-mode-' + config.id, item[0]); location.reload(); }
          catch (_) { b.textContent = '浏览器未允许保存模式'; }
        });
        switcher.appendChild(b);
      });
      var primary = panel.querySelector('#startBtn,#btnStart,.startbtn,button');
      var anchor = primary;
      while (anchor && anchor.parentNode !== panel && !anchor.parentNode.matches('.card,.panel,.pausecard,.ovcard')) anchor = anchor.parentNode;
      var target = anchor ? anchor.parentNode : panel;
      target.insertBefore(switcher, anchor || null);
      var note = document.createElement('p'); note.className = 'ui-mode-note';
      note.textContent = expert ? config.challenge + '。进阶纪录单独保存。' : '按原规则轻松开局，也可切换进阶挑战。';
      target.insertBefore(note, anchor || null);
    }
    labelButtons(panel);
  }
  function notify(text) {
    var el = document.getElementById('ui-assist-toast');
    if (!el) { el = document.createElement('div'); el.id = 'ui-assist-toast'; el.className = 'ui-mode-status'; el.setAttribute('role', 'status'); el.style.cssText = 'position:fixed;bottom:18px;left:16px;right:16px;z-index:200;padding:14px'; document.body.appendChild(el); }
    el.textContent = text; el.hidden = false;
    clearTimeout(notify.timer); notify.timer = setTimeout(function () { el.hidden = true; }, 2000);
  }
  function assistEvent(event) {
    if (!expert) return;
    var b = event.target.closest('button'); if (!b || b.closest('.ui-mode')) return;
    var kind = /^(hintBtn|hintTopBtn|btnHint)$/i.test(b.id) ? 'hint' : /^(undoBtn|undoTopBtn|btnUndo)$/i.test(b.id) || /悔一步|撤销/.test(b.textContent) ? 'undo' : '';
    if (!kind) return;
    var prev = gesture.get(b), blocked;
    if (event.type === 'click' && prev && performance.now() - prev.at < 1000) blocked = prev.blocked;
    else { blocked = used[kind] >= limits[kind]; if (!blocked) used[kind]++; gesture.set(b, { at: performance.now(), blocked: blocked }); }
    if (blocked) { event.preventDefault(); event.stopImmediatePropagation(); notify(kind === 'hint' ? '本次挑战的 1 次提示已用完' : '本次挑战的 3 次撤销已用完'); }
  }
  document.addEventListener('pointerdown', assistEvent, true);
  document.addEventListener('click', assistEvent, true);
  document.addEventListener('click', function (event) {
    var b = event.target.closest('button');
    if (b && /^(startBtn|btnStart|restartBtn|againBtn|retryBtn|btnAgain|btnRestart|playAgain)$/i.test(b.id)) used = { hint: 0, undo: 0 };
  }, true);
  document.addEventListener('DOMContentLoaded', function () {
    var selector = '.overlay,.ov,#ov,#overlay,#pauseOv,.screen';
    document.querySelectorAll(selector).forEach(function (container) {
      decorate(container);
      // Only dynamic overlay children are observed; animated scores never trigger this work.
      new MutationObserver(function () { decorate(container); }).observe(container, { childList: true });
    });
    labelButtons(document);
  });
}());

</script>
<!-- GAME UI END -->
</head>
<body>
<div id="wrap">
<canvas id="cv"></canvas>
<div class="hud">
<div class="left">SCORE <span id="score">0</span> · 炮弹 <span id="shells">12</span> · 堡垒HP <span id="fhp">3</span></div>
<div class="right"><button class="iconbtn" id="muteBtn">🔊</button><button class="iconbtn" id="pauseBtn">II</button></div>
</div>
<div class="windtag" id="windTag"></div>
<div class="screen" id="startScr">
<h1>CANNON</h1>
<p>手指按住屏幕蓄力（力度条涨落）<br>拖动调整炮管角度，松手开炮<br>注意随机风力影响弹道<br>12 发炮弹，炸毁对面堡垒获胜</p>
<button class="bigbtn" id="startBtn">开战</button>
</div>
<div class="screen hidden" id="overScr">
<h1 id="overTitle">胜利</h1>
<div class="score" id="finalScore">0</div>
<div class="hiscore">最高分：<span id="hiScore">0</span></div>
<button class="bigbtn" id="retryBtn">再来一局</button>
</div>
<div class="screen hidden" id="pauseScr">
<h1>已暂停</h1>
<button class="bigbtn" id="resumeBtn">继续</button>
</div>
</div>
<script>
/* GAMEPLAY UPGRADE */
"use strict";
var cv=document.getElementById('cv'),ctx=cv.getContext('2d'),wrap=document.getElementById('wrap');
var W,H,DPR,groundY;
function resize(){DPR=Math.min(window.devicePixelRatio||1,2);W=wrap.clientWidth;H=wrap.clientHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);groundY=H-70;}
window.addEventListener('resize',resize);
var muted=false,AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,dur,type,vol,slide){if(muted)return;var c=ac();if(!c)return;try{var o=c.createOscillator(),g=c.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,c.currentTime);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,slide),c.currentTime+dur);g.gain.setValueAtTime(vol||.12,c.currentTime);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+dur);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+dur);}catch(e){}}
function sFire(){tone(120,.3,'sawtooth',.15,500);}
function sBoom(){tone(80,.5,'sawtooth',.2,30);}
function sWin(){[523,659,784,1046].forEach(function(f,i){setTimeout(function(){tone(f,.25,'sine',.12);},i*140);});}
document.getElementById('muteBtn').onclick=function(e){e.stopPropagation();muted=!muted;this.textContent=muted?'🔇':'🔊';};
var HIKEY='g100_cannon_hi',hi=0;
try{hi=parseInt(GameUI.storageGet(HIKEY))||0;}catch(e){}
var state='start',paused=false,score=0;
var angle,charging,power,powerDir,shell,parts,floats,fort,fhp,shellsLeft,wind,shotCount,stars,endPending;
var CX=54; // 炮座x
function rand(a,b){return a+Math.random()*(b-a);}
function newWind(){wind=Math.round(rand(-5,5));updateWindTag();}
function updateWindTag(){var a=wind===0?'—':(wind>0?new Array(wind+1).join('→'):new Array(-wind+1).join('←'));
document.getElementById('windTag').textContent='风力：'+(wind===0?'无风':(wind>0?'+':'')+wind+' '+a);}
function startGame(){score=0;angle=Math.PI/4;charging=false;power=0;powerDir=1;shell=null;parts=[];floats=[];fhp=3;shellsLeft=12;shotCount=0;stars=[];
for(var i=0;i<70;i++)stars.push({x:Math.random()*W,y:Math.random()*groundY*.8,s:rand(.5,1.8),p:rand(0,6.28)});
fort={x:W-70,w:GameUI.pick(64,48),h:70};endPending=false;
newWind();
document.getElementById('score').textContent='0';
document.getElementById('shells').textContent=shellsLeft;
document.getElementById('fhp').textContent=fhp;
document.getElementById('startScr').classList.add('hidden');document.getElementById('overScr').classList.add('hidden');document.getElementById('pauseScr').classList.add('hidden');
state='play';paused=false;}
function endGame(win){state='over';
if(win){score+=shellsLeft*100;document.getElementById('score').textContent=score;sWin();
document.getElementById('overTitle').textContent='堡垒攻陷！胜利';}
else{document.getElementById('overTitle').textContent='炮弹耗尽…失败';}
document.getElementById('finalScore').textContent=score;
if(score>hi){hi=score;try{GameUI.storageSet(HIKEY,hi);}catch(e){}}
document.getElementById('hiScore').textContent=hi;
document.getElementById('overScr').classList.remove('hidden');}
function fire(){
shellsLeft--;document.getElementById('shells').textContent=shellsLeft;
shotCount++;if(shotCount%3===0)newWind();
var sp=6+power/100*13;
shell={x:CX+Math.cos(angle)*34,y:groundY-26-Math.sin(angle)*34,vx:Math.cos(angle)*sp,vy:-Math.sin(angle)*sp,trail:[]};
sFire();}
function explode(x,y){
sBoom();
parts.push({x:x,y:y,vx:0,vy:0,life:22,col:'#ffd740',s:4,boom:true,r:12,maxR:64});
for(var i=0;i<18;i++){var a=rand(0,6.28),sp=rand(1,5);parts.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1,life:rand(20,40),col:i%2?'#ff7043':'#8d6e63',s:rand(2,4)});}
// 是否命中堡垒
var fx=fort.x,hit=Math.abs(x-fx)<fort.w/2+40&&y>groundY-fort.h-40;
if(hit){fhp--;document.getElementById('fhp').textContent=fhp;
score+=200;document.getElementById('score').textContent=score;
floats.push({x:fx,y:groundY-fort.h,t:'命中 +200',life:50,vy:-1});
if(fhp<=0){setTimeout(function(){if(state==='play')endGame(true);},500);}}}
function update(){
if(state!=='play'||paused)return;
stars.forEach(function(s){s.p+=.03;});
if(charging){power+=powerDir*2.2;if(power>=100){power=100;powerDir=-1;}if(power<=0){power=0;powerDir=1;}}
if(shell){var s=shell;
s.vx+=wind*.006;
s.vy+=.28;
s.x+=s.vx;s.y+=s.vy;
s.trail.push({x:s.x,y:s.y});if(s.trail.length>16)s.trail.shift();
// 打中堡垒
if(s.x>fort.x-fort.w/2-6&&s.x<fort.x+fort.w/2+6&&s.y>groundY-fort.h&&s.y<groundY+6){explode(s.x,s.y);shell=null;}
else if(s.y>=groundY||s.x>W+20||s.x<-20){explode(Math.min(W,Math.max(0,s.x)),groundY);shell=null;}
if(!shell&&fhp>0&&shellsLeft<=0&&!endPending&&parts.filter(function(p){return p.boom;}).length===0){endPending=true;setTimeout(function(){if(state==='play'&&shellsLeft<=0&&fhp>0)endGame(false);},700);}}
for(var p=parts.length-1;p>=0;p--){var pt=parts[p];
if(pt.boom){pt.r+=(pt.maxR-pt.r)*.25;pt.life--;}
else{pt.x+=pt.vx;pt.y+=pt.vy;pt.vy+=.2;pt.life--;}
if(pt.life<=0)parts.splice(p,1);}
for(var f=floats.length-1;f>=0;f--){var fl=floats[f];fl.y+=fl.vy;fl.life--;if(fl.life<=0)floats.splice(f,1);}
}
function draw(){
if(state==='start')return; // No scene objects exist until startGame initializes them.

ctx.clearRect(0,0,W,H);
ctx.fillStyle='#fff';stars.forEach(function(s){ctx.globalAlpha=.25+.6*Math.abs(Math.sin(s.p));ctx.fillRect(s.x,s.y,s.s,s.s);});ctx.globalAlpha=1;
// 地面
var gg=ctx.createLinearGradient(0,groundY,0,H);gg.addColorStop(0,'#3a3226');gg.addColorStop(1,'#1d1812');
ctx.fillStyle=gg;ctx.fillRect(0,groundY,W,H-groundY);
// 堡垒
var fx=fort.x;
ctx.fillStyle='#5d4037';ctx.fillRect(fx-fort.w/2,groundY-fort.h,fort.w,fort.h);
ctx.fillStyle='#8d6e63';ctx.fillRect(fx-fort.w/2,groundY-fort.h,fort.w,10);
for(var i=0;i<3;i++)ctx.fillRect(fx-fort.w/2+6+i*20,groundY-fort.h-10,10,12); // 城垛
ctx.fillStyle='#3e2723';ctx.fillRect(fx-10,groundY-26,20,26); // 门
ctx.fillStyle='#ff5252';ctx.font='bold 13px sans-serif';ctx.fillText('HP'+fhp,fx-14,groundY-fort.h-16);
// 大炮
ctx.fillStyle='#455a64';ctx.fillRect(CX-16,groundY-18,32,18);
ctx.save();ctx.translate(CX,groundY-26);ctx.rotate(-angle);
var bg=ctx.createLinearGradient(0,0,40,0);bg.addColorStop(0,'#78909c');bg.addColorStop(1,'#37474f');
ctx.fillStyle=bg;ctx.fillRect(0,-8,44,16);ctx.fillStyle='#263238';ctx.fillRect(38,-10,8,20);ctx.restore();
ctx.fillStyle='#263238';ctx.beginPath();ctx.arc(CX,groundY-26,8,0,6.28);ctx.fill();
// 弹道预览点
if(state==='play'&&!shell){
ctx.fillStyle='rgba(255,255,255,.25)';
for(var t=0;t<14;t+=2){var tt=t*.09,sp=6+power/100*13;
var px=CX+Math.cos(angle)*34+Math.cos(angle)*sp*tt*8;
var py=groundY-26-Math.sin(angle)*34-Math.sin(angle)*sp*tt*8+.28*Math.pow(tt*8,2)/2;
if(py<groundY)ctx.fillRect(px,py,3,3);}}
// 力度条
if(charging){
ctx.fillStyle='rgba(255,255,255,.15)';ctx.fillRect(20,60,14,160);
var hg=ctx.createLinearGradient(0,220,0,60);hg.addColorStop(0,'#66bb6a');hg.addColorStop(.6,'#ffd740');hg.addColorStop(1,'#ff5252');
ctx.fillStyle=hg;ctx.fillRect(20,220-power*1.6,14,power*1.6);
ctx.fillStyle='#fff';ctx.font='12px sans-serif';ctx.fillText(Math.round(power)+'%',12,240);}
// 炮弹
if(shell){var s=shell;
ctx.strokeStyle='rgba(255,213,79,.5)';ctx.lineWidth=2;ctx.beginPath();s.trail.forEach(function(t,i){i?ctx.lineTo(t.x,t.y):ctx.moveTo(t.x,t.y);});ctx.stroke();
ctx.fillStyle='#212121';ctx.beginPath();ctx.arc(s.x,s.y,7,0,6.28);ctx.fill();
ctx.fillStyle='#ff7043';ctx.beginPath();ctx.arc(s.x-2,s.y-2,2.5,0,6.28);ctx.fill();}
parts.forEach(function(p){if(p.boom){ctx.globalAlpha=Math.max(0,p.life/22);var g=ctx.createRadialGradient(p.x,p.y,2,p.x,p.y,p.r);
g.addColorStop(0,'#fff');g.addColorStop(.5,'#ff9800');g.addColorStop(1,'rgba(255,87,34,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.28);ctx.fill();}
else{ctx.globalAlpha=Math.max(0,p.life/40);ctx.fillStyle=p.col;ctx.fillRect(p.x,p.y,p.s,p.s);}});ctx.globalAlpha=1;
ctx.font='bold 15px sans-serif';floats.forEach(function(f){ctx.globalAlpha=Math.max(0,f.life/50);ctx.fillStyle='#a5d6a7';ctx.fillText(f.t,f.x-26,f.y);});ctx.globalAlpha=1;
ctx.fillStyle='#80d8ff';ctx.font='13px sans-serif';
ctx.fillText('角度 '+Math.round(angle*180/Math.PI)+'°',20,H-16);
}
function loop(){update();draw();requestAnimationFrame(loop);}
resize();loop();
function posOf(e){var r=cv.getBoundingClientRect();var t=e.touches?e.touches[0]:e;return{x:t.clientX-r.left,y:t.clientY-r.top};}
function tStart(e){e.preventDefault();if(state!=='play'||paused||shell||shellsLeft<=0)return;
charging=true;power=0;powerDir=1;}
function tMove(e){e.preventDefault();if(!charging)return;
var p=posOf(e);var dx=p.x-CX,dy=(groundY-26)-p.y;
if(dx>10&&dy>0){angle=Math.max(15*Math.PI/180,Math.min(85*Math.PI/180,Math.atan2(dy,dx)));}}
function tEnd(e){if(e)e.preventDefault();if(!charging)return;
charging=false;if(state==='play'&&!paused&&!shell&&shellsLeft>0)fire();power=0;}
cv.addEventListener('touchstart',tStart,{passive:false});
cv.addEventListener('touchmove',tMove,{passive:false});
cv.addEventListener('touchend',tEnd,{passive:false});
cv.addEventListener('touchcancel',function(e){charging=false;},{passive:false});
cv.addEventListener('mousedown',tStart);
cv.addEventListener('mousemove',tMove);
document.addEventListener('mouseup',tEnd);
document.getElementById('startBtn').onclick=function(){ac();startGame();};
document.getElementById('retryBtn').onclick=function(){startGame();};
document.getElementById('pauseBtn').onclick=function(){if(state!=='play')return;paused=true;charging=false;document.getElementById('pauseScr').classList.remove('hidden');};
document.getElementById('resumeBtn').onclick=function(){paused=false;document.getElementById('pauseScr').classList.add('hidden');};
document.addEventListener('visibilitychange',function(){if(document.hidden&&state==='play'&&!paused){paused=true;charging=false;document.getElementById('pauseScr').classList.remove('hidden');}});
</script>
</body>
