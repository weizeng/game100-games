<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{display:flex;justify-content:center;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.wrap{width:100%;max-width:480px;height:100%;padding:12px;display:flex;flex-direction:column;align-items:center;gap:10px}
.topbar{width:100%;display:flex;justify-content:space-between;align-items:center;flex-wrap:nowrap!important}
.topbar .stat{display:flex;gap:8px;align-items:center;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:13px}
.topbar .tools{display:flex;gap:6px}
.topbar .tools .iconbtn{min-width:44px;min-height:44px;padding:0 6px}
.stagebox{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}

.overlay{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;z-index:20;padding:24px;text-align:center}
.overlay.hidden{display:none!important}
.lvgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:100%}
.lvgrid .lvl{min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:17px;padding:4px!important;line-height:1.1}
.lvgrid .lvl small{font-size:10px;letter-spacing:-1px;margin-top:2px}
.rowbtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:100%}
#tutStep{font-size:12px;opacity:.7}
#toast{position:fixed;left:50%;top:16%;transform:translate(-50%,-10px);background:rgba(10,8,30,.88);color:#fff;font-weight:800;padding:10px 18px;border-radius:999px;z-index:999;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;font-size:15px;box-shadow:0 0 18px rgba(255,61,154,.5);white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
.hidden{display:none!important}

.opts{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;font-size:13px;font-weight:800}
.opts button{min-height:40px!important;min-width:44px;padding:0 10px!important}
</style>
<!-- GAME UI BEGIN -->
<style>
:root{--page:#172638;--surface:#22374c;--soft:#2e4760;--ink:#f0f6fc;--muted:#b1c6d9;--accent:#f0bc74;--on-accent:#342717;--line:#45637c;--stage:#142438;--page:#0b0620;--surface:#211040;--soft:#33234f;--ink:#fff3fb;--muted:#d4b6dd;--accent:#ff3d9a;--on-accent:#0b0620;--line:#ff3d9a;--b-bg1:#3a0d5e;--b-bg2:#0b0620;--b-btn:#ff3d9a;--b-btn-hi:#ff81bd;--b-edge:#a3124f;--b-glow:#00e5ff;--b-glow-rgb:0,229,255;--b-pedge-rgb:255,61,154;--b-btn-ink:#510927;--b-btn-tsh:0 1px 0 rgba(255,255,255,.45);--b-coin-ink:#510927;--b-coin-tsh:none;--b-key-ink:#00e5ff;--b-title:#ffffff}
/* Shared presentation only; mechanics and state remain inside each standalone game. */

.game-ui #app{background:var(--page);color:var(--ink)}

.game-ui :is(.title,.tb-title,.tb-title,#topbar .t,.topbar .t){color:var(--ink);font-size:16px;font-weight:750;letter-spacing:0}

.game-ui .scorebar{padding:6px 10px;gap:8px;flex-wrap:wrap}

.game-ui :is(.rowbtns,.btnrow,.ctlrow){gap:10px;flex-wrap:wrap;justify-content:center}
.game-ui :is(.pill,.hudbox,.hud .p){background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:none;font-variant-numeric:tabular-nums}
.game-ui :is(.dbtn,.cbtn,.gbtn,.holdbtn,.firebtn,.bombbtn,.jumpbtn,.pumpbtn,.nbtn){border-radius:12px;box-shadow:0 3px 0 var(--line);min-height:44px}
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv,.screen):has(>.ui-panel){padding:20px;overflow-y:auto;overscroll-behavior:contain}

.game-ui .ui-panel{width:min(100%,380px);max-height:100%;overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:18px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:24px;padding:30px 24px;box-shadow:0 8px 0 var(--soft),0 20px 48px #15253618;text-align:center;margin:auto}

.game-ui body>.wrap>canvas:not(#fx){background-color:var(--stage);box-shadow:0 0 0 1px var(--line),0 6px 0 var(--soft);border-radius:18px;flex-shrink:0}
.game-ui .screen>canvas.game{box-shadow:0 0 0 1px var(--line),0 6px 0 var(--soft)}
.game-ui #hud{gap:6px;background:var(--surface);color:var(--ink)}
.game-ui #hud :is(.left,.t,.s,.grp,.pill){color:var(--ink)}
.game-ui #hud .pill{background:var(--surface);border-color:var(--line)}
.game-ui body canvas:is(#cv,#game,#board){background-color:var(--stage)}
.game-ui :is(button.dbtn,button.cbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.game-ui :is(button.lvl,button.lvlbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line);border-radius:12px;min-height:54px}
.game-ui :is(button.lvl,button.lvlbtn) :is(.nc,.sz,small){color:var(--muted)}
.game-ui .ui-panel button.lvl{margin:0;min-width:44px;box-shadow:none;padding:8px}
.game-ui #hud :is(.left,.right,.hudl,.hbtns){gap:5px;flex-wrap:wrap}
.game-ui #hud :is(.left,.hudl){min-width:0;flex-shrink:1}
.game-ui #hud :is(.pill,.left){font-size:12px}
.game-ui button:disabled{cursor:default;opacity:.45;box-shadow:none}
.game-ui .ui-panel .ui-assist-note{color:var(--accent);font-weight:700}
@media(min-width:700px){.game-ui body>.wrap{padding-top:32px}.game-ui .ui-panel{padding:36px 30px}}
@media(max-width:360px){.game-ui body>.wrap{padding:10px;gap:10px}.game-ui .ui-panel{padding:22px 18px;gap:13px}.game-ui .ui-panel h1{font-size:26px}.game-ui .ui-emblem{width:70px;height:70px;font-size:38px}.game-ui :is(.topbar,#topbar){gap:5px;padding:8px}.game-ui :is(.iconbtn,.icobtn,.ibtn,.tbtn,.ib){min-width:44px;min-height:44px}}
@media(max-height:650px){.game-ui .ui-panel{padding:18px;gap:12px}.game-ui .ui-emblem{width:60px;height:60px;font-size:32px}.game-ui .ui-panel h1{font-size:25px}.game-ui .ui-panel :is(p,.howto,.sub,.rule){font-size:13px}}

/* 2026-10-20 热修：开局/结算遮罩铺满整屏，主按钮固定在面板底部，避免被画布尺寸裁切（#10） */
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv):has(>.ui-panel){position:fixed;inset:0;z-index:1000;border-radius:0;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}

.game-ui .ui-panel :is(#startBtn,#btnStart,.startbtn,#bStart,#restartBtn,#btnRestart,#againBtn,#btnAgain,#retryBtn,#btnRetry,#playBtn,#btnPlay){position:sticky;bottom:0;z-index:3;flex-shrink:0}
.game-ui .ui-panel :not(.card,.panel,.pausecard,.ovcard,.ui-mode):has(>:is(#startBtn,#btnStart,.startbtn,#bStart,#restartBtn,#btnRestart,#againBtn,#btnAgain,#retryBtn,#btnRetry,#playBtn,#btnPlay)){position:sticky;bottom:0;z-index:3;flex-shrink:0;background:var(--surface);box-shadow:0 -10px 10px -6px var(--surface)}

const SONGS=[
 {n:'晨光序曲',bpm:92,bars:24,d:.9,hold:.08,dbl:0,bomb:0,root:60,prog:[0,5,3,4]},
 {n:'霓虹街角',bpm:104,bars:26,d:1.1,hold:.12,dbl:.03,bomb:0,root:62,prog:[0,4,5,3]},

 {n:'星屑舞步',bpm:126,bars:30,d:1.5,hold:.14,dbl:.1,bomb:.03,root:64,prog:[0,5,1,4]},

 {n:'👑 幻影协奏',bpm:140,bars:36,d:1.8,hold:.12,dbl:.14,bomb:.05,root:58,prog:[0,5,6,4],boss:{n:'幻影',a:'👻',hp:1,hidden:1}},
 {n:'雷光疾走',bpm:148,bars:34,d:1.9,hold:.12,dbl:.15,bomb:.06,root:63,prog:[0,6,3,4]},
 {n:'深海脉冲',bpm:152,bars:36,d:2,hold:.18,dbl:.16,bomb:.06,root:56,prog:[0,3,6,4]},
 {n:'极光终章',bpm:160,bars:36,d:2.15,hold:.14,dbl:.18,bomb:.07,root:60,prog:[0,4,5,6]},
 {n:'👑 雷神审判',bpm:168,bars:40,d:2.3,hold:.14,dbl:.2,bomb:.09,root:57,prog:[0,6,5,3],boss:{n:'雷神',a:'⚡',hp:1,speed:1}}];

const PERF=.045,GREAT=.09,GOOD=.13;
let save=Store.get('save',{best:[],stars:[],spd:3,ofs:0,tut:0});
let state='menu',si=0,S=null,notes=[],T=0,t0=0,pausedAt=0,hp=100,combo=0,maxC=0,score=0,judge={p:0,g:0,o:0,m:0},fx=[],sparks=[],flash=[0,0,0,0],held={},lastJ=null,boss=null,dur=0,sched=0,FAST=false;
// ---------- 谱面生成 ----------
const PAT=[[0,2],[0,1,2,3],[0,1.5,2],[0,.5,1,2,3],[0,1,1.5,2,3],[0,.5,1,1.5,2,2.5,3,3.5],[0,.75,1.5,2,3],[0,1,2,2.5,3,3.5],[0,.5,1.5,2,2.5,3.5],[0,.25,.5,1,2,2.25,2.5,3]];
function chart(s,seed){const rnd=mkRng(seed);const spb=60/s.bpm,out=[];let lane=1;const lead=2;// 前奏两小节
 for(let b=0;b<s.bars;b++){const dens=s.d*(b<2?.6:b>s.bars-3?.8:1)*(s.boss&&b>=s.bars*.6?1.15:1);
  const maxP=Math.min(PAT.length-1,Math.floor(dens*3.6));const pat=PAT[Math.min(maxP,Math.floor((dens>1.5?.35+.65*rnd():rnd())*(maxP+1)))];
  for(const bt of pat){const t=(lead*4+b*4+bt)*spb;const step=rnd()<.5?1:-1;lane=(lane+step+(rnd()<.3?step:0)+8)%4;
   const r=rnd();if(r<s.bomb&&b>2){out.push({t,l:lane,k:'bomb'});continue;}
   if(r<s.bomb+s.hold&&bt%1===0){const len=spb*(1+Math.floor(rnd()*2));out.push({t,l:lane,k:'hold',e:t+len,deg:b%4});continue;}

 hp=100;combo=0;maxC=0;score=0;judge={p:0,g:0,o:0,m:0};fx=[];held={};lastJ=null;boss=S.boss?{...S.boss,hp:1}:null;
 audio();t0=(AC&&!muted?AC.currentTime:performance.now()/1000)+1.2;sched=0;T=-1.2;state='play';['lvlScr','overScr','pauseOv','startScr'].forEach(k=>show(k,false));fit();hud();toast((boss?'首领战 · ':'')+S.n+' · '+S.bpm+' BPM',1600);}

 judge[k]++;combo++;maxC=Math.max(maxC,combo);score+=pts*(1+Math.min(.5,combo/200));hp=Math.min(100,hp+(k==='p'?1:.5));addJ(k,n.l);flash[n.l]=1;keysound(n);
 if(FX)FX.burst(sparks,LX+n.l*LW+LW/2,HY,LC[n.l],k==='p'?14:8);if(boss)boss.hp=Math.max(0,boss.hp-(k==='p'?1.25:1)/notesTotal());hud();}

 if(!best)return;if(best.k==='bomb'){best.done=1;hp-=15;combo=0;addJ('b',l);noise(.25,.15,900);if(FX)FX.burst(sparks,LX+l*LW+LW/2,HY,'#ff3d3d',24);if(hp<=0)endSong(false);hud();return;}
 best.done=1;hitNote(best,best.t-now);if(best.k==='hold'){best.hold=1;held[l]=best;}}

 for(const n of notes){if(n.t>now+.5)break;if(!n.done&&now-n.t>GOOD){n.done=1;if(n.k!=='bomb')missNote(n);if(state!=='play')return;}
  if(n.k==='hold'&&n.hold===1&&now>=n.e){n.hold=2;delete held[n.l];judge.p++;score+=150;combo++;if(FX)FX.burst(sparks,LX+n.l*LW+LW/2,HY,'#fff',10);hud();}}
 if(T>dur)endSong(true);}
function grade(acc){return acc>=.95?'S':acc>=.88?'A':acc>=.78?'B':'C';}
function endSong(clear){if(state!=='play')return;state='over';const tot=judge.p+judge.g+judge.o+judge.m||1;const acc=(judge.p+judge.g*.7+judge.o*.4)/tot;const gr=clear?grade(acc):'F';
 const st=clear?(gr==='S'?3:gr==='A'?2:1):0;if(clear){if(st>(save.stars[si]||0))save.stars[si]=st;if(score>(save.best[si]||0))save.best[si]=Math.round(score);Store.set('save',save);}
 if(clear){tone(523,.12,'triangle');tone(784,.3,'triangle',.1,0,.15);}else tone(220,.4,'sawtooth',.08,80);
 const go=()=>{$('overH').textContent=clear?(boss?'👑 击败'+boss.n+'！':'🎵 演奏完成'):'💔 演奏中断';$('finalScore').textContent=clear?gr+' · '+starStr(st):'F';
  $('overText').innerHTML='得分 '+Math.round(score)+' · 准确率 '+(acc*100).toFixed(1)+'%<br>完美 '+judge.p+' · 很好 '+judge.g+' · 不错 '+judge.o+' · 失误 '+judge.m+' · 最大连击 '+maxC+(clear?'':'<br>生命耗尽。试试调低流速或在选曲页调节延迟。');
  $('nextBtn').classList.toggle('hidden',!clear||si>=SONGS.length-1);show('overScr',true);};FAST?go():setTimeout(go,500);}
// ---------- 输入 ----------
const ptrLane={};
function laneOf(e){const q=posOf(e,cv,W,H);return clamp(Math.floor((q.x-LX)/LW),0,3);}
cv.addEventListener('pointerdown',e=>{e.preventDefault();const l=laneOf(e);ptrLane[e.pointerId]=l;press(l);});
const up=e=>{const l=ptrLane[e.pointerId];if(l!=null){delete ptrLane[e.pointerId];release(l);}};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
const KEYS={d:0,f:1,j:2,k:3};addEventListener('keydown',e=>{const l=KEYS[e.key];if(l!=null&&!e.repeat)press(l);});addEventListener('keyup',e=>{const l=KEYS[e.key];if(l!=null)release(l);});
// ---------- 绘制 ----------
function draw(dt){const now=performance.now();if(FX)FX.stage(ctx,W,H,'#1d1047','#070316');else{ctx.fillStyle='#120a30';ctx.fillRect(0,0,W,H);}
 const pulse=S&&state==='play'?Math.max(0,1-((T*S.bpm/60)%1)*3):0;
 for(let l=0;l<LN;l++){const x=LX+l*LW;ctx.fillStyle='rgba(255,255,255,'+(.04+flash[l]*.12)+')';ctx.fillRect(x+2,0,LW-4,H);flash[l]=Math.max(0,flash[l]-dt*4);}
 ctx.strokeStyle='rgba(255,255,255,'+(.5+pulse*.5)+')';ctx.lineWidth=3+pulse*3;ctx.beginPath();ctx.moveTo(LX,HY);ctx.lineTo(LX+LW*4,HY);ctx.stroke();
 for(let l=0;l<LN;l++){const x=LX+l*LW+LW/2;ctx.strokeStyle=LC[l];ctx.lineWidth=3;ctx.globalAlpha=.5+flash[l]*.5;ctx.beginPath();ctx.arc(x,HY,24,0,7);ctx.stroke();ctx.globalAlpha=1;txt(ctx,'DFJK'[l],x,HY+44,11,'rgba(255,255,255,.35)');}
 if(state==='play'||state==='pause'||state==='over'){const hid=boss&&boss.hidden&&T>dur*.3&&T<dur*.85;
  for(const n of notes){if(n.done&&!(n.k==='hold'&&n.hold===1))continue;const y=noteY(n.t);if(y<-60)break;if(y>H+40&&n.k!=='hold')continue;const x=LX+n.l*LW+LW/2;
   let al=1;if(hid){al=clamp((y-120)/140,0,1);}
   ctx.globalAlpha=al;
   if(n.k==='hold'){const y2=noteY(n.e),yh=n.hold===1?HY:y;ctx.fillStyle=LC[n.l];ctx.globalAlpha=al*.45;rr(ctx,x-14,y2,28,Math.max(0,yh-y2),12);ctx.fill();ctx.globalAlpha=al;}
   if(n.k==='bomb'){if(FX)FX.orb(ctx,x,y,17,'#333');txt(ctx,'💣',x,y,24);}
   else if(!(n.k==='hold'&&n.hold===1)){if(FX)FX.tile(ctx,x-32,y-11,64,22,LC[n.l],11);else{ctx.fillStyle=LC[n.l];rr(ctx,x-32,y-11,64,22,11);ctx.fill();}ctx.fillStyle='rgba(255,255,255,.7)';rr(ctx,x-22,y-6,44,4,2);ctx.fill();}
   ctx.globalAlpha=1;}
  if(hid){const g=ctx.createLinearGradient(0,60,0,280);g.addColorStop(0,'rgba(7,3,22,1)');g.addColorStop(1,'rgba(7,3,22,0)');ctx.fillStyle=g;ctx.fillRect(0,40,W,240);}}
 if(FX)FX.drawBurst(ctx,sparks);
 // 顶部信息
 if(S&&state!=='menu'){ctx.fillStyle='rgba(0,0,0,.35)';rr(ctx,10,8,W-20,30,15);ctx.fill();ctx.fillStyle=hp>30?'#2ee6a0':'#ff3d6e';rr(ctx,14,12,(W-28)*Math.max(0,hp)/100,10,5);ctx.fill();
  ctx.fillStyle='#b9a8ff';rr(ctx,14,25,(W-28)*clamp(T/dur,0,1),8,4);ctx.fill();
  if(boss){txt(ctx,boss.a,W-36,70,36);ctx.fillStyle='rgba(0,0,0,.35)';rr(ctx,150,58,150,10,5);ctx.fill();ctx.fillStyle='#ff9f43';rr(ctx,150,58,150*boss.hp,10,5);ctx.fill();txt(ctx,boss.n+(boss.hidden?' · 隐身':'')+(boss.speed?' · 后半加速':''),225,78,10,'#ffd7a8');}
  if(combo>=5)otxt(ctx,combo+' 连击',W/2,200,30,'#fff');
  if(lastJ&&lastJ.t>0){const m={p:['完美','#ffe066'],g:['很好','#7fe3ff'],o:['不错','#b9a8ff'],m:['失误','#ff6b6b'],b:['炸弹！','#ff3d3d']}[lastJ.k];ctx.globalAlpha=Math.min(1,lastJ.t*3);otxt(ctx,m[0],W/2,250-(.5-lastJ.t)*30,24,m[1]);ctx.globalAlpha=1;lastJ.t-=dt;}
  if(T<0&&state==='play')otxt(ctx,Math.ceil(-T)+'',W/2,300,60,'#fff');
  if(si===0&&T<6&&state==='play')otxt(ctx,'音符碰到圆环时点击该轨道',W/2,340,14,'#ffe066');}}
// ---------- 菜单 ----------
function openMenu(){state='menu';['overScr','pauseOv'].forEach(i=>show(i,false));const g=$('lvgrid');g.innerHTML='';$('lvlInfo').textContent='★'+save.stars.reduce((a,b)=>a+(b||0),0)+' / 36 · A 级两星，S 级三星';
 SONGS.forEach((s,i)=>{const b=document.createElement('button');b.className='lvl';const open=i===0||(save.stars[i-1]||0)>0||(save.stars[i]||0)>0;b.disabled=!open;b.innerHTML=(open?(s.boss?'👑':i+1):'🔒')+'<small>'+(open?starStr(save.stars[i]||0):'')+'</small>';b.title=s.n;b.onclick=()=>startSong(i);g.appendChild(b);});
 $('spdT').textContent=save.spd;$('ofsT').textContent=save.ofs+'ms';show('lvlScr',true);}
$('spdM').onclick=()=>{save.spd=Math.max(1,save.spd-1);Store.set('save',save);$('spdT').textContent=save.spd;};$('spdP').onclick=()=>{save.spd=Math.min(6,save.spd+1);Store.set('save',save);$('spdT').textContent=save.spd;};
$('ofsM').onclick=()=>{save.ofs-=10;Store.set('save',save);$('ofsT').textContent=save.ofs+'ms';};$('ofsP').onclick=()=>{save.ofs+=10;Store.set('save',save);$('ofsT').textContent=save.ofs+'ms';};
function showTut(done){tutorial([['🎵 跟着节拍','音符从上往下落，落到底部圆环时<b>点击该轨道</b>（整条竖向区域都能点）。越准分越高：完美/很好/不错。'],['🟦 长按与双押','带尾巴的音符要<b>按住直到尾巴结束</b>；同时落下的两个音符要两指一起按。'],['💣 小心炸弹','炸弹音符千万别点！失误和炸弹会扣生命，生命归零演奏中断。'],['👑 首领乐曲','第 4/8/12 首是首领战：鼓魔布满炸弹、幻影让音符隐身、雷神后半段加速。准确率 A 得两星、S 得三星。']],done);}
$('howBtn').onclick=()=>{show('lvlScr',false);showTut(openMenu);};
$('startBtn').onclick=()=>{audio();show('startScr',false);if(!save.tut){showTut(()=>{save.tut=1;Store.set('save',save);startSong(0);});}else openMenu();};
$('bestLine').textContent=save.stars.length?'已获得 ★'+save.stars.reduce((a,b)=>a+(b||0),0):'';
function pause(){if(state!=='play')return;state='pause';pausedAt=clock();if(AC&&AC.state==='running'&&!muted)AC.suspend();show('pauseOv',true);}
function resume(){show('pauseOv',false);const go=()=>{t0=(AC&&!muted?AC.currentTime:performance.now()/1000)-pausedAt+1;T=pausedAt-1;state='play';};if(AC&&!muted)AC.resume().then(go);else go();}
$('pauseBtn').onclick=pause;$('resumeBtn').onclick=resume;$('restartBtn').onclick=()=>{if(AC&&!muted)AC.resume();startSong(si);};$('menuBtn').onclick=()=>{if(AC&&!muted)AC.resume();openMenu();};
$('nextBtn').onclick=()=>startSong(si+1);$('againBtn').onclick=()=>startSong(si);$('menu2Btn').onclick=openMenu;
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
let last=performance.now();function frame(t){const dt=Math.min(.05,(t-last)/1000);last=t;update();draw(dt);requestAnimationFrame(frame);}
fit();requestAnimationFrame(frame);
// 测试钩子：sim 用“人类模型”快速模拟整首曲子
window.__bb={SONGS,chart,startSong,get s(){return{state,si,hp,combo,score:Math.round(score),judge:{...judge},T}},press,release,notes:()=>notes,
 sim(i,skill){const s=SONGS[i];const ns=chart(s,1000+i*77);let h=100,j={p:0,g:0,o:0,m:0},r=mkRng(7+i);
  const gauss=()=>{let u=0;for(let k=0;k<6;k++)u+=r();return(u-3)/1.2;};
  for(let a=0;a<ns.length;a++){const n=ns[a];let dens=0;for(let b=Math.max(0,a-6);b<Math.min(ns.length,a+6);b++)if(Math.abs(ns[b].t-n.t)<1)dens++;
   const sim=ns.some(m=>m!==n&&Math.abs(m.t-n.t)<.01);const hid=s.boss&&s.boss.hidden?1.15:1;const sp=s.boss&&s.boss.speed&&n.t>ns[ns.length-1].t*.5?1.12:1;
   const sigma=(.022+.0075*dens+(sim?.012:0))*hid*sp/skill;
   if(n.k==='bomb'){if(r()<.03/skill){h-=15;}continue;}
   const reactMiss=r()<Math.max(0,(dens-4)*.012*hid*sp/skill);const d=Math.abs(gauss()*sigma);
   if(reactMiss||d>GOOD){j.m++;h-=s.boss?9:7;}else{const k=d<=PERF?'p':d<=GREAT?'g':'o';j[k]++;h=Math.min(100,h+(k==='p'?1:.5));}
   if(n.k==='hold'&&r()<.04/skill){j.m++;h-=7;}
   if(h<=0)return{fail:1,at:(a/ns.length).toFixed(2),j};}
  const tot=j.p+j.g+j.o+j.m;const acc=(j.p+j.g*.7+j.o*.4)/tot;return{clear:1,acc:+acc.toFixed(3),grade:grade(acc),notes:ns.length,j};}};
