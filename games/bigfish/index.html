<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>大鱼吃小鱼</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#040914;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#fff;user-select:none;-webkit-user-select:none}
#wrap{max-width:480px;height:100%;margin:0 auto;position:relative;background:linear-gradient(180deg,#062033 0%,#0a2f4a 30%,#061b30 60%,#02070f 100%)}
canvas{display:block;width:100%;height:100%;touch-action:none}
.hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:10px 12px;pointer-events:none;font-size:15px;z-index:5}
.hud .left{font-weight:bold;text-shadow:0 0 8px #1abc9c}
.hud .right{display:flex;gap:8px;pointer-events:auto}
.iconbtn{min-width:44px;min-height:44px;border-radius:50%;border:1px solid #1abc9c55;background:#0a1a2bd9;color:#fff;font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .08s}
.iconbtn:active{transform:scale(.9)}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(4,10,20,.9);backdrop-filter:blur(4px);z-index:10;text-align:center;padding:24px}
.screen h1{font-size:36px;margin-bottom:6px;background:linear-gradient(135deg,#1abc9c,#16a085);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.screen p{color:#a8c4d8;font-size:14px;line-height:1.8;margin:12px 0 20px}
.bigbtn{min-width:200px;min-height:52px;padding:14px 56px;font-size:18px;border:none;border-radius:30px;background:linear-gradient(135deg,#1abc9c,#0e7c66);color:#fff;font-weight:bold;cursor:pointer;transition:transform .1s;box-shadow:0 4px 20px #1abc9c55}
.bigbtn:active{transform:scale(.93)}
.score{font-size:52px;font-weight:bold;background:linear-gradient(135deg,#ffd740,#1abc9c);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin:8px 0}
.hiscore{color:#888;font-size:14px;margin-bottom:20px}
.hidden{display:none!important}
#growbar{position:absolute;top:0;left:0;height:5px;background:linear-gradient(90deg,#1abc9c,#ffd740);width:0;z-index:5;transition:width .3s}
.lives{font-size:16px;letter-spacing:2px}
.hint{position:absolute;bottom:14px;left:0;right:0;text-align:center;color:#7fb3c8aa;font-size:12px;pointer-events:none}
.tiername{color:#ffd740;font-weight:bold}
</style>
<!-- GAME UI BEGIN -->
<style>
:root{--page:#dcece5;--surface:#f5fff9;--soft:#c8dfd2;--ink:#203f35;--muted:#4d7263;--accent:#28654e;--on-accent:#ffffff;--line:#a1c5b4;--stage:#102f2b;--page:#16a37a;--surface:#f6fff0;--soft:#d8f3cf;--ink:#1b4a2c;--muted:#476e52;--accent:#7d6414;--on-accent:#ffffff;--line:#7fd06b;--b-bg1:#93e46c;--b-bg2:#16a37a;--b-btn:#ffcc29;--b-btn-hi:#ffde74;--b-edge:#d48a00;--b-glow:#d8ffb0;--b-glow-rgb:216,255,176;--b-pedge-rgb:127,208,107;--b-btn-ink:#754c00;--b-btn-tsh:0 1px 0 rgba(255,255,255,.45);--b-coin-ink:#754c00;--b-coin-tsh:none;--b-key-ink:#7d6414;--b-title:#905e00}
/* Shared presentation only; mechanics and state remain inside each standalone game. */
html.game-ui{background:var(--page);color:var(--ink);color-scheme:light;font-family:"Bahnschrift","Microsoft YaHei UI","PingFang SC",sans-serif}
html.game-ui:is([data-theme="space"],[data-theme="arcade"],[data-theme="lab"],[data-theme="ocean"],[data-theme="magic"]){color-scheme:dark}
.game-ui body{background:var(--page);color:var(--ink);font-family:inherit;overscroll-behavior:none}
.game-ui body>.wrap{padding:20px 16px max(20px,env(safe-area-inset-bottom));gap:14px;max-width:500px}
.game-ui #app{background:var(--page);color:var(--ink)}
.game-ui :is(.topbar,#topbar){gap:8px;flex-wrap:wrap;min-height:58px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:10px 12px;box-shadow:0 3px 0 var(--soft);font-size:13px}
.game-ui :is(.title,.tb-title,.tb-title,#topbar .t,.topbar .t){color:var(--ink);font-size:16px;font-weight:750;letter-spacing:0}
.game-ui :is(.topbar,.hud,#hud,#topbar) :is(b,.v){color:var(--accent);font-variant-numeric:tabular-nums}
.game-ui :is(.stat,.topbar .s,.topbar .stat,.scorebar,.stats,.tip,.hint,.hintline,.hsline,.best,.hiscore){color:var(--muted);line-height:1.7}
.game-ui :is(.hint,.hintline,.tip){font-size:12px;max-width:40em;text-wrap:pretty}
.game-ui .scorebar{padding:6px 10px;gap:8px;flex-wrap:wrap}
.game-ui :is(.iconbtn,.iconBtn,.icobtn,.ibtn,.tbtn,.hbtn,.ib,.iconBtn,.pause){min-width:44px;min-height:44px;flex-shrink:0;border-radius:12px;background:var(--soft);color:var(--ink);border:1px solid var(--line);box-shadow:none;font-size:17px}
.game-ui button{font-family:inherit;cursor:pointer;touch-action:manipulation}
.game-ui button:focus-visible,.game-ui [tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.game-ui :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn){background:var(--accent);color:var(--on-accent);border:1px solid transparent;border-radius:13px;min-height:50px;padding:13px 28px;font-size:16px;font-weight:750;letter-spacing:0;box-shadow:0 4px 0 var(--line);text-shadow:none;max-width:100%}
.game-ui :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn):active{box-shadow:none;transform:translateY(2px)}
.game-ui :is(.ghost,.ghostbtn,.btn2,.abtn,.toolbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line);box-shadow:none;border-radius:12px;min-height:44px}
.game-ui :is(.rowbtns,.btnrow,.ctlrow){gap:10px;flex-wrap:wrap;justify-content:center}
.game-ui :is(.pill,.hudbox,.hud .p){background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:none;font-variant-numeric:tabular-nums}
.game-ui :is(.dbtn,.cbtn,.gbtn,.holdbtn,.firebtn,.bombbtn,.jumpbtn,.pumpbtn,.nbtn){border-radius:12px;box-shadow:0 3px 0 var(--line);min-height:44px}
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv,.screen):has(>.ui-panel){padding:20px;overflow-y:auto;overscroll-behavior:contain}
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv):has(>.ui-panel){background:var(--page);backdrop-filter:none;justify-content:safe center;align-items:center}
.game-ui .ui-panel{width:min(100%,380px);max-height:100%;overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:18px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:24px;padding:30px 24px;box-shadow:0 8px 0 var(--soft),0 20px 48px #15253618;text-align:center;margin:auto}
.game-ui .ui-panel :is(.card,.panel,.pausecard,.ovcard){display:contents}
.game-ui .ui-panel :is(h1,h2,.gamename,.gametitle){font-size:30px;line-height:1.25;font-weight:800;color:var(--ink);background:none;-webkit-text-fill-color:currentColor;text-shadow:none;letter-spacing:-.6px;margin:0}
.game-ui .ui-panel :is(p,.howto,.sub,.rule){font-size:14px;line-height:1.85;color:var(--muted);background:none;border:0;box-shadow:none;padding:0;margin:0;max-width:32em;text-align:left;white-space:normal}
.game-ui .ui-panel :is(.bigemoji,.bigemoji,.ic,.big):not(.bigscore){animation:none;filter:none;text-shadow:none}
.game-ui .ui-emblem{width:90px;height:90px;display:grid;place-items:center;border:1px solid var(--line);border-radius:28px;background:var(--soft);font-size:48px;line-height:1;flex-shrink:0;position:relative}
.game-ui[data-theme="wood"] .ui-emblem{border-radius:50%;box-shadow:inset 0 0 0 5px var(--surface),inset 0 0 0 6px var(--line)}
.game-ui[data-theme="wood"] .ui-panel h1{font-family:"STKaiti","KaiTi","Microsoft YaHei",serif;letter-spacing:2px}
.game-ui[data-theme="ice"] .ui-emblem{border-radius:26px 8px 26px 8px}
.game-ui[data-theme="space"] .ui-emblem{background:radial-gradient(circle at center,var(--soft) 42%,transparent 43%),var(--surface);border-radius:50%;outline:1px solid var(--line);outline-offset:7px;margin:7px}
.game-ui[data-theme="kitchen"] .ui-emblem{border-radius:22px;border-bottom:5px solid var(--line)}
.game-ui .ui-panel :is(.score,.bigscore,.bigScore,.scorebig){color:var(--accent);font-size:48px;font-weight:800;font-variant-numeric:tabular-nums}
.game-ui .ui-panel :is(.best,.hsline,.hiscore,.endstats,.endstats b){color:var(--muted);font-size:13px;line-height:1.8}
.game-ui .ui-mode{display:grid;grid-template-columns:1fr 1fr;gap:5px;background:var(--soft);padding:5px;border:1px solid var(--line);border-radius:14px;width:100%}
.game-ui .ui-mode button{min-height:44px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-size:14px;font-weight:700;box-shadow:none}
.game-ui .ui-mode button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 2px 5px #1525361a}
.game-ui .ui-panel .ui-mode-note{font-size:12px;line-height:1.6;text-align:center;color:var(--muted)}
.game-ui .ui-mode-status{display:block;padding:5px 10px;color:var(--accent);font-size:11px;font-weight:700;line-height:1.5;text-align:center;border:1px solid var(--line);border-radius:8px;background:var(--surface);margin:4px auto;max-width:100%;pointer-events:none}
.game-ui body>.wrap>canvas:not(#fx){background-color:var(--stage);box-shadow:0 0 0 1px var(--line),0 6px 0 var(--soft);border-radius:18px;flex-shrink:0}
.game-ui .screen>canvas.game{box-shadow:0 0 0 1px var(--line),0 6px 0 var(--soft)}
.game-ui #hud{gap:6px;background:var(--surface);color:var(--ink)}
.game-ui #hud :is(.left,.t,.s,.grp,.pill){color:var(--ink)}
.game-ui #hud .pill{background:var(--surface);border-color:var(--line)}
.game-ui body canvas:is(#cv,#game,#board){background-color:var(--stage)}
.game-ui :is(button.dbtn,button.cbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.game-ui :is(button.lvl,button.lvlbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line);border-radius:12px;min-height:54px}
.game-ui :is(button.lvl,button.lvlbtn) :is(.nc,.sz,small){color:var(--muted)}
.game-ui .ui-panel button.lvl{margin:0;min-width:44px;box-shadow:none;padding:8px}
.game-ui #hud :is(.left,.right,.hudl,.hbtns){gap:5px;flex-wrap:wrap}
.game-ui #hud :is(.left,.hudl){min-width:0;flex-shrink:1}
.game-ui #hud :is(.pill,.left){font-size:12px}
.game-ui button:disabled{cursor:default;opacity:.45;box-shadow:none}
.game-ui .ui-panel .ui-assist-note{color:var(--accent);font-weight:700}
@media(min-width:700px){.game-ui body>.wrap{padding-top:32px}.game-ui .ui-panel{padding:36px 30px}}
@media(max-width:360px){.game-ui body>.wrap{padding:10px;gap:10px}.game-ui .ui-panel{padding:22px 18px;gap:13px}.game-ui .ui-panel h1{font-size:26px}.game-ui .ui-emblem{width:70px;height:70px;font-size:38px}.game-ui :is(.topbar,#topbar){gap:5px;padding:8px}.game-ui :is(.iconbtn,.icobtn,.ibtn,.tbtn,.ib){min-width:40px;min-height:44px}}
@media(max-height:650px){.game-ui .ui-panel{padding:18px;gap:12px}.game-ui .ui-emblem{width:60px;height:60px;font-size:32px}.game-ui .ui-panel h1{font-size:25px}.game-ui .ui-panel :is(p,.howto,.sub,.rule){font-size:13px}}
@media(prefers-reduced-motion:reduce){.game-ui *, .game-ui *::before,.game-ui *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
/* 2026-10-20 热修：开局/结算遮罩铺满整屏，主按钮固定在面板底部，避免被画布尺寸裁切（#10） */
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv):has(>.ui-panel){position:fixed;inset:0;z-index:1000;border-radius:0;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
.game-ui .ui-panel{touch-action:pan-y}
.game-ui .ui-panel :is(#startBtn,#btnStart,.startbtn,#bStart,#restartBtn,#btnRestart,#againBtn,#btnAgain,#retryBtn,#btnRetry,#playBtn,#btnPlay){position:sticky;bottom:0;z-index:3;flex-shrink:0}
.game-ui .ui-panel :not(.card,.panel,.pausecard,.ovcard,.ui-mode):has(>:is(#startBtn,#btnStart,.startbtn,#bStart,#restartBtn,#btnRestart,#againBtn,#btnAgain,#retryBtn,#btnRetry,#playBtn,#btnPlay)){position:sticky;bottom:0;z-index:3;flex-shrink:0;background:var(--surface);box-shadow:0 -10px 10px -6px var(--surface)}


/* ===== Direction B · 霓虹糖果 Pop Arcade ===== saturated gradients, chunky bevels with a hard bottom edge, sticker panels, neon on dark themes */
html.game-ui[data-skin="b"]{--fb:"HarmonyOS Sans SC","MiSans","OPPOSans","vivo Sans","Noto Sans SC","Noto Sans CJK SC","PingFang SC","Microsoft YaHei UI",system-ui,sans-serif;--bounce:cubic-bezier(.34,1.56,.64,1);--bg:radial-gradient(circle at 12% 18%,rgba(255,255,255,.28) 0 38px,transparent 40px),radial-gradient(circle at 88% 30%,rgba(255,255,255,.16) 0 64px,transparent 66px),radial-gradient(circle at 20% 82%,rgba(255,255,255,.14) 0 52px,transparent 54px),radial-gradient(rgba(255,255,255,.16) 1.5px,transparent 2.2px) 0 0/22px 22px,linear-gradient(165deg,var(--b-bg1),var(--b-bg2));font-family:var(--fb)}
html.game-ui[data-skin="b"],html.game-ui[data-skin="b"] body,html.game-ui[data-skin="b"] #app,html.game-ui[data-skin="b"] :is(.overlay,.ov,#ov,#overlay,#pauseOv):has(>.ui-panel){background:var(--bg);background-color:var(--b-bg2)}

html.game-ui[data-skin="b"] .ui-panel :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn,button.actBtn):not(.ghost):not(#\#){min-height:56px;padding:14px 34px;font-size:19px;letter-spacing:1px}

        var lg = g.createLinearGradient(0, 0, 0, h); lg.addColorStop(0, top); lg.addColorStop(1, bottom); g.fillStyle = lg; g.fillRect(0, 0, w, h);
        var v = g.createRadialGradient(w / 2, h * .35, Math.min(w, h) * .2, w / 2, h / 2, Math.max(w, h) * .75);
        v.addColorStop(0, 'rgba(255,255,255,' + (skin === 'b' ? .10 : .07) + ')'); v.addColorStop(1, 'rgba(0,0,0,.35)'); g.fillStyle = v; g.fillRect(0, 0, w, h);
      }), 0, 0, w, h);
    },
    // Glow is shadowBlur: cheap for a handful of shapes, never use it on every tile.
    glow: function (ctx, color, blur) { ctx.shadowColor = color; ctx.shadowBlur = blur; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0; },
    noGlow: function (ctx) { ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; },
    // Crisp rendering on high-DPI phones without changing game coordinates.
    // Only safe where input code converts with getBoundingClientRect + logical W/H, not cv.width.
    hidpi: function (cv, ctx, w, h) {
      var d = Math.max(1, Math.min(2.5, window.devicePixelRatio || 1));
      cv.width = Math.round(w * d); cv.height = Math.round(h * d); // intrinsic ratio stays w:h, so CSS sizing is unchanged
      ctx.setTransform(d, 0, 0, d, 0, 0); return d;
    },
    // Lightweight particle bursts (pooled array, no allocations per frame beyond the burst).
    burst: function (list, x, y, color, n) {
      for (var i = 0; i < (n || 12); i++) { var a = Math.random() * 6.283, v = 1 + Math.random() * 2.6; list.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 1, life: 1, c: color, r: 1.5 + Math.random() * 2.5 }); }
    },
    drawBurst: function (ctx, list) {
      for (var i = list.length - 1; i >= 0; i--) {
        var p = list[i]; p.x += p.vx; p.y += p.vy; p.vy += .12; p.life -= .035;
        if (p.life <= 0) { list.splice(i, 1); continue; }
        ctx.globalAlpha = p.life; ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (skin === 'b' ? 1.2 : 1), 0, 7); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
  };
  window.GameUI.fx = fx;
}());

</script>
<!-- GAME UI END -->
</head>
<body>
<div id="wrap">
<canvas id="cv"></canvas>
<div id="growbar"></div>
<div class="hud">
<div class="left">🐟 <span id="score">0</span> · <span class="tiername" id="tier">小鱼</span></div>
<div class="lives" id="lives">❤️❤️❤️</div>
<div class="right"><button class="iconbtn" id="muteBtn">🔊</button><button class="iconbtn" id="pauseBtn">⏸</button></div>
</div>
<div class="hint" id="hint">拖拽移动小鱼 · 吃掉比你小的鱼长大 · 躲开大鱼！</div>
<div class="screen" id="startScr">
<h1>🐟 大鱼吃小鱼</h1>
<p>拖拽移动你的小鱼，吃掉比自己小的鱼<br>吃够数量就长大：小鱼→中鱼→大鱼→鲨鱼→鲸鲨<br>碰到比你大的鱼会失去 1 条命（共 3 条）<br>✨ 发光珍珠 = 高分加成 · 长到鲸鲨即胜利！</p>
<button class="bigbtn" id="startBtn">开吃</button>
</div>
<div class="screen hidden" id="overScr">
<h1 id="overTitle">游戏结束</h1>
<div class="score" id="finalScore">0</div>
<div class="hiscore">最高分：<span id="hiScore">0</span> · 吃掉 <span id="eaten">0</span> 条鱼 · 体型 <span id="finalTier">小鱼</span></div>
<button class="bigbtn" id="retryBtn">再来一次</button>
</div>
<div class="screen hidden" id="pauseScr">
<h1>已暂停</h1>
<p>深海静悄悄……</p>
<button class="bigbtn" id="resumeBtn">继续</button>
</div>
</div>
<script>
/* GAMEPLAY UPGRADE */
"use strict";
var cv=document.getElementById('cv'),ctx=cv.getContext('2d'),wrap=document.getElementById('wrap');
var W,H,DPR;
function resize(){DPR=Math.min(window.devicePixelRatio||1,2);W=wrap.clientWidth;H=wrap.clientHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
window.addEventListener('resize',resize);resize();
// ---------- 音效 ----------
var muted=false,AC=null;
try{muted=GameUI.storageGet('g100_mute')==='1';}catch(e){}
var muteBtn=document.getElementById('muteBtn');muteBtn.textContent=muted?'🔇':'🔊';
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended'){try{AC.resume();}catch(e){}}return AC;}
function tone(f,dur,type,vol,slide){if(muted)return;var c=ac();if(!c)return;try{var o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,c.currentTime);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,slide),c.currentTime+dur);g.gain.setValueAtTime(vol||.1,c.currentTime);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+dur);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+dur);}catch(e){}}
function sClick(){tone(600,.08,'square',.06);}
function sEat(){tone(500,.1,'sine',.1,900);}
function sGrow(){[523,659,784,1046].forEach(function(f,i){setTimeout(function(){tone(f,.18,'sine',.1);},i*90);});}
function sHurt(){tone(220,.3,'sawtooth',.14,70);}
function sPearl(){tone(880,.12,'sine',.1,1760);setTimeout(function(){tone(1320,.16,'sine',.08,2093);},100);}
function sWin(){[523,659,784,1046,1318,1568].forEach(function(f,i){setTimeout(function(){tone(f,.28,'triangle',.12);},i*150);});}
muteBtn.onclick=function(e){e.stopPropagation();sClick();muted=!muted;try{GameUI.storageSet('g100_mute',muted?'1':'0');}catch(e2){}muteBtn.textContent=muted?'🔇':'🔊';};
// ---------- 数据 ----------
var HIKEY='g100_bigfish_hs',hi=0;
try{hi=parseInt(GameUI.storageGet(HIKEY))||0;}catch(e){}
var TIERS=[
 {name:'小鱼',emoji:'🐟',scale:.75,need:6,mult:1},
 {name:'中鱼',emoji:'🐠',scale:1.05,need:10,mult:2},
 {name:'大鱼',emoji:'🐡',scale:1.45,need:14,mult:3},
 {name:'鲨鱼',emoji:'🦈',scale:1.95,need:18,mult:5},
 {name:'鲸鲨',emoji:'🐋',scale:2.6,need:0,mult:8}
];
var ENEMY_EMOJI=['🐟','🐠','🐡','🦈','🐋','🐙','🦑'];
var state='start',score=0,eatenTotal=0,lives=GameUI.pick(3,2),tier=0,tierProgress=0;
var fishes=[],parts=[],floats=[],bubbles=[],pearls=[];
var player,invuln=0,frame=0,pearlTimer=0;
function rand(a,b){return a+Math.random()*(b-a);}
function fishR(t){return 14*TIERS[t].scale;}
function spawnFish(forceTier){
 var dir=Math.random()<.5?1:-1;
 var t;
 if(forceTier!==undefined){t=forceTier;}
 else{var r=Math.random();
  if(r<.5)t=Math.max(0,Math.min(4,tier+(Math.random()<.7?-1:0)));
  else if(r<.8)t=tier;
  else t=Math.min(4,tier+1+Math.floor(Math.random()*2));
  t=Math.max(0,Math.min(4,t));
 }
 var s=tier===t?TIERS[t].scale:TIERS[t].scale;
 return {x:dir>0?-60:W+60,y:rand(70,H-40),vx:dir*rand(.7,1.8)/Math.sqrt(s+.3),t:t,emoji:ENEMY_EMOJI[Math.floor(Math.random()*ENEMY_EMOJI.length)],bob:rand(0,6.28),dir:dir};
}
function reset(){
 score=0;eatenTotal=0;lives=GameUI.pick(3,2);tier=0;tierProgress=0;invuln=0;pearlTimer=0;
 fishes=[];parts=[];floats=[];pearls=[];
 player={x:W/2,y:H/2,tx:W/2,ty:H/2,dir:1,scale:TIERS[0].scale};
 for(var i=0;i<10;i++)fishes.push(spawnFish());
 document.getElementById('score').textContent='0';
 document.getElementById('tier').textContent=TIERS[0].name;
 document.getElementById('lives').textContent='❤️❤️❤️';
 updateGrowBar();
}
function updateGrowBar(){var need=TIERS[tier].need;document.getElementById('growbar').style.width=need>0?(tierProgress/need*100)+'%':'100%';}
function burst(x,y,col,n){for(var i=0;i<(n||14);i++)parts.push({x:x,y:y,vx:rand(-2.4,2.4),vy:rand(-2.4,2.4),life:rand(24,44),max:44,col:col,r:rand(2,5)});}
function floatText(x,y,txt,col){floats.push({x:x,y:y,txt:txt,life:50,max:50,col:col||'#ffd740'});}
function vibrate(ms){try{if(navigator.vibrate)navigator.vibrate(ms);}catch(e){}}
// ---------- 输入 ----------
var dragging=false;
function toGame(e){var r=cv.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top};}
cv.addEventListener('pointerdown',function(e){if(state!=='play')return;dragging=true;var p=toGame(e);player.tx=p.x;player.ty=p.y;cv.setPointerCapture&&cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointermove',function(e){if(!dragging||state!=='play')return;var p=toGame(e);player.tx=p.x;player.ty=p.y;});
window.addEventListener('pointerup',function(){dragging=false;});
// ---------- 主循环 ----------
var last=0;
function loop(ts){
 requestAnimationFrame(loop);
 if(state!=='play')return;
 var dt=Math.min(50,ts-(last||ts));last=ts;frame++;
 var k=dt/16.7;
 // 玩家移动（缓动跟随）
 var dx=player.tx-player.x,dy=player.ty-player.y;
 player.x+=dx*.12*k;player.y+=dy*.12*k;
 if(Math.abs(dx)>4)player.dir=dx>0?1:-1;
 var targetScale=TIERS[tier].scale;
 player.scale+=(targetScale-player.scale)*.08*k;
 if(invuln>0)invuln-=dt;
 // 生成敌方鱼
 if(fishes.length<12&&frame%40===0)fishes.push(spawnFish());
 for(var i=fishes.length-1;i>=0;i--){
  var f=fishes[i];f.x+=f.vx*k;f.y+=Math.sin(frame/30+f.bob)*.4*k;
  if((f.vx>0&&f.x>W+80)||(f.vx<0&&f.x<-80)){fishes[i]=spawnFish();continue;}
  var px=f.x-player.x,py=f.y-player.y;
  var rr=(fishR(f.t)+14*player.scale)*.75;
  if(px*px+py*py<rr*rr){
   if(f.t<=tier){ // 吃掉
    eatenTotal++;tierProgress++;
    var gain=10*TIERS[tier].mult;score+=gain;
    sEat();burst(f.x,f.y,'#ffd740');floatText(f.x,f.y-20,'+'+gain);
    if(tier<4&&tierProgress>=TIERS[tier].need){
     tier++;tierProgress=0;sGrow();
     burst(player.x,player.y,'#1abc9c',26);
     floatText(player.x,player.y-40,'长大了！'+TIERS[tier].emoji,'#1abc9c');
     vibrate(60);
     if(tier===4){win();return;}
    }
    document.getElementById('score').textContent=score;
    document.getElementById('tier').textContent=TIERS[tier].name;
    updateGrowBar();
    fishes[i]=spawnFish();
   }else if(invuln<=0){ // 被大鱼咬
    lives--;invuln=2000;sHurt();vibrate([80,60,80]);
    burst(player.x,player.y,'#ff5252',22);
    floatText(player.x,player.y-40,'-1 ❤️','#ff5252');
    document.getElementById('lives').textContent='❤️'.repeat(Math.max(0,lives))+'🖤'.repeat(Math.max(0,3-lives));
    fishes[i]=spawnFish();
    if(lives<=0){gameOver();return;}
   }
  }
 }
 // 珍珠
 pearlTimer-=dt;
 if(pearlTimer<=0){pearlTimer=rand(7000,11000);pearls.push({x:rand(50,W-50),y:rand(90,H-90),life:6000});}
 for(var j=pearls.length-1;j>=0;j--){
  var pe=pearls[j];pe.life-=dt;
  var pdx=pe.x-player.x,pdy=pe.y-player.y;
  if(pdx*pdx+pdy*pdy<Math.pow(30+14*player.scale,2)){
   var pg=50*TIERS[tier].mult;score+=pg;sPearl();
   burst(pe.x,pe.y,'#e1f5fe',20);floatText(pe.x,pe.y-20,'珍珠 +'+pg,'#e1f5fe');vibrate(30);
   document.getElementById('score').textContent=score;
   pearls.splice(j,1);continue;
  }
  if(pe.life<=0)pearls.splice(j,1);
 }
 // 气泡粒子
 if(frame%6===0)bubbles.push({x:rand(0,W),y:H+10,vy:rand(-1.6,-.6),r:rand(1.5,5),a:rand(.2,.5)});
 for(var b=bubbles.length-1;b>=0;b--){var bb=bubbles[b];bb.y+=bb.vy*k;bb.x+=Math.sin(frame/40+bb.r*7)*.3;if(bb.y<-20)bubbles.splice(b,1);}
 // 粒子/飘字更新
 for(var p=parts.length-1;p>=0;p--){var pt=parts[p];pt.x+=pt.vx*k;pt.y+=pt.vy*k;pt.vy+=.05*k;pt.life-=dt/16.7;if(pt.life<=0)parts.splice(p,1);}
 for(var q=floats.length-1;q>=0;q--){var fl=floats[q];fl.y-=.8*k;fl.life-=dt/16.7;if(fl.life<=0)floats.splice(q,1);}
 draw();
}
function drawFish(x,y,scale,emoji,dir,alpha){
 ctx.save();ctx.globalAlpha=alpha===undefined?1:alpha;
 ctx.translate(x,y);ctx.scale(dir,1);
 ctx.font=Math.round(34*scale)+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';
 ctx.fillText(emoji,0,0);ctx.restore();
}
function draw(){
 ctx.clearRect(0,0,W,H);
 // 深海光晕
 var g=ctx.createRadialGradient(W/2,H*.35,20,W/2,H*.35,H*.8);
 g.addColorStop(0,'rgba(26,188,156,.10)');g.addColorStop(1,'rgba(0,0,0,0)');
 ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 // 气泡
 ctx.strokeStyle='#7fd4e833';
 for(var i=0;i<bubbles.length;i++){var b=bubbles[i];ctx.globalAlpha=b.a;ctx.lineWidth=1;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,6.283);ctx.stroke();}
 ctx.globalAlpha=1;
 // 珍珠
 for(var j=0;j<pearls.length;j++){var pe=pearls[j];
  var pulse=.6+.4*Math.sin(frame/12);
  ctx.save();ctx.shadowColor='#e1f5fe';ctx.shadowBlur=18*pulse;
  ctx.font='26px serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('✨',pe.x,pe.y);ctx.restore();}
 // 敌方鱼
 for(var k=0;k<fishes.length;k++){var f=fishes[k];drawFish(f.x,f.y,TIERS[f.t].scale,f.emoji,f.dir);}
 // 玩家（受伤闪烁）
 var blink=invuln>0&&Math.floor(frame/6)%2===0;
 drawFish(player.x,player.y,player.scale,TIERS[tier].emoji,player.dir,blink?.35:1);
 // 粒子
 for(var p=0;p<parts.length;p++){var pt=parts[p];ctx.globalAlpha=Math.max(0,pt.life/pt.max);ctx.fillStyle=pt.col;ctx.beginPath();ctx.arc(pt.x,pt.y,pt.r,0,6.283);ctx.fill();}
 ctx.globalAlpha=1;
 // 飘字
 ctx.textAlign='center';ctx.font='bold 16px sans-serif';
 for(var q=0;q<floats.length;q++){var fl=floats[q];ctx.globalAlpha=Math.max(0,fl.life/fl.max);ctx.fillStyle=fl.col;ctx.fillText(fl.txt,fl.x,fl.y);}
 ctx.globalAlpha=1;
}
function saveHi(){if(score>hi){hi=score;try{GameUI.storageSet(HIKEY,String(hi));}catch(e){}}}
function gameOver(){state='over';saveHi();sHurt();
 document.getElementById('overTitle').textContent='🐟 被吃掉了…';
 document.getElementById('finalScore').textContent=score;
 document.getElementById('hiScore').textContent=hi;
 document.getElementById('eaten').textContent=eatenTotal;
 document.getElementById('finalTier').textContent=TIERS[tier].name;
 setTimeout(function(){document.getElementById('overScr').classList.remove('hidden');},600);}
function win(){state='over';saveHi();sWin();vibrate([60,60,120]);
 burst(player.x,player.y,'#ffd740',40);
 document.getElementById('overTitle').textContent='🏆 称霸鱼塘！';
 document.getElementById('finalScore').textContent=score;
 document.getElementById('hiScore').textContent=hi;
 document.getElementById('eaten').textContent=eatenTotal;
 document.getElementById('finalTier').textContent='鲸鲨';
 setTimeout(function(){document.getElementById('overScr').classList.remove('hidden');},800);}
// ---------- 界面 ----------
document.getElementById('startBtn').onclick=function(){sClick();ac();reset();
 document.getElementById('startScr').classList.add('hidden');state='play';last=0;};
document.getElementById('retryBtn').onclick=function(){sClick();reset();
 document.getElementById('overScr').classList.add('hidden');state='play';last=0;};
document.getElementById('pauseBtn').onclick=function(e){e.stopPropagation();if(state!=='play')return;sClick();
 state='pause';document.getElementById('pauseScr').classList.remove('hidden');};
document.getElementById('resumeBtn').onclick=function(){sClick();
 document.getElementById('pauseScr').classList.add('hidden');state='play';last=0;};
requestAnimationFrame(loop);
</script>
</body>
</html>
