<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>吃豆人</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#121212;color:#f0f0f0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;display:flex;justify-content:center;min-height:100vh;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.wrap{width:100%;max-width:480px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:10px}
.topbar{width:100%;display:flex;justify-content:space-between;align-items:center}
.hud{display:flex;gap:12px;align-items:center;font-size:14px}
.hud b{color:#FFEB3B;font-size:20px}
.lives{font-size:15px}
.iconbtn{background:#1f1f1f;border:1px solid #333;color:#fff;font-size:17px;width:40px;height:40px;border-radius:10px;cursor:pointer;transition:transform .08s}
.iconbtn:active{transform:scale(.9)}
#cv{background:#050510;border-radius:12px;touch-action:none;width:100%;max-width:440px;height:auto;box-shadow:0 6px 24px rgba(0,0,0,.5)}
.dpad{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(3,56px);gap:4px}
.dbtn{background:#1f1f1f;border:1px solid #444;color:#fff;font-size:20px;border-radius:12px;cursor:pointer;transition:transform .08s;touch-action:none}
.dbtn:active{transform:scale(.9);background:#333}
.tip{font-size:12px;color:#888;text-align:center}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.87);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;z-index:20;padding:24px;text-align:center}
.hidden{display:none!important}
.overlay h1{font-size:32px}
.overlay p{color:#bbb;font-size:15px;line-height:1.9;max-width:380px}
.btn{background:linear-gradient(135deg,#FFEB3B,#F9A825);border:none;color:#222;font-size:19px;font-weight:700;padding:13px 52px;border-radius:14px;cursor:pointer;transition:transform .08s;box-shadow:0 4px 16px rgba(255,235,59,.35)}
.btn:active{transform:scale(.94)}
.big{font-size:44px}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="hud">得分 <b id="score">0</b> <span class="lives" id="lives">🟡🟡🟡</span> <span id="level">第1关</span></div>
    <div>
      <button class="iconbtn" id="pauseBtn">⏸</button>
      <button class="iconbtn" id="sndBtn">🔊</button>
    </div>
  </div>
  <canvas id="cv" width="380" height="300"></canvas>
  <div class="dpad">
    <div></div><button class="dbtn" data-d="up">▲</button><div></div>
    <button class="dbtn" data-d="left">◀</button><div></div><button class="dbtn" data-d="right">▶</button>
    <div></div><button class="dbtn" data-d="down">▼</button><div></div>
  </div>
  <div class="tip">滑动屏幕或按方向键转向 · 吃大力丸反杀鬼魂</div>
</div>

<div class="overlay" id="startOv">
  <div class="big">👻</div>
  <h1>吃豆人</h1>
  <p>吃光迷宫所有豆子过关。<br>🔴红鬼追踪你 · 🩷粉鬼埋伏你前方 ·<br>🔵蓝鬼随机游荡 · 🟠橙鬼定点巡逻。<br>吃到大力丸后反杀鬼魂得分！<br>3 条命，滑动屏幕或方向键转向。</p>
  <button class="btn" id="startBtn">开始游戏</button>
</div>
<div class="overlay hidden" id="pauseOv">
  <h1>⏸ 已暂停</h1>
  <button class="btn" id="resumeBtn">继续</button>
</div>
<div class="overlay hidden" id="endOv">
  <div class="big" id="endEmoji">👻</div>
  <h1 id="endTitle">游戏结束</h1>
  <p id="endScore"></p>
  <p style="color:#888;font-size:13px" id="endHs"></p>
  <button class="btn" id="againBtn">重新开始</button>
</div>

<script>
'use strict';
// ============ 音效 ============
let AC=null, soundOn=true;
function tone(f,d,type,v,slide){ if(!soundOn)return; try{
  AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'square'; o.frequency.value=f;
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),AC.currentTime+d);
  g.gain.setValueAtTime(v||0.05,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+d);
  o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d);
}catch(e){} }
const sfx={
  click(){tone(650,0.06);},
  waka(){tone(400+Math.random()*200,0.05,'square',0.035);},
  power(){tone(200,0.3,'sawtooth',0.07,600);},
  eatGhost(){tone(900,0.2,'square',0.08,-500);},
  hit(){tone(140,0.35,'sawtooth',0.1,-80);},
  win(){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,0.2,'triangle',0.08),i*120));},
  lose(){[400,300,200,150].forEach((f,i)=>setTimeout(()=>tone(f,0.25,'sawtooth',0.08,-40),i*160));}
};
const HSKEY='g100_pacman_hs';
function getHS(){try{return +(localStorage.getItem(HSKEY)||0);}catch(e){return 0;}}
function setHS(v){try{localStorage.setItem(HSKEY,v);}catch(e){}}
// ============ 迷宫与逻辑（可测试） ============
const MW=19,MH=15,TS=20;
const MAZE=[
"###################",
"#........#........#",
"#.##.###.#.###.##.#",
"#o##.###.#.###.##o#",
"#.##.###.#.###.##.#",
"#.................#",
"#.##.#.#####.#.##.#",
"#....#.......#....#",
"#.##.#.......#.##.#",
"#.................#",
"#.##.###.#.###.##.#",
"#o##.###.#.###.##o#",
"#.##.###.#.###.##.#",
"#........#........#",
"###################"];
const DIRS={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
const DIRLIST=['up','left','down','right'];
function walkable(x,y){return x>=0&&y>=0&&x<MW&&y<MH&&MAZE[y][x]!=='#';}
function openTiles(){
  const t=[];
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++)if(walkable(x,y))t.push([x,y]);
  return t;
}
const OPENS=openTiles();
function newState(level){
  const dots={};
  let n=0;
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
    const ch=MAZE[y][x];
    if(ch==='.'||ch==='o'){dots[x+','+y]=ch;n++;}
  }
  const S={
    level, dots, dotsLeft:n,
    player:{x:9,y:9,dir:'left',want:'left',moving:false,px:9,py:9},
    ghosts:[
      {name:'blinky',color:'#ff5252',x:9,y:7,dir:'left',mode:'chase',fright:0,px:9,py:7,corner:[17,1]},
      {name:'pinky', color:'#f48fb1',x:8,y:7,dir:'right',mode:'chase',fright:0,px:8,py:7,corner:[1,1]},
      {name:'inky',  color:'#4fc3f7',x:10,y:7,dir:'right',mode:'chase',fright:0,px:10,py:7,corner:[17,13]},
      {name:'clyde', color:'#ffb74d',x:9,y:8,dir:'up',mode:'chase',fright:0,px:9,py:8,corner:[1,13],patrol:0}
    ],
    fright:0, modeT:0, scatter:false, chain:0,
    ghostSpeed:0.055+level*0.004, playerSpeed:0.11,
    dead:false, won:false
  };
  return S;
}
// 鬼魂目标
function ghostTarget(S,g){
  const p=S.player;
  if(g.fright>0)return null; // 随机
  if(S.scatter)return g.corner;
  switch(g.name){
    case 'blinky':return [p.x,p.y];
    case 'pinky':{const d=DIRS[p.dir];return [p.x+d[0]*4,p.y+d[1]*4];}
    case 'inky':return OPENS[(Math.random()*OPENS.length)|0];
    case 'clyde':{ // 巡逻：四个角循环
      const cs=[[1,1],[17,1],[17,13],[1,13]];
      const t=cs[g.patrol%4];
      if(g.x===t[0]&&g.y===t[1])g.patrol++;
      return t;
    }
  }
  return [p.x,p.y];
}
// 到达格子中心后为鬼魂选方向（不走回头路，无路则回头）
function ghostChoose(S,g){
  const rev={up:'down',down:'up',left:'right',right:'left'};
  const t=ghostTarget(S,g);
  let best=null,bs=1e9;
  const opts=[];
  for(const d of DIRLIST){
    const dd=DIRS[d],nx=g.x+dd[0],ny=g.y+dd[1];
    if(!walkable(nx,ny)||d===rev[g.dir])continue;
    opts.push({d,nx,ny});
  }
  if(!opts.length){ // 死胡同：回头
    const dd=DIRS[rev[g.dir]],nx=g.x+dd[0],ny=g.y+dd[1];
    return walkable(nx,ny)?rev[g.dir]:g.dir;
  }
  if(t===null)return opts[(Math.random()*opts.length)|0].d; // 害怕：随机
  for(const o of opts){
    const dist=(o.nx-t[0])*(o.nx-t[0])+(o.ny-t[1])*(o.ny-t[1]);
    const jitter=Math.random()*2; // 少量随机防卡死
    if(dist+jitter<bs){bs=dist+jitter;best=o.d;}
  }
  return best;
}
function stepGhost(S,g){
  const sp=g.fright>0?S.ghostSpeed*0.55:S.ghostSpeed;
  // 像素位置向目标格推进（简化：直接按格子跳+插值）
  if(g.px===undefined){g.px=g.x;g.py=g.y;}
  // 用“下一格”模型
  if(g.nx===undefined){
    g.dir=ghostChoose(S,g);
    const dd=DIRS[g.dir];g.nx=g.x+dd[0];g.ny=g.y+dd[1];
    if(!walkable(g.nx,g.ny)){g.nx=g.x;g.ny=g.y;}
  }
  const dx=g.nx-g.px,dy=g.ny-g.py;
  const dist=Math.hypot(dx,dy);
  if(dist<=sp){g.px=g.nx;g.py=g.ny;g.x=g.nx;g.y=g.ny;g.nx=undefined;}
  else{g.px+=dx/dist*sp;g.py+=dy/dist*sp;}
}
function stepPlayer(S){
  const p=S.player;
  if(p.nx===undefined){
    // 尝试转向
    const wd=DIRS[p.want],wx=p.x+wd[0],wy=p.y+wd[1];
    if(walkable(wx,wy))p.dir=p.want;
    const dd=DIRS[p.dir],nx=p.x+dd[0],ny=p.y+dd[1];
    if(walkable(nx,ny)){p.nx=nx;p.ny=ny;}
    else return; // 撞墙停下
  }
  const sp=S.playerSpeed;
  const dx=p.nx-p.px,dy=p.ny-p.py,dist=Math.hypot(dx,dy);
  if(dist<=sp){
    p.px=p.nx;p.py=p.ny;p.x=p.nx;p.y=p.ny;p.nx=undefined;
    // 吃豆
    const k=p.x+','+p.y;
    if(S.dots[k]){S.ate=S.dots[k]==='o'?'power':'dot';delete S.dots[k];S.dotsLeft--;}
  }else{p.px+=dx/dist*sp;p.py+=dy/dist*sp;}
}
function tick(S){
  if(S.dead||S.won)return {events:[]};
  const ev=[];
  // 模式切换
  S.modeT++;
  if(S.modeT>420){S.modeT=0;S.scatter=!S.scatter;}
  if(S.fright>0){S.fright--;if(S.fright===0){S.chain=0;for(const g of S.ghosts)g.fright=0;}}
  stepPlayer(S);
  if(S.ate){
    if(S.ate==='power'){
      S.fright=360;S.chain=0;
      for(const g of S.ghosts){g.fright=360;const r={up:'down',down:'up',left:'right',right:'left'};g.dir=r[g.dir];g.nx=undefined;}
      ev.push({t:'power'});
    }else ev.push({t:'dot'});
    S.ate=null;
  }
  for(const g of S.ghosts){if(g.fright>0)g.fright--;stepGhost(S,g);}
  // 碰撞
  for(const g of S.ghosts){
    const d=Math.hypot(g.px-S.player.px,g.py-S.player.py);
    if(d<0.7){
      if(g.fright>0){
        const pts=200*Math.pow(2,S.chain);S.chain++;
        g.x=9;g.y=7;g.px=9;g.py=7;g.nx=undefined;g.fright=0;
        ev.push({t:'eatGhost',pts});
      }else{ev.push({t:'hit'});S.dead=true;break;}
    }
  }
  if(S.dotsLeft<=0){S.won=true;ev.push({t:'win'});}
  return {events:ev};
}
if(typeof window!=='undefined')window.__PACMAN__={newState,tick,walkable,ghostChoose,MAZE,MW,MH};
// ============ 游戏状态 ============
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let S=null,score=0,lives=3,level=1;
let started=false,over=false,paused=false;
let particles=[],floaters=[],wakaT=0;

function startGame(){
  score=0;lives=3;level=1;
  document.getElementById('startOv').classList.add('hidden');
  document.getElementById('endOv').classList.add('hidden');
  document.getElementById('pauseOv').classList.add('hidden');
  started=true;over=false;paused=false;
  S=newState(1);particles=[];floaters=[];
  updateHUD();sfx.click();
}
function updateHUD(){
  document.getElementById('score').textContent=score;
  document.getElementById('lives').textContent='🟡'.repeat(Math.max(0,lives));
  document.getElementById('level').textContent='第'+level+'关';
}
function addScore(n,x,y){
  score+=n;
  if(x!==undefined)floaters.push({x:x*TS,y:y*TS,txt:'+'+n,life:1});
  updateHUD();
}
function resetPositions(){
  const p=S.player;p.x=9;p.y=9;p.px=9;p.py=9;p.nx=undefined;p.dir='left';p.want='left';
  const gs=[[9,7],[8,7],[10,7],[9,8]];
  S.ghosts.forEach((g,i)=>{g.x=gs[i][0];g.y=gs[i][1];g.px=g.x;g.py=g.y;g.nx=undefined;g.fright=0;});
  S.fright=0;S.dead=false;
}
function gameOver(win){
  over=true;
  if(score>getHS())setHS(score);
  if(win)sfx.win();else sfx.lose();
  setTimeout(()=>{
    document.getElementById('endEmoji').textContent=win?'🏆':'👻';
    document.getElementById('endTitle').textContent=win?'全部通关！':'游戏结束';
    document.getElementById('endScore').textContent='得分 '+score+' · 到达第 '+level+' 关';
    document.getElementById('endHs').textContent='历史最高分：'+getHS();
    document.getElementById('endOv').classList.remove('hidden');
  },600);
}
// ============ 主循环 ============
let mouth=0;
function frame(){
  if(started&&!paused&&!over&&S){
    const {events}=tick(S);
    for(const e of events){
      if(e.t==='dot'){addScore(10,S.player.x,S.player.y);if(++wakaT%2===0)sfx.waka();}
      else if(e.t==='power'){addScore(50,S.player.x,S.player.y);sfx.power();floaters.push({x:S.player.px*TS,y:S.player.py*TS-10,txt:'反杀时刻!',life:1.2});}
      else if(e.t==='eatGhost'){addScore(e.pts,S.player.x,S.player.y);sfx.eatGhost();}
      else if(e.t==='hit'){
        lives--;updateHUD();sfx.hit();
        for(let i=0;i<14;i++)particles.push({x:S.player.px*TS,y:S.player.py*TS,vx:(Math.random()-0.5)*4,vy:(Math.random()-0.5)*4-1,life:1,color:'#FFEB3B'});
        if(lives<=0){gameOver(false);}
        // 被抓：重置位置但保留豆子
        else{
          const dots=S.dots,left=S.dotsLeft;
          S=newState(level);S.dots=dots;S.dotsLeft=left;resetPositions();
        }
        break;
      }
      else if(e.t==='win'){
        score+=500;updateHUD();sfx.win();
        floaters.push({x:190,y:150,txt:'过关 +500',life:2});
        level++;
        setTimeout(()=>{if(!over){S=newState(level);updateHUD();}},1000);
        S.won=false;S.dotsLeft=1; // 防止重复触发
        break;
      }
    }
    if(score>getHS())setHS(score);
  }
  draw();
  requestAnimationFrame(frame);
}
// ============ 绘制 ============
function draw(){
  ctx.clearRect(0,0,380,300);
  // 墙
  ctx.fillStyle='#1a237e';
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
    if(MAZE[y][x]==='#'){
      ctx.fillRect(x*TS+1,y*TS+1,TS-2,TS-2);
      ctx.fillStyle='#283593';ctx.fillRect(x*TS+4,y*TS+4,TS-8,TS-8);ctx.fillStyle='#1a237e';
    }
  }
  if(!S)return;
  // 豆
  const bl=1+0.3*Math.sin(Date.now()/200);
  for(const k in S.dots){
    const [x,y]=k.split(',').map(Number);
    if(S.dots[k]==='o'){
      ctx.fillStyle='#FFEB3B';ctx.beginPath();ctx.arc(x*TS+TS/2,y*TS+TS/2,5*bl,0,7);ctx.fill();
    }else{
      ctx.fillStyle='#FFCA28';ctx.beginPath();ctx.arc(x*TS+TS/2,y*TS+TS/2,2.5,0,7);ctx.fill();
    }
  }
  // 鬼
  for(const g of S.ghosts){
    const x=g.px*TS+TS/2,y=g.py*TS+TS/2;
    const fr=g.fright>0;
    const col=fr?(S.fright<90&&((Date.now()/200)|0)%2?'#fff':'#3f51b5'):g.color;
    ctx.fillStyle=col;
    ctx.beginPath();ctx.arc(x,y-2,8,Math.PI,0);
    ctx.lineTo(x+8,y+7);
    for(let i=0;i<3;i++)ctx.lineTo(x+8-(i+0.5)*16/3,y+4),ctx.lineTo(x+8-(i+1)*16/3,y+7);
    ctx.lineTo(x-8,y+7);ctx.closePath();ctx.fill();
    // 眼睛
    const ex=DIRS[g.dir][0]*2,ey=DIRS[g.dir][1]*2;
    ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(x-3+ex,y-3+ey,2.6,0,7);ctx.arc(x+3+ex,y-3+ey,2.6,0,7);ctx.fill();
    ctx.fillStyle=fr?'#f00':'#1a237e';
    ctx.beginPath();ctx.arc(x-3+ex*1.6,y-3+ey*1.6,1.3,0,7);ctx.arc(x+3+ex*1.6,y-3+ey*1.6,1.3,0,7);ctx.fill();
  }
  // 玩家
  const p=S.player,x=p.px*TS+TS/2,y=p.py*TS+TS/2;
  mouth+=0.25;
  const ma=0.25*Math.abs(Math.sin(mouth));
  const base={up:-Math.PI/2,down:Math.PI/2,left:Math.PI,right:0}[p.dir];
  ctx.fillStyle='#FFEB3B';
  ctx.beginPath();ctx.moveTo(x,y);
  ctx.arc(x,y,9,base+ma,base+Math.PI*2-ma);ctx.closePath();ctx.fill();
  // 粒子
  for(const pt of particles){
    ctx.globalAlpha=Math.max(0,pt.life);ctx.fillStyle=pt.color;
    ctx.fillRect(pt.x-2,pt.y-2,4,4);
    pt.x+=pt.vx;pt.y+=pt.vy;pt.vy+=0.1;pt.life-=0.04;
  }
  ctx.globalAlpha=1;
  particles=particles.filter(pt=>pt.life>0);
  // 飘字
  ctx.font='bold 13px sans-serif';ctx.textAlign='center';
  for(const f of floaters){
    ctx.globalAlpha=Math.max(0,Math.min(1,f.life));ctx.fillStyle='#FFEB3B';
    ctx.fillText(f.txt,f.x,f.y);f.y-=0.7;f.life-=0.025;
  }
  ctx.globalAlpha=1;
  floaters=floaters.filter(f=>f.life>0);
}
// ============ 输入 ============
function setWant(d){if(S&&started&&!paused&&!over){S.player.want=d;sfx.click();}}
document.querySelectorAll('.dbtn').forEach(b=>{
  const d=b.dataset.d;
  const h=e=>{if(e.cancelable)e.preventDefault();setWant(d);};
  b.addEventListener('touchstart',h,{passive:false});
  b.addEventListener('mousedown',h);
});
let swX=0,swY=0;
cv.addEventListener('touchstart',e=>{const t=e.touches[0];swX=t.clientX;swY=t.clientY;},{passive:true});
cv.addEventListener('touchend',e=>{
  if(e.cancelable)e.preventDefault();
  const t=e.changedTouches[0],dx=t.clientX-swX,dy=t.clientY-swY;
  if(Math.hypot(dx,dy)<18)return;
  setWant(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'));
},{passive:false});
document.addEventListener('keydown',e=>{
  const m={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'};
  if(m[e.key]){e.preventDefault();setWant(m[e.key]);}
});
document.getElementById('startBtn').addEventListener('click',startGame);
document.getElementById('againBtn').addEventListener('click',startGame);
document.getElementById('pauseBtn').addEventListener('click',()=>{
  if(!started||over)return;paused=true;
  document.getElementById('pauseOv').classList.remove('hidden');sfx.click();
});
document.getElementById('resumeBtn').addEventListener('click',()=>{
  paused=false;document.getElementById('pauseOv').classList.add('hidden');sfx.click();
});
document.getElementById('sndBtn').addEventListener('click',function(){
  soundOn=!soundOn;this.textContent=soundOn?'🔊':'🔇';if(soundOn)sfx.click();
});
requestAnimationFrame(frame);
</script>
</body>
</html>
