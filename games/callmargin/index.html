<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{display:flex;justify-content:center;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.wrap{width:100%;max-width:480px;height:100%;padding:10px 12px 12px;display:flex;flex-direction:column;align-items:center;gap:8px}
.topbar{width:100%;display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
.topbar .tools{display:flex;gap:8px}
.topbar .tools .iconbtn{min-width:44px;min-height:44px}
#box{width:100%;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}

.hint{font-size:12px;text-align:center}

.overlay.hidden{display:none}
.overlay p{max-width:340px;font-size:14px;line-height:1.45}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:100%}
.lvgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;width:100%;max-width:360px}
.lvl{min-height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:15px;padding:3px!important;line-height:1.1}
.lvl small{font-size:10px;letter-spacing:-1px;margin-top:2px}
.lvl[disabled]{opacity:.45}
.shop{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:100%;max-width:360px}
.shop button{min-height:46px;font-size:12px!important;padding:3px!important;line-height:1.2}
.lvTag{font-size:12px;opacity:.85;max-width:360px}
#toast{position:fixed;left:50%;top:14%;transform:translate(-50%,-10px);background:rgba(10,8,30,.92);color:#fff;font-weight:800;padding:10px 18px;border-radius:999px;z-index:999;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;font-size:14px;box-shadow:0 0 18px rgba(255,207,51,.45);white-space:nowrap}
#tutPic{font-size:44px;line-height:1.1}
.hud{width:100%;display:flex;justify-content:space-between;gap:6px;font-size:12px;flex-wrap:wrap}
.panelbtns{display:flex;gap:8px;width:100%;justify-content:center;flex-wrap:wrap}
.panelbtns .btn{min-width:70px;min-height:48px;font-size:13px!important;padding:8px 10px!important}
.simtag{font-size:11px;opacity:.75}
#overStars{font-size:22px;letter-spacing:2px}
</style>
<!-- GAME UI BEGIN -->
<style>
:root{--page:#0b1626;--surface:#13243a;--soft:#1c3350;--ink:#eaf6ff;--muted:#9fb6cc;--accent:#4fc3f7;--on-accent:#05263a;--line:#2b4a6a;--stage:#081220;--page:#07111d;--surface:#102235;--soft:#213143;--ink:#eaf7ff;--muted:#8fb3c9;--accent:#1fd496;--on-accent:#074a34;--line:#2e7291;--b-bg1:#0f2438;--b-bg2:#07111d;--b-btn:#1fd496;--b-btn-hi:#50ddad;--b-edge:#0d875e;--b-glow:#56c8f5;--b-glow-rgb:86,200,245;--b-pedge-rgb:46,114,145;--b-btn-rgb:31,212,150;--b-bg2-rgb:7,17,29;--b-surf-rgb:16,34,53;--b-btn-ink:#074a34;--b-btn-tsh:0 1px 0 rgba(255,255,255,.35);--b-coin-ink:#074a34;--b-coin-tsh:none;--b-key-ink:#eaf7ff;--b-title:#ffffff;--b-hint-ink:#edf8ff}
/* Shared presentation only; mechanics and state remain inside each standalone game. */
html.game-ui{background:var(--page);color:var(--ink);color-scheme:light;font-family:"HarmonyOS Sans SC","MiSans","OPPOSans","PingFang SC","Microsoft YaHei UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}

.game-ui :is(.iconbtn,.iconBtn,.icobtn,.ibtn,.tbtn,.hbtn,.ib,.pause){min-width:44px;min-height:44px;flex-shrink:0;border-radius:12px;background:var(--soft);color:var(--ink);border:1px solid var(--line);box-shadow:none;font-size:16px}
.game-ui button{font-family:inherit;cursor:pointer;touch-action:manipulation}
.game-ui button:focus-visible,.game-ui [tabindex]:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
.game-ui :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn){background:var(--accent);color:var(--on-accent);border:1px solid transparent;border-radius:14px;min-height:48px;padding:12px 26px;font-size:16px;font-weight:800;letter-spacing:.2px;box-shadow:0 3px 0 var(--line);text-shadow:none;max-width:100%}
.game-ui :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn):active{box-shadow:none;transform:translateY(2px)}

.game-ui :is(.rowbtns,.btnrow,.ctlrow){gap:8px;flex-wrap:wrap;justify-content:center}

.game-ui :is(.dbtn,.cbtn,.gbtn,.holdbtn,.firebtn,.bombbtn,.jumpbtn,.pumpbtn,.nbtn){border-radius:12px;box-shadow:0 2px 0 var(--line);min-height:44px}
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv,.screen):has(>.ui-panel){padding:16px;overflow-y:auto;overscroll-behavior:contain}

.game-ui .ui-panel :is(h1,h2,.gamename,.gametitle){font-size:27px;line-height:1.25;font-weight:850;color:var(--ink);background:none;-webkit-text-fill-color:currentColor;text-shadow:none;letter-spacing:-.4px;margin:0}
.game-ui .ui-panel :is(p,.howto,.sub,.rule){font-size:13.5px;line-height:1.7;color:var(--muted);background:none;border:0;box-shadow:none;padding:0;margin:0;max-width:30em;text-align:center;white-space:normal}

.game-ui .ui-mode-status{display:block;padding:8px 14px;color:var(--ink);font-size:12.5px;font-weight:700;line-height:1.45;text-align:center;border:1px solid var(--line);border-radius:999px;background:var(--surface);margin:4px auto;max-width:min(360px,92vw);pointer-events:none;box-shadow:0 10px 26px rgba(0,0,0,.22)}
.game-ui body>.wrap>canvas:not(#fx){background-color:var(--stage);box-shadow:0 0 0 1px var(--line),0 12px 28px rgba(0,0,0,.14);border-radius:18px;flex-shrink:0}
.game-ui .screen>canvas.game{box-shadow:0 0 0 1px var(--line),0 12px 28px rgba(0,0,0,.14)}
.game-ui #hud{gap:6px;background:var(--surface);color:var(--ink)}
.game-ui #hud :is(.left,.t,.s,.grp,.pill){color:var(--ink)}
.game-ui #hud .pill{background:var(--surface);border-color:var(--line)}
.game-ui body canvas:is(#cv,#game,#board){background-color:var(--stage)}
.game-ui :is(button.dbtn,button.cbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.game-ui :is(button.lvl,button.lvlbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line);border-radius:12px;min-height:50px}
.game-ui :is(button.lvl,button.lvlbtn) :is(.nc,.sz,small){color:var(--muted)}
.game-ui .ui-panel button.lvl{margin:0;min-width:44px;box-shadow:none;padding:6px}
.game-ui #hud :is(.left,.right,.hudl,.hbtns){gap:5px;flex-wrap:wrap}
.game-ui #hud :is(.left,.hudl){min-width:0;flex-shrink:1}
.game-ui #hud :is(.pill,.left){font-size:12px}
.game-ui button:disabled{cursor:default;opacity:.42;box-shadow:none}
.game-ui .ui-panel .ui-assist-note{color:var(--accent);font-weight:700}
@media(min-width:700px){.game-ui body>.wrap{padding-top:24px}.game-ui .ui-panel{padding:32px 28px}}
@media(max-width:360px){.game-ui body>.wrap{padding:8px 10px;gap:8px}.game-ui .ui-panel{padding:20px 16px;gap:11px}.game-ui .ui-panel h1{font-size:24px}.game-ui .ui-emblem{width:68px;height:68px;font-size:36px;border-radius:20px}.game-ui :is(.topbar,#topbar){gap:5px;padding:6px 10px}.game-ui :is(.iconbtn,.icobtn,.ibtn,.tbtn,.ib){min-width:44px;min-height:44px}}
@media(max-height:650px){.game-ui .ui-panel{padding:16px 16px;gap:10px}.game-ui .ui-emblem{width:58px;height:58px;font-size:30px;border-radius:18px}.game-ui .ui-panel h1{font-size:23px}.game-ui .ui-panel :is(p,.howto,.sub,.rule){font-size:12.5px;line-height:1.55}}

/* 开局/结算遮罩铺满整屏，主按钮固定在面板底部，避免被画布尺寸裁切 */
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv):has(>.ui-panel){position:fixed;inset:0;z-index:1000;border-radius:0;padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom))}
.game-ui .ui-panel{touch-action:pan-y}
.game-ui .ui-panel :is(#startBtn,#btnStart,.startbtn,#bStart,#restartBtn,#btnRestart,#againBtn,#btnAgain,#retryBtn,#btnRetry,#playBtn,#btnPlay){position:sticky;bottom:0;z-index:3;flex-shrink:0}
.game-ui .ui-panel :not(.card,.panel,.pausecard,.ovcard,.ui-mode):has(>:is(#startBtn,#btnStart,.startbtn,#bStart,#restartBtn,#btnRestart,#againBtn,#btnAgain,#retryBtn,#btnRetry,#playBtn,#btnPlay)){position:sticky;bottom:0;z-index:3;flex-shrink:0;background:var(--surface);box-shadow:0 -10px 10px -6px var(--surface)}

html.game-ui[data-skin="b"] :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn,button.actBtn):not(.ghost):not(#\#){overflow:hidden;border:0;border-radius:16px;font-weight:850;color:var(--b-btn-ink);background:linear-gradient(180deg,var(--b-btn-hi),var(--b-btn) 58%);text-shadow:var(--b-btn-tsh);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.45),inset 0 -2px 0 rgba(0,0,0,.12),0 3px 0 var(--b-edge),0 12px 22px -6px rgba(var(--b-btn-rgb),.48);transition:transform .1s var(--ease),box-shadow .1s var(--ease),filter .15s}

html.game-ui[data-skin="b"] .ui-panel :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn,button.actBtn):not(.ghost):not(#\#){min-height:52px;padding:13px 32px;font-size:17px;letter-spacing:.6px;width:min(100%,260px)}

html.game-ui[data-skin="b"] :is(.ghost,.ghostbtn,.btn2,.abtn,.toolbtn,.iconbtn,.iconBtn,.icobtn,.ibtn,.tbtn,.hbtn,.ib,.pause,.dbtn,.cbtn,.nbtn,.lvl,.lvlbtn,.dpad button,.pad button){border:1px solid rgba(var(--b-pedge-rgb),.55);border-radius:14px;background:linear-gradient(180deg,#ffffff,var(--soft));color:var(--b-key-ink);font-weight:800;box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 2px 0 rgba(var(--b-pedge-rgb),.45),0 4px 10px rgba(15,25,40,.08);transition:transform .09s var(--ease),box-shadow .09s var(--ease)}

    var body = g.createLinearGradient(0, 0, 0, h);
    body.addColorStop(0, shade(color, .28));

    body.addColorStop(1, shade(color, -.24));

    rr(g, .6, .6, Math.max(0, w - 1.2), Math.max(0, h - 1.2), Math.max(0, r - .4));
    g.strokeStyle = 'rgba(255,255,255,.26)'; g.lineWidth = 1; g.stroke();

<body>
<div class="wrap">

<div class="overlay" id="startScr"><h1>🚨 追保强平营</h1><p>15 关：行情波动中盯维持保证金，追保或减仓避免强平。</p><p class="simtag">⚠ 模拟教学 · 非实盘交易</p><p id="bestLine"></p><button class="btn" id="startBtn">开始学习</button></div>
<div class="overlay hidden" id="lvlScr"><h2>选择关卡</h2><p id="lvlInfo"></p><div class="lvgrid" id="lvgrid"></div><p class="lvTag" id="lvlNote"></p><div class="shop" id="shop"></div><div class="rowbtns"><button class="btn ghost" id="howBtn">玩法教程</button><button class="btn ghost" id="homeBtn">返回</button><button class="iconbtn muteBtn" aria-label="音效">🔊</button></div></div>
<div class="overlay hidden" id="tutScr"><h2 id="tutH">教程</h2><div id="tutPic"></div><p id="tutP"></p><span id="tutStep"></span><div class="rowbtns"><button class="btn ghost" id="tutSkip">跳过</button><button class="btn" id="tutNext">下一步</button></div></div>
<div class="overlay hidden" id="pauseOv"><h2>⏸ 已暂停</h2><p id="pauseInfo"></p><div class="rowbtns"><button class="btn" id="resumeBtn">继续</button><button class="btn ghost" id="restartBtn">重新开始</button><button class="btn ghost" id="menuBtn">选择关卡</button><button class="iconbtn muteBtn" aria-label="音效">🔊</button></div></div>
<div class="overlay hidden" id="overScr"><h2 id="overH">过关</h2><div id="overStars"></div><div class="score" id="finalScore">0</div><p id="overText"></p><div class="rowbtns"><button class="btn" id="nextBtn">下一关</button><button class="btn ghost" id="againBtn">再来一次</button><button class="btn ghost" id="menu2Btn">选择关卡</button></div></div>
<div id="toast"></div>
<script>
'use strict';
const UI=window.GameUI||{pick:a=>a,storageGet:k=>localStorage.getItem(k),storageSet:(k,v)=>localStorage.setItem(k,v)};
const FX=UI.fx&&UI.fx.on?UI.fx:null;
const $=id=>document.getElementById(id);
function show(id,on){$(id).classList.toggle('hidden',!on);}
const Kit=(function(){
  const K={state:'menu',lv:0};let cfg,P,muted,ac=null,tutI=0,tutThen=null;
  function key(s){return 'g100_'+cfg.id+'_'+s;}
  function load(){try{P=JSON.parse(UI.storageGet(key('prog'))||'{}')||{};}catch(e){P={};}
    P.stars=P.stars||[];P.best=P.best||[];P.coins=P.coins|0;P.up=P.up||{};P.tut=!!P.tut;}
  function save(){try{UI.storageSet(key('prog'),JSON.stringify(P));}catch(e){}}
  K.save=save;K.prog=()=>P;K.up=k=>P.up[k]|0;
  K.totalStars=()=>P.stars.reduce((a,b)=>a+(b|0),0);
  K.hs=()=>{let m=0;for(const v of P.best)if((v|0)>m)m=v|0;return m;};
  K.sfx=function(kind){if(muted)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),g=ac.createGain(),now=ac.currentTime;
    const map={tap:[520,.06,'sine'],ok:[780,.1,'triangle'],win:[880,.22,'square'],bad:[180,.28,'sawtooth'],
      coin:[990,.08,'sine'],boss:[200,.4,'square'],lvl:[660,.12,'triangle']};
    const m=map[kind]||map.tap;o.type=m[2];o.frequency.value=m[0];
    g.gain.setValueAtTime(.14,now);g.gain.exponentialRampToValueAtTime(.001,now+m[1]);
    o.connect(g).connect(ac.destination);o.start();o.stop(now+m[1]);}catch(e){}};
  K.toast=function(msg,ms){const el=$('toast');if(!el)return;el.textContent=msg;el.style.opacity='1';el.style.transform='translate(-50%,0)';
    clearTimeout(K._tt);K._tt=setTimeout(()=>{el.style.opacity='0';el.style.transform='translate(-50%,-10px)';},ms||1200);};
  function stars(n){n=n|0;return '⭐'.repeat(n)+'☆'.repeat(Math.max(0,3-n));}
  K.isBoss=i=>(cfg.boss||[]).includes(i+1);
  K.unlocked=i=>i===0||(P.stars[i-1]|0)>0;
  K.menu=function(){K.state='menu';cfg.stop&&cfg.stop();
    ['startScr','tutScr','pauseOv','overScr'].forEach(x=>show(x,false));show('lvlScr',true);renderLevels();};
  function renderLevels(){
    const g=$('lvgrid');g.innerHTML='';
    for(let i=0;i<cfg.levels;i++){const b=document.createElement('button');b.className='lvl btn';const ok=K.unlocked(i);
      b.disabled=!ok;b.innerHTML=(ok?(K.isBoss(i)?'👑':'')+(i+1):'🔒')+'<small>'+(ok?stars(P.stars[i]|0):'&nbsp;')+'</small>';
      b.addEventListener('click',()=>{if(ok)go(i);});g.appendChild(b);}
    $('lvlInfo').textContent='⭐ '+K.totalStars()+'/'+cfg.levels*3+'   💰 '+P.coins+(K.hs()?'   🏆 '+K.hs():'');
    if($('lvlNote'))$('lvlNote').textContent=cfg.note?cfg.note():'模拟教学，非实盘';
    const shop=$('shop');if(shop&&cfg.ups){shop.innerHTML='';cfg.ups.forEach(u=>{
      const lv=K.up(u.k),max=u.max||3,cost=u.cost(lv);const need=u.stars&&K.totalStars()<u.stars;
      const b=document.createElement('button');b.className='btn ghost';
      b.textContent=u.ic+' '+u.name+' Lv'+lv+'/'+max+(lv>=max?' ✓':need?' 🔒⭐'+u.stars:' 💰'+cost);
      b.disabled=lv>=max||!!need;b.addEventListener('click',()=>{
        if(P.coins<cost){K.toast('💰 不够：通关赚金币');K.sfx('bad');return;}
        P.coins-=cost;P.up[u.k]=lv+1;save();K.sfx('coin');K.toast(u.ic+' '+u.name+' → '+(lv+1));renderLevels();});
      shop.appendChild(b);});}
  }
  function go(i){K.lv=i;K.state='play';['startScr','lvlScr','tutScr','pauseOv','overScr'].forEach(x=>show(x,false));
    K.sfx(K.isBoss(i)?'boss':'lvl');if(K.isBoss(i))setTimeout(()=>K.toast('👑 '+(cfg.bossName?cfg.bossName(i):'高压行情'),1600),40);
    cfg.start(i);}
  K.go=go;
  function tutShow(){const steps=cfg.tut||[];const s=steps[tutI]||['完成','可以开始了','✅'];
    $('tutH').textContent=s[0];$('tutP').textContent=s[1];$('tutPic').textContent=s[2]||'📘';$('tutStep').textContent=(tutI+1)+'/'+steps.length;}
  K.tutorial=function(then){tutI=0;tutThen=then;['startScr','lvlScr'].forEach(x=>show(x,false));tutShow();show('tutScr',true);};
  K.pause=function(){if(K.state!=='play')return;K.state='pause';cfg.pause&&cfg.pause();
    $('pauseInfo').textContent='第 '+(K.lv+1)+' 关'+(K.isBoss(K.lv)?' · 首领关':'');show('pauseOv',true);};
  K.resume=function(){if(K.state!=='pause')return;K.state='play';show('pauseOv',false);cfg.resume&&cfg.resume();};
  K.win=function(score,st,text){if(K.state!=='play')return;K.state='over';const i=K.lv;
    const old=P.stars[i]|0;P.stars[i]=Math.max(old,st|1);P.best[i]=Math.max(P.best[i]|0,score|0);
    const gain=(st|1)*4+(old?0:6)+(K.isBoss(i)?8:0);P.coins+=gain;save();
    $('overH').textContent=K.isBoss(i)?'👑 击败首领！':'🎉 过关！';$('overStars').textContent=stars(st);
    $('finalScore').textContent=score|0;$('overText').innerHTML=(text||'')+'<br>💰 +'+gain+'　本关最佳 '+(P.best[i]|0);
    const hasNext=i+1<cfg.levels;$('nextBtn').classList.toggle('hidden',!hasNext);
    if(hasNext)$('nextBtn').textContent=K.isBoss(i+1)?'👑 挑战首领':'下一关';
    show('overScr',true);K.sfx('win');cfg.stop&&cfg.stop();};
  K.lose=function(score,text){if(K.state!=='play')return;K.state='over';const gain=2;P.coins+=gain;save();
    $('overH').textContent='💥 挑战失败';$('overStars').textContent='☆☆☆';$('finalScore').textContent=score|0;
    $('overText').innerHTML=(text||'')+'<br>安慰金 💰 +'+gain+'　升级后再战';
    $('nextBtn').classList.add('hidden');show('overScr',true);K.sfx('bad');cfg.stop&&cfg.stop();};
  K.init=function(c){cfg=c;load();muted=UI.storageGet(key('mute'))==='1';
    document.querySelectorAll('.muteBtn').forEach(b=>{b.textContent=muted?'🔇':'🔊';
      b.onclick=()=>{muted=!muted;UI.storageSet(key('mute'),muted?'1':'0');
        document.querySelectorAll('.muteBtn').forEach(x=>x.textContent=muted?'🔇':'🔊');};});
    $('startBtn').onclick=()=>{K.sfx('tap');if(!P.tut)K.tutorial(()=>{P.tut=1;save();K.menu();});else K.menu();};
    $('howBtn').onclick=()=>K.tutorial(K.menu);
    $('tutNext').onclick=()=>{tutI++;if(tutI>=(cfg.tut||[]).length){show('tutScr',false);P.tut=1;save();(tutThen||K.menu)();}else tutShow();};
    $('tutSkip').onclick=()=>{show('tutScr',false);P.tut=1;save();(tutThen||K.menu)();};
    $('homeBtn').onclick=()=>{show('lvlScr',false);show('startScr',true);K.state='menu';};
    $('pauseBtn').onclick=()=>K.state==='play'?K.pause():K.resume();
    $('resumeBtn').onclick=K.resume;$('restartBtn').onclick=()=>go(K.lv);
    $('menuBtn').onclick=K.menu;$('menu2Btn').onclick=K.menu;$('againBtn').onclick=()=>go(K.lv);
    $('nextBtn').onclick=()=>go(Math.min(cfg.levels-1,K.lv+1));
    document.addEventListener('visibilitychange',()=>{if(document.hidden)K.pause();});
    const bl=$('bestLine');if(bl)bl.textContent=P.stars.length?('进度 ⭐'+K.totalStars()+'/'+cfg.levels*3+(K.hs()?' · 🏆 '+K.hs():'')):'首次游玩会有简短教程';
    window.__T=window.__T||{};window.__T.kit=K;window.__T.go=n=>go(Math.max(0,(n|0)-1));
    window.__T.win=()=>K.win(999,3,'测试通关');window.__T.lose=()=>K.lose(0,'测试失败');
    window.__T.state=()=>({state:K.state,lv:K.lv+1});};
  return K;
})();

const W=360,H=480,cv=$('cv'),ctx=cv.getContext('2d');
if(FX)FX.hidpi(cv,ctx,W,H);else{cv.width=W;cv.height=H;}
function layout(){const b=$('box').getBoundingClientRect();const s=Math.min(b.width/W,b.height/H);cv.style.width=Math.floor(W*s)+'px';cv.style.height=Math.floor(H*s)+'px';}
addEventListener('resize',layout);layout();
function stage(){if(FX)FX.stage(ctx,W,H,'#0f3256','#03101f');else{ctx.fillStyle='#03101f';ctx.fillRect(0,0,W,H);}}

let running=false,raf=0,ended=false,last=0,equity=0,mm=0,price=100,side=1,notional=0,bars=0,maxBars=0,calls=0,survived=0;
const LV=[];
for(let i=0;i<15;i++){const boss=[4,9,14].includes(i);LV.push({bars:12+i+(boss?4:0),mmr:0.07+i*0.003+(boss?0.025:0),vol:0.015+i*0.0025+(boss?0.02:0),notional:8000+i*1500,boss,name:boss?(i===4?'跳空追保':i===9?'连环强平':'黑色强平夜'):''});}
function fmt(n,d=0){return(n||0).toFixed(d);}
function updHud(){$('hud').innerHTML='<span>权益 <b style="color:'+(equity>mm?'#33e1a0':'#ff8a80')+'">'+fmt(equity,0)+'</b></span><span>维持 <b>'+fmt(mm,0)+'</b></span><span>价 <b>'+fmt(price,2)+'</b></span><span>K <b>'+bars+'/'+maxBars+'</b></span>';}
function setActs(){$('acts').innerHTML='<button class="btn" id="add">追加保证金</button><button class="btn ghost" id="cut">减仓一半</button>';
  $('add').onclick=()=>{if(ended)return;const add=notional*0.08*(1+0.15*Kit.up('pocket'));equity+=add;calls++;Kit.sfx('coin');Kit.toast('追保 +'+fmt(add,0));updHud();};
  $('cut').onclick=()=>{if(ended)return;notional*=0.5;mm=notional*LV[Kit.lv].mmr;equity=Math.max(equity,mm*1.05);Kit.sfx('ok');Kit.toast('减仓，维持线下降');updHud();};}
function tick(){if(ended)return;const L=LV[Kit.lv];bars++;
  let shock=(Math.random()*2-1)*L.vol;if(L.boss&&bars>maxBars*0.4&&bars<maxBars*0.75)shock+=-side*L.vol*1.6;
  price=Math.max(20,price*(1+shock));const pnl=(price-100)/100*side*notional;equity=equity0+pnl;
  if(equity<=mm){lose('强制平仓：权益 ≤ 维持保证金');return;}
  if(equity<mm*1.15)Kit.toast('⚠ 追保预警');
  survived++;updHud();draw();
  if(bars>=maxBars){if(equity>mm*1.2)win();else lose('收盘权益过于接近维持线');}}
let equity0=0;
function win(){if(ended)return;ended=true;running=false;const score=Math.max(0,Math.round(equity/8+survived*10-calls*5));let st=1;if(calls<=2)st=2;if(calls<=1&&equity>equity0)st=3;
  Kit.win(score,st,'追保 '+calls+' 次 · 期末权益 '+fmt(equity,0)+'<br>知识点：权益跌破维持保证金触发强平；追保或减仓可降风险。');}
function lose(m){if(ended)return;ended=true;running=false;Kit.lose(Math.round(equity/15),m);}
function draw(){stage();
  ctx.fillStyle='rgba(255,255,255,.05)';ctx.fillRect(20,28,W-40,90);
  const ratio=equity/Math.max(1,mm);ctx.fillStyle=ratio>1.3?'#33e1a0':ratio>1.05?'#ffcf33':'#ff6b8a';
  ctx.fillRect(28,50,Math.max(4,Math.min(W-56,(W-56)*(equity/(equity0*1.5)))),22);
  ctx.fillStyle='#eaf6ff';ctx.font='12px sans-serif';ctx.fillText('权益 / 维持保证金',28,44);
  ctx.fillText('维持线 '+fmt(mm,0)+'　预警区 < '+fmt(mm*1.15,0),28,95);
  // candle stub
  ctx.fillStyle='rgba(15,39,66,.9)';ctx.fillRect(20,140,W-40,200);
  ctx.fillStyle='#9fb6cc';ctx.fillText((side>0?'多头':'空头')+' 名义 '+fmt(notional,0),28,170);
  ctx.fillText('价格 '+fmt(price,2)+'　浮动盈亏 '+fmt(equity-equity0,0),28,198);
  ctx.fillStyle='#4fc3f7';ctx.fillText('动作：追加保证金 或 减仓降低维持线',28,240);
  ctx.fillStyle='#ffcf33';ctx.fillText(LV[Kit.lv].boss?'👑 '+LV[Kit.lv].name:'撑过全部K线且权益安全',28,280);
  ctx.fillStyle='#eaf6ff';ctx.fillText('知识点：维持保证金 ≈ 名义×维持率',28,320);}
function loop(t){if(!running||Kit.state!=='play')return;const dt=Math.min(.05,(t-last)/1000);last=t;loop._a=(loop._a||0)+dt;
  if(loop._a>=0.7*(1-0.1*Kit.up('read'))){loop._a=0;tick();}draw();raf=requestAnimationFrame(loop);}
function start(i){const L=LV[i];ended=false;running=true;bars=0;maxBars=L.bars;price=100;side=1;notional=L.notional;mm=notional*L.mmr;
  equity0=notional/5;equity=equity0;calls=0;survived=0;loop._a=0;setActs();updHud();
  $('hint').textContent='盯紧权益与维持线；预警时追保或减仓。';last=performance.now();raf=requestAnimationFrame(loop);draw();}
function stop(){running=false;cancelAnimationFrame(raf);ended=true;}
Kit.init({id:'callmargin',levels:15,boss:[5,10,15],bossName:i=>LV[i].name||'高压',
  start,stop,pause:()=>{running=false;},resume:()=>{if(!ended){running=true;last=performance.now();raf=requestAnimationFrame(loop);}},
  note:()=>'模拟教学 · 非实盘：追保与强制平仓',
  tut:[['维持保证金','持仓期间权益不得低于维持线。','🚨'],['追保','追加资金抬高权益缓冲。','➕'],['减仓','降低名义本金，维持线随之下降。','📉'],['强平','触及维持线会被强制平仓。','💥']],
  ups:[{k:'pocket',ic:'💵',name:'追保袋',max:2,cost:l=>28+l*24},{k:'read',ic:'🔎',name:'慢行情',max:2,cost:l=>26+l*22}]});

</script>
</body>
