<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{display:flex;justify-content:center;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.wrap{width:100%;max-width:480px;height:100%;padding:12px;display:flex;flex-direction:column;align-items:center;gap:10px}

.rowbtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:100%}
#tutStep{font-size:12px;opacity:.7}

.hidden{display:none!important}
.btn.ghost.on,.btn.ghost[aria-pressed="true"]{outline:3px solid #ff3d9a!important;outline-offset:-3px;filter:brightness(1.08)}
.rowbtns .iconbtn{flex:0 0 auto!important;min-width:48px!important;min-height:48px!important}

.ctl{width:100%;display:flex;gap:6px;min-height:50px}
.ctl button{flex:1;min-height:50px;min-width:44px;font-size:14px;padding:2px!important;line-height:1.1}
.ctl button small{display:block;font-size:10px}
</style>

<style>

.game-ui .ui-panel{width:min(100%,380px);max-height:100%;overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:18px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:24px;padding:30px 24px;box-shadow:0 8px 0 var(--soft),0 20px 48px #15253618;text-align:center;margin:auto}

.game-ui body>.wrap>canvas:not(#fx){background-color:var(--stage);box-shadow:0 0 0 1px var(--line),0 6px 0 var(--soft);border-radius:18px;flex-shrink:0}

.game-ui #hud{gap:6px;background:var(--surface);color:var(--ink)}
.game-ui #hud :is(.left,.t,.s,.grp,.pill){color:var(--ink)}
.game-ui #hud .pill{background:var(--surface);border-color:var(--line)}
.game-ui body canvas:is(#cv,#game,#board){background-color:var(--stage)}
.game-ui :is(button.dbtn,button.cbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.game-ui :is(button.lvl,button.lvlbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line);border-radius:12px;min-height:54px}
.game-ui :is(button.lvl,button.lvlbtn) :is(.nc,.sz,small){color:var(--muted)}

.game-ui #hud :is(.left,.right,.hudl,.hbtns){gap:5px;flex-wrap:wrap}

.game-ui .ui-panel .ui-assist-note{color:var(--accent);font-weight:700}

@media(max-width:360px){.game-ui body>.wrap{padding:10px;gap:10px}.game-ui .ui-panel{padding:22px 18px;gap:13px}.game-ui .ui-panel h1{font-size:26px}.game-ui .ui-emblem{width:70px;height:70px;font-size:38px}.game-ui :is(.topbar,#topbar){gap:5px;padding:8px}.game-ui :is(.iconbtn,.icobtn,.ibtn,.tbtn,.ib){min-width:44px;min-height:44px}}
@media(max-height:650px){.game-ui .ui-panel{padding:18px;gap:12px}.game-ui .ui-emblem{width:60px;height:60px;font-size:32px}.game-ui .ui-panel h1{font-size:25px}.game-ui .ui-panel :is(p,.howto,.sub,.rule){font-size:13px}}

/* 2026-10-20 热修：开局/结算遮罩铺满整屏，主按钮固定在面板底部，避免被画布尺寸裁切（#10） */
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv):has(>.ui-panel){position:fixed;inset:0;z-index:1000;border-radius:0;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}

    burst: function (list, x, y, color, n) {

    },
    drawBurst: function (ctx, list) {
      for (var i = list.length - 1; i >= 0; i--) {
        var p = list[i]; p.x += p.vx; p.y += p.vy; p.vy += .12; p.life -= .035;

<script>

// 新手引导：pages=[[标题,说明],...]，看完后回调

// ---- 通用：关卡菜单 / 星数 / 平面兜底画法 ----

 LV.forEach((l,i)=>{const b=document.createElement('button');b.className='lvl';const open=isOpen?isOpen(i):(i===0||(sv.stars[i-1]||0)>0||(sv.stars[i]||0)>0);b.disabled=!open;b.innerHTML=(open?(l.boss?'👑':i+1):'🔒')+'<small>'+(open?starStr(sv.stars[i]||0):'')+'</small>';b.onclick=()=>{tone(660,.08,'triangle');pick(i);};gr.appendChild(b);});

const W=360,H=560;const cv=$('cv'),ctx=cv.getContext('2d');

const fit=()=>fitCanvas(cv,$('box'),W,H);addEventListener('resize',fit);
const N=8,CS=42,BX=12,BY=58;
const DIRS=[[0,-1],[1,0],[0,1],[-1,0]];
const MISS=['海滨小镇','工业区','河湾','👑 巨甲来袭','山谷要塞','水坝','双城','👑 母巢之心','荒漠电站','冰原','最后防线','👑 虫族主宰'];
const LV=MISS.map((n,i)=>({i,n,boss:i===3?'titan':i===7?'hive':i===11?'lord':'',turns:i<2?4:5,start:Math.min(5,2+Math.floor(i/3)),spawn:1+(i>=2?1:0)+(i>=8?1:0),build:7+Math.floor(i/3),water:i>=2?2+(i%3)*2:0,mount:3+(i%3),kills:3+Math.floor(i/2)}));
const MECH={punch:{n:'重拳机甲',e:'🥊',c:'#ff5a5a',hp:3,mv:3,w:'重拳：相邻一格，2 伤害并推开'},cannon:{n:'加农机甲',e:'🔫',c:'#3d9bff',hp:3,mv:3,w:'加农炮：直线命中第一个目标，1 伤害并推开'},arty:{n:'火炮机甲',e:'🚀',c:'#ffc233',hp:2,mv:3,w:'火炮：距离≥2 的直线格，1 伤害，并把四周推开'}};
const FOE={beetle:{n:'甲虫',e:'🪲',hp:2,mv:3,a:'melee',d:1},spitter:{n:'喷射虫',e:'🦂',hp:2,mv:2,a:'proj',d:1},mortar:{n:'炮甲虫',e:'🐛',hp:2,mv:2,a:'arty',d:1},brute:{n:'重甲虫',e:'🦗',hp:4,mv:2,a:'melee',d:2},
 titan:{n:'巨甲虫',e:'👾',hp:6,mv:2,a:'line2',d:2,boss:1},hive:{n:'母巢女王',e:'🕷️',hp:7,mv:1,a:'proj',d:2,boss:1,brood:1},lord:{n:'虫族主宰',e:'🐉',hp:9,mv:2,a:'artyp',d:2,boss:1}};
let save=Store.get('save',{stars:[],tut:0});

let G=null,li=0,state='menu',FAST=false,sel=-1,pend=null,anims=[],sparks=[],shake=0,resetSnap=null,BOT=false,msg='';

function tile(x,y){return G.t[y][x];}
function free(x,y){return inb(x,y)&&(tile(x,y)==='g'||tile(x,y)==='r')&&!uAt(x,y);}
function startLevel(i){li=i;const L=LV[i];const P=perk();G={t:[...Array(N)].map(()=>Array(N).fill('g')),mh:{},u:[],turn:1,turns:L.turns,power:6+P.grid,maxP:6+P.grid,kills:0,bLost:0,seed:9001+i*7919,spawns:[],resetLeft:1,log:[]};
 for(let k=0;k<L.build;k++){for(let g=0;g<50;g++){const x=Math.floor(rnd()*N),y=3+Math.floor(rnd()*5);if(tile(x,y)==='g'){G.t[y][x]='b';break;}}}
 for(let k=0;k<L.mount;k++){for(let g=0;g<50;g++){const x=Math.floor(rnd()*N),y=1+Math.floor(rnd()*6);if(tile(x,y)==='g'){G.t[y][x]='m';G.mh[x+','+y]=2;break;}}}
 for(let k=0;k<L.water;k++){for(let g=0;g<50;g++){const x=Math.floor(rnd()*N),y=1+Math.floor(rnd()*6);if(tile(x,y)==='g'){G.t[y][x]='w';break;}}}
 ['punch','cannon','arty'].forEach((k,j)=>{for(let g=0;g<200;g++){const x=1+j*3+Math.floor(rnd()*2)-(j===2?1:0),y=4+Math.floor(rnd()*3);if(free(x,y)){G.u.push({id:G.u.length,team:'m',k,x,y,hp:MECH[k].hp+P.hp,max:MECH[k].hp+P.hp,mv:MECH[k].mv+P.mv,moved:false,acted:false});break;}}});
 const pool=['beetle','beetle','spitter'];if(i>=2)pool.push('mortar');if(i>=4)pool.push('brute','spitter');if(i>=8)pool.push('brute','mortar');G.pool=pool;
 if(L.boss)addFoe(L.boss,true);for(let k=0;k<L.start-(L.boss?1:0);k++)addFoe(pool[Math.floor(rnd()*pool.length)],true);
 planSpawns();enemyPlan();state='play';sel=-1;pend=null;resetSnap=snap();['lvlScr','overScr','pauseOv','tutScr','startScr'].forEach(x=>show(x,false));hud();
 toast(L.n+' · 坚守 '+L.turns+' 回合'+(L.boss?' · 首领出没！':''),2200);tone(330,.15,'sawtooth',.08,660);}
function addFoe(k,top,x0,y0){for(let g=0;g<200;g++){const x=x0!=null?x0:Math.floor(rnd()*N),y=y0!=null?y0:Math.floor(rnd()*3);if(free(x,y)){const f=FOE[k];G.u.push({id:G.u.length,team:'e',k,x,y,hp:f.hp,max:f.hp,boss:!!f.boss,tele:null});return true;}if(x0!=null)return false;}return false;}

// ---------- 伤害与推动 ----------
function fx(x,y,col,n){if(!FAST)for(let k=0;k<(n||8);k++)burst(sparks,BX+x*CS+CS/2,BY+y*CS+CS/2,col,2);}
function dmgAt(x,y,n,src){if(!inb(x,y)||n<=0)return;const u=uAt(x,y);if(u){u.hp-=n;fx(x,y,'#ff7a3d',10);if(u.hp<=0){u.hp=0;u.dead=true;if(u.team==='e'){G.kills++;fx(x,y,'#7dff5a',18);}else{G.log.push('mech');}if(!FAST)tone(u.team==='e'?200:120,.25,'sawtooth',.1,60);}else if(!FAST)noise(.08,.1);return;}
 const t=tile(x,y);if(t==='b'){if(src==='smart')return;G.t[y][x]='r';G.power=Math.max(0,G.power-1);G.bLost++;fx(x,y,'#ffd23f',16);shake=.6;if(!FAST){tone(150,.3,'square',.1,70);noise(.25,.15);}}
 else if(t==='m'){const k=x+','+y;G.mh[k]=(G.mh[k]||2)-1;fx(x,y,'#b08a5a',8);if(G.mh[k]<=0)G.t[y][x]='g';}}

 anims.push({u:u.id,fx:u.x,fy:u.y,t:0});u.x=nx;u.y=ny;if(t==='w'&&u.team==='e'){u.dead=true;u.hp=0;G.kills++;fx(nx,ny,'#5ac8ff',16);if(!FAST)tone(300,.3,'sine',.1,80);}}
function ray(x,y,d){let cx=x,cy=y;for(;;){cx+=DIRS[d][0];cy+=DIRS[d][1];if(!inb(cx,cy))return[cx-DIRS[d][0],cy-DIRS[d][1],true];if(uAt(cx,cy)||tile(cx,cy)==='b'||tile(cx,cy)==='m')return[cx,cy,false];}}
// ---------- 机甲 ----------
function reach(u){const out=new Map();out.set(u.x+','+u.y,0);const q=[[u.x,u.y,0]];while(q.length){const[x,y,s]=q.shift();if(s>=u.mv)continue;for(const[dx,dy]of DIRS){const nx=x+dx,ny=y+dy,k=nx+','+ny;if(out.has(k)||!free(nx,ny))continue;out.set(k,s+1);q.push([nx,ny,s+1]);}}return out;}
function targets(u){const out=[];for(let d=0;d<4;d++){if(u.k==='punch'){const x=u.x+DIRS[d][0],y=u.y+DIRS[d][1];if(inb(x,y))out.push([x,y,d]);}
  else if(u.k==='cannon'){const r=ray(u.x,u.y,d);if(!(r[0]===u.x&&r[1]===u.y))out.push([r[0],r[1],d]);}
  else for(let s=2;s<N;s++){const x=u.x+DIRS[d][0]*s,y=u.y+DIRS[d][1]*s;if(!inb(x,y))break;out.push([x,y,d]);}}return out;}
function mechAttack(u,x,y,d){const P=perk();if(u.k==='punch'){dmgAt(x,y,P.punch);push(x,y,d);if(!FAST)tone(180,.12,'square',.12,90);}
 else if(u.k==='cannon'){const r=ray(u.x,u.y,d);if(!r[2]){dmgAt(r[0],r[1],1);push(r[0],r[1],d);}if(!FAST)tone(520,.12,'sawtooth',.08,200);}
 else{dmgAt(x,y,1,P.smart?'smart':null);for(let k=0;k<4;k++)push(x+DIRS[k][0],y+DIRS[k][1],k);if(!FAST){tone(700,.2,'triangle',.08,150);noise(.15,.1);}}
 u.acted=true;u.moved=true;}
// ---------- 敌人 ----------
function foeTargets(u){const f=FOE[u.k];const res=[];for(let d=0;d<4;d++){if(f.a==='arty'||f.a==='artyp'){for(let s=2;s<=4;s++)res.push({d,s});}else res.push({d,s:1});}return res;}
function hitTiles(u,tl){const f=FOE[u.k];const[dx,dy]=DIRS[tl.d];if(f.a==='melee')return[[u.x+dx,u.y+dy]];if(f.a==='line2')return[[u.x+dx,u.y+dy],[u.x+2*dx,u.y+2*dy]];if(f.a==='proj'){const r=ray(u.x,u.y,tl.d);return r[2]?[]:[[r[0],r[1]]];}return[[u.x+dx*tl.s,u.y+dy*tl.s]];}
function scoreTile(x,y,self){if(!inb(x,y))return -1;const v=uAt(x,y);if(v&&v!==self)return v.team==='m'?7:-6;const t=tile(x,y);return t==='b'?10:t==='m'?-.5:-1;}
function enemyPlan(){for(const u of G.u){if(u.dead||u.team!=='e')continue;const f=FOE[u.k];const R=reach({x:u.x,y:u.y,mv:f.mv});let best=null,bs=-1e9;const ox=u.x,oy=u.y;
  for(const k of R.keys()){const[x,y]=k.split(',').map(Number);u.x=x;u.y=y;for(const tl of foeTargets(u)){let s=0;for(const[hx,hy]of hitTiles(u,tl))s+=scoreTile(hx,hy,u);s+=rnd()*.9-R.get(k)*.02;if(f.brood)s+=0;if(s>bs){bs=s;best=[x,y,tl];}}}
  u.x=ox;u.y=oy;if(best){if(best[0]!==u.x||best[1]!==u.y)anims.push({u:u.id,fx:u.x,fy:u.y,t:0});u.x=best[0];u.y=best[1];u.tele=best[2];}}}
function enemyResolve(){for(const u of G.u){if(u.dead||u.team!=='e'||!u.tele)continue;const f=FOE[u.k];const tl=u.tele;const tiles=hitTiles(u,tl);
  for(const[x,y]of tiles){dmgAt(x,y,f.d);if(f.a==='artyp')for(let k=0;k<4;k++)push(x+DIRS[k][0],y+DIRS[k][1],k);}
  if(f.brood){for(const[dx,dy]of DIRS)if(addFoe('beetle',false,u.x+dx,u.y+dy))break;}u.tele=null;}}
function endTurn(){if(state!=='play')return;sel=-1;pend=null;enemyResolve();
 if(G.power<=0||G.u.filter(u=>u.team==='m'&&!u.dead).length===0){lose();return;}
 if(G.turn>=G.turns){win();return;}
 for(const s of G.spawns){const b=uAt(s[0],s[1]);if(b){dmgAt(s[0],s[1],1);continue;}addFoe(s[2],false,s[0],s[1]);}
 G.turn++;planSpawns();enemyPlan();for(const u of G.u)if(u.team==='m'){u.moved=false;u.acted=false;u.ux=null;}
 resetSnap=snap();if(!FAST){tone(440,.1,'triangle');toast('第 '+G.turn+' 回合 · 注意红色警示',1200);}hud();}

 tone(523,.12,'triangle');tone(784,.12,'triangle',.1,null,.12);tone(1047,.25,'triangle',.1,null,.24);for(let i=0;i<30;i++)burst(sparks,W/2,BY+CS*4,['#ffd23f','#3dffb0','#3d9bff'][i%3],2);
 const go=()=>{$('overH').textContent='🛡 '+L.n+' 守住了！';$('finalScore').textContent=starStr(st);$('overText').innerHTML='电网 '+G.power+'/'+G.maxP+' · 建筑损失 '+G.bLost+' · 击杀 '+G.kills+'（目标 '+L.kills+'）<br>★ 坚守 · ★ 建筑损失≤1 · ★ 击杀达标'+(li===11?'<br>🎉 虫族主宰已被击退，城市安全了！':'');$('nextBtn').classList.toggle('hidden',li>=11);show('overScr',true);};FAST?go():setTimeout(go,800);}

function draw(dt){for(const a of anims)a.t+=dt*7;anims=anims.filter(a=>a.t<1);
 stage(ctx,W,H,'#1c3550','#0c1424');ctx.save();if(shake>0){ctx.translate((Math.random()-.5)*8*shake,(Math.random()-.5)*8*shake);shake=Math.max(0,shake-dt*2);}

 for(let y=0;y<N;y++)for(let x=0;x<N;x++){const t=tile(x,y);const px=BX+x*CS,py=BY+y*CS;
  if(t==='w'){ctx.fillStyle='#1f5fa8';rr(ctx,px+1,py+1,CS-2,CS-2,6);ctx.fill();ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=2;ctx.beginPath();for(let k=0;k<2;k++){const yy=py+14+k*12+Math.sin(performance.now()/500+x)*2;ctx.moveTo(px+8,yy);ctx.quadraticCurveTo(px+CS/2,yy-5,px+CS-8,yy);}ctx.stroke();}
  else box3d(ctx,px+1,py+1,CS-2,CS-2,(x+y)%2?TC.g:'#679a77',6);
  if(t==='r')emo(ctx,'🧱',px+CS/2,py+CS/2,18);
  if(t==='b'){ctx.fillStyle='#55507a';rr(ctx,px+5,py+12,CS-10,CS-10,4);ctx.fill();box3d(ctx,px+5,py+4,CS-10,CS-14,'#d9d2ff',5);ctx.fillStyle='#ffd23f';for(let k=0;k<3;k++)for(let j=0;j<2;j++)ctx.fillRect(px+10+k*8,py+9+j*9,4,5);}
  if(t==='m'){ball3d(ctx,px+CS/2,py+CS/2+2,15,'#9a734d');emo(ctx,'⛰️',px+CS/2,py+CS/2,22);if((G.mh[x+','+y]||2)<2){ctx.strokeStyle='#000';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(px+14,py+12);ctx.lineTo(px+22,py+24);ctx.lineTo(px+18,py+32);ctx.stroke();}}
  if(R&&R.has(x+','+y)&&!(x===m.x&&y===m.y)){ctx.fillStyle='rgba(61,155,255,.35)';rr(ctx,px+3,py+3,CS-6,CS-6,6);ctx.fill();}}
 for(const s of G.spawns){const px=BX+s[0]*CS,py=BY+s[1]*CS;ctx.strokeStyle='#c45cff';ctx.lineWidth=3;ctx.setLineDash([4,3]);ctx.beginPath();ctx.arc(px+CS/2,py+CS/2,CS*.36,0,7);ctx.stroke();ctx.setLineDash([]);emo(ctx,'🕳️',px+CS/2,py+CS/2,16);}
 // 敌方警示
 let ord=1;for(const u of G.u){if(u.dead||u.team!=='e'||!u.tele)continue;const tiles=hitTiles(u,u.tele);const[ux,uy]=upos(u);for(const[hx,hy]of tiles){if(!inb(hx,hy))continue;const px=BX+hx*CS,py=BY+hy*CS;const a=.3+.15*Math.sin(performance.now()/200);ctx.fillStyle='rgba(255,40,60,'+a+')';rr(ctx,px+2,py+2,CS-4,CS-4,6);ctx.fill();
   ctx.strokeStyle='rgba(255,80,90,.9)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(BX+ux*CS+CS/2,BY+uy*CS+CS/2);ctx.lineTo(px+CS/2,py+CS/2);ctx.stroke();otxt(ctx,String(ord),px+CS-9,py+9,11,'#ffd23f');}ord++;}
 // 机甲攻击目标
 for(const t of TG){if(m&&!m.moved&&R&&R.has(t[0]+','+t[1]))continue;const px=BX+t[0]*CS,py=BY+t[1]*CS;ctx.strokeStyle=pend&&pend[0]===t[0]&&pend[1]===t[1]?'#ffd23f':'rgba(255,170,60,.9)';ctx.lineWidth=pend&&pend[0]===t[0]&&pend[1]===t[1]?4:2;rr(ctx,px+4,py+4,CS-8,CS-8,6);ctx.stroke();}
 if(pend&&m){const px=BX+pend[0]*CS+CS/2,py=BY+pend[1]*CS+CS/2;emo(ctx,'🎯',px,py,20);}
 // 单位
 for(const u of G.u){if(u.dead)continue;const[ux,uy]=upos(u);const px=BX+ux*CS+CS/2,py=BY+uy*CS+CS/2;const isM=u.team==='m';const r=u.boss?18:15;
  shad(ctx,px,py+r*.8,r,r*.35,.45);if(isM&&u.id===sel)glowOn(ctx,'#3dffb0',16);ball3d(ctx,px,py-3,r,isM?(u.acted?'#777':MECH[u.k].c):u.boss?'#c43dff':'#7a3d2a');glowOff(ctx);
  emo(ctx,isM?MECH[u.k].e:FOE[u.k].e,px,py-3,u.boss?22:17);
  for(let k=0;k<u.max;k++){ctx.fillStyle=k<u.hp?(isM?'#3dffb0':'#ff5a5a'):'rgba(0,0,0,.5)';ctx.fillRect(px-u.max*3.5+k*7,py+r-2,6,4);}}
 drawBurst(ctx,sparks);ctx.restore();
 // 信息面板

 const alive=G.u.filter(u=>u.team==='e'&&!u.dead).length;

 // 测试机器人：对每台机甲枚举(移动, 目标)，模拟敌方结算后打分
 botTurn(level){const Fsave=FAST;FAST=true;
  const metric=()=>({p:G.power,k:G.kills,mh:G.u.filter(u=>u.team==='m'&&!u.dead).reduce((a,u)=>a+u.hp,0),eh:G.u.filter(u=>u.team==='e'&&!u.dead).reduce((a,u)=>a+u.hp,0)});
  for(const mi of G.u.filter(u=>u.team==='m').map(u=>u.id)){const m=G.u[mi];if(m.dead||m.acted)continue;const base=snap();const b0=metric();let best=null,bv=-1e9;
   const evalNow=()=>{const s=snap();enemyResolve();const e=metric();G=JSON.parse(s);return (e.p-b0.p)*12+(e.mh-b0.mh)*3+(e.k-b0.k)*4-(e.eh-b0.eh)*-1;};
   const R=[...reach(m).keys()];for(const k of R){const[x,y]=k.split(',').map(Number);G=JSON.parse(base);const mm=G.u[mi];mm.x=x;mm.y=y;
    const v0=evalNow();if(v0>bv){bv=v0;best=[x,y,null];}
    if(level>0)for(const t of targets(mm)){const s2=snap();mechAttack(mm,t[0],t[1],t[2]);const v=evalNow()+(level>1?0:(Math.random()*6));if(v>bv){bv=v;best=[x,y,t];}G=JSON.parse(s2);}}
   G=JSON.parse(base);const mm=G.u[mi];mm.x=best[0];mm.y=best[1];mm.moved=true;if(best[2])mechAttack(mm,best[2][0],best[2][1],best[2][2]);if(G.power<=0)break;}
  FAST=Fsave;checkMid();}};
