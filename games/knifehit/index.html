<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}

.shop{display:flex;flex-direction:column;gap:8px;width:100%;max-width:320px}

.ctrlbar{width:100%;display:flex;gap:10px}
.ctrlbar .btn{flex:1;min-height:52px;font-size:18px}
</style>

<style>

.game-ui body canvas:is(#cv,#game,#board){background-color:var(--stage)}
.game-ui :is(button.dbtn,button.cbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line)}

@media(max-width:360px){.game-ui body>.wrap{padding:10px;gap:10px}.game-ui .ui-panel{padding:22px 18px;gap:13px}.game-ui .ui-panel h1{font-size:26px}.game-ui .ui-emblem{width:70px;height:70px;font-size:38px}.game-ui :is(.topbar,#topbar){gap:5px;padding:8px}.game-ui :is(.iconbtn,.icobtn,.ibtn,.tbtn,.ib){min-width:40px;min-height:44px}}

      }), 0, 0, w, h);
    },
    // Glow is shadowBlur: cheap for a handful of shapes, never use it on every tile.
    glow: function (ctx, color, blur) { ctx.shadowColor = color; ctx.shadowBlur = blur; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0; },
    noGlow: function (ctx) { ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; },
    // Crisp rendering on high-DPI phones without changing game coordinates.
    // Only safe where input code converts with getBoundingClientRect + logical W/H, not cv.width.
    hidpi: function (cv, ctx, w, h) {
      var d = Math.max(1, Math.min(2.5, window.devicePixelRatio || 1));
      cv.width = Math.round(w * d); cv.height = Math.round(h * d); // intrinsic ratio stays w:h, so CSS sizing is unchanged
      ctx.setTransform(d, 0, 0, d, 0, 0); return d;
    },
    // Lightweight particle bursts (pooled array, no allocations per frame beyond the burst).
    burst: function (list, x, y, color, n) {
      for (var i = 0; i < (n || 12); i++) { var a = Math.random() * 6.283, v = 1 + Math.random() * 2.6; list.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 1, life: 1, c: color, r: 1.5 + Math.random() * 2.5 }); }
    },
    drawBurst: function (ctx, list) {
      for (var i = list.length - 1; i >= 0; i--) {
        var p = list[i]; p.x += p.vx; p.y += p.vy; p.vy += .12; p.life -= .035;
        if (p.life <= 0) { list.splice(i, 1); continue; }
        ctx.globalAlpha = p.life; ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (skin === 'b' ? 1.2 : 1), 0, 7); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
  };
  window.GameUI.fx = fx;
}());

</script>
<!-- GAME UI END -->
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <span class="title">🔪 飞刀入木</span>
    <span class="stat" id="statLine">—</span>
    <span class="tools">
      <button class="iconbtn" id="muteBtn" aria-label="音效">🔊</button>
      <button class="iconbtn" id="pauseBtn" aria-label="暂停">⏸</button>
    </span>
  </div>
  <div class="stagebox"><canvas id="cv"></canvas></div>
  <p class="hint" id="hint">点屏幕掷刀插入木桩</p>
  
</div>
<div class="overlay" id="startScr"><h1>🔪 飞刀入木</h1><p>把握时机把飞刀插满旋转木桩。<br>40 关递进，每 5 关 Boss 桩。<br>收集苹果解锁刀皮肤。</p><p id="bestLine"></p><button class="btn" id="startBtn">开始游戏</button></div>
<div class="overlay hidden" id="lvlScr"><h2>选择关卡</h2><p id="lvlInfo"></p><div class="lvgrid" id="lvgrid"></div><div class="rowbtns"><button class="btn ghost" id="shopBtn">成长商店</button><button class="btn ghost" id="backStart">返回</button></div></div>
<div class="overlay hidden" id="shopScr"><h2>成长商店</h2><p id="coinLine"></p><div class="shop" id="shopList"></div><button class="btn" id="shopBack">返回选关</button></div>
<div class="overlay hidden" id="tutScr"><h2 id="tutH"></h2><p id="tutP"></p><span id="tutStep"></span><div class="rowbtns"><button class="btn ghost" id="tutSkip">跳过</button><button class="btn" id="tutNext">下一步</button></div></div>
<div class="overlay hidden" id="pauseOv"><h2>⏸ 已暂停</h2><div class="rowbtns"><button class="btn" id="resumeBtn">继续</button><button class="btn ghost" id="menuBtn">选关</button></div></div>
<div class="overlay hidden" id="overScr"><h2 id="overH">过关！</h2><div class="score" id="finalScore">★★★</div><p id="overText"></p><div class="rowbtns"><button class="btn" id="nextBtn">下一关</button><button class="btn ghost" id="againBtn">再玩一次</button><button class="btn ghost" id="menu2Btn">选关</button></div></div>
<div id="toast"></div>
<script>
'use strict';

const $=id=>document.getElementById(id);
const W=360,H=540;
const cv=$('cv'),ctx=cv.getContext('2d');
const UI=window.GameUI||{pick:a=>a,storageGet:k=>localStorage.getItem(k),storageSet:(k,v)=>localStorage.setItem(k,v)};
const FX=UI.fx&&UI.fx.on?UI.fx:null;
if(FX)FX.hidpi(cv,ctx,W,H);else{cv.width=W;cv.height=H;}
function show(id,on){$(id).classList.toggle('hidden',!on);}
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('on'),1200);}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function posOf(e){const r=cv.getBoundingClientRect();const t=(e.touches&&e.touches[0])||(e.changedTouches&&e.changedTouches[0])||e;return{x:(t.clientX-r.left)*W/r.width,y:(t.clientY-r.top)*H/r.height};}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function tutorial(pages,done){let i=0;function render(){$('tutH').textContent=pages[i][0];$('tutP').innerHTML=pages[i][1];$('tutStep').textContent=(i+1)+' / '+pages.length;$('tutNext').textContent=i<pages.length-1?'下一步':'开始挑战';}
  show('tutScr',true);render();
  $('tutNext').onclick=()=>{if(i<pages.length-1){i++;render();}else{show('tutScr',false);done();}};
  $('tutSkip').onclick=()=>{show('tutScr',false);done();};
}

const PK='g100_knifehit_prog', MK='g100_knifehit_mute';
let muted=UI.storageGet(MK)==='1',ac=null; $('muteBtn').textContent=muted?'🔇':'🔊';
function beep(f,d,type){if(muted)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(.14,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d);}catch(e){}}
$('muteBtn').onclick=()=>{muted=!muted;UI.storageSet(MK,muted?'1':'0');$('muteBtn').textContent=muted?'🔇':'🔊';};
function loadProg(){try{return JSON.parse(UI.storageGet(PK)||'{}')}catch(e){return{}}}
function saveProg(p){UI.storageSet(PK,JSON.stringify(p));}
let prog=loadProg(); if(!prog.stars)prog.stars={}; if(prog.coins==null)prog.coins=0; if(prog.unlock==null)prog.unlock=1; if(prog.skin==null)prog.skin=0; if(prog.reviveLv==null)prog.reviveLv=0; if(!prog.seenTut)prog.seenTut=0;
const TOTAL=40; const SKINS=['#E8ECF0','#FFB21E','#5B8CFF','#FF5C8A','#3FC163'];
$('bestLine').textContent='解锁 '+prog.unlock+'/'+TOTAL+' · 币 '+prog.coins;

let state='menu', lvl=1, angle=0, spd=1.2, knives=[], need=5, left=5, apples=[], spikes=[], boss=false, shattered=false, last=0, sparks=[], dir=1, pulseT=0, usedRevive=false;

function spec(n){
  const boss=n%5===0;
  const need=Math.min(12,4+Math.floor(n/3)+(boss?2:0));
  let spd=1.0+n*0.05; if(boss) spd*=1.25;
  const mode=boss?(n%15===0?'pulse':n%10===0?'reverse':'fast'): (n>=8&&n%4===0?'reverse':n>=15&&n%3===0?'pulse':'normal');
  const spikes=Math.min(6, Math.floor(n/6)+(boss?2:0));
  const apples=1+Math.floor(n/10);
  return{need,spd,mode,spikes,apples,boss};
}
function startLevel(n){
  lvl=n; const sp=spec(n); boss=sp.boss; need=sp.need; left=need; knives=[]; apples=[]; spikes=[]; shattered=false; usedRevive=false;
  angle=0; spd=sp.spd; dir=1; pulseT=0;
  const rnd=mulberry32(n*1337);
  for(let i=0;i<sp.spikes;i++) spikes.push(rnd()*Math.PI*2);
  for(let i=0;i<sp.apples;i++) apples.push({a:rnd()*Math.PI*2, hit:false});
  // pre-stuck starter knives on higher levels
  const pre=Math.min(3, Math.floor(n/8));
  for(let i=0;i<pre;i++) knives.push(rnd()*Math.PI*2);
  state='play'; last=performance.now();
  show('startScr',false);show('lvlScr',false);show('shopScr',false);show('tutScr',false);show('pauseOv',false);show('overScr',false);
  $('statLine').textContent=`关 ${n} · 刀 ${left}`; $('hint').textContent=boss?'👑 Boss 桩：转速怪异，点屏幕掷刀':'点屏幕任意处掷刀 · 避开已插的刀与刺';
  beep(660,.1); game._sp=sp;
}
const game={_sp:null};

function throwKnife(){
  if(state!=='play'||left<=0||shattered) return;
  // Knife from screen bottom → log-local π - angle (angle+π double-counts and sticks crooked)
  const hitAng = ((Math.PI - angle) % (Math.PI*2) + Math.PI*2) % (Math.PI*2);
  const tol=0.18; // generous
  for(const k of knives){ let d=Math.abs(((k-hitAng+Math.PI*3)%(Math.PI*2))-Math.PI); if(d<tol) return fail(); }
  for(const s of spikes){ let d=Math.abs(((s-hitAng+Math.PI*3)%(Math.PI*2))-Math.PI); if(d<tol) return fail(); }
  for(const a of apples){ if(a.hit) continue; let d=Math.abs(((a.a-hitAng+Math.PI*3)%(Math.PI*2))-Math.PI); if(d<0.22){ a.hit=true; prog.coins+=3; saveProg(prog); beep(1200,.08); toast('🍎 +3'); } }
  knives.push(hitAng); left--; beep(500,.06);
  $('statLine').textContent=`关 ${lvl} · 刀 ${left}`;
  if(left<=0) win();
}
function fail(){
  if(!usedRevive && prog.reviveLv>0){ usedRevive=true; toast('复活！'); beep(800,.15); return; }
  if(!usedRevive && prog.coins>=20){ /* offer not auto */ }
  state='over'; $('overH').textContent='撞刀了'; $('finalScore').textContent='关 '+lvl;
  $('overText').textContent='再试一次，把握空隙'; show('overScr',true); $('nextBtn').style.display='none'; beep(160,.35,'sawtooth');
}
function win(){
  shattered=true; state='over';
  const st=left===0 && knives.length>=need ? (boss?3: (spec(lvl).spikes?2:3)) : 2;
  const stars=boss?3: (apples.every(a=>a.hit)?3:2);
  const prev=prog.stars[lvl]|0; if(stars>prev) prog.stars[lvl]=stars;
  const gain=12+stars*6+(boss?25:0); prog.coins+=gain;
  if(lvl>=prog.unlock && lvl<TOTAL) prog.unlock=lvl+1;
  saveProg(prog);
  $('overH').textContent=boss?'Boss 木桩劈开！':'木桩劈开！';
  $('finalScore').textContent='★'.repeat(stars)+'☆'.repeat(3-stars);
  $('overText').textContent=`+${gain} 币 · 总币 ${prog.coins}`; $('nextBtn').style.display=''; show('overScr',true);
  beep(900,.15); if(FX) for(let i=0;i<20;i++) FX.burst(sparks,W/2,H*0.38,'#FFB21E',3);
}

cv.addEventListener('pointerdown',e=>{e.preventDefault(); if(state==='play') throwKnife();});

function update(dt){
  if(state!=='play') return;
  const sp=game._sp||spec(lvl);
  if(sp.mode==='reverse'){ pulseT+=dt; if(pulseT>1.2){ dir*=-1; pulseT=0; } }
  if(sp.mode==='pulse'){ spd = sp.spd * (0.6+0.8*Math.abs(Math.sin(pulseT+=dt))); }
  else spd=sp.spd;
  angle += dir*spd*dt;
}

function draw(){
  if(FX) FX.stage(ctx,W,H,'#ffcf6b','#c45c26'); else {ctx.fillStyle='#c45c26';ctx.fillRect(0,0,W,H);}
  const cx=W/2, cy=H*0.38, R=78;
  ctx.save(); ctx.translate(cx,cy); ctx.rotate(angle);
  // log
  if(FX){ FX.glow(ctx,'#8B4513',12); ctx.fillStyle='#A0522D'; ctx.beginPath(); ctx.arc(0,0,R,0,7); ctx.fill(); FX.noGlow(ctx); }
  else { ctx.fillStyle='#A0522D'; ctx.beginPath(); ctx.arc(0,0,R,0,7); ctx.fill(); }
  ctx.strokeStyle='#5D2E0C'; ctx.lineWidth=4; ctx.beginPath(); ctx.arc(0,0,R,0,7); ctx.stroke();
  // rings
  ctx.strokeStyle='rgba(0,0,0,.2)'; for(let i=1;i<4;i++){ ctx.beginPath(); ctx.arc(0,0,R*i/4,0,7); ctx.stroke(); }
  // spikes
  for(const s of spikes){ ctx.save(); ctx.rotate(s); ctx.fillStyle='#222'; ctx.beginPath(); ctx.moveTo(0,-R+4); ctx.lineTo(-8,-R-16); ctx.lineTo(8,-R-16); ctx.fill(); ctx.restore(); }
  // apples
  for(const a of apples){ if(a.hit) continue; ctx.save(); ctx.rotate(a.a); ctx.font='22px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('🍎',0,-R-6); ctx.restore(); }
  // stuck knives
  const col=SKINS[prog.skin%SKINS.length];
  for(const k of knives){ ctx.save(); ctx.rotate(k); ctx.fillStyle=col; ctx.fillRect(-4, -R-44, 8, 48); ctx.beginPath(); ctx.moveTo(0,-R+12); ctx.lineTo(-6,-R); ctx.lineTo(6,-R); ctx.fill(); ctx.restore(); }
  ctx.restore();
  // next knife at bottom
  if(state==='play'&&left>0){ ctx.fillStyle=col; ctx.fillRect(cx-4, H-110, 8, 50); ctx.beginPath(); ctx.moveTo(cx,H-120); ctx.lineTo(cx-7,H-108); ctx.lineTo(cx+7,H-108); ctx.fill();
    ctx.fillStyle='#fff'; ctx.font='bold 16px sans-serif'; ctx.textAlign='center'; ctx.fillText('×'+left, cx, H-50); }
  if(boss){ ctx.fillStyle='#FFE08A'; ctx.font='bold 14px sans-serif'; ctx.textAlign='center'; ctx.fillText('👑 Boss', cx, 24); }
  if(FX) FX.drawBurst(ctx,sparks);
}
function frame(t){ const dt=Math.min(.05,(t-last)/1000); last=t; update(dt); draw(); requestAnimationFrame(frame); }
requestAnimationFrame(frame);

function openLevels(){
  show('startScr',false);show('shopScr',false);show('overScr',false);show('lvlScr',true);
  $('lvlInfo').textContent=`解锁 ${prog.unlock}/${TOTAL} · 币 ${prog.coins}`;
  const g=$('lvgrid'); g.innerHTML='';
  for(let i=1;i<=TOTAL;i++){ const b=document.createElement('button'); b.className='btn lvl'; const locked=i>prog.unlock; const st=prog.stars[i]|0;
    b.innerHTML=locked?'🔒':`${i%5===0?'👑':''}${i}<small>${'★'.repeat(st)}</small>`; b.disabled=locked;
    if(!locked) b.onclick=()=>enter(i); g.appendChild(b); }
}
function enter(n){ const go=()=>startLevel(n); if(!prog.seenTut){ prog.seenTut=1; saveProg(prog); tutorial([['飞刀入木','点屏幕任意处，把飞刀掷向旋转木桩。'],['小心','撞上已插的刀或木刺会失败；插满指定数量即劈开过关。'],['Boss','每 5 关 Boss 桩转速会反转或脉冲；苹果可收集换刀皮。']],go);} else go(); }
function openShop(){ show('lvlScr',false);show('shopScr',true); $('coinLine').textContent='金币：'+prog.coins;
  const items=[{k:'skin',name:'刀皮肤',desc:'外观 '+(prog.skin+1)+'/'+SKINS.length,cost:15,max:SKINS.length-1,special:'skin'},{k:'reviveLv',name:'复活',desc:'每关可免撞 1 次（'+(prog.reviveLv?'已拥有':'未拥有')+'）',cost:50,max:1}];
  const box=$('shopList'); box.innerHTML='';
  for(const it of items){ const row=document.createElement('div'); row.className='row'; row.innerHTML=`<div><b>${it.name}</b><br><small>${it.desc}</small></div>`;
    const btn=document.createElement('button'); btn.className='btn'; const maxed=it.k==='skin'?prog.skin>=it.max:prog[it.k]>=it.max;
    btn.textContent=maxed?'满':' '+it.cost+'币'; btn.disabled=maxed||prog.coins<it.cost;
    btn.onclick=()=>{prog.coins-=it.cost; if(it.k==='skin')prog.skin++; else prog[it.k]++; saveProg(prog);beep(900,.1);openShop();}; row.appendChild(btn); box.appendChild(row); }
}
$('startBtn').onclick=openLevels; $('backStart').onclick=()=>{show('lvlScr',false);show('startScr',true);};
$('shopBtn').onclick=openShop; $('shopBack').onclick=openLevels;
$('pauseBtn').onclick=()=>{if(state==='play'){state='pause';show('pauseOv',true);}else if(state==='pause'){state='play';last=performance.now();show('pauseOv',false);}};
$('resumeBtn').onclick=()=>{state='play';last=performance.now();show('pauseOv',false);};
$('menuBtn').onclick=()=>{show('pauseOv',false);state='menu';openLevels();};
$('againBtn').onclick=()=>startLevel(lvl);
$('nextBtn').onclick=()=>{if(lvl<TOTAL)startLevel(lvl+1);else openLevels();};
$('menu2Btn').onclick=()=>{show('overScr',false);openLevels();};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play'){state='pause';show('pauseOv',true);}});

</script>
</body></html>
