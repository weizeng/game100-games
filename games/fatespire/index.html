<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{display:flex;justify-content:center;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.wrap{width:100%;max-width:480px;height:100%;padding:12px;display:flex;flex-direction:column;align-items:center;gap:10px}
.topbar{width:100%;display:flex;justify-content:space-between;align-items:center;flex-wrap:nowrap!important}
.topbar .stat{display:flex;gap:8px;align-items:center;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:13px}
.topbar .tools{display:flex;gap:6px}
.topbar .tools .iconbtn{min-width:44px;min-height:44px;padding:0 6px}
.stagebox{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
#cv{touch-action:none;display:block}
.overlay{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;z-index:20;padding:24px;text-align:center}
.overlay.hidden{display:none}
.lvgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:100%}
.lvgrid .lvl{min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:17px;padding:4px!important;line-height:1.1}
.lvgrid .lvl small{font-size:10px;letter-spacing:-1px;margin-top:2px}
.rowbtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:100%}
#tutStep{font-size:12px;opacity:.7}
#toast{position:fixed;left:50%;top:16%;transform:translate(-50%,-10px);background:rgba(10,8,30,.88);color:#fff;font-weight:800;padding:10px 18px;border-radius:999px;z-index:999;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;font-size:15px;box-shadow:0 0 18px rgba(255,61,154,.5);white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}

.stagebox{flex:1 1 auto;max-height:46svh}
.pbar{width:100%;display:flex;align-items:center;gap:8px;color:#fff;font-weight:800;font-size:13px}
.energy{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-size:20px;font-weight:900;color:#3b1d00;background:radial-gradient(circle at 35% 30%,#fff6c4,#ffcf33 45%,#d97a00);box-shadow:0 0 0 3px #fff,0 0 18px #ffb21e,0 4px 0 #8a4d00;flex-shrink:0}
.hpwrap{flex:1;min-width:0}
.hpbar{height:14px;border-radius:999px;background:rgba(0,0,0,.45);overflow:hidden;box-shadow:0 0 0 2px rgba(255,255,255,.35)}
.hpbar i{display:block;height:100%;background:linear-gradient(90deg,#ff3d6e,#ff8a5c);transition:width .25s}
.hpline{display:flex;justify-content:space-between;margin-bottom:3px;gap:6px}
.sts{display:flex;gap:4px;flex-wrap:wrap;font-size:12px}
.sts span{background:rgba(0,0,0,.35);border-radius:999px;padding:1px 6px}
.hand{width:100%;height:132px;position:relative;flex-shrink:0}
.card{position:absolute;bottom:4px;width:76px;height:118px;border-radius:12px;padding:5px 5px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;transition:transform .15s,bottom .15s;
 background:linear-gradient(180deg,#fff,#ece3ff);color:#2a1650;box-shadow:inset 0 0 0 2px #fff,0 4px 0 #5a3d8a,0 8px 14px rgba(0,0,0,.4);border:0;font-family:inherit}
.card.atk{background:linear-gradient(180deg,#fff1f1,#ffc9d2)}.card.skl{background:linear-gradient(180deg,#eef7ff,#c4e1ff)}.card.pow{background:linear-gradient(180deg,#fff9e6,#ffe38a)}
.card .cost{position:absolute;left:-6px;top:-6px;width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6c4,#ffb21e 60%,#c46a00);color:#3b1d00;font-weight:900;font-size:14px;display:grid;place-items:center;box-shadow:0 0 0 2px #fff}
.card .nm{font-size:12px;font-weight:900;line-height:1.1;margin-top:3px;white-space:nowrap}
.card .art{font-size:24px;line-height:1.1}
.card .tx{font-size:10px;line-height:1.25;font-weight:700;text-align:center;color:#3d2a5c}
.card.up .nm{color:#0b8a4a}
.card.sel{bottom:22px!important;box-shadow:inset 0 0 0 2px #fff,0 0 0 3px #ffcf33,0 0 22px #ffcf33}
.card.no{filter:grayscale(.6) brightness(.85)}
.btmrow{width:100%;display:flex;gap:8px;align-items:center}
.btmrow .pile{font-size:12px;color:#fff;font-weight:800;min-width:56px;text-align:center}
.btmrow #endBtn{flex:1;min-height:50px}
.choices{display:flex;flex-direction:column;gap:10px;width:100%}
.choices .btn,.choices .ghost{width:100%;min-height:56px;display:flex;align-items:center;gap:10px;justify-content:flex-start;text-align:left;padding:8px 14px!important;font-size:16px}
.choices small{display:block;font-size:11px;opacity:.8;font-weight:700}
.cardrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;width:100%}
.cardrow .card{position:relative;bottom:0}
.prog{display:flex;gap:3px;justify-content:center;flex-wrap:wrap}
.prog i{width:14px;height:8px;border-radius:4px;background:rgba(255,255,255,.2)}
.prog i.d{background:#ffcf33}.prog i.c{background:#ff3d9a;box-shadow:0 0 8px #ff3d9a}
.relics{font-size:18px;letter-spacing:2px;min-height:22px}
.dlist{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-height:44svh;overflow:auto}
.dlist .card{position:relative;bottom:0;transform:scale(.9)}
.price{font-size:12px;font-weight:900;color:#ffe066;text-align:center}
.hidden2{display:none!important}
</style>
<!-- GAME UI BEGIN -->
<style>
:root{--page:#1a1030;--surface:#261a44;--soft:#33245a;--ink:#f4eeff;--muted:#bcaedb;--accent:#c79bff;--on-accent:#1f0f3a;--line:#4a3a78;--stage:#120a24;--page:#0d0620;--surface:#22113f;--soft:#34244e;--ink:#f6eeff;--muted:#c9b6e6;--accent:#b26bff;--on-accent:#0b0620;--line:#b26bff;--b-bg1:#4a1a7a;--b-bg2:#0d0620;--b-btn:#b26bff;--b-btn-hi:#cd9fff;--b-edge:#5a22a8;--b-glow:#ff8af0;--b-glow-rgb:255,138,240;--b-pedge-rgb:178,107,255;--b-btn-ink:#32135c;--b-btn-tsh:0 1px 0 rgba(255,255,255,.45);--b-coin-ink:#32135c;--b-coin-tsh:none;--b-key-ink:#ff8af0;--b-title:#ffffff}
/* Shared presentation only; mechanics and state remain inside each standalone game. */
html.game-ui{background:var(--page);color:var(--ink);color-scheme:light;font-family:"Bahnschrift","Microsoft YaHei UI","PingFang SC",sans-serif}
html.game-ui:is([data-theme="space"],[data-theme="arcade"],[data-theme="lab"],[data-theme="ocean"],[data-theme="magic"]){color-scheme:dark}
.game-ui body{background:var(--page);color:var(--ink);font-family:inherit;overscroll-behavior:none}
.game-ui body>.wrap{padding:20px 16px max(20px,env(safe-area-inset-bottom));gap:14px;max-width:500px}
.game-ui #app{background:var(--page);color:var(--ink)}
.game-ui :is(.topbar,#topbar){gap:8px;flex-wrap:wrap;min-height:58px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:10px 12px;box-shadow:0 3px 0 var(--soft);font-size:13px}
.game-ui :is(.title,.tb-title,.tb-title,#topbar .t,.topbar .t){color:var(--ink);font-size:16px;font-weight:750;letter-spacing:0}
.game-ui :is(.topbar,.hud,#hud,#topbar) :is(b,.v){color:var(--accent);font-variant-numeric:tabular-nums}
.game-ui :is(.stat,.topbar .s,.topbar .stat,.scorebar,.stats,.tip,.hint,.hintline,.hsline,.best,.hiscore){color:var(--muted);line-height:1.7}
.game-ui :is(.hint,.hintline,.tip){font-size:12px;max-width:40em;text-wrap:pretty}
.game-ui .scorebar{padding:6px 10px;gap:8px;flex-wrap:wrap}
.game-ui :is(.iconbtn,.iconBtn,.icobtn,.ibtn,.tbtn,.hbtn,.ib,.iconBtn,.pause){min-width:44px;min-height:44px;flex-shrink:0;border-radius:12px;background:var(--soft);color:var(--ink);border:1px solid var(--line);box-shadow:none;font-size:17px}
.game-ui button{font-family:inherit;cursor:pointer;touch-action:manipulation}
.game-ui button:focus-visible,.game-ui [tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.game-ui :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn){background:var(--accent);color:var(--on-accent);border:1px solid transparent;border-radius:13px;min-height:50px;padding:13px 28px;font-size:16px;font-weight:750;letter-spacing:0;box-shadow:0 4px 0 var(--line);text-shadow:none;max-width:100%}
.game-ui :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn):active{box-shadow:none;transform:translateY(2px)}
.game-ui :is(.ghost,.ghostbtn,.btn2,.abtn,.toolbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line);box-shadow:none;border-radius:12px;min-height:44px}
.game-ui :is(.rowbtns,.btnrow,.ctlrow){gap:10px;flex-wrap:wrap;justify-content:center}
.game-ui :is(.pill,.hudbox,.hud .p){background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:none;font-variant-numeric:tabular-nums}
.game-ui :is(.dbtn,.cbtn,.gbtn,.holdbtn,.firebtn,.bombbtn,.jumpbtn,.pumpbtn,.nbtn){border-radius:12px;box-shadow:0 3px 0 var(--line);min-height:44px}
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv,.screen):has(>.ui-panel){padding:20px;overflow-y:auto;overscroll-behavior:contain}
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv):has(>.ui-panel){background:var(--page);backdrop-filter:none;justify-content:safe center;align-items:center}
.game-ui .ui-panel{width:min(100%,380px);max-height:100%;overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:18px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:24px;padding:30px 24px;box-shadow:0 8px 0 var(--soft),0 20px 48px #15253618;text-align:center;margin:auto}
.game-ui .ui-panel :is(.card,.panel,.pausecard,.ovcard){display:contents}
.game-ui .ui-panel :is(h1,h2,.gamename,.gametitle){font-size:30px;line-height:1.25;font-weight:800;color:var(--ink);background:none;-webkit-text-fill-color:currentColor;text-shadow:none;letter-spacing:-.6px;margin:0}
.game-ui .ui-panel :is(p,.howto,.sub,.rule){font-size:14px;line-height:1.85;color:var(--muted);background:none;border:0;box-shadow:none;padding:0;margin:0;max-width:32em;text-align:left;white-space:normal}
.game-ui .ui-panel :is(.bigemoji,.bigemoji,.ic,.big):not(.bigscore){animation:none;filter:none;text-shadow:none}
.game-ui .ui-emblem{width:90px;height:90px;display:grid;place-items:center;border:1px solid var(--line);border-radius:28px;background:var(--soft);font-size:48px;line-height:1;flex-shrink:0;position:relative}
.game-ui[data-theme="wood"] .ui-emblem{border-radius:50%;box-shadow:inset 0 0 0 5px var(--surface),inset 0 0 0 6px var(--line)}
.game-ui[data-theme="wood"] .ui-panel h1{font-family:"STKaiti","KaiTi","Microsoft YaHei",serif;letter-spacing:2px}
.game-ui[data-theme="ice"] .ui-emblem{border-radius:26px 8px 26px 8px}
.game-ui[data-theme="space"] .ui-emblem{background:radial-gradient(circle at center,var(--soft) 42%,transparent 43%),var(--surface);border-radius:50%;outline:1px solid var(--line);outline-offset:7px;margin:7px}
.game-ui[data-theme="kitchen"] .ui-emblem{border-radius:22px;border-bottom:5px solid var(--line)}
.game-ui .ui-panel :is(.score,.bigscore,.bigScore,.scorebig){color:var(--accent);font-size:48px;font-weight:800;font-variant-numeric:tabular-nums}
.game-ui .ui-panel :is(.best,.hsline,.hiscore,.endstats,.endstats b){color:var(--muted);font-size:13px;line-height:1.8}
.game-ui .ui-mode{display:grid;grid-template-columns:1fr 1fr;gap:5px;background:var(--soft);padding:5px;border:1px solid var(--line);border-radius:14px;width:100%}
.game-ui .ui-mode button{min-height:44px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-size:14px;font-weight:700;box-shadow:none}
.game-ui .ui-mode button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 2px 5px #1525361a}
.game-ui .ui-panel .ui-mode-note{font-size:12px;line-height:1.6;text-align:center;color:var(--muted)}
.game-ui .ui-mode-status{display:block;padding:5px 10px;color:var(--accent);font-size:11px;font-weight:700;line-height:1.5;text-align:center;border:1px solid var(--line);border-radius:8px;background:var(--surface);margin:4px auto;max-width:100%;pointer-events:none}
.game-ui body>.wrap>canvas:not(#fx){background-color:var(--stage);box-shadow:0 0 0 1px var(--line),0 6px 0 var(--soft);border-radius:18px;flex-shrink:0}
.game-ui .screen>canvas.game{box-shadow:0 0 0 1px var(--line),0 6px 0 var(--soft)}
.game-ui #hud{gap:6px;background:var(--surface);color:var(--ink)}
.game-ui #hud :is(.left,.t,.s,.grp,.pill){color:var(--ink)}
.game-ui #hud .pill{background:var(--surface);border-color:var(--line)}
.game-ui body canvas:is(#cv,#game,#board){background-color:var(--stage)}
.game-ui :is(button.dbtn,button.cbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.game-ui :is(button.lvl,button.lvlbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line);border-radius:12px;min-height:54px}
.game-ui :is(button.lvl,button.lvlbtn) :is(.nc,.sz,small){color:var(--muted)}
.game-ui .ui-panel button.lvl{margin:0;min-width:44px;box-shadow:none;padding:8px}
.game-ui #hud :is(.left,.right,.hudl,.hbtns){gap:5px;flex-wrap:wrap}
.game-ui #hud :is(.left,.hudl){min-width:0;flex-shrink:1}
.game-ui #hud :is(.pill,.left){font-size:12px}
.game-ui button:disabled{cursor:default;opacity:.45;box-shadow:none}
.game-ui .ui-panel .ui-assist-note{color:var(--accent);font-weight:700}
@media(min-width:700px){.game-ui body>.wrap{padding-top:32px}.game-ui .ui-panel{padding:36px 30px}}
@media(max-width:360px){.game-ui body>.wrap{padding:10px;gap:10px}.game-ui .ui-panel{padding:22px 18px;gap:13px}.game-ui .ui-panel h1{font-size:26px}.game-ui .ui-emblem{width:70px;height:70px;font-size:38px}.game-ui :is(.topbar,#topbar){gap:5px;padding:8px}.game-ui :is(.iconbtn,.icobtn,.ibtn,.tbtn,.ib){min-width:40px;min-height:44px}}
@media(max-height:650px){.game-ui .ui-panel{padding:18px;gap:12px}.game-ui .ui-emblem{width:60px;height:60px;font-size:32px}.game-ui .ui-panel h1{font-size:25px}.game-ui .ui-panel :is(p,.howto,.sub,.rule){font-size:13px}}
@media(prefers-reduced-motion:reduce){.game-ui *, .game-ui *::before,.game-ui *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
/* 2026-10-20 热修：开局/结算遮罩铺满整屏，主按钮固定在面板底部，避免被画布尺寸裁切（#10） */
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv):has(>.ui-panel){position:fixed;inset:0;z-index:1000;border-radius:0;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
.game-ui .ui-panel{touch-action:pan-y}
.game-ui .ui-panel :is(#startBtn,#btnStart,.startbtn,#bStart,#restartBtn,#btnRestart,#againBtn,#btnAgain,#retryBtn,#btnRetry,#playBtn,#btnPlay){position:sticky;bottom:0;z-index:3;flex-shrink:0}
.game-ui .ui-panel :not(.card,.panel,.pausecard,.ovcard,.ui-mode):has(>:is(#startBtn,#btnStart,.startbtn,#bStart,#restartBtn,#btnRestart,#againBtn,#btnAgain,#retryBtn,#btnRetry,#playBtn,#btnPlay)){position:sticky;bottom:0;z-index:3;flex-shrink:0;background:var(--surface);box-shadow:0 -10px 10px -6px var(--surface)}


/* ===== Direction B · 霓虹糖果 Pop Arcade ===== saturated gradients, chunky bevels with a hard bottom edge, sticker panels, neon on dark themes */
html.game-ui[data-skin="b"]{--fb:"HarmonyOS Sans SC","MiSans","OPPOSans","vivo Sans","Noto Sans SC","Noto Sans CJK SC","PingFang SC","Microsoft YaHei UI",system-ui,sans-serif;--bounce:cubic-bezier(.34,1.56,.64,1);--bg:radial-gradient(circle at 12% 18%,rgba(255,255,255,.28) 0 38px,transparent 40px),radial-gradient(circle at 88% 30%,rgba(255,255,255,.16) 0 64px,transparent 66px),radial-gradient(circle at 20% 82%,rgba(255,255,255,.14) 0 52px,transparent 54px),radial-gradient(rgba(255,255,255,.16) 1.5px,transparent 2.2px) 0 0/22px 22px,linear-gradient(165deg,var(--b-bg1),var(--b-bg2));font-family:var(--fb)}
html.game-ui[data-skin="b"],html.game-ui[data-skin="b"] body,html.game-ui[data-skin="b"] #app,html.game-ui[data-skin="b"] :is(.overlay,.ov,#ov,#overlay,#pauseOv):has(>.ui-panel){background:var(--bg);background-color:var(--b-bg2)}
html.game-ui[data-skin="b"] body{min-height:100vh;font-family:var(--fb)}
html.game-ui[data-skin="b"] :is(.hint,.hintline,.tip){color:rgba(255,255,255,.94);text-shadow:0 1px 2px rgba(0,0,0,.35)}
/* Sticker panel: white rim + hard coloured bottom edge + drop */
html.game-ui[data-skin="b"] .ui-panel{background:linear-gradient(180deg,var(--surface),var(--soft));border:4px solid #fff;border-radius:32px;box-shadow:0 9px 0 var(--line),0 9px 0 4px rgba(0,0,0,.08),0 26px 40px rgba(0,0,0,.28);animation:uiB-in .5s var(--bounce) both}
html.game-ui[data-skin="b"] .ui-panel :is(h1,h2,.gamename,.gametitle){font-size:34px;font-weight:900;color:var(--b-title);letter-spacing:0;text-shadow:0 3px 0 var(--line),0 6px 10px rgba(0,0,0,.15)}
html.game-ui[data-skin="b"] .ui-emblem{width:100px;height:100px;border:4px solid #fff;border-radius:50%;background:radial-gradient(circle at 32% 26%,#fff 0 12%,var(--b-glow) 13%,var(--line) 70%,var(--b-edge) 100%);box-shadow:0 7px 0 var(--b-edge),0 16px 24px rgba(0,0,0,.25);font-size:54px;animation:uiB-wobble 2.6s ease-in-out infinite}
html.game-ui[data-skin="b"] .ui-emblem::before,html.game-ui[data-skin="b"] .ui-emblem::after{content:"✦";position:absolute;color:#fff;font-size:20px;text-shadow:0 0 8px var(--b-glow);animation:uiB-twinkle 1.8s ease-in-out infinite}
html.game-ui[data-skin="b"] .ui-emblem::before{top:-10px;right:-14px}
html.game-ui[data-skin="b"] .ui-emblem::after{bottom:4px;left:-18px;font-size:14px;animation-delay:.9s}
html.game-ui[data-skin="b"] .ui-panel :is(.score,.bigscore,.bigScore,.scorebig,#finalScore){font-size:56px;font-weight:900;color:var(--b-btn);-webkit-text-fill-color:currentColor;text-shadow:0 4px 0 var(--b-edge),0 0 2px var(--b-edge),0 10px 16px rgba(0,0,0,.25)}
html.game-ui[data-skin="b"] .ui-panel :is(h1,.gamename)~h2{font-size:19px;text-shadow:0 2px 0 var(--line)}
/* Chunky bevelled button: highlight lip, darker bottom slab, presses down onto the slab */
html.game-ui[data-skin="b"] :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn,button.actBtn):not(.ghost){position:relative}
html.game-ui[data-skin="b"] :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn,button.actBtn):not(.ghost):not(#\#){overflow:hidden;border:0;border-radius:20px;font-weight:900;color:var(--b-btn-ink);background:linear-gradient(180deg,var(--b-btn-hi),var(--b-btn) 52%);text-shadow:var(--b-btn-tsh);box-shadow:inset 0 3px 0 rgba(255,255,255,.55),inset 0 -5px 0 rgba(0,0,0,.14),0 6px 0 var(--b-edge),0 12px 18px rgba(0,0,0,.25);transition:transform .08s,box-shadow .08s}
html.game-ui[data-skin="b"] :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn,button.actBtn):not(.ghost):not(#\#)::before{content:"";position:absolute;left:12px;top:6px;width:22px;height:9px;border-radius:9px;background:rgba(255,255,255,.75);transform:rotate(-12deg);pointer-events:none}
html.game-ui[data-skin="b"] :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn,button.actBtn):not(.ghost):not(#\#):active{transform:translateY(5px);box-shadow:inset 0 3px 0 rgba(255,255,255,.4),inset 0 -2px 0 rgba(0,0,0,.14),0 1px 0 var(--b-edge),0 4px 8px rgba(0,0,0,.2)}

 const rar=()=>{const r=Math.random();const b=G.node==='boss'?2:G.node==='elite'?(r<.4?2:1):(r<.06?2:r<.36?1:0);return b;};
 const seen=new Set();const opts=[];while(opts.length<3){const r=rar();const id=POOL[r][Math.floor(Math.random()*POOL[r].length)];if(seen.has(id))continue;seen.add(id);opts.push(mk(id,G.act>=2&&Math.random()<.25));}
 const row=$('rewC');row.innerHTML='';opts.forEach(c=>{const el=cardEl(c,true);el.onclick=()=>{G.deck.push(c);tone(880,.08,'triangle');toast('加入了 '+CARDS[c.id].n);show('rewScr',false);advance();};row.appendChild(el);});
 $('rewB').innerHTML='';const s=document.createElement('button');s.className='btn ghost';s.textContent='跳过';s.onclick=()=>{show('rewScr',false);advance();};$('rewB').appendChild(s);
 show('rewScr',true);hudTop();}
function lose(){if(state==='over')return;state='over';G.hp=0;const sc=G.score+G.act*120+G.floor*8;finish(false,sc);}
function victory(){const sc=G.score+500+G.asc*150;if(G.asc>=save.asc&&save.asc<10)save.asc=G.asc+1;save.wins++;finish(true,sc);}
function finish(won,sc){state='over';if(sc>save.best)save.best=sc;Store.set('save',save);hideAll();
 $('overH').textContent=won?'🏆 登顶牌塔！':'💀 倒在了第 '+(G.act+1)+' 幕 第 '+(G.floor+1)+' 层';$('finalScore').textContent=sc;
 $('overText').innerHTML='击败 '+G.kills+' 个敌人 · 牌组 '+G.deck.length+' 张 · 遗物 '+G.relics.length+' 件<br>最佳纪录 '+save.best+(won?'<br>已解锁进阶 '+save.asc+'！':'');
 if(won){tone(523,.2,'triangle');tone(659,.2,'triangle',.12,0,.2);tone(784,.2,'triangle',.12,0,.4);tone(1046,.4,'triangle',.12,0,.6);}else tone(200,.6,'sawtooth',.1,60);
 show('overScr',true);}
// ================= 篝火 / 商店 / 事件 =================
function openRest(){hideAll();$('rewH').textContent='🔥 篝火';const heal=Math.round(G.maxhp*(G.asc>=5?.22:.3));$('rewP').textContent='❤ '+G.hp+'/'+G.maxhp+' · 休息还是锻造？';$('rewC').innerHTML='';const b=$('rewB');b.innerHTML='';
 const r=document.createElement('button');r.className='btn';r.textContent='😴 休息 +'+heal+'❤';r.onclick=()=>{G.hp=Math.min(G.maxhp,G.hp+heal);tone(660,.2,'sine');advance('回复了 '+heal+' 生命');};
 const u=document.createElement('button');u.className='btn ghost';u.textContent='⚒ 升级一张卡';u.onclick=()=>showDeck('选择要升级的卡',c=>{c.up=true;tone(990,.1,'triangle');show('deckScr',false);advance('升级了 '+CARDS[c.id].n+'+');},c=>!c.up);
 b.append(r,u);show('rewScr',true);}
function openShop(){hideAll();$('rewH').textContent='🛒 商店';const row=$('rewC');row.innerHTML='';const b=$('rewB');b.innerHTML='';
 const items=[0,0,1,1,2].map(r=>{const id=POOL[r][Math.floor(Math.random()*POOL[r].length)];return{c:mk(id),p:[50,75,150][r]+rnd(-6,8)};});
 const refresh=()=>{$('rewP').textContent='💰 '+G.gold+' · 点击卡牌购买';hudTop();};refresh();
 items.forEach(it=>{const w=document.createElement('div');const el=cardEl(it.c,true);const pr=document.createElement('div');pr.className='price';pr.textContent='💰'+it.p;w.append(el,pr);
  el.onclick=()=>{if(it.sold)return;if(G.gold<it.p){toast('金币不足');return;}G.gold-=it.p;it.sold=1;G.deck.push(it.c);el.style.opacity=.3;pr.textContent='已售';tone(880,.08,'triangle');refresh();};row.appendChild(w);});
 const rl=randRelic();if(rl){const rb=document.createElement('button');rb.className='btn ghost';const rp=140+rnd(0,20);rb.textContent=RELICS[rl].a+' '+RELICS[rl].n+' 💰'+rp;rb.title=RELICS[rl].d;rb.onclick=()=>{if(G.gold<rp){toast('金币不足');return;}G.gold-=rp;addRelic(rl);rb.disabled=true;refresh();};b.appendChild(rb);}
 const rm=document.createElement('button');rm.className='btn ghost';const rmp=75;rm.textContent='🗑 删一张牌 💰'+rmp;rm.onclick=()=>{if(G.gold<rmp){toast('金币不足');return;}showDeck('选择要删除的卡',c=>{G.gold-=rmp;G.deck.splice(G.deck.indexOf(c),1);rm.disabled=true;show('deckScr',false);show('rewScr',true);refresh();toast('删除了 '+CARDS[c.id].n);});};b.appendChild(rm);
 const lv=document.createElement('button');lv.className='btn';lv.textContent='离开';lv.onclick=()=>advance();b.appendChild(lv);show('rewScr',true);}
const EVENTS=[
 {h:'⛲ 神秘泉水',p:'清澈的泉水泛着微光。',o:[['饮用：回复 15 生命',()=>{G.hp=Math.min(G.maxhp,G.hp+15);}],['沐浴：最大生命 +5',()=>{G.maxhp+=5;G.hp+=5;}]]},
 {h:'🎲 地精赌徒',p:'“押 40 金币，一半几率赢得一件遗物！”',o:[['下注 40 金币',()=>{if(G.gold<40){toast('金币不够');return;}G.gold-=40;if(Math.random()<.5){const r=randRelic();if(r)addRelic(r);}else toast('输了……');}],['离开',()=>{}]]},
 {h:'🗿 古老祭坛',p:'祭坛渴望鲜血，作为回报，它会赐予力量。',o:[['献出 8 生命：获得一张稀有卡',()=>{G.hp=Math.max(1,G.hp-8);const id=POOL[2][Math.floor(Math.random()*POOL[2].length)];G.deck.push(mk(id));toast('获得 '+CARDS[id].n);}],['离开',()=>{}]]},
 {h:'🧓 迷途铁匠',p:'老铁匠愿意免费为你打磨装备。',o:[['随机升级 2 张卡',()=>{pickN(G.deck.filter(c=>!c.up),2).forEach(c=>{c.up=true;toast('升级了 '+CARDS[c.id].n);});}],['只要 30 金币',()=>{G.gold+=30;}]]},
 {h:'📜 禁忌书页',p:'书页上写着一道危险的咒语。',o:[['学习：获得「突破极限」，失去 5 最大生命',()=>{G.deck.push(mk('limit'));G.maxhp-=5;G.hp=Math.min(G.hp,G.maxhp);}],['烧掉：删除一张「打击」',()=>{const i=G.deck.findIndex(c=>c.id==='strike');if(i>=0)G.deck.splice(i,1);}]]},
];
function openEvent(){hideAll();const E=EVENTS[Math.floor(Math.random()*EVENTS.length)];$('rewH').textContent=E.h;$('rewP').textContent=E.p;$('rewC').innerHTML='';const b=$('rewB');b.innerHTML='';
 E.o.forEach(([t,f],i)=>{const x=document.createElement('button');x.className=i?'btn ghost':'btn';x.textContent=t;x.onclick=()=>{f();tone(700,.08,'triangle');advance();};b.appendChild(x);});show('rewScr',true);}
// ================= 渲染 =================
function cardEl(c,big){const D=CARDS[c.id],v=cval(c);const el=document.createElement('button');el.className='card '+D.t+(c.up?' up':'');const k=ccost(c);
 el.innerHTML='<span class="cost">'+(k<0?'X':k)+'</span><span class="nm">'+D.n+(c.up?'+':'')+'</span><span class="art">'+D.a+'</span><span class="tx">'+D.tx(v)+'</span>';el.setAttribute('aria-label',D.n+' '+D.tx(v));return el;}
function renderHand(){const h=$('hand');h.innerHTML='';const n=G.hand.length;if(!n)return;const wTot=h.clientWidth||340;const cw=76;const step=n>1?Math.min(cw+4,(wTot-cw)/(n-1)):0;const start=(wTot-(step*(n-1)+cw))/2;
 G.hand.forEach((c,i)=>{const el=cardEl(c);el.style.left=(start+i*step)+'px';const mid=(n-1)/2;el.style.transform='rotate('+((i-mid)*3)+'deg)';el.style.bottom=(4-Math.abs(i-mid)*2)+'px';el.style.zIndex=i;
  if(!canPlay(c)||state!=='fight')el.classList.add('no');if(pend===c)el.classList.add('sel');
  el.onclick=()=>onCard(c);h.appendChild(el);});}
function onCard(c){if(state!=='fight')return;if(!canPlay(c)){toast(CARDS[c.id].t==='atk'&&P.s.tang>0?'被缠绕：本回合无法打出攻击牌':'能量不足');tone(160,.1,'square',.05);return;}
 if(CARDS[c.id].tg){const a=alive();if(a.length===1){playCard(c,a[0]);return;}pend=pend===c?null:c;renderHand();if(pend)toast('点击上方的敌人作为目标',1000);return;}
 playCard(c);}
function renderAll(){renderHand();$('energy').textContent=G.en;$('hpT').textContent=P.hp+'/'+G.maxhp;$('blkT').textContent=P.b;$('hpI').style.width=(100*P.hp/G.maxhp)+'%';
 $('pSts').innerHTML=stsHtml(P);$('drawT').textContent='抽 '+G.draw.length;$('discT').textContent='弃 '+G.disc.length;$('endBtn').disabled=state!=='fight';hudTop();}
const SICON={str:'💪',dex:'👣',vul:'💔',wk:'🥀',poi:'☠️',thn:'🌵',dem:'😈',nox:'☁️',rit:'🕯️',enr:'😡',tang:'⛓️',int:'👻'};
function stsHtml(t){return Object.keys(t.s).filter(k=>t.s[k]>0&&SICON[k]).map(k=>'<span>'+SICON[k]+t.s[k]+'</span>').join('');}
function intentStr(e){const m=e.intent;if(!m)return['',''];if(m.summon)return['🐍','召唤'];if(m.d){const v=calcDmg(e,P,m.d);return['🗡',v+(m.n>1?'×'+m.n:'')];}if(m.p)return['🌀','减益'];if(m.s&&m.b)return['🛡✨',''];if(m.b)return['🛡',''];if(m.s)return['✨','强化'];return['',''];}
function drawScene(dt){const A=ACTS[G.act||0];ctx.save();if(shake>0){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake=Math.max(0,shake-dt*30);}
 if(FX)FX.stage(ctx,W,H,A.bg[0],A.bg[1]);else{ctx.fillStyle=A.bg[1];ctx.fillRect(0,0,W,H);}
 // 地面
 const gr=ctx.createLinearGradient(0,170,0,H);gr.addColorStop(0,'rgba(255,255,255,.06)');gr.addColorStop(1,'rgba(0,0,0,.35)');ctx.fillStyle=gr;ctx.fillRect(0,175,W,H-175);
 ctx.strokeStyle='rgba(255,255,255,.12)';ctx.lineWidth=1;for(let i=0;i<7;i++){ctx.beginPath();ctx.moveTo(0,180+i*i*2.4);ctx.lineTo(W,180+i*i*2.4);ctx.stroke();}
 if(state==='menu'||!P){ctx.restore();txt(ctx,'🃏',W/2,H/2,72);return;}
 // 玩家
 const px=P.x+(P.hitT>0?-P.hitT*8:0);if(FX)FX.shadow(ctx,px,P.y+4,30,8);if(FX)FX.orb(ctx,px,P.y-30,30,'#4f7cff');else{ctx.fillStyle='#4f7cff';ctx.beginPath();ctx.arc(px,P.y-30,30,0,7);ctx.fill();}txt(ctx,'🧝',px,P.y-32,44);P.hitT=Math.max(0,P.hitT-dt*3);
 if(P.b>0){ctx.save();if(FX)FX.glow(ctx,'#8fd3ff',12);ctx.strokeStyle='rgba(143,211,255,.9)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(px,P.y-28,34,Math.PI*.8,Math.PI*2.2);ctx.stroke();ctx.restore();otxt(ctx,'🛡'+P.b,px,P.y+18,13,'#bfe6ff');}
 // 敌人
 for(const e of EN){if(e.dead){e.fade=(e.fade||1)-dt*2;if(e.fade<=0)continue;ctx.globalAlpha=e.fade;}
  const big=e.D.boss?1.45:e.D.elite?1.15:EN.length>2?.9:1;const r=Math.round(28*big);let x=e.x+(e.hitT>0?(Math.random()-.5)*8*e.hitT:0),y=e.y;if(e.lunge){x-=e.lunge*22;e.lunge=Math.max(0,e.lunge-dt*3);}e.hitT=Math.max(0,e.hitT-dt*3);
  if(FX){FX.shadow(ctx,x,y+r*.9+8,r*1.1,7);FX.orb(ctx,x,y,r,e.D.c);}else{ctx.fillStyle=e.D.c;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();}
  txt(ctx,e.D.a,x,y-2,Math.round(r*1.15));
  if(pend&&!e.dead){ctx.strokeStyle='#ffcf33';ctx.lineWidth=3;ctx.setLineDash([6,5]);ctx.beginPath();ctx.arc(x,y,r+8,0,7);ctx.stroke();ctx.setLineDash([]);}
  // 血条
  const bw=Math.max(60,r*2.4),by=y+r+16;ctx.fillStyle='rgba(0,0,0,.6)';rr(ctx,x-bw/2,by,bw,9,5);ctx.fill();ctx.fillStyle=e.b>0?'#5b8cff':'#ff3d6e';rr(ctx,x-bw/2,by,bw*Math.max(0,e.hp/e.max),9,5);ctx.fill();
  otxt(ctx,e.hp+'/'+e.max+(e.b?' 🛡'+e.b:''),x,by+5,10,'#fff');
  const st=Object.keys(e.s).filter(k=>e.s[k]>0&&SICON[k]).map(k=>SICON[k]+e.s[k]).join(' ');txt(ctx,e.D.n+(st?'  '+st:''),x,by+20,11,'#fff',undefined,800);
  if(!e.dead){const [ic,v]=intentStr(e);if(ic){const iy=y-r-22;ctx.fillStyle='rgba(0,0,0,.5)';rr(ctx,x-26,iy-11,52,22,11);ctx.fill();otxt(ctx,ic+v,x,iy,14,e.intent.d?'#ff8a8a':'#ffe066');}
   }
  ctx.globalAlpha=1;}
 if(FX)FX.drawBurst(ctx,sparks);
 for(const f of fls){f.life-=dt;f.y-=dt*30;ctx.globalAlpha=Math.max(0,Math.min(1,f.life*1.5));otxt(ctx,f.s,f.x,f.y,16,f.c);}ctx.globalAlpha=1;fls=fls.filter(f=>f.life>0);
 if(state==='enemy')otxt(ctx,'敌方回合…',W/2,20,14,'#ffe066');
 ctx.restore();}
function showDeck(title,pick,filter){$('deckH').textContent=title;const L=$('deckL');L.innerHTML='';const list=G.deck.slice().sort((a,b)=>CARDS[a.id].t.localeCompare(CARDS[b.id].t)||a.id.localeCompare(b.id));
 list.filter(c=>!filter||filter(c)).forEach(c=>{const el=cardEl(c,true);if(pick)el.onclick=()=>pick(c);L.appendChild(el);});$('deckClose').textContent=pick?'取消':'关闭';
 $('deckClose').onclick=()=>{show('deckScr',false);};show('deckScr',true);}
// ================= 输入 =================
cv.addEventListener('pointerdown',e=>{e.preventDefault();if(state!=='fight')return;const p=posOf(e,cv,W,H);let best=null,bd=1e9;for(const en of alive()){const d=(en.x-p.x)**2+(en.y-p.y)**2;if(d<bd){bd=d;best=en;}}
 if(pend&&best&&bd<70*70){playCard(pend,best);}else if(best&&bd<60*60){const m=best.intent;toast(best.D.n+'：'+describe(best),2000);}});
function describe(e){const m=e.intent||{};const a=[];if(m.d)a.push('攻击 '+calcDmg(e,P,m.d)+(m.n>1?'×'+m.n:''));if(m.b)a.push('格挡 '+m.b);if(m.p)a.push('施加'+Object.keys(m.p).map(k=>({wk:'虚弱',vul:'易伤',tang:'缠绕'})[k]).join('/'));if(m.s)a.push('强化自身');if(m.summon)a.push('召唤');return a.join('，')||'蓄势';}
$('endBtn').onclick=()=>{tone(440,.06,'triangle');endTurn();};
$('deckBtn').onclick=()=>{if(!G.deck)return;showDeck('牌组 '+G.deck.length+' 张',null);};
function pause(){if(state==='fight'){state='pause';show('pauseOv',true);}}
$('pauseBtn').onclick=pause;$('resumeBtn').onclick=()=>{show('pauseOv',false);state='fight';renderAll();};
$('quitBtn').onclick=()=>{show('pauseOv',false);state='fight';lose();};
$('againBtn').onclick=()=>openAsc();
function openAsc(){hideAll();state='menu';const g=$('ascGrid');g.innerHTML='';$('ascInfo').innerHTML='通关后解锁下一级进阶 · 最佳 '+save.best+' · 登顶 '+save.wins+' 次';
 for(let i=0;i<=10;i++){const b=document.createElement('button');b.className='lvl';const open=i<=save.asc;b.disabled=!open;b.innerHTML=(open?i:'🔒')+'<small>'+(i===0?'标准':'进阶')+'</small>';b.onclick=()=>{tone(660,.08,'triangle');newRun(i);};g.appendChild(b);}
 show('ascScr',true);}
function showTut(done){tutorial([
 ['🗼 爬塔','每幕 12 层，第 12 层是首领。每层从 2~3 个房间里选一个：⚔ 战斗、💀 精英（必得遗物）、🔥 篝火、🛒 商店、❓ 事件。'],
 ['🃏 出牌','每回合 3 点 ⚡能量、抽 5 张牌。点卡牌打出；攻击牌在有多个敌人时，再点上方的敌人选择目标。用完后点「结束回合」。'],
 ['👁 读懂意图','敌人头顶显示下回合要做什么：🗡数字=攻击伤害，🛡=格挡，✨=强化，🌀=减益。先算好伤害，再决定攻还是守。'],
 ['📈 构筑','胜利后三选一加入新卡；篝火可升级卡（数值变强）；商店能删掉弱卡。状态：💪力量 加伤害、💔易伤 受伤+50%、🥀虚弱 伤害-25%、☠️中毒 每回合掉血。']],done);}
$('howBtn').onclick=()=>{show('ascScr',false);showTut(openAsc);};
$('startBtn').onclick=()=>{audio();show('startScr',false);if(!save.tut){showTut(()=>{save.tut=1;Store.set('save',save);openAsc();});}else openAsc();};
$('bestLine').textContent=save.best?'最佳 '+save.best+' · 已解锁进阶 '+save.asc:'';
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
let last=performance.now(),FAST=false;
function frame(t){const dt=Math.min(.05,(t-last)/1000);last=t;drawScene(dt);requestAnimationFrame(frame);}
fit();requestAnimationFrame(frame);addEventListener('resize',()=>{if(G.hand)renderHand();});
window.__fs={G,get P(){return P},get EN(){return EN},get state(){return state},newRun,enterNode,playCard,endTurn,openMap,alive,canPlay,cval,CARDS,setFast:v=>FAST=v,save:()=>save};
</script>
