<!doctype html>

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{display:flex;justify-content:center;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.wrap{width:100%;max-width:480px;height:100%;padding:10px;display:flex;flex-direction:column;align-items:center;gap:8px}
.topbar{width:100%;display:flex;justify-content:space-between;align-items:center;flex-wrap:nowrap!important;gap:6px}
.topbar .stat{font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.topbar .tools{display:flex;gap:6px}
.topbar .tools .iconbtn{min-width:44px;min-height:44px}
.stagebox{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}

.hint{font-size:12px;text-align:center;min-height:16px;font-weight:700}

.lvgrid .lvl{min-height:54px;min-width:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:16px;padding:4px!important;line-height:1.1}
.lvgrid .lvl small{font-size:10px;margin-top:2px}
.rowbtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:100%}
#tutStep{font-size:12px;opacity:.7}

#toast.on{opacity:1;transform:translate(-50%,0)}
.shop{display:flex;flex-direction:column;gap:8px;width:100%;max-width:320px}
.shop .row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;border-radius:12px;background:rgba(255,255,255,.12)}
.modetoggle{display:flex;gap:8px;width:100%;justify-content:center}
.modetoggle .btn{min-width:100px;min-height:44px}
</style>
<!-- GAME UI BEGIN -->
<style>
:root{--page:#dcece5;--surface:#f5fff9;--soft:#c8dfd2;--ink:#203f35;--muted:#4d7263;--accent:#28654e;--on-accent:#ffffff;--line:#a1c5b4;--stage:#102f2b;--page:#16a37a;--surface:#f6fff0;--soft:#d8f3cf;--ink:#1b4a2c;--muted:#476e52;--accent:#7d6414;--on-accent:#ffffff;--line:#7fd06b;--b-bg1:#93e46c;--b-bg2:#16a37a;--b-btn:#ffcc29;--b-btn-hi:#ffde74;--b-edge:#d48a00;--b-glow:#d8ffb0;--b-glow-rgb:216,255,176;--b-pedge-rgb:127,208,107;--b-btn-ink:#754c00;--b-btn-tsh:0 1px 0 rgba(255,255,255,.45);--b-coin-ink:#754c00;--b-coin-tsh:none;--b-key-ink:#7d6414;--b-title:#905e00}
/* Shared presentation only; mechanics and state remain inside each standalone game. */

.game-ui :is(.iconbtn,.iconBtn,.icobtn,.ibtn,.tbtn,.hbtn,.ib,.iconBtn,.pause){min-width:44px;min-height:44px;flex-shrink:0;border-radius:12px;background:var(--soft);color:var(--ink);border:1px solid var(--line);box-shadow:none;font-size:17px}

.game-ui :is(.rowbtns,.btnrow,.ctlrow){gap:10px;flex-wrap:wrap;justify-content:center}
.game-ui :is(.pill,.hudbox,.hud .p){background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:none;font-variant-numeric:tabular-nums}
.game-ui :is(.dbtn,.cbtn,.gbtn,.holdbtn,.firebtn,.bombbtn,.jumpbtn,.pumpbtn,.nbtn){border-radius:12px;box-shadow:0 3px 0 var(--line);min-height:44px}

.game-ui .ui-panel{width:min(100%,380px);max-height:100%;overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:18px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:24px;padding:30px 24px;box-shadow:0 8px 0 var(--soft),0 20px 48px #15253618;text-align:center;margin:auto}

.game-ui body>.wrap>canvas:not(#fx){background-color:var(--stage);box-shadow:0 0 0 1px var(--line),0 6px 0 var(--soft);border-radius:18px;flex-shrink:0}

.game-ui #hud{gap:6px;background:var(--surface);color:var(--ink)}
.game-ui #hud :is(.left,.t,.s,.grp,.pill){color:var(--ink)}
.game-ui #hud .pill{background:var(--surface);border-color:var(--line)}
.game-ui body canvas:is(#cv,#game,#board){background-color:var(--stage)}
.game-ui :is(button.dbtn,button.cbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.game-ui :is(button.lvl,button.lvlbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line);border-radius:12px;min-height:54px}
.game-ui :is(button.lvl,button.lvlbtn) :is(.nc,.sz,small){color:var(--muted)}
.game-ui .ui-panel button.lvl{margin:0;min-width:44px;box-shadow:none;padding:8px}
.game-ui #hud :is(.left,.right,.hudl,.hbtns){gap:5px;flex-wrap:wrap}
.game-ui #hud :is(.left,.hudl){min-width:0;flex-shrink:1}
.game-ui #hud :is(.pill,.left){font-size:12px}
.game-ui button:disabled{cursor:default;opacity:.45;box-shadow:none}
.game-ui .ui-panel .ui-assist-note{color:var(--accent);font-weight:700}
@media(min-width:700px){.game-ui body>.wrap{padding-top:32px}.game-ui .ui-panel{padding:36px 30px}}
@media(max-width:360px){.game-ui body>.wrap{padding:10px;gap:10px}.game-ui .ui-panel{padding:22px 18px;gap:13px}.game-ui .ui-panel h1{font-size:26px}.game-ui .ui-emblem{width:70px;height:70px;font-size:38px}.game-ui :is(.topbar,#topbar){gap:5px;padding:8px}.game-ui :is(.iconbtn,.icobtn,.ibtn,.tbtn,.ib){min-width:40px;min-height:44px}}
@media(max-height:650px){.game-ui .ui-panel{padding:18px;gap:12px}.game-ui .ui-emblem{width:60px;height:60px;font-size:32px}.game-ui .ui-panel h1{font-size:25px}.game-ui .ui-panel :is(p,.howto,.sub,.rule){font-size:13px}}

/* 2026-10-20 热修：开局/结算遮罩铺满整屏，主按钮固定在面板底部，避免被画布尺寸裁切（#10） */
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv):has(>.ui-panel){position:fixed;inset:0;z-index:1000;border-radius:0;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}

    // Glow is shadowBlur: cheap for a handful of shapes, never use it on every tile.
    glow: function (ctx, color, blur) { ctx.shadowColor = color; ctx.shadowBlur = blur; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0; },
    noGlow: function (ctx) { ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; },
    // Crisp rendering on high-DPI phones without changing game coordinates.
    // Only safe where input code converts with getBoundingClientRect + logical W/H, not cv.width.
    hidpi: function (cv, ctx, w, h) {
      var d = Math.max(1, Math.min(2.5, window.devicePixelRatio || 1));
      cv.width = Math.round(w * d); cv.height = Math.round(h * d); // intrinsic ratio stays w:h, so CSS sizing is unchanged
      ctx.setTransform(d, 0, 0, d, 0, 0); return d;
    },
    // Lightweight particle bursts (pooled array, no allocations per frame beyond the burst).
    burst: function (list, x, y, color, n) {
      for (var i = 0; i < (n || 12); i++) { var a = Math.random() * 6.283, v = 1 + Math.random() * 2.6; list.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 1, life: 1, c: color, r: 1.5 + Math.random() * 2.5 }); }
    },
    drawBurst: function (ctx, list) {
      for (var i = list.length - 1; i >= 0; i--) {
        var p = list[i]; p.x += p.vx; p.y += p.vy; p.vy += .12; p.life -= .035;
        if (p.life <= 0) { list.splice(i, 1); continue; }
        ctx.globalAlpha = p.life; ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (skin === 'b' ? 1.2 : 1), 0, 7); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
  };
  window.GameUI.fx = fx;
}());

</script>
<!-- GAME UI END -->

<div id="toast"></div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const W=360,H=500;
const cv=$('cv'),ctx=cv.getContext('2d');
const UI=window.GameUI||{pick:a=>a,storageGet:k=>localStorage.getItem(k),storageSet:(k,v)=>localStorage.setItem(k,v)};
const FX=UI.fx&&UI.fx.on?UI.fx:null;
if(FX)FX.hidpi(cv,ctx,W,H);else{cv.width=W;cv.height=H;}
const PK='g100_catrealm_prog', MK='g100_catrealm_mute', HK='g100_catrealm_hs';
const REGION_COLS=['#FF5C8A','#FFB21E','#3FC163','#5B8CFF','#C77DFF','#FF7A59','#2DD4BF','#F472B6','#A3E635','#38BDF8'];
const TOTAL=30;
let muted=UI.storageGet(MK)==='1',ac=null;
$('muteBtn').textContent=muted?'🔇':'🔊';
function beep(f,d,type){if(muted)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(.12,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d);}catch(e){}}
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('on'),1200);}
function show(id,on){$(id).classList.toggle('hidden',!on);}
function loadProg(){try{return JSON.parse(UI.storageGet(PK)||'{}')}catch(e){return{}}}
function saveProg(p){UI.storageSet(PK,JSON.stringify(p));}
let prog=loadProg();
if(!prog.stars)prog.stars={}; if(prog.coins==null)prog.coins=0; if(prog.unlock==null)prog.unlock=1;
if(prog.hintLv==null)prog.hintLv=0; if(prog.streak==null)prog.streak=0; if(!prog.seenTut)prog.seenTut=0;
let hs=+UI.storageGet(HK)||0;
$('muteBtn').onclick=()=>{muted=!muted;UI.storageSet(MK,muted?'1':'0');$('muteBtn').textContent=muted?'🔇':'🔊';};
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function levelSpec(n){
  const size=n<=6?4:n<=14?5:n<=22?6:n<=27?7:8;
  const boss=n%5===0;
  const blocked=n>=10?(boss?Math.floor(size*0.8):Math.floor((n-8)/4)):0;
  const dual=n>=20?(boss?2:1):0;
  return{size,boss,blocked,dual,regions:size};
}

function isAdjDiag(r1,c1,r2,c2){
  return Math.abs(r1-r2)<=1 && Math.abs(c1-c2)<=1 && !(r1===r2&&c1===c2);
}

function solveNCats(size,regions,blocked,dualRegions,rnd){
  // Place one cat per region (dual regions need 2), no same row/col, no diagonal adjacent
  // regions[r][c] = region id, -1 blocked
  const nReg=size; // base
  const need={};
  for(let i=0;i<nReg;i++) need[i]=1;
  for(const d of dualRegions) need[d]=2;

  // Collect cells per region
  const cells={};
  for(let r=0;r<size;r++) for(let c=0;c<size;c++){
    const id=regions[r][c];
    if(id<0) continue;
    (cells[id]=cells[id]||[]).push({r,c});
  }
  const order=Object.keys(need).map(Number).sort((a,b)=>need[b]-need[a]||(cells[a].length-cells[b].length));
  const placed=[];
  const rowUsed=new Set(), colUsed=new Set();

  function ok(r,c){
    if(rowUsed.has(r)||colUsed.has(c)) return false;
    for(const p of placed){
      if(isAdjDiag(r,c,p.r,p.c)) return false;
      // also no same row/col already covered
    }
    return true;
  }
  function bt(i){
    if(i>=order.length) return true;
    const rid=order[i];
    const want=need[rid];
    const pool=(cells[rid]||[]).slice().sort(()=>rnd()-0.5);
    function placeK(k, start){
      if(k===want) return bt(i+1);
      for(let j=start;j<pool.length;j++){
        const {r,c}=pool[j];
        if(!ok(r,c)) continue;
        placed.push({r,c,rid}); rowUsed.add(r); colUsed.add(c);
        if(placeK(k+1,j+1)) return true;
        placed.pop(); rowUsed.delete(r); colUsed.delete(c);
      }
      return false;
    }
    return placeK(0,0);
  }
  if(!bt(0)) return null;
  return placed;
}

function genRegions(size,rnd,blockedCount,dualCount){
  // Grow regions via flood from seeds
  const regions=Array.from({length:size},()=>Array(size).fill(-2));
  const seeds=[];
  // place size seeds for size regions
  const cells=[];
  for(let r=0;r<size;r++) for(let c=0;c<size;c++) cells.push({r,c});
  // shuffle
  for(let i=cells.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[cells[i],cells[j]]=[cells[j],cells[i]];}
  for(let i=0;i<size;i++){ seeds.push(cells[i]); regions[cells[i].r][cells[i].c]=i; }
  // BFS expand
  const q=seeds.map((s,i)=>({r:s.r,c:s.c,id:i}));
  let qi=0;
  const dirs=[[0,1],[1,0],[0,-1],[-1,0]];
  while(qi<q.length){
    const cur=q[qi++];
    const nb=dirs.slice().sort(()=>rnd()-0.5);
    for(const [dr,dc] of nb){
      const nr=cur.r+dr,nc=cur.c+dc;
      if(nr<0||nc<0||nr>=size||nc>=size) continue;
      if(regions[nr][nc]!==-2) continue;
      // prefer assign to current
      if(rnd()<0.7 || q.length>size*size){ regions[nr][nc]=cur.id; q.push({r:nr,c:nc,id:cur.id}); }
    }
  }
  // fill remaining
  for(let r=0;r<size;r++) for(let c=0;c<size;c++){
    if(regions[r][c]!==-2) continue;
    // nearest seed
    let best=0,bd=1e9;
    for(let i=0;i<size;i++){
      const d=Math.abs(seeds[i].r-r)+Math.abs(seeds[i].c-c);
      if(d<bd){bd=d;best=i;}
    }
    regions[r][c]=best;
  }
  // blocked cells
  const dual=[];
  if(dualCount>0){
    const counts={}; for(let r=0;r<size;r++) for(let c=0;c<size;c++) counts[regions[r][c]]=(counts[regions[r][c]]||0)+1;
    const cands=Object.keys(counts).map(Number).filter(id=>counts[id]>=4).sort(()=>rnd()-0.5);
    for(let i=0;i<dualCount&&i<cands.length;i++) dual.push(cands[i]);
  }
  // blocked: pick cells not destroying solvability too hard — mark after we have solution
  return{regions,dual};
}

function genLevel(n){
  const sp=levelSpec(n);
  const rnd=mulberry32(n*104729+7);
  let attempt=0, regions, dual, solution, blocked=new Set();
  while(attempt++<40){
    const g=genRegions(sp.size,rnd,sp.blocked,sp.dual);
    regions=g.regions; dual=g.dual;
    // try place blocked first on random cells, then solve
    blocked=new Set();
    const all=[];
    for(let r=0;r<sp.size;r++) for(let c=0;c<sp.size;c++) all.push(r+','+c);
    for(let i=all.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[all[i],all[j]]=[all[j],all[i]];}
    // solve without blocked first
    solution=solveNCats(sp.size,regions,blocked,dual,rnd);
    if(!solution) continue;
    // add blocked away from solution
    const solSet=new Set(solution.map(p=>p.r+','+p.c));
    let bc=0;
    for(const key of all){
      if(bc>=sp.blocked) break;
      if(solSet.has(key)) continue;
      const [r,c]=key.split(',').map(Number);
      // don't empty a region
      const id=regions[r][c];
      let cnt=0; for(let rr=0;rr<sp.size;rr++) for(let cc=0;cc<sp.size;cc++) if(regions[rr][cc]===id&&!blocked.has(rr+','+cc)&&!(rr===r&&cc===c)) cnt++;
      const need=dual.includes(id)?2:1;
      if(cnt<need) continue;
      blocked.add(key); bc++;
    }
    // re-verify
    const regions2=regions.map(row=>row.slice());
    for(const key of blocked){const [r,c]=key.split(',').map(Number); regions2[r][c]=-1;}
    solution=solveNCats(sp.size,regions2,blocked,dual,rnd);
    if(solution){ regions=regions2; break; }
    solution=null;
  }
  if(!solution){
    // fallback: simple diagonal regions
    regions=Array.from({length:sp.size},(_,r)=>Array.from({length:sp.size},(_,c)=> (r)%sp.size));
    // stripe regions
    for(let r=0;r<sp.size;r++) for(let c=0;c<sp.size;c++) regions[r][c]=c;
    dual=[]; blocked=new Set();
    solution=solveNCats(sp.size,regions,blocked,dual,rnd)||[];
    // place on diagonal if needed
    if(!solution.length){
      solution=[];
      for(let i=0;i<sp.size;i++) solution.push({r:i,c:i,rid:i});
      // fix regions to columns
    }
  }
  const marks=Array.from({length:sp.size},()=>Array(sp.size).fill(0)); // 0 empty, 1 mark, 2 cat
  return{size:sp.size,regions,dual,blocked,solution,marks,sp,hearts:3,hintsUsed:0,mode:'mark',hintCell:null,streak:prog.streak||0};
}

let state='menu', lvl=1, game=null, sparks=[], last=0;

function setMode(m){
  if(!game) return;
  game.mode=m;
  $('modeMark').className=m==='mark'?'btn':'btn ghost';
  $('modeCat').className=m==='cat'?'btn':'btn ghost';
}
$('modeMark').onclick=()=>setMode('mark');
$('modeCat').onclick=()=>setMode('cat');

function catsInRegion(rid){
  let n=0;
  for(let r=0;r<game.size;r++) for(let c=0;c<game.size;c++) if(game.regions[r][c]===rid&&game.marks[r][c]===2) n++;
  return n;
}
function needRegion(rid){ return game.dual.includes(rid)?2:1; }

function conflicts(r,c){
  // would placing a cat at r,c conflict?
  for(let i=0;i<game.size;i++){
    if(i!==c && game.marks[r][i]===2) return true;
    if(i!==r && game.marks[i][c]===2) return true;
  }
  for(let dr=-1;dr<=1;dr++) for(let dc=-1;dc<=1;dc++){
    if(!dr&&!dc) continue;
    const nr=r+dr,nc=c+dc;
    if(nr<0||nc<0||nr>=game.size||nc>=game.size) continue;
    if(game.marks[nr][nc]===2) return true;
  }
  return false;
}

function checkWin(){
  // every region has exact need cats, no conflicts (already enforced), all cats placed
  const ids=new Set();
  for(let r=0;r<game.size;r++) for(let c=0;c<game.size;c++) if(game.regions[r][c]>=0) ids.add(game.regions[r][c]);
  for(const id of ids){
    if(catsInRegion(id)!==needRegion(id)) return false;
  }
  return true;
}

function useHint(){
  if(!game||state!=='play') return;
  const free=1+prog.hintLv;
  if(game.hintsUsed>=free){
    if(prog.coins<8){toast('金币不足');return;}
    prog.coins-=8; saveProg(prog);
  }
  game.hintsUsed++;
  // reveal one solution cell not yet cat
  const miss=game.solution.find(p=>game.marks[p.r][p.c]!==2);
  if(!miss){toast('已全部正确');return;}
  game.hintCell=miss; beep(880,.1); toast('高亮一只正确位置');
  setTimeout(()=>{if(game)game.hintCell=null;},2500);
}

function punish(){
  game.hearts--; beep(160,.2,'sawtooth'); toast('冲突！♥'+game.hearts);
  prog.streak=0; game.streak=0; saveProg(prog);
  if(game.hearts<=0) finishLose();
  updateStat();
}

function placeAt(r,c){
  if(game.regions[r][c]<0){beep(200,.05);return;}
  const cur=game.marks[r][c];
  if(game.mode==='mark'){
    if(cur===2){ game.marks[r][c]=0; beep(300,.05); }
    else { game.marks[r][c]=cur===1?0:1; beep(400,.05); }
  } else {
    if(cur===2){ game.marks[r][c]=0; beep(300,.05); updateStat(); return; }
    const rid=game.regions[r][c];
    if(catsInRegion(rid)>=needRegion(rid)){ toast('该区猫已满'); beep(200,.08); return; }
    if(conflicts(r,c)){ punish(); return; }
    game.marks[r][c]=2; beep(660,.08);
    if(FX) FX.burst(sparks, cellX(c), cellY(r), '#FFB21E', 8);
    if(checkWin()) finishWin();
  }
  updateStat();
}

function starsFor(){ return game.hearts>=3?3:game.hearts===2?2:1; }

function finishWin(){
  state='over';
  const st=starsFor();
  const prev=prog.stars[lvl]|0;
  if(st>prev) prog.stars[lvl]=st;
  prog.streak=(prog.streak||0)+1;
  const gain=10+st*5+(game.sp.boss?20:0)+Math.min(15,prog.streak*2);
  prog.coins+=gain;
  if(lvl>=prog.unlock && lvl<TOTAL) prog.unlock=lvl+1;
  if(prog.coins>hs){hs=prog.coins;UI.storageSet(HK,hs);}
  saveProg(prog);
  $('overH').textContent=game.sp.boss?'Boss 通关！':'领地完成！';
  $('finalScore').textContent='★'.repeat(st)+'☆'.repeat(3-st);
  $('overText').textContent=`连胜 ${prog.streak} · +${gain} 币 · 总币 ${prog.coins}`;
  show('overScr',true); beep(880,.15); setTimeout(()=>beep(1100,.2),120);
}
function finishLose(){
  state='over'; prog.streak=0; saveProg(prog);
  $('overH').textContent='挑战失败';
  $('finalScore').textContent='💔';
  $('overText').textContent='心已耗尽，再试一次吧';
  show('overScr',true); beep(180,.35,'triangle');
}

function updateStat(){
  $('score').textContent=`关 ${lvl} · ♥${game?game.hearts:3} · 币 ${prog.coins}`;
  $('hint').textContent=game&&game.sp.boss?'⚠ Boss：大棋盘 / 双猫区 · 点格放猫':'每区一只猫 · 同行同列对角不相邻';
}

function layout(){
  if(!game) return;
  const pad=12, top=28, bot=8;
  const avail=Math.min(W-pad*2, H-top-bot);
  game.cell=Math.floor(avail/game.size);
  game.ox=(W-game.cell*game.size)/2;
  game.oy=top+(H-top-bot-game.cell*game.size)/2;
}
function cellX(c){return game.ox+c*game.cell+game.cell/2;}
function cellY(r){return game.oy+r*game.cell+game.cell/2;}

function startLevel(n){
  lvl=n; game=genLevel(n); sparks=[]; layout(); setMode('cat');
  state='play'; last=performance.now();
  show('startScr',false);show('lvlScr',false);show('shopScr',false);show('tutScr',false);show('pauseOv',false);show('overScr',false);
  updateStat(); beep(660,.1);
}

let lastTap=0, lastCell=null;
function hit(p){
  if(!game||state!=='play') return;
  if(p.y>H-4) return;
  const c=Math.floor((p.x-game.ox)/game.cell);
  const r=Math.floor((p.y-game.oy)/game.cell);
  if(r<0||c<0||r>=game.size||c>=game.size) return;
  const now=performance.now();
  const key=r+','+c;
  // double-tap places cat regardless of mode
  if(lastCell===key && now-lastTap<320){
    const prev=game.mode; game.mode='cat'; placeAt(r,c); game.mode=prev; lastTap=0; lastCell=null; return;
  }
  lastTap=now; lastCell=key;
  placeAt(r,c);
}

function posOf(e){const r=cv.getBoundingClientRect();const t=(e.touches&&e.touches[0])||(e.changedTouches&&e.changedTouches[0])||e;return{x:(t.clientX-r.left)*W/r.width,y:(t.clientY-r.top)*H/r.height};}
cv.addEventListener('pointerdown',e=>{e.preventDefault();if(state!=='play')return;hit(posOf(e));});

// long-press for cat
let lpTimer=null, lpPos=null;
cv.addEventListener('pointerdown',e=>{
  lpPos=posOf(e);
  lpTimer=setTimeout(()=>{
    if(!game||state!=='play'||!lpPos) return;
    const c=Math.floor((lpPos.x-game.ox)/game.cell);
    const r=Math.floor((lpPos.y-game.oy)/game.cell);
    if(r<0||c<0||r>=game.size||c>=game.size) return;
    const prev=game.mode; game.mode='cat'; placeAt(r,c); game.mode=prev;
    lastTap=0;
  },450);
});
['pointerup','pointercancel','pointermove'].forEach(ev=>cv.addEventListener(ev,()=>{clearTimeout(lpTimer);lpTimer=null;}));

function roundRect(x,y,w,h,rr){ctx.beginPath();ctx.moveTo(x+rr,y);ctx.arcTo(x+w,y,x+w,y+h,rr);ctx.arcTo(x+w,y+h,x,y+h,rr);ctx.arcTo(x,y+h,x,y,rr);ctx.arcTo(x,y,x+w,y,rr);ctx.closePath();}

function draw(){
  if(FX) FX.stage(ctx,W,H,'#86EFAC','#166534'); else { ctx.fillStyle='#166534'; ctx.fillRect(0,0,W,H); }
  if(!game){ ctx.fillStyle='#fff'; ctx.font='18px sans-serif'; ctx.textAlign='center'; ctx.fillText('选择关卡开始',W/2,H/2); return; }
  if(game.sp.boss){ ctx.fillStyle='#FFE08A'; ctx.font='bold 14px sans-serif'; ctx.textAlign='center'; ctx.fillText('👑 Boss 关',W/2,18); }
  for(let r=0;r<game.size;r++) for(let c=0;c<game.size;c++){
    const x=game.ox+c*game.cell, y=game.oy+r*game.cell;
    const rid=game.regions[r][c];
    if(rid<0){
      ctx.fillStyle='#334155'; roundRect(x+1,y+1,game.cell-2,game.cell-2,6); ctx.fill();
      ctx.fillStyle='#94A3B8'; ctx.font=`${Math.floor(game.cell*0.35)}px sans-serif`;
      ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('⛔',cellX(c),cellY(r));
      continue;
    }
    const col=REGION_COLS[rid%REGION_COLS.length];
    if(FX) FX.tile(ctx,x+1,y+1,game.cell-2,game.cell-2,col,6);
    else { ctx.fillStyle=col; roundRect(x+1,y+1,game.cell-2,game.cell-2,6); ctx.fill(); }
    if(game.dual.includes(rid)){
      ctx.fillStyle='rgba(0,0,0,.25)'; ctx.font=`bold ${Math.floor(game.cell*0.18)}px sans-serif`;
      ctx.textAlign='left'; ctx.textBaseline='top'; ctx.fillText('×2',x+4,y+3);
    }
    const m=game.marks[r][c];
    if(m===1){
      ctx.strokeStyle='rgba(0,0,0,.55)'; ctx.lineWidth=3;
      const p=game.cell*0.28;
      ctx.beginPath(); ctx.moveTo(cellX(c)-p,cellY(r)-p); ctx.lineTo(cellX(c)+p,cellY(r)+p);
      ctx.moveTo(cellX(c)+p,cellY(r)-p); ctx.lineTo(cellX(c)-p,cellY(r)+p); ctx.stroke();
    } else if(m===2){
      ctx.font=`${Math.floor(game.cell*0.55)}px sans-serif`;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('🐱',cellX(c),cellY(r)+1);
    }
    if(game.hintCell&&game.hintCell.r===r&&game.hintCell.c===c){
      ctx.strokeStyle='#FFE08A'; ctx.lineWidth=3; ctx.strokeRect(x+3,y+3,game.cell-6,game.cell-6);
    }
  }
  // bottom hint zone drawn on canvas tip
  ctx.fillStyle='rgba(0,0,0,.2)'; roundRect(W/2-60,H-36,120,28,10); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='bold 13px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('💡 提示',W/2,H-22);
  if(FX) FX.drawBurst(ctx,sparks);
}

function frame(t){ last=t; draw(); requestAnimationFrame(frame); }
draw(); requestAnimationFrame(frame);

// hint tap on bottom of canvas
cv.addEventListener('pointerup',e=>{
  if(state!=='play'||!game) return;
  const p=posOf(e);
  if(p.y>H-40 && Math.abs(p.x-W/2)<70) useHint();
});

function tutorial(pages,done){ let i=0; function render(){ $('tutH').textContent=pages[i][0]; $('tutP').innerHTML=pages[i][1]; $('tutStep').textContent=(i+1)+' / '+pages.length; $('tutNext').textContent=i<pages.length-1?'下一步':'开始挑战'; }
  show('tutScr',true); render();
  $('tutNext').onclick=()=>{ if(i<pages.length-1){i++;render();} else {show('tutScr',false);done();} };
  $('tutSkip').onclick=()=>{show('tutScr',false);done();};
}

function openLevels(){
  show('startScr',false); show('shopScr',false); show('overScr',false); show('pauseOv',false); show('tutScr',false); show('lvlScr',true);
  const stars=Object.values(prog.stars).reduce((a,b)=>a+b,0);
  $('lvlInfo').textContent=`解锁至第 ${prog.unlock} 关 · 总星 ${stars} · 金币 ${prog.coins} · 连胜 ${prog.streak||0}`;
  const g=$('lvgrid'); g.innerHTML='';
  for(let i=1;i<=TOTAL;i++){
    const b=document.createElement('button'); b.className='btn lvl';
    const locked=i>prog.unlock; const st=prog.stars[i]|0; const boss=i%5===0;
    b.innerHTML=locked?'🔒':`${boss?'👑':''}${i}<small>${'★'.repeat(st)}${'☆'.repeat(3-st)}</small>`;
    b.disabled=locked; if(!locked) b.onclick=()=>enterLevel(i);
    g.appendChild(b);
  }
}

function enterLevel(n){
  const go=()=>startLevel(n);
  if(!prog.seenTut){ prog.seenTut=1; saveProg(prog);
    tutorial([
      ['猫咪领地','棋盘分成彩色区域，每区正好放一只猫（双猫区要两只）。'],
      ['规则','任意两只猫不能同一行或同一列，也不能对角相邻。'],
      ['操作','底部切换「标记 / 放猫」；也可双击或长按直接放猫。'],
      ['成长','连续通关有连胜奖励；商店可升级提示。']
    ], go);
  } else go();
}

function openShop(){
  show('lvlScr',false); show('shopScr',true);
  $('coinLine').textContent='金币：'+prog.coins;
  const items=[{k:'hintLv',name:'提示次数',desc:'每关免费提示 +1（当前 '+(1+prog.hintLv)+'）',cost:20+prog.hintLv*15,max:4}];
  const box=$('shopList'); box.innerHTML='';
  for(const it of items){
    const row=document.createElement('div'); row.className='row';
    const left=document.createElement('div'); left.innerHTML=`<b>${it.name}</b><br><small>${it.desc}</small>`;
    const btn=document.createElement('button'); btn.className='btn'; btn.textContent=prog[it.k]>=it.max?'已满级':`${it.cost}币`;
    btn.disabled=prog[it.k]>=it.max||prog.coins<it.cost;
    btn.onclick=()=>{ if(prog.coins<it.cost||prog[it.k]>=it.max)return; prog.coins-=it.cost; prog[it.k]++; saveProg(prog); beep(900,.1); openShop(); };
    row.appendChild(left); row.appendChild(btn); box.appendChild(row);
  }
}

function showTutOnly(){
  show('lvlScr',false);
  tutorial([
    ['猫咪领地','每块色区放正好一只猫。'],
    ['规则','同行同列不相遇，对角也不相邻。'],
    ['操作','标记 / 放猫模式；双击或长按放猫。'],
    ['成长','连胜加币；商店升级提示。']
  ], ()=>openLevels());
}

$('startBtn').onclick=()=>openLevels();
$('backStart').onclick=()=>{show('lvlScr',false);show('startScr',true);};
$('shopBtn').onclick=openShop; $('shopBack').onclick=()=>openLevels();
$('tutReopen').onclick=showTutOnly;
$('pauseBtn').onclick=()=>{ if(state==='play'){ state='pause'; show('pauseOv',true);} else if(state==='pause'){ state='play'; show('pauseOv',false);} };
$('resumeBtn').onclick=()=>{ state='play'; show('pauseOv',false); };
$('menuBtn').onclick=()=>{ show('pauseOv',false); state='menu'; openLevels(); };
$('againBtn').onclick=()=>startLevel(lvl);
$('nextBtn').onclick=()=>{ if(game&&game.hearts<=0&&!checkWin()){startLevel(lvl);return;} if(lvl<TOTAL) startLevel(lvl+1); else openLevels(); };
$('menu2Btn').onclick=()=>{ show('overScr',false); openLevels(); };
document.addEventListener('visibilitychange',()=>{ if(document.hidden && state==='play'){ state='pause'; show('pauseOv',true);} });
$('bestLine').textContent='进度：解锁 '+prog.unlock+' / '+TOTAL+' · 币 '+prog.coins;

window.__T={
  go(n){enterLevel(n);},
  win(){if(!game)return; for(const p of game.solution){game.marks[p.r][p.c]=2;} finishWin();},
  lose(){if(game){game.hearts=0;finishLose();}},
  state(){return{state,lvl,hearts:game&&game.hearts,size:game&&game.size,boss:game&&game.sp.boss,cats:game&&game.marks.flat().filter(x=>x===2).length,sol:game&&game.solution.length};}
};
