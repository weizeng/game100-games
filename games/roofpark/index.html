<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>🏃 屋顶跑酷</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{display:flex;justify-content:center;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.wrap{width:100%;max-width:480px;height:100%;padding:10px 12px 12px;display:flex;flex-direction:column;align-items:center;gap:8px}
.topbar{width:100%;display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
.topbar .tools{display:flex;gap:8px}
.topbar .tools .iconbtn{min-width:44px;min-height:44px}
#box{width:100%;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
#cv{width:100%;max-height:100%;aspect-ratio:360/480;object-fit:contain;touch-action:none;border-radius:16px;display:block}
.hint{font-size:12px;text-align:center}
.overlay{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;z-index:20;padding:22px;text-align:center;overflow:auto}
.overlay.hidden{display:none}
.overlay p{max-width:340px;font-size:14px;line-height:1.45}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:100%}
.lvgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;width:100%;max-width:360px}
.lvl{min-height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:15px;padding:3px!important;line-height:1.1}
.lvl small{font-size:10px;letter-spacing:-1px;margin-top:2px}
.lvl[disabled]{opacity:.45}
.shop{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:100%;max-width:360px}
.shop button{min-height:46px;font-size:12px!important;padding:3px!important;line-height:1.2}
.lvTag{font-size:12px;opacity:.85;max-width:360px}
#toast{position:fixed;left:50%;top:14%;transform:translate(-50%,-10px);background:rgba(10,8,30,.92);color:#fff;font-weight:800;padding:10px 18px;border-radius:999px;z-index:999;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;font-size:14px;box-shadow:0 0 18px rgba(255,207,51,.45);white-space:nowrap}
#tutPic{font-size:44px;line-height:1.1}
.hud{width:100%;display:flex;justify-content:space-between;gap:6px;font-size:12px;flex-wrap:wrap}
.panelbtns{display:flex;gap:8px;width:100%;justify-content:center;flex-wrap:wrap}
.panelbtns .btn{min-width:70px;min-height:48px;font-size:13px!important;padding:8px 10px!important}
.simtag{font-size:11px;opacity:.75}
#overStars{font-size:22px;letter-spacing:2px}
.tiltpad{position:absolute;right:8px;bottom:8px;width:96px;height:96px;border-radius:50%;background:rgba(15,39,66,.55);border:1px solid rgba(79,195,247,.35);touch-action:none;z-index:5}
.tiltpad .knob{position:absolute;left:50%;top:50%;width:36px;height:36px;margin:-18px;border-radius:50%;background:#33e1a0;box-shadow:0 0 12px rgba(51,225,160,.6);pointer-events:none;transition:transform .05s}

.ctlpad{position:absolute;left:0;right:0;bottom:6px;display:flex;justify-content:space-between;padding:0 8px;pointer-events:none;z-index:5}
.ctlpad .side,.ctlpad .acts2{display:flex;gap:8px;pointer-events:auto}
.ctlpad button{min-width:52px;min-height:52px;border-radius:14px;font-size:18px;font-weight:900;border:0;background:rgba(20,30,60,.72);color:#fff;box-shadow:0 0 0 1px rgba(0,229,255,.35);touch-action:manipulation}
.ctlpad button:active{transform:translateY(2px);opacity:.9}
</style>
<!-- GAME UI BEGIN -->
<style>
:root{--page:#172638;--surface:#22374c;--soft:#2e4760;--ink:#f0f6fc;--muted:#b1c6d9;--accent:#f0bc74;--on-accent:#342717;--line:#45637c;--stage:#142438;--page:#0b0620;--surface:#211040;--soft:#33234f;--ink:#fff3fb;--muted:#d4b6dd;--accent:#ff3d9a;--on-accent:#0b0620;--line:#ff3d9a;--b-bg1:#3a0d5e;--b-bg2:#0b0620;--b-btn:#ff3d9a;--b-btn-hi:#ff81bd;--b-edge:#a3124f;--b-glow:#00e5ff;--b-glow-rgb:0,229,255;--b-pedge-rgb:255,61,154;--b-btn-ink:#510927;--b-btn-tsh:0 1px 0 rgba(255,255,255,.45);--b-coin-ink:#510927;--b-coin-tsh:none;--b-key-ink:#00e5ff;--b-title:#ffffff}
/* Shared presentation only; mechanics and state remain inside each standalone game. */
html.game-ui{background:var(--page);color:var(--ink);color-scheme:light;font-family:"Bahnschrift","Microsoft YaHei UI","PingFang SC",sans-serif}
html.game-ui:is([data-theme="space"],[data-theme="arcade"],[data-theme="lab"],[data-theme="ocean"],[data-theme="magic"]){color-scheme:dark}
.game-ui body{background:var(--page);color:var(--ink);font-family:inherit;overscroll-behavior:none}
.game-ui body>.wrap{padding:20px 16px max(20px,env(safe-area-inset-bottom));gap:14px;max-width:500px}
.game-ui #app{background:var(--page);color:var(--ink)}
.game-ui :is(.topbar,#topbar){gap:8px;flex-wrap:wrap;min-height:58px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:10px 12px;box-shadow:0 3px 0 var(--soft);font-size:13px}
.game-ui :is(.title,.tb-title,.tb-title,#topbar .t,.topbar .t){color:var(--ink);font-size:16px;font-weight:750;letter-spacing:0}
.game-ui :is(.topbar,.hud,#hud,#topbar) :is(b,.v){color:var(--accent);font-variant-numeric:tabular-nums}
.game-ui :is(.stat,.topbar .s,.topbar .stat,.scorebar,.stats,.tip,.hint,.hintline,.hsline,.best,.hiscore){color:var(--muted);line-height:1.7}
.game-ui :is(.hint,.hintline,.tip){font-size:12px;max-width:40em;text-wrap:pretty}
.game-ui .scorebar{padding:6px 10px;gap:8px;flex-wrap:wrap}
.game-ui :is(.iconbtn,.iconBtn,.icobtn,.ibtn,.tbtn,.hbtn,.ib,.iconBtn,.pause){min-width:44px;min-height:44px;flex-shrink:0;border-radius:12px;background:var(--soft);color:var(--ink);border:1px solid var(--line);box-shadow:none;font-size:17px}
.game-ui button{font-family:inherit;cursor:pointer;touch-action:manipulation}
.game-ui button:focus-visible,.game-ui [tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.game-ui :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn){background:var(--accent);color:var(--on-accent);border:1px solid transparent;border-radius:13px;min-height:50px;padding:13px 28px;font-size:16px;font-weight:750;letter-spacing:0;box-shadow:0 4px 0 var(--line);text-shadow:none;max-width:100%}
.game-ui :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn):active{box-shadow:none;transform:translateY(2px)}
.game-ui :is(.ghost,.ghostbtn,.btn2,.abtn,.toolbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line);box-shadow:none;border-radius:12px;min-height:44px}
.game-ui :is(.rowbtns,.btnrow,.ctlrow){gap:10px;flex-wrap:wrap;justify-content:center}
.game-ui :is(.pill,.hudbox,.hud .p){background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:none;font-variant-numeric:tabular-nums}
.game-ui :is(.dbtn,.cbtn,.gbtn,.holdbtn,.firebtn,.bombbtn,.jumpbtn,.pumpbtn,.nbtn){border-radius:12px;box-shadow:0 3px 0 var(--line);min-height:44px}
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv,.screen):has(>.ui-panel){padding:20px;overflow-y:auto;overscroll-behavior:contain}
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv):has(>.ui-panel){background:var(--page);backdrop-filter:none;justify-content:safe center;align-items:center}
.game-ui .ui-panel{width:min(100%,380px);max-height:100%;overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:18px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:24px;padding:30px 24px;box-shadow:0 8px 0 var(--soft),0 20px 48px #15253618;text-align:center;margin:auto}
.game-ui .ui-panel :is(.card,.panel,.pausecard,.ovcard){display:contents}
.game-ui .ui-panel :is(h1,h2,.gamename,.gametitle){font-size:30px;line-height:1.25;font-weight:800;color:var(--ink);background:none;-webkit-text-fill-color:currentColor;text-shadow:none;letter-spacing:-.6px;margin:0}
.game-ui .ui-panel :is(p,.howto,.sub,.rule){font-size:14px;line-height:1.85;color:var(--muted);background:none;border:0;box-shadow:none;padding:0;margin:0;max-width:32em;text-align:left;white-space:normal}
.game-ui .ui-panel :is(.bigemoji,.bigemoji,.ic,.big):not(.bigscore){animation:none;filter:none;text-shadow:none}
.game-ui .ui-emblem{width:90px;height:90px;display:grid;place-items:center;border:1px solid var(--line);border-radius:28px;background:var(--soft);font-size:48px;line-height:1;flex-shrink:0;position:relative}
.game-ui[data-theme="wood"] .ui-emblem{border-radius:50%;box-shadow:inset 0 0 0 5px var(--surface),inset 0 0 0 6px var(--line)}
.game-ui[data-theme="wood"] .ui-panel h1{font-family:"STKaiti","KaiTi","Microsoft YaHei",serif;letter-spacing:2px}
.game-ui[data-theme="ice"] .ui-emblem{border-radius:26px 8px 26px 8px}
.game-ui[data-theme="space"] .ui-emblem{background:radial-gradient(circle at center,var(--soft) 42%,transparent 43%),var(--surface);border-radius:50%;outline:1px solid var(--line);outline-offset:7px;margin:7px}
.game-ui[data-theme="kitchen"] .ui-emblem{border-radius:22px;border-bottom:5px solid var(--line)}
.game-ui .ui-panel :is(.score,.bigscore,.bigScore,.scorebig){color:var(--accent);font-size:48px;font-weight:800;font-variant-numeric:tabular-nums}
.game-ui .ui-panel :is(.best,.hsline,.hiscore,.endstats,.endstats b){color:var(--muted);font-size:13px;line-height:1.8}
.game-ui .ui-mode{display:grid;grid-template-columns:1fr 1fr;gap:5px;background:var(--soft);padding:5px;border:1px solid var(--line);border-radius:14px;width:100%}
.game-ui .ui-mode button{min-height:44px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-size:14px;font-weight:700;box-shadow:none}
.game-ui .ui-mode button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 2px 5px #1525361a}
.game-ui .ui-panel .ui-mode-note{font-size:12px;line-height:1.6;text-align:center;color:var(--muted)}
.game-ui .ui-mode-status{display:block;padding:5px 10px;color:var(--accent);font-size:11px;font-weight:700;line-height:1.5;text-align:center;border:1px solid var(--line);border-radius:8px;background:var(--surface);margin:4px auto;max-width:100%;pointer-events:none}
.game-ui body>.wrap>canvas:not(#fx){background-color:var(--stage);box-shadow:0 0 0 1px var(--line),0 6px 0 var(--soft);border-radius:18px;flex-shrink:0}
.game-ui .screen>canvas.game{box-shadow:0 0 0 1px var(--line),0 6px 0 var(--soft)}
.game-ui #hud{gap:6px;background:var(--surface);color:var(--ink)}
.game-ui #hud :is(.left,.t,.s,.grp,.pill){color:var(--ink)}
.game-ui #hud .pill{background:var(--surface);border-color:var(--line)}
.game-ui body canvas:is(#cv,#game,#board){background-color:var(--stage)}
.game-ui :is(button.dbtn,button.cbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.game-ui :is(button.lvl,button.lvlbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line);border-radius:12px;min-height:54px}
.game-ui :is(button.lvl,button.lvlbtn) :is(.nc,.sz,small){color:var(--muted)}
.game-ui .ui-panel button.lvl{margin:0;min-width:44px;box-shadow:none;padding:8px}
.game-ui #hud :is(.left,.right,.hudl,.hbtns){gap:5px;flex-wrap:wrap}
.game-ui #hud :is(.left,.hudl){min-width:0;flex-shrink:1}
.game-ui #hud :is(.pill,.left){font-size:12px}
.game-ui button:disabled{cursor:default;opacity:.45;box-shadow:none}
.game-ui .ui-panel .ui-assist-note{color:var(--accent);font-weight:700}
@media(min-width:700px){.game-ui body>.wrap{padding-top:32px}.game-ui .ui-panel{padding:36px 30px}}
@media(max-width:360px){.game-ui body>.wrap{padding:10px;gap:10px}.game-ui .ui-panel{padding:22px 18px;gap:13px}.game-ui .ui-panel h1{font-size:26px}.game-ui .ui-emblem{width:70px;height:70px;font-size:38px}.game-ui :is(.topbar,#topbar){gap:5px;padding:8px}.game-ui :is(.iconbtn,.icobtn,.ibtn,.tbtn,.ib){min-width:44px;min-height:44px}}
@media(max-height:650px){.game-ui .ui-panel{padding:18px;gap:12px}.game-ui .ui-emblem{width:60px;height:60px;font-size:32px}.game-ui .ui-panel h1{font-size:25px}.game-ui .ui-panel :is(p,.howto,.sub,.rule){font-size:13px}}
@media(prefers-reduced-motion:reduce){.game-ui *, .game-ui *::before,.game-ui *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
/* 2026-10-20 热修：开局/结算遮罩铺满整屏，主按钮固定在面板底部，避免被画布尺寸裁切（#10） */
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv):has(>.ui-panel){position:fixed;inset:0;z-index:1000;border-radius:0;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
.game-ui .ui-panel{touch-action:pan-y}
.game-ui .ui-panel :is(#startBtn,#btnStart,.startbtn,#bStart,#restartBtn,#btnRestart,#againBtn,#btnAgain,#retryBtn,#btnRetry,#playBtn,#btnPlay){position:sticky;bottom:0;z-index:3;flex-shrink:0}
.game-ui .ui-panel :not(.card,.panel,.pausecard,.ovcard,.ui-mode):has(>:is(#startBtn,#btnStart,.startbtn,#bStart,#restartBtn,#btnRestart,#againBtn,#btnAgain,#retryBtn,#btnRetry,#playBtn,#btnPlay)){position:sticky;bottom:0;z-index:3;flex-shrink:0;background:var(--surface);box-shadow:0 -10px 10px -6px var(--surface)}


/* ===== Direction B · 霓虹糖果 Pop Arcade ===== saturated gradients, chunky bevels with a hard bottom edge, sticker panels, neon on dark themes */
html.game-ui[data-skin="b"]{--fb:"HarmonyOS Sans SC","MiSans","OPPOSans","vivo Sans","Noto Sans SC","Noto Sans CJK SC","PingFang SC","Microsoft YaHei UI",system-ui,sans-serif;--bounce:cubic-bezier(.34,1.56,.64,1);--bg:radial-gradient(circle at 12% 18%,rgba(255,255,255,.28) 0 38px,transparent 40px),radial-gradient(circle at 88% 30%,rgba(255,255,255,.16) 0 64px,transparent 66px),radial-gradient(circle at 20% 82%,rgba(255,255,255,.14) 0 52px,transparent 54px),radial-gradient(rgba(255,255,255,.16) 1.5px,transparent 2.2px) 0 0/22px 22px,linear-gradient(165deg,var(--b-bg1),var(--b-bg2));font-family:var(--fb)}
html.game-ui[data-skin="b"],html.game-ui[data-skin="b"] body,html.game-ui[data-skin="b"] #app,html.game-ui[data-skin="b"] :is(.overlay,.ov,#ov,#overlay,#pauseOv):has(>.ui-panel){background:var(--bg);background-color:var(--b-bg2)}
html.game-ui[data-skin="b"] body{min-height:100vh;font-family:var(--fb)}
html.game-ui[data-skin="b"] :is(.hint,.hintline,.tip){color:rgba(255,255,255,.94);text-shadow:0 1px 2px rgba(0,0,0,.35)}
/* Sticker panel: white rim + hard coloured bottom edge + drop */
html.game-ui[data-skin="b"] .ui-panel{background:linear-gradient(180deg,var(--surface),var(--soft));border:4px solid #fff;border-radius:32px;box-shadow:0 9px 0 var(--line),0 9px 0 4px rgba(0,0,0,.08),0 26px 40px rgba(0,0,0,.28);animation:uiB-in .5s var(--bounce) both}
html.game-ui[data-skin="b"] .ui-panel :is(h1,h2,.gamename,.gametitle){font-size:34px;font-weight:900;color:var(--b-title);letter-spacing:0;text-shadow:0 3px 0 var(--line),0 6px 10px rgba(0,0,0,.15)}
html.game-ui[data-skin="b"] .ui-emblem{width:100px;height:100px;border:4px solid #fff;border-radius:50%;background:radial-gradient(circle at 32% 26%,#fff 0 12%,var(--b-glow) 13%,var(--line) 70%,var(--b-edge) 100%);box-shadow:0 7px 0 var(--b-edge),0 16px 24px rgba(0,0,0,.25);font-size:54px;animation:uiB-wobble 2.6s ease-in-out infinite}
html.game-ui[data-skin="b"] .ui-emblem::before,html.game-ui[data-skin="b"] .ui-emblem::after{content:"✦";position:absolute;color:#fff;font-size:20px;text-shadow:0 0 8px var(--b-glow);animation:uiB-twinkle 1.8s ease-in-out infinite}
html.game-ui[data-skin="b"] .ui-emblem::before{top:-10px;right:-14px}
html.game-ui[data-skin="b"] .ui-emblem::after{bottom:4px;left:-18px;font-size:14px;animation-delay:.9s}
html.game-ui[data-skin="b"] .ui-panel :is(.score,.bigscore,.bigScore,.scorebig,#finalScore){font-size:56px;font-weight:900;color:var(--b-btn);-webkit-text-fill-color:currentColor;text-shadow:0 4px 0 var(--b-edge),0 0 2px var(--b-edge),0 10px 16px rgba(0,0,0,.25)}
html.game-ui[data-skin="b"] .ui-panel :is(h1,.gamename)~h2{font-size:19px;text-shadow:0 2px 0 var(--line)}
/* Chunky bevelled button: highlight lip, darker bottom slab, presses down onto the slab */
html.game-ui[data-skin="b"] :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn,button.actBtn):not(.ghost){position:relative}
html.game-ui[data-skin="b"] :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn,button.actBtn):not(.ghost):not(#\#){overflow:hidden;border:0;border-radius:20px;font-weight:900;color:var(--b-btn-ink);background:linear-gradient(180deg,var(--b-btn-hi),var(--b-btn) 52%);text-shadow:var(--b-btn-tsh);box-shadow:inset 0 3px 0 rgba(255,255,255,.55),inset 0 -5px 0 rgba(0,0,0,.14),0 6px 0 var(--b-edge),0 12px 18px rgba(0,0,0,.25);transition:transform .08s,box-shadow .08s}
html.game-ui[data-skin="b"] :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn,button.actBtn):not(.ghost):not(#\#)::before{content:"";position:absolute;left:12px;top:6px;width:22px;height:9px;border-radius:9px;background:rgba(255,255,255,.75);transform:rotate(-12deg);pointer-events:none}
html.game-ui[data-skin="b"] :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn,button.actBtn):not(.ghost):not(#\#):active{transform:translateY(5px);box-shadow:inset 0 3px 0 rgba(255,255,255,.4),inset 0 -2px 0 rgba(0,0,0,.14),0 1px 0 var(--b-edge),0 4px 8px rgba(0,0,0,.2)}
html.game-ui[data-skin="b"] .ui-panel :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn,button.actBtn):not(.ghost):not(#\#){min-height:56px;padding:14px 34px;font-size:19px;letter-spacing:1px}
/* Secondary keys: white candy keys with a coloured slab */
html.game-ui[data-skin="b"] :is(.ghost,.ghostbtn,.btn2,.abtn,.toolbtn,.iconbtn,.iconBtn,.icobtn,.ibtn,.tbtn,.hbtn,.ib,.pause,.dbtn,.cbtn,.nbtn,.lvl,.lvlbtn){border:0;border-radius:16px;background:linear-gradient(180deg,#fff,var(--soft));color:var(--b-key-ink);font-weight:900;box-shadow:inset 0 -3px 0 rgba(0,0,0,.06),0 5px 0 var(--line),0 8px 12px rgba(0,0,0,.18);transition:transform .08s,box-shadow .08s}
html.game-ui[data-skin="b"] :is(.ghost,.ghostbtn,.btn2,.abtn,.toolbtn,.iconbtn,.iconBtn,.icobtn,.ibtn,.tbtn,.hbtn,.ib,.pause,.dbtn,.cbtn,.nbtn,.lvl,.lvlbtn):active{transform:translateY(4px);box-shadow:0 1px 0 var(--line),0 2px 4px rgba(0,0,0,.15)}
html.game-ui[data-skin="b"] :is(.dbtn,.lvl,.lvlbtn):is(.on,.sel,[aria-pressed="true"]){background:linear-gradient(180deg,var(--b-btn-hi),var(--b-btn));color:var(--b-btn-ink);text-shadow:var(--b-coin-tsh);box-shadow:0 5px 0 var(--b-edge),0 8px 12px rgba(0,0,0,.18)}
html.game-ui[data-skin="b"] .ui-mode{background:rgba(0,0,0,.08);border:0;border-radius:18px;padding:5px;box-shadow:inset 0 3px 0 rgba(0,0,0,.08)}

/* HUD: candy capsule bar, numbers in coin badges */

    const fan=new THREE.Mesh(new THREE.CylinderGeometry(.28,.28,.08,12),mat(0x455a64,0x102028));fan.position.y=.82;fan.rotation.x=Math.PI/2;g.add(fan);
    g.userData.hitH=.9;g.userData.needJump=true;
  }else if(kind==='vent'){
    const v=new THREE.Mesh(new THREE.BoxGeometry(.7,.55,.7),mat(0x78909c,0x203040));v.position.y=.35;g.add(v);
    g.userData.hitH=.7;g.userData.needJump=true;
  }else if(kind==='pipe'){
    const p=new THREE.Mesh(new THREE.CylinderGeometry(.12,.12,5.2,10),mat(0xff8a65,0x402010,.4,.3));
    p.rotation.z=Math.PI/2;p.position.set(0,1.55,0);g.add(p);
    g.userData.hitH=1.7;g.userData.needSlide=true;g.userData.lowOnly=true;
  }else if(kind==='beam'){
    const b=new THREE.Mesh(new THREE.BoxGeometry(5.6,.18,.35),mat(0xffcf33,0x443300,.5,.2));b.position.y=1.45;g.add(b);
    g.userData.hitH=1.55;g.userData.needSlide=true;g.userData.lowOnly=true;
  }else if(kind==='gap'){
    // visual hole marker: darker strip (collision handled as missing roof / fall)
    const hole=new THREE.Mesh(new THREE.BoxGeometry(2.2,.05,2.4),mat(0x0e1628,0x050810));hole.position.y=.02;g.add(hole);
    g.userData.isGap=true;g.userData.hitH=0;
  }else if(kind==='bossGate'){
    const a=new THREE.Mesh(new THREE.BoxGeometry(1.1,1.2,.5),mat(0xff3d9a,0x400020));a.position.set(-1.2,.7,0);g.add(a);
    const b=new THREE.Mesh(new THREE.BoxGeometry(1.1,1.2,.5),mat(0xff3d9a,0x400020));b.position.set(1.2,.7,0);g.add(b);
    const top=new THREE.Mesh(new THREE.BoxGeometry(3.6,.25,.5),mat(0x00e5ff,0x004050));top.position.y=1.45;g.add(top);
    g.userData.hitH=1.3;g.userData.needSlide=true;g.userData.lowOnly=true;
  }
  g.position.set(x,0,z);scene.add(g);props.push(g);return g;
}
function makeCoin(laneI,z){
  const c=new THREE.Mesh(new THREE.CylinderGeometry(.22,.22,.08,12),mat(0xffd54f,0x664400,.3,.4));
  c.rotation.x=Math.PI/2;c.position.set(LANES[laneI],1.1,z);scene.add(c);coins.push(c);return c;
}

function recycleFar(){
  for(const m of roofs){if(m.position.z<RUN_Z-VIEW_BACK){m.position.z+=VIEW_BACK+VIEW_AHEAD+rnd(0,6);}}
}

function makeLevel(i){
  clearWorld();bossMode=[4,9,14].includes(i)?(i===4?1:i===9?2:3):0;
  scene=new THREE.Scene();
  scene.background=bossMode===2?0x1a2848:0x1a2840;
  scene.add(new THREE.AmbientLight(0xb8c8e0,.75));
  const sun=new THREE.DirectionalLight(0xffe6c8,1.1);sun.position.set(5,18,6);scene.add(sun);
  scene.add(new THREE.HemisphereLight(bossMode===2?0x6aa0ff:0xffc8a0,0x1a2840,.5));
  // continuous roof segments
  const roofW=8.2;
  for(let k=0;k<8;k++){
    const z=RUN_Z-8+k*14;
    addRoof(z,roofW,14,k%2?0x708090:0x627484);
  }
  // side buildings (cityscape)
  for(let z=RUN_Z-6;z<RUN_Z+VIEW_AHEAD+20;z+=5+Math.random()*3){
    addBuildingSide(-6.5-rnd(0,1),z,4+rnd(2,8));
    addBuildingSide(6.5+rnd(0,1),z,4+rnd(2,8));
  }

  runner=makeHumanoid();runner.position.set(0,0,RUN_Z);scene.add(runner);
  camera=new THREE.PerspectiveCamera(52,W/H,.1,110);
  camera.position.set(0,3.8,RUN_Z-8.5);camera.lookAt(0,1.4,RUN_Z+10);

  score=0;dist=0;combo=0;maxCombo=0;hits=0;lives=3+Kit.up('life');
  lane=1;targetLane=1;vx=0;vy=0;onGround=true;sliding=0;jumpCD=0;invuln=0;spawnZ=RUN_Z+18;runPhase=0;
  goalDist=180+i*28+(bossMode?60:0)+Kit.up('goal')*25;
  ended=false;$('score').textContent=0;props=[];coins=[];

  // seed obstacles
  let seed=300+i*131;
  function R(){seed^=seed<<13;seed^=seed>>>17;seed^=seed<<5;return (seed>>>0)/4294967296;}
  let z=RUN_Z+16;
  const dens=1.1+i*.08+(bossMode?0.35:0);
  while(z<RUN_Z+VIEW_AHEAD+40){
    const roll=R();
    const li=(R()*3)|0;
    if(roll<.18){makeProp('gap',1,z);z+=3.2+R();}
    else if(roll<.4){makeProp(R()<.5?'ac':'vent',li,z);if(R()<.45)makeCoin((li+1)%3,z+1.2);z+=2.6/dens+R();}
    else if(roll<.65){makeProp(R()<.5?'pipe':'beam',li,z);z+=2.8/dens+R();}
    else if(roll<.8){makeCoin(li,z);makeCoin((li+1)%3,z+1.5);z+=2.2/dens;}
    else{makeProp('ac',li,z);makeProp('pipe',(li+2)%3,z+2.5);z+=3.4/dens;}
    if(bossMode===1&&R()<.25)makeProp('ac',(li+1)%3,z+.8);
    if(bossMode===3&&R()<.2)makeProp('bossGate',1,z);
  }
  if(bossMode){for(let k=0;k<3;k++)makeProp('bossGate',1,RUN_Z+28+k*18);}
}

function spawnAhead(){
  const z=RUN_Z+VIEW_AHEAD+rnd(2,10);
  const kinds=bossMode===3?['ac','vent','pipe','beam','bossGate','gap']:['ac','vent','pipe','beam','gap'];
  const kind=kinds[(Math.random()*kinds.length)|0];
  const li=(Math.random()*3)|0;
  makeProp(kind,kind==='gap'||kind==='bossGate'?1:li,z);
  if(Math.random()<.5)makeCoin((li+1)%3,z+rnd(1,3));
  // extend roofs
  if(roofs.length){
    let maxZ=-1e9;for(const m of roofs)if(m.position.z>maxZ)maxZ=m.position.z;
    if(maxZ<RUN_Z+VIEW_AHEAD+20)addRoof(maxZ+14,8.2,14,Math.random()<.5?0x708090:0x627484);
  }
}

function init3(){renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true});layout();bindControls();}
function layout(){const b=$('box').getBoundingClientRect();let bw=b.width,bh=b.height;
  if(bw<40||bh<40){bw=Math.min(360,window.innerWidth-24);bh=Math.min(480,window.innerHeight*0.55);}
  const s=Math.min(bw/W,bh/H);const cw=Math.max(2,Math.floor(W*s)),ch=Math.max(2,Math.floor(H*s));
  cv.style.width=cw+'px';cv.style.height=ch+'px';if(renderer){renderer.setSize(cw,ch,false);if(camera)camera.aspect=W/H;}}
addEventListener('resize',layout);

function bindControls(){
  const set=(k,v)=>()=>{keys[k]=v;};
  // rebound each start via acts buttons + permanent pad
  document.addEventListener('keydown',e=>{
    if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A'){targetLane=Math.max(0,targetLane-1);keys.L=1;}
    if(e.key==='ArrowRight'||e.key==='d'||e.key==='D'){targetLane=Math.min(2,targetLane+1);keys.R=1;}
    if(e.key==='ArrowUp'||e.key==='w'||e.key===' '||e.key==='W')tryJump();
    if(e.key==='ArrowDown'||e.key==='s'||e.key==='S')trySlide();
  });
  // swipe on canvas
  let sx=0,sy=0,sid=null;
  cv.addEventListener('pointerdown',e=>{sid=e.pointerId;sx=e.clientX;sy=e.clientY;try{cv.setPointerCapture(e.pointerId);}catch(_){}});
  cv.addEventListener('pointerup',e=>{
    if(sid!==e.pointerId)return;sid=null;
    const dx=e.clientX-sx,dy=e.clientY-sy;
    if(Math.hypot(dx,dy)<24)return;
    if(Math.abs(dx)>Math.abs(dy)){targetLane=Math.max(0,Math.min(2,targetLane+(dx>0?1:-1)));Kit.sfx('tap');}
    else if(dy<0)tryJump();else trySlide();
  });
}

function tryJump(){
  if(ended||Kit.state!=='play')return;
  if(onGround&&jumpCD<=0&&sliding<=0){vy=7.2+Kit.up('jmp')*.6;onGround=false;sliding=0;jumpCD=.15;Kit.sfx('tap');}
}
function trySlide(){
  if(ended||Kit.state!=='play')return;
  if(onGround&&sliding<=0){sliding=.55+Kit.up('sld')*.12;Kit.sfx('tap');}
}

function scrollWorld(dz){
  for(const m of roofs)m.position.z-=dz;
  for(const m of props)m.position.z-=dz;
  for(const m of coins)m.position.z-=dz;
  recycleFar();
}

function hitPlayer(msg){
  if(invuln>0)return;
  hits++;lives--;combo=0;invuln=1.1;Kit.sfx('bad');Kit.toast(lives>0?(msg||'撞到了！'):'出局');
  if(lives<=0)lose('撞障太多，坠落街头');
}

function updHud(){
  const left=Math.max(0,goalDist-dist);
  $('hud').innerHTML='<span>关卡 <b>'+(Kit.lv+1)+'/15</b></span><span>距终点 <b>'+Math.ceil(left)+'m</b></span><span>命 <b>'+'❤️'.repeat(Math.max(0,lives))+'</b></span><span>连击 <b>'+combo+'</b></span>';
}

function step(dt){
  if(ended||Kit.state!=='play'||!runner)return;
  invuln=Math.max(0,invuln-dt);jumpCD=Math.max(0,jumpCD-dt);
  if(sliding>0)sliding=Math.max(0,sliding-dt);

  // lane lerp
  const tx=LANES[targetLane];
  lane+=(tx-lane)*Math.min(1,dt*(12+Kit.up('spd')));
  const spd=9.5+Kit.lv*.35+(bossMode===3?2.2:bossMode?1:0)+Kit.up('spd')*.8;
  const dz=spd*dt;
  dist+=dz;score+=Math.floor(dz*2);$('score').textContent=score|0;

  scrollWorld(dz);
  // gravity
  if(!onGround){vy-=22*dt;runner.userData.baseY=(runner.userData.baseY||0)+vy*dt;
    if(runner.userData.baseY<=0){runner.userData.baseY=0;vy=0;onGround=true;}}
  else runner.userData.baseY=0;

  runner.position.x=lane;runner.position.z=RUN_Z;
  resetPoseScale(runner);
  if(sliding>0){poseSlide(runner);runner.position.y=(runner.userData.baseY||0)-.15;}
  else if(!onGround){poseJump(runner);runner.position.y=runner.userData.baseY||0;}
  else{runPhase+=dt*spd*1.6;poseRun(runner,runPhase,spd);runner.position.y=runner.userData.baseY||0;}

  camera.position.set(lane*0.45,3.6+(sliding>0?-0.2:0)+Math.min(0.6,(runner.userData.baseY||0)*.15),RUN_Z-8.2);
  camera.lookAt(lane*0.3,1.3+(runner.userData.baseY||0)*.2,RUN_Z+12);

  // recycle/spawn props
  for(let i=props.length-1;i>=0;i--){
    const p=props[i];
    if(p.position.z<RUN_Z-VIEW_BACK){scene.remove(p);props.splice(i,1);continue;}
    // collision
    const dzp=p.position.z-RUN_Z;
    if(Math.abs(dzp)<.85){
      const sameLane=Math.abs(p.position.x-lane)<1.05 || p.userData.kind==='pipe'||p.userData.kind==='beam'||p.userData.kind==='bossGate'||p.userData.isGap;
      if(!sameLane)continue;
      if(p.userData.isGap){
        if(onGround||(runner.userData.baseY||0)<0.6){hitPlayer('掉进缝隙！');props.splice(i,1);scene.remove(p);if(ended)return;}
        else{combo++;maxCombo=Math.max(maxCombo,combo);score+=40+combo*5;$('score').textContent=score|0;Kit.sfx('ok');props.splice(i,1);scene.remove(p);}
        continue;
      }
      if(p.userData.needSlide||p.userData.lowOnly){
        if(sliding>0){combo++;maxCombo=Math.max(maxCombo,combo);score+=35+combo*4;$('score').textContent=score|0;Kit.sfx('ok');props.splice(i,1);scene.remove(p);}
        else{hitPlayer('低头滑铲！');props.splice(i,1);scene.remove(p);if(ended)return;}
        continue;
      }
      if(p.userData.needJump){
        if(!onGround&&(runner.userData.baseY||0)>.55){combo++;maxCombo=Math.max(maxCombo,combo);score+=30+combo*4;$('score').textContent=score|0;Kit.sfx('ok');props.splice(i,1);scene.remove(p);}
        else{hitPlayer('跳过障碍！');props.splice(i,1);scene.remove(p);if(ended)return;}
        continue;
      }
    }
  }
  for(let i=coins.length-1;i>=0;i--){
    const c=coins[i];
    if(c.position.z<RUN_Z-VIEW_BACK){scene.remove(c);coins.splice(i,1);continue;}
    c.rotation.z+=dt*4;
    if(Math.abs(c.position.z-RUN_Z)<.7&&Math.abs(c.position.x-lane)<.85&&(runner.userData.baseY||0)<1.6){
      coins.splice(i,1);scene.remove(c);score+=25;combo++;maxCombo=Math.max(maxCombo,combo);Kit.sfx('coin');$('score').textContent=score|0;
    }
  }
  spawnZ-=dz;if(spawnZ<=0){spawnZ=2.2+Math.random()*1.4-(bossMode?0.4:0);spawnAhead();}

  if(dist>=goalDist){win();return;}
  updHud();
}
function win(){if(ended)return;ended=true;running=false;
  const sc=Math.max(0,Math.round(score+lives*50+maxCombo*12+Kit.lv*25-hits*20));
  let st=1;if(hits<=2)st=2;if(hits<=1&&maxCombo>=6&&lives>=2)st=3;
  Kit.win(sc,st,'跑完 '+Math.floor(dist)+'m · 连击 '+maxCombo+' · 撞障 '+hits+'<br>人形跑者穿梭霓虹屋顶。');}
function lose(m){if(ended)return;ended=true;running=false;Kit.lose(Math.round(score*.35+dist*.2),m);}
function loop(t){if(!running||Kit.state!=='play')return;const dt=Math.min(.033,(t-last)/1000);last=t;step(dt);
  if(renderer&&scene&&camera)renderer.render(scene,camera);raf=requestAnimationFrame(loop);}
function wirePad(){
  const L=$('btnL'),R=$('btnR'),J=$('btnJ'),S=$('btnS');
  if(L){L.onpointerdown=()=>{targetLane=Math.max(0,targetLane-1);Kit.sfx('tap');};}
  if(R){R.onpointerdown=()=>{targetLane=Math.min(2,targetLane+1);Kit.sfx('tap');};}
  if(J){J.onpointerdown=()=>tryJump();}
  if(S){S.onpointerdown=()=>trySlide();}
}
function start(i){if(!renderer)init3();layout();makeLevel(i);running=true;ended=false;last=performance.now();
  $('hint').textContent=bossMode===1?'👑 密集空调：连续跳跃':bossMode===2?'👑 夜色横梁：多滑铲':bossMode===3?'👑 终极大门：跳滑连招':'左右变道，跳过空调，滑过横管。';
  $('acts').innerHTML='';
  let pad=$('ctlPad');if(!pad){pad=document.createElement('div');pad.id='ctlPad';pad.className='ctlpad';
    pad.innerHTML='<div class="side"><button type="button" id="btnL" aria-label="左">◀</button><button type="button" id="btnR" aria-label="右">▶</button></div><div class="acts2"><button type="button" id="btnJ" aria-label="跳">⬆跳</button><button type="button" id="btnS" aria-label="滑">⬇滑</button></div>';
    $('box').appendChild(pad);}
  wirePad();updHud();raf=requestAnimationFrame(loop);}
function stop(){running=false;cancelAnimationFrame(raf);ended=true;}
Kit.init({id:'roofpark',levels:15,boss:[5,10,15],bossName:i=>i===4?'密集空调阵':i===9?'夜色横梁雨':'终极大门冲刺',
  start,stop,pause:()=>{running=false;},resume:()=>{if(!ended){running=true;last=performance.now();raf=requestAnimationFrame(loop);}},
  note:()=>'Three.js 三维屋顶跑酷 · 人形跑者',
  tut:[['变道','点左右键或左右滑，在三道屋顶间切换。','◀️▶️'],['跳跃','跳过空调外机与通风口，别硬撞。','⬆'],['滑铲','滑过横管与横梁；站着会撞头。','⬇'],['Boss','第5/10/15关障碍更密，连击加分更高。','👑']],
  ups:[{k:'spd',ic:'🚀',name:'加速',max:2,cost:l=>26+l*24},{k:'jmp',ic:'⬆️',name:'弹跳',max:2,cost:l=>28+l*24},{k:'sld',ic:'⬇️',name:'滑铲',max:2,cost:l=>28+l*24},{k:'life',ic:'❤️',name:'额外命',max:2,cost:l=>32+l*28,stars:4},{k:'goal',ic:'🏁',name:'缩程',max:2,cost:l=>30+l*26,stars:6}]});

</script>
</body>
</html>
