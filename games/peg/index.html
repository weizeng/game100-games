<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>孔明棋</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:linear-gradient(160deg,#3d2b12 0%,#121212 55%,#0a0a0a 100%);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;display:flex;justify-content:center;min-height:100vh;touch-action:manipulation;-webkit-user-select:none;user-select:none;overflow-x:hidden}
.wrap{width:100%;max-width:480px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:10px;position:relative;z-index:1}
.topbar{width:100%;display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:9px 12px;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.topbar .title{font-weight:700;font-size:16px}
.topbar .stat{color:#e8d3a1;font-size:13px}
.topbar .stat b{color:#fff;font-size:15px}
.tbtn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:#fff;font-size:16px;min-width:38px;height:38px;border-radius:11px;cursor:pointer;transition:transform .08s}
.tbtn:active{transform:scale(.9)}
.screen{width:100%;display:none;flex-direction:column;align-items:center;gap:12px}
.screen.on{display:flex}
.card{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:20px;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.card h1{font-size:26px;margin-bottom:6px;background:linear-gradient(90deg,#fcd34d,#fbbf24);-webkit-background-clip:text;background-clip:text;color:transparent}
.card h2{font-size:22px;margin-bottom:8px}
.card p{color:#e8d3a1;font-size:14px;line-height:1.7;margin-bottom:10px}
.bigbtn{background:linear-gradient(135deg,#d97706,#f59e0b);border:none;color:#2a1a05;font-size:18px;font-weight:700;padding:14px 46px;border-radius:999px;cursor:pointer;box-shadow:0 6px 18px rgba(217,119,6,.45);transition:transform .1s}
.bigbtn:active{transform:scale(.93)}
.ghostbtn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#fff;font-size:14px;padding:10px 22px;border-radius:999px;cursor:pointer;transition:transform .1s}
.ghostbtn:active{transform:scale(.93)}
#board{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;width:100%;max-width:400px;background:linear-gradient(135deg,#5a3d1a,#3d2a12);padding:14px;border-radius:18px;box-shadow:0 8px 24px rgba(0,0,0,.5);touch-action:none}
.hole{aspect-ratio:1;border-radius:50%;position:relative;cursor:pointer;transition:transform .08s}
.hole:active{transform:scale(.9)}
.hole.void{background:transparent;cursor:default}
.hole.empty{background:rgba(0,0,0,.45);box-shadow:inset 0 2px 6px rgba(0,0,0,.6)}
.hole.peg{background:radial-gradient(circle at 35% 30%,#fde68a,#d97706 70%,#92400e);box-shadow:0 3px 8px rgba(0,0,0,.5)}
.hole.sel{outline:3px solid #ffd76a;outline-offset:2px}
.hole.target{outline:3px dashed #4ade80;outline-offset:2px}
.toolbar{display:flex;gap:10px}
.best{color:#ffd76a;font-size:14px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
.float{position:fixed;pointer-events:none;z-index:60;font-weight:700;font-size:18px;animation:floatup 1.1s ease-out forwards}
@keyframes floatup{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-46px)}}
#pauseov{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:40;backdrop-filter:blur(4px)}
#pauseov.on{display:flex}
.pausecard{background:#1c1c22;border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:28px 36px;text-align:center;display:flex;flex-direction:column;gap:12px}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="wrap">
  <div class="topbar">
    <span class="title">♟ 孔明棋</span>
    <span class="stat">剩余 <b id="left">32</b> 子</span>
    <span><button class="tbtn" id="sndBtn">🔊</button><button class="tbtn" id="pauseBtn">⏸</button></span>
  </div>
  <div class="screen on" id="s-start">
    <div class="card">
      <h1>♟ 孔明棋</h1>
      <p>英式 33 格棋盘，开局中央空一格。<br>点一枚棋子，再点隔一格的空位：<br>跳过中间的棋子并把它吃掉！<br>目标：最后只剩 <b>1</b> 枚棋子。支持悔棋。</p>
      <button class="bigbtn" id="btnStart">开始对弈</button>
    </div>
  </div>
  <div class="screen" id="s-game">
    <div id="board"></div>
    <div class="toolbar">
      <button class="ghostbtn" id="btnUndo">↩ 悔一步</button>
      <button class="ghostbtn" id="btnReset">🔄 重来</button>
    </div>
  </div>
  <div class="screen" id="s-end">
    <div class="card">
      <h2 id="endTitle">🎉 完美收官！</h2>
      <p id="endInfo"></p>
      <p class="best" id="endBest"></p>
      <div style="display:flex;gap:10px;justify-content:center"><button class="bigbtn" id="btnAgain">再来一局</button><button class="ghostbtn" id="btnHome">返回</button></div>
    </div>
  </div>
</div>
<div id="pauseov"><div class="pausecard"><h2>⏸ 已暂停</h2><button class="bigbtn" id="btnResume">继续</button><button class="ghostbtn" id="btnQuit">退出</button></div></div>
<script>
"use strict";
var $=function(id){return document.getElementById(id)};
var store={get:function(k,d){try{var v=localStorage.getItem("peg_"+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set:function(k,v){try{localStorage.setItem("peg_"+k,JSON.stringify(v))}catch(e){}}};
var AC=null,soundOn=store.get("sound",true);
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==="suspended"){AC.resume()}return AC}
function tone(f,dur,type,vol,when){if(!soundOn)return;var c=ac();if(!c)return;try{var o=c.createOscillator(),g=c.createGain();o.type=type||"sine";o.frequency.value=f;g.gain.setValueAtTime(vol||.13,c.currentTime+(when||0));g.gain.exponentialRampToValueAtTime(.001,c.currentTime+(when||0)+(dur||.1));o.connect(g);g.connect(c.destination);o.start(c.currentTime+(when||0));o.stop(c.currentTime+(when||0)+(dur||.1)+.02)}catch(e){}}
var sClick=function(){tone(520,.07,"triangle")},sJump=function(){tone(620,.08,"sine");tone(930,.12,"sine",.13,.07)},sErr=function(){tone(170,.14,"sawtooth",.09)},sWin=function(){[523,659,784,1046,1318].forEach(function(f,i){tone(f,.2,"sine",.15,i*.1)})};
var fx=$("fx"),fctx=fx.getContext("2d"),parts=[];
function fxSize(){fx.width=innerWidth;fx.height=innerHeight}addEventListener("resize",fxSize);fxSize();
function burst(x,y,color,n){for(var i=0;i<(n||14);i++)parts.push({x:x,y:y,vx:(Math.random()-.5)*7,vy:(Math.random()-.5)*7-2,life:1,color:color||"#fbbf24",r:2+Math.random()*3})}
(function fxLoop(){fctx.clearRect(0,0,fx.width,fx.height);parts=parts.filter(function(p){return p.life>0});parts.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=.22;p.life-=.028;fctx.globalAlpha=Math.max(0,p.life);fctx.fillStyle=p.color;fctx.beginPath();fctx.arc(p.x,p.y,p.r,0,7);fctx.fill()});fctx.globalAlpha=1;requestAnimationFrame(fxLoop)})();
/* ---------- 棋盘：英式 7x7，四角 2x2 挖空 ---------- */
function valid(r,c){if(r<0||r>6||c<0||c>6)return false;var corner=(r<2||r>4)&&(c<2||c>4);return !corner}
var board,sel,hist,over;
function init(){board=[];for(var r=0;r<7;r++){board.push([]);for(var c=0;c<7;c++){board[r].push(!valid(r,c)?-1:((r===3&&c===3)?0:1))}}sel=null;hist=[];over=false;$("left").textContent=32;render()}
function movesFrom(r,c){var m=[],d=[[0,2],[0,-2],[2,0],[-2,0]];for(var i=0;i<4;i++){var nr=r+d[i][0],nc=c+d[i][1],mr=r+d[i][0]/2,mc=c+d[i][1]/2;if(valid(nr,nc)&&board[nr][nc]===0&&board[mr][mc]===1)m.push([nr,nc,mr,mc])}return m}
function anyMove(){for(var r=0;r<7;r++)for(var c=0;c<7;c++)if(board[r][c]===1&&movesFrom(r,c).length)return true;return false}
function count(){var n=0;for(var r=0;r<7;r++)for(var c=0;c<7;c++)if(board[r][c]===1)n++;return n}
function render(){var b=$("board");b.innerHTML="";for(var r=0;r<7;r++)for(var c=0;c<7;c++){var v=board[r][c],d=document.createElement("div");if(v<0){d.className="hole void"}else{d.className="hole "+(v?"peg":"empty");if(sel&&sel[0]===r&&sel[1]===c)d.classList.add("sel");if(sel&&v===0){var ms=movesFrom(sel[0],sel[1]);for(var i=0;i<ms.length;i++)if(ms[i][0]===r&&ms[i][1]===c)d.classList.add("target")}
 (function(rr,cc){var press=function(e){if(e)e.preventDefault();tap(rr,cc)};d.addEventListener("touchstart",press,{passive:false});d.addEventListener("mousedown",press)})(r,c)}b.appendChild(d)}}
function tap(r,c){if(over)return;var v=board[r][c];if(v<0)return;
 if(sel){var ms=movesFrom(sel[0],sel[1]),ok=null;for(var i=0;i<ms.length;i++)if(ms[i][0]===r&&ms[i][1]===c)ok=ms[i];
  if(ok){hist.push([sel[0],sel[1],r,c]);board[sel[0]][sel[1]]=0;board[ok[2]][ok[3]]=0;board[r][c]=1;sel=null;sJump();
   var el=$("board").children[r*7+c],rc=el.getBoundingClientRect();burst(rc.left+rc.width/2,rc.top+rc.height/2,"#fbbf24",12);
   $("left").textContent=count();render();
   if(!anyMove())finish();return}}
 if(v===1){if(!movesFrom(r,c).length){sErr();return}sel=[r,c];sClick();render()}
 else{sel=null;sClick();render()}}
function undo(){if(!hist.length||over){sClick();return}var m=hist.pop();board[m[0]][m[1]]=1;board[(m[0]+m[2])/2][(m[1]+m[3])/2]=1;board[m[2]][m[3]]=0;sel=null;$("left").textContent=count();sClick();render()}
function finish(){over=true;var n=count();sWin();for(var i=0;i<6;i++)setTimeout(function(){burst(innerWidth/2+(Math.random()-.5)*260,innerHeight/3+(Math.random()-.5)*160,["#ffd76a","#fbbf24","#4ade80"][i%3],24)},i*120);
 var score=Math.max(0,Math.round((33-n)*100-(n>1?(n-1)*300:0)));
 var best=store.get("best",null),nb=false;if(best==null||score>best){store.set("best",score);nb=true}
 setTimeout(function(){$("endTitle").textContent=n===1?"🎉 完美收官！只剩 1 子！":"🏁 对弈结束";$("endInfo").textContent="剩余 "+n+" 枚棋子 · 得分 "+score;$("endBest").textContent=nb?"🏆 新纪录！":"历史最高 "+best;show("s-end")},700)}
function show(id){["s-start","s-game","s-end"].forEach(function(s){$(s).classList.toggle("on",s===id)})}
$("btnStart").onclick=function(){sClick();init();show("s-game")};
$("btnReset").onclick=function(){sClick();init()};
$("btnUndo").onclick=function(){undo()};
$("btnAgain").onclick=function(){sClick();init();show("s-game")};
$("btnHome").onclick=function(){sClick();show("s-start")};
$("sndBtn").onclick=function(){soundOn=!soundOn;store.set("sound",soundOn);$("sndBtn").textContent=soundOn?"🔊":"🔇";if(soundOn)sClick()};
$("sndBtn").textContent=soundOn?"🔊":"🔇";
$("pauseBtn").onclick=function(){if(!$("s-game").classList.contains("on"))return;sClick();$("pauseov").classList.add("on")};
$("btnResume").onclick=function(){sClick();$("pauseov").classList.remove("on")};
$("btnQuit").onclick=function(){sClick();$("pauseov").classList.remove("on");show("s-start")};
</script>
</body>
</html>
