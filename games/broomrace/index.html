<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>扫帚夜行</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:linear-gradient(165deg,#0a1230 0%,#0d1b4c 45%,#05081a 100%);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;display:flex;justify-content:center;min-height:100vh;touch-action:manipulation;-webkit-user-select:none;user-select:none;overflow-x:hidden}
.wrap{width:100%;max-width:480px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:10px;position:relative;z-index:1}
.topbar{width:100%;display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:9px 12px;font-size:14px}
.topbar .title{font-weight:700;font-size:16px;white-space:nowrap}
.topbar .stat{color:#c9d6f2;font-size:12px}
.topbar .stat b{color:#fff;font-size:14px}
.tbtn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:#fff;font-size:17px;min-width:42px;height:42px;border-radius:11px;cursor:pointer;transition:transform .08s}
.tbtn:active{transform:scale(.9)}
.screen{width:100%;display:none;flex-direction:column;align-items:center;gap:10px}
.screen.on{display:flex}
.card{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:20px;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.card h1{font-size:26px;margin-bottom:8px;background:linear-gradient(90deg,#90caf9,#e1f5fe);-webkit-background-clip:text;background-clip:text;color:transparent}
.card h2{font-size:22px;margin-bottom:8px}
.card p{color:#d7e2f5;font-size:14px;line-height:1.9;margin-bottom:12px;text-align:left}
.card p b{color:#90caf9}
.bigbtn{background:linear-gradient(135deg,#1976d2,#64b5f6);border:none;color:#fff;font-size:18px;font-weight:700;padding:14px 44px;border-radius:999px;cursor:pointer;box-shadow:0 6px 18px rgba(25,118,210,.5);transition:transform .1s;min-height:48px}
.bigbtn:active{transform:scale(.93)}
.ghostbtn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#fff;font-size:14px;padding:10px 22px;border-radius:999px;cursor:pointer;min-height:44px}
.ghostbtn:active{transform:scale(.93)}
.best{color:#90caf9;font-size:14px;margin-top:8px}
#cvwrap{width:100%;display:flex;justify-content:center}
#cv{border-radius:14px;background:rgba(255,255,255,.03);touch-action:none;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.hint{color:#c9d6f2;font-size:13px;text-align:center;line-height:1.7}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:40;backdrop-filter:blur(4px)}
.ov.on{display:flex}
.pausecard{background:#101a3d;border:1px solid rgba(144,202,249,.3);border-radius:18px;padding:28px 32px;text-align:center;display:flex;flex-direction:column;gap:12px;max-width:86vw}
.pausecard h2{font-size:20px}
#toast{position:fixed;top:38%;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.82);border:1px solid rgba(144,202,249,.4);color:#fff;font-size:16px;font-weight:700;padding:12px 26px;border-radius:999px;z-index:70;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;max-width:92vw}
.float{position:fixed;pointer-events:none;z-index:60;font-weight:800;font-size:22px;animation:floatup 1.1s ease-out forwards;text-shadow:0 2px 6px rgba(0,0,0,.6)}
@keyframes floatup{0%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-52px)}}
#flash{position:fixed;inset:0;background:radial-gradient(ellipse at center,transparent 40%,rgba(255,40,40,.55) 100%);opacity:0;pointer-events:none;z-index:55;transition:opacity .12s}
</style>
</head>
<body>
<div id="toast"></div>
<div id="flash"></div>
<div class="wrap">
  <div class="topbar">
    <span class="title">🧹 扫帚夜行</span>
    <span class="stat">⭐<b id="score">0</b> · 📏<b id="dist">0</b>m · ❤️<b id="lives">3</b></span>
    <span><button class="tbtn" id="sndBtn" aria-label="静音开关">🔊</button><button class="tbtn" id="pauseBtn" aria-label="暂停">⏸</button></span>
  </div>
  <div class="screen on" id="s-start">
    <div class="card">
      <h1>🧹 扫帚夜行</h1>
      <p>骑上魔法扫帚，在月夜中持续向上飞！<br>
      👆 <b>按住拖动</b>左右移动，扫帚自动上升<br>
      🌲🦇⛈️ 躲避树木、蝙蝠、乌云<br>
      ⭐ 收集魔法星星，每颗 <b>+10 分</b><br>
      📏 每飞 <b>100 米 +10 分</b>，飞得越快得分越多<br>
      💥 撞到障碍扣 1 颗心，共 <b>3 颗心</b><br>
      🚀 速度会随时间不断提升，小心！</p>
      <button class="bigbtn" id="startBtn">开始飞行</button>
      <div class="best">🏅 最高分：<b id="best0">0</b> · 📏 最远：<b id="bestd0">0</b>m</div>
    </div>
  </div>
  <div class="screen" id="s-game">
    <div id="cvwrap"><canvas id="cv" width="360" height="560"></canvas></div>
    <div class="hint">👆 按住并拖动，控制扫帚左右移动躲避障碍、收集⭐</div>
  </div>
  <div class="screen" id="s-end">
    <div class="card">
      <h2 id="endTitle">🌙 夜航结束</h2>
      <p id="endDesc" style="text-align:center"></p>
      <div class="best">🏅 最高分：<b id="best1">0</b> · 📏 最远：<b id="bestd1">0</b>m</div>
      <button class="bigbtn" id="againBtn">再飞一次</button>
    </div>
  </div>
</div>
<div class="ov" id="pauseov"><div class="pausecard"><h2>⏸ 中场休息</h2><button class="bigbtn" id="resumeBtn">继续飞行</button><button class="ghostbtn" id="quitBtn">重开一局</button></div></div>
<script>
'use strict';
const $=id=>document.getElementById(id);
/* ===== 音效 ===== */
let AC=null;
let soundOn=localStorage.getItem('g100_mute')!=='1';
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return null;}}if(AC&&AC.state==='suspended'){AC.resume();}return AC;}
function tone(f,d,type,v,when){if(!soundOn)return;const a=ac();if(!a)return;try{const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.value=f;const t=a.currentTime+(when||0);g.gain.setValueAtTime(v||0.12,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.03);}catch(e){}}
function sweep(f0,f1,d,type,v){if(!soundOn)return;const a=ac();if(!a)return;try{const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';const t=a.currentTime;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+d);g.gain.setValueAtTime(v||0.1,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.03);}catch(e){}}
const sClick=()=>tone(640,0.07,'square',0.07);
const sStar=()=>{[1175,1568].forEach((f,i)=>tone(f,0.1,'sine',0.12,i*0.06));};
const sHit=()=>{tone(180,0.22,'sawtooth',0.14);tone(120,0.3,'sawtooth',0.12,0.08);};
const sBonus=()=>sweep(500,1400,0.25,'triangle',0.1);
const sOver=()=>{[392,330,262,196].forEach((f,i)=>tone(f,0.2,'triangle',0.12,i*0.15));};
const sRecord=()=>{[523,659,784,1047,1319,1568].forEach((f,i)=>tone(f,0.15,'triangle',0.12,i*0.1));};
/* ===== 工具 ===== */
function toast(msg){const t=$('toast');t.textContent=msg;t.style.opacity='1';clearTimeout(t._tm);t._tm=setTimeout(()=>{t.style.opacity='0';},1300);}
function floatTxt(txt,color){const d=document.createElement('div');d.className='float';d.textContent=txt;d.style.color=color||'#ffd54f';d.style.left='50%';d.style.top='26%';document.body.appendChild(d);setTimeout(()=>d.remove(),1150);}
function buzz(ms){try{if(navigator.vibrate)navigator.vibrate(ms);}catch(e){}}
function flashRed(){const f=$('flash');f.style.opacity='1';setTimeout(()=>{f.style.opacity='0';},180);}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));$(id).classList.add('on');}
/* ===== 常量/状态 ===== */
const HSKEY='g100_broomrace_hs',HDKEY='g100_broomrace_hd';
const cv=$('cv'),ctx=cv.getContext('2d');
const W=cv.width,H=cv.height,PY=452;
const OBT=[{e:'🌲',w:50,h:58,vy:1.0},{e:'🦇',w:52,h:42,vy:1.12,swing:1},{e:'⛈️',w:76,h:62,vy:0.85,drift:1}];
let running=false,paused=false,lastT=0;
let score=0,dist=0,lives=3,gotStars=0,t=0,speed=200,lastBonus=0;
let px=W/2,tx=W/2,tilt=0,invuln=0,dragging=false;
let bgs=[],cls=[],obs=[],items=[],parts=[];
let obT=0,itemT=0;
function best(){return parseInt(localStorage.getItem(HSKEY)||'0',10);}
function bestD(){return parseInt(localStorage.getItem(HDKEY)||'0',10);}
function saveBest(){if(score>best())localStorage.setItem(HSKEY,String(score));if(Math.floor(dist)>bestD())localStorage.setItem(HDKEY,String(Math.floor(dist)));}
function refreshBest(){$('best0').textContent=best();$('bestd0').textContent=bestD();$('best1').textContent=best();$('bestd1').textContent=bestD();}
function refreshHud(){$('score').textContent=score;$('dist').textContent=Math.floor(dist);$('lives').textContent=lives;}
function easeOut(p){return 1-Math.pow(1-p,3);}
/* ===== 回合 ===== */
function resetWorld(){
  score=0;dist=0;lives=3;gotStars=0;t=0;speed=200;lastBonus=0;
  px=W/2;tx=W/2;tilt=0;invuln=0;dragging=false;
  bgs=[];cls=[];obs=[];items=[];parts=[];obT=0.4;itemT=0.6;
  for(let i=0;i<70;i++)bgs.push({x:Math.random()*W,y:Math.random()*H,r:0.6+Math.random()*1.8,s:0.25+Math.random()*0.4,tw:Math.random()*6.28});
  for(let i=0;i<5;i++)cls.push({x:Math.random()*W,y:Math.random()*H,s:0.55+Math.random()*0.3,a:0.10+Math.random()*0.10});
}
function startGame(){
  resetWorld();running=true;paused=false;
  $('pauseov').classList.remove('on');
  showScreen('s-game');refreshHud();refreshBest();
  sClick();
}
function spawnOb(){
  const tp=OBT[Math.floor(Math.random()*OBT.length)];
  obs.push({e:tp.e,w:tp.w,h:tp.h,vy:tp.vy,swing:tp.swing||0,drift:tp.drift||0,
    x:30+Math.random()*(W-60),y:-80,ph:Math.random()*6.28});
}
function spawnItem(){items.push({x:34+Math.random()*(W-68),y:-40,ph:Math.random()*6.28});}
function burst(x,y,colors,n,pw){for(let i=0;i<n;i++)parts.push({x:x,y:y,vx:(Math.random()-0.5)*pw,vy:(Math.random()-0.5)*pw-1,life:1,c:colors[i%colors.length],r:2+Math.random()*3});}
function hit(){
  lives--;invuln=1.6;buzz(140);flashRed();sHit();
  burst(px,PY,['#ff5252','#ff8a80','#ffffff','#ffab91'],22,6);
  floatTxt('💔 -1','#ff8a80');
  refreshHud();
  if(lives<=0)endGame();
}
function endGame(){
  running=false;paused=false;
  $('pauseov').classList.remove('on');
  const nb=score>best();
  saveBest();refreshBest();
  $('endTitle').textContent=nb?'🏆 新纪录！':'🌙 夜航结束';
  $('endDesc').innerHTML='本局得分 <b style="color:#ffd54f;font-size:24px">'+score+'</b><br>飞行 <b>'+Math.floor(dist)+'</b> 米 · 收集 ⭐ <b>'+gotStars+'</b> · 存活 <b>'+Math.floor(t)+'</b> 秒';
  showScreen('s-end');
  if(nb)sRecord();else sOver();
}
/* ===== 输入 ===== */
function cvX(e){const r=cv.getBoundingClientRect();return(e.clientX-r.left)*W/r.width;}
cv.addEventListener('pointerdown',e=>{e.preventDefault();if(!running||paused)return;dragging=true;tx=Math.max(24,Math.min(W-24,cvX(e)));});
window.addEventListener('pointermove',e=>{if(!running||paused||!dragging)return;try{tx=Math.max(24,Math.min(W-24,cvX(e)));}catch(err){}});
window.addEventListener('pointerup',()=>{dragging=false;});
window.addEventListener('pointercancel',()=>{dragging=false;});
window.addEventListener('keydown',e=>{
  if(!running||paused)return;
  if(e.key==='ArrowLeft')tx=Math.max(24,tx-46);
  if(e.key==='ArrowRight')tx=Math.min(W-24,tx+46);
});
/* ===== 绘制 ===== */
function draw(dt){
  ctx.clearRect(0,0,W,H);
  // 月亮
  const mg=ctx.createRadialGradient(292,84,6,292,84,44);
  mg.addColorStop(0,'rgba(255,249,196,.95)');mg.addColorStop(0.35,'rgba(255,249,196,.25)');mg.addColorStop(1,'rgba(255,249,196,0)');
  ctx.fillStyle=mg;ctx.beginPath();ctx.arc(292,84,44,0,7);ctx.fill();
  ctx.font='40px serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('🌕',292,84);
  // 星星背景
  for(const s of bgs){
    s.y+=speed*s.s*dt;s.tw+=dt*3;
    if(s.y>H+6){s.y=-6;s.x=Math.random()*W;}
    ctx.globalAlpha=0.4+0.35*Math.sin(s.tw);
    ctx.fillStyle='#e3ecff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill();
  }
  ctx.globalAlpha=1;
  // 云
  for(const c of cls){
    c.y+=speed*c.s*dt;
    if(c.y>H+50){c.y=-60;c.x=Math.random()*W;}
    ctx.globalAlpha=c.a;ctx.font='64px serif';ctx.fillText('☁️',c.x,c.y);
  }
  ctx.globalAlpha=1;
  // 星星收集物
  for(const it of items){
    ctx.font='30px serif';
    const wob=Math.sin(performance.now()/300+it.ph)*0.12+1;
    ctx.save();ctx.translate(it.x,it.y);ctx.scale(wob,wob);ctx.fillText('⭐',0,0);ctx.restore();
  }
  // 障碍
  for(const o of obs){
    ctx.font=(o.w+6)+'px serif';
    ctx.fillText(o.e,o.x,o.y);
  }
  // 玩家扫帚
  if(invuln>0&&Math.floor(performance.now()/120)%2===0)ctx.globalAlpha=0.35;
  ctx.save();ctx.translate(px,PY);ctx.rotate(tilt);
  ctx.font='46px serif';ctx.fillText('🧹',0,0);ctx.restore();
  ctx.globalAlpha=1;
  if(invuln>0){
    ctx.strokeStyle='rgba(144,202,249,.7)';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(px,PY,32,0,7);ctx.stroke();
  }
  // 粒子
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.06;p.life-=dt*1.1;
    if(p.life<=0){parts.splice(i,1);continue;}
    ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();ctx.globalAlpha=1;
  }
}
/* ===== 主循环 ===== */
function loop(tms){
  requestAnimationFrame(loop);
  const dt=Math.min(0.05,(tms-lastT)/1000||0);lastT=tms;
  if(!running||paused){if(!running)return;draw(0);return;}
  t+=dt;
  speed=Math.min(640,200+t*2.4);
  if(invuln>0)invuln-=dt;
  // 横向平滑跟随
  const nx=px+(tx-px)*Math.min(1,dt*10);
  tilt+=(((nx-px)*0.012)-tilt)*Math.min(1,dt*8);
  px=nx;
  // 距离/加分
  dist+=speed*dt*0.06;
  const bk=Math.floor(dist/100);
  if(bk>lastBonus){lastBonus=bk;score+=10;sBonus();floatTxt('📏 +10','#90caf9');refreshHud();}
  // 扫帚尾迹
  if(Math.random()<0.5)parts.push({x:px+(Math.random()-0.5)*10,y:PY+16,vx:(Math.random()-0.5)*1,vy:1.5+Math.random(),life:0.7,c:['#64b5f6','#e1f5fe','#90caf9'][Math.floor(Math.random()*3)],r:1.5+Math.random()*2});
  // 生成
  obT-=dt;itemT-=dt;
  if(obT<=0){spawnOb();obT=Math.max(0.34,0.85-t*0.004);}
  if(itemT<=0){spawnItem();itemT=0.9;}
  // 更新收集物
  for(let i=items.length-1;i>=0;i--){
    const it=items[i];it.y+=speed*dt;
    if(it.y>H+40){items.splice(i,1);continue;}
    if(Math.hypot(it.x-px,it.y-PY)<36){
      items.splice(i,1);gotStars++;score+=10;sStar();buzz(30);
      burst(it.x,it.y,['#ffd54f','#fff59d','#ffffff'],12,4);
      floatTxt('+10','#ffd54f');refreshHud();
    }
  }
  // 更新障碍
  for(let i=obs.length-1;i>=0;i--){
    const o=obs[i];
    o.y+=speed*o.vy*dt;o.ph+=dt*3;
    if(o.swing)o.x+=Math.sin(o.ph)*60*dt;
    if(o.drift)o.x+=Math.sin(o.ph*0.6)*28*dt;
    if(o.x<20)o.x=20;if(o.x>W-20)o.x=W-20;
    if(o.y>H+80){obs.splice(i,1);continue;}
    if(invuln<=0&&Math.abs(o.x-px)<o.w*0.36+16&&Math.abs(o.y-PY)<o.h*0.38+20){
      obs.splice(i,1);hit();if(!running)return;
    }
  }
  draw(dt);
}
requestAnimationFrame(loop);
/* ===== 暂停/静音 ===== */
$('pauseBtn').addEventListener('click',()=>{
  if(!running||paused)return;
  paused=true;$('pauseov').classList.add('on');sClick();
});
$('resumeBtn').addEventListener('click',()=>{paused=false;$('pauseov').classList.remove('on');sClick();});
$('quitBtn').addEventListener('click',()=>{sClick();running=false;paused=false;$('pauseov').classList.remove('on');showScreen('s-start');refreshBest();});
function refreshSnd(){$('sndBtn').textContent=soundOn?'🔊':'🔇';}
$('sndBtn').addEventListener('click',()=>{soundOn=!soundOn;localStorage.setItem('g100_mute',soundOn?'0':'1');refreshSnd();if(soundOn)sClick();});
$('startBtn').addEventListener('click',startGame);
$('againBtn').addEventListener('click',startGame);
refreshSnd();refreshBest();
</script>
</body>
</html>
