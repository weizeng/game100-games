<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>滚珠 · 游戏100</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#121212;color:#f2f2f2;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;display:flex;justify-content:center;overscroll-behavior:none}
#app{width:100%;max-width:480px;min-height:100vh;position:relative;display:flex;flex-direction:column;background:radial-gradient(900px 480px at 50% -8%,rgba(69,183,209,.12),transparent 60%),radial-gradient(700px 500px at 90% 110%,rgba(155,93,229,.10),transparent 60%),#121212;overflow:hidden}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;z-index:20}
.tb-title{font-size:14px;font-weight:700;color:#cfcfcf;letter-spacing:1px}
.tb-right{display:flex;gap:8px}
.iconbtn{width:38px;height:38px;border-radius:12px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .1s}
.iconbtn:active{transform:scale(.88)}
.screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;gap:12px;text-align:center;z-index:10}
.hidden{display:none!important}
.bigemoji{font-size:64px;filter:drop-shadow(0 6px 16px rgba(0,0,0,.5));animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.gamename{font-size:28px;font-weight:800;background:linear-gradient(135deg,#9fdcf5,#45b7d1);-webkit-background-clip:text;background-clip:text;color:transparent}
.howto{font-size:13.5px;line-height:1.8;color:#bdbdbd;max-width:350px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:12px 16px}
.btn{background:linear-gradient(135deg,#45b7d1,#2e86c1);border:none;color:#fff;font-size:17px;font-weight:800;padding:13px 46px;border-radius:999px;cursor:pointer;box-shadow:0 8px 24px rgba(69,183,209,.35);transition:transform .1s;letter-spacing:2px}
.btn:active{transform:scale(.93)}
.btn.ghost{background:rgba(255,255,255,.08);box-shadow:none;border:1px solid rgba(255,255,255,.16)}
.hsline{font-size:13px;color:#ffd76a}
.hud{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
.pill{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:700}
#fx{position:absolute;inset:0;pointer-events:none;z-index:50}
.float-txt{position:absolute;transform:translate(-50%,-50%);font-weight:800;font-size:20px;pointer-events:none;z-index:60;text-shadow:0 2px 8px rgba(0,0,0,.6);animation:floatUp 1.1s ease-out forwards}
@keyframes floatUp{to{transform:translate(-50%,-160%);opacity:0}}
#pauseOv{position:absolute;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(4px);z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
#pauseOv .btn{font-size:15px;padding:11px 34px}
.endstats{font-size:15px;line-height:2.1;color:#ddd}
.endstats b{color:#ffd76a;font-size:22px}
canvas.game{border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.45);touch-action:none}
.msg{min-height:22px;font-size:13px;color:#ff9a9a}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.hintline{font-size:12px;color:#8a8a8a}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="tb-title">🎱 滚珠入洞</div>
    <div class="tb-right">
      <div class="iconbtn" id="soundBtn">🔊</div>
      <div class="iconbtn hidden" id="pauseBtn">⏸</div>
    </div>
  </div>
  <div class="screen" id="scrStart">
    <div class="bigemoji">🎱</div>
    <div class="gamename">滚珠入洞</div>
    <div class="howto">手指在屏幕上<strong style="color:#fff">按住拖动</strong>＝倾斜平板，<br>小球会朝拖动方向滚动。<br>把小球滚进 <strong style="color:#7ee2a8">绿色球洞</strong> 过关，<br>⚠️ 别掉进 <strong style="color:#c39bd3">黑洞</strong>（掉进去重来）！共 <strong style="color:#ffd76a">3 关</strong>。</div>
    <button class="btn" id="startBtn">开始游戏</button>
    <div class="hsline" id="startHs"></div>
  </div>
  <div class="screen hidden" id="scrGame" style="justify-content:flex-start;padding-top:6px">
    <div class="hud">
      <div class="pill">第 <span id="lvl" style="color:#45b7d1">1</span>/3 关</div>
      <div class="pill">⏱ <span id="time">0.0</span>s</div>
      <div class="pill">💀 <span id="deaths" style="color:#ff9a9a">0</span></div>
    </div>
    <canvas class="game" id="cv" width="400" height="400"></canvas>
    <div class="hintline">按住拖动倾斜平板 · 松手回正</div>
    <div class="msg" id="msg"></div>
  </div>
  <div class="screen hidden" id="scrEnd">
    <div class="bigemoji" id="endEmoji">🏆</div>
    <div class="gamename" id="endTitle">全部通关！</div>
    <div class="endstats" id="endStats"></div>
    <div class="hsline" id="endHs"></div>
    <button class="btn" id="againBtn">再来一局</button>
    <button class="btn ghost" id="backBtn">返回</button>
  </div>
  <div id="pauseOv" class="hidden">
    <div style="font-size:24px;font-weight:800">⏸ 已暂停</div>
    <button class="btn" id="resumeBtn">继续</button>
    <button class="btn ghost" id="restartBtn">重新开始</button>
  </div>
  <canvas id="fx"></canvas>
</div>
<script>
'use strict';
let ACTX=null, soundOn=true;
try{ soundOn=localStorage.getItem('g100_sound')!=='0'; }catch(e){}
function audio(){ if(!ACTX){ try{ ACTX=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } } if(ACTX&&ACTX.state==='suspended'){ ACTX.resume().catch(function(){}); } return ACTX; }
function tone(f,d,type,vol,delay){ if(!soundOn) return; try{ const c=audio(); if(!c) return; const t=c.currentTime+(delay||0); const o=c.createOscillator(),g=c.createGain(); o.type=type||'sine'; o.frequency.setValueAtTime(f,t); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||0.12,t+0.012); g.gain.exponentialRampToValueAtTime(0.0001,t+d); o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+d+0.05); }catch(e){} }
function sClick(){ tone(600,0.06,'square',0.05); }
function sGood(){ tone(520,0.1,'sine',0.11); tone(880,0.16,'sine',0.11,0.09); }
function sBad(){ tone(160,0.3,'sawtooth',0.1); }
function sWin(){ const seq=[523,659,784,1046,1318]; for(let i=0;i<seq.length;i++) tone(seq[i],0.22,'triangle',0.11,i*0.11); }
function hsGet(k){ try{ const v=parseFloat(localStorage.getItem(k)||'0'); return isNaN(v)?0:v; }catch(e){ return 0; } }
function hsSet(k,v){ try{ localStorage.setItem(k,String(v)); }catch(e){} }
const fxC=document.getElementById('fx'), fxX=fxC.getContext('2d');
let P=[];
function fxSize(){ const r=fxC.parentElement.getBoundingClientRect(); fxC.width=r.width; fxC.height=r.height; }
window.addEventListener('resize',fxSize);
function burst(x,y,n,cols){ for(let i=0;i<(n||24);i++){ const a=Math.random()*Math.PI*2,s=1+Math.random()*3.2; P.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1.2,l:1,c:cols[i%cols.length],r:2+Math.random()*3}); } }
function fxLoop(){ fxX.clearRect(0,0,fxC.width,fxC.height); P=P.filter(function(p){return p.l>0;}); for(let i=0;i<P.length;i++){ const p=P[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=0.06; p.l-=0.018; fxX.globalAlpha=Math.max(p.l,0); fxX.fillStyle=p.c; fxX.beginPath(); fxX.arc(p.x,p.y,p.r,0,7); fxX.fill(); } fxX.globalAlpha=1; requestAnimationFrame(fxLoop); }
function floatText(x,y,txt,color){ const s=document.createElement('div'); s.className='float-txt'; s.textContent=txt; s.style.left=x+'px'; s.style.top=y+'px'; s.style.color=color||'#ffd76a'; document.getElementById('app').appendChild(s); setTimeout(function(){ s.remove(); },1150); }
function shakeEl(el){ el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }
const $=function(id){ return document.getElementById(id); };
const scrStart=$('scrStart'), scrGame=$('scrGame'), scrEnd=$('scrEnd'), pauseOv=$('pauseOv'), pauseBtn=$('pauseBtn'), soundBtn=$('soundBtn');
let paused=false;
function show(el){ [scrStart,scrGame,scrEnd].forEach(function(s){ s.classList.add('hidden'); }); el.classList.remove('hidden'); fxSize(); }
function setPaused(p){ paused=p; pauseOv.classList.toggle('hidden',!p); }
soundBtn.textContent=soundOn?'🔊':'🔇';
soundBtn.addEventListener('click',function(){ soundOn=!soundOn; soundBtn.textContent=soundOn?'🔊':'🔇'; try{ localStorage.setItem('g100_sound',soundOn?'1':'0'); }catch(e){} if(soundOn) sClick(); });
pauseBtn.addEventListener('click',function(){ sClick(); setPaused(true); });
$('resumeBtn').addEventListener('click',function(){ sClick(); setPaused(false); });
/* ===== 游戏：滚珠入洞 ===== */
const LEVELS=[
  {start:[0.12,0.5], goal:[0.88,0.5], blacks:[[0.5,0.28],[0.5,0.72]], walls:[]},
  {start:[0.10,0.12], goal:[0.90,0.88], blacks:[[0.5,0.5],[0.32,0.68],[0.68,0.32]], walls:[[0.42,0.08,0.08,0.46]]},
  {start:[0.5,0.08], goal:[0.5,0.92], blacks:[[0.28,0.5],[0.72,0.5],[0.5,0.30],[0.5,0.70]], walls:[[0.15,0.38,0.70,0.07],[0.15,0.58,0.70,0.07]]}
];
const cv=$('cv'), ctx=cv.getContext('2d');
const BR=0.028, ACC=2.4, FRIC=1.7;
let lvl=0, ball={x:0,y:0,vx:0,vy:0}, tilt={x:0,y:0};
let deaths=0, totalMs=0, lvlMs=0, playing=false, invuln=0, levelDone=false;
function sizeCanvas(){ const w=Math.min(400,document.getElementById('app').clientWidth-36); cv.width=w; cv.height=w; cv.style.width=w+'px'; cv.style.height=w+'px'; }
window.addEventListener('resize',function(){ sizeCanvas(); });
function loadLevel(i){
  const L=LEVELS[i];
  ball={x:L.start[0],y:L.start[1],vx:0,vy:0};
  tilt={x:0,y:0}; lvlMs=0; invuln=0; levelDone=false;
  $('lvl').textContent=i+1; $('deaths').textContent=deaths;
}
function newGame(){
  lvl=0; deaths=0; totalMs=0; playing=true;
  setPaused(false); pauseBtn.classList.remove('hidden'); $('msg').textContent='';
  sizeCanvas(); show(scrGame); loadLevel(0);
  lastT=performance.now();
}
function collideWalls(){
  const L=LEVELS[lvl];
  for(let i=0;i<L.walls.length;i++){
    const wr=L.walls[i], rx=wr[0], ry=wr[1], rw=wr[2], rh=wr[3];
    const cx=Math.max(rx,Math.min(ball.x,rx+rw)), cy=Math.max(ry,Math.min(ball.y,ry+rh));
    const dx=ball.x-cx, dy=ball.y-cy, d=Math.hypot(dx,dy);
    if(d<BR){
      if(d<1e-6){ ball.y=ry-BR; ball.vy=Math.min(0,ball.vy); continue; }
      const nx=dx/d, ny=dy/d;
      ball.x=cx+nx*BR; ball.y=cy+ny*BR;
      const vn=ball.vx*nx+ball.vy*ny;
      if(vn<0){ ball.vx-=vn*nx; ball.vy-=vn*ny; }
    }
  }
}
function step(dt){
  lvlMs+=dt*1000; totalMs+=dt*1000;
  if(invuln>0) invuln-=dt;
  ball.vx+=tilt.x*ACC*dt; ball.vy+=tilt.y*ACC*dt;
  const fr=Math.exp(-FRIC*dt); ball.vx*=fr; ball.vy*=fr;
  const sp=Math.hypot(ball.vx,ball.vy), mx=1.4;
  if(sp>mx){ ball.vx*=mx/sp; ball.vy*=mx/sp; }
  ball.x+=ball.vx*dt; ball.y+=ball.vy*dt;
  collideWalls();
  if(ball.x<BR){ ball.x=BR; ball.vx=Math.abs(ball.vx)*0.35; }
  if(ball.x>1-BR){ ball.x=1-BR; ball.vx=-Math.abs(ball.vx)*0.35; }
  if(ball.y<BR){ ball.y=BR; ball.vy=Math.abs(ball.vy)*0.35; }
  if(ball.y>1-BR){ ball.y=1-BR; ball.vy=-Math.abs(ball.vy)*0.35; }
  const L=LEVELS[lvl];
  if(Math.hypot(ball.x-L.goal[0],ball.y-L.goal[1])<0.045){ onLevelClear(); return; }
  if(invuln<=0){
    for(let i=0;i<L.blacks.length;i++){
      const h=L.blacks[i];
      if(Math.hypot(ball.x-h[0],ball.y-h[1])<0.04){ onFall(); return; }
    }
  }
}
function onFall(){
  deaths++; $('deaths').textContent=deaths;
  sBad(); shakeEl(cv);
  const r=cv.getBoundingClientRect(), ar=$('app').getBoundingClientRect();
  burst(r.left-ar.left+ball.x*r.width, r.top-ar.top+ball.y*r.height, 26, ['#9b59b6','#000','#c39bd3']);
  floatText(r.left-ar.left+ball.x*r.width, r.top-ar.top+ball.y*r.height-20, '掉进黑洞!+5s', '#ff9a9a');
  const L=LEVELS[lvl];
  ball={x:L.start[0],y:L.start[1],vx:0,vy:0}; tilt={x:0,y:0}; invuln=1.0;
  $('msg').textContent='掉进黑洞了，小球已重置（+5秒罚时）';
  setTimeout(function(){ if(playing) $('msg').textContent=''; },1800);
}
function onLevelClear(){
  levelDone=true; sGood();
  const r=cv.getBoundingClientRect(), ar=$('app').getBoundingClientRect();
  burst(r.left-ar.left+r.width/2, r.top-ar.top+r.height/2, 60, ['#45b7d1','#7ee2a8','#ffd76a','#fff']);
  setTimeout(function(){
    if(lvl<LEVELS.length-1){ lvl++; loadLevel(lvl); }
    else endGame();
  },900);
}
function endGame(){
  playing=false; pauseBtn.classList.add('hidden'); setPaused(false);
  const secs=totalMs/1000+deaths*5;
  const key='g100_ballroll_hs', best=hsGet(key);
  let nb=false;
  if(best===0||secs<best){ hsSet(key,secs); nb=true; }
  $('endStats').innerHTML='总用时 <b>'+secs.toFixed(1)+'</b> 秒<br><span style="font-size:13px;color:#999">含黑洞罚时 +'+(deaths*5)+'s（掉了 '+deaths+' 次）</span>'+(nb?'<br>🎉 新纪录！':'');
  $('endHs').textContent='🏅 最佳纪录：'+(best===0?secs.toFixed(1):Math.min(best,secs).toFixed(1))+' 秒';
  show(scrEnd); sWin();
  const r=$('app').getBoundingClientRect(); burst(r.width/2,220,90,['#45b7d1','#ffd76a','#7ee2a8','#fff']);
}
function draw(t){
  const w=cv.width, S=function(v){ return v*w; };
  ctx.clearRect(0,0,w,w);
  const bg=ctx.createLinearGradient(0,0,w,w);
  bg.addColorStop(0,'#1a2233'); bg.addColorStop(1,'#141a28');
  ctx.fillStyle=bg; ctx.fillRect(0,0,w,w);
  ctx.strokeStyle='rgba(255,255,255,.05)'; ctx.lineWidth=1;
  for(let i=1;i<8;i++){ ctx.beginPath(); ctx.moveTo(S(i/8),0); ctx.lineTo(S(i/8),w); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0,S(i/8)); ctx.lineTo(w,S(i/8)); ctx.stroke(); }
  const L=LEVELS[lvl];
  for(let i=0;i<L.walls.length;i++){
    const wr=L.walls[i];
    ctx.fillStyle='#2c3a55';
    ctx.fillRect(S(wr[0]),S(wr[1]),S(wr[2]),S(wr[3]));
    ctx.fillStyle='#45b7d1';
    ctx.fillRect(S(wr[0]),S(wr[1]),S(wr[2]),3);
  }
  for(let i=0;i<L.blacks.length;i++){
    const h=L.blacks[i], hx=S(h[0]), hy=S(h[1]), hr=S(0.042);
    const hg=ctx.createRadialGradient(hx,hy,1,hx,hy,hr);
    hg.addColorStop(0,'#000'); hg.addColorStop(0.75,'#050510'); hg.addColorStop(1,'rgba(155,89,182,.55)');
    ctx.fillStyle=hg; ctx.beginPath(); ctx.arc(hx,hy,hr,0,7); ctx.fill();
    ctx.strokeStyle='rgba(195,155,211,.5)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(hx,hy,hr+3+2*Math.sin(t/400),0,7); ctx.stroke();
  }
  const gx=S(L.goal[0]), gy=S(L.goal[1]), gr=S(0.05);
  const pu=1+0.1*Math.sin(t/300);
  const gg=ctx.createRadialGradient(gx,gy,2,gx,gy,gr*pu);
  gg.addColorStop(0,'#7ee2a8'); gg.addColorStop(1,'rgba(46,204,113,.12)');
  ctx.fillStyle=gg; ctx.beginPath(); ctx.arc(gx,gy,gr*pu+4,0,7); ctx.fill();
  ctx.fillStyle='#1a2233'; ctx.beginPath(); ctx.arc(gx,gy,gr*0.62,0,7); ctx.fill();
  ctx.fillStyle='#2ecc71'; ctx.beginPath(); ctx.arc(gx,gy,gr*0.62,0,7); ctx.stroke();
  ctx.lineWidth=3; ctx.strokeStyle='#2ecc71'; ctx.stroke();
  const bx=S(ball.x), by=S(ball.y), br=S(BR);
  ctx.shadowColor='rgba(0,0,0,.5)'; ctx.shadowBlur=8; ctx.shadowOffsetY=3;
  const bgrad=ctx.createRadialGradient(bx-br*0.4,by-br*0.4,br*0.2,bx,by,br);
  bgrad.addColorStop(0,'#ffffff'); bgrad.addColorStop(0.6,'#9fdcf5'); bgrad.addColorStop(1,'#2e86c1');
  ctx.fillStyle=bgrad; ctx.beginPath(); ctx.arc(bx,by,br,0,7); ctx.fill();
  ctx.shadowColor='transparent'; ctx.shadowBlur=0; ctx.shadowOffsetY=0;
  if(Math.hypot(tilt.x,tilt.y)>0.08){
    ctx.strokeStyle='rgba(255,215,106,.8)'; ctx.lineWidth=4; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(w/2,w/2); ctx.lineTo(w/2+tilt.x*60,w/2+tilt.y*60); ctx.stroke();
    ctx.fillStyle='rgba(255,215,106,.9)';
    ctx.beginPath(); ctx.arc(w/2+tilt.x*60,w/2+tilt.y*60,7,0,7); ctx.fill();
  }
}
let lastT=0;
function loop(t){
  requestAnimationFrame(loop);
  if(!playing||paused||levelDone){ lastT=t; if(playing&&!levelDone) draw(t); return; }
  const dt=Math.min((t-lastT)/1000,0.05); lastT=t;
  step(dt); draw(t);
  $('time').textContent=(totalMs/1000).toFixed(1);
}
let dragId=null, dragSX=0, dragSY=0;
function setTiltFrom(e){
  const dx=e.clientX-dragSX, dy=e.clientY-dragSY;
  tilt.x=Math.max(-1,Math.min(1,dx/130));
  tilt.y=Math.max(-1,Math.min(1,dy/130));
}
cv.addEventListener('pointerdown',function(e){ e.preventDefault(); dragId=e.pointerId; dragSX=e.clientX; dragSY=e.clientY; try{ cv.setPointerCapture(e.pointerId); }catch(err){} },{passive:false});
cv.addEventListener('pointermove',function(e){ if(e.pointerId===dragId) setTiltFrom(e); },{passive:true});
function endDrag(e){ if(e.pointerId===dragId){ dragId=null; tilt={x:0,y:0}; } }
cv.addEventListener('pointerup',endDrag);
cv.addEventListener('pointercancel',endDrag);
$('startBtn').addEventListener('click',function(){ audio(); sClick(); newGame(); });
$('againBtn').addEventListener('click',function(){ sClick(); newGame(); });
$('backBtn').addEventListener('click',function(){ sClick(); playing=false; pauseBtn.classList.add('hidden'); show(scrStart); refreshStartHs(); });
$('restartBtn').addEventListener('click',function(){ sClick(); newGame(); });
function refreshStartHs(){ const b=hsGet('g100_ballroll_hs'); $('startHs').textContent=b>0?('🏅 最佳纪录：'+b.toFixed(1)+' 秒'):''; }
refreshStartHs(); fxSize(); fxLoop(); requestAnimationFrame(loop);
</script>
</body>
</html>
