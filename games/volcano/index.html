<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>火山逃生</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#050507;overflow:hidden;overscroll-behavior:none}
body{display:flex;justify-content:center;align-items:center;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:#fff;-webkit-user-select:none;user-select:none}
#wrap{position:relative;width:min(100vw,60vh);aspect-ratio:3/5;max-height:100vh;background:#121212;overflow:hidden;box-shadow:0 0 60px rgba(0,0,0,.8)}
@media (max-aspect-ratio:3/5){#wrap{width:100vw;height:100vh;aspect-ratio:auto}}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:10px;z-index:5;pointer-events:none}
.pill{background:rgba(10,10,16,.62);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;backdrop-filter:blur(4px);white-space:nowrap}
.hudl{display:flex;gap:8px}
.hbtns{display:flex;gap:8px;pointer-events:auto}
.icobtn{width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.16);background:rgba(10,10,16,.62);color:#fff;font-size:17px;cursor:pointer;transition:transform .08s}
.icobtn:active{transform:scale(.88)}
#overlay{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(12,6,4,.86);backdrop-filter:blur(6px);padding:28px;text-align:center}
#overlay h1{font-size:36px}
#overlay .sub{font-size:14px;color:#b0bec5;line-height:1.8;max-width:340px}
#overlay .best{font-size:14px;color:#ffd54f;font-weight:600}
#overlay .bigscore{font-size:52px;font-weight:800;color:#ff8a65}
.btn{background:linear-gradient(135deg,#ff8a65,#ff5722);border:none;color:#3a0f00;font-size:18px;font-weight:700;padding:14px 54px;border-radius:999px;cursor:pointer;box-shadow:0 6px 24px rgba(255,87,34,.4);transition:transform .1s}
.btn:active{transform:scale(.93)}
.btn2{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;font-size:15px;font-weight:600;padding:11px 34px;border-radius:999px;cursor:pointer;transition:transform .1s}
.btn2:active{transform:scale(.93)}
.row{display:flex;gap:12px}
</style>
</head>
<body>
<div id="wrap">
<canvas id="cv"></canvas>
<div id="hud">
  <div class="hudl">
    <div class="pill" id="scorePill">高度 0m</div>
  </div>
  <div class="hbtns">
    <button class="icobtn" id="soundBtn">🔊</button>
    <button class="icobtn" id="pauseBtn">⏸</button>
  </div>
</div>
<div id="overlay"></div>
</div>
<script>
'use strict';
var W=480,H=800;
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
cv.width=W;cv.height=H;
var AC=null,soundOn=true;
function ac(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}return AC;}
function tone(f,d,type,vol,delay){if(!soundOn)return;try{var c=ac();if(!c)return;var t=c.currentTime+(delay||0);var o=c.createOscillator(),g=c.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(vol||0.12,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+0.05);}catch(e){}}
function noise(d,vol){if(!soundOn)return;try{var c=ac();if(!c)return;var n=(c.sampleRate*d)|0;var b=c.createBuffer(1,n,c.sampleRate);var ch=b.getChannelData(0);for(var i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);var s=c.createBufferSource();s.buffer=b;var g=c.createGain();g.gain.value=vol||0.25;s.connect(g);g.connect(c.destination);s.start();}catch(e){}}
function toGame(e){var r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};}
var lastTouch=0;
function bindDown(fn){cv.addEventListener('touchstart',function(e){e.preventDefault();lastTouch=Date.now();fn(toGame(e.touches[0]));},{passive:false});cv.addEventListener('mousedown',function(e){if(Date.now()-lastTouch<800)return;fn(toGame(e));});}
var HSKEY='g100_volcano_hs';
function getHS(){try{return parseInt(localStorage.getItem(HSKEY),10)||0;}catch(e){return 0;}}
function setHS(v){try{localStorage.setItem(HSKEY,String(v));}catch(e){}}
var parts=[],floats=[],embers=[];
function boom(x,y,color,n){n=n||16;for(var i=0;i<n;i++){var a=Math.random()*6.2832,s=40+Math.random()*200;parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-40,t:0,life:0.4+Math.random()*0.5,color:color,r:2+Math.random()*3});}}
function floatText(x,y,txt,color){floats.push({x:x,y:y,txt:txt,t:0,color:color||'#fff'});}
function updParts(dt){for(var i=parts.length-1;i>=0;i--){var p=parts[i];p.t+=dt;if(p.t>=p.life){parts.splice(i,1);continue;}p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=300*dt;}}
function drawParts(){for(var i=0;i<parts.length;i++){var p=parts[i];ctx.globalAlpha=Math.max(0,1-p.t/p.life);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.2832);ctx.fill();}ctx.globalAlpha=1;}
function updFloats(dt){for(var i=floats.length-1;i>=0;i--){var f=floats[i];f.t+=dt;f.y-=44*dt;if(f.t>1)floats.splice(i,1);}}
function drawFloats(){ctx.textAlign='center';ctx.font='bold 20px sans-serif';for(var i=0;i<floats.length;i++){var f=floats[i];ctx.globalAlpha=Math.max(0,1-f.t);ctx.fillStyle=f.color;ctx.fillText(f.txt,f.x,f.y);}ctx.globalAlpha=1;}
/* ---------- 状态 ---------- */
var state='menu',score=0;
var px,py,vx,vy,plats,lavaY,lavaSp,camY,minY,time,topY;
function addPlat(y){
  var w=96,x=30+Math.random()*(W-60-w);
  plats.push({x:x,y:y,w:w});
  if(y<topY)topY=y;
}
function reset(){
  score=0;plats=[];topY=700;
  addPlat(700);py=700;px=240;vx=0;vy=0;
  var y=700;
  while(y>-200){y-=92+Math.random()*22;addPlat(y);}
  lavaY=800;lavaSp=26;camY=0;minY=700;time=0;parts=[];floats=[];embers=[];
  updHUD();
}
function updHUD(){document.getElementById('scorePill').textContent='高度 '+score+'m';}
function jump(left){
  vy=-640;vx=left?-290:290;tone(left?420:520,0.1,'square',0.09);
  boom(px,py+14,'#bcaaa4',5);
}
function gameOver(reason){
  state='over';var hs=getHS();if(score>hs)setHS(score);
  if(reason==='lava'){boom(px,Math.min(py,lavaY),'#ff5722',36);noise(0.5,0.3);}
  tone(200,0.4,'sawtooth',0.14);showEnd(reason);
}
function update(dt){
  time+=dt;
  lavaSp=Math.min(95,lavaSp+dt*0.55);
  lavaY-=lavaSp*dt;
  var prevY=py;
  vy+=1500*dt;py+=vy*dt;px+=vx*dt;
  if(px<16){px=16;vx=0;}if(px>W-16){px=W-16;vx=0;}
  vx*=Math.pow(0.4,dt);
  var i,p;
  if(vy>0)for(i=0;i<plats.length;i++){p=plats[i];
    if(prevY<=p.y&&py>=p.y&&px>p.x-12&&px<p.x+p.w+12){py=p.y;vy=0;break;}}
  if(py<minY){minY=py;score=Math.round((700-minY)/10);updHUD();
    if(score>0&&score%50===0){/* 里程碑 */}
  }
  var target=py-480;if(target<camY)camY=target;
  while(topY>camY-120){topY-=92+Math.random()*22;addPlat(topY);}
  for(i=plats.length-1;i>=0;i--)if(plats[i].y>lavaY+60)plats.splice(i,1);
  if(Math.random()<dt*8)embers.push({x:Math.random()*W,y:lavaY-camY,vx:(Math.random()-0.5)*40,vy:-60-Math.random()*80,t:0,life:1.5});
  for(i=embers.length-1;i>=0;i--){var e=embers[i];e.t+=dt;if(e.t>e.life){embers.splice(i,1);continue;}e.x+=e.vx*dt;e.y+=e.vy*dt;}
  if(py>lavaY+8){gameOver('lava');return;}
  if(py-camY>H+40){gameOver('fall');return;}
  updParts(dt);updFloats(dt);
}
function render(){
  var g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#160f0c');g.addColorStop(0.6,'#241210');g.addColorStop(1,'#1a0b08');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,120,60,.06)';
  for(var i=0;i<24;i++){var rx=(i*173+time*12)%W;ctx.fillRect(rx,(i*211)%H,3,26);}
  var j,p,sy;
  for(j=0;j<plats.length;j++){p=plats[j];sy=p.y-camY;
    if(sy<-40||sy>H+40)continue;
    ctx.fillStyle='#4e342e';roundRect(p.x,sy-14,p.w,16,7);ctx.fill();
    ctx.fillStyle='#8d6e63';roundRect(p.x,sy-14,p.w,7,4);ctx.fill();
    ctx.fillStyle='rgba(255,138,101,.25)';ctx.fillRect(p.x+6,sy-12,4,10);}
  ctx.fillStyle='#ff9800';
  for(j=0;j<embers.length;j++){var e=embers[j];ctx.globalAlpha=Math.max(0,1-e.t/e.life);ctx.beginPath();ctx.arc(e.x,e.y,2.5,0,6.2832);ctx.fill();}
  ctx.globalAlpha=1;
  var ly=lavaY-camY;
  if(ly<H+60){
    var lg=ctx.createLinearGradient(0,ly-70,0,H);lg.addColorStop(0,'rgba(255,152,0,0)');lg.addColorStop(0.5,'#ff5722');lg.addColorStop(1,'#bf360c');
    ctx.fillStyle=lg;ctx.fillRect(0,Math.max(0,ly),W,H);
    ctx.fillStyle='#ffca28';ctx.beginPath();ctx.moveTo(0,ly);
    for(var x=0;x<=W;x+=16)ctx.lineTo(x,ly+Math.sin(x*0.05+time*6)*8);
    ctx.lineTo(W,ly+40);ctx.lineTo(0,ly+40);ctx.closePath();ctx.fill();}
  var ppy=py-camY;
  ctx.save();ctx.translate(px,ppy);
  var tilt=Math.max(-0.3,Math.min(0.3,vx*0.001));
  ctx.rotate(tilt);
  ctx.fillStyle='#ffcc80';ctx.beginPath();ctx.arc(0,0,15,0,6.2832);ctx.fill();
  ctx.fillStyle='#3e2723';ctx.beginPath();ctx.arc(-5,-3,2.4,0,6.2832);ctx.arc(5,-3,2.4,0,6.2832);ctx.fill();
  ctx.strokeStyle='#3e2723';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,3,6,0.2,3.0);ctx.stroke();
  ctx.fillStyle='#d32f2f';ctx.fillRect(-15,-14,30,6);
  ctx.restore();
  drawParts();drawFloats();
  if(state==='playing'&&time<4){ctx.fillStyle='rgba(255,255,255,.5)';ctx.font='15px sans-serif';ctx.textAlign='center';ctx.fillText('点左半屏向左跳，点右半屏向右跳',W/2,H-70);}
}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
var ov=document.getElementById('overlay');
function showMenu(){state='menu';ov.style.display='flex';ov.innerHTML='<h1>🌋</h1><h1 style="font-size:30px">火山逃生</h1><div class="sub">熔岩从底部不断上升！<br><b>点左半屏向左跳，点右半屏向右跳</b>，<br>踩着跳台一路向上。被熔岩追上或掉落即结束，<br>熔岩会越来越快！</div><div class="best">🏆 最高分 '+getHS()+'m</div><button class="btn" id="startBtn">开始逃生</button>';
  document.getElementById('startBtn').addEventListener('click',function(){ac();tone(660,0.1,'square',0.1);reset();state='playing';ov.style.display='none';});}
function showEnd(reason){var hs=getHS();ov.style.display='flex';ov.innerHTML='<h1>'+(reason==='lava'?'🔥':'🕳️')+'</h1><h1 style="font-size:30px">'+(reason==='lava'?'被熔岩吞没！':'掉下去了！')+'</h1><div class="bigscore">'+score+'m</div><div class="best">🏆 最高分 '+hs+'m</div><button class="btn" id="againBtn">再来一局</button>';
  document.getElementById('againBtn').addEventListener('click',function(){tone(660,0.1,'square',0.1);reset();state='playing';ov.style.display='none';});}
function pauseGame(){if(state!=='playing')return;state='paused';ov.style.display='flex';ov.innerHTML='<h1>⏸</h1><h1 style="font-size:28px">已暂停</h1><div class="sub">高度 '+score+'m</div><div class="row"><button class="btn" id="resumeBtn">继续</button><button class="btn2" id="restartBtn">重来</button></div>';
  document.getElementById('resumeBtn').addEventListener('click',function(){state='playing';ov.style.display='none';});
  document.getElementById('restartBtn').addEventListener('click',function(){reset();state='playing';ov.style.display='none';});}
bindDown(function(p){if(state==='playing')jump(p.x<W/2);});
document.getElementById('pauseBtn').addEventListener('click',function(){pauseGame();});
document.getElementById('soundBtn').addEventListener('click',function(){soundOn=!soundOn;this.textContent=soundOn?'🔊':'🔇';if(soundOn)tone(660,0.08,'square',0.1);});
var last=0;
function loop(t){requestAnimationFrame(loop);var dt=(t-last)/1000;last=t;if(!(dt>0)||dt>0.05)dt=0.016;if(state==='playing')update(dt);render();}
reset();showMenu();
requestAnimationFrame(loop);
</script>
</body>
</html>
