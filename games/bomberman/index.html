<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>炸弹人</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#121212;color:#f0f0f0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;display:flex;justify-content:center;min-height:100vh;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.wrap{width:100%;max-width:480px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:10px}
.topbar{width:100%;display:flex;justify-content:space-between;align-items:center}
.hud{display:flex;gap:12px;align-items:center;font-size:14px}
.hud b{color:#FFB74D;font-size:20px}
.lives{font-size:16px}
.iconbtn{background:#1f1f1f;border:1px solid #333;color:#fff;font-size:17px;width:40px;height:40px;border-radius:10px;cursor:pointer;transition:transform .08s}
.iconbtn:active{transform:scale(.9)}
#cv{background:#0d1b14;border-radius:12px;touch-action:none;width:100%;max-width:440px;height:auto;box-shadow:0 6px 24px rgba(0,0,0,.5)}
.controls{display:flex;gap:18px;align-items:center;justify-content:center;width:100%}
.dpad{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(3,58px);gap:4px}
.dbtn{background:#1f1f1f;border:1px solid #444;color:#fff;font-size:22px;border-radius:12px;cursor:pointer;transition:transform .08s;touch-action:none}
.dbtn:active{transform:scale(.9);background:#333}
.bombbtn{width:92px;height:92px;border-radius:50%;background:linear-gradient(135deg,#FF9800,#E65100);border:none;font-size:40px;cursor:pointer;transition:transform .08s;box-shadow:0 4px 18px rgba(255,152,0,.4);touch-action:none}
.bombbtn:active{transform:scale(.9)}
.tip{font-size:12px;color:#888;text-align:center}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.87);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;z-index:20;padding:24px;text-align:center}
.hidden{display:none!important}
.overlay h1{font-size:32px}
.overlay p{color:#bbb;font-size:15px;line-height:1.9;max-width:380px}
.btn{background:linear-gradient(135deg,#FFA726,#E65100);border:none;color:#fff;font-size:19px;font-weight:700;padding:13px 52px;border-radius:14px;cursor:pointer;transition:transform .08s;box-shadow:0 4px 16px rgba(255,152,0,.35)}
.btn:active{transform:scale(.94)}
.big{font-size:44px}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="hud">得分 <b id="score">0</b> <span class="lives" id="lives">❤❤❤</span> <span id="level">第1关</span></div>
    <div>
      <button class="iconbtn" id="pauseBtn">⏸</button>
      <button class="iconbtn" id="sndBtn">🔊</button>
    </div>
  </div>
  <canvas id="cv" width="390" height="390"></canvas>
  <div class="controls">
    <div class="dpad">
      <div></div><button class="dbtn" data-d="up">▲</button><div></div>
      <button class="dbtn" data-d="left">◀</button><div></div><button class="dbtn" data-d="right">▶</button>
      <div></div><button class="dbtn" data-d="down">▼</button><div></div>
    </div>
    <button class="bombbtn" id="bombBtn">💣</button>
  </div>
  <div class="tip">方向键移动 · 💣放炸弹 · 炸光小怪后进入🚪过关</div>
</div>

<div class="overlay" id="startOv">
  <div class="big">💣</div>
  <h1>炸弹人</h1>
  <p>方向键在迷宫中移动，按💣放炸弹。<br>炸弹 2.5 秒后十字爆炸，炸碎砖块、<br>消灭巡逻小怪。躲开小怪和自己的火焰！<br>消灭所有小怪后，🚪出口出现，走进去过关。<br>3 条命，看看能闯几关。</p>
  <button class="btn" id="startBtn">开始游戏</button>
</div>
<div class="overlay hidden" id="pauseOv">
  <h1>⏸ 已暂停</h1>
  <button class="btn" id="resumeBtn">继续</button>
</div>
<div class="overlay hidden" id="endOv">
  <div class="big" id="endEmoji">💥</div>
  <h1 id="endTitle">游戏结束</h1>
  <p id="endScore"></p>
  <p style="color:#888;font-size:13px" id="endHs"></p>
  <button class="btn" id="againBtn">重新开始</button>
</div>

<script>
'use strict';
// ============ 音效 ============
let AC=null, soundOn=true;
function tone(f,d,type,v,slide){ if(!soundOn)return; try{
  AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'square'; o.frequency.value=f;
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),AC.currentTime+d);
  g.gain.setValueAtTime(v||0.06,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+d);
  o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d);
}catch(e){} }
const sfx={
  click(){tone(650,0.06);},
  bomb(){tone(180,0.15,'triangle',0.09);},
  boom(){tone(90,0.5,'sawtooth',0.14,-40);},
  hit(){tone(140,0.3,'sawtooth',0.12,-60);},
  brick(){tone(500,0.08,'square',0.06,-200);},
  door(){tone(880,0.2,'sine',0.09,200);},
  win(){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,0.2,'triangle',0.09),i*120));},
  lose(){[400,300,200,150].forEach((f,i)=>setTimeout(()=>tone(f,0.25,'sawtooth',0.09,-40),i*160));}
};
const HSKEY='g100_bomberman_hs';
function getHS(){try{return +(localStorage.getItem(HSKEY)||0);}catch(e){return 0;}}
function setHS(v){try{localStorage.setItem(HSKEY,v);}catch(e){}}
// ============ 常量与关卡 ============
const COLS=13,ROWS=13,T=30; // 390x390
// 0空 1墙 2砖块
function buildLevel(lv,rng){
  rng=rng||Math.random;
  const g=[];
  for(let r=0;r<ROWS;r++){g.push([]);for(let c=0;c<COLS;c++){
    if(r===0||c===0||r===ROWS-1||c===COLS-1)g[r].push(1);
    else if(r%2===0&&c%2===0)g[r].push(1);
    else g[r].push(0);
  }}
  const free=[];
  for(let r=1;r<ROWS-1;r++)for(let c=1;c<COLS-1;c++){
    if(g[r][c]===0&&!(r<=2&&c<=2))free.push([r,c]);
  }
  // 砖块
  for(const [r,c] of free)if(rng()<0.62)g[r][c]=2;
  // 出口藏在一块砖下
  const bricks=free.filter(([r,c])=>g[r][c]===2);
  const door=bricks.length?bricks[(rng()*bricks.length)|0]:[1,3];
  // 小怪
  const n=Math.min(2+lv,6);
  const enemies=[];
  const spots=free.filter(([r,c])=>g[r][c]===0&&(r>4||c>4));
  for(let i=0;i<n&&spots.length;i++){
    const [r,c]=spots.splice((rng()*spots.length)|0,1)[0];
    enemies.push({r,c,x:c,y:r,dir:(rng()*4)|0,speed:0.028+rng()*0.012+lv*0.004,alive:true,turnT:0});
  }
  return {grid:g,door,enemies};
}
// ============ 游戏状态 ============
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let started=false,over=false,paused=false;
let grid,door,enemies,exitOpen;
let player,bombs,flames,particles,floaters;
let score=0,lives=3,level=1,keys={};
let lastTs=0,invuln=0;

function startGame(){
  score=0;lives=3;level=1;
  document.getElementById('startOv').classList.add('hidden');
  document.getElementById('endOv').classList.add('hidden');
  document.getElementById('pauseOv').classList.add('hidden');
  started=true;over=false;paused=false;
  loadLevel(1);updateHUD();sfx.click();
}
function loadLevel(lv){
  const L=buildLevel(lv);
  grid=L.grid;door=L.door;enemies=L.enemies;exitOpen=false;
  player={x:1,y:1,r:1,c:1,speed:0.09,alive:true,face:'down'};
  bombs=[];flames=[];particles=[];floaters=[];invuln=0;
  document.getElementById('level').textContent='第'+lv+'关';
}
function updateHUD(){
  document.getElementById('score').textContent=score;
  document.getElementById('lives').textContent='❤'.repeat(Math.max(0,lives))+'🖤'.repeat(Math.max(0,3-lives));
}
function walkable(r,c){return r>=0&&r<ROWS&&c>=0&&c<COLS&&grid[r][c]===0;}
function bombAt(r,c){return bombs.some(b=>b.r===r&&b.c===c);}
function placeBomb(){
  if(over||paused||!started||!player.alive)return;
  const r=Math.round(player.y),c=Math.round(player.x);
  if(bombAt(r,c)||bombs.length>=2)return;
  bombs.push({r,c,t:2.5});sfx.bomb();
}
function explode(b){
  sfx.boom();
  const cells=[[b.r,b.c]];
  for(const [dr,dc] of [[-1,0],[1,0],[0,-1],[0,1]]){
    for(let i=1;i<=2;i++){
      const r=b.r+dr*i,c=b.c+dc*i;
      if(grid[r][c]===1)break;
      cells.push([r,c]);
      if(grid[r][c]===2){grid[r][c]=0;score+=10;updateHUD();sfx.brick();
        for(let k=0;k<6;k++)particles.push({x:c*T+T/2,y:r*T+T/2,vx:(Math.random()-0.5)*3,vy:(Math.random()-0.5)*3-1,life:1,color:'#A1887F'});
        break;}
    }
  }
  flames.push({cells,t:0.55});
  // 杀伤判定
  for(const [r,c] of cells){
    for(const e of enemies)if(e.alive&&Math.round(e.y)===r&&Math.round(e.x)===c){
      e.alive=false;score+=100;updateHUD();
      floaters.push({x:c*T+T/2,y:r*T,txt:'+100',life:1});
      for(let k=0;k<10;k++)particles.push({x:c*T+T/2,y:r*T+T/2,vx:(Math.random()-0.5)*4,vy:(Math.random()-0.5)*4-2,life:1,color:'#FF8A65'});
    }
    if(player.alive&&invuln<=0&&Math.round(player.y)===r&&Math.round(player.x)===c)hitPlayer();
  }
  if(enemies.every(e=>!e.alive)&&!exitOpen){
    exitOpen=true;sfx.door();
    grid[door[0]][door[1]]=0; // 炸开/移除出口上的砖块，保证可到达
    floaters.push({x:door[1]*T+T/2,y:door[0]*T,txt:'出口开启！🚪',life:2});
  }
}
function hitPlayer(){
  if(invuln>0||!player.alive)return;
  lives--;updateHUD();sfx.hit();
  player.alive=false;
  for(let k=0;k<16;k++)particles.push({x:player.x*T+T/2,y:player.y*T+T/2,vx:(Math.random()-0.5)*5,vy:(Math.random()-0.5)*5-2,life:1.2,color:'#FFD54F'});
  if(lives<=0){gameOver(false);return;}
  setTimeout(()=>{ // 复活
    if(over)return;
    player.x=1;player.y=1;player.alive=true;invuln=2;
    // 清开出生点附近小怪
    for(const e of enemies)if(e.alive&&e.r<4&&e.c<4){e.r=ROWS-2;e.c=COLS-2;e.x=e.c;e.y=e.r;}
  },1200);
}
function gameOver(win){
  over=true;
  if(score>getHS())setHS(score);
  if(win)sfx.win();else sfx.lose();
  setTimeout(()=>{
    document.getElementById('endEmoji').textContent=win?'🏆':'💥';
    document.getElementById('endTitle').textContent=win?'全部通关！':'游戏结束';
    document.getElementById('endScore').textContent='得分 '+score+' · 到达第 '+level+' 关';
    document.getElementById('endHs').textContent='历史最高分：'+getHS();
    document.getElementById('endOv').classList.remove('hidden');
  },600);
}
// ============ 更新 ============
const DIRS4=[[0,-1],[-1,0],[0,1],[1,0]]; // up left down right -> [dr,dc]
function step(dt){
  // 玩家移动
  if(player.alive){
    let dx=0,dy=0;
    if(keys.up){dy=-1;player.face='up';}else if(keys.down){dy=1;player.face='down';}
    else if(keys.left){dx=-1;player.face='left';}else if(keys.right){dx=1;player.face='right';}
    if(dx||dy){
      const nx=player.x+dx*player.speed*dt,ny=player.y+dy*player.speed*dt;
      // 按轴碰撞
      if(walkable(Math.round(player.y),Math.round(nx))&&!bombAt(Math.round(player.y),Math.round(nx)))player.x=nx;
      if(walkable(Math.round(ny),Math.round(player.x))&&!bombAt(Math.round(ny),Math.round(player.x)))player.y=ny;
      player.x=Math.max(0.3,Math.min(COLS-1.3,player.x));
      player.y=Math.max(0.3,Math.min(ROWS-1.3,player.y));
    }
    if(invuln>0)invuln-=dt/60;
    // 出口
    if(exitOpen&&Math.round(player.x)===door[1]&&Math.round(player.y)===door[0]){
      score+=500;level++;updateHUD();sfx.win();
      floaters.push({x:player.x*T,y:player.y*T,txt:'过关 +500',life:1.5});
      setTimeout(()=>{if(!over)loadLevel(level);},800);
      player.alive=false; // 防止重复触发
      setTimeout(()=>{if(!over)player.alive=true;},900);
    }
    // 碰小怪
    for(const e of enemies){
      if(e.alive&&Math.abs(e.x-player.x)<0.6&&Math.abs(e.y-player.y)<0.6){hitPlayer();break;}
    }
  }
  // 炸弹
  for(const b of bombs){b.t-=dt/60;}
  const done=bombs.filter(b=>b.t<=0);
  bombs=bombs.filter(b=>b.t>0);
  for(const b of done)explode(b);
  // 火焰
  for(const f of flames)f.t-=dt/60;
  flames=flames.filter(f=>f.t>0);
  // 小怪 AI：随机+转向
  for(const e of enemies){
    if(!e.alive)continue;
    e.turnT-=dt/60;
    const [dr,dc]=DIRS4[e.dir];
    const nr=Math.round(e.y+dr*0.5),nc=Math.round(e.x+dc*0.5);
    let blocked=!walkable(Math.round(e.y)+dr,Math.round(e.x)+dc)||bombAt(Math.round(e.y)+dr,Math.round(e.x)+dc);
    if(blocked||e.turnT<=0){
      // 在路口随机转向
      if(Math.random()<0.35||blocked){
        const opts=[0,1,2,3].filter(d=>{
          const [adr,adc]=DIRS4[d];
          return walkable(Math.round(e.y)+adr,Math.round(e.x)+adc)&&!bombAt(Math.round(e.y)+adr,Math.round(e.x)+adc);
        });
        if(opts.length)e.dir=opts[(Math.random()*opts.length)|0];
        e.turnT=1+Math.random()*2;
      }
    }
    const [mdr,mdc]=DIRS4[e.dir];
    const tr=Math.round(e.y)+mdr,tc=Math.round(e.x)+mdc;
    if(walkable(tr,tc)&&!bombAt(tr,tc)){
      e.x+=mdc*e.speed*dt;e.y+=mdr*e.speed*dt;
      e.r=Math.round(e.y);e.c=Math.round(e.x);
    }
  }
  // 粒子
  for(const p of particles){p.x+=p.vx*dt/60*3;p.y+=p.vy*dt/60*3;p.vy+=0.1;p.life-=0.03*dt/60*2;}
  particles=particles.filter(p=>p.life>0);
  for(const f of floaters){f.y-=0.6*dt/60;f.life-=0.02*dt/60;}
  floaters=floaters.filter(f=>f.life>0);
}
// ============ 绘制 ============
function draw(){
  if(!grid)return;
  ctx.clearRect(0,0,390,390);
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const x=c*T,y=r*T;
    if(grid[r][c]===1){ctx.fillStyle='#37474F';ctx.fillRect(x,y,T,T);ctx.fillStyle='#455A64';ctx.fillRect(x+3,y+3,T-6,T-6);}
    else{ctx.fillStyle=(r+c)%2?'#12241a':'#0f1f16';ctx.fillRect(x,y,T,T);}
    if(grid[r][c]===2){
      ctx.fillStyle='#8D6E63';ctx.fillRect(x+1,y+1,T-2,T-2);
      ctx.fillStyle='#6D4C41';ctx.fillRect(x+4,y+4,T-8,T-8);
      ctx.strokeStyle='#4E342E';ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(x+1,y+T/2);ctx.lineTo(x+T-1,y+T/2);ctx.moveTo(x+T/2,y+1);ctx.lineTo(x+T/2,y+T-1);ctx.stroke();
    }
  }
  // 出口
  const [dr,dc]=door;
  if(grid[dr][dc]===0){
    ctx.fillStyle=exitOpen?'#FFD54F':'#5D4037';
    ctx.fillRect(dc*T+4,dr*T+4,T-8,T-8);
    ctx.font='18px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(exitOpen?'🚪':'❓',dc*T+T/2,dr*T+T/2+1);
    if(exitOpen){ctx.strokeStyle='rgba(255,213,79,'+(0.5+0.4*Math.sin(Date.now()/300))+')';ctx.lineWidth=3;ctx.strokeRect(dc*T+2,dr*T+2,T-4,T-4);}
  }
  // 炸弹
  for(const b of bombs){
    const x=b.r*T+T/2,y=b.c*T+T/2; // 注意：b.r是行
    const bx=b.c*T+T/2,by=b.r*T+T/2;
    const pul=1+0.15*Math.sin(Date.now()/120);
    ctx.font=(20*pul)+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('💣',bx,by);
  }
  // 火焰
  for(const f of flames){
    ctx.fillStyle='rgba(255,'+((Math.random()*120)|0)+',30,'+(f.t*1.6)+')';
    for(const [r,c] of f.cells)ctx.fillRect(c*T+2,r*T+2,T-4,T-4);
  }
  // 小怪
  for(const e of enemies){
    if(!e.alive)continue;
    const x=e.x*T+T/2,y=e.y*T+T/2;
    ctx.font='22px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('👾',x,y);
  }
  // 玩家
  if(player.alive){
    if(invuln>0&&((Date.now()/150)|0)%2===0){/*闪烁*/}
    else{
      const x=player.x*T+T/2,y=player.y*T+T/2;
      ctx.font='24px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText('🧑‍🚀',x,y);
    }
  }
  // 粒子
  for(const p of particles){
    ctx.globalAlpha=Math.max(0,Math.min(1,p.life));ctx.fillStyle=p.color;
    ctx.fillRect(p.x-2,p.y-2,4,4);
  }
  ctx.globalAlpha=1;
  // 飘字
  ctx.font='bold 15px sans-serif';ctx.textAlign='center';
  for(const f of floaters){
    ctx.globalAlpha=Math.max(0,Math.min(1,f.life));ctx.fillStyle='#FFD54F';
    ctx.fillText(f.txt,f.x,f.y);
  }
  ctx.globalAlpha=1;
}
function loop(ts){
  const dt=Math.min(3,(ts-lastTs)/16.7||1);lastTs=ts;
  if(started&&!paused&&!over)step(dt);
  draw();
  requestAnimationFrame(loop);
}
// ============ 输入 ============
function bindHold(el,down,up){
  const on=e=>{if(e.cancelable)e.preventDefault();down();};
  const off=e=>{if(e.cancelable)e.preventDefault();if(up)up();};
  el.addEventListener('touchstart',on,{passive:false});
  el.addEventListener('touchend',off,{passive:false});
  el.addEventListener('touchcancel',off,{passive:false});
  el.addEventListener('mousedown',on);
  el.addEventListener('mouseup',off);
  el.addEventListener('mouseleave',off);
}
document.querySelectorAll('.dbtn').forEach(b=>{
  const d=b.dataset.d;
  bindHold(b,()=>{keys[d]=true;},()=>{keys[d]=false;});
});
bindHold(document.getElementById('bombBtn'),()=>{placeBomb();});
document.addEventListener('keydown',e=>{
  const m={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'};
  if(m[e.key])keys[m[e.key]]=true;
  if(e.key===' '){e.preventDefault();placeBomb();}
});
document.addEventListener('keyup',e=>{
  const m={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'};
  if(m[e.key])keys[m[e.key]]=false;
});
document.getElementById('startBtn').addEventListener('click',startGame);
document.getElementById('againBtn').addEventListener('click',startGame);
document.getElementById('pauseBtn').addEventListener('click',()=>{
  if(!started||over)return;paused=true;
  document.getElementById('pauseOv').classList.remove('hidden');sfx.click();
});
document.getElementById('resumeBtn').addEventListener('click',()=>{
  paused=false;document.getElementById('pauseOv').classList.add('hidden');sfx.click();
});
document.getElementById('sndBtn').addEventListener('click',function(){
  soundOn=!soundOn;this.textContent=soundOn?'🔊':'🔇';if(soundOn)sfx.click();
});
draw();requestAnimationFrame(loop);
</script>
</body>
</html>
