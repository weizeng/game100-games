<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<style>
/* 游戏自身样式只管布局与玩法元素；颜色/面板/按钮外观交给共用皮肤（sync 时注入）。 */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{display:flex;justify-content:center;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.wrap{width:100%;max-width:480px;height:100%;padding:12px;display:flex;flex-direction:column;align-items:center;gap:10px}
.topbar{width:100%;display:flex;justify-content:space-between;align-items:center}
.topbar .tools{display:flex;gap:8px}
.topbar .tools .iconbtn{min-width:44px;min-height:44px}
#cv{width:100%;max-height:calc(100svh - 230px);aspect-ratio:360/540;object-fit:contain;touch-action:none;border-radius:16px}
.hint{font-size:13px;text-align:center}
#fireBtn{min-width:44px;min-height:44px;width:100%}
.panrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.panrow .panbtn{min-width:44px;min-height:44px;padding:8px 12px}
.panrow .panbtn.sel{outline:3px solid #ffd34d}
.panrow .panbtn:disabled{opacity:.45}
.overlay{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;z-index:20;padding:24px;text-align:center}
.overlay.hidden{display:none}
</style>
<!-- GAME UI BEGIN -->
<style>
:root{--page:#f2dfd5;--surface:#fff6ed;--soft:#e9caba;--ink:#542f29;--muted:#8b5d50;--accent:#a64a32;--on-accent:#ffffff;--line:#cfa693;--stage:#452b26;--page:#ff5f6d;--surface:#fff6ee;--soft:#ffe4d5;--ink:#5a2318;--muted:#8e5446;--accent:#735f23;--on-accent:#ffffff;--line:#ffad8a;--b-bg1:#ffb58a;--b-bg2:#ff5f6d;--b-btn:#ffd34d;--b-btn-hi:#ffe28b;--b-edge:#d98a00;--b-glow:#ffe2c4;--b-glow-rgb:255,226,196;--b-pedge-rgb:255,173,138;--b-btn-ink:#774c00;--b-btn-tsh:0 1px 0 rgba(255,255,255,.45);--b-coin-ink:#774c00;--b-coin-tsh:none;--b-key-ink:#735f23;--b-title:#935e00}
/* Shared presentation only; mechanics and state remain inside each standalone game. */
html.game-ui{background:var(--page);color:var(--ink);color-scheme:light;font-family:"Bahnschrift","Microsoft YaHei UI","PingFang SC",sans-serif}

.game-ui body{background:var(--page);color:var(--ink);font-family:inherit;overscroll-behavior:none}
.game-ui body>.wrap{padding:20px 16px max(20px,env(safe-area-inset-bottom));gap:14px;max-width:500px}
.game-ui #app{background:var(--page);color:var(--ink)}
.game-ui :is(.topbar,#topbar){gap:8px;flex-wrap:wrap;min-height:58px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:10px 12px;box-shadow:0 3px 0 var(--soft);font-size:13px}
.game-ui :is(.title,.tb-title,.tb-title,#topbar .t,.topbar .t){color:var(--ink);font-size:16px;font-weight:750;letter-spacing:0}

.game-ui :is(.stat,.topbar .s,.topbar .stat,.scorebar,.stats,.tip,.hint,.hintline,.hsline,.best,.hiscore){color:var(--muted);line-height:1.7}

.game-ui .scorebar{padding:6px 10px;gap:8px;flex-wrap:wrap}
.game-ui :is(.iconbtn,.iconBtn,.icobtn,.ibtn,.tbtn,.hbtn,.ib,.iconBtn,.pause){min-width:44px;min-height:44px;flex-shrink:0;border-radius:12px;background:var(--soft);color:var(--ink);border:1px solid var(--line);box-shadow:none;font-size:17px}
.game-ui button{font-family:inherit;cursor:pointer;touch-action:manipulation}

.game-ui :is(.rowbtns,.btnrow,.ctlrow){gap:10px;flex-wrap:wrap;justify-content:center}
.game-ui :is(.pill,.hudbox,.hud .p){background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:none;font-variant-numeric:tabular-nums}
.game-ui :is(.dbtn,.cbtn,.gbtn,.holdbtn,.firebtn,.bombbtn,.jumpbtn,.pumpbtn,.nbtn){border-radius:12px;box-shadow:0 3px 0 var(--line);min-height:44px}
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv,.screen):has(>.ui-panel){padding:20px;overflow-y:auto;overscroll-behavior:contain}

.game-ui .ui-panel{width:min(100%,380px);max-height:100%;overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:18px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:24px;padding:30px 24px;box-shadow:0 8px 0 var(--soft),0 20px 48px #15253618;text-align:center;margin:auto}
.game-ui .ui-panel :is(.card,.panel,.pausecard,.ovcard){display:contents}

.game-ui .ui-emblem{width:90px;height:90px;display:grid;place-items:center;border:1px solid var(--line);border-radius:28px;background:var(--soft);font-size:48px;line-height:1;flex-shrink:0;position:relative}

.game-ui body>.wrap>canvas:not(#fx){background-color:var(--stage);box-shadow:0 0 0 1px var(--line),0 6px 0 var(--soft);border-radius:18px;flex-shrink:0}
.game-ui .screen>canvas.game{box-shadow:0 0 0 1px var(--line),0 6px 0 var(--soft)}
.game-ui #hud{gap:6px;background:var(--surface);color:var(--ink)}
.game-ui #hud :is(.left,.t,.s,.grp,.pill){color:var(--ink)}
.game-ui #hud .pill{background:var(--surface);border-color:var(--line)}
.game-ui body canvas:is(#cv,#game,#board){background-color:var(--stage)}
.game-ui :is(button.dbtn,button.cbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.game-ui :is(button.lvl,button.lvlbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line);border-radius:12px;min-height:54px}
.game-ui :is(button.lvl,button.lvlbtn) :is(.nc,.sz,small){color:var(--muted)}
.game-ui .ui-panel button.lvl{margin:0;min-width:44px;box-shadow:none;padding:8px}
.game-ui #hud :is(.left,.right,.hudl,.hbtns){gap:5px;flex-wrap:wrap}
.game-ui #hud :is(.left,.hudl){min-width:0;flex-shrink:1}
.game-ui #hud :is(.pill,.left){font-size:12px}
.game-ui button:disabled{cursor:default;opacity:.45;box-shadow:none}
.game-ui .ui-panel .ui-assist-note{color:var(--accent);font-weight:700}
@media(min-width:700px){.game-ui body>.wrap{padding-top:32px}.game-ui .ui-panel{padding:36px 30px}}
@media(max-width:360px){.game-ui body>.wrap{padding:10px;gap:10px}.game-ui .ui-panel{padding:22px 18px;gap:13px}.game-ui .ui-panel h1{font-size:26px}.game-ui .ui-emblem{width:70px;height:70px;font-size:38px}.game-ui :is(.topbar,#topbar){gap:5px;padding:8px}.game-ui :is(.iconbtn,.icobtn,.ibtn,.tbtn,.ib){min-width:40px;min-height:44px}}
@media(max-height:650px){.game-ui .ui-panel{padding:18px;gap:12px}.game-ui .ui-emblem{width:60px;height:60px;font-size:32px}.game-ui .ui-panel h1{font-size:25px}.game-ui .ui-panel :is(p,.howto,.sub,.rule){font-size:13px}}

/* 2026-10-20 热修：开局/结算遮罩铺满整屏，主按钮固定在面板底部，避免被画布尺寸裁切（#10） */
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv):has(>.ui-panel){position:fixed;inset:0;z-index:1000;border-radius:0;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
.game-ui .ui-panel{touch-action:pan-y}
.game-ui .ui-panel :is(#startBtn,#btnStart,.startbtn,#bStart,#restartBtn,#btnRestart,#againBtn,#btnAgain,#retryBtn,#btnRetry,#playBtn,#btnPlay){position:sticky;bottom:0;z-index:3;flex-shrink:0}
.game-ui .ui-panel :not(.card,.panel,.pausecard,.ovcard,.ui-mode):has(>:is(#startBtn,#btnStart,.startbtn,#bStart,#restartBtn,#btnRestart,#againBtn,#btnAgain,#retryBtn,#btnRetry,#playBtn,#btnPlay)){position:sticky;bottom:0;z-index:3;flex-shrink:0;background:var(--surface);box-shadow:0 -10px 10px -6px var(--surface)}

    },
    // Glow is shadowBlur: cheap for a handful of shapes, never use it on every tile.
    glow: function (ctx, color, blur) { ctx.shadowColor = color; ctx.shadowBlur = blur; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0; },
    noGlow: function (ctx) { ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; },
    // Crisp rendering on high-DPI phones without changing game coordinates.
    // Only safe where input code converts with getBoundingClientRect + logical W/H, not cv.width.
    hidpi: function (cv, ctx, w, h) {
      var d = Math.max(1, Math.min(2.5, window.devicePixelRatio || 1));
      cv.width = Math.round(w * d); cv.height = Math.round(h * d); // intrinsic ratio stays w:h, so CSS sizing is unchanged
      ctx.setTransform(d, 0, 0, d, 0, 0); return d;
    },
    // Lightweight particle bursts (pooled array, no allocations per frame beyond the burst).
    burst: function (list, x, y, color, n) {
      for (var i = 0; i < (n || 12); i++) { var a = Math.random() * 6.283, v = 1 + Math.random() * 2.6; list.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 1, life: 1, c: color, r: 1.5 + Math.random() * 2.5 }); }
    },
    drawBurst: function (ctx, list) {
      for (var i = list.length - 1; i >= 0; i--) {
        var p = list[i]; p.x += p.vx; p.y += p.vy; p.vy += .12; p.life -= .035;
        if (p.life <= 0) { list.splice(i, 1); continue; }
        ctx.globalAlpha = p.life; ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (skin === 'b' ? 1.2 : 1), 0, 7); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
  };
  window.GameUI.fx = fx;
}());

</script>
<!-- GAME UI END -->
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <span class="title">🍳 神级颠勺</span>
    <span>得分 <b id="score">0</b> · 最佳 <b id="best">0</b></span>
    <span class="tools"><button class="iconbtn" id="muteBtn" aria-label="切换音效">🔊</button><button class="iconbtn" id="pauseBtn" aria-label="暂停游戏">⏸</button></span>
  </div>
  <canvas id="cv"></canvas>
  <button class="btn" id="fireBtn">🔥 开大火（回满火候，糊得更快）</button>
  <p class="hint">按住画面蓄力，松手颠勺 · 抛进绿色完美区得分 · 第 <b id="lv">1</b>/10 关</p>
</div>
<div class="overlay" id="startScr"><h1>🍳 神级颠勺</h1><p>按住屏幕蓄力，松手颠勺！食材抛进绿色完美区 +20，连击加分。<br>抛太高飞出锅外扣 1 命，太低没抛起糊值 +20；糊值满 100 炒糊扣 1 命。<br>火候会自动下降，「开大火」回满但糊得更快——大火高分高风险。<br>第 4 关起防辣椒炸锅（3 秒内连点灭火），第 7 关双食材，第 10 关满汉全席！</p><div class="panrow" id="panRow"></div><button class="btn" id="startBtn">开始游戏</button></div>
<div class="overlay hidden" id="pauseOv"><h1>⏸ 已暂停</h1><button class="btn" id="resumeBtn">继续</button><button class="btn ghost" id="quitBtn">重新开始</button></div>
<div class="overlay hidden" id="overScr"><h1>游戏结束</h1><div class="score" id="finalScore">0</div><p id="overText"></p><button class="btn" id="againBtn">再来一局</button></div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const W=360,H=540;                       // 逻辑坐标：所有玩法/命中判定都用它
const cv=$('cv'),ctx=cv.getContext('2d');
const UI=window.GameUI||{pick:(a)=>a,storageGet:k=>localStorage.getItem(k),storageSet:(k,v)=>localStorage.setItem(k,v)};
const FX=UI.fx&&UI.fx.on?UI.fx:null;     // 共用皮肤的画布立体工具；没有时走平面画法
if(FX)FX.hidpi(cv,ctx,W,H);else{cv.width=W;cv.height=H;}
// ---- 锅具（成长解锁） ----
const PANS=[
  {name:'铁锅',  chargeT:.9, zonePad:0, heatMult:0,   burnMul:1,   need:0},
  {name:'不粘锅',chargeT:1.15,zonePad:10,heatMult:0,   burnMul:1,   need:500},
  {name:'紫铜锅',chargeT:.9, zonePad:0, heatMult:.45, burnMul:1.6, need:1500},
];
function getProg(){try{const p=JSON.parse(UI.storageGet('g100_wokflip_prog')||'{}');return{sel:p.sel||0};}catch(e){return{sel:0};}}
function setProg(p){UI.storageSet('g100_wokflip_prog',JSON.stringify(p));}
let prog=getProg(),pan=PANS[prog.sel]||PANS[0];
// ---- 状态 ----
let state='menu',score=0,lives=3,level=1,combo=0,heat=.8,burnX2T=0,hush=0,last=0;
let items=[],sparks=[],floats=[],charging=false,charge=0,chiliEv=null,chiliT=0;
const REST_Y=H-100,MOUTH_Y=H-140;        // 锅里食材静止高度 / 锅口高度
const TARGETS=[0,120,260,420,600,800,1020,1260,1520,1800,2100];
const FOOD=['🥕','🥩','🌶️','🍤','🌽','🍄'];
let best=+UI.storageGet('g100_wokflip_hs')||0;$('best').textContent=best;
function zoneTop(){return 300-pan.zonePad;}
function zoneBot(){return 360+pan.zonePad;}
function itemCount(){return level>=10?5:level>=7?2:1;}
function resetItems(){items=[];const n=itemCount();for(let i=0;i<n;i++)items.push({e:FOOD[i%FOOD.length],ox:(i-(n-1)/2)*26,st:'in',x:0,y:0,vx:0,vy:0,minY:0});}
// ---- 音效：WebAudio 合成，无外部资源；遵守静音开关 ----
let muted=UI.storageGet('g100_wokflip_mute')==='1',ac=null;$('muteBtn').textContent=muted?'🔇':'🔊';
function beep(f,d,type){if(muted)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(.15,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d);}catch(e){}}
$('muteBtn').addEventListener('click',()=>{muted=!muted;UI.storageSet('g100_wokflip_mute',muted?'1':'0');$('muteBtn').textContent=muted?'🔇':'🔊';});
// ---- 输入：pointer 事件 + 按画布显示尺寸换算到逻辑坐标（桌球 #15 的教训） ----
function posOf(e){const r=cv.getBoundingClientRect();const t=(e.touches&&e.touches.length)?e.touches[0]:(e.changedTouches&&e.changedTouches.length)?e.changedTouches[0]:e;return{x:(t.clientX-r.left)*W/r.width,y:(t.clientY-r.top)*H/r.height};}
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();if(state!=='play')return;
  cv.setPointerCapture&&cv.setPointerCapture(e.pointerId);
  const p=posOf(e);
  if(chiliEv){ // 辣椒炸锅：3 秒内连点灭火
    const d=Math.hypot(p.x-chiliEv.x,p.y-chiliEv.y);
    if(d<48){chiliEv.taps++;beep(700+chiliEv.taps*80,.06,'square');if(FX)FX.burst(sparks,chiliEv.x,chiliEv.y,'#7CFF6B',10);
      if(chiliEv.taps>=5){score+=30;$('score').textContent=score;floats.push({x:chiliEv.x,y:chiliEv.y-20,t:'灭火成功 +30',c:'#7CFF6B',life:1.2});beep(1200,.15);chiliEv=null;chiliT=12+Math.random()*8;}}
    return;
  }
  charging=true;charge=0;
});
cv.addEventListener('pointerup',e=>{
  if(chiliEv||state!=='play')return;
  if(!charging)return;charging=false;toss();
});
cv.addEventListener('pointercancel',()=>{charging=false;});
document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();if(state!=='play')return;
  if(e.type==='keydown'&&!charging&&!chiliEv){charging=true;charge=0;}}});
document.addEventListener('keyup',e=>{if(e.code==='Space'&&charging&&state==='play'&&!chiliEv){charging=false;toss();}});
// ---- 颠勺 ----
function toss(){
  const p=Math.min(1,charge),wob=heat*90;
  for(const it of items){if(it.st!=='in')continue;
    it.st='air';it.vy=-(160+560*p);it.vx=(Math.random()*2-1)*wob;it.minY=REST_Y;}
  beep(300+p*300,.12,'triangle');
}
function float(t,c){floats.push({x:W/2,y:H/2-40,t,c:c||'#fff',life:1.2});}
function judge(it){
  const m=it.minY,zt=zoneTop(),zb=zoneBot();
  it.st='in';
  if(m<zt-40){ // 飞出锅外
    lives--;combo=0;float('飞出锅外！-1 命','#ff6b6b');beep(150,.3,'sawtooth');
    if(lives<=0)return over(false);
  }else if(m>=zt&&m<=zb){ // 完美（边缘博高连击：越靠近中心分越高）
    combo++;
    const center=(zt+zb)/2,edge=Math.abs(m-center)/((zb-zt)/2); // 0 中心 ~ 1 边缘
    const mult=(1+heat*.8+pan.heatMult)*(1.25-.25*edge);
    const pts=Math.round(20*(1+.15*(combo-1))*Math.max(1,Math.round(mult*10)/10));
    score+=pts;$('score').textContent=score;
    float((combo>1?combo+'连击 ':'')+'完美 +'+pts,'#7CFF6B');
    if(FX)FX.burst(sparks,it.x,m,'#7CFF6B',16);beep(880+Math.min(combo,10)*40,.1);
  }else if(m>=zt-40&&m<=zb+60){ // 擦边
    score+=8;$('score').textContent=score;float('擦边 +8','#ffd34d');beep(500,.08);
  }else{ // 没抛起来
    hush+=20;combo=0;float('没抛起来 糊+20','#ffb14d');beep(200,.2,'sawtooth');
  }
}
// ---- 流程 ----
function show(id,on){$(id).classList.toggle('hidden',!on);}
function start(){
  pan=PANS[prog.sel]||PANS[0];
  score=0;lives=3;level=1;combo=0;heat=.8;burnX2T=0;hush=0;
  chiliEv=null;chiliT=14;charging=false;charge=0;floats=[];sparks=[];
  resetItems();$('score').textContent=0;$('lv').textContent=1;
  show('startScr',false);show('overScr',false);show('pauseOv',false);state='play';last=performance.now();beep(660,.12);
}
function pause(){if(state!=='play')return;state='pause';show('pauseOv',true);}
function resume(){if(state!=='pause')return;state='play';last=performance.now();show('pauseOv',false);}
function over(win){
  state='over';
  let unlockMsg='';
  if(score>best){best=score;UI.storageSet('g100_wokflip_hs',best);$('best').textContent=best;
    if(best>=1500&&prog.sel<2){prog.sel=2;setProg(prog);unlockMsg=' · 解锁紫铜锅！';}
    else if(best>=500&&prog.sel<1){prog.sel=1;setProg(prog);unlockMsg=' · 解锁不粘锅！';}}
  $('finalScore').textContent=score;
  $('overText').textContent=(win?'🏆 通关！满汉全席！':'')+'到达第 '+level+' 关 · 最佳 '+best+unlockMsg;
  show('overScr',true);beep(win?880:220,.4,'triangle');renderPans();
}
$('startBtn').addEventListener('click',start);$('againBtn').addEventListener('click',start);
$('pauseBtn').addEventListener('click',()=>state==='play'?pause():resume());$('resumeBtn').addEventListener('click',resume);
$('quitBtn').addEventListener('click',()=>{show('pauseOv',false);start();});
$('fireBtn').addEventListener('click',()=>{if(state!=='play')return;heat=1;burnX2T=10;float('大火全开！糊得更快','#ff9f2e');beep(440,.15,'sawtooth');});
// 切到后台自动暂停（App 切换、锁屏）
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
// 锅具选择
function renderPans(){
  const row=$('panRow');row.innerHTML='';
  PANS.forEach((p,i)=>{
    const b=document.createElement('button');
    b.className='panbtn btn'+(i===prog.sel?' sel':'');
    b.textContent=p.name+(best>=p.need?'':' 🔒'+p.need);
    b.disabled=best<p.need;
    b.addEventListener('click',()=>{prog.sel=i;setProg(prog);renderPans();beep(700,.08);});
    row.appendChild(b);
  });
}
renderPans();
// ---- 循环 ----
function update(dt){
  if(charging){charge=Math.min(1,charge+dt/pan.chargeT);}
  // 火候自动下降；火越旺糊得越快；开大火后 10 秒糊速翻倍
  heat=Math.max(0,heat-.05*dt);
  if(burnX2T>0)burnX2T-=dt;
  if(heat>.5)hush+=dt*(heat>.75?4:2)*(burnX2T>0?pan.burnMul*2:1)*.5;
  if(hush>=100){ // 炒糊了：本关失败
    hush=0;combo=0;lives--;float('炒糊了！-1 命','#ff6b6b');beep(140,.35,'sawtooth');
    if(lives<=0)return over(false);
  }
  // 食材物理
  for(const it of items){
    if(it.st==='air'){
      it.vy+=980*dt;it.x+=it.vx*dt;it.y=(it.y||REST_Y)+it.vy*dt;
      if(it.y<it.minY)it.minY=it.y;
      it.x=Math.max(20,Math.min(W-20,it.x));
      if(it.vy>0&&it.y>=REST_Y){it.y=REST_Y;judge(it);if(state!=='play')break;}
    }else{it.x=W/2+it.ox;it.y=REST_Y;}
  }
  // 辣椒炸锅随机事件（第 4 关起）
  if(level>=4&&!chiliEv){
    chiliT-=dt;
    if(chiliT<=0){
      chiliEv={x:60+Math.random()*(W-120),y:140+Math.random()*160,t:3,taps:0};
      float('🌶️ 辣椒炸锅！连点灭火！','#ff6b6b');beep(180,.4,'sawtooth');
    }
  }
  if(chiliEv){
    chiliEv.t-=dt;
    if(chiliEv.t<=0){ // 没灭掉
      chiliEv=null;chiliT=12+Math.random()*8;hush+=40;combo=0;
      float('炸锅了！糊+40','#ff6b6b');beep(120,.5,'sawtooth');
    }
  }
  // 过关
  if(score>=TARGETS[level]){
    if(level>=10)return over(true);
    level++;$('lv').textContent=level;resetItems();hush=Math.max(0,hush-30);
    float('🎉 第 '+level+' 关！'+(level===4?'小心辣椒炸锅':level===7?'双食材同抛！':level===10?'满汉全席！':''),'#ffd34d');
    beep(1200,.2,'square');
  }
  for(let i=floats.length-1;i>=0;i--){floats[i].life-=dt;floats[i].y-=24*dt;if(floats[i].life<=0)floats.splice(i,1);}
}
function bar(x,y,w,h,frac,c1,c2){
  ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(x,y,w,h);
  if(FX)FX.tile(ctx,x,y,w*Math.max(0,Math.min(1,frac)),h,frac>.5?c1:c2,4);
  else{ctx.fillStyle=frac>.5?c1:c2;ctx.fillRect(x,y,w*Math.max(0,Math.min(1,frac)),h);}
}
function draw(){
  if(FX)FX.stage(ctx,W,H,'#4a2410','#180b04');else{ctx.fillStyle='#2a1408';ctx.fillRect(0,0,W,H);}
  // 完美区（绿色区间）
  const zt=zoneTop(),zb=zoneBot();
  ctx.fillStyle='rgba(80,255,110,.16)';ctx.fillRect(40,zt,W-80,zb-zt);
  ctx.strokeStyle='rgba(80,255,110,.75)';ctx.lineWidth=2;ctx.setLineDash([8,6]);
  ctx.strokeRect(40,zt,W-80,zb-zt);ctx.setLineDash([]);
  ctx.fillStyle='rgba(124,255,107,.9)';ctx.font='12px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('完美区',W/2,(zt+zb)/2);
  // 火候条 & 糊值条 & 命
  ctx.textAlign='left';ctx.font='13px sans-serif';ctx.fillStyle='#fff';
  ctx.fillText('🔥',6,14);bar(26,7,W-120,12,heat,'#ff9f2e','#c33');
  ctx.fillText('糊',6,32);bar(26,25,W-120,12,hush/100,'#8a5a2b','#5b3410');
  ctx.fillText('❤️'.repeat(Math.max(0,lives)),10,50);
  if(combo>1){ctx.textAlign='right';ctx.fillStyle='#ffd34d';ctx.fillText(combo+' 连击',W-10,50);}
  if(burnX2T>0){ctx.textAlign='right';ctx.fillStyle='#ff9f2e';ctx.fillText('大火 '+Math.ceil(burnX2T)+'s',W-10,66);}
  // 辣椒炸锅事件
  if(chiliEv){
    const e=chiliEv;
    ctx.font='40px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('🌶️',e.x,e.y);ctx.fillText('🔥',e.x,e.y-34);
    ctx.fillStyle='#fff';ctx.font='bold 15px sans-serif';
    ctx.fillText('连点灭火 '+e.t.toFixed(1)+'s ('+e.taps+'/5)',e.x,e.y+36);
  }
  // 铁锅
  const wx=W/2,wy=MOUTH_Y+44;
  if(FX)FX.shadow(ctx,wx,wy+22,86,10);
  ctx.fillStyle='#23232c';ctx.beginPath();ctx.ellipse(wx,wy,86,26,0,0,Math.PI);ctx.fill();
  ctx.fillStyle='#33333e';ctx.beginPath();ctx.ellipse(wx,wy,86,26,0,Math.PI,0);ctx.fill();
  ctx.fillStyle='#101014';ctx.beginPath();ctx.ellipse(wx,wy,70,19,0,Math.PI,0);ctx.fill();
  if(FX){FX.tile(ctx,wx+78,wy-34,52,12,'#7a5a3a',6);}else{ctx.fillStyle='#7a5a3a';ctx.fillRect(wx+78,wy-34,52,12);}
  // 食材
  ctx.font='30px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  for(const it of items){
    if(FX){FX.glow(ctx,'#ffdf8a',8);ctx.fillText(it.e,it.x,it.y);FX.noGlow(ctx);}
    else ctx.fillText(it.e,it.x,it.y);
  }
  if(FX)FX.drawBurst(ctx,sparks);
  // 飘字
  ctx.textAlign='center';
  for(const f of floats){
    ctx.globalAlpha=Math.min(1,f.life*2);ctx.fillStyle=f.c;ctx.font='bold 17px sans-serif';
    ctx.fillText(f.t,f.x,f.y);ctx.globalAlpha=1;
  }
  // 蓄力条
  if(charging){
    const bw=18,bh=140,bx=W-34,by=H/2-bh/2;
    ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(bx,by,bw,bh);
    if(FX)FX.tile(ctx,bx,by+bh*(1-charge),bw,bh*charge,charge>.85?'#ff4444':charge>.5?'#ffd34d':'#7CFF6B',6);
    else{ctx.fillStyle=charge>.85?'#ff4444':'#ffd34d';ctx.fillRect(bx,by+bh*(1-charge),bw,bh*charge);}
    ctx.fillStyle='#fff';ctx.font='12px sans-serif';ctx.fillText('力',bx+bw/2,by-12);
  }
}
function frame(t){const dt=Math.min(.05,(t-last)/1000);last=t;if(state==='play')update(dt);draw();requestAnimationFrame(frame);}
draw();requestAnimationFrame(frame);
</script>
</body></html>
