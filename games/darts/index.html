<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>飞镖 - 游戏100</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#0b0b10;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#f0f0f5;user-select:none;-webkit-user-select:none}
#wrap{max-width:480px;height:100%;margin:0 auto;position:relative;background:linear-gradient(180deg,#1a1420 0%,#0e0d14 60%,#14101c 100%);overflow:hidden}
canvas{display:block;width:100%;touch-action:none}
#hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:8px 10px;z-index:5;background:linear-gradient(180deg,rgba(0,0,0,.6),transparent);pointer-events:none}
#hud .t{font-size:14px;font-weight:700}
#hud .s{font-size:13px;color:#ffb3c1;font-weight:700;margin-top:2px}
#hud .btns{pointer-events:auto;display:flex;gap:8px}
.ib{width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:#fff;font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.ib:active{transform:scale(.9)}
.ov{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(8,6,10,.94);padding:24px;text-align:center}
.ov h1{font-size:30px;margin-bottom:4px}
.ov h2{font-size:24px;margin-bottom:6px}
.ov p{font-size:14px;color:#c9b9c9;line-height:1.8;margin:10px 0 18px;max-width:330px}
.bb{font-size:17px;font-weight:700;color:#fff;border:none;border-radius:999px;padding:13px 44px;background:linear-gradient(135deg,#e0395f,#a03ff0);box-shadow:0 6px 20px rgba(224,57,95,.4);cursor:pointer;transition:transform .08s;margin:5px}
.bb:active{transform:scale(.94)}
.bb.ghost{background:linear-gradient(135deg,#4a4a5c,#33333f);box-shadow:none}
.score{font-size:46px;font-weight:800;color:#ffb3c1;margin:4px 0}
.best{font-size:13px;color:#9a9ab0;margin-top:10px}
.hide{display:none!important}
#tip{position:absolute;bottom:12px;left:0;right:0;text-align:center;font-size:13px;color:#e6d5e6;z-index:4;pointer-events:none;text-shadow:0 1px 4px #000;padding:0 20px}
#dartTray{position:absolute;bottom:44px;left:0;right:0;text-align:center;font-size:22px;z-index:4;pointer-events:none;letter-spacing:4px}
</style>
</head>
<body>
<div id="wrap">
<canvas id="cv" width="360" height="540"></canvas>
<div id="hud"><div><div class="t">🎯 飞镖</div><div class="s" id="hs">第 1/10 镖 · 0 分</div></div><div class="btns"><button class="ib" id="snd">🔊</button><button class="ib" id="pz">⏸</button></div></div>
<div id="dartTray"></div>
<div id="tip"></div>
<div class="ov" id="ovStart"><h1>🎯 飞镖</h1><p>准星在靶上来回晃动，越到后面越快<br>看准时机点击屏幕掷出飞镖<br>越靠近靶心环数越高，共 10 镖</p><button class="bb" id="btnStart">开始挑战</button><div class="best" id="bestStart"></div></div>
<div class="ov hide" id="ovPause"><h2>⏸ 已暂停</h2><br><button class="bb" id="btnResume">继续</button><button class="bb ghost" id="btnRestart1">重新开始</button></div>
<div class="ov hide" id="ovEnd"><h2 id="endTitle">🏁 挑战结束！</h2><div class="score" id="endScore">0</div><div class="best" id="endBest"></div><div class="best" id="endDetail" style="margin-top:6px"></div><button class="bb" id="btnRestart2">再来一次</button></div>
</div>
<script>
(function(){
"use strict";
var cv=document.getElementById('cv'),ctx=cv.getContext('2d'),W=360,H=540;
var $=function(id){return document.getElementById(id);};
/* 音频 */
var AC=null,soundOn=true;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended'){AC.resume();}return AC;}
function tone(f,d,type,v,slide,delay){if(!soundOn)return;var a=ac();if(!a)return;try{var t0=a.currentTime+(delay||0);var o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t0);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t0+d);g.gain.setValueAtTime(v||.1,t0);g.gain.exponentialRampToValueAtTime(.001,t0+d);o.connect(g);g.connect(a.destination);o.start(t0);o.stop(t0+d+.03);}catch(e){}}
var sfx={
 click:function(){tone(620,.06,'square',.06);},
 whoosh:function(){tone(900,.18,'sawtooth',.06,-600);},
 thud:function(){tone(140,.12,'square',.12,-40);},
 bull:function(){var fs=[660,880,1320];for(var i=0;i<fs.length;i++)tone(fs[i],.2,'triangle',.1,0,i*.07);},
 win:function(){var fs=[523,659,784,1046];for(var i=0;i<fs.length;i++)tone(fs[i],.3,'triangle',.1,0,i*.1);}
};
/* 最高分 */
var KEY='game100_darts_best';
function getBest(){try{return parseInt(localStorage.getItem(KEY),10)||0;}catch(e){return 0;}}
function setBest(v){try{localStorage.setItem(KEY,String(v));}catch(e){}}
/* 状态 */
var CX=180,CY=235,BULL=13,RING=17.5; // 10 环
var TOTAL=10;
var dartN=0,total=0,scores=[],phase='menu',paused=false;
var t=0,aim={x:CX,y:CY},flying=null,stuck=[],parts=[],floaters=[],lockUntil=0;
function newGame(){
 dartN=0;total=0;scores=[];stuck=[];parts=[];floaters=[];flying=null;t=0;paused=false;
 phase='aim';
 $('ovStart').classList.add('hide');$('ovEnd').classList.add('hide');$('ovPause').classList.add('hide');
 hud();tray();tip('点击屏幕任意处掷出飞镖！');loop();
}
function hud(){$('hs').textContent='第 '+Math.min(dartN+1,TOTAL)+'/'+TOTAL+' 镖 · '+total+' 分';}
function tray(){var s='';for(var i=0;i<TOTAL;i++)s+=i<dartN?'·':'🎯';$('dartTray').textContent=s;}
function tip(s){$('tip').textContent=s;}
function speed(){return 1.5+dartN*0.28;} // 越来越快
function throwDart(){
 if(phase!=='aim')return;
 var now=performance.now();if(now<lockUntil)return;
 phase='fly';sfx.whoosh();
 flying={sx:180,sy:500,tx:aim.x,ty:aim.y,k:0,score:0};
}
function ringOf(x,y){
 var d=Math.hypot(x-CX,y-CY);
 if(d<=BULL)return 10;
 var ring=Math.ceil((d-BULL)/RING);
 if(ring<1||ring>9)return 0;
 return 10-ring;
}
function landDart(){
 var sc=ringOf(flying.tx,flying.ty);
 flying.score=sc;
 stuck.push({x:flying.tx,y:flying.ty});
 scores.push(sc);total+=sc;dartN++;
 sfx.thud();
 if(sc===10){sfx.bull();addFloater('🎯 10 环！靶心！',CX,CY-200,'#ffd76a');burst(flying.tx,flying.ty,20,'#ffd76a');}
 else if(sc>=7){addFloater('+'+sc+' 环',flying.tx,flying.ty-24,'#9df0a8');burst(flying.tx,flying.ty,8,'#9df0a8');}
 else if(sc>0){addFloater('+'+sc+' 环',flying.tx,flying.ty-24,'#cfcfe6');}
 else{addFloater('脱靶…',CX,CY+200,'#888');}
 flying=null;hud();tray();
 lockUntil=performance.now()+450;
 if(dartN>=TOTAL){setTimeout(finish,800);phase='done';}
 else{phase='aim';tip('第 '+(dartN+1)+' 镖，准星更快了！');}
}
function finish(){
 phase='end';
 var best=getBest(),isNew=total>best;
 if(isNew)setBest(total);
 $('endScore').textContent=total+' 分';
 var avg=(total/TOTAL).toFixed(1);
 $('endTitle').textContent=total>=85?'🏆 神射手！':total>=60?'👏 相当精准！':'🏁 挑战结束！';
 $('endBest').textContent=(isNew?'🎉 新纪录！':'历史最高：'+best+' 分');
 var tens=scores.filter(function(s){return s===10;}).length;
 $('endDetail').textContent='平均 '+avg+' 环 / 镖 · 命中靶心 '+tens+' 次';
 sfx.win();$('ovEnd').classList.remove('hide');
}
/* 特效 */
function burst(x,y,n,color){for(var i=0;i<n;i++){var a=Math.random()*Math.PI*2,sp=1+Math.random()*2.5;parts.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1,life:1,color:color,r:1.5+Math.random()*2.5});}}
function addFloater(txt,x,y,color){floaters.push({txt:txt,x:x,y:y,life:1.4,color:color});}
function fx(){var i;
 for(i=parts.length-1;i>=0;i--){var p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.06;p.life-=0.035;if(p.life<=0)parts.splice(i,1);}
 for(i=floaters.length-1;i>=0;i--){var f=floaters[i];f.y-=0.7;f.life-=0.025;if(f.life<=0)floaters.splice(i,1);}
}
/* 绘制 */
function draw(){
 ctx.clearRect(0,0,W,H);
 var g=ctx.createLinearGradient(0,0,0,H);
 g.addColorStop(0,'#1e1626');g.addColorStop(1,'#100d16');
 ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 // 靶
 var maxR=BULL+RING*9;
 ctx.fillStyle='rgba(0,0,0,.4)';ctx.beginPath();ctx.ellipse(CX,CY+8,maxR+14,14,0,0,7);ctx.fill();
 var cols=['#e8e0d0','#2b2b33'];
 for(var r=9;r>=1;r--){
  ctx.fillStyle=cols[r%2];
  ctx.beginPath();ctx.arc(CX,CY,BULL+RING*r,0,7);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.15)';ctx.lineWidth=1;
  ctx.beginPath();ctx.arc(CX,CY,BULL+RING*r,0,7);ctx.stroke();
 }
 ctx.fillStyle='#e0393e';ctx.beginPath();ctx.arc(CX,CY,BULL,0,7);ctx.fill();
 ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(CX,CY,BULL*0.45,0,7);ctx.fill();
 // 环数标注
 ctx.fillStyle='rgba(255,255,255,.55)';ctx.font='10px sans-serif';ctx.textAlign='center';
 for(var r2=1;r2<=9;r2++){ctx.fillText(String(10-r2),CX,BULL+RING*r2-5+CY-CY+CY);} // 简化：顶部标注
 // 已命中的镖
 for(var i=0;i<stuck.length;i++)drawDart(stuck[i].x,stuck[i].y,0.9);
 // 飞行中的镖
 if(flying){
  var k=flying.k,e=1-Math.pow(1-k,2);
  var x=flying.sx+(flying.tx-flying.sx)*e,y=flying.sy+(flying.ty-flying.sy)*e-40*Math.sin(Math.PI*k);
  drawDart(x,y,1.1);
  flying.k+=0.09;
  if(flying.k>=1)landDart();
 }
 // 准星
 if(phase==='aim'){
  var px=aim.x,py=aim.y;
  ctx.strokeStyle='#ffd76a';ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(px,py,14,0,7);ctx.stroke();
  ctx.beginPath();ctx.moveTo(px-22,py);ctx.lineTo(px-8,py);ctx.moveTo(px+8,py);ctx.lineTo(px+22,py);
  ctx.moveTo(px,py-22);ctx.lineTo(px,py-8);ctx.moveTo(px,py+8);ctx.lineTo(px,py+22);ctx.stroke();
  ctx.fillStyle='#ffd76a';ctx.beginPath();ctx.arc(px,py,2.5,0,7);ctx.fill();
 }
 // 粒子
 for(var j=0;j<parts.length;j++){var pt=parts[j];ctx.globalAlpha=Math.max(0,pt.life);ctx.fillStyle=pt.color;ctx.beginPath();ctx.arc(pt.x,pt.y,pt.r,0,7);ctx.fill();}
 ctx.globalAlpha=1;
 for(j=0;j<floaters.length;j++){var fl=floaters[j];ctx.globalAlpha=Math.max(0,Math.min(1,fl.life));ctx.fillStyle=fl.color;ctx.font='bold 18px sans-serif';ctx.textAlign='center';ctx.fillText(fl.txt,fl.x,fl.y);}
 ctx.globalAlpha=1;
}
function drawDart(x,y,s){
 ctx.save();ctx.translate(x,y);ctx.scale(s,s);
 ctx.strokeStyle='#8a6b3f';ctx.lineWidth=3;
 ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-26);ctx.stroke();
 ctx.fillStyle='#e0393e';
 ctx.beginPath();ctx.moveTo(0,-26);ctx.lineTo(-6,-14);ctx.lineTo(6,-14);ctx.closePath();ctx.fill();
 ctx.fillStyle='#3fa9ff';
 ctx.beginPath();ctx.moveTo(0,-26);ctx.lineTo(-4,-34);ctx.lineTo(4,-34);ctx.closePath();ctx.fill();
 ctx.restore();
}
function step(){
 if(phase==='aim'){
  t+=0.016*speed();
  aim.x=CX+Math.cos(t*1.7)*150;
  aim.y=CY+Math.sin(t*2.3)*125;
 }
}
function loop(){if(paused)return;step();fx();draw();requestAnimationFrame(loop);}
/* 输入 */
function onTap(e){if(e)e.preventDefault();ac();throwDart();}
cv.addEventListener('touchstart',function(e){e.preventDefault();onTap();},{passive:false});
cv.addEventListener('mousedown',function(){onTap();});
/* 按钮 */
function togglePause(f){if(phase==='menu'||phase==='end'||phase==='done')return;paused=(typeof f==='boolean')?f:!paused;$('ovPause').classList.toggle('hide',!paused);if(!paused)loop();}
$('pz').addEventListener('click',function(){sfx.click();togglePause();});
$('snd').addEventListener('click',function(){soundOn=!soundOn;$('snd').textContent=soundOn?'🔊':'🔇';if(soundOn)sfx.click();});
$('btnStart').addEventListener('click',function(){ac();sfx.click();newGame();});
$('btnResume').addEventListener('click',function(){sfx.click();togglePause(false);});
$('btnRestart1').addEventListener('click',function(){sfx.click();newGame();});
$('btnRestart2').addEventListener('click',function(){sfx.click();newGame();});
$('bestStart').textContent='历史最高：'+getBest()+' 分';
draw();
})();
</script>
</body>
</html>
