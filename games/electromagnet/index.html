<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>电磁铁</title>
<link rel="icon" href="data:,">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{display:flex;justify-content:center;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.wrap{width:100%;max-width:480px;height:100%;padding:10px 12px;display:flex;flex-direction:column;align-items:center;gap:8px}
.topbar{width:100%;display:flex;justify-content:space-between;align-items:center;flex-wrap:nowrap!important;gap:6px}
.topbar .stat{display:flex;gap:8px;align-items:center;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:13px;overflow:hidden}
.topbar .tools{display:flex;gap:6px;flex:none}
.topbar .tools .iconbtn{min-width:44px;min-height:44px;padding:0 6px}
.subbar{width:100%;display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:13px;font-weight:800;font-variant-numeric:tabular-nums}
.prog{flex:1;height:10px;border-radius:6px;background:rgba(0,0,0,.2);overflow:hidden}.prog i{display:block;height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,#ffd34d,#ff5fa2);transition:width .2s}
.stagebox{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;position:relative}
.overlay{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;z-index:20;padding:20px;text-align:center}
.overlay.hidden,.hidden{display:none!important}
.lvgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;width:100%}
.lvgrid .lvl{min-height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:16px;padding:3px!important;line-height:1.1}
.lvgrid .lvl small{font-size:10px;letter-spacing:-1px;margin-top:2px}
.lvgrid .lvl[disabled]{opacity:.45}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:100%}
.shop{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:100%}
.shop button{min-height:46px;font-size:12px!important;padding:3px!important;line-height:1.2}
.aids{width:100%;display:flex;gap:6px;justify-content:center}
.aids button{min-height:44px;min-width:64px;font-size:13px!important;padding:2px 8px!important}
#tutStep{font-size:12px;opacity:.75}
#tutPic{font-size:44px;line-height:1.1}
#overStars{font-size:30px;letter-spacing:4px;min-height:34px}
#toast{position:fixed;left:50%;top:15%;transform:translate(-50%,-10px);background:rgba(10,8,30,.9);color:#fff;font-weight:800;padding:10px 18px;border-radius:999px;z-index:999;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;font-size:15px;box-shadow:0 0 18px rgba(255,61,154,.5);white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
.lvTag{font-size:12px;opacity:.85}

#cv{display:block;touch-action:none;max-width:100%;max-height:100%}
.ctl{width:100%;display:flex;flex-direction:column;gap:6px;flex:none}
.row{display:flex;gap:6px;align-items:center;justify-content:center;width:100%}
.row input{flex:1;min-width:0;height:44px;accent-color:#ff5fa2}
.row .ghost{min-width:48px;min-height:44px;font-size:18px!important;padding:0 6px!important}
.row .lab{min-width:64px;font-weight:900;text-align:center;font-variant-numeric:tabular-nums;font-size:14px}
#liftBtn{min-width:120px;min-height:48px;flex:1}
.data{font-size:12px;opacity:.9;text-align:center;font-variant-numeric:tabular-nums}
@media (max-height:700px){.ctl{gap:3px}.data{display:none}}
</style>
<!-- GAME UI BEGIN -->
<style>
:root{--page:#0b1626;--surface:#13243a;--soft:#1c3350;--ink:#eaf6ff;--muted:#9fb6cc;--accent:#4fc3f7;--on-accent:#05263a;--line:#2b4a6a;--stage:#081220;--page:#03101f;--surface:#0f2742;--soft:#223851;--ink:#eafffb;--muted:#a6c7cf;--accent:#33e1a0;--on-accent:#0b0620;--line:#33e1a0;--b-bg1:#0f3256;--b-bg2:#03101f;--b-btn:#33e1a0;--b-btn-hi:#7aecc1;--b-edge:#0f8a5a;--b-glow:#4fc3f7;--b-glow-rgb:79,195,247;--b-pedge-rgb:51,225,160;--b-btn-ink:#084c32;--b-btn-tsh:0 1px 0 rgba(255,255,255,.45);--b-coin-ink:#084c32;--b-coin-tsh:none;--b-key-ink:#4fc3f7;--b-title:#ffffff}
/* Shared presentation only; mechanics and state remain inside each standalone game. */
html.game-ui{background:var(--page);color:var(--ink);color-scheme:light;font-family:"Bahnschrift","Microsoft YaHei UI","PingFang SC",sans-serif}
html.game-ui:is([data-theme="space"],[data-theme="arcade"],[data-theme="lab"],[data-theme="ocean"],[data-theme="magic"]){color-scheme:dark}
.game-ui body{background:var(--page);color:var(--ink);font-family:inherit;overscroll-behavior:none}
.game-ui body>.wrap{padding:20px 16px max(20px,env(safe-area-inset-bottom));gap:14px;max-width:500px}
.game-ui #app{background:var(--page);color:var(--ink)}
.game-ui :is(.topbar,#topbar){gap:8px;flex-wrap:wrap;min-height:58px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:10px 12px;box-shadow:0 3px 0 var(--soft);font-size:13px}
.game-ui :is(.title,.tb-title,.tb-title,#topbar .t,.topbar .t){color:var(--ink);font-size:16px;font-weight:750;letter-spacing:0}
.game-ui :is(.topbar,.hud,#hud,#topbar) :is(b,.v){color:var(--accent);font-variant-numeric:tabular-nums}
.game-ui :is(.stat,.topbar .s,.topbar .stat,.scorebar,.stats,.tip,.hint,.hintline,.hsline,.best,.hiscore){color:var(--muted);line-height:1.7}
.game-ui :is(.hint,.hintline,.tip){font-size:12px;max-width:40em;text-wrap:pretty}
.game-ui .scorebar{padding:6px 10px;gap:8px;flex-wrap:wrap}
.game-ui :is(.iconbtn,.iconBtn,.icobtn,.ibtn,.tbtn,.hbtn,.ib,.iconBtn,.pause){min-width:44px;min-height:44px;flex-shrink:0;border-radius:12px;background:var(--soft);color:var(--ink);border:1px solid var(--line);box-shadow:none;font-size:17px}
.game-ui button{font-family:inherit;cursor:pointer;touch-action:manipulation}
.game-ui button:focus-visible,.game-ui [tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.game-ui :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn){background:var(--accent);color:var(--on-accent);border:1px solid transparent;border-radius:13px;min-height:50px;padding:13px 28px;font-size:16px;font-weight:750;letter-spacing:0;box-shadow:0 4px 0 var(--line);text-shadow:none;max-width:100%}
.game-ui :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn):active{box-shadow:none;transform:translateY(2px)}
.game-ui :is(.ghost,.ghostbtn,.btn2,.abtn,.toolbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line);box-shadow:none;border-radius:12px;min-height:44px}
.game-ui :is(.rowbtns,.btnrow,.ctlrow){gap:10px;flex-wrap:wrap;justify-content:center}
.game-ui :is(.pill,.hudbox,.hud .p){background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:none;font-variant-numeric:tabular-nums}
.game-ui :is(.dbtn,.cbtn,.gbtn,.holdbtn,.firebtn,.bombbtn,.jumpbtn,.pumpbtn,.nbtn){border-radius:12px;box-shadow:0 3px 0 var(--line);min-height:44px}
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv,.screen):has(>.ui-panel){padding:20px;overflow-y:auto;overscroll-behavior:contain}
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv):has(>.ui-panel){background:var(--page);backdrop-filter:none;justify-content:safe center;align-items:center}
.game-ui .ui-panel{width:min(100%,380px);max-height:100%;overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:18px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:24px;padding:30px 24px;box-shadow:0 8px 0 var(--soft),0 20px 48px #15253618;text-align:center;margin:auto}
.game-ui .ui-panel :is(.card,.panel,.pausecard,.ovcard){display:contents}
.game-ui .ui-panel :is(h1,h2,.gamename,.gametitle){font-size:30px;line-height:1.25;font-weight:800;color:var(--ink);background:none;-webkit-text-fill-color:currentColor;text-shadow:none;letter-spacing:-.6px;margin:0}
.game-ui .ui-panel :is(p,.howto,.sub,.rule){font-size:14px;line-height:1.85;color:var(--muted);background:none;border:0;box-shadow:none;padding:0;margin:0;max-width:32em;text-align:left;white-space:normal}
.game-ui .ui-panel :is(.bigemoji,.bigemoji,.ic,.big):not(.bigscore){animation:none;filter:none;text-shadow:none}
.game-ui .ui-emblem{width:90px;height:90px;display:grid;place-items:center;border:1px solid var(--line);border-radius:28px;background:var(--soft);font-size:48px;line-height:1;flex-shrink:0;position:relative}
.game-ui[data-theme="wood"] .ui-emblem{border-radius:50%;box-shadow:inset 0 0 0 5px var(--surface),inset 0 0 0 6px var(--line)}
.game-ui[data-theme="wood"] .ui-panel h1{font-family:"STKaiti","KaiTi","Microsoft YaHei",serif;letter-spacing:2px}
.game-ui[data-theme="ice"] .ui-emblem{border-radius:26px 8px 26px 8px}
.game-ui[data-theme="space"] .ui-emblem{background:radial-gradient(circle at center,var(--soft) 42%,transparent 43%),var(--surface);border-radius:50%;outline:1px solid var(--line);outline-offset:7px;margin:7px}
.game-ui[data-theme="kitchen"] .ui-emblem{border-radius:22px;border-bottom:5px solid var(--line)}
.game-ui .ui-panel :is(.score,.bigscore,.bigScore,.scorebig){color:var(--accent);font-size:48px;font-weight:800;font-variant-numeric:tabular-nums}
.game-ui .ui-panel :is(.best,.hsline,.hiscore,.endstats,.endstats b){color:var(--muted);font-size:13px;line-height:1.8}
.game-ui .ui-mode{display:grid;grid-template-columns:1fr 1fr;gap:5px;background:var(--soft);padding:5px;border:1px solid var(--line);border-radius:14px;width:100%}
.game-ui .ui-mode button{min-height:44px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-size:14px;font-weight:700;box-shadow:none}
.game-ui .ui-mode button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 2px 5px #1525361a}
.game-ui .ui-panel .ui-mode-note{font-size:12px;line-height:1.6;text-align:center;color:var(--muted)}
.game-ui .ui-mode-status{display:block;padding:5px 10px;color:var(--accent);font-size:11px;font-weight:700;line-height:1.5;text-align:center;border:1px solid var(--line);border-radius:8px;background:var(--surface);margin:4px auto;max-width:100%;pointer-events:none}
.game-ui body>.wrap>canvas:not(#fx){background-color:var(--stage);box-shadow:0 0 0 1px var(--line),0 6px 0 var(--soft);border-radius:18px;flex-shrink:0}
.game-ui .screen>canvas.game{box-shadow:0 0 0 1px var(--line),0 6px 0 var(--soft)}
.game-ui #hud{gap:6px;background:var(--surface);color:var(--ink)}
.game-ui #hud :is(.left,.t,.s,.grp,.pill){color:var(--ink)}
.game-ui #hud .pill{background:var(--surface);border-color:var(--line)}
.game-ui body canvas:is(#cv,#game,#board){background-color:var(--stage)}
.game-ui :is(button.dbtn,button.cbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.game-ui :is(button.lvl,button.lvlbtn){background:var(--soft);color:var(--ink);border:1px solid var(--line);border-radius:12px;min-height:54px}
.game-ui :is(button.lvl,button.lvlbtn) :is(.nc,.sz,small){color:var(--muted)}
.game-ui .ui-panel button.lvl{margin:0;min-width:44px;box-shadow:none;padding:8px}
.game-ui #hud :is(.left,.right,.hudl,.hbtns){gap:5px;flex-wrap:wrap}
.game-ui #hud :is(.left,.hudl){min-width:0;flex-shrink:1}
.game-ui #hud :is(.pill,.left){font-size:12px}
.game-ui button:disabled{cursor:default;opacity:.45;box-shadow:none}
.game-ui .ui-panel .ui-assist-note{color:var(--accent);font-weight:700}
@media(min-width:700px){.game-ui body>.wrap{padding-top:32px}.game-ui .ui-panel{padding:36px 30px}}
@media(max-width:360px){.game-ui body>.wrap{padding:10px;gap:10px}.game-ui .ui-panel{padding:22px 18px;gap:13px}.game-ui .ui-panel h1{font-size:26px}.game-ui .ui-emblem{width:70px;height:70px;font-size:38px}.game-ui :is(.topbar,#topbar){gap:5px;padding:8px}.game-ui :is(.iconbtn,.icobtn,.ibtn,.tbtn,.ib){min-width:40px;min-height:44px}}
@media(max-height:650px){.game-ui .ui-panel{padding:18px;gap:12px}.game-ui .ui-emblem{width:60px;height:60px;font-size:32px}.game-ui .ui-panel h1{font-size:25px}.game-ui .ui-panel :is(p,.howto,.sub,.rule){font-size:13px}}
@media(prefers-reduced-motion:reduce){.game-ui *, .game-ui *::before,.game-ui *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
/* 2026-10-20 热修：开局/结算遮罩铺满整屏，主按钮固定在面板底部，避免被画布尺寸裁切（#10） */
.game-ui :is(.overlay,.ov,#ov,#overlay,#pauseOv):has(>.ui-panel){position:fixed;inset:0;z-index:1000;border-radius:0;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
.game-ui .ui-panel{touch-action:pan-y}
.game-ui .ui-panel :is(#startBtn,#btnStart,.startbtn,#bStart,#restartBtn,#btnRestart,#againBtn,#btnAgain,#retryBtn,#btnRetry,#playBtn,#btnPlay){position:sticky;bottom:0;z-index:3;flex-shrink:0}
.game-ui .ui-panel :not(.card,.panel,.pausecard,.ovcard,.ui-mode):has(>:is(#startBtn,#btnStart,.startbtn,#bStart,#restartBtn,#btnRestart,#againBtn,#btnAgain,#retryBtn,#btnRetry,#playBtn,#btnPlay)){position:sticky;bottom:0;z-index:3;flex-shrink:0;background:var(--surface);box-shadow:0 -10px 10px -6px var(--surface)}


/* ===== Direction B · 霓虹糖果 Pop Arcade ===== saturated gradients, chunky bevels with a hard bottom edge, sticker panels, neon on dark themes */
html.game-ui[data-skin="b"]{--fb:"HarmonyOS Sans SC","MiSans","OPPOSans","vivo Sans","Noto Sans SC","Noto Sans CJK SC","PingFang SC","Microsoft YaHei UI",system-ui,sans-serif;--bounce:cubic-bezier(.34,1.56,.64,1);--bg:radial-gradient(circle at 12% 18%,rgba(255,255,255,.28) 0 38px,transparent 40px),radial-gradient(circle at 88% 30%,rgba(255,255,255,.16) 0 64px,transparent 66px),radial-gradient(circle at 20% 82%,rgba(255,255,255,.14) 0 52px,transparent 54px),radial-gradient(rgba(255,255,255,.16) 1.5px,transparent 2.2px) 0 0/22px 22px,linear-gradient(165deg,var(--b-bg1),var(--b-bg2));font-family:var(--fb)}
html.game-ui[data-skin="b"],html.game-ui[data-skin="b"] body,html.game-ui[data-skin="b"] #app,html.game-ui[data-skin="b"] :is(.overlay,.ov,#ov,#overlay,#pauseOv):has(>.ui-panel){background:var(--bg);background-color:var(--b-bg2)}
html.game-ui[data-skin="b"] body{min-height:100vh;font-family:var(--fb)}
html.game-ui[data-skin="b"] :is(.hint,.hintline,.tip){color:rgba(255,255,255,.94);text-shadow:0 1px 2px rgba(0,0,0,.35)}
/* Sticker panel: white rim + hard coloured bottom edge + drop */
html.game-ui[data-skin="b"] .ui-panel{background:linear-gradient(180deg,var(--surface),var(--soft));border:4px solid #fff;border-radius:32px;box-shadow:0 9px 0 var(--line),0 9px 0 4px rgba(0,0,0,.08),0 26px 40px rgba(0,0,0,.28);animation:uiB-in .5s var(--bounce) both}
html.game-ui[data-skin="b"] .ui-panel :is(h1,h2,.gamename,.gametitle){font-size:34px;font-weight:900;color:var(--b-title);letter-spacing:0;text-shadow:0 3px 0 var(--line),0 6px 10px rgba(0,0,0,.15)}
html.game-ui[data-skin="b"] .ui-emblem{width:100px;height:100px;border:4px solid #fff;border-radius:50%;background:radial-gradient(circle at 32% 26%,#fff 0 12%,var(--b-glow) 13%,var(--line) 70%,var(--b-edge) 100%);box-shadow:0 7px 0 var(--b-edge),0 16px 24px rgba(0,0,0,.25);font-size:54px;animation:uiB-wobble 2.6s ease-in-out infinite}
html.game-ui[data-skin="b"] .ui-emblem::before,html.game-ui[data-skin="b"] .ui-emblem::after{content:"✦";position:absolute;color:#fff;font-size:20px;text-shadow:0 0 8px var(--b-glow);animation:uiB-twinkle 1.8s ease-in-out infinite}
html.game-ui[data-skin="b"] .ui-emblem::before{top:-10px;right:-14px}
html.game-ui[data-skin="b"] .ui-emblem::after{bottom:4px;left:-18px;font-size:14px;animation-delay:.9s}
html.game-ui[data-skin="b"] .ui-panel :is(.score,.bigscore,.bigScore,.scorebig,#finalScore){font-size:56px;font-weight:900;color:var(--b-btn);-webkit-text-fill-color:currentColor;text-shadow:0 4px 0 var(--b-edge),0 0 2px var(--b-edge),0 10px 16px rgba(0,0,0,.25)}
html.game-ui[data-skin="b"] .ui-panel :is(h1,.gamename)~h2{font-size:19px;text-shadow:0 2px 0 var(--line)}
/* Chunky bevelled button: highlight lip, darker bottom slab, presses down onto the slab */
html.game-ui[data-skin="b"] :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn,button.actBtn):not(.ghost){position:relative}
html.game-ui[data-skin="b"] :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn,button.actBtn):not(.ghost):not(#\#){overflow:hidden;border:0;border-radius:20px;font-weight:900;color:var(--b-btn-ink);background:linear-gradient(180deg,var(--b-btn-hi),var(--b-btn) 52%);text-shadow:var(--b-btn-tsh);box-shadow:inset 0 3px 0 rgba(255,255,255,.55),inset 0 -5px 0 rgba(0,0,0,.14),0 6px 0 var(--b-edge),0 12px 18px rgba(0,0,0,.25);transition:transform .08s,box-shadow .08s}
html.game-ui[data-skin="b"] :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn,button.actBtn):not(.ghost):not(#\#)::before{content:"";position:absolute;left:12px;top:6px;width:22px;height:9px;border-radius:9px;background:rgba(255,255,255,.75);transform:rotate(-12deg);pointer-events:none}
html.game-ui[data-skin="b"] :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn,button.actBtn):not(.ghost):not(#\#):active{transform:translateY(5px);box-shadow:inset 0 3px 0 rgba(255,255,255,.4),inset 0 -2px 0 rgba(0,0,0,.14),0 1px 0 var(--b-edge),0 4px 8px rgba(0,0,0,.2)}
html.game-ui[data-skin="b"] .ui-panel :is(button.btn,button.bigbtn,button.bigBtn,button.bb,button.startbtn,button.actBtn):not(.ghost):not(#\#){min-height:56px;padding:14px 34px;font-size:19px;letter-spacing:1px}
/* Secondary keys: white candy keys with a coloured slab */
html.game-ui[data-skin="b"] :is(.ghost,.ghostbtn,.btn2,.abtn,.toolbtn,.iconbtn,.iconBtn,.icobtn,.ibtn,.tbtn,.hbtn,.ib,.pause,.dbtn,.cbtn,.nbtn,.lvl,.lvlbtn){border:0;border-radius:16px;background:linear-gradient(180deg,#fff,var(--soft));color:var(--b-key-ink);font-weight:900;box-shadow:inset 0 -3px 0 rgba(0,0,0,.06),0 5px 0 var(--line),0 8px 12px rgba(0,0,0,.18);transition:transform .08s,box-shadow .08s}
html.game-ui[data-skin="b"] :is(.ghost,.ghostbtn,.btn2,.abtn,.toolbtn,.iconbtn,.iconBtn,.icobtn,.ibtn,.tbtn,.hbtn,.ib,.pause,.dbtn,.cbtn,.nbtn,.lvl,.lvlbtn):active{transform:translateY(4px);box-shadow:0 1px 0 var(--line),0 2px 4px rgba(0,0,0,.15)}
html.game-ui[data-skin="b"] :is(.dbtn,.lvl,.lvlbtn):is(.on,.sel,[aria-pressed="true"]){background:linear-gradient(180deg,var(--b-btn-hi),var(--b-btn));color:var(--b-btn-ink);text-shadow:var(--b-coin-tsh);box-shadow:0 5px 0 var(--b-edge),0 8px 12px rgba(0,0,0,.18)}
html.game-ui[data-skin="b"] .ui-mode{background:rgba(0,0,0,.08);border:0;border-radius:18px;padding:5px;box-shadow:inset 0 3px 0 rgba(0,0,0,.08)}
html.game-ui[data-skin="b"] .ui-mode button{border-radius:14px;font-weight:900}
html.game-ui[data-skin="b"] .ui-mode button[aria-pressed="true"]{background:#fff;color:var(--b-key-ink);box-shadow:0 4px 0 var(--line)}
/* HUD: candy capsule bar, numbers in coin badges */
/* HUD keeps a 1px border (same box size as base.css → no layout shift); the thick rim is an inset shadow */

      ctx.drawImage(sprite('t' + color + w + 'x' + h + 'r' + r, w, h, pad, s, function (g) { tileArt(g, w, h, color, r); }), x - pad, y - pad, w + pad * 2, h + pad * 2);
    },
    orb: function (ctx, x, y, r, color) {
      var pad = Math.ceil(r * .5) + 2, s = scaleOf(ctx);
      ctx.drawImage(sprite('o' + color + r, r * 2, r * 2, pad, s, function (g) { orbArt(g, r, color, pad); }), x - r - pad, y - r - pad, r * 2 + pad * 2, r * 2 + pad * 2);
    },
    // Soft elliptical contact shadow under any sprite (emoji, characters, pieces).
    shadow: function (ctx, x, y, rx, ry, a) {
      ctx.save(); ctx.fillStyle = 'rgba(0,0,0,' + (a == null ? .28 : a) + ')'; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, 7); ctx.fill(); ctx.restore();
    },
    // Lit stage background: vertical gradient plus a vignette. Cached per size/colours.
    stage: function (ctx, w, h, top, bottom) {
      var s = scaleOf(ctx);
      ctx.drawImage(sprite('s' + w + 'x' + h + top + bottom, w, h, 0, s, function (g) {
        var lg = g.createLinearGradient(0, 0, 0, h); lg.addColorStop(0, top); lg.addColorStop(1, bottom); g.fillStyle = lg; g.fillRect(0, 0, w, h);
        var v = g.createRadialGradient(w / 2, h * .35, Math.min(w, h) * .2, w / 2, h / 2, Math.max(w, h) * .75);
        v.addColorStop(0, 'rgba(255,255,255,' + (skin === 'b' ? .10 : .07) + ')'); v.addColorStop(1, 'rgba(0,0,0,.35)'); g.fillStyle = v; g.fillRect(0, 0, w, h);
      }), 0, 0, w, h);
    },
    // Glow is shadowBlur: cheap for a handful of shapes, never use it on every tile.
    glow: function (ctx, color, blur) { ctx.shadowColor = color; ctx.shadowBlur = blur; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0; },
    noGlow: function (ctx) { ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; },
    // Crisp rendering on high-DPI phones without changing game coordinates.
    // Only safe where input code converts with getBoundingClientRect + logical W/H, not cv.width.
    hidpi: function (cv, ctx, w, h) {
      var d = Math.max(1, Math.min(2.5, window.devicePixelRatio || 1));
      cv.width = Math.round(w * d); cv.height = Math.round(h * d); // intrinsic ratio stays w:h, so CSS sizing is unchanged
      ctx.setTransform(d, 0, 0, d, 0, 0); return d;
    },
    // Lightweight particle bursts (pooled array, no allocations per frame beyond the burst).
    burst: function (list, x, y, color, n) {
      for (var i = 0; i < (n || 12); i++) { var a = Math.random() * 6.283, v = 1 + Math.random() * 2.6; list.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 1, life: 1, c: color, r: 1.5 + Math.random() * 2.5 }); }
    },
    drawBurst: function (ctx, list) {
      for (var i = list.length - 1; i >= 0; i--) {
        var p = list[i]; p.x += p.vx; p.y += p.vy; p.vy += .12; p.life -= .035;
        if (p.life <= 0) { list.splice(i, 1); continue; }
        ctx.globalAlpha = p.life; ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (skin === 'b' ? 1.2 : 1), 0, 7); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
  };
  window.GameUI.fx = fx;
}());

</script>

<div class="overlay" id="startScr"><h1>🧲 电磁铁起重站</h1><p>经典实验变成了电磁起重机挑战：<br>调<b>线圈匝数 N</b> 和 <b>电流 I</b>，按订单<b>恰好</b>吸起指定数量的回形针。<br>电流越大线圈越烫，过热会烧坏！<br>第 5/10/15 关迎战扰乱线圈的「磁暴怪」。</p><p id="bestLine"></p><button class="btn" id="startBtn">开始实验</button></div>

<script>
'use strict';
/* ===== 关卡/教程/存档/音效 通用套件（单文件内联） ===== */
const UI=window.GameUI||{pick:a=>a,storageGet:k=>localStorage.getItem(k),storageSet:(k,v)=>localStorage.setItem(k,v)};
const FX=UI.fx&&UI.fx.on?UI.fx:null;
const $=id=>document.getElementById(id);
function show(id,on){$(id).classList.toggle('hidden',!on);}
const Kit=(function(){
  const K={state:'menu',lv:0};let cfg,P,muted,ac=null,tutI=0,tutThen=null,lastWin=false;
  function key(s){return 'g100_'+cfg.id+'_'+s;}
  function load(){try{P=JSON.parse(UI.storageGet(key('prog'))||'{}')||{};}catch(e){P={};}
    P.stars=P.stars||[];P.best=P.best||[];P.coins=P.coins||0;P.up=P.up||{};}
  function save(){try{UI.storageSet(key('prog'),JSON.stringify(P));}catch(e){}}
  K.save=save;
  K.prog=()=>P;
  K.up=k=>P.up[k]||0;
  K.totalStars=()=>P.stars.reduce((a,b)=>a+(b||0),0);
  K.hs=()=>+UI.storageGet(key('hs'))||0;
  // ---- 音效 ----
  function tone(f,d,type,vol,f2,delay){if(muted)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();
    const t=ac.currentTime+(delay||0),o=ac.createOscillator(),g=ac.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
    g.gain.setValueAtTime(vol||.13,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d+.02);}catch(e){}}
  K.tone=tone;
  K.sfx=function(n,x){switch(n){
    case 'tap':tone(520,.06,'triangle',.08);break;
    case 'good':tone(660,.08,'sine');tone(990,.1,'sine',.1,0,.06);break;
    case 'combo':tone(500+Math.min(12,x||1)*70,.12,'square',.07);break;
    case 'bad':tone(220,.22,'sawtooth',.1,110);break;
    case 'hit':tone(180,.08,'square',.08,90);break;
    case 'coin':tone(1200,.07,'sine',.09);tone(1600,.09,'sine',.08,0,.06);break;
    case 'boss':tone(110,.5,'sawtooth',.12,70);tone(165,.5,'square',.06,90,.1);break;
    case 'win':[523,659,784,1046].forEach((f,i)=>tone(f,.18,'triangle',.12,0,i*.11));break;
    case 'lose':[392,330,262,196].forEach((f,i)=>tone(f,.22,'sawtooth',.08,0,i*.13));break;
    case 'boom':tone(140,.35,'sawtooth',.14,40);break;
    default:tone(440,.08);}};
  function setMute(m){muted=m;try{UI.storageSet('g100_mute',m?'1':'0');}catch(e){}
    document.querySelectorAll('.muteBtn,#muteBtn').forEach(b=>b.textContent=m?'🔇':'🔊');}
  // ---- 提示条 ----
  let tt=0;K.toast=function(msg,ms){const t=$('toast');t.textContent=msg;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),ms||1300);};
  K.vibrate=function(ms){try{if(window.NativeBridge&&window.NativeBridge.vibrate)window.NativeBridge.vibrate(ms);else if(navigator.vibrate)navigator.vibrate(ms);}catch(e){}};
  // ---- 选关 ----
  K.isBoss=i=>(cfg.boss||[]).includes(i+1);
  K.unlocked=i=>i===0||(P.stars[i-1]||0)>0||(cfg.endless&&i===cfg.levels-1&&false);
  function stars(n){return '★★★'.slice(0,n)+'☆☆☆'.slice(0,3-n);}
  K.starStr=stars;
  function renderLevels(){
    const g=$('lvgrid');g.innerHTML='';
    for(let i=0;i<cfg.levels;i++){const b=document.createElement('button');b.className='lvl';const ok=K.unlocked(i);
      const lab=cfg.label?cfg.label(i):String(i+1);
      b.innerHTML=(ok?(K.isBoss(i)?'👑':'')+lab:'🔒')+'<small>'+(ok?stars(P.stars[i]||0):'&nbsp;')+'</small>';
      if(!ok)b.disabled=true;b.addEventListener('click',()=>{K.sfx('tap');go(i);});g.appendChild(b);}
    $('lvlInfo').textContent='⭐ '+K.totalStars()+'/'+cfg.levels*3+'   💰 '+P.coins+(K.hs()?'   🏆 '+K.hs():'');
    $('lvlNote').textContent=cfg.note?cfg.note():'';
    const s=$('shop');s.innerHTML='';
    (cfg.ups||[]).forEach(u=>{const lv=K.up(u.k),max=u.max,cost=lv<max?u.cost(lv):0,b=document.createElement('button');b.className='ghost';
      const need=u.stars&&K.totalStars()<u.stars;
      b.innerHTML=u.ic+' '+u.name+' '+lv+'/'+max+'<br>'+(lv>=max?'已满级':need?'🔒 需 ⭐'+u.stars:'💰'+cost+' · '+u.desc);
      if(lv>=max||need)b.disabled=true;
      b.addEventListener('click',()=>{if(P.coins<cost){K.toast('💰 不够：通关赚取金币');K.sfx('bad');return;}P.coins-=cost;P.up[u.k]=lv+1;save();K.sfx('coin');K.toast(u.ic+' '+u.name+' 升到 '+(lv+1)+' 级');renderLevels();});
      s.appendChild(b);});
    s.classList.toggle('hidden',!(cfg.ups||[]).length);
  }
  K.menu=function(){K.state='menu';cfg.stop&&cfg.stop();['startScr','overScr','pauseOv','tutScr'].forEach(i=>show(i,false));renderLevels();show('lvlScr',true);};
  function go(i){K.lv=i;['startScr','overScr','pauseOv','lvlScr','tutScr'].forEach(x=>show(x,false));K.state='play';
    if(K.isBoss(i))setTimeout(()=>{K.sfx('boss');K.toast('👑 首领关：'+(cfg.bossName?cfg.bossName(i):'强敌来袭'),1800);},60);
    else K.sfx('tap');cfg.start(i);}
  K.go=go;
  // ---- 教程 ----
  function tutShow(){const t=cfg.tut[tutI];$('tutH').textContent=t[0];$('tutP').innerHTML=t[1];$('tutPic').textContent=t[2]||'';$('tutStep').textContent=(tutI+1)+' / '+cfg.tut.length;$('tutNext').textContent=tutI===cfg.tut.length-1?'明白了，开始！':'下一步';}
  K.tutorial=function(then){tutI=0;tutThen=then;['startScr','lvlScr'].forEach(x=>show(x,false));tutShow();show('tutScr',true);};
  function tutEnd(){show('tutScr',false);P.tut=1;save();(tutThen||K.menu)();}
  // ---- 暂停 ----
  K.pause=function(){if(K.state!=='play')return;K.state='pause';cfg.pause&&cfg.pause();$('pauseInfo').textContent=(cfg.label?'第 '+cfg.label(K.lv):'第 '+(K.lv+1))+' 关'+(K.isBoss(K.lv)?' · 首领关':'');show('pauseOv',true);};
  K.resume=function(){if(K.state!=='pause')return;K.state='play';show('pauseOv',false);cfg.resume&&cfg.resume();};
  // ---- 结算 ----
  K.win=function(st,score,text){if(K.state!=='play')return;K.state='over';lastWin=true;st=Math.max(1,Math.min(3,st|0));const i=K.lv;
    const old=P.stars[i]||0,gain=st*4+(old?0:6)+(K.isBoss(i)?8:0)+(cfg.coinBonus?cfg.coinBonus(i,st,score):0);P.coins+=gain;
    if(st>old)P.stars[i]=st;if((score||0)>(P.best[i]||0))P.best[i]=score;
    const tot=P.best.reduce((a,b)=>a+(b||0),0);if(tot>K.hs())UI.storageSet(key('hs'),tot);save();
    $('overH').textContent=K.isBoss(i)?'👑 击败首领！':'🎉 过关！';$('overStars').textContent=stars(st);$('finalScore').textContent=score||0;
    $('overText').innerHTML=(text||'')+'<br>💰 +'+gain+'　本关最佳 '+(P.best[i]||0);
    const hasNext=i+1<cfg.levels;$('nextBtn').classList.toggle('hidden',!hasNext);if(hasNext)$('nextBtn').textContent=K.isBoss(i+1)?'👑 挑战首领':'下一关';
    show('overScr',true);K.sfx('win');cfg.stop&&cfg.stop();};
  K.lose=function(text,score){if(K.state!=='play')return;K.state='over';lastWin=false;const gain=Math.min(3,K.lv>0?2:1);P.coins+=gain;save();
    $('overH').textContent='💥 挑战失败';$('overStars').textContent='☆☆☆';$('finalScore').textContent=score||0;
    $('overText').innerHTML=(text||'')+'<br>安慰金 💰 +'+gain+'　可在选关页升级后再战';
    $('nextBtn').classList.add('hidden');show('overScr',true);K.sfx('lose');K.vibrate(120);cfg.stop&&cfg.stop();};
  K.init=function(c){cfg=c;load();setMute(UI.storageGet('g100_mute')==='1');
    document.querySelectorAll('.muteBtn,#muteBtn').forEach(b=>b.addEventListener('click',()=>{setMute(!muted);if(!muted)K.sfx('tap');}));
    $('startBtn').addEventListener('click',()=>{K.sfx('tap');if(!P.tut)K.tutorial(K.menu);else K.menu();});
    $('tutNext').addEventListener('click',()=>{K.sfx('tap');if(tutI<cfg.tut.length-1){tutI++;tutShow();}else tutEnd();});
    $('tutSkip').addEventListener('click',tutEnd);
    $('howBtn').addEventListener('click',()=>K.tutorial(K.menu));
    $('homeBtn').addEventListener('click',()=>{show('lvlScr',false);show('startScr',true);K.state='menu';});
    $('pauseBtn').addEventListener('click',()=>K.state==='play'?K.pause():K.resume());
    $('resumeBtn').addEventListener('click',K.resume);
    $('restartBtn').addEventListener('click',()=>go(K.lv));
    $('menuBtn').addEventListener('click',K.menu);$('menu2Btn').addEventListener('click',K.menu);
    $('againBtn').addEventListener('click',()=>go(K.lv));
    $('nextBtn').addEventListener('click',()=>go(Math.min(cfg.levels-1,K.lv+1)));
    document.addEventListener('visibilitychange',()=>{if(document.hidden)K.pause();});
    const bl=$('bestLine');if(bl)bl.textContent=P.stars.length?('进度 ⭐'+K.totalStars()+'/'+cfg.levels*3+(K.hs()?' · 🏆 '+K.hs():'')):'首次游玩会有简短教程';
    window.__T=window.__T||{};window.__T.kit=K;};
  return K;
})();
/* ===== 套件结束 ===== */

const W=360,H=380;
const cv=$('cv'),ctx=cv.getContext('2d');if(FX)FX.hidpi(cv,ctx,W,H);else{cv.width=W;cv.height=H;}
// 每关：n 订单数 · t 每单秒数 · mi 电流上限 · lk 锁匝数概率 · z 断电单概率 · hf 发热倍率 · max 最大目标 · boss
const LV=[
 {n:3,t:28,mi:3,lk:0,z:0,hf:1,max:10},{n:4,t:24,mi:3,lk:0,z:.2,hf:1,max:12},{n:4,t:22,mi:3,lk:.4,z:.15,hf:1.1,max:14},{n:5,t:20,mi:2,lk:.3,z:.15,hf:1.3,max:16},
 {boss:{hp:6,name:'磁暴怪',sc:6,t:70},t:14,mi:3,lk:.2,z:.1,hf:1.2,max:16},
 {n:5,t:17,mi:2.5,lk:.5,z:.15,hf:1.4,max:20},{n:6,t:15,mi:1.8,lk:.4,z:.1,hf:1.5,max:24},{n:6,t:14,mi:3,lk:.6,z:.2,hf:1.6,max:24},{n:7,t:13,mi:1.5,lk:.5,z:.1,hf:1.6,max:26},
 {boss:{hp:8,name:'暴走磁暴怪',sc:4.5,t:80},t:11,mi:2.5,lk:.4,z:.1,hf:1.6,max:26},
 {n:7,t:12,mi:2,lk:.6,z:.15,hf:1.8,max:30},{n:8,t:11,mi:1.6,lk:.6,z:.1,hf:1.9,max:30},{n:8,t:10,mi:2.4,lk:.7,z:.15,hf:2,max:34},{n:8,t:9,mi:1.4,lk:.7,z:.1,hf:2.1,max:28},
 {boss:{hp:10,name:'磁暴魔王',sc:3.5,t:90},t:9,mi:2,lk:.6,z:.1,hf:2.1,max:34}];
let L,N=200,I=1,orders,oi,ord,lives,heat,score,ended,raf=0,last=0,fast=1,boss,bossT,scT,miss,clips,hang,sparks,shake,lifted;
function lifts(n,i){return Math.floor(n*i/40+1e-6);}
function solvable(t,lockN,mi){const ns=lockN?[lockN]:[100,200,300,400,500,600,700,800];for(const n of ns){const i=Math.ceil(t*40/n*10-1e-6)/10;if(i<=mi+1e-9&&lifts(n,i)===t)return true;}return false;}
function mkOrder(){let t,lockN=0,g=0;for(;;){g++;if(Math.random()<L.z&&oi>0){t=0;break;}t=3+((Math.random()*(L.max-2))|0);lockN=Math.random()<L.lk?(1+((Math.random()*8)|0))*100:0;if(solvable(t,lockN,L.mi)||g>40)break;}
  if(!solvable(t,lockN,L.mi)&&t>0){lockN=0;}
  return {t,lockN,time:L.t+Kit.up('time')*2,max:L.t+Kit.up('time')*2};}
function start(i){L=LV[i];lives=3+Kit.up('life');heat=0;score=0;ended=false;oi=0;miss=0;sparks=[];hang=0;shake=0;lifted=0;
  boss=L.boss?{hp:L.boss.hp,max:L.boss.hp,name:L.boss.name,flash:0,x:300,y:70,ph:0}:null;bossT=boss?L.boss.t:0;scT=boss?L.boss.sc:0;
  orders=boss?999:L.n;ord=mkOrder();clips=[];for(let k=0;k<44;k++)clips.push({x:40+Math.random()*280,y:H-26-Math.random()*16,r:Math.random()*3});
  N=ord.lockN||N;setI(Math.min(I,L.mi));sync();hud();last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(frame);
  if(i===0)setTimeout(()=>Kit.toast('调 N 和 I，让 ⌊N·I÷40⌋ 等于订单数'),200);}
function setN(n){if(ord&&ord.lockN){Kit.toast('🔒 本单线圈匝数锁定为 '+ord.lockN);return;}N=Math.max(100,Math.min(800,n));sync();}
function setI(v){I=Math.max(0,Math.min(L?L.mi:3,Math.round(v*10)/10));sync();}
function sync(){$('nV').textContent=N;$('iV').textContent=I.toFixed(1)+'A';$('cur').max=L?L.mi:3;$('cur').value=I;$('lockT').textContent=ord&&ord.lockN?'🔒':'';
  $('dataT').textContent='N·I = '+Math.round(N*I)+'　→ 预计吸起 '+(Kit.up('meter')?lifts(N,I):'?')+' 枚　发热 +'+Math.round(I*I*6*L_hf()*(1-Kit.up('cool')*.2))+'%';}
function L_hf(){return L?L.hf:1;}
$('cur').addEventListener('input',e=>setI(+e.target.value));
$('nMinus').addEventListener('click',()=>{setN(N-100);Kit.sfx('tap');});$('nPlus').addEventListener('click',()=>{setN(N+100);Kit.sfx('tap');});
$('iMinus').addEventListener('click',()=>{setI(I-.1);Kit.sfx('tap');});$('iPlus').addEventListener('click',()=>{setI(I+.1);Kit.sfx('tap');});
$('liftBtn').addEventListener('click',()=>lift());
function lift(){if(Kit.state!=='play'||ended||hang>0)return;const got=lifts(N,I);lifted=got;hang=.9;
  heat+=I*I*6*L.hf*(1-Kit.up('cool')*.2);Kit.tone(120+N*I/4,.25,'sawtooth',.06,200+N*I/3);
  if(heat>=100){heat=55;loseLife('🔥 线圈过热烧坏了！电流别开太大');return;}
  if(got===ord.t){const bonus=Math.round(ord.time*10);score+=100+bonus+(ord.t===0?50:0);Kit.sfx('good');if(FX)FX.burst(sparks,180,170,'#ffd34d',18);
    if(boss){boss.hp--;boss.flash=.4;Kit.sfx('hit');score+=150;if(boss.hp<=0){Kit.sfx('boom');score+=Math.round(bossT)*15;hud();return endLv(true);}}
    oi++;if(!boss&&oi>=orders){hud();return endLv(true);}nextOrder();}
  else{Kit.toast(ord.t===0?'要放下全部回形针：电流调到 0！':'吸起 '+got+' 枚，订单要 '+ord.t+' 枚（'+(got>ord.t?'多了':'少了')+'）',1500);loseLife(null);}
  hud();}
function loseLife(msg){miss++;lives--;shake=.35;Kit.sfx('bad');Kit.vibrate(60);if(msg)Kit.toast(msg,1600);hud();if(lives<=0)endLv(false,msg||'失误太多，起重站停工了');}
function nextOrder(){ord=mkOrder();if(ord.lockN)N=ord.lockN;sync();}
function frame(t){const dt=Math.min(.033,(t-last)/1000);last=t;if(Kit.state==='play'&&!ended)for(let k=0;k<fast;k++){if(!ended)update(dt);}draw();raf=requestAnimationFrame(frame);}
function update(dt){heat=Math.max(0,heat-dt*(4+Kit.up('cool')*2));if(hang>0)hang-=dt;if(shake>0)shake-=dt;
  ord.time-=dt;if(ord.time<=0){Kit.toast('⌛ 订单超时',1000);nextOrder();loseLife(null);if(ended)return;if(!boss){oi++;if(oi>=orders&&lives>0)return endLv(true);}}
  if(boss){boss.ph+=dt;boss.x=300+Math.sin(boss.ph*1.3)*22;boss.y=70+Math.sin(boss.ph*2)*14;if(boss.flash>0)boss.flash-=dt;
    bossT-=dt;if(bossT<=0){bossT=0;return endLv(false,'时间到，'+boss.name+'还剩 '+boss.hp+' 血');}
    scT-=dt;if(scT<=0){scT=L.boss.sc;if(!ord.lockN){N=(1+((Math.random()*8)|0))*100;I=Math.min(L.mi,Math.round(Math.random()*L.mi*10)/10);sync();Kit.sfx('boss');Kit.toast('⚡ 磁暴！线圈参数被打乱',900);shake=.3;}}}
  if(Math.random()<.2)hud();}
function hud(){$('lvT').textContent=Kit.lv+1;$('lifeT').textContent=lives;$('score').textContent=score;$('timeT').textContent=Math.ceil(boss?bossT:ord.time);
  $('heatT').textContent='🌡'+Math.round(heat)+'%';
  if(boss){$('goalT').textContent='👑 '+boss.name+' '+boss.hp+'/'+boss.max;$('progI').style.width=(100-boss.hp/boss.max*100)+'%';}
  else{$('goalT').textContent='订单 '+Math.min(oi+1,orders)+'/'+orders;$('progI').style.width=oi/orders*100+'%';}}
function endLv(won,why){ended=true;if(won){const st=miss===0?3:miss===1?2:1;
    setTimeout(()=>Kit.win(st,score,boss?'击退 '+boss.name+'！剩余 '+Math.ceil(bossT)+' 秒':'完成 '+orders+' 张订单，失误 '+miss+' 次<br>三星：0 失误 · 二星：1 失误'),500);}
  else setTimeout(()=>Kit.lose(why,score),400);}
function draw(){const sx=shake>0?(Math.random()-.5)*6:0;ctx.save();ctx.translate(sx,0);
  FX?FX.stage(ctx,W,H,'#1d2a5c','#0a0820'):(ctx.fillStyle='#101030',ctx.fillRect(0,0,W,H));if(!L){ctx.restore();return;}
  const on=hang>0,str=Math.min(1,N*I/1600);
  // 吊臂
  ctx.fillStyle='#3b4470';ctx.fillRect(20,18,320,10);if(FX)FX.tile(ctx,166,26,28,40,'#8892c0',4);else{ctx.fillStyle='#8892c0';ctx.fillRect(166,26,28,40);}
  // 线圈 + 铁芯
  const cx=180,top=70,ch=96,turns=Math.round(N/100)*2;
  if(FX){FX.shadow(ctx,cx,top+ch+60,60,8);FX.tile(ctx,cx-18,top,36,ch,'#8c95a8',6);}else{ctx.fillStyle='#8c95a8';ctx.fillRect(cx-18,top,36,ch);}
  for(let k=0;k<turns;k++){const y=top+6+k*(ch-12)/Math.max(1,turns-1);ctx.strokeStyle=on?'#ffb347':'#c97a2b';ctx.lineWidth=4;ctx.beginPath();ctx.ellipse(cx,y,30,6,0,0,Math.PI);ctx.stroke();}
  // 磁感线
  if(on&&I>0){ctx.globalAlpha=.55;const n=Math.max(1,Math.round(str*7));for(let k=1;k<=n;k++){ctx.strokeStyle=k%2?'#7cf3ff':'#ff7ad9';ctx.lineWidth=1.5;ctx.beginPath();ctx.ellipse(cx,top+ch/2,26+k*14,ch/2+k*10,0,0,7);ctx.stroke();}ctx.globalAlpha=1;
    if(FX){FX.glow(ctx,'#7cf3ff',20);FX.orb(ctx,cx,top+ch+6,8,'#7cf3ff');FX.noGlow(ctx);}}
  // 回形针堆
  for(const c of clips){ctx.strokeStyle='#d7dbea';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(c.x,c.y,7,3,c.r,0,7);ctx.stroke();}
  // 吊起的回形针
  if(on){for(let k=0;k<Math.min(lifted,40);k++){const col=k%8,row=(k/8)|0;const x=cx-28+col*8,y=top+ch+16+row*9-(.9-hang)*4;ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(x,y,4,2.4,.6,0,7);ctx.stroke();}}
  // 订单牌
  const ox=14,oy=40;if(FX)FX.tile(ctx,ox,oy,92,64,ord.t===0?'#5a6280':'#ff5fa2',10);else{ctx.fillStyle='#ff5fa2';ctx.fillRect(ox,oy,92,64);}
  ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='bold 12px sans-serif';ctx.fillText(ord.t===0?'断电放下':'恰好吸起',ox+46,oy+16);ctx.font='bold 26px sans-serif';ctx.fillText(ord.t===0?'0':ord.t,ox+46,oy+42);
  if(ord.lockN){ctx.font='bold 11px sans-serif';ctx.fillStyle='#ffd34d';ctx.fillText('🔒 N='+ord.lockN,ox+46,oy+78);}
  // 订单倒计时环
  ctx.strokeStyle='rgba(255,255,255,.2)';ctx.lineWidth=5;ctx.beginPath();ctx.arc(ox+46,oy+112,14,0,7);ctx.stroke();ctx.strokeStyle=ord.time/ord.max<.3?'#ff4d6d':'#7cf3ff';ctx.beginPath();ctx.arc(ox+46,oy+112,14,-Math.PI/2,-Math.PI/2+6.283*ord.time/ord.max);ctx.stroke();
  // 温度计
  const hx=330,hy=120,hh=150;ctx.fillStyle='rgba(255,255,255,.12)';ctx.fillRect(hx,hy,14,hh);const hc=heat>70?'#ff4d6d':heat>40?'#ffb347':'#5dffb0';ctx.fillStyle=hc;ctx.fillRect(hx,hy+hh*(1-heat/100),14,hh*heat/100);
  ctx.font='14px sans-serif';ctx.fillStyle='#fff';ctx.fillText('🌡',hx+7,hy+hh+14);
  // 小磁针
  const nx=60,ny=230,na=on&&I>0?-Math.PI/2*Math.min(1,str*2):0.3;ctx.save();ctx.translate(nx,ny);ctx.fillStyle='rgba(255,255,255,.12)';ctx.beginPath();ctx.arc(0,0,22,0,7);ctx.fill();ctx.rotate(na);
  ctx.fillStyle='#ff4d6d';ctx.beginPath();ctx.moveTo(0,-18);ctx.lineTo(5,0);ctx.lineTo(-5,0);ctx.fill();ctx.fillStyle='#7cf3ff';ctx.beginPath();ctx.moveTo(0,18);ctx.lineTo(5,0);ctx.lineTo(-5,0);ctx.fill();ctx.restore();
  if(boss){const c=boss.flash>0?'#ffffff':'#b45cff';if(FX){FX.glow(ctx,'#b45cff',18);FX.orb(ctx,boss.x|0,boss.y|0,22,c);FX.noGlow(ctx);}else{ctx.fillStyle=c;ctx.beginPath();ctx.arc(boss.x,boss.y,22,0,7);ctx.fill();}
    ctx.font='22px sans-serif';ctx.fillText('👾',boss.x,boss.y+1);ctx.font='bold 11px sans-serif';ctx.fillStyle='#fff';ctx.fillText('磁暴 '+Math.ceil(scT)+'s',boss.x,boss.y+36);}
  if(FX)FX.drawBurst(ctx,sparks);ctx.restore();}
function layout(){const b=$('box').getBoundingClientRect();const s=Math.min(b.width/W,b.height/H);cv.style.width=Math.floor(W*s)+'px';cv.style.height=Math.floor(H*s)+'px';}
addEventListener('resize',layout);layout();draw();
// 旧版最高纪录（成功次数）合并进最佳纪录
Kit.init({id:'electromagnet',levels:15,boss:[5,10,15],bossName:i=>LV[i].boss.name,start:start,stop:()=>{ended=true;},label:i=>String(i+1),
  note:()=>'订单越来越快；锁定匝数的订单要自己算电流',
  tut:[['电磁铁的秘密','线圈通电就有磁性，磁力 ∝ <b>匝数 N × 电流 I</b>。<br>本站规则：吸起回形针数 = <b>⌊N·I ÷ 40⌋</b>。例如 N=200、I=1.0A → 5 枚。','🧲'],
       ['按订单吸取','左上角订单要<b>恰好</b>吸起几枚，多一枚少一枚都算失误。<br>「断电放下」订单要把电流调到 <b>0</b>——断电磁性消失！','📋'],
       ['小心过热','电流越大发热越多（∝ I²），温度到 100% 线圈烧坏会丢一条命。<br>多用匝数、少用电流更凉快。有些订单 <b>锁定匝数</b>，只能调电流。','🌡'],
       ['磁暴怪','第 5/10/15 关的磁暴怪会定时打乱你的 N 和 I，每完成一单就打它一下。<br>金币可升级散热片、订单时间、备用线圈和读数表。','👾']],
  ups:[{k:'cool',ic:'❄️',name:'散热片',desc:'发热 −20%',max:2,cost:l=>25+l*30},{k:'time',ic:'⏳',name:'从容调度',desc:'每单 +2 秒',max:2,cost:l=>25+l*30},
       {k:'life',ic:'🔧',name:'备用线圈',desc:'每关 +1 命',max:2,cost:l=>40+l*40},{k:'meter',ic:'📟',name:'读数表',desc:'显示预计吸起数',max:1,cost:()=>60,stars:8}]});
window.__T.state=()=>({N,I,ord:ord&&{t:ord.t,lockN:ord.lockN,time:ord.time},mi:L&&L.mi,lives,heat,ended,boss:boss&&{hp:boss.hp},oi,orders});
window.__T.set=(n,i)=>{N=n;I=i;sync();};window.__T.lift=lift;window.__T.lifts=lifts;window.__T.fast=k=>{fast=k;};
</script>
