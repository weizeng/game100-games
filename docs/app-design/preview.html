<body><header class="page-head"><div><h1>游戏100 · App 外壳「霓虹糖果 Pop Arcade」</h1><p>和游戏里的皮肤 B 统一：深紫街机夜色底，糖果色高光图标，金币主按钮，按钮底部有实色“台阶”阴影，按下时下沉。这是设计预览（HTML），尺寸按 390×844dp 手机绘制；图标、按钮、阴影都能用 Android 的 layer-list / GradientDrawable / VectorDrawable 实现。</p></div>

  if(state==='err'){badge='<b class="badge b-err b-br">!</b>';st='下载失败';sc='err';}
  const act={ok:'<button class="btn coin xs">▶ 开玩</button>',new:'<button class="btn cyanb xs">⬇ 下载</button>',dl:'<button class="btn cyanb xs">⬇ 下载</button>',ing:'<button class="btn xs prog"><i class="fill" style="width:42%"></i><span>42%</span></button>',up:'<button class="btn pinkb xs">⬆ 更新</button>',err:'<button class="btn dangerb xs">↻ 重试</button>'}[state];
  return `<div class="card">${tile(g,'',badge)}<div class="nm">${g.name}</div><div class="st ${sc}">${st}</div>${act}</div>`;
}

 document.querySelectorAll('.switch button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===(window.LOGO||'block')))}
