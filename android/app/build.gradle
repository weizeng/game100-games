plugins {
    id("com.android.application")
    id("org.jetbrains.kotlin.android")
}

// ---------------------------------------------------------------------------
// 版本号：所有渠道共用同一个 versionCode / versionName。
// 发版时可用 -Pgame100.versionCode=23 -Pgame100.versionName=4.6 覆盖，
// 或设置环境变量 GAME100_VERSIONCODE / GAME100_VERSIONNAME。规则见 docs/ANDROID-BUILD-FOR-MUSE.md
// ---------------------------------------------------------------------------
def readProp = { String name ->
    project.findProperty(name)?.toString() ?: System.getenv(name.toUpperCase().replace('.', '_'))
}
def appVersionCode = (readProp("game100.versionCode") ?: "32").toInteger()
def appVersionName = readProp("game100.versionName") ?: "4.15"

// 签名：只从 release.properties（不入库）/ -P 参数 / 环境变量读取，绝不写死在仓库里。
// 缺少任一项时 release 包不签名（可由 muse 或 apksigner/jarsigner 事后签名），不会让同步失败。
def releaseProps = new Properties()
def releasePropFile = rootProject.file("release.properties")
if (releasePropFile.exists()) { releasePropFile.withInputStream { releaseProps.load(it) } }
def signProp = { String name -> releaseProps.getProperty(name) ?: readProp(name) }
def hasReleaseSigning = ["game100.release.storeFile", "game100.release.storePassword",
                         "game100.release.keyAlias", "game100.release.keyPassword"].every { signProp(it) }

def bundledGamesDirPath = "${project.layout.buildDirectory.get().asFile}/generated/bundledGames/bundled"

android {
    namespace = "com.game100.center"
    compileSdk = 36

    defaultConfig {
        applicationId = "com.game100.center"
        minSdk = 26
        targetSdk = 36
        versionCode = appVersionCode
        versionName = appVersionName
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile = file(signProp("game100.release.storeFile"))
                storePassword = signProp("game100.release.storePassword")
                keyAlias = signProp("game100.release.keyAlias")
                keyPassword = signProp("game100.release.keyPassword")
            }
        }
    }

    // 三个发布渠道，见 docs/ANDROID-BUILD-FOR-MUSE.md
    flavorDimensions = ["store"]
    productFlavors {
        // Google Play：不自更新（无 REQUEST_INSTALL_PACKAGES / 无 APK 下载安装），由 Play 负责升级；
        // HTML 游戏仍可从 CDN 下载（WebView 中运行的 JS，属 Play 政策允许范围）
        play {
            dimension = "store"
            buildConfigField("boolean", "SELF_UPDATE", "false")
            buildConfigField("boolean", "ONLINE_CATALOG", "true")
            buildConfigField("String", "STORE_CHANNEL", "\"play\"")
        }
        // 国内应用商店：完全离线（构建时把 games/ 全部打进 APK，无 INTERNET 权限，不自更新）
        cn {
            dimension = "store"
            buildConfigField("boolean", "SELF_UPDATE", "false")
            buildConfigField("boolean", "ONLINE_CATALOG", "false")
            buildConfigField("String", "STORE_CHANNEL", "\"cn\"")
        }
        // 官网/GitHub 直装：保持现有行为（在线游戏库 + App 自升级）
        direct {
            dimension = "store"
            buildConfigField("boolean", "SELF_UPDATE", "true")
            buildConfigField("boolean", "ONLINE_CATALOG", "true")
            buildConfigField("String", "STORE_CHANNEL", "\"direct\"")
        }
    }

    sourceSets {
        // play 与 cn 共用"无自更新"实现；direct 用 src/direct 下的完整自升级实现
        play.java.srcDirs += "src/noSelfUpdate/java"
        cn.java.srcDirs += "src/noSelfUpdate/java"
        // 所有渠道：内置游戏在构建时由 ../games 现打（见下方 zipBundledGames 任务），
        // 不再提交 src/main/assets/bundled，避免内置游戏过期
        main.assets.srcDirs += "${layout.buildDirectory.get().asFile}/generated/bundledGames"
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig = signingConfigs.getByName("release")
            }
            minifyEnabled = false
            debuggable = false
        }
        debug {
            applicationIdSuffix = ".debug"
        }
    }
    buildFeatures {
        buildConfig = true
    }
    testOptions {
        // Robolectric 测试（direct 渠道 FileProvider）需要合并后的 Manifest 和资源
        unitTests.includeAndroidResources = true
        unitTests.all {
            // 让单元测试能找到构建时生成的内置游戏和仓库 games/
            systemProperty "game100.bundledDir", bundledGamesDirPath
            systemProperty "game100.gamesDir", rootProject.file("../games").absolutePath
        }
    }
    lint {
        checkReleaseBuilds = false
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
}

if (!hasReleaseSigning) {
    logger.lifecycle("[game100] 未配置 release 签名（game100.release.*），release 产物将不签名，需要事后签名。")
}

// ---------------------------------------------------------------------------
// 内置游戏（所有渠道）：构建时把仓库 games/<id>/ 全部打成 assets/bundled/<id>.zip
// （与 publish.yml 的 zip 结构一致：根目录直接是 index.html / meta.json 等文件）。
// App 启动时 GameRepository.ensureBundledGames() 读取 zip 内 meta.json 的 version，
// 比已安装版本新才解压，因此内置版本永远等于 games/*/meta.json，不会过期。
// cn 渠道因此完全离线可玩；play/direct 首次安装也能离线玩全部游戏。
// ---------------------------------------------------------------------------
def gamesSrcDir = rootProject.file("../games")
def bundledOut = layout.buildDirectory.dir("generated/bundledGames/bundled")
def zipBundledGames = tasks.register("zipBundledGames") {
    description = "把 ../games 下所有游戏打包为内置 assets（所有渠道），并写入首页推荐位"
    inputs.dir(gamesSrcDir).optional()
    inputs.file(rootProject.file("../scripts/featured-ranks.py")).optional()
    outputs.dir(bundledOut)
    doLast {
        def out = bundledOut.get().asFile
        project.delete(out)
        out.mkdirs()
        // 与 publish 脚本同一套「最近改动 N 款」规则，cn 离线也能看到精选推荐
        def ranks = [:]
        def ranksScript = rootProject.file("../scripts/featured-ranks.py")
        if (ranksScript.exists()) {
            def proc = ["python3", ranksScript.absolutePath, rootProject.file("..").absolutePath].execute()
            proc.waitFor()
            if (proc.exitValue() == 0) {
                def parsed = new groovy.json.JsonSlurper().parseText(proc.text)
                parsed.each { k, v -> ranks[k.toString()] = (v as int) }
            } else {
                logger.warn("[game100] featured-ranks.py 失败，内置包不写推荐位：${proc.err.text}")
            }
        }
        int n = 0
        int featuredN = 0
        (gamesSrcDir.listFiles() ?: new File[0]).sort { it.name }.each { File g ->
            if (!g.isDirectory()) return
            if (!new File(g, "index.html").exists() || !new File(g, "meta.json").exists()) return
            def rank = ranks[g.name]
            new File(out, "${g.name}.zip").withOutputStream { os ->
                def zos = new java.util.zip.ZipOutputStream(os)
                def files = []
                g.eachFileRecurse(groovy.io.FileType.FILES) { File f -> if (!f.name.startsWith(".")) files << f }
                files.sort { g.toPath().relativize(it.toPath()).toString() }.each { File f ->
                    def rel = g.toPath().relativize(f.toPath()).toString().replace('\\', '/')
                    def e = new java.util.zip.ZipEntry(rel)
                    e.setTime(0L)
                    zos.putNextEntry(e)
                    if (rel == "meta.json") {
                        def meta = new HashMap(new groovy.json.JsonSlurper().parse(f) as Map)
                        meta.remove("premium"); meta.remove("featured")
                        if (rank != null) {
                            meta.premium = true
                            meta.featured = rank
                            featuredN++
                        }
                        def body = new groovy.json.JsonBuilder(meta).toPrettyString() + "\n"
                        zos.write(body.getBytes("UTF-8"))
                    } else {
                        f.withInputStream { zos << it }
                    }
                    zos.closeEntry()
                }
                zos.close()
            }
            n++
        }
        if (n == 0) throw new GradleException("没有找到任何游戏（期望目录：${gamesSrcDir}）。请在完整仓库里构建。")
        logger.lifecycle("[game100] 内置游戏：${n} 款（推荐位 ${featuredN}）")
    }
}
tasks.configureEach { t ->
    if (t.name != "zipBundledGames" &&
        (t.name ==~ /(merge|generate|package)\w*Assets/ || t.name ==~ /lint\w*/ || t.name ==~ /test\w*UnitTest/)) {
        t.dependsOn(zipBundledGames)
    }
}

dependencies {
    implementation("androidx.appcompat:appcompat:1.7.0")
    implementation("com.google.android.material:material:1.12.0")
    implementation("androidx.recyclerview:recyclerview:1.3.2")
    implementation("androidx.swiperefreshlayout:swiperefreshlayout:1.1.0")
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")

    // JVM 单元测试（下载重试/线路切换、内置游戏包读取）；org.json 替代 Android 桩实现
    testImplementation("junit:junit:4.13.2")
    testImplementation("org.json:json:20240303")
    // Robolectric：direct 渠道真实跑 FileProvider.getUriForFile；所有渠道跑首页出品方筛选等界面回归测试
    testImplementation("org.robolectric:robolectric:4.14.1")
    testImplementation("androidx.test:core:1.6.1")
}
