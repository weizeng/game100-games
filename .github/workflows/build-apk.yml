name: 构建 App APK（release）
# 手动运行：编译 cn / direct / play 三渠道 release APK（正式签名）、
# 写入 releases/、打 GitHub Release tag、更新 app.json（direct 自升级用）。
# Play AAB / 商店上架仍见 publish-stores.yml。
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 Android SDK 组件
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: 还原 release 签名密钥
        run: |
          base64 -d android-release.keystore.b64 > /tmp/release.keystore
          echo "keystore 已还原"

      - name: 编译 cn / direct / play release APK
        env:
          GAME100_RELEASE_STOREFILE: /tmp/release.keystore
          GAME100_RELEASE_STOREPASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          GAME100_RELEASE_KEYALIAS: game100
          GAME100_RELEASE_KEYPASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleCnRelease assembleDirectRelease assemblePlayRelease -x lint

      - name: 发布 APK、更新 app.json、打 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          mkdir -p releases
          rm -f releases/*.apk

          declare -A OUT
          OUT[cn]=android/app/build/outputs/apk/cn/release
          OUT[direct]=android/app/build/outputs/apk/direct/release
          OUT[play]=android/app/build/outputs/apk/play/release

          VC=""; VN=""
          for ch in cn direct play; do
            APK="$(ls "${OUT[$ch]}"/*.apk | head -1)"
            this_vc="$("$AAPT" dump badging "$APK" | grep -oP "versionCode='\K[0-9]+")"
            this_vn="$("$AAPT" dump badging "$APK" | grep -oP "versionName='\K[^']+")"
            echo "$ch: versionCode=$this_vc versionName=$this_vn file=$APK"
            if [ -z "$VC" ]; then VC="$this_vc"; VN="$this_vn"; fi
            if [ "$this_vc" != "$VC" ] || [ "$this_vn" != "$VN" ]; then
              echo "version mismatch across flavors" >&2; exit 1
            fi
            cp "$APK" "releases/game100-${ch}-${VN}.apk"
          done
          # direct 自升级历史文件名兼容
          cp "releases/game100-direct-${VN}.apk" "releases/game100-v${VN}-release.apk"

          N_GAMES="$(find games -mindepth 1 -maxdepth 1 -type d | wc -l)"
          CHANGELOG=$(cat <<CHG
v${VN}: 修复「更新不到新游戏 / 飞刀入木仍是旧版」——仓库已超 jsDelivr 50MB 限制，cdn@main 常卡住旧 manifest；本版默认游戏源改走 GitHub raw，推荐位按 featured 最新在前。cn 离线包重新内置全部 ${N_GAMES} 款（含飞刀入木 v2、今日 bugfix 与新增）。覆盖安装即可，进度保留。
CHG
)

          # apkUrl：GitHub Release 直链（不经 jsDelivr）
          APK_REL="game100-direct-${VN}.apk"
          APK_URL="https://github.com/weizeng/game100-games/releases/download/v${VN}/${APK_REL}"
          python3 -c '
import json, sys, datetime
vc, vn, apk_url, changelog = sys.argv[1], sys.argv[2], sys.argv[3], sys.argv[4]
info = {
  "versionCode": int(vc),
  "versionName": vn,
  "apkUrl": apk_url,
  "changelog": changelog,
  "updated": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
}
json.dump(info, open("app.json", "w", encoding="utf-8"), ensure_ascii=False, indent=1)
print(json.dumps(info, ensure_ascii=False, indent=2))
' "$VC" "$VN" "$APK_URL" "$CHANGELOG"

          git config user.name "game100-bot"
          git config user.email "game100-bot@users.noreply.github.com"
          git fetch origin main && git rebase origin/main || { git rebase --abort || true; git pull --rebase origin main; }
          git add releases app.json
          if ! git diff --cached --quiet; then
            git commit -m "发布 App v${VN}（cn/direct/play）[skip ci]"
            git push
          else
            echo "releases/app.json 无变化"
          fi

          # 打/更新 GitHub Release
          TAG="v${VN}"
          NOTES=$(cat <<NOTES
## 游戏100 ${VN}（versionCode ${VC}）

${CHANGELOG}

### 下载
- **国内包（cn）**：\`game100-cn-${VN}.apk\` ← 离线保底 + 联网下拉刷新拉新游戏（不自更新 APK）
- **官网直装（direct）**：\`game100-direct-${VN}.apk\`（可自升级）
- **Play/TapTap 用（play）**：\`game100-play-${VN}.apk\`

覆盖安装即可，本地进度保留。
NOTES
)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" releases/game100-cn-${VN}.apk releases/game100-direct-${VN}.apk releases/game100-play-${VN}.apk releases/game100-v${VN}-release.apk --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" \
              releases/game100-cn-${VN}.apk \
              releases/game100-direct-${VN}.apk \
              releases/game100-play-${VN}.apk \
              releases/game100-v${VN}-release.apk \
              --title "游戏100 ${VN}" \
              --notes "$NOTES"
          fi
