<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>月海旅人</title></head><body>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:'Microsoft YaHei',sans-serif;color:#272333;background:#c9a9c8}.hidden{display:none!important}html.game-ui body>.wrap,.wrap{position:fixed;inset:0;max-width:none;padding:0;margin:0;display:block}html.game-ui #cv,#cv{position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:0;box-shadow:none;touch-action:none}html.game-ui .topbar,.topbar{position:absolute;z-index:2;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;align-items:center;gap:12px;background:#f8e6ceeb!important;border:1px solid #332f39!important;border-radius:3px!important;box-shadow:none!important;padding:8px 12px;min-height:60px;font-size:12px}.brand{margin-right:auto}.brand strong{display:block;font-size:19px}.brand small{font-size:10px;letter-spacing:3px}.topbar button{min-width:44px;min-height:44px;border:1px solid #554453;background:#eee0da;color:#292332;border-radius:3px}.readout{position:absolute;top:94px;left:20px;z-index:2;font-size:12px;color:#302333;background:#f8e6cee6;padding:8px 12px;line-height:1.8;pointer-events:none}.caption{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);text-align:center;font-size:12px;background:#f8e6cee6;padding:10px 16px;white-space:nowrap;pointer-events:none}.overlay{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:#49344d44}html.game-ui .overlay:has(>.ui-panel){background:#49344d44;backdrop-filter:blur(3px)}html.game-ui .ui-panel{background:#f7e6d0;border:1px solid #342b36;border-radius:4px;box-shadow:8px 8px 0 #49344d44;gap:16px}html.game-ui .ui-panel h1{font-family:Georgia,'SimSun',serif;color:#322736;font-size:38px;text-shadow:none}html.game-ui .ui-panel p{color:#50414b}html.game-ui button.btn{background:#edb866;color:#342719;border-radius:3px;border:1px solid #342719;box-shadow:0 3px 0 #8c6847;text-shadow:none}html.game-ui .ui-emblem{display:none}.controls{position:absolute;bottom:max(26px,env(safe-area-inset-bottom));left:20px;right:20px;z-index:3;display:flex;align-items:end;justify-content:space-between;pointer-events:none}#stick{width:114px;height:114px;border:1px solid #342b36;border-radius:50%;background:#f7e6d08c;position:relative;touch-action:none;pointer-events:auto}#nub{position:absolute;left:34px;top:34px;width:44px;height:44px;border-radius:50%;border:1px solid #342b36;background:#f7e6d0;pointer-events:none}#rideBtn{min-height:52px;padding:12px 18px;background:#f7e6d0;color:#342719;border:1px solid #342719;border-radius:3px;pointer-events:auto}.controls small{display:block;text-align:center;margin-bottom:10px;color:#302333;background:#f7e6d0b0;padding:3px}.overlay button{min-height:44px;min-width:80px}.overlay h1,.overlay p{max-width:320px}.overlay:not(:has(.ui-panel)){flex-direction:column;padding:24px;background:#f7e6d0f2;gap:18px}@media(max-width:600px){.brand small{display:none}.topbar{gap:7px!important}.brand strong{font-size:16px}.caption{bottom:154px;font-size:11px;padding:7px}.readout{top:92px}.topbar .best-label{display:none}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
html.game-ui[data-skin="b"] body>.wrap>canvas#cv{outline:0!important;border-radius:0!important;box-shadow:none!important}html.game-ui[data-skin="b"] body .wrap .topbar{background:#f8e6ceeb!important;border:1px solid #332f39!important;border-radius:3px!important;box-shadow:none!important}html.game-ui[data-skin="b"] body .ui-panel{background:#f7e6d0;border-radius:4px;border:1px solid #342b36;box-shadow:8px 8px 0 #49344d44}html.game-ui[data-skin="b"] body .ui-panel h1{color:#322736;text-shadow:none}html.game-ui[data-skin="b"] body .ui-panel button.btn{background:#edb866;color:#342719;border-radius:3px;box-shadow:0 3px 0 #8c6847;text-shadow:none}</style>
<div class="wrap"><canvas id="cv"></canvas><div class="topbar"><div class="brand"><strong>月海旅人</strong><small>THE QUIET EXPANSE</small></div><span>信标 <b id="score">0</b>/3<br><span class="best-label">最佳 </span><span id="best">—</span></span><button id="muteBtn" aria-label="切换声音">音效</button><button id="pauseBtn">暂停</button></div><div class="readout" id="status">步行探索<br>寻找远方的青色信标</div><div class="caption" id="hint">WASD 移动 · 拖动画面转向 · E 召唤座驾</div><div class="controls"><div><small>移动</small><div id="stick" aria-label="移动摇杆"><div id="nub"></div></div></div><button id="rideBtn">E · 召唤座驾</button></div>
<div class="overlay" id="startScr"><h1>月海旅人</h1><p>在巨月下，穿过沙丘与失落的拱门。寻找三枚青色信标，留下你的旅行记录。</p><p>WASD / 左侧摇杆移动<br>拖动画面环顾 · E / 右侧按钮切换座驾</p><button class="btn" id="startBtn">走进月海</button></div>
<div class="overlay hidden" id="pauseScr"><h1>风还在等你</h1><p>旅程已暂停</p><button class="btn" id="resumeBtn">继续探索</button><button class="btn" id="restartBtn">重新出发</button></div>
<div class="overlay hidden" id="endScr"><h1>信号已抵达</h1><p id="result"></p><button class="btn" id="continueBtn">继续漫游</button><button class="btn" id="againBtn">再来一局</button></div></div><script type="module" src="/src/main.js"></script></body></html>
