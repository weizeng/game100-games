<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>御空守夜</title></head><body><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:'Microsoft YaHei',sans-serif}.hidden{display:none!important}html.game-ui body>.wrap{position:fixed;inset:0;max-width:none;padding:0;display:block}html.game-ui[data-skin="b"] body>.wrap>canvas#cv{position:absolute;inset:0;width:100%;height:100%;outline:0;border:0;border-radius:0;box-shadow:none;touch-action:none}.topbar{position:absolute;z-index:2;top:8px;left:8px;right:8px;display:flex;align-items:center;justify-content:space-between;font-size:12px;padding:7px!important}.topbar button{min-width:44px;min-height:44px}.topbar strong{font-size:16px}.topbar small{display:block}.hud{position:absolute;top:88px;left:12px;right:12px;pointer-events:none;color:#202a39;font-size:12px}.panel{background:#fff2dbed;padding:8px 10px;border:1px solid #545764;border-radius:4px;margin-bottom:6px}.bar{height:5px;background:#524759;margin:5px 0}.bar i{display:block;height:100%;background:#79bbad;width:100%}#bossPanel{background:#422e49ec;color:#fff3d8}#bossPanel .bar i{background:#ec9a77}#notice{position:absolute;bottom:176px;left:12px;right:12px;text-align:center;pointer-events:none;font-size:12px;color:#fff;background:#302f49cc;padding:6px}.controls{position:absolute;bottom:max(18px,env(safe-area-inset-bottom));left:14px;right:14px;z-index:3;display:flex;justify-content:space-between;align-items:end;pointer-events:none}.controls button{min-height:46px;min-width:48px;padding:8px;background:#fff0d6;color:#252d3b;border:1px solid #4a5264;border-radius:8px;pointer-events:auto;touch-action:none}.actions{display:grid;grid-template-columns:repeat(2,62px);gap:7px}#stick{position:relative;width:112px;height:112px;border-radius:50%;border:2px solid #fff4d6;background:#34384c55;touch-action:none;pointer-events:auto}#nub{position:absolute;left:34px;top:34px;width:40px;height:40px;border-radius:50%;background:#fff0d6;pointer-events:none}.overlay{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#27344a88;padding:18px}.overlay:not(:has(.ui-panel)){background:#fff0dc;gap:16px}.overlay button{min-height:46px;min-width:100px}.mode{display:flex;gap:8px}.mode button{font-size:13px;background:#d8e5df;color:#243244;border:1px solid #5a686c;border-radius:6px}.mode button[aria-pressed=true]{background:#efc182;outline:2px solid #4d5367}.overlay p{line-height:1.7;max-width:320px}html.game-ui .ui-emblem{display:none}html.game-ui .ui-panel{gap:12px;padding:20px}html.game-ui .ui-panel h1{font-size:30px}@media(max-height:700px){.hud{top:78px}.panel{padding:5px 8px}html.game-ui .ui-panel{padding:14px;gap:8px}html.game-ui .ui-panel p{font-size:12px}#notice{bottom:169px}}
</style><div class="wrap"><canvas id="cv"></canvas><div class="topbar"><div><strong>御空守夜</strong><small id="phase">第 1 天 · 日出</small></div><div>积分 <b id="score">0</b><small id="best">最佳 0</small></div><button id="muteBtn">音效</button><button id="pauseBtn">暂停</button></div><div class="hud"><div class="panel"><span id="vitals">生命 100 · 灵核 150</span><div class="bar"><i id="hpBar"></i></div><span id="quest">日出任务：收集 3 枚晨曦灵晶</span><br><span id="flightInfo">步行 · 自动锁敌攻击</span></div><div class="panel hidden" id="bossPanel"><span id="bossLabel">蚀日巨灵</span><div class="bar"><i id="bossBar"></i></div></div></div><div id="notice">靠近灵晶收集 · E 起飞 · Space 上升 · Q 下降 · F 灵爆</div><div class="controls"><div id="stick"><div id="nub"></div></div><div class="actions"><button id="upBtn">升空 ↑</button><button id="downBtn">下降 ↓</button><button id="flyBtn">起飞 E</button><button id="boatBtn">灵舟 R</button><button id="pulseBtn">灵爆 F</button></div></div><div class="overlay" id="startScr"><h1>御空守夜</h1><p>御翼穿越月海，守住最后的灵核。日出采集灵晶，日落抵御来袭，夜晚迎战蚀日巨灵。</p><div class="mode"><button data-mode="journey" aria-pressed="true">一日远征</button><button data-mode="endless" aria-pressed="false">无尽生存</button></div><p>WASD / 摇杆移动，拖动画面转向<br>E 起飞/降落，Space 上升，Q 下降<br>R 灵舟：南岸码头登船，靠岸下船<br>自动攻击附近敌人 · F 释放范围灵爆</p><button class="btn" id="startBtn">展开羽翼</button></div><div class="overlay hidden" id="pauseScr"><h1>暂歇云端</h1><p>时间与战斗已暂停</p><button class="btn" id="resumeBtn">继续</button><button class="btn" id="restartBtn">重新开始</button></div><div class="overlay hidden" id="endScr"><h1 id="endTitle">旅程结束</h1><p id="result"></p><button class="btn" id="againBtn">再来一局</button><button class="btn" id="menuBtn">选择模式</button></div></div><script type="module" src="/src/main.js"></script></body></html>
